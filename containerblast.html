<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Container Blast — Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{background:#0f172a;font-family:'Inter',sans-serif;min-height:100dvh;display:flex;flex-direction:column;align-items:center;overflow:hidden}

/* HEADER */
.hdr{width:100%;max-width:420px;display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 16px 12px;flex-shrink:0}
.hdr-back{background:rgba(255,255,255,0.08);border:none;border-radius:10px;color:white;font-size:18px;width:38px;height:38px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.hdr-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;color:white}
.hdr-money{font-family:'Bebas Neue',sans-serif;font-size:18px;color:#fbbf24;background:rgba(251,191,36,0.12);border:1px solid rgba(251,191,36,0.25);padding:5px 12px;border-radius:20px}

/* SCORE */
.stats{display:flex;gap:10px;margin-bottom:10px;width:100%;max-width:420px;padding:0 12px}
.stat{flex:1;background:rgba(255,255,255,0.05);border-radius:10px;padding:8px;text-align:center;border:1px solid rgba(255,255,255,0.08)}
.stat-v{font-family:'Bebas Neue',sans-serif;font-size:22px;color:white;line-height:1}
.stat-l{font-size:8px;font-weight:700;color:rgba(255,255,255,0.3);letter-spacing:1px;margin-top:2px}

/* GRILLE */
.grid-wrap{position:relative;flex-shrink:0}
canvas{display:block;border-radius:12px;touch-action:none}

/* PIÈCES */
.pieces-wrap{display:flex;gap:10px;justify-content:center;align-items:flex-end;padding:10px 12px;width:100%;max-width:420px;flex-shrink:0}
.piece-slot{flex:1;max-width:110px;min-height:80px;background:rgba(255,255,255,0.04);border:1.5px solid rgba(255,255,255,0.08);border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:grab;transition:all .15s}
.piece-slot.selected{border-color:#fbbf24;background:rgba(251,191,36,0.08);box-shadow:0 0 16px rgba(251,191,36,0.2)}
.piece-slot.used{opacity:0.2}
canvas.piece-cv{display:block}

/* GAME OVER */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100;display:flex;align-items:center;justify-content:center;display:none}
.overlay.show{display:flex}
.over-box{background:#0f172a;border:3px solid #fbbf24;border-radius:20px;padding:28px 24px;text-align:center;max-width:300px;width:90%;box-shadow:4px 4px 0 rgba(251,191,36,0.3)}
.over-title{font-family:'Bebas Neue',sans-serif;font-size:36px;color:#fbbf24;letter-spacing:3px}
.over-score{font-family:'Bebas Neue',sans-serif;font-size:28px;color:white;margin:8px 0 4px}
.over-gain{font-size:14px;font-weight:700;color:#4ade80;margin-bottom:18px}
.over-btn{width:100%;padding:13px;border:none;border-radius:12px;background:#fbbf24;color:#0f172a;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;cursor:pointer;margin-bottom:8px}
.over-btn2{width:100%;padding:11px;border:2px solid rgba(255,255,255,0.2);border-radius:12px;background:transparent;color:rgba(255,255,255,0.6);font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:2px;cursor:pointer}

/* LIGNE EFFACÉE */
@keyframes clearFlash{0%,100%{opacity:1}50%{opacity:0.2}}
.flash{animation:clearFlash .3s ease}
</style>
</head>
<body>

<div class="hdr">
  <button class="hdr-back" onclick="window.location.href='commerce.html'">←</button>
  <div class="hdr-title">📦 CONTAINER BLAST</div>
  <div class="hdr-money" id="moneyDisplay">—</div>
</div>

<div class="stats">
  <div class="stat"><div class="stat-v" id="scoreDisp">0</div><div class="stat-l">SCORE</div></div>
  <div class="stat"><div class="stat-v" id="bestDisp">0</div><div class="stat-l">MEILLEUR</div></div>
  <div class="stat"><div class="stat-v" id="earnDisp">+0€</div><div class="stat-l">GAGNÉ</div></div>
</div>

<div class="grid-wrap">
  <canvas id="grid"></canvas>
</div>

<div class="pieces-wrap" id="piecesWrap">
  <div class="piece-slot" id="slot0"><canvas class="piece-cv" id="pv0"></canvas></div>
  <div class="piece-slot" id="slot1"><canvas class="piece-cv" id="pv1"></canvas></div>
  <div class="piece-slot" id="slot2"><canvas class="piece-cv" id="pv2"></canvas></div>
</div>

<div class="overlay" id="overlay">
  <div class="over-box">
    <div class="over-title">PARTIE TERMINÉE</div>
    <div class="over-score" id="overScore">0 pts</div>
    <div class="over-gain" id="overGain">+0€ gagnés</div>
    <button class="over-btn" onclick="startGame()">🔄 REJOUER</button>
    <button class="over-btn2" onclick="window.location.href='commerce.html'">← RETOUR</button>
  </div>
</div>

<script>
const sb = supabase.createClient(
  'https://drtsuhnbclhmgfjiykap.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg'
);

// ── CONSTANTES ──
const COLS = 8, ROWS = 8;
const CELL = Math.min(Math.floor((Math.min(window.innerWidth, 420) - 24) / COLS), 46);
const GAP = 2;
const W = COLS * (CELL + GAP) - GAP;
const H = ROWS * (CELL + GAP) - GAP;

// Couleurs conteneurs maritimes réalistes
const COLORS = {
  red:    { fill:'#dc2626', stripe:'#b91c1c', top:'#fca5a5' },
  blue:   { fill:'#1d4ed8', stripe:'#1e40af', top:'#93c5fd' },
  yellow: { fill:'#ca8a04', stripe:'#a16207', top:'#fde68a' },
  green:  { fill:'#15803d', stripe:'#166534', top:'#86efac' },
  orange: { fill:'#ea580c', stripe:'#c2410c', top:'#fdba74' },
  teal:   { fill:'#0f766e', stripe:'#0d9488', top:'#5eead4' },
};
const COLOR_KEYS = Object.keys(COLORS);

// Formes des pièces (tableaux de [row,col])
const SHAPES = [
  // 1×1
  [[0,0]],
  // 1×2
  [[0,0],[0,1]],
  // 2×1
  [[0,0],[1,0]],
  // 1×3
  [[0,0],[0,1],[0,2]],
  // 3×1
  [[0,0],[1,0],[2,0]],
  // 2×2
  [[0,0],[0,1],[1,0],[1,1]],
  // L
  [[0,0],[1,0],[2,0],[2,1]],
  // J
  [[0,1],[1,1],[2,0],[2,1]],
  // T
  [[0,0],[0,1],[0,2],[1,1]],
  // S
  [[0,1],[0,2],[1,0],[1,1]],
  // Z
  [[0,0],[0,1],[1,1],[1,2]],
  // 1×4
  [[0,0],[0,1],[0,2],[0,3]],
  // 4×1
  [[0,0],[1,0],[2,0],[3,0]],
  // 2×3
  [[0,0],[0,1],[0,2],[1,0],[1,1],[1,2]],
  // 3×2
  [[0,0],[0,1],[1,0],[1,1],[2,0],[2,1]],
];

// ── ÉTAT ──
let grid = [], pieces = [], selectedPiece = -1;
let score = 0, bestScore = 0, earned = 0;
let currentUser = null, money = 0;
let ghostPos = null;

// ── CANVAS GRILLE ──
const gc = document.getElementById('grid');
gc.width = W; gc.height = H;
const ctx = gc.getContext('2d');

// ── DESSIN ──
function drawContainer(ctx, x, y, w, h, color, alpha) {
  const c = COLORS[color];
  ctx.globalAlpha = alpha || 1;
  // Corps
  ctx.fillStyle = c.fill;
  ctx.beginPath;
  roundRect(ctx, x+1, y+1, w-2, h-2, 4);
  ctx.fill();
  // Reflet haut
  ctx.fillStyle = c.top;
  ctx.globalAlpha = (alpha||1) * 0.35;
  roundRect(ctx, x+2, y+2, w-4, Math.floor(h*0.3), 3);
  ctx.fill();
  // Lignes verticales (style conteneur)
  ctx.strokeStyle = c.stripe;
  ctx.lineWidth = 1;
  ctx.globalAlpha = (alpha||1) * 0.5;
  for (let i = 1; i <= 2; i++) {
    const lx = x + Math.floor(w * i / 3);
    ctx.beginPath(); ctx.moveTo(lx, y+2); ctx.lineTo(lx, y+h-2); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y); ctx.arcTo(x+w, y, x+w, y+r, r);
  ctx.lineTo(x+w, y+h-r); ctx.arcTo(x+w, y+h, x+w-r, y+h, r);
  ctx.lineTo(x+r, y+h); ctx.arcTo(x, y+h, x, y+h-r, r);
  ctx.lineTo(x, y+r); ctx.arcTo(x, y, x+r, y, r);
  ctx.closePath();
}

function drawGrid() {
  ctx.clearRect(0, 0, W, H);
  // Fond cellules
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const x = c * (CELL + GAP), y = r * (CELL + GAP);
      ctx.fillStyle = 'rgba(255,255,255,0.04)';
      roundRect(ctx, x, y, CELL, CELL, 5);
      ctx.fill();
    }
  }
  // Cellules remplies
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (grid[r][c]) {
        const x = c * (CELL + GAP), y = r * (CELL + GAP);
        drawContainer(ctx, x, y, CELL, CELL, grid[r][c]);
      }
    }
  }
  // Ghost
  if (ghostPos && selectedPiece >= 0 && pieces[selectedPiece]) {
    const p = pieces[selectedPiece];
    p.shape.forEach(([dr, dc]) => {
      const r = ghostPos.r + dr, c = ghostPos.c + dc;
      if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
        const x = c * (CELL + GAP), y = r * (CELL + GAP);
        drawContainer(ctx, x, y, CELL, CELL, p.color, 0.4);
      }
    });
  }
}

function drawPiece(idx) {
  const p = pieces[idx];
  const cv = document.getElementById('pv' + idx);
  const slot = document.getElementById('slot' + idx);
  if (!p) {
    slot.classList.add('used');
    cv.width = 0; cv.height = 0;
    return;
  }
  slot.classList.remove('used');
  const maxR = Math.max(...p.shape.map(([r])=>r)) + 1;
  const maxC = Math.max(...p.shape.map(([,c])=>c)) + 1;
  const cs = Math.min(28, Math.floor(90 / Math.max(maxR, maxC)));
  cv.width = maxC * (cs + 1); cv.height = maxR * (cs + 1);
  const c2 = cv.getContext('2d');
  c2.clearRect(0,0,cv.width,cv.height);
  p.shape.forEach(([dr,dc]) => {
    drawContainer(c2, dc*(cs+1), dr*(cs+1), cs, cs, p.color);
  });
}

// ── LOGIQUE ──
function initGrid() { grid = Array.from({length:ROWS}, () => Array(COLS).fill(null)); }

function randomPiece() {
  const shape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
  const color = COLOR_KEYS[Math.floor(Math.random() * COLOR_KEYS.length)];
  return { shape, color };
}

function spawnPieces() {
  pieces = [randomPiece(), randomPiece(), randomPiece()];
  pieces.forEach((_, i) => drawPiece(i));
}

function canPlace(shape, r, c) {
  return shape.every(([dr, dc]) => {
    const nr = r + dr, nc = c + dc;
    return nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && !grid[nr][nc];
  });
}

function placePiece(idx, r, c) {
  const p = pieces[idx];
  if (!p || !canPlace(p.shape, r, c)) return false;
  p.shape.forEach(([dr, dc]) => { grid[r+dr][c+dc] = p.color; });
  pieces[idx] = null;
  drawPiece(idx);
  clearLines();
  // Respawn si toutes placées
  if (pieces.every(p => p === null)) spawnPieces();
  checkGameOver();
  return true;
}

function clearLines() {
  let cleared = 0;
  const toFlash = new Set();
  // Lignes complètes
  for (let r = 0; r < ROWS; r++) {
    if (grid[r].every(c => c !== null)) {
      for (let c = 0; c < COLS; c++) toFlash.add(r * COLS + c);
      cleared++;
    }
  }
  // Colonnes complètes
  for (let c = 0; c < COLS; c++) {
    if (grid.every(row => row[c] !== null)) {
      for (let r = 0; r < ROWS; r++) toFlash.add(r * COLS + c);
      cleared++;
    }
  }
  if (cleared === 0) { drawGrid(); return; }

  // Flash puis effacer
  const flashCells = [...toFlash].map(i => ({ r: Math.floor(i/COLS), c: i%COLS }));
  let frame = 0;
  const anim = setInterval(() => {
    drawGrid();
    const alpha = frame % 2 === 0 ? 1 : 0.15;
    flashCells.forEach(({r, c}) => {
      const x = c * (CELL+GAP), y = r * (CELL+GAP);
      ctx.fillStyle = 'rgba(255,255,255,' + alpha + ')';
      roundRect(ctx, x, y, CELL, CELL, 5);
      ctx.fill();
    });
    frame++;
    if (frame >= 6) {
      clearInterval(anim);
      // Supprimer les lignes/colonnes
      for (let r = 0; r < ROWS; r++) {
        if (grid[r].every(c => c !== null)) grid[r].fill(null);
      }
      for (let c = 0; c < COLS; c++) {
        if (grid.every(row => row[c] !== null)) {
          for (let r = 0; r < ROWS; r++) grid[r][c] = null;
        }
      }
      // Score
      const pts = cleared === 1 ? 10 : cleared === 2 ? 30 : cleared * 20;
      addScore(pts * 10);
      drawGrid();
    }
  }, 60);
}

function addScore(pts) {
  score += pts;
  const gain = pts * 2;
  earned += gain;
  money += gain;
  document.getElementById('scoreDisp').textContent = score;
  document.getElementById('earnDisp').textContent = '+' + fmt(earned) + '€';
  document.getElementById('moneyDisplay').textContent = fmt(money) + '€';
  if (score > bestScore) {
    bestScore = score;
    document.getElementById('bestDisp').textContent = bestScore;
    localStorage.setItem('cb_best', bestScore);
  }
  if (currentUser) sb.from('game_stats').update({money: Math.floor(money)}).eq('user_id', currentUser.id).then(()=>{}).catch(()=>{});
}

function checkGameOver() {
  const hasMove = pieces.some(p => {
    if (!p) return false;
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      if (canPlace(p.shape, r, c)) return true;
    }
    return false;
  });
  if (!hasMove) setTimeout(gameOver, 400);
}

function gameOver() {
  document.getElementById('overScore').textContent = score + ' pts';
  document.getElementById('overGain').textContent = '+' + fmt(earned) + '€ gagnés';
  document.getElementById('overlay').classList.add('show');
}

function fmt(n) { return n >= 1000000 ? (n/1000000).toFixed(1)+'M' : n >= 1000 ? Math.floor(n/1000)+'k' : n; }

function startGame() {
  score = 0; earned = 0; selectedPiece = -1; ghostPos = null;
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('scoreDisp').textContent = '0';
  document.getElementById('earnDisp').textContent = '+0€';
  initGrid(); spawnPieces(); drawGrid();
}

// ── INTERACTION TACTILE/SOURIS ──
function getCell(x, y) {
  const c = Math.floor(x / (CELL + GAP));
  const r = Math.floor(y / (CELL + GAP));
  return { r, c };
}

function selectPiece(idx) {
  if (!pieces[idx]) return;
  selectedPiece = idx;
  [0,1,2].forEach(i => document.getElementById('slot'+i).classList.toggle('selected', i === idx));
}

// Tap sur une pièce
[0,1,2].forEach(i => {
  const slot = document.getElementById('slot'+i);
  slot.addEventListener('touchstart', e => { e.preventDefault(); selectPiece(i); }, { passive:false });
  slot.addEventListener('mousedown', () => selectPiece(i));
});

// Placement sur la grille
function getGridPos(e) {
  const rect = gc.getBoundingClientRect();
  const touch = e.touches ? e.touches[0] : e;
  return { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
}

gc.addEventListener('touchmove', e => {
  e.preventDefault();
  if (selectedPiece < 0 || !pieces[selectedPiece]) return;
  const {x, y} = getGridPos(e);
  const {r, c} = getCell(x, y);
  const p = pieces[selectedPiece];
  const minR = Math.min(...p.shape.map(([r])=>r));
  const minC = Math.min(...p.shape.map(([,c])=>c));
  ghostPos = { r: r - minR, c: c - minC };
  drawGrid();
}, { passive:false });

gc.addEventListener('touchend', e => {
  e.preventDefault();
  if (selectedPiece < 0 || !pieces[selectedPiece] || !ghostPos) return;
  const placed = placePiece(selectedPiece, ghostPos.r, ghostPos.c);
  if (placed) {
    selectedPiece = -1;
    [0,1,2].forEach(i => document.getElementById('slot'+i).classList.remove('selected'));
  }
  ghostPos = null;
  drawGrid();
}, { passive:false });

gc.addEventListener('mousemove', e => {
  if (selectedPiece < 0 || !pieces[selectedPiece]) return;
  const {x, y} = getGridPos(e);
  const {r, c} = getCell(x, y);
  const p = pieces[selectedPiece];
  const minR = Math.min(...p.shape.map(([r])=>r));
  const minC = Math.min(...p.shape.map(([,c])=>c));
  ghostPos = { r: r - minR, c: c - minC };
  drawGrid();
});

gc.addEventListener('click', e => {
  if (selectedPiece < 0 || !pieces[selectedPiece]) return;
  const {x, y} = getGridPos(e);
  const {r, c} = getCell(x, y);
  const p = pieces[selectedPiece];
  const minR = Math.min(...p.shape.map(([r])=>r));
  const minC = Math.min(...p.shape.map(([,c])=>c));
  const placed = placePice(selectedPiece, r - minR, c - minC);
  if (placed) {
    selectedPiece = -1;
    [0,1,2].forEach(i => document.getElementById('slot'+i).classList.remove('selected'));
  }
  ghostPos = null; drawGrid();
});

function placePice(idx, r, c) { return placePiece(idx, r, c); }

// ── INIT ──
async function init() {
  sb.auth.onAuthStateChange((e, session) => { if (!session) window.location.href='index.html'; });
  const { data, error } = await sb.auth.getSession();
  if (error || !data.session) { await sb.auth.signOut().catch(()=>{}); window.location.href='index.html'; return; }
  currentUser = data.session.user;
  const { data: g } = await sb.from('game_stats').select('money').eq('user_id', currentUser.id).maybeSingle();
  money = (g && g.money) || 0;
  document.getElementById('moneyDisplay').textContent = fmt(money) + '€';
  bestScore = parseInt(localStorage.getItem('cb_best') || '0');
  document.getElementById('bestDisp').textContent = bestScore;
  startGame();
}
init();
</script>
</body>
</html>
