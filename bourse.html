<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bourse du Fret - Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  body { font-family:'Inter',sans-serif; background:#030a0f; color:#e8f0ee; min-height:100dvh; overflow-x:hidden; }

  /* fond grille trading */
  .bg-grid { position:fixed; inset:0; z-index:0; background:
      linear-gradient(180deg,#020c14,#041520 55%,#020c14),
      linear-gradient(rgba(52,211,153,0.035) 1px,transparent 1px),
      linear-gradient(90deg,rgba(52,211,153,0.035) 1px,transparent 1px);
    background-size:100% 100%, 32px 32px, 32px 32px; pointer-events:none; }

  .wrap { position:relative; z-index:1; max-width:520px; margin:0 auto; padding:0 14px 40px; }

  /* header */
  .hdr { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px;
    padding:14px 4px; background:linear-gradient(180deg,#030a0f,rgba(3,10,15,0.85)); backdrop-filter:blur(8px); }
  .back-btn { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:9px;
    padding:8px 12px; font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:1px; color:rgba(255,255,255,0.7); cursor:pointer; }
  .back-btn:active { transform:scale(0.95); }
  .hdr-title { flex:1; font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:3px;
    background:linear-gradient(135deg,#34d399,#6ee7b7,#34d399); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }

  /* soldes */
  .wallet { display:flex; gap:10px; margin-bottom:14px; }
  .wallet-box { flex:1; background:rgba(52,211,153,0.05); border:1px solid rgba(52,211,153,0.15); border-radius:14px; padding:12px 14px; }
  .wallet-lbl { font-size:9px; letter-spacing:2px; text-transform:uppercase; color:rgba(255,255,255,0.35); margin-bottom:4px; }
  .wallet-val { font-family:'Bebas Neue',sans-serif; font-size:24px; letter-spacing:1px; color:#34d399; line-height:1; }
  .wallet-val.cash { color:#fff; }

  /* carte compagnie */
  .stock { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.07); border-radius:16px;
    padding:14px; margin-bottom:12px; transition:border-color .2s; }
  .stock.holding { border-color:rgba(52,211,153,0.3); background:rgba(52,211,153,0.04); }
  .stock-top { display:flex; align-items:center; gap:12px; }
  .stock-badge { width:42px; height:42px; border-radius:11px; display:flex; align-items:center; justify-content:center;
    font-family:'Bebas Neue',sans-serif; font-size:15px; color:#fff; flex-shrink:0; letter-spacing:1px; }
  .stock-id { flex:1; min-width:0; }
  .stock-sym { font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:1px; color:#fff; }
  .stock-name { font-size:10px; color:rgba(255,255,255,0.4); }
  .stock-price-wrap { text-align:right; }
  .stock-price { font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:0.5px; color:#fff; line-height:1; }
  .stock-chg { font-size:11px; font-weight:700; margin-top:2px; }
  .up { color:#34d399; } .down { color:#f87171; } .flat { color:rgba(255,255,255,0.4); }

  .spark { width:100%; height:46px; margin:12px 0 4px; display:block; }

  .pos { display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:rgba(0,0,0,0.25); border:1px solid rgba(52,211,153,0.12); border-radius:10px; padding:8px 12px; margin-top:8px; font-size:12px; }
  .pos-lbl { color:rgba(255,255,255,0.45); }
  .pos-pl { font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:0.5px; }

  .btns { display:flex; gap:8px; margin-top:10px; }
  .btn { flex:1; padding:11px; border:none; border-radius:11px; font-family:'Bebas Neue',sans-serif;
    font-size:15px; letter-spacing:1px; cursor:pointer; transition:transform .1s; }
  .btn:active { transform:scale(0.96); }
  .btn-buy  { background:linear-gradient(135deg,#059669,#34d399); color:#022; }
  .btn-sell { background:rgba(248,113,113,0.12); border:1px solid rgba(248,113,113,0.4); color:#fca5a5; }
  .btn-sell:disabled { opacity:0.35; cursor:default; }

  /* modal trade */
  .ov { position:fixed; inset:0; z-index:100; background:rgba(0,0,0,0.8); backdrop-filter:blur(8px);
    display:none; align-items:flex-end; justify-content:center; }
  .ov.show { display:flex; }
  .sheet { width:100%; max-width:520px; background:#0a1620; border-top:1px solid rgba(52,211,153,0.2);
    border-radius:22px 22px 0 0; padding:22px 18px calc(22px + env(safe-area-inset-bottom)); animation:slideUp .25s ease; }
  @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
  .sheet-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .sheet-sym { font-family:'Bebas Neue',sans-serif; font-size:24px; letter-spacing:1px; color:#fff; }
  .sheet-price { font-family:'Bebas Neue',sans-serif; font-size:20px; color:#34d399; }
  .sheet-x { background:rgba(255,255,255,0.08); border:none; color:#fff; width:30px; height:30px; border-radius:50%; font-size:15px; cursor:pointer; }
  .tt { display:flex; gap:8px; margin:14px 0; }
  .tt-btn { flex:1; padding:10px; border-radius:10px; border:1px solid rgba(255,255,255,0.1); background:none;
    font-family:'Bebas Neue',sans-serif; font-size:15px; letter-spacing:1px; color:rgba(255,255,255,0.5); cursor:pointer; }
  .tt-btn.act-buy  { background:rgba(52,211,153,0.15); border-color:rgba(52,211,153,0.5); color:#34d399; }
  .tt-btn.act-sell { background:rgba(248,113,113,0.12); border-color:rgba(248,113,113,0.5); color:#fca5a5; }
  .amt-row { display:flex; align-items:center; gap:8px; background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.1);
    border-radius:12px; padding:6px 10px; margin-bottom:10px; }
  .amt-input { flex:1; background:none; border:none; outline:none; color:#fff; font-family:'Bebas Neue',sans-serif;
    font-size:24px; letter-spacing:1px; text-align:center; -webkit-user-select:text; user-select:text; }
  .amt-cur { font-family:'Bebas Neue',sans-serif; font-size:18px; color:rgba(255,255,255,0.4); }
  .quick { display:flex; gap:6px; margin-bottom:12px; }
  .quick-btn { flex:1; padding:8px; border-radius:9px; border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.03);
    color:rgba(255,255,255,0.6); font-size:12px; font-weight:700; cursor:pointer; }
  .quick-btn:active { background:rgba(255,255,255,0.1); }
  .preview { font-size:12px; color:rgba(255,255,255,0.5); text-align:center; margin-bottom:14px; line-height:1.5; min-height:18px; }
  .preview b { color:#fff; }
  .exec { width:100%; padding:15px; border:none; border-radius:13px; font-family:'Bebas Neue',sans-serif;
    font-size:18px; letter-spacing:1.5px; cursor:pointer; }
  .exec.buy  { background:linear-gradient(135deg,#059669,#34d399); color:#022; }
  .exec.sell { background:linear-gradient(135deg,#dc2626,#f87171); color:#fff; }
  .exec:disabled { opacity:0.4; cursor:default; }

  /* toast événement */
  .toast { position:fixed; top:64px; left:50%; transform:translateX(-50%) translateY(-20px); z-index:200;
    background:rgba(10,22,32,0.97); border:1px solid rgba(52,211,153,0.3); border-radius:12px;
    padding:11px 18px; font-size:12px; font-weight:600; opacity:0; transition:all .35s; max-width:90%; text-align:center; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.bad { border-color:rgba(248,113,113,0.4); }

  .loader { text-align:center; padding:80px 20px; color:rgba(255,255,255,0.3); font-family:'Bebas Neue',sans-serif; letter-spacing:2px; }
  .hint { font-size:11px; color:rgba(255,255,255,0.3); text-align:center; margin:6px 0 14px; line-height:1.5; }
</style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="wrap">
    <div class="hdr">
      <button class="back-btn" onclick="window.location.href='game.html'">← Retour</button>
      <div class="hdr-title">Bourse du Fret</div>
    </div>

    <div class="wallet">
      <div class="wallet-box"><div class="wallet-lbl">Liquidités</div><div class="wallet-val cash" id="cash">—</div></div>
      <div class="wallet-box"><div class="wallet-lbl">Portefeuille</div><div class="wallet-val" id="portfolio">—</div></div>
    </div>
    <div class="hint">Achète bas, revends haut. Les cours bougent en continu — et peuvent chuter.</div>

    <div id="stocks"><div class="loader">Connexion au marché…</div></div>
  </div>

  <!-- modal -->
  <div class="ov" id="ov">
    <div class="sheet">
      <div class="sheet-top">
        <div><div class="sheet-sym" id="mSym"></div><div class="stock-name" id="mName"></div></div>
        <div style="display:flex;align-items:center;gap:10px">
          <div class="sheet-price" id="mPrice"></div>
          <button class="sheet-x" onclick="closeModal()">✕</button>
        </div>
      </div>
      <div class="tt">
        <button class="tt-btn" id="ttBuy" onclick="setMode('buy')">Acheter</button>
        <button class="tt-btn" id="ttSell" onclick="setMode('sell')">Vendre</button>
      </div>
      <div class="amt-row">
        <input class="amt-input" id="amt" type="number" inputmode="numeric" placeholder="0">
        <span class="amt-cur" id="amtCur">€</span>
      </div>
      <div class="quick" id="quick"></div>
      <div class="preview" id="preview"></div>
      <button class="exec" id="exec" onclick="execTrade()">Confirmer</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  const SB_URL = 'https://drtsuhnbclhmgfjiykap.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
  const { createClient } = supabase;
  const sb = createClient(SB_URL, SB_KEY);

  // ── Compagnies ──
  const COMPANIES = [
    { sym:'MAERSK',  name:'Maersk Line',   base:120, vol:0.022, color:'#0ea5e9' },
    { sym:'MSC',     name:'MSC',           base:85,  vol:0.034, color:'#f59e0b' },
    { sym:'CMACGM',  name:'CMA CGM',       base:150, vol:0.028, color:'#a855f7' },
  ];
  const EVENTS = [
    { t:'⚓ Pénurie de conteneurs',   m:0.14,  bad:false },
    { t:'📈 Boom du commerce mondial', m:0.10,  bad:false },
    { t:'🚢 Nouveau contrat géant',   m:0.12,  bad:false },
    { t:'🌊 Tempête en mer Rouge',    m:-0.13, bad:true  },
    { t:'⛔ Grève dans les ports',     m:-0.11, bad:true  },
    { t:'📉 Chute de la demande',      m:-0.15, bad:true  },
  ];
  const HIST = 40;

  let currentUser=null, cash=0, holdings={}, prices={}, hist={}, prev={}, tickInt=null;
  let modalSym=null, mode='buy';

  function gauss(){ let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
  function fmt(n){ return Math.round(n).toLocaleString('fr-FR'); }
  function fmt2(n){ return n.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}); }

  async function init(){
    const { data:{ session } } = await sb.auth.getSession();
    if(!session){ window.location.href='index.html'; return; }
    currentUser = session.user;
    const { data } = await sb.from('game_stats').select('money,bourse').eq('user_id',currentUser.id).maybeSingle();
    cash = data?.money || 0;
    holdings = (data?.bourse && typeof data.bourse==='object') ? data.bourse : {};
    COMPANIES.forEach(c=>{ prices[c.sym]=c.base; prev[c.sym]=c.base; hist[c.sym]=Array(HIST).fill(c.base); });
    renderStocks();
    updateWallet();
    tickInt = setInterval(tick, 2000);
    setTimeout(tick, 400);
  }

  function tick(){
    // marche aléatoire avec retour à la moyenne
    COMPANIES.forEach(c=>{
      prev[c.sym] = prices[c.sym];
      let p = prices[c.sym];
      p += 0.06*(c.base - p) + c.base*c.vol*gauss();
      p = Math.max(c.base*0.45, Math.min(c.base*1.7, p));
      prices[c.sym] = p;
      hist[c.sym].push(p); if(hist[c.sym].length>HIST) hist[c.sym].shift();
    });
    // événement aléatoire (~6% par tick)
    if(Math.random()<0.06){
      const c = COMPANIES[Math.floor(Math.random()*COMPANIES.length)];
      const e = EVENTS[Math.floor(Math.random()*EVENTS.length)];
      let p = prices[c.sym]*(1+e.m);
      prices[c.sym] = Math.max(c.base*0.45, Math.min(c.base*1.7, p));
      hist[c.sym][hist[c.sym].length-1] = prices[c.sym];
      showToast(`${e.t} — ${c.sym} ${e.m>0?'+':''}${Math.round(e.m*100)}%`, e.bad);
    }
    refresh();
    if(modalSym) updateModal();
  }

  function renderStocks(){
    const el = document.getElementById('stocks');
    el.innerHTML = COMPANIES.map(c=>`
      <div class="stock" id="st-${c.sym}">
        <div class="stock-top">
          <div class="stock-badge" style="background:${c.color}">${c.sym.slice(0,3)}</div>
          <div class="stock-id"><div class="stock-sym">${c.sym}</div><div class="stock-name">${c.name}</div></div>
          <div class="stock-price-wrap"><div class="stock-price" id="pr-${c.sym}">—</div><div class="stock-chg" id="ch-${c.sym}">—</div></div>
        </div>
        <svg class="spark" id="sp-${c.sym}" viewBox="0 0 300 46" preserveAspectRatio="none"></svg>
        <div id="po-${c.sym}"></div>
        <div class="btns">
          <button class="btn btn-buy" onclick="openModal('${c.sym}','buy')">Acheter</button>
          <button class="btn btn-sell" id="sb-${c.sym}" onclick="openModal('${c.sym}','sell')">Vendre</button>
        </div>
      </div>`).join('');
    refresh();
  }

  function refresh(){
    COMPANIES.forEach(c=>{
      const p = prices[c.sym];
      const pr = document.getElementById('pr-'+c.sym); if(!pr) return;
      pr.textContent = fmt2(p)+'€';
      const diff = p - prev[c.sym];
      const pct = prev[c.sym] ? (diff/prev[c.sym]*100) : 0;
      const ch = document.getElementById('ch-'+c.sym);
      const cls = diff>0.001?'up':diff<-0.001?'down':'flat';
      ch.className = 'stock-chg '+cls;
      ch.textContent = (diff>0?'▲ +':diff<0?'▼ ':'• ')+fmt2(Math.abs(pct))+'%';
      drawSpark(c);
      // position
      const h = holdings[c.sym];
      const poEl = document.getElementById('po-'+c.sym);
      const stEl = document.getElementById('st-'+c.sym);
      const sellBtn = document.getElementById('sb-'+c.sym);
      if(h && h.shares>0.0001){
        const val = h.shares*p, cost = h.shares*h.avg, pl = val-cost, plPct = cost?(pl/cost*100):0;
        const plCls = pl>=0?'up':'down';
        poEl.innerHTML = `<div class="pos">
          <span class="pos-lbl">${fmt2(h.shares)} parts · PRU ${fmt2(h.avg)}€</span>
          <span class="pos-pl ${plCls}">${pl>=0?'+':''}${fmt(pl)}€ (${pl>=0?'+':''}${fmt2(plPct)}%)</span></div>`;
        stEl.classList.add('holding'); sellBtn.disabled=false;
      } else {
        poEl.innerHTML=''; stEl.classList.remove('holding'); sellBtn.disabled=true;
      }
    });
    updateWallet();
  }

  function drawSpark(c){
    const data = hist[c.sym]; const sp = document.getElementById('sp-'+c.sym); if(!sp) return;
    const min=Math.min(...data), max=Math.max(...data), rng=(max-min)||1;
    const pts = data.map((v,i)=>`${(i/(data.length-1))*300},${46-((v-min)/rng)*42-2}`).join(' ');
    const rising = data[data.length-1]>=data[0];
    const col = rising?'#34d399':'#f87171';
    sp.innerHTML = `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round"/>`;
  }

  function portfolioValue(){ let v=0; COMPANIES.forEach(c=>{ const h=holdings[c.sym]; if(h) v+=h.shares*prices[c.sym]; }); return v; }
  function updateWallet(){
    document.getElementById('cash').textContent = fmt(cash)+'€';
    document.getElementById('portfolio').textContent = fmt(portfolioValue())+'€';
  }

  // ── Modal ──
  function openModal(sym, m){ modalSym=sym; document.getElementById('ov').classList.add('show'); setMode(m); document.getElementById('amt').value=''; updateModal(); }
  function closeModal(){ modalSym=null; document.getElementById('ov').classList.remove('show'); }
  document.getElementById('ov').addEventListener('click', e=>{ if(e.target.id==='ov') closeModal(); });

  function setMode(m){
    mode=m;
    document.getElementById('ttBuy').className='tt-btn'+(m==='buy'?' act-buy':'');
    document.getElementById('ttSell').className='tt-btn'+(m==='sell'?' act-sell':'');
    document.getElementById('amtCur').textContent = m==='buy'?'€':'parts';
    document.getElementById('amt').placeholder = '0';
    document.getElementById('amt').value='';
    const exec=document.getElementById('exec');
    exec.className='exec '+m;
    exec.textContent = m==='buy'?'Acheter':'Vendre';
    buildQuick();
    updateModal();
  }

  function buildQuick(){
    const q=document.getElementById('quick'); const h=holdings[modalSym];
    if(mode==='buy'){
      q.innerHTML=[['25%',.25],['50%',.5],['Max',1]].map(([t,f])=>`<button class="quick-btn" onclick="setAmt(Math.floor(cash*${f}))">${t}</button>`).join('');
    } else {
      const sh = h?h.shares:0;
      q.innerHTML=[['25%',.25],['50%',.5],['Tout',1]].map(([t,f])=>`<button class="quick-btn" onclick="setAmt(${sh}*${f})">${t}</button>`).join('');
    }
  }
  function setAmt(v){ document.getElementById('amt').value = mode==='buy'?Math.floor(v):(Math.floor(v*10000)/10000); updateModal(); }
  document.getElementById('amt').addEventListener('input', updateModal);

  function updateModal(){
    if(!modalSym) return;
    const c = COMPANIES.find(x=>x.sym===modalSym);
    document.getElementById('mSym').textContent=c.sym;
    document.getElementById('mName').textContent=c.name;
    document.getElementById('mPrice').textContent=fmt2(prices[c.sym])+'€';
    const val = parseFloat(document.getElementById('amt').value)||0;
    const p = prices[c.sym]; const h = holdings[c.sym];
    const exec=document.getElementById('exec'); const pv=document.getElementById('preview');
    if(mode==='buy'){
      const shares = val>0 ? val/p : 0;
      pv.innerHTML = val>0 ? `Tu achètes <b>${fmt2(shares)} parts</b> de ${c.sym}` : 'Saisis un montant à investir';
      exec.disabled = !(val>0 && val<=cash+0.01);
      if(val>cash) pv.innerHTML='Liquidités insuffisantes';
    } else {
      const sh = Math.min(val, h?h.shares:0);
      const proceeds = sh*p, cost = sh*(h?h.avg:0), pl=proceeds-cost;
      pv.innerHTML = sh>0 ? `Tu vends <b>${fmt2(sh)} parts</b> → <b>${fmt(proceeds)}€</b> (${pl>=0?'+':''}${fmt(pl)}€)` : 'Saisis un nombre de parts';
      exec.disabled = !(sh>0);
    }
  }

  async function execTrade(){
    const c = COMPANIES.find(x=>x.sym===modalSym); const p=prices[c.sym];
    const val = parseFloat(document.getElementById('amt').value)||0;
    if(mode==='buy'){
      if(val<=0 || val>cash+0.01) return;
      const shares = val/p;
      const h = holdings[c.sym] || {shares:0, avg:0};
      const newShares = h.shares + shares;
      h.avg = (h.shares*h.avg + shares*p)/newShares;
      h.shares = newShares;
      holdings[c.sym]=h; cash -= val;
      showToast(`Achat ${c.sym} · ${fmt2(shares)} parts`, false);
    } else {
      const h = holdings[c.sym]; if(!h) return;
      const sh = Math.min(val, h.shares); if(sh<=0) return;
      const proceeds = sh*p;
      h.shares -= sh; cash += proceeds;
      if(h.shares<0.0001) delete holdings[c.sym];
      showToast(`Vente ${c.sym} · +${fmt(proceeds)}€`, false);
    }
    await save();
    refresh(); updateModal();
    if(mode==='sell' && !holdings[c.sym]) closeModal();
  }

  async function save(){
    try {
      await sb.from('game_stats').update({ money: Math.round(cash), bourse: holdings }).eq('user_id', currentUser.id);
    } catch(e){ console.log('save bourse:', e); }
  }

  let toastT=null;
  function showToast(msg, bad){
    const t=document.getElementById('toast');
    t.textContent=msg; t.className='toast show'+(bad?' bad':'');
    clearTimeout(toastT); toastT=setTimeout(()=>t.className='toast'+(bad?' bad':''), 2600);
  }

  window.addEventListener('beforeunload', ()=>{ if(tickInt) clearInterval(tickInt); });
  init();
</script>
</body>
</html>
