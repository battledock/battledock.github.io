<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }

  .tt { display:flex; gap:8px; margin:14px 0; }
  .tt-btn { flex:1; padding:10px; border-radius:10px; border:1px solid rgba(0,0,0,0.08); background:#f8f8f8; font-family:'Bebas Neue',sans-serif; font-size:15px; letter-spacing:1px; color:rgba(0,0,0,0.35); cursor:pointer; }

  .quick { display:flex; gap:6px; margin-bottom:12px; }

  .preview b { color:#1a1a1a; }
  .exec { width:100%; padding:15px; border:none; border-radius:13px; font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:1.5px; cursor:pointer; }
  .exec.buy  { background:#16a34a; color:#fff; }
  .exec.sell { background:#dc2626; color:#fff; }
  .exec:disabled { opacity:0.35; cursor:default; }

  .toast { position:fixed; top:64px; left:50%; transform:translateX(-50%) translateY(-20px); z-index:200; background:#fff; border:1px solid #86efac; border-radius:12px; padding:11px 18px; font-size:12px; font-weight:600; opacity:0; transition:all .35s; max-width:90%; text-align:center; color:#16a34a; box-shadow:0 8px 24px rgba(0,0,0,0.1); }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.bad { border-color:#fca5a5; color:#dc2626; }
  .hint { font-size:11px; color:rgba(0,0,0,0.25); text-align:center; margin:2px 0 12px; line-height:1.5; }
  .loader { text-align:center; padding:70px 20px; color:rgba(0,0,0,0.2); font-family:'Bebas Neue',sans-serif; letter-spacing:2px; }
</style>

<body>

  <div class="wrap">
    <div class="hdr">
      <div class="hdr-title">BOURSE DU FRET</div>

    <!-- Mini portfolio chart -->
    <div class="portfolio-chart">
      <div class="pc-info">
        <div class="pc-lbl">VALEUR TOTALE</div>

      <svg width="120" height="48" viewBox="0 0 120 48" preserveAspectRatio="none" id="pcChart">

      <button class="tab act" id="tab-market" onclick="showTab('market')">Marché</button>

    </div>
    <div id="view-market"><div class="loader">Connexion au marché…</div></div>
    <div id="view-feed" style="display:none"></div>
    <button onclick="window.location.href='game.html'" style="display:block;width:100%;margin-top:20px;padding:14px;background:#f8f8f8;border:1px solid rgba(0,0,0,0.08);border-radius:12px;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px;color:rgba(0,0,0,0.4);cursor:pointer">← REVENIR AU JEU</button>
  </div>

  <div class="ov" id="ov">
    <div class="sheet">
      <div class="sheet-top">
        <div><div class="sheet-sym" id="mSym"></div><div class="stock-name" id="mName"></div></div>
        <div style="display:flex;align-items:center;gap:10px"><div class="sheet-price" id="mPrice"></div><button class="sheet-x" onclick="closeModal()">✕</button></div>
      </div>
      <div class="tt">
        <button class="tt-btn" id="ttBuy" onclick="setMode('buy')">Acheter</button>

      </div>
      <div id="infoPanel" style="display:none;background:#f8f8f8;border:1px solid rgba(0,0,0,0.08);border-radius:12px;padding:14px;margin-bottom:12px;font-size:13px;line-height:1.6;color:rgba(0,0,0,0.7)"></div>
      <div class="amt-row" id="amt-row"><input class="amt-input" id="amt" type="number" inputmode="numeric" placeholder="0"><span class="amt-cur" id="amtCur">€</span></div>
      <div class="quick" id="quick"></div>
      <div class="preview" id="preview"></div>
      <button class="exec" id="exec" onclick="execTrade()">Confirmer</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>

<script>
  const SB_URL = 'https://drtsuhnbclhmgfjiykap.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
  const sb = supabase.createClient(SB_URL, SB_KEY);

  // ── Entreprises réelles des joueurs ──
  let COMPANIES = [];
  const CO = {};
  const STOCK_COLORS = ['#0ea5e9','#f59e0b','#a855f7','#22c55e','#14b8a6','#ef4444','#eab308','#06b6d4','#ec4899','#8b5cf6'];
  const TYPES_TAG = ['Pêche','Restauration','Transport','Street Food','Nettoyage','Brocante','Manutention','Gardiennage','BTP Naval','Tourisme','Import-Export','Services Admin','Logistique','Commerce Int.','Assurance','Supply Chain','Tech Portuaire','Armateur','Holding','Conglomérat'];

  async function loadCompaniesForBourse(){
    const res = await sb.from('companies').select('user_id,nom,name,emoji,valeur,reputation,niveau,employees,slogan,type_id,color').order('valeur',{ascending:false}).limit(20);
    if(!res.data || res.data.length===0) return;
    COMPANIES = res.data.filter(c=>c.valeur>0).map((c,i)=>{
      const nom = c.nom||c.name||'Entreprise';
      const sym = nom.replace(/[^A-Za-z]/g,'').substring(0,6).toUpperCase()||('CO'+i);
      const basePrice = Math.max(10, Math.round((c.valeur||10000)/1000));
      const rep = c.reputation||50;
      const vol = Math.max(0.012, Math.min(0.05, (100-rep)/2000));
      const emps = Array.isArray(c.employees)?c.employees.length:0;
      const risk = rep>=70?'Faible':rep>=40?'Moyen':rep>=20?'Élevé':'Très élevé';
      const sector = TYPES_TAG[c.type_id]||'Maritime';
      return {
        sym: sym,
        name: (c.emoji||'🏢')+' '+nom,
        base: basePrice,
        vol: vol,
        color: c.color||STOCK_COLORS[i%STOCK_COLORS.length],
        desc: c.slogan||'Entreprise du port de Marseille',
        sector: sector,
        employees: emps+'',
        founded: '2025',
        risk: risk,
        uid: c.user_id
      };
    });
    COMPANIES.forEach(c=>CO[c.sym]=c);
  }
  const EVENTS = [
    { t:'⚓ Pénurie de conteneurs', m:0.10, bad:false },
    { t:'📈 Hausse de la demande',  m:0.08, bad:false },
    { t:'🚢 Contrat décroché',      m:0.09, bad:false },
    { t:'🌊 Avarie en mer',         m:-0.09, bad:true },
    { t:'⛔ Retard portuaire',       m:-0.08, bad:true },
  ];

  const TICK_MS=3000, MIN_TRADE=5000, MAX_TRADE=150000, FEE=0.05, COOLDOWN=30000;
  const IMPACT_LIQ=2500000, MEANREV=0.05, EVENT_PROB=0.022, KRACH_PROB=0.0015, KRACH_M=0.65;
  const CLAMP_LO=0.72, CLAMP_HI=1.30, HIST=36, RUMOR_BIAS=0.20;
  // Volume & Momentum
  const VOL_WINDOW_MS = 5 * 60 * 1000;  // 5 minutes de fenêtre pour le volume
  const VOL_BIAS_MAX  = 0.15;            // biais max ±15% depuis le volume
  const MOMENTUM_THRESH = 3;             // ticks consécutifs pour déclencher le momentum
  const MOMENTUM_BOOST  = 1.4;          // multiplicateur de volatilité en momentum

  let currentUser=null, username='Docker', cash=0;
  let holdings={}, cooldowns={}, profit=0, best=0;
  let prices={}, hist={}, prev={}, tickInt=null, currentTab='market';
  let modalSym=null, mode='buy', biasMap={};
  let volBias={};      // biais volume par sym : positif=plus d'achats, négatif=plus de ventes
  let momentum={};     // nb de ticks consécutifs haussiers (+) ou baissiers (-)
  let lastVolFetch=0;  // timestamp dernier fetch volume (toutes les 30s)
  let momToasted={};   // { sym: 'up'|'dn'|null } - toast déjà envoyé pour éviter le spam

  const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
  const clamp=(p,c)=>Math.max(c.base*CLAMP_LO,Math.min(c.base*CLAMP_HI,p));
  const fmt=n=>Math.round(n).toLocaleString('fr-FR');
  const fmt2=n=>n.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2});

  function stepPrice(sym,p){
    const c = CO[sym];
    // Biais combiné : rumeurs + volume joueurs
    const combinedBias = (biasMap[sym]||0) + (volBias[sym]||0);
    const target = c.base * (1 + combinedBias);
    // Momentum : amplifie la volatilité si tendance consécutive
    const mom = momentum[sym]||0;
    const momBoost = Math.abs(mom) >= MOMENTUM_THRESH ? MOMENTUM_BOOST : 1;
    const noise = c.base * c.vol * gauss() * momBoost;
    p += MEANREV * (target - p) + noise;
    return clamp(p, c);
  }

  // Mise à jour du momentum après chaque tick
  function updateMomentum(sym, oldP, newP){
    const m = momentum[sym] || 0;
    if (newP > oldP + 0.01) {
      momentum[sym] = m >= 0 ? m + 1 : 1;  // haussier
    } else if (newP < oldP - 0.01) {
      momentum[sym] = m <= 0 ? m - 1 : -1; // baissier
    } else {
      momentum[sym] = 0; // flat = reset
    }
    // Toast momentum — une seule fois par momentum (reset quand flat)
    const nm = momentum[sym];
    if (nm === 0) { momToasted[sym] = null; }
    if (nm === MOMENTUM_THRESH  && momToasted[sym] !== 'up') { showToast(`📈 ${sym} momentum haussier !`, false); momToasted[sym]='up'; }
    if (nm === -MOMENTUM_THRESH && momToasted[sym] !== 'dn') { showToast(`📉 ${sym} momentum baissier !`, true);  momToasted[sym]='dn'; }
  }

  // Calcul du biais volume depuis bourse_feed (dernières 5 min)
  async function updateVolumeBias(){
    const now = Date.now();
    if (now - lastVolFetch < 30000) return; // max toutes les 30s
    lastVolFetch = now;
    try {
      const since = new Date(now - VOL_WINDOW_MS).toISOString();
      const { data } = await sb.from('bourse_feed')
        .select('sym,action,amount')
        .gt('created_at', since);
      const agg = {}; // { sym: { buy: 0, sell: 0 } }
      (data||[]).forEach(f=>{
        if (!agg[f.sym]) agg[f.sym] = { buy:0, sell:0 };
        if (f.action === 'a acheté') agg[f.sym].buy += (f.amount||0);
        else agg[f.sym].sell += (f.amount||0);
      });
      COMPANIES.forEach(c=>{
        const a = agg[c.sym];
        if (!a || (a.buy + a.sell) < 1000) { volBias[c.sym] = 0; return; }
        const total = a.buy + a.sell;
        const ratio = (a.buy - a.sell) / total; // [-1, +1]
        volBias[c.sym] = ratio * VOL_BIAS_MAX;
        // Afficher indicateur dans le UI si fort déséquilibre
        const el = document.getElementById('vol-'+c.sym);
        if (el) {
          if (Math.abs(ratio) > 0.3) {
            const arrow = ratio > 0 ? '▲' : '▼';
            const col   = ratio > 0 ? '#16a34a' : '#dc2626';
            el.innerHTML = `<span style="color:${col};font-size:10px;font-weight:700">${arrow} Pression ${ratio>0?'acheteuse':'vendeuse'} (${Math.round(Math.abs(ratio)*100)}%)</span>`;
          } else {
            el.innerHTML = '';
          }
        }
      });
    } catch(e){ console.log('vol bias error:', e); }
  }

  async function init(){
    const { data:{ session } } = await sb.auth.getSession();
    if(!session){ window.location.href='index.html'; return; }
    currentUser=session.user;

      sb.from('profiles').select('username').eq('user_id',currentUser.id).maybeSingle(),
      sb.from('game_stats').select('money,bourse,bourse_profit,bourse_best').eq('user_id',currentUser.id).maybeSingle()
    ]);
    username = prof?.username || 'Docker';
    cash = gs?.money || 0;
    const b = (gs?.bourse && typeof gs.bourse==='object') ? gs.bourse : {};
    holdings = b.h || {}; cooldowns = b.cd || {};
    profit = gs?.bourse_profit || 0; best = gs?.bourse_best || 0;
    await loadCompaniesForBourse();
    if(COMPANIES.length===0){ document.querySelector('.wrap').innerHTML='<div style="padding:40px;text-align:center;color:#9ca3af">Aucune entreprise en bourse.<br>Les joueurs doivent d\'abord créer leur entreprise dans Commerce.</div>'; return; }
    COMPANIES.forEach(c=>{ prices[c.sym]=c.base; prev[c.sym]=c.base; hist[c.sym]=Array(HIST).fill(c.base); });
    renderStocks();
    await syncMarket(true);   // lecture + rattrapage
    updateWallet();
    tickInt = setInterval(()=>syncMarket(false), TICK_MS);
  }

  // Lit le marché partagé, fait avancer les cours (1 pas / 5s, ou rattrapage), réécrit en base
  async function syncMarket(first){
    // Biais du marché selon les rumeurs VRAIES encore actives (les tuyaux du Bar)
    biasMap={};
    await updateVolumeBias();
    try {
      const { data:rum } = await sb.from('bourse_rumors').select('sym,dir,truth,expires_at').gt('expires_at', new Date().toISOString());
      (rum||[]).forEach(r=>{ if(r.truth){ biasMap[r.sym]=Math.max(-0.26, Math.min(0.26, (biasMap[r.sym]||0)+r.dir*RUMOR_BIAS)); } });
    } catch(e){}
    let rows=[];
    try { const { data } = await sb.from('bourse_market').select('*'); rows=data||[]; } catch(e){}
    const map={}; rows.forEach(r=>map[r.sym]=r);
    const now=Date.now();
    const krachNow = Math.random()<KRACH_PROB;
    const writes=[];
    const stepped=[];
    COMPANIES.forEach(c=>{
      let row=map[c.sym];
      let p = row ? Number(row.price) : c.base;
      const age = row ? (now - new Date(row.updated_at).getTime()) : TICK_MS;
      if (age >= TICK_MS-600 || !row) {
        const steps = Math.min(Math.max(1, Math.floor(age/TICK_MS)), 240);
        for(let i=0;i<steps;i++) p = stepPrice(c.sym,p);
        if (krachNow) p = clamp(p*KRACH_M, c);
        stepped.push(c.sym);
      }
      const oldPrice = prices[c.sym];
      prev[c.sym]=prices[c.sym];
      prices[c.sym]=p;
      hist[c.sym].push(p); if(hist[c.sym].length>HIST) hist[c.sym].shift();
      if (stepped.includes(c.sym)) updateMomentum(c.sym, oldPrice, p);
    });
    // Au plus UN événement par tick, sur une seule compagnie ayant bougé
    if (!krachNow && stepped.length && Math.random()<EVENT_PROB){
      const sym=stepped[Math.floor(Math.random()*stepped.length)];
      const e=EVENTS[Math.floor(Math.random()*EVENTS.length)];
      prices[sym]=clamp(prices[sym]*(1+e.m), CO[sym]);
      hist[sym][hist[sym].length-1]=prices[sym];
      showToast(`${e.t} — ${sym} ${e.m>0?'+':''}${Math.round(e.m*100)}%`, e.bad);
    }
    stepped.forEach(sym=>writes.push({ sym, price:Number(prices[sym].toFixed(2)), updated_at:new Date(now).toISOString() }));
    if (krachNow) showToast('🌪️ KRACH BOURSIER — tout le marché chute !', true);
    if (writes.length){ try { await sb.from('bourse_market').upsert(writes, { onConflict:'sym' }); } catch(e){} }
    if (currentTab==='market') refresh();
    if (modalSym) updateModal();
    updateWallet();
  }

  function refresh(){

    COMPANIES.forEach(c=>{

      pr.textContent=fmt2(p)+'€';

      ch.className='stock-chg '+cls; ch.textContent=(diff>0?'▲ +':diff<0?'▼ ':'• ')+fmt2(Math.abs(pct))+'%';
      drawSpark(c);
      // Badge momentum
      const momEl = document.getElementById('ch-'+c.sym);

      if (momEl && Math.abs(mom) >= MOMENTUM_THRESH) {

      const stEl=document.getElementById('st-'+c.sym); const sellBtn=document.getElementById('sb-'+c.sym);
      if(h&&h.shares>0){

  function drawSpark(c){
    const d=hist[c.sym]; const sp=document.getElementById('sp-'+c.sym); if(!sp) return;
    const min=Math.min(...d),max=Math.max(...d),rng=(max-min)||1;
    const pts=d.map((v,i)=>`${(i/(d.length-1))*300},${42-((v-min)/rng)*38-2}`).join(' ');
    const col=d[d.length-1]>=d[0]?'#34d399':'#f87171';
    sp.innerHTML=`<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round"/>`;
  }

  let portHistory = [];
  function portfolioValue(){ let v=0; COMPANIES.forEach(c=>{const h=holdings[c.sym]; if(h)v+=h.shares*prices[c.sym];}); return v; }
  function updateWallet(){
    const pv = portfolioValue();
    const total = cash + pv;
    document.getElementById('cash').textContent=fmt(cash)+'€';
    document.getElementById('portfolio').textContent=fmt(pv)+'€';

    // Portfolio chart mini
    portHistory.push(total);
    if (portHistory.length > 20) portHistory.shift();
    const pcVal = document.getElementById('pcVal');
    const pcChg = document.getElementById('pcChg');
    const pcLine = document.getElementById('pcLine');
    const pcFill = document.getElementById('pcFill');
    if (pcVal) pcVal.textContent = fmt(total)+'€';
    if (pcChg && portHistory.length > 1) {
      const diff = total - portHistory[0];
      const sign = diff >= 0 ? '▲' : '▼';
      const col = diff >= 0 ? '#16a34a' : '#dc2626';
      pcChg.textContent = sign+' '+fmt(Math.abs(diff))+'€';
      pcChg.style.color = col;
      if (pcLine) pcLine.setAttribute('stroke', col);
    }
    if (pcLine && portHistory.length > 1) {
      const mn = Math.min(...portHistory), mx = Math.max(...portHistory), rng = mx-mn || 1;
      const pts = portHistory.map((v,i) => `${(i/(portHistory.length-1))*120},${48-((v-mn)/rng)*40-4}`).join(' ');
      pcLine.setAttribute('d', 'M'+pts.split(' ').join(' L'));
      if (pcFill) pcFill.setAttribute('d', 'M'+pts.split(' ').join(' L')+` L120,48 L0,48 Z`);
    }

    // Badge profit header
    const hdrProfit = document.getElementById('hdrProfit');
    if (hdrProfit) {
      const pv = portfolioValue();
      const sign  = profit >= 0 ? '▲' : '▼';
      const col   = profit >= 0 ? '#16a34a' : '#dc2626';
      const bg    = profit >= 0 ? '#f0fdf4' : '#fef2f2';
      const brd   = profit >= 0 ? '#86efac' : '#fca5a5';
      if (profit === 0 && pv === 0) {
        hdrProfit.textContent = '—';
        hdrProfit.style.cssText = 'color:rgba(0,0,0,0.3);border-color:rgba(0,0,0,0.1);background:#f8f8f8';
      } else if (pv > 0) {
        hdrProfit.innerHTML = `${sign} ${fmt(Math.abs(profit))}€ <span style="opacity:0.6;font-size:11px">· ${fmt(pv)}€</span>`;
        hdrProfit.style.color = col;
        hdrProfit.style.borderColor = brd;
        hdrProfit.style.background = bg;
      } else {
        hdrProfit.textContent = sign+' '+fmt(Math.abs(profit))+'€';
        hdrProfit.style.color = col;
        hdrProfit.style.borderColor = brd;
        hdrProfit.style.background = bg;
      }
    }
  }

  function setAmt(v){ document.getElementById('amt').value=v; updateModal(); }

  function cooldownLeft(sym){ return (cooldowns[sym]||0)+COOLDOWN-Date.now(); }

  function updateModal(){
    if(!modalSym) return;
    const c=CO[modalSym]; const p=prices[modalSym]; const h=holdings[modalSym];
    document.getElementById('mSym').textContent=c.name;
    document.getElementById('mName').textContent=c.sym;
    document.getElementById('mPrice').textContent=fmt2(p)+'€';
    const val=parseFloat(document.getElementById('amt').value)||0;
    const ex=document.getElementById('exec'); const pv=document.getElementById('preview');
    const cd=cooldownLeft(modalSym);
    if(cd>0){ pv.innerHTML=`⏳ Attends <b>${Math.ceil(cd/1000)}s</b> avant de retrader ${c.sym}`; ex.disabled=true; return; }
    if(mode==='buy'){
      if(val<MIN_TRADE){ pv.innerHTML=`Mise minimum : <b>${fmt(MIN_TRADE)}€</b>`; ex.disabled=true; return; }
      if(val>MAX_TRADE){ pv.innerHTML=`Mise maximum : <b>${fmt(MAX_TRADE)}€</b>`; ex.disabled=true; return; }
      if(val>cash){ pv.innerHTML='Liquidités insuffisantes'; ex.disabled=true; return; }
      const shares=Math.floor(val/(p*(1+FEE)));
      if(shares<1){ pv.innerHTML='Pas assez pour 1 part'; ex.disabled=true; return; }
      const cost=shares*p, fee=cost*FEE, total=cost+fee;
      pv.innerHTML=`<b>${shares} parts</b> à ${fmt2(p)}€<br>Frais 5% : ${fmt(fee)}€ · Total : <b>${fmt(total)}€</b>`;
      ex.disabled=false;
    } else {
      const sh=Math.min(Math.floor(val), h?h.shares:0);
      if(sh<1){ pv.innerHTML='Saisis un nombre de parts'; ex.disabled=true; return; }
      const gross=sh*p, fee=gross*FEE, net=gross-fee;
      const costPortion=h?h.cost*(sh/h.shares):0, pl=net-costPortion;
      pv.innerHTML=`<b>${sh} parts</b> → ${fmt(gross)}€ − frais ${fmt(fee)}€ = <b>${fmt(net)}€</b><br>Résultat : <b style="color:${pl>=0?'#34d399':'#f87171'}">${pl>=0?'+':''}${fmt(pl)}€</b>`;
      ex.disabled=false;
    }
  }

  async function execTrade(){
    if(!modalSym) return;
    if(cooldownLeft(modalSym)>0) return;
    const c=CO[modalSym]; let p=prices[modalSym];
    const val=parseFloat(document.getElementById('amt').value)||0;
    let feedAction, feedAmount;

    if(mode==='buy'){
      if(val<MIN_TRADE||val>MAX_TRADE||val>cash) return;
      const shares=Math.floor(val/(p*(1+FEE))); if(shares<1) return;
      const cost=shares*p, fee=cost*FEE, total=cost+fee;
      cash-=total;
      const h=holdings[c.sym]||{shares:0,cost:0};
      h.shares+=shares; h.cost+=total;     // coût = cash dépensé (frais inclus)
      holdings[c.sym]=h;
      p = clamp(p*(1 + total/IMPACT_LIQ), c);   // impact haussier
      feedAction='a acheté'; feedAmount=total;
      showToast(`Achat ${c.sym} · ${shares} parts`, false);
      // Commission 3% au propriétaire de l'entreprise
      if(c.uid && c.uid !== currentUser.id){
        const commission = Math.round(cost * 0.03);
        if(commission > 0){
          try {
            const { data:ownerGs } = await sb.from('game_stats').select('money').eq('user_id',c.uid).maybeSingle();
            if(ownerGs){ await sb.from('game_stats').update({money:(ownerGs.money||0)+commission}).eq('user_id',c.uid); }
          } catch(e){}
        }
      }
    } else {
      const h=holdings[c.sym]; if(!h) return;
      const sh=Math.min(Math.floor(val), h.shares); if(sh<1) return;
      const gross=sh*p, fee=gross*FEE, net=gross-fee;
      const costPortion=h.cost*(sh/h.shares), realized=net-costPortion;
      cash+=net; h.shares-=sh; h.cost-=costPortion;
      if(h.shares<1) delete holdings[c.sym];
      profit+=realized; if(realized>best) best=realized;
      p = clamp(p*(1 - gross/IMPACT_LIQ), c);   // impact baissier
      feedAction='a vendu'; feedAmount=gross;
      showToast(`Vente ${c.sym} · ${realized>=0?'+':''}${fmt(realized)}€`, realized<0);
    }
    cooldowns[c.sym]=Date.now();
    prices[c.sym]=p;
    await Promise.all([ save(), pushFeed(feedAction, c.sym, feedAmount), pushMarket(c.sym, p) ]);
    refresh(); updateModal();
    if(mode==='sell' && !holdings[c.sym]) closeModal();
  }

  async function save(){
    try {
      await sb.from('game_stats').update({
        money: Math.round(cash),
        bourse: { h:holdings, cd:cooldowns },
        bourse_profit: Math.round(profit),
        bourse_best: Math.round(best)
      }).eq('user_id', currentUser.id);
    } catch(e){ console.log('save:',e); }
  }
  async function pushMarket(sym,p){ try{ await sb.from('bourse_market').upsert({ sym, price:Number(p.toFixed(2)), updated_at:new Date().toISOString() }, { onConflict:'sym' }); }catch(e){} }
  async function pushFeed(action,sym,amount){ try{ await sb.from('bourse_feed').insert({ user_id:currentUser.id, username, action, sym, amount:Math.round(amount) }); }catch(e){} }

  // ── Activité ──
  async function loadFeed(){
    const el=document.getElementById('view-feed');
    el.innerHTML='<div class="muted">Chargement…</div>';
    try {
      const { data } = await sb.from('bourse_feed').select('*').order('created_at',{ascending:false}).limit(20);
      if(!data||!data.length){ el.innerHTML='<div class="muted">Aucune transaction récente.</div>'; return; }
      const now=Date.now();
      function timeAgo(ts){
        const s=Math.floor((now-new Date(ts).getTime())/1000);
        if(s<60) return "à l'instant";
        if(s<3600) return 'il y a '+Math.floor(s/60)+'min';
        if(s<86400) return 'il y a '+Math.floor(s/3600)+'h';
        return 'il y a '+Math.floor(s/86400)+'j';
      }
      el.innerHTML=data.map(f=>{
        const co=CO[f.sym]; const nm=co?co.name:f.sym;
        const isBuy=f.action==='a acheté';
        const cls=isBuy?'buy':'sell';
        const verb=isBuy?'Achat':'Vente';
        const me=f.user_id===currentUser?.id?' <span style="background:#f0fdf4;border:1px solid #86efac;border-radius:6px;padding:1px 5px;font-size:9px;color:#16a34a;font-weight:700">MOI</span>':'';
        return `<div class="feed-line">
          <div class="feed-dot ${cls}"></div>
          <div class="feed-body">
            <div class="feed-text"><b>${f.username||'Docker'}</b>${me} ${f.action} <b>${nm}</b></div>
            <div class="feed-meta">${timeAgo(f.created_at)} · ${verb}</div>
          </div>
          <div class="feed-badge ${cls}">${fmt(f.amount)}€</div>
        </div>`;
      }).join('');
    } catch(e){ el.innerHTML='<div class="muted">Indisponible.</div>'; }
  }

  // ── Classement traders ──
  async function loadLeaderboard(){
    const el=document.getElementById('view-lb');
    el.innerHTML='<div class="muted">Chargement…</div>';
    try {
      // Récupérer game_stats + bourse_feed pour les noms (join via feed)
      const { data } = await sb.from('game_stats')
        .select('user_id,bourse_profit,bourse_best')
        .order('bourse_profit',{ascending:false}).limit(15);
      const rows=(data||[]);
      if(!rows.length){ el.innerHTML='<div class="muted">Pas encore de traders classés.<br><span style="font-size:11px">Fais un profit à la bourse pour apparaître !</span></div>'; return; }
      const ids=rows.map(r=>r.user_id);
      // Essai join profiles, fallback sur bourse_feed
      let nameOf={};
      try {
        const { data:profs } = await sb.from('profiles').select('user_id,username').in('user_id',ids);
        (profs||[]).forEach(p=>nameOf[p.user_id]=p.username);
      } catch(_) {}
      // Fallback : usernames depuis le feed
      if(!Object.keys(nameOf).length){
        try {
          const { data:feedNames } = await sb.from('bourse_feed').select('user_id,username').in('user_id',ids).limit(50);
          (feedNames||[]).forEach(f=>{ if(!nameOf[f.user_id]) nameOf[f.user_id]=f.username; });
        } catch(_) {}
      }
      const medals=['🥇','🥈','🥉'];
      el.innerHTML = rows.map((r,i)=>{
        const isMe = r.user_id===currentUser?.id;
        const name = nameOf[r.user_id]||'Docker';
        return `<div class="lb-line${isMe?' lb-me':''}">
          <div class="lb-rank">${medals[i]||('#'+(i+1))}</div>
          <div class="lb-name" style="flex:1">
            <div>${name}${isMe?' 👈':''}</div>
            <div class="lb-best">Meilleur trade : +${fmt(r.bourse_best||0)}€</div>
          </div>
          <div>
            <div class="lb-val">+${fmt(r.bourse_profit||0)}€</div>
            ${isMe?'<div style="font-size:9px;color:#16a34a;text-align:right;font-weight:700">MON PROFIT</div>':''}
          </div>
        </div>`;
      }).join('');
    } catch(e){ console.log('lb error:',e); el.innerHTML='<div class="muted">Indisponible.</div>'; }
  }

  let toastT=null;
  function showToast(msg,bad){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show'+(bad?' bad':''); clearTimeout(toastT); toastT=setTimeout(()=>t.className='toast'+(bad?' bad':''),2600); }

  window.addEventListener('beforeunload',()=>{ if(tickInt) clearInterval(tickInt); });
  init();
</script>
</body>
