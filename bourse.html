<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Bourse du Fret - Battle Dock</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
body{font-family:'Inter',sans-serif;background:#f7f3ee;color:#1a1a1a;min-height:100vh}
.app{max-width:390px;margin:0 auto}

/* HEADER */
.hdr{padding:54px 16px 12px;background:#f0f0eb;position:sticky;top:0;z-index:20;border-bottom:1px solid rgba(0,0,0,.06)}
.hdr-row{display:flex;align-items:center;gap:10px}
.back{width:36px;height:36px;background:#fff;border-radius:10px;border:1px solid rgba(0,0,0,.08);
  display:flex;align-items:center;justify-content:center;font-size:14px;color:#555;text-decoration:none}
.hdr-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;color:#0f0f0f;flex:1}
.profit-badge{background:#0f0f0f;border-radius:20px;padding:5px 12px;
  font-family:'Bebas Neue',sans-serif;font-size:13px;color:#a3e635}

/* PORTFOLIO CARD */
.hero{margin:14px 16px;background:#fff;border-radius:20px;padding:20px;
  box-shadow:0 2px 12px rgba(0,0,0,.06)}
.hero-lbl{font-size:8px;font-weight:900;color:#aaa;letter-spacing:2px;margin-bottom:8px}
.hero-val{font-family:'Bebas Neue',sans-serif;font-size:42px;color:#0f0f0f;line-height:1;letter-spacing:1px}
.hero-spark{height:60px;margin:12px 0 8px}
.hero-spark svg{width:100%;height:60px}
.hero-footer{display:flex;gap:12px}
.hf-item{flex:1}
.hf-lbl{font-size:8px;font-weight:900;color:#aaa;letter-spacing:1.5px;margin-bottom:3px}
.hf-val{font-family:'Bebas Neue',sans-serif;font-size:16px;color:#0f0f0f}
.chg-pill{display:inline-flex;align-items:center;gap:4px;background:#f0fdf4;
  border-radius:20px;padding:4px 10px;font-size:11px;font-weight:800;color:#16a34a;margin-top:8px}

/* PROFIT CARDS */
.profit-row{display:flex;gap:8px;margin:0 16px 14px}
.pc{flex:1;background:#fff;border-radius:14px;padding:12px;box-shadow:0 1px 6px rgba(0,0,0,.05)}
.pc-ico{width:28px;height:28px;border-radius:8px;margin-bottom:8px;
  display:flex;align-items:center;justify-content:center;font-size:14px}
.pc-lbl{font-size:8px;font-weight:900;color:#aaa;letter-spacing:1.5px;margin-bottom:4px}
.pc-val{font-family:'Bebas Neue',sans-serif;font-size:20px;line-height:1}
.pc-sub{font-size:9px;color:#aaa;font-weight:700;margin-top:3px}

/* SECTION HDR */
.sec{display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;margin-bottom:10px}
.sec-t{font-size:9px;font-weight:900;color:#aaa;letter-spacing:2px}
.sec-lnk{font-size:11px;font-weight:800;color:#0f0f0f;text-decoration:none}

/* TABS */
.tabs{display:flex;gap:0;padding:0 16px;margin-bottom:14px;
  background:#fff;border-radius:12px;margin:0 16px 14px;padding:4px;
  box-shadow:0 1px 6px rgba(0,0,0,.05)}
.tab{flex:1;padding:9px;border-radius:9px;font-size:11px;font-weight:800;
  text-align:center;cursor:pointer;letter-spacing:.5px;border:none;
  background:transparent;color:#aaa}
.tab.on{background:#0f0f0f;color:#fff}

/* STOCK */
.stock{margin:0 0 8px;background:#fff;border-radius:16px;
  box-shadow:0 1px 3px rgba(0,0,0,.05),0 4px 12px rgba(0,0,0,.04);overflow:hidden}
.st-top{display:flex;align-items:center;gap:10px;padding:12px 14px 10px}
.st-badge{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:11px;
  color:#fff;flex-shrink:0;letter-spacing:.5px}
.st-name{font-weight:800;font-size:clamp(12px,3.2vw,14px);color:#0f0f0f;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-sym{font-size:clamp(9px,2.2vw,11px);color:#aaa;font-weight:600;margin-top:2px}
.st-price{font-family:'Bebas Neue',sans-serif;font-size:clamp(16px,4.5vw,20px);
  color:#1a1a1a;text-align:right;line-height:1}
.st-chg{font-family:'Bebas Neue',sans-serif;font-size:clamp(10px,2.8vw,13px);font-weight:400;text-align:right;margin-top:3px;letter-spacing:.5px}
.st-chg.up{color:#16a34a}.st-chg.dn{color:#dc2626}
.spark-wrap{padding:2px 14px 4px;overflow:hidden;transition:height .2s}
.spark-wrap svg{width:100%;height:32px}
.st-pos{margin:0 12px 8px;background:#f0fdf4;border-radius:10px;
  padding:7px 10px;display:flex;justify-content:space-between;font-size:11px}
.st-pos-l{color:rgba(0,0,0,.5);font-weight:700}
.st-pos-r{color:#16a34a;font-family:'Bebas Neue',sans-serif;font-size:14px}
.st-btns{display:flex;gap:clamp(5px,1.5vw,8px);padding:0 12px 12px}
.sb{flex:1;padding:10px 6px;border-radius:10px;font-family:'Bebas Neue',sans-serif;
  font-size:clamp(10px,2.8vw,13px);letter-spacing:1px;cursor:pointer;border:none;text-align:center;min-width:0}
.sb.buy{background:linear-gradient(135deg,#7c3aed,#3b82f6);color:#fff;border:none}
.sb.chart{background:#f7f3ee;color:#888;border:1px solid rgba(0,0,0,.06)}
.sb.sell{background:#fef2f2;color:#dc2626;border:1px solid rgba(220,38,38,.12)}

  /* Elements spécifiques bourse */
  .hint { font-size:11px; color:rgba(0,0,0,0.3); text-align:center; margin-bottom:12px; line-height:1.5; padding:0 4px; }
  
  /* Feed */
  .feed-line { display:flex; align-items:flex-start; gap:10px; padding:10px 12px; background:#fff;
    border-radius:14px; margin-bottom:6px; box-shadow:0 1px 4px rgba(0,0,0,.04); }
  .feed-dot { width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px; }
  .feed-dot.buy { background:#16a34a; }
  .feed-dot.sell { background:#dc2626; }
  .feed-body { flex:1;min-width:0; }
  .feed-text { font-size:12px;color:#0f0f0f;line-height:1.4; }
  .feed-meta { font-size:10px;color:rgba(0,0,0,0.3);margin-top:2px; }
  .feed-badge { flex-shrink:0;font-family:'Bebas Neue',sans-serif;font-size:13px; }
  .feed-badge.buy { color:#16a34a; }
  .feed-badge.sell { color:#dc2626; }

  /* Leaderboard */
  .lb-line { display:flex; align-items:center; gap:12px; padding:12px 14px; background:#fff;
    border-radius:14px; margin-bottom:6px; box-shadow:0 1px 4px rgba(0,0,0,.04); }
  .lb-rank { font-family:'Bebas Neue',sans-serif; font-size:20px; color:#16a34a; min-width:28px; }
  .lb-name { flex:1; color:#0f0f0f; font-weight:700; font-size:14px; }
  .lb-val { font-family:'Bebas Neue',sans-serif; font-size:16px; color:#16a34a; }
  .lb-best { font-size:10px; color:rgba(0,0,0,0.3); font-weight:500; margin-top:2px; }
  .lb-me { background:#f0fdf4; }

  /* Modal overlay */
  .ov { position:fixed; inset:0; z-index:100; background:rgba(0,0,0,0.4);
    backdrop-filter:blur(8px); display:none; align-items:flex-end; justify-content:center; }
  .ov.show { display:flex; }
  .sheet { width:100%; max-width:540px; background:#fff; border-radius:24px 24px 0 0;
    padding:22px 18px calc(22px + env(safe-area-inset-bottom,20px));
    box-shadow:0 -10px 40px rgba(0,0,0,0.1); }
  .sheet-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .sheet-sym { font-family:'Bebas Neue',sans-serif; font-size:23px; letter-spacing:1px; color:#0f0f0f; }
  .sheet-price { font-family:'Bebas Neue',sans-serif; font-size:20px; color:#16a34a; }
  .sheet-x { background:#f5f5f2; border:1px solid rgba(0,0,0,.08); color:#0f0f0f;
    width:32px; height:32px; border-radius:50%; font-size:15px; cursor:pointer; }
  .tt { display:flex; gap:8px; margin:14px 0; }
  .tt-btn { flex:1; padding:10px; border-radius:12px; border:1px solid rgba(0,0,0,.08);
    background:#f5f5f2; font-family:'Bebas Neue',sans-serif; font-size:14px;
    letter-spacing:1px; color:rgba(0,0,0,.35); cursor:pointer; }
  .tt-btn.act-buy { background:#f0fdf4; border-color:#86efac; color:#16a34a; }
  .tt-btn.act-sell { background:#fef2f2; border-color:#fca5a5; color:#dc2626; }
  .amt-row { display:flex; align-items:center; gap:8px; background:#f5f5f2;
    border:1px solid rgba(0,0,0,.08); border-radius:12px; padding:6px 10px; margin-bottom:10px; }
  .amt-input { flex:1; font-family:'Bebas Neue',sans-serif; font-size:22px; border:none;
    background:transparent; outline:none; color:#0f0f0f; letter-spacing:1px; }
  .amt-cur { font-size:13px; font-weight:800; color:rgba(0,0,0,.3); }
  .quick { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
  .quick-btn { padding:7px 14px; border-radius:10px; border:1px solid rgba(0,0,0,.08);
    background:#f5f5f2; font-family:'Bebas Neue',sans-serif; font-size:12px;
    letter-spacing:1px; cursor:pointer; color:rgba(0,0,0,.5); }
  .preview { font-size:12px; color:rgba(0,0,0,.5); margin-bottom:12px; line-height:1.5; }
  .exec { width:100%; padding:14px; border:none; border-radius:14px;
    font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:2px;
    cursor:pointer; color:#fff; }
  .exec.buy { background:#0f0f0f; }
  .exec.sell { background:#dc2626; }
  .exec:disabled { opacity:0.3; cursor:default; }
  #infoPanel { background:#f5f5f2; border:1px solid rgba(0,0,0,.08); border-radius:14px;
    padding:14px; font-size:13px; line-height:1.6; color:rgba(0,0,0,.65); }
  
  /* Position dans stock */
  .pos { display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:#f0fdf4; border-radius:12px; padding:8px 12px; margin:0 14px 8px;
    font-size:12px; }
  .pos-lbl { color:rgba(0,0,0,.4); }
  .pos-pl { font-family:'Bebas Neue',sans-serif; font-size:15px; }

  /* Cooldown */
  .cooldn { font-size:10px; color:rgba(0,0,0,.3); text-align:center; padding:0 14px 8px; }

  /* CAC */
  #cacPort { background:#fff; border-radius:14px; padding:10px 14px; margin-bottom:10px;
    box-shadow:0 1px 6px rgba(0,0,0,.05); display:flex; align-items:center;
    justify-content:space-between; }
  
  /* Portfolio chart */
  .portfolio-chart { background:#fff; border-radius:18px; padding:16px 16px 10px;
    margin-bottom:12px; box-shadow:0 1px 6px rgba(0,0,0,.05); }
  .pc-lbl { font-size:8px; color:rgba(0,0,0,.3); font-weight:900; letter-spacing:2px; margin-bottom:6px; }
  .pc-val { font-family:'Bebas Neue',sans-serif; font-size:28px; color:#0f0f0f; line-height:1; }
  .pc-chg { font-size:11px; font-weight:700; margin-top:4px; color:#16a34a; }

  /* Vol bias */
  #vol-wrap { margin:0 14px 2px; }

  /* Toast */
  .toast { position:fixed; bottom:calc(env(safe-area-inset-bottom,20px)+16px); left:50%;
    transform:translateX(-50%); background:#0f0f0f; color:#fff;
    padding:10px 20px; border-radius:20px; font-size:13px; font-weight:700;
    opacity:0; transition:opacity .25s; pointer-events:none; white-space:nowrap; z-index:200; }
  .toast.show { opacity:1; }
  .toast.bad { background:#dc2626; }

  /* Event banner */
  #eventBanner { font-size:13px; font-weight:700; }
  
  /* Loader */
  .loader { text-align:center; padding:40px; color:rgba(0,0,0,0.3); font-size:13px; }
  .muted { color:rgba(0,0,0,0.3); text-align:center; padding:30px 10px; font-size:13px; }
  
  /* Chart modal */
  .chart-modal-bg { position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.4);
    backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center }
  .chart-modal-bg.on { display:flex }
  .chart-modal { background:#fff;border-radius:24px 24px 0 0;
    width:100%;max-width:540px;padding:20px 16px 40px;max-height:80vh;overflow-y:auto }
  .chart-handle { width:36px;height:4px;background:#e5e5e5;border-radius:2px;margin:0 auto 16px }
  .chart-title { font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:#0f0f0f }
  .chart-price { font-family:'Bebas Neue',sans-serif;font-size:36px;color:#0f0f0f;line-height:1;margin:4px 0 }
  .chart-chg { font-size:13px;font-weight:700;margin-bottom:16px }
  .chart-periods { display:flex;gap:6px;margin-bottom:12px }
  .chart-period { padding:6px 14px;border-radius:8px;font-size:11px;font-weight:800;
    cursor:pointer;background:#f5f5f2;color:#888;border:none }
  .chart-period.on { background:#0f0f0f;color:#fff }
  .chart-svg-wrap { width:100%;height:160px;margin-bottom:16px;position:relative }
  .chart-stat-row { display:flex;gap:8px;margin-bottom:8px }
  .chart-stat { flex:1;background:#f5f5f2;border-radius:10px;padding:8px 10px;text-align:center }
  .chart-stat-v { font-family:'Bebas Neue',sans-serif;font-size:16px;color:#0f0f0f }
  .chart-stat-l { font-size:8px;font-weight:800;color:rgba(0,0,0,.35);letter-spacing:1px;margin-top:2px }

  @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
  @keyframes slideDown { from{transform:translateY(-40px);opacity:0} to{transform:translateY(0);opacity:1} }
  @keyframes page-out { to{opacity:0;transform:translateY(8px)} }
  .page-out { animation:page-out .2s ease forwards; }
</style>
</head>
<body style="background:#f7f3ee;color:#1a1a1a">
  <div class="bg-grid"></div>
  <div style="position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid rgba(0,0,0,.06);overflow:hidden">
    <div style="max-width:540px;margin:0 auto;padding:env(safe-area-inset-top,0px) 0 0">
      <div style="padding:clamp(12px,4vw,20px) clamp(14px,4vw,20px) clamp(14px,3vw,20px)">
        <!-- Ligne titre -->
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:clamp(10px,2.5vw,16px)">
          <button onclick="location.href='game.html'" style="width:44px;height:44px;background:#f5f5f2;border:1px solid rgba(0,0,0,.08);border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#555;cursor:pointer;flex-shrink:0">←</button>
          <div style="font-size:clamp(9px,2.2vw,12px);font-weight:900;color:#aaa;letter-spacing:2px;text-transform:uppercase;flex:1">Bourse du Fret</div>
        </div>
        <!-- Grand chiffre -->
        <div id="pcVal" style="font-family:'Inter',sans-serif;font-weight:900;font-size:clamp(22px,7vw,34px);color:#1a1a1a;line-height:1;letter-spacing:-0.5px;margin-bottom:clamp(4px,1vw,8px)">—</div>
        <!-- Pill variation session -->
        <div id="pcChg" style="display:inline-block;background:#f0fdf4;border-radius:20px;padding:clamp(3px,0.8vw,5px) clamp(8px,2.5vw,14px);font-size:clamp(10px,2.5vw,13px);font-weight:800;color:#16a34a;margin-bottom:clamp(10px,2.5vw,16px)">—</div>
        <!-- Grid 3 stats -->
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:clamp(5px,1.5vw,10px)">
          <div style="background:#f5f5f2;border-radius:clamp(8px,2vw,14px);padding:clamp(7px,1.8vw,12px) clamp(6px,1.5vw,10px)">
            <div style="font-size:clamp(6px,1.5vw,8px);font-weight:900;color:#aaa;letter-spacing:1.5px;margin-bottom:clamp(2px,0.6vw,4px);text-transform:uppercase">Liquidités</div>
            <div id="cash" style="font-family:'Inter',sans-serif;font-weight:800;font-size:clamp(11px,3vw,15px);color:#0f0f0f;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">—</div>
          </div>
          <div style="background:#f5f5f2;border-radius:clamp(8px,2vw,14px);padding:clamp(7px,1.8vw,12px) clamp(6px,1.5vw,10px)">
            <div style="font-size:clamp(6px,1.5vw,8px);font-weight:900;color:#aaa;letter-spacing:1.5px;margin-bottom:clamp(2px,0.6vw,4px);text-transform:uppercase">Réalisé</div>
            <div id="profitRealise" style="font-family:'Inter',sans-serif;font-weight:800;font-size:clamp(11px,3vw,15px);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">—</div>
          </div>
          <div style="background:#f5f5f2;border-radius:clamp(8px,2vw,14px);padding:clamp(7px,1.8vw,12px) clamp(6px,1.5vw,10px)">
            <div style="font-size:clamp(6px,1.5vw,8px);font-weight:900;color:#aaa;letter-spacing:1.5px;margin-bottom:clamp(2px,0.6vw,4px);text-transform:uppercase">Latent</div>
            <div id="profitLatent" style="font-family:'Inter',sans-serif;font-weight:800;font-size:clamp(11px,3vw,15px);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">—</div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="wrap" style="background:#f7f3ee">
    <div style="padding:0 14px;padding-top:8px">
    <div style="display:flex;gap:0;margin:0 0 12px;background:#f0ebe4;border-radius:12px;padding:3px">
      <button id="tab-market" onclick="showTab('market')"
        style="flex:1;padding:8px;border-radius:9px;font-size:11px;font-weight:800;text-align:center;cursor:pointer;letter-spacing:.5px;border:none;background:#fff;color:#1a1a1a;box-shadow:0 1px 4px rgba(0,0,0,.1)">Marché</button>
      <button id="tab-feed" onclick="showTab('feed')"
        style="flex:1;padding:8px;border-radius:9px;font-size:11px;font-weight:800;text-align:center;cursor:pointer;letter-spacing:.5px;border:none;background:transparent;color:#aaa">Activité</button>
      <button id="tab-lb" onclick="showTab('lb')"
        style="flex:1;padding:8px;border-radius:9px;font-size:11px;font-weight:800;text-align:center;cursor:pointer;letter-spacing:.5px;border:none;background:transparent;color:#aaa">Classement</button>
    </div>
    <div id="view-market"><div class="loader">Connexion au marché…</div></div>
    <div id="view-feed" style="display:none"></div>
    <div id="view-lb" style="display:none"></div>

    <button onclick="location.href='game.html'" style="display:block;width:100%;margin:16px 0 0;background:#1a1a1a;border:none;border-radius:13px;padding:14px;font-family:'Bebas Neue',sans-serif;font-size:14px;color:#fff;letter-spacing:1px;text-align:center;cursor:pointer">⚓ RETOUR AU PORT</button>

  </div>

    </div>
  </div>

  <div class="ov" id="ov">
    <div class="sheet">
      <div class="sheet-top">
        <div><div class="sheet-sym" id="mSym"></div><div class="st-sym" id="mName"></div></div>
        <div style="display:flex;align-items:center;gap:10px"><div class="sheet-price" id="mPrice"></div><button class="sheet-x" onclick="closeModal()">✕</button></div>
      </div>
      <!-- Sparkline agrandie dans la modal -->
      <svg id="mSpark" width="100%" height="80" viewBox="0 0 300 80" preserveAspectRatio="none" style="display:block;margin-bottom:10px;border-radius:8px;background:#f8f8f8">
        <defs><linearGradient id="mSparkGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#16a34a" stop-opacity="0.2" id="mSparkStop"/>
          <stop offset="100%" stop-color="#16a34a" stop-opacity="0"/>
        </linearGradient></defs>
        <path id="mSparkFill" fill="url(#mSparkGrad)"/>
        <path id="mSparkLine" fill="none" stroke="#16a34a" stroke-width="2.5" id="mSparkStroke"/>
      </svg>
      <div class="tt">
        <button class="tt-btn" id="ttBuy" onclick="setMode('buy')">Acheter</button>
        <button class="tt-btn" id="ttInfo" onclick="setMode('info')" style="flex:0.6;font-size:12px">ℹ Info</button>
        <button class="tt-btn" id="ttSell" onclick="setMode('sell')">Vendre</button>

  const CLAMP_LO=0.40, CLAMP_HI=2.0, HIST=36, RUMOR_BIAS=0.20;
  // Volume & Momentum
  const VOL_WINDOW_MS = 5 * 60 * 1000;  // 5 minutes de fenêtre pour le volume

  const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
  const clamp=(p,c)=>Math.max(c.base*CLAMP_LO,Math.min(c.base*CLAMP_HI,p));

  function stepPrice(sym,p){

    const target = c.base * (1 + combinedBias);
    // Momentum : amplifie la volatilité si tendance consécutive
    const mom = momentum[sym]||0;
    const momBoost = Math.abs(mom) >= MOMENTUM_THRESH ? MOMENTUM_BOOST : 1;
    const noise = c.base * c.vol * gauss() * momBoost;
    p += MEANREV * (target - p) + noise;
    return clamp(p, c);

  // Mise à jour du momentum après chaque tick
  function updateMomentum(sym, oldP, newP){

    } else if (newP < oldP - 0.01) {
      momentum[sym] = m <= 0 ? m - 1 : -1; // baissier
    } else {
      momentum[sym] = 0; // flat = reset
    }
    // Toast momentum — une seule fois par momentum (reset quand flat)
    const nm = momentum[sym];
    if (nm === 0) { momToasted[sym] = null; }
    if (nm === MOMENTUM_THRESH  && momToasted[sym] !== 'up') { showToast(`📈 ${sym} momentum haussier !`, false); momToasted[sym]='up'; }
    if (nm === -MOMENTUM_THRESH && momToasted[sym] !== 'dn') { showToast(`📉 ${sym} momentum baissier !`, true);  momToasted[sym]='dn'; }
  }

  // Calcul du biais volume depuis bourse_feed (dernières 5 min)
  async function updateVolumeBias(){
    const now = Date.now();
    if (now - lastVolFetch < 30000) return; // max toutes les 30s
    lastVolFetch = now;
    try {
      const since = new Date(now - VOL_WINDOW_MS).toISOString();
      const { data } = await sb.from('bourse_feed')
        .select('sym,action,amount')
        .gt('created_at', since);
      const agg = {}; // { sym: { buy: 0, sell: 0 } }
      (data||[]).forEach(f=>{
        if (!agg[f.sym]) agg[f.sym] = { buy:0, sell:0 };
        if (f.action === 'a acheté') agg[f.sym].buy += (f.amount||0);
        else agg[f.sym].sell += (f.amount||0);
      });
      COMPANIES.forEach(c=>{
        const a = agg[c.sym];
        if (!a || (a.buy + a.sell) < 1000) { volBias[c.sym] = 0; return; }
        const total = a.buy + a.sell;
        const ratio = (a.buy - a.sell) / total; // [-1, +1]
        volBias[c.sym] = ratio * VOL_BIAS_MAX;
        // Afficher indicateur dans le UI si fort déséquilibre
        const el = document.getElementById('vol-'+c.sym);
        if (el) {
          if (Math.abs(ratio) > 0.3) {
            const arrow = ratio > 0 ? '▲' : '▼';
            const col   = ratio > 0 ? '#16a34a' : '#dc2626';
            el.innerHTML = `<span style="color:${col};font-size:10px;font-weight:700">${arrow} Pression ${ratio>0?'acheteuse':'vendeuse'} (${Math.round(Math.abs(ratio)*100)}%)</span>`;
          } else {
            el.innerHTML = '';
          }
        }
      });
    } catch(e){ console.log('vol bias error:', e); }
  }

  async function syncMarket(first){

    await updateVolumeBias();
    try {
      const { data:rum } = await sb.from('bourse_rumors').select('sym,dir,truth,expires_at').gt('expires_at', new Date().toISOString());

    const now=Date.now();

    const writes=[];

    COMPANIES.forEach(c=>{
      let row=map[c.sym];
      let p = row ? Number(row.price) : c.base;
      const age = row ? (now - new Date(row.updated_at).getTime()) : TICK_MS;
      if (age >= TICK_MS-600 || !row) {
        const steps = Math.min(Math.max(1, Math.floor(age/TICK_MS)), 240);
        for(let i=0;i<steps;i++) p = stepPrice(c.sym,p);
        if (krachNow) p = clamp(p*KRACH_M, c);
        stepped.push(c.sym);
      }
      const oldPrice = prices[c.sym];
      prev[c.sym]=prices[c.sym];
      prices[c.sym]=p;
      hist[c.sym].push(p); if(hist[c.sym].length>HIST) hist[c.sym].shift();
      if (stepped.includes(c.sym)) updateMomentum(c.sym, oldPrice, p);
    });
    // Déclencher événement narratif (nouveau système)
    checkEventExpiry();
    if(!activeEvent && !krachNow && Math.random()<EVENT_PROB){
      triggerEvent(EVENTS[Math.floor(Math.random()*EVENTS.length)]);
    }
    stepped.forEach(sym=>writes.push({ sym, price:Number(prices[sym].toFixed(2)), updated_at:new Date(now).toISOString() }));
    if (krachNow) showToast('🌪️ KRACH BOURSIER — tout le marché chute !', true);

    if (currentTab==='market') refresh();
    if (modalSym) updateModal();
    updateWallet();
  }

  function drawSpark(c){
    const d=hist[c.sym]; const sp=document.getElementById('sp-'+c.sym); if(!sp) return;

      return;
    }
    if(wrap){wrap.style.height='';wrap.style.padding='';wrap.style.margin='';}
    const min=Math.min(...d),max=Math.max(...d),rng=(max-min)||c.base*0.01||1;
    const pts=d.map((v,i)=>`${(i/(d.length-1))*300},${42-((v-min)/rng)*38-2}`).join(' ');
    const col=d[d.length-1]>=d[0]?'#34d399':'#f87171';

  let portHistory = [];

  function updateWallet(){
    // CAC PORT — moyenne pondérée de toutes les actions
    var cacNow = 0, cacBase = 0, cnt = 0;
    COMPANIES.forEach(function(co){
      if(prices[co.sym] && co.base){
        cacNow += prices[co.sym];
        cacBase += co.base;
        cnt++;
      }
    });
    if(cnt > 0){
      var cacPct = ((cacNow - cacBase) / cacBase * 100);
      var cacEl = document.getElementById('cacVal');
      var cacChgEl = document.getElementById('cacChg');
      var cacFill = document.getElementById('cacSparkFill');
      var cacLine = document.getElementById('cacSparkLine');
      if(cacEl) cacEl.textContent = Math.round(cacNow).toLocaleString('fr-FR') + ' pts';
      if(cacChgEl){
        cacChgEl.textContent = (cacPct >= 0 ? '▲ +' : '▼ ') + cacPct.toFixed(2) + '%';
        cacChgEl.style.color = cacPct >= 0 ? '#16a34a' : '#dc2626';
      }
      // Sparkline CAC
      var cacHists = [];
      COMPANIES.forEach(function(co){ if(hist[co.sym] && hist[co.sym].length > 1) cacHists.push(hist[co.sym]); });
      if(cacHists.length > 0){
        var len = cacHists[0].length;
        var pts = [];
        for(var i=0;i<len;i++){
          var sum2=0,cnt2=0;
          cacHists.forEach(function(h){ if(h[i]!==undefined){sum2+=h[i];cnt2++;} });
          if(cnt2>0) pts.push(sum2/cnt2);
        }
        if(pts.length > 1){
          var mn2=Math.min(...pts), mx2=Math.max(...pts), rng2=mx2-mn2||1;
          var W2=80,H2=32,p2=3;
          var coords = pts.map(function(v,i){ return [(i/(pts.length-1))*(W2-p2*2)+p2, H2-p2-(v-mn2)/rng2*(H2-p2*2)]; });
          var l2 = 'M'+coords.map(function(p){ return p[0].toFixed(1)+','+p[1].toFixed(1); }).join(' L');
          var f2 = l2+' L'+(W2-p2)+','+(H2-p2)+' L'+p2+','+(H2-p2)+' Z';
          var clr2 = cacPct >= 0 ? '#16a34a' : '#dc2626';
          if(cacLine){ cacLine.setAttribute('d',l2); cacLine.setAttribute('stroke',clr2); }
          if(cacFill){ cacFill.setAttribute('d',f2); cacFill.setAttribute('fill', (cacPct>=0?'rgba(22,163,74,.12)':'rgba(220,38,38,.12)')); }
        }
      }
    }
    const pv = portfolioValue();
    const total = cash + pv;
    document.getElementById('cash').textContent=fmt(cash)+'€';

    // Portfolio chart mini — cap strict
    if(portHistory.length === 0 || portHistory[portHistory.length-1] !== total){
      portHistory.push(total);
      if (portHistory.length > 30) portHistory.shift();
    }
    const pcVal = document.getElementById('pcVal');
    const pcChg = document.getElementById('pcChg');
    if (pcVal) {
      pcVal.textContent = fmt(total)+'€';
      // PREVIEW: forcer valeur si pas de données Supabase
      if(total === 0 && window._mockMode) pcVal.textContent = '287 450€';
    }
    if (pcChg && portHistory.length > 1) {
      const first = portHistory[0];
      const diff = total - first;
      const pct = first > 0 ? (diff/first*100) : 0;
      const isUp = diff >= 0;
      pcChg.textContent = (isUp?'▲ +':'▼ ') + fmt(Math.abs(diff)) + '€ (' + (diff>=0?'+':'') + pct.toFixed(1) + '% session)';
      pcChg.style.background = isUp ? '#f0fdf4' : '#fef2f2';
      pcChg.style.color = isUp ? '#16a34a' : '#dc2626';
    } else if(pcChg && portHistory.length <= 1){
      pcChg.textContent = '—';
    }

    // Profit réalisé
    const prEl = document.getElementById('profitRealise');
    if(prEl){
      if(profit === 0){
        prEl.textContent = '—';
        prEl.style.color = 'rgba(0,0,0,0.3)';
      } else {
        prEl.textContent = (profit>0?'+':'')+fmt(profit)+'€';
        prEl.style.color = profit > 0 ? '#16a34a' : '#dc2626';
      }
    }

    // Profit latent = valeur actuelle du portefeuille - coût d'achat
    const latentEl = document.getElementById('profitLatent');
    if(latentEl){
      if(pv <= 0){
        latentEl.textContent = '—';
        latentEl.style.color = 'rgba(0,0,0,0.3)';
      } else {
        let totalCost = 0;
        COMPANIES.forEach(co => {
          const h = holdings[co.sym];
          if(h && h.shares > 0) totalCost += h.cost;
        });
        const latent = pv - totalCost;
        latentEl.textContent = (latent>=0?'+':'')+fmt(latent)+'€';
        latentEl.style.color = latent >= 0 ? '#2563eb' : '#dc2626';
      }
    }

  }

  // ── Modal ──
  function openModal(sym,m){
    modalSym=sym;
    document.getElementById('ov').classList.add('show');
    setMode(m);
    if(m!=='info'){ document.getElementById('amt').value=''; updateModal(); }
    // Remplir sparkline modal
    var c2 = CO[sym];
    if(c2 && histData.length > 1){
      var histData = hist[sym]||[];
      var mn = Math.min(...histData), mx = Math.max(...histData);
      var rng = mx - mn || 1;
      var W=300, H=80, pad=6;
      var pts = histData.map((v,i)=>[(i/(hist.length-1))*(W-pad*2)+pad, H-pad-(v-mn)/rng*(H-pad*2)]);
      var line = 'M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L');
      var fill = line+' L'+(W-pad)+','+(H-pad)+' L'+pad+','+(H-pad)+' Z';
      var sl = document.getElementById('mSparkLine');
      var sf = document.getElementById('mSparkFill');
      var color2 = c2.color || '#16a34a';
      var isUp = histData[histData.length-1] >= histData[0];
      var lineColor = isUp ? '#16a34a' : '#dc2626';
      if(sl){ sl.setAttribute('d',line); sl.setAttribute('stroke',lineColor); }
      if(sf){ sf.setAttribute('d',fill); sf.setAttribute('fill',isUp ? 'url(#mSparkGrad)' : 'url(#mSparkGradDn)'); }
      var stop = document.getElementById('mSparkStop');
      if(stop) stop.setAttribute('stop-color', lineColor);
    }
  }
  function closeModal(){ modalSym=null; document.getElementById('ov').classList.remove('show'); }

  // toggleInfo supprimé — remplacé par openChart
  document.getElementById('ov').addEventListener('click',e=>{ if(e.target.id==='ov') closeModal(); });

        const c=CO[modalSym];
        const riskColor={'Faible':'#16a34a','Moyen':'#d97706','Élevé':'#dc2626','Très élevé':'#dc2626'}[c.risk]||'#6b7280';
        ip.innerHTML=`
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
            <div style="width:40px;height:40px;border-radius:10px;background:${c.color};display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:12px;color:#fff;flex-shrink:0">${c.sym.slice(0,4)}</div>
            <div><div style="font-family:'Bebas Neue',sans-serif;font-size:18px;color:#1a1a1a;letter-spacing:1px">${c.name}</div>
            <div style="font-size:10px;color:rgba(0,0,0,0.4)">${c.sector} · Fondée en ${c.founded}</div></div>
          </div>
          <p style="margin-bottom:10px;color:rgba(0,0,0,0.65)">${c.desc}</p>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <span style="background:#f0f0f0;border-radius:6px;padding:3px 8px;font-size:10px;font-weight:700;color:rgba(0,0,0,0.5)">👥 ${c.employees} employés</span>
            <span style="background:${riskColor}20;border-radius:6px;padding:3px 8px;font-size:10px;font-weight:700;color:${riskColor}">⚠ Risque : ${c.risk}</span>
            <span style="background:#f0f0f0;border-radius:6px;padding:3px 8px;font-size:10px;font-weight:700;color:rgba(0,0,0,0.5)">📊 Vol. ${(c.vol*100).toFixed(1)}%/tick</span>
          </div>`;
      }
      return;
    }
    // Mode trade : cacher le panel info, montrer les éléments
    if(ip) ip.style.display='none';
    if(ar) ar.style.display='flex';
    if(qk) qk.style.display='flex';
    if(pv) pv.style.display='block';
    if(ex){ ex.style.display='block'; ex.className='exec '+m; ex.textContent=m==='buy'?'Acheter':'Vendre'; }
    document.getElementById('amtCur').textContent=m==='buy'?'€':'parts';
    document.getElementById('amt').value='';
    buildQuick(); updateModal();
  }
  function buildQuick(){
    const q=document.getElementById('quick'); const h=holdings[modalSym]; const p=prices[modalSym];
    if(mode==='buy'){
      const maxAff=Math.min(MAX_TRADE, cash);
      q.innerHTML=[['Min',MIN_TRADE],['50%',Math.floor(maxAff*0.5)],['Max',Math.floor(maxAff)]].map(([t,v])=>`<button class="quick-btn" onclick="setAmt(${v})">${t}</button>`).join('');
    } else {
      const sh=h?h.shares:0;
      q.innerHTML=[['25%',Math.floor(sh*0.25)],['50%',Math.floor(sh*0.5)],['Tout',sh]].map(([t,v])=>`<button class="quick-btn" onclick="setAmt(${v})">${t}</button>`).join('');
    }
  }
  function setAmt(v){ document.getElementById('amt').value=v; updateModal(); }
  document.getElementById('amt').addEventListener('input',updateModal);

  function cooldownLeft(sym){ return (cooldowns[sym]||0)+COOLDOWN-Date.now(); }

  function updateModal(){
    if(!modalSym) return;
    const c=CO[modalSym]; const p=prices[modalSym]; const h=holdings[modalSym];
    document.getElementById('mSym').textContent=c.name;
    document.getElementById('mName').textContent=c.sym;
    document.getElementById('mPrice').textContent=fmt2(p)+'€';
    const val=parseFloat(document.getElementById('amt').value)||0;
    const ex=document.getElementById('exec'); const pv=document.getElementById('preview');
    const cd=cooldownLeft(modalSym);
    if(cd>0){ pv.innerHTML=`⏳ Attends <b>${Math.ceil(cd/1000)}s</b> avant de retrader ${c.sym}`; ex.disabled=true; return; }
    if(mode==='buy'){
      if(val<MIN_TRADE){ pv.innerHTML=`Mise minimum : <b>${fmt(MIN_TRADE)}€</b>`; ex.disabled=true; return; }
      if(val>MAX_TRADE){ pv.innerHTML=`Mise maximum : <b>${fmt(MAX_TRADE)}€</b>`; ex.disabled=true; return; }
      if(val>cash){ pv.innerHTML='Liquidités insuffisantes'; ex.disabled=true; return; }
      const shares=Math.floor(val/(p*(1+FEE)));
      if(shares<1){ pv.innerHTML='Pas assez pour 1 part'; ex.disabled=true; return; }
      const cost=shares*p, fee=cost*FEE, total=cost+fee;
      pv.innerHTML=`<b>${shares} parts</b> à ${fmt2(p)}€<br>Frais 5% : ${fmt(fee)}€ · Total : <b>${fmt(total)}€</b>`;
      ex.disabled=false;
    } else {
      const sh=Math.min(Math.floor(val), h?h.shares:0);
      if(sh<1){ pv.innerHTML='Saisis un nombre de parts'; ex.disabled=true; return; }
      const gross=sh*p, fee=gross*FEE, net=gross-fee;
      const costPortion=h?h.cost*(sh/h.shares):0, pl=net-costPortion;
      pv.innerHTML=`<b>${sh} parts</b> → ${fmt(gross)}€ − frais ${fmt(fee)}€ = <b>${fmt(net)}€</b><br>Résultat : <b style="color:${pl>=0?'#34d399':'#f87171'}">${pl>=0?'+':''}${fmt(pl)}€</b>`;
      ex.disabled=false;
    }
  }

  async function execTrade(){
    if(!modalSym) return;
    if(cooldownLeft(modalSym)>0) return;
    const c=CO[modalSym]; let p=prices[modalSym];
    const val=parseFloat(document.getElementById('amt').value)||0;
    let feedAction, feedAmount;

    if(mode==='buy'){
      if(val<MIN_TRADE||val>MAX_TRADE||val>cash) return;
      const shares=Math.floor(val/(p*(1+FEE))); if(shares<1) return;
      const cost=shares*p, fee=cost*FEE, total=cost+fee;
      cash-=total;
      const h=holdings[c.sym]||{shares:0,cost:0};
      h.shares+=shares; h.cost+=total;     // coût = cash dépensé (frais inclus)
      holdings[c.sym]=h;
      p = clamp(p*(1 + total/IMPACT_LIQ), c);   // impact haussier
      feedAction='a acheté'; feedAmount=total;
      showToast(`Achat ${c.sym} · ${shares} parts`, false);
      // Commission 3% au propriétaire de l'entreprise
      if(c.uid && c.uid !== currentUser.id){
        const commission = Math.round(cost * 0.03);
        if(commission > 0){
          try {
            const { data:ownerGs } = await sb.from('game_stats').select('money').eq('user_id',c.uid).maybeSingle();
            if(ownerGs){ await sb.from('game_stats').update({money:(ownerGs.money||0)+commission}).eq('user_id',c.uid); }
          } catch(e){}
        }
      }
    } else {
      const h=holdings[c.sym]; if(!h) return;
      const sh=Math.min(Math.floor(val), h.shares); if(sh<1) return;
      const gross=sh*p, fee=gross*FEE, net=gross-fee;
      const costPortion=h.cost*(sh/h.shares), realized=net-costPortion;
      cash+=net; h.shares-=sh; h.cost-=costPortion;
      if(h.shares<1) delete holdings[c.sym];
      profit+=realized; if(realized>best) best=realized;
      p = clamp(p*(1 - gross/IMPACT_LIQ), c);   // impact baissier
      feedAction='a vendu'; feedAmount=gross;
      showToast(`Vente ${c.sym} · ${realized>=0?'+':''}${fmt(realized)}€`, realized<0);
    }
    cooldowns[c.sym]=Date.now();
    prices[c.sym]=p;
    await Promise.all([ save(), pushFeed(feedAction, c.sym, feedAmount), pushMarket(c.sym, p) ]);
    refresh(); updateModal();
    if(mode==='sell' && !holdings[c.sym]) closeModal();
  }

  async function save(){
    try {
      await sb.from('game_stats').update({
        money: Math.round(cash),
        bourse: { h:holdings, cd:cooldowns },
        bourse_profit: Math.round(profit),
        bourse_best: Math.round(best)
      }).eq('user_id', currentUser.id);
    } catch(e){ console.log('save:',e); }
  }
  async function pushMarket(sym,p){ try{ await sb.from('bourse_market').upsert({ sym, price:Number(p.toFixed(2)), updated_at:new Date().toISOString() }, { onConflict:'sym' }); }catch(e){} }
  async function pushFeed(action,sym,amount){ try{ await sb.from('bourse_feed').insert({ user_id:currentUser.id, username, action, sym, amount:Math.round(amount) }); }catch(e){} }

  // ── Activité ──
  async function loadFeed(){
    const el=document.getElementById('view-feed');
    el.innerHTML='<div class="muted">Chargement…</div>';
    try {
      const { data } = await sb.from('bourse_feed').select('*').order('created_at',{ascending:false}).limit(20);
      if(!data||!data.length){ el.innerHTML='<div class="muted">Aucune transaction récente.</div>'; return; }
      const now=Date.now();
      function timeAgo(ts){
        const s=Math.floor((now-new Date(ts).getTime())/1000);
        if(s<60) return "maintenant";
        if(s<3600) return 'il y a '+Math.floor(s/60)+'min';
        if(s<86400) return 'il y a '+Math.floor(s/3600)+'h';
        return 'il y a '+Math.floor(s/86400)+'j';
      }
      el.innerHTML=data.map(f=>{
        const co=CO[f.sym]; const nm=co?co.name:f.sym;
        const isEvent = f.username==='FLASH MARCHE';
        const isBuy = f.action==='a acheté';
        const cls = isEvent ? (f.amount>=0?'buy':'sell') : isBuy?'buy':'sell';
        const me = !isEvent && f.user_id===currentUser?.id?' <span style="background:#f0fdf4;border:1px solid #86efac;border-radius:6px;padding:1px 5px;font-size:9px;color:#16a34a;font-weight:700">MOI</span>':'';
        if(isEvent){
          return `<div class="feed-line" style="background:#fffbeb;border-radius:10px;margin-bottom:4px">
            <div style="font-size:16px;line-height:1;margin-right:2px">${isBuy?'📈':'📉'}</div>
            <div class="feed-body">
              <div class="feed-text" style="font-weight:800;color:#92400e">FLASH MARCHÉ</div>
              <div style="font-size:12px;color:#78350f;margin-top:2px">${f.action}</div>
              <div class="feed-meta">${timeAgo(f.created_at)}</div>
            </div>
          </div>`;
        }
        return `<div class="feed-line">
          <div class="feed-dot ${cls}"></div>
          <div class="feed-body">
            <div class="feed-text"><b>${f.username||'Docker'}</b>${me} ${f.action==='a acheté'?'a acheté':'a vendu'} <b>${nm}</b></div>
            <div class="feed-meta">${timeAgo(f.created_at)} · ${isBuy?'Achat':'Vente'}</div>
          </div>
          <div class="feed-badge ${cls}">${fmt(f.amount)}€</div>
        </div>`;
      }).join('');
    } catch(e){ el.innerHTML='<div class="muted">Indisponible.</div>'; }
  }

  // ── Classement traders ──
  async function loadLeaderboard(){
    const el=document.getElementById('view-lb');
    el.innerHTML='<div class="muted">Chargement…</div>';
    try {
      // Récupérer game_stats + bourse_feed pour les noms (join via feed)
      const { data } = await sb.from('game_stats')
        .select('user_id,bourse_profit,bourse_best')
        .order('bourse_profit',{ascending:false}).limit(15);
      const rows=(data||[]);
      const filteredRows = rows.filter(r=>(r.bourse_profit||0)>0);
      if(!filteredRows.length){ el.innerHTML='<div class="muted">Pas encore de traders classés.<br><span style="font-size:11px">Fais un profit pour apparaître !</span></div>'; return; }
      const ids=filteredRows.map(r=>r.user_id);
      // Essai join profiles, fallback sur bourse_feed
      let nameOf={};
      try {
        const { data:profs } = await sb.from('profiles').select('user_id,username').in('user_id',ids);
        (profs||[]).forEach(p=>nameOf[p.user_id]=p.username);
      } catch(_) {}
      // Fallback : usernames depuis le feed
      if(!Object.keys(nameOf).length){
        try {
          const { data:feedNames } = await sb.from('bourse_feed').select('user_id,username').in('user_id',ids).limit(50);
          (feedNames||[]).forEach(f=>{ if(!nameOf[f.user_id]) nameOf[f.user_id]=f.username; });
        } catch(_) {}
      }
      const medals=['🥇','🥈','🥉'];
      // Calculer le score de la semaine = profit réalisé (on n'a pas d'historique semaine,
      // on affiche le profit total avec mise en avant du n°1)
      const sorted = [...filteredRows].sort((a,b)=>(b.bourse_profit||0)-(a.bourse_profit||0));
      const winner = sorted[0];
      const winnerName = nameOf[winner?.user_id]||'Docker';

      // Banner trader de la semaine
      let html = '';
      if(winner){
        html += `<div style="background:linear-gradient(135deg,#fef3c7,#fde68a);border:1px solid #fbbf24;
          border-radius:14px;padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;gap:12px">
          <div style="font-size:32px">🏆</div>
          <div style="flex:1">
            <div style="font-size:8px;font-weight:900;color:rgba(0,0,0,.4);letter-spacing:2px;margin-bottom:2px">TRADER N°1</div>
            <div style="font-family:'Bebas Neue',sans-serif;font-size:18px;color:#92400e;letter-spacing:1px">${winnerName}</div>
            <div style="font-size:11px;color:#b45309;font-weight:700;margin-top:1px">+${fmt(winner.bourse_profit||0)}€ de profit total</div>
          </div>
          <div style="font-size:28px">🥇</div>
        </div>`;
      }

      html += sorted.map((r,i)=>{
        const isMe = r.user_id===currentUser?.id;
        const name = nameOf[r.user_id]||'Docker';
        const prof = r.bourse_profit||0;
        return `<div class="lb-line${isMe?' lb-me':''}">
          <div class="lb-rank">${medals[i]||(i+1)}</div>
          <div class="lb-name" style="flex:1">
            <div>${name}${isMe?' 👈':''}</div>
            <div class="lb-best">Meilleur trade : +${fmt(r.bourse_best||0)}€</div>
          </div>
          <div style="text-align:right">
            <div class="lb-val" style="color:${prof>0?'#16a34a':prof<0?'#dc2626':'#888'}">${prof>=0?'+':''}${fmt(prof)}€</div>
            ${isMe?'<div style="font-size:9px;color:#16a34a;font-weight:700">MOI</div>':''}
          </div>
        </div>`;
      }).join('');
      el.innerHTML = html;
    } catch(e){ console.log('lb error:',e); el.innerHTML='<div class="muted">Indisponible.</div>'; }
  }

  let toastT=null;
  function showToast(msg,bad){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show'+(bad?' bad':''); clearTimeout(toastT); toastT=setTimeout(()=>t.className='toast'+(bad?' bad':''),2600); }

  window.addEventListener('beforeunload',()=>{ if(tickInt) clearInterval(tickInt); });
  init();
</script>

        </defs>
        <path id="chartFill" fill="url(#chartGrad)"/>
        <path id="chartLine" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linejoin="round"/>
        <line id="chartCross" x1="0" y1="0" x2="0" y2="160" stroke="rgba(0,0,0,.15)" stroke-width="1" stroke-dasharray="4,4" display="none"/>
        <circle id="chartDot" cx="0" cy="0" r="5" fill="#16a34a" display="none"/>
      </svg>
      <div id="chartTooltip" style="position:absolute;top:4px;left:50%;transform:translateX(-50%);
        background:#1a1a1a;color:#fff;font-size:11px;font-weight:700;padding:4px 10px;
        border-radius:8px;pointer-events:none;display:none"></div>
    </div>
    <div class="chart-stat-row">
      <div class="chart-stat">
        <div class="chart-stat-v" id="chartHigh">—</div>
        <div class="chart-stat-l">PLUS HAUT</div>
      </div>
      <div class="chart-stat">
        <div class="chart-stat-v" id="chartLow">—</div>
        <div class="chart-stat-l">PLUS BAS</div>
      </div>
      <div class="chart-stat">
        <div class="chart-stat-v" id="chartBase">—</div>
        <div class="chart-stat-l">PRIX BASE</div>
      </div>
    </div>
    <div id="chartPosition" style="margin-top:8px"></div>
  </div>
</div>
<script>
// ── GRAPHIQUE INTERACTIF ──
let chartSym=null, chartPeriod='all';

function openChart(sym){
  chartSym=sym;chartPeriod='all';
  document.getElementById('chartBg').classList.add('on');
  renderChart();
}
function closeChart(){
  document.getElementById('chartBg').classList.remove('on');
  chartSym=null;
}
function setChartPeriod(p,btn){
  chartPeriod=p;
  document.querySelectorAll('.chart-period').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  renderChart();
}
function renderChart(){
  if(!chartSym)return;
  const co=CO[chartSym]; if(!co)return;
  const p=prices[chartSym]||co.base;
  const h=hist[chartSym]||[p];
  const pct=((p-co.base)/co.base*100);
  const isUp=pct>=0;

  document.getElementById('chartTitle').textContent=co.name||chartSym;
  document.getElementById('chartSym').textContent=chartSym;
  document.getElementById('chartPrice').textContent=fmt2(p)+'€';
  const chgEl=document.getElementById('chartChg');
  chgEl.textContent=(isUp?'▲ +':'▼ ')+Math.abs(pct).toFixed(2)+'% vs prix de base';
  chgEl.style.color=isUp?'#16a34a':'#dc2626';

  // Choisir les données selon la période
  let data=h;
  if(chartPeriod==='half') data=h.slice(Math.floor(h.length/2));
  else if(chartPeriod==='quarter') data=h.slice(Math.floor(h.length*3/4));
  if(!data.length) data=[p];

  const mn=Math.min(...data), mx=Math.max(...data), rng=mx-mn||1;
  const W=400,H=150,pad=8;
  const pts=data.map((v,i)=>{
    const x=pad+(i/(data.length-1||1))*(W-pad*2);
    const y=H-pad-((v-mn)/rng)*(H-pad*2);
    return[x.toFixed(1),y.toFixed(1)];
  });
  const lineD='M'+pts.map(p=>p.join(',')).join(' L');
  const fillD=lineD+' L'+pts[pts.length-1][0]+','+(H+2)+' L'+pts[0][0]+','+(H+2)+' Z';
  const col=isUp?'#16a34a':'#dc2626';
  const gradStop=document.querySelector('#chartGrad stop:first-child');
  const gradStop2=document.querySelector('#chartGrad stop:last-child');
  if(gradStop) gradStop.setAttribute('stop-color',col);
  if(gradStop2) gradStop2.setAttribute('stop-color',col);
  document.getElementById('chartLine').setAttribute('d',lineD);
  document.getElementById('chartLine').setAttribute('stroke',col);
  document.getElementById('chartFill').setAttribute('d',fillD);
  document.getElementById('chartFill').setAttribute('fill','url(#chartGrad)');

  document.getElementById('chartHigh').textContent=fmt2(mx)+'€';
  document.getElementById('chartLow').textContent=fmt2(mn)+'€';
  document.getElementById('chartBase').textContent=fmt2(co.base)+'€';

  // Position perso
  const h2=holdings[chartSym];
  const posEl=document.getElementById('chartPosition');
  if(h2&&h2.shares>0){
    const val=h2.shares*p, pl=val-h2.cost;
    const plPct=h2.cost?pl/h2.cost*100:0;
    posEl.innerHTML='<div style="background:'+(pl>=0?'#f0fdf4':'#fef2f2')+';border:1px solid '+(pl>=0?'#86efac':'#fca5a5')+';border-radius:12px;padding:10px 12px;">'+
      '<div style="font-size:8px;font-weight:900;color:rgba(0,0,0,.35);letter-spacing:2px;margin-bottom:4px">MA POSITION</div>'+
      '<div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700">'+
      '<span>'+h2.shares+' parts · PRU '+fmt2(h2.cost/h2.shares)+'€</span>'+
      '<span style="color:'+(pl>=0?'#16a34a':'#dc2626')+'">'+(pl>=0?'+':'')+fmt(pl)+'€ ('+(plPct>=0?'+':'')+plPct.toFixed(1)+'%)</span>'+
      '</div></div>';
  } else {
    posEl.innerHTML='';
  }

  // Interaction touch/mouse
  const svg=document.getElementById('chartSvg');
  function handleChartMove(e){
    const rect=svg.getBoundingClientRect();
    const clientX=e.touches?e.touches[0].clientX:e.clientX;
    const rx=(clientX-rect.left)/rect.width;
    const idx=Math.round(rx*(data.length-1));
    if(idx<0||idx>=data.length)return;
    const v=data[idx];
    const x=pts[idx][0], y=pts[idx][1];
    const cross=document.getElementById('chartCross');
    const dot=document.getElementById('chartDot');
    const tip=document.getElementById('chartTooltip');
    cross.setAttribute('x1',x);cross.setAttribute('x2',x);cross.setAttribute('display','block');
    dot.setAttribute('cx',x);dot.setAttribute('cy',y);dot.setAttribute('fill',col);dot.setAttribute('display','block');
    tip.textContent=fmt2(v)+'€';tip.style.display='block';
    tip.style.left=Math.min(Math.max(rx*100,10),85)+'%';
  }
  function hideChartCursor(){
    document.getElementById('chartCross').setAttribute('display','none');
    document.getElementById('chartDot').setAttribute('display','none');
    document.getElementById('chartTooltip').style.display='none';
  }
  svg.onmousemove=handleChartMove;svg.ontouchmove=handleChartMove;
  svg.onmouseleave=hideChartCursor;svg.ontouchend=hideChartCursor;
}
</script>
</body>
</html>
