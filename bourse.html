<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bourse du Fret - Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  body { font-family:'Inter',sans-serif; background:#030a0f; color:#e8f0ee; min-height:100dvh; overflow-x:hidden; }
  .bg-grid { position:fixed; inset:0; z-index:0; background:
      linear-gradient(180deg,#020c14,#041520 55%,#020c14),
      linear-gradient(rgba(52,211,153,0.035) 1px,transparent 1px),
      linear-gradient(90deg,rgba(52,211,153,0.035) 1px,transparent 1px);
    background-size:100% 100%, 32px 32px, 32px 32px; pointer-events:none; }
  .wrap { position:relative; z-index:1; max-width:540px; margin:0 auto; padding:0 14px 40px; }

  .hdr { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px;
    padding:14px 4px; background:linear-gradient(180deg,#030a0f,rgba(3,10,15,0.85)); backdrop-filter:blur(8px); }
  .back-btn { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:9px;
    padding:8px 12px; font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:1px; color:rgba(255,255,255,0.7); cursor:pointer; }
  .back-btn:active { transform:scale(0.95); }
  .hdr-title { flex:1; font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:3px;
    background:linear-gradient(135deg,#34d399,#6ee7b7,#34d399); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }

  .wallet { display:flex; gap:10px; margin-bottom:12px; }
  .wallet-box { flex:1; background:rgba(52,211,153,0.05); border:1px solid rgba(52,211,153,0.15); border-radius:14px; padding:12px 14px; }
  .wallet-lbl { font-size:9px; letter-spacing:2px; text-transform:uppercase; color:rgba(255,255,255,0.35); margin-bottom:4px; }
  .wallet-val { font-family:'Bebas Neue',sans-serif; font-size:23px; letter-spacing:1px; color:#34d399; line-height:1; }
  .wallet-val.cash { color:#fff; }

  .tabs { display:flex; gap:6px; margin-bottom:12px; }
  .tab { flex:1; padding:9px; border-radius:10px; border:1px solid rgba(255,255,255,0.08); background:rgba(255,255,255,0.03);
    font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:1px; color:rgba(255,255,255,0.5); cursor:pointer; }
  .tab.act { background:rgba(52,211,153,0.12); border-color:rgba(52,211,153,0.4); color:#34d399; }

  .stock { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.07); border-radius:16px; padding:14px; margin-bottom:10px; transition:border-color .2s; }
  .stock.holding { border-color:rgba(52,211,153,0.3); background:rgba(52,211,153,0.04); }
  .stock-top { display:flex; align-items:center; gap:12px; }
  .stock-badge { width:42px; height:42px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-family:'Bebas Neue',sans-serif; font-size:13px; color:#fff; flex-shrink:0; letter-spacing:0.5px; }
  .stock-id { flex:1; min-width:0; }
  .stock-sym { font-family:'Bebas Neue',sans-serif; font-size:17px; letter-spacing:1px; color:#fff; }
  .stock-name { font-size:10px; color:rgba(255,255,255,0.4); }
  .stock-price-wrap { text-align:right; }
  .stock-price { font-family:'Bebas Neue',sans-serif; font-size:21px; letter-spacing:0.5px; color:#fff; line-height:1; }
  .stock-chg { font-size:11px; font-weight:700; margin-top:2px; }
  .up { color:#34d399; } .down { color:#f87171; } .flat { color:rgba(255,255,255,0.4); }
  .spark { width:100%; height:42px; margin:10px 0 4px; display:block; }
  .pos { display:flex; align-items:center; justify-content:space-between; gap:8px; background:rgba(0,0,0,0.25); border:1px solid rgba(52,211,153,0.12); border-radius:10px; padding:7px 11px; margin-top:6px; font-size:12px; }
  .pos-lbl { color:rgba(255,255,255,0.45); } .pos-pl { font-family:'Bebas Neue',sans-serif; font-size:15px; letter-spacing:0.5px; }
  .btns { display:flex; gap:8px; margin-top:9px; }
  .btn { flex:1; padding:10px; border:none; border-radius:11px; font-family:'Bebas Neue',sans-serif; font-size:14px; letter-spacing:1px; cursor:pointer; transition:transform .1s; }
  .btn:active { transform:scale(0.96); }
  .btn-buy  { background:linear-gradient(135deg,#059669,#34d399); color:#022; }
  .btn-sell { background:rgba(248,113,113,0.12); border:1px solid rgba(248,113,113,0.4); color:#fca5a5; }
  .btn:disabled { opacity:0.4; cursor:default; }
  .cooldn { font-size:10px; color:rgba(255,255,255,0.4); text-align:center; margin-top:6px; }

  .feed-line, .lb-line { display:flex; align-items:center; gap:8px; padding:8px 10px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); border-radius:10px; margin-bottom:6px; font-size:12px; }
  .lb-rank { font-family:'Bebas Neue',sans-serif; font-size:16px; color:#34d399; min-width:26px; }
  .lb-name { flex:1; color:#fff; font-weight:600; }
  .lb-val { font-family:'Bebas Neue',sans-serif; color:#34d399; }
  .lb-best { font-size:10px; color:rgba(255,255,255,0.4); }
  .muted { color:rgba(255,255,255,0.35); text-align:center; padding:30px 10px; font-size:13px; }

  .ov { position:fixed; inset:0; z-index:100; background:rgba(0,0,0,0.8); backdrop-filter:blur(8px); display:none; align-items:flex-end; justify-content:center; }
  .ov.show { display:flex; }
  .sheet { width:100%; max-width:540px; background:#0a1620; border-top:1px solid rgba(52,211,153,0.2); border-radius:22px 22px 0 0; padding:22px 18px calc(22px + env(safe-area-inset-bottom)); animation:slideUp .25s ease; }
  @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
  .sheet-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .sheet-sym { font-family:'Bebas Neue',sans-serif; font-size:23px; letter-spacing:1px; color:#fff; }
  .sheet-price { font-family:'Bebas Neue',sans-serif; font-size:20px; color:#34d399; }
  .sheet-x { background:rgba(255,255,255,0.08); border:none; color:#fff; width:30px; height:30px; border-radius:50%; font-size:15px; cursor:pointer; }
  .tt { display:flex; gap:8px; margin:14px 0; }
  .tt-btn { flex:1; padding:10px; border-radius:10px; border:1px solid rgba(255,255,255,0.1); background:none; font-family:'Bebas Neue',sans-serif; font-size:15px; letter-spacing:1px; color:rgba(255,255,255,0.5); cursor:pointer; }
  .tt-btn.act-buy  { background:rgba(52,211,153,0.15); border-color:rgba(52,211,153,0.5); color:#34d399; }
  .tt-btn.act-sell { background:rgba(248,113,113,0.12); border-color:rgba(248,113,113,0.5); color:#fca5a5; }
  .amt-row { display:flex; align-items:center; gap:8px; background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:6px 10px; margin-bottom:10px; }
  .amt-input { flex:1; background:none; border:none; outline:none; color:#fff; font-family:'Bebas Neue',sans-serif; font-size:24px; letter-spacing:1px; text-align:center; -webkit-user-select:text; user-select:text; }
  .amt-cur { font-family:'Bebas Neue',sans-serif; font-size:16px; color:rgba(255,255,255,0.4); }
  .quick { display:flex; gap:6px; margin-bottom:12px; }
  .quick-btn { flex:1; padding:8px; border-radius:9px; border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.03); color:rgba(255,255,255,0.6); font-size:12px; font-weight:700; cursor:pointer; }
  .preview { font-size:12px; color:rgba(255,255,255,0.5); text-align:center; margin-bottom:14px; line-height:1.6; min-height:34px; }
  .preview b { color:#fff; }
  .exec { width:100%; padding:15px; border:none; border-radius:13px; font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:1.5px; cursor:pointer; }
  .exec.buy  { background:linear-gradient(135deg,#059669,#34d399); color:#022; }
  .exec.sell { background:linear-gradient(135deg,#dc2626,#f87171); color:#fff; }
  .exec:disabled { opacity:0.4; cursor:default; }

  .toast { position:fixed; top:64px; left:50%; transform:translateX(-50%) translateY(-20px); z-index:200; background:rgba(10,22,32,0.97); border:1px solid rgba(52,211,153,0.3); border-radius:12px; padding:11px 18px; font-size:12px; font-weight:600; opacity:0; transition:all .35s; max-width:90%; text-align:center; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.bad { border-color:rgba(248,113,113,0.5); color:#fca5a5; }
  .hint { font-size:11px; color:rgba(255,255,255,0.3); text-align:center; margin:2px 0 12px; line-height:1.5; }
  .loader { text-align:center; padding:70px 20px; color:rgba(255,255,255,0.3); font-family:'Bebas Neue',sans-serif; letter-spacing:2px; }
</style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="wrap">
    <div class="hdr">
      <button class="back-btn" onclick="window.location.href='game.html'">← Retour</button>
      <div class="hdr-title">Bourse du Fret</div>
    </div>
    <div class="wallet">
      <div class="wallet-box"><div class="wallet-lbl">Liquidités</div><div class="wallet-val cash" id="cash">—</div></div>
      <div class="wallet-box"><div class="wallet-lbl">Portefeuille</div><div class="wallet-val" id="portfolio">—</div></div>
    </div>
    <div class="hint">Marché partagé · frais 5% · mise 5 000–150 000 € · 30 s entre 2 trades d'une même compagnie</div>
    <div class="tabs">
      <button class="tab act" id="tab-market" onclick="showTab('market')">Marché</button>
      <button class="tab" id="tab-feed" onclick="showTab('feed')">Activité</button>
      <button class="tab" id="tab-lb" onclick="showTab('lb')">Traders</button>
    </div>
    <div id="view-market"><div class="loader">Connexion au marché…</div></div>
    <div id="view-feed" style="display:none"></div>
    <div id="view-lb" style="display:none"></div>
  </div>

  <div class="ov" id="ov">
    <div class="sheet">
      <div class="sheet-top">
        <div><div class="sheet-sym" id="mSym"></div><div class="stock-name" id="mName"></div></div>
        <div style="display:flex;align-items:center;gap:10px"><div class="sheet-price" id="mPrice"></div><button class="sheet-x" onclick="closeModal()">✕</button></div>
      </div>
      <div class="tt">
        <button class="tt-btn" id="ttBuy" onclick="setMode('buy')">Acheter</button>
        <button class="tt-btn" id="ttSell" onclick="setMode('sell')">Vendre</button>
      </div>
      <div class="amt-row"><input class="amt-input" id="amt" type="number" inputmode="numeric" placeholder="0"><span class="amt-cur" id="amtCur">€</span></div>
      <div class="quick" id="quick"></div>
      <div class="preview" id="preview"></div>
      <button class="exec" id="exec" onclick="execTrade()">Confirmer</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>

<script>
  const SB_URL = 'https://drtsuhnbclhmgfjiykap.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
  const sb = supabase.createClient(SB_URL, SB_KEY);

  // ── 8 compagnies fictives (profils variés) ──
  const COMPANIES = [
    { sym:'CALANCA',  name:'Calanca Lines',     base:120, vol:0.018, color:'#0ea5e9' },
    { sym:'MISTRAL',  name:'Mistral Cargo',     base:90,  vol:0.028, color:'#f59e0b' },
    { sym:'PHOCEA',   name:'Phocéa Maritime',   base:150, vol:0.022, color:'#a855f7' },
    { sym:'STJEAN',   name:'Saint-Jean Shipping',base:60, vol:0.040, color:'#22c55e' },
    { sym:'CAPVERT',  name:'Cap Vert Fret',     base:210, vol:0.015, color:'#14b8a6' },
    { sym:'LACYDON',  name:'Lacydon Container',  base:75,  vol:0.045, color:'#ef4444' },
    { sym:'BONNEMER', name:'Bonne-Mère Lines',  base:110, vol:0.026, color:'#eab308' },
    { sym:'ESTAQUE',  name:'Estaque Maritime',  base:135, vol:0.030, color:'#06b6d4' },
  ];
  const CO = {}; COMPANIES.forEach(c=>CO[c.sym]=c);
  const EVENTS = [
    { t:'⚓ Pénurie de conteneurs', m:0.10, bad:false },
    { t:'📈 Hausse de la demande',  m:0.08, bad:false },
    { t:'🚢 Contrat décroché',      m:0.09, bad:false },
    { t:'🌊 Avarie en mer',         m:-0.09, bad:true },
    { t:'⛔ Retard portuaire',       m:-0.08, bad:true },
  ];

  const TICK_MS=5000, MIN_TRADE=5000, MAX_TRADE=150000, FEE=0.05, COOLDOWN=30000;
  const IMPACT_LIQ=2500000, MEANREV=0.05, EVENT_PROB=0.022, KRACH_PROB=0.0015, KRACH_M=0.65;
  const CLAMP_LO=0.72, CLAMP_HI=1.30, HIST=36, RUMOR_BIAS=0.20;

  let currentUser=null, username='Docker', cash=0;
  let holdings={}, cooldowns={}, profit=0, best=0;
  let prices={}, hist={}, prev={}, tickInt=null, currentTab='market';
  let modalSym=null, mode='buy', biasMap={};

  const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
  const clamp=(p,c)=>Math.max(c.base*CLAMP_LO,Math.min(c.base*CLAMP_HI,p));
  const fmt=n=>Math.round(n).toLocaleString('fr-FR');
  const fmt2=n=>n.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2});

  function stepPrice(sym,p){ const c=CO[sym]; const target=c.base*(1+(biasMap[sym]||0)); p += MEANREV*(target-p) + c.base*c.vol*gauss(); return clamp(p,c); }

  async function init(){
    const { data:{ session } } = await sb.auth.getSession();
    if(!session){ window.location.href='index.html'; return; }
    currentUser=session.user;
    const [{ data: prof }, { data: gs }] = await Promise.all([
      sb.from('profiles').select('username').eq('user_id',currentUser.id).maybeSingle(),
      sb.from('game_stats').select('money,bourse,bourse_profit,bourse_best').eq('user_id',currentUser.id).maybeSingle()
    ]);
    username = prof?.username || 'Docker';
    cash = gs?.money || 0;
    const b = (gs?.bourse && typeof gs.bourse==='object') ? gs.bourse : {};
    holdings = b.h || {}; cooldowns = b.cd || {};
    profit = gs?.bourse_profit || 0; best = gs?.bourse_best || 0;
    COMPANIES.forEach(c=>{ prices[c.sym]=c.base; prev[c.sym]=c.base; hist[c.sym]=Array(HIST).fill(c.base); });
    renderStocks();
    await syncMarket(true);   // lecture + rattrapage
    updateWallet();
    tickInt = setInterval(()=>syncMarket(false), TICK_MS);
  }

  // Lit le marché partagé, fait avancer les cours (1 pas / 5s, ou rattrapage), réécrit en base
  async function syncMarket(first){
    // Biais du marché selon les rumeurs VRAIES encore actives (les tuyaux du Bar)
    biasMap={};
    try {
      const { data:rum } = await sb.from('bourse_rumors').select('sym,dir,truth,expires_at').gt('expires_at', new Date().toISOString());
      (rum||[]).forEach(r=>{ if(r.truth){ biasMap[r.sym]=Math.max(-0.26, Math.min(0.26, (biasMap[r.sym]||0)+r.dir*RUMOR_BIAS)); } });
    } catch(e){}
    let rows=[];
    try { const { data } = await sb.from('bourse_market').select('*'); rows=data||[]; } catch(e){}
    const map={}; rows.forEach(r=>map[r.sym]=r);
    const now=Date.now();
    const krachNow = Math.random()<KRACH_PROB;
    const writes=[];
    const stepped=[];
    COMPANIES.forEach(c=>{
      let row=map[c.sym];
      let p = row ? Number(row.price) : c.base;
      const age = row ? (now - new Date(row.updated_at).getTime()) : TICK_MS;
      if (age >= TICK_MS-600 || !row) {
        const steps = Math.min(Math.max(1, Math.floor(age/TICK_MS)), 240);
        for(let i=0;i<steps;i++) p = stepPrice(c.sym,p);
        if (krachNow) p = clamp(p*KRACH_M, c);
        stepped.push(c.sym);
      }
      prev[c.sym]=prices[c.sym];
      prices[c.sym]=p;
      hist[c.sym].push(p); if(hist[c.sym].length>HIST) hist[c.sym].shift();
    });
    // Au plus UN événement par tick, sur une seule compagnie ayant bougé
    if (!krachNow && stepped.length && Math.random()<EVENT_PROB){
      const sym=stepped[Math.floor(Math.random()*stepped.length)];
      const e=EVENTS[Math.floor(Math.random()*EVENTS.length)];
      prices[sym]=clamp(prices[sym]*(1+e.m), CO[sym]);
      hist[sym][hist[sym].length-1]=prices[sym];
      showToast(`${e.t} — ${sym} ${e.m>0?'+':''}${Math.round(e.m*100)}%`, e.bad);
    }
    stepped.forEach(sym=>writes.push({ sym, price:Number(prices[sym].toFixed(2)), updated_at:new Date(now).toISOString() }));
    if (krachNow) showToast('🌪️ KRACH BOURSIER — tout le marché chute !', true);
    if (writes.length){ try { await sb.from('bourse_market').upsert(writes, { onConflict:'sym' }); } catch(e){} }
    if (currentTab==='market') refresh();
    if (modalSym) updateModal();
    updateWallet();
  }

  // ── Onglets ──
  function showTab(t){
    currentTab=t;
    ['market','feed','lb'].forEach(x=>{
      document.getElementById('view-'+x).style.display = x===t?'block':'none';
      document.getElementById('tab-'+x).className = 'tab'+(x===t?' act':'');
    });
    if(t==='market') refresh();
    if(t==='feed') loadFeed();
    if(t==='lb') loadLeaderboard();
  }

  function renderStocks(){
    document.getElementById('view-market').innerHTML = COMPANIES.map(c=>`
      <div class="stock" id="st-${c.sym}">
        <div class="stock-top">
          <div class="stock-badge" style="background:${c.color}">${c.sym.slice(0,4)}</div>
          <div class="stock-id"><div class="stock-sym">${c.name}</div><div class="stock-name">${c.sym}</div></div>
          <div class="stock-price-wrap"><div class="stock-price" id="pr-${c.sym}">—</div><div class="stock-chg" id="ch-${c.sym}">—</div></div>
        </div>
        <svg class="spark" id="sp-${c.sym}" viewBox="0 0 300 42" preserveAspectRatio="none"></svg>
        <div id="po-${c.sym}"></div>
        <div class="btns">
          <button class="btn btn-buy" onclick="openModal('${c.sym}','buy')">Acheter</button>
          <button class="btn btn-sell" id="sb-${c.sym}" onclick="openModal('${c.sym}','sell')">Vendre</button>
        </div>
        <div class="cooldn" id="cd-${c.sym}"></div>
      </div>`).join('');
    refresh();
  }

  function refresh(){
    const now=Date.now();
    COMPANIES.forEach(c=>{
      const p=prices[c.sym]; const pr=document.getElementById('pr-'+c.sym); if(!pr) return;
      pr.textContent=fmt2(p)+'€';
      const diff=p-prev[c.sym]; const pct=prev[c.sym]?diff/prev[c.sym]*100:0;
      const ch=document.getElementById('ch-'+c.sym); const cls=diff>0.001?'up':diff<-0.001?'down':'flat';
      ch.className='stock-chg '+cls; ch.textContent=(diff>0?'▲ +':diff<0?'▼ ':'• ')+fmt2(Math.abs(pct))+'%';
      drawSpark(c);
      const h=holdings[c.sym]; const poEl=document.getElementById('po-'+c.sym);
      const stEl=document.getElementById('st-'+c.sym); const sellBtn=document.getElementById('sb-'+c.sym);
      if(h&&h.shares>0){
        const val=h.shares*p, pl=val-h.cost, plPct=h.cost?pl/h.cost*100:0, plCls=pl>=0?'up':'down';
        poEl.innerHTML=`<div class="pos"><span class="pos-lbl">${h.shares} parts · PRU ${fmt2(h.cost/h.shares)}€</span><span class="pos-pl ${plCls}">${pl>=0?'+':''}${fmt(pl)}€ (${pl>=0?'+':''}${fmt2(plPct)}%)</span></div>`;
        stEl.classList.add('holding'); sellBtn.disabled=false;
      } else { poEl.innerHTML=''; stEl.classList.remove('holding'); sellBtn.disabled=true; }
      const cdLeft = (cooldowns[c.sym]||0) + COOLDOWN - now;
      const cdEl=document.getElementById('cd-'+c.sym);
      cdEl.textContent = cdLeft>0 ? `⏳ ${Math.ceil(cdLeft/1000)}s avant le prochain trade` : '';
    });
    updateWallet();
  }

  function drawSpark(c){
    const d=hist[c.sym]; const sp=document.getElementById('sp-'+c.sym); if(!sp) return;
    const min=Math.min(...d),max=Math.max(...d),rng=(max-min)||1;
    const pts=d.map((v,i)=>`${(i/(d.length-1))*300},${42-((v-min)/rng)*38-2}`).join(' ');
    const col=d[d.length-1]>=d[0]?'#34d399':'#f87171';
    sp.innerHTML=`<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round"/>`;
  }

  function portfolioValue(){ let v=0; COMPANIES.forEach(c=>{const h=holdings[c.sym]; if(h)v+=h.shares*prices[c.sym];}); return v; }
  function updateWallet(){ document.getElementById('cash').textContent=fmt(cash)+'€'; document.getElementById('portfolio').textContent=fmt(portfolioValue())+'€'; }

  // ── Modal ──
  function openModal(sym,m){ modalSym=sym; document.getElementById('ov').classList.add('show'); setMode(m); document.getElementById('amt').value=''; updateModal(); }
  function closeModal(){ modalSym=null; document.getElementById('ov').classList.remove('show'); }
  document.getElementById('ov').addEventListener('click',e=>{ if(e.target.id==='ov') closeModal(); });

  function setMode(m){
    mode=m;
    document.getElementById('ttBuy').className='tt-btn'+(m==='buy'?' act-buy':'');
    document.getElementById('ttSell').className='tt-btn'+(m==='sell'?' act-sell':'');
    document.getElementById('amtCur').textContent=m==='buy'?'€':'parts';
    document.getElementById('amt').value='';
    const ex=document.getElementById('exec'); ex.className='exec '+m; ex.textContent=m==='buy'?'Acheter':'Vendre';
    buildQuick(); updateModal();
  }
  function buildQuick(){
    const q=document.getElementById('quick'); const h=holdings[modalSym]; const p=prices[modalSym];
    if(mode==='buy'){
      const maxAff=Math.min(MAX_TRADE, cash);
      q.innerHTML=[['Min',MIN_TRADE],['50%',Math.floor(maxAff*0.5)],['Max',Math.floor(maxAff)]].map(([t,v])=>`<button class="quick-btn" onclick="setAmt(${v})">${t}</button>`).join('');
    } else {
      const sh=h?h.shares:0;
      q.innerHTML=[['25%',Math.floor(sh*0.25)],['50%',Math.floor(sh*0.5)],['Tout',sh]].map(([t,v])=>`<button class="quick-btn" onclick="setAmt(${v})">${t}</button>`).join('');
    }
  }
  function setAmt(v){ document.getElementById('amt').value=v; updateModal(); }
  document.getElementById('amt').addEventListener('input',updateModal);

  function cooldownLeft(sym){ return (cooldowns[sym]||0)+COOLDOWN-Date.now(); }

  function updateModal(){
    if(!modalSym) return;
    const c=CO[modalSym]; const p=prices[modalSym]; const h=holdings[modalSym];
    document.getElementById('mSym').textContent=c.name;
    document.getElementById('mName').textContent=c.sym;
    document.getElementById('mPrice').textContent=fmt2(p)+'€';
    const val=parseFloat(document.getElementById('amt').value)||0;
    const ex=document.getElementById('exec'); const pv=document.getElementById('preview');
    const cd=cooldownLeft(modalSym);
    if(cd>0){ pv.innerHTML=`⏳ Attends <b>${Math.ceil(cd/1000)}s</b> avant de retrader ${c.sym}`; ex.disabled=true; return; }
    if(mode==='buy'){
      if(val<MIN_TRADE){ pv.innerHTML=`Mise minimum : <b>${fmt(MIN_TRADE)}€</b>`; ex.disabled=true; return; }
      if(val>MAX_TRADE){ pv.innerHTML=`Mise maximum : <b>${fmt(MAX_TRADE)}€</b>`; ex.disabled=true; return; }
      if(val>cash){ pv.innerHTML='Liquidités insuffisantes'; ex.disabled=true; return; }
      const shares=Math.floor(val/(p*(1+FEE)));
      if(shares<1){ pv.innerHTML='Pas assez pour 1 part'; ex.disabled=true; return; }
      const cost=shares*p, fee=cost*FEE, total=cost+fee;
      pv.innerHTML=`<b>${shares} parts</b> à ${fmt2(p)}€<br>Frais 5% : ${fmt(fee)}€ · Total : <b>${fmt(total)}€</b>`;
      ex.disabled=false;
    } else {
      const sh=Math.min(Math.floor(val), h?h.shares:0);
      if(sh<1){ pv.innerHTML='Saisis un nombre de parts'; ex.disabled=true; return; }
      const gross=sh*p, fee=gross*FEE, net=gross-fee;
      const costPortion=h?h.cost*(sh/h.shares):0, pl=net-costPortion;
      pv.innerHTML=`<b>${sh} parts</b> → ${fmt(gross)}€ − frais ${fmt(fee)}€ = <b>${fmt(net)}€</b><br>Résultat : <b style="color:${pl>=0?'#34d399':'#f87171'}">${pl>=0?'+':''}${fmt(pl)}€</b>`;
      ex.disabled=false;
    }
  }

  async function execTrade(){
    if(!modalSym) return;
    if(cooldownLeft(modalSym)>0) return;
    const c=CO[modalSym]; let p=prices[modalSym];
    const val=parseFloat(document.getElementById('amt').value)||0;
    let feedAction, feedAmount;

    if(mode==='buy'){
      if(val<MIN_TRADE||val>MAX_TRADE||val>cash) return;
      const shares=Math.floor(val/(p*(1+FEE))); if(shares<1) return;
      const cost=shares*p, fee=cost*FEE, total=cost+fee;
      cash-=total;
      const h=holdings[c.sym]||{shares:0,cost:0};
      h.shares+=shares; h.cost+=total;     // coût = cash dépensé (frais inclus)
      holdings[c.sym]=h;
      p = clamp(p*(1 + total/IMPACT_LIQ), c);   // impact haussier
      feedAction='a acheté'; feedAmount=total;
      showToast(`Achat ${c.sym} · ${shares} parts`, false);
    } else {
      const h=holdings[c.sym]; if(!h) return;
      const sh=Math.min(Math.floor(val), h.shares); if(sh<1) return;
      const gross=sh*p, fee=gross*FEE, net=gross-fee;
      const costPortion=h.cost*(sh/h.shares), realized=net-costPortion;
      cash+=net; h.shares-=sh; h.cost-=costPortion;
      if(h.shares<1) delete holdings[c.sym];
      profit+=realized; if(realized>best) best=realized;
      p = clamp(p*(1 - gross/IMPACT_LIQ), c);   // impact baissier
      feedAction='a vendu'; feedAmount=gross;
      showToast(`Vente ${c.sym} · ${realized>=0?'+':''}${fmt(realized)}€`, realized<0);
    }
    cooldowns[c.sym]=Date.now();
    prices[c.sym]=p;
    await Promise.all([ save(), pushFeed(feedAction, c.sym, feedAmount), pushMarket(c.sym, p) ]);
    refresh(); updateModal();
    if(mode==='sell' && !holdings[c.sym]) closeModal();
  }

  async function save(){
    try {
      await sb.from('game_stats').update({
        money: Math.round(cash),
        bourse: { h:holdings, cd:cooldowns },
        bourse_profit: Math.round(profit),
        bourse_best: Math.round(best)
      }).eq('user_id', currentUser.id);
    } catch(e){ console.log('save:',e); }
  }
  async function pushMarket(sym,p){ try{ await sb.from('bourse_market').upsert({ sym, price:Number(p.toFixed(2)), updated_at:new Date().toISOString() }, { onConflict:'sym' }); }catch(e){} }
  async function pushFeed(action,sym,amount){ try{ await sb.from('bourse_feed').insert({ user_id:currentUser.id, username, action, sym, amount:Math.round(amount) }); }catch(e){} }

  // ── Activité ──
  async function loadFeed(){
    const el=document.getElementById('view-feed');
    el.innerHTML='<div class="muted">Chargement…</div>';
    try {
      const { data } = await sb.from('bourse_feed').select('*').order('created_at',{ascending:false}).limit(10);
      if(!data||!data.length){ el.innerHTML='<div class="muted">Aucune transaction récente.</div>'; return; }
      el.innerHTML=data.map(f=>{
        const co=CO[f.sym]; const nm=co?co.name:f.sym;
        const dot=f.action==='a acheté'?'🟢':'🔴';
        return `<div class="feed-line">${dot} <span style="flex:1"><b style="color:#fff">${f.username}</b> ${f.action} <b style="color:#34d399">${fmt(f.amount)}€</b> de ${nm}</span></div>`;
      }).join('');
    } catch(e){ el.innerHTML='<div class="muted">Indisponible.</div>'; }
  }

  // ── Classement traders ──
  async function loadLeaderboard(){
    const el=document.getElementById('view-lb');
    el.innerHTML='<div class="muted">Chargement…</div>';
    try {
      const { data } = await sb.from('game_stats').select('user_id,bourse_profit,bourse_best').order('bourse_profit',{ascending:false}).limit(10);
      const rows=(data||[]).filter(r=>(r.bourse_profit||0)!==0);
      if(!rows.length){ el.innerHTML='<div class="muted">Pas encore de traders classés.</div>'; return; }
      const ids=rows.map(r=>r.user_id);
      const { data:profs } = await sb.from('profiles').select('user_id,username').in('user_id',ids);
      const nameOf={}; (profs||[]).forEach(p=>nameOf[p.user_id]=p.username);
      const medals=['🥇','🥈','🥉'];
      el.innerHTML=rows.map((r,i)=>`
        <div class="lb-line">
          <span class="lb-rank">${medals[i]||(i+1)}</span>
          <span class="lb-name">${nameOf[r.user_id]||'Docker'}${r.user_id===currentUser.id?' 👈':''}<div class="lb-best">Meilleur trade : ${fmt(r.bourse_best||0)}€</div></span>
          <span class="lb-val">${fmt(r.bourse_profit||0)}€</span>
        </div>`).join('');
    } catch(e){ el.innerHTML='<div class="muted">Indisponible.</div>'; }
  }

  let toastT=null;
  function showToast(msg,bad){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show'+(bad?' bad':''); clearTimeout(toastT); toastT=setTimeout(()=>t.className='toast'+(bad?' bad':''),2600); }

  window.addEventListener('beforeunload',()=>{ if(tickInt) clearInterval(tickInt); });
  init();
</script>
</body>
