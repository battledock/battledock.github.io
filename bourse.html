<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bourse Maritime - Battle Dock</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
    input { user-select:text; -webkit-user-select:text; }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(180deg, #0a0f1e 0%, #0d1b35 100%);
      min-height: 100vh;
      color: white;
      padding: 16px;
      padding-bottom: 100px;
    }

    .container { max-width: 600px; margin: 0 auto; }

    /* HEADER */
    .header {
      background: linear-gradient(135deg, #0d2347, #1a3a6b);
      border: 2px solid rgba(59,130,246,0.3);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .back-btn {
      width: 40px; height: 40px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: white; font-size: 18px;
      transition: all 0.2s;
    }
    .back-btn:hover { background: rgba(255,255,255,0.2); }

    .header-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      letter-spacing: 2px;
      color: #60a5fa;
      text-shadow: 0 0 20px rgba(96,165,250,0.4);
    }

    .header-refresh {
      width: 40px; height: 40px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 18px;
      transition: all 0.3s;
    }
    .header-refresh:hover { background: rgba(255,255,255,0.2); }
    .header-refresh.spinning { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .portfolio-item {
      background: rgba(0,0,0,0.2);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .portfolio-label { font-size: 10px; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
    .portfolio-value { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: white; letter-spacing: 1px; }
    .portfolio-value.green { color: #34d399; }
    .portfolio-value.red { color: #f87171; }

    /* NEWS TICKER */
    .ticker {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .ticker-content {
      font-size: 13px;
      color: rgba(255,255,255,0.7);
      font-weight: 600;
      white-space: nowrap;
      animation: tickerScroll 18s linear infinite;
    }

    @keyframes tickerScroll { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }

    /* STOCKS */
    .section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 13px;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.3);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .stocks-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }

    .stock-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }

    .stock-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
    }

    .stock-card.up::before { background: linear-gradient(90deg, #10b981, #34d399); }
    .stock-card.down::before { background: linear-gradient(90deg, #ef4444, #f87171); }
    .stock-card.flat::before { background: rgba(255,255,255,0.2); }

    .stock-card:hover { background: rgba(255,255,255,0.07); transform: translateY(-2px); }
    .stock-card:active { transform: translateY(0); }

    .stock-row { display: flex; justify-content: space-between; align-items: center; }

    .stock-symbol {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 1px;
      color: white;
    }

    .stock-name { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 2px; }

    .stock-price-wrap { text-align: right; }

    .stock-price {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      color: white;
      letter-spacing: 1px;
    }

    .stock-change {
      font-size: 12px;
      font-weight: 700;
      margin-top: 2px;
    }
    .stock-change.up { color: #34d399; }
    .stock-change.down { color: #f87171; }
    .stock-change.flat { color: rgba(255,255,255,0.4); }

    .stock-owned {
      margin-top: 10px;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: rgba(255,255,255,0.5);
    }

    .stock-owned-val { font-weight: 700; color: #60a5fa; }

    /* MINI SPARKLINE */
    .sparkline { margin-top: 10px; height: 40px; }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      align-items: flex-end;
      justify-content: center;
      padding: 0;
    }

    .modal.active { display: flex; }

    .modal-content {
      background: linear-gradient(180deg, #0d1b35, #0a0f1e);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px 20px 0 0;
      padding: 28px 24px 40px;
      width: 100%;
      max-width: 600px;
      position: relative;
    }

    .modal-handle {
      width: 40px; height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
      margin: 0 auto 20px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    .modal-symbol {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      letter-spacing: 2px;
      color: white;
    }

    .modal-name { font-size: 13px; color: rgba(255,255,255,0.5); margin-top: 2px; }

    .modal-price {
      text-align: right;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      color: #60a5fa;
    }

    .qty-section { margin-bottom: 16px; }
    .qty-label { font-size: 12px; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }

    .qty-control {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 8px 12px;
    }

    .qty-btn {
      width: 36px; height: 36px;
      background: rgba(255,255,255,0.1);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 20px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .qty-btn:hover { background: rgba(255,255,255,0.2); }

    .qty-input {
      flex: 1;
      background: transparent;
      border: none;
      color: white;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      text-align: center;
      letter-spacing: 1px;
      outline: none;
    }

    .qty-presets {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .qty-preset {
      flex: 1;
      padding: 8px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      color: rgba(255,255,255,0.6);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .qty-preset:hover { background: rgba(255,255,255,0.12); color: white; }

    .trade-summary {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      margin-bottom: 8px;
    }

    .summary-row:last-child {
      margin-bottom: 0;
      padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.08);
      color: white;
      font-weight: 700;
      font-size: 15px;
    }

    .trade-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .trade-btn {
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .trade-btn.buy { background: linear-gradient(135deg, #10b981, #059669); color: white; box-shadow: 0 4px 12px rgba(16,185,129,0.4); }
    .trade-btn.sell { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; box-shadow: 0 4px 12px rgba(239,68,68,0.4); }
    .trade-btn:hover { transform: translateY(-2px); }
    .trade-btn:active { transform: translateY(0); }
    .trade-btn:disabled { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.3); cursor: not-allowed; box-shadow: none; transform: none; }

    /* BOTTOM BAR */
    .bottom-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(135deg, #0d2347, #1a3a6b);
      border-top: 1px solid rgba(59,130,246,0.3);
      padding: 12px 16px;
      display: flex;
      gap: 12px;
      z-index: 100;
    }

    .bottom-cash {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .bottom-cash-label { font-size: 10px; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 1px; }
    .bottom-cash-value { font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: #34d399; letter-spacing: 1px; }

    .bottom-back {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      padding: 8px 20px;
      color: white;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 14px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .bottom-back:hover { background: rgba(255,255,255,0.2); }

    /* TOAST */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #1a3a6b;
      border: 1px solid rgba(59,130,246,0.4);
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      z-index: 9999;
      animation: toastIn 0.3s ease;
      white-space: nowrap;
    }
    .toast.error { background: #7f1d1d; border-color: rgba(239,68,68,0.4); }
    @keyframes toastIn { from { opacity:0; transform:translateX(-50%) translateY(-10px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }

    /* LOADER */
    .loader { text-align: center; padding: 60px 20px; }
    .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.08); border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px; }
  </style>
</head>
<body>
  <div class="container">

    <!-- HEADER -->
    <div class="header">
      <div class="header-top">
        <button class="back-btn" onclick="window.location.href='game.html'">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <div class="header-title">📈 BOURSE MARITIME</div>
        <div class="header-refresh" id="refreshBtn" onclick="refreshPrices()">🔄</div>
      </div>

      <div class="portfolio-grid">
        <div class="portfolio-item">
          <div class="portfolio-label">Cash</div>
          <div class="portfolio-value" id="cashDisplay">0€</div>
        </div>
        <div class="portfolio-item">
          <div class="portfolio-label">Portefeuille</div>
          <div class="portfolio-value" id="portfolioDisplay">0€</div>
        </div>
        <div class="portfolio-item">
          <div class="portfolio-label">Total</div>
          <div class="portfolio-value" id="totalDisplay">0€</div>
        </div>
        <div class="portfolio-item">
          <div class="portfolio-label">Profit/Perte</div>
          <div class="portfolio-value" id="profitDisplay">+0€</div>
        </div>
      </div>
    </div>

    <!-- TICKER -->
    <div class="ticker">
      <div class="ticker-content" id="tickerContent">📰 Chargement des actualités...</div>
    </div>

    <!-- STOCKS -->
    <div class="section-title">Marchés en direct</div>
    <div id="loader" class="loader"><div class="spinner"></div></div>
    <div class="stocks-list" id="stocksList"></div>

  </div>

  <!-- MODAL TRADE -->
  <div id="tradeModal" class="modal" onclick="closeModal(event)">
    <div class="modal-content">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <div>
          <div class="modal-symbol" id="mSymbol">--</div>
          <div class="modal-name" id="mName">--</div>
        </div>
        <div>
          <div class="modal-price" id="mPrice">--</div>
          <div class="stock-change" id="mChange" style="text-align:right;margin-top:4px;">--</div>
        </div>
      </div>

      <div class="qty-section">
        <div class="qty-label">Quantité</div>
        <div class="qty-control">
          <button class="qty-btn" onclick="adjustQty(-1)">−</button>
          <input type="number" class="qty-input" id="tradeQty" value="1" min="1" oninput="updateSummary()">
          <button class="qty-btn" onclick="adjustQty(1)">+</button>
        </div>
        <div class="qty-presets">
          <div class="qty-preset" onclick="setQtyPreset('max_buy')">MAX ACHAT</div>
          <div class="qty-preset" onclick="setQtyPreset('half')">MOITIÉ</div>
          <div class="qty-preset" onclick="setQtyPreset('max_sell')">TOUT VENDRE</div>
        </div>
      </div>

      <div class="trade-summary">
        <div class="summary-row"><span>Actions possédées</span><span id="sOwned">0</span></div>
        <div class="summary-row"><span>Prix unitaire</span><span id="sUnit">0€</span></div>
        <div class="summary-row"><span>Quantité</span><span id="sQty">0</span></div>
        <div class="summary-row"><span>Total</span><span id="sTotal">0€</span></div>
      </div>

      <div class="trade-buttons">
        <button class="trade-btn buy" onclick="executeTrade('buy')">ACHETER</button>
        <button class="trade-btn sell" id="sellBtn" onclick="executeTrade('sell')">VENDRE</button>
      </div>
    </div>
  </div>

  <!-- BOTTOM BAR -->
  <div class="bottom-bar">
    <div class="bottom-cash">
      <div class="bottom-cash-label">Cash disponible</div>
      <div class="bottom-cash-value" id="bottomCash">0€</div>
    </div>
    <button class="bottom-back" onclick="window.location.href='game.html'">← RETOUR</button>
  </div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const sb = createClient(supabaseUrl, supabaseKey);

    let currentUser = null;
    let userMoney = 0;
    let stocks = [];
    let portfolio = {}; // { symbol: { quantity, avg_buy_price } }
    let selectedStock = null;
    let priceInterval = null;

    const STOCKS_DEF = [
      { symbol: 'MAERSK',  name: 'A.P. Moller-Maersk',       volatility: 0.06 },
      { symbol: 'CMA-CGM', name: 'CMA CGM Group',             volatility: 0.10 },
      { symbol: 'MSC',     name: 'Mediterranean Shipping Co.', volatility: 0.08 },
      { symbol: 'COSCO',   name: 'COSCO Shipping Holdings',   volatility: 0.12 },
      { symbol: 'HAPAG',   name: 'Hapag-Lloyd AG',            volatility: 0.07 }
    ];

    const NEWS = [
      '🌊 Nouvelle route maritime ouverte entre Rotterdam et Shanghai',
      '📦 Les containers atteignent des prix records ce trimestre',
      '⚓ Grève portuaire évitée à Rotterdam après accord syndical',
      '🚢 Maersk annonce une flotte de navires zéro émission d\'ici 2030',
      '💰 Les bénéfices du shipping explosent ce trimestre',
      '🌍 Demande mondiale de fret en hausse de 15%',
      '⛽ Prix du carburant marin en baisse de 8%',
      '📉 Tensions géopolitiques perturbent les routes en mer Rouge',
      '🏭 COSCO ouvre 3 nouveaux terminaux en Asie du Sud-Est',
      '🔧 MSC modernise sa flotte avec 20 nouveaux porte-conteneurs',
    ];

    // ===========================
    // INIT
    // ===========================
    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { window.location.href = 'index.html'; return; }
      currentUser = session.user;

      await Promise.all([loadMoney(), loadStockPrices(), loadPortfolio()]);

      document.getElementById('loader').style.display = 'none';
      renderStocks();
      updatePortfolioUI();
      rotateTicker();

      priceInterval = setInterval(updatePricesLocally, 6000);
      setInterval(rotateTicker, 12000);
    }

    async function loadMoney() {
      const { data } = await sb.from('game_stats').select('money').eq('user_id', currentUser.id).single();
      userMoney = data?.money || 0;
    }

    async function loadStockPrices() {
      const { data } = await sb.from('stock_prices').select('*');
      if (!data) return;

      stocks = STOCKS_DEF.map(def => {
        const row = data.find(r => r.symbol === def.symbol);
        const price = row?.price || 1000;
        const prev = row?.previous_price || price;
        return {
          ...def,
          price,
          previousPrice: prev,
          change: price - prev,
          changePercent: ((price - prev) / prev) * 100,
          history: [prev, price]
        };
      });
    }

    async function loadPortfolio() {
      const { data } = await sb.from('stock_portfolio').select('*').eq('user_id', currentUser.id);
      portfolio = {};
      if (data) {
        data.forEach(row => {
          portfolio[row.symbol] = { quantity: row.quantity, avg_buy_price: row.avg_buy_price };
        });
      }
    }

    // ===========================
    // PRIX LOCAUX (animation)
    // ===========================
    let priceUpdateCounter = 0;
    function updatePricesLocally() {
      stocks.forEach(stock => {
        const change = (Math.random() - 0.48) * 2 * stock.volatility;
        const newPrice = Math.max(Math.round(stock.price * (1 + change)), 10);
        stock.previousPrice = stock.price;
        stock.change = newPrice - stock.price;
        stock.changePercent = (stock.change / stock.price) * 100;
        stock.price = newPrice;
        stock.history.push(newPrice);
        if (stock.history.length > 30) stock.history.shift();
      });
      renderStocks();
      updatePortfolioUI();
      // Sauvegarder en BD toutes les 5 updates (30 secondes)
      priceUpdateCounter++;
      if (priceUpdateCounter % 5 === 0) savePricesToDB();
    }

    async function savePricesToDB() {
      for (const stock of stocks) {
        await sb.from('stock_prices').update({
          previous_price: stock.previousPrice,
          price: stock.price,
          updated_at: new Date().toISOString()
        }).eq('symbol', stock.symbol);
      }
    }

    async function refreshPrices() {
      const btn = document.getElementById('refreshBtn');
      btn.classList.add('spinning');
      await loadStockPrices();
      renderStocks();
      updatePortfolioUI();
      setTimeout(() => btn.classList.remove('spinning'), 800);
    }

    // ===========================
    // RENDER STOCKS
    // ===========================
    function renderStocks() {
      const list = document.getElementById('stocksList');
      list.innerHTML = stocks.map(stock => {
        const dir = stock.change > 0 ? 'up' : stock.change < 0 ? 'down' : 'flat';
        const arrow = stock.change > 0 ? '▲' : stock.change < 0 ? '▼' : '—';
        const owned = portfolio[stock.symbol];
        const ownedVal = owned ? owned.quantity * stock.price : 0;
        const sparkline = renderSparkline(stock.history, dir);

        return `
          <div class="stock-card ${dir}" onclick="openTrade('${stock.symbol}')">
            <div class="stock-row">
              <div>
                <div class="stock-symbol">${stock.symbol}</div>
                <div class="stock-name">${stock.name}</div>
              </div>
              <div class="stock-price-wrap">
                <div class="stock-price">${stock.price.toLocaleString('fr-FR')}€</div>
                <div class="stock-change ${dir}">${arrow} ${Math.abs(stock.changePercent).toFixed(2)}%</div>
              </div>
            </div>
            ${sparkline}
            ${owned && owned.quantity > 0 ? `
              <div class="stock-owned">
                <span>${owned.quantity} action${owned.quantity > 1 ? 's' : ''} · Achat moy. ${owned.avg_buy_price.toLocaleString('fr-FR')}€</span>
                <span class="stock-owned-val">${ownedVal.toLocaleString('fr-FR')}€</span>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    function renderSparkline(history, dir) {
      if (history.length < 2) return '';
      const w = 300, h = 40;
      const min = Math.min(...history);
      const max = Math.max(...history);
      const range = max - min || 1;
      const pts = history.map((v, i) => {
        const x = (i / (history.length - 1)) * w;
        const y = h - ((v - min) / range) * h;
        return `${x},${y}`;
      }).join(' ');
      const color = dir === 'up' ? '#10b981' : dir === 'down' ? '#ef4444' : '#6b7280';
      return `
        <div class="sparkline">
          <svg width="100%" height="40" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
            <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
          </svg>
        </div>
      `;
    }

    // ===========================
    // PORTFOLIO UI
    // ===========================
    function updatePortfolioUI() {
      let portfolioVal = 0;
      let totalBuyValue = 0;

      for (const [symbol, pos] of Object.entries(portfolio)) {
        if (pos.quantity <= 0) continue;
        const stock = stocks.find(s => s.symbol === symbol);
        if (stock) {
          portfolioVal += stock.price * pos.quantity;
          totalBuyValue += pos.avg_buy_price * pos.quantity;
        }
      }

      const total = userMoney + portfolioVal;
      const profit = portfolioVal - totalBuyValue;

      document.getElementById('cashDisplay').textContent = userMoney.toLocaleString('fr-FR') + '€';
      document.getElementById('portfolioDisplay').textContent = portfolioVal.toLocaleString('fr-FR') + '€';
      document.getElementById('totalDisplay').textContent = total.toLocaleString('fr-FR') + '€';
      document.getElementById('bottomCash').textContent = userMoney.toLocaleString('fr-FR') + '€';

      const profitEl = document.getElementById('profitDisplay');
      profitEl.textContent = (profit >= 0 ? '+' : '') + profit.toLocaleString('fr-FR') + '€';
      profitEl.className = 'portfolio-value ' + (profit > 0 ? 'green' : profit < 0 ? 'red' : '');
    }

    // ===========================
    // MODAL TRADE
    // ===========================
    function openTrade(symbol) {
      selectedStock = stocks.find(s => s.symbol === symbol);
      if (!selectedStock) return;

      const dir = selectedStock.change > 0 ? 'up' : selectedStock.change < 0 ? 'down' : 'flat';
      const arrow = selectedStock.change > 0 ? '▲' : selectedStock.change < 0 ? '▼' : '—';
      const owned = portfolio[symbol]?.quantity || 0;

      document.getElementById('mSymbol').textContent = selectedStock.symbol;
      document.getElementById('mName').textContent = selectedStock.name;
      document.getElementById('mPrice').textContent = selectedStock.price.toLocaleString('fr-FR') + '€';
      document.getElementById('mChange').textContent = `${arrow} ${Math.abs(selectedStock.changePercent).toFixed(2)}%`;
      document.getElementById('mChange').className = `stock-change ${dir}`;
      document.getElementById('tradeQty').value = 1;
      document.getElementById('sOwned').textContent = owned;
      document.getElementById('sellBtn').disabled = owned <= 0;

      updateSummary();
      document.getElementById('tradeModal').classList.add('active');
    }

    function closeModal(e) {
      if (!e || e.target === document.getElementById('tradeModal')) {
        document.getElementById('tradeModal').classList.remove('active');
      }
    }

    function updateSummary() {
      if (!selectedStock) return;
      const qty = parseInt(document.getElementById('tradeQty').value) || 0;
      const buyPrice = Math.round(selectedStock.price * 1.02);
      const commission = Math.max(10, Math.round(selectedStock.price * qty * 0.01));
      const totalBuy = buyPrice * qty + commission;
      const sellPrice = Math.round(selectedStock.price * 0.99);
      const totalSell = sellPrice * qty - Math.max(10, Math.round(sellPrice * qty * 0.01));
      document.getElementById('sUnit').textContent = selectedStock.price.toLocaleString('fr-FR') + '€';
      document.getElementById('sQty').textContent = qty;
      document.getElementById('sTotal').textContent = `Achat: ${totalBuy.toLocaleString('fr-FR')}€ · Vente: ${totalSell.toLocaleString('fr-FR')}€`;
    }

    function adjustQty(delta) {
      const input = document.getElementById('tradeQty');
      const val = Math.max(1, (parseInt(input.value) || 1) + delta);
      input.value = val;
      updateSummary();
    }

    function setQtyPreset(type) {
      if (!selectedStock) return;
      let qty = 1;
      if (type === 'max_buy') {
        qty = Math.max(1, Math.floor(userMoney / selectedStock.price));
        // Limite à 10% de l'argent pour éviter all-in
        qty = Math.max(1, Math.floor((userMoney * 0.5) / selectedStock.price));
      } else if (type === 'half') {
        qty = Math.max(1, Math.floor((portfolio[selectedStock.symbol]?.quantity || 1) / 2));
      } else if (type === 'max_sell') {
        qty = portfolio[selectedStock.symbol]?.quantity || 1;
      }
      document.getElementById('tradeQty').value = qty;
      updateSummary();
    }

    // ===========================
    // TRADE
    // ===========================
    async function executeTrade(action) {
      const qty = parseInt(document.getElementById('tradeQty').value) || 0;
      if (qty <= 0 || !selectedStock) { showToast('Quantité invalide', true); return; }

      const total = selectedStock.price * qty;

      if (action === 'buy') {
        // Spread 2% à l'achat + commission 1%
        const buyPrice = Math.round(selectedStock.price * 1.02);
        const commission = Math.max(10, Math.round(total * 0.01));
        const totalWithFees = (buyPrice * qty) + commission;

        if (totalWithFees > userMoney) { showToast('Pas assez d\'argent (frais inclus) !', true); return; }

        const newMoney = userMoney - totalWithFees;
        await sb.from('game_stats').update({ money: newMoney }).eq('user_id', currentUser.id);

        const existing = portfolio[selectedStock.symbol];
        const newQty = (existing?.quantity || 0) + qty;
        const newAvg = existing
          ? Math.round(((existing.avg_buy_price * existing.quantity) + (buyPrice * qty)) / newQty)
          : buyPrice;

        await sb.from('stock_portfolio').upsert({
          user_id: currentUser.id,
          symbol: selectedStock.symbol,
          quantity: newQty,
          avg_buy_price: newAvg
        }, { onConflict: 'user_id,symbol' });

        userMoney = newMoney;
        portfolio[selectedStock.symbol] = { quantity: newQty, avg_buy_price: newAvg };

        showToast(`✅ Acheté ${qty} × ${selectedStock.symbol} · Frais: ${commission.toLocaleString('fr-FR')}€`);

      } else {
        const owned = portfolio[selectedStock.symbol]?.quantity || 0;
        if (qty > owned) { showToast('Pas assez d\'actions !', true); return; }

        // Prix de vente = -1% spread + commission 1%
        const sellPrice = Math.round(selectedStock.price * 0.99);
        const sellTotal = sellPrice * qty;
        const commission = Math.max(10, Math.round(sellTotal * 0.01));
        const netProceeds = sellTotal - commission;

        const newMoney = userMoney + netProceeds;
        await sb.from('game_stats').update({ money: newMoney }).eq('user_id', currentUser.id);

        const avgBuy = portfolio[selectedStock.symbol]?.avg_buy_price || selectedStock.price;
        const profit = netProceeds - (avgBuy * qty);

        const newQty = owned - qty;
        if (newQty === 0) {
          await sb.from('stock_portfolio').delete().eq('user_id', currentUser.id).eq('symbol', selectedStock.symbol);
          delete portfolio[selectedStock.symbol];
        } else {
          await sb.from('stock_portfolio').update({ quantity: newQty }).eq('user_id', currentUser.id).eq('symbol', selectedStock.symbol);
          portfolio[selectedStock.symbol].quantity = newQty;
        }

        userMoney = newMoney;
        showToast(`✅ Vendu ${qty} × ${selectedStock.symbol} · ${profit >= 0 ? '+' : ''}${profit.toLocaleString('fr-FR')}€ net`);
      }

      updatePortfolioUI();
      renderStocks();
      closeModal();
    }

    // ===========================
    // UTILS
    // ===========================
    function rotateTicker() {
      const news = NEWS[Math.floor(Math.random() * NEWS.length)];
      const el = document.getElementById('tickerContent');
      el.style.animation = 'none';
      el.textContent = news;
      setTimeout(() => { el.style.animation = 'tickerScroll 18s linear infinite'; }, 50);
    }

    function showToast(msg, isError = false) {
      const t = document.createElement('div');
      t.className = 'toast' + (isError ? ' error' : '');
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    init();
  </script>
</body>
</html>
