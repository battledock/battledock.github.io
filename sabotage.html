<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sabotage - Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; -webkit-font-smoothing:antialiased; }
  body { font-family:'Inter',sans-serif; background:#120606; color:#f6e6e6; min-height:100dvh; padding:0 14px 30px; }
  .bg { position:fixed; inset:0; z-index:0; pointer-events:none; background:
      radial-gradient(120% 60% at 50% -5%, rgba(220,38,38,0.22), transparent 60%),
      linear-gradient(180deg,#2a0c0c,#160707 60%,#0c0404); }
  .wrap { position:relative; z-index:1; max-width:540px; margin:0 auto; }
  .hdr { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px; padding:14px 4px;
    background:linear-gradient(180deg,#160707,rgba(22,7,7,0.85)); backdrop-filter:blur(8px); }
  .hdr-back { background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.14); color:#fff; width:38px; height:38px; border-radius:11px; font-size:18px; cursor:pointer; flex-shrink:0; }
  .hdr-title { flex:1; font-family:'Bebas Neue',sans-serif; font-size:23px; letter-spacing:2px;
    background:linear-gradient(135deg,#ef4444,#fca5a5,#f59e0b); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }

  .card { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.09); border-radius:16px; padding:16px; margin-bottom:12px; }
  .sect-lbl { font-size:11px; letter-spacing:1px; text-transform:uppercase; color:rgba(255,255,255,0.45); margin:18px 4px 10px; }

  .gege { display:flex; gap:12px; align-items:flex-start; background:linear-gradient(160deg,rgba(234,179,8,0.1),rgba(220,38,38,0.06)); border:1px solid rgba(234,179,8,0.22); border-radius:16px; padding:14px; margin-bottom:14px; }
  .gege-ava { width:46px; height:46px; border-radius:50%; background:linear-gradient(135deg,#b45309,#f59e0b); display:flex; align-items:center; justify-content:center; font-size:24px; flex-shrink:0; }
  .gege-txt { font-size:14px; line-height:1.4; color:#fde68a; font-style:italic; }

  .banner { border-radius:14px; padding:13px 15px; margin-bottom:12px; font-size:13.5px; font-weight:600; line-height:1.4; }
  .banner.malus { background:rgba(220,38,38,0.14); border:1px solid rgba(220,38,38,0.4); color:#fca5a5; }
  .banner.protect { background:rgba(34,197,94,0.12); border:1px solid rgba(34,197,94,0.35); color:#86efac; }

  .status { display:flex; gap:10px; margin-bottom:4px; }
  .st { flex:1; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:13px; padding:12px 8px; text-align:center; }
  .st-val { font-family:'Bebas Neue',sans-serif; font-size:20px; color:#fca5a5; }
  .st-lbl { font-size:10px; letter-spacing:0.5px; text-transform:uppercase; color:rgba(255,255,255,0.45); margin-top:2px; }

  .btn { width:100%; border:none; border-radius:13px; padding:14px; font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:1px; cursor:pointer;
    background:linear-gradient(135deg,#b91c1c,#ef4444); color:#fff; margin-top:10px; }
  .btn:active{ transform:scale(0.98); } .btn:disabled{ opacity:0.45; }
  .btn-shield { background:linear-gradient(135deg,#15803d,#22c55e); }

  .search { width:100%; padding:11px 13px; border-radius:11px; border:1px solid rgba(255,255,255,0.12); background:rgba(255,255,255,0.05); color:#fff; font-size:14px; margin-bottom:8px; }
  .search::placeholder{ color:rgba(255,255,255,0.35); }
  .list { max-height:320px; overflow-y:auto; }
  .row { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.06); }
  .row:last-child{ border-bottom:none; }
  .ava { width:38px; height:38px; border-radius:50%; background:linear-gradient(135deg,#b91c1c,#ef4444); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; color:#fff; font-family:'Bebas Neue',sans-serif; }
  .row-name { flex:1; font-weight:700; font-size:14px; }
  .row-btn { border:none; border-radius:9px; padding:8px 12px; font-family:'Bebas Neue',sans-serif; font-size:12px; letter-spacing:0.5px; cursor:pointer; flex-shrink:0; background:linear-gradient(135deg,#b91c1c,#ef4444); color:#fff; }
  .empty { text-align:center; padding:22px 14px; color:rgba(255,255,255,0.35); font-size:13px; }

  .log-row { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid rgba(255,255,255,0.06); font-size:13px; }
  .log-row:last-child{ border-bottom:none; }
  .log-ic { width:30px; text-align:center; font-size:17px; flex-shrink:0; }
  .log-txt { flex:1; line-height:1.3; }
  .log-sub { font-size:11px; color:rgba(255,255,255,0.4); }

  .info { font-size:12.5px; color:rgba(255,255,255,0.5); line-height:1.6; }
  .loader { text-align:center; padding:60px; color:rgba(255,255,255,0.3); font-family:'Bebas Neue',sans-serif; letter-spacing:2px; }
  .back-bottom { width:100%; margin-top:18px; padding:15px; border-radius:14px; cursor:pointer;
    background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12); color:rgba(255,255,255,0.7);
    font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:2px; }
  .toast { position:fixed; top:18px; left:50%; transform:translateX(-50%) translateY(-20px); z-index:300;
    background:rgba(42,12,12,0.97); border:1px solid rgba(239,68,68,0.5); border-radius:12px; padding:11px 18px; font-size:13px; font-weight:700;
    opacity:0; transition:all .35s; max-width:92%; text-align:center; color:#fca5a5; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
  <div class="hdr">
    <button class="hdr-back" onclick="window.location.href='game.html'">←</button>
    <div class="hdr-title">🛠️ SABOTAGE</div>
  </div>
  <div id="content"><div class="loader">CHARGEMENT…</div></div>
  <button class="back-bottom" onclick="window.location.href='game.html'">← Retour au jeu</button>
</div>
<div class="toast" id="toast"></div>

<script>
  const SB_URL = 'https://drtsuhnbclhmgfjiykap.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
  const sb = supabase.createClient(SB_URL, SB_KEY);

  const ATTACK_COOLDOWN_MS = 2 * 3600 * 1000;   // 2h entre 2 sabotages
  const TARGET_COOLDOWN_MS = 24 * 3600 * 1000;  // 24h sur la même cible
  const STEAL_PCT = 0.05;                        // 5% de la caisse de la cible
  const STEAL_CAP = 5000;                        // vol max par sabotage
  const MALUS_HOURS = 2;                         // gêne : Flash + Salaire bloqués
  const PROTECT_HOURS = 6;                       // durée du vigile
  const PROTECT_COST = 10000;                    // coût du vigile

  let currentUser=null, username='Docker', money=0, sab={};
  let players=[], filter='', subi=[], infl=[], ticker=null, pendingStolen=0;
  const esc=t=>(t||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
  const now=()=>Date.now();
  function ms(iso){ return iso ? new Date(iso).getTime() : 0; }
  function fmt(msv){ const s=Math.max(0,Math.floor(msv/1000)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h>0?h+'h ':'')+String(m).padStart(2,'0')+'m '+String(x).padStart(2,'0')+'s'; }

  async function init(){
    const { data:{ session } } = await sb.auth.getSession();
    if(!session){ window.location.href='index.html'; return; }
    currentUser = session.user;
    const [{ data:prof }, { data:gs }] = await Promise.all([
      sb.from('profiles').select('username').eq('user_id',currentUser.id).maybeSingle(),
      sb.from('game_stats').select('money,sabotage').eq('user_id',currentUser.id).maybeSingle()
    ]);
    username = prof?.username || currentUser.email.split('@')[0];
    money = gs?.money || 0;
    sab = (gs?.sabotage && typeof gs.sabotage==='object') ? gs.sabotage : {};
    await processIncomingSteals();
    await loadActivity();
    render();
    if(pendingStolen>0){ showToast(`💸 On t'a volé ${pendingStolen.toLocaleString('fr-FR')}€ pendant ton absence !`); pendingStolen=0; }
  }

  async function processIncomingSteals(){
    try {
      const { data:pend } = await sb.from('sabotages').select('id,stolen').eq('target_id',currentUser.id).eq('processed',false);
      if(pend && pend.length){
        const total = pend.reduce((s,r)=>s+(r.stolen||0),0);
        if(total>0){
          const { data:fresh } = await sb.from('game_stats').select('money').eq('user_id',currentUser.id).maybeSingle();
          const newMoney = Math.max(0,(fresh?.money||0)-total);
          await sb.from('game_stats').update({ money:newMoney }).eq('user_id',currentUser.id);
          money = newMoney; pendingStolen = total;
        }
        await sb.from('sabotages').update({ processed:true }).eq('target_id',currentUser.id).eq('processed',false);
      }
    } catch(e){ console.log('process:',e); }
  }

  async function loadActivity(){
    try {
      const { data:sub } = await sb.from('sabotages').select('*').eq('target_id',currentUser.id).order('created_at',{ascending:false}).limit(15);
      subi = sub || [];
      const { data:inf } = await sb.from('sabotages').select('*').eq('attacker_id',currentUser.id).order('created_at',{ascending:false}).limit(15);
      infl = inf || [];
    } catch(e){ console.log('activity:',e); subi=[]; infl=[]; }
  }

  async function loadPlayers(){
    try {
      const { data } = await sb.from('profiles').select('user_id,username').neq('user_id',currentUser.id).limit(200);
      players = (data||[]).filter(p=>p.username);
    } catch(e){ console.log('players:',e); players=[]; }
  }

  function attackWaitMs(){ return Math.max(0, ATTACK_COOLDOWN_MS - (now() - ms(sab.lastAttack))); }
  function protectLeftMs(){ return Math.max(0, ms(sab.protectUntil) - now()); }
  function malusLeftMs(){ let mx=0; subi.forEach(r=>{ const t=ms(r.malus_until); if(t>mx) mx=t; }); return Math.max(0, mx-now()); }

  function render(){
    if(ticker){ clearInterval(ticker); ticker=null; }
    const aWait = attackWaitMs(), pLeft = protectLeftMs(), mLeft = malusLeftMs();

    let html = `
      <div class="gege">
        <div class="gege-ava">🧓</div>
        <div class="gege-txt">"Ce fayot de Mickaël... Écoute-moi bien : sur le port, qui frappe le premier gagne. Va lui montrer — à lui, ou à n'importe quel rigolo qui te dépasse au classement."</div>
      </div>`;

    if(mLeft>0){
      html += `<div class="banner malus">⛔ Tu as été saboté ! Ton <b>Événement Flash</b> et ton <b>Salaire de direction</b> sont bloqués encore <span id="mLeft">${fmt(mLeft)}</span>.</div>`;
    }

    html += `
      <div class="sect-lbl">Ton atelier</div>
      <div class="card">
        <div class="status">
          <div class="st"><div class="st-val">${(money||0).toLocaleString('fr-FR')} €</div><div class="st-lbl">Ta caisse</div></div>
          <div class="st"><div class="st-val" id="aWait">${aWait>0?fmt(aWait):'Prêt'}</div><div class="st-lbl">Prochain sabotage</div></div>
        </div>`;
    if(pLeft>0){
      html += `<div class="banner protect" style="margin-top:12px;margin-bottom:0">🛡️ Vigile actif : tu es protégé encore <span id="pLeft">${fmt(pLeft)}</span>.</div>`;
    } else {
      html += `<button class="btn btn-shield" onclick="activateProtection()">🛡️ Engager un vigile (${PROTECT_HOURS}h) — ${PROTECT_COST.toLocaleString('fr-FR')}€</button>`;
    }
    html += `</div>`;

    html += `
      <div class="sect-lbl">Saboter un docker</div>
      <div class="card">
        <input class="search" id="search" placeholder="Rechercher un joueur…" value="${esc(filter)}" oninput="filterPlayers(this.value)">
        <div class="list" id="playerList"><div class="empty">Chargement des joueurs…</div></div>
      </div>`;

    // Journal
    html += `<div class="sect-lbl">Journal</div><div class="card">`;
    const events = [...subi.map(r=>({...r, dir:'subi'})), ...infl.map(r=>({...r, dir:'infl'}))]
      .sort((a,b)=> ms(b.created_at)-ms(a.created_at)).slice(0,12);
    if(!events.length){ html += `<div class="empty">Aucun sabotage pour l'instant.</div>`; }
    else {
      events.forEach(r=>{
        if(r.dir==='subi'){
          const ic = r.blocked ? '🛡️' : '💥';
          const txt = r.blocked ? `Tu as bloqué <b>${esc(r.attacker_name||'?')}</b> grâce à ton vigile.`
            : `<b>${esc(r.attacker_name||'?')}</b> t'a sabordé : −${(r.stolen||0).toLocaleString('fr-FR')}€${ms(r.malus_until)>now()?' · gêne en cours':''}.`;
          html += `<div class="log-row"><div class="log-ic">${ic}</div><div class="log-txt">${txt}<div class="log-sub">${when(r.created_at)}</div></div></div>`;
        } else {
          const ic = r.blocked ? '🚫' : '🛠️';
          const txt = r.blocked ? `Sabotage raté sur <b>${esc(r.target_name||'?')}</b> (protégé).`
            : `Tu as sabordé <b>${esc(r.target_name||'?')}</b> : +${(r.stolen||0).toLocaleString('fr-FR')}€.`;
          html += `<div class="log-row"><div class="log-ic">${ic}</div><div class="log-txt">${txt}<div class="log-sub">${when(r.created_at)}</div></div></div>`;
        }
      });
    }
    html += `</div>
      <div class="sect-lbl">Règles</div>
      <div class="card info">Un sabotage <b>vole jusqu'à ${STEAL_CAP.toLocaleString('fr-FR')}€</b> (5% de la caisse adverse) et <b>bloque son Flash + Salaire de direction ${MALUS_HOURS}h</b>. Cooldown : 1 sabotage toutes les ${ATTACK_COOLDOWN_MS/3600000}h, et 24h max sur la même personne. Engage un <b>vigile</b> pour rendre tes propres sabotages impossibles pendant ${PROTECT_HOURS}h.</div>`;

    document.getElementById('content').innerHTML = html;
    if(!players.length) loadPlayers().then(renderPlayers); else renderPlayers();
    startTicker();
  }

  function when(iso){ const d=Math.floor((now()-ms(iso))/60000); if(d<1) return "à l'instant"; if(d<60) return 'il y a '+d+' min'; const h=Math.floor(d/60); if(h<24) return 'il y a '+h+'h'; return 'il y a '+Math.floor(h/24)+'j'; }

  function startTicker(){
    ticker = setInterval(()=>{
      const a=attackWaitMs(), p=protectLeftMs(), m=malusLeftMs();
      const ae=document.getElementById('aWait'); if(ae) ae.textContent = a>0?fmt(a):'Prêt';
      const pe=document.getElementById('pLeft'); if(pe){ if(p>0) pe.textContent=fmt(p); else render(); }
      const me=document.getElementById('mLeft'); if(me){ if(m>0) me.textContent=fmt(m); else render(); }
    }, 1000);
  }

  function filterPlayers(v){ filter=v; renderPlayers(); }
  function renderPlayers(){
    const box=document.getElementById('playerList'); if(!box) return;
    const f=filter.trim().toLowerCase();
    const list = players.filter(p=>p.username.toLowerCase().includes(f)).slice(0,40);
    if(!list.length){ box.innerHTML='<div class="empty">Aucun joueur trouvé.</div>'; return; }
    box.innerHTML = list.map(p=>`
      <div class="row">
        <div class="ava">${esc((p.username[0]||'?').toUpperCase())}</div>
        <div class="row-name">${esc(p.username)}</div>
        <button class="row-btn" onclick="doSabotage('${p.user_id}','${esc(p.username).replace(/'/g,"\\'")}')">🛠️ Saboter</button>
      </div>`).join('');
  }

  async function saveSab(){ try{ await sb.from('game_stats').update({ sabotage:sab }).eq('user_id',currentUser.id); }catch(e){ console.log('saveSab:',e); } }

  async function activateProtection(){
    if(protectLeftMs()>0){ showToast('Vigile déjà actif.'); return; }
    if((money||0) < PROTECT_COST){ showToast('Pas assez d\'argent (il faut '+PROTECT_COST.toLocaleString('fr-FR')+'€).'); return; }
    if(!confirm(`Engager un vigile ${PROTECT_HOURS}h pour ${PROTECT_COST.toLocaleString('fr-FR')}€ ?`)) return;
    try {
      const { data:fresh } = await sb.from('game_stats').select('money,sabotage').eq('user_id',currentUser.id).maybeSingle();
      if((fresh?.money||0) < PROTECT_COST){ showToast('Pas assez d\'argent.'); return; }
      sab = (fresh?.sabotage && typeof fresh.sabotage==='object') ? fresh.sabotage : {};
      sab.protectUntil = new Date(now()+PROTECT_HOURS*3600*1000).toISOString();
      const newMoney = (fresh?.money||0) - PROTECT_COST;
      await sb.from('game_stats').update({ money:newMoney, sabotage:sab }).eq('user_id',currentUser.id);
      money = newMoney;
      showToast(`🛡️ Vigile engagé pour ${PROTECT_HOURS}h !`);
      render();
    } catch(e){ console.log('protect:',e); showToast('Erreur, réessaie.'); }
  }

  async function doSabotage(targetId, targetName){
    if(attackWaitMs()>0){ showToast('Patiente '+fmt(attackWaitMs())+' avant de saboter à nouveau.'); return; }
    // cooldown sur la même cible
    try {
      const since = new Date(now()-TARGET_COOLDOWN_MS).toISOString();
      const { data:recent } = await sb.from('sabotages').select('id').eq('attacker_id',currentUser.id).eq('target_id',targetId).gt('created_at',since).limit(1);
      if(recent && recent.length){ showToast('Tu as déjà saboté '+targetName+' récemment (24h).'); return; }
    } catch(e){ console.log(e); }
    // lecture de la cible
    let tMoney=0, tProtected=false;
    try {
      const { data:t } = await sb.from('game_stats').select('money,sabotage').eq('user_id',targetId).maybeSingle();
      tMoney = t?.money || 0;
      const tSab = (t?.sabotage && typeof t.sabotage==='object') ? t.sabotage : {};
      tProtected = ms(tSab.protectUntil) > now();
    } catch(e){ console.log(e); }

    if(!confirm(`Saboter ${targetName} ?\n\n• Vol : jusqu'à ${STEAL_CAP.toLocaleString('fr-FR')}€ (5% de sa caisse)\n• Gêne : son Flash + Salaire bloqués ${MALUS_HOURS}h\n\nS'il a un vigile actif, le sabotage échoue.`)) return;

    const nowIso = new Date().toISOString();
    if(tProtected){
      try { await sb.from('sabotages').insert({ attacker_id:currentUser.id, attacker_name:username, target_id:targetId, target_name:targetName, stolen:0, blocked:true, processed:true }); } catch(e){ console.log(e); }
      sab.lastAttack = nowIso; await saveSab();
      showToast(`🛡️ Raté ! ${targetName} est protégé par un vigile.`);
      await loadActivity(); render(); return;
    }

    const steal = Math.min(Math.round(tMoney*STEAL_PCT), STEAL_CAP, tMoney);
    const malusUntil = new Date(now()+MALUS_HOURS*3600*1000).toISOString();
    try {
      const { data:fresh } = await sb.from('game_stats').select('money').eq('user_id',currentUser.id).maybeSingle();
      const newMoney = (fresh?.money||0) + steal;
      await sb.from('game_stats').update({ money:newMoney }).eq('user_id',currentUser.id);
      money = newMoney;
      await sb.from('sabotages').insert({ attacker_id:currentUser.id, attacker_name:username, target_id:targetId, target_name:targetName, stolen:steal, malus_until:malusUntil, blocked:false, processed:false });
    } catch(e){ console.log('sabotage:',e); showToast('Erreur, réessaie.'); return; }
    sab.lastAttack = nowIso; await saveSab();
    showToast(`🛠️ Réussi ! +${steal.toLocaleString('fr-FR')}€ volés · ${targetName} ralenti ${MALUS_HOURS}h.`);
    await loadActivity(); render();
  }

  let toastT;
  function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show'; clearTimeout(toastT); toastT=setTimeout(()=>t.className='toast',3000); }

  init();
</script>
</body>
</html>
