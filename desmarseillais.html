<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Dés Marseillais — Battle Dock Casino</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{height:100%;height:100dvh;overflow:hidden;font-family:'Inter',sans-serif}
body{background:radial-gradient(ellipse at top,#1a0a00,#0f0500 60%,#040200);display:flex;flex-direction:column}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,44px)+12px) 16px 12px;flex-shrink:0;background:rgba(0,0,0,.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.btn-back{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:7px 14px;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;color:#fff;cursor:pointer}
.hdr-title{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#fbbf24;letter-spacing:3px}
.hdr-bal{background:rgba(0,0,0,.3);border:1px solid rgba(251,191,36,.3);border-radius:20px;padding:7px 14px;font-family:'Bebas Neue',sans-serif;font-size:15px;color:#fbbf24}
.game{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 16px;gap:14px;min-height:0}
.chips{display:flex;gap:6px;width:100%;max-width:420px}
.chip{flex:1;padding:10px 4px;border-radius:20px;text-align:center;cursor:pointer;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;border:1.5px solid rgba(255,255,255,.1);color:rgba(255,255,255,.4);background:rgba(255,255,255,.06);transition:all .15s}
.chip.sel{background:rgba(251,191,36,.2);border-color:#fbbf24;color:#fbbf24}
.chip:active{transform:scale(.96)}
.spin-btn{width:100%;max-width:420px;padding:16px;border:none;border-radius:16px;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a0000;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px;cursor:pointer;box-shadow:0 6px 24px rgba(251,191,36,.35);transition:all .15s;font-weight:900}
.spin-btn:active{transform:scale(.98);opacity:.9}
.spin-btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.result{display:none;padding:13px 16px;border-radius:16px;text-align:center;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;width:100%;max-width:420px;animation:pop .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
.result.win{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;box-shadow:0 4px 16px rgba(22,163,74,.4)}
.result.lose{background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.6)}
.result.jackpot{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a0000;box-shadow:0 4px 16px rgba(251,191,36,.5)}

.des-table{background:linear-gradient(135deg,#1a0a00,#2d1500);border:3px solid rgba(251,191,36,.3);border-radius:24px;width:100%;max-width:420px;padding:18px 16px;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.des-area{display:flex;gap:16px;justify-content:center;align-items:center;margin-bottom:14px}
.de{width:72px;height:72px;border-radius:16px;background:#fff;border:3px solid #1a1a1a;display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 4px 12px rgba(0,0,0,.4);transition:transform .1s}
.de.rolling{animation:deRoll .1s linear infinite}
@keyframes deRoll{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.des-cibles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.cible{padding:8px 12px;border-radius:10px;font-family:'Bebas Neue',sans-serif;font-size:14px;cursor:pointer;border:2px solid rgba(255,255,255,.1);color:rgba(255,255,255,.4);background:rgba(255,255,255,.06);transition:all .15s}
.cible.sel{background:rgba(251,191,36,.2);border-color:#fbbf24;color:#fbbf24}
.cible:active{transform:scale(.95)}
.des-sub{font-size:9px;font-weight:800;color:rgba(255,255,255,.25);letter-spacing:2px;text-align:center}
</style>
</head>
<body>
<div class="hdr">
  <button class="btn-back" onclick="location.href='casino.html'">← CASINO</button>
  <div class="hdr-title">🎲 DÉS MARSEILLAIS</div>
  <div class="hdr-bal" id="balance">0€</div>
</div>
<div class="game">
  <div class="des-table">
    <div class="des-area">
      <div class="de" id="de1">⚀</div>
      <div class="de" id="de2">⚀</div>
    </div>
    <div class="des-cibles" id="ciblesEl"></div>
    <div class="des-sub">Choisis un résultat · Lance les dés</div>
  </div>
  <div class="result" id="result"></div>
  <div class="chips">
    <div class="chip sel" id="c1000" onclick="setBet(1000,'c1000')">1K</div>
    <div class="chip" id="c5000" onclick="setBet(5000,'c5000')">5K</div>
    <div class="chip" id="c10000" onclick="setBet(10000,'c10000')">10K</div>
    <div class="chip" id="c25000" onclick="setBet(25000,'c25000')">25K</div>
  </div>
<button class="spin-btn" id="btnPlay" onclick="play()">LANCER — <span id="betLabel">1 000€</span></button>
</div>
<script>

  var sb = supabase.createClient('https://drtsuhnbclhmgfjiykap.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg');
  var fmt=function(n){return Math.floor(n).toLocaleString('fr-FR');};
  var el=function(id){return document.getElementById(id);};
  var money=0,bet=1000,pari='faible',busy=false,currentUser=null;

  // Positions des points pour chaque valeur de dé
  var DOT_PATTERNS = {
    1:[[1,1]],
    2:[[0,0],[2,2]],
    3:[[0,0],[1,1],[2,2]],
    4:[[0,0],[0,2],[2,0],[2,2]],
    5:[[0,0],[0,2],[1,1],[2,0],[2,2]],
    6:[[0,0],[0,1],[0,2],[2,0],[2,1],[2,2]]
  };

  function renderDie(id, val) {
    var die = el(id);
    die.innerHTML = '';
    for (var r=0;r<3;r++) for (var c=0;c<3;c++) {
      var d = document.createElement('div');
      var has = DOT_PATTERNS[val] && DOT_PATTERNS[val].some(function(p){return p[0]===r&&p[1]===c;});
      d.className = 'dot' + (has ? '' : ' empty');
      die.appendChild(d);
    }
  }

  function selBet(b) {
    if (busy) return;
    pari = b;
    ['bFaible','bFort','bTriple'].forEach(function(id){el(id).classList.remove('sel');});
    el(b==='faible'?'bFaible':b==='fort'?'bFort':'bTriple').classList.add('sel');
  }

  function setBet(val,id) {
    bet=val;
    ['c1000','c5000','c10000','c25000'].forEach(function(i){el(i).classList.toggle('sel',i===id);});
    el('betLabel').textContent=fmt(val)+'€';
  }

  function updateBal(){el('balance').textContent=fmt(money)+'€';}

  function play() {
    if (busy||money<bet) return;
    busy=true; money-=bet; updateBal();
    el('btnPlay').disabled=true; el('result').style.display='none';
    el('sumSub').textContent='...';

    var vals = [1,1,1];
    [0,1,2].forEach(function(i){el('d'+i).classList.add('rolling');});

    var t=0, interval = setInterval(function(){
      t++;
      vals = [Math.ceil(Math.random()*6),Math.ceil(Math.random()*6),Math.ceil(Math.random()*6)];
      [0,1,2].forEach(function(i){renderDie('d'+i,vals[i]);});
      if (t>=12) {
        clearInterval(interval);
        [0,1,2].forEach(function(i){el('d'+i).classList.remove('rolling');});
        settle(vals);
      }
    },80);
  }

  function settle(vals) {
    var sum = vals[0]+vals[1]+vals[2];
    var isTriple = vals[0]===vals[1]&&vals[1]===vals[2];
    el('sumVal').textContent = sum;

    var gain=0, msg='', cls='lose';
    if (pari==='triple' && isTriple) {
      gain=Math.floor(bet*25); msg='TRIPLE '+vals[0]+'! +'+fmt(gain)+'€'; cls='win';
    } else if (pari==='faible' && sum<=10 && !isTriple) {
      gain=Math.floor(bet*1.9); msg='FAIBLE '+sum+' ! +'+fmt(gain-bet)+'€'; cls='win';
    } else if (pari==='fort' && sum>=11 && !isTriple) {
      gain=Math.floor(bet*1.9); msg='FORT '+sum+' ! +'+fmt(gain-bet)+'€'; cls='win';
    } else {
      msg=(isTriple?'TRIPLE (mauvais pari) — ':'')+sum+' — PERDU !';
    }

    el('sumSub').textContent=isTriple?'TRIPLE !':sum<=10?'FAIBLE':'FORT';
    if (gain>0) { money+=gain; updateBal(); }

    var r=el('result');
    r.textContent=msg; r.className='result '+cls; r.style.display='block';
    busy=false; el('btnPlay').disabled=false;
    if (currentUser) sb.from('game_stats').update({money:Math.floor(money)}).eq('user_id',currentUser.id);
  }

  async function init(){
    var res=await sb.auth.getSession();
    var s=res.data&&res.data.session;
    if(!s){await new Promise(function(r){setTimeout(r,1000);});res=await sb.auth.getSession();s=res.data&&res.data.session;if(!s){window.location.href='index.html';return;}}
    currentUser=s.user;
    var d=await sb.from('game_stats').select('money').eq('user_id',currentUser.id).maybeSingle();
    money=(d.data&&d.data.money)||0; updateBal();
    [0,1,2].forEach(function(i){renderDie('d'+i,i+1);});
  }
  document.addEventListener('gesturestart',function(e){e.preventDefault();});
  init();

</script>
</body>
</html>
