<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Course Hippique - Battle Dock</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
    input { -webkit-user-select:text; user-select:text; }

    body {
      font-family:'Inter',sans-serif;
      background:linear-gradient(180deg,#450a0a,#7f1d1d,#991b1b);
      color:white; min-height:100vh; padding-bottom:40px;
    }

    /* HEADER */
    .header {
      background:linear-gradient(135deg,#7f1d1d,#991b1b);
      border-bottom:2px solid rgba(251,191,36,0.3);
      padding:14px 16px; display:flex; align-items:center; gap:12px;
    }
    .back-btn { background:rgba(0,0,0,0.3); border:1px solid rgba(251,191,36,0.3); border-radius:8px; padding:8px 12px; font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:1px; color:#fbbf24; cursor:pointer; }
    .header-title { font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:2px; color:#fbbf24; flex:1; }
    .balance-box { background:white; border-radius:10px; padding:6px 14px; text-align:center; }
    .balance-lbl { font-size:9px; color:rgba(0,0,0,0.5); font-weight:700; text-transform:uppercase; }
    .balance-val { font-family:'Bebas Neue',sans-serif; font-size:16px; color:#1a1a1a; letter-spacing:0.5px; }

    .container { max-width:500px; margin:0 auto; padding:16px; }

    /* HERO */
    .hero {
      background:linear-gradient(135deg,#7f1d1d,#991b1b);
      border:2px solid rgba(251,191,36,0.5);
      border-radius:20px; padding:20px;
      margin-bottom:16px; text-align:center;
      box-shadow:0 8px 24px rgba(0,0,0,0.4);
      position:relative; overflow:hidden;
    }
    .hero::before { content:''; position:absolute; inset:0; background:radial-gradient(circle at 50% 0%,rgba(251,191,36,0.08),transparent 60%); }
    .hero-icon { font-size:48px; margin-bottom:6px; }
    .hero-title { font-family:'Bebas Neue',sans-serif; font-size:30px; letter-spacing:3px; background:linear-gradient(135deg,#fbbf24,#f59e0b); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .hero-sub { font-size:12px; color:rgba(251,191,36,0.6); margin-top:4px; }

    /* PISTE DE COURSE */
    .track-section {
      background:rgba(0,0,0,0.4);
      border:2px solid rgba(251,191,36,0.3);
      border-radius:16px; padding:16px;
      margin-bottom:16px;
    }
    .track-title { font-size:11px; font-weight:700; color:rgba(251,191,36,0.7); text-transform:uppercase; letter-spacing:2px; margin-bottom:12px; }

    .horse-lane {
      display:flex; align-items:center; gap:10px;
      margin-bottom:10px; position:relative; height:44px;
    }
    .horse-lane:last-child { margin-bottom:0; }

    .lane-track {
      flex:1; height:44px; border-radius:8px;
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.08);
      position:relative; overflow:hidden;
    }
    .lane-grass {
      position:absolute; inset:0;
      background:repeating-linear-gradient(90deg, rgba(34,197,94,0.05) 0px, rgba(34,197,94,0.05) 20px, transparent 20px, transparent 40px);
    }
    .lane-horse {
      position:absolute; top:50%; transform:translateY(-50%);
      font-size:28px; left:4px;
      transition:left 0.05s linear;
      filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }
    .finish-line {
      position:absolute; right:12px; top:0; bottom:0;
      width:3px; background:repeating-linear-gradient(180deg,white 0px,white 4px,transparent 4px,transparent 8px);
      opacity:0.4;
    }

    .horse-num {
      width:28px; height:28px; border-radius:8px;
      display:flex; align-items:center; justify-content:center;
      font-family:'Bebas Neue',sans-serif; font-size:15px; font-weight:700;
      flex-shrink:0;
    }
    .horse-name-wrap { width:80px; flex-shrink:0; }
    .horse-name { font-size:11px; font-weight:700; color:white; }
    .horse-odds { font-family:'Bebas Neue',sans-serif; font-size:13px; color:#fbbf24; }

    /* COULEURS CHEVAUX */
    .h1 .horse-num { background:rgba(239,68,68,0.3); color:#ef4444; border:1px solid rgba(239,68,68,0.4); }
    .h2 .horse-num { background:rgba(59,130,246,0.3); color:#60a5fa; border:1px solid rgba(59,130,246,0.4); }
    .h3 .horse-num { background:rgba(34,197,94,0.3); color:#4ade80; border:1px solid rgba(34,197,94,0.4); }
    .h4 .horse-num { background:rgba(251,191,36,0.3); color:#fbbf24; border:1px solid rgba(251,191,36,0.4); }

    /* SÉLECTION CHEVAL */
    .horse-select-grid {
      display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:16px;
    }
    .horse-btn {
      background:rgba(0,0,0,0.3); border:2px solid rgba(255,255,255,0.1);
      border-radius:14px; padding:14px 10px; text-align:center; cursor:pointer;
      transition:all 0.2s;
    }
    .horse-btn:active { transform:scale(0.97); }
    .horse-btn.selected { border-width:2px; }
    .h1-btn.selected { background:rgba(239,68,68,0.2); border-color:#ef4444; box-shadow:0 0 16px rgba(239,68,68,0.3); }
    .h2-btn.selected { background:rgba(59,130,246,0.2); border-color:#60a5fa; box-shadow:0 0 16px rgba(59,130,246,0.3); }
    .h3-btn.selected { background:rgba(34,197,94,0.2); border-color:#4ade80; box-shadow:0 0 16px rgba(34,197,94,0.3); }
    .h4-btn.selected { background:rgba(251,191,36,0.2); border-color:#fbbf24; box-shadow:0 0 16px rgba(251,191,36,0.3); }
    .hbtn-emoji { font-size:26px; margin-bottom:6px; }
    .hbtn-name { font-weight:700; font-size:13px; color:white; margin-bottom:2px; }
    .hbtn-odds { font-family:'Bebas Neue',sans-serif; font-size:18px; }
    .h1-btn .hbtn-odds { color:#ef4444; }
    .h2-btn .hbtn-odds { color:#60a5fa; }
    .h3-btn .hbtn-odds { color:#4ade80; }
    .h4-btn .hbtn-odds { color:#fbbf24; }

    /* MISE */
    .bet-section {
      background:rgba(0,0,0,0.3); border:1px solid rgba(251,191,36,0.2);
      border-radius:14px; padding:14px; margin-bottom:16px;
    }
    .bet-label { font-size:11px; font-weight:700; color:rgba(251,191,36,0.7); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
    .bet-input-wrap { display:flex; align-items:center; background:rgba(0,0,0,0.3); border:2px solid rgba(251,191,36,0.3); border-radius:12px; overflow:hidden; margin-bottom:10px; }
    .bet-input-wrap:focus-within { border-color:rgba(251,191,36,0.8); }
    .bet-input { flex:1; background:none; border:none; padding:12px 14px; font-size:20px; font-weight:700; color:white; font-family:'Bebas Neue',sans-serif; letter-spacing:1px; outline:none; }
    .bet-euro { font-family:'Bebas Neue',sans-serif; font-size:20px; color:#fbbf24; padding-right:14px; }
    .bet-quick { display:flex; gap:8px; }
    .bet-quick-btn { flex:1; background:rgba(251,191,36,0.1); border:1px solid rgba(251,191,36,0.2); color:#fbbf24; font-family:'Bebas Neue',sans-serif; font-size:13px; padding:7px 4px; border-radius:8px; cursor:pointer; letter-spacing:0.5px; transition:all 0.15s; }
    .bet-quick-btn:active { background:rgba(251,191,36,0.25); transform:scale(0.96); }

    /* BOUTON LANCER */
    .race-btn {
      width:100%; height:60px; border:none; border-radius:16px;
      font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:3px;
      cursor:pointer; transition:all 0.15s; margin-bottom:16px;
      background:linear-gradient(135deg,#fbbf24,#f59e0b);
      color:#7f1d1d; font-weight:900;
      box-shadow:0 6px 24px rgba(251,191,36,0.4), inset 0 1px 0 rgba(255,255,255,0.3);
      border:2px solid rgba(251,191,36,0.8);
    }
    .race-btn:active { transform:scale(0.97); }
    .race-btn:disabled { background:rgba(255,255,255,0.08); color:rgba(255,255,255,0.2); box-shadow:none; border-color:transparent; cursor:not-allowed; }

    /* RÉSULTAT */
    .result-box {
      border-radius:16px; padding:20px; text-align:center; margin-bottom:16px;
      animation:resPop 0.4s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes resPop { from{transform:scale(0.8);opacity:0} to{transform:scale(1);opacity:1} }
    .result-box.win  { background:linear-gradient(135deg,#fbbf24,#f59e0b); border:3px solid rgba(251,191,36,0.9); color:#7f1d1d; box-shadow:0 8px 32px rgba(251,191,36,0.4); }
    .result-box.lose { background:rgba(0,0,0,0.4); border:2px solid rgba(255,255,255,0.1); }
    .res-emoji { font-size:44px; margin-bottom:8px; }
    .res-title { font-family:'Bebas Neue',sans-serif; font-size:28px; letter-spacing:2px; margin-bottom:4px; }
    .res-amount { font-family:'Bebas Neue',sans-serif; font-size:40px; letter-spacing:1px; margin-bottom:6px; }
    .res-detail { font-size:13px; opacity:0.8; }

    /* PODIUM */
    .podium {
      background:rgba(0,0,0,0.3); border:1px solid rgba(251,191,36,0.2);
      border-radius:12px; padding:12px; margin-bottom:16px;
    }
    .podium-title { font-size:11px; font-weight:700; color:rgba(251,191,36,0.7); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
    .podium-row { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid rgba(255,255,255,0.05); font-size:13px; }
    .podium-row:last-child { border-bottom:none; }
    .podium-medal { width:22px; text-align:center; }

    .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.8); border:1px solid rgba(251,191,36,0.3); color:#fbbf24; padding:12px 20px; border-radius:20px; font-size:13px; font-weight:600; z-index:100; opacity:0; transition:opacity 0.3s; white-space:nowrap; }
    .toast.show { opacity:1; }
    .toast.error { color:#fca5a5; border-color:rgba(239,68,68,0.3); }

    /* FLUIDITÉ */
    button, .horse-btn { transition:transform 0.15s ease, opacity 0.15s ease, box-shadow 0.15s ease !important; }
  </style>
</head>
<body>

  <div class="header">
    <button class="back-btn" onclick="window.location.href='casino.html'">← Retour</button>
    <div class="header-title">🏇 Course Hippique</div>
    <div class="balance-box">
      <div class="balance-lbl">Solde</div>

  <div class="container">

    <!-- HERO -->
    <div class="hero">

      <div class="hero-title">Grand Prix du Port</div>

    <!-- PISTE -->
    <div class="track-section">

        <div class="horse-num">2</div>
        <div class="horse-name-wrap"><div class="horse-name" id="name1">---</div><div class="horse-odds" id="odds1">x0</div></div>
        <div class="lane-track"><div class="lane-grass"></div><div class="lane-horse" id="horse1">🐴</div><div class="finish-line"></div></div>
      </div>
      <div class="horse-lane h3">
        <div class="horse-num">3</div>
        <div class="horse-name-wrap"><div class="horse-name" id="name2">---</div><div class="horse-odds" id="odds2">x0</div></div>
        <div class="lane-track"><div class="lane-grass"></div><div class="lane-horse" id="horse2">🐴</div><div class="finish-line"></div></div>
      </div>
      <div class="horse-lane h4">
        <div class="horse-num">4</div>
        <div class="horse-name-wrap"><div class="horse-name" id="name3">---</div><div class="horse-odds" id="odds3">x0</div></div>
        <div class="lane-track"><div class="lane-grass"></div><div class="lane-horse" id="horse3">🐴</div><div class="finish-line"></div></div>
      </div>
    </div>

    <!-- RÉSULTAT -->
    <div id="resultBox" style="display:none"></div>
    <div id="podiumBox" style="display:none"></div>

    <!-- SÉLECTION CHEVAL -->
    <div class="horse-select-grid" id="horseSelectGrid"></div>

    <!-- MISE -->
    <div class="bet-section">
      <div class="bet-label">💶 Ta mise</div>
      <div class="bet-input-wrap">
        <input class="bet-input" id="betInput" type="number" placeholder="0" min="1">
        <div class="bet-euro">€</div>
      </div>
      <div class="bet-quick">
        <button class="bet-quick-btn" onclick="setBet(100)">100€</button>
        <button class="bet-quick-btn" onclick="setBet(500)">500€</button>
        <button class="bet-quick-btn" onclick="setBet(1000)">1K€</button>
        <button class="bet-quick-btn" onclick="setBet(5000)">5K€</button>
        <button class="bet-quick-btn" onclick="setHalfBet()">½</button>
        <button class="bet-quick-btn" onclick="setMaxBet()">MAX</button>
      </div>
    </div>

    <button class="race-btn" id="raceBtn" onclick="startRace()">🏁 LANCER LA COURSE</button>

  </div>

  <div class="toast" id="toast"></div>

  <script>
    const SB_URL = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const sb = createClient(SB_URL, SB_KEY);

    let currentUser = null;
    let currentMoney = 0;
    let selectedHorse = null;
    let isRacing = false;
    let horses = [];
    let trackWidth = 0;

    // Noms de chevaux marrants
    const HORSE_NAMES = [
      ['Turbo Éclair','Jean-Pierre','Sabot Doré','Vent du Port'],
      ['Bidon Volant','Madame Carotte','Flash McHoof','Le Dernier'],
      ['Capitaine Crin','Botte Secrète','Prince Boiteux','Miss Pelouse'],
      ['Éclair de Dock','Gros Sabots','Lady Foin','Turbo Mollasse'],
      ['Vitesse Zéro','Monsieur Rapide','La Tortue','Coup de Bol'],
    ];

    // RTP ~88% — cotes calibrées
    // prob × cote = RTP attendu
    const CONFIGS = [
      { odds:1.6, prob:0.48 }, // favori — 1.6×0.48 = 0.768
      { odds:2.2, prob:0.32 }, // 2.2×0.32 = 0.704
      { odds:3.5, prob:0.18 }, // 3.5×0.18 = 0.630
      { odds:5.5, prob:0.10 }, // outsider — 5.5×0.10 = 0.550
    ];

    const COLORS = ['#ef4444','#60a5fa','#4ade80','#fbbf24'];
    const EMOJIS = ['🏇','🐎','🐴','🦄'];

    function generateHorses() {
      const names = HORSE_NAMES[Math.floor(Math.random() * HORSE_NAMES.length)];
      // Mélanger les configs pour que le favori ne soit pas toujours #1
      const shuffledConfigs = [...CONFIGS].sort(() => Math.random() - 0.5);
      horses = shuffledConfigs.map((cfg, i) => ({
        name: names[i],
        odds: cfg.odds,
        prob: cfg.prob,
        color: COLORS[i],
        emoji: EMOJIS[i],
      }));
    }

    function renderHorses() {
      horses.forEach((h, i) => {
        document.getElementById('name' + i).textContent = h.name;
        document.getElementById('odds' + i).textContent = 'x' + h.odds.toFixed(1);
        document.getElementById('horse' + i).textContent = h.emoji;
        document.getElementById('horse' + i).style.left = '4px';
      });

      const grid = document.getElementById('horseSelectGrid');
      grid.innerHTML = horses.map((h, i) => `
        <div class="horse-btn h${i+1}-btn ${selectedHorse === i ? 'selected' : ''}" onclick="selectHorse(${i})">
          <div class="hbtn-emoji">${h.emoji}</div>
          <div class="hbtn-name">${h.name}</div>
          <div class="hbtn-odds">x${h.odds.toFixed(1)}</div>
        </div>`).join('');
    }

    function selectHorse(idx) {
      if (isRacing) return;
      selectedHorse = idx;
      renderHorses();
    }

    function setBet(amount) { document.getElementById('betInput').value = Math.min(amount, currentMoney); }
    function setHalfBet()   { document.getElementById('betInput').value = Math.max(1, Math.floor(currentMoney / 2)); }
    function setMaxBet()    { document.getElementById('betInput').value = currentMoney; }

    async function startRace() {
      if (isRacing) return;
      if (selectedHorse === null) { showToast('Choisis un cheval !', 'error'); return; }

      const bet = parseInt(document.getElementById('betInput').value);
      if (!bet || bet <= 0)       { showToast('Entre une mise !', 'error'); return; }
      if (bet > currentMoney)     { showToast('Fonds insuffisants !', 'error'); return; }

      isRacing = true;
      document.getElementById('raceBtn').disabled = true;
      document.getElementById('resultBox').style.display = 'none';
      document.getElementById('podiumBox').style.display = 'none';

      // Déduire la mise
      await updateMoney(currentMoney - bet);
      await recordBet('Course Hippique', bet);

      // Déterminer le gagnant avec les vraies probs
      const winner = pickWinner();

      // Lancer l'animation
      await animateRace(winner);

      // Résultat
      const won = selectedHorse === winner;
      const gain = won ? Math.floor(bet * horses[winner].odds) : 0;

      if (won) {
        await updateMoney(currentMoney + gain);
        await recordWin('Course Hippique', gain);
        showResult(true, gain, bet, winner);
      } else {
        showResult(false, 0, bet, winner);
      }

      showPodium(winner);
      isRacing = false;
      document.getElementById('raceBtn').disabled = false;

      // Nouvelle course
      setTimeout(() => {
        generateHorses();
        renderHorses();
        selectedHorse = null;
      }, 3000);
    }

    function pickWinner() {
      // Tirage pondéré par les probabilités
      const total = horses.reduce((s, h) => s + h.prob, 0);
      let r = Math.random() * total;
      for (let i = 0; i < horses.length; i++) {
        r -= horses[i].prob;
        if (r <= 0) return i;
      }
      return horses.length - 1;
    }

    async function animateRace(winner) {
      return new Promise(resolve => {
        const tracks = document.querySelectorAll('.lane-track');
        const trackW = tracks[0].offsetWidth - 50;

        // Positions et vitesses
        const positions = [0, 0, 0, 0];
        const baseSpeed = [2.5, 2.3, 2.1, 1.9]; // vitesses de base différentes

        // Le gagnant aura un boost final
        let finished = false;
        let frame = 0;

        const interval = setInterval(() => {
          frame++;
          let anyFinished = false;

          for (let i = 0; i < 4; i++) {
            if (positions[i] >= trackW) continue;

            // Vitesse aléatoire avec boost final pour le gagnant
            let speed = baseSpeed[i] + Math.random() * 2 - 0.5;

            // Boost progressif pour le gagnant dans la dernière ligne droite
            if (i === winner && frame > 60) {
              speed += (frame - 60) * 0.04;
            }
            // Légère pénalité pour les perdants en fin de course
            if (i !== winner && frame > 80) {
              speed *= 0.95;
            }

            positions[i] = Math.min(trackW, positions[i] + speed);
            document.getElementById('horse' + i).style.left = positions[i] + 'px';

            if (positions[i] >= trackW) anyFinished = true;
          }

          if (anyFinished && !finished) {
            finished = true;
            // Finir proprement
            setTimeout(() => {
              clearInterval(interval);
              resolve();
            }, 500);
          }

          // Sécurité max 8 secondes
          if (frame > 240) {
            clearInterval(interval);
            resolve();
          }
        }, 33);
      });
    }

    function showResult(won, gain, bet, winner) {
      const box = document.getElementById('resultBox');
      box.style.display = 'block';
      if (won) {
        box.innerHTML = `<div class="result-box win">
          <div class="res-emoji">🏆</div>
          <div class="res-title">${horses[winner].name} gagne !</div>
          <div class="res-amount">+${gain.toLocaleString('fr-FR')}€</div>
          <div class="res-detail">Mise : ${bet.toLocaleString('fr-FR')}€ · Cote : x${horses[winner].odds.toFixed(1)}</div>
        </div>`;
      } else {
        box.innerHTML = `<div class="result-box lose">
          <div class="res-emoji">💀</div>
          <div class="res-title">${horses[winner].name} gagne !</div>
          <div class="res-amount" style="color:#fca5a5">-${bet.toLocaleString('fr-FR')}€</div>
          <div class="res-detail">Ton cheval : ${horses[selectedHorse].name}</div>
        </div>`;
      }
    }

    function showPodium(winner) {
      const order = [0,1,2,3].sort((a,b) => {
        if (a === winner) return -1;
        if (b === winner) return 1;
        return Math.random() - 0.5;
      });
      const medals = ['🥇','🥈','🥉','4️⃣'];
      const box = document.getElementById('podiumBox');
      box.style.display = 'block';
      box.innerHTML = `<div class="podium">
        <div class="podium-title">🏁 Classement final</div>
        ${order.map((i,rank) => `
          <div class="podium-row">
            <div class="podium-medal">${medals[rank]}</div>
            <span style="color:${horses[i].color}">${horses[i].emoji}</span>
            <span style="flex:1;font-weight:${i===selectedHorse?'700':'400'};color:${i===selectedHorse?'#fbbf24':'white'}">${horses[i].name}${i===selectedHorse?' (ton choix)':''}</span>
            <span style="color:rgba(255,255,255,0.4);font-size:12px">x${horses[i].odds.toFixed(1)}</span>
          </div>`).join('')}
      </div>`;
    }

    async function updateMoney(amount) {
      currentMoney = amount;
      document.getElementById('balanceDisplay').textContent = amount.toLocaleString('fr-FR') + '€';
      await sb.from('game_stats').update({ money: amount }).eq('user_id', currentUser.id);
    }

    async function recordBet(game, amount) {
      try {
        const username = (currentUser.email||'').split('@')[0]||'Docker';
        await sb.from('casino_wins').insert({ user_id:currentUser.id, user_name:username, game_name:game, amount_bet:amount, amount_won:0 });
        try { await sb.rpc('increment_jackpot', { amount:Math.floor(amount*0.05) }); } catch(e){}
      } catch(e) {}
    }

    async function recordWin(game, amount) {
      try {
        const username = (currentUser.email||'').split('@')[0]||'Docker';
        await sb.from('casino_wins').insert({ user_id:currentUser.id, user_name:username, game_name:game, amount_bet:0, amount_won:amount });
        const { data } = await sb.from('game_stats').select('biggest_win').eq('user_id', currentUser.id).maybeSingle();
        if (!data || amount > (data.biggest_win||0)) {
          await sb.from('game_stats').update({ biggest_win:amount }).eq('user_id', currentUser.id);
        }
      } catch(e) {}
    }

    function showToast(msg, type='') {
      const t = document.getElementById('toast');
      t.textContent=msg; t.className='toast show '+type;
      setTimeout(()=>t.className='toast',2800);
    }

    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { window.location.href='index.html'; return; }
      currentUser = session.user;
      const { data } = await sb.from('game_stats').select('money').eq('user_id', currentUser.id).maybeSingle();
      currentMoney = data?.money || 0;
      document.getElementById('balanceDisplay').textContent = currentMoney.toLocaleString('fr-FR') + '€';
      generateHorses();
      renderHorses();
    }

    init();
  </script>
</body>
</html>
