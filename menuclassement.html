<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Social · Battle Dock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body {
      font-family:'Inter',sans-serif;
      min-height:100dvh; display:flex; flex-direction:column;
      background:radial-gradient(ellipse at 60% 0%,rgba(16,185,129,0.20),transparent 52%),radial-gradient(ellipse at 20% 90%,rgba(52,211,153,0.14),transparent 48%),linear-gradient(160deg,#f0fdf6,#dcfce7);
      padding-bottom:calc(70px + env(safe-area-inset-bottom));
    }
    .page-header {
      padding:calc(20px + env(safe-area-inset-top)) 20px 16px;
      display:flex; align-items:center; gap:12px;
    }
    .page-ico { font-size:32px; }
    .page-title { font-family:'Bebas Neue',sans-serif; font-size:28px; letter-spacing:2px; color:#0f172a; }
    .grid {
      flex:1; display:flex; flex-direction:column; gap:0;
      padding:0;
    }
    .mcard {
      display:flex; align-items:center; gap:16px;
      padding:18px 20px; cursor:pointer;
      border-bottom:1px solid rgba(15,23,42,0.06);
      transition:opacity .15s ease;
    }
    .mcard:active { opacity:.75; }
    .mcard-ico { font-size:36px; flex-shrink:0; width:52px; text-align:center; }
    .mcard-info { flex:1; }
    .mcard-title { font-family:'Bebas Neue',sans-serif; font-size:19px; letter-spacing:1px; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,0.35); }
    .mcard-sub { font-size:11px; color:rgba(255,255,255,0.72); margin-top:2px; text-shadow:0 1px 3px rgba(0,0,0,0.3); }
    .mcard-arrow { color:rgba(255,255,255,0.5); font-size:18px; }
  </style>
    <style id="navRedesign">
    /* ===== Barre de navigation — unifiée ===== */
    .bottom-nav{
      position:fixed; left:50%; transform:translateX(-50%); bottom:0;
      width:100%; max-width:600px; height:56px; z-index:200;
      display:flex; align-items:stretch;
      padding:0 4px env(safe-area-inset-bottom) 4px;
      background:#fff;
      border-top:1px solid rgba(15,23,42,0.07);
      box-shadow:0 -2px 14px rgba(15,23,42,0.06);
    }
    .bottom-nav .bn-item{
      flex:1; min-width:0; border:none; background:transparent; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      position:relative; padding:0;
      -webkit-tap-highlight-color:transparent;
    }
    /* pastille — toujours visible, teintée par section */
    .bottom-nav .bn-item::before{
      content:''; position:absolute; top:10px; left:50%;
      width:44px; height:34px; border-radius:12px;
      transform:translateX(-50%);
      opacity:0; background:#94a3b8; background-size:220% 100%;
      transition:opacity .22s ease;
      z-index:0;
    }
    .bottom-nav .bn-item[data-tab="histoire"]::before{   background-image:linear-gradient(120deg,#a78bfa,#8b5cf6,#a78bfa); }
    .bottom-nav .bn-item[data-tab="travail"]::before{    background-image:linear-gradient(120deg,#38bdf8,#0ea5e9,#38bdf8); }
    .bottom-nav .bn-item[data-tab="jeux"]::before{       background-image:linear-gradient(120deg,#f472b6,#ec4899,#f472b6); }
    .bottom-nav .bn-item[data-tab="boutique"]::before{   background-image:linear-gradient(120deg,#fbbf24,#f59e0b,#fbbf24); }
    .bottom-nav .bn-item[data-tab="classement"]::before{ background-image:linear-gradient(120deg,#34d399,#10b981,#34d399); }
    /* actif : pleine opacité + respiration douce */
    .bottom-nav .bn-item.active::before{
      opacity:1;
      animation:pillBreath 2.8s ease-in-out infinite;
    }
    @keyframes pillBreath{
      0%,100%{ transform:translateX(-50%) scale(1);     background-position:0%   50%; }
      50%{     transform:translateX(-50%) scale(1.06); background-position:100% 50%; }
    }
    /* icône */
    .bottom-nav .bn-item .bn-ic{
      position:relative; z-index:1; font-size:22px; line-height:1;
      transition:transform .26s cubic-bezier(.34,1.56,.5,1), opacity .22s ease;
      opacity:.6;
    }
    .bottom-nav .bn-item .bn-ic svg{ display:none !important; }
    .bottom-nav .bn-item .bn-lb{ display:none; }
    .bottom-nav .bn-item.active .bn-ic{ transform:translateY(-2px) scale(1.18); opacity:1; }
    .bottom-nav .bn-item:active{ opacity:.7; }
    @media (prefers-reduced-motion:reduce){
      .bottom-nav .bn-item.active::before{ animation:none; }
    }
    /* ===== Histoire plein écran ===== */
    body.histoire-full #installBanner{ display:none !important; }
    body.histoire-full #histoireCard{
      position:fixed; top:0; left:50%; transform:translateX(-50%);
      bottom:calc(56px + env(safe-area-inset-bottom));
      width:100%; max-width:600px; height:auto !important;
      margin:0 !important; border-radius:0 !important; z-index:150;
    }
  </style>
</head>

  <nav class="bottom-nav">
