<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>École des Dockers — Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;overflow:hidden}
body{font-family:'Inter',sans-serif;background:#fff;color:#1a1a1a;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.hdr{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);padding:calc(env(safe-area-inset-top,0px)+10px) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #f3f4f6}
.hdr-back{background:#f3f4f6;border:none;border-radius:10px;width:34px;height:34px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#6b7280;flex-shrink:0}
.hdr-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px;flex:1}
.hdr-money{font-size:10px;font-weight:700;color:#059669}
.content{padding:calc(env(safe-area-inset-top,0px)+62px) 12px calc(20px + env(safe-area-inset-bottom,0px))}

/* Hero */
.hero{text-align:center;padding:16px 0 12px}
.hero-emoji{font-size:48px}
.hero-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:3px;margin-top:4px}
.hero-sub{font-size:10px;color:#9ca3af;margin-top:3px}
.hero-diplomas{font-family:'Bebas Neue',sans-serif;font-size:16px;color:#2563eb;margin-top:6px}

/* Training in progress */
.training-active{background:#eff6ff;border:1.5px solid #bfdbfe;border-radius:14px;padding:14px;margin-bottom:12px}
.training-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.training-emoji{font-size:24px}
.training-title{font-size:13px;font-weight:800;color:#1a1a1a}
.training-time{font-size:10px;color:#2563eb;font-weight:700}
.training-bar{height:6px;background:#dbeafe;border-radius:3px;overflow:hidden}
.training-fill{height:100%;background:#2563eb;border-radius:3px;transition:width 1s}

/* Section */
.sec{font-size:8px;font-weight:800;color:#9ca3af;letter-spacing:2px;margin:14px 0 6px;padding:0 4px}

/* Course card */
.course{background:#fff;border:1px solid #f3f4f6;border-radius:14px;padding:14px;margin-bottom:8px;transition:transform .1s}
.course:active{transform:scale(.98)}
.course.locked{opacity:.5}
.course.completed{border-color:#bbf7d0;background:#f0fdf4}
.course-top{display:flex;gap:10px;align-items:flex-start}
.course-icon{font-size:28px;flex-shrink:0}
.course-info{flex:1;min-width:0}
.course-name{font-size:13px;font-weight:800;color:#1a1a1a}
.course-desc{font-size:9px;color:#6b7280;margin-top:2px;line-height:1.4}
.course-bonus{font-size:9px;color:#2563eb;font-weight:700;margin-top:3px}
.course-meta{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.course-tag{font-size:7px;font-weight:800;padding:2px 6px;border-radius:5px;letter-spacing:.5px}
.course-cost{font-size:10px;font-weight:800;color:#1a1a1a}
.course-time{font-size:9px;color:#9ca3af}
.course-btn{margin-top:8px;width:100%;padding:10px;border:none;border-radius:10px;font-size:11px;font-weight:800;cursor:pointer;touch-action:manipulation}
.course-btn.enroll{background:#2563eb;color:#fff}
.course-btn.enroll:disabled{background:#e5e7eb;color:#9ca3af;cursor:default}
.course-btn.done{background:#f0fdf4;color:#059669;cursor:default}

/* Diplomas */
.diploma{display:flex;align-items:center;gap:8px;padding:8px;background:#fefce8;border:1px solid #fde68a;border-radius:10px;margin-bottom:6px}
.diploma-icon{font-size:20px}
.diploma-name{font-size:11px;font-weight:700;color:#92400e;flex:1}
.diploma-bonus{font-size:8px;color:#d97706;font-weight:700}

.toast{position:fixed;top:calc(12px+env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:9px 18px;border-radius:20px;font-size:11px;font-weight:700;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none}
</style>
</head>
<body>

<div class="hdr">
  <button class="hdr-back" onclick="location.href='game.html'">←</button>
  <div class="hdr-title">🎓 ÉCOLE DES DOCKERS</div>
  <div class="hdr-money" id="hdr-money">—</div>
</div>

<div class="content">
  <div class="hero">
    <div class="hero-emoji">🎓</div>
    <div class="hero-title">ÉCOLE DES DOCKERS</div>
    <div class="hero-sub">Forme-toi, obtiens des diplômes, deviens le meilleur.</div>
    <div class="hero-diplomas" id="diplomaCount">0 diplôme</div>
  </div>

  <div id="trainingActive"></div>

  <div class="sec">MES DIPLÔMES</div>
  <div id="diplomaList"><div style="font-size:10px;color:#9ca3af;text-align:center;padding:8px">Aucun diplôme pour l'instant</div></div>

  <div class="sec">FORMATIONS DISPONIBLES</div>
  <div id="courseList"></div>
</div>

<div class="toast" id="toast-el"></div>

<script>
var SB_URL='https://drtsuhnbclhmgfjiykap.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
var sb=supabase.createClient(SB_URL,SB_KEY);
var _me=null,_money=0,_records={},_diplomas={},_training=null;

function toast(m){var t=document.getElementById('toast-el');t.textContent=m;t.style.opacity='1';clearTimeout(t._t);t._t=setTimeout(function(){t.style.opacity='0';},2800);}

var COURSES=[
  // Manutention
  {id:'manu1',cat:'MANUTENTION',icon:'📦',name:'Initiation Manutention',desc:'Apprends à porter un carton sans te casser le dos (pas comme Gégé).',bonus:'+1€ par clic',effect:{money_per_click:1},cost:5000,time:5,req:null},
  {id:'manu2',cat:'MANUTENTION',icon:'🏗️',name:'Manutention Avancée',desc:'Grutier, chariot élévateur, et comment éviter les orteils.',bonus:'+2€ par clic',effect:{money_per_click:2},cost:25000,time:30,req:'manu1'},
  {id:'manu3',cat:'MANUTENTION',icon:'💪',name:'Expert Manutention',desc:'Tu peux soulever un container. Enfin, en théorie.',bonus:'+3€ par clic',effect:{money_per_click:3},cost:100000,time:120,req:'manu2'},

  // Commerce
  {id:'comm1',cat:'COMMERCE',icon:'🤝',name:'Initiation Commerce',desc:'L\'art de vendre des sardines à quelqu\'un qui n\'aime pas le poisson.',bonus:'+10% revenus commerce',effect:{commerce_bonus:10},cost:10000,time:10,req:null},
  {id:'comm2',cat:'COMMERCE',icon:'📈',name:'Commerce International',desc:'Exporter des sardines à l\'autre bout du monde. Pourquoi pas.',bonus:'+20% revenus commerce',effect:{commerce_bonus:20},cost:50000,time:60,req:'comm1'},
  {id:'comm3',cat:'COMMERCE',icon:'🌍',name:'Master Commerce',desc:'Tu pourrais vendre de la glace à un esquimau. Marseillais.',bonus:'+35% revenus commerce',effect:{commerce_bonus:35},cost:200000,time:240,req:'comm2'},

  // Navigation
  {id:'navi1',cat:'NAVIGATION',icon:'⚓',name:'Initiation Navigation',desc:'Apprends la différence entre bâbord et tribord. C\'est déjà pas mal.',bonus:'+1 contrat/jour',effect:{extra_contracts:1},cost:8000,time:10,req:null},
  {id:'navi2',cat:'NAVIGATION',icon:'🚢',name:'Capitaine Côtier',desc:'Tu peux piloter un bateau. Petit. Très petit.',bonus:'+2 contrats/jour',effect:{extra_contracts:2},cost:40000,time:60,req:'navi1'},

  // Finance
  {id:'fin1',cat:'FINANCE',icon:'💰',name:'Initiation Finance',desc:'Apprends que dépenser plus que tu gagnes c\'est "pas bien".',bonus:'+5% gains bourse',effect:{bourse_bonus:5},cost:15000,time:15,req:null},
  {id:'fin2',cat:'FINANCE',icon:'📊',name:'Analyse Financière',desc:'Comprendre un graphique sans faire semblant.',bonus:'+10% gains bourse',effect:{bourse_bonus:10},cost:80000,time:90,req:'fin1'},

  // Management
  {id:'mgmt1',cat:'MANAGEMENT',icon:'👔',name:'Initiation Management',desc:'Comment dire "fais-le toi-même" de façon polie et professionnelle.',bonus:'+1 slot employé',effect:{employee_slot:1},cost:20000,time:20,req:null},
  {id:'mgmt2',cat:'MANAGEMENT',icon:'🏛️',name:'Direction d\'Entreprise',desc:'Tu es le patron maintenant. Tes employés te détestent déjà.',bonus:'+2 slots employé',effect:{employee_slot:2},cost:150000,time:180,req:'mgmt1'},
];

var CAT_COLORS={MANUTENTION:'#dc2626',COMMERCE:'#059669',NAVIGATION:'#0ea5e9',FINANCE:'#d97706',MANAGEMENT:'#7c3aed'};

async function init(){
  var sess=await sb.auth.getSession();
  if(!sess.data.session){location.href='index.html';return;}
  _me=sess.data.session.user;
  var gs=await sb.from('game_stats').select('money,records').eq('user_id',_me.id).maybeSingle();
  if(gs.data){
    _money=gs.data.money||0;
    _records=gs.data.records||{};
    _diplomas=_records.diplomas||{};
    _training=_records.training||null;
  }
  document.getElementById('hdr-money').textContent=_money.toLocaleString('fr-FR')+'€';

  // Check if training completed
  if(_training&&_training.until){
    if(new Date(_training.until).getTime()<=Date.now()){
      await completeCourse(_training.course_id);
    }
  }

  render();
}

function render(){
  var diplomaCount=Object.keys(_diplomas).length;
  document.getElementById('diplomaCount').textContent=diplomaCount+' diplôme'+(diplomaCount>1?'s':'');

  // Training in progress
  var tEl=document.getElementById('trainingActive');
  if(_training&&_training.until&&new Date(_training.until).getTime()>Date.now()){
    var course=COURSES.find(function(c){return c.id===_training.course_id;});
    var total=_training.duration*60000;
    var elapsed=Date.now()-new Date(_training.started).getTime();
    var pct=Math.min(100,Math.round(elapsed/total*100));
    var minLeft=Math.max(0,Math.ceil((new Date(_training.until).getTime()-Date.now())/60000));
    tEl.innerHTML='<div class="training-active">'
      +'<div class="training-header"><div class="training-emoji">'+(course?course.icon:'📖')+'</div>'
      +'<div style="flex:1"><div class="training-title">En formation : '+(course?course.name:'...')+'</div>'
      +'<div class="training-time">⏳ '+minLeft+' min restantes</div></div></div>'
      +'<div class="training-bar"><div class="training-fill" style="width:'+pct+'%"></div></div></div>';
    // Auto-refresh
    setTimeout(function(){init();},60000);
  }else{
    tEl.innerHTML='';
  }

  // Diplomas
  var dEl=document.getElementById('diplomaList');
  if(diplomaCount===0){
    dEl.innerHTML='<div style="font-size:10px;color:#9ca3af;text-align:center;padding:8px">Aucun diplôme pour l\'instant</div>';
  }else{
    var dH='';
    Object.keys(_diplomas).forEach(function(cid){
      var course=COURSES.find(function(c){return c.id===cid;});
      if(!course)return;
      dH+='<div class="diploma"><div class="diploma-icon">🏅</div><div class="diploma-name">'+course.name+'</div><div class="diploma-bonus">'+course.bonus+'</div></div>';
    });
    dEl.innerHTML=dH;
  }

  // Courses
  var cEl=document.getElementById('courseList');
  var html='';
  COURSES.forEach(function(c){
    var hasDiploma=!!_diplomas[c.id];
    var hasReq=!c.req||!!_diplomas[c.req];
    var inTraining=_training&&_training.course_id===c.id&&new Date(_training.until).getTime()>Date.now();
    var anyTraining=_training&&_training.until&&new Date(_training.until).getTime()>Date.now();
    var canAfford=_money>=c.cost;
    var locked=!hasReq;

    html+='<div class="course'+(hasDiploma?' completed':'')+(locked?' locked':'')+'">';
    html+='<div class="course-top"><div class="course-icon">'+c.icon+'</div><div class="course-info">';
    html+='<div class="course-name">'+c.name+'</div>';
    html+='<div class="course-desc">'+c.desc+'</div>';
    html+='<div class="course-bonus">⚡ '+c.bonus+'</div>';
    html+='<div class="course-meta">';
    html+='<div class="course-tag" style="background:'+CAT_COLORS[c.cat]+'12;color:'+CAT_COLORS[c.cat]+'">'+c.cat+'</div>';
    html+='<div class="course-cost">'+c.cost.toLocaleString('fr-FR')+'€</div>';
    html+='<div class="course-time">⏱ '+c.time+'min</div>';
    if(locked){var reqCourse=COURSES.find(function(x){return x.id===c.req;});html+='<div style="font-size:8px;color:#ef4444">🔒 Requiert : '+(reqCourse?reqCourse.name:'?')+'</div>';}
    html+='</div></div></div>';

    if(hasDiploma){
      html+='<div class="course-btn done">✅ Diplôme obtenu</div>';
    }else if(inTraining){
      html+='<div class="course-btn done" style="background:#eff6ff;color:#2563eb">⏳ En cours...</div>';
    }else if(locked){
      html+='<button class="course-btn enroll" disabled>🔒 Prérequis manquant</button>';
    }else if(anyTraining){
      html+='<button class="course-btn enroll" disabled>⏳ Déjà en formation</button>';
    }else if(!canAfford){
      html+='<button class="course-btn enroll" disabled>Pas assez d\'argent</button>';
    }else{
      html+='<button class="course-btn enroll" onclick="startCourse(\''+c.id+'\')">S\'INSCRIRE — '+c.cost.toLocaleString('fr-FR')+'€</button>';
    }
    html+='</div>';
  });
  cEl.innerHTML=html;
}

async function startCourse(courseId){
  var course=COURSES.find(function(c){return c.id===courseId;});
  if(!course)return;
  if(_money<course.cost){toast('Pas assez d\'argent');return;}
  if(_diplomas[courseId]){toast('Diplôme déjà obtenu');return;}

  _money-=course.cost;
  var now=new Date();
  _training={course_id:courseId,started:now.toISOString(),until:new Date(now.getTime()+course.time*60000).toISOString(),duration:course.time};
  _records.training=_training;

  await sb.from('game_stats').update({money:_money,records:_records}).eq('user_id',_me.id);
  document.getElementById('hdr-money').textContent=_money.toLocaleString('fr-FR')+'€';
  toast('📖 Formation commencée : '+course.name+' ('+course.time+'min)');
  render();
}

async function completeCourse(courseId){
  var course=COURSES.find(function(c){return c.id===courseId;});
  if(!course)return;
  _diplomas[courseId]={obtained:new Date().toISOString(),effect:course.effect};
  _records.diplomas=_diplomas;
  _training=null;
  _records.training=null;
  await sb.from('game_stats').update({records:_records}).eq('user_id',_me.id);
  toast('🎓 DIPLÔME OBTENU : '+course.name+' !');
}

init();
</script>
</body>
</html>
