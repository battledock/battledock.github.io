<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>École des Dockers — Battle Dock</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#fff;color:#1a1a1a;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.emoji{font-size:64px;margin-bottom:12px}
.title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:3px}
.sub{font-size:12px;color:#9ca3af;margin-top:6px}
.btn{margin-top:20px;padding:12px 24px;border:none;border-radius:12px;background:#f3f4f6;color:#6b7280;font-size:13px;font-weight:700;cursor:pointer}

/* Page transition */
body{animation:pageIn .3s ease}
@keyframes pageIn{from{opacity:0}to{opacity:1}}
body.page-out{animation:pageOut .2s ease forwards}
@keyframes pageOut{from{opacity:1}to{opacity:0}}
</style>
</head>
<body>
<div class="emoji">🎓</div>
<div class="title">ÉCOLE DES DOCKERS</div>
<div class="sub">Bientôt disponible</div>
<button class="btn" onclick="location.href='game.html'">← Retour</button>
<script>
// Page transitions
document.addEventListener('click',function(e){
  var a=e.target.closest('[onclick*="location.href"],[onclick*="location="]');
  if(!a)return;
  var m=a.getAttribute('onclick').match(/['"](.*?\.html.*?)['"]/);
  if(!m)return;
  e.preventDefault();e.stopPropagation();
  document.body.classList.add('page-out');
  setTimeout(function(){window.location.href=m[1];},200);
},true);
</script>
</body>
</html>
