<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',sans-serif;background:#0a1020;color:#fff}

.scene-wrap{display:flex;flex-direction:column;height:100%;height:100dvh;overflow:hidden}
.scene-bg{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;transition:opacity .5s}
.scene-bg svg{width:100%;height:100%;display:block}
.char-zone{flex:1;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;position:relative;z-index:1;padding-bottom:10px;transition:opacity .3s}
.char-svg{width:160px;height:240px;flex-shrink:0}
.char-enter{animation:charEnter .5s cubic-bezier(.34,1.3,.64,1) forwards}
@keyframes charEnter{from{opacity:0;transform:translateY(40px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.char-talk{animation:charTalk .3s ease}
@keyframes charTalk{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

.dialogue-box{
  position:relative;z-index:10;flex-shrink:0;
  background:rgba(8,12,20,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid rgba(255,255,255,.07);
  padding:14px 16px calc(env(safe-area-inset-bottom,0px)+14px);
  display:flex;flex-direction:column;gap:8px;
  min-height:200px;
}
.char-name{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:2px;color:#fbbf24}
.dialogue-text{font-size:14.5px;color:rgba(255,255,255,.88);line-height:1.65;min-height:50px}
.dialogue-text.narratif{font-size:13px;color:rgba(255,255,255,.45);font-style:italic}

.btn-next{
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:12px;
  padding:13px;width:100%;font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:2px;
  color:rgba(255,255,255,.6);cursor:pointer;text-align:center;transition:all .15s;
}
.btn-next:active{background:rgba(255,255,255,.14);transform:scale(.97)}
.btn-next.gold{background:rgba(251,191,36,.15);border-color:rgba(251,191,36,.3);color:#fbbf24}

.choices{display:flex;flex-direction:column;gap:6px}
.choice-btn{
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;
  padding:12px 14px;font-size:13px;color:rgba(255,255,255,.8);cursor:pointer;text-align:left;
  display:flex;align-items:center;gap:10px;transition:all .12s;
}
.choice-btn:active{background:rgba(255,255,255,.12);transform:scale(.98)}
.choice-icon{font-size:16px;flex-shrink:0}

.badge-wrap{
  background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.2);border-radius:14px;
  padding:16px;text-align:center;animation:popIn .5s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popIn{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.badge-icon{font-size:42px;margin-bottom:6px}
.badge-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;color:#fbbf24}
.badge-desc{font-size:11px;color:rgba(255,255,255,.35);margin-top:4px;line-height:1.5}
.badge-stamp{
  display:inline-flex;flex-direction:column;align-items:center;gap:3px;
  width:130px;height:85px;justify-content:center;
  background:rgba(255,255,255,.05);border:2.5px solid rgba(251,191,36,.4);border-radius:10px;
  animation:stampIn .4s cubic-bezier(.34,1.56,.64,1);margin-bottom:10px;
  transform:rotate(-3deg);
}
@keyframes stampIn{from{transform:scale(0) rotate(-30deg);opacity:0}to{transform:scale(1) rotate(-3deg);opacity:1}}
.badge-stamp-label{font-size:8px;color:rgba(251,191,36,.5);font-weight:700;letter-spacing:2px}
.badge-stamp-num{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:3px;color:#fbbf24}
.badge-stamp-sub{font-size:7px;color:rgba(255,255,255,.25);letter-spacing:1px}

/* Dance animation */
.char-dance{animation:dance 0.6s ease infinite}
@keyframes dance{
  0%{transform:translateY(0) rotate(0deg)}
  15%{transform:translateY(-15px) rotate(-5deg)}
  30%{transform:translateY(0) rotate(5deg)}
  45%{transform:translateY(-10px) rotate(-3deg) scaleX(-1)}
  60%{transform:translateY(0) rotate(3deg) scaleX(-1)}
  75%{transform:translateY(-12px) rotate(-4deg)}
  100%{transform:translateY(0) rotate(0deg)}
}
.confetti{position:fixed;top:-10px;z-index:15;pointer-events:none;font-size:20px;animation:confettiFall linear forwards}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}

/* Fail overlay */
.fail-overlay{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.fail-overlay.show{display:flex}
.fail-card{text-align:center;max-width:300px}
.fail-emoji{font-size:64px}
.fail-title{font-family:'Bebas Neue',sans-serif;font-size:24px;color:#ef4444;letter-spacing:2px;margin-top:10px}
.fail-text{font-size:12px;color:rgba(255,255,255,.4);margin-top:8px;line-height:1.6}
.fail-btn{margin-top:16px;padding:13px 24px;border:none;border-radius:12px;background:#ef4444;color:#fff;font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:2px;cursor:pointer}

.progress-dots{display:flex;justify-content:center;gap:5px;margin-bottom:6px}
.dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.12);transition:all .3s}
.dot.active{background:#fbbf24;width:20px;border-radius:3px}
.dot.done{background:rgba(251,191,36,.35)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);border:1px solid rgba(255,255,255,.1);color:white;padding:10px 18px;border-radius:20px;font-size:13px;font-weight:600;z-index:100;opacity:0;transition:opacity .3s;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>

  <div class="scene-bg" id="sceneBg"></div>

    <div class="progress-dots" id="progressDots"></div>
    <div>
      <div class="char-name" id="charName"></div>
      <div class="dialogue-text" id="dialogueText"></div>

</div>

<div class="toast" id="toast"></div>

    <div class="fail-emoji">💀</div>

// Music
var _music=new Audio('formation-music.mp3');
_music.loop=true;_music.volume=0;

function fadeMusic(target,dur){
  var start=_music.volume,diff=target-start,steps=30,i=0;
  var iv=setInterval(function(){i++;_music.volume=start+diff*(i/steps);if(i>=steps)clearInterval(iv);},dur/steps);
}

// Confetti
function spawnConfetti(){
  var emojis=['🎉','⭐','🏗️','📦','🎊','✨','🔥','⚓'];
  for(var i=0;i<25;i++){
    var el=document.createElement('div');el.className='confetti';
    el.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    el.style.left=Math.random()*100+'%';
    el.style.animationDuration=(2+Math.random()*3)+'s';
    el.style.animationDelay=(Math.random()*2)+'s';
    el.style.fontSize=(14+Math.random()*16)+'px';
    document.body.appendChild(el);
    setTimeout(function(){el.remove()},6000);
  }
}

const BGS={sunrise:BG_SUNRISE,crane:BG_CRANE,wind:BG_WIND,night:BG_NIGHT,badge:BG_BADGE};

let step=0,twInterval=null,totalSteps=STEPS.length;

function renderDots(){
  var h='';for(var i=0;i<totalSteps;i++){
    h+='<div class="dot '+(i<step?'done':i===step?'active':'')+'"></div>';
  }
  document.getElementById('progressDots').innerHTML=h;
}

function showStep(s){
  renderDots();
  var bgKey=s.bg||'crane';
  document.getElementById('sceneBg').innerHTML=BGS[bgKey]||BG_CRANE;

  var cz=document.getElementById('charZone');
  if(s.narratif){cz.style.opacity='0';}
  else{cz.style.opacity='1';cz.innerHTML='<div class="char-svg char-enter">'+CHAR_GEGE+'</div>';}

  var nameEl=document.getElementById('charName');
  var textEl=document.getElementById('dialogueText');
  var actEl=document.getElementById('actionsZone');

  if(s.char){nameEl.textContent=s.char;nameEl.style.display='block';textEl.className='dialogue-text';}
  else{nameEl.style.display='none';textEl.className='dialogue-text narratif';}

  textEl.textContent='';actEl.innerHTML='';
  if(twInterval)clearInterval(twInterval);
  var full=s.text,ci=0;
  twInterval=setInterval(function(){
    textEl.textContent+=full[ci];ci++;
    if(ci>=full.length){clearInterval(twInterval);twInterval=null;showActions(s);}
  },25);
}

function showActions(s){
  var actEl=document.getElementById('actionsZone');
  if(s.badge){
    // Music crescendo + confetti + dance
    fadeMusic(.5,1000);
    spawnConfetti();
    setTimeout(spawnConfetti,1500);
    var cz=document.getElementById('charZone');
    cz.style.opacity='1';
    cz.innerHTML='<div class="char-svg char-dance">'+CHAR_GEGE+'</div>';
    actEl.innerHTML=`
      <div class="badge-wrap" style="margin-bottom:8px">
        <div class="badge-stamp">
          <div class="badge-stamp-label">PORT DE MARSEILLE</div>
          <div class="badge-stamp-num">GRUTIER</div>
          <div class="badge-stamp-sub">CERTIFIÉ ✓</div>
        </div>
        <div class="badge-icon">🏗️</div>
        <div class="badge-title">FORMATION GRUTIER OBTENUE</div>
        <div class="badge-desc">Tu es maintenant habilité à manœuvrer les grues du port de Marseille</div>
      </div>
      <button class="btn-next gold" onclick="finish()">COMMENCER À TRAVAILLER →</button>`;
  }else if(s.fail){
    // Show fail after reading
    setTimeout(function(){
      _music.pause();
      document.getElementById('failOverlay').classList.add('show');
    },1500);
  }else if(s.choices){
    var h='<div class="choices">';
    s.choices.forEach(function(c){
      h+='<div class="choice-btn" onclick="pickChoice(\''+c.next+'\')"><span class="choice-icon">'+c.icon+'</span>'+c.text+'</div>';
    });
    h+='</div>';actEl.innerHTML=h;
  }else{
    actEl.innerHTML='<button class="btn-next" onclick="nextStep()">SUITE →</button>';
  }
}

window.pickChoice=function(key){
  var alt=ALT_RESPONSES[key];
  if(alt){
    showStep(alt);
    if(alt.fail){
      // Fail: show fail message then overlay after typewriter
      return;
    }
    var checkDone=setInterval(function(){
      if(!twInterval){
        clearInterval(checkDone);
        document.getElementById('actionsZone').innerHTML='<button class="btn-next" onclick="nextStep()">SUITE →</button>';
      }
    },100);
  }else{
    step=parseInt(key);
    showStep(STEPS[step]);
  }
};

function nextStep(){
  step++;
  if(step>=STEPS.length)return;
  showStep(STEPS[step]);
}

async function finish(){
  fadeMusic(0,1000);
  setTimeout(function(){_music.pause();},1100);
  try{
    var gs=await sb.from('game_stats').select('records').eq('user_id',currentUser.id).maybeSingle();
    if(gs.data){
      var rec=gs.data.records||{};
      rec.formations=rec.formations||{};
      rec.formations.grutier=true;
      await sb.from('game_stats').update({records:rec}).eq('user_id',currentUser.id);
    }
  }catch(e){}
  window.location.href='grue.html';
}

async function init(){
  try{
    var s=await sb.auth.getSession();
    if(!s.data||!s.data.session){location.href='index.html';return;}
    currentUser=s.data.session.user;
    var gs=await sb.from('game_stats').select('records').eq('user_id',currentUser.id).maybeSingle();
    if(gs.data){
      var f=(gs.data.records&&gs.data.records.formations)||{};
      if(f.grutier){location.href='grue.html';return;}
    }
  }catch(e){}
  showStep(STEPS[0]);
  _music.play().catch(function(){});
  fadeMusic(.15,3000);
}
init();
