/* ============================================================
   REGISTRE DES DÉBLOCAGES (player_unlocks)
   Permet de savoir ce qui a été attribué, vu, réclamé.
   Sert aussi de rattrapage pour les parties antérieures.
   ============================================================ */
async function chargeDeblocages(){
  try{
    const d = await sbFetch(`deblocages?cinema_id=eq.${Etat.cinema.id}&select=*`);
    Etat.deblocages = Array.isArray(d) ? d : [];
  }catch(e){ Etat.deblocages = Etat.deblocages || []; }
  return Etat.deblocages;
}
function deblocageEnregistre(cle){
  return (Etat.deblocages||[]).find(d=>d.cle===cle);
}

/* crée les entrées manquantes pour le niveau actuel — idempotent */
async function synchroniseDeblocages(){
  await chargeDeblocages();
  const attendues = recompensesAcquises();
  const manquantes = attendues.filter(r=>!deblocageEnregistre(r.cle));
  if(manquantes.length === 0) return [];
  for(const r of manquantes){
    try{
      await sbFetch("deblocages", {method:"POST", prefer:"return=minimal", body:{
        cinema_id: Etat.cinema.id, user_id: Etat.session?.user_id,
        cle: r.cle, niveau: r.niveau,
        vu_le: null, reclame_le: r.reclamer ? null : new Date().toISOString()
      }});
      Etat.deblocages.push({cle:r.cle, niveau:r.niveau, reclame_le:r.reclamer?null:new Date().toISOString()});
    }catch(e){}   /* 409 = déjà présent */
  }
  return manquantes;
}

/* récompenses à réclamer, non encore prises */
function recompensesAReclamer(){
  return recompensesAcquises().filter(r=>r.reclamer && !(deblocageEnregistre(r.cle)?.reclame_le));
}
async function reclameRecompense(cle){
  const r = recompenseParCle(cle);
  if(!r || !r.reclamer) return false;
  const d = deblocageEnregistre(cle);
  if(d?.reclame_le) return false;
  try{
    const rep = await rpc("reclamer_recompense", {p_cinema_id: Etat.cinema.id, p_cle: cle});
    if(!rep?.success) return false;
    if(d) d.reclame_le = new Date().toISOString();
    await chargePersonnalisation();
    return true;
  }catch(e){ return false; }
}

/* valide une mission une seule fois (protégée par xp_events.cle_unique) */
async function accomplitMission(cle){
  const m = MISSIONS.find(x=>x.cle===cle);
  if(!m || missionFaite(cle)) return false;
  let r;
  try{ r = await rpc("accomplir_mission", {p_cinema_id: Etat.cinema.id, p_mission: cle}); }
  catch(e){ return false; }
  if(!r?.success) return false;
  Etat.missionsFaites = [...(Etat.missionsFaites||[]), cle];
  await chargeProgression(true);
  majBarreXPHeader();
  bulleXP(r.data.xp, "Mission");

  for(let n = avant + 1; n <= apres; n++){
    await montreMonteeNiveau(infoNiveau(n));
    await synchroniseDeblocages().catch(()=>null);
  }
  return true;

/* ============================================================
   BONUS — source unique de vérité, lue par la simulation
   ============================================================ */
function niveauEquipement(salle, cle){
  const map = {sieges:"confort", ecran:"ecran", son:"son", climatisation:"clim_niveau", decoration:"deco"};
  return Math.max(0, Math.min(3, Number(salle[map[cle]] ?? 0)));
}
function paletteNiveau(cle, niveau){ return AMELIORATIONS[cle].niveaux[Math.max(0,Math.min(3,niveau))]; }

function obtenirBonusSalle(salle){
  let satisfaction = 0, prixAcceptable = 0, reputation = 0, meteo = 0;
  Object.keys(AMELIORATIONS).forEach(cle=>{
    const n = paletteNiveau(cle, niveauEquipement(salle, cle));
    satisfaction   += n.satisfaction || 0;
    prixAcceptable += n.prixAcceptable || 0;
    reputation     += n.reputation || 0;
    meteo           = Math.max(meteo, n.meteo || 0);
  });
  return {satisfaction, prixAcceptable, reputation, protectionMeteo:meteo,
          risqueIncident: calculerRisqueIncident(salle)};
}

/* propreté et état pilotent le risque d'incident */
function calculerRisqueIncident(salle){
  const prop = Number(salle.proprete ?? 100);
  const etat = Number(salle.etat ?? 100);
  let r = 0.04;                       /* base */
  if(prop < 40) r += 0.06;
  else if(prop < 70) r += 0.02;
  if(etat < 50) r += 0.07;
  else if(etat < 75) r += 0.02;
  r -= obtenirBonusSalle.__sansRecursion ? 0 : 0;   /* garde-fou */
  return Math.max(0.01, Math.min(0.25, r));
}
function libelleRisque(r){
  if(r <= 0.05) return "faible";
  if(r <= 0.10) return "modéré";
  if(r <= 0.16) return "élevé";
  return "critique";
}

/* malus de satisfaction lié à la saleté */
function malusProprete(salle){
  const p = Number(salle.proprete ?? 100);
  if(p >= 70) return 0;
  if(p >= 40) return -4;
  return -9;
}

/* ============================================================
   DISPONIBILITÉ D'UNE AMÉLIORATION
   Renvoie {possible, raison, prochain}
   ============================================================ */
function prochaineAmelioration(salle, cle){
  const actuel = niveauEquipement(salle, cle);
  if(actuel >= 3) return {possible:false, raison:"max", actuel, prochain:null};
  const prochain = AMELIORATIONS[cle].niveaux[actuel + 1];
  const niv = typeof niveauActuel === "function" ? niveauActuel() : 1;
  if(niv < prochain.niveauJoueurRequis)
    return {possible:false, raison:"niveau", actuel, prochain, niveauRequis:prochain.niveauJoueurRequis};
  return {possible:true, actuel, prochain};
}

function prochaineExtension(salle){
  const fait = Number(salle.extensions ?? 0);
  if(fait >= EXTENSIONS_CAPACITE.length) return {possible:false, raison:"max"};
  const ext = EXTENSIONS_CAPACITE[fait];
  const niv = typeof niveauActuel === "function" ? niveauActuel() : 1;
  const type = TYPES_SALLES[salle.type || "standard"];
  if(Number(salle.capacite) + ext.places > type.capaciteMax)
    return {possible:false, raison:"capacite_max", ext};
  if(niv < ext.niveauJoueurRequis) return {possible:false, raison:"niveau", ext, niveauRequis:ext.niveauJoueurRequis};
  return {possible:true, ext};
}

/* ============================================================
   APPARENCE — la salle et la façade changent avec les niveaux
   ============================================================ */
function obtenirNiveauVisuelCinema(cinema, salles){
  const s = salles || [];
  const moy = cle => s.length ? s.reduce((t,x)=>t+niveauEquipement(x,cle),0)/s.length : 0;
  const propMoy = s.length ? s.reduce((t,x)=>t+Number(x.proprete ?? 100),0)/s.length : 100;
  return {
    salles: s.length,
    aile: s.length >= 2,                                   /* aile visible sur la façade */
    deco: Math.round(moy("decoration")),                   /* 0-3 : cadres, moulures, éclairage */
    eclairage: Math.round(moy("ecran")),                   /* enseigne plus lumineuse */
    entretien: Math.round(propMoy),                        /* façade plus ou moins propre */
    affiches: 2 + (typeof debloque==="function" && debloque("affiche_3") ? 1 : 0)
                + (typeof debloque==="function" && debloque("affiche_4") ? 1 : 0),
    decoExterieure: typeof debloque==="function" && debloque("deco_exterieur"),
    enseignePerso: typeof debloque==="function" && debloque("enseigne")
  };
}

const PERSO_DEFAUT = {style_enseigne:"classic", style_facade:"bordeaux", couleur_sieges:"rouge",
  plaque:"aucune", hall:{}, exterieur:[]};

async function chargePersonnalisation(){
  try{
    const d = await sbFetch(`personnalisation?cinema_id=eq.${Etat.cinema.id}&select=*`);
    if(Array.isArray(d) && d.length) Etat.perso = normalisePerso(d[0]);
    else{
      const res = await sbFetch("personnalisation", {method:"POST",
        body:{cinema_id:Etat.cinema.id, user_id:Etat.session?.user_id, ...PERSO_DEFAUT}});
      Etat.perso = normalisePerso((Array.isArray(res)&&res[0]) || PERSO_DEFAUT);
    }
  }catch(e){ Etat.perso = normalisePerso(Etat.perso || PERSO_DEFAUT); }
  try{
    const p = await sbFetch(`possessions?cinema_id=eq.${Etat.cinema.id}&select=cle`);
    Etat.possessions = (Array.isArray(p)?p:[]).map(x=>x.cle);
  }catch(e){ Etat.possessions = Etat.possessions || []; }
  return Etat.perso;
}
/* tolère les anciennes parties sans état de personnalisation */
function normalisePerso(o){
  const r = {...PERSO_DEFAUT, ...(o||{})};
  if(typeof r.hall === "string"){ try{ r.hall = JSON.parse(r.hall); }catch(e){ r.hall = {}; } }
  if(typeof r.exterieur === "string"){ try{ r.exterieur = JSON.parse(r.exterieur); }catch(e){ r.exterieur = []; } }
  if(!r.hall || typeof r.hall !== "object") r.hall = {};
  if(!Array.isArray(r.exterieur)) r.exterieur = [];
  return r;
}

/* ---------- possession ---------- */
function possede(cat, id){
  const cle = cat + ":" + id;
  const item = itemPerso(cat, id);
  if(!item) return false;
  if(item.reclamee) return (Etat.possessions||[]).includes(cle);
  if((item.cout||0) === 0 && niveauActuel() >= item.niveauRequis) return true;   /* offert au déblocage */
  return (Etat.possessions||[]).includes(cle);
}
function itemPerso(cat, id){
  const c = CATALOGUE_PERSO[cat];
  if(!c) return null;
  if(c.emplacements) return c.zones.flatMap(z=>z.objets).find(o=>o.id===id) || null;
  return c.items.find(i=>i.id===id) || null;
}
function accessible(cat, id){
  const item = itemPerso(cat, id);
  if(!item) return {ok:false, raison:"inconnu"};
  if(niveauActuel() < item.niveauRequis) return {ok:false, raison:"niveau", niveau:item.niveauRequis};
  if(!possede(cat, id)) return {ok:false, raison:"achat", cout:item.cout};
  return {ok:true};
}

async function donnePersonnalisation(cle, origine){
  const c = "plaque:" + cle;
  if((Etat.possessions||[]).includes(c)) return;
  try{
    await sbFetch("possessions", {method:"POST", prefer:"return=minimal", body:{
      cinema_id:Etat.cinema.id, user_id:Etat.session?.user_id, cle:c,
      categorie:"plaque", origine:origine||"niveau"}});
    Etat.possessions = [...(Etat.possessions||[]), c];
  }catch(e){}
}

/* achat d'un élément payant — enregistré comme transaction */
async function achetePersonnalisation(cat, id){
  const item = itemPerso(cat, id);
  if(!item || possede(cat, id)) return false;
  if(niveauActuel() < item.niveauRequis) return false;
  try{
    await depense({montant:item.cout, categorie:"personnalisation", details:{categorie:cat, item:id}});
  }catch(e){ return {erreur:"argent"}; }
  try{
    await sbFetch("possessions", {method:"POST", prefer:"return=minimal", body:{
      cinema_id:Etat.cinema.id, user_id:Etat.session?.user_id,
      cle:cat+":"+id, categorie:cat, origine:"achat"}});
  }catch(e){}
  Etat.possessions = [...(Etat.possessions||[]), cat+":"+id];
  majHeaderArgent();
  return true;
}

/* application d'un élément possédé — gratuite */
async function appliquePersonnalisation(cat, id, zone){
  const conf = CATALOGUE_PERSO[cat];
  if(!conf) return false;
  const a = accessible(cat, id);
  if(!a.ok) return a;

  let corps;
  if(conf.emplacements){
    Etat.perso.hall = {...Etat.perso.hall, [zone]: id};
    corps = {hall: Etat.perso.hall};
  }else if(conf.multiple){
    const liste = Etat.perso.exterieur.includes(id)
      ? Etat.perso.exterieur.filter(x=>x!==id)
      : [...Etat.perso.exterieur, id];
    Etat.perso.exterieur = liste;
    corps = {exterieur: liste};
  }else{
    Etat.perso[conf.champ] = id;
    corps = {[conf.champ]: id};
  }
  try{
    await sbFetch(`personnalisation?cinema_id=eq.${Etat.cinema.id}`, {method:"PATCH",
      prefer:"return=minimal", body:corps});
  }catch(e){ return {erreur:"reseau"}; }
  return {ok:true};
}

const TAUX_ACHAT_BASE = 0.25;
const STYLES_COMPTOIR = {
  bois:   {nom:"Comptoir en bois", couleur:"#6b4a2a"},
  laiton: {nom:"Comptoir laiton",  couleur:"#caa24a"},

};

function confiserieActive(){
  return estDebloque("confiserie") && !!(Etat.confiserie?.active);
}
function tauxAchat(){
  const c = Etat.confiserie || {};
  return Math.min(0.6, Number(c.taux_achat ?? TAUX_ACHAT_BASE)
    + (Number(c.niveau_popcorn||1) - 1) * 0.03
    + (Number(c.niveau_boissons||1) - 1) * 0.02);
}

async function chargeConfiserie(){
  try{
    const d = await sbFetch(`confiserie?cinema_id=eq.${Etat.cinema.id}&select=*`);
    if(Array.isArray(d) && d.length){ Etat.confiserie = d[0]; return d[0]; }
  }catch(e){}
  Etat.confiserie = Etat.confiserie || {active:false, taux_achat:TAUX_ACHAT_BASE,
    niveau_popcorn:1, niveau_boissons:1, style_comptoir:"bois", total_popcorn:0};
  return Etat.confiserie;
}

/* activée automatiquement au niveau 5, une seule fois */
async function activeConfiserieSiBesoin(){
  if(!estDebloque("confiserie")) return false;
  await chargeConfiserie();
  if(Etat.confiserie?.active) return false;
  try{
    /* la ligne est créée par le serveur ; on n'active que le comptoir */
    if(!Etat.confiserie?.cinema_id) await rpc("reparer_partie", {p_cinema_id: Etat.cinema.id});
    await sbFetch(`confiserie?cinema_id=eq.${Etat.cinema.id}`, {method:"PATCH",
      prefer:"return=minimal", body:{active:true}});
    await chargeConfiserie();
    return !!Etat.confiserie?.active;
  }catch(e){ return false; }
}

/* ---------- calcul des ventes d'une séance (appelé par la simulation) ---------- */
function ventesConfiserie(spectateurs, satisfaction, rng){
  if(!confiserieActive() || spectateurs <= 0) return {articles:0, recettes:0, marge:0, detail:{}};
  /* une salle contente consomme davantage */
  const modif = 0.8 + (satisfaction/100) * 0.45;
  const acheteurs = Math.round(spectateurs * tauxAchat() * modif * (rng ? (0.9 + rng()*0.2) : 1));
  let articles = 0, recettes = 0, marge = 0;
  const detail = {};
  PRODUITS_CONFISERIE.forEach(p=>{
    const n = Math.round(acheteurs * p.part);
    detail[p.id] = n;
    articles += n;
    recettes += n * p.prix;
    marge    += n * (p.prix - p.cout);
  });
  return {articles, recettes:Math.round(recettes), marge:Math.round(marge), detail};
}

/* ---------- appel social protégé contre le double clic ---------- */
let actionSociale = false;
async function actionSoc(bouton, fn){
  if(actionSociale) return null;
  actionSociale = true;
  const texte = bouton ? bouton.textContent : null;
  if(bouton){ bouton.disabled = true; bouton.classList.add("chargement"); }
  try{
    const r = await fn();
    if(r && r.success === false) toastSocial(MSG_SOCIAL[r.code] || r.message || "Action impossible.");
    return r;
  }catch(e){
    toastSocial(messageErreur(e));
    return null;
  }finally{
    if(bouton){ bouton.disabled = false; bouton.classList.remove("chargement");
                if(texte !== null) bouton.textContent = texte; }
    actionSociale = false;
  }
}

function toastSocial(message, ic){
  const d = document.createElement("div");
  d.className = "toastSocial";
  d.innerHTML = `${icone(ic || "cloche")}<span class="tsTxt"></span>`;
  document.body.appendChild(d);
  texteSur(d.querySelector(".tsTxt"), message);
  setTimeout(()=>d.remove(), 3200);
}

/* ============================================================
   BARRE D'ACTIONS SOCIALES (vitrine et fin de visite)
   ============================================================ */
let relationSociale = null;

async function chargeRelation(publicId){
  try{
    const r = await rpc("get_social_relationship", {p_public_id: publicId});
    relationSociale = r?.success ? r : null;
  }catch(e){ relationSociale = null; }
  return relationSociale;
}

function rendActionsSociales(cible, publicId, opts = {}){
  const el = document.getElementById(cible);
  if(!el) return;
  const r = relationSociale;
  if(!r || r.estMoi){ el.innerHTML = ""; return; }

  const amitie = {
    aucune:  {texte:"Ajouter en ami", action:`demandeAmi('${publicId}', this)`},
    envoyee: {texte:"Demande envoyée", desactive:true},
    recue:   {texte:"Accepter la demande", action:`accepteAmi('${r.demandeId}', this)`},
    amis:    {texte:"Amis", action:`menuAmi('${publicId}')`}
  }[r.amitie] || {texte:"Ajouter en ami", action:`demandeAmi('${publicId}', this)`};

  el.innerHTML = `
    <div class="barreSociale">
      ${r.peutSuivre ? `<button class="btnSocial ${r.suit?'actif':''}" id="btnSuivre"
        onclick="basculeSuivi('${publicId}', this)">
        ${icone(r.suit?"etoile":"porte")}<span>${r.suit?"Suivi":"Suivre"}</span></button>` : ""}
      ${r.peutDemanderAmi ? `<button class="btnSocial ${r.amitie==='amis'?'actif':''}"
        ${amitie.desactive?"disabled":`onclick="${amitie.action}"`}>
        ${icone("spectateurs")}<span>${amitie.texte}</span></button>` : ""}
    </div>
    ${r.peutReagir ? `<div class="blocReactions">
      <div class="brTitre">${opts.titre || "Envoyer une réaction"}</div>
      <div class="grilleReactions">
        ${Object.entries(REACTIONS).map(([cle,x])=>`
          <button class="btnReaction ${r.reactionDuJour===cle?'actif':''}"
            onclick="envoieReaction('${publicId}','${cle}', this)">
            ${icone(x.icone)}<span>${x.label}</span></button>`).join("")}
      </div>
      ${r.reactionDuJour ? `<div class="brNote">Tu as déjà envoyé
        « ${echappe(REACTIONS[r.reactionDuJour]?.label || "")} » aujourd'hui — tu peux la changer.</div>` : ""}
    </div>` : ""}
    ${r.abonnes != null ? `<div class="compteurSocial">${icone("spectateurs")}
      ${r.abonnes} abonné${r.abonnes>1?"s":""}</div>` : ""}
    ${(r.resumeReactions||[]).length ? `<div class="resumeReactions">
      ${r.resumeReactions.map(x=>`<span class="pastReaction">${icone(x.icone)} ${x.nombre} ${echappe(x.libelle)}</span>`).join("")}
    </div>` : ""}
    <button class="lienDiscret" onclick="menuModeration('${publicId}')">Bloquer ce cinéma</button>`;
}

/* ---------- réactions ---------- */
async function envoieReaction(publicId, cle, bouton){
  const r = await actionSoc(bouton, ()=>rpc("envoyer_reaction",
    {p_public_id: publicId, p_cle: cle}));
  if(!r?.success) return;
  animeReaction(bouton, cle);
  await chargeRelation(publicId);
  rendActionsSociales(conteneurSocialActuel, publicId);
  toastSocial(phraseReaction(cle), REACTIONS[cle]?.icone);
}
function phraseReaction(cle){
  if(cle === "bravo") return "Un bravo envoyé. Ça coûte moins cher qu'un bouquet et ça fane moins vite.";
  return "« " + (REACTIONS[cle]?.label || "Réaction") + " » envoyé.";
}
function animeReaction(bouton, cle){
  if(!bouton || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const b = bouton.getBoundingClientRect();
  const v = document.createElement("div");
  v.className = "volReaction";
  v.innerHTML = icone(REACTIONS[cle]?.icone || "etoile");
  v.style.left = (b.left + b.width/2 - 12) + "px";
  v.style.top = (b.top - 6) + "px";
  document.body.appendChild(v);
  setTimeout(()=>v.remove(), 900);
}

/* ---------- abonnement ---------- */
let conteneurSocialActuel = "zoneSociale";
async function basculeSuivi(publicId, bouton){
  const suit = relationSociale?.suit;
  const r = await actionSoc(bouton, ()=>rpc(suit ? "ne_plus_suivre" : "suivre_cinema",
    {p_public_id: publicId}));
  if(!r?.success) return;
  await chargeRelation(publicId);
  rendActionsSociales(conteneurSocialActuel, publicId);
  toastSocial(suit ? "Tu ne suis plus ce cinéma." : "Cinéma suivi. Ses grandes nouvelles arriveront dans ton fil.");
}

/* ---------- amitié ---------- */
async function demandeAmi(publicId, bouton){
  const r = await actionSoc(bouton, ()=>rpc("envoyer_demande_ami", {p_public_id: publicId}));
  if(!r?.success) return;
  await chargeRelation(publicId);
  rendActionsSociales(conteneurSocialActuel, publicId);
  toastSocial("Demande envoyée. À eux de décider.", "spectateurs");
}
async function accepteAmi(id, bouton){
  const r = await actionSoc(bouton, ()=>rpc("repondre_demande_ami", {p_id:id, p_accepte:true}));
  if(!r?.success) return;
  toastSocial("Des amis dans le métier ! On pourra se plaindre ensemble des projecteurs.", "spectateurs");
  if(typeof rafraichirSocial === "function") await rafraichirSocial();
}
function menuAmi(publicId){
  confirmeSocial("Retirer de mes amis ?",
    "L'abonnement sera conservé, tu pourras le retirer ensuite.",
    "Retirer", async ()=>{
      const r = await rpc("retirer_ami", {p_public_id: publicId});
      if(r?.success){ await chargeRelation(publicId); rendActionsSociales(conteneurSocialActuel, publicId);
        toastSocial("Relation retirée."); }
    });
}
function menuModeration(publicId){
  confirmeSocial("Bloquer ce cinéma ?",
    "Les relations existantes seront retirées et ce joueur ne pourra plus interagir avec toi. Il n'en sera pas informé.",
    "Bloquer", async ()=>{
      const r = await rpc("bloquer_joueur", {p_public_id: publicId});
      if(r?.success){ toastSocial("Blocage appliqué."); location.href = "communaute.html"; }
    });
}

function confirmeSocial(titre, texte, valider, action){
  const o = document.createElement("div");
  o.className = "voileConfirm";
  o.innerHTML = `

  document.body.appendChild(o);
  texteSur(o.querySelector("#csTitre"), titre);

/* phrase de statut : « Ouvert · séance à 20h00 » */
function phraseStatut(){
  const st = (typeof statutCinema==="function") ? statutCinema() : {code:"ferme", pastille:"ferme"};
  const c = Etat.cinema || {};
  const seances = (Etat.seancesJour || []).slice().sort((a,b)=>(a.heure||"").localeCompare(b.heure||""));
  let txt;
  if(st.code === "travaux_total") txt = "Fermé pour travaux";
  else if(st.code === "travaux_partiel") txt = "Ouvert · travaux en cours";
  else if(st.code === "ferme") txt = "Fermé · jour " + (c.jour||1);
  else if(seances.length) txt = "Ouvert · séance à " + seances[0].heure;
  else txt = "Ouvert · aucune séance au programme";
  return {txt, pastille:st.pastille};
}

function majStatutHeader(){
  const pas = document.getElementById("pastilleH");
  const eta = document.getElementById("etatH");
  if(!pas || !eta) return;
  const p = phraseStatut();
  pas.className = "pastilleH " + (p.pastille==="ouvert" ? "" : p.pastille==="travaux" ? "travauxH" : "fermeH");
  eta.className = "etatH " + (p.pastille==="ouvert" ? "" : p.pastille==="travaux" ? "travaux" : "ferme");
  /* on garde la pastille et on n'écrit que le texte à côté */
  let libelle = eta.querySelector(".libelleH");
  if(!libelle){
    libelle = document.createElement("span");
    libelle.className = "libelleH";
    eta.appendChild(libelle);
  }
  libelle.textContent = p.txt;
}
setInterval(()=>{ if(document.getElementById("etatH")) majStatutHeader(); }, 30000);

/* ============================================================
   HORAIRES — grille de départ, extensible par la progression
   ============================================================ */
const HORAIRES_BASE = ["10h00","13h00","15h30","18h00","20h30","23h00"];
const HORAIRES_TOT  = ["08h30"];                 /* creneaux_8 */
const HORAIRES_NUIT = ["01h00","03h00"];         /* creneaux_10 */

/* structure prête pour des horaires personnalisés plus tard */
function horairesDisponibles(){
  let h = [...HORAIRES_BASE];
  if(typeof debloque === "function"){
    if(debloque("creneaux_8"))  h = [...HORAIRES_TOT, ...h];
    if(debloque("creneaux_10")) h = [...HORAIRES_TOT, ...HORAIRES_BASE, ...HORAIRES_NUIT];
  }
  return [...new Set(h)].sort(compareHeures);
}

/* ---------- utilitaires horaires ---------- */
function heureEnMinutes(h){                       /* "18h00" → 1080 */
  const m = String(h).match(/(\d{1,2})h(\d{2})/);
  return m ? parseInt(m[1],10)*60 + parseInt(m[2],10) : 0;
}
function minutesEnHeure(min){                     /* 1185 → "19h45" */
  const m = ((min % 1440) + 1440) % 1440;
  return String(Math.floor(m/60)).padStart(2,"0") + "h" + String(m%60).padStart(2,"0");
}
function compareHeures(a,b){ return heureEnMinutes(a) - heureEnMinutes(b); }
function fmtDuree(min){
  const h = Math.floor(min/60), m = min%60;
  return h ? (h + "h" + String(m).padStart(2,"0")) : (m + " min");
}

const NETTOYAGE_MIN = 20;                         /* temps de remise en état */
function filmParId(id){
  if(String(id).startsWith("maison_") && Array.isArray(Etat?.filmsMaisonCat))
    return Etat.filmsMaisonCat.find(f=>f.id===id);
  return CATALOGUE_FILMS.find(f=>f.id===id);
}
function filmDebloque(f){ return f.maison || (f.niveauRequis||1) <= (typeof niveauActuel==="function" ? niveauActuel() : 1); }

/* limite quotidienne — formule évolutive */
function obtenirLimiteSeances(cinema, salles){
  const base = Math.max(1, (salles||[]).length) * 3;
  let bonus = 0;
  if(typeof debloque === "function"){
    if(debloque("creneaux_6"))  bonus += 1;
    if(debloque("creneaux_8"))  bonus += 1;
    if(debloque("creneaux_10")) bonus += 2;
  }
  return base + bonus;
}

/* ============================================================
   SIMULATION D'UNE JOURNÉE
   ⚠ TEMPORAIRE : tout est calculé côté client pour équilibrer.
   La fonction Supabase `simuler_journee(cinema_id, jour)` prendra
   le relais — voir SQL fourni. Les entrées/sorties sont volontairement
   identiques pour que le basculement soit une simple substitution
   d'appel dans `ouvreCinema()`.
   ============================================================ */

/* ---------- générateur pseudo-aléatoire déterministe (mulberry32) ---------- */
function graineNumerique(str){
  let h = 1779033703 ^ String(str).length;
  for(let i=0;i<String(str).length;i++){
    h = Math.imul(h ^ String(str).charCodeAt(i), 3432918353);
    h = h << 13 | h >>> 19;
  }
  return h >>> 0;
}
function creeRng(graine){
  let a = graineNumerique(graine);
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function entre(rng, min, max){ return min + rng()*(max-min); }

/* ---------- tables d'équilibrage ---------- */
const BONUS_HORAIRES = {
  "08h30":0.42, "10h00":0.55, "11h30":0.60, "13h00":0.70, "13h30":0.72,
  "15h30":0.82, "16h00":0.84, "17h00":0.88, "17h30":0.90, "18h00":0.95,
  "19h00":1.05, "20h00":1.12, "20h30":1.15, "22h15":0.86, "23h00":0.72,
  "00h15":0.52, "01h00":0.40, "02h00":0.30, "03h00":0.22, "09h30":0.48
};
function attractiviteHoraire(heure, film){
  let base = BONUS_HORAIRES[heure] ?? 0.7;
  const h = heureEnMinutes(heure);
  const g = (film.genre||"").toLowerCase();
  /* affinités genre × moment de la journée */
  if(g.includes("animation") && h >= 13*60 && h <= 17*60) base *= 1.22;
  if(g.includes("animation") && h >= 22*60) base *= 0.55;
  if((g.includes("thriller")||g.includes("noir")||g.includes("culte")) && h >= 21*60) base *= 1.20;
  if(g.includes("romance") && h >= 19*60 && h <= 22*60) base *= 1.15;
  if(g.includes("documentaire")) base = base*0.75 + 0.25;      /* plus stable en journée */
  if(g.includes("drame") && h >= 18*60) base *= 1.06;
  return base;
}

const PUBLICS_QUARTIERS = {
  centre:      {familles:.15, etudiants:.20, adultes:.35, seniors:.10, cinephiles:.20},
  residentiel: {familles:.40, etudiants:.08, adultes:.25, seniors:.20, cinephiles:.07},
  etudiant:    {familles:.08, etudiants:.55, adultes:.22, seniors:.05, cinephiles:.10},
  populaire:   {familles:.28, etudiants:.22, adultes:.30, seniors:.12, cinephiles:.08},
  artistique:  {familles:.10, etudiants:.18, adultes:.27, seniors:.10, cinephiles:.35}
};
/* le catalogue utilise des libellés proches : on normalise */
const ALIAS_PUBLIC = {familles:"familles", enfants:"familles", adolescents:"etudiants",
  etudiants:"etudiants", adultes:"adultes", seniors:"seniors", cinephiles:"cinephiles"};

function repartitionPublic(film, cinema){
  const mix = PUBLICS_QUARTIERS[cinema.quartier] || PUBLICS_QUARTIERS.populaire;
  const cibles = [...new Set((film.publicCible||["adultes"]).map(p=>ALIAS_PUBLIC[p]||"adultes"))];
  const parts = {};
  let total = 0;
  cibles.forEach(c=>{ parts[c] = mix[c] || 0.05; total += parts[c]; });
  return {parts, couverture: total};   /* couverture = part de la population visée */
}
function effetQuartier(film, cinema){
  const {couverture} = repartitionPublic(film, cinema);
  /* 0.20 de couverture → 0.86 ; 0.55 → 1.15 */
  return Math.max(.7, Math.min(1.3, 0.72 + couverture*0.8)) * (cinema.mult_frequentation||1);
}

/* facteur global d'équilibrage : un seul curseur pour ajuster toute l'économie */
const CALIBRAGE = 0.78;
const PRIX_RECOMMANDE = 8;
function calculerEffetPrix(prix, prixRecommande = PRIX_RECOMMANDE){
  const d = prix - prixRecommande;
  if(d <= -3) return 1.12;
  if(d <=  2) return 1;
  if(d <=  5) return 0.78;
  if(d <=  8) return 0.50;
  return 0.32;   /* au-delà de 16 €, le quartier boude franchement */
}

/* ---------- incidents de séance ---------- */
const INCIDENTS = [
  {id:"son",       texte:"Coupure de son pendant dix minutes. Bob a doublé les dialogues.", satisfaction:-8, recettes:1},
  {id:"siege",     texte:"Un siège a cédé. Le rang 12, évidemment.",                        satisfaction:-5, recettes:1},

const PROBA_INCIDENT = 0.05;

/* ---------- fréquentation d'une séance ---------- */
function calculerSpectateurs({film, salle, cinema, seance, evenement, variation, reputation}){
  const capacite = salle.capacite || 60;
  const populariteFilm  = film.popularite / 100;
  const horaire         = attractiviteHoraire(seance.heure, film);
  const prix            = calculerEffetPrix(Number(seance.prix), PRIX_RECOMMANDE + (obtenirBonusSalle(salle).prixAcceptable||0));
  const effetReputation = 0.65 + (reputation ?? 50) / 200;
  /* bonus centralisés (ameliorations.js) : source unique de vérité */
  const bonus           = obtenirBonusSalle(salle);
  const effetConfort    = 0.86 + niveauEquipement(salle,"sieges") * 0.05;
  const effetEcran      = 0.94 + niveauEquipement(salle,"ecran")  * 0.035;
  const effetSon        = 0.96 + niveauEquipement(salle,"son")    * 0.025;
  const effetProprete   = 0.88 + proprete(salle)/100 * 0.16;
  const effetEtat       = 0.92 + Number(salle.etat ?? 100)/100 * 0.08;
  const effetQ          = effetQuartier(film, cinema);
  let effetEvenement    = evenement.demandeMultiplier;
  if(evenement.bonusCinephiles && (film.publicCible||[]).includes("cinephiles")) effetEvenement *= evenement.bonusCinephiles;
  const effetQualite    = 0.88 + (film.qualite/100) * 0.24;

  const demande = CALIBRAGE * capacite * populariteFilm * horaire * prix * effetReputation
                * effetConfort * effetEcran * effetSon * effetProprete * effetEtat
                * effetQ * effetEvenement * effetQualite * variation;

  return Math.max(0, Math.min(capacite, Math.round(demande)));
}

/* propreté réelle de la salle (entretenue par le joueur) */
function proprete(salle){ return Math.max(0, Math.min(100, Number(salle.proprete ?? 100))); }

/* ---------- satisfaction d'une séance ---------- */
function calculerSatisfaction({film, salle, seance, evenement, incident}){
  /* échelle 0-3 : un équipement d'origine vaut 45/100, le maximum 100 */
  const note = n => 45 + Math.max(0, Math.min(3, n||0)) * 18.33;
  const confort = note(niveauEquipement(salle,"sieges"));
  const ecran   = note(niveauEquipement(salle,"ecran"));
  const son     = note(niveauEquipement(salle,"son"));
  const clim    = note(niveauEquipement(salle,"climatisation"));
  const deco    = note(niveauEquipement(salle,"decoration"));
  const prop    = proprete(salle);
  /* rapport qualité/prix : 100 si prix ≤ recommandé et bon film */
  const attendu = 4 + (film.qualite/100)*10;             /* prix "juste" perçu */
  const rapport = Math.max(0, Math.min(100, 100 - (Number(seance.prix) - attendu)*9));

  let s = film.qualite*0.35 + confort*0.13 + ecran*0.11 + son*0.11
        + clim*0.05 + deco*0.05 + prop*0.10 + rapport*0.10;
  s += evenement.satisfactionModifier || 0;
  s += malusProprete(salle);
  /* la climatisation atténue les événements météo négatifs */
  if((evenement.satisfactionModifier||0) < 0)
    s += Math.abs(evenement.satisfactionModifier) * (obtenirBonusSalle(salle).protectionMeteo||0);
  if(incident) s += incident.satisfaction;
  return Math.max(0, Math.min(100, Math.round(s)));
}

/* ---------- variation de réputation ---------- */
function variationReputation(satMoyenne, salleComplete, incidentMajeur){
  let d = 0;
  if(satMoyenne < 40) d = -3;
  else if(satMoyenne < 60) d = -1;
  else if(satMoyenne < 75) d = 0;
  else if(satMoyenne < 90) d = 1;
  else d = 2;
  if(salleComplete) d += 1;
  if(incidentMajeur) d -= 1;
  return d;
}

/* ============================================================
   SIMULATION COMPLÈTE — déterministe à partir de la graine
   ============================================================ */
function simuleJournee({cinema, salles, seances, reputation, graine}){
  const rng = creeRng(graine);
  const evenement = tireEvenement(rng);

  const resultats = seances
    .slice().sort((a,b)=>compareHeures(a.heure,b.heure))
    .map(s=>{
      const film  = filmParId(s.film_id) || {titre:s.film_id, popularite:40, qualite:50, genre:"Drame", publicCible:["adultes"]};
      const salle = salles.find(x=>String(x.id)===String(s.salle_id)) || {capacite:60, confort:1, ecran:1, son:1, deco:1};
      const variation = entre(rng, .90, 1.10);
      const risque    = obtenirBonusSalle(salle).risqueIncident;
      const incident  = rng() < risque ? INCIDENTS[Math.floor(rng()*INCIDENTS.length)] : null;

      const spectateurs = calculerSpectateurs({film, salle, cinema, seance:s, evenement, variation, reputation});
      const satisfaction = calculerSatisfaction({film, salle, seance:s, evenement, incident});
      const brut = Math.round(spectateurs * Number(s.prix) * (incident ? incident.recettes : 1));
      const licence = Number(s.cout_licence||0);
      const {parts} = repartitionPublic(film, cinema);
      const conf = (typeof ventesConfiserie === "function")
        ? ventesConfiserie(spectateurs, satisfaction, rng) : {articles:0, recettes:0, marge:0, detail:{}};

      /* répartition estimée des spectateurs par public */
      const somme = Object.values(parts).reduce((t,v)=>t+v,0) || 1;
      const publics = {};
      Object.entries(parts).forEach(([k,v])=>{ publics[k] = Math.round(spectateurs * v/somme); });

      return {
        seance_id: s.id, heure: s.heure, film_id: s.film_id, titre: film.titre,
        salle: s.salle, salle_id: s.salle_id, capacite: salle.capacite,
        prix: Number(s.prix), spectateurs, satisfaction,
        brut, licence, net: brut + conf.marge - licence,
        confiserie: conf,
        complete: spectateurs >= salle.capacite,
        incident_id: incident ? incident.id : null,
        incident_texte: incident ? incident.texte : null,
        publics
      };
    });

  const totalSpectateurs = resultats.reduce((t,r)=>t+r.spectateurs, 0);
  const brut    = resultats.reduce((t,r)=>t+r.brut, 0);
  const confRec = resultats.reduce((t,r)=>t+(r.confiserie?.recettes||0), 0);
  const confCout= resultats.reduce((t,r)=>t+((r.confiserie?.recettes||0)-(r.confiserie?.marge||0)), 0);
  const confArt = resultats.reduce((t,r)=>t+(r.confiserie?.articles||0), 0);
  const licences= resultats.reduce((t,r)=>t+r.licence, 0);
  const satMoy  = resultats.length ? Math.round(resultats.reduce((t,r)=>t+r.satisfaction,0)/resultats.length) : 0;
  const complete= resultats.some(r=>r.complete);
  const incidentMajeur = resultats.some(r=>r.incident_id === "projecteur");
  let dRep      = variationReputation(satMoy, complete, incidentMajeur);
  /* écran restauré et belle décoration peuvent ajouter +1, une seule fois par jour */
  const bonusRep = Math.min(1, Math.max(...(salles.length?salles.map(x=>obtenirBonusSalle(x).reputation):[0])));
  if(satMoy >= 70 && bonusRep > 0) dRep += 1;

  const meilleur = resultats.slice().sort((a,b)=>b.satisfaction-a.satisfaction)[0] || null;
  const remplie  = resultats.slice().sort((a,b)=>(b.spectateurs/b.capacite)-(a.spectateurs/a.capacite))[0] || null;

  return {
    evenement, resultats,
    total_spectateurs: totalSpectateurs,
    recettes_brutes: brut,
    recettes_confiserie: confRec,
    cout_confiserie: confCout,
    articles_confiserie: confArt,
    cout_licences: licences,
    benefice_net: brut + confRec - confCout - licences,
    satisfaction_moyenne: satMoy,
    variation_reputation: dRep,
    meilleur_film: meilleur ? meilleur.titre : null,
    seance_plus_remplie: remplie ? remplie.seance_id : null,
    salle_complete: complete
  };
}

/* ---------- commentaire de Bob sur la journée ---------- */
function bobBilan(b, cinema){
  if(b.total_spectateurs === 0)
    return "Personne. Pas un chat. J'ai passé la journée à balayer un hall vide en sifflotant.";
  if(b.benefice_net < 0)
    return "On a perdu de l'argent aujourd'hui. Ça arrive. Baisse un peu les prix, ou vise les créneaux du soir.";
  if(b.satisfaction_moyenne >= 90)
    return "Les gens sont sortis en applaudissant. J'ai failli pleurer dans le popcorn.";
  if(b.satisfaction_moyenne >= 75)
    return "Belle journée, patron. Ils reviendront, et ils amèneront du monde.";
  if(b.satisfaction_moyenne >= 60)
    return "Correct. Personne n'a râlé, personne n'a chanté. C'est déjà ça.";
  return "Bof. Il faudrait soigner le confort, ou choisir des films un peu plus solides.";
}

/* ---------- lecture / création de la journée courante ---------- */
async function chargeJournee(force = false){
  const c = Etat.cinema;
  try{
    const d = await sbFetch(`journees?cinema_id=eq.${c.id}&jour=eq.${c.jour}&select=*`);
    if(Array.isArray(d) && d.length){ Etat.journee = d[0]; return d[0]; }
    const res = await sbFetch("journees", {method:"POST", body:{
      cinema_id:c.id, user_id:Etat.session?.user_id, jour:c.jour, statut:"draft"
    }});
    Etat.journee = (Array.isArray(res) && res[0]) || {jour:c.jour, statut:"draft"};
  }catch(e){ Etat.journee = Etat.journee || {jour:c.jour, statut:"draft"}; }
  return Etat.journee;
}

function statutJournee(){ return Etat.journee?.statut || "draft"; }
function bilanDisponible(){ return statutJournee() === "running" && Etat.journee?.resultats; }

/* ---------- vérifications avant ouverture ---------- */
function verifieOuverture(){
  const s = Etat.seancesJour || [];
  if(statutJournee() === "running")   return {ok:false, code:"deja_lancee", msg:"La journée est déjà lancée. Va voir le bilan."};
  if(statutJournee() === "completed") return {ok:false, code:"deja_terminee", msg:"Cette journée est terminée. Passe au jour suivant."};
  if(s.length === 0)                  return {ok:false, code:"aucune_seance", msg:"Aucune séance au programme. On n'ouvre pas un cinéma vide."};
  if(!s.every(x=>x.statut === "validated")) return {ok:false, code:"brouillon", msg:"Le programme n'est pas validé. Un dernier passage par la cabine."};
  const licences = s.reduce((t,x)=>t + Number(x.cout_licence||0), 0);
  if(Number(Etat.cinema.argent) < licences)
    return {ok:false, code:"argent", licences,
      msg:"On ne peut pas louer les films avec des tickets de tombola. Il manque de l'argent dans la caisse."};
  return {ok:true, licences};
}

/* ---------- ouverture + simulation (calculées par le serveur) ---------- */
async function ouvreCinema(){
  const v = verifieOuverture();
  if(!v.ok){ parleBob("« " + v.msg + " »"); return; }

  const op = idOperation();
  let reponse;
  try{
    statutSauvegarde("encours");
    reponse = await rpc("simuler_journee", {p_cinema_id: Etat.cinema.id, p_operation_id: op});
    statutSauvegarde("ok");
  }catch(e){
    statutSauvegarde("erreur");
    /* le calcul a peut-être abouti : on recharge avant de conclure */
    await rafraichirEtat().catch(()=>null);
    if(Etat.journee?.resultats){ location.href = "bilan.html"; return; }
    parleBob("« " + messageErreur(e) + " »");
    return;
  }

  if(!reponse?.success){
    if(reponse?.code === "ALREADY_RUNNING"){ location.href = "bilan.html"; return; }
    const M = {
      INSUFFICIENT_FUNDS:"On ne peut pas louer les films avec des tickets de tombola. Il manque de l'argent dans la caisse.",
      NO_SCREENINGS:"Aucune séance au programme. On n'ouvre pas un cinéma vide.",
      NOT_VALIDATED:"Le programme n'est pas validé. Un dernier passage par la cabine.",
      ALREADY_COMPLETED:"Cette journée est terminée. Passe au jour suivant."
    };
    parleBob("« " + (M[reponse?.code] || "La machine a toussé. Réessaie.") + " »");
    return;
  }

  const bilan = reponse.data;
  Etat.journee = {...(Etat.journee||{}), statut:"running", resultats:bilan};
  await chargeCinema(true);
  majHeaderArgent();
  await sequenceOuverture(bilan);
  location.href = "bilan.html";
}

/* ---------- séquence animée d'ouverture ---------- */
function sequenceOuverture(bilan){
  return new Promise(resolve=>{
    const reduit = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const o = document.createElement("div");
    o.className = "voileSeance";
    o.innerHTML = `<div class="seqBoite">
      <div class="seqTitre" id="seqTitre">Les portes s'ouvrent…</div>
      <div class="seqScene" id="seqScene"></div>
      <div class="seqBob" id="seqBob"></div>
    </div>`;
    document.body.appendChild(o);

    const titre = o.querySelector("#seqTitre");
    const scene = o.querySelector("#seqScene");
    const bulle = o.querySelector("#seqBob");
    const pas = reduit ? 120 : 1;

    const etapes = [];
    etapes.push({d: reduit?200:1400, f:()=>{
      scene.innerHTML = `<div class="seqPortes"><span></span><span></span></div>`;
      bulle.textContent = "« Ouvrez tout ! Le quartier attend depuis ce matin. »";
    }});
    bilan.resultats.forEach((r,i)=>{
      etapes.push({d: reduit?150:1500, f:()=>{
        titre.textContent = r.heure;
        scene.innerHTML = `
          <div class="seqSeance">
            <div class="seqFilm">${r.titre}</div>
            <div class="seqSalle">${r.salle} · ${r.capacite} places</div>
            <div class="seqJauge"><i id="jauge${i}"></i></div>
            <div class="seqCompte" id="compte${i}">0 / ${r.capacite} spectateurs</div>
          </div>`;
        const barre = document.getElementById("jauge"+i);
        const cpt   = document.getElementById("compte"+i);
        const cible = r.spectateurs;
        if(reduit){
          barre.style.width = (cible/r.capacite*100)+"%";
          cpt.textContent = `${cible} / ${r.capacite} spectateurs`;
        }else{
          let n = 0;
          const inc = Math.max(1, Math.round(cible/26));
          const t = setInterval(()=>{
            n = Math.min(cible, n+inc);
            barre.style.width = (n/r.capacite*100)+"%";
            cpt.textContent = `${n} / ${r.capacite} spectateurs`;
            if(n >= cible) clearInterval(t);
          }, 40);
        }
        bulle.textContent = r.incident_texte ? "« " + r.incident_texte + " »" : "";
      }});
      etapes.push({d: reduit?120:1100, f:()=>{
        scene.innerHTML = `
          <div class="seqResultat">
            <div class="seqLigne"><b>${r.spectateurs}</b> billets vendus</div>
            <div class="seqLigne"><b>${fmtArgent(r.brut)}</b> de recettes</div>
            <div class="seqLigne">Satisfaction : <b>${r.satisfaction} %</b></div>
          </div>`;
      }});
    });
    etapes.push({d: reduit?200:1300, f:()=>{
      titre.textContent = "La journée est terminée.";
      scene.innerHTML = `<div class="seqFin">${icone("pellicule","icoFin")}</div>`;
      bulle.textContent = "« Bob prépare le bilan. »";
    }});

    let i = 0;
    (function suite(){
      if(i >= etapes.length){
        o.classList.add("sortie");
        setTimeout(()=>{ o.remove(); resolve(); }, 320);
        return;
      }
      const e = etapes[i++];
      e.f();
      setTimeout(suite, e.d);
    })();
  });
}

/* ============================================================
   XP DE LA JOURNÉE — calculée et attribuée par simuler_journee().
   Le client se contente de lire le total pour l'afficher.
   ============================================================ */
function xpDeLaJournee(bilan){ return Number(bilan?.xp_gagnee || 0); }

/* les gains d'XP hors journée passent aussi par le serveur */
async function journaliseXp(type, montant, cleUnique){ return false; }
async function journaliseXpSimple(type, montant, cleUnique){ return 0; }

/* ---------- statistiques cumulées (futur classement) ---------- */
/* les statistiques officielles sont mises à jour par terminer_journee() */
async function majStatsCinema(){ return; }

async function chargeStats(){
  try{
    const d = await sbFetch(`stats_cinema?cinema_id=eq.${Etat.cinema.id}&select=*`);
    Etat.stats = (Array.isArray(d) && d[0]) || {};
  }catch(e){ Etat.stats = {}; }
  return Etat.stats;
}

/* ============================================================
   PASSAGE AU JOUR SUIVANT
   ============================================================ */
async function passeAuJourSuivant(bilan){
  const op = idOperation();
  let r;
  try{
    statutSauvegarde("encours");
    r = await rpc("terminer_journee", {p_cinema_id: Etat.cinema.id, p_operation_id: op});
    statutSauvegarde("ok");
  }catch(e){
    statutSauvegarde("erreur");
    await rafraichirEtat().catch(()=>null);
    /* si le jour a avancé, la clôture est passée malgré l'erreur réseau */
    if(!Etat.journee || Etat.journee.statut === "draft"){ location.href = "jeu.html"; return; }
    parleBobBilan(messageErreur(e));
    return;
  }
  if(!r?.success && r?.code !== "ALREADY_COMPLETED"){
    parleBobBilan(r?.message || "La clôture a échoué.");
    return;
  }
  Etat.seancesJour = [];
  Etat.journee = null;
  location.href = "jeu.html";
}
function parleBobBilan(msg){
  const b = document.getElementById("btnSuivant");
  if(b){ b.disabled = false; b.textContent = msg; }
}

/* ============================================================
   TRANSACTIONS — historique économique complet
   ============================================================ */
async function enregistreTransaction({categorie, montant, solde_avant, solde_apres, salle_id, details}){
  try{
    await sbFetch("transactions", {method:"POST", prefer:"return=minimal", body:{

      jour: Etat.cinema.jour, categorie, montant,
      solde_avant, solde_apres, details: details || null
    }});
  }catch(e){}
}

/* variante simple du journal d'XP : renvoie le montant si nouveau, 0 sinon */
async function journaliseXpSimple(type, montant, cleUnique){
  const ok = await journaliseXp(type, montant, cleUnique);
  return ok ? montant : 0;
}

/* ============================================================
   BILAN DE FIN DE JOURNÉE
   Affiche TOUJOURS les données sauvegardées (jamais de recalcul).
   ============================================================ */
let bilanCourant = null;
let xpAttribuee = 0;
let recordBattu = false;

async function initBilan(){
  await chargeStats();
  const c = Etat.cinema;
  const d = await sbFetch(`journees?cinema_id=eq.${c.id}&jour=eq.${c.jour}&select=*`);
  const j = Array.isArray(d) && d[0];

  if(!j || !j.resultats){
    document.getElementById("contenuBilan").innerHTML = `
      <section class="carteEcran">
        <h2>Pas encore de bilan</h2>
        <div class="vide">La journée n'a pas été jouée.<br>Retourne à l'accueil pour ouvrir le cinéma.</div>
        <button class="btnRouge btnJourSuivant" onclick="location.href='jeu.html'">Retour au cinéma</button>
      </section>`;
    return;
  }
  if(j.statut === "completed"){
    /* bilan déjà validé : lecture seule */
    bilanCourant = j.resultats;
    rendBilan(bilanCourant, true);
    return;
  }

  bilanCourant = j.resultats;
  bilanCourant._jour = c.jour;
  /* l'XP a déjà été attribuée par simuler_journee() : on lit le total officiel */
  xpAttribuee = xpDeLaJournee(bilanCourant);
  recordBattu = Number(bilanCourant.total_spectateurs) > Number(Etat.stats?.meilleure_journee || 0)
                && Number(Etat.stats?.meilleure_journee || 0) > 0;
  rendBilan(bilanCourant, false);
}

function mentionSatisfaction(s){
  if(s < 40) return "très mauvais";
  if(s < 60) return "moyen";
  if(s < 75) return "satisfaisant";
  if(s < 90) return "très bon";
  return "exceptionnel";
}

  const incidents = b.resultats.filter(r=>r.incident_texte);
  const remplie = b.resultats.find(r=>String(r.seance_id) === String(b.seance_plus_remplie));

  document.getElementById("contenuBilan").innerHTML = `
    <div class="enteteBilan">
      <div class="ebJour">Jour ${b._jour || c.jour} terminé</div>
      <div class="ebSous">${b.evenement.nom}</div>
    </div>

    <section class="carteEcran">
      <h2>Les chiffres</h2>
      <div class="ligneRecit">${icone("spectateurs")}<span>Spectateurs : <b>${b.total_spectateurs}</b></span></div>
      <div class="ligneRecit">${icone("billet")}<span>Recettes billetterie : <b>${fmtArgent(b.recettes_brutes)}</b></span></div>
      ${b.recettes_confiserie ? `<div class="ligneRecit">${icone("billet")}<span>Confiserie : <b>+${fmtArgent(b.recettes_confiserie)}</b> <small>${b.articles_confiserie} articles · coût ${fmtArgent(b.cout_confiserie)}</small></span></div>` : ""}
      <div class="ligneRecit">${icone("pellicule")}<span>Licences : <b>−${fmtArgent(b.cout_licences)}</b> <small>(déjà payées à l'ouverture)</small></span></div>
      <div class="ligneRecit">${icone("piece")}<span>Bénéfice net : <b class="${b.benefice_net<0?'negatif':'positif'}">${b.benefice_net<0?"−":"+"}${fmtArgent(Math.abs(b.benefice_net))}</b></span></div>
      <div class="ligneRecit">${icone("etoile")}<span>Satisfaction moyenne : <b>${b.satisfaction_moyenne} %</b> <small>${mentionSatisfaction(b.satisfaction_moyenne)}</small></span></div>
      <div class="ligneRecit">${icone("journal")}<span>Réputation : <b class="${b.variation_reputation<0?'negatif':'positif'}">${b.variation_reputation>0?"+":""}${b.variation_reputation}</b></span></div>
      ${dejaValide ? "" : `<div class="ligneRecit">${icone("camera")}<span>XP gagnée : <b class="positif">+${xpAttribuee}</b></span></div>`}
    </section>

    <div class="blocBob bilanBob">
      <div class="bobMiniTete grand"><svg viewBox="30 40 60 60">
        <circle cx="60" cy="70" r="26" fill="#f0c9a0"/>
        <path d="M40 78 Q50 86 60 79 Q70 86 80 78 Q72 92 60 84 Q48 92 40 78" fill="#4a3527"/>
        <path d="M44 60 Q51 55 57 59 M63 59 Q69 55 76 60" stroke="#4a3527" stroke-width="4" fill="none" stroke-linecap="round"/>
        <circle cx="51" cy="66" r="2.6" fill="#1c1210"/><circle cx="69" cy="66" r="2.6" fill="#1c1210"/>
        <path d="M34 56 Q60 34 86 56 L86 50 Q60 28 34 50 Z" fill="#571520"/>
        <rect x="52" y="44" width="16" height="7" rx="2" fill="#e8b84b"/>
      </svg></div>
      <div class="bulle"><b>Bob</b><span>${bobBilan(b, c)}</span></div>
    </div>

    ${recordBattu ? `<div class="bandeauRecord">${icone("etoile")} Nouveau record de fréquentation : ${b.total_spectateurs} spectateurs</div>` : ""}

    <section class="carteEcran">
      <h2>Séance par séance</h2>
      ${b.resultats.map(r=>`
        <div class="ligneBilanSeance">
          <div class="lbHeure">${r.heure}</div>
          <div class="lbCorps">
            <div class="lbTitre">${r.titre}</div>
            <div class="lbJauge"><i style="width:${Math.round(r.spectateurs/r.capacite*100)}%"></i></div>
            <div class="lbMeta">${r.spectateurs} / ${r.capacite} places · ${fmtArgent(r.brut)} · satisfaction ${r.satisfaction} %${r.confiserie?.articles?` · ${r.confiserie.articles} articles vendus` : ""}</div>
            ${r.incident_texte ? `<div class="lbIncident">${icone("cloche")} ${r.incident_texte}</div>` : ""}
          </div>
        </div>`).join("")}
    </section>

    <section class="carteEcran">
      <h2>Faits du jour</h2>
      <div class="ligneRecit">${icone("journal")}<span><b>${b.evenement.nom}</b><br><small>${b.evenement.description}</small></span></div>
      ${b.meilleur_film ? `<div class="ligneRecit">${icone("etoile")}<span>Meilleur accueil : <b>${b.meilleur_film}</b></span></div>` : ""}

    </section>

      ? `<button class="btnRouge btnJourSuivant" onclick="location.href='jeu.html'">Retour au cinéma</button>`
      : `<button class="btnRouge btnJourSuivant" id="btnSuivant" onclick="validerBilan()">Passer au jour ${(b._jour||c.jour)+1}</button>`}`;
}

async function validerBilan(){
  const b = document.getElementById("btnSuivant");
  if(b){ b.disabled = true; b.textContent = "Bob range la salle…"; }
  await passeAuJourSuivant(bilanCourant);
}


(async ()=>{
  initAmbiance("salles");
  try{
    const etat = await initialiserJeu({onglet:"jeu"});
    if(!etat) return;
    await initBilan();
  }catch(e){
    console.error("[Rex] page", e);
    const z = document.getElementById("contenuBilan") || document.body;
    z.textContent = (typeof messageErreur === "function" ? messageErreur(e) : "Erreur") + " Recharge la page.";
  }
})();
