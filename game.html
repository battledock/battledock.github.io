<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Battle Dock - Jeu</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Space+Grotesk:wght@500;700;900&family=Bungee&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 50%, #3b82f6 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .game-container {
      width: 100%;
      max-width: 600px;
      background: #e2e8f0;
      border: 4px solid #000000;
      border-radius: 20px;
      box-shadow: 8px 8px 0px #000000;
      padding: 30px;
      text-align: center;
    }

    .avatar-container {
      width: 120px;
      height: 120px;
      margin: 0 auto 20px;
      border: 4px solid #000000;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 4px 4px 0px #000000;
      background: white;
    }

    .avatar-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .username-display {
      font-family: 'Bangers', cursive;
      font-size: 32px;
      color: #0f172a;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .welcome-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 16px;
      color: #475569;
      margin-bottom: 30px;
      font-weight: 600;
    }

    .logout-btn {
      background: #ef4444;
      color: white;
      border: 4px solid #000000;
      border-radius: 12px;
      padding: 14px 28px;
      font-family: 'Bungee', sans-serif;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      cursor: pointer;
      box-shadow: 6px 6px 0px #000000;
      transition: all 0.15s ease;
      border-bottom: none;
    }

    .logout-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 8px 8px 0px #000000;
    }

    .logout-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #000000;
    }
  </style>
</head>
<body>
  <div class="game-container">
    <div class="avatar-container">
      <img src="avatar-default.png" alt="Avatar" id="avatarImage">
    </div>
    <div class="username-display" id="usernameDisplay">...</div>
    <div class="welcome-text">Bienvenue dans Battle Dock !</div>
    <button class="logout-btn" onclick="logout()">DÉCONNEXION</button>
  </div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const sb = createClient(supabaseUrl, supabaseKey);

    async function loadProfile() {
      const { data: { session } } = await sb.auth.getSession();
      
      if (!session) {
        window.location.href = 'index.html';
        return;
      }

      const { data: profile } = await sb
        .from('profiles')
        .select('username, avatar_url')
        .eq('user_id', session.user.id)
        .single();

      if (profile) {
        document.getElementById('usernameDisplay').textContent = profile.username;
        document.getElementById('avatarImage').src = profile.avatar_url;
      }
    }

    async function logout() {
      await sb.auth.signOut();
      window.location.href = 'index.html';
    }

    loadProfile();
  </script>
</body>
</html>
