<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Battle Dock - Jeu</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Space+Grotesk:wght@500;700;900&family=Bungee&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  
  <style>
    :root {
      --port-dark: #0f172a;
      --comic-yellow: #facc15;
      --comic-red: #ef4444;
      --comic-green: #22c55e;
      --border-thick: 4px solid #000000;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 50%, #3b82f6 100%);
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }

    .game-container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    /* EN-TÊTE JOUEUR */
    .player-header {
      background: #e2e8f0;
      border: var(--border-thick);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .avatar-container {
      width: 80px;
      height: 80px;
      border: var(--border-thick);
      border-radius: 50%;
      overflow: hidden;
      background: white;
      flex-shrink: 0;
    }

    .avatar-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .player-info {
      flex: 1;
      min-width: 0;
    }

    .player-username {
      font-family: 'Bangers', cursive;
      font-size: 24px;
      color: var(--port-dark);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-money {
      font-family: 'Bungee', sans-serif;
      font-size: 20px;
      color: var(--comic-green);
      margin-bottom: 2px;
    }

    /* CARTE GRADE */
    .grade-card {
      background: #e2e8f0;
      border: var(--border-thick);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .grade-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .grade-title {
      font-family: 'Bangers', cursive;
      font-size: 22px;
      color: var(--port-dark);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .grade-level {
      font-family: 'Bungee', sans-serif;
      font-size: 18px;
      color: #3b82f6;
    }

    .grade-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: #475569;
      margin-bottom: 12px;
    }

    /* BARRE DE PROGRESSION */
    .progress-container {
      background: #cbd5e1;
      border: var(--border-thick);
      border-radius: 10px;
      height: 32px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar {
      background: linear-gradient(90deg, var(--comic-yellow) 0%, #fb923c 100%);
      height: 100%;
      transition: width 0.3s ease;
      position: relative;
    }

    .progress-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Bungee', sans-serif;
      font-size: 12px;
      color: var(--port-dark);
      font-weight: 700;
      text-shadow: 1px 1px 0px #fff;
      z-index: 1;
    }

    /* BOUTON DÉCONNEXION */
    .logout-btn {
      background: var(--comic-red);
      color: white;
      border: var(--border-thick);
      border-radius: 12px;
      padding: 14px 20px;
      font-family: 'Bungee', sans-serif;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      cursor: pointer;
      box-shadow: 6px 6px 0px #000000;
      transition: all 0.15s ease;
      width: 100%;
      border-bottom: none;
    }

    .logout-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 8px 8px 0px #000000;
    }

    .logout-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #000000;
    }

    @media (max-width: 400px) {
      .player-header {
        padding: 16px;
      }

      .avatar-container {
        width: 70px;
        height: 70px;
      }

      .player-username {
        font-size: 20px;
      }

      .player-money {
        font-size: 18px;
      }

      .grade-title {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <!-- EN-TÊTE JOUEUR -->
    <div class="player-header">
      <div class="avatar-container">
        <img src="avatar-default.png" alt="Avatar" id="avatarImage">
      </div>
      <div class="player-info">
        <div class="player-username" id="playerUsername">...</div>
        <div class="player-money" id="playerMoney">0 €</div>
      </div>
    </div>

    <!-- CARTE GRADE -->
    <div class="grade-card">
      <div class="grade-header">
        <div class="grade-title">GRADE</div>
        <div class="grade-level" id="playerLevel">Niv. 1</div>
      </div>
      <div class="grade-name" id="playerGrade">Docker Occasionnel</div>
      <div class="progress-container">
        <div class="progress-bar" id="progressBar" style="width: 0%"></div>
        <div class="progress-text" id="progressText">0 / 100 XP</div>
      </div>
    </div>

    <!-- DÉCONNEXION -->
    <button class="logout-btn" onclick="logout()">DÉCONNEXION</button>
  </div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const sb = createClient(supabaseUrl, supabaseKey);

    let currentUser = null;

    async function loadProfile() {
      const { data: { session } } = await sb.auth.getSession();
      
      if (!session) {
        window.location.href = 'index.html';
        return;
      }

      currentUser = session.user;

      // Charger profil
      const { data: profile } = await sb
        .from('profiles')
        .select('username, avatar_url')
        .eq('user_id', currentUser.id)
        .single();

      if (profile) {
        document.getElementById('playerUsername').textContent = profile.username;
        document.getElementById('avatarImage').src = profile.avatar_url;
      }

      // Charger game_stats
      const { data: stats } = await sb
        .from('game_stats')
        .select('money, level, xp, grade')
        .eq('user_id', currentUser.id)
        .single();

      if (stats) {
        // Calculer XP nécessaire pour level up
        const xpNeeded = stats.level * 100; // Simple formule pour l'instant
        
        updatePlayerStats({
          money: stats.money,
          level: stats.level,
          xp: stats.xp,
          xpNeeded: xpNeeded,
          grade: stats.grade
        });
      }
    }

    function updatePlayerStats(stats) {
      document.getElementById('playerMoney').textContent = stats.money + ' €';
      document.getElementById('playerLevel').textContent = 'Niv. ' + stats.level;
      document.getElementById('playerGrade').textContent = stats.grade;
      
      const progressPercent = Math.min((stats.xp / stats.xpNeeded) * 100, 100);
      document.getElementById('progressBar').style.width = progressPercent + '%';
      document.getElementById('progressText').textContent = stats.xp + ' / ' + stats.xpNeeded + ' XP';
    }

    async function logout() {
      await sb.auth.signOut();
      window.location.href = 'index.html';
    }

    loadProfile();
  </script>
</body>
</html>
