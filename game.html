<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f4f1ea">
<title>Quai 84 — Fermé</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700;800;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Inter',sans-serif;background:#f4f1ea;color:#16140f;min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) 22px calc(24px + env(safe-area-inset-bottom,0px));
  position:relative;overflow:hidden}
/* grain */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.5;
  background-image:radial-gradient(rgba(0,0,0,.045) 1px,transparent 1px);background-size:14px 14px}

.wrap{position:relative;z-index:2;width:100%;max-width:400px;text-align:center;
  animation:rise .8s cubic-bezier(.2,.8,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

/* ancre */
.anchor{width:64px;height:64px;margin:0 auto 24px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;background:#fff;border:1px solid #e8e2d6;
  box-shadow:0 6px 24px rgba(22,20,15,.07)}
.anchor svg{width:30px;height:30px;animation:sway 5s ease-in-out infinite;transform-origin:50% 20%}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}

.kick{display:inline-flex;align-items:center;gap:7px;font-size:8.5px;font-weight:900;letter-spacing:3.5px;
  color:#c0392b;margin-bottom:16px}
.kick .dot{width:5px;height:5px;border-radius:50%;background:#c0392b;animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}

.h1{font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(30px,9vw,40px);
  line-height:1.05;letter-spacing:-1.2px;margin-bottom:16px}
.h1 em{font-style:italic;color:#c0392b}

.lead{font-size:14px;color:#7a7266;line-height:1.65;max-width:320px;margin:0 auto 26px}

/* la date */
.date{display:inline-flex;align-items:center;gap:9px;background:#16140f;color:#fff;
  border-radius:100px;padding:13px 24px;
  font-family:'Space Mono',monospace;font-size:12.5px;font-weight:700;letter-spacing:.6px;
  box-shadow:0 10px 30px rgba(22,20,15,.22)}
.date .led{width:6px;height:6px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80;
  animation:pulse 2s ease-in-out infinite;flex-shrink:0}

.foot{margin-top:38px;font-size:9px;letter-spacing:2.5px;color:#c4bdb0;font-weight:700}
</style>
</head>
<body>
<div class="wrap">

  <div class="anchor">
    <svg viewBox="0 0 24 24" fill="none" stroke="#16140f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="4" r="2"/>
      <line x1="12" y1="6" x2="12" y2="22"/>
      <line x1="7" y1="10" x2="17" y2="10"/>
      <path d="M4 14a8 8 0 0 0 16 0"/>
    </svg>
  </div>

  <div class="kick"><span class="dot"></span>QUAI 84 · PORT DE MARSEILLE</div>

  <div class="h1">Le jeu est<br><em>fermé.</em></div>

  <div class="lead">Le quai est vide, les grues sont à l'arrêt.<br>Un nouveau projet est en cours de création.</div>

  <div class="date"><span class="led"></span>FERMÉ JUSQU'À NOUVEL ORDRE</div>

  <div class="foot">⚓ NOUVEAU PROJET EN COURS</div>

</div>
</body>
</html>
