<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battle Dock - Jeu</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Special+Elite&display=swap" rel="stylesheet">
  <style>
    body {
      background: #0a0e14;
      color: #FFF;
      font-family: 'Special Elite', monospace;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
    }

    header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
      padding: 10px;
      background: rgba(255,255,255,0.05);
    }

    header div {
      font-family: 'Bebas Neue', sans-serif;  
    }

    main {
      display: flex;
      flex: 1;
    }

    #terminal {
      flex: 1;
      background: #000;
      padding: 10px;
      overflow-y: auto;
      margin-right: 20px;
    }

    #terminal input {
      width: 100%;
      background: #000;
      border: none; 
      color: #0F0;
      font-family: monospace;
      font-size: 16px;
      outline: none;
    }

    #display {
      flex: 2;
      background: rgba(255,255,255,0.1);
      padding: 20px;
      position: relative;
    }

    .tab-links {
      position: absolute;
      top: -30px;
      left: 0;
    }

    .tab-links button {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 5px 10px;
      cursor: pointer;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
    }

    .tab-links button.active {
      background: rgba(255,255,255,0.1);
    }

    .tab {
      display: none;
    }

    .tab.active {
      display: block;
    }
  </style>
</head>
<body>
  <header>
    <div id="username"></div>
    <div id="rank"></div>
    <div>Niveau <span id="level"></span></div>
    <div><span id="xp"></span> XP</div>
    <div>Énergie <span id="energy"></span>/<span id="max_energy"></span></div>
    <div><span id="money"></span> €</div>
  </header>

  <main>
    <section id="terminal">
      <div id="terminal-output"></div>
      <input type="text" id="terminal-input" placeholder="Tapez ici..." />
    </section>

    <section id="display">
      <div class="tab-links">
        <button class="tab-link active" data-tab="dock">Mon Quai</button>
        <button class="tab-link" data-tab="company">Compagnie Maritime (La Joliette)</button>
      </div>
      <div id="dock" class="tab active">
        <!-- Affichage des conteneurs du joueur -->
      </div>
      <div id="company" class="tab">
        <!-- Affichage des fonctions de compagnie (débloqué au niveau 100) -->
      </div>
    </section>
  </main>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const supabaseClient = createClient(supabaseUrl, supabaseKey);

    const userId = localStorage.getItem('userId');
    const username = localStorage.getItem('username');

    const usernameEl = document.getElementById('username');
    const rankEl = document.getElementById('rank');
    const levelEl = document.getElementById('level');
    const xpEl = document.getElementById('xp');
    const energyEl = document.getElementById('energy');
    const maxEnergyEl = document.getElementById('max_energy');
    const moneyEl = document.getElementById('money');

    const terminalInput = document.getElementById('terminal-input');
    const terminalOutput = document.getElementById('terminal-output');

    const tabs = document.querySelectorAll('.tab-link');
    const tabContents = document.querySelectorAll('.tab');

    async function loadPlayerData() {
      const { data, error } = await supabaseClient
        .from('game_progress')
        .select('*')
        .eq('user_id', userId)
        .single();

      if (error) {
        console.error('Erreur chargement données joueur:', error);
        return;
      }

      usernameEl.textContent = username;
      rankEl.textContent = getRank(data.level);
      levelEl.textContent = data.level;
      xpEl.textContent = data.xp;
      energyEl.textContent = data.energy;
      maxEnergyEl.textContent = data.energy_max;
      moneyEl.textContent = data.money;

      if (data.level >= 100) {
        document.querySelector('[data-tab="company"]').disabled = false;
      }
    }

    function getRank(level) {
      if (level < 15) return 'Docker Occasionnel';
      if (level < 30) return 'Docker';
      if (level < 50) return 'Docker Mensuel'; 
      if (level < 80) return 'Contre-Maître';
      if (level < 100) return 'Chef de Quai';
      return 'Directeur de Compagnie';
    }

    function handleTerminalInput(event) {
      if (event.key === 'Enter') {
        const input = terminalInput.value;
        terminalInput.value = '';

        const output = handleCommand(input);
        terminalOutput.innerHTML += `<br />&gt; ${input}<br />${output}`;
        terminalOutput.scrollTop = terminalOutput.scrollHeight;
      }
    }

    function handleCommand(input) {
      // Gérer les commandes du terminal ici
      // Retourner la sortie à afficher
      return 'Commande non reconnue';
    }

    function switchTab(event) {
      const tabId = event.target.getAttribute('data-tab');

      tabs.forEach(tab => tab.classList.remove('active'));
      tabContents.forEach(content => content.classList.remove('active'));

      event.target.classList.add('active');
      document.getElementById(tabId).classList.add('active');
    }

    loadPlayerData();
    terminalInput.addEventListener('keydown', handleTerminalInput);
    tabs.forEach(tab => tab.addEventListener('click', switchTab));
  </script>
</body>
</html>
