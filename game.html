<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Battle Dock - Le Port Chelou</title>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Bangers&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <script src="fullscreen.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Fredoka', sans-serif;
      background: linear-gradient(to bottom, 
        #ff6b35 0%,
        #f7931e 30%,
        #fdc830 60%,
        #f37335 100%);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Fumée noire du cargo */
    .smoke {
      position: fixed;
      bottom: 30%;
      right: 10%;
      width: 100px;
      height: 150px;
      z-index: 0;
    }

    .smoke-cloud {
      position: absolute;
      background: #2d3436;
      border-radius: 50%;
      opacity: 0.6;
      animation: smoke-rise 4s ease-out infinite;
    }

    .smoke-cloud:nth-child(1) {
      width: 60px;
      height: 60px;
      bottom: 0;
      left: 20px;
      animation-delay: 0s;
    }

    .smoke-cloud:nth-child(2) {
      width: 50px;
      height: 50px;
      bottom: 40px;
      left: 10px;
      animation-delay: 0.8s;
    }

    .smoke-cloud:nth-child(3) {
      width: 70px;
      height: 70px;
      bottom: 80px;
      left: 30px;
      animation-delay: 1.6s;
    }

    @keyframes smoke-rise {
      0% { 
        transform: translateY(0) scale(0.8);
        opacity: 0.6;
      }
      100% { 
        transform: translateY(-100px) scale(1.2);
        opacity: 0;
      }
    }

    /* Mouettes obèses qui se battent */
    .seagulls {
      position: fixed;
      top: 20%;
      left: 15%;
      z-index: 1;
    }

    .seagull {
      position: absolute;
      font-size: 48px;
      animation: seagull-fight 2s ease-in-out infinite;
      filter: drop-shadow(2px 2px 4px rgba(0, 0, 0, 0.3));
    }

    .seagull:nth-child(1) {
      left: 0;
      animation-delay: 0s;
    }

    .seagull:nth-child(2) {
      left: 60px;
      animation-delay: 1s;
      transform: scaleX(-1);
    }

    @keyframes seagull-fight {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      25% { transform: translateX(-10px) rotate(-15deg); }
      75% { transform: translateX(10px) rotate(15deg); }
    }

    /* Chichi au sol */
    .chichi {
      position: fixed;
      bottom: 25%;
      left: 20%;
      font-size: 32px;
      z-index: 0;
      animation: wiggle 3s ease-in-out infinite;
      filter: drop-shadow(2px 2px 4px rgba(0, 0, 0, 0.3));
    }

    @keyframes wiggle {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
    }

    /* Conteneurs empilés de travers */
    .containers {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 200px;
      z-index: 0;
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      padding: 0 20px;
    }

    .container-stack {
      display: flex;
      flex-direction: column-reverse;
      gap: 4px;
      position: relative;
    }

    .container-box {
      width: 70px;
      height: 45px;
      background: var(--color);
      border: 3px solid rgba(0, 0, 0, 0.3);
      border-radius: 4px;
      position: relative;
      box-shadow: 
        inset 0 2px 0 rgba(255, 255, 255, 0.3),
        inset 0 -2px 0 rgba(0, 0, 0, 0.3),
        4px 4px 12px rgba(0, 0, 0, 0.4);
      transform: rotate(var(--rotation));
    }

    .container-box::after {
      content: '🚢';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 20px;
      opacity: 0.4;
    }

    /* UI Container */
    .ui-container {
      position: relative;
      z-index: 10;
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
      padding-bottom: 120px;
    }

    /* Logo dégueu */
    .header {
      text-align: center;
      padding: 20px 0 30px;
      animation: wiggle 4s ease-in-out infinite;
    }

    .logo {
      font-family: 'Bangers', cursive;
      font-size: 52px;
      color: #2d3436;
      text-shadow: 
        3px 3px 0 #fdcb6e,
        6px 6px 0 #e17055,
        9px 9px 12px rgba(0, 0, 0, 0.4);
      letter-spacing: 2px;
      transform: rotate(-2deg);
    }

    .subtitle {
      font-family: 'Permanent Marker', cursive;
      font-size: 16px;
      color: #2d3436;
      margin-top: 8px;
      transform: rotate(1deg);
    }

    /* Stats en caisse de poisson */
    .stats-crate {
      background: #8b4513;
      border: 4px solid #654321;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: 
        inset 0 2px 0 rgba(255, 255, 255, 0.2),
        inset 0 -2px 0 rgba(0, 0, 0, 0.4),
        0 8px 16px rgba(0, 0, 0, 0.3);
      position: relative;
      transform: rotate(-1deg);
      animation: crate-wobble 6s ease-in-out infinite;
    }

    @keyframes crate-wobble {
      0%, 100% { transform: rotate(-1deg); }
      50% { transform: rotate(1deg); }
    }

    /* Planches de bois */
    .stats-crate::before {
      content: '';
      position: absolute;
      inset: 8px;
      border: 2px dashed rgba(255, 255, 255, 0.2);
      pointer-events: none;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .stat {
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      padding: 12px 8px;
      border-radius: 8px;
      border: 2px solid rgba(0, 0, 0, 0.2);
    }

    .stat-icon {
      font-size: 32px;
      margin-bottom: 6px;
      animation: bounce-stat 2s ease-in-out infinite;
    }

    .stat:nth-child(1) .stat-icon { animation-delay: 0s; }
    .stat:nth-child(2) .stat-icon { animation-delay: 0.3s; }
    .stat:nth-child(3) .stat-icon { animation-delay: 0.6s; }

    @keyframes bounce-stat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .stat-value {
      font-family: 'Bangers', cursive;
      font-size: 22px;
      color: #ffeaa7;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 12px;
      color: #dfe6e9;
      font-weight: 700;
      text-transform: uppercase;
    }

    /* Boutons en palette bois */
    .menu-buttons {
      display: grid;
      gap: 16px;
    }

    .wood-btn {
      background: linear-gradient(135deg, #8b4513 0%, #654321 100%);
      border: 4px solid #654321;
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      position: relative;
      box-shadow: 
        inset 0 2px 0 rgba(255, 255, 255, 0.2),
        inset 0 -2px 0 rgba(0, 0, 0, 0.4),
        0 6px 16px rgba(0, 0, 0, 0.3);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 16px;
      animation: btn-wiggle 4s ease-in-out infinite;
      transform-origin: center;
    }

    .wood-btn:nth-child(1) { animation-delay: 0s; }
    .wood-btn:nth-child(2) { animation-delay: 0.5s; }
    .wood-btn:nth-child(3) { animation-delay: 1s; }
    .wood-btn:nth-child(4) { animation-delay: 1.5s; }
    .wood-btn:nth-child(5) { animation-delay: 2s; }

    @keyframes btn-wiggle {
      0%, 100% { transform: rotate(-1deg); }
      50% { transform: rotate(1deg); }
    }

    .wood-btn:active {
      transform: scale(0.95) rotate(0deg);
      box-shadow: 
        inset 0 4px 8px rgba(0, 0, 0, 0.4),
        0 2px 8px rgba(0, 0, 0, 0.3);
    }

    /* Texture bois */
    .wood-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        90deg,
        transparent,
        transparent 10px,
        rgba(0, 0, 0, 0.1) 10px,
        rgba(0, 0, 0, 0.1) 11px
      );
      pointer-events: none;
      border-radius: 8px;
    }

    .btn-icon {
      width: 60px;
      height: 60px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      border: 2px solid rgba(0, 0, 0, 0.2);
      flex-shrink: 0;
      box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.3);
    }

    .btn-content {
      flex: 1;
    }

    .btn-title {
      font-family: 'Permanent Marker', cursive;
      font-size: 20px;
      color: #ffeaa7;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
      margin-bottom: 4px;
    }

    .btn-desc {
      font-size: 13px;
      color: #dfe6e9;
      font-weight: 600;
    }

    /* Badge crado */
    .btn-badge {
      position: absolute;
      top: -8px;
      right: -8px;
      background: #e74c3c;
      color: white;
      font-family: 'Bangers', cursive;
      font-size: 14px;
      padding: 4px 12px;
      border-radius: 20px;
      border: 3px solid #c0392b;
      transform: rotate(15deg);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
    }

    /* Bottom nav en caisse pourrie */
    .bottom-nav {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) rotate(-1deg);
      background: #8b4513;
      border: 4px solid #654321;
      border-radius: 20px;
      padding: 12px;
      display: flex;
      gap: 8px;
      box-shadow: 
        inset 0 2px 0 rgba(255, 255, 255, 0.2),
        0 8px 24px rgba(0, 0, 0, 0.4);
      z-index: 100;
      animation: nav-wiggle 5s ease-in-out infinite;
    }

    @keyframes nav-wiggle {
      0%, 100% { transform: translateX(-50%) rotate(-1deg); }
      50% { transform: translateX(-50%) rotate(1deg); }
    }

    .nav-btn {
      width: 56px;
      height: 56px;
      background: rgba(255, 255, 255, 0.15);
      border: 3px solid rgba(0, 0, 0, 0.3);
      border-radius: 16px;
      font-size: 28px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.2);
    }

    .nav-btn:active {
      transform: scale(0.9);
      box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.4);
    }

    .nav-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      background: #e74c3c;
      color: white;
      font-size: 10px;
      font-weight: 900;
      padding: 3px 6px;
      border-radius: 10px;
      border: 2px solid #c0392b;
      font-family: 'Bangers', cursive;
    }

    /* Responsive */
    @media (max-width: 400px) {
      .logo {
        font-size: 42px;
      }

      .seagulls {
        left: 5%;
        top: 15%;
      }

      .seagull {
        font-size: 36px;
      }
    }
  </style>
</head>
<body>
  <!-- Fumée cargo -->
  <div class="smoke">
    <div class="smoke-cloud"></div>
    <div class="smoke-cloud"></div>
    <div class="smoke-cloud"></div>
  </div>

  <!-- Mouettes qui se battent -->
  <div class="seagulls">
    <div class="seagull">🐦</div>
    <div class="seagull">🐦</div>
  </div>

  <!-- Chichi par terre -->
  <div class="chichi">🥖</div>

  <!-- Conteneurs bancals -->
  <div class="containers">
    <div class="container-stack">
      <div class="container-box" style="--color: #e74c3c; --rotation: -3deg;"></div>
      <div class="container-box" style="--color: #3498db; --rotation: 2deg;"></div>
      <div class="container-box" style="--color: #f39c12; --rotation: -1deg;"></div>
    </div>
    <div class="container-stack">
      <div class="container-box" style="--color: #2ecc71; --rotation: 4deg;"></div>
      <div class="container-box" style="--color: #e74c3c; --rotation: -2deg;"></div>
    </div>
    <div class="container-stack">
      <div class="container-box" style="--color: #9b59b6; --rotation: 1deg;"></div>
      <div class="container-box" style="--color: #f39c12; --rotation: -4deg;"></div>
      <div class="container-box" style="--color: #3498db; --rotation: 2deg;"></div>
    </div>
  </div>

  <!-- UI -->
  <div class="ui-container">
    <!-- Header -->
    <div class="header">
      <div class="logo">BATTLE DOCK</div>
      <div class="subtitle">⚓ Le Port Chelou ⚓</div>
    </div>

    <!-- Stats caisse -->
    <div class="stats-crate">
      <div class="stats-grid">
        <div class="stat">
          <div class="stat-icon">💰</div>
          <div class="stat-value" id="moneyDisplay">0€</div>
          <div class="stat-label">Thunes</div>
        </div>
        <div class="stat">
          <div class="stat-icon">⭐</div>
          <div class="stat-value" id="levelDisplay">1</div>
          <div class="stat-label">Niveau</div>
        </div>
        <div class="stat">
          <div class="stat-icon">🏆</div>
          <div class="stat-value" id="xpDisplay">0</div>
          <div class="stat-label">XP</div>
        </div>
      </div>
    </div>

    <!-- Menu palettes bois -->
    <div class="menu-buttons">
      <div class="wood-btn" onclick="window.location.href='travailler.html'">
        <div class="btn-icon">💼</div>
        <div class="btn-content">
          <div class="btn-title">Bosser</div>
          <div class="btn-desc">Déplace des caisses</div>
        </div>
      </div>

      <div class="wood-btn" onclick="window.location.href='jeux.html'">
        <div class="btn-icon">🎰</div>
        <div class="btn-content">
          <div class="btn-title">Mini-Jeux</div>
          <div class="btn-desc">Tente ta chance</div>
        </div>
        <div class="btn-badge">HOT</div>
      </div>

      <div class="wood-btn" onclick="window.location.href='shop.html'">
        <div class="btn-icon">👽</div>
        <div class="btn-content">
          <div class="btn-title">Boutique Ferretti</div>
          <div class="btn-desc">Trucs bizarres</div>
        </div>
      </div>

      <div class="wood-btn" onclick="window.location.href='progression.html'">
        <div class="btn-icon">📊</div>
        <div class="btn-content">
          <div class="btn-title">Progression</div>
          <div class="btn-desc">Tes objectifs</div>
        </div>
      </div>

      <div class="wood-btn" onclick="window.location.href='classement.html'">
        <div class="btn-icon">🏅</div>
        <div class="btn-content">
          <div class="btn-title">Classement</div>
          <div class="btn-desc">Les meilleurs</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom nav -->
  <div class="bottom-nav">
    <button class="nav-btn" onclick="window.location.href='profil.html'">👤</button>
    <button class="nav-btn" onclick="window.location.href='jeux.html'">
      🎮
      <span class="nav-badge">NEW</span>
    </button>
    <button class="nav-btn" onclick="window.location.href='shop.html'">🛒</button>
    <button class="nav-btn" onclick="window.location.href='parametres.html'">⚙️</button>
  </div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const supabaseClient = createClient(supabaseUrl, supabaseKey);

    const userId = localStorage.getItem('userId');
    if (!userId) window.location.href = 'index.html';

    loadUserData();

    async function loadUserData() {
      try {
        const { data } = await supabaseClient
          .from('game_progress')
          .select('money, level, xp')
          .eq('user_id', userId)
          .single();

        if (data) {
          document.getElementById('moneyDisplay').textContent = formatNumber(data.money || 0) + '€';
          document.getElementById('levelDisplay').textContent = data.level || 1;
          document.getElementById('xpDisplay').textContent = formatNumber(data.xp || 0);
        }
      } catch (err) {
        console.error('Erreur:', err);
      }
    }

    function formatNumber(num) {
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
      return num.toString();
    }
  </script>
</body>
</html>
