<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Header — Battle Dock</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { font-family:'Inter',sans-serif; background:#efefef; min-height:100vh; }

    /* SKELETON */
    @keyframes skShimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
    .skeleton-card {
      background:#fff; padding:16px; box-sizing:border-box;
    }
    .sk {
      border-radius:8px;
      background:linear-gradient(90deg,#e8e8ed 25%,#f3f3f6 50%,#e8e8ed 75%);
      background-size:200% 100%; animation:skShimmer 1.4s ease-in-out infinite;
    }
    .sk-row { display:flex; align-items:center; gap:12px; }
    .sk-avatar { width:54px; height:54px; border-radius:50%; flex-shrink:0; }
    .sk-line { height:12px; }

    /* PROFILE CARD */
    .profile-card-btn {
      background:white; padding:16px;
      display:flex; flex-direction:column; gap:12px; box-sizing:border-box;
    }
    .profile-card-btn.themed .pcb-name,
    .profile-card-btn.themed .pcb-grade,
    .profile-card-btn.themed .pcb-level-num,
    .profile-card-btn.themed .pcb-level-lbl,
    .profile-card-btn.themed .pcb-xp-label { color:#fff !important; }
    .profile-card-btn.themed .pcb-grade { color:#fde68a !important; }
    .profile-card-btn.themed .pcb-xp-track { background:rgba(255,255,255,0.2) !important; }

    .pcb-row { display:flex; align-items:center; gap:14px; }
    .pcb-avatar { width:54px; height:54px; border-radius:50%; overflow:hidden; flex-shrink:0; border:2px solid #e5e7eb; }
    .pcb-avatar img { width:100%; height:100%; object-fit:cover; }
    .pcb-info { flex:1; min-width:0; }
    .pcb-name { font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:1.5px; color:#1a1a1a; line-height:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .pcb-grade { font-size:11px; color:#b8962e; font-weight:700; margin-top:3px; }
    .pcb-level-wrap { text-align:center; flex-shrink:0; }
    .pcb-level-num { font-family:'Bebas Neue',sans-serif; font-size:30px; color:#1a1a1a; line-height:1; }
    .pcb-level-lbl { font-size:9px; color:#9ca3af; text-transform:uppercase; letter-spacing:1px; font-weight:700; }
    .pcb-xp-label { display:flex; justify-content:space-between; font-size:10px; color:#9ca3af; margin-bottom:4px; font-weight:600; }
    .pcb-xp-track { height:3px; background:#f3f4f6; border-radius:2px; overflow:hidden; }
    .pcb-xp-fill  { height:100%; background:linear-gradient(90deg,#b8962e,#d4af37,#f5d060); border-radius:2px; transition:width 0.5s ease; }

    /* HEADER FIXE */
    .profile-header {
      position:fixed; top:0; left:50%; transform:translateX(-50%);
      width:100%; max-width:600px; z-index:200;
      background:#fff;
      border-bottom:1px solid rgba(15,23,42,0.08);
      box-shadow:0 2px 16px rgba(15,23,42,0.07);
    }
    .profile-header .skeleton-card,
    .profile-header .profile-card-btn {
      min-height:119px; border:none !important; border-radius:0 !important;
      margin:0 !important; box-shadow:none !important;
    }

    /* BANDEAU MAJ */
    .bandeau-maj {
      position:fixed; top:119px; left:50%; transform:translateX(-50%);
      width:100%; max-width:600px; z-index:199;
      background:#1a1a1a; border-bottom:1px solid rgba(255,255,255,0.08);
      padding:9px 16px; display:flex; align-items:center; gap:10px;
    }

    /* CONTENU PAGE */
    .page-content {
      max-width:600px; margin:0 auto;
      padding-top: calc(119px + 38px + 20px);
      padding-left:16px; padding-right:16px;
    }
    .placeholder-block {
      background:white; border-radius:12px; height:120px;
      margin-bottom:12px; border:1px solid #e5e7eb;
      display:flex; align-items:center; justify-content:center;
      font-size:12px; color:#9ca3af; font-weight:600; letter-spacing:1px;
    }
  </style>
</head>
<body>

  <header class="profile-header">
    <div class="skeleton-card" id="profileSkeleton">
      <div class="sk-row">
        <div class="sk sk-avatar"></div>
        <div style="flex:1">
          <div class="sk sk-line" style="width:55%"></div>
          <div class="sk sk-line" style="width:35%;margin-top:8px;height:10px"></div>
        </div>
        <div class="sk" style="width:34px;height:34px;border-radius:10px"></div>
      </div>
      <div class="sk sk-line" style="width:100%;height:8px;margin-top:16px"></div>
    </div>

    <div class="profile-card-btn" id="profileCardBtn" style="display:none">
      <div class="pcb-row">
        <div class="pcb-avatar"><img src="avatar-default.png" id="avatarImage" alt="avatar"></div>
        <div class="pcb-info">
          <div class="pcb-name" id="playerName">...</div>
          <div class="pcb-grade" id="playerGrade">...</div>
        </div>
        <div class="pcb-level-wrap">
          <div class="pcb-level-num" id="currentLevel">1</div>
          <div class="pcb-level-lbl">Niv.</div>
        </div>
      </div>
      <div>
        <div class="pcb-xp-label">
          <span id="xpCounter">0 / 500 XP</span>
          <span>→ Niv. <span id="nextLevel">2</span></span>
        </div>
        <div class="pcb-xp-track"><div class="pcb-xp-fill" id="xpFill" style="width:0%"></div></div>
      </div>
    </div>
  </header>

  <div class="bandeau-maj">
    <div style="font-size:13px;flex-shrink:0">🔧</div>
    <div style="flex:1">
      <span style="font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;color:#fbbf24">MISE À JOUR 1.2 EN COURS</span>
      <span style="font-size:11px;color:rgba(255,255,255,0.35);margin-left:8px">Merci de ne pas tenir compte de l'état actuel de la disposition du jeu.</span>
    </div>
  </div>

  <div class="page-content">
    <div class="placeholder-block">CONTENU DU JEU</div>
    <div class="placeholder-block">CONTENU DU JEU</div>
    <div class="placeholder-block">CONTENU DU JEU</div>
  </div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const sb = supabase.createClient(supabaseUrl, supabaseKey);

    function getXpRequired(level) {
      if (level <= 10) return level * 500;
      if (level <= 25) return level * 1000;
      if (level <= 50) return level * 2000;
      return level * 4000;
    }

    function getGrade(level) {
      if (level <= 4)  return 'Docker Occasionnel';
      if (level <= 14) return 'Docker';
      if (level <= 29) return 'Docker Mensuel';
      if (level <= 49) return 'Contre-Maître';
      if (level <= 79) return 'Chef de Quai';
      return 'Magnat du Port';
    }

    function avatarForLevel(lvl) {
      if (lvl >= 50) return 'avatar-level-50.png';
      if (lvl >= 30) return 'avatar-level-30.png';
      if (lvl >= 20) return 'avatar-level-20.png';
      if (lvl >= 17) return 'avatar-level-17.png';
      if (lvl >= 15) return 'avatar-level-15.png';
      if (lvl >= 13) return 'avatar-level-13.png';
      if (lvl >= 10) return 'avatar-level-10.png';
      if (lvl >= 5)  return 'avatar-level-5.png';
      if (lvl >= 4)  return 'avatar-level-4.png';
      if (lvl >= 3)  return 'avatar-level-3.png';
      if (lvl >= 2)  return 'avatar-level-2.png';
      return 'avatar-default.png';
    }

    const PROFILE_THEMES = {
      'rouge_navy':     'linear-gradient(135deg,#cc1a1a,#0f172a)',
      'bleu_mer':       'linear-gradient(160deg,#0c4a6e,#0369a1,#0ea5e9)',
      'noir':           'linear-gradient(135deg,#18181b,#3f3f46)',
      'night':          'linear-gradient(135deg,#0f172a,#334155)',
      'ciment':         'linear-gradient(135deg,#78716c,#a8a29e,#e7e5e4)',
      'carbone':        'linear-gradient(135deg,#1c1917,#292524,#44403c)',
      'gold':           'linear-gradient(135deg,#b45309,#f59e0b)',
      'emerald':        'linear-gradient(135deg,#047857,#10b981)',
      'purple':         'linear-gradient(135deg,#6d28d9,#a855f7)',
      'coral':          'linear-gradient(135deg,#be123c,#fb7185)',
      'or_navy':        'linear-gradient(135deg,#78350f,#fbbf24,#0f172a)',
      'abysses':        'linear-gradient(135deg,#0f2027,#203a43,#2c5364)',
      'turquoise':      'linear-gradient(135deg,#134e4a,#0d9488,#5eead4)',
      'indigo':         'linear-gradient(160deg,#1e1b4b,#4338ca,#818cf8)',
      'marseille_nuit': 'linear-gradient(135deg,#0f172a,#1e3a5f,#0ea5e9)',
      'feu_docker':     'linear-gradient(160deg,#7f1d1d,#dc2626,#fbbf24)',
      'port_tropical':  'linear-gradient(135deg,#064e3b,#065f46,#d97706)',
      'sang_requin':    'linear-gradient(135deg,#450a0a,#991b1b,#cc1a1a)',
      'sunset':         'linear-gradient(135deg,#f59e0b,#ef4444,#7c3aed)',
      'neon_rouge':     'linear-gradient(160deg,#1a1a2e,#16213e,#e94560)',
      'arc_en_ciel':    'conic-gradient(from 180deg at 50% 50%,#cc1a1a,#fbbf24,#10b981,#0ea5e9,#a855f7,#cc1a1a)',
    };

    function showError() {
      const sk = document.getElementById('profileSkeleton');
      sk.innerHTML = `
        <div style="display:flex;align-items:center;gap:12px;padding:4px 0">
          <div style="font-size:22px">⚠️</div>
          <div style="flex:1">
            <div style="font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:1px;color:#1a1a1a">Erreur de connexion</div>
            <div style="font-size:11px;color:#9ca3af;margin-top:2px">Vérifie ta connexion internet</div>
          </div>
          <button onclick="location.reload()" style="font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;padding:8px 14px;border:none;border-radius:8px;background:#1a1a1a;color:#fbbf24;cursor:pointer">Réessayer</button>
        </div>`;
    }

    async function init() {
      try {
        const { data: { session } } = await sb.auth.getSession();
        if (!session) { window.location.href = 'index.html'; return; }

        const uid = session.user.id;

        const [profileRes, statsRes] = await Promise.all([
          sb.from('profiles').select('username,avatar_url,background_color').eq('user_id', uid).maybeSingle(),
          sb.from('game_stats').select('level,xp').eq('user_id', uid).maybeSingle()
        ]);

        const profile = profileRes.data;
        const stats   = statsRes.data;
        if (!profile || !stats) { showError(); return; }

        // Recalcul niveau réel + sauvegarde si changement
        let lvl = stats.level || 1;
        let xp  = stats.xp || 0;
        const startLvl = lvl;
        while (xp >= getXpRequired(lvl)) { xp -= getXpRequired(lvl); lvl++; }
        if (lvl !== startLvl) {
          await sb.from('game_stats').update({ level: lvl, xp }).eq('user_id', uid);
        }

        const xpNeeded = getXpRequired(lvl);
        const pct = Math.min((xp / xpNeeded) * 100, 100);

        // Avatar + sync en base si désynchronisé
        const SPECIAL = ['avatar-millionaire.png','avatar-completionist.png'];
        const autoAvatar = avatarForLevel(lvl);
        const avatarSrc = SPECIAL.includes(profile.avatar_url) ? profile.avatar_url : autoAvatar;
        document.getElementById('avatarImage').src = avatarSrc;
        if (!SPECIAL.includes(profile.avatar_url) && profile.avatar_url !== autoAvatar) {
          await sb.from('profiles').update({ avatar_url: autoAvatar }).eq('user_id', uid);
        }

        // Thème carte
        const card = document.getElementById('profileCardBtn');
        const grad = PROFILE_THEMES[profile.background_color];
        if (grad) { card.style.background = grad; card.classList.add('themed'); }

        // Clic → profil.html
        card.style.cursor = 'pointer';
        card.onclick = () => window.location.href = 'profil.html';

        // Remplissage
        document.getElementById('playerName').textContent   = profile.username;
        document.getElementById('playerGrade').textContent  = getGrade(lvl);
        document.getElementById('currentLevel').textContent = lvl;
        document.getElementById('nextLevel').textContent    = lvl + 1;
        document.getElementById('xpCounter').textContent    = `${xp} / ${xpNeeded} XP`;
        document.getElementById('xpFill').style.width       = pct + '%';

        // Afficher
        document.getElementById('profileSkeleton').style.display = 'none';
        card.style.display = 'flex';

      } catch(e) {
        console.error('init error:', e);
        showError();
      }
    }

    init();
  </script>
</body>
</html>
