<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Battle Dock</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #ffffff;
      min-height: 100vh;
    }

    /* TOPBAR */
    .topbar {
      background: linear-gradient(135deg, #1e3a8a, #3b82f6);
      padding: 16px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .avatar {
      width: 60px;
      height: 60px;
      background: rgba(255, 255, 255, 0.2);
      border: 3px solid rgba(255, 255, 255, 0.5);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      flex-shrink: 0;
    }

    .player-info {
      flex: 1;
      min-width: 0;
    }

    .player-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 1px;
      color: white;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-grade {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.85);
      font-weight: 600;
      margin-top: 2px;
    }

    .player-level {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.75);
      margin-top: 2px;
    }

    .xp-bar {
      width: 100%;
      height: 6px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 6px;
    }

    .xp-fill {
      height: 100%;
      background: linear-gradient(90deg, #fbbf24, #f59e0b);
      border-radius: 3px;
      transition: width 0.5s ease;
    }

    .money {
      text-align: right;
      flex-shrink: 0;
    }

    .money-amount {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      letter-spacing: 1px;
      color: #fbbf24;
      line-height: 1;
    }

    .money-label {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 2px;
    }

    /* CONTAINER */
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }
  </style>
</head>
<body>
  <!-- TOPBAR -->
  <div class="topbar">
    <div class="avatar" id="avatar">⚓</div>
    <div class="player-info">
      <div class="player-name" id="playerName">Docker</div>
      <div class="player-grade" id="playerGrade">Docker Occasionnel</div>
      <div class="player-level" id="playerLevel">Niveau 1</div>
      <div class="xp-bar">
        <div class="xp-fill" id="xpFill" style="width: 0%"></div>
      </div>
    </div>
    <div class="money">
      <div class="money-amount"><span id="moneyAmount">100</span>€</div>
      <div class="money-label">Budget</div>
    </div>
  </div>

  <!-- CONTAINER -->
  <div class="container">
    <!-- Page vide pour l'instant -->
  </div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const supabaseClient = createClient(supabaseUrl, supabaseKey);

    const userId = localStorage.getItem('userId');
    const username = localStorage.getItem('username');

    if (!userId) {
      window.location.href = 'index.html';
    }

    // Chargement des données
    loadPlayerData();

    async function loadPlayerData() {
      const { data: progressArray } = await supabaseClient
        .from('game_progress')
        .select('*')
        .eq('user_id', userId);

      const { data: profileArray } = await supabaseClient
        .from('profiles')
        .select('*')
        .eq('user_id', userId);

      if (progressArray && progressArray[0] && profileArray && profileArray[0]) {
        const progress = progressArray[0];
        const profile = profileArray[0];

        // Avatar
        document.getElementById('avatar').textContent = profile.avatar_url || '⚓';

        // Nom
        document.getElementById('playerName').textContent = profile.username || username;

        // Grade
        document.getElementById('playerGrade').textContent = progress.rank || 'Docker Occasionnel';

        // Niveau
        document.getElementById('playerLevel').textContent = `Niveau ${progress.level || 1}`;

        // Argent
        document.getElementById('moneyAmount').textContent = (progress.money || 100).toLocaleString('fr-FR');

        // XP Bar
        const currentXP = progress.xp || 0;
        const requiredXP = Math.round(1000 * Math.pow(1.1, (progress.level || 1) - 1));
        const xpPercent = (currentXP / requiredXP) * 100;
        document.getElementById('xpFill').style.width = xpPercent + '%';
      }
    }
  </script>
</body>
</html>
