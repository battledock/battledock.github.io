<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Battle Dock - Jeu</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Space+Grotesk:wght@500;700;900&family=Bungee&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  
  <style>
    :root {
      --port-dark: #0f172a;
      --comic-yellow: #facc15;
      --comic-red: #ef4444;
      --comic-green: #22c55e;
      --comic-blue: #3b82f6;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 50%, #3b82f6 100%);
      min-height: 100vh;
      padding: 0;
      padding-top: 68px;
      overflow-x: hidden;
    }

    .game-container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 0 12px 20px 12px;
    }

    /* HEADER STICKY */
    .player-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      border-bottom: 3px solid #000;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .avatar-container {
      width: 46px;
      height: 46px;
      border: 3px solid #000;
      border-radius: 10px;
      overflow: hidden;
      background: white;
      flex-shrink: 0;
      box-shadow: 0 2px 0 rgba(0,0,0,0.1);
    }

    .avatar-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .player-main-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .player-username {
      font-family: 'Bangers', cursive;
      font-size: 15px;
      color: var(--port-dark);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1;
    }

    .player-stats-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .player-money {
      font-family: 'Bungee', sans-serif;
      font-size: 11px;
      color: var(--comic-green);
      line-height: 1;
    }

    .player-level {
      font-family: 'Bungee', sans-serif;
      font-size: 9px;
      color: var(--comic-blue);
      background: rgba(59, 130, 246, 0.1);
      padding: 3px 6px;
      border-radius: 5px;
      border: 2px solid var(--comic-blue);
      line-height: 1;
    }

    .player-grade-badge {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 8px;
      color: #64748b;
      font-weight: 900;
      text-transform: uppercase;
      text-align: right;
      line-height: 1.2;
      max-width: 80px;
      flex-shrink: 0;
    }

    /* COUNTDOWN */
    .countdown-banner {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      border: 3px solid #000;
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 12px;
      box-shadow: 0 4px 0 rgba(0,0,0,0.2);
    }

    .countdown-text {
      font-family: 'Bungee', sans-serif;
      font-size: 11px;
      color: white;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-shadow: 1px 1px 0 #000;
      line-height: 1.3;
    }

    .countdown-timer {
      font-family: 'Bangers', cursive;
      font-size: 18px;
      color: var(--comic-yellow);
      text-align: center;
      margin-top: 4px;
      text-shadow: 2px 2px 0 #000;
      letter-spacing: 1px;
    }

    /* CARTE GRADE */
    .grade-card {
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      border: 3px solid #000;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 4px 0 rgba(0,0,0,0.15);
    }

    .grade-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .grade-title {
      font-family: 'Bangers', cursive;
      font-size: 20px;
      color: var(--port-dark);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .grade-level {
      font-family: 'Bungee', sans-serif;
      font-size: 16px;
      color: #3b82f6;
    }

    .grade-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: #475569;
      margin-bottom: 10px;
    }

    .progress-container {
      background: #cbd5e1;
      border: 3px solid #000;
      border-radius: 10px;
      height: 28px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar {
      background: linear-gradient(90deg, var(--comic-yellow) 0%, #fb923c 100%);
      height: 100%;
      transition: width 0.3s ease;
    }

    .progress-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Bungee', sans-serif;
      font-size: 11px;
      color: var(--port-dark);
      font-weight: 700;
      text-shadow: 1px 1px 0px #fff;
      z-index: 1;
    }

    /* BOUTON TRAVAILLER */
    .work-btn {
      width: 100%;
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      border: 3px solid #000;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 12px;
      cursor: pointer;
      box-shadow: 0 5px 0 #16a34a;
      transition: all 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .work-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #16a34a;
    }

    .work-btn-icon {
      font-size: 28px;
      line-height: 1;
    }

    .work-btn-main {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .work-btn-text {
      font-family: 'Bangers', cursive;
      font-size: 22px;
      color: white;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-shadow: 2px 2px 0 #000;
      line-height: 1;
    }

    .work-btn-subtitle {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
      color: rgba(255,255,255,0.9);
      font-weight: 600;
      line-height: 1;
    }

    /* BOUTON DÉCONNEXION */
    .logout-btn {
      background: var(--comic-red);
      color: white;
      border: 3px solid #000;
      border-radius: 12px;
      padding: 14px 20px;
      font-family: 'Bungee', sans-serif;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      cursor: pointer;
      box-shadow: 0 5px 0 #b91c1c;
      transition: all 0.1s ease;
      width: 100%;
    }

    .logout-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #b91c1c;
    }

    @media (max-width: 380px) {
      .player-username {
        font-size: 14px;
      }
      
      .player-grade-badge {
        font-size: 7px;
        max-width: 70px;
      }
    }
  </style>
</head>
<body>
  <!-- HEADER STICKY -->
  <div class="player-header">
    <div class="avatar-container">
      <img src="avatar-default.png" alt="Avatar" id="avatarImage">
    </div>
    <div class="player-main-info">
      <div class="player-username" id="playerUsername">...</div>
      <div class="player-stats-row">
        <div class="player-money" id="playerMoney">0 €</div>
        <div class="player-level" id="playerLevelBadge">Niv. 1</div>
      </div>
    </div>
    <div class="player-grade-badge" id="playerGradeBadge">Docker Occ.</div>
  </div>

  <div class="game-container">
    <!-- COUNTDOWN -->
    <div class="countdown-banner" id="countdownBanner">
      <div class="countdown-text">🚀 Lancement du jeu aujourd'hui à 20H00 !</div>
      <div class="countdown-timer" id="countdownTimer">--:--:--</div>
    </div>

    <!-- CARTE GRADE -->
    <div class="grade-card">
      <div class="grade-header">
        <div class="grade-title">GRADE</div>
        <div class="grade-level" id="playerLevel">Niv. 1</div>
      </div>
      <div class="grade-name" id="playerGrade">Docker Occasionnel</div>
      <div class="progress-container">
        <div class="progress-bar" id="progressBar" style="width: 0%"></div>
        <div class="progress-text" id="progressText">0 / 100 XP</div>
      </div>
    </div>

    <!-- BOUTON TRAVAILLER -->
    <button class="work-btn" onclick="startWorking()">
      <div class="work-btn-icon">💼</div>
      <div class="work-btn-main">
        <div class="work-btn-text">TRAVAILLER</div>
        <div class="work-btn-subtitle">Gagner des €</div>
      </div>
    </button>

    <!-- DÉCONNEXION -->
    <button class="logout-btn" onclick="logout()">DÉCONNEXION</button>
  </div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const sb = createClient(supabaseUrl, supabaseKey);

    let currentUser = null;

    async function loadProfile() {
      const { data: { session } } = await sb.auth.getSession();
      
      if (!session) {
        window.location.href = 'index.html';
        return;
      }

      currentUser = session.user;

      const { data: profile } = await sb
        .from('profiles')
        .select('username, avatar_url')
        .eq('user_id', currentUser.id)
        .single();

      if (profile) {
        document.getElementById('playerUsername').textContent = profile.username;
        document.getElementById('avatarImage').src = profile.avatar_url;
      }

      const { data: stats } = await sb
        .from('game_stats')
        .select('money, level, xp, grade')
        .eq('user_id', currentUser.id)
        .single();

      if (stats) {
        const xpNeeded = stats.level * 100;
        
        // Header sticky
        document.getElementById('playerMoney').textContent = stats.money + ' €';
        document.getElementById('playerLevelBadge').textContent = 'Niv. ' + stats.level;
        
        // Abbreviate grade for header
        const gradeShort = stats.grade
          .replace('Docker Occasionnel', 'Docker Occ.')
          .replace('Docker Mensuel', 'Docker M.')
          .replace('Chef d\'Équipe', 'Chef Éq.')
          .replace('Contremaître', 'Contremaître');
        document.getElementById('playerGradeBadge').textContent = gradeShort;
        
        // Carte grade
        updatePlayerStats({
          money: stats.money,
          level: stats.level,
          xp: stats.xp,
          xpNeeded: xpNeeded,
          grade: stats.grade
        });
      }
    }

    function updatePlayerStats(stats) {
      document.getElementById('playerLevel').textContent = 'Niv. ' + stats.level;
      document.getElementById('playerGrade').textContent = stats.grade;
      
      const progressPercent = Math.min((stats.xp / stats.xpNeeded) * 100, 100);
      document.getElementById('progressBar').style.width = progressPercent + '%';
      document.getElementById('progressText').textContent = stats.xp + ' / ' + stats.xpNeeded + ' XP';
    }

    async function logout() {
      await sb.auth.signOut();
      window.location.href = 'index.html';
    }

    function startWorking() {
      alert('Fonctionnalité à venir ! Les mini-jeux arrivent bientôt 🎮');
    }

    // COUNTDOWN
    function updateCountdown() {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 20, 0, 0);
      
      if (now > today) {
        const banner = document.getElementById('countdownBanner');
        if (banner) banner.style.display = 'none';
        return;
      }
      
      const diff = today - now;
      const hours = Math.floor(diff / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);
      
      const timerElement = document.getElementById('countdownTimer');
      if (timerElement) {
        timerElement.textContent = 
          String(hours).padStart(2, '0') + ':' + 
          String(minutes).padStart(2, '0') + ':' + 
          String(seconds).padStart(2, '0');
      }
    }
    
    updateCountdown();
    setInterval(updateCountdown, 1000);
    loadProfile();
  </script>
</body>
</html>
