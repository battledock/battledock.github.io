<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Battle Dock — Le Port</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  
  <style>
    :root {
      --ocean-deep: #0a1628;
      --ocean-mid: #1e3a5f;
      --ocean-light: #2d5a7b;
      --sand: #e8dcc4;
      --sand-dark: #c9b896;
      --gold: #d4af37;
      --gold-dark: #b8941f;
      --foam: #f4f1ea;
      --shadow: rgba(10, 22, 40, 0.15);
      --shadow-strong: rgba(10, 22, 40, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(165deg, #0a1628 0%, #1e3a5f 100%);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      color: var(--foam);
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(212, 175, 55, 0.03) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(244, 241, 234, 0.02) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 10;
      max-width: 480px;
      margin: 0 auto;
    }

    /* HEADER PROFIL */
    .profile-header {
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(10, 22, 40, 0.4);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(244, 241, 234, 0.08);
    }

    .profile-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .profile-avatar {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid rgba(212, 175, 55, 0.3);
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .profile-avatar:active {
      transform: scale(0.95);
      border-color: var(--gold);
    }

    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .profile-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .profile-username {
      font-size: 17px;
      font-weight: 700;
      color: var(--foam);
      letter-spacing: -0.3px;
    }

    .profile-rank {
      font-size: 12px;
      font-weight: 500;
      color: var(--sand);
      opacity: 0.7;
      letter-spacing: 0.3px;
    }

    .profile-money {
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      color: var(--ocean-deep);
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.25);
      letter-spacing: -0.3px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .profile-money:active {
      transform: scale(0.96);
      box-shadow: 0 2px 8px rgba(212, 175, 55, 0.3);
    }

    /* LOGO */
    .hero {
      padding: 40px 24px 32px;
      text-align: center;
      position: relative;
    }

    .logo-container {
      position: relative;
      display: inline-block;
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3.5rem, 10vw, 4.5rem);
      letter-spacing: 8px;
      background: linear-gradient(180deg, #ffffff 0%, var(--sand) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 0.9;
      position: relative;
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .subtitle {
      margin-top: 12px;
      font-size: 14px;
      font-weight: 500;
      color: var(--sand);
      opacity: 0.6;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* GRILLE ASYMÉTRIQUE */
    .content-grid {
      padding: 0 24px 80px;
      display: grid;
      gap: 16px;
    }

    .card {
      background: rgba(244, 241, 234, 0.03);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(244, 241, 234, 0.08);
      border-radius: 20px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.05) 0%, transparent 100%);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .card:active {
      transform: scale(0.98);
    }

    .card:hover::before {
      opacity: 1;
    }

    .card:hover {
      border-color: rgba(212, 175, 55, 0.3);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
    }

    /* CARD BOSSER - Large featured */
    .card-work {
      padding: 32px;
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.08) 0%, rgba(30, 58, 95, 0.2) 100%);
      border: 1px solid rgba(212, 175, 55, 0.15);
      position: relative;
      overflow: hidden;
    }

    .card-work::after {
      content: '💼';
      position: absolute;
      right: -20px;
      bottom: -20px;
      font-size: 120px;
      opacity: 0.08;
      pointer-events: none;
    }

    .card-work .tag {
      display: inline-block;
      padding: 6px 12px;
      background: rgba(212, 175, 55, 0.15);
      border-radius: 8px;
      font-size: 10px;
      font-weight: 700;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }

    .card-work .title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 48px;
      letter-spacing: 4px;
      color: var(--foam);
      line-height: 1;
      margin-bottom: 8px;
    }

    .card-work .description {
      font-size: 14px;
      color: var(--sand);
      opacity: 0.7;
      font-weight: 500;
    }

    /* CARD MINI-JEUX & BOUTIQUE - Double column */
    .cards-dual {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .card-mini {
      padding: 28px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      min-height: 180px;
      justify-content: center;
    }

    .card-mini .icon {
      font-size: 48px;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.1));
      animation: bounce 3s ease-in-out infinite;
    }

    .card-mini:nth-child(1) .icon { animation-delay: 0s; }
    .card-mini:nth-child(2) .icon { animation-delay: 0.5s; }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .card-mini .title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 2px;
      color: var(--foam);
    }

    .card-mini .description {
      font-size: 12px;
      color: var(--sand);
      opacity: 0.6;
      font-weight: 500;
    }

    .card-mini .badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: linear-gradient(135deg, #d946ef 0%, #a855f7 100%);
      color: white;
      font-size: 10px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 12px rgba(168, 85, 247, 0.3);
    }

    /* CARD PROGRESSION */
    .card-progress {
      padding: 28px;
      background: rgba(45, 90, 123, 0.15);
      border: 1px solid rgba(45, 90, 123, 0.2);
    }

    .card-progress .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .card-progress .title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      letter-spacing: 2px;
      color: var(--foam);
    }

    .card-progress .icon {
      font-size: 32px;
      opacity: 0.5;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: rgba(10, 22, 40, 0.5);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-fill {
      height: 100%;
      width: 30%;
      background: linear-gradient(90deg, var(--gold) 0%, var(--gold-dark) 100%);
      border-radius: 8px;
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.5);
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card-progress .description {
      font-size: 12px;
      color: var(--sand);
      opacity: 0.6;
      font-weight: 500;
    }

    /* CARD CLASSEMENT */
    .card-rank {
      padding: 28px;
      background: linear-gradient(135deg, rgba(30, 58, 95, 0.3) 0%, rgba(10, 22, 40, 0.2) 100%);
      border: 1px solid rgba(30, 58, 95, 0.3);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-rank .left .title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      letter-spacing: 2px;
      color: var(--foam);
      margin-bottom: 6px;
    }

    .card-rank .description {
      font-size: 12px;
      color: var(--sand);
      opacity: 0.6;
      font-weight: 500;
    }

    .card-rank .rank-number {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 64px;
      letter-spacing: 2px;
      background: linear-gradient(180deg, var(--gold) 0%, var(--gold-dark) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      opacity: 0.9;
    }

    /* ANIMATIONS D'ENTRÉE */
    .card {
      animation: slideUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) backwards;
    }

    .card:nth-child(1) { animation-delay: 0.1s; }
    .card:nth-child(2) { animation-delay: 0.2s; }
    .card:nth-child(3) { animation-delay: 0.3s; }
    .card:nth-child(4) { animation-delay: 0.4s; }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .profile-header {
      animation: fadeIn 0.8s ease backwards;
    }

    .hero {
      animation: fadeIn 1s ease backwards 0.2s;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (max-width: 400px) {
      .cards-dual {
        grid-template-columns: 1fr;
      }
      
      .card-work .title {
        font-size: 40px;
      }
      
      .card-rank .rank-number {
        font-size: 52px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="profile-header">
      <div class="profile-left">
        <div class="profile-avatar" id="profileAvatarBg">
          <img id="profileAvatarImg" src="notionists-1779298466584.png" alt="Avatar">
        </div>
        <div class="profile-info">
          <div class="profile-username" id="profileUsername">—</div>
          <div class="profile-rank" id="profileRank">Docker Occasionnel</div>
        </div>
      </div>
      <div class="profile-money" id="profileMoney">0 €</div>
    </div>

    <div class="hero">
      <div class="logo-container">
        <div class="logo">BATTLE DOCK</div>
      </div>
      <div class="subtitle">Le Port</div>
    </div>

    <div class="content-grid">

      <div class="card card-work" onclick="window.location.href='travailler.html'">
        <div class="tag">Mission du jour</div>
        <div class="title">BOSSER</div>
        <div class="description">Déplace des caisses · Gagne de l'argent</div>
      </div>

      <div class="cards-dual">
        <div class="card card-mini" onclick="window.location.href='jeux.html'">
          <div class="badge">HOT</div>
          <div class="icon">🎰</div>
          <div class="title">MINI-JEUX</div>
          <div class="description">Tente ta chance</div>
        </div>

        <div class="card card-mini" onclick="window.location.href='shop.html'">
          <div class="icon">🏪</div>
          <div class="title">BOUTIQUE</div>
          <div class="description">Ferretti & Co.</div>
        </div>
      </div>

      <div class="card card-progress" onclick="window.location.href='progression.html'">
        <div class="top">
          <div class="title">PROGRESSION</div>
          <div class="icon">📊</div>
        </div>
        <div class="progress-bar">
          <div class="progress-fill"></div>
        </div>
        <div class="description">Niveau 1 · 30% vers le prochain rang</div>
      </div>

      <div class="card card-rank" onclick="window.location.href='classement.html'">
        <div class="left">
          <div class="title">CLASSEMENT</div>
          <div class="description">Meilleurs dockers</div>
        </div>
        <div class="rank-number">#?</div>
      </div>

    </div>
  </div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const supabaseClient = createClient(supabaseUrl, supabaseKey);

    const userId = localStorage.getItem('userId');
    if (!userId) window.location.href = 'index.html';

    loadUserData();

    async function loadUserData() {
      try {
        const { data: profile } = await supabaseClient
          .from('profiles')
          .select('username, color, avatar')
          .eq('user_id', userId)
          .single();

        const { data: progress } = await supabaseClient
          .from('game_progress')
          .select('money, rank')
          .eq('user_id', userId)
          .single();

        if (profile) {
          document.getElementById('profileUsername').textContent = profile.username || localStorage.getItem('username') || '—';
          const color = profile.color || '#2d5a7b';
          document.getElementById('profileAvatarBg').style.backgroundColor = color;
          if (profile.avatar) document.getElementById('profileAvatarImg').src = profile.avatar;
          localStorage.setItem('userColor', color);
        }

        if (progress) {
          document.getElementById('profileRank').textContent = progress.rank || 'Docker Occasionnel';
          document.getElementById('profileMoney').textContent = formatNumber(progress.money || 0) + ' €';
        }
      } catch (err) {
        console.error('Erreur:', err);
      }
    }

    function formatNumber(num) {
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
      return num.toString();
    }
  </script>
</body>
</html>
