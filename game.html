<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>AA</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bangers&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none}
body{background:#f0f0f0;font-family:'Inter',sans-serif}
</style>
</head>
<body>

<div id="gameHeader">
  <!-- COVER -->
  <div style="background:linear-gradient(160deg,#0a0a0f,#1a0505,#0a1a0f);padding-top:env(safe-area-inset-top,0px);position:relative">
    <div style="height:160px;position:relative">
      <div style="position:absolute;bottom:-50px;left:50%;transform:translateX(-50%);width:100px;height:100px;border-radius:50%;border:4px solid rgba(255,255,255,.9);background:#111;display:flex;align-items:center;justify-content:center;font-size:52px;z-index:2">🐳</div>
    </div>
  </div>
  <!-- INFOS -->
  <div style="background:#fff;padding:60px 20px 20px;text-align:center">
    <div style="font-family:'Bangers',cursive;font-size:26px;color:#1a1a1a;letter-spacing:1.5px">ELIASSE</div>
    <div style="font-size:9px;font-weight:800;color:#9ca3af;letter-spacing:2px;margin-top:3px">CHEF DE QUAI · NV. 28</div>
    <div style="font-family:'Bebas Neue',sans-serif;font-size:24px;color:#1a1a1a;letter-spacing:1px;margin-top:12px">2 400 000 €</div>
    <div style="margin-top:12px;display:flex;align-items:center;gap:8px">
      <div style="flex:1;height:5px;background:#f3f4f6;border-radius:3px;overflow:hidden">
        <div style="height:100%;width:67%;background:linear-gradient(90deg,#1d4ed8,#60a5fa);border-radius:3px"></div>
      </div>
      <div style="font-size:8px;font-weight:700;color:#9ca3af;white-space:nowrap">330 XP</div>
    </div>
  </div>
</div>

</body>
