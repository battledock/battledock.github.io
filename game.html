<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Docker Life — Le Port</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@700;900&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <script src="fullscreen.js"></script>
  
  <style>
    :root {
      --pixel-bg: #4b8cc9;
      --pixel-dark: #1a233a;
      --pixel-border: #111625;
      --pixel-yellow: #f4b41b;
      --pixel-yellow-light: #fcd061;
      --pixel-green: #38b764;
      --pixel-blue: #3b5dc9;
      --pixel-ui-bg: #2c384e;
      --pixel-ui-inner: #3d4f6d;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      /* Style de rendu d'image rétro pour les avatars si pixelisés */
      image-rendering: pixelated;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--pixel-bg);
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 90px; /* Espace pour la barre de navigation basse */
    }

    .ui-container {
      max-width: 480px;
      margin: 0 auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* --- GÉANT HEADER FAÇON RPG MOBILE --- */
    .rpg-header {
      background: var(--pixel-ui-bg);
      border: 4px solid var(--pixel-border);
      box-shadow: inset -4px -4px 0px rgba(0,0,0,0.4), inset 4px 4px 0px rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 12px;
      display: grid;
      grid-template-columns: 1fr 120px;
      gap: 12px;
      align-items: center;
    }

    /* Profil gauche (Avatar + Pseudo + XP) */
    .profile-card {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--pixel-ui-inner);
      border: 3px solid var(--pixel-border);
      border-radius: 8px;
      padding: 8px;
    }

    .avatar-holder {
      width: 56px;
      height: 56px;
      background: #3A4750;
      border: 3px solid var(--pixel-border);
      border-radius: 6px;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: inset 2px 2px 0px rgba(0,0,0,0.5);
    }

    .avatar-holder img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-details {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .username-txt {
      font-size: 14px;
      font-weight: 900;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rank-txt {
      font-size: 10px;
      font-weight: 700;
      color: #a2b4dc;
      text-transform: uppercase;
    }

    /* Barre d'XP rétro */
    .xp-container {
      margin-top: 2px;
    }
    .xp-bar-bg {
      width: 100%;
      height: 8px;
      background: #151d2a;
      border: 2px solid var(--pixel-border);
      border-radius: 3px;
      overflow: hidden;
    }
    .xp-bar-fill {
      width: 45%;
      height: 100%;
      background: var(--pixel-green);
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.3);
    }

    /* Boîtes de valeurs à droite (Euros & Énergie) */
    .header-counters {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .counter-box {
      background: #1b2435;
      border: 3px solid var(--pixel-border);
      border-radius: 6px;
      padding: 4px 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
    }

    .counter-box.money { color: var(--pixel-yellow-light); }
    .counter-box.energy { color: #5bc0be; }

    .counter-icon {
      font-size: 12px;
    }

    /* --- DIALOGUE BULLE STYLE "DOCKER LIFE" --- */
    .welcome-bubble {
      background: #ffffff;
      color: #1a233a;
      border: 4px solid var(--pixel-border);
      border-radius: 12px;
      padding: 12px;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.3;
      position: relative;
      box-shadow: 0 4px 0px rgba(0,0,0,0.15);
    }

    /* --- BOUTONS PRINCIPAUX TYPE "PIXEL ACTIONS" --- */
    .pixel-btn-action {
      background: linear-gradient(180deg, #fcd061 0%, #f4b41b 100%);
      color: #1a233a;
      border: 4px solid var(--pixel-border);
      border-radius: 10px;
      padding: 14px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 18px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 5px 0px var(--pixel-border), inset 0 3px 0px rgba(255,255,255,0.4);
      transition: transform 0.05s, box-shadow 0.05s;
    }

    .pixel-btn-action:active {
      transform: translateY(5px);
      box-shadow: 0 0px 0px var(--pixel-border), inset 0 3px 0px rgba(255,255,255,0.2);
    }

    /* --- GRILLE DES CODES DE JEUX / SECTIONS --- */
    .pixel-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .pixel-card {
      background: var(--pixel-ui-bg);
      border: 4px solid var(--pixel-border);
      border-radius: 12px;
      padding: 14px 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-align: center;
      box-shadow: 0 4px 0px rgba(0,0,0,0.2), inset -3px -3px 0px rgba(0,0,0,0.3), inset 3px 3px 0px rgba(255,255,255,0.1);
      transition: transform 0.05s;
    }

    .pixel-card:active {
      transform: scale(0.97);
    }

    .pixel-card .icon {
      font-size: 32px;
      filter: drop-shadow(2px 2px 0px rgba(0,0,0,0.3));
    }

    .pixel-card .title {
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .pixel-card .sub {
      font-size: 10px;
      color: #a2b4dc;
      font-weight: 700;
    }

    /* Variantes de couleurs de cartes */
    .card-blue { background: linear-gradient(180deg, #4b6cc9 0%, #2b4596 100%); border-color: var(--pixel-border); }
    .card-green { background: linear-gradient(180deg, #44cb73 0%, #26964c 100%); border-color: var(--pixel-border); color: #fff; }
    .card-green .sub { color: #d1ffd6; }
    
    .card-orange { background: linear-gradient(180deg, #f39c12 0%, #d35400 100%); border-color: var(--pixel-border); }
    .card-orange .sub { color: #ffe3cc; }

    /* --- MENU DE NAVIGATION BAS (BOTTOM NAV BAR) --- */
    .bottom-navbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--pixel-dark);
      border-top: 4px solid var(--pixel-border);
      display: flex;
      justify-content: space-around;
      padding: 6px 4px calc(6px + env(safe-area-inset-bottom)) 4px;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      background: none;
      border: none;
      color: #8fa0c4;
      cursor: pointer;
      flex: 1;
    }

    .nav-item.active {
      color: var(--pixel-yellow-light);
    }

    .nav-icon {
      font-size: 22px;
    }

    .nav-label {
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="ui-container">
    
    <div class="rpg-header">
      <div class="profile-card">
        <div class="avatar-holder" id="profileAvatarBg">
          <img id="profileAvatarImg" src="notionists-1779298466584.png" alt="Avatar">
        </div>
        <div class="profile-details">
          <div class="username-txt" id="profileUsername">—</div>
          <div class="rank-txt" id="profileRank">Docker Niv.1</div>
          <div class="xp-container">
            <div class="xp-bar-bg"><div class="xp-bar-fill"></div></div>
          </div>
        </div>
      </div>
      
      <div class="header-counters">
        <div class="counter-box money">
          <span id="profileMoney">0K</span> <span class="counter-icon">🪙</span>
        </div>
        <div class="counter-box energy">
          <span>100</span> <span class="counter-icon">⚡</span>
        </div>
      </div>
    </div>

    <div class="welcome-bubble">
      🏗️ <strong>Bienvenue sur le Port !</strong> Prépare tes bras et viens déplacer les cargaisons pour obtenir tes premiers jetons.
    </div>

    <button class="pixel-btn-action" onclick="window.location.href='travailler.html'">
      👷 TRAVAILLER (Quart du Matin)
    </button>

    <div class="pixel-grid">
      
      <div class="pixel-card card-blue" onclick="window.location.href='jeux.html'">
        <div class="icon">🎰</div>
        <div class="title">Mini-Jeux</div>
        <div class="sub">Zone de Flambe</div>
      </div>

      <div class="pixel-card card-green" onclick="window.location.href='shop.html'">
        <div class="icon">🛒</div>
        <div class="title">Boutique</div>
        <div class="sub">Marché clandestin</div>
      </div>

      <div class="pixel-card" onclick="window.location.href='social.html'">
        <div class="icon">💒</div>
        <div class="title">Vie Privée</div>
        <div class="sub">Fonder un foyer</div>
      </div>

      <div class="pixel-card card-orange" onclick="window.location.href='home.html'">
        <div class="icon">🏠</div>
        <div class="title">Mon Toit</div>
        <div class="sub">Se reposer</div>
      </div>

    </div>

  </div>

  <nav class="bottom-navbar">
    <button class="nav-item active" onclick="window.location.href='game.html'">
      <span class="nav-icon">🏗️</span>
      <span class="nav-label">Accueil</span>
    </button>
    <button class="nav-item" onclick="window.location.href='progression.html'">
      <span class="nav-icon">📊</span>
      <span class="nav-label">Stats</span>
    </button>
    <button class="nav-item" onclick="window.location.href='classement.html'">
      <span class="nav-icon">🏆</span>
      <span class="nav-label">Classement</span>
    </button>
  </nav>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const supabaseClient = createClient(supabaseUrl, supabaseKey);

    const userId = localStorage.getItem('userId');
    if (!userId) window.location.href = 'index.html';

    loadUserData();

    async function loadUserData() {
      try {
        const { data: profile } = await supabaseClient
          .from('profiles')
          .select('username, color, avatar')
          .eq('user_id', userId)
          .single();

        const { data: progress } = await supabaseClient
          .from('game_progress')
          .select('money, rank')
          .eq('user_id', userId)
          .single();

        if (profile) {
          document.getElementById('profileUsername').textContent = profile.username || localStorage.getItem('username') || '—';
          const color = profile.color || '#3A4750';
          document.getElementById('profileAvatarBg').style.backgroundColor = color;
          if (profile.avatar) document.getElementById('profileAvatarImg').src = profile.avatar;
        }

        if (progress) {
          document.getElementById('profileRank').textContent = progress.rank || 'Docker Niv.1';
          document.getElementById('profileMoney').textContent = formatNumber(progress.money || 0);
        }
      } catch (err) {
        console.error('Erreur:', err);
      }
    }

    function formatNumber(num) {
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
      return num.toString();
    }
  </script>
</body>
</html>
