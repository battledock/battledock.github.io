<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battle Dock - Accueil du jeu</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <style>
    body {
      background-color: #0a0e14;
      color: #fff;
      font-family: 'Arial', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 20px;
      text-align: center;
      color: #f4b13c;
    }
    .container {
      text-align: center;
      max-width: 100%;
    }
    .logo {
      width: 120px;
      height: 120px;
      margin-bottom: 20px;
      font-size: 100px;
    }
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }
    .button {
      display: inline-block;
      padding: 12px 24px;
      background-color: #f4b13c;
      color: #0a0e14;
      text-decoration: none;
      font-size: 18px;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
      max-width: 300px;
      margin: 0 auto;
      font-weight: bold;
    }
    .button:hover {
      background-color: #d69b35;
    }
    .profile {
      margin-top: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .profile .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin-bottom: 10px;
      background-color: #1e2e40;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
      box-shadow: 0 0 10px rgba(244, 177, 60, 0.3);
    }
    .profile p {
      font-size: 18px;
      margin-bottom: 5px;
    }
    .logout {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">⚓</div>
    <h1>Bienvenue sur Battle Dock</h1>
    <div class="buttons">
      <a href="play.html" class="button">Jouer</a>
      <a href="leaderboard.html" class="button">Classement</a>
      <a href="shop.html" class="button">Boutique</a>
    </div>
    <div class="profile">
      <div class="avatar" id="avatar">👤</div>
      <p id="username"></p>
    </div>
    <div class="logout">
      <a href="#" class="button" id="logout">Déconnexion</a>
    </div>
  </div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const supabaseClient = createClient(supabaseUrl, supabaseKey);

    const userId = localStorage.getItem('userId');
    const username = localStorage.getItem('username');

    document.getElementById('username').textContent = username || 'Utilisateur';

    document.getElementById('logout').addEventListener('click', async () => {
      localStorage.removeItem('userId');
      localStorage.removeItem('username');
      await supabaseClient.auth.signOut();
      window.location.href = 'index.html';
    });

    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (!session) {
        window.location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
