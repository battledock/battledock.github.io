<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Battle Dock — Le Port Chelou</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Permanent+Marker&family=Space+Grotesk:wght@500;700;900&family=Bungee&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <script src="fullscreen.js"></script>
  
  <style>
    :root {
      --port-dark: #0f172a;
      --port-blue: #2563eb;
      --port-light-blue: #38bdf8;
      --comic-yellow: #facc15;
      --comic-red: #ef4444;
      --comic-green: #22c55e;
      --comic-purple: #a855f7;
      --paper-cream: #fefce8;
      --border-thick: 4px solid #000000;
      --shadow-comic: 6px 6px 0px #000000;
      --shadow-comic-sm: 3px 3px 0px #000000;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: #ef4444;
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 30px;
    }

    .ui-container {
      position: relative;
      z-index: 10;
      max-width: 540px;
      margin: 0 auto;
    }

    /* --- HEADER PROFIL --- */
    .profile-header {
      background: #0f172a;
      padding: 20px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 4px solid #000;
    }

    .profile-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .profile-avatar {
      width: 64px;
      height: 64px;
      border: 4px solid #000;
      border-radius: 14px;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: var(--shadow-comic-sm);
    }

    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .profile-username {
      font-family: 'Bungee', sans-serif;
      font-size: 18px;
      color: #ffffff;
      line-height: 1.1;
      margin-bottom: 4px;
    }

    .profile-rank {
      font-size: 12px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .profile-money {
      background: var(--comic-yellow);
      border: 4px solid #000;
      border-radius: 10px;
      padding: 8px 16px;
      font-family: 'Bungee', sans-serif;
      font-size: 18px;
      color: #000;
      box-shadow: 4px 4px 0 #000;
      transform: rotate(2deg);
    }

    /* --- SECTION 1 : LES JAUGES DE VIE (DIMINUÉES) --- */
    .stats-hub {
      background: var(--paper-cream);
      border-bottom: 4px solid #000;
      padding: 8px 16px; /* Diminué de 12px à 8px */
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .stat-box {
      background: #ffffff;
      padding: 4px 6px; /* Diminué pour être plus compact */
      border-radius: 10px;
      border: 3px solid #000;
      box-shadow: none; /* Ombrage supprimé ici */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .stat-icon {
      font-size: 18px; /* Légèrement diminué de 22px */
      margin-bottom: 1px;
    }

    .stat-value {
      font-family: 'Bungee', sans-serif;
      font-size: 11px; /* Légèrement diminué de 12px */
      color: var(--port-dark);
      text-align: center;
    }

    .stat-label {
      font-size: 8px; /* Légèrement diminué de 9px */
      color: #64748b;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* --- ZONE DE JEU / HUB VIVANT --- */
    .hub-content {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .section-title {
      font-family: 'Bangers', cursive;
      font-size: 24px;
      color: #fff;
      letter-spacing: 1px;
      text-shadow: 2px 2px 0px #000;
      text-transform: uppercase;
      margin-bottom: -4px;
    }

    /* --- CARD PRINCIPALE : LE QUAI (BOSSER) --- */
    .card-bosser {
      background: #0f172a;
      border: var(--border-thick);
      border-radius: 20px;
      padding: 24px 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-comic);
      position: relative;
      overflow: hidden;
      transition: transform 0.1s;
    }
    .card-bosser:active { transform: scale(0.98); }
    
    .card-bosser::after {
      content: '🏗️';
      position: absolute;
      right: 10px;
      bottom: -15px;
      font-size: 110px;
      opacity: 0.12;
      pointer-events: none;
    }

    .card-bosser .card-left { display: flex; flex-direction: column; gap: 4px; }
    
    .card-bosser .card-tag {
      font-family: 'Bungee', sans-serif;
      font-size: 11px;
      color: var(--comic-yellow);
      background: rgba(250, 204, 21, 0.15);
      padding: 2px 8px;
      border-radius: 6px;
      display: inline-block;
      align-self: flex-start;
    }
    
    .card-bosser .card-title {
      font-family: 'Bangers', cursive;
      font-size: 46px;
      color: #fff;
      line-height: 1;
      letter-spacing: 3px;
      text-shadow: 3px 3px 0px #000;
    }
    
    .card-bosser .card-sub {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 700;
    }
    
    .card-bosser .card-right {
      background: var(--comic-yellow);
      border: 3px solid #000;
      border-radius: 16px;
      width: 68px;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      box-shadow: var(--shadow-comic-sm);
      flex-shrink: 0;
      z-index: 2;
    }

    /* --- LA VILLE & LOISIRS (GRILLE DE CARDS) --- */
    .hub-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .grid-card {
      border: var(--border-thick);
      border-radius: 16px;
      padding: 16px;
      cursor: pointer;
      box-shadow: var(--shadow-comic);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 120px;
      position: relative;
      overflow: hidden;
      transition: transform 0.1s;
    }
    .grid-card:active { transform: scale(0.96); }

    .grid-card .card-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .grid-card .card-title {
      font-family: 'Bungee', sans-serif;
      font-size: 15px;
      line-height: 1.2;
      color: #000;
    }

    .grid-card .card-sub {
      font-size: 11px;
      font-weight: 700;
      opacity: 0.8;
      margin-top: 2px;
    }

    /* Déclinaisons de styles de la Grille */
    .card-jeux { background: #ffffff; }
    .card-jeux .card-title { color: var(--port-dark); }
    .card-jeux .card-sub { color: #64748b; }
    .card-jeux .hot-badge {
      position: absolute;
      top: 10px; right: -15px;
      background: var(--comic-red);
      color: #fff;
      font-family: 'Bangers', cursive;
      font-size: 13px;
      padding: 2px 16px;
      transform: rotate(30deg);
      border-bottom: 2px solid #000;
    }

    .card-shop { background: var(--comic-green); }
    .card-shop .card-title, .card-shop .card-sub { color: #000; }
    .card-shop::before {
      content: '📦';
      position: absolute;
      right: -10px; bottom: -10px;
      font-size: 60px;
      opacity: 0.15;
    }

    .card-social { background: var(--port-light-blue); }
    .card-social .card-title, .card-social .card-sub { color: #000; }
    .card-social::before {
      content: '💒';
      position: absolute;
      right: -10px; bottom: -10px;
      font-size: 60px;
      opacity: 0.15;
    }

    /* --- CLASSEMENT ET PROGRESSION --- */
    .meta-cards {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 12px;
    }

    .card-progression {
      background: var(--paper-cream);
      border: var(--border-thick);
      border-radius: 16px;
      padding: 12px 14px;
      box-shadow: var(--shadow-comic);
      cursor: pointer;
    }
    .card-progression .prog-top {
      display: flex;
      justify-content: space-between;
      font-family: 'Bungee', sans-serif;
      font-size: 12px;
      margin-bottom: 6px;
    }
    .card-progression .prog-bar-bg {
      width: 100%; height: 12px;
      background: #cbd5e1;
      border: 2px solid #000;
      border-radius: 6px;
      overflow: hidden;
    }
    .card-progression .prog-bar-fill {
      height: 100%; width: 30%;
      background: var(--port-dark);
    }
    .card-progression .card-sub {
      font-size: 10px; font-weight: 900; color: #64748b; margin-top: 4px; text-transform: uppercase;
    }

    .card-classement {
      background: var(--port-blue);
      border: var(--border-thick);
      border-radius: 16px;
      padding: 12px;
      box-shadow: var(--shadow-comic);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #fff;
    }
    .card-classement .rank-info {
      font-family: 'Bungee', sans-serif;
      font-size: 11px;
    }
    .card-classement .rank-num {
      font-family: 'Bangers', cursive;
      font-size: 38px;
      color: var(--comic-yellow);
      text-shadow: 2px 2px 0 #000;
    }

    @media (max-width: 380px) {
      .card-bosser .card-title { font-size: 36px; }
      .card-bosser .card-right { width: 56px; height: 56px; font-size: 28px; }
    }
  </style>
</head>
<body>

  <div class="ui-container">
    
    <div class="profile-header">
      <div class="profile-left">
        <div class="profile-avatar" id="profileAvatarBg">
          <img id="profileAvatarImg" src="notionists-1779298466584.png" alt="Avatar">
        </div>
        <div>
          <div class="profile-username" id="profileUsername">—</div>
          <div class="profile-rank" id="profileRank">Docker Occasionnel</div>
        </div>
      </div>
      <div class="profile-money" id="profileMoney">0 €</div>
    </div>

    <div class="stats-hub">
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-icon">⚡</div>
          <div class="stat-value" id="statEnergy">100%</div>
          <div class="stat-label">Énergie</div>
        </div>
        <div class="stat-box">
          <div class="stat-icon">❤️</div>
          <div class="stat-value" id="statSocial">Célibataire</div>
          <div class="stat-label">Vie Privée</div>
        </div>
        <div class="stat-box">
          <div class="stat-icon">📅</div>
          <div class="stat-value" id="statDay">Jour 1</div>
          <div class="stat-label">Temps</div>
        </div>
      </div>
    </div>

    <div class="hub-content">
      
      <div class="section-title">Le Quai</div>
      
      <div class="card-bosser" onclick="window.location.href='travailler.html'">
        <div class="card-left">
          <div class="card-tag">Service En cours</div>
          <div class="card-title">BOSSER</div>
          <div class="card-sub">Déplace des caisses · Gagne des €</div>
        </div>
        <div class="card-right">💼</div>
      </div>

      <div class="section-title
