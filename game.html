<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Battle Dock — Le Port Chelou</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Permanent+Marker&family=Space+Grotesk:wght@500;700;900&family=Bungee&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <script src="fullscreen.js"></script>
  
  <style>
    :root {
      --port-dark: #0f172a;
      --port-blue: #2563eb;
      --port-light-blue: #38bdf8;
      --comic-yellow: #facc15;
      --comic-red: #ef4444;
      --comic-green: #22c55e;
      --paper-cream: #fefce8;
      --border-thick: 4px solid #000000;
      --shadow-comic: 8px 8px 0px #000000;
      --shadow-comic-sm: 4px 4px 0px #000000;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: linear-gradient(135deg, #1e1b4b 0%, #311042 50%, #0f172a 100%);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      padding: 24px 16px;
    }

    /* --- HEADER PROFIL --- */
    .profile-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: #0f172a;
      padding: 12px 16px;
      margin: -24px -16px 24px -16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 3px solid #000;
    }

    .profile-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .profile-avatar {
      width: 42px;
      height: 42px;
      border: 3px solid #000;
      border-radius: 10px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .profile-username {
      font-family: 'Bungee', sans-serif;
      font-size: 15px;
      color: #ffffff;
      line-height: 1;
      margin-bottom: 3px;
    }

    .profile-rank {
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .profile-money {
      background: var(--comic-yellow);
      border: 3px solid #000;
      border-radius: 8px;
      padding: 6px 14px;
      font-family: 'Bungee', sans-serif;
      font-size: 15px;
      color: #000;
      box-shadow: 3px 3px 0 #000;
    }

    /* --- INTERFACE PRINCIPALE --- */
    .ui-container {
      position: relative;
      z-index: 10;
      max-width: 540px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo {
      font-family: 'Bangers', cursive;
      font-size: clamp(4rem, 12vw, 5.5rem);
      color: var(--comic-yellow);
      letter-spacing: 4px;
      text-shadow: 6px 6px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000;
      line-height: 0.9;
      transform: rotate(-2deg);
      display: inline-block;
      margin-bottom: 6px;
    }

    .subtitle {
      font-family: 'Permanent Marker', cursive;
      font-size: clamp(1rem, 4vw, 1.3rem);
      color: #ffffff;
      text-shadow: 3px 3px 0px var(--port-dark);
    }

    /* BLOC DES STATS EN "PAPIER CRÈME COMMERCIAL" */
    .stats-crate {
      background: var(--paper-cream);
      border: var(--border-thick);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-comic);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .stat {
      text-align: center;
      background: #ffffff;
      padding: 10px 4px;
      border-radius: 12px;
      border: 3px solid #000;
      box-shadow: var(--shadow-comic-sm);
    }

    .stat-icon {
      font-size: 28px;
      margin-bottom: 2px;
      animation: bounce-stat 2s ease-in-out infinite;
    }
    .stat:nth-child(1) .stat-icon { animation-delay: 0s; }
    .stat:nth-child(2) .stat-icon { animation-delay: 0.3s; }
    .stat:nth-child(3) .stat-icon { animation-delay: 0.6s; }

    @keyframes bounce-stat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .stat-value {
      font-family: 'Bungee', sans-serif;
      font-size: 16px;
      color: var(--port-dark);
      margin-bottom: 2px;
    }

    .stat-label {
      font-size: 11px;
      color: #64748b;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* PALETTE DE BOUTONS STYLE BD POP */
    .menu-buttons {
      display: grid;
      gap: 16px;
    }

    .wood-btn {
      background: #ffffff;
      border: var(--border-thick);
      border-radius: 16px;
      padding: 16px;
      cursor: pointer;
      position: relative;
      box-shadow: var(--shadow-comic);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* Assignation des couleurs fortes style BD sur les boutons */
    .menu-buttons .wood-btn:nth-child(1) { background: var(--comic-yellow); }
    .menu-buttons .wood-btn:nth-child(2) { background: var(--port-blue); }
    .menu-buttons .wood-btn:nth-child(3) { background: #a855f7; } /* Violet Boutique */
    .menu-buttons .wood-btn:nth-child(4) { background: var(--comic-green); }
    .menu-buttons .wood-btn:nth-child(5) { background: #e2e8f0; }

    .wood-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 10px 10px 0px #000000;
    }

    .wood-btn:active {
      transform: translate(6px, 6px);
      box-shadow: 2px 2px 0px #000000;
    }

    .btn-icon {
      width: 54px;
      height: 54px;
      background: #ffffff;
      border: 3px solid #000;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      flex-shrink: 0;
      box-shadow: var(--shadow-comic-sm);
    }

    .btn-content {
      flex: 1;
      text-align: left;
    }

    .btn-title {
      font-family: 'Bungee', sans-serif;
      font-size: 16px;
      color: var(--port-dark);
      text-shadow: 2px 2px 0px #ffffff;
      margin-bottom: 2px;
    }

    /* Couleurs de texte adaptées si le fond est sombre */
    .menu-buttons .wood-btn:nth-child(2) .btn-title { text-shadow: 2px 2px 0px var(--port-dark); color: #fff; }

    .btn-desc {
      font-size: 13px;
      color: var(--port-dark);
      font-weight: 700;
      opacity: 0.9;
    }
    .menu-buttons .wood-btn:nth-child(2) .btn-desc { color: #f8fafc; }

    /* BADGE UNIVERSEL FLASHY */
    .btn-badge {
      position: absolute;
      top: -10px;
      right: -6px;
      background: var(--comic-red);
      color: white;
      font-family: 'Bangers', cursive;
      font-size: 16px;
      letter-spacing: 1px;
      padding: 4px 12px;
      border-radius: 8px;
      border: 3px solid #000;
      transform: rotate(12deg);
      box-shadow: var(--shadow-comic-sm);
    }

    @media (max-width: 400px) {
      .logo { font-size: 3.2rem; }
    }
  </style>
</head>
<body>

  <div class="ui-container">
    
    <div class="profile-header">
      <div class="profile-left">
        <div class="profile-avatar" id="profileAvatarBg">
          <img id="profileAvatarImg" src="notionists-1779298466584.png" alt="Avatar">
        </div>
        <div>
          <div class="profile-username" id="profileUsername">—</div>
          <div class="profile-rank" id="profileRank">Docker Occasionnel</div>
        </div>
      </div>
      <div class="profile-money" id="profileMoney">0 €</div>
    </div>

    <div class="menu-buttons">
      
      <div class="wood-btn" onclick="window.location.href='travailler.html'">
        <div class="btn-icon">💼</div>
        <div class="btn-content">
          <div class="btn-title">Bosser</div>
          <div class="btn-desc">Déplace des caisses</div>
        </div>
      </div>

      <div class="wood-btn" onclick="window.location.href='jeux.html'">
        <div class="btn-icon">🎰</div>
        <div class="btn-content">
          <div class="btn-title">Mini-Jeux</div>
          <div class="btn-desc">Tente ta chance</div>
        </div>
        <div class="btn-badge">HOT</div>
      </div>

      <div class="wood-btn" onclick="window.location.href='shop.html'">
        <div class="btn-icon">👽</div>
        <div class="btn-content">
          <div class="btn-title">Boutique Ferretti</div>
          <div class="btn-desc">Trucs bizarres</div>
        </div>
      </div>

      <div class="wood-btn" onclick="window.location.href='progression.html'">
        <div class="btn-icon">📊</div>
        <div class="btn-content">
          <div class="btn-title">Progression</div>
          <div class="btn-desc">Tes objectifs</div>
        </div>
      </div>

      <div class="wood-btn" onclick="window.location.href='classement.html'">
        <div class="btn-icon">🏅</div>
        <div class="btn-content">
          <div class="btn-title">Classement</div>
          <div class="btn-desc">Les meilleurs</div>
        </div>
      </div>

    </div>
  </div>



  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const supabaseClient = createClient(supabaseUrl, supabaseKey);

    const userId = localStorage.getItem('userId');
    if (!userId) window.location.href = 'index.html';

    loadUserData();

    async function loadUserData() {
      try {
        const { data: profile } = await supabaseClient
          .from('profiles')
          .select('username, color, avatar')
          .eq('user_id', userId)
          .single();

        const { data: progress } = await supabaseClient
          .from('game_progress')
          .select('money, rank')
          .eq('user_id', userId)
          .single();

        if (profile) {
          document.getElementById('profileUsername').textContent = profile.username || localStorage.getItem('username') || '—';
          const color = profile.color || '#3A4750';
          document.getElementById('profileAvatarBg').style.backgroundColor = color;
          if (profile.avatar) document.getElementById('profileAvatarImg').src = profile.avatar;
          localStorage.setItem('userColor', color);
        }

        if (progress) {
          document.getElementById('profileRank').textContent = progress.rank || 'Docker Occasionnel';
          document.getElementById('profileMoney').textContent = formatNumber(progress.money || 0) + ' €';
        }
      } catch (err) {
        console.error('Erreur:', err);
      }
    }

    function formatNumber(num) {
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
      return num.toString();
    }
  </script>
</body>
</html>
