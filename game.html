<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Battle Dock — Le Port Chelou</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Permanent+Marker&family=Space+Grotesk:wght@500;700;900&family=Bungee&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <script src="fullscreen.js"></script>
  
  <style>
    :root {
      --port-dark: #0f172a;
      --port-blue: #2563eb;
      --port-light-blue: #38bdf8;
      --comic-yellow: #facc15;
      --comic-red: #ef4444;
      --comic-green: #22c55e;
      --paper-cream: #fefce8;
      --border-thick: 4px solid #000000;
      --shadow-comic: 8px 8px 0px #000000;
      --shadow-comic-sm: 4px 4px 0px #000000;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: linear-gradient(135deg, #1e1b4b 0%, #311042 50%, #0f172a 100%);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      padding: 24px 16px 140px 16px;
    }

    /* --- DÉCORS STYLE BD --- */
    .smoke {
      position: fixed;
      bottom: 30%;
      right: 10%;
      width: 100px;
      height: 150px;
      z-index: 0;
      pointer-events: none;
    }

    .smoke-cloud {
      position: absolute;
      background: #334155;
      border: 3px solid #000;
      border-radius: 50%;
      opacity: 0.8;
      animation: smoke-rise 4s ease-out infinite;
    }

    .smoke-cloud:nth-child(1) { width: 60px; height: 60px; bottom: 0; left: 20px; animation-delay: 0s; }
    .smoke-cloud:nth-child(2) { width: 50px; height: 50px; bottom: 40px; left: 10px; animation-delay: 0.8s; }
    .smoke-cloud:nth-child(3) { width: 70px; height: 70px; bottom: 80px; left: 30px; animation-delay: 1.6s; }

    @keyframes smoke-rise {
      0% { transform: translateY(0) scale(0.8); opacity: 0.8; }
      100% { transform: translateY(-120px) scale(1.3); opacity: 0; }
    }

    .seagulls {
      position: fixed;
      top: 18%;
      left: 12%;
      z-index: 1;
      pointer-events: none;
    }

    .seagull {
      position: absolute;
      font-size: 44px;
      animation: seagull-fight 2s ease-in-out infinite;
      filter: drop-shadow(4px 4px 0px #000000);
    }

    .seagull:nth-child(1) { left: 0; animation-delay: 0s; }
    .seagull:nth-child(2) { left: 55px; animation-delay: 1s; transform: scaleX(-1); }

    @keyframes seagull-fight {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      25% { transform: translateX(-8px) rotate(-12deg); }
      75% { transform: translateX(8px) rotate(12deg); }
    }

    .chichi {
      position: fixed;
      bottom: 22%;
      left: 18%;
      font-size: 36px;
      z-index: 0;
      animation: wiggle 3s ease-in-out infinite;
      filter: drop-shadow(3px 3px 0px #000000);
      pointer-events: none;
    }

    @keyframes wiggle {
      0%, 100% { transform: rotate(-6deg); }
      50% { transform: rotate(6deg); }
    }

    .containers {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 180px;
      z-index: 0;
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      padding: 0 16px;
      pointer-events: none;
    }

    .container-stack {
      display: flex;
      flex-direction: column-reverse;
      gap: 2px;
    }

    .container-box {
      width: 75px;
      height: 42px;
      background: var(--color);
      border: 3px solid #000000;
      border-radius: 6px;
      position: relative;
      box-shadow: 4px 4px 0px #000000;
      transform: rotate(var(--rotation));
    }

    .container-box::after {
      content: '⚓';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 18px;
      opacity: 0.3;
      color: #000;
    }

    /* --- INTERFACE PRINCIPALE --- */
    .ui-container {
      position: relative;
      z-index: 10;
      max-width: 540px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo {
      font-family: 'Bangers', cursive;
      font-size: clamp(4rem, 12vw, 5.5rem);
      color: var(--comic-yellow);
      letter-spacing: 4px;
      text-shadow: 6px 6px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000;
      line-height: 0.9;
      transform: rotate(-2deg);
      display: inline-block;
      margin-bottom: 6px;
    }

    .subtitle {
      font-family: 'Permanent Marker', cursive;
      font-size: clamp(1rem, 4vw, 1.3rem);
      color: #ffffff;
      text-shadow: 3px 3px 0px var(--port-dark);
    }

    /* BLOC DES STATS EN "PAPIER CRÈME COMMERCIAL" */
    .stats-crate {
      background: var(--paper-cream);
      border: var(--border-thick);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-comic);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .stat {
      text-align: center;
      background: #ffffff;
      padding: 10px 4px;
      border-radius: 12px;
      border: 3px solid #000;
      box-shadow: var(--shadow-comic-sm);
    }

    .stat-icon {
      font-size: 28px;
      margin-bottom: 2px;
      animation: bounce-stat 2s ease-in-out infinite;
    }
    .stat:nth-child(1) .stat-icon { animation-delay: 0s; }
    .stat:nth-child(2) .stat-icon { animation-delay: 0.3s; }
    .stat:nth-child(3) .stat-icon { animation-delay: 0.6s; }

    @keyframes bounce-stat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .stat-value {
      font-family: 'Bungee', sans-serif;
      font-size: 16px;
      color: var(--port-dark);
      margin-bottom: 2px;
    }

    .stat-label {
      font-size: 11px;
      color: #64748b;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* PALETTE DE BOUTONS STYLE BD POP */
    .menu-buttons {
      display: grid;
      gap: 16px;
    }

    .wood-btn {
      background: #ffffff;
      border: var(--border-thick);
      border-radius: 16px;
      padding: 16px;
      cursor: pointer;
      position: relative;
      box-shadow: var(--shadow-comic);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* Assignation des couleurs fortes style BD sur les boutons */
    .menu-buttons .wood-btn:nth-child(1) { background: var(--comic-yellow); }
    .menu-buttons .wood-btn:nth-child(2) { background: var(--port-blue); }
    .menu-buttons .wood-btn:nth-child(3) { background: #a855f7; } /* Violet Boutique */
    .menu-buttons .wood-btn:nth-child(4) { background: var(--comic-green); }
    .menu-buttons .wood-btn:nth-child(5) { background: #e2e8f0; }

    .wood-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 10px 10px 0px #000000;
    }

    .wood-btn:active {
      transform: translate(6px, 6px);
      box-shadow: 2px 2px 0px #000000;
    }

    .btn-icon {
      width: 54px;
      height: 54px;
      background: #ffffff;
      border: 3px solid #000;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      flex-shrink: 0;
      box-shadow: var(--shadow-comic-sm);
    }

    .btn-content {
      flex: 1;
      text-align: left;
    }

    .btn-title {
      font-family: 'Bungee', sans-serif;
      font-size: 16px;
      color: var(--port-dark);
      text-shadow: 2px 2px 0px #ffffff;
      margin-bottom: 2px;
    }

    /* Couleurs de texte adaptées si le fond est sombre */
    .menu-buttons .wood-btn:nth-child(2) .btn-title { text-shadow: 2px 2px 0px var(--port-dark); color: #fff; }

    .btn-desc {
      font-size: 13px;
      color: var(--port-dark);
      font-weight: 700;
      opacity: 0.9;
    }
    .menu-buttons .wood-btn:nth-child(2) .btn-desc { color: #f8fafc; }

    /* BADGE UNIVERSEL FLASHY */
    .btn-badge {
      position: absolute;
      top: -10px;
      right: -6px;
      background: var(--comic-red);
      color: white;
      font-family: 'Bangers', cursive;
      font-size: 16px;
      letter-spacing: 1px;
      padding: 4px 12px;
      border-radius: 8px;
      border: 3px solid #000;
      transform: rotate(12deg);
      box-shadow: var(--shadow-comic-sm);
    }

    /* --- NAVIGATION INFERIEURE STYLE BD --- */
    .bottom-nav {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) rotate(-1deg);
      background: var(--port-dark);
      border: var(--border-thick);
      border-radius: 24px;
      padding: 12px 16px;
      display: flex;
      gap: 12px;
      box-shadow: var(--shadow-comic);
      z-index: 100;
    }

    .nav-btn {
      width: 56px;
      height: 56px;
      background: var(--comic-yellow);
      border: 3px solid #000;
      border-radius: 16px;
      font-size: 26px;
      cursor: pointer;
      transition: all 0.1s;
      position: relative;
      box-shadow: var(--shadow-comic-sm);
    }

    .nav-btn:nth-child(2) { background: var(--port-light-blue); }
    .nav-btn:nth-child(3) { background: var(--comic-green); }
    .nav-btn:nth-child(4) { background: #cbd5e1; }

    .nav-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 5px 5px 0px #000;
    }

    .nav-btn:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0px #000;
    }

    .nav-badge {
      position: absolute;
      top: -8px;
      right: -8px;
      background: var(--comic-red);
      color: white;
      font-size: 11px;
      font-weight: 900;
      padding: 2px 6px;
      border-radius: 6px;
      border: 2px solid #000;
      font-family: 'Bangers', cursive;
    }

    @media (max-width: 400px) {
      .logo { font-size: 3.2rem; }
      .seagulls { left: 4%; top: 12%; }
      .seagull { font-size: 34px; }
    }
  </style>
</head>
<body>

  <div class="smoke">
    <div class="smoke-cloud"></div>
    <div class="smoke-cloud"></div>
    <div class="smoke-cloud"></div>
  </div>

  <div class="seagulls">
    <div class="seagull">🐦</div>
    <div class="seagull">🐦</div>
  </div>

  <div class="chichi">🥖</div>

  <div class="containers">
    <div class="container-stack">
      <div class="container-box" style="--color: var(--comic-red); --rotation: -3deg;"></div>
      <div class="container-box" style="--color: var(--port-blue); --rotation: 2deg;"></div>
      <div class="container-box" style="--color: var(--comic-yellow); --rotation: -1deg;"></div>
    </div>
    <div class="container-stack">
      <div class="container-box" style="--color: var(--comic-green); --rotation: 4deg;"></div>
      <div class="container-box" style="--color: var(--comic-red); --rotation: -2deg;"></div>
    </div>
    <div class="container-stack">
      <div class="container-box" style="--color: #a855f7; --rotation: 1deg;"></div>
      <div class="container-box" style="--color: var(--comic-yellow); --rotation: -4deg;"></div>
      <div class="container-box" style="--color: var(--port-blue); --rotation: 2deg;"></div>
    </div>
  </div>

  <div class="ui-container">
    
    <div class="header">
      <div class="logo">BATTLE DOCK</div>
      <div class="subtitle">⚓ Le Port Chelou ⚓</div>
    </div>

    <div class="stats-crate">
      <div class="stats-grid">
        <div class="stat">
          <div class="stat-icon">💰</div>
          <div class="stat-value" id="moneyDisplay">0€</div>
          <div class="stat-label">Thunes</div>
        </div>
        <div class="stat">
          <div class="stat-icon">⭐</div>
          <div class="stat-value" id="levelDisplay">1</div>
          <div class="stat-label">Niveau</div>
        </div>
        <div class="stat">
          <div class="stat-icon">🏆</div>
          <div class="stat-value" id="xpDisplay">0</div>
          <div class="stat-label">XP</div>
        </div>
      </div>
    </div>

    <div class="menu-buttons">
      
      <div class="wood-btn" onclick="window.location.href='travailler.html'">
        <div class="btn-icon">💼</div>
        <div class="btn-content">
          <div class="btn-title">Bosser</div>
          <div class="btn-desc">Déplace des caisses</div>
        </div>
      </div>

      <div class="wood-btn" onclick="window.location.href='jeux.html'">
        <div class="btn-icon">🎰</div>
        <div class="btn-content">
          <div class="btn-title">Mini-Jeux</div>
          <div class="btn-desc">Tente ta chance</div>
        </div>
        <div class="btn-badge">HOT</div>
      </div>

      <div class="wood-btn" onclick="window.location.href='shop.html'">
        <div class="btn-icon">👽</div>
        <div class="btn-content">
          <div class="btn-title">Boutique Ferretti</div>
          <div class="btn-desc">Trucs bizarres</div>
        </div>
      </div>

      <div class="wood-btn" onclick="window.location.href='progression.html'">
        <div class="btn-icon">📊</div>
        <div class="btn-content">
          <div class="btn-title">Progression</div>
          <div class="btn-desc">Tes objectifs</div>
        </div>
      </div>

      <div class="wood-btn" onclick="window.location.href='classement.html'">
        <div class="btn-icon">🏅</div>
        <div class="btn-content">
          <div class="btn-title">Classement</div>
          <div class="btn-desc">Les meilleurs</div>
        </div>
      </div>

    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-btn" onclick="window.location.href='profil.html'">👤</button>
    <button class="nav-btn" onclick="window.location.href='jeux.html'">
      🎮
      <span class="nav-badge">NEW</span>
    </button>
    <button class="nav-btn" onclick="window.location.href='shop.html'">🛒</button>
    <button class="nav-btn" onclick="window.location.href='parametres.html'">⚙️</button>
  </div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const supabaseClient = createClient(supabaseUrl, supabaseKey);

    const userId = localStorage.getItem('userId');
    if (!userId) window.location.href = 'index.html';

    loadUserData();

    async function loadUserData() {
      try {
        const { data } = await supabaseClient
          .from('game_progress')
          .select('money, level, xp')
          .eq('user_id', userId)
          .single();

        if (data) {
          document.getElementById('moneyDisplay').textContent = formatNumber(data.money || 0) + '€';
          document.getElementById('levelDisplay').textContent = data.level || 1;
          document.getElementById('xpDisplay').textContent = formatNumber(data.xp || 0);
        }
      } catch (err) {
        console.error('Erreur:', err);
      }
    }

    function formatNumber(num) {
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
      return num.toString();
    }
  </script>
</body>
</html>
