<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Battle Dock — Zone de Fret</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Permanent+Marker&family=Space+Grotesk:wght@500;700;900&family=Bungee&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  
  <style>
    :root {
      --port-dark: #0f172a;
      --comic-yellow: #facc15;
      --comic-red: #ef4444;
      --border-thick: 4px solid #000000;
      --shadow-comic: 6px 6px 0px #000000;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: #1e293b; /* Fond par défaut avant chargement de la couleur du joueur */
      min-height: 100vh;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #ffffff;
    }

    /* TOP BAR : ZONE DU PROFIL DU JOUEUR */
    .top-bar {
      width: 100%;
      max-width: 500px;
      margin-bottom: 24px;
    }

    #player-badge {
      background: #3A4750; /* Changé dynamiquement par le script */
      border: var(--border-thick);
      border-radius: 16px;
      padding: 12px 16px;
      box-shadow: var(--shadow-comic);
      display: flex;
      align-items: center;
      gap: 16px;
      transition: background-color 0.4s ease;
    }

    #avatar-container {
      width: 64px;
      height: 64px;
      border: 3px solid #000000;
      border-radius: 12px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    #player-avatar-img {
      width: 90%;
      height: 90%;
      object-fit: contain;
    }

    .profile-info {
      flex: 1;
    }

    #player-username-display {
      font-family: 'Bungee', sans-serif;
      font-size: 18px;
      color: #ffffff;
      text-shadow: 2px 2px 0px #000000;
      letter-spacing: 0.5px;
    }

    #player-rank-display {
      font-family: 'Permanent Marker', cursive;
      font-size: 13px;
      color: var(--comic-yellow);
      text-shadow: 2px 2px 0px #000000;
      display: block;
      margin-top: 2px;
    }

    /* ZONE PRINCIPALE DE JEU */
    .game-container {
      width: 100%;
      max-width: 500px;
      background: #f8fafc;
      border: var(--border-thick);
      border-radius: 24px;
      box-shadow: var(--shadow-comic);
      color: var(--port-dark);
      padding: 24px;
      text-align: center;
    }

    .game-title {
      font-family: 'Bangers', cursive;
      font-size: 32px;
      letter-spacing: 1px;
      color: var(--port-dark);
      margin-bottom: 16px;
    }

    /* Place tes éléments de gameplay ici (boutons, conteneurs de fret, etc.) */
    .game-screen {
      background: #cbd5e1;
      border: 3px solid #000000;
      border-radius: 12px;
      padding: 40px 20px;
      font-weight: 700;
      font-size: 16px;
      margin-bottom: 20px;
    }

    .btn-action {
      background: var(--comic-red);
      color: white;
      border: 4px solid #000000;
      border-radius: 12px;
      padding: 14px;
      font-family: 'Bungee', sans-serif;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 4px 4px 0px #000000;
      width: 100%;
      transition: all 0.1s ease;
    }

    .btn-action:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #000000;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div id="player-badge">
      <div id="avatar-container">
        <img id="player-avatar-img" src="notionists-1779298466584.png" alt="Avatar Docker">
      </div>
      <div class="profile-info">
        <h3 id="player-username-display">CHARGEMENT...</h3>
        <span id="player-rank-display">DOCKER OCCASIONNEL</span>
      </div>
    </div>
  </div>

  <div class="game-container">
    <h2 class="game-title">🕹️ POSTE DE COMMANDES</h2>
    
    <div class="game-screen">
      [ Insère ici tes boutons de clic, tes grues ou tes cargaisons ]
    </div>

    <button class="btn-action" onclick="actionExemple()">CHARGER LE CONTENEUR</button>
  </div>

  <script>
    // 1. CONFIGURATION ET INITIALISATION SUPABASE
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    // 2. SÉCURITÉ : Blocage immédiat si pas connecté
    const userId = localStorage.getItem('userId');
    if (!userId) {
      window.location.href = 'index.html';
    }

    // 3. FONCTION DE CHARGEMENT DU DESIGN DU PROFIL
    async function chargerProfilJoueur() {
      // Étape A : Lecture immédiate depuis le LocalStorage pour éviter l'attente réseau
      const localUsername = localStorage.getItem('username') || 'Recrue';
      const localAvatar = localStorage.getItem('userAvatar') || 'notionists-1779298466584.png';
      const localBg = localStorage.getItem('userBg') || '#3A4750';

      appliquerDesignInterface(localUsername, localAvatar, localBg);

      try {
        // Étape B : Double vérification de sécurité en temps réel avec Supabase
        const { data: user, error } = await supabaseClient
          .from('users')
          .select('username, avatar, bg_color')
          .eq('id', userId)
          .single();

        if (error) throw error;

        if (user) {
          // Si l'utilisateur change d'appareil ou d'avatar ultérieurement, on actualise le cache local
          localStorage.setItem('username', user.username);
          localStorage.setItem('userAvatar', user.avatar);
          localStorage.setItem('userBg', user.bg_color);

          // On applique les données fraîches de la base de données
          appliquerDesignInterface(user.username, user.avatar, user.bg_color);
        }

        // Étape C : Récupération du grade actuel dans la table "game_progress"
        const { data: progress } = await supabaseClient
          .from('game_progress')
          .select('rank')
          .eq('user_id', userId)
          .single();
          
        if (progress && document.getElementById('player-rank-display')) {
          document.getElementById('player-rank-display').textContent = progress.rank.toUpperCase();
        }

      } catch (err) {
        console.error("Problème de liaison avec le quai central :", err.message);
      }
    }

    // 4. FONCTION INJECTRICE DE STYLE HTML
    function appliquerDesignInterface(username, avatarUrl, bgColor) {
      if (document.getElementById('player-username-display')) {
        document.getElementById('player-username-display').textContent = username.toUpperCase();
      }
      
      if (document.getElementById('player-avatar-img')) {
        document.getElementById('player-avatar-img').src = avatarUrl;
      }
      
      if (document.getElementById('player-badge')) {
        document.getElementById('player-badge').style.backgroundColor = bgColor;
      }
    }

    // Exemple d'action pour ton jeu
    function actionExemple() {
      console.log("Action effectuée par le joueur connecté !");
    }

    // Déclenchement automatique au chargement complet de l'interface
    document.addEventListener('DOMContentLoaded', chargerProfilJoueur);
  </script>
</body>
</html>
