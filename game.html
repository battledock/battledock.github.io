<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Battle Dock - Jeu</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Space+Grotesk:wght@500;700;900&family=Bungee&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  
  <style>
    :root {
      --port-dark: #0f172a;
      --comic-yellow: #facc15;
      --comic-red: #ef4444;
      --comic-green: #22c55e;
      --border-thick: 4px solid #000000;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 50%, #3b82f6 100%);
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }

    .game-container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    .player-header {
      background: #e2e8f0;
      border: var(--border-thick);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .avatar-container {
      width: 80px;
      height: 80px;
      border: var(--border-thick);
      border-radius: 50%;
      overflow: hidden;
      background: white;
      flex-shrink: 0;
    }

    .avatar-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .player-info {
      flex: 1;
      min-width: 0;
    }

    .player-username {
      font-family: 'Bangers', cursive;
      font-size: 24px;
      color: var(--port-dark);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-money {
      font-family: 'Bungee', sans-serif;
      font-size: 20px;
      color: var(--comic-green);
      margin-bottom: 2px;
    }

    .grade-card {
      background: #e2e8f0;
      border: var(--border-thick);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .grade-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .grade-title {
      font-family: 'Bangers', cursive;
      font-size: 22px;
      color: var(--port-dark);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .grade-level {
      font-family: 'Bungee', sans-serif;
      font-size: 18px;
      color: #3b82f6;
    }

    .grade-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: #475569;
      margin-bottom: 12px;
    }

    .progress-container {
      background: #cbd5e1;
      border: var(--border-thick);
      border-radius: 10px;
      height: 32px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar {
      background: linear-gradient(90deg, var(--comic-yellow) 0%, #fb923c 100%);
      height: 100%;
      transition: width 0.3s ease;
    }

    .progress-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Bungee', sans-serif;
      font-size: 12px;
      color: var(--port-dark);
      font-weight: 700;
      text-shadow: 1px 1px 0px #fff;
      z-index: 1;
    }

    .work-zone {
      background: #e2e8f0;
      border: var(--border-thick);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .work-title {
      font-family: 'Bangers', cursive;
      font-size: 22px;
      color: var(--port-dark);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
      text-align: center;
    }

    .cleaning-game {
      background: #94a3b8;
      border: var(--border-thick);
      border-radius: 12px;
      height: 400px;
      position: relative;
      overflow: hidden;
      touch-action: none;
      cursor: crosshair;
    }

    .cleaning-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .game-stats {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      font-family: 'Bungee', sans-serif;
      font-size: 14px;
    }

    .stat-item {
      color: var(--port-dark);
    }

    .stat-value {
      color: #3b82f6;
      margin-left: 4px;
    }

    .start-btn {
      background: var(--comic-green);
      color: white;
      border: var(--border-thick);
      border-radius: 12px;
      padding: 14px 20px;
      font-family: 'Bungee', sans-serif;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      cursor: pointer;
      box-shadow: 6px 6px 0px #000000;
      transition: all 0.15s ease;
      width: 100%;
      border-bottom: none;
      margin-top: 12px;
    }

    .start-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 8px 8px 0px #000000;
    }

    .start-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #000000;
    }

    .start-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .logout-btn {
      background: var(--comic-red);
      color: white;
      border: var(--border-thick);
      border-radius: 12px;
      padding: 14px 20px;
      font-family: 'Bungee', sans-serif;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      cursor: pointer;
      box-shadow: 6px 6px 0px #000000;
      transition: all 0.15s ease;
      width: 100%;
      border-bottom: none;
    }

    .logout-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 8px 8px 0px #000000;
    }

    .logout-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #000000;
    }

    @media (max-width: 400px) {
      .cleaning-game {
        height: 350px;
      }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <div class="player-header">
      <div class="avatar-container">
        <img src="avatar-default.png" alt="Avatar" id="avatarImage">
      </div>
      <div class="player-info">
        <div class="player-username" id="playerUsername">...</div>
        <div class="player-money" id="playerMoney">0 €</div>
      </div>
    </div>

    <div class="grade-card">
      <div class="grade-header">
        <div class="grade-title">GRADE</div>
        <div class="grade-level" id="playerLevel">Niv. 1</div>
      </div>
      <div class="grade-name" id="playerGrade">Docker Occasionnel</div>
      <div class="progress-container">
        <div class="progress-bar" id="progressBar" style="width: 0%"></div>
        <div class="progress-text" id="progressText">0 / 100 XP</div>
      </div>
    </div>

    <div class="work-zone">
      <div class="work-title">🧹 NETTOYER L'ENTREPÔT</div>
      
      <div class="cleaning-game" id="cleaningGame">
        <canvas id="cleaningCanvas" class="cleaning-canvas"></canvas>
      </div>

      <div class="game-stats">
        <div class="stat-item">
          Propre: <span class="stat-value" id="cleanPercent">0%</span>
        </div>
        <div class="stat-item">
          Temps: <span class="stat-value" id="timeLeft">60s</span>
        </div>
        <div class="stat-item">
          XP: <span class="stat-value" id="xpEarned">0</span>
        </div>
      </div>

      <button class="start-btn" id="startBtn" onclick="startGame()">COMMENCER</button>
    </div>

    <button class="logout-btn" onclick="logout()">DÉCONNEXION</button>
  </div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const sb = createClient(supabaseUrl, supabaseKey);

    let currentUser = null;
    let gameActive = false;
    let gameTimer = null;
    let timeRemaining = 60;
    let cleanedPixels = new Set();
    let totalPixels = 0;

    const canvas = document.getElementById('cleaningCanvas');
    const ctx = canvas.getContext('2d');

    function setupCanvas() {
      const container = document.getElementById('cleaningGame');
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
      totalPixels = Math.floor((canvas.width * canvas.height) / 100);
      drawDirt();
    }

    function drawDirt() {
      ctx.fillStyle = '#475569';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      for (let i = 0; i < 100; i++) {
        ctx.fillStyle = `rgba(30, 41, 59, ${Math.random() * 0.5 + 0.3})`;
        const x = Math.random() * canvas.width;
        const y = Math.random() * canvas.height;
        const size = Math.random() * 40 + 20;
        ctx.beginPath();
        ctx.arc(x, y, size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function cleanArea(x, y) {
      if (!gameActive) return;
      
      const brushSize = 30;
      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.arc(x, y, brushSize, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      
      const gridX = Math.floor(x / 10);
      const gridY = Math.floor(y / 10);
      cleanedPixels.add(`${gridX},${gridY}`);
      
      updateCleanPercent();
    }

    function updateCleanPercent() {
      const percent = Math.min(Math.floor((cleanedPixels.size / totalPixels) * 100), 100);
      document.getElementById('cleanPercent').textContent = percent + '%';
      document.getElementById('xpEarned').textContent = percent;
      
      if (percent >= 100) {
        endGame(true);
      }
    }

    let isDrawing = false;

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      isDrawing = true;
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches[0];
      cleanArea(touch.clientX - rect.left, touch.clientY - rect.top);
    });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (!isDrawing) return;
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches[0];
      cleanArea(touch.clientX - rect.left, touch.clientY - rect.top);
    });

    canvas.addEventListener('touchend', () => {
      isDrawing = false;
    });

    canvas.addEventListener('mousedown', (e) => {
      isDrawing = true;
      const rect = canvas.getBoundingClientRect();
      cleanArea(e.clientX - rect.left, e.clientY - rect.top);
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!isDrawing) return;
      const rect = canvas.getBoundingClientRect();
      cleanArea(e.clientX - rect.left, e.clientY - rect.top);
    });

    canvas.addEventListener('mouseup', () => {
      isDrawing = false;
    });

    canvas.addEventListener('mouseleave', () => {
      isDrawing = false;
    });

    function startGame() {
      gameActive = true;
      timeRemaining = 60;
      cleanedPixels.clear();
      document.getElementById('startBtn').disabled = true;
      document.getElementById('startBtn').textContent = 'EN COURS...';
      document.getElementById('cleanPercent').textContent = '0%';
      document.getElementById('xpEarned').textContent = '0';
      
      setupCanvas();
      
      gameTimer = setInterval(() => {
        timeRemaining--;
        document.getElementById('timeLeft').textContent = timeRemaining + 's';
        
        if (timeRemaining <= 0) {
          endGame(false);
        }
      }, 1000);
    }

    async function endGame(success) {
      gameActive = false;
      clearInterval(gameTimer);
      
      const xpGained = Math.min(cleanedPixels.size, totalPixels);
      
      document.getElementById('startBtn').disabled = false;
      document.getElementById('startBtn').textContent = success ? '✅ TERMINÉ ! REJOUER' : '⏱️ TEMPS ÉCOULÉ ! REJOUER';
      
      if (currentUser && xpGained > 0) {
        const { data: stats } = await sb
          .from('game_stats')
          .select('xp')
          .eq('user_id', currentUser.id)
          .single();
        
        if (stats) {
          const newXp = stats.xp + xpGained;
          await sb
            .from('game_stats')
            .update({ xp: newXp })
            .eq('user_id', currentUser.id);
          
          loadProfile();
        }
      }
    }

    async function loadProfile() {
      const { data: { session } } = await sb.auth.getSession();
      
      if (!session) {
        window.location.href = 'index.html';
        return;
      }

      currentUser = session.user;

      const { data: profile } = await sb
        .from('profiles')
        .select('username, avatar_url')
        .eq('user_id', currentUser.id)
        .single();

      if (profile) {
        document.getElementById('playerUsername').textContent = profile.username;
        document.getElementById('avatarImage').src = profile.avatar_url;
      }

      const { data: stats } = await sb
        .from('game_stats')
        .select('money, level, xp, grade')
        .eq('user_id', currentUser.id)
        .single();

      if (stats) {
        const xpNeeded = stats.level * 100;
        
        updatePlayerStats({
          money: stats.money,
          level: stats.level,
          xp: stats.xp,
          xpNeeded: xpNeeded,
          grade: stats.grade
        });
      }
    }

    function updatePlayerStats(stats) {
      document.getElementById('playerMoney').textContent = stats.money + ' €';
      document.getElementById('playerLevel').textContent = 'Niv. ' + stats.level;
      document.getElementById('playerGrade').textContent = stats.grade;
      
      const progressPercent = Math.min((stats.xp / stats.xpNeeded) * 100, 100);
      document.getElementById('progressBar').style.width = progressPercent + '%';
      document.getElementById('progressText').textContent = stats.xp + ' / ' + stats.xpNeeded + ' XP';
    }

    async function logout() {
      await sb.auth.signOut();
      window.location.href = 'index.html';
    }

    setupCanvas();
    loadProfile();
    
    window.addEventListener('resize', () => {
      if (!gameActive) setupCanvas();
    });
  </script>
</body>
</html>
