<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battle Dock - Accueil du jeu</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <style>
    body {
      background-color: #0a0e14;
      color: #fff;
      font-family: 'Arial', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    h1 {
      font-size: 32px;
      margin-bottom: 20px;
    }
    .container {
      text-align: center;
    }
    .logo {
      width: 150px;
      height: 150px;
      margin-bottom: 20px;
    }
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .button {
      display: inline-block;
      padding: 10px 20px;
      background-color: #f4b13c;
      color: #0a0e14;
      text-decoration: none;
      font-size: 18px;
      border-radius: 5px;
      cursor: pointer;
    }
    .button:hover {
      background-color: #d69b35;
    }
    .profile {
      margin-top: 40px;
    }
    .profile img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin-bottom: 10px;
    }
    .profile p {
      font-size: 16px;
    }
    .logout {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="logo.png" alt="Battle Dock Logo" class="logo">
    <h1>Bienvenue sur Battle Dock</h1>
    <div class="buttons">
      <a href="play.html" class="button">Jouer</a>
      <a href="leaderboard.html" class="button">Classement</a>
      <a href="shop.html" class="button">Boutique</a>
    </div>
    <div class="profile">
      <img src="" alt="Avatar" id="avatar">
      <p id="username"></p>
    </div>
    <div class="logout">
      <a href="#" class="button" id="logout">Déconnexion</a>
    </div>
  </div>

  <script>
    // Initialisation du client Supabase
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    // Récupérer les informations de l'utilisateur connecté
    const userId = localStorage.getItem('userId');
    const username = localStorage.getItem('username');
    const avatarUrl = localStorage.getItem('avatarUrl');

    // Afficher les informations de l'utilisateur
    document.getElementById('username').textContent = username;
    document.getElementById('avatar').src = avatarUrl;

    // Gérer la déconnexion
    document.getElementById('logout').addEventListener('click', async () => {
      // Supprimer les informations de l'utilisateur du stockage local
      localStorage.removeItem('userId');
      localStorage.removeItem('username');
      localStorage.removeItem('avatarUrl');

      // Déconnecter l'utilisateur de Supabase
      await supabase.auth.signOut();

      // Rediriger vers la page de connexion
      window.location.href = 'index.html';
    });

    // Vérifier si l'utilisateur est connecté
    supabase.auth.onAuthStateChange((event, session) => {
      if (!session) {
        // Rediriger vers la page de connexion si l'utilisateur n'est pas connecté
        window.location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
