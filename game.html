<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Battle Dock</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
    html, body { height:100%; background:#f5f4f0; }
    body { font-family:'Inter',sans-serif; display:flex; flex-direction:column; min-height:100dvh; }

    /* ── PROFIL ── */
    .profile-bar {
      background:white;
      border-bottom:1px solid rgba(0,0,0,0.07);
      padding:12px 16px;
      display:flex; align-items:center; gap:12px;
      cursor:pointer; flex-shrink:0;
    }
    .profile-bar:active { background:#f9f9f9; }
    .avatar { width:44px; height:44px; border-radius:50%; overflow:hidden; flex-shrink:0; background:#e5e7eb; border:2px solid #e5e7eb; }
    .avatar img { width:100%; height:100%; object-fit:cover; }
    .profile-info { flex:1; min-width:0; }
    .profile-name { font-weight:700; font-size:15px; color:#1a1a1a; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .profile-sub  { font-size:11px; color:#9ca3af; margin-top:1px; }
    .profile-pills { display:flex; gap:6px; flex-shrink:0; }
    .pill { border-radius:20px; padding:4px 10px; font-size:11px; font-weight:700; white-space:nowrap; }
    .pill-gold { background:#fef3c7; color:#92400e; }
    .pill-blue { background:#dbeafe; color:#1e40af; }

    /* ── CARTES ── */
    .cards-wrap { flex:1; display:flex; flex-direction:column; }

    /* MODE HISTOIRE */
    .histoire-card {
      position:relative; overflow:hidden;
      height:180px; flex-shrink:0;
      background:linear-gradient(135deg,#1e0a3c,#2d1060,#1a0845);
      cursor:pointer;
      transition:filter .15s;
    }
    .histoire-card:active { filter:brightness(0.85); }
    .histoire-card canvas { position:absolute; inset:0; width:100%; height:100%; opacity:0.5; pointer-events:none; }
    .histoire-card .line-scan { position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,#a78bfa,#7c3aed,transparent); animation:scan 3s linear infinite; pointer-events:none; }
    .histoire-card .line-bot  { position:absolute; bottom:0; left:0; right:0; height:1px; background:linear-gradient(90deg,transparent,rgba(167,139,250,0.3),transparent); pointer-events:none; }
    @keyframes scan { 0%{transform:translateX(-100%)} 100%{transform:translateX(100%)} }
    .histoire-inner { position:relative; z-index:2; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; }
    .histoire-le    { font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:7px; color:rgba(196,181,253,0.55); }
    .histoire-mode  { font-family:'Bebas Neue',sans-serif; font-size:52px; letter-spacing:10px; color:white; line-height:1; text-shadow:0 0 40px rgba(167,139,250,0.8),0 0 80px rgba(124,58,237,0.4); }
    .histoire-badge { font-size:10px; color:rgba(196,181,253,0.6); font-weight:700; letter-spacing:1.5px; display:none; margin-top:2px; }

    /* TRAVAILLER */
    .travail-card {
      position:relative; overflow:hidden;
      flex:1; min-height:130px;
      cursor:pointer;
      transition:filter .15s;
    }
    .travail-card:active { filter:brightness(0.9); }
    .travail-bg {
      position:absolute; inset:0;
      background:linear-gradient(135deg,#0c4a6e 0%,#0369a1 40%,#0284c7 70%,#0ea5e9 100%);
    }
    .travail-waves {
      position:absolute; bottom:0; left:0; right:0; height:40px; pointer-events:none;
    }
    .travail-inner {
      position:relative; z-index:2; height:100%;
      display:flex; align-items:flex-end; padding:18px 20px;
    }
    .travail-content { flex:1; }
    .travail-icon  { font-size:32px; margin-bottom:6px; filter:drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }
    .travail-title { font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:3px; color:white; text-shadow:0 2px 8px rgba(0,0,0,0.3); }
    .travail-sub   { font-size:12px; color:rgba(255,255,255,0.6); margin-top:2px; }

    /* LOCK overlay */
    .lock-overlay {
      position:absolute; inset:0; z-index:10;
      background:rgba(0,0,0,0.5);
      display:flex; align-items:center; justify-content:center;
      flex-direction:column; gap:6px;
    }
    .lock-overlay-icon  { font-size:32px; }
    .lock-overlay-text  { font-family:'Bebas Neue',sans-serif; font-size:14px; letter-spacing:2px; color:rgba(255,255,255,0.7); }

    /* TOAST */
    .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.85); color:white; padding:10px 18px; border-radius:20px; font-size:13px; font-weight:600; z-index:999; opacity:0; transition:opacity .3s; white-space:nowrap; pointer-events:none; }
    .toast.show { opacity:1; }
 PROFIL CARD ===================== */
    .profile-card-btn {
      grid-column: span 2;
      background: white;
      border-radius: 18px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border: 1px solid #e5e7eb;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .profile-card-btn:active { transform: scale(0.98); }

    .pcb-row {
      display: flex; align-items: center; gap: 14px;
    }

    .pcb-avatar {
      width: 54px; height: 54px; border-radius: 50%;
      overflow: hidden; flex-shrink: 0;
      border: 2px solid #e5e7eb;
    }
    .pcb-avatar img { width:100%; height:100%; object-fit:cover; }

    .pcb-info { flex: 1; min-width: 0; }
    .pcb-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px; letter-spacing: 1.5px;
      color: #1a1a1a; line-height: 1;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .pcb-grade { font-size: 11px; color: #b8962e; font-weight: 700; margin-top: 3px; }

    .pcb-level-wrap { text-align: center; flex-shrink: 0; }
    .pcb-level-num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 30px; color: #1a1a1a; line-height: 1;
    }
    .pcb-level-lbl { font-size: 9px; color: #9ca3af; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }

    .pcb-xp-wrap { }
    .pcb-xp-label { display:flex; justify-content:space-between; font-size:10px; color:#9ca3af; margin-bottom:4px; font-weight:600; }
    .pcb-xp-track { height:3px; background:#f3f4f6; border-radius:2px; overflow:hidden; }
    .pcb-xp-fill  { height:100%; background:linear-gradient(90deg,#b8962e,#d4af37,#f5d060); border-radius:2px; transition:width 0.5s ease; }

    .pcb-stats {
      display:grid; grid-template-columns:repeat(4,1fr);
      border-top:1px solid #f3f4f6; margin-top:10px; padding-top:10px; gap:4px;
    }
    .pcb-stat { text-align:center; }
    .pcb-stat-val { font-family:'Bebas Neue',sans-serif; font-size:14px; color:#1a1a1a; letter-spacing:0.5px; line-height:1; }
    .pcb-stat-lbl { font-size:8px; color:#9ca3af; text-transform:uppercase; letter-spacing:0.5px; font-weight:700; margin-top:2px; }


  </style>
</head>
<body>

  <div class="profile-card-btn" id="profileCardBtn" onclick="window.location.href='profil.html'">
    <div class="pcb-row">
      <div class="pcb-avatar"><img src="avatar-default.png" id="avatarImage" alt="avatar"></div>
      <div class="pcb-info">
    <div class="pcb-name"  id="playerName">...</div>
    <div class="pcb-grade" id="playerGrade">Docker Occasionnel</div>
      </div>
      <div class="pcb-level-wrap">
    <div class="pcb-level-num" id="currentLevel">1</div>
    <div class="pcb-level-lbl">Niv.</div>
      </div>
    </div>
    <div class="pcb-xp-wrap">
      <div class="pcb-xp-label">
    <span id="xpCounter">0 / 500 XP</span>
    <span>→ Niv. <span id="nextLevel">2</span></span>
      </div>
      <div class="pcb-xp-track"><div class="pcb-xp-fill" id="xpFill" style="width:0%"></div></div>
    </div>
    <div class="pcb-stats">
      <div class="pcb-stat"><div class="pcb-stat-val" id="moneyAmount">0€</div><div class="pcb-stat-lbl">Argent</div></div>
      <div class="pcb-stat"><div class="pcb-stat-val" id="diamondsAmount">0 💎</div><div class="pcb-stat-lbl">Diamants</div></div>
      <div class="pcb-stat"><div class="pcb-stat-val" id="trophiesAmount">0 🏆</div><div class="pcb-stat-lbl">Trophées</div></div>
      <div class="pcb-stat"><div class="pcb-stat-val" id="rankValue">#--</div><div class="pcb-stat-lbl">Rang</div></div>
    </div>
  </div>

  <div class="cards-wrap">

    <!-- MODE HISTOIRE -->
    <div class="histoire-card" onclick="window.location.href='histoire.html'">
      <canvas id="histoireCanvas"></canvas>
      <div class="line-scan"></div>
      <div class="line-bot"></div>
      <div class="histoire-inner">
        <div class="histoire-le">LE MODE</div>
        <div class="histoire-mode">HISTOIRE</div>
        <div class="histoire-badge" id="histoireBadge"></div>
      </div>
    </div>

    <!-- TRAVAILLER -->
    <div class="travail-card" id="travailCard" onclick="travailClick()">
      <div class="travail-bg"></div>
      <svg class="travail-waves" viewBox="0 0 400 40" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0,20 C80,5 160,35 240,20 C320,5 360,30 400,20 L400,40 L0,40 Z" fill="rgba(255,255,255,0.08)"/>
        <path d="M0,28 C60,15 140,38 220,26 C300,14 360,34 400,26 L400,40 L0,40 Z" fill="rgba(255,255,255,0.05)"/>
      </svg>
      <div class="travail-inner">
        <div class="travail-content">
          <div class="travail-icon">⚓</div>
          <div class="travail-title">Travailler</div>
          <div class="travail-sub" id="travailSub">Clicker · Tower · Pointeau</div>
        </div>
      </div>
      <div class="lock-overlay" id="travailLock">
        <div class="lock-overlay-icon">🔒</div>
        <div class="lock-overlay-text">CHAPITRE 1</div>
      </div>
    </div>

  </div>

  <div class="toast" id="toast"></div>

  <script>
    const SB_URL = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const sb = createClient(SB_URL, SB_KEY);

    let travailUnlocked = false;

    function travailClick() {
      if (travailUnlocked) window.location.href = 'travail.html';
      else showToast('🔒 Débloque le Chapitre 1 du Mode Histoire !');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.className = 'toast show';
      setTimeout(() => t.className = 'toast', 2800);
    }

    // Canvas particules histoire
    function initCanvas() {
      const canvas = document.getElementById('histoireCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
      const particles = Array.from({length:25}, () => ({
        x: Math.random()*canvas.width, y: Math.random()*canvas.height,
        r: Math.random()*1.4+0.3, speed: Math.random()*0.4+0.1, op: Math.random()*0.8+0.2
      }));
      (function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        particles.forEach(p => {
          ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
          ctx.fillStyle = `rgba(167,139,250,${p.op})`; ctx.fill();
          p.y -= p.speed; p.op -= 0.002;
          if (p.y<0||p.op<=0) { p.x=Math.random()*canvas.width; p.y=canvas.height; p.op=Math.random()*0.8+0.2; }
        });
        requestAnimationFrame(draw);
      })();
    }

    async function loadUserData() {
      const [profileResult, statsResult] = await Promise.all([
        sb.from('profiles').select('username, avatar_url, background_color, diamonds, trophies').eq('user_id', currentUser.id).maybeSingle(),
        sb.from('game_stats').select('*').eq('user_id', currentUser.id).maybeSingle()
      ]);

      let profile = profileResult.data;
      let stats   = statsResult.data;

      if (!profile) {
        const { data } = await sb.from('profiles').upsert({ user_id: currentUser.id, username: currentUser.email.split('@')[0], avatar_url: 'avatar-default.png', background_color: 'blue', diamonds: 0, trophies: 0 }, { onConflict: 'user_id' }).select().maybeSingle();
        profile = data;
      }
      if (!stats) {
        const { data } = await sb.from('game_stats').upsert({ user_id: currentUser.id, money: 1000, xp: 0, level: 1, grade: 'Docker Occasionnel', last_levelup_shown: 1 }, { onConflict: 'user_id' }).select().maybeSingle();
        stats = data;
      }
      if (!profile || !stats) return;



      document.getElementById('avatarImage').src    = profile.avatar_url;

      document.getElementById('playerName').textContent  = profile.username;
      document.getElementById('playerGrade').textContent = getGrade(stats.level || 1);

      const level = stats.level || 1, xp = stats.xp || 0;
      const xpNeeded = getXpRequired(level);
      const pct = Math.min((xp / xpNeeded) * 100, 100);
      document.getElementById('currentLevel').textContent = level;
      updateSkillTree(level);
      document.getElementById('nextLevel').textContent    = level + 1;
      document.getElementById('xpCounter').textContent   = `${xp} / ${xpNeeded} XP`;
      document.getElementById('xpFill').style.width      = pct + '%';

      document.getElementById('moneyAmount').textContent    = (stats.money || 0).toLocaleString('fr-FR') + '€';
      document.getElementById('diamondsAmount').textContent = '💎 ' + (stats.diamonds || 0);
      document.getElementById('trophiesAmount').textContent = '🏆 ' + (stats.trophies || 0);

      loadRank(stats.level || 1);
      await checkPendingLevelUp(stats, profile);
    }


    async function init() {
      const { data:{ session } } = await sb.auth.getSession();
      if (!session) { window.location.href = 'index.html'; return; }

      await loadUserData();

      const [profRes, statsRes] = await Promise.all([
        sb.from('profiles').select('username,avatar_url').eq('user_id', session.user.id).maybeSingle(),
        sb.from('game_stats').select('money,level,story_progress').eq('user_id', session.user.id).maybeSingle(),
      ]);

      const profile  = profRes.data;
      const stats    = statsRes.data;
      const progress = stats?.story_progress || {};

      // Profil
      if (profile?.avatar_url) document.getElementById('profileAvatar').src = profile.avatar_url;
      document.getElementById('profileName').textContent  = profile?.username || 'Docker';
      document.getElementById('profileSub').textContent   = progress.surnom ? `🔵 ${progress.surnom}` : 'Port de Marseille';
      document.getElementById('statMoney').textContent    = (stats?.money||0).toLocaleString('fr-FR') + '€';
      document.getElementById('statLevel').textContent    = 'Niv.' + (stats?.level||1);

      // Déblocage travailler
      if (progress.scene1_done) {
        travailUnlocked = true;
        document.getElementById('travailLock').style.display = 'none';
        document.getElementById('travailSub').textContent = 'Clicker · Tower · Pointeau';
      }

      // Badge histoire
      const badge = document.getElementById('histoireBadge');
      if (progress.scene1_done && !progress.scene2_done) {
        badge.style.display = 'block';
        badge.textContent = '🔵 CH.1 TERMINÉ · CH.2 DISPO';
      } else if (progress.scene2_done) {
        badge.style.display = 'block';
        badge.textContent = '⚡ CH.2 TERMINÉ';
      }

      initCanvas();
      await sb.from('profiles').update({ last_seen: new Date().toISOString() }).eq('user_id', session.user.id);
    }

    init();
  </script>
</body>
</html>
