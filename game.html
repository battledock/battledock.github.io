<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Battle Dock — Le Port Chelou</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Permanent+Marker&family=Space+Grotesk:wght@500;700;900&family=Bungee&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <script src="fullscreen.js"></script>
  
  <style>
    :root {
      --port-dark: #0f172a;
      --port-blue: #2563eb;
      --port-light-blue: #38bdf8;
      --comic-yellow: #facc15;
      --comic-red: #ef4444;
      --comic-green: #22c55e;
      --paper-cream: #fefce8;
      --border-thick: 4px solid #000000;
      --shadow-comic: 8px 8px 0px #000000;
      --shadow-comic-sm: 4px 4px 0px #000000;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: #ef4444;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      padding: 0;
    }

    /* --- HEADER PROFIL --- */
    .profile-header {
      background: #0f172a;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 3px solid #000;
    }

    .cards-wrapper {
      padding: 0 0 40px 0;
    }

    .profile-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .profile-avatar {
      width: 42px;
      height: 42px;
      border: 3px solid #000;
      border-radius: 10px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .profile-username {
      font-family: 'Bungee', sans-serif;
      font-size: 15px;
      color: #ffffff;
      line-height: 1;
      margin-bottom: 3px;
    }

    .profile-rank {
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .profile-money {
      background: var(--comic-yellow);
      border: 3px solid #000;
      border-radius: 8px;
      padding: 6px 14px;
      font-family: 'Bungee', sans-serif;
      font-size: 15px;
      color: #000;
      box-shadow: 3px 3px 0 #000;
    }

    /* --- INTERFACE PRINCIPALE --- */
    .ui-container {
      position: relative;
      z-index: 10;
      max-width: 540px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo {
      font-family: 'Bangers', cursive;
      font-size: clamp(4rem, 12vw, 5.5rem);
      color: var(--comic-yellow);
      letter-spacing: 4px;
      text-shadow: 6px 6px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000;
      line-height: 0.9;
      transform: rotate(-2deg);
      display: inline-block;
      margin-bottom: 6px;
    }

    .subtitle {
      font-family: 'Permanent Marker', cursive;
      font-size: clamp(1rem, 4vw, 1.3rem);
      color: #ffffff;
      text-shadow: 3px 3px 0px var(--port-dark);
    }

    /* BLOC DES STATS EN "PAPIER CRÈME COMMERCIAL" */
    .stats-crate {
      background: var(--paper-cream);
      border: var(--border-thick);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-comic);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .stat {
      text-align: center;
      background: #ffffff;
      padding: 10px 4px;
      border-radius: 12px;
      border: 3px solid #000;
      box-shadow: var(--shadow-comic-sm);
    }

    .stat-icon {
      font-size: 28px;
      margin-bottom: 2px;
      animation: bounce-stat 2s ease-in-out infinite;
    }
    .stat:nth-child(1) .stat-icon { animation-delay: 0s; }
    .stat:nth-child(2) .stat-icon { animation-delay: 0.3s; }
    .stat:nth-child(3) .stat-icon { animation-delay: 0.6s; }

    @keyframes bounce-stat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .stat-value {
      font-family: 'Bungee', sans-serif;
      font-size: 16px;
      color: var(--port-dark);
      margin-bottom: 2px;
    }

    .stat-label {
      font-size: 11px;
      color: #64748b;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* --- CARDS --- */
    .menu-buttons {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* CARD 1 — Bosser */
    .card-bosser {
      background: #0f172a;
      border: none;
      border-bottom: 3px solid #000;
      padding: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: opacity 0.1s;
    }
    .card-bosser:active { opacity: 0.8; }
    .card-bosser .card-left { display: flex; flex-direction: column; gap: 6px; }
    .card-bosser .card-tag {
      font-family: 'Bungee', sans-serif;
      font-size: 11px;
      color: var(--comic-yellow);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .card-bosser .card-title {
      font-family: 'Bangers', cursive;
      font-size: 36px;
      color: #fff;
      line-height: 1;
      letter-spacing: 2px;
    }
    .card-bosser .card-sub {
      font-size: 12px;
      color: #64748b;
      font-weight: 700;
    }
    .card-bosser .card-right {
      background: var(--comic-yellow);
      border: 3px solid #000;
      border-radius: 14px;
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      box-shadow: 4px 4px 0 #000;
      flex-shrink: 0;
    }

    /* CARD 2 — Mini-Jeux */
    .card-jeux {
      background: #ffffff;
      border: none;
      border-bottom: 3px solid #000;
      padding: 18px 18px 18px 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 16px;
      position: relative;
      overflow: hidden;
      transition: opacity 0.1s;
    }
    .card-jeux:active { opacity: 0.8; }
    .card-jeux::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 8px;
      background: #a855f7;
    }
    .card-jeux .card-emoji { font-size: 40px; }
    .card-jeux .card-info { flex: 1; }
    .card-jeux .card-title {
      font-family: 'Bungee', sans-serif;
      font-size: 18px;
      color: #0f172a;
      margin-bottom: 3px;
    }
    .card-jeux .card-sub { font-size: 12px; color: #64748b; font-weight: 700; }
    .card-jeux .card-hot {
      background: #a855f7;
      color: #fff;
      font-family: 'Bangers', cursive;
      font-size: 14px;
      padding: 4px 10px;
      border: 2px solid #000;
      border-radius: 6px;
      transform: rotate(6deg);
      box-shadow: 2px 2px 0 #000;
    }

    /* CARD 3 — Boutique */
    .card-shop {
      background: var(--comic-green);
      border: none;
      border-bottom: 3px solid #000;
      padding: 20px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: opacity 0.1s;
    }
    .card-shop:active { opacity: 0.8; }
    .card-shop::after {
      content: '👽';
      position: absolute;
      right: -10px; bottom: -10px;
      font-size: 80px;
      opacity: 0.15;
    }
    .card-shop .card-tag {
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #166534;
      margin-bottom: 4px;
    }
    .card-shop .card-title {
      font-family: 'Bangers', cursive;
      font-size: 30px;
      color: #000;
      letter-spacing: 1px;
    }
    .card-shop .card-sub { font-size: 12px; color: #166534; font-weight: 700; margin-top: 4px; }

    /* CARD 4 — Progression */
    .card-progression {
      background: #f1f5f9;
      border: none;
      border-bottom: 3px solid #000;
      padding: 18px;
      cursor: pointer;
      transition: opacity 0.1s;
    }
    .card-progression:active { opacity: 0.8; }
    .card-progression .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .card-progression .card-title {
      font-family: 'Bungee', sans-serif;
      font-size: 16px;
      color: #0f172a;
    }
    .card-progression .card-emoji { font-size: 28px; }
    .card-progression .prog-bar-bg {
      width: 100%;
      height: 10px;
      background: #cbd5e1;
      border: 2px solid #000;
      border-radius: 6px;
      overflow: hidden;
    }
    .card-progression .prog-bar-fill {
      height: 100%;
      width: 30%;
      background: #0f172a;
      border-radius: 4px;
    }
    .card-progression .card-sub {
      font-size: 11px;
      color: #64748b;
      font-weight: 700;
      margin-top: 6px;
    }

    /* CARD 5 — Classement */
    .card-classement {
      background: var(--port-blue);
      border: none;
      padding: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: opacity 0.1s;
    }
    .card-classement:active { opacity: 0.8; }
    .card-classement .card-title {
      font-family: 'Bungee', sans-serif;
      font-size: 18px;
      color: #fff;
      margin-bottom: 4px;
    }
    .card-classement .card-sub { font-size: 12px; color: #93c5fd; font-weight: 700; }
    .card-classement .card-rank-num {
      font-family: 'Bangers', cursive;
      font-size: 52px;
      color: var(--comic-yellow);
      text-shadow: 3px 3px 0 #000;
      line-height: 1;
    }

    @media (max-width: 400px) {
      .card-bosser .card-title { font-size: 28px; }
    }
  </style>
</head>
<body>

  <div class="ui-container">
    
    <div class="profile-header">
      <div class="profile-left">
        <div class="profile-avatar" id="profileAvatarBg">
          <img id="profileAvatarImg" src="notionists-1779298466584.png" alt="Avatar">
        </div>
        <div>
          <div class="profile-username" id="profileUsername">—</div>
          <div class="profile-rank" id="profileRank">Docker Occasionnel</div>
        </div>
      </div>
      <div class="profile-money" id="profileMoney">0 €</div>
    </div>

    <div class="cards-wrapper">
    <div class="menu-buttons">

      <!-- CARD 1 : Bosser -->
      <div class="card-bosser" onclick="window.location.href='travailler.html'">
        <div class="card-left">
          <div class="card-tag">Mission du jour</div>
          <div class="card-title">BOSSER</div>
          <div class="card-sub">Déplace des caisses · Gagne des €</div>
        </div>
        <div class="card-right">💼</div>
      </div>

      <!-- CARD 2 : Mini-Jeux -->
      <div class="card-jeux" onclick="window.location.href='jeux.html'">
        <div class="card-emoji">🎰</div>
        <div class="card-info">
          <div class="card-title">Mini-Jeux</div>
          <div class="card-sub">Tente ta chance au port</div>
        </div>
        <div class="card-hot">HOT</div>
      </div>

      <!-- CARD 3 : Boutique -->
      <div class="card-shop" onclick="window.location.href='shop.html'">
        <div class="card-tag">Ferretti & Co.</div>
        <div class="card-title">BOUTIQUE</div>
        <div class="card-sub">Trucs bizarres à acheter</div>
      </div>

      <!-- CARD 4 : Progression -->
      <div class="card-progression" onclick="window.location.href='progression.html'">
        <div class="card-top">
          <div class="card-title">Progression</div>
          <div class="card-emoji">📊</div>
        </div>
        <div class="prog-bar-bg"><div class="prog-bar-fill"></div></div>
        <div class="card-sub">Niveau 1 · 30% vers le prochain rang</div>
      </div>

      <!-- CARD 5 : Classement -->
      <div class="card-classement" onclick="window.location.href='classement.html'">
        <div>
          <div class="card-title">Classement</div>
          <div class="card-sub">Voir les meilleurs dockers</div>
        </div>
        <div class="card-rank-num">#?</div>
      </div>

    </div>
    </div>
  </div>



  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const supabaseClient = createClient(supabaseUrl, supabaseKey);

    const userId = localStorage.getItem('userId');
    if (!userId) window.location.href = 'index.html';

    loadUserData();

    async function loadUserData() {
      try {
        const { data: profile } = await supabaseClient
          .from('profiles')
          .select('username, color, avatar')
          .eq('user_id', userId)
          .single();

        const { data: progress } = await supabaseClient
          .from('game_progress')
          .select('money, rank')
          .eq('user_id', userId)
          .single();

        if (profile) {
          document.getElementById('profileUsername').textContent = profile.username || localStorage.getItem('username') || '—';
          const color = profile.color || '#3A4750';
          document.getElementById('profileAvatarBg').style.backgroundColor = color;
          if (profile.avatar) document.getElementById('profileAvatarImg').src = profile.avatar;
          localStorage.setItem('userColor', color);
        }

        if (progress) {
          document.getElementById('profileRank').textContent = progress.rank || 'Docker Occasionnel';
          document.getElementById('profileMoney').textContent = formatNumber(progress.money || 0) + ' €';
        }
      } catch (err) {
        console.error('Erreur:', err);
      }
    }

    function formatNumber(num) {
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
      return num.toString();
    }
  </script>
</body>
</html>
