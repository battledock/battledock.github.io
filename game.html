const W = 540, H = 960;

class MainScene extends Phaser.Scene {
  constructor(){ super('Main'); }
  preload(){
    for (const k in SPRITES) this.load.image(k, SPRITES[k]);
  }
  create(){
    this.state = {
      name: 'Amélie Leport',
      level: 5,
      xp: 45,
      xpMax: 100,
      coins: 12450,
      energy: 850,
      questsDone: 2,
      questsTotal: 5,
    };

    // Fond ciel + eau
    const sky = this.add.graphics();
    sky.fillGradientStyle(0x6cb8e8, 0x6cb8e8, 0xa8d8f0, 0xa8d8f0, 1);
    sky.fillRect(0, 0, W, 380);
    sky.fillStyle(0x2a5a8a);
    sky.fillRect(0, 380, W, 220);

    // Titre DOCKER LIFE
    this.makeTitle();

    // Barre profil
    this.makeProfileBar();

    // Décor port (docks en fond centre)
    this.add.image(W/2, 420, 'docks').setScale(1.3);

    // Bureau accueil gauche
    this.add.image(110, 470, 'bureau').setScale(0.8);
    // Comptoir droite
    this.add.image(W-110, 480, 'comptoir').setScale(0.85);

    // Navire au fond
    this.add.image(W/2+20, 365, 'navire').setScale(0.6).setAlpha(0.95);

    // Conteneurs petits décors
    this.add.image(60, 555, 'conteneurs').setScale(0.45);
    this.add.image(W-60, 560, 'conteneurs').setScale(0.4);

    // Personnages
    this.add.image(W/2, 550, 'amelie').setScale(0.85);
    this.add.image(W/2 - 120, 555, 'ouvrier_tab').setScale(0.7);
    this.add.image(W/2 + 130, 555, 'ouvrier_pro').setScale(0.7);

    // Bulle dialogue
    this.makeDialogue();

    // Bouton principal jaune ID
    this.mainBtn = this.makeMainButton();

    // 3 boutons actions
    this.makeActionButtons();

    // Quêtes quotidiennes
    this.makeDailyQuests();

    // Barre nav
    this.makeNavBar();
  }

  makeTitle(){
    const t1 = this.add.text(W/2 - 60, 16, 'DOCKER', {
      fontFamily:'Trebuchet MS', fontSize:'42px', fontStyle:'bold',
      color:'#4fc3f7', stroke:'#0a2540', strokeThickness:6
    }).setOrigin(0.5, 0);
    const t2 = this.add.text(W/2 + 70, 22, 'LIFE', {
      fontFamily:'Trebuchet MS', fontSize:'38px', fontStyle:'bold',
      color:'#ffc107', stroke:'#0a2540', strokeThickness:6
    }).setOrigin(0.5, 0);
  }

  makeProfileBar(){
    // Avatar
    const g = this.add.graphics();
    g.fillStyle(0x0a2540, 1);
    g.fillRoundedRect(15, 75, 80, 80, 10);
    g.lineStyle(3, 0x4fc3f7);
    g.strokeRoundedRect(15, 75, 80, 80, 10);
    this.add.image(55, 115, 'amelie').setScale(0.42);

    // Nom
    this.add.text(105, 80, this.state.name, { fontSize:'20px', fontStyle:'bold', color:'#fff', stroke:'#000', strokeThickness:3 });
    this.add.text(105, 105, 'Niveau '+this.state.level, { fontSize:'14px', color:'#cfe9ff' });

    // Barre XP
    const xpBg = this.add.graphics();
    xpBg.fillStyle(0x0a2540); xpBg.fillRoundedRect(105, 128, 160, 14, 6);
    this.xpBar = this.add.graphics();
    this.drawXP();
    this.add.text(108, 127, 'XP', { fontSize:'11px', color:'#fff', fontStyle:'bold' });

    // Pièces
    const cBg = this.add.graphics();
    cBg.fillStyle(0x0a2540); cBg.fillRoundedRect(W-170, 78, 155, 32, 8);
    cBg.lineStyle(2, 0xffc107); cBg.strokeRoundedRect(W-170, 78, 155, 32, 8);
    this.coinTxt = this.add.text(W-95, 94, this.state.coins.toLocaleString(), { fontSize:'18px', fontStyle:'bold', color:'#fff' }).setOrigin(0.5);
    const coin = this.add.graphics();
    coin.fillStyle(0xffc107); coin.fillCircle(W-150, 94, 10);
    coin.fillStyle(0xffe082); coin.fillCircle(W-150, 94, 7);

    // Énergie
    const eBg = this.add.graphics();
    eBg.fillStyle(0x0a2540); eBg.fillRoundedRect(W-170, 118, 155, 32, 8);
    eBg.lineStyle(2, 0x4fc3f7); eBg.strokeRoundedRect(W-170, 118, 155, 32, 8);
    this.add.text(W-155, 128, '⚡', { fontSize:'18px' });
    this.energyTxt = this.add.text(W-90, 134, this.state.energy, { fontSize:'18px', fontStyle:'bold', color:'#fff' }).setOrigin(0.5);
    this.add.text(W-30, 134, '⚓', { fontSize:'16px' }).setOrigin(0.5);
  }

  drawXP(){
    this.xpBar.clear();
    this.xpBar.fillStyle(0x4caf50);
    const w = Math.max(0, Math.min(1, this.state.xp/this.state.xpMax)) * 156;
    this.xpBar.fillRoundedRect(107, 130, w, 10, 5);
  }

  makeDialogue(){
    const g = this.add.graphics();
    g.fillStyle(0xffffff, 0.95);
    g.fillRoundedRect(30, 615, W-60, 80, 12);
    g.lineStyle(3, 0x0a2540);
    g.strokeRoundedRect(30, 615, W-60, 80, 12);
    // Icône
    const ig = this.add.graphics();
    ig.fillStyle(0x4fc3f7); ig.fillRoundedRect(45, 628, 36, 36, 6);
    this.add.text(63, 646, '💬', { fontSize:'20px' }).setOrigin(0.5);
    this.add.text(95, 625, 'Bienvenue au Port de Marseille !', { fontSize:'15px', fontStyle:'bold', color:'#0a2540' });
    this.add.text(95, 647, 'Présente tes documents pour', { fontSize:'13px', color:'#0a2540' });
    this.add.text(95, 665, 'commencer ton quart. (Shift: Matin)', { fontSize:'13px', color:'#0a2540' });
  }

  makeMainButton(){
    const x = W/2, y = 730;
    const btn = this.add.image(x, y, 'id_card').setScale(0.9).setInteractive({ useHandCursor:true });
    const label = this.add.text(x+20, y, "MONTRER L'ID & DOCUMENTS", { fontSize:'14px', fontStyle:'bold', color:'#fff', stroke:'#8a4500', strokeThickness:3 }).setOrigin(0.5);
    btn.on('pointerdown', () => {
      btn.setScale(0.85);
      this.tweens.add({ targets: btn, scale:0.9, duration:120 });
      this.gainXP(10); this.gainCoins(50); this.completeQuest();
      this.flash('+10 XP  +50 💰');
    });
    return btn;
  }

  makeActionButtons(){
    const y = 815;
    const data = [
      { x: W/2 - 165, key:'id_card', label:"MONTRER L'ID
& DOCUMENTS", action: () => { this.gainXP(8); this.gainCoins(30); this.flash('+8 XP  +30 💰'); } },
      { x: W/2,        key:'agenda', label:"CONSULTER
L'AGENDA",       action: () => { this.gainXP(5); this.flash('+5 XP'); } },
      { x: W/2 + 165, key:'formulaires', label:"COMPLÉTER LES
FORMULAIRES",   action: () => { this.gainXP(12); this.gainCoins(80); this.flash('+12 XP  +80 💰'); } },
    ];
    data.forEach(d => {
      const img = this.add.image(d.x, y, d.key).setScale(0.7).setInteractive({ useHandCursor:true });
      this.add.text(d.x, y+70, d.label, { fontSize:'11px', fontStyle:'bold', color:'#fff', align:'center', stroke:'#000', strokeThickness:2 }).setOrigin(0.5);
      img.on('pointerdown', () => {
        img.setScale(0.65);
        this.tweens.add({ targets: img, scale:0.7, duration:120 });
        d.action();
      });
    });
  }

  makeDailyQuests(){
    this.questTxt = this.add.text(W/2 - 80, 870, '', { fontSize:'13px', fontStyle:'bold', color:'#fff', stroke:'#000', strokeThickness:2 }).setOrigin(0.5);
    this.refreshQuestText();
  }

  refreshQuestText(){
    this.questTxt.setText('Quêtes Quotidiennes: ' + this.state.questsDone + '/' + this.state.questsTotal);
  }

  makeNavBar(){
    const y = H - 35;
    const items = [
      { key:'nav_accueil', label:'ACCUEIL' },
      { key:'nav_joueur',  label:'JOUEUR' },
      { key:'nav_missions',label:'MISSIONS' },
      { key:'nav_commerce',label:'COMMERCE' },
      { key:'nav_reglages',label:'RÉGLAGES' },
    ];
    const bg = this.add.graphics();
    bg.fillStyle(0x0a2540, 0.95);
    bg.fillRect(0, H-75, W, 75);
    bg.lineStyle(2, 0x4fc3f7);
    bg.strokeRect(0, H-75, W, 75);

    const step = W / items.length;
    items.forEach((it, i) => {
      const x = step*(i+0.5);
      const img = this.add.image(x, y-15, it.key).setScale(0.55).setInteractive({ useHandCursor:true });
      this.add.text(x, y+20, it.label, { fontSize:'10px', fontStyle:'bold', color:'#fff' }).setOrigin(0.5);
      img.on('pointerdown', () => {
        this.tweens.add({ targets: img, scale:0.5, duration:80, yoyo:true });
        this.flash(it.label);
      });
    });
  }

  gainXP(n){
    this.state.xp += n;
    while (this.state.xp >= this.state.xpMax){
      this.state.xp -= this.state.xpMax;
      this.state.level++;
      this.state.xpMax = Math.round(this.state.xpMax * 1.2);
      this.flash('🎉 Niveau '+this.state.level+' !');
    }
    this.drawXP();
  }

  gainCoins(n){
    this.state.coins += n;
    this.coinTxt.setText(this.state.coins.toLocaleString());
  }

  completeQuest(){
    if (this.state.questsDone < this.state.questsTotal){
      this.state.questsDone++;
      this.refreshQuestText();
    }
  }

  flash(msg){
    const t = this.add.text(W/2, H/2, msg, {
      fontSize:'24px', fontStyle:'bold', color:'#ffc107',
      stroke:'#000', strokeThickness:5, backgroundColor:'#0a2540aa', padding:{x:14,y:8}
    }).setOrigin(0.5).setDepth(1000);
    this.tweens.add({ targets:t, y:H/2 - 80, alpha:0, duration:900, onComplete:()=>t.destroy() });
  }
}

const config = {
  type: Phaser.AUTO,
  width: W,
  height: H,
  parent: 'game',
  backgroundColor: '#1a2533',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: MainScene
};

new Phaser.Game(config);
</script>
</body>
</html>
