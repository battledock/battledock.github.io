<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Battle Dock - Jeu</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Space+Grotesk:wght@500;700;900&family=Bungee&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  
  <style>
    :root {
      --port-dark: #0f172a;
      --comic-yellow: #facc15;
      --comic-red: #ef4444;
      --comic-green: #22c55e;
      --comic-blue: #3b82f6;
      --border-thick: 4px solid #000000;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 50%, #3b82f6 100%);
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }

    .game-container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    /* BANDEAU COUNTDOWN */
    .countdown-banner {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      border: var(--border-thick);
      border-radius: 16px;
      padding: 12px 16px;
      margin-bottom: 12px;
      box-shadow: 6px 6px 0px #000000;
      animation: pulse 2s ease-in-out infinite;
    }

    .countdown-text {
      font-family: 'Bungee', sans-serif;
      font-size: 14px;
      color: white;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 2px 2px 0 #000;
      line-height: 1.4;
    }

    .countdown-timer {
      font-family: 'Bangers', cursive;
      font-size: 22px;
      color: var(--comic-yellow);
      text-align: center;
      margin-top: 6px;
      text-shadow: 3px 3px 0 #000;
      letter-spacing: 2px;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 6px 6px 0px #000000; }
      50% { transform: scale(1.02); box-shadow: 8px 8px 0px #000000; }
    }

    .player-header {
      background: #e2e8f0;
      border: var(--border-thick);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .avatar-container {
      width: 80px;
      height: 80px;
      border: var(--border-thick);
      border-radius: 50%;
      overflow: hidden;
      background: white;
      flex-shrink: 0;
    }

    .avatar-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .player-info {
      flex: 1;
      min-width: 0;
    }

    .player-username {
      font-family: 'Bangers', cursive;
      font-size: 24px;
      color: var(--port-dark);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-money {
      font-family: 'Bungee', sans-serif;
      font-size: 20px;
      color: var(--comic-green);
      margin-bottom: 2px;
    }

    .grade-card {
      background: #e2e8f0;
      border: var(--border-thick);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
    }

    /* BOUTON TRAVAILLER PRINCIPAL */
    .work-btn {
      width: 100%;
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      border: var(--border-thick);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      cursor: pointer;
      box-shadow: 0 6px 0 #16a34a;
      transition: all 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .work-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #16a34a;
    }

    .work-btn-icon {
      font-size: 32px;
      line-height: 1;
    }

    .work-btn-main {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .work-btn-text {
      font-family: 'Bangers', cursive;
      font-size: 24px;
      color: white;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 2px 2px 0 #000;
      line-height: 1;
    }

    .work-btn-subtitle {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
      color: rgba(255,255,255,0.9);
      font-weight: 600;
      line-height: 1;
    }

    .grade-card {
      background: #e2e8f0;
      border: var(--border-thick);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .grade-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .grade-title {
      font-family: 'Bangers', cursive;
      font-size: 22px;
      color: var(--port-dark);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .grade-level {
      font-family: 'Bungee', sans-serif;
      font-size: 18px;
      color: #3b82f6;
    }

    .grade-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: #475569;
      margin-bottom: 12px;
    }

    .progress-container {
      background: #cbd5e1;
      border: var(--border-thick);
      border-radius: 10px;
      height: 32px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar {
      background: linear-gradient(90deg, var(--comic-yellow) 0%, #fb923c 100%);
      height: 100%;
      transition: width 0.3s ease;
      position: relative;
    }

    .progress-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Bungee', sans-serif;
      font-size: 12px;
      color: var(--port-dark);
      font-weight: 700;
      text-shadow: 1px 1px 0px #fff;
      z-index: 1;
    }

    .logout-btn {
      background: var(--comic-red);
      color: white;
      border: var(--border-thick);
      border-radius: 12px;
      padding: 14px 20px;
      font-family: 'Bungee', sans-serif;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      cursor: pointer;
      box-shadow: 6px 6px 0px #000000;
      transition: all 0.15s ease;
      width: 100%;
      border-bottom: none;
    }

    .logout-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 8px 8px 0px #000000;
    }

    .logout-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #000000;
    }

    @media (max-width: 400px) {
      .countdown-text {
        font-size: 12px;
      }
      
      .countdown-timer {
        font-size: 18px;
      }

      .work-btn-icon {
        font-size: 28px;
      }

      .work-btn-text {
        font-size: 20px;
      }

      .work-btn-subtitle {
        font-size: 11px;
      }

      .player-header {
        padding: 16px;
      }

      .avatar-container {
        width: 70px;
        height: 70px;
      }

      .player-username {
        font-size: 20px;
      }

      .player-money {
        font-size: 18px;
      }

      .grade-title {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <!-- BANDEAU COUNTDOWN -->
    <div class="countdown-banner" id="countdownBanner">
      <div class="countdown-text">🚀 Lancement du jeu aujourd'hui à 20H00 !</div>
      <div class="countdown-timer" id="countdownTimer">--:--:--</div>
    </div>

    <div class="player-header">
      <div class="avatar-container">
        <img src="avatar-default.png" alt="Avatar" id="avatarImage">
      </div>
      <div class="player-info">
        <div class="player-username" id="playerUsername">...</div>
        <div class="player-money" id="playerMoney">0 €</div>
      </div>
    </div>

    <div class="grade-card">
      <div class="grade-header">
        <div class="grade-title">GRADE</div>
        <div class="grade-level" id="playerLevel">Niv. 1</div>
      </div>
      <div class="grade-name" id="playerGrade">Docker Occasionnel</div>
      <div class="progress-container">
        <div class="progress-bar" id="progressBar" style="width: 0%"></div>
        <div class="progress-text" id="progressText">0 / 100 XP</div>
      </div>
    </div>

    <!-- BOUTON TRAVAILLER -->
    <button class="work-btn" onclick="startWorking()">
      <div class="work-btn-icon">💼</div>
      <div class="work-btn-main">
        <div class="work-btn-text">TRAVAILLER</div>
        <div class="work-btn-subtitle">Gagner des €</div>
      </div>
    </button>

    <button class="logout-btn" onclick="logout()">DÉCONNEXION</button>
  </div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const sb = createClient(supabaseUrl, supabaseKey);

    let currentUser = null;

    async function loadProfile() {
      const { data: { session } } = await sb.auth.getSession();
      
      if (!session) {
        window.location.href = 'index.html';
        return;
      }

      currentUser = session.user;

      const { data: profile } = await sb
        .from('profiles')
        .select('username, avatar_url')
        .eq('user_id', currentUser.id)
        .single();

      if (profile) {
        document.getElementById('playerUsername').textContent = profile.username;
        document.getElementById('avatarImage').src = profile.avatar_url;
      }

      const { data: stats } = await sb
        .from('game_stats')
        .select('money, level, xp, grade')
        .eq('user_id', currentUser.id)
        .single();

      if (stats) {
        const xpNeeded = stats.level * 100;
        
        updatePlayerStats({
          money: stats.money,
          level: stats.level,
          xp: stats.xp,
          xpNeeded: xpNeeded,
          grade: stats.grade
        });
      }
    }

    function updatePlayerStats(stats) {
      document.getElementById('playerMoney').textContent = stats.money + ' €';
      document.getElementById('playerLevel').textContent = 'Niv. ' + stats.level;
      document.getElementById('playerGrade').textContent = stats.grade;
      
      const progressPercent = Math.min((stats.xp / stats.xpNeeded) * 100, 100);
      document.getElementById('progressBar').style.width = progressPercent + '%';
      document.getElementById('progressText').textContent = stats.xp + ' / ' + stats.xpNeeded + ' XP';
    }

    async function logout() {
      await sb.auth.signOut();
      window.location.href = 'index.html';
    }

    function startWorking() {
      alert('Fonctionnalité à venir ! Les mini-jeux arrivent bientôt 🎮');
      // TODO: Rediriger vers l'onglet Travail ou lancer un mini-jeu
    }

    loadProfile();

    // COUNTDOWN TIMER
    function updateCountdown() {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 20, 0, 0); // Aujourd'hui 20h00
      
      // Si on a dépassé 20h aujourd'hui, cacher le bandeau
      if (now > today) {
        const banner = document.getElementById('countdownBanner');
        if (banner) banner.style.display = 'none';
        return;
      }
      
      const diff = today - now;
      
      const hours = Math.floor(diff / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);
      
      const timerElement = document.getElementById('countdownTimer');
      if (timerElement) {
        timerElement.textContent = 
          String(hours).padStart(2, '0') + ':' + 
          String(minutes).padStart(2, '0') + ':' + 
          String(seconds).padStart(2, '0');
      }
    }
    
    // Mettre à jour toutes les secondes
    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
