<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Battle Dock — Le Port Chelou</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Permanent+Marker&family=Space+Grotesk:wght@500;700;900&family=Bungee&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <script src="fullscreen.js"></script>
  
  <style>
    :root {
      --port-dark: #0f172a;
      --port-blue: #2563eb;
      --port-light-blue: #38bdf8;
      --comic-yellow: #facc15;
      --comic-orange: #f97316;
      --comic-red: #ef4444;
      --comic-green: #22c55e;
      --panel-bg: #1e293b;
      --border-thick: 3px solid #000000;
      --shadow-comic: 6px 6px 0px #000000;
      --shadow-comic-sm: 4px 4px 0px #000000;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: #ef4444;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      padding: 0;
    }

    .ui-container {
      position: relative;
      z-index: 10;
      max-width: 540px;
      margin: 0 auto;
    }

    /* --- HEADER RPG --- */
    .rpg-header {
      background: var(--port-dark);
      border-bottom: 4px solid #000;
      padding: 16px 16px;
      display: grid;
      grid-template-columns: 1fr 125px;
      gap: 10px;
      align-items: center;
    }

    .profile-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--panel-bg);
      border: var(--border-thick);
      border-radius: 14px;
      padding: 10px;
    }

    .avatar-holder {
      width: 84px;
      height: 84px;
      background: #3A4750;
      border: 3px solid #000;
      border-radius: 10px;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: var(--shadow-comic-sm);
    }

    .avatar-holder img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .profile-details {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .username-txt {
      font-family: 'Bungee', sans-serif;
      font-size: 15px;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rank-txt {
      font-size: 10px;
      font-weight: 900;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .xp-container {
      margin-top: 4px;
    }
    .xp-bar-bg {
      width: 100%;
      height: 8px;
      background: #0f172a;
      border: 2px solid #000;
      border-radius: 4px;
      overflow: hidden;
    }
    .xp-bar-fill {
      width: 0%;
      height: 100%;
      background: var(--comic-green);
    }

    .header-counters {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .counter-box {
      background: #0f172a;
      border: var(--border-thick);
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 900;
      font-size: 14px;
    }

    .counter-box.money { 
      background: var(--comic-yellow); 
      color: #000;
      box-shadow: 3px 3px 0 #000;
    }
    .counter-box.energy { 
      background: #ffffff;
      color: var(--port-dark); 
      box-shadow: 3px 3px 0 #000;
    }

    /* --- ZONE DES BOUTONS / EN VRAIS BLOCS RPG DIRECTEMENT COLLÉS --- */
    .cards-wrapper {
      padding: 12px 16px 40px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px; /* Un petit écart propre style grille de jeu mobile */
    }

    /* --- BOUTON DE TRAVAIL XXL ET ULTRA STYLISÉ --- */
    .card-bosser-xxl {
      background: linear-gradient(135deg, var(--comic-yellow) 0%, var(--comic-orange) 100%);
      border: var(--border-thick);
      border-radius: 16px;
      padding: 24px 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-comic);
      position: relative;
      overflow: hidden;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .card-bosser-xxl:active {
      transform: translate(2px, 2px);
      box-shadow: var(--shadow-comic-sm);
    }
    .card-bosser-xxl .card-left { display: flex; flex-direction: column; gap: 2px; z-index: 2;}
    
    .card-bosser-xxl .card-tag {
      font-family: 'Bungee', sans-serif;
      font-size: 11px;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 10px;
      border-radius: 20px;
      display: inline-block;
      align-self: flex-start;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      animation: pulse 1.5s infinite ease-in-out;
    }
    .card-bosser-xxl .card-title {
      font-family: 'Bangers', cursive;
      font-size: 54px; /* Rendue encore plus grande et percutante */
      color: #fff;
      line-height: 1;
      letter-spacing: 3px;
      text-shadow: 4px 4px 0px #000;
    }
    .card-bosser-xxl .card-sub {
      font-size: 14px;
      color: #000;
      font-weight: 900;
      text-shadow: 1px 1px 0px rgba(255,255,255,0.4);
    }
    .card-bosser-xxl .card-right {
      background: var(--port-dark);
      border: 3px solid #000;
      border-radius: 50%;
      width: 76px;
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      box-shadow: var(--shadow-comic-sm);
      flex-shrink: 0;
      z-index: 2;
    }

    /* --- GRILLE DES AUTRES BLOCS EN ANTHRACITE (STYLE COMPAGNON DU HEADER) --- */
    .rpg-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .rpg-menu-card {
      background: var(--panel-bg);
      border: var(--border-thick);
      border-radius: 14px;
      padding: 16px;
      cursor: pointer;
      box-shadow: var(--shadow-comic);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 120px;
      position: relative;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .rpg-menu-card:active {
      transform: translate(2px, 2px);
      box-shadow: var(--shadow-comic-sm);
    }

    .rpg-menu-card .card-emoji {
      font-size: 32px;
      margin-bottom: 8px;
    }
    .rpg-menu-card .card-title {
      font-family: 'Bungee', sans-serif;
      font-size: 15px;
      color: #ffffff;
      line-height: 1.2;
    }
    .rpg-menu-card .card-sub {
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      margin-top: 2px;
    }

    /* Exceptions de badges / détails spécifiques aux mini-blocs */
    .rpg-menu-card .card-hot {
      position: absolute;
      top: 10px; right: 10px;
      background: var(--comic-red);
      color: #fff;
      font-family: 'Bangers', cursive;
      font-size: 12px;
      padding: 2px 8px;
      border: 2px solid #000;
      border-radius: 6px;
      transform: rotate(10deg);
    }

    /* BLOC TECHNIQUE DE PROGRESSION LARGEUR COMPLÈTE (FAÇON BLOC CARD) */
    .rpg-full-card {
      background: var(--panel-bg);
      border: var(--border-thick);
      border-radius: 14px;
      padding: 16px;
      cursor: pointer;
      box-shadow: var(--shadow-comic);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .rpg-full-card .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .rpg-full-card .card-title {
      font-family: 'Bungee', sans-serif;
      font-size: 14px;
      color: #ffffff;
    }
    .rpg-full-card .prog-bar-bg {
      width: 100%; height: 12px;
      background: #0f172a;
      border: 2px solid #000;
      border-radius: 6px;
      overflow: hidden;
    }
    .rpg-full-card .prog-bar-fill {
      height: 100%; width: 30%;
      background: var(--comic-yellow);
    }
    .rpg-full-card .card-sub {
      font-size: 11px; color: #94a3b8; font-weight: 700;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(0.95); }
    }

    @media (max-width: 400px) {
      .card-bosser-xxl .card-title { font-size: 40px; }
      .card-bosser-xxl .card-right { width: 60px; height: 60px; font-size: 30px; }
    }
  </style>
</head>
<body>

  <div class="ui-container">
    
    <div class="rpg-header">
      <div class="profile-card">
        <div class="avatar-holder" id="profileAvatarBg">
          <img id="profileAvatarImg" src="notionists-1779298466584.png" alt="Avatar">
        </div>
        <div class="profile-details">
          <div class="username-txt" id="profileUsername">—</div>
          <div class="rank-txt" id="profileRank">Docker Occasionnel</div>
          <div class="xp-container">
            <div class="xp-bar-bg"><div class="xp-bar-fill"></div></div>
          </div>
        </div>
      </div>
      
      <div class="header-counters">
        <div class="counter-box money">
          <span id="profileMoney">0 €</span> <span class="counter-icon">💶</span>
        </div>
        <div class="counter-box energy">
          <span>100%</span> <span class="counter-icon">⚡</span>
        </div>
      </div>
    </div>

    <div class="cards-wrapper">

      <div class="card-bosser-xxl" onclick="window.location.href='travailler.html'">
        <div class="card-left">
          <div class="card-tag">Quart Disponible</div>
          <div class="card-title">TRAVAILLER</div>
          <div class="card-sub">Déplace des caisses · Récupère ton cash</div>
        </div>
        <div class="card-right">💼</div>
      </div>

      <div class="rpg-grid">
        
        <div class="rpg-menu-card" onclick="window.location.href='jeux.html'">
          <div class="card-hot">HOT</div>
          <div class="card-emoji">🎰</div>
          <div>
            <div class="card-title">Mini-Jeux</div>
            <div class="card-sub">Flambe au casino</div>
          </div>
        </div>

        <div class="rpg-menu-card" onclick="window.location.href='shop.html'">
          <div class="card-emoji">🛒</div>
          <div>
            <div class="card-title">Boutique</div>
            <div class="card-sub">Marché noir du port</div>
          </div>
        </div>

        <div class="rpg-menu-card" onclick="window.location.href='social.html'">
          <div class="card-emoji">🥂</div>
          <div>
            <div class="card-title">Vie Privée</div>
            <div class="card-sub">Mariages & Amour</div>
          </div>
        </div>

        <div class="rpg-menu-card" onclick="window.location.href='classement.html'">
          <div class="card-emoji">🏆</div>
          <div>
            <div class="card-title">Classement</div>
            <div class="card-sub">Top des Dockers</div>
          </div>
        </div>

      </div>

      <div class="rpg-full-card" onclick="window.location.href='progression.html'">
        <div class="card-top">
          <div class="card-title">Niveau & Rang</div>
          <span style="font-size: 20px;">📊</span>
        </div>
        <div class="prog-bar-bg"><div class="prog-bar-fill"></div></div>
        <div class="card-sub">Niveau 1 · 30% d'effort avant la promotion</div>
      </div>

    </div>
  </div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const supabaseClient = createClient(supabaseUrl, supabaseKey);

    const userId = localStorage.getItem('userId');
    if (!userId) window.location.href = 'index.html';

    loadUserData();

    async function loadUserData() {
      try {
        const { data: profile } = await supabaseClient
          .from('profiles')
          .select('username, color, avatar')
          .eq('user_id', userId)
          .single();

        const { data: progress } = await supabaseClient
          .from('game_progress')
          .select('money, rank')
          .eq('user_id', userId)
          .single();

        if (profile) {
          document.getElementById('profileUsername').textContent = profile.username || localStorage.getItem('username') || '—';
          const color = profile.color || '#3A4750';
          document.getElementById('profileAvatarBg').style.backgroundColor = color;
          if (profile.avatar) document.getElementById('profileAvatarImg').src = profile.avatar;
          localStorage.setItem('userColor', color);
        }

        if (progress) {
          document.getElementById('profileRank').textContent = progress.rank || 'Docker Occasionnel';
          document.getElementById('profileMoney').textContent = formatNumber(progress.money || 0) + ' €';
        }
      } catch (err) {
        console.error('Erreur:', err);
      }
    }

    function formatNumber(num) {
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
      return num.toString();
    }
  </script>
</body>
</html>
