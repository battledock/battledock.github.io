<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0a4d68">
  <title>Battle Dock — Marseille</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Special+Elite&family=Pirata+One&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    :root{
      --port-blue: #0a4d68;
      --port-blue-deep: #062c3e;
      --port-blue-light: #1a7a9e;
      --sea: #2b8aa6;
      --sky: #c8e6f0;
      --sand: #e8d8b0;
      --concrete: #b9b3a3;
      --concrete-dk: #6e6a5e;
      --rust: #b65d2e;
      --crane: #f4b13c;
      --crane-dk: #c8861a;
      --om-blue: #2e9bd4;
      --om-white: #fafbfc;
      --pastis: #d4d878;
      --red: #c0392b;
      --green: #4a7c2a;
      --ink: #1a1a1a;
      --paper: #f4ead0;
      --paper-dk: #d9c896;
      --gold: #e8c547;
      --shadow-hard: 4px 4px 0 #000;
      --shadow-med: 3px 3px 0 #000;
      --shadow-soft: 2px 2px 0 rgba(0,0,0,.5);
    }

    *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
    html, body{height:100%; overflow:hidden; overscroll-behavior:none}
    body{
      font-family:'Special Elite', 'Courier New', monospace;
      color:var(--ink);
      background:var(--port-blue-deep);
      user-select:none;
      -webkit-user-select:none;
      touch-action:manipulation;
    }
    button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit }

    #app{
      position:fixed; inset:0;
      display:flex; flex-direction:column;
      max-width:600px; margin:0 auto;
      background:linear-gradient(180deg, #87ceeb 0%, #c8e6f0 30%, #2b8aa6 30%, #0a4d68 100%);
      overflow:hidden;
    }

    /* ===== TOPBAR ===== */
    .topbar{
      position:relative; z-index:10;
      display:flex; align-items:center; gap:8px;
      padding:8px 12px 6px;
      background:linear-gradient(180deg, rgba(6,44,62,.95), rgba(6,44,62,.85));
      border-bottom:3px solid var(--crane);
      box-shadow:0 2px 0 var(--ink), 0 4px 12px rgba(0,0,0,.4);
      flex-wrap:wrap;
    }
    .topbar .avatar-mini{
      width:44px; height:44px;
      background:var(--paper);
      border:3px solid var(--ink);
      box-shadow:var(--shadow-soft);
      border-radius:8px;
      display:flex; align-items:center; justify-content:center;
      font-size:28px;
      flex-shrink:0;
    }
    .topbar .who{ flex:1; min-width:0 }
    .topbar .blaze{
      font-family:'Bebas Neue', sans-serif;
      font-size:17px; letter-spacing:1px; line-height:1;
      color:var(--paper); text-shadow:1px 1px 0 #000;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .topbar .grade{
      font-size:10px; color:var(--crane); margin-top:1px; text-shadow:1px 1px 0 #000;
    }
    .topbar .money{
      font-family:'Bebas Neue', sans-serif;
      font-size:20px; color:var(--gold);
      text-shadow:2px 2px 0 #000;
      text-align:right; line-height:1;
    }
    .topbar .money small{ font-size:10px; color:var(--paper); display:block; letter-spacing:.5px }
    
    .topbar-stats{
      width:100%; display:flex; gap:0;
      border-top:1px solid rgba(244,177,60,.2);
      margin-top:4px; padding-top:4px;
    }
    .topbar-stat{
      flex:1; display:flex; flex-direction:column; align-items:center;
      border-right:1px solid rgba(255,255,255,.08);
      padding:0 4px;
    }
    .topbar-stat:last-child{ border-right:none; }
    .topbar-stat-lbl{
      font-family:'Special Elite',monospace;
      font-size:8px; color:rgba(255,255,255,.4);
      letter-spacing:1px; text-transform:uppercase;
    }
    .topbar-stat-val{
      font-family:'Bebas Neue',sans-serif;
      font-size:13px; color:var(--paper);
      letter-spacing:.5px; line-height:1;
    }

    /* ===== MAIN CONTENT ===== */
    main{
      flex:1; overflow-y:auto; overflow-x:hidden;
      -webkit-overflow-scrolling:touch;
      background:#f8f9fa;
      padding:16px 16px 80px;
    }

    .tab-content{ display:none }
    .tab-content.active{ display:block }

    /* ===== TABBAR ===== */
    .tabbar{
      position:relative; z-index:20;
      display:grid; grid-template-columns:repeat(5,1fr); gap:0;
      background:#ffffff;
      border-top:1px solid #e0d8cc;
      box-shadow:0 -2px 8px rgba(0,0,0,.08);
      padding-bottom:env(safe-area-inset-bottom, 0);
    }
    .tabbar button{
      position:relative;
      padding:7px 1px 5px;
      display:flex; flex-direction:column; align-items:center; gap:1px;
      color:#8a7a6a; opacity:1;
      transition:color .15s, transform .1s;
      font-family:'Bebas Neue', sans-serif;
      font-size:9px; letter-spacing:.5px;
    }
    .tabbar button .ic{ font-size:18px; line-height:1 }
    .tabbar button.on{ color:var(--port-blue-deep); }
    .tabbar button.on::before{
      content:''; position:absolute; top:0; left:20%; right:20%; height:2px;
      background:var(--crane);
    }
    .tabbar button:active{ transform:scale(.95) }

    /* ===== CONTRACT CARDS ===== */
    .contract-card{
      background:#fff;
      border-radius:12px;
      padding:16px;
      margin-bottom:12px;
      border:2px solid #e0d8cc;
      box-shadow:0 2px 4px rgba(0,0,0,.08);
    }
    .contract-header{
      display:flex; justify-content:space-between; align-items:center;
      margin-bottom:8px;
    }
    .contract-name{
      font-family:'Bebas Neue', sans-serif;
      font-size:16px;
      letter-spacing:1px;
      color:var(--port-blue-deep);
    }
    .contract-company{
      font-size:11px;
      color:#666;
    }
    .contract-rewards{
      display:flex; gap:12px; margin-top:8px;
    }
    .reward{
      font-family:'Bebas Neue', sans-serif;
      font-size:14px;
      color:var(--crane-dk);
    }
    .btn-complete{
      width:100%;
      margin-top:12px;
      padding:12px;
      background:var(--crane);
      color:var(--ink);
      border:3px solid var(--ink);
      border-radius:8px;
      font-family:'Bebas Neue', sans-serif;
      font-size:16px;
      letter-spacing:1px;
      cursor:pointer;
      box-shadow:3px 3px 0 var(--ink);
      transition:transform .1s;
    }
    .btn-complete:active{
      transform:translate(3px, 3px);
      box-shadow:none;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- TOPBAR -->
    <div class="topbar">
      <div class="avatar-mini" id="topAvatar">⚓</div>
      <div class="who">
        <div class="blaze" id="topUsername">Docker</div>
        <div class="grade" id="topRank">Docker Occasionnel</div>
      </div>
      <div class="money">
        <span id="topMoney">100</span>€
        <small>Budget</small>
      </div>
      
      <div class="topbar-stats">
        <div class="topbar-stat">
          <div class="topbar-stat-lbl">Niveau</div>
          <div class="topbar-stat-val" id="topLevel">1</div>
        </div>
        <div class="topbar-stat">
          <div class="topbar-stat-lbl">XP</div>
          <div class="topbar-stat-val" id="topXP">0/1000</div>
        </div>
        <div class="topbar-stat">
          <div class="topbar-stat-lbl">Contrats</div>
          <div class="topbar-stat-val" id="topContracts">0</div>
        </div>
      </div>
    </div>

    <!-- MAIN CONTENT -->
    <main>
      <div id="dock-content" class="tab-content active">
        <div id="contracts-list">
          <p style="text-align:center; color:#666;">Chargement...</p>
        </div>
      </div>

      <div id="classement-content" class="tab-content">
        <div id="leaderboard-list">
          <p style="text-align:center; color:#666;">Chargement...</p>
        </div>
      </div>

      <div id="carriere-content" class="tab-content">
        <p style="text-align:center; color:#666;">Page Carrière</p>
      </div>

      <div id="joliette-content" class="tab-content">
        <p style="text-align:center; color:#666;">Page Joliette</p>
      </div>

      <div id="profile-content" class="tab-content">
        <p style="text-align:center; color:#666;">Page Profil</p>
      </div>
    </main>

    <!-- TABBAR -->
    <nav class="tabbar">
      <button data-tab="carriere"><span class="ic">📊</span><span>Carrière</span></button>
      <button data-tab="classement"><span class="ic">🏆</span><span>Classement</span></button>
      <button data-tab="dock" class="on"><span class="ic">📦</span><span>Mon Quai</span></button>
      <button data-tab="joliette"><span class="ic">🏢</span><span>Joliette</span></button>
      <button data-tab="profile"><span class="ic">👤</span><span>Profil</span></button>
    </nav>
  </div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const supabaseClient = createClient(supabaseUrl, supabaseKey);

    const userId = localStorage.getItem('userId');
    const username = localStorage.getItem('username');

    if (!userId) {
      window.location.href = 'index.html';
    }

    // Navigation
    document.querySelectorAll('.tabbar button').forEach(btn => {
      btn.addEventListener('click', () => {
        const tab = btn.dataset.tab;

        // Redirections vers pages externes
        if (tab === 'carriere') {
          window.location.href = 'carriere.html';
          return;
        }
        if (tab === 'classement') {
          window.location.href = 'classement.html';
          return;
        }
        if (tab === 'joliette') {
          window.location.href = 'joliette.html';
          return;
        }
        if (tab === 'profile') {
          window.location.href = 'profil.html';
          return;
        }

        // Changement d'onglet interne
        document.querySelectorAll('.tabbar button').forEach(b => b.classList.remove('on'));
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        
        btn.classList.add('on');
        document.getElementById(tab + '-content').classList.add('active');
      });
    });

    // Chargement initial
    loadPlayerData();
    loadContracts();

    async function loadPlayerData() {
      const { data: progressArray } = await supabaseClient
        .from('game_progress')
        .select('*')
        .eq('user_id', userId);

      const { data: profileArray } = await supabaseClient
        .from('profiles')
        .select('*')
        .eq('user_id', userId);

      if (progressArray && progressArray[0] && profileArray && profileArray[0]) {
        const progress = progressArray[0];
        const profile = profileArray[0];

        document.getElementById('topAvatar').textContent = profile.avatar_url || '⚓';
        document.getElementById('topUsername').textContent = profile.username || username;
        document.getElementById('topRank').textContent = progress.rank || 'Docker Occasionnel';
        document.getElementById('topMoney').textContent = progress.money || 100;
        document.getElementById('topLevel').textContent = progress.level || 1;
        
        const requiredXP = Math.round(1000 * Math.pow(1.1, (progress.level || 1) - 1));
        document.getElementById('topXP').textContent = `${progress.xp || 0}/${requiredXP}`;
        document.getElementById('topContracts').textContent = progress.contracts_completed || 0;
      }
    }

    async function loadContracts() {
      const { data: contracts } = await supabaseClient
        .from('contracts')
        .select('*')
        .order('reward_money', { ascending: true });

      const list = document.getElementById('contracts-list');
      list.innerHTML = '';

      if (!contracts || contracts.length === 0) {
        list.innerHTML = '<p style="text-align:center; color:#666;">Aucun contrat disponible</p>';
        return;
      }

      contracts.forEach(contract => {
        const card = document.createElement('div');
        card.className = 'contract-card';
        card.innerHTML = `
          <div class="contract-header">
            <div class="contract-name">${contract.name}</div>
          </div>
          <div class="contract-company">${contract.company}</div>
          <div style="font-size:12px; color:#666; margin-top:8px;">${contract.description}</div>
          <div class="contract-rewards">
            <div class="reward">💰 ${contract.reward_money}€</div>
            <div class="reward">⭐ ${contract.reward_xp} XP</div>
          </div>
          <button class="btn-complete" onclick="completeContract(${contract.id}, ${contract.reward_money}, ${contract.reward_xp})">
            Compléter le Contrat
          </button>
        `;
        list.appendChild(card);
      });
    }

    async function completeContract(contractId, money, xp) {
      const { data: progressArray } = await supabaseClient
        .from('game_progress')
        .select('*')
        .eq('user_id', userId);

      if (!progressArray || !progressArray[0]) return;

      const current = progressArray[0];
      const newMoney = (current.money || 100) + money;
      const newXP = (current.xp || 0) + xp;
      const newContracts = (current.contracts_completed || 0) + 1;

      await supabaseClient
        .from('game_progress')
        .update({
          money: newMoney,
          xp: newXP,
          contracts_completed: newContracts
        })
        .eq('user_id', userId);

      alert(`✅ Contrat complété !\n💰 +${money}€\n⭐ +${xp} XP`);
      loadPlayerData();
    }
  </script>
</body>
</html>
