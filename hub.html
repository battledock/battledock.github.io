<!DOCTYPE html><html lang='fr'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover'><meta name='theme-color' content='#0D2438'><title>BattleDock 2</title><link rel='preconnect' href='https://fonts.googleapis.com'><link rel='preconnect' href='https://fonts.gstatic.com' crossorigin><link href='https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Nunito:wght@600;700;800;900&family=Caveat:wght@600;700&display=swap' rel='stylesheet'><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;overflow:hidden;font-family:'Nunito',sans-serif}
/* ══════════════════════════════════════════════════════════════
   BD2 DESIGN SYSTEM
   Illustration méditerranéenne moderne, détails nautiques discrets
   ══════════════════════════════════════════════════════════════ */

/* ── 1. PALETTE ── */
:root{
  --ink:var(--ink);
  --sea:#1E88A4;
  --gold:var(--gold);
  --coral:#FF6A4E;
  --ivory:#F7F1E5;
  --night:var(--night);
  --success:#3E8C76;
  --danger:var(--danger);
  --sand:#D7BE93;
  /* dérivées */
  --gold-light:var(--gold-light);
  --gold-dark:var(--gold-dark);
  --sea-light:#7EC4E8;
  --sea-dark:#14667A;
  --ink-50:rgba(13,36,56,.5);
  --ink-20:rgba(13,36,56,.2);
  --ink-08:rgba(13,36,56,.08);
  --white-80:rgba(255,255,255,.8);
  --white-50:rgba(255,255,255,.5);
  --white-20:rgba(255,255,255,.2);
  --white-08:rgba(255,255,255,.08);
  /* typographie */
  --f-titre:'Fraunces',serif;
  --f-corps:'Nunito',sans-serif;
  --f-main:'Caveat',cursive;
  /* durées d'animation */
  --dur-micro:.2s;
  --dur-panel:.35s;
  --ease-panel:cubic-bezier(.2,1.1,.35,1);
  /* rayons standards */
  --r-sm:8px;
  --r-md:14px;
  --r-lg:22px;
  --r-xl:28px;
  /* hauteur des boutons */
  --btn-h:48px;
  --btn-r:var(--r-md);
}

/* ── 2. ICÔNES SVG (inline, stroke-based, 24×24) ── */
.ico{display:inline-block;width:20px;height:20px;vertical-align:middle;fill:none;
  stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico-sm{width:16px;height:16px}
.ico-lg{width:24px;height:24px}

/* ── 3. BOUTONS ── */
.bd-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:var(--btn-h);padding:0 20px;border:none;border-radius:var(--btn-r);
  font-family:var(--f-corps);font-weight:900;font-size:14px;cursor:pointer;
  transition:transform var(--dur-micro),box-shadow var(--dur-micro);
  -webkit-tap-highlight-color:transparent}
.bd-btn:active{transform:translateY(2px)}
.bd-btn:disabled{opacity:.4;pointer-events:none;transform:none}

/* primaire : or */
.bd-btn-pri{background:linear-gradient(180deg,var(--gold-light),var(--gold));
  color:var(--ink);box-shadow:0 4px 14px rgba(255,210,60,.35),0 2px 0 var(--gold-dark)}
.bd-btn-pri:active{box-shadow:0 1px 4px rgba(255,210,60,.3)}

/* secondaire : transparent */
.bd-btn-sec{background:var(--white-08);color:var(--white-80);
  border:1.5px solid var(--white-20)}
.bd-btn-sec:active{background:var(--white-20)}

/* danger */
.bd-btn-dan{background:linear-gradient(180deg,#e86a5a,var(--danger));
  color:#fff;box-shadow:0 4px 10px rgba(201,86,70,.3)}

/* ── 4. PANNEAUX ── */
/* panneau sombre (traversée, overlay) */
.bd-pan-dark{background:rgba(13,36,56,.95);backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);border-radius:var(--r-xl) var(--r-xl) 0 0;
  padding:20px 16px calc(16px + env(safe-area-inset-bottom));
  box-shadow:0 -14px 40px rgba(13,36,56,.4)}
/* panneau clair (gestion) */
.bd-pan-light{background:var(--ivory);border-radius:var(--r-xl) var(--r-xl) 0 0;
  padding:20px 16px calc(16px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 30px rgba(13,36,56,.15)}

/* ── 5. CARTES / ITEMS ── */
.bd-item{display:flex;align-items:center;gap:11px;padding:12px;
  border-radius:var(--r-md);margin-bottom:8px;
  transition:transform var(--dur-micro)}
.bd-item:active{transform:scale(.985)}
/* item sombre */
.bd-item-dark{background:var(--white-08);border:1.5px solid var(--white-08)}
.bd-item-dark .t b{color:#fff;font-size:13px;font-weight:900;display:block;line-height:1.2}
.bd-item-dark .t s{text-decoration:none;font-size:10px;color:var(--white-50);
  font-weight:700;display:block;margin-top:2px}
/* item clair */
.bd-item-light{background:#fff;border:1.5px solid rgba(13,36,56,.08)}
.bd-item-light .t b{color:var(--ink);font-size:13px;font-weight:900;display:block}
.bd-item-light .t s{text-decoration:none;font-size:10px;color:var(--ink-50);
  font-weight:700;display:block;margin-top:2px}
/* valeur dorée */
.bd-val{font-family:var(--f-titre);font-weight:900;font-size:15px;color:var(--gold)}

/* ── 6. BADGES ── */
.bd-badge{display:inline-flex;align-items:center;justify-content:center;
  min-width:18px;height:18px;padding:0 5px;border-radius:99px;
  font-family:var(--f-corps);font-weight:900;font-size:8px;line-height:1}
.bd-badge-new{background:var(--coral);color:#fff;
  box-shadow:0 2px 6px rgba(255,106,78,.4)}
.bd-badge-level{background:var(--gold);color:var(--ink)}
.bd-badge-lock{background:var(--ink-20);color:var(--white-80)}
.bd-badge-success{background:var(--success);color:#fff}
.bd-badge-danger{background:var(--danger);color:#fff}

/* ── 7. MODALE ── */
.bd-overlay{position:fixed;inset:0;z-index:600;
  background:rgba(13,36,56,.6);backdrop-filter:blur(5px);
  opacity:0;pointer-events:none;transition:opacity var(--dur-panel)}
.bd-overlay.on{opacity:1;pointer-events:auto}
.bd-modal{position:absolute;bottom:0;left:0;right:0;
  background:var(--ivory);border-radius:var(--r-xl) var(--r-xl) 0 0;
  padding:22px 18px calc(20px + env(safe-area-inset-bottom));
  box-shadow:0 -14px 40px rgba(0,0,0,.25);
  transform:translateY(100%);transition:transform var(--dur-panel) var(--ease-panel)}
.bd-overlay.on .bd-modal{transform:none}
.bd-modal-h{display:flex;align-items:center;margin-bottom:16px}
.bd-modal-h b{font-family:var(--f-titre);font-weight:900;font-size:20px;
  color:var(--ink);flex:1}
.bd-modal-x{width:34px;height:34px;border-radius:10px;
  border:1.5px solid var(--ink-20);background:var(--ink-08);
  color:var(--ink);font-size:14px;font-weight:900;
  cursor:pointer;font-family:var(--f-corps);
  display:flex;align-items:center;justify-content:center}

/* ── 8. HUD LÉGER ── */
.bd-hud{position:absolute;z-index:10;pointer-events:none}
.bd-hud>*{pointer-events:auto}
.bd-hud-pill{display:inline-flex;align-items:center;gap:4px;
  padding:4px 10px;border-radius:99px;
  background:var(--ink-50);backdrop-filter:blur(10px);
  color:#fff;font-family:var(--f-corps);font-weight:800;font-size:11px}

/* ── 9. ANIMATIONS STANDARDS ── */
@keyframes bd-pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes bd-slideUp{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
@keyframes bd-fadeIn{from{opacity:0}to{opacity:1}}
@keyframes bd-pulse{0%,100%{opacity:.3}50%{opacity:.7}}

@media(prefers-reduced-motion:reduce){
  .bd-btn,.bd-pan-dark,.bd-pan-light,.bd-modal,.bd-overlay,
  .bd-item{transition:none!important;animation:none!important}
}

/* ── BOUTONS UNIFIÉS : les "go" dorés ── */
.ch-go,.co-go,.fo-go,.ga-go,.av-go,.bo-go,.cr-cale-btn,.cargo-go,
.fa-btn,.ct-btn,.mq-at-go,.op-go{
  font-family:var(--f-corps);font-weight:900;
  border:none;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:transform var(--dur-micro),box-shadow var(--dur-micro)}
.ch-go:active,.co-go:active,.fo-go:active,.ga-go:active,.av-go:active,
.bo-go:active,.cr-cale-btn:active,.cargo-go:active,
.fa-btn:active,.ct-btn:active,.mq-at-go:active,.op-go:active{
  transform:translateY(2px)}
.ch-go:disabled,.co-go:disabled,.fo-go:disabled,.ga-go:disabled,.av-go:disabled,
.bo-go:disabled,.cr-cale-btn:disabled,.cargo-go:disabled,
.fa-btn:disabled,.ct-btn:disabled,.mq-at-go:disabled,.op-go:disabled{
  opacity:.4;pointer-events:none;transform:none}

/* ── BOUTONS FERMER UNIFIÉS ── */
.cargo-x,.cp-x,.op-x,.av-x,.bq-x,.mk-x{
  width:34px;height:34px;border-radius:10px;
  border:1.5px solid var(--ink-20);background:var(--ink-08);
  color:var(--ink);font-size:14px;font-weight:900;
  cursor:pointer;font-family:var(--f-corps);
  display:flex;align-items:center;justify-content:center;
  transition:transform var(--dur-micro)}
.cargo-x:active,.cp-x:active,.op-x:active,.av-x:active,
.bq-x:active,.mk-x:active{transform:scale(.9)}

/* ── EN-TÊTES DE PANNEAUX UNIFIÉS ── */
.cargo-h,.cp-h,.op-h,.av-h,.bq-h,.mk-h,.cr-h{
  display:flex;align-items:center;margin-bottom:14px}
.cargo-h b,.cp-h b,.op-h b,.av-h b,.bq-h b,.mk-h b,.cr-h b{
  font-family:var(--f-titre);font-weight:900;flex:1}

/* ══════════════════════════════════════════════════════════════
   FIN DU DESIGN SYSTEM
   ══════════════════════════════════════════════════════════════ */
#splashPort{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:0;
  background:linear-gradient(180deg,#c8dce8 0%,#a0c0d4 28%,#7ea8c2 52%,#5e90ae 74%,#4a7e9c 100%);
  transition:opacity .65s ease}
#splashPort.off{opacity:0;pointer-events:none}
.hub{position:fixed;inset:0;overflow:hidden;background:linear-gradient(180deg,#c8dce8 0%,#7ea8c2 52%,#4a7e9c 100%)}
.hub-ciel{position:absolute;left:0;right:0;top:0;height:55%;transition:background 30s}
.hub-ciel.aube{background:linear-gradient(180deg,#fae4c4,#c89060)}
.hub-ciel.jour{background:linear-gradient(180deg,#c8dce8,#5e94b0)}
.hub-ciel.soir{background:linear-gradient(180deg,#e8a880,#a04838)}
.hub-ciel.nuit{background:linear-gradient(180deg,#0a1828,#1e4468)}
.hub-mer{position:absolute;left:0;right:0;top:55%;bottom:0;background:linear-gradient(180deg,#5e90ae,#2a5e7c)}
.hub-fondu{position:absolute;left:0;right:0;top:50%;height:12%;background:linear-gradient(180deg,transparent,rgba(94,144,174,.5),transparent);pointer-events:none;z-index:1}
.hub-vg{position:absolute;left:-10%;right:-10%;height:2px;background:rgba(255,255,255,.12);animation:hubVg 9s ease-in-out infinite}
@keyframes hubVg{0%,100%{transform:translateX(-14px)}50%{transform:translateX(14px)}}
.hub-bat{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);z-index:5;width:180px;animation:hubBat 5s ease-in-out infinite}
.hub-bat svg{width:100%;height:auto;display:block;filter:drop-shadow(0 8px 20px rgba(0,0,0,.25))}
@keyframes hubBat{0%,100%{transform:translate(-50%,-50%) translateY(0)}50%{transform:translate(-50%,-50%) translateY(-6px)}}
.hub-titre{position:absolute;left:0;right:0;top:18%;z-index:10;text-align:center;pointer-events:none}
.hub-titre b{font-family:var(--f-titre);font-weight:900;font-size:13px;color:rgba(255,255,255,.4);letter-spacing:5px}
.hub-hdr{position:absolute;left:0;right:0;top:0;z-index:20;padding:calc(12px + env(safe-area-inset-top)) 16px 10px;background:linear-gradient(180deg,rgba(13,36,56,.4),transparent);display:flex;align-items:center;gap:10px}
.hub-hdr-nom{font-family:var(--f-titre);font-weight:900;font-size:18px;color:#fff;flex:1;text-shadow:0 2px 10px rgba(0,0,0,.3)}
.hub-hdr-pill{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.12);backdrop-filter:blur(10px);color:#fff;font-weight:800;font-size:12px}
.hub-bas{position:absolute;left:0;right:0;bottom:0;z-index:20;padding:0 0 env(safe-area-inset-bottom);background:linear-gradient(180deg,transparent 0%,rgba(13,36,56,.45) 18%,rgba(13,36,56,.8) 100%)}
.hub-dest{text-align:center;padding:14px 16px 8px}
.hub-dest b{font-family:var(--f-titre);font-weight:900;font-size:12px;color:rgba(255,255,255,.4);letter-spacing:3px}
.hub-dest span{font-family:var(--f-main);font-size:16px;color:rgba(255,255,255,.4);display:block;margin-top:2px}
.hub-acts{display:flex;gap:8px;padding:8px 14px 12px;overflow-x:auto;scrollbar-width:none}
.hub-acts::-webkit-scrollbar{display:none}
.hub-act{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 14px 10px;border-radius:var(--r-md);min-width:72px;background:rgba(255,255,255,.1);backdrop-filter:blur(12px);color:rgba(255,255,255,.8);font-weight:800;font-size:9px;cursor:pointer;transition:transform var(--dur-micro);border:none;font-family:var(--f-corps)}
.hub-act:active{transform:scale(.92)}
.hub-act svg{width:22px;height:22px;color:rgba(255,255,255,.6);fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hub-go{display:block;margin:0 14px 12px;padding:16px;border-radius:var(--r-md);border:none;width:calc(100% - 28px);cursor:pointer;font-family:var(--f-corps);font-weight:900;font-size:14px;color:var(--ink);background:linear-gradient(180deg,var(--gold-light),var(--gold));box-shadow:0 5px 18px rgba(255,210,60,.35),0 2px 0 var(--gold-dark);transition:transform var(--dur-micro)}
.hub-go:active{transform:translateY(2px)}
.hub-go:disabled{background:rgba(255,255,255,.1);color:rgba(255,255,255,.35);box-shadow:none}
@media(max-width:340px){.hub-act{min-width:62px;padding:10px 10px 8px;font-size:8px}}
@media(min-width:768px){.hub-bas{max-width:500px;left:50%;transform:translateX(-50%)}.hub-bat{width:240px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@keyframes spBarF{to{width:100%}}

/* ══════════════ LA TRAVERSÉE VIVANTE ══════════════ */
.vtrav{position:fixed;inset:0;z-index:500;display:none;overflow:hidden}
.vtrav.on{display:block}
.tr-ec{position:absolute;inset:0;overflow:hidden}

/* ── LE CIEL ── */
.tr-ciel{position:absolute;left:0;right:0;top:0;height:57%;transition:background 2.4s ease}
.h0 .tr-ciel{background:linear-gradient(180deg,#2c4a72 0%,#6a7ea8 22%,#c99a8a 44%,
  #f0b894 62%,#f8d4a8 78%,#fae4c4 100%)}
.h1 .tr-ciel{background:linear-gradient(180deg,#1e6a9e 0%,#4a9ec8 26%,#8ec8e0 54%,
  #bde0ec 76%,#dcf0f6 100%)}
.h2 .tr-ciel{background:linear-gradient(180deg,#1a3a62 0%,#6a5a90 20%,#c46a70 42%,
  #f09060 62%,#f8bc7a 80%,#fad8a0 100%)}
.h3 .tr-ciel{background:linear-gradient(180deg,#050e1e 0%,#0e2244 30%,#1a3a62 58%,
  #2a5480 80%,#3a6c96 100%)}

.tr-halo,.tr-astre{position:absolute;border-radius:50%;pointer-events:none;transition:2.4s ease;
  transform:translateX(-50%)}
.h0 .tr-astre{left:50%;top:41%;width:64px;height:64px;
  background:radial-gradient(circle,#fff4d0,#ffd07a 56%,rgba(255,180,120,0) 76%)}
.h1 .tr-astre{left:50%;top:9%;width:78px;height:78px;
  background:radial-gradient(circle,#fffdf0,var(--gold-light) 48%,rgba(255,220,120,0) 74%)}
.h2 .tr-astre{left:50%;top:47%;width:88px;height:88px;
  background:radial-gradient(circle,#fff0c8,#ff9a5a 54%,rgba(240,120,70,0) 78%)}
.h3 .tr-astre{left:68%;top:12%;width:44px;height:44px;
  background:radial-gradient(circle at 62% 38%,#fdf8e8,#e0dcc8 62%,rgba(200,196,180,0) 74%)}
.h0 .tr-halo{left:50%;top:32%;width:280px;height:280px;
  background:radial-gradient(circle,rgba(255,180,130,.34),transparent 66%);filter:blur(18px)}
.h1 .tr-halo{left:50%;top:2%;width:260px;height:260px;
  background:radial-gradient(circle,rgba(255,240,180,.3),transparent 68%);filter:blur(20px)}
.h2 .tr-halo{left:50%;top:36%;width:330px;height:330px;
  background:radial-gradient(circle,rgba(255,140,80,.4),transparent 66%);filter:blur(20px)}
.h3 .tr-halo{left:68%;top:6%;width:190px;height:190px;
  background:radial-gradient(circle,rgba(200,220,255,.2),transparent 68%);filter:blur(18px)}

.tr-etoiles{position:absolute;inset:0;opacity:0;transition:opacity 2.4s ease;pointer-events:none}
.h3 .tr-etoiles{opacity:1}
.tr-etoiles i{position:absolute;border-radius:50%;background:#fff;
  animation:tr-scint 4s ease-in-out infinite}
@keyframes tr-scint{0%,100%{opacity:.25}50%{opacity:.95}}

.tr-nuages .nu{position:absolute;pointer-events:none;transition:opacity 2s ease}
.tr-nuages .nu.l1{animation:tr-nu 62s linear infinite}
.tr-nuages .nu.l2{animation:tr-nu 96s linear infinite}
.tr-nuages .nu.l3{animation:tr-nu 140s linear infinite}
@keyframes tr-nu{from{transform:translateX(110vw)}to{transform:translateX(-66vw)}}
.h3 .tr-nuages .nu{opacity:.15}

.tr-oi{position:absolute;opacity:.3;animation:tr-vol 40s linear infinite}
@keyframes tr-vol{from{transform:translateX(-60px) translateY(0)}
  to{transform:translateX(110vw) translateY(-24px)}}
.h3 .tr-oi{opacity:0}

/* ── LA DESTINATION ── */
.tr-cote{position:absolute;left:0;right:0;top:47%;height:12%;pointer-events:none}
.tr-dest{position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  transition:transform 2s cubic-bezier(.3,1,.4,1),opacity 2s}
.tr-dest svg{display:block;filter:drop-shadow(0 3px 10px rgba(20,50,80,.2))}

/* ── LA MER ── */
.tr-mer{position:absolute;left:0;right:0;top:57%;bottom:0;overflow:hidden;
  transition:background 2.4s ease}
.h0 .tr-mer{background:linear-gradient(180deg,#8a9ec0 0%,#5a7ea8 22%,#2e5c88 58%,#12345c 100%)}
.h1 .tr-mer{background:linear-gradient(180deg,#8ecfe4 0%,#4a9ec8 20%,#1e6a9e 56%,#0c3f66 100%)}
.h2 .tr-mer{background:linear-gradient(180deg,#e0946a 0%,#a06a80 18%,#3a5a84 52%,#122f52 100%)}
.h3 .tr-mer{background:linear-gradient(180deg,#2a5480 0%,#1a3a62 24%,#0e2444 58%,#050e1e 100%)}
.tr-horiz{position:absolute;left:0;right:0;top:0;height:1.5px;
  background:rgba(255,255,255,.4);box-shadow:0 0 8px rgba(255,255,255,.25)}
.tr-chemin{position:absolute;left:50%;top:0;width:130px;height:100%;
  transform:translateX(-50%);pointer-events:none;transition:2.4s ease;
  -webkit-mask:linear-gradient(180deg,#000,transparent 78%);
  mask:linear-gradient(180deg,#000,transparent 78%)}
.tr-chemin i{position:absolute;left:0;right:0;height:2.5px;border-radius:3px;
  animation:tr-chm 5s ease-in-out infinite}
.h0 .tr-chemin i{background:rgba(255,200,150,.5)}
.h1 .tr-chemin i{background:rgba(255,250,210,.42)}
.h2 .tr-chemin i{background:rgba(255,170,110,.6)}
.h3 .tr-chemin{left:68%;width:96px}
.h3 .tr-chemin i{background:rgba(220,235,255,.34)}
@keyframes tr-chm{0%,100%{transform:scaleX(.7)}50%{transform:scaleX(1)}}
.tr-vg{position:absolute;left:-16%;right:-16%;border-radius:99px;
  animation:tr-vgm 7s ease-in-out infinite}
@keyframes tr-vgm{0%,100%{transform:translateX(-26px)}50%{transform:translateX(26px)}}
.tr-ecm{position:absolute;height:3px;border-radius:3px;background:rgba(255,255,255,.55);
  animation:tr-vgm 6s ease-in-out infinite}

/* ── LE NAVIRE ── */
.tr-bat{position:absolute;left:50%;bottom:20%;width:250px;transform:translateX(-50%);
  z-index:5;animation:tr-tang 5s ease-in-out infinite;transform-origin:50% 80%}
@keyframes tr-tang{0%,100%{transform:translateX(-50%) rotate(-2deg) translateY(0)}
  50%{transform:translateX(-50%) rotate(2deg) translateY(-8px)}}
.tr-bat svg{width:100%;display:block;filter:drop-shadow(0 12px 18px rgba(6,30,54,.42))}
.tr-sill{position:absolute;left:50%;bottom:16.5%;width:290px;height:44px;
  transform:translateX(-50%);z-index:4;pointer-events:none}
.tr-sill i{position:absolute;left:50%;top:0;border-radius:50%;
  border:2px solid rgba(255,255,255,.3);border-top-color:transparent;

async function rpc(nom,args,dejaRetente){
  try{
    /* jeton bientôt périmé : on renouvelle avant d'appeler */
    if(SESSION&&jetonPerime(SESSION))await rafraichitJeton();
    const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${nom}`,{
      method:'POST',
      headers:{'apikey':SUPABASE_ANON,'Authorization':`Bearer ${SESSION.access_token}`,
        'Content-Type':'application/json'},
      body:JSON.stringify(args||{})
    });
    if((r.status===401||r.status===403)&&!dejaRetente){
      if(await rafraichitJeton())return rpc(nom,args,true);
      versConnexion();
      return {erreur:'Session expirée — reconnecte-toi'};
    }
    if(r.ok)return await r.json();
    let msg='HTTP '+r.status;
    try{const j=await r.json();msg+=' — '+(j.message||j.hint||j.details||JSON.stringify(j)).slice(0,120)}catch(e){}
    if(r.status===404)msg='Fonction serveur absente : exécute patchs_tout.sql dans Supabase (SQL Editor)';
    return {erreur:msg};
  }catch(e){
    if(!navigator.onLine)return {erreur:'Pas de connexion — vérifie ton réseau et réessaie'};
    return {erreur:'Réseau : '+e.message};
  }
}
async function fetchAuth(url,opts,dejaRetente){
  if(SESSION&&jetonPerime(SESSION))await rafraichitJeton();
  const o=opts||{};
  o.headers={...(o.headers||{}),'apikey':SUPABASE_ANON,'Authorization':`Bearer ${SESSION.access_token}`};
  const r=await fetch(url,o);
  if((r.status===401||r.status===403)&&!dejaRetente){
    if(await rafraichitJeton())return fetchAuth(url,opts,true);
  }
  return r;
}
async function rafraichitJeton(){
  /* renouvelle le jeton avec le refresh_token ; renvoie true si ok */
  try{
    const s=SESSION||JSON.parse(localStorage.getItem('bd2_session'));
    if(!s||!s.refresh_token)return false;
    const r=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`,{
      method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON},
      body:JSON.stringify({refresh_token:s.refresh_token})
    });
    if(!r.ok)return false;
    const d=await r.json();
    if(!d.access_token)return false;
    localStorage.setItem('bd2_session',JSON.stringify(d));
    SESSION=d;
    return true;
  }catch(e){return false}
}
async function garde(){
  try{
    const s=JSON.parse(localStorage.getItem('bd2_session'));
    if(!s||!s.access_token)throw 0;
    /* jeton visiblement périmé : on rafraîchit direct, sans provoquer de 403 */
    if(jetonPerime(s)){
      if(await rafraichitJeton())return;
      throw 0;
    }
    let r=await fetch(`${SUPABASE_URL}/auth/v1/user`,{headers:{'apikey':SUPABASE_ANON,'Authorization':`Bearer ${s.access_token}`}});
    if(r.ok){s.user=await r.json();SESSION=s;return}
    if(await rafraichitJeton())return;
    throw 0;
  }catch(e){
    versConnexion();
    throw new Error('no-session');
  }
}

function toast(msg,sur,dore){
  const brut=String(msg==null?'':msg);
  const k=ntType(brut);
  const t=Object.assign({},NT_T[k]||NT_T.info);
  if(sur)t.sur=sur;
  if(dore)t.c='#ffd06a';
  /* on retire l'emoji de tête : il est déjà dans le sceau */
  let txt=brut.replace(/^[\u{1F000}-\u{1FAFF}\u{2190}-\u{27BF}\u{FE0F}\u{2600}-\u{26FF}]+\s*/u,'');
  const [ch,un]=ntChiffre(txt);
  if(ch)txt=txt.replace(/[+−-]?\d[\d\s]*\s*🪙/,'').replace(/\s*[—–-]\s*$/,'').trim();
  if(!txt)txt=brut;
  if(k==='warn' && typeof SON==='object' && SON.erreur)SON.erreur();
  /* pas deux fois le même avis : on rafraîchit celui qui est déjà là */
  const dejaFile=NT_FILE.find(o=>o.txt===txt);
  if(dejaFile)return;
  const dejaVu=[...document.querySelectorAll('#nt .ntc .n-msg')]
    .find(e=>e.innerHTML===txt);
  if(dejaVu){
    const carte=dejaVu.closest('.ntc');
    if(carte){
      const bar=carte.querySelector('.n-bar');
      if(bar){bar.style.animation='none';void bar.offsetWidth;bar.style.animation='';}
      carte.animate([{transform:'scale(1)'},{transform:'scale(1.03)'},{transform:'scale(1)'}],
        {duration:220,easing:'ease-out'});
    }
    return;
  }
  NT_FILE.push({k,t,txt,ch,un});
  NT_FILE.sort((a,b)=>(b.t.pr||0)-(a.t.pr||0));
  if(NT_FILE.length>6)NT_FILE.length=6;
  ntDefile();
}

function trMaj(){
  const vo=voyageEnCours();
  if(!vo){trFerme();return}
  const reste=vo.fin-Date.now();
  const pct=Math.min(1,Math.max(0,(Date.now()-vo.depart)/(vo.fin-vo.depart)));
  const p100=Math.round(pct*100);

  document.getElementById('trJgI').style.width=p100+'%';
  document.getElementById('trJgU').style.left=p100+'%';
  document.getElementById('trPct').textContent=p100+' %';

  if(reste<=0){
    document.getElementById('trTpsV').innerHTML='Terre !';
    const acc=document.getElementById('trAcc');
    acc.classList.add('or'); acc.innerHTML='<span class="e">⚓</span>Accoster';
  }else{
    const h=Math.floor(reste/3600000), m=Math.floor(reste%3600000/60000);
    const s=Math.floor(reste%60000/1000);
    document.getElementById('trTpsV').innerHTML=
      h ? h+'<i>h</i>'+String(m).padStart(2,'0')
        : m>0 ? m+'<i>min</i>'
              : s+'<i>s</i>';
    const acc=document.getElementById('trAcc');
    const px=accPrix(vo);
    if(px>0){acc.classList.add('or');acc.innerHTML='<span class="e">⚓</span>'+px+' 🪙';}
    else{acc.classList.remove('or');acc.innerHTML='<span class="e">⏳</span>Patience';}
  }
  /* la destination grandit */
  const d=document.getElementById('trDest');
  d.style.transform=`translateX(-50%) scale(${(0.72+pct*0.5).toFixed(3)})`;
  d.style.opacity=(0.42+pct*0.5).toFixed(2);

  /* l'heure du ciel change en temps réel */
  const hh=trHeure();
  const ec=document.getElementById('trEc');
  if(!ec.classList.contains('h'+hh)){
    ec.className='tr-ec h'+hh;
    document.getElementById('trMtoE').textContent=TR_METEO[hh][0];
    document.getElementById('trMtoT').textContent=TR_METEO[hh][1];
  }
}

function tpRendCale(){
  const c=document.getElementById('tpCaleC');
  if(!c)return;
  const vo=voyageEnCours();
  const cargo=vo?(vo.cargo||{}):{};
  const entries=Object.entries(cargo).filter(([,n])=>n>0);
  const dest=vo?vo.vers:'marseille';
  let h='', total=0;
  if(!entries.length){
    h='<div class="tp-vide">La cale est vide — tu voyages léger.</div>';
  }else{
    entries.forEach(([m,n])=>{
      const M=MARCHANDISES[m];
      if(!M)return;
      const pv=prixVente(dest,m);
      const gain=(pv-M.achat)*n;
      total+=gain;
      h+=`<div class="tp-item"><span class="e">${M.emo}</span><div class="t">
        <b>${M.nom} ×${n}</b>
        <s>Acheté ${M.achat} 🪙 · ${(PORTS[dest]||{}).nom||dest} ${pv} 🪙</s></div>
        <span class="v">${gain>=0?'+':''}${gain}</span></div>`;
    });
    const cap=capaciteCale();
    const occ=entries.reduce((a,[,n])=>a+n,0);
    h+=`<div class="tp-tot">${occ} / ${cap} caisses · estimé <b>${total>=0?'+':''}${total} 🪙</b> à destination</div>`;
  }
  c.innerHTML=h;

    <b>Cale</b><s>Niveau ${nv('cale')} · ${capaciteCale()} caisses max</s></div></div>`;
  if(PROFIL.assurance){
    h+=`<div class="tp-item"><span class="e">🛡️</span><div class="t">
      <b>Assurance</b><s style="color:#7ec4e8">✓ Active — couvre ce voyage</s></div></div>`;
  }
  if(PROFIL.pret_du>0){
    h+=`<div class="tp-item"><span class="e">💰</span><div class="t">
      <b>Dette en cours</b><s>${PROFIL.pret_du} 🪙 à rembourser</s></div></div>`;
  }
  c.innerHTML=h;
}
async function accoste(){
  if(ACCOSTAGE_EN_COURS)return;
  const vo=voyageEnCours();
  if(!vo)return;
  const vers=vo.vers, D=PORTS[vers];
  await chargeMarche(vers);
  const entrees=Object.entries(vo.cargo||{}).filter(([,n])=>n>0);
  const estTot=entrees.reduce((a,[m,n])=>a+prixVente(vers,m)*n,0);

  const carte=$('#retCarte');
  const xp=xpRoute(vo.de,vers);

  const rows=entrees.map(([m,n],i)=>{
    const M=MARCHANDISES[m];
    if(!M)return '';
    const pv=prixVente(vers,m)*n;
    return `<div class="ret-ligne" style="animation-delay:${0.3+i*0.15}s">
      <span>${M.emo}</span><span>${n}× ${M.nom}</span>
      <span class="v" style="animation-delay:${0.5+i*0.15}s">~${pv} 🪙</span></div>`;
  }).join('');

  const phrases=['Bel arrivage, capitaine','La criée propose','Le marchand est content',
    'Bon commerce','La mer a été généreuse'];
  const phrase=phrases[Math.floor(Math.random()*phrases.length)];

  carte.innerHTML=`
    <div class="ret-port"><b>⚓ ${D.nom}</b><span>tu es arrivé à bon port</span></div>
    <div class="ret-montant${entrees.length?'':' vide'}">
      <b>${entrees.length?'~+'+estTot:'⚓'}</b>
      <s>${entrees.length?'PIÈCES D\'OR':'CALE VIDE'}</s>
      <em>${entrees.length?phrase:'tu voyages léger'}</em>
    </div>
    <div class="ret-lignes">${rows}</div>
    <button class="ret-ok" id="retOk">${entrees.length?'🤝 Vendre et accoster':'⚓ Accoster'} (+${xp} XP)</button>
    ${entrees.length?'<button class="ret-garde" id="retGarde">📦 Garder en cale — vendre plus tard</button>':''}
    <div class="ret-xp">+<b>${xp} XP</b></div>`;
  $('#retour').classList.add('on');
  $('#retOk').onclick=()=>accosteFinal(true);
  const g=$('#retGarde');if(g)g.onclick=()=>accosteFinal(false);
}
async function accosteFinal(vendre){
  if(ACCOSTAGE_EN_COURS)return;
  ACCOSTAGE_EN_COURS=true;
  const ok=$('#retOk'),ga=$('#retGarde');
  if(ok)ok.disabled=true;if(ga)ga.disabled=true;
  const res=await rpc('bd2_accoster',{p_vendre:vendre});
  ACCOSTAGE_EN_COURS=false;
  if(!res||res.erreur){
    if(ok)ok.disabled=false;if(ga)ga.disabled=false;
    toast('⚠️ '+((res&&res.erreur)||'Erreur réseau'));return;
  }
  const D=PORTS[res.vers];
  const nivAvant=niveauDe(PROFIL.xp??0);
  PROFIL.sous=res.sous;
  PROFIL.xp=res.xp_total;
  PROFIL.port=res.vers;
  PROFIL.cale=res.cale||{};
  if(res.lignes&&res.lignes.some(l=>l.etal))PROFIL.etal=null;
  VOYAGE=null;
  majHeader();
  appliquePort(res.vers);
  chargeVoisins();
  $('#retour').classList.remove('on');
  joueArrivee();
  SON.arrivee();
  if(vendre)feteGain(res.vendu||0);
  verifieRegate(res.vers);
  const nivApres=niveauDe(PROFIL.xp??0);
  if(nivApres>nivAvant)setTimeout(()=>feteNiveau(nivApres),1700);
  if(res.commande_gagnee)setTimeout(()=>toast('📜 Commande du jour remplie ! Bonus ×1,4 encaissé 🪙',undefined,true),900);
  if(res.quai_hote)setTimeout(()=>toast('⚓ Amarré au quai de '+res.quai_hote+' (+'+res.quai_taxe+' 🪙 pour lui)'),res.commande_gagnee?2400:900);
  toast(vendre
    ?'🏛️ Te voilà à '+D.nom+(res.vendu?' · +'+res.vendu+' 🪙':'')+' · +'+res.xp_gagne+' XP'
    :'📦 Cargaison gardée en cale · +'+res.xp_gagne+' XP — vends-la à la criée quand tu veux');
}
function niveauDe(xp){return Math.max(1,Math.floor(Math.sqrt((xp||0)/10))+1)}
function trHeure(){const h=new Date().getHours();if(h>=5&&h<10)return 0;if(h>=10&&h<17)return 1;if(h>=17&&h<21)return 2;return 3}
