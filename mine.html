<!doctype html>

<head>
<!-- ===== la mise à jour : le jeu ne reste jamais bloqué sur une vieille version ===== -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<script>
/* Ajouté au signet, un navigateur garde la page en mémoire et ne va plus
   jamais la rechercher. On lui demande donc, à chaque ouverture, quelle est
   la version publiée : si elle a changé, on recharge une seule fois avec une
   adresse neuve — c'est la seule façon de percer le cache d'un raccourci. */
(function(){
  var MA_VERSION='2026-09-13-1300';
  var cle='bdl.version.vue';
  function verifier(){
    fetch('version.json?t='+Date.now(),{cache:'no-store'})
      .then(function(r){return r.json();})
      .then(function(d){
        if(!d||!d.v||d.v===MA_VERSION)return;
        /* on ne recharge qu'une fois par version, sinon on bouclerait */
        var deja=null;
        try{deja=sessionStorage.getItem(cle);}catch(e){}
        if(deja===d.v)return;
        try{sessionStorage.setItem(cle,d.v);}catch(e){}
        var u=location.pathname.split('?')[0]+'?v='+encodeURIComponent(d.v);
        location.replace(u);
      })
      .catch(function(){});
  }
  verifier();
  /* et quand on revient sur l'onglet après un moment */
  var vu=Date.now();
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState!=='visible')return;
    if(Date.now()-vu<60000)return;
    vu=Date.now();verifier();
  });
})();
</script>

<script>
const $=(i)=>document.getElementById(i);
/* ================= le serveur ================= */
const URL_SB='https://zpfkekiavlfphialvphi.supabase.co';
const CLE_SB='sb_publishable__dfR2lEOwKjhhtavvJEvGw_KVACZnHP';
const sbEntetes={'apikey':CLE_SB,'Authorization':'Bearer '+CLE_SB,
                 'Content-Type':'application/json'};
const CLE_LOCALE='bdl.pix.v2';
let e={};
try{e=JSON.parse(localStorage.getItem(CLE_LOCALE)||'{}');}catch(x){e={};}
const sauver=()=>{try{localStorage.setItem(CLE_LOCALE,JSON.stringify(e));}catch(x){}};
async function appel(nom,corps){
  try{
    const r=await fetch(URL_SB+'/rest/v1/rpc/'+nom,
      {method:'POST',headers:sbEntetes,body:JSON.stringify(corps||{})});
    return await r.json();
  }catch(x){return {erreur:'la mine ne répond pas'};}
}
let enLigne=true;      /* faux si le serveur est injoignable : on joue quand même */
/* les épées : celle du coffre, puis les forgées */
const EPEES=[
  {id:'bois',  nom:'Épée de bois',   deg:4, cout:null,                    coul:['#a5764a','#7d5934']},
  {id:'fer',   nom:'Épée de fer',    deg:8, cout:{fer:6,bois:2},          coul:['#c0c7cd','#8b939a']},
  {id:'cuivre',nom:'Épée de cuivre', deg:14,cout:{cuivre:8,fer:3},        coul:['#5fc79c','#3f9e7a']},
  {id:'argent',nom:'Épée d’argent',  deg:22,cout:{argent:8,cuivre:4},     coul:['#eef3f7','#c3ccd4']},
  {id:'or',    nom:'Épée d’or',      deg:34,cout:{or:8,argent:5},         coul:['#ffe9a8','#d9a63f']},
  {id:'gemme', nom:'Lame de gemme',  deg:52,cout:{gemme:4,or:6},          coul:['#b6f2f7','#3fa8b8']}
];
let epee=0;                       /* rang de ta lame, donné par le serveur */
let VIE_MAX_S=30, CHARGE_MAX=60;
let vie=30, mort=false;
const PROFOND=20;

const cv=$('jeu'), ctx=cv.getContext('2d');
let VW=0,VH=0,ECH=3,DPR=1;
const alea=(n)=>{const x=Math.sin(n*127.1)*43758.5453;return x-Math.floor(x);};
const R=(g,x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h);};

/* ================= la galerie, vue de profil =================
   Un couloir qui s'enfonce vers la droite. Le sol monte et descend,
   il y a des plateformes, des échelles, et des filons dans la roche. */
const CASE=16;                    /* la maille, en points de jeu */
const LARG=260, HAUT=34;          /* la galerie : longue et basse */
let SOL=[], PLATEFORMES=[], FILONS=[], LAMPES=[], DECORS=[], BETES=[];
let SORTIE=null, PUITS=null;
let niveau=1;
let FILONS_GENRES=['fer','charbon'];

const NIVEAUX=[
  {nom:'les premières galeries',roche:['#8a7a63','#6b5c47','#4a3f30'],fond:'#3a2e24'},
  {nom:'la roche dure',         roche:['#7a6a58','#5b4d3d','#3d3428'],fond:'#2f2620'},
  {nom:'les veines profondes',  roche:['#6a5f58','#4b423c','#332c28'],fond:'#241f1e'},
  {nom:'sous la nappe',         roche:['#5c5a62','#42414c','#2c2b34'],fond:'#1c1b24'},
  {nom:'le fond du monde',      roche:['#4a4458','#332f42','#1e1c2a'],fond:'#15131e'}
];
const bandeNiv=()=>NIVEAUX[Math.min(NIVEAUX.length-1,Math.floor((niveau-1)/4))];
/* ce qui vit à chaque profondeur */
const BESTIAIRE=[
  {nom:'rat des galeries',vie:6, deg:4, vit:26,coul:['#6b5a4a','#4a3c30'],taille:0.8},
  {nom:'chauve-souris',   vie:8, deg:5, vit:38,coul:['#4a3a52','#2f2436'],taille:0.85,vole:true},
  {nom:'araignée',        vie:11,deg:7, vit:32,coul:['#3a2f3f','#231c26'],taille:0.95},
  {nom:'gobelin',         vie:16,deg:9, vit:30,coul:['#5f7a3a','#3f5124'],taille:1.05},
  {nom:'rampant',         vie:22,deg:11,vit:28,coul:['#6a4a2a','#452f18'],taille:1.1},
  {nom:'spectre',         vie:30,deg:14,vit:34,coul:['#7a8fa8','#4a5a70'],taille:1.15,vole:true},
  {nom:'golem de pierre', vie:42,deg:18,vit:18,coul:['#6f767d','#4a5056'],taille:1.35},
  {nom:'ombre du fond',   vie:60,deg:24,vit:36,coul:['#2a2030','#16101c'],taille:1.4}
];
const bande=(n)=>Math.min(BESTIAIRE.length-1,Math.floor((n-1)/PROFOND*BESTIAIRE.length));
const durete=(n)=>1+(n-1)*0.16;
const nomNiveau=(n)=>n<=4?'les premières galeries':n<=8?'la roche dure':
  n<=12?'les veines profondes':n<=16?'sous la nappe':'le fond du monde';

function creuser(){
  const gr=niveau*137;
  SOL=[];PLATEFORMES=[];FILONS=[];LAMPES=[];DECORS=[];BETES=[];
  /* le sol : une ligne qui ondule, avec parfois un ressaut */
  let h=HAUT-8;
  for(let i=0;i<LARG;i++){
    if(i>6&&alea(i*1.7+gr)<.10)h+=alea(i*3+gr)<.5?-1:1;
    if(i>6&&alea(i*5.3+gr)<.035)h+=alea(i*7+gr)<.5?-2:2;   /* un ressaut à franchir */
    h=Math.max(HAUT-16,Math.min(HAUT-4,h));
    SOL.push(h);
  }
  /* les plateformes suspendues */
  for(let i=10;i<LARG-10;i+=4){
    if(alea(i*2.1+gr)>.22)continue;
    const l=2+((alea(i*3.3+gr)*3)|0);
    const y=SOL[i]-4-((alea(i*4.7+gr)*4)|0);
    PLATEFORMES.push({x:i,y,l});
  }
  /* les filons : dans le sol, dans les parois, sous les plateformes */
  const genres=niveau<=4?['fer','charbon']:niveau<=8?['fer','cuivre','charbon']
    :niveau<=12?['cuivre','argent','charbon']:niveau<=16?['argent','or','cuivre']:['or','gemme','argent'];
  FILONS_GENRES=genres;
  for(let i=8;i<LARG-6;i+=3){
    if(alea(i*6.1+gr)>.30)continue;
    const t=genres[(alea(i*8.3+gr)*genres.length)|0];
    const surSol=alea(i*9.7+gr)<.55;
    const y=surSol?SOL[i]:(SOL[i]-3-((alea(i*2.9+gr)*6)|0));
    FILONS.push({t,x:i,y,coups:0});
  }
  /* les lampes accrochées à la paroi, tous les 12 pas */
  for(let i=6;i<LARG;i+=12)LAMPES.push({x:i,y:SOL[i]-6});
  /* le décor : étais, wagonnets, rails, champignons */
  for(let i=4;i<LARG;i+=5){
    const r=alea(i*11.3+gr);
    if(r<.30)DECORS.push({t:'etai',x:i,y:SOL[i]});
    else if(r<.38)DECORS.push({t:'wagon',x:i,y:SOL[i]});
    else if(r<.52)DECORS.push({t:'champi',x:i,y:SOL[i]});
    else if(r<.62)DECORS.push({t:'caisse',x:i,y:SOL[i]});
  }
  /* les bêtes de cette profondeur */
  const B=BESTIAIRE[bande(niveau)], k=durete(niveau);
  const combien=Math.min(8,1+Math.floor(niveau/2));
  for(let i=0;i<combien;i++){
    const x=24+(((LARG-40)*(i+1)/(combien+1))|0);
    BETES.push(Object.assign({},B,{x:x*CASE,y:SOL[x]*CASE,
      vx:(alea(i*3+gr)<.5?-1:1)*B.vit*0.5,
      vie:Math.round(B.vie*k),vieMax:Math.round(B.vie*k),
      deg:Math.round(B.deg*k),t:alea(i)*6,touche:0,frappe:0}));
  }
  /* la sortie tout à gauche, le puits tout à droite */
  SORTIE={x:4*CASE,y:SOL[4]*CASE};
  PUITS=niveau<PROFOND?{x:(LARG-5)*CASE,y:SOL[LARG-5]*CASE}:null;
}
const solEn=(xp)=>{
  const i=Math.max(0,Math.min(LARG-1,Math.round(xp/CASE)));
  return SOL[i]*CASE;
};

/* ================= le fond, en quatre couches =================
   C'est lui qui fait la profondeur : plus une couche est loin,
   moins elle défile, et plus elle est bleue. */
let COUCHES=null;
function graverLeFond(){
  const N=bandeNiv();
  const fab=(w,h,f)=>{
    const c=document.createElement('canvas');
    c.width=w;c.height=h;
    const g=c.getContext('2d');g.imageSmoothingEnabled=false;f(g,w,h);
    return c;
  };
  /* 1 · la roche lointaine : de grandes masses sombres */
  const loin=fab(420,300,(g,w,h)=>{
    g.fillStyle=N.fond;g.fillRect(0,0,w,h);
    for(let i=0;i<26;i++){
      const x=alea(i*3.1)*w, y=alea(i*7.7)*h*0.8;
      const rx=30+alea(i*2)*60, ry=20+alea(i*5)*40;
      g.fillStyle='rgba(255,255,255,'+(0.012+alea(i)*0.02)+')';
      g.beginPath();g.ellipse(x,y,rx,ry,0,0,7);g.fill();
    }
  });
  /* 2 · des piliers de roche */
  const piliers=fab(380,300,(g,w,h)=>{
    for(let i=0;i<7;i++){
      const x=20+i*54+alea(i)*14, lg=18+alea(i*3)*16;
      const d=g.createLinearGradient(x,0,x+lg,0);
      d.addColorStop(0,'rgba(0,0,0,.34)');
      d.addColorStop(.5,N.roche[2]);
      d.addColorStop(1,'rgba(0,0,0,.4)');
      g.fillStyle=d;
      g.beginPath();
      g.moveTo(x,0);g.lineTo(x+lg,0);
      g.lineTo(x+lg-3,h*0.78);g.lineTo(x+3,h*0.78);g.closePath();g.fill();
      /* les anneaux de taille */
      g.fillStyle='rgba(0,0,0,.18)';
      for(let k=1;k<7;k++)g.fillRect(x+1,h*0.11*k,lg-2,2);
    }
  });
  /* 3 · une galerie parallèle, avec ses lampes */
  const galerie=fab(340,300,(g,w,h)=>{
    g.fillStyle='rgba(0,0,0,.55)';
    g.fillRect(0,h*0.30,w,h*0.26);
    g.fillStyle=N.roche[2];
    g.fillRect(0,h*0.30,w,5);

      g.fillStyle='#6b4a28';g.fillRect(x-2,h*0.30,36,4);

      d.addColorStop(1,'rgba(0,0,0,.7)');
      g.fillStyle=d;
      g.beginPath();g.moveTo(x-lg/2,0);g.lineTo(x+lg/2,0);g.lineTo(x,ht);g.closePath();g.fill();
      /* la goutte au bout */
      if(alea(i*9)<.4){g.fillStyle='rgba(150,200,230,.5)';g.fillRect(x-1,ht,2,3);}
    }
  });
  COUCHES=[{img:loin,v:0.12,y:0},{img:piliers,v:0.26,y:0},
           {img:galerie,v:0.44,y:0},{img:stal,v:0.66,y:0}];
}

let PIERRES=null, PIERRES_NIV=-1;
function graverLesPierres(){
  const N=bandeNiv();
  PIERRES=[];
  for(let v=0;v<6;v++){
    const c=document.createElement('canvas');
    c.width=CASE*DPR*2;c.height=CASE*DPR*2;
    const g=c.getContext('2d');
    g.setTransform(DPR*2,0,0,DPR*2,0,0);g.imageSmoothingEnabled=false;
    g.fillStyle=N.roche[1];g.fillRect(0,0,CASE,CASE);
    g.fillStyle=N.roche[0];g.fillRect(0,0,CASE,1.5);        /* la lumière du dessus */
    g.fillStyle=N.roche[2];
    g.fillRect(0,CASE-2,CASE,2);
    g.fillRect((v*5)%CASE,0,1.2,CASE);                      /* le joint vertical */
    for(let i=0;i<3;i++){
      const u=alea(v*3+i), w2=alea(v*7+i);
      g.fillStyle=u<.5?N.roche[0]:N.roche[2];
      g.fillRect(2+u*(CASE-5),2+w2*(CASE-5),2,1.6);
    }
    PIERRES.push(c);
  }
  PIERRES_NIV=niveau;
}

const moi={x:60,y:0,vx:0,vy:0,sol:false,sens:1,pas:0,coup:0,vie:30,vieMax:30,mal:0};

/* le personnage, de profil, avec sa pioche */
function dessinerMoi(g,x,y){
  const t=Date.now()/1000;
  const marche=Math.abs(moi.vx)>4&&moi.sol;
  const p=marche?Math.sin(moi.pas):0;
  const saut=!moi.sol;
  g.save();
  g.translate(x,y);
  g.scale(moi.sens,1);
  /* l'ombre */
  g.fillStyle='rgba(0,0,0,.4)';
  g.beginPath();g.ellipse(0,0,7,2.4,0,0,7);g.fill();
  /* les jambes */
  const j1=saut?-3:p*3, j2=saut?2:-p*3;
  R(g,-4,-9,3.4,9+j1,'#2f3a4e');
  R(g,1,-9,3.4,9+j2,'#3a4358');
  R(g,-4.4,-1+j1,4.4,2,'#4a3420');            /* les bottes */
  R(g,0.6,-1+j2,4.4,2,'#4a3420');
  /* le torse */
  const b=marche?Math.round(Math.abs(p)*1.2):0;
  R(g,-5,-20+b,10,11,'#4f7d5c');
  R(g,-5,-20+b,10,2,'#689973');
  R(g,-5,-13+b,10,2,'#3a5c44');               /* la ceinture */
  R(g,-6,-19+b,2,4,'#8a6238');                /* la bretelle du sac */
  /* le sac à dos */
  R(g,-9,-19+b,4,8,'#7d5934');
  R(g,-9,-19+b,4,2,'#96703f');
  /* la tête */
  R(g,-4,-28+b,8,8,'#e8c49a');
  R(g,-4,-30+b,8,3,'#5b3f21');                /* les cheveux */
  R(g,1,-25+b,2,2,'#26241f');                 /* l'œil */
  R(g,-1,-22+b,4,1.4,'#c99a74');              /* la barbe */
  /* le casque de mineur, avec sa lampe */
  R(g,-5,-32+b,10,3,'#c9a24a');
  R(g,-4,-34+b,8,2.4,'#e2ba69');
  R(g,3,-32+b,3,2.6,'#ffe9a8');
  if(allumee){
    /* le faisceau du casque */
    g.save();
    const d=g.createLinearGradient(5,-31+b,40,-20+b);
    d.addColorStop(0,'rgba(255,220,150,.30)');
    d.addColorStop(1,'rgba(255,220,150,0)');
    g.fillStyle=d;
    g.beginPath();g.moveTo(5,-32+b);g.lineTo(44,-40+b);g.lineTo(44,-6+b);g.closePath();g.fill();
    g.restore();
  }
  /* la pioche : au repos sur l'épaule, ou en plein coup */
  g.save();
  if(moi.coup>0){
    const k=1-moi.coup/0.3;
    g.translate(5,-16+b);
    g.rotate(-1.5+k*2.4);
  }else{
    g.translate(-2,-20+b);
    g.rotate(-0.9+(marche?Math.sin(moi.pas)*0.06:0));
  }
  R(g,-1,-2,2.4,15,'#8a6238');                /* le manche */
  R(g,-1,-2,1,15,'#a5764a');
  g.fillStyle='#a2a9b0';                      /* le fer */
  g.beginPath();
  g.moveTo(-7,-3);g.quadraticCurveTo(0,-8,7,-3);
  g.quadraticCurveTo(0,-5.4,-7,-3);g.closePath();g.fill();
  g.fillStyle='#d0d6db';
  g.beginPath();
  g.moveTo(-7,-3);g.quadraticCurveTo(0,-8,7,-3);
  g.quadraticCurveTo(0,-6.4,-7,-3);g.closePath();g.fill();
  g.restore();
  g.restore();
}

/* ================= les bêtes, de profil ================= */
function dessinerBete(g,b,x,y){
  const t=Date.now()/1000, T=b.taille;
  const touche=b.touche>0;
  const pas=Math.sin(t*7+b.t);              /* le pas, ou le battement d'aile */
  const flotte=b.vole?Math.sin(t*3.4+b.t)*5:0;
  const yy=y-flotte;
  const cl=touche?'#ffdede':b.coul[0];
  const so=touche?'#ffb9b9':b.coul[1];
  const oeil=b.chasse?'#ff4a3a':'#ffcf6a';

  /* l'ombre, plus resserrée quand la bête vole */
  g.fillStyle='rgba(0,0,0,'+(b.vole?.28:.42)+')';
  g.beginPath();g.ellipse(x,y,11*T*(b.vole?.7:1),4*T,0,0,7);g.fill();

  g.save();
  if(touche){g.save();g.globalAlpha=.5;}

  switch(b.nom){
  /* ---- le rat : long, bas sur pattes, la queue qui fouette ---- */
  case 'rat des galeries':{
    const q=Math.sin(t*6+b.t)*4;
    g.strokeStyle=so;g.lineWidth=2*T;
    g.beginPath();g.moveTo(x-9*T,yy-5*T);
    g.quadraticCurveTo(x-18*T,yy-7*T+q,x-22*T,yy-2*T+q);g.stroke();
    R(g,x-4*T,yy-3*T+Math.abs(pas),3*T,4*T,so);      /* les pattes */
    R(g,x+3*T,yy-3*T-Math.abs(pas),3*T,4*T,so);
    g.fillStyle=cl;                                   /* le corps */
    g.beginPath();g.ellipse(x-1*T,yy-8*T,10*T,6*T,0,0,7);g.fill();
    g.fillStyle=so;
    g.beginPath();g.ellipse(x-1*T,yy-6*T,10*T,3.4*T,0,0,7);g.fill();
    g.fillStyle=cl;                                   /* la tête */
    g.beginPath();g.ellipse(x+9*T,yy-9*T,6*T,5*T,0,0,7);g.fill();
    g.fillStyle=so;                                   /* l'oreille */
    g.beginPath();g.ellipse(x+7*T,yy-13*T,3*T,3.4*T,0,0,7);g.fill();
    g.fillStyle='#e8b2b6';
    g.beginPath();g.ellipse(x+7*T,yy-13*T,1.4*T,1.8*T,0,0,7);g.fill();
    R(g,x+12*T,yy-10*T,2*T,2*T,oeil);                 /* l'œil */
    R(g,x+14*T,yy-8*T,2*T,1.4*T,'#f0c4c8');           /* le museau */
    g.fillStyle='#fff';                               /* la dent */
    g.fillRect(x+13*T,yy-6.6*T,1.4*T,2*T);
    break;}

  /* ---- la chauve-souris : deux grandes ailes membranées ---- */
  case 'chauve-souris':{
    const bat=Math.sin(t*11+b.t);
    for(const s of [-1,1]){
      g.fillStyle=so;
      g.beginPath();
      g.moveTo(x+s*3*T,yy-12*T);
      g.quadraticCurveTo(x+s*13*T,yy-20*T-bat*6*T,x+s*20*T,yy-13*T-bat*3*T);
      g.quadraticCurveTo(x+s*15*T,yy-11*T,x+s*16*T,yy-6*T);
      g.quadraticCurveTo(x+s*11*T,yy-9*T,x+s*10*T,yy-4*T);
      g.quadraticCurveTo(x+s*7*T,yy-8*T,x+s*3*T,yy-8*T);
      g.closePath();g.fill();
      g.strokeStyle=cl;g.lineWidth=1*T;                /* les nervures */
      g.beginPath();
      g.moveTo(x+s*4*T,yy-11*T);g.lineTo(x+s*18*T,yy-13*T-bat*3*T);
      g.moveTo(x+s*4*T,yy-10*T);g.lineTo(x+s*13*T,yy-6*T);
      g.stroke();
    }
    g.fillStyle=cl;                                    /* le corps */
    g.beginPath();g.ellipse(x,yy-11*T,5*T,7*T,0,0,7);g.fill();
    for(const s of [-1,1]){                            /* les oreilles */
      g.fillStyle=cl;
      g.beginPath();g.moveTo(x+s*2*T,yy-16*T);
      g.lineTo(x+s*5*T,yy-23*T);g.lineTo(x+s*6*T,yy-15*T);g.closePath();g.fill();
    }
    R(g,x-3*T,yy-15*T,2.4*T,2.4*T,oeil);
    R(g,x+1*T,yy-15*T,2.4*T,2.4*T,oeil);
    g.fillStyle='#fff';                                /* les crocs */
    g.fillRect(x-2*T,yy-11*T,1.2*T,2*T);g.fillRect(x+1*T,yy-11*T,1.2*T,2*T);
    break;}

  /* ---- l'araignée : huit pattes articulées, l'abdomen rayé ---- */
  case 'araignée':{
    g.strokeStyle=so;g.lineWidth=1.8*T;
    for(const s of [-1,1])for(let i=0;i<4;i++){
      const ph=Math.sin(t*8+i*1.3+b.t)*2;
      const base=yy-9*T;
      g.beginPath();
      g.moveTo(x+s*4*T,base);
      g.lineTo(x+s*(10+i*3)*T,base-6*T-ph);
      g.lineTo(x+s*(13+i*4)*T,base+4*T+ph*0.5);
      g.stroke();
    }
    g.fillStyle=cl;                                    /* l'abdomen */
    g.beginPath();g.ellipse(x-5*T,yy-10*T,8*T,7*T,0,0,7);g.fill();
    g.fillStyle=so;                                    /* les rayures */
    g.beginPath();g.ellipse(x-5*T,yy-12*T,6*T,2.4*T,0,0,7);g.fill();
    g.fillStyle=cl;                                    /* le céphalothorax */
    g.beginPath();g.ellipse(x+5*T,yy-9*T,5*T,4.6*T,0,0,7);g.fill();
    for(const s of [-1,1]){                            /* les yeux, en grappe */
      R(g,x+(6+s*2)*T,yy-11*T,2*T,2*T,oeil);
      R(g,x+(8+s*1.6)*T,yy-9*T,1.4*T,1.4*T,oeil);
    }
    g.strokeStyle=so;g.lineWidth=1.4*T;                /* les crochets */
    g.beginPath();g.moveTo(x+9*T,yy-7*T);g.lineTo(x+12*T,yy-4*T);
    g.moveTo(x+8*T,yy-6*T);g.lineTo(x+10*T,yy-3*T);g.stroke();
    break;}

  /* ---- le gobelin : trapu, un gourdin, un pagne ---- */
  case 'gobelin':{
    const br=Math.sin(t*5+b.t)*3;
    R(g,x-5*T,yy-6*T,4*T,6*T,so);                      /* les jambes */
    R(g,x+2*T,yy-6*T,4*T,6*T,so);
    g.fillStyle=cl;                                    /* le torse */
    g.beginPath();g.ellipse(x,yy-12*T,8*T,7*T,0,0,7);g.fill();
    R(g,x-8*T,yy-8*T,16*T,4*T,'#8a5a30');              /* le pagne */
    R(g,x-8*T,yy-8*T,16*T,1.4*T,'#a5764a');
    g.fillStyle=cl;                                    /* la tête */
    g.beginPath();g.ellipse(x,yy-21*T,6.4*T,5.6*T,0,0,7);g.fill();
    for(const s of [-1,1]){                            /* les grandes oreilles */
      g.fillStyle=so;
      g.beginPath();g.moveTo(x+s*5*T,yy-22*T);
      g.lineTo(x+s*13*T,yy-26*T);g.lineTo(x+s*6*T,yy-18*T);g.closePath();g.fill();
    }
    R(g,x-4*T,yy-23*T,3*T,2.4*T,oeil);
    R(g,x+1*T,yy-23*T,3*T,2.4*T,oeil);
    g.fillStyle='#fff';                                /* les dents */
    g.fillRect(x-2*T,yy-19*T,1.6*T,2.4*T);
    g.fillRect(x+1*T,yy-19*T,1.6*T,2*T);
    R(g,x+7*T,yy-16*T+br,3*T,9*T,so);                  /* le bras */
    R(g,x+8*T,yy-26*T+br,3*T,11*T,'#7d5934');          /* le gourdin */
    g.fillStyle='#6b4a28';
    g.beginPath();g.ellipse(x+9.5*T,yy-27*T+br,5*T,4*T,0,0,7);g.fill();
    for(let i=0;i<3;i++)R(g,x+(6+i*2.4)*T,yy-29*T+br,1.6*T,1.6*T,'#a2a9b0');
    break;}

  /* ---- le rampant : un mille-pattes qui ondule ---- */
  case 'rampant':{
    g.strokeStyle=so;g.lineWidth=1.6*T;
    for(let i=0;i<7;i++){
      const seg=x-(i*6)*T, on=Math.sin(t*5-i*0.7+b.t)*3;
      g.beginPath();g.moveTo(seg,yy-8*T+on);g.lineTo(seg-3*T,yy-1*T+on);g.stroke();
      g.beginPath();g.moveTo(seg,yy-8*T+on);g.lineTo(seg+2*T,yy-14*T+on);g.stroke();
    }
    for(let i=6;i>=0;i--){
      const seg=x-(i*6)*T, on=Math.sin(t*5-i*0.7+b.t)*3;
      g.fillStyle=i%2?so:cl;
      g.beginPath();g.ellipse(seg,yy-8*T+on,5.4*T,4.6*T,0,0,7);g.fill();
    }
    g.fillStyle=cl;                                    /* la tête cuirassée */
    g.beginPath();g.ellipse(x+7*T,yy-9*T,6.4*T,5.4*T,0,0,7);g.fill();
    g.fillStyle=so;
    g.beginPath();g.ellipse(x+7*T,yy-11*T,5*T,2.4*T,0,0,7);g.fill();
    R(g,x+8*T,yy-11*T,2.4*T,2.4*T,oeil);
    R(g,x+11*T,yy-9*T,2*T,2*T,oeil);
    g.strokeStyle='#e8e2d4';g.lineWidth=1.6*T;         /* les mandibules */
    g.beginPath();g.moveTo(x+12*T,yy-8*T);g.lineTo(x+17*T,yy-10*T);
    g.moveTo(x+12*T,yy-6*T);g.lineTo(x+17*T,yy-4*T);g.stroke();
    break;}

  /* ---- le spectre : un linceul flottant, sans jambes ---- */
  case 'spectre':{
    g.save();
    g.globalAlpha=touche?.6:.82;
    const on=Math.sin(t*2.2+b.t)*3;
    g.fillStyle=cl;                                    /* le drap */
    g.beginPath();
    g.moveTo(x-9*T,yy-16*T);
    g.quadraticCurveTo(x,yy-30*T,x+9*T,yy-16*T);
    g.lineTo(x+9*T,yy-2*T);
    for(let i=0;i<4;i++){                              /* le bas déchiré */
      const xx=x+9*T-(i*4.5)*T;
      g.quadraticCurveTo(xx-2*T,yy+2*T+on,xx-4.5*T,yy-3*T);
    }
    g.closePath();g.fill();
    g.fillStyle=so;                                    /* le creux du capuchon */
    g.beginPath();g.ellipse(x,yy-20*T,6*T,6.4*T,0,0,7);g.fill();
    g.restore();
    /* les yeux, seuls nets */
    g.fillStyle=b.chasse?'#ff6a4a':'#9fe0ff';
    g.beginPath();g.ellipse(x-3*T,yy-21*T,2*T,2.6*T,0,0,7);g.fill();
    g.beginPath();g.ellipse(x+3*T,yy-21*T,2*T,2.6*T,0,0,7);g.fill();
    g.save();g.globalAlpha=.25;
    g.fillStyle=b.chasse?'#ff6a4a':'#9fe0ff';
    g.beginPath();g.arc(x,yy-21*T,11*T,0,7);g.fill();g.restore();
    /* les bras tendus */
    g.strokeStyle=cl;g.lineWidth=2.4*T;g.globalAlpha=.7;
    g.beginPath();
    g.moveTo(x-7*T,yy-17*T);g.lineTo(x-13*T,yy-11*T+on);
    g.moveTo(x+7*T,yy-17*T);g.lineTo(x+13*T,yy-11*T-on);
    g.stroke();g.globalAlpha=1;
    break;}

  /* ---- le golem : des blocs assemblés, un cœur brûlant ---- */
  case 'golem de pierre':{
    const bat2=0.6+Math.sin(t*2.4+b.t)*0.4;
    R(g,x-9*T,yy-9*T,7*T,9*T,so);                      /* les jambes */
    R(g,x+2*T,yy-9*T,7*T,9*T,so);
    R(g,x-11*T,yy-26*T,22*T,18*T,cl);                  /* le torse */
    R(g,x-11*T,yy-26*T,22*T,3*T,touche?'#fff':'#9aa1a8');
    R(g,x-11*T,yy-18*T,22*T,1.6*T,so);                 /* le joint */
    R(g,x-15*T,yy-25*T,5*T,14*T,so);                   /* les bras */
    R(g,x+11*T,yy-25*T,5*T,14*T,so);
    R(g,x-17*T,yy-13*T,8*T,7*T,cl);                    /* les poings */
    R(g,x+10*T,yy-13*T,8*T,7*T,cl);
    R(g,x-7*T,yy-36*T,14*T,11*T,cl);                   /* la tête */
    R(g,x-7*T,yy-36*T,14*T,2.4*T,touche?'#fff':'#9aa1a8');
    R(g,x-5*T,yy-32*T,4*T,3*T,oeil);
    R(g,x+1*T,yy-32*T,4*T,3*T,oeil);
    /* le cœur, qui bat sous la pierre */
    g.save();g.globalAlpha=bat2;
    g.fillStyle='#ff8a3a';
    g.beginPath();g.arc(x,yy-17*T,4.4*T,0,7);g.fill();
    g.globalAlpha=bat2*0.32;
    g.beginPath();g.arc(x,yy-17*T,11*T,0,7);g.fill();
    g.restore();
    /* la mousse sur les épaules */
    g.fillStyle='rgba(96,140,70,.5)';
    g.fillRect(x-11*T,yy-26*T,7*T,2.4*T);
    g.fillRect(x+5*T,yy-26*T,6*T,2*T);
    break;}

  /* ---- l'ombre du fond : une forme qui n'a pas de contour net ---- */
  default:{
    const on=Math.sin(t*1.8+b.t)*4;
    g.save();
    for(let i=3;i>0;i--){                              /* des voiles superposés */
      g.globalAlpha=0.18*i;
      g.fillStyle=cl;
      g.beginPath();
      g.ellipse(x+Math.sin(t*1.2+i)*3,yy-16*T,(10+i*3)*T,(15+i*2)*T,0,0,7);
      g.fill();
    }
    g.globalAlpha=touche?.7:.95;
    g.fillStyle=cl;
    g.beginPath();
    g.moveTo(x-10*T,yy-14*T);
    g.quadraticCurveTo(x,yy-34*T,x+10*T,yy-14*T);
    for(let i=0;i<5;i++){
      const xx=x+10*T-(i*5)*T;
      g.quadraticCurveTo(xx-2*T,yy+1*T+on*Math.sin(i),xx-5*T,yy-5*T);
    }
    g.closePath();g.fill();
    g.restore();
    /* trois yeux */
    g.fillStyle=b.chasse?'#ff3a2a':'#c88aff';
    [[-5,-22],[5,-22],[0,-16]].forEach(([a,c])=>{
      g.beginPath();g.ellipse(x+a*T,yy+c*T,2.2*T,3*T,0,0,7);g.fill();});
    g.save();g.globalAlpha=.3;
    g.fillStyle=b.chasse?'#ff3a2a':'#c88aff';
    g.beginPath();g.arc(x,yy-20*T,14*T,0,7);g.fill();g.restore();
    break;}
  }
  if(touche)g.restore();
  g.restore();

  /* sa vie, au-dessus */
  if(b.vie<b.vieMax){
    const w=22*T, h=3.4;
    const hy=yy-(b.nom==='golem de pierre'?42:30)*T;
    g.fillStyle='rgba(0,0,0,.62)';g.fillRect(x-w/2-1,hy-1,w+2,h+2);
    g.fillStyle='#3a1c18';g.fillRect(x-w/2,hy,w,h);
    g.fillStyle=touche?'#ffd2d2':'#e0705a';
    g.fillRect(x-w/2,hy,w*Math.max(0,b.vie/b.vieMax),h);
    g.fillStyle='rgba(255,255,255,.3)';
    g.fillRect(x-w/2,hy,w*Math.max(0,b.vie/b.vieMax),1);
  }
}

  g.closePath();g.fill();
  const pos=[[-4,-8],[1,-5],[-1,-10],[4,-4]];
  for(let i=0;i<n+1;i++){
    const [a,b]=pos[i%4];
    R(g,x+a,y+b,3.4,3.4,c[0]);

  }

/* ================= la boucle ================= */
function taille(){
  DPR=Math.max(1,Math.min(3,Math.floor(window.devicePixelRatio||1)));
  cv.width=innerWidth*DPR;cv.height=innerHeight*DPR;
  ECH=DPR*3;VW=cv.width/ECH;VH=cv.height/ECH;
  ctx.setTransform(ECH,0,0,ECH,0,0);
  ctx.imageSmoothingEnabled=false;
  PIERRES_NIV=-1;
}
addEventListener('resize',taille);
let t0=performance.now();
function boucle(t){
  const dt=Math.min(.045,(t-t0)/1000);t0=t;
  /* toi */
  const acc=(app.d?1:0)-(app.g?1:0);
  if(acc){moi.vx+=acc*560*dt;moi.sens=acc>0?1:-1;}
  else moi.vx*=Math.pow(0.0012,dt);
  moi.vx=Math.max(-78,Math.min(78,moi.vx));
  moi.x=Math.max(20,Math.min(LARG*CASE-20,moi.x+moi.vx*dt));
  if(Math.abs(moi.vx)>4&&moi.sol)moi.pas+=dt*13;
  moi.vy+=620*dt;
  moi.y+=moi.vy*dt;
  /* le sol et les plateformes */
  let sol=solEn(moi.x);
  PLATEFORMES.forEach(p=>{
    const x0=p.x*CASE-CASE/2, x1=(p.x+p.l)*CASE;
    const py=p.y*CASE;
    if(moi.x>x0&&moi.x<x1&&moi.vy>=0&&moi.y<=py+8&&moi.y>=py-14)sol=Math.min(sol,py);
  });
  if(moi.y>=sol){moi.y=sol;moi.vy=0;moi.sol=true;}
  else moi.sol=false;
  if(moi.coup>0)moi.coup=Math.max(0,moi.coup-dt);
  if(moi.mal>0)moi.mal=Math.max(0,moi.mal-dt);
  /* les bêtes */
  BETES.forEach(b=>{
    if(b.vie<=0)return;
    if(b.touche>0)b.touche=Math.max(0,b.touche-dt);
    const d=moi.x-b.x;
    if(Math.abs(d)<150&&allumee)b.chasse=true;
    if(b.chasse)b.vx=Math.sign(d)*26;
    b.x+=b.vx*dt;
    b.y=solEn(b.x);
    if(Math.abs(d)<12&&Math.abs(moi.y-b.y)<14){
      b.frappe=(b.frappe||0)-dt;
      if(b.frappe<=0){b.frappe=1.2;
        moi.mal=0.3;secousse=5;repos=0;
        volant(moi.x,moi.y-34,'-'+b.deg,'#ff8a8a');
        moi.vx=-Math.sign(d)*70;moi.vy=-70;
        blesser(b.deg,b.nom);
      }
    }
  });
  /* la sortie et le puits, quand on marche dessus */
  if(!mort){
    if(PUITS&&Math.abs(moi.x-PUITS.x)<14&&Math.abs(moi.y-PUITS.y)<20&&!enChangement){
      enChangement=true;changerNiveau(niveau+1,false).then(()=>{enChangement=false;});
    }
    if(SORTIE&&Math.abs(moi.x-SORTIE.x)<14&&Math.abs(moi.y-SORTIE.y)<20&&!enChangement){
      enChangement=true;
      if(niveau===1){remonterAuJour();}
      else changerNiveau(niveau-1,true).then(()=>{enChangement=false;});
    }
  }
  /* le souffle qui revient */
  repos+=dt;
  if(repos>8&&moi.vie<VIE_MAX_S){
    soin+=dt;
    if(soin>=4){soin=0;moi.vie=Math.min(VIE_MAX_S,moi.vie+1);
      volant(moi.x,moi.y-40,'+1','#9fdfb8');}
  }
  /* la torche */
  if(allumee){torche-=dt;if(torche<=0){torche=0;allumee=false;dire('ta lampe s’éteint');}}
  $('vieB').style.width=(moi.vie/moi.vieMax*100)+'%';
  $('vieT').textContent=moi.vie;
  $('torcheB').style.width=(torche/120*100)+'%';
  $('torcheT').textContent=allumee?(Math.floor(torche/60)+':'+String(Math.floor(torche%60)).padStart(2,'0')):'éteinte';
  $('prof').innerHTML='NIVEAU '+niveau+'<small>'+nomNiveau(niveau)+'</small>';
  $('piocher').classList.toggle('pret',!!(filonVise()||beteProche()));
  /* les particules */
  for(let i=PARTS.length-1;i>=0;i--){
    const p=PARTS[i];p.t+=dt;p.vy+=400*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.t>0.9)PARTS.splice(i,1);
  }
  for(let i=TEXTES.length-1;i>=0;i--){TEXTES[i].t+=dt;TEXTES[i].y-=dt*18;
    if(TEXTES[i].t>1.4)TEXTES.splice(i,1);}
  if(secousse>0)secousse=Math.max(0,secousse-dt*20);
  dessiner();
  requestAnimationFrame(boucle);
}

function dessiner(){
  const g=ctx;
  const N=bandeNiv();
  if(!COUCHES)graverLeFond();
  if(PIERRES_NIV!==niveau||!PIERRES)graverLesPierres();
  const sx=secousse?Math.round((Math.random()-.5)*secousse):0;
  const camX=Math.max(0,Math.min(LARG*CASE-VW,moi.x-VW*0.42))+sx;
  const camY=Math.max(-20,Math.min(HAUT*CASE-VH+20,moi.y-VH*0.62));

  g.fillStyle=N.fond;g.fillRect(0,0,VW,VH);
  /* les quatre couches du fond */
  COUCHES.forEach((c,i)=>{
    const w=c.img.width, h=c.img.height;
    const dx=-((camX*c.v)%w);
    const dy=-camY*c.v*0.5-10;
    g.save();
    g.globalAlpha=[0.55,0.7,0.85,1][i];
    for(let x=dx;x<VW;x+=w)g.drawImage(c.img,Math.round(x),Math.round(dy),w,h);
    g.restore();
  });
  /* un voile sombre entre le fond et le premier plan */
  const voile=g.createLinearGradient(0,0,0,VH);
  voile.addColorStop(0,'rgba(0,0,0,.42)');
  voile.addColorStop(.55,'rgba(0,0,0,.18)');
  voile.addColorStop(1,'rgba(0,0,0,.5)');
  g.fillStyle=voile;g.fillRect(0,0,VW,VH);

  /* ---- le premier plan : le sol, les plateformes ---- */
  const a0=Math.max(0,((camX/CASE)|0)-2), a1=Math.min(LARG,((camX+VW)/CASE)+2);
  /* le plafond */
  for(let a=a0;a<a1;a++){
    const x=a*CASE-camX;
    const hp=Math.round((SOL[a]-13-Math.sin(a*0.4)*1.5))*CASE;
    for(let y=-CASE*3;y<hp-camY;y+=CASE)
      g.drawImage(PIERRES[(a+((y/CASE)|0))%6],Math.round(x),Math.round(y),CASE,CASE);
    /* l'arête éclairée du plafond */
    R(g,x,hp-camY-2,CASE,2,N.roche[0]);
  }
  /* le sol */
  for(let a=a0;a<a1;a++){
    const x=a*CASE-camX, y=SOL[a]*CASE-camY;
    R(g,x,y,CASE,3,N.roche[0]);                      /* l'arête claire */
    for(let k=0;k<10;k++)
      g.drawImage(PIERRES[(a+k)%6],Math.round(x),Math.round(y+3+k*CASE),CASE,CASE);
  }
  /* les plateformes */
  PLATEFORMES.forEach(p=>{
    const x=p.x*CASE-camX, y=p.y*CASE-camY;
    if(x<-80||x>VW+80)return;
    for(let k=0;k<p.l;k++)R(g,x+k*CASE,y,CASE,5,'#7d5934');
    R(g,x,y,p.l*CASE,2,'#96703f');
    R(g,x,y+5,p.l*CASE,2,'#4a3218');
    /* les cordes de soutien */
    g.strokeStyle='#6b5334';g.lineWidth=1;
    g.beginPath();g.moveTo(x+3,y);g.lineTo(x+3,y-14);
    g.moveTo(x+p.l*CASE-3,y);g.lineTo(x+p.l*CASE-3,y-14);g.stroke();
  });
  /* le décor */
  DECORS.forEach(d=>{
    const x=d.x*CASE-camX, y=d.y*CASE-camY;
    if(x<-60||x>VW+60)return;
    if(d.t==='etai')etai(g,x,y);
    else if(d.t==='wagon')wagon(g,x,y);
    else if(d.t==='caisse')caisse(g,x,y);
    else champi(g,x,y);
  });
  LAMPES.forEach(l=>{
    const x=l.x*CASE-camX, y=l.y*CASE-camY;
    if(x<-40||x>VW+40)return;
    lampeMur(g,x,y);
  });
  /* la sortie, à gauche, et le puits, à droite */
  if(SORTIE)sortieD(g,SORTIE.x-camX,SORTIE.y-camY);
  if(PUITS)puitsD(g,PUITS.x-camX,PUITS.y-camY);
  /* les filons */
  FILONS.forEach(f=>{
    if(f.mort)return;
    const x=f.x*CASE-camX, y=f.y*CASE-camY;
    if(x<-40||x>VW+40)return;
    filon(g,f,x,y);
  });
  /* les bêtes */
  BETES.forEach(b=>{if(b.vie<=0)return;
    const x=b.x-camX, y=b.y-camY;
    if(x<-50||x>VW+50)return;
    dessinerBete(g,b,x,y);});
  /* toi */
  dessinerMoi(g,Math.round(moi.x-camX),Math.round(moi.y-camY));
  /* les éclats de roche */
  PARTS.forEach(p=>{
    g.globalAlpha=Math.max(0,1-p.t/0.9);
    R(g,p.x-camX,p.y-camY,2,2,p.c);
    g.globalAlpha=1;
  });
  /* la lumière : le halo du casque, plus le noir autour */
  const px=moi.x-camX, py=moi.y-camY-16;
  const rayon=allumee?128:38;
  const d2=g.createRadialGradient(px,py,rayon*0.3,px,py,rayon);
  d2.addColorStop(0,'rgba(0,0,0,0)');
  d2.addColorStop(.6,'rgba(8,6,4,.35)');
  d2.addColorStop(1,'rgba(5,4,3,.88)');
  g.fillStyle=d2;g.fillRect(0,0,VW,VH);
  if(allumee){
    const t=Date.now()/1000, vac=1+Math.sin(t*7)*0.03;
    const d3=g.createRadialGradient(px,py,2,px,py,rayon*0.6*vac);
    d3.addColorStop(0,'rgba(255,200,130,.17)');
    d3.addColorStop(1,'rgba(255,200,130,0)');
    g.fillStyle=d3;g.fillRect(0,0,VW,VH);
  }
  /* le rouge quand on encaisse */
  if(moi.mal>0){g.fillStyle='rgba(190,40,40,'+(moi.mal*0.8)+')';g.fillRect(0,0,VW,VH);}
  /* les textes */
  g.font='700 7px ui-monospace,monospace';g.textAlign='center';
  TEXTES.forEach(t2=>{
    g.globalAlpha=Math.max(0,1-t2.t/1.4);
    g.fillStyle='rgba(0,0,0,.6)';g.fillText(t2.txt,t2.x-camX+1,t2.y-camY+1);
    g.fillStyle=t2.c;g.fillText(t2.txt,t2.x-camX,t2.y-camY);
    g.globalAlpha=1;
  });
  g.textAlign='left';
}

$('b-sac').onclick=ouvrirSac;
$('b-forge').onclick=ouvrirForge;
$('b-sortir').onclick=remonterAuJour;
$('b-torche').onclick=async()=>{
  if(!(SAC.torche>0))return dire('plus de torche ! le casino en vend');
  if(enLigne&&e.id){
    const d=await appel('retirer_du_sac',{p_joueur:e.id,p_cout:{torche:1}});
    if(d&&d.erreur)return dire(d.erreur);
    SAC=d.sac||SAC;
  }else SAC.torche--;
  torche=120;allumee=true;majSac();dire('lampe rechargée');
};
$('mortOk').onclick=()=>{
  if(enLigne&&e.id)appel('mine_sortir',{p_joueur:e.id});
  location.href='jeu.html';
};

/* ================= l'arrivée ================= */
async function arriver(){
  if(!e.id){
    enLigne=false;SAC={torche:3};dire('mode découverte — rien n’est enregistré');
    creuser();moi.y=solEn(moi.x);majSac();return;
  }
  const d=await appel('mine_entrer',{p_joueur:e.id});
  if(d&&!d.erreur){niveau=d.niveau;moi.vie=d.vie;moi.vieMax=d.vieMax||30;
    VIE_MAX_S=d.vieMax||30;epee=d.epee||0;}
  else enLigne=false;
  const s2=await appel('lire_sac',{p_joueur:e.id});
  if(s2&&!s2.erreur){SAC=s2.sac||{};CHARGE_MAX=s2.max||60;}
  creuser();moi.y=solEn(moi.x);majSac();
  if(!(SAC.torche>0))dire('pas de torche — deux minutes, et il fera noir');
  else dire('niveau 1 · '+nomNiveau(1));
}

creuser();
moi.y=solEn(moi.x);
majSac();
taille();
arriver();
setTimeout(()=>{$('aide').style.opacity='0';},9000);
requestAnimationFrame(boucle);
</script>
