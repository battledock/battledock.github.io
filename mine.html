/* ================= le joystick du jeu, repris tel quel ================= */
let joyX=0,joyY=0;
/* ================= le joystick, flottant =================
   Il n'a pas de place fixe : il apparaît là où le pouce se pose,
   dans toute la moitié gauche de l'écran, et s'efface quand on lâche. */
const jc=$('joy'), jg=jc.getContext('2d');
let JDPR=1;
function tailleJoy(){
  JDPR=Math.max(1,Math.min(3,window.devicePixelRatio||1));
  jc.width=Math.round(window.innerWidth*JDPR);
  jc.height=Math.round(window.innerHeight*JDPR);
  jg.setTransform(JDPR,0,0,JDPR,0,0);
}
addEventListener('resize',tailleJoy);
tailleJoy();

const RAYON=52, POUCE=22;
let J={actif:false,id:null,ox:0,oy:0,x:0,y:0,vie:0};

const pointDe=t=>[t.clientX,t.clientY];
function prendre(x,y){
  const limite=window.innerHeight-96;          /* la barre du bas */
  if(y>limite)y=limite;
  J.actif=true;J.ox=x;J.oy=y;J.x=x;J.y=y;J.vie=1;
  joyX=joyY=0;
  try{navigator.vibrate&&navigator.vibrate(8);}catch(x2){}   /* un petit clic sous le doigt */
}
function tirer(x,y){
  const dx=x-J.ox, dy=y-J.oy, d=Math.hypot(dx,dy);
  const a=Math.atan2(dy,dx);
  const m=Math.min(d,RAYON);
  J.x=J.ox+Math.cos(a)*m;J.y=J.oy+Math.sin(a)*m;
  /* si le pouce s'éloigne trop, le manche se déplace avec lui */
  if(d>RAYON){J.ox=x-Math.cos(a)*RAYON;J.oy=y-Math.sin(a)*RAYON;}
  const n=Math.min(1,d/RAYON);
  joyX=d<1?0:Math.cos(a)*n;joyY=d<1?0:Math.sin(a)*n;
  if(Math.hypot(joyX,joyY)<.16)joyX=joyY=0;
}
function lacher(){J.actif=false;J.id=null;joyX=joyY=0;}

/* on n'accepte le doigt que dans la moitié gauche : la droite reste libre */
const pageOuverte=()=>$('page').classList.contains('on')||$('pageA').classList.contains('on')
                    ||$('mort').classList.contains('on');
/* le joystick se prend n'importe où sur la carte, des deux côtés.
   On ne l'ignore que si le doigt touche un bouton de l'interface. */
const surUnBouton=(cible)=>!!(cible&&cible.closest&&cible.closest('button,#menus,#action,#page,#pageA,#mort,#haut,#prof'));
const zoneMarche=(x,y,cible)=>!pageOuverte()&&!surUnBouton(cible);

/* on écoute la page entière, mais on ne prend le doigt que dans la zone de marche :
   ailleurs, le toucher passe normalement aux boutons */
document.addEventListener('touchstart',ev=>{
  for(const t of ev.changedTouches){
    if(J.actif)continue;
    const [x,y]=pointDe(t);
    if(!zoneMarche(x,y,ev.target))continue;
    ev.preventDefault();
    J.id=t.identifier;prendre(x,y);
  }
},{passive:false});
document.addEventListener('touchmove',ev=>{
  for(const t of ev.changedTouches)if(t.identifier===J.id){
    ev.preventDefault();
    const [x,y]=pointDe(t);tirer(x,y);
  }
},{passive:false});
['touchend','touchcancel'].forEach(k=>document.addEventListener(k,ev=>{
  for(const t of ev.changedTouches)if(t.identifier===J.id){ev.preventDefault();lacher();}
},{passive:false}));

document.addEventListener('mousedown',ev=>{
  if(zoneMarche(ev.clientX,ev.clientY,ev.target))prendre(ev.clientX,ev.clientY);});
addEventListener('mousemove',ev=>{if(J.actif)tirer(ev.clientX,ev.clientY);});
addEventListener('mouseup',()=>{if(J.actif)lacher();});

addEventListener('keydown',ev=>{const k={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],
  z:[0,-1],s:[0,1],q:[-1,0],d:[1,0]}[ev.key];if(k){joyX=k[0];joyY=k[1];}});
addEventListener('keyup',()=>{joyX=joyY=0;});

function dessinerJoy(dt){
  /* il s'efface doucement quand on lâche */
  if(!J.actif&&J.vie>0)J.vie=Math.max(0,J.vie-dt*5);
  jg.clearRect(0,0,window.innerWidth,window.innerHeight);
  if(J.vie<=0)return;
  jg.save();
  jg.globalAlpha=J.vie;
  /* la couronne */
  jg.beginPath();jg.arc(J.ox,J.oy,RAYON,0,7);
  const f=jg.createRadialGradient(J.ox,J.oy-14,6,J.ox,J.oy,RAYON);
  f.addColorStop(0,'rgba(240,246,238,.26)');f.addColorStop(1,'rgba(200,212,198,.12)');
  jg.fillStyle=f;jg.fill();
  jg.lineWidth=2.5;jg.strokeStyle='rgba(240,246,238,.38)';jg.stroke();
  /* le sens, en léger */
  const d=Math.hypot(J.x-J.ox,J.y-J.oy);
  if(d>6){
    const a=Math.atan2(J.y-J.oy,J.x-J.ox);
    jg.beginPath();
    jg.arc(J.ox,J.oy,RAYON-2,a-0.5,a+0.5);
    jg.lineWidth=4;jg.strokeStyle='rgba(169,232,138,.5)';jg.stroke();
  }
  /* le manche */
  jg.beginPath();jg.arc(J.x,J.y+3,POUCE,0,7);jg.fillStyle='rgba(10,18,12,.22)';jg.fill();
  const k=jg.createRadialGradient(J.x-5,J.y-8,3,J.x,J.y,POUCE+1);
  if(d>6){k.addColorStop(0,'#a9e88a');k.addColorStop(1,'#3f7d4a');}
  else{k.addColorStop(0,'#f4f7f0');k.addColorStop(1,'#c9d2c2');}
  jg.beginPath();jg.arc(J.x,J.y,POUCE,0,7);jg.fillStyle=k;jg.fill();
  jg.lineWidth=2.5;jg.strokeStyle=d>6?'#2c6b32':'rgba(40,50,40,.4)';jg.stroke();
  jg.restore();
}


/* ================= la boucle ================= */
function taille(){
  DPR=Math.max(1,Math.min(3,Math.floor(window.devicePixelRatio||1)));
  cv.width=innerWidth*DPR;cv.height=innerHeight*DPR;
  /* La même vue pour tous : l'échelle s'adapte à l'écran pour cadrer
     toujours la même portion de décor, au huitième de point près.
     On borne les deux côtés, donc un écran allongé ne voit pas plus loin. */
  const VUE_L=196, VUE_H=400;
  let e=Math.max(innerWidth/VUE_L,innerHeight/VUE_H);
  ZOOM=Math.max(1.2,Math.round(e*8)/8);
  ECH=ZOOM*DPR;VW=cv.width/ECH;VH=cv.height/ECH;
  ctx.setTransform(ECH,0,0,ECH,0,0);
  ctx.imageSmoothingEnabled=false;
  NIV_GRAVE=-1;
}
addEventListener('resize',taille);
let t0=performance.now();
function boucle(t){
  const dt=Math.min(.05,(t-t0)/1000);t0=t;
  const d=Math.hypot(joyX,joyY);
  if(d>0.08&&GESTE.t<=0&&MUR.length){
    const v=78*dt*Math.min(1,d);
    const nx=joueur.x+joyX/d*v, ny=joueur.y+joyY/d*v;
    if(!bloque(nx,joueur.y))joueur.x=nx;
    if(!bloque(joueur.x,ny))joueur.y=ny;
    joueur.marche=true;joueur.pas+=v*7;
    joueur.dir=Math.abs(joyX)>Math.abs(joyY)?(joyX>0?'droite':'gauche'):(joyY>0?'bas':'haut');
  }else{joueur.marche=false;joueur.pas=0;}
  /* le geste, avec son impact aux deux tiers */
  if(GESTE.t>0){
    const avant=GESTE.t;
    GESTE.t=Math.max(0,GESTE.t-dt*2.3);
    if(avant>0.42&&GESTE.t<=0.42){
      if(GESTE.bete&&GESTE.bete.vie>0)frapperBete(GESTE.bete);
      else if(GESTE.cible&&!GESTE.cible.mort)impact(GESTE.cible);
    }
  }
  if(MUR.length&&!mortJoueur)majBetes(dt);
  if(malSoi>0)malSoi-=dt;
  /* ta vie, affichée */
  $('vieB').style.width=Math.max(0,vie/vieMax*100)+'%';
  $('vieT').textContent=Math.max(0,Math.round(vie));
  if(fondu>0)fondu=Math.max(0,fondu-dt*2);
  if(allumee){torche-=dt;if(torche<=0){torche=0;allumee=false;dire('ta torche s’éteint');}}
  else if(!mortJoueur){
    /* dans le noir complet, on se blesse à tâtons */
    noirDepuis+=dt;
    if(noirDepuis>6){noirDepuis=0;blesser(2,null);}
  }
  $('torcheB').style.width=(torche/120*100)+'%';
  $('torcheT').textContent=allumee?(Math.floor(torche/60)+':'+String(Math.floor(torche%60)).padStart(2,'0')):'éteinte';
  $('prof').innerHTML='NIVEAU '+niveau+'<small>'+
    (niveau<=4?'les premières galeries':niveau<=8?'la roche dure':niveau<=12?'les veines profondes'
     :niveau<=16?'sous la nappe':'le fond du monde')+'</small>';
  for(let i=PARTS.length-1;i>=0;i--){
    const p=PARTS[i];p.t+=dt;p.vy+=380*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.t>0.9)PARTS.splice(i,1);
  }
  for(let i=ETINCELLES.length-1;i>=0;i--){ETINCELLES[i].t+=dt;
    if(ETINCELLES[i].t>0.26)ETINCELLES.splice(i,1);}
  if(TAILLADE){TAILLADE.t+=dt;if(TAILLADE.t>0.26)TAILLADE=null;}
  for(let i=TEXTES.length-1;i>=0;i--){TEXTES[i].t+=dt;TEXTES[i].y-=dt*18;
    if(TEXTES[i].t>1.4)TEXTES.splice(i,1);}
  if(secousse>0)secousse=Math.max(0,secousse-dt*18);
  dessiner();if(MUR.length)majAction();
  dessinerJoy(dt);
  requestAnimationFrame(boucle);
}

function dessiner(){
  const g=ctx, P=palier();
  /* La galerie n'existe qu'après la réponse du serveur : tant qu'elle n'est
     pas creusée, on peint le fond et on attend, plutôt que de planter. */
  if(!MUR.length||!DALLE.length){
    g.fillStyle=nuance().fond;g.fillRect(0,0,VW,VH);
    return;
  }
  if(NIV_GRAVE!==niveau||!JEU_TUILES)graver();
  const sx=secousse?Math.round((Math.random()-.5)*secousse):0;
  const camX=Math.max(0,Math.min(L*CASE-VW,joueur.x-VW/2))+sx;
  const camY=Math.max(0,Math.min(H*CASE-VH,joueur.y-VH*0.55));
  g.fillStyle=nuance().fond;g.fillRect(0,0,VW,VH);
  const a0=Math.max(0,((camX/CASE)|0)-1), a1=Math.min(L,((camX+VW)/CASE)+2);
  const b0=Math.max(0,((camY/CASE)|0)-2), b1=Math.min(H,((camY+VH)/CASE)+3);
  /* le sol, puis l'ombre que la roche jette dessus */
  const T=JEU_TUILES;
  for(let b=b0;b<b1;b++)for(let a=a0;a<a1;a++){
    if(MUR[b][a])continue;
    const x=Math.round(a*CASE-camX), y=Math.round(b*CASE-camY);
    g.drawImage(T.dalles[DALLE[b][a]],x,y,CASE,CASE);
    /* l'ombre de la roche : sept bandes déjà gravées, on les recopie */
    const o=OMBRE[b][a];
    if(o)g.drawImage(T.ombres[o],x,y,CASE,CASE);
  }
  /* les murs : le dessus, puis la face visible sous le bord */
  for(let b=b0;b<b1;b++)for(let a=a0;a<a1;a++){
    if(!MUR[b][a])continue;
    const x=Math.round(a*CASE-camX), y=Math.round(b*CASE-camY);
    g.drawImage(T.dessus[(a*7+b*13)&3],x,y,CASE,CASE);
    /* les liserés : la roche se sculpte là où elle borde le vide */
    if(!mur(a,b-1))g.drawImage(T.bordH,x,y,CASE,3);
    if(!mur(a-1,b))g.drawImage(T.bordG,x,y,3,CASE);
    if(!mur(a+1,b))g.drawImage(T.bordD,x+CASE-3,y,3,CASE);
    /* la face : là où le rocher borde le vide en dessous */
    if(!mur(a,b+1))g.drawImage(T.faces[(a*5+b)%3],x,y+CASE-2,CASE,14);
  }
  /* ce qui est posé dessus, trié du nord au sud */
  const liste=[];
  for(let b=b0-2;b<b1+2;b++){
    const bande=BANDES[b];
    if(!bande)continue;
    for(const o of bande){
    if(o.mort)continue;
    const x=o.a*CASE+CASE/2-camX, y=o.b*CASE+CASE/2-camY;
    if(x<-40||x>VW+40)continue;
    liste.push({y:o.b*CASE,f:()=>{
      const yy=y+4;
      if(o.t==='rail')rail(g,x,y,o.sens);
      else if(o.t==='torche')torcheMur(g,x,y);
      else if(o.t==='etai')etai(g,x,yy);
      else if(o.t==='tonneau')tonneau(g,x,yy);
      else if(o.t==='caisse')caisse(g,x,yy);
      else if(o.t==='wagonnet')wagonnet(g,x,yy);
      else if(o.t==='champi')champiLum(g,x,yy,o.g);
      else if(o.t==='cristal')cristal(g,x,yy,o.g);
      else if(o.t==='mousse')mousse(g,x,yy,o.g);
      else if(o.t==='flaque')flaque(g,x,yy);
      else if(o.t==='gravats')gravats(g,x,yy,o.g);
      else if(o.t==='stalagmite')stalagmite(g,x,yy,o.g);
      else if(o.t==='echelle')echelle(g,x,yy);
      else if(o.t==='ascenseur')ascenseur(g,x,yy);
      else nodule(g,x,yy,o);
    }});
    }
  }
  BETES.forEach(m=>{
    if(m.vie<=0)return;
    const x=m.x-camX, y=m.y-camY;
    if(x<-40||y<-50||x>VW+40||y>VH+40)return;
    liste.push({y:m.y,f:()=>dessinerBete(g,m,x,y)});
  });
  liste.push({y:joueur.y,f:()=>sprite(g,Math.round(joueur.x-camX),Math.round(joueur.y-camY),
    monAp(),joueur.dir,joueur.pas,joueur.marche)});
  liste.sort((p,q)=>p.y-q.y);
  liste.forEach(o=>o.f());
  /* le coup d'épée : un arc qui s'ouvre, s'éclaire, puis s'efface */
  if(TAILLADE){
    const k=TAILLADE.t/0.26;
    if(k<1){
      const x=TAILLADE.x-camX, y=TAILLADE.y-camY-10;
      const base={droite:0,gauche:Math.PI,haut:-Math.PI/2,bas:Math.PI/2}[TAILLADE.dir]||0;
      const ouvre=1.5;                       /* l'angle balayé */
      const a0=base-ouvre/2, a1=a0+ouvre*Math.min(1,k*1.5);
      const r=TAILLADE.portee*(0.7+k*0.45);
      g.save();
      /* la traîne, large et pâle */
      g.globalAlpha=(1-k)*0.55;
      g.lineWidth=7;g.lineCap='round';
      g.strokeStyle=TAILLADE.coul;
      g.beginPath();g.arc(x,y,r,a0,a1);g.stroke();
      /* le fil de la lame, fin et clair */
      g.globalAlpha=(1-k)*0.95;
      g.lineWidth=2.4;
      g.strokeStyle=TAILLADE.vif;
      g.beginPath();g.arc(x,y,r+1.4,a0,a1);g.stroke();
      /* l'éclat au bout du geste */
      if(k<0.5){
        const bx=x+Math.cos(a1)*r, by=y+Math.sin(a1)*r;
        g.globalAlpha=(1-k*2)*0.9;
        g.fillStyle='#fff6d8';
        g.beginPath();g.arc(bx,by,2.6,0,7);g.fill();
      }
      g.restore();
    }
  }
  /* les éclats */
  PARTS.forEach(p=>{
    g.globalAlpha=Math.max(0,1-p.t/0.9);
    R(g,p.x-camX,p.y-camY,2,2,p.c);g.globalAlpha=1;});
  ETINCELLES.forEach(s=>{
    const k=s.t/0.26, x=s.x-camX, y=s.y-camY, r=3+k*12, a=Math.max(0,1-k);
    g.save();g.globalAlpha=a*0.5;g.fillStyle=s.plein?'#ffe9a8':'#ffd9a0';
    g.beginPath();g.arc(x,y,r,0,7);g.fill();
    g.globalAlpha=a;g.strokeStyle='#fff6d8';g.lineWidth=1.2;
    g.beginPath();
    for(let i=0;i<4;i++){const an=i*Math.PI/4+k*0.6,l=2.4+k*8;
      g.moveTo(x-Math.cos(an)*l,y-Math.sin(an)*l);g.lineTo(x+Math.cos(an)*l,y+Math.sin(an)*l);}
    g.stroke();g.restore();});
  /* la lumière : le noir partout, sauf autour de toi et des torches */
  const px=joueur.x-camX, py=joueur.y-camY-8;
  const rayon=allumee?Math.max(78,150-niveau*3.6):36;
  const d2=g.createRadialGradient(px,py,rayon*0.32,px,py,rayon);
  d2.addColorStop(0,'rgba(0,0,0,0)');
  d2.addColorStop(.62,'rgba(6,5,4,.42)');
  d2.addColorStop(1,'rgba(4,3,3,.94)');
  g.fillStyle=d2;g.fillRect(0,0,VW,VH);
  /* les halos des torches percent le noir */
  g.save();g.globalCompositeOperation='lighter';
  OBJETS.forEach(o=>{
    if(o.t!=='torche'&&o.t!=='champi')return;
    const x=o.a*CASE+CASE/2-camX, y=o.b*CASE+CASE/2-camY;
    if(x<-50||y<-50||x>VW+50||y>VH+50)return;
    const t=Date.now()/1000;
    const r=(o.t==='torche'?34:20)*(1+Math.sin(t*5+o.a)*0.04);
    const h=g.createRadialGradient(x,y-10,2,x,y-10,r);
    h.addColorStop(0,o.t==='torche'?'rgba(255,170,80,.30)':'rgba(90,220,230,.22)');
    h.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=h;g.beginPath();g.arc(x,y-10,r,0,7);g.fill();
  });
  g.restore();
  if(allumee){
    const t=Date.now()/1000, vac=1+Math.sin(t*7)*0.03;
    const d3=g.createRadialGradient(px,py,2,px,py,rayon*0.58*vac);
    d3.addColorStop(0,'rgba(255,196,120,.16)');
    d3.addColorStop(1,'rgba(255,196,120,0)');
    g.fillStyle=d3;g.fillRect(0,0,VW,VH);
  }
  if(malSoi>0){
    g.save();g.globalAlpha=Math.min(.34,malSoi);g.fillStyle='#c94a4a';
    g.fillRect(0,0,VW,VH);g.restore();
  }
  if(fondu>0){g.globalAlpha=fondu;g.fillStyle='#000';g.fillRect(0,0,VW,VH);g.globalAlpha=1;}
  g.font='700 7px ui-monospace,monospace';g.textAlign='center';
  TEXTES.forEach(t2=>{
    g.globalAlpha=Math.max(0,1-t2.t/1.4);
    g.fillStyle='rgba(0,0,0,.6)';g.fillText(t2.txt,t2.x-camX+1,t2.y-camY+1);
    g.fillStyle=t2.c;g.fillText(t2.txt,t2.x-camX,t2.y-camY);
    g.globalAlpha=1;});
  g.textAlign='left';
}

$('b-torche').onclick=rallumer;
$('b-sortir').onclick=remonterAuJour;
$('mortOk').onclick=()=>{$('mort').classList.remove('on');mortJoueur=false;
  vie=vieMax;niveau=1;creuser();majSac();remonterAuJour();};
majSac();taille();arriver();
setTimeout(()=>{$('aide').style.opacity='0';},9000);
requestAnimationFrame(boucle);
</script>
