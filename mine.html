<!-- ===== la mise à jour : le jeu ne reste jamais bloqué sur une vieille version ===== -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<script>
/* Ajouté au signet, un navigateur garde la page en mémoire et ne va plus
   jamais la rechercher. On lui demande donc, à chaque ouverture, quelle est
   la version publiée : si elle a changé, on recharge une seule fois avec une
   adresse neuve — c'est la seule façon de percer le cache d'un raccourci. */
(function(){
  var MA_VERSION='2026-09-15-0725';
  var cle='bdl.version.vue';
  function verifier(){
    fetch('version.json?t='+Date.now(),{cache:'no-store'})
      .then(function(r){return r.json();})
      .then(function(d){
        if(!d||!d.v||d.v===MA_VERSION)return;
        /* on ne recharge qu'une fois par version, sinon on bouclerait */
        var deja=null;
        try{deja=sessionStorage.getItem(cle);}catch(e){}
        if(deja===d.v)return;
        try{sessionStorage.setItem(cle,d.v);}catch(e){}
        var u=location.pathname.split('?')[0]+'?v='+encodeURIComponent(d.v);
        location.replace(u);
      })
      .catch(function(){});
  }
  verifier();
  /* et quand on revient sur l'onglet après un moment */
  var vu=Date.now();
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState!=='visible')return;
    if(Date.now()-vu<60000)return;
    vu=Date.now();verifier();
  });
})();
</script>

             'svelte'    :{ep:7,ta:5,ha:7,tete:5,menton:1},
             'moyenne'   :{ep:8,ta:7,ha:7,tete:6,menton:2},
             'athlétique':{ep:9,ta:7,ha:7,tete:6,menton:2},
             'forte'     :{ep:9,ta:9,ha:9,tete:6,menton:3}}[silhouette]||{ep:8,ta:7,ha:7,tete:6,menton:2};
  const EP=SIL.ep, TA=SIL.ta, HA=SIL.ha;   /* demi-largeurs */
  const N='#1b1712';
  const R=(a,b,w,h,c)=>{g.fillStyle=c;g.fillRect(x+a,y+b,w,h);};

  /* marche souple, huit temps */
  const F=bouge?(Math.floor(pas)%8):-1;
  const AN={corps:[0,0,-1,0,0,0,-1,0],
            jg:[2,1,-1,-2,-2,-1,1,2], jd:[-2,-1,1,2,2,1,-1,-2],
            pg:[0,0,1,0,0,0,0,0],     pd:[0,0,0,0,0,0,1,0],
            bg:[-2,-1,1,2,2,1,-1,-2], bd:[2,1,-1,-2,-2,-1,1,2],
            reb:[0,0,1,0,0,0,1,0]};
  const souffle=bouge?0:((Date.now()/1400|0)%3===0?1:0);
  const Y=bouge?AN.corps[F]:souffle;
  const jgP=bouge?AN.jg[F]:0, jdP=bouge?AN.jd[F]:0;
  const jgL=bouge?AN.pg[F]:0, jdL=bouge?AN.pd[F]:0;
  const bgP=bouge?AN.bg[F]:0, bdP=bouge?AN.bd[F]:0;
  const reb=bouge?AN.reb[F]:0;
  const prof=dir==='haut', cote=dir==='gauche'||dir==='droite';
  const MANCHE_AR={'veste':11,'chemise':11,'pull':11,'manteau':11,'tunique':9,
                   'gilet':0,'t-shirt':4,'débardeur':0}[HAUTS[p.haut]||'veste'];
  const s=dir==='droite'?1:-1;

  /* ---- mesures du corps (quatre têtes) ----
     pieds 0 · jambes 13 · torse 15 · tête 11, sommet à -40 */
  const JH=13, TH=15, HT=11;
  const yT=-JH-TH;                 /* haut du torse  = -28 */
  const yTete=yT-HT-2;             /* la tête est décollée du torse : le cou apparaît */

  /* ---- le geste de frappe, en trois temps ----
     1 → 0,58 : l'élan, la pioche part en arrière
     0,58 → 0,42 : l'abattage, très rapide
     0,42 → 0   : la reprise, le corps se redresse                */
  const fr=(typeof GESTE!=='undefined'&&GESTE.t>0)?GESTE.t:0;
  const typeGeste=(typeof GESTE!=='undefined'&&GESTE.type)||'pioche';
  let phase=0, arc=0, penche=0, tasse=0;
  if(fr>0&&typeGeste==='cueille'){
    /* la cueillette : on se penche, le bras part vers le buisson, on se relève */
    if(fr>0.55){const t=(1-fr)/0.45;penche=doux(t)*2.6;tasse=doux(t)*1.6;arc=1.1*doux(t);phase=1;}
    else if(fr>0.3){const t=(0.55-fr)/0.25;penche=2.6;tasse=1.6;arc=1.1+t*0.5;phase=2;}
    else{const t=1-fr/0.3;penche=2.6*(1-sortRap(t));tasse=1.6*(1-sortRap(t));arc=1.6*(1-sortRap(t));phase=3;}
  }else if(fr>0&&typeGeste==='hache'){
    /* la hache : élan haut, balayage large, reprise lente */
    if(fr>0.62){const t=(1-fr)/0.38;arc=-1.9*doux(t);penche=-doux(t)*2;tasse=doux(t)*1.4;phase=1;}
    else if(fr>0.42){const t=(0.62-fr)/0.2;arc=-1.9+entreRap(t)*3.3;penche=-2+t*5.2;tasse=1.4-t*2.8;phase=2;}
    else{const t=1-fr/0.42;arc=1.4*(1-sortRap(t));penche=3.2*(1-sortRap(t));tasse=-1.4*(1-sortRap(t));phase=3;}
  }else if(fr>0){
    if(fr>0.58){const t=(1-fr)/0.42;arc=-1.45*doux(t);penche=-doux(t)*1.6;tasse=doux(t)*1.2;phase=1;}
    else if(fr>0.42){const t=(0.58-fr)/0.16;arc=-1.45+entreRap(t)*2.75;penche=-1.6+t*4.4;tasse=1.2-t*2.4;phase=2;}
    else{const t=1-fr/0.42;arc=1.3*(1-sortRap(t));penche=2.8*(1-sortRap(t));tasse=-1.2*(1-sortRap(t));phase=3;}
  }

  R(-6,1,12,2,'rgba(40,60,28,.42)');

  /* sac */
  if(sacC!=='aucun'&&prof){                     /* de dos : le sac, bien posé entre les épaules */
    const w2=Math.min(10,EP*2-4);
    R(-(w2>>1),yT+2-reb,w2,13,teint(sacC,-8));
    R(-(w2>>1),yT+2-reb,w2,2,teint(sacC,16));
    R(-(w2>>1),yT+12-reb,w2,2,teint(sacC,-26));
    R(-2,yT+6-reb,4,4,teint(sacC,10));          /* la poche */
    R(-2,yT+6-reb,4,1,teint(sacC,-30));
  }else if(sacC!=='aucun'&&cote){               /* de profil : il dépasse dans le dos */
    const sx=s>0?-(EP+1):EP-2;
    R(sx,yT+2-reb,4,12,teint(sacC,-16));
    R(sx,yT+2-reb,4,2,teint(sacC,10));
    R(sx,yT+12-reb,4,1,teint(sacC,-30));
  }

  /* ---- jambes ---- */
  /* la chaussure, dessinée selon son type */
  const pied=(px2,py,col)=>{
    if(soulier==='bottes'){
      R(px2,py-2,5,2,teint(col,-16));              /* la tige monte sur la cheville */
      R(px2,py,5,3,col);
      R(px2,py,5,1,teint(col,20));
      R(px2,py+2,5,1,teint(col,-26));             /* la semelle */
    }else if(soulier==='bottillons'){
      R(px2,py-1,5,1,teint(col,-16));
      R(px2,py,5,3,col);
      R(px2,py,5,1,teint(col,18));
      R(px2,py+2,5,1,teint(col,-30));
    }else if(soulier==='baskets'){
      R(px2,py,5,2,col);
      R(px2,py,5,1,teint(col,22));
      R(px2+1,py,2,1,'#f2efe4');                   /* le lacet */
      R(px2,py+2,5,1,'#e8e4d8');                   /* la semelle claire */
    }else{                                          /* sandales : le pied reste visible */
      R(px2+1,py,3,2,peauO);
      R(px2,py+1,5,1,col);
      R(px2+1,py,3,1,col);
      R(px2,py+2,5,1,teint(col,-22));
    }
  };

  /* jusqu'où le tissu descend, selon le bas porté */
  const TISSU={'pantalon':JH,'short':6,'jupe':5,'treillis':JH,'longue jupe':10,'bermuda':8}[basT];
  const jambeProfil=(dec,plie,col,botte)=>{
    const h=JH-plie;
    R(-2+dec,-JH,4,h,peau);                    /* la jambe nue */
    if(TISSU>0)R(-2+dec,-JH,4,Math.min(h,TISSU),col);
    if(TISSU>=h)R(-2+dec,-4,4,4,teint(col,-12));
    if(basT==='treillis'){R(-2+dec,-JH+5,4,1,teint(col,-22));R(-1+dec,-JH+6,2,2,teint(col,14));}
    pied(-3+dec,-JH+h,botte);
  };
  const jambeFace=(cx,phase,col,botte)=>{
    const avance=phase>0;
    const h=avance?JH:JH-2;
    const ec=Math.abs(phase)>1?(avance?-1:1):0;
    R(cx+ec,-JH,4,h,avance?teint(peau,4):teint(peau,-14));   /* la jambe */
    if(TISSU>0){
      R(cx+ec,-JH,4,Math.min(h,TISSU),avance?teint(col,8):teint(col,-10));
      R(cx+ec,-JH,4,1,pantC);
    }
    if(basT==='treillis'){R(cx+ec,-JH+5,4,1,teint(col,-22));R(cx+1+ec,-JH+6,2,2,teint(col,14));}
    pied(cx-1+ec,-JH+h,avance?botte:teint(botte,-14));
  };
  if(cote){
    jambeProfil(jdP*0.9-1,jdL,pantO,teint(chau,-14));
    jambeProfil(jgP*0.9-1,jgL,pant,chau);
  }else{
    if(jgP>=jdP){jambeFace(1,jdP,pantO,teint(chau,-14));jambeFace(-5,jgP,pant,chau);}
    else{jambeFace(-5,jgP,pant,chau);jambeFace(1,jdP,pantO,teint(chau,-14));}
  }

  /* jupe : un trapèze par-dessus le haut des jambes */
  if(basT==='jupe'||basT==='longue jupe'){
    const hj=basT==='jupe'?6:9;
    for(let i=0;i<hj;i++){
      const w2=HA-1+Math.round(i*(basT==='jupe'?0.7:0.55));
      R(-w2,-JH+i,w2*2,1,i<2?pantC:pant);
    }
    R(-(HA+3),-JH+hj-1,(HA+3)*2,1,pantO);
  }

  /* hanches : elles ferment la jonction entre le torse et les jambes */
  R(-(HA+1),-JH-2,(HA+1)*2,3,N);
  R(-HA,-JH-1,HA*2,2,pantO);
  R(-HA,-JH-1,HA*2,1,pant);

  /* ---- bras arrière (profil) ---- */
  if(cote){
    const ar=bgP;
    const bx=(s>0?-6:3)-ar*s;
    R(bx,yT+2,3,11,peauT);
    if(MANCHE_AR>0)R(bx,yT+2,3,MANCHE_AR,vesteT);
    R(bx,yT+13,3,3,peauT);
  }

  /* ---- torse : la coupe du vêtement suit la silhouette ---- */
  const colH=veste, colHC=vesteC, colHO=vesteO, colHT=vesteT;
  const pen=fr>0?Math.round(penche*(dir==='gauche'?-1:1)):0;   /* il se penche dans l'effort */
  const tas=fr>0?Math.max(0,Math.round(tasse)):0;              /* et se tasse */
  R(-EP+pen,yT-1+tas,EP*2,TH+1-tas,N);           /* contour aux épaules */
  R(-EP+1,yT,EP*2-2,3,colH);                     /* les épaules */
  R(-EP+1,yT,EP*2-2,2,colHC);
  for(let i=3;i<TH-1;i++){                       /* le buste, resserré à la taille */
    const w2=Math.round(EP-1-(EP-TA)*Math.min(1,(i-2)/(TH-5)));
    R(-w2,yT+i,w2*2,1,colH);
    R(-w2,yT+i,2,1,colHT);
    R(w2-2,yT+i,2,1,colHO);
  }
  R(-TA,yT+TH-4,TA*2,2,colHO);                   /* ceinture */
  R(-1,yT+TH-4,2,2,'#c9a24a');
  /* les détails propres à chaque haut */
  if(hautT==='veste'&&!prof){R(-1,yT,2,TH-5,colHO);R(-4,yT,3,2,colHC);R(1,yT,3,2,colHC);}
  if(hautT==='chemise'&&!prof){
    R(-1,yT,2,TH-5,colHT);
    R(-4,yT,4,3,colHC);R(0,yT,4,3,colHC);        /* col ouvert */
    for(let i=0;i<3;i++)R(0,yT+4+i*3,1,1,'#f2efe4');
  }
  if(hautT==='pull'&&!prof){
    R(-3,yT-2,6,3,colHC);R(-3,yT-2,6,1,colH);    /* col montant */
    for(let i=4;i<TH-4;i+=3)R(-EP+2,yT+i,EP*2-4,1,teint(colH,-12));
  }
  if(hautT==='t-shirt'&&!prof){R(-3,yT,6,2,peau);R(-3,yT,6,1,peauC);}
  if(hautT==='débardeur'){
    R(-4,yT,8,3,peau);R(-4,yT,8,1,peauC);        /* décolleté */
    R(-EP+1,yT,2,4,colH);R(EP-3,yT,2,4,colHO);   /* bretelles */
  }
  if(hautT==='gilet'&&!prof){
    R(-2,yT,4,TH-5,peau);R(-2,yT,4,1,peauC);
    R(-2,yT+TH-6,4,2,colHO);
  }
  if(hautT==='manteau'){
    R(-TA,yT+TH-2,TA*2,6,colH);                  /* les pans descendent */
    R(-TA,yT+TH-2,TA*2,1,colHC);
    R(-TA,yT+TH+3,TA*2,1,colHT);
    if(!prof)R(-1,yT+TH-2,2,6,colHT);
  }
  if(hautT==='tunique'){
    R(-TA,yT+TH-2,TA*2,4,colH);
    R(-TA,yT+TH-2,TA*2,1,colHC);
    R(-TA,yT+TH+1,TA*2,1,colHT);
    if(!prof){R(-4,yT,8,2,colHC);R(-1,yT,2,4,colHO);}
  }
  R(-EP+1,yT+TH-2,EP*2-2,1,colHT);

  /* de face : on ne voit du sac que les deux sangles sur la poitrine */
  if(sacC!=='aucun'&&dir==='bas'){
    R(-EP+2,yT+2,2,8,teint(sacC,-6));
    R(EP-4,yT+2,2,8,teint(sacC,-18));
    R(-EP+2,yT+6,EP*2-6,1,teint(sacC,-24));
  }

  /* ---- bras : la manche s'arrête selon le vêtement ---- */
  const MANCHE={'veste':11,'chemise':11,'pull':11,'manteau':11,'tunique':9,
                'gilet':0,'t-shirt':4,'débardeur':0}[hautT];
  const brasCol=(dev)=>dev?veste:vesteT;
  const bras=(bx,by,dev)=>{
    R(bx,by,3,11,dev?teint(peau,2):peauO);       /* le bras nu */
    if(MANCHE>0){
      R(bx,by,3,MANCHE,brasCol(dev));
      R(bx,by,3,2,dev?vesteC:vesteO);
      if(MANCHE<11)R(bx,by+MANCHE-1,3,1,teint(brasCol(dev),-20));
    }
    R(bx,by+11,3,3,dev?peau:peauO);              /* la main */
  };
  if(cote){
    bras((s>0?1:-4)+bdP*s,yT+1,true);
  }else{
    bras(-(EP+2),yT+1,bgP>0);
    bras(EP-1,yT+1,bdP>0);
  }
  /* ---- l'outil et les bras, selon l'angle sous lequel on regarde ----
     De profil : grand arc de côté, un seul bras visible.
     De face   : l'outil s'abat vers nous, les deux mains le tiennent, il se raccourcit.
     De dos    : il part en arrière au-dessus des épaules, on voit le dos des mains. */
  if(fr>0){
    const outil=(gg,ech)=>{
      if(typeGeste==='hache')dessinerHache(gg,0,0,ech||1);
      else dessinerPioche(gg,0,0,ech||1);
    };
    if(cote){
      const sens=dir==='gauche'?-1:1;
      const epx=sens>0?EP-1:-(EP+2);
      const ey=yT+1-Math.round(tasse*3);
      R(epx,ey,3,9,veste);R(epx,ey,3,2,vesteC);R(epx,ey+9,3,3,peau);
      if(typeGeste!=='cueille'){
        g.save();
        g.translate(x+epx+1.5,y+ey+2);
        g.rotate(sens*arc);
        outil(g,1);
        if(phase===2){g.globalAlpha=.3;g.fillStyle='#f2f5f8';g.fillRect(-1,-15,2,13);g.globalAlpha=1;}
        g.restore();
      }else{
        const av=Math.round(arc*3);
        R(epx+(sens>0?av:-av),ey+7,3,3,peau);
      }
    }else if(dir==='bas'){
      /* de face : l'outil passe au-dessus de la tête puis descend vers nous.
         On l'écrase verticalement pour simuler le raccourci. */
      const t=(arc+1.9)/3.6;                       /* 0 en arrière, 1 en avant */
      const haut=yT-14+Math.round((1-t)*-8);
      const ey=yT+1-Math.round(tasse*3);
      if(typeGeste!=='cueille'){
        g.save();
        g.translate(x,y+haut+t*24);
        g.scale(1.15,0.45+t*0.75);                 /* il grandit en venant vers nous */
        g.rotate(Math.PI*(1-t)*0.12);
        outil(g,1.2);
        if(phase===2){g.globalAlpha=.26;g.fillStyle='#f2f5f8';
          g.fillRect(-8,-4,16,4);g.globalAlpha=1;}
        g.restore();
      }
      /* les deux bras tiennent l'outil, ils se rapprochent devant le corps */
      const ecart=Math.round(3+ (1-t)*3);
      R(-EP-2+ecart,ey,3,9,vesteT);R(-EP-2+ecart,ey+9,3,3,peauO);
      R(EP-1-ecart,ey,3,9,veste);  R(EP-1-ecart,ey+9,3,3,peau);
      if(typeGeste==='cueille'){                   /* la main s'avance vers le bas */
        R(-2,ey+10+Math.round(arc*3),4,3,peau);
      }
    }else{
      /* de dos : l'outil part derrière les épaules, on ne voit que sa tête dépasser */
      const t=(arc+1.9)/3.6;
      const ey=yT+1-Math.round(tasse*3);
      if(typeGeste!=='cueille'){
        g.save();
        g.translate(x,y+yT-10-(1-t)*10);
        g.scale(1.1,0.5+(1-t)*0.6);
        outil(g,1.1);
        g.restore();
      }
      const ecart=Math.round(3+(1-t)*3);
      R(-EP-2+ecart,ey,3,9,vesteT);R(-EP-2+ecart,ey+9,3,3,peauO);
      R(EP-1-ecart,ey,3,9,veste);  R(EP-1-ecart,ey+9,3,3,peau);
    }
  }

  /* ---- tête ---- */
  const YT=yTete+(fr>0?Math.round(tasse*1.2):0);  /* la tête plonge avec le buste */
  R(-3,yT-3+Y,6,4-Y,N);                        /* le cou s'étire quand le corps descend */
  R(-2,yT-2+Y,4,3-Y,peau);
  R(-2,yT-2+Y,4,1,peauT);                      /* ombre du menton */
  R(-2,yT-2+Y,2,3-Y,peauO);

  const LT=SIL.tete;                            /* demi-largeur de la tête */
  for(let i=0;i<HT;i++){
    let w2=LT;
    if(i>=HT-SIL.menton)w2=LT-1;                /* le menton se resserre */
    if(i===0)w2=LT-1;                           /* le sommet du crâne s'arrondit */
    R(-w2-1,YT+i,(w2+1)*2,1,N);
    R(-w2,YT+i,w2*2,1,peau);
    R(-w2,YT+i,Math.min(3,w2),1,peauO);
  }
  R(-LT,YT,LT*2,1,peauC);                       /* front éclairé */
  if(!prof){R(-LT-2,YT+5,2,3,peauO);R(LT,YT+5,2,3,peau);}   /* oreilles */
  if(prof){R(-LT,YT+1,LT*2,HT-1,teint(peau,-12));           /* nuque */
           R(-LT,YT+HT-3,LT*2,2,teint(peau,-30));}
  /* ---- la barbe ----
     Elle épouse la mâchoire : plus large en haut des joues, resserrée sous le menton.
     Trois valeurs, comme les cheveux, et une version propre au profil. */
  if(barbe!=='aucune'&&!prof){
    const LB=SIL.tete;                          /* demi-largeur du visage */
    const bas=YT+HT-1;                          /* le bas du menton */
    const B=chev, BC=chevC, BO=chevO, BT=teint(chev,-40);
    const joue=(y0,h2,ep)=>{                    /* les côtés, le long de la mâchoire */
      for(let i=0;i<h2;i++){
        const w2=LB-(i>=h2-2?1:0);
        R(-w2,y0+i,ep,1,B);
        R(w2-ep,y0+i,ep,1,BO);
      }
    };
    const menton=(y0,h2,larg)=>{                /* la masse sous la bouche */
      for(let i=0;i<h2;i++){
        const w2=Math.max(1,larg-(i>=h2-2?1:0)-(i>=h2-1?1:0));
        R(-w2,y0+i,w2*2,1,i<1?BC:(i>h2-2?BT:B));
      }
    };
    if(cote){
      /* de profil : la barbe suit le bord avant du visage */
      const av=s>0?1:-4;
      if(barbe==='naissante'){g.globalAlpha=.5;R(av-1,YT+7,5,4,BO);g.globalAlpha=1;}
      else if(barbe==='fine'){R(av-1,YT+7,5,3,BO);R(av,YT+10,3,1,BT);}
      else if(barbe==='courte'){R(av-2,YT+6,6,5,B);R(av-1,YT+10,4,1,BO);}
      else if(barbe==='pleine'){R(av-3,YT+5,7,7,B);R(av-3,YT+5,2,7,BO);R(av-2,YT+11,5,2,BT);}
      else if(barbe==='longue'){R(av-3,YT+5,7,7,B);R(av-2,YT+11,5,6,B);R(av-2,YT+15,5,2,BT);}
      else if(barbe==='bouc'){R(av-1,YT+8,4,5,B);R(av-1,YT+11,4,2,BO);}
      else if(barbe==='moustache'){R(av-1,YT+7,4,1,B);R(av+2,YT+7,1,1,BO);}
      else if(barbe==='collier'){R(av-4,YT+4,2,8,B);R(av-3,YT+10,6,2,B);}
      else if(barbe==='favoris'){R(av-4,YT+3,2,6,B);}
      else if(barbe==='impériale'){R(av-1,YT+7,4,1,B);R(av,YT+9,3,3,B);}
      else if(barbe==='fourchue'){R(av-3,YT+5,7,7,B);R(av-2,YT+11,2,5,B);R(av+1,YT+11,2,4,BO);}
    }else{
      if(barbe==='naissante'){                  /* juste une ombre sur la mâchoire */
        g.globalAlpha=.42;
        joue(YT+6,5,2);menton(YT+9,3,3);
        g.globalAlpha=1;
      }
      else if(barbe==='fine'){
        joue(YT+7,4,1);
        R(-3,YT+10,6,1,BO);R(-2,YT+11,4,1,BT);
      }
      else if(barbe==='courte'){
        joue(YT+6,5,2);
        menton(YT+9,3,4);
        R(-3,YT+8,6,1,BC);                      /* le sillon sous la lèvre */
      }
      else if(barbe==='pleine'){
        joue(YT+4,7,2);
        menton(YT+8,5,LB-1);
        R(-LB+1,YT+4,LB*2-2,1,BC);              /* le haut des joues, éclairé */
        R(-2,YT+8,4,1,teint(peau,-30));         /* la bouche reste lisible */
      }
      else if(barbe==='longue'){
        joue(YT+4,7,2);
        menton(YT+8,5,LB-1);
        for(let i=0;i<6;i++){                   /* elle descend sur la poitrine */
          const w2=Math.max(1,4-Math.floor(i/2));
          R(-w2,YT+HT+i-1,w2*2,1,i<4?B:BT);
        }
        R(-LB+1,YT+4,LB*2-2,1,BC);
        R(-2,YT+8,4,1,teint(peau,-30));
      }
      else if(barbe==='bouc'){
        R(-2,YT+10,4,3,B);R(-2,YT+10,2,3,BC);R(-1,YT+12,2,1,BT);
        R(-3,YT+7,6,1,B);                       /* avec sa moustache */
      }
      else if(barbe==='moustache'){
        R(-3,YT+7,6,1,B);R(-4,YT+7,1,1,BO);R(3,YT+7,1,1,BO);
        R(-3,YT+8,2,1,BO);R(1,YT+8,2,1,BO);
      }
      else if(barbe==='collier'){               /* le tour du visage, joues rasées */
        R(-LB,YT+4,1,7,B);R(LB-1,YT+4,1,7,BO);
        menton(YT+10,2,4);
        R(-3,YT+7,6,1,B);
      }
      else if(barbe==='favoris'){               /* seulement devant les oreilles */
        R(-LB,YT+3,2,5,B);R(LB-2,YT+3,2,5,BO);
        R(-LB,YT+7,2,1,BT);R(LB-2,YT+7,2,1,BT);
      }
      else if(barbe==='impériale'){             /* moustache et touffe sous la lèvre */
        R(-4,YT+7,8,1,B);R(-5,YT+6,1,1,BO);R(4,YT+6,1,1,BO);
        R(-1,YT+10,3,3,B);R(-1,YT+10,1,3,BC);
      }
      else if(barbe==='fourchue'){
        joue(YT+4,7,2);
        menton(YT+8,4,LB-1);
        R(-4,YT+HT-1,3,5,B);R(1,YT+HT-1,3,4,BO);   /* les deux pointes */
        R(-4,YT+HT+3,3,1,BT);R(1,YT+HT+2,3,1,BT);
        R(-LB+1,YT+4,LB*2-2,1,BC);
      }
    }
  }

  /* ---- les cheveux ----
     Une même coupe se décline en trois vues :
       de face  : calotte + frange + pans qui pendent de chaque côté du visage
       de dos   : la masse couvre tout le crâne, les longueurs tombent dans le dos
       de profil: calotte + un seul pan, derrière la tête                        */
  const C=chev, CC=chevC, CO=chevO, CT=teint(chev,-42);
  const tr=bouge?(cote?-s:0):0;

  /* description de chaque coupe :
     vol  volume au-dessus du crâne · fr  frange · pan longueur des pans latéraux
     dos  longueur dans le dos      · ras côtés rasés                            */
  const D={
   'courts'      :{vol:2,fr:'courte',pan:3, dos:12},
   'très courts' :{vol:1,fr:'rase',  pan:2, dos:12},
   'dégradé'     :{vol:3,fr:'cote',  pan:1, dos:12,ras:1},
   'bol'         :{vol:2,fr:'droite',pan:5, dos:14},
   'carré'       :{vol:2,fr:'droite',pan:9, dos:17},
   'mi-longs'    :{vol:2,fr:'cote',  pan:8, dos:18},
   'longs'       :{vol:2,fr:'cote',  pan:14,dos:24,large:14},
   'très longs'  :{vol:2,fr:'cote',  pan:20,dos:30,large:14},
   'queue'       :{vol:2,fr:'courte',pan:2, dos:12,queue:14},
   'couettes'    :{vol:2,fr:'droite',pan:2, dos:12,couettes:9},
   'chignon'     :{vol:2,fr:'courte',pan:2, dos:12,chignon:1},
   'chignon haut':{vol:1,fr:'courte',pan:1, dos:12,chignon:2},
   'tresse'      :{vol:2,fr:'cote',  pan:3, dos:12,tresse:1},
   'tresses'     :{vol:2,fr:'droite',pan:2, dos:12,tresses:1},
   'ondulés'     :{vol:2,fr:'cote',  pan:12,dos:21,onde:1,large:14},
   'bouclés'     :{vol:4,fr:'boucle',pan:5, dos:16,boucle:1,large:16},
   'afro'        :{vol:6,fr:'rase',  pan:5, dos:16,afro:1,large:18},
   'dreads'      :{vol:2,fr:'rase',  pan:9, dos:20,dreads:1,large:14},
   'banane'      :{vol:5,fr:'arriere',pan:2,dos:12},
   'crête'       :{vol:0,fr:'rase',  pan:0, dos:0, crete:1},
   'crâne'       :{vol:0,fr:'rase',  pan:0, dos:0, rase:1},
   'hirsute'     :{vol:3,fr:'meche', pan:4, dos:14,hirsute:1}
  }[coiffe]||{vol:2,fr:'courte',pan:3,dos:3};

  if(D.rase){
    R(-6,YT-1,12,2,CO);
    if(prof)R(-6,YT-1,12,6,CO);
  }else{
    /* le dessus du crâne, commun aux trois vues */
    if(!D.crete){
      R(-6,YT-1-D.vol,12,2+D.vol,C);
      R(-6,YT-D.vol,4,1,CC);                    /* la lumière tombe à gauche */
      R(4,YT-1-D.vol,2,2+D.vol,CO);
    }
    if(prof){
      /* ---- de dos ---- */
      const y0=YT-1-D.vol;                      /* le sommet du crâne */
      const hd=Math.max(HT+2+D.vol,D.dos);      /* jamais moins que le crâne entier */
      const lg=D.large||12;                     /* largeur de la masse */
      const g0=-(lg>>1);
      /* une masse aux angles adoucis, pas un bloc */
      R(g0+1,y0,lg-2,hd,C);                     /* corps */
      R(g0,y0+1,lg,hd-2,C);                     /* flancs, un pixel plus bas */
      R(g0+1,y0+1,4,3,CC);                      /* la lumière en haut à gauche */
      R(g0+lg-4,y0+1,3,hd-2,CO);                /* le côté à l'ombre */
      R(g0+2,y0+hd-2,lg-4,2,CT);                /* les pointes */
      if(D.queue){R(-3,YT+2,6,3,C);                 /* l'attache */
        R(-2,YT+4,4,D.queue,C);R(-2,YT+4,2,D.queue,CC);R(-2,YT+D.queue+1,4,3,CT);}
      if(D.couettes){R(-9,YT+1,3,D.couettes,C);R(6,YT+1,3,D.couettes,CO);
        R(-9,YT+D.couettes-1,3,2,CT);R(6,YT+D.couettes-1,3,2,CT);}
      if(D.tresse)for(let i=0;i<6;i++)R(-2,YT+2+i*3,4,3,i%2?CO:C);
      if(D.tresses)for(let i=0;i<5;i++){R(-8,YT+1+i*3,3,3,i%2?CO:C);R(5,YT+1+i*3,3,3,i%2?C:CO);}
      if(D.chignon===1)R(-3,YT-5-D.vol-reb,6,5,C);
      if(D.chignon===2){R(-2,YT-8-reb,5,6,C);R(-2,YT-8-reb,2,2,CC);}
      if(D.crete){R(-6,YT-1,12,5,CO);R(-2,YT-9-reb,4,9,C);R(-2,YT-9-reb,2,9,CC);}
    }else if(cote){
      /* ---- de profil : un seul pan, derrière la tête ---- */
      const der=s>0?-8:6;                        /* le côté opposé au regard */
      if(D.pan>1){
        R(der+tr,YT+1,3,D.pan,C);
        if(D.pan>6)R(der+tr,YT+D.pan-2,3,3,CT);
      }
      if(D.fr==='droite')R(s>0?-6:0,YT+1,6,2,CO);
      if(D.fr==='cote')R(s>0?-2:-4,YT+1,6,2,CO);
      if(D.fr==='courte')R(s>0?-1:-5,YT+1,6,1,CO);
      if(D.fr==='arriere')R(s>0?-5:0,YT-2-D.vol,6,2,CC);
      if(!D.ras&&D.pan>=2)R(s>0?-6:2,YT+1,4,3,C);   /* la tempe visible */
      if(D.queue){R(der+tr,YT+1,3,D.queue,C);R(der+tr,YT+D.queue-2,3,3,CT);}
      if(D.couettes)R(der+tr,YT+2,3,D.couettes,C);
      if(D.tresse)for(let i=0;i<5;i++)R(der+tr,YT+2+i*3,3,3,i%2?CO:C);
      if(D.tresses)for(let i=0;i<4;i++)R(der+tr,YT+2+i*3,3,3,i%2?CO:C);
      if(D.chignon===1)R(der+2,YT-4-reb,5,5,C);
      if(D.chignon===2)R(-1,YT-8-reb,5,6,C);
      if(D.crete){R(-6,YT-1,12,4,CO);R(-2,YT-9-reb,4,9,C);}
      if(D.afro){R(der-1,YT-6,5,10,C);R(-6,YT-7,12,7,C);R(-6,YT-6,4,3,CC);}
      if(D.dreads)for(let i=0;i<4;i++)R(der+tr,YT+1+i*3,3,7,i%2?CO:C);
      if(D.boucle){R(der,YT-4,4,7,C);R(-6,YT-5,12,5,C);R(-6,YT-4,4,2,CC);}
    }else{
      /* ---- de face ---- */
      if(D.fr==='droite')R(-6,YT+1,12,2,CO);     /* frange qui barre le front */
      if(D.fr==='cote'){R(-6,YT+1,7,2,CO);R(1,YT+1,5,1,CO);}
      if(D.fr==='courte')R(-6,YT+1,12,1,CO);
      if(D.fr==='meche'){R(-6,YT+1,5,2,CO);R(2,YT+1,4,1,CO);}
      if(D.fr==='boucle'){R(-6,YT+1,4,2,C);R(-1,YT+1,3,2,CO);R(3,YT+1,3,2,C);}
      if(!D.ras&&D.pan>=2){                       /* les tempes, seulement si la coupe les a */
        const ht=Math.max(3,Math.min(5,D.pan));
        R(-6,YT+1,2,ht,C);
        R(4,YT+1,2,ht,CO);
      }
      if(D.pan>4){                                /* les pans qui pendent */
        R(-7+tr,YT+1,2,D.pan,C);
        R(5+tr,YT+1,2,D.pan,CO);
        R(-7+tr,YT+D.pan-2,2,3,CT);
        R(5+tr,YT+D.pan-2,2,3,CT);
      }
      if(D.onde){R(-8+tr,YT+4,2,5,C);R(6+tr,YT+4,2,5,CO);}
      if(D.queue){R(5+tr,YT+1,2,3,C);R(6+tr,YT+2,1,3,CO);}  /* elle dépasse à peine */
      if(D.couettes){
        R(-8+tr,YT,3,D.couettes,C);      R(5+tr,YT,3,D.couettes,CO);
        R(-8+tr,YT,3,1,CC);
        R(-8+tr,YT+D.couettes,2,2,CT);   R(6+tr,YT+D.couettes,2,2,CT);}
      if(D.tresse){R(5+tr,YT+1,3,4,CO);}
      if(D.tresses)for(let i=0;i<4;i++){R(-8+tr,YT+1+i*3,3,3,i%2?CO:C);R(5+tr,YT+1+i*3,3,3,i%2?C:CO);}
      if(D.chignon===1){R(-3,YT-3-D.vol-reb,5,3,C);R(-3,YT-3-D.vol-reb,2,1,CC);R(1,YT-3-D.vol-reb,1,3,CO);}
      if(D.chignon===2){R(-2,YT-8-reb,5,6,C);R(-2,YT-8-reb,2,2,CC);R(-3,YT-3,7,2,C);}
      if(D.afro){R(-9,YT-6,18,8,C);R(-9,YT-5,6,3,CC);R(5,YT-6,4,8,CO);
        R(-9,YT+1,3,5,C);R(6,YT+1,3,5,CO);}
      if(D.boucle){R(-7,YT-4,14,5,C);R(-7,YT-3,4,2,CC);R(4,YT-4,3,5,CO);
        R(-8,YT+1,3,4,C);R(5,YT+1,3,4,CO);R(-5,YT-6,4,2,CC);R(1,YT-6,4,2,C);}
      if(D.dreads){                              /* elles encadrent le visage, sans le couvrir */
        for(let i=0;i<3;i++){
          R(-8+tr,YT+1+i*4,3,5,i%2?CO:C);
          R(5+tr,YT+1+i*4,3,5,i%2?C:CO);
        }
        R(-6,YT+1,12,2,CO);                       /* la racine sur le front */
        R(-8+tr,YT+11,3,2,CT);R(5+tr,YT+11,3,2,CT);
      }
      if(D.crete){R(-6,YT-1,12,2,CO);R(-2,YT-9-reb,4,9,C);R(-2,YT-9-reb,2,9,CC);}
      if(D.hirsute){R(-8,YT-3,3,3,C);R(5,YT-4,3,3,CO);R(-3,YT-4-reb,3,3,C);R(2,YT-5-reb,2,3,CC);}
      if(D.fr==='arriere'){
        R(-5,YT-2-D.vol,10,2,C);
        R(-4,YT-4-D.vol,8,2,C);
        R(-2,YT-5-D.vol,6,1,CC);
        R(3,YT-4-D.vol,2,4,CO);}
    }
  }

  /* ---- ce qu'on porte sur la tête : ajusté à la largeur du crâne ---- */
  const LTc=SIL.tete;                              /* demi-largeur de la tête */
  if(chapeau==='casquette'){
    R(-LTc-1,YT-4,(LTc+1)*2,4,'#3f5f6b');          /* la calotte épouse le crâne */
    R(-LTc-1,YT-4,(LTc+1)*2,1,'#547a88');
    R(-LTc,YT-1,LTc*2,1,'#33505a');
    const vx=cote?(s>0?1:-LTc*2-1):-LTc-1;         /* la visière part vers l'avant */
    R(vx,YT,LTc*2+1,2,'#33505a');
    R(vx,YT,LTc*2+1,1,'#456a76');
  }
  else if(chapeau==='bandana'){
    R(-LTc-1,YT-2,(LTc+1)*2,3,'#a8524a');
    R(-LTc-1,YT-2,(LTc+1)*2,1,'#c46a5e');
    R(-LTc+1,YT-1,3,1,'#8f4038');                  /* le nœud */
    R(LTc-1+tr,YT,3,5,'#8f4038');                  /* les pans qui pendent */
    R(LTc-1+tr,YT+4,3,1,'#71322c');
  }
  else if(chapeau==='bonnet'){
    R(-LTc-1,YT-6,(LTc+1)*2,6,'#8a4a3a');
    R(-LTc-1,YT-6,(LTc+1)*2,1,'#a85c48');
    R(-LTc-1,YT-1,(LTc+1)*2,2,'#a85c48');          /* le revers */
    R(-LTc-1,YT+1,(LTc+1)*2,1,'#71392c');
    R(-2,YT-9-reb,4,3,'#c07260');                  /* le pompon */
    R(-2,YT-9-reb,2,1,'#d9897a');
  }
  else if(chapeau==='capuche'){
    R(-LTc-2,YT-5,(LTc+2)*2,HT+3,'#54606b');       /* le tissu enveloppe la tête */
    R(-LTc-2,YT-5,(LTc+2)*2,2,'#68757f');
    R(-LTc-2,YT+3,2,HT-5,'#465059');
    R(LTc,YT+3,2,HT-5,'#465059');
    R(-LTc,YT+1,LTc*2,HT-2,peau);                  /* le visage reste dégagé */
    R(-LTc,YT+1,3,HT-2,peauO);
    R(-LTc,YT+1,LTc*2,1,teint(peau,-30));          /* l'ombre de la capuche */
  }
  else if(chapeau==='chapeau'){
    R(-LTc-4,YT-1,(LTc+4)*2,2,'#5a4a2c');          /* le bord large */
    R(-LTc-4,YT-1,(LTc+4)*2,1,'#7a663c');
    R(-LTc,YT-6,LTc*2,5,'#8f7a49');                /* la calotte */
    R(-LTc,YT-6,LTc*2,1,'#a08a56');
    R(-LTc,YT-3,LTc*2,2,'#5a4a2c');                /* le ruban */
  }
  else if(chapeau==='beret'){
    R(-LTc-1,YT-4,(LTc+1)*2-1,4,'#2f4a5c');
    R(-LTc-1,YT-4,LTc,2,'#3f6076');
    R(LTc-2,YT-6-reb,2,2,'#2f4a5c');               /* la queue sur le dessus */
  }
  else if(chapeau==='cagoule'){
    R(-LTc-1,YT-2,(LTc+1)*2,HT+2,'#3a3a44');
    R(-LTc-1,YT-2,(LTc+1)*2,2,'#4a4a56');
    if(!prof){R(-4,YT+4,3,3,peau);R(1,YT+4,3,3,peau);}   /* les deux fentes */
    R(-LTc-1,YT+HT-2,(LTc+1)*2,1,'#2b2b33');
  }

  /* ---- le visage ----
     Il tient dans dix pixels de large : chaque pixel compte. */
  const blanc='#f6f3ec', ombreOeil=teint(peau,-38);
  if(dir==='bas'&&chapeau==='cagoule'){
    R(-4,YT+5,3,2,oeil);R(2,YT+5,3,2,oeil);      /* on ne voit que les yeux */
  }else if(dir==='bas'){
    const clin=(Date.now()+x*53)%4600<130;
    /* sourcils */
    if(sourcil==='fins'){R(-4,YT+3,3,1,chevO);R(2,YT+3,3,1,chevO);}
    if(sourcil==='epais'){R(-4,YT+2,3,2,chevO);R(2,YT+2,3,2,chevO);}
    if(sourcil==='arques'){R(-4,YT+3,2,1,chevO);R(-2,YT+2,1,1,chevO);
                           R(3,YT+3,2,1,chevO);R(2,YT+2,1,1,chevO);}
    if(sourcil==='fronces'){R(-4,YT+3,3,1,chevO);R(2,YT+3,3,1,chevO);
                            R(-1,YT+3,2,1,chevO);}
    /* creux des orbites */
    R(-4,YT+4,3,1,ombreOeil);R(2,YT+4,3,1,ombreOeil);
    /* yeux */
    if(clin){R(-4,YT+6,3,1,chevO);R(2,YT+6,3,1,chevO);}
    else{
      const dessine=(gx,h,ty)=>{
        R(gx,YT+ty,3,h,blanc);
        R(gx+1,YT+ty,1,h,oeil);                 /* iris */
        R(gx+1,YT+ty,1,1,teint(oeil,40));       /* reflet */
      };
      if(fy==='ronds'){dessine(-4,3,4);dessine(2,3,4);}
      else if(fy==='plisses'){R(-4,YT+5,3,1,oeil);R(2,YT+5,3,1,oeil);}
      else if(fy==='fatigues'){dessine(-4,2,5);dessine(2,2,5);
        R(-4,YT+7,3,1,peauT);R(2,YT+7,3,1,peauT);}
      else if(fy==='doux'){dessine(-4,2,5);dessine(2,2,5);
        R(-4,YT+4,3,1,peau);R(2,YT+4,3,1,peau);}
      else if(fy==='severes'){dessine(-4,2,5);dessine(2,2,5);
        R(-4,YT+4,3,1,chevO);R(2,YT+4,3,1,chevO);}
      else{dessine(-4,2,5);dessine(2,2,5);}
    }
    /* nez */
    if(nez==='petit'){R(0,YT+7,1,1,peauT);}
    if(nez==='droit'){R(0,YT+6,1,2,ombreOeil);R(0,YT+8,1,1,peauT);}
    if(nez==='large'){R(-1,YT+7,3,1,ombreOeil);R(-1,YT+8,3,1,peauT);}
    if(nez==='retrousse'){R(0,YT+6,1,2,ombreOeil);R(-1,YT+8,2,1,peauT);}
    /* cils : c'est le regard qui les porte, pas la carrure */
    if((fy==='doux'||fy==='ronds')&&!clin){R(-5,YT+4,1,1,chevO);R(4,YT+4,1,1,chevO);}
    /* bouche */
    const lev=(bouche==='lèvres');
    if(bouche==='neutre')R(-2,YT+9,4,1,teint(peau,-64));
    if(lev){R(-2,YT+9,4,1,'#b06a68');R(-2,YT+10,4,1,teint(peau,-24));R(-1,YT+8,2,1,'#c47f7c');}
    if(bouche==='sourire'){R(-2,YT+9,4,1,SIL.levres?'#b06a68':teint(peau,-64));
      R(-3,YT+8,1,1,peauO);R(2,YT+8,1,1,peauO);R(-1,YT+10,2,1,teint(peau,-30));}
    if(bouche==='severe'){R(-3,YT+9,6,1,teint(peau,-70));}
    if(bouche==='entrouverte'){R(-2,YT+9,4,1,teint(peau,-70));R(-1,YT+10,2,1,'#8a4a4a');}
    if(bouche==='pincée'){R(-1,YT+9,3,1,teint(peau,-70));R(-2,YT+9,1,1,peauT);R(2,YT+9,1,1,peauT);}
    /* marques */
    if(marque==='taches'){R(-4,YT+7,1,1,peauT);R(-2,YT+8,1,1,peauT);R(3,YT+7,1,1,peauT);R(2,YT+6,1,1,peauT);}
    if(marque==='cicatrice'){R(3,YT+2,1,5,teint(peau,-46));R(2,YT+3,1,1,teint(peau,-46));}
    if(marque==='grain'){R(-3,YT+8,1,1,teint(peau,-70));}
    if(marque==='fard'){R(-4,YT+8,3,1,'#c9707a');R(2,YT+8,3,1,'#c9707a');}
    if(marque==='peinture'){R(-4,YT+4,3,3,'#a8524a');R(2,YT+4,3,3,'#a8524a');
      R(-4,YT+4,3,1,'#c46a5e');R(2,YT+4,3,1,'#c46a5e');}
    /* boucles d'oreille */
    const oy=YT+7, ox=SIL.tete+1;
    if(boucle==='anneau'){R(-ox,oy,1,2,'#c9a24a');R(ox-1,oy,1,2,'#c9a24a');}
    if(boucle==='perle'){R(-ox,oy,1,1,'#f2efe4');R(ox-1,oy,1,1,'#f2efe4');}
    if(boucle==='plume'){R(ox-1,oy,1,4,'#4a7d7d');R(ox-1,oy+3,1,1,'#7fbdbd');}
  }else if(cote){
    const dx=s>0?2:-4;
    if(sourcil==='epais')R(dx,YT+2,2,2,chevO);else R(dx,YT+3,2,1,chevO);
    R(dx,YT+4,2,1,ombreOeil);
    R(dx,YT+5,2,2,blanc);
    R(dx+(s>0?1:0),YT+5,1,2,oeil);
    R(s>0?5:-6,YT+6,1,2,peauT);                 /* le nez dépasse du profil */
    R(s>0?4:-5,YT+9,2,1,teint(peau,-64));       /* bouche */
    if(boucle!=='aucune')R(s>0?-4:3,YT+7,1,2,boucle==='perle'?'#f2efe4':'#c9a24a');
    if(marque==='fard')R(dx-1,YT+8,3,1,'#c9707a');
  }
}



const monAp=()=>Object.assign({},DEF_AP,(e&&e.ap)||{});

/* ================= la galerie =================
   Vue de dessus. Les murs sont des blocs de roche : on voit leur dessus,
   puis leur face, et l'ombre qu'ils jettent sur le sol. Chaque niveau a
   sa teinte, ses accidents et ses trouvailles. */
const CASE=16, L=52, H=46;
let MUR=[], DALLE=[], OMBRE=[], OBJETS=[], BANDES={}, niveau=1;
const alea2=(a,b)=>alea(a*7.13+b*3.71+niveau*13.7);

/* les cinq paliers de profondeur */
const PALIERS=[
  {nom:'les premières galeries',
   roche:['#8a7860','#6b5c47','#4a3f30'],sol:['#5e4f3e','#523f30','#463a2c'],
   fond:'#241d16',accent:'#7fae5c',mousse:true},
  {nom:'la roche dure',
   roche:['#7c7164','#5c554a','#3c372f'],sol:['#544a3f','#483f36','#3c352d'],
   fond:'#1e1a15',accent:'#a8791f'},
  {nom:'les veines profondes',
   roche:['#6a6b76','#4c4d58','#32333c'],sol:['#494a54','#3f4049','#36373f'],
   fond:'#171820',accent:'#5fc79c'},
  {nom:'sous la nappe',
   roche:['#5f5972','#453f58','#2e2940'],sol:['#443f58','#3a354c','#322d42'],
   fond:'#13111c',accent:'#6fd8e0',eau:true},
  {nom:'le fond du monde',
   roche:['#4f4762','#37304a','#221d31'],sol:['#3a3450','#322c46','#2a253c'],
   fond:'#0e0b16',accent:'#c88aff',cristaux:true}
];
/* le décor puise ses couleurs dans les mêmes nuances que la roche */
const palier=()=>{
  const N=NUANCES[Math.min(4,Math.floor((niveau-1)/4))];
  const P=PALIERS[Math.min(4,Math.floor((niveau-1)/4))];
  return {nom:P.nom,eau:P.eau,cristaux:P.cristaux,mousse:P.mousse,
    roche:[N.roche[1],N.roche[2],N.roche[3]],
    sol:[N.sol[1],N.sol[2],N.sol[3]],
    fond:N.fond,accent:N.accent};
};

/* tous les cinq niveaux, un ascenseur : on y redescend directement */
const EST_RELAIS=(n)=>n===1||n%5===0;

function creuser(){
  MUR=Array.from({length:H},()=>Array.from({length:L},()=>1));
  DALLE=Array.from({length:H},()=>Array.from({length:L},()=>0));
  const creux=(x,y)=>{if(x>1&&y>2&&x<L-2&&y<H-2)MUR[y][x]=0;};
  const salles=[];
  const n=7+((alea(niveau*3)*4)|0);
  for(let i=0;i<n;i++){
    /* de vraies salles : on doit pouvoir s'y déplacer, pas s'y faufiler */
    const w=7+((alea(i*3.1+niveau)*7)|0), h=5+((alea(i*7.7+niveau)*6)|0);
    const cx=8+((alea(i*5.3+niveau)*(L-17))|0), cy=8+((alea(i*9.1+niveau)*(H-18))|0);
    salles.push([cx,cy]);
    for(let a=-w;a<=w;a++)for(let b=-h;b<=h;b++){
      /* les salles ne sont pas des rectangles : on ronge les angles */
      if(Math.abs(a)>=w-1&&Math.abs(b)>=h-1)continue;
      if(Math.abs(a)===w&&Math.abs(b)>=h-2)continue;
      if(Math.abs(b)===h&&Math.abs(a)>=w-2)continue;
      creux(cx+a,cy+b);
    }
  }
  /* les couloirs font trois cases de large : on y croise une bête sans être coincé */
  for(let i=1;i<salles.length;i++){
    let [x,y]=salles[i-1];const [tx,ty]=salles[i];
    while(x!==tx){x+=Math.sign(tx-x);
      creux(x,y-1);creux(x,y);creux(x,y+1);
      if(alea2(x,y)<.28)creux(x,y+2);}
    while(y!==ty){y+=Math.sign(ty-y);
      creux(x-1,y);creux(x,y);creux(x+1,y);
      if(alea2(x*3,y)<.28)creux(x+2,y);}
  }
  /* on abat les piliers isolés : une seule case de roche au milieu du vide
     n'apporte rien, elle hache la vue */
  for(let b=2;b<H-2;b++)for(let a=2;a<L-2;a++){
    if(!MUR[b][a])continue;
    let voisins=0;
    if(MUR[b-1][a])voisins++;
    if(MUR[b+1][a])voisins++;
    if(MUR[b][a-1])voisins++;
    if(MUR[b][a+1])voisins++;
    if(voisins<=1)MUR[b][a]=0;
  }
  /* le sol : dalles, gravier, flaques */
  for(let b=0;b<H;b++)for(let a=0;a<L;a++){
    const r=alea2(a,b);
    DALLE[b][a]=r<.58?0:r<.82?1:r<.94?2:3;
  }
  /* l'ombre portée : chaque case retient combien de murs la bordent */
  OMBRE=Array.from({length:H},()=>Array.from({length:L},()=>0));
  for(let b=0;b<H;b++)for(let a=0;a<L;a++){
    if(MUR[b][a])continue;
    let o=0;
    if(mur(a,b-1))o|=1;      /* un mur au nord : sa face nous ombre */
    if(mur(a-1,b))o|=2;
    if(mur(a+1,b))o|=4;
    OMBRE[b][a]=o;
  }

  OBJETS=[];
  const libres=[];
  for(let b=3;b<H-2;b++)for(let a=2;a<L-2;a++)if(!MUR[b][a])libres.push([a,b]);
  const prend=()=>libres.splice((Math.random()*libres.length)|0,1)[0];
  const poser=(t,n,extra)=>{for(let i=0;i<n;i++){const p=prend();
    if(p)OBJETS.push(Object.assign({t,a:p[0],b:p[1],coups:0,g:(alea2(p[0],p[1])*3)|0},extra||{}));}};

  /* les galeries sont deux fois plus vastes : il faut de quoi les remplir,
     sinon on marche longtemps sans rien trouver */
  const genres=niveau<=4?['fer','charbon']:niveau<=8?['fer','cuivre','charbon']
    :niveau<=12?['cuivre','argent','charbon']:niveau<=16?['argent','or','cuivre']:['or','gemme','argent'];
  genres.forEach(t=>poser(t,10+((alea(niveau+t.length)*5)|0)));
  poser('caillou',52);          /* la pierre se ramasse ici, plus à la surface */
  poser('stalagmite',16);
  poser('tonneau',8);
  poser('caisse',7);
  poser('champi',14);
  poser('gravats',18);
  if(palier().eau)poser('flaque',12);
  if(palier().cristaux)poser('cristal',14);
  if(palier().mousse)poser('mousse',16);

  /* le wagonnet abandonné, une fois par niveau */
  const w=prend();if(w)OBJETS.push({t:'wagonnet',a:w[0],b:w[1]});

  /* les rails, qui relient deux salles */
  const A=salles[0], B=salles[1]||salles[0];
  let rx=A[0], ry=A[1];
  while(rx!==B[0]){if(!MUR[ry][rx])OBJETS.push({t:'rail',a:rx,b:ry,sens:'h'});rx+=Math.sign(B[0]-rx);}
  while(ry!==B[1]){if(!MUR[ry][rx])OBJETS.push({t:'rail',a:rx,b:ry,sens:'v'});ry+=Math.sign(B[1]-ry);}

  /* les torches, contre les murs du nord */
  for(let b=3;b<H-2;b++)for(let a=2;a<L-2;a++){
    if(MUR[b][a]||!mur(a,b-1))continue;
    if(alea2(a*3,b*5)<0.09)OBJETS.push({t:'torche',a,b});
  }
  /* les étais, dans les couloirs étroits */
  for(let b=4;b<H-3;b++)for(let a=3;a<L-3;a++){
    if(MUR[b][a]||!mur(a-1,b)||!mur(a+1,b))continue;
    if(alea2(a*11,b*7)<0.12)OBJETS.push({t:'etai',a,b});
  }

  /* l'échelle du fond, et l'ascenseur des paliers */
  const der=salles[salles.length-1];
  OBJETS.push({t:'echelle',a:der[0],b:der[1]});
  const pre=salles[0];
  if(EST_RELAIS(niveau))OBJETS.push({t:'ascenseur',a:pre[0]+2,b:pre[1]});

  OBJETS.sort((x,y)=>x.b-y.b);
  /* on range les objets par bande horizontale : à chaque image on ne parcourt
     plus les 200 objets du niveau, seulement ceux des bandes visibles */
  BANDES={};
  OBJETS.forEach(o=>{(BANDES[o.b]=BANDES[o.b]||[]).push(o);});
  /* on naît toujours sur une case libre : jamais dans un tonneau ni dans la roche */
  joueur.x=pre[0]*CASE+CASE/2;joueur.y=pre[1]*CASE+CASE/2;
  if(bloque(joueur.x,joueur.y)){
    let trouve=null;
    for(let r=1;r<8&&!trouve;r++)
      for(let b=-r;b<=r&&!trouve;b++)for(let a=-r;a<=r&&!trouve;a++){
        const x=(pre[0]+a)*CASE+CASE/2, y=(pre[1]+b)*CASE+CASE/2;
        if(!mur(pre[0]+a,pre[1]+b)&&!bloque(x,y))trouve=[x,y];
      }
    if(trouve){joueur.x=trouve[0];joueur.y=trouve[1];}
  }
  peupler();
}
const mur=(a,b)=>(a<0||b<0||a>=L||b>=H)?1:MUR[b][a];
const DUR=['tonneau','caisse','stalagmite','wagonnet','etai','ascenseur'];
const bloque=(x,y)=>{
  if(mur((x/CASE)|0,(y/CASE)|0))return true;
  return OBJETS.some(o=>!o.mort&&DUR.includes(o.t)&&
    Math.abs(o.a*CASE+CASE/2-x)<11&&Math.abs(o.b*CASE+CASE/2-y)<9);
};

/* ================= LA ROCHE, AU PIXEL =================
   Tout est tracé sur une grille de 16 pixels, un pixel à la fois,
   avec cinq teintes par palier et du tramage entre elles. Aucun dégradé,
   aucune ellipse : c'est ce qui fait la différence entre du pixel art
   et une tache floue agrandie. */

/* les cinq teintes de chaque palier : de la plus claire à la plus sombre */
const NUANCES=[
 {roche:['#a89274','#8a7660','#6b5a47','#4e4134','#332a22'],
  sol:  ['#7a6650','#65543f','#524433','#3f3427','#2b241b'],
  fond:'#1b1610',accent:'#8fbf64'},
 {roche:['#9c917f','#7e7466','#5f584d','#454038','#2d2a24'],
  sol:  ['#6f6554','#5b5243','#484135','#383228',"#26221a"],
  fond:'#17140f',accent:'#c9a24a'},
 {roche:['#8d909c','#71747f','#555863','#3e414a','#282a31'],
  sol:  ['#5f626d','#4d505a','#3e4048','#313339','#212227'],
  fond:'#121318',accent:'#5fc79c'},
 {roche:['#847a9c','#68607e','#4d4661','#383247','#242030'],
  sol:  ['#57506b','#474159','#393447','#2d2937','#1e1b26'],
  fond:'#0f0d15',accent:'#6fd8e0'},
 {roche:['#7a6b96','#5f5378','#463c5b','#312945','#1f192e'],
  sol:  ['#4d4266','#3f3654','#332b45','#282136','#181425'],
  fond:'#0a0812',accent:'#c88aff'}
];
const nuance=()=>NUANCES[Math.min(4,Math.floor((niveau-1)/4))];

/* une petite trousse de dessin au pixel */
function toile(w,h,f){
  const c=document.createElement('canvas');
  c.width=w*DPR*2;c.height=h*DPR*2;
  const g=c.getContext('2d');
  g.setTransform(DPR*2,0,0,DPR*2,0,0);
  g.imageSmoothingEnabled=false;
  const P=(x,y,col)=>{g.fillStyle=col;g.fillRect(x|0,y|0,1,1);};
  const Rq=(x,y,w2,h2,col)=>{g.fillStyle=col;g.fillRect(x|0,y|0,w2|0,h2|0);};
  /* le tramage : un damier entre deux teintes, pour adoucir sans flouter */
  const trame=(x,y,w2,h2,a,b,densite)=>{
    for(let j=0;j<h2;j++)for(let i=0;i<w2;i++){
      const d=((i+j)&1)===0;
      const met=densite===undefined?d:((i*7+j*3)%10)<densite*10;
      P(x+i,y+j,met?a:b);
    }
  };
  f({g,P,R:Rq,trame,w,h,g2:g});
  return c;
}

let JEU_TUILES=null, NIV_GRAVE=-1;
function graver(){
  const N=nuance();
  const [c0,c1,c2,c3,c4]=N.roche;     /* c0 la plus claire, c4 la plus sombre */
  const [s0,s1,s2,s3,s4]=N.sol;
  const A=alea;

  /* ---------- le sol ---------- */
  const dalle=(v)=>toile(CASE,CASE,({P,R,trame})=>{
    /* le fond de la case, tramé entre deux tons pour éviter l'aplat */
    trame(0,0,CASE,CASE,s2,s3,0.34);
    /* l'appareillage : deux ou trois pierres, décalées selon la variante */
    const lignes=v%2?[[0,0,10,7],[10,0,6,7],[0,7,6,9],[6,7,10,9]]
                    :[[0,0,7,9],[7,0,9,9],[0,9,11,7],[11,9,5,7]];
    lignes.forEach(([x,y,w,h],i)=>{
      /* le corps de la pierre */
      R(x+1,y+1,w-2,h-2,i%2?s2:s1);
      /* la lumière en haut à gauche, l'ombre en bas à droite */
      for(let k=0;k<w-2;k++)P(x+1+k,y+1,s0);
      for(let k=0;k<h-2;k++)P(x+1,y+1+k,s1);
      for(let k=0;k<w-2;k++)P(x+1+k,y+h-2,s3);
      for(let k=0;k<h-2;k++)P(x+w-2,y+1+k,s3);
      /* le joint */
      for(let k=0;k<w;k++)P(x+k,y,s4);
      for(let k=0;k<h;k++)P(x,y+k,s4);
      /* le grain : trois pixels par pierre, toujours au même endroit */
      for(let k=0;k<3;k++){
        const u=A(v*13+i*7+k)*(w-4)|0, t=A(v*5+i*3+k)*(h-4)|0;
        P(x+2+u,y+2+t,A(v+i+k)<.5?s0:s3);
      }
    });
    /* de temps en temps, une fissure qui court */
    if(v===2){
      let x=3,y=2;
      for(let k=0;k<9;k++){P(x,y,s4);P(x,y+1,s3);
        x+=A(k*3)<.5?1:0;y+=A(k*7)<.4?1:(A(k*11)<.2?-1:0);
        x=Math.max(0,Math.min(15,x));y=Math.max(0,Math.min(14,y));}
    }
    /* ou du gravier, sur la variante 3 */
    if(v===3){
      for(let k=0;k<14;k++){
        const u=A(k*3.1+v)*15|0, t=A(k*7.7+v)*15|0;
        const c=A(k*5)<.4?s0:(A(k*9)<.6?s1:s3);
        P(u,t,c);if(A(k*11)<.4)P(u+1,t,c);
      }
    }
  });

  /* ---------- le dessus de la roche ---------- */
  const dessus=(v)=>toile(CASE,CASE,({P,R,trame})=>{
    trame(0,0,CASE,CASE,c2,c3,0.4);
    /* quatre blocs de pierre, appareillés en quinconce */
    const dec=v%2?5:0;
    const blocs=[[-3+dec,-2,11,9],[8+dec,-2,11,9],[-5+dec,7,10,11],[5+dec,7,12,11]];
    blocs.forEach(([x,y,w,h],i)=>{
      for(let j=0;j<h;j++)for(let k=0;k<w;k++){
        const X=x+k, Y=y+j;
        if(X<0||Y<0||X>=CASE||Y>=CASE)continue;
        let col=(i+v)%2?c2:c1;
        if(j===0||k===0)col=c0;                  /* l'arête éclairée */
        if(j>=h-2)col=c3;                        /* l'assise sombre */
        if(k>=w-1)col=c3;
        if(j===h-1||k===w-1)col=c4;              /* le joint */
        /* le grain, tramé */
        if((X*3+Y*5)%11===0)col=(col===c1?c0:c2);
        P(X,Y,col);
      }
    });
    /* une veine de quartz sur une variante */
    if(v===2){
      let x=1,y=11;
      for(let k=0;k<13;k++){P(x,y,'rgba(255,248,228,.5)');
        x++;y+=A(k*3)<.5?-1:(A(k*7)<.3?1:0);y=Math.max(1,Math.min(14,y));}
    }
    /* des éclats brillants au fond */
    if(N.accent&&niveau>12){
      for(let k=0;k<3;k++){
        const u=A(v*3+k)*13|0, t=A(v*7+k)*13|0;
        P(u,t,N.accent);P(u+1,t,N.accent);P(u,t+1,N.accent);
      }
    }
  });

  /* ---------- la face : trois assises qui s'enfoncent ---------- */
  const face=(v)=>toile(CASE,14,({P,R,trame})=>{
    /* l'arête du haut : deux rangs clairs, c'est elle qui sculpte */
    for(let k=0;k<CASE;k++){P(k,0,c0);P(k,1,c1);}
    /* première assise, éclairée */
    const dec=v*5;
    for(let j=2;j<7;j++)for(let k=0;k<CASE;k++){
      const bloc=((k+dec)/8|0)%2;
      let col=bloc?c2:c1;
      if(j===2)col=c1;
      if(j===6)col=c3;
      if((k+dec)%8===0)col=c4;                  /* le joint vertical */
      if((k*5+j*3)%13===0)col=c3;
      P(k,j,col);
    }
    /* deuxième assise, plus sombre */
    for(let j=7;j<11;j++)for(let k=0;k<CASE;k++){
      const bloc=((k+dec+4)/8|0)%2;
      let col=bloc?c3:c2;
      if(j===7)col=c2;
      if((k+dec+4)%8===0)col=c4;
      P(k,j,col);
    }
    /* le pied : tramage vers le noir, sans dégradé */
    trame(0,11,CASE,1,c4,c3,0.6);
    trame(0,12,CASE,1,'#0a0806',c4,0.6);
    for(let k=0;k<CASE;k++)P(k,13,'#0a0806');
    /* un suintement */
    if(v===1){
      for(let j=2;j<11;j++)P(6,j,'rgba(168,214,236,.22)');
      P(6,11,'rgba(198,232,248,.4)');
    }
  });

  /* ---------- le liseré, là où la roche borde le vide sur les côtés ---------- */
  const bordG=toile(3,CASE,({P})=>{
    for(let j=0;j<CASE;j++){P(0,j,c4);P(1,j,c3);P(2,j,(j%3)?c2:c1);}
  });
  const bordD=toile(3,CASE,({P})=>{
    for(let j=0;j<CASE;j++){P(2,j,c4);P(1,j,c3);P(0,j,(j%3)?c2:c1);}
  });
  /* le haut : quand la roche borde le vide par au-dessus */
  const bordH=toile(CASE,3,({P})=>{
    for(let k=0;k<CASE;k++){P(k,0,c0);P(k,1,c1);P(k,2,(k%3)?c2:c3);}
  });

  /* les huit facons dont la roche peut ombrer une case : nord, ouest, est,
     et leurs melanges. Gravees une fois, recopiees ensuite. */
  const ombres=[];
  for(let m=0;m<8;m++)ombres.push(toile(CASE,CASE,({g})=>{

      d.addColorStop(0,'rgba(0,0,0,.45)');d.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=d;g.fillRect(0,0,CASE,7);}
    if(m&2){const d=g.createLinearGradient(0,0,5,0);
      d.addColorStop(0,'rgba(0,0,0,.34)');d.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=d;g.fillRect(0,0,5,CASE);}
    if(m&4){const d=g.createLinearGradient(CASE,0,CASE-5,0);
      d.addColorStop(0,'rgba(0,0,0,.28)');d.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=d;g.fillRect(CASE-5,0,5,CASE);}
  }));
  JEU_TUILES={
    ombres,
    dalles:[dalle(0),dalle(1),dalle(2),dalle(3)],
    dessus:[dessus(0),dessus(1),dessus(2),dessus(3)],
    faces:[face(0),face(1),face(2)],
    bordG,bordD,bordH
  };
  NIV_GRAVE=niveau;
}

/* ================= LES FILONS, AU PIXEL =================
   Des nodules serrés, gravés une fois par niveau puis recopiés.
   Ils gardent les couleurs exactes des minerais du jeu — veine et éclat —
   mais la roche qui les enserre est taillée au pixel, et plus petite :
   un filon ne doit pas manger la case où il se trouve. */
const VEINES={
  fer:    {veine:'#b06a3a',eclat:'#d4884c',debris:'#8b8582'},
  cuivre: {veine:'#3f9e7a',eclat:'#6fd8a8',debris:'#7d838f'},
  charbon:{veine:'#4a4750',eclat:'#8d8a97',debris:'#2e2c30'},
  argent: {veine:'#c3ccd4',eclat:'#eef3f7',debris:'#8d969e'},
  or:     {veine:'#d9a63f',eclat:'#ffe9a8',debris:'#9a7225'},
  gemme:  {veine:'#3fa8b8',eclat:'#b6f2f7',debris:'#2a7080'},
  caillou:{veine:null,     eclat:null,     debris:'#5f666c'}
};
/* la silhouette du nodule, en trois tailles : chaque ligne dit où commence
   et où finit la pierre. C'est ce tracé qui lui donne sa forme brisée. */
const FORMES_FILON=[
  /* petit : 12 de large, 10 de haut */
  [[4,8],[2,10],[1,11],[0,12],[0,12],[1,12],[1,11],[2,10]],
  /* moyen : 16 × 13 */
  [[5,11],[3,13],[2,14],[1,15],[0,16],[0,16],[0,15],[1,14],[2,12]],
  /* gros : 20 × 16 */
  [[7,13],[4,16],[2,18],[1,19],[0,20],[0,20],[0,20],[1,19],[1,18],[2,16],[4,13]]
];
let FILONS_GRAVES=null, FILONS_NIV=-1;
function graverLesFilons(){
  const N=nuance();
  /* la roche du nodule suit celle du niveau, en un peu plus clair */
  const r0=N.roche[0], r1=N.roche[1], r2=N.roche[2], r3=N.roche[3], r4=N.roche[4];
  FILONS_GRAVES={};
  Object.keys(VEINES).forEach(type=>{
    FILONS_GRAVES[type]=[0,1,2].map(taille=>{
      const S=FORMES_FILON[taille];
      const H2=S.length, W2=[12,16,20][taille];
      return toile(W2,H2+2,({P})=>{
        const V=VEINES[type];
        /* l'ombre au sol : deux rangs de pixels, pas une ellipse floue */
        for(let k=2;k<W2-2;k++)P(k,H2,'rgba(10,8,6,.42)');
        for(let k=4;k<W2-4;k++)P(k,H2+1,'rgba(10,8,6,.26)');
        for(let j=0;j<H2;j++){
          const [d,f]=S[j];
          for(let k=d;k<f;k++){
            let col=r2;
            /* le sommet prend la lumière, la base s'enfonce */
            if(j===0||j===1)col=r0;
            else if(j<H2*0.42)col=(k<d+2?r0:r1);
            else if(j>H2*0.74)col=r3;
            /* l'arête gauche éclairée, la droite sombre */
            if(k===d)col=(j<H2*0.6?r0:r2);
            if(k===f-1)col=r4;
            if(j===H2-1)col=r4;
            /* une facette plus claire, en haut à gauche */
            if(j>1&&j<H2*0.5&&k>d+1&&k<d+4)col=r1;
            /* le grain */
            if((k*5+j*7)%17===0)col=(col===r2?r1:r3);
            P(k,j,col);
          }
        }
        /* le minerai qui affleure : trois amas serrés, jamais au bord */
        if(V.veine){
          const amas=[[2,3],[5,5],[3,7],[7,4],[6,8]].slice(0,taille+3);
          amas.forEach(([ax,ay],i)=>{
            const j=Math.min(H2-3,Math.round(ay*H2/11));
            const [d,f]=S[j]||[0,W2];
            const k=Math.max(d+1,Math.min(f-3,Math.round(ax*W2/11)));
            /* le cristal : un cœur, un éclat, une ombre */
            P(k,j,V.veine);P(k+1,j,V.veine);P(k,j+1,V.veine);
            P(k+1,j+1,i%2?V.eclat:V.veine);
            P(k,j,V.eclat);
            P(k+2,j+1,V.debris);
            P(k,j+2,'rgba(0,0,0,.35)');
          });
        }
      });
    });
  });
  FILONS_NIV=niveau;
}
/* les fêlures, posées au pixel selon le nombre de coups */
function felures(g,x,y,part,w,h){
  const P=(a,b)=>{g.fillStyle='rgba(14,10,8,.7)';g.fillRect(x+a,y+b,1,1);};
  const C=(a,b)=>{g.fillStyle='rgba(255,246,225,.28)';g.fillRect(x+a,y+b,1,1);};
  if(part>0){P(-2,-8);P(-1,-6);P(-1,-4);C(-3,-8);}
  if(part>1){P(2,-10);P(1,-8);P(3,-6);P(4,-4);C(2,-11);}
  if(part>2){P(-4,-9);P(-3,-11);P(4,-9);P(0,-12);C(-4,-10);C(4,-10);}
}
/* le filon, tel qu'il apparaît dans la galerie */
function nodule(g,x,y,o){
  if(FILONS_NIV!==niveau||!FILONS_GRAVES)graverLesFilons();
  const taille=o.g||0;
  const img=FILONS_GRAVES[o.t===''?'caillou':o.t][taille];
  const W2=[12,16,20][taille], H2=FORMES_FILON[taille].length;
  let dx=0,dy=0,ecrase=0;
  if(o.frappe){
    const k=(Date.now()-o.frappe)/320;
    if(k<1){
      const am=Math.exp(-k*6)*Math.cos(k*26);
      dx=Math.round(am*2);dy=Math.round(Math.abs(am)*1.4);ecrase=am*0.09;
    }
  }
  g.save();
  g.translate(Math.round(x+dx),Math.round(y+dy));
  if(ecrase)g.scale(1+ecrase,1-ecrase);
  g.drawImage(img,-Math.round(W2/2),-H2,W2,H2+2);
  g.restore();
  if(o.coups)felures(g,Math.round(x+dx),Math.round(y+dy),o.coups,W2,H2);
  /* la lueur des minerais précieux */
  if(o.t==='or'||o.t==='gemme'){
    const t=Date.now()/1000;
    g.save();g.globalAlpha=.13+Math.sin(t*2+x)*0.05;
    g.fillStyle=VEINES[o.t].eclat;
    g.beginPath();g.arc(x,y-H2/2,W2,0,7);g.fill();g.restore();
    if(((t*1.7+x)%2)<.4){
      g.fillStyle='#fff6d8';g.fillRect(Math.round(x-2),Math.round(y-H2+2),1,1);
    }
  }
  /* l'éclair blanc, juste après le coup */
  if(o.frappe&&Date.now()-o.frappe<60){
    g.globalAlpha=.42;g.fillStyle='#fff';
    g.fillRect(Math.round(x-W2/2),Math.round(y-H2),W2,H2);g.globalAlpha=1;
  }
}

/* l'ombre douce, sous chaque chose posée au sol */
function poser(g,x,y,rx){
  g.fillStyle='rgba(0,0,0,.34)';
  g.beginPath();g.ellipse(x,y+1,rx,rx*0.4,0,0,7);g.fill();
}
/* le nodule de minerai : une roche taillée, avec ses cristaux dedans */

/* la stalagmite */
function stalagmite(g,x,y,gr){
  const P=palier(), h=12+gr*5;
  poser(g,x,y,6);
  g.fillStyle=P.roche[2];
  g.beginPath();g.moveTo(x-5,y);g.lineTo(x-1.4,y-h);g.lineTo(x+2,y-h+3);g.lineTo(x+5,y);
  g.closePath();g.fill();
  g.fillStyle=P.roche[1];
  g.beginPath();g.moveTo(x-5,y);g.lineTo(x-1.4,y-h);g.lineTo(x,y-h+4);g.lineTo(x-1,y);
  g.closePath();g.fill();
  g.fillStyle=P.roche[0];
  g.beginPath();g.moveTo(x-2.4,y-h+2);g.lineTo(x-1.4,y-h);g.lineTo(x+0.6,y-h+4);g.closePath();g.fill();
}
/* le tas de gravats */
function gravats(g,x,y,gr){
  const P=palier();
  poser(g,x,y,7);
  for(let i=0;i<5;i++){
    const u=alea(i*3.1+gr), w=alea(i*7.7+gr);
    g.fillStyle=u<.4?P.roche[1]:(u<.75?P.roche[2]:P.roche[0]);
    g.fillRect(x-6+u*11,y-2-w*5,2.4+u*2,2+w*1.6);
  }
}
/* le tonneau, cerclé de fer */
function tonneau(g,x,y){
  poser(g,x,y,8);
  g.fillStyle='#6b4a28';
  g.beginPath();
  g.moveTo(x-6.4,y);g.quadraticCurveTo(x-8.4,y-9,x-6.4,y-18);
  g.lineTo(x+6.4,y-18);g.quadraticCurveTo(x+8.4,y-9,x+6.4,y);g.closePath();g.fill();
  g.fillStyle='#7d5934';
  g.beginPath();
  g.moveTo(x-6.4,y);g.quadraticCurveTo(x-8.4,y-9,x-6.4,y-18);
  g.lineTo(x-1,y-18);g.lineTo(x-1,y);g.closePath();g.fill();
  R(g,x-8,y-14,16,2.2,'#4a4038');
  R(g,x-8.4,y-7,16.8,2.2,'#4a4038');
  R(g,x-8,y-14,16,.9,'#6b6055');
  g.fillStyle='#8a6238';
  g.beginPath();g.ellipse(x,y-18,6.4,2.6,0,0,7);g.fill();
  g.fillStyle='#96703f';
  g.beginPath();g.ellipse(x-1,y-18.6,4.4,1.6,0,0,7);g.fill();
}
/* la caisse de bois */
function caisse(g,x,y){
  poser(g,x,y,8);
  R(g,x-7.4,y-15,14.8,15,'#8a6238');
  R(g,x-7.4,y-15,14.8,2.6,'#a5764a');
  R(g,x-7.4,y-2.4,14.8,2.4,'#5b3f21');
  R(g,x-7.4,y-15,2,15,'#7d5934');R(g,x+5.4,y-15,2,15,'#6b4a28');
  R(g,x-7.4,y-8.4,14.8,1.8,'#5b3f21');
  /* les clous */
  g.fillStyle='#4a4038';
  [[-6,-13],[5,-13],[-6,-3.6],[5,-3.6]].forEach(([a,b])=>g.fillRect(x+a,y+b,1.6,1.6));
}
/* le wagonnet renversé, sur ses rails */
function wagonnet(g,x,y){
  poser(g,x,y,11);
  R(g,x-11,y-14,22,11,'#6b5a4a');
  R(g,x-11,y-14,22,2.4,'#84705c');
  R(g,x-11,y-5.4,22,2.4,'#4f4238');
  R(g,x-11,y-14,2,11,'#5a4b3e');R(g,x+9,y-14,2,11,'#5a4b3e');
  g.fillStyle='#3a3430';
  g.beginPath();g.arc(x-6,y-1.4,3.6,0,7);g.fill();
  g.beginPath();g.arc(x+6,y-1.4,3.6,0,7);g.fill();
  g.fillStyle='#6b6055';
  g.beginPath();g.arc(x-6,y-1.4,1.4,0,7);g.fill();
  g.beginPath();g.arc(x+6,y-1.4,1.4,0,7);g.fill();
  /* ce qu'il transporte */
  R(g,x-7,y-18,5,5,'#b06a3a');R(g,x-1,y-19,5,5,'#8b939a');R(g,x+4,y-18,4,4,'#3a373c');
}
/* les champignons luminescents */
function champiLum(g,x,y,gr){
  const t=Date.now()/1000, lu=0.4+Math.sin(t*1.5+x)*0.2;
  const P=palier();
  for(let i=0;i<3;i++){
    const dx=(i-1)*4.6, h=5+((i+gr)%2)*3.4;
    R(g,x+dx,y-h,2,h,'#e8dcc0');
    R(g,x+dx,y-h,1,h,'#fdf6e4');
    g.fillStyle=P.accent||'#6fd8e0';
    g.beginPath();g.ellipse(x+dx+1,y-h,3.8,2.6,0,0,7);g.fill();
    g.fillStyle='rgba(255,255,255,.5)';
    g.beginPath();g.ellipse(x+dx,y-h-0.8,1.6,1,0,0,7);g.fill();
  }
  g.save();g.globalAlpha=lu*0.3;g.fillStyle=P.accent||'#6fd8e0';
  g.beginPath();g.arc(x,y-7,16,0,7);g.fill();g.restore();
}
/* les cristaux du fond */
function cristal(g,x,y,gr){
  const t=Date.now()/1000, P=palier();
  poser(g,x,y,6);
  for(let i=0;i<3;i++){
    const dx=(i-1)*4, h=8+((i+gr)%3)*4;
    g.fillStyle=P.accent;
    g.beginPath();
    g.moveTo(x+dx,y-h);g.lineTo(x+dx+2.6,y-h*0.4);g.lineTo(x+dx,y);
    g.lineTo(x+dx-2.6,y-h*0.4);g.closePath();g.fill();
    g.fillStyle='rgba(255,255,255,.42)';
    g.fillRect(x+dx-0.8,y-h+1.4,1.4,h*0.5);
  }
  g.save();g.globalAlpha=.14+Math.sin(t*1.8+x)*0.06;
  g.fillStyle=P.accent;g.beginPath();g.arc(x,y-8,18,0,7);g.fill();g.restore();
}
/* la mousse, près de la surface */
function mousse(g,x,y,gr){
  for(let i=0;i<6;i++){
    const u=alea(i*3.1+gr), w=alea(i*7.7+gr);
    g.fillStyle=u<.5?'rgba(110,158,75,.55)':'rgba(86,130,60,.5)';
    g.fillRect(x-7+u*13,y-5+w*6,3+u*2,2);
  }
}
/* la flaque, qui frissonne */
function flaque(g,x,y){
  const t=Date.now()/1000;
  g.fillStyle='rgba(40,74,96,.55)';
  g.beginPath();g.ellipse(x,y-1,9,4.4,0,0,7);g.fill();
  g.fillStyle='rgba(120,180,215,.20)';
  g.beginPath();g.ellipse(x-2,y-2.4,4.4,1.8,0,0,7);g.fill();
  g.fillStyle='rgba(210,240,255,'+(0.12+Math.sin(t*1.6+x)*0.05)+')';
  g.fillRect(x-5,y-2.6+Math.sin(t*1.2+x)*0.6,4,.9);
}
/* la torche murale, avec sa flamme en trois langues */
function torcheMur(g,x,y){
  const t=Date.now()/1000, f=(t*7+x)%1;
  R(g,x-1.4,y-14,3,9,'#5b3f21');
  R(g,x-4.4,y-21,9,7.4,'#4a3a2a');
  R(g,x-4.4,y-21,9,1.4,'#6b5334');
  /* la flamme */
  const h=1+Math.sin(t*9+x)*0.12;
  g.fillStyle='#c9531c';
  g.beginPath();g.ellipse(x,y-19.4,3.4,4.4*h,0,0,7);g.fill();
  g.fillStyle='#e8802c';
  g.beginPath();g.ellipse(x,y-20.4,2.4,3.4*h,0,0,7);g.fill();
  g.fillStyle=f<.5?'#ffc65a':'#ffe0a0';
  g.beginPath();g.ellipse(x,y-21.4,1.4,2*h,0,0,7);g.fill();
  /* l'étincelle qui s'échappe */
  if(f<.08){g.fillStyle='#ffd27a';g.fillRect(x+1,y-26,1,1);}
}
/* l'étai de soutènement */
function etai(g,x,y){
  R(g,x-9,y-20,4,20,'#6b4a28');
  R(g,x+5,y-20,4,20,'#5b3f21');
  R(g,x-9,y-20,4,1.6,'#8a6238');
  R(g,x-11,y-24,22,5,'#7d5934');
  R(g,x-11,y-24,22,1.8,'#96703f');
  g.fillStyle='#3d2a17';
  [[-8,-18],[6,-18],[-10,-23],[8,-23]].forEach(([a,b])=>g.fillRect(x+a,y+b,1.8,1.8));
}
/* le rail */
function rail(g,x,y,sens){
  if(sens==='v'){
    R(g,x-6,y-8,2.6,16,'#8b939a');R(g,x+3.4,y-8,2.6,16,'#8b939a');
    R(g,x-6,y-8,1,16,'#b7bec4');
    for(let i=-1;i<2;i++)R(g,x-8,y+i*6-1,16,2.2,'#5b4a38');
  }else{
    for(let i=-1;i<2;i++)R(g,x+i*6-1,y-8,2.2,16,'#5b4a38');
    R(g,x-8,y-6,16,2.6,'#8b939a');R(g,x-8,y+3.4,16,2.6,'#8b939a');
    R(g,x-8,y-6,16,1,'#b7bec4');
  }
}
/* l'échelle qui descend, dans son puits */
function echelle(g,x,y){
  const t=Date.now()/1000;
  g.fillStyle='#070605';
  g.beginPath();g.ellipse(x,y-1,14,9,0,0,7);g.fill();

  g.fillStyle='#070605';
  g.beginPath();g.ellipse(x,y-3.4,11,6.8,0,0,7);g.fill();

  R(g,x+2.6,y-13,2.6,15,'#7d5934');

  g.fillStyle='rgba(255,210,140,'+(0.55+Math.sin(t*2)*0.2)+')';
  g.fillText('DESCENDRE',x,y-20);g.textAlign='left';
}
/* l'ascenseur : la cage de bois et son treuil */
function ascenseur(g,x,y,ouvert){
  const t=Date.now()/1000;
  poser(g,x,y,12);
  /* la cage */
  R(g,x-12,y-30,24,30,'rgba(10,8,6,.55)');
  R(g,x-12,y-30,3,30,'#6b4a28');R(g,x+9,y-30,3,30,'#6b4a28');
  R(g,x-12,y-33,24,4,'#7d5934');R(g,x-12,y-33,24,1.6,'#96703f');
  R(g,x-12,y-3,24,3,'#5b3f21');
  /* les barreaux */
  g.fillStyle='rgba(140,105,62,.75)';
  for(let i=1;i<4;i++)g.fillRect(x-12+i*6,y-28,1.6,25);
  /* le câble et sa poulie */
  g.strokeStyle='#7d6a4a';g.lineWidth=1.4;
  g.beginPath();g.moveTo(x,y-33);g.lineTo(x,y-46);g.stroke();
  g.fillStyle='#4a4038';
  g.beginPath();g.arc(x,y-47,3.4,0,7);g.fill();
  g.fillStyle='#6b6055';
  g.beginPath();g.arc(x,y-47,1.4,0,7);g.fill();
  /* la lanterne de la cage */
  const f=((t*5)%1)<.6;
  R(g,x+5,y-29,4,5,'#c9a24a');
  R(g,x+5.8,y-28,2.4,3.4,f?'#ffe9a8':'#ffb03a');
  g.save();g.globalAlpha=.14;g.fillStyle='#ffcf8a';
  g.beginPath();g.arc(x+7,y-26,18,0,7);g.fill();g.restore();
  g.font='700 6px ui-monospace,monospace';g.textAlign='center';
  g.fillStyle='rgba(255,225,170,'+(0.6+Math.sin(t*2)*0.2)+')';
  g.fillText('ASCENSEUR',x,y-38);g.textAlign='left';
}

/* ================= LE SERVEUR ARBITRE =================
   Tout ce qui compte — ce qu'on récolte, les dégâts, la mort, la forge —
   est décidé par Supabase. Le client ne fait que demander et afficher. */
async function arriver(){
  if(!e.id){
    enLigne=false;SAC={torche:3};majSac();
    creuser();dire('mode découverte — rien n’est enregistré');return;
  }
  const d=await appel('mine_entrer',{p_joueur:e.id});
  if(!d||d.erreur){
    enLigne=false;SAC={torche:3};majSac();creuser();
    dire(d&&d.erreur?d.erreur:'serveur injoignable — tu joues hors ligne');return;
  }
  niveau=d.niveau||1;
  vie=(typeof d.vie==='number')?d.vie:30;
  vieMax=d.vie_max||30;
  epee=d.epee||0;
  if(Array.isArray(d.paliers)&&d.paliers.length)PALIERS_OUVERTS=d.paliers.slice();
  else{PALIERS_OUVERTS=[1];for(let n=5;n<=niveau;n+=5)PALIERS_OUVERTS.push(n);}
  const s2=await appel('lire_sac',{p_joueur:e.id});
  SAC=(s2&&s2.sac)||{};
  creuser();majSac();
  dire('niveau '+niveau+' · '+palier().nom);
}
/* c'est le serveur qui dit ce qu'on trouve, et combien */
async function ramasser(o){
  const x=o.a*CASE+CASE/2, y=o.b*CASE+CASE/2;
  const genre=o.t==='caillou'?'pierre':o.t;
  if(!enLigne){
    SAC[genre]=(SAC[genre]||0)+1;majSac();
    volant(x,y-18,'+1 '+(NOMS[genre]||genre).toLowerCase(),(COUL[o.t]||['','#cfd6db'])[1]);
    return;
  }
  const d=await appel('mine_recolter',{p_joueur:e.id,p_genre:genre});
  if(d&&d.erreur){
    if(d.erreur==='sac plein'){dire('sac plein — remonte vendre');o.mort=false;o.coups=2;}
    else dire(d.erreur);
    return;
  }
  SAC=d.sac||SAC;majSac();
  volant(x,y-18,'+'+d.pris+' '+(NOMS[genre]||genre).toLowerCase(),(COUL[o.t]||['','#cfd6db'])[1]);
  try{navigator.vibrate&&navigator.vibrate([8,24,14]);}catch(x2){}
}

async function blesser(d,qui){
  malSoi=0.3;
  volant(joueur.x,joueur.y-34,'-'+d,'#ff8a8a');
  try{navigator.vibrate&&navigator.vibrate([14,40,18]);}catch(x){}
  if(!enLigne){
    vie=Math.max(0,vie-d);
    if(vie<=0)tomber(qui,null);
    return;
  }
  const r=await appel('mine_degat',{p_joueur:e.id,p_montant:d});
  if(r&&typeof r.vie==='number')vie=r.vie;
  if(r&&r.mort)tomber(qui,r.perdu);
}
async function changerNiveau(vers){
  if(enLigne&&e.id){
    const d=await appel('mine_niveau',{p_joueur:e.id,p_vers:vers});
    if(d&&d.erreur)return dire(d.erreur);

function remonterAuJour(){

/* la torche : elle se consomme, et on en rallume une depuis le sac */
async function rallumer(){
  if(allumee&&torche>30)return dire('ta torche brûle encore');
  if(!(SAC.torche>0))return dire('plus de torche — remonte en fabriquer');
  if(enLigne&&e.id){
    const d=await appel('retirer_du_sac',{p_joueur:e.id,p_cout:{torche:1}});
    if(d&&d.erreur)return dire(d.erreur);
    SAC=d.sac||SAC;
  }else SAC.torche--;
  torche=120;allumee=true;majSac();dire('torche rallumée');
  try{navigator.vibrate&&navigator.vibrate(12);}catch(x){}
}

/* ================= LES BÊTES, VUES DE DESSUS ================= */
let BETES=[];
function peupler(){
  BETES=[];
  const b=bande(niveau), d=durete(niveau);
  const combien=1+Math.min(4,Math.floor(niveau/3));
  const libres=[];
  for(let y=3;y<H-2;y++)for(let x=2;x<L-2;x++){
    if(MUR[y][x])continue;
    /* jamais trop près de toi au départ */
    if(Math.hypot(x*CASE-joueur.x,y*CASE-joueur.y)<90)continue;
    libres.push([x,y]);
  }
  for(let i=0;i<combien&&libres.length;i++){
    const p=libres.splice((Math.random()*libres.length)|0,1)[0];
    const B=BESTIAIRE[Math.min(BESTIAIRE.length-1,b+((Math.random()<.25)?1:0))];
    BETES.push({B,x:p[0]*CASE+8,y:p[1]*CASE+8,vie:Math.round(B.vie*d),
      vieMax:Math.round(B.vie*d),mal:0,pas:Math.random()*6,frappe:0,dir:1});
  }
}
function majBetes(dt){
  BETES.forEach(m=>{
    if(m.vie<=0)return;
    if(m.mal>0)m.mal-=dt;
    const dx=joueur.x-m.x, dy=joueur.y-m.y, d=Math.hypot(dx,dy);
    m.pas+=dt*7;
    if(d<130&&!mortJoueur){
      /* elle vient sur toi, en contournant la roche */
      const v=m.B.vit*dt;
      const nx=m.x+dx/d*v, ny=m.y+dy/d*v;
      if(m.B.vole||!mur((nx/CASE)|0,(m.y/CASE)|0))m.x=nx;
      if(m.B.vole||!mur((m.x/CASE)|0,(ny/CASE)|0))m.y=ny;
      m.dir=dx>0?1:-1;
      if(d<14&&Date.now()-m.frappe>900){
        m.frappe=Date.now();
        blesser(Math.round(m.B.deg*(1+(niveau-1)*0.05)),m.B.nom);
      }
    }else{
      /* elle rôde */
      m.x+=Math.cos(m.pas*0.6)*m.B.vit*0.25*dt;
      m.y+=Math.sin(m.pas*0.4)*m.B.vit*0.25*dt;
      if(mur((m.x/CASE)|0,(m.y/CASE)|0)&&!m.B.vole){
        m.x-=Math.cos(m.pas*0.6)*m.B.vit*0.25*dt;
        m.y-=Math.sin(m.pas*0.4)*m.B.vit*0.25*dt;
      }
    }
  });
  BETES=BETES.filter(m=>m.vie>0||Date.now()-m.mortA<600);
}
function dessinerBete(g,m,x,y){
  const B=m.B, t=Date.now()/1000, s=B.taille;
  const flot=B.vole?Math.sin(t*4+m.x)*2.4:0;
  y+=flot;
  /* l'ombre */
  g.fillStyle='rgba(0,0,0,.35)';
  g.beginPath();g.ellipse(x,y+1,6*s,2.4*s,0,0,7);g.fill();
  g.save();
  if(m.mal>0){g.globalAlpha=0.5+Math.sin(t*40)*0.3;}
  /* le corps */
  const h=Math.round(10*s), w=Math.round(11*s);
  g.fillStyle=B.coul[1];
  g.fillRect(Math.round(x-w/2),Math.round(y-h),w,h);
  g.fillStyle=B.coul[0];
  g.fillRect(Math.round(x-w/2),Math.round(y-h),w,Math.round(h*0.45));
  /* la tête */
  g.fillStyle=B.coul[0];
  g.fillRect(Math.round(x-3*s),Math.round(y-h-4*s),Math.round(6*s),Math.round(4*s));
  /* les yeux, qui luisent */
  g.fillStyle='#ff6a4a';
  g.fillRect(Math.round(x-2*s),Math.round(y-h-3*s),1.4,1.4);
  g.fillRect(Math.round(x+0.6*s),Math.round(y-h-3*s),1.4,1.4);
  /* les pattes, ou les ailes */
  if(B.vole){
    const bat=Math.sin(t*14+m.x)*3;
    g.fillStyle=B.coul[1];
    g.beginPath();g.moveTo(x-w/2,y-h*0.7);g.lineTo(x-w,y-h*0.7-bat);g.lineTo(x-w/2,y-h*0.3);
    g.closePath();g.fill();
    g.beginPath();g.moveTo(x+w/2,y-h*0.7);g.lineTo(x+w,y-h*0.7-bat);g.lineTo(x+w/2,y-h*0.3);
    g.closePath();g.fill();
  }else{
    const p=Math.sin(m.pas)*1.6;
    g.fillStyle=B.coul[1];
    g.fillRect(Math.round(x-w/2),Math.round(y-2+p),2,3);
    g.fillRect(Math.round(x+w/2-2),Math.round(y-2-p),2,3);
  }
  g.restore();
  /* sa jauge, seulement si elle est entamée */
  if(m.vie<m.vieMax){
    const l=14*s;
    g.fillStyle='rgba(0,0,0,.6)';g.fillRect(x-l/2,y-h-8*s,l,2.4);
    g.fillStyle='#c94a4a';g.fillRect(x-l/2,y-h-8*s,l*(m.vie/m.vieMax),2.4);
  }
}
/* ton coup d'épée, quand une bête est à portée */
/* l'arc que trace la lame, peint juste après le corps du mineur */
let TAILLADE=null;
function frapperBete(m){
  const E=EPEES[epee]||EPEES[0];
  m.vie-=E.deg;m.mal=0.22;
  const x=m.x, y=m.y;
  /* la lame balaie un quart de cercle dans la direction du coup */
  TAILLADE={t:0,dir:joueur.dir,x:joueur.x,y:joueur.y,coul:E.coul[0],
    vif:E.coul[1]||'#fff6d8',portee:E.deg>=14?22:E.deg>=9?19:16};
  /* la bête recule sous le choc */
  const a=Math.atan2(m.y-joueur.y,m.x-joueur.x);
  m.x+=Math.cos(a)*5;m.y+=Math.sin(a)*5;
  secousse=Math.max(secousse,2.4);
  for(let i=0;i<8;i++)PARTS.push({x,y:y-6,vx:(Math.random()-.5)*90,
    vy:-30-Math.random()*60,t:0,c:m.B.coul[0]});
  volant(x,y-20,'-'+E.deg,'#ffd9a8');
  try{navigator.vibrate&&navigator.vibrate(10);}catch(x2){}
  if(m.vie<=0){
    m.mortA=Date.now();
    volant(x,y-26,m.B.nom+' abattu','#9fd67a');
    for(let i=0;i<14;i++)PARTS.push({x,y:y-6,vx:(Math.random()-.5)*120,
      vy:-40-Math.random()*70,t:0,c:m.B.coul[1]});
  }
}

function tomber(qui,perduServeur){
  mortJoueur=true;
  const src=perduServeur||SAC;

    .map(k=>src[k]+' '+(NOMS[k]||k).toLowerCase());

/* ================= toi ================= */
const joueur={x:0,y:0,dir:'bas',pas:0,marche:false};
/* les paliers qu'on a atteints : l'ascenseur y redescend directement */
let PALIERS_OUVERTS=[1];
function ouvrirPalier(n){
  if(EST_RELAIS(n)&&PALIERS_OUVERTS.indexOf(n)<0){
    PALIERS_OUVERTS.push(n);PALIERS_OUVERTS.sort((a,b)=>a-b);
    dire('ascenseur débloqué — niveau '+n);
    try{navigator.vibrate&&navigator.vibrate([10,40,10,40,16]);}catch(e){}
    return true;
  }
  return false;
}
let SAC={};
let malSoi=0, mortJoueur=false, fondu=0;
let vieMax=30, torche=120, allumee=true;
const TEXTES=[],PARTS=[],ETINCELLES=[];
function volant(x,y,txt,c){TEXTES.push({x,y,txt,c,t:0});}
function dire(t){$('msg').textContent=t;$('msg').classList.add('on');
  clearTimeout(dire.t);dire.t=setTimeout(()=>$('msg').classList.remove('on'),2000);}
let secousse=0, noirDepuis=0;

function cible(){
  let d0=22,res=null;
  OBJETS.forEach(o=>{
    if(o.mort)return;
    if(!['fer','charbon','cuivre','argent','or','gemme','caillou','echelle','tonneau','caisse','ascenseur','cristal'].includes(o.t))return;
    const x=o.a*CASE+CASE/2, y=o.b*CASE+CASE/2;
    const d=Math.hypot(x-joueur.x,y-joueur.y);
    if(d<d0){d0=d;res=o;}
  });
  return res;
}
function beteVisee(){
  let d0=20,res=null;
  BETES.forEach(m=>{if(m.vie<=0)return;
    const d=Math.hypot(m.x-joueur.x,m.y-joueur.y);
    if(d<d0){d0=d;res=m;}});
  return res;
}
function majAction(){
  const b=$('action');

    b.classList.add('on');return;

  else{

      ' · '+r+'</small>';

}
$('action').onclick=()=>{
  if(mortJoueur)return;
  const m=beteVisee();
  if(m){
    joueur.dir=Math.abs(m.x-joueur.x)>Math.abs(m.y-joueur.y)?(m.x>joueur.x?'droite':'gauche')
              :(m.y>joueur.y?'bas':'haut');
    GESTE={t:1,cible:null,impact:false,type:'hache',bete:m};

  }
  const o=cible();if(!o)return;
  if(o.t==='ascenseur')return ouvrirAscenseur();
  if(o.t==='echelle')return changerNiveau(niveau+1);
  const x=o.a*CASE+CASE/2, y=o.b*CASE+CASE/2;
  joueur.dir=Math.abs(x-joueur.x)>Math.abs(y-joueur.y)?(x>joueur.x?'droite':'gauche')
            :(y>joueur.y?'bas':'haut');
  GESTE={t:1,cible:o,impact:false,type:'pioche'};
  try{navigator.vibrate&&navigator.vibrate(10);}catch(e){}
};
function impact(o){
  const x=o.a*CASE+CASE/2, y=o.b*CASE+CASE/2;
  o.frappe=Date.now();secousse=3;
  if(o.t==='tonneau'||o.t==='caisse'){

  }
  o.coups=(o.coups||0)+1;
  ETINCELLES.push({x,y:y-6,t:0,plein:o.coups>=3});
  for(let i=0;i<(o.coups>=3?12:6);i++)
    PARTS.push({x,y:y-6,vx:(Math.random()-.5)*80,vy:-20-Math.random()*70,t:0,
      c:Math.random()<.5?((VEINES[o.t]&&VEINES[o.t].eclat)||'#a2a9b0'):'#b9a88f'});
  if(o.coups>=3){o.mort=true;ramasser(o);}
}
