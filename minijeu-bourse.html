<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Trading - Battle Dock</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #0f172a;
      min-height: 100vh;
      padding: 12px;
      padding-bottom: 40px;
      color: #e2e8f0;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    .header {
      background: linear-gradient(135deg, #1e293b, #334155);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid #334155;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .title {
      font-size: 20px;
      font-weight: 700;
      color: #f1f5f9;
    }

    .market-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .market-status.open {
      color: #10b981;
    }

    .market-status.closed {
      color: #ef4444;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .status-dot.open {
      background: #10b981;
      animation: pulse 2s ease-in-out infinite;
    }

    .status-dot.closed {
      background: #ef4444;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .subtitle {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 500;
    }

    .market-hours {
      font-size: 11px;
      color: #64748b;
      margin-top: 4px;
      font-weight: 600;
    }

    .wallet-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .wallet-card {
      background: linear-gradient(135deg, #1e293b, #334155);
      border-radius: 10px;
      padding: 12px;
      border: 1px solid #334155;
    }

    .wallet-label {
      font-size: 10px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .wallet-value {
      font-size: 22px;
      font-weight: 700;
      color: #f1f5f9;
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 0.5px;
    }

    .wallet-subtext {
      font-size: 10px;
      color: #64748b;
      margin-top: 2px;
      font-weight: 600;
    }

    .portfolio-section {
      background: linear-gradient(135deg, #1e293b, #334155);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #334155;
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .portfolio-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #334155;
    }

    .portfolio-item:last-child {
      border-bottom: none;
    }

    .portfolio-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .portfolio-icon {
      font-size: 28px;
    }

    .portfolio-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .portfolio-name {
      font-size: 13px;
      font-weight: 600;
      color: #f1f5f9;
    }

    .portfolio-qty {
      font-size: 10px;
      color: #64748b;
    }

    .portfolio-right {
      text-align: right;
    }

    .portfolio-value {
      font-size: 15px;
      font-weight: 700;
      color: #f1f5f9;
      font-family: 'Bebas Neue', sans-serif;
    }

    .portfolio-pnl {
      font-size: 10px;
      font-weight: 700;
    }

    .portfolio-pnl.positive {
      color: #10b981;
    }

    .portfolio-pnl.negative {
      color: #ef4444;
    }

    .stocks-section {
      margin-bottom: 12px;
    }

    .stock-card {
      background: linear-gradient(135deg, #1e293b, #334155);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid #334155;
      transition: all 0.2s;
    }

    @media (hover: hover) {
      .stock-card:hover {
        border-color: #475569;
      }
    }

    .stock-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .stock-left {
      display: flex;
      gap: 10px;
      align-items: center;
      flex: 1;
    }

    .stock-icon {
      font-size: 30px;
      flex-shrink: 0;
    }

    .stock-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
      min-width: 0;
    }

    .stock-name {
      font-size: 14px;
      font-weight: 700;
      color: #f1f5f9;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .stock-code {
      font-size: 10px;
      color: #64748b;
      font-weight: 600;
    }

    .stock-right {
      text-align: right;
      flex-shrink: 0;
    }

    .stock-price {
      font-size: 18px;
      font-weight: 700;
      color: #f1f5f9;
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 0.5px;
    }

    .stock-change {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 6px;
      border-radius: 4px;
      display: inline-block;
      margin-top: 3px;
    }

    .stock-change.positive {
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
    }

    .stock-change.negative {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
    }

    .stock-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }

    .stock-input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .stock-input {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 14px;
      text-align: center;
      color: #f1f5f9;
      font-weight: 600;
      outline: none;
      flex: 1;
      min-width: 0;
    }

    .stock-input:focus {
      border-color: #3b82f6;
    }

    .stock-buttons-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .stock-btn {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .stock-btn.buy {
      background: #10b981;
      color: white;
    }

    .stock-btn.buy:active {
      transform: scale(0.95);
      background: #059669;
    }

    .stock-btn.sell {
      background: #ef4444;
      color: white;
    }

    .stock-btn.sell:active {
      transform: scale(0.95);
      background: #dc2626;
    }

    .stock-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .empty-portfolio {
      text-align: center;
      padding: 16px;
      color: #64748b;
      font-size: 12px;
    }

    .back-btn {
      background: white;
      color: #3b82f6;
      border: none;
      padding: 14px 32px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      width: 100%;
      max-width: 400px;
      margin: 20px auto 0;
      display: block;
      transition: all 0.2s;
    }

    .back-btn:active {
      transform: scale(0.98);
    }

    /* Mobile très petit */
    @media (max-width: 360px) {
      .stock-name {
        font-size: 13px;
      }

      .stock-price {
        font-size: 16px;
      }

      .stock-btn {
        padding: 7px 12px;
        font-size: 11px;
      }

      .wallet-value {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-top">
        <div class="title">📊 Trading</div>
        <div class="market-status" id="marketStatus">
          <div class="status-dot"></div>
          OUVERT
        </div>
      </div>
      <div class="subtitle">Port de Marseille Exchange</div>
      <div class="market-hours">Horaires : 9h - 18h</div>
    </div>

    <div class="wallet-section">
      <div class="wallet-card">
        <div class="wallet-label">Liquidités</div>
        <div class="wallet-value" id="cash">0€</div>
        <div class="wallet-subtext">Disponible</div>
      </div>
      <div class="wallet-card">
        <div class="wallet-label">Portefeuille</div>
        <div class="wallet-value" id="portfolioValue">0€</div>
        <div class="wallet-subtext" id="portfolioPnl">0.00%</div>
      </div>
    </div>

    <div class="portfolio-section" id="portfolioSection">
      <div class="section-title">📈 Positions</div>
      <div id="portfolioList">
        <div class="empty-portfolio">Aucune position</div>
      </div>
    </div>

    <div class="stocks-section">
      <div class="section-title">💼 Actions</div>
      <div id="stocksContainer"></div>
    </div>

    <button class="back-btn" onclick="goBack()">← Retour</button>
  </div>

  <script>
    console.log('📊 [BOURSE] Initialisation');

    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const supabaseClient = createClient(supabaseUrl, supabaseKey);

    const userId = localStorage.getItem('userId');
    if (!userId) window.location.href = 'index.html';

    let cash = 0;
    let portfolio = JSON.parse(localStorage.getItem('stock_portfolio') || '{}');
    let isMarketOpen = true;

    const stocks = [
      { id: 'cma_cgm', name: 'CMA CGM Group', code: 'CMACGM', icon: '🚢', basePrice: 150, volatility: 0.02 },
      { id: 'bollore_log', name: 'Bolloré Logistics', code: 'BOLOG', icon: '📦', basePrice: 85, volatility: 0.025 },
      { id: 'marseille_port', name: 'GPMM', code: 'GPMM', icon: '⚓', basePrice: 120, volatility: 0.015 },
      { id: 'total_energy', name: 'TotalEnergies', code: 'TTEF', icon: '⚡', basePrice: 200, volatility: 0.03 },
      { id: 'corsica_ferry', name: 'Corsica Ferries', code: 'CRSF', icon: '⛴️', basePrice: 65, volatility: 0.02 },
      { id: 'marseille_repair', name: 'Chantiers Navals', code: 'MAREP', icon: '🔧', basePrice: 45, volatility: 0.025 },
      { id: 'fos_terminal', name: 'FOS Terminal', code: 'FOST', icon: '🏭', basePrice: 95, volatility: 0.02 },
      { id: 'med_cruise', name: 'Mediterranean Cruise', code: 'MEDCR', icon: '🛳️', basePrice: 110, volatility: 0.03 },
      { id: 'oil_refinery', name: 'Raffinerie Lavéra', code: 'LAVRA', icon: '🛢️', basePrice: 180, volatility: 0.035 },
      { id: 'freight_log', name: 'Freight Solutions', code: 'FRGHT', icon: '🚛', basePrice: 55, volatility: 0.025 }
    ];

    let currentPrices = {};

    loadMoney();
    initializePrices();
    checkMarketStatus();
    renderStocks();
    updatePortfolio();

    // Update prices every 3 seconds
    setInterval(() => {
      if (isMarketOpen) {
        updatePrices();
        renderStocks();
        updatePortfolio();
      }
    }, 3000);

    // Check market status every minute
    setInterval(checkMarketStatus, 60000);

    async function loadMoney() {
      try {
        const { data: progressArray } = await supabaseClient
          .from('game_progress')
          .select('money')
          .eq('user_id', userId);

        if (progressArray && progressArray[0]) {
          cash = progressArray[0].money || 0;
          document.getElementById('cash').textContent = cash.toLocaleString('fr-FR') + '€';
        }
      } catch (err) {
        console.error('❌ [BOURSE] Erreur:', err);
      }
    }

    function checkMarketStatus() {
      const now = new Date();
      const hour = now.getHours();
      
      // Market open 9h-18h
      isMarketOpen = hour >= 9 && hour < 18;

      const statusElement = document.getElementById('marketStatus');
      const dot = statusElement.querySelector('.status-dot');

      if (isMarketOpen) {
        statusElement.className = 'market-status open';
        statusElement.innerHTML = '<div class="status-dot open"></div>OUVERT';
      } else {
        statusElement.className = 'market-status closed';
        statusElement.innerHTML = '<div class="status-dot closed"></div>FERMÉ';
      }

      console.log('📊 [BOURSE] Marché', isMarketOpen ? 'OUVERT' : 'FERMÉ');
      renderStocks();
    }

    function initializePrices() {
      stocks.forEach(stock => {
        const savedPrice = localStorage.getItem(`stock_price_${stock.id}`);
        if (savedPrice) {
          currentPrices[stock.id] = parseFloat(savedPrice);
        } else {
          currentPrices[stock.id] = stock.basePrice;
          localStorage.setItem(`stock_price_${stock.id}`, stock.basePrice);
        }
      });
    }

    function updatePrices() {
      stocks.forEach(stock => {
        const oldPrice = currentPrices[stock.id];
        
        // Random event: 5% chance of big movement
        const bigEvent = Math.random() < 0.05;
        
        let variation;
        if (bigEvent) {
          // Big movement: -15% to +15%
          variation = (Math.random() - 0.5) * 0.3;
          console.log('💥 [BOURSE] Event sur', stock.code, ':', (variation * 100).toFixed(2) + '%');
        } else {
          // Small movement based on volatility
          variation = (Math.random() - 0.5) * stock.volatility * 2;
        }
        
        const newPrice = oldPrice * (1 + variation);
        
        // Price floor at 10€
        currentPrices[stock.id] = Math.max(10, Math.round(newPrice * 100) / 100);
        localStorage.setItem(`stock_price_${stock.id}`, currentPrices[stock.id]);
      });
    }

    function renderStocks() {
      const container = document.getElementById('stocksContainer');
      container.innerHTML = '';

      stocks.forEach(stock => {
        const price = currentPrices[stock.id];
        const oldPrice = parseFloat(localStorage.getItem(`stock_old_price_${stock.id}`) || price);
        const change = ((price - oldPrice) / oldPrice) * 100;
        const changeClass = change >= 0 ? 'positive' : 'negative';
        const changeSymbol = change >= 0 ? '▲' : '▼';

        const card = document.createElement('div');
        card.className = 'stock-card';
        card.innerHTML = `
          <div class="stock-header">
            <div class="stock-left">
              <div class="stock-icon">${stock.icon}</div>
              <div class="stock-info">
                <div class="stock-name">${stock.name}</div>
                <div class="stock-code">${stock.code}</div>
              </div>
            </div>
            <div class="stock-right">
              <div class="stock-price">${price.toFixed(2)}€</div>
              <div class="stock-change ${changeClass}">
                ${changeSymbol} ${Math.abs(change).toFixed(2)}%
              </div>
            </div>
          </div>
          <div class="stock-actions">
            <div class="stock-input-row">
              <input 
                type="number" 
                class="stock-input" 
                id="qty_${stock.id}" 
                placeholder="Quantité" 
                min="1"
                value="1"
                inputmode="numeric"
                ${!isMarketOpen ? 'disabled' : ''}
              >
            </div>
            <div class="stock-buttons-row">
              <button class="stock-btn buy" onclick="buyStock('${stock.id}')" ${!isMarketOpen ? 'disabled' : ''}>
                📈 Acheter
              </button>
              <button class="stock-btn sell" onclick="sellStock('${stock.id}')" ${!portfolio[stock.id] || !isMarketOpen ? 'disabled' : ''}>
                📉 Vendre
              </button>
            </div>
          </div>
        `;

        container.appendChild(card);
        localStorage.setItem(`stock_old_price_${stock.id}`, price);
      });
    }

    async function buyStock(stockId) {
      if (!isMarketOpen) return;

      const stock = stocks.find(s => s.id === stockId);
      const qty = parseInt(document.getElementById(`qty_${stockId}`).value) || 1;
      const price = currentPrices[stockId];
      const totalCost = price * qty;

      if (totalCost > cash) return;

      console.log('📈 [ACHAT]', qty, 'x', stock.name, '@', price.toFixed(2) + '€');

      cash -= totalCost;

      if (!portfolio[stockId]) {
        portfolio[stockId] = { qty: 0, avgPrice: 0 };
      }

      const totalQty = portfolio[stockId].qty + qty;
      const totalValue = (portfolio[stockId].qty * portfolio[stockId].avgPrice) + totalCost;
      portfolio[stockId].avgPrice = totalValue / totalQty;
      portfolio[stockId].qty = totalQty;

      localStorage.setItem('stock_portfolio', JSON.stringify(portfolio));

      try {
        await supabaseClient
          .from('game_progress')
          .update({ money: cash })
          .eq('user_id', userId);

        document.getElementById('cash').textContent = cash.toLocaleString('fr-FR') + '€';
        renderStocks();
        updatePortfolio();
      } catch (err) {
        console.error('❌ [BOURSE] Erreur:', err);
      }
    }

    async function sellStock(stockId) {
      if (!isMarketOpen) return;

      const stock = stocks.find(s => s.id === stockId);
      const qty = parseInt(document.getElementById(`qty_${stockId}`).value) || 1;
      const price = currentPrices[stockId];

      if (!portfolio[stockId] || portfolio[stockId].qty < qty) return;

      console.log('📉 [VENTE]', qty, 'x', stock.name, '@', price.toFixed(2) + '€');

      const totalValue = price * qty;
      cash += totalValue;

      portfolio[stockId].qty -= qty;
      if (portfolio[stockId].qty === 0) {
        delete portfolio[stockId];
      }

      localStorage.setItem('stock_portfolio', JSON.stringify(portfolio));

      try {
        await supabaseClient
          .from('game_progress')
          .update({ money: cash })
          .eq('user_id', userId);

        document.getElementById('cash').textContent = cash.toLocaleString('fr-FR') + '€';
        renderStocks();
        updatePortfolio();
      } catch (err) {
        console.error('❌ [BOURSE] Erreur:', err);
      }
    }

    function updatePortfolio() {
      const list = document.getElementById('portfolioList');
      let totalValue = 0;
      let totalInvested = 0;

      if (Object.keys(portfolio).length === 0) {
        list.innerHTML = '<div class="empty-portfolio">Aucune position</div>';
        document.getElementById('portfolioValue').textContent = '0€';
        document.getElementById('portfolioPnl').textContent = '0.00%';
        document.getElementById('portfolioPnl').style.color = '#64748b';
        return;
      }

      list.innerHTML = '';

      Object.keys(portfolio).forEach(stockId => {
        const stock = stocks.find(s => s.id === stockId);
        const holding = portfolio[stockId];
        const currentPrice = currentPrices[stockId];
        const currentValue = holding.qty * currentPrice;
        const investedValue = holding.qty * holding.avgPrice;
        const pnl = currentValue - investedValue;
        const pnlPercent = (pnl / investedValue) * 100;

        totalValue += currentValue;
        totalInvested += investedValue;

        const item = document.createElement('div');
        item.className = 'portfolio-item';
        item.innerHTML = `
          <div class="portfolio-left">
            <div class="portfolio-icon">${stock.icon}</div>
            <div class="portfolio-info">
              <div class="portfolio-name">${stock.name}</div>
              <div class="portfolio-qty">${holding.qty} × ${holding.avgPrice.toFixed(2)}€</div>
            </div>
          </div>
          <div class="portfolio-right">
            <div class="portfolio-value">${currentValue.toFixed(0)}€</div>
            <div class="portfolio-pnl ${pnl >= 0 ? 'positive' : 'negative'}">
              ${pnl >= 0 ? '+' : ''}${pnl.toFixed(0)}€ (${pnlPercent >= 0 ? '+' : ''}${pnlPercent.toFixed(1)}%)
            </div>
          </div>
        `;
        list.appendChild(item);
      });

      document.getElementById('portfolioValue').textContent = totalValue.toFixed(0) + '€';

      const totalPnlPercent = ((totalValue - totalInvested) / totalInvested) * 100;
      const pnlElement = document.getElementById('portfolioPnl');
      pnlElement.textContent = `${totalPnlPercent >= 0 ? '+' : ''}${totalPnlPercent.toFixed(2)}%`;
      pnlElement.style.color = totalPnlPercent >= 0 ? '#10b981' : '#ef4444';
    }

    function goBack() {
      window.location.href = 'jeux.html';
    }
  </script>
</body>
</html>
