<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Trading - Battle Dock</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #0f172a;
      min-height: 100vh;
      padding: 16px;
      padding-bottom: 80px;
      color: #e2e8f0;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    .header {
      background: linear-gradient(135deg, #1e293b, #334155);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid #334155;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .title {
      font-size: 24px;
      font-weight: 700;
      color: #f1f5f9;
    }

    .market-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #10b981;
      font-weight: 600;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .subtitle {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 500;
    }

    .wallet-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .wallet-card {
      background: linear-gradient(135deg, #1e293b, #334155);
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #334155;
    }

    .wallet-label {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .wallet-value {
      font-size: 26px;
      font-weight: 700;
      color: #f1f5f9;
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 0.5px;
    }

    .wallet-subtext {
      font-size: 11px;
      color: #64748b;
      margin-top: 2px;
    }

    .portfolio-section {
      background: linear-gradient(135deg, #1e293b, #334155);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid #334155;
    }

    .section-title {
      font-size: 14px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .portfolio-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #334155;
    }

    .portfolio-item:last-child {
      border-bottom: none;
    }

    .portfolio-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .portfolio-icon {
      font-size: 32px;
    }

    .portfolio-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .portfolio-name {
      font-size: 14px;
      font-weight: 600;
      color: #f1f5f9;
    }

    .portfolio-qty {
      font-size: 11px;
      color: #64748b;
    }

    .portfolio-right {
      text-align: right;
    }

    .portfolio-value {
      font-size: 16px;
      font-weight: 700;
      color: #f1f5f9;
      font-family: 'Bebas Neue', sans-serif;
    }

    .portfolio-pnl {
      font-size: 11px;
      font-weight: 600;
    }

    .portfolio-pnl.positive {
      color: #10b981;
    }

    .portfolio-pnl.negative {
      color: #ef4444;
    }

    .stocks-section {
      margin-bottom: 16px;
    }

    .stock-card {
      background: linear-gradient(135deg, #1e293b, #334155);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid #334155;
      transition: all 0.2s;
    }

    @media (hover: hover) {
      .stock-card:hover {
        border-color: #475569;
        transform: translateY(-2px);
      }
    }

    .stock-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .stock-left {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .stock-icon {
      font-size: 36px;
    }

    .stock-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stock-name {
      font-size: 15px;
      font-weight: 700;
      color: #f1f5f9;
    }

    .stock-code {
      font-size: 11px;
      color: #64748b;
      font-weight: 600;
    }

    .stock-right {
      text-align: right;
    }

    .stock-price {
      font-size: 22px;
      font-weight: 700;
      color: #f1f5f9;
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 0.5px;
    }

    .stock-change {
      font-size: 12px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      display: inline-block;
      margin-top: 4px;
    }

    .stock-change.positive {
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
    }

    .stock-change.negative {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
    }

    .stock-actions {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
      align-items: center;
    }

    .stock-input {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
      color: #f1f5f9;
      font-weight: 600;
      outline: none;
    }

    .stock-input:focus {
      border-color: #3b82f6;
    }

    .stock-btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stock-btn.buy {
      background: #10b981;
      color: white;
    }

    .stock-btn.buy:active {
      transform: scale(0.95);
      background: #059669;
    }

    .stock-btn.sell {
      background: #ef4444;
      color: white;
    }

    .stock-btn.sell:active {
      transform: scale(0.95);
      background: #dc2626;
    }

    .stock-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .empty-portfolio {
      text-align: center;
      padding: 20px;
      color: #64748b;
      font-size: 13px;
    }

    .back-btn {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      border: none;
      padding: 12px 32px;
      border-radius: 50px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(59, 130, 246, 0.4);
      z-index: 100;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .back-btn:active {
      transform: translateX(-50%) scale(0.95);
    }

    /* Mobile */
    @media (max-width: 400px) {
      body {
        padding: 12px;
        padding-bottom: 70px;
      }

      .title {
        font-size: 20px;
      }

      .wallet-value {
        font-size: 22px;
      }

      .stock-icon {
        font-size: 30px;
      }

      .stock-name {
        font-size: 14px;
      }

      .stock-price {
        font-size: 20px;
      }

      .stock-btn {
        padding: 9px 16px;
        font-size: 12px;
      }

      .portfolio-icon {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-top">
        <div class="title">📊 Trading Terminal</div>
        <div class="market-status">
          <div class="status-dot"></div>
          MARCHÉ OUVERT
        </div>
      </div>
      <div class="subtitle">Port de Marseille Exchange</div>
    </div>

    <div class="wallet-section">
      <div class="wallet-card">
        <div class="wallet-label">Liquidités</div>
        <div class="wallet-value" id="cash">0€</div>
        <div class="wallet-subtext">Disponible</div>
      </div>
      <div class="wallet-card">
        <div class="wallet-label">Portefeuille</div>
        <div class="wallet-value" id="portfolioValue">0€</div>
        <div class="wallet-subtext" id="portfolioPnl">0.00%</div>
      </div>
    </div>

    <div class="portfolio-section" id="portfolioSection">
      <div class="section-title">📈 Positions Ouvertes</div>
      <div id="portfolioList">
        <div class="empty-portfolio">Aucune position</div>
      </div>
    </div>

    <div class="stocks-section">
      <div class="section-title">💼 Actions Disponibles</div>
      <div id="stocksContainer"></div>
    </div>
  </div>

  <button class="back-btn" onclick="goBack()">← Retour</button>

  <script>
    console.log('📊 [BOURSE] Initialisation Terminal');

    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const supabaseClient = createClient(supabaseUrl, supabaseKey);

    const userId = localStorage.getItem('userId');
    if (!userId) window.location.href = 'index.html';

    let cash = 0;
    let portfolio = JSON.parse(localStorage.getItem('stock_portfolio') || '{}');

    const stocks = [
      {
        id: 'cma_cgm',
        name: 'CMA CGM Group',
        code: 'CMACGM',
        icon: '🚢',
        basePrice: 150,
        sector: 'Maritime Transport'
      },
      {
        id: 'bollore_log',
        name: 'Bolloré Logistics',
        code: 'BOLOG',
        icon: '📦',
        basePrice: 85,
        sector: 'Logistics'
      },
      {
        id: 'marseille_port',
        name: 'GPMM',
        code: 'GPMM',
        icon: '⚓',
        basePrice: 120,
        sector: 'Port Authority'
      },
      {
        id: 'total_energy',
        name: 'TotalEnergies',
        code: 'TTEF',
        icon: '⚡',
        basePrice: 200,
        sector: 'Energy'
      },
      {
        id: 'corsica_ferry',
        name: 'Corsica Ferries',
        code: 'CRSF',
        icon: '⛴️',
        basePrice: 65,
        sector: 'Ferry Services'
      },
      {
        id: 'marseille_repair',
        name: 'Chantiers Navals',
        code: 'MAREP',
        icon: '🔧',
        basePrice: 45,
        sector: 'Naval Repair'
      }
    ];

    let currentPrices = {};

    loadMoney();
    initializePrices();
    renderStocks();
    updatePortfolio();

    setInterval(() => {
      updatePrices();
      renderStocks();
      updatePortfolio();
    }, 5000);

    async function loadMoney() {
      try {
        const { data: progressArray } = await supabaseClient
          .from('game_progress')
          .select('money')
          .eq('user_id', userId);

        if (progressArray && progressArray[0]) {
          cash = progressArray[0].money || 0;
          document.getElementById('cash').textContent = cash.toLocaleString('fr-FR') + '€';
        }
      } catch (err) {
        console.error('❌ [BOURSE] Erreur:', err);
      }
    }

    function initializePrices() {
      stocks.forEach(stock => {
        const savedPrice = localStorage.getItem(`stock_price_${stock.id}`);
        if (savedPrice) {
          currentPrices[stock.id] = parseFloat(savedPrice);
        } else {
          currentPrices[stock.id] = stock.basePrice;
          localStorage.setItem(`stock_price_${stock.id}`, stock.basePrice);
        }
      });
    }

    function updatePrices() {
      stocks.forEach(stock => {
        const oldPrice = currentPrices[stock.id];
        const variation = (Math.random() - 0.5) * 0.1;
        const newPrice = oldPrice * (1 + variation);
        
        currentPrices[stock.id] = Math.max(20, Math.round(newPrice * 100) / 100);
        localStorage.setItem(`stock_price_${stock.id}`, currentPrices[stock.id]);
      });
    }

    function renderStocks() {
      const container = document.getElementById('stocksContainer');
      container.innerHTML = '';

      stocks.forEach(stock => {
        const price = currentPrices[stock.id];
        const oldPrice = parseFloat(localStorage.getItem(`stock_old_price_${stock.id}`) || price);
        const change = ((price - oldPrice) / oldPrice) * 100;
        const changeClass = change >= 0 ? 'positive' : 'negative';
        const changeSymbol = change >= 0 ? '▲' : '▼';

        const card = document.createElement('div');
        card.className = 'stock-card';
        card.innerHTML = `
          <div class="stock-header">
            <div class="stock-left">
              <div class="stock-icon">${stock.icon}</div>
              <div class="stock-info">
                <div class="stock-name">${stock.name}</div>
                <div class="stock-code">${stock.code}</div>
              </div>
            </div>
            <div class="stock-right">
              <div class="stock-price">${price.toFixed(2)}€</div>
              <div class="stock-change ${changeClass}">
                ${changeSymbol} ${Math.abs(change).toFixed(2)}%
              </div>
            </div>
          </div>
          <div class="stock-actions">
            <input 
              type="number" 
              class="stock-input" 
              id="qty_${stock.id}" 
              placeholder="Qté" 
              min="1"
              value="1"
              inputmode="numeric"
            >
            <button class="stock-btn buy" onclick="buyStock('${stock.id}')">Acheter</button>
            <button class="stock-btn sell" onclick="sellStock('${stock.id}')" ${!portfolio[stock.id] ? 'disabled' : ''}>
              Vendre
            </button>
          </div>
        `;

        container.appendChild(card);
        localStorage.setItem(`stock_old_price_${stock.id}`, price);
      });
    }

    async function buyStock(stockId) {
      const stock = stocks.find(s => s.id === stockId);
      const qty = parseInt(document.getElementById(`qty_${stockId}`).value) || 1;
      const price = currentPrices[stockId];
      const totalCost = price * qty;

      if (totalCost > cash) {
        alert('Liquidités insuffisantes');
        return;
      }

      console.log('📈 [ACHAT]', qty, 'x', stock.name, '@', price.toFixed(2) + '€');

      cash -= totalCost;

      if (!portfolio[stockId]) {
        portfolio[stockId] = { qty: 0, avgPrice: 0 };
      }

      const totalQty = portfolio[stockId].qty + qty;
      const totalValue = (portfolio[stockId].qty * portfolio[stockId].avgPrice) + totalCost;
      portfolio[stockId].avgPrice = totalValue / totalQty;
      portfolio[stockId].qty = totalQty;

      localStorage.setItem('stock_portfolio', JSON.stringify(portfolio));

      try {
        await supabaseClient
          .from('game_progress')
          .update({ money: cash })
          .eq('user_id', userId);

        document.getElementById('cash').textContent = cash.toLocaleString('fr-FR') + '€';
        renderStocks();
        updatePortfolio();

        alert(`✅ Achat confirmé\n${qty} × ${stock.name}\nPrix: ${price.toFixed(2)}€\nTotal: ${totalCost.toFixed(2)}€`);
      } catch (err) {
        console.error('❌ [BOURSE] Erreur:', err);
      }
    }

    async function sellStock(stockId) {
      const stock = stocks.find(s => s.id === stockId);
      const qty = parseInt(document.getElementById(`qty_${stockId}`).value) || 1;
      const price = currentPrices[stockId];

      if (!portfolio[stockId] || portfolio[stockId].qty < qty) {
        alert('Quantité insuffisante');
        return;
      }

      console.log('📉 [VENTE]', qty, 'x', stock.name, '@', price.toFixed(2) + '€');

      const totalValue = price * qty;
      cash += totalValue;

      const avgPrice = portfolio[stockId].avgPrice;
      const pnl = (price - avgPrice) * qty;

      portfolio[stockId].qty -= qty;
      if (portfolio[stockId].qty === 0) {
        delete portfolio[stockId];
      }

      localStorage.setItem('stock_portfolio', JSON.stringify(portfolio));

      try {
        await supabaseClient
          .from('game_progress')
          .update({ money: cash })
          .eq('user_id', userId);

        document.getElementById('cash').textContent = cash.toLocaleString('fr-FR') + '€';
        renderStocks();
        updatePortfolio();

        alert(`✅ Vente confirmée\n${qty} × ${stock.name}\nPrix: ${price.toFixed(2)}€\nTotal: ${totalValue.toFixed(2)}€\nP&L: ${pnl >= 0 ? '+' : ''}${pnl.toFixed(2)}€`);
      } catch (err) {
        console.error('❌ [BOURSE] Erreur:', err);
      }
    }

    function updatePortfolio() {
      const list = document.getElementById('portfolioList');
      let totalValue = 0;
      let totalInvested = 0;

      if (Object.keys(portfolio).length === 0) {
        list.innerHTML = '<div class="empty-portfolio">Aucune position</div>';
        document.getElementById('portfolioValue').textContent = '0€';
        document.getElementById('portfolioPnl').textContent = '0.00%';
        document.getElementById('portfolioPnl').style.color = '#64748b';
        return;
      }

      list.innerHTML = '';

      Object.keys(portfolio).forEach(stockId => {
        const stock = stocks.find(s => s.id === stockId);
        const holding = portfolio[stockId];
        const currentPrice = currentPrices[stockId];
        const currentValue = holding.qty * currentPrice;
        const investedValue = holding.qty * holding.avgPrice;
        const pnl = currentValue - investedValue;
        const pnlPercent = (pnl / investedValue) * 100;

        totalValue += currentValue;
        totalInvested += investedValue;

        const item = document.createElement('div');
        item.className = 'portfolio-item';
        item.innerHTML = `
          <div class="portfolio-left">
            <div class="portfolio-icon">${stock.icon}</div>
            <div class="portfolio-info">
              <div class="portfolio-name">${stock.name}</div>
              <div class="portfolio-qty">${holding.qty} × ${holding.avgPrice.toFixed(2)}€</div>
            </div>
          </div>
          <div class="portfolio-right">
            <div class="portfolio-value">${currentValue.toFixed(0)}€</div>
            <div class="portfolio-pnl ${pnl >= 0 ? 'positive' : 'negative'}">
              ${pnl >= 0 ? '+' : ''}${pnl.toFixed(2)}€ (${pnlPercent >= 0 ? '+' : ''}${pnlPercent.toFixed(2)}%)
            </div>
          </div>
        `;
        list.appendChild(item);
      });

      document.getElementById('portfolioValue').textContent = totalValue.toFixed(0) + '€';

      const totalPnlPercent = ((totalValue - totalInvested) / totalInvested) * 100;
      const pnlElement = document.getElementById('portfolioPnl');
      pnlElement.textContent = `${totalPnlPercent >= 0 ? '+' : ''}${totalPnlPercent.toFixed(2)}%`;
      pnlElement.style.color = totalPnlPercent >= 0 ? '#10b981' : '#ef4444';
    }

    function goBack() {
      window.location.href = 'jeux.html';
    }
  </script>
</body>
</html>
