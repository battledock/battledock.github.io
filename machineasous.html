<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Slots — Battle Dock Casino</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{height:100%;height:100dvh;overflow:hidden;font-family:'Inter',sans-serif}
body{
  background:radial-gradient(ellipse at top,#7f1d1d,#450a0a 60%,#1a0000);
  display:flex;flex-direction:column;
}

/* ══ HEADER ══ */
.hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top,44px) + 10px) 16px 10px;
  flex-shrink:0;
}
.btn-back{
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
  border-radius:20px;padding:7px 14px;
  font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;color:#fff;
  cursor:pointer;
}
.hdr-title{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#fbbf24;letter-spacing:3px}
.hdr-balance{
  background:rgba(0,0,0,.3);border:1px solid rgba(251,191,36,.3);
  border-radius:20px;padding:7px 14px;
  font-family:'Bebas Neue',sans-serif;font-size:15px;color:#fbbf24;
}

/* ══ MACHINE ══ */
.machine-wrap{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0 16px;gap:0;min-height:0;
}

.machine{
  background:linear-gradient(180deg,#1a0a00,#0f0500);
  border:4px solid #fbbf24;
  border-radius:24px;
  width:100%;max-width:400px;
  padding:20px 16px;
  box-shadow:0 0 40px rgba(251,191,36,.2),inset 0 0 20px rgba(0,0,0,.5);
  position:relative;overflow:hidden;
}
.machine::before{
  content:'🎰';position:absolute;right:-20px;top:50%;transform:translateY(-50%);
  font-size:120px;opacity:.04;pointer-events:none;
}

/* Titre machine */
.machine-title{
  text-align:center;margin-bottom:16px;
}
.machine-title-txt{
  font-family:'Bebas Neue',sans-serif;font-size:28px;color:#fbbf24;
  letter-spacing:4px;line-height:1;
  text-shadow:0 0 20px rgba(251,191,36,.5);
}
.machine-title-sub{font-size:9px;font-weight:800;color:rgba(255,255,255,.3);letter-spacing:3px;margin-top:2px}

/* Rouleaux */
.reels-container{
  display:flex;gap:10px;justify-content:center;margin-bottom:16px;
}
.reel{
  flex:1;max-width:100px;
  aspect-ratio:1;
  background:linear-gradient(135deg,#fff,#f3f3f3);
  border:3px solid #1a0a00;border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(44px,14vw,68px);
  box-shadow:inset 0 2px 8px rgba(0,0,0,.2),0 4px 12px rgba(0,0,0,.4);
  position:relative;overflow:hidden;transition:transform .1s;
}
.reel::after{
  content:'';position:absolute;top:0;left:0;right:0;height:30%;
  background:linear-gradient(180deg,rgba(255,255,255,.4),transparent);
  pointer-events:none;
}
.reel.spinning{animation:reelSpin .08s linear infinite}
@keyframes reelSpin{0%{transform:scaleY(1)}50%{transform:scaleY(.95)}100%{transform:scaleY(1)}}
.reel.win-flash{animation:winFlash .4s ease-in-out 3}
@keyframes winFlash{0%,100%{box-shadow:inset 0 2px 8px rgba(0,0,0,.2),0 4px 12px rgba(0,0,0,.4)}50%{box-shadow:inset 0 2px 8px rgba(0,0,0,.2),0 0 24px rgba(251,191,36,.8),0 0 40px rgba(251,191,36,.4)}}

/* Résultat */
.result{
  display:none;text-align:center;padding:12px 16px;border-radius:14px;
  font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;
  animation:resultPop .3s cubic-bezier(.34,1.56,.64,1);
  margin-bottom:16px;
}
@keyframes resultPop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
.result.win{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;box-shadow:0 4px 16px rgba(22,163,74,.4)}
.result.lose{background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.6)}

/* Tableau gains */
.paylines{
  background:rgba(0,0,0,.3);border:1px solid rgba(251,191,36,.15);
  border-radius:12px;padding:10px 12px;margin-bottom:16px;
}
.paylines-title{font-size:8px;font-weight:800;color:rgba(255,255,255,.3);letter-spacing:2px;text-align:center;margin-bottom:8px}
.paylines-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.payline{
  background:rgba(255,255,255,.05);border-radius:8px;
  padding:6px 4px;text-align:center;
}
.payline-syms{font-size:13px;line-height:1;margin-bottom:2px}
.payline-mult{font-family:'Bebas Neue',sans-serif;font-size:13px;color:#fbbf24;letter-spacing:.5px}

/* Mise */
.bet-row{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.bet-label{font-size:9px;font-weight:800;color:rgba(255,255,255,.4);letter-spacing:2px;white-space:nowrap}
.bet-chips{display:flex;gap:5px;flex:1;flex-wrap:wrap}
.chip{
  flex:1;min-width:44px;padding:8px 4px;text-align:center;
  background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);
  border-radius:20px;cursor:pointer;
  font-family:'Bebas Neue',sans-serif;font-size:12px;color:rgba(255,255,255,.5);
  transition:all .15s;
}
.chip.sel{background:rgba(251,191,36,.2);border-color:#fbbf24;color:#fbbf24;box-shadow:0 0 10px rgba(251,191,36,.2)}
.chip:active{transform:scale(.95)}

/* Bouton spin */
.spin-btn{
  width:100%;padding:16px;border:none;border-radius:16px;
  background:linear-gradient(135deg,#fbbf24,#f59e0b);
  color:#1a0a00;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px;
  cursor:pointer;box-shadow:0 6px 24px rgba(251,191,36,.4);
  transition:all .15s;font-weight:900;
}
.spin-btn:active{transform:scale(.98);opacity:.9}
.spin-btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}

/* Toast */
#toast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:9px 18px;border-radius:20px;font-size:12px;font-weight:800;z-index:400;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
</style>
</head>
<body>

<div id="toast"></div>

<!-- HEADER -->
<div class="hdr">
  <button class="btn-back" onclick="location.href='casino.html'">← CASINO</button>
  <div class="hdr-title">🎰 SLOTS</div>
  <div class="hdr-balance" id="balance">0€</div>
</div>

<!-- MACHINE -->
<div class="machine-wrap">
  <div class="machine">

    <div class="machine-title">
      <div class="machine-title-txt">MACHINE À SOUS</div>
      <div class="machine-title-sub">PORT DE MARSEILLE</div>
    </div>

    <!-- Rouleaux -->
    <div class="reels-container">
      <div class="reel" id="reel1">🍒</div>
      <div class="reel" id="reel2">🍋</div>
      <div class="reel" id="reel3">🍊</div>
    </div>

    <!-- Résultat -->
    <div class="result" id="result"></div>

    <!-- Tableau gains -->
    <div class="paylines">
      <div class="paylines-title">COMBINAISONS GAGNANTES</div>
      <div class="paylines-grid">
        <div class="payline"><div class="payline-syms">💎💎💎</div><div class="payline-mult">×15</div></div>
        <div class="payline"><div class="payline-syms">🍒🍒🍒</div><div class="payline-mult">×10</div></div>
        <div class="payline"><div class="payline-syms">🍋🍋🍋</div><div class="payline-mult">×8</div></div>
        <div class="payline"><div class="payline-syms">🍊🍊🍊</div><div class="payline-mult">×6</div></div>
        <div class="payline"><div class="payline-syms">🔔🔔🔔</div><div class="payline-mult">×5</div></div>
        <div class="payline"><div class="payline-syms">⭐⭐⭐</div><div class="payline-mult">×4</div></div>
      </div>
    </div>

    <!-- Mise -->
    <div class="bet-row">
      <div class="bet-label">MISE</div>
      <div class="bet-chips">
        <div class="chip" onclick="setBet(50)">50€</div>
        <div class="chip sel" onclick="setBet(100)">100€</div>
        <div class="chip" onclick="setBet(500)">500€</div>
        <div class="chip" onclick="setBet(1000)">1k€</div>
        <div class="chip" onclick="setBet(5000)">5k€</div>
      </div>
    </div>

    <!-- Spin -->
    <button class="spin-btn" id="spinBtn" onclick="spin()">TOURNER 🎰</button>

  </div>
</div>

<script>
var currentBet = 100;

function setBet(val){
  currentBet = val;
  document.querySelectorAll('.chip').forEach(function(c){
    c.classList.toggle('sel', parseInt(c.textContent)===val || c.textContent===(val/1000)+'k€');
  });
}

function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('on');
  setTimeout(function(){t.classList.remove('on');},2500);
}

    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const sb = createClient(supabaseUrl, supabaseKey);

    let currentUser = null;
    let currentMoney = 0;

    const symbols = ['🍒','🍒','🍒','🍋','🍋','🍋','🍊','🍊','🍊','🔔','🔔','⭐','💎'];
    const payouts = {
      '🍒🍒🍒': 10,
      '🍋🍋🍋': 8,
      '🍊🍊🍊': 6,
      '💎💎💎': 15,
      '⭐⭐⭐': 4,
      '🔔🔔🔔': 5
    };




    async function spin() {
      const bet = currentBet;
      const btn = document.getElementById('spinBtn');
      const res = document.getElementById('result');

      if (bet > currentMoney) { toast('Solde insuffisant'); return; }

      btn.disabled = true;
      res.style.display = 'none';

      // Déduire la mise
      await updateMoney(currentMoney - bet);
      await recordBet('Slots', bet);

      // Animation spinning
      const reels = [
        document.getElementById('reel1'),
        document.getElementById('reel2'),
        document.getElementById('reel3')
      ];

      reels.forEach(reel => reel.classList.add('spinning'));

      // Déterminer les résultats
      const results = [
        symbols[Math.floor(Math.random() * symbols.length)],
        symbols[Math.floor(Math.random() * symbols.length)],
        symbols[Math.floor(Math.random() * symbols.length)]
      ];

      // Arrêter les rouleaux un par un
      setTimeout(() => {
        reels[0].classList.remove('spinning');
        reels[0].textContent = results[0];
      }, 500);

      setTimeout(() => {
        reels[1].classList.remove('spinning');
        reels[1].textContent = results[1];
      }, 1000);

      setTimeout(async () => {
        reels[2].classList.remove('spinning');
        reels[2].textContent = results[2];

        // Vérifier gain
        const combo = results.join('');
        const mult = payouts[combo];

        if (mult) {
          const win = bet * mult;
          res.className = 'result win';
          res.innerHTML = `🎉 ${combo} ×${mult} = +${win.toLocaleString('fr-FR')}€ 💰`;
          await updateMoney(currentMoney + win);
        } else {
          res.className = 'result lose';
          res.innerHTML = `💔 ${combo} - Perdu ${bet.toLocaleString('fr-FR')}€`;
        }

        res.style.display = 'block';
        btn.disabled = false;
        if(mult){reels.forEach(function(r){r.classList.add('win-flash');setTimeout(function(){r.classList.remove('win-flash');},1300);});}
      }, 1500);
    }

    // Anti-zoom
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('gesturechange', e => e.preventDefault());


    async function loadMoney() {
      let retries = 3;
      while (retries > 0) {
        const { data: stats, error } = await sb
          .from('game_stats')
          .select('money')
          .eq('user_id', currentUser.id)
          .maybeSingle();
        if (error) { retries--; if (retries > 0) await new Promise(r => setTimeout(r, 500)); continue; }
        currentMoney = stats?.money || 0;
        const el = document.getElementById('balance');
        if (el) var fmt=function(n){return n>=1000000?(n/1000000).toFixed(1)+'M€':n>=1000?Math.floor(n/1000)+'k€':n.toLocaleString('fr-FR')+'€';}; el.textContent = fmt(currentMoney);
        return;
      }
    }

    async function updateMoney(newAmount) {
      const { error } = await sb.from('game_stats').update({ money: newAmount }).eq('user_id', currentUser.id);
      if (error) { console.error('updateMoney:', error.message); return; }
      currentMoney = newAmount;
      const el = document.getElementById('balance');
      if (el) var fmt=function(n){return n>=1000000?(n/1000000).toFixed(1)+'M€':n>=1000?Math.floor(n/1000)+'k€':n.toLocaleString('fr-FR')+'€';}; el.textContent = fmt(currentMoney);
    }


    // ── JACKPOT PROGRESSIF ──
    async function tryJackpot(betAmount) {
      if (Math.random() > 1/1000) return;
      try {
        const { data: profile } = await sb.from('profiles').select('username').eq('user_id', currentUser.id).maybeSingle();
        const username = profile?.username || 'Docker';
        const { data: amount } = await sb.rpc('claim_jackpot', { p_user_id: currentUser.id, p_username: username });
        if (amount > 0) {
          showJackpotWin(username, amount);
        }
      } catch(e) { console.log('jackpot error:', e); }
    }

    function showJackpotWin(username, amount) {
      const el = document.createElement('div');
      el.style.cssText = `position:fixed;inset:0;z-index:999;background:rgba(0,0,0,0.9);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;animation:fadeIn .3s ease`;
      el.innerHTML = `
        <div style="text-align:center;padding:40px 30px;max-width:320px">
          <div style="font-size:72px;margin-bottom:16px;animation:bounce 0.5s ease infinite alternate">🎯</div>
          <div style="font-family:'Bebas Neue',sans-serif;font-size:48px;letter-spacing:4px;background:linear-gradient(135deg,#fbbf24,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">JACKPOT !</div>
          <div style="font-family:'Bebas Neue',sans-serif;font-size:20px;color:white;letter-spacing:2px;margin:8px 0">${username}</div>
          <div style="font-family:'Bebas Neue',sans-serif;font-size:52px;color:#fbbf24;text-shadow:0 0 30px rgba(251,191,36,0.6);margin:8px 0">+${amount.toLocaleString('fr-FR')}€</div>
          <div style="font-size:13px;color:rgba(255,255,255,0.4);margin-top:8px">Le jackpot repart à 10 000€</div>
          <button onclick="this.parentNode.parentNode.remove()" style="margin-top:24px;background:linear-gradient(135deg,#fbbf24,#f59e0b);border:none;color:#1a0a00;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;padding:12px 32px;border-radius:12px;cursor:pointer">🎉 INCROYABLE !</button>
        </div>
        <style>@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-10px)}}@keyframes fadeIn{from{opacity:0}to{opacity:1}}</style>`;
      document.body.appendChild(el);
    }

    async function recordBet(gameName, amountBet) {
      try {
        const username = (currentUser.email || '').split('@')[0] || 'Docker';
        await sb.from('casino_wins').insert({
          user_id: currentUser.id, user_name: username,
          game_name: gameName, amount_bet: amountBet, amount_won: 0
        });
        const contrib = Math.max(1, Math.floor(amountBet * 0.05));
        try { const { error: jErr } = await sb.rpc('increment_jackpot', { amount: contrib }); if(jErr) console.log('jackpot error:', jErr); } catch(e) { console.log('jackpot:', e.message); }
      } catch(e) { console.log('recordBet:', e.message); }
    }

    async function recordWin(gameName, amountWon) {
      try {
        const username = (currentUser.email || '').split('@')[0] || 'Docker';
        await sb.from('casino_wins').insert({
          user_id: currentUser.id, user_name: username,
          game_name: gameName, amount_bet: 0, amount_won: amountWon
        });
      } catch(e) { console.log('recordWin:', e.message); }
    }

    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        await new Promise(r => setTimeout(r, 1000));
        const { data: { session: s2 } } = await sb.auth.getSession();
        if (!s2) { window.location.href = 'index.html'; return; }
        currentUser = s2.user;
      } else {
        currentUser = session.user;
      }
      await loadMoney();
    }

    init();
  
</script>
</body>
</html>
