<script>
/* LA VERSION, comme partout ailleurs : ajoutée au signet, une page reste en
   mémoire et ne se recharge jamais. On demande à chaque ouverture quelle est
   la version publiée, et on ne recharge qu'une fois par version.
   CE FICHIER ENTRE DANS LE RITUEL DE DÉPLOIEMENT : sa chaîne doit être
   remontée avec les autres, sinon il se recharge une fois pour rien à
   chaque mise à jour — c'est ce qui arrivait à forge.html et mine.html,
   restés en 2026-10-03-1818 pendant huit déploiements. LA LISTE COMPLÈTE,
   À REMONTER ENSEMBLE : version.json, maintenance.js (la chaîne ?v= dans
   ferme.html, foret.html, jeu.html, index.html et ici), puis les
   MA_VERSION de jeu.html, index.html, jeu_entree.html, complexe.html,
   forge.html et mine.html. Les autres pages n'en portent pas. */
(function(){
  var MA_VERSION='2026-10-12-2400';
  window.MA_VERSION=MA_VERSION;
  var cle='bdl.version.vue';
  function verifier(){
    fetch('version.json?t='+Date.now(),{cache:'no-store'})
      .then(function(r){return r.json();})
      .then(function(d){
        if(!d||!d.v||d.v===MA_VERSION)return;
        var deja=null;
        try{deja=sessionStorage.getItem(cle);}catch(e){}
        if(deja===d.v)return;
        try{sessionStorage.setItem(cle,d.v);}catch(e){}
        location.replace(location.pathname.split('?')[0]+'?v='+encodeURIComponent(d.v));
      })
      .catch(function(){});
  }
  verifier();
  var vu=Date.now();
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState!=='visible')return;
    if(Date.now()-vu>120000)verifier();
    vu=Date.now();
  });
})();

<body>
<canvas id="cv"></canvas>
<canvas id="joy"></canvas>
<!-- PAS DE TITRE EN SURIMPRESSION : il se posait pile sur l'enseigne,
     qui nomme deja le lieu bien mieux que lui. -->

<script>
/* =====================================================================
   LE HALL DU COMPLEXE FESTIF

   Pour l'instant, le lieu et rien que le lieu : on le regarde, on n'y
   marche pas encore. Les jeux, le personnage et les autres joueurs
   viendront se poser dedans — la salle est donc dessinée en coordonnees
   de salle, avec un tri en profondeur deja en place, pour qu'un corps
   puisse s'y glisser sans rien reecrire.

   TOUT EST GRAVE A UN PIXEL DE JEU PAR PIXEL DE TOILE, puis la toile est
   etiree a l'ecran. C'est ce qui donne au port son grain, et le hall doit
   appartenir au meme monde.
   ===================================================================== */
/* LA SALLE EST AUSSI HAUTE QUE L'ECRAN. Premier essai : une salle fixe de
   460 par 300, donc un paysage pose au milieu d'un telephone en portrait —
   deux grandes bandes noires au-dessus et au-dessous, et un hall timbre-
   poste. La largeur reste fixe, c'est elle qui donne l'echelle du pixel ;
   la hauteur se deduit de la forme de l'ecran. */
let SALLE_L=300;
let SALLE_H=560, MUR=190, CX=SALLE_L/2;
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
const toile=document.createElement('canvas');
let g=toile.getContext('2d');
const R=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)));};
const alea=(n)=>{const v=Math.sin(n*127.1)*43758.5453;return v-Math.floor(v);};

/* ---- la palette : bordeaux, or, marbre, velours ---- */
const C={
  mur:'#3a1014', murC:'#55181e', murO:'#240a0d',
  or:'#c9a24a', orC:'#f0d78a', orO:'#8a6a2a',
  marbre:'#e8e0cc', marbreS:'#cdc0a4', marbreV:'#cfc4a8',
  velours:'#8e1220', veloursC:'#b2243a', veloursO:'#5a0a14',
  bois:'#4a2d1c', boisC:'#6e4428',
  verre:'#2a3a44', lum:'#ffe9b0'
};
/* MUR : la ligne ou le mur du fond rencontre le sol. Elle est recalculee a
   chaque cadrage — un tiers de la hauteur, bornee, pour qu'il reste
   toujours du mur a regarder et du sol pour marcher. */

/* =====================================================================
   LE PERSONNAGE
   Il n'est plus dessine ici. Le hall portait une copie du dessin reprise
   de casino.html ; le jeu, lui, a refait son personnage depuis — meme
   sauvegarde, autre crayon, et l'on ne se reconnaissait pas en entrant.
   Le dessin vit maintenant dans personnage.js, charge par le jeu comme
   par le hall : une seule source, donc plus de derive possible.
   ===================================================================== */
const Perso=window.Perso;
const DEF_AP=Perso.DEF_AP;
/* L'APPARENCE VIENT DE LA SAUVEGARDE : c'est le personnage du joueur qui
   entre, pas un figurant. Si la sauvegarde manque, DEF_AP donne un
   habitant par defaut plutot qu'un vide. */
const CLE_SAUV='bdl.pix.v2';
let e={ap:Object.assign({},DEF_AP),pseudo:''};
try{const b=localStorage.getItem(CLE_SAUV);if(b)e=Object.assign(e,JSON.parse(b));}catch(x){}
if(!e.ap)e.ap=Object.assign({},DEF_AP);
let joyX=0, joyY=0;
/* LA PLACE DE DEPART EST POSEE AU PREMIER TOUR DE BOUCLE, pas ici : CX
   vaut encore 150 a cet instant, et cadrer() le recalcule ensuite selon
   la largeur de l'ecran. */
let joueur={x:0,y:0,dir:'haut',pas:0,marche:false};
let vx=0, vy=0, placeFaite=false;
const VITESSE=112;            /* celle du jeu, au pixel de monde pres */

/* ================= LE HALO D'UNE LUMIERE ================= */
function halo(x,y,r,force,col){
  const h=g.createRadialGradient(x,y,1,x,y,Math.max(2,r));
  h.addColorStop(0,'rgba('+(col||'255,226,160')+','+force+')');
  h.addColorStop(1,'rgba('+(col||'255,226,160')+',0)');
  g.fillStyle=h;g.beginPath();g.arc(x,y,Math.max(2,r),0,7);g.fill();
}

/* =====================================================================
   LA NEF
   Une salle vide ne tient pas par ce qu'on y pose : elle tient par son
   volume et par sa lumiere. Celle-ci est donc tout en hauteur — une
   charpente qu'on ne voit qu'en partie, des lanterneaux, et le jour qui
   en tombe jusqu'a la pierre. Le mur est nu de bout en bout : c'est
   justement ce qu'on ne pose pas dessus qui fait le vide.

   TOUT CE QUI NE BOUGE PAS EST CUIT UNE FOIS dans une toile de cote,
   grande comme la salle, et pose d'un seul trait a chaque image. Ne
   joue en direct que la poussiere dans les rais.
   ===================================================================== */
let NEF=null, NEF_CLE='';
function lanterneaux(){
  const P=[], pas=Math.max(52,Math.round(SALLE_L/9));
  for(let x=Math.round(pas/2);x<SALLE_L;x+=pas)P.push(x);
  return P;
}
function nefCuire(){
  const cle=SALLE_L+'/'+SALLE_H+'/'+MUR;
  if(NEF&&NEF_CLE===cle)return;
  const c=document.createElement('canvas');
  c.width=SALLE_L;c.height=SALLE_H;
  const gg=c.getContext('2d');gg.imageSmoothingEnabled=false;
  const gV=g;g=gg;
  try{nefGraver();}finally{g=gV;}
  NEF=c;NEF_CLE=cle;
}
function nefGraver(){
  /* LES MESURES SONT PRISES SUR LA HAUTEUR DU MUR : la salle garde ses
     proportions d'un telephone a l'autre. */
  const F=MUR/286;
  /* le mur, du sombre en haut au clair en bas : l'air d'un volume */
  for(let y=0;y<MUR;y++){
    const k=y/MUR;
    R(0,y,SALLE_L,1,'rgb('+Math.round(36+k*44)+','+Math.round(30+k*38)+','+Math.round(26+k*30)+')');
  }
  /* LA CHARPENTE. Des fermes de pierre de plus en plus serrees vers le
     haut : c'est ce resserrement qui donne la hauteur, pas leur nombre. */
  for(let k=0;k<5;k++){
    const y=(6+k*k*2.4+k*8)*F;
    R(0,y,SALLE_L,3*F,'rgba(22,18,20,.75)');
    R(0,y,SALLE_L,1,'rgba(150,140,130,.16)');
  }
  for(let x=-6;x<SALLE_L+20;x+=33){
    R(x,0,5,66*F,'rgba(26,22,24,.8)');
    R(x,0,1,66*F,'rgba(150,140,130,.12)');
  }
  /* LES LANTERNEAUX, et le jour qui en tombe. */
  const LAN=lanterneaux();
  LAN.forEach(cx=>{
    R(cx-16,54*F,32,12*F,'#20262c');
    R(cx-14,56*F,28,8*F,'#cfd8d8');
    R(cx-14,56*F,28,2,'#eef2ee');
    for(let k=-2;k<3;k++)R(cx+k*6,56*F,1,8*F,'rgba(60,66,66,.7)');
    R(cx-17,52*F,34,2,'rgba(170,160,150,.35)');
    halo(cx,66*F,54*F,0.30,'248,242,214');
    for(let y=66*F;y<MUR+74;y++){
      const t=(y-66*F)/(MUR+74-66*F);
      const demi=15+t*32;
      g.fillStyle='rgba(250,242,218,'+(0.085*(1-t*0.78)).toFixed(3)+')';
      g.fillRect(cx-demi,y,demi*2,1);
    }
  });
  /* LE MUR NU : des travees, une plinthe, une corniche. Rien d'autre. */
  for(let x=20;x<SALLE_L;x+=39){
    R(x-1,82*F,2,MUR-82*F,'rgba(0,0,0,.18)');
    R(x+1,82*F,1,MUR-82*F,'rgba(190,180,168,.06)');
  }
  R(0,78*F,SALLE_L,4*F,'rgba(18,15,17,.6)');
  R(0,78*F,SALLE_L,1,'rgba(176,166,152,.22)');
  R(0,MUR-16*F,SALLE_L,16*F,'rgba(16,13,15,.35)');
  R(0,MUR-17*F,SALLE_L,2,'rgba(176,166,152,.20)');
  /* LE SOL. Un marbre grand format : moins de joints, plus de salle. */
  R(0,MUR,SALLE_L,SALLE_H-MUR,'#8e8673');
  for(let y=MUR;y<SALLE_H;y++){
    const prof=(y-MUR)/(SALLE_H-MUR), h=9+prof*13, rang=Math.floor((y-MUR)/h);
    for(let x=-26;x<SALLE_L+26;x+=26){
      const d=x+((rang%2)?13:0);
      const q=Math.abs(((y-MUR)%h)/h-0.5)*2, l=Math.round(13*(1-q));
      if(l<1)continue;
      if(((rang+Math.floor(d/26))%2)===0)R(d+13-l,y,l*2,1,'#7e7765');
    }
  }
  for(let y=MUR;y<SALLE_H;y++){
    const prof=(y-MUR)/(SALLE_H-MUR);
    g.fillStyle='rgba(248,242,222,'+(0.12*(1-prof*0.8)).toFixed(3)+')';
    g.fillRect(0,y,SALLE_L,1);
  }
  R(0,MUR,SALLE_L,1,'rgba(14,11,13,.45)');
  /* LES FLAQUES DE JOUR SUR LA PIERRE. C'est par elles qu'une salle vide
     se remplit : sans elles, le sol n'est qu'un aplat, et la salle un
     fond d'ecran. */
  LAN.forEach(cx=>{
    for(let i=0;i<78;i++){
      const t=i/78, demi=20+t*46;
      g.fillStyle='rgba(252,248,226,'+(0.26*(1-t)*(1-t)).toFixed(3)+')';
      g.fillRect(cx-demi,MUR+i*1.6,demi*2,2);
    }
  });
}
/* la poussiere qui monte dans les rais : le seul mouvement de la salle */
function grains(T){
  const F=MUR/286;
  lanterneaux().forEach(cx=>{
    if(cx<camX-40||cx>camX+VUE_L+40)return;      /* hors du cadre, rien a faire */
    for(let i=0;i<22;i++){
      const x=cx-26+alea(i*1.3+cx)*52;
      const y=70*F+((alea(i*2.7+cx)*(MUR-70*F)+T/70+i*9)%(MUR-70*F));
      const a=0.08+0.14*Math.abs(Math.sin(T/900+i));
      R(x,y,1,1,'rgba(255,240,210,'+a.toFixed(2)+')');
    }
  });
}

/* ================= OU L'ON MARCHE =================
   UNE GRANDE SALLE VIDE, et rien d'autre. La salle des jeux, ses trois
   tables, la boule et son tapis ont ete retires : on repart d'un volume
   nu, qu'on remplira quand on saura de quoi. Ce qui reste, c'est
   l'architecture — les murs, le sol, la lumiere. Un lieu, pas un menu.

   LA SALLE EST PLUS GRANDE QUE L'ECRAN. Elle tenait exactement dedans,
   donc elle ne pouvait pas etre grande : on la voyait toute d'un coup et
   marcher n'y servait a rien. Elle fait maintenant ses propres mesures,
   et la camera suit le marcheur. */
let camX=0, camY=0;

function bloque(x,y){
  if(x<BORD||x>SALLE_L-BORD)return true;
  if(y<MUR+10)return true;                          /* le mur du fond */
  if(y>SALLE_H-6)return true;
  return false;
}
/* LA CAMERA se cale sur le marcheur, bornee aux murs, et rattrape en
   douceur : un cadrage colle au pixel pres fait trembler toute la salle
   a chaque pas. */
function majCam(dt){
  const cx=Math.max(0,Math.min(SALLE_L-VUE_L,joueur.x-VUE_L/2));
  const cy=Math.max(0,Math.min(SALLE_H-VUE_H,joueur.y-VUE_H*0.60));
  const k=1-Math.exp(-7*dt);
  camX+=(cx-camX)*k;camY+=(cy-camY)*k;
  if(Math.abs(cx-camX)>VUE_L*0.6)camX=cx;
  if(Math.abs(cy-camY)>VUE_H*0.6)camY=cy;
}

/* LA SORTIE : on redescend le tapis et l'on s'en va. Pas de bouton a
   viser — on marche vers le bas, comme on est entre. Le bouton reste
   quand meme, pour qui prefere appuyer. */
let sortie=false, fondu=0;
function sortir(){
  if(sortie)return;
  sortie=true;fondu=0.001;
}
function majJoueur(dt){
  /* ON ENTRE EN BAS DU TAPIS, mais pas colle au bord : pose a 30 du bas,
     le personnage etait a demi cache par la barre d'action, et deux pas
     vers le bas suffisaient a ressortir sans l'avoir voulu. */
  if(!placeFaite){joueur.x=CX;joueur.y=SALLE_H-64;placeFaite=true;
    camX=Math.max(0,Math.min(SALLE_L-VUE_L,joueur.x-VUE_L/2));
    camY=Math.max(0,Math.min(SALLE_H-VUE_H,joueur.y-VUE_H*0.56));}
  if(sortie){
    fondu=Math.min(1,fondu+dt*2.6);
    if(fondu>=1)location.href='jeu.html?v='+(window.MA_VERSION||Date.now());
    return;
  }
  const n=Math.hypot(joyX,joyY), pousse=Math.min(1,n);
  const cx2=n>0.16?(joyX/n)*VITESSE*pousse:0;
  const cy2=n>0.16?(joyY/n)*VITESSE*pousse:0;
  const k=Math.min(1,dt*(n>0.16?11:16));
  vx+=(cx2-vx)*k;vy+=(cy2-vy)*k;
  const v=Math.hypot(vx,vy);
  if(v>1.2){
    const nx=joueur.x+vx*dt, ny=joueur.y+vy*dt;
    let ax=joueur.x, ay=joueur.y;
    /* ON ESSAIE LES DEUX AXES SEPAREMENT : sans cela, longer un mur en
       biais bloque net au lieu de glisser le long. */
    if(!bloque(nx,joueur.y))ax=nx;
    if(!bloque(ax,ny))ay=ny;
    joueur.x=ax;joueur.y=ay;
    joueur.pas+=v*dt*0.2538;    /* la cadence du jeu : 0,55*24/(4*13) */
    if(Math.abs(vx)>Math.abs(vy)*1.35)joueur.dir=vx>0?'droite':'gauche';
    else if(Math.abs(vy)>Math.abs(vx)*1.35)joueur.dir=vy>0?'bas':'haut';
  }else{vx=vy=0;joueur.pas=0;}
  joueur.marche=v>4;
  majCam(dt);
  /* LE BAS DE LA SALLE : on redescend sur le quai. */
  if(joueur.y>SALLE_H-12&&Math.abs(joueur.x-CX)<80)sortir();
}
function dessinerJoueur(){
  const x=Math.round(joueur.x), y=Math.round(joueur.y);
  /* L'OMBRE AU SOL, et rien de plus : le hall n'a pas de soleil, ses
     lustres sont au-dessus de la tete. Un reflet dans le marbre serait
     juste, mais a cette echelle il brouille la silhouette. */
  g.fillStyle='rgba(30,16,20,.30)';
  g.beginPath();g.ellipse(x,y+1,6,2.2,0,0,7);g.fill();
  g.imageSmoothingEnabled=false;
  Perso.sprite(g,x,y,e.ap,joueur.dir,joueur.pas,!!joueur.marche);
}


/* ================= LA SALLE =================
   La toile cuite, le marcheur par-dessus, la poussiere, et c'est tout.
   Il n'y a rien d'autre dans cette salle, et c'est voulu : on verra
   plus tard ce qu'on y met. */
function dessiner(T){
  nefCuire();
  g.save();
  g.translate(-Math.round(camX),-Math.round(camY));
  g.drawImage(NEF,0,0);
  dessinerJoueur();
  grains(T);
  g.restore();
  /* LE VIGNETTAGE SE POSE SUR L'ECRAN, pas sur la salle : accroche a la
     salle, il suivait la camera et le coin sombre se promenait. */
  const v=g.createRadialGradient(VUE_L/2,VUE_H*0.45,60,VUE_L/2,VUE_H*0.45,VUE_H*0.95);
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(6,5,4,.58)');
  g.fillStyle=v;g.fillRect(0,0,VUE_L,VUE_H);
  if(fondu>0){g.fillStyle='rgba(10,9,7,'+Math.min(1,fondu).toFixed(3)+')';
    g.fillRect(0,0,VUE_L,VUE_H);}
}


/* ================= LE JOYSTICK =================
   Repris de casino.html, avec une difference : la ou le casino avait
   renonce a la marche (zoneMarche rendait toujours faux), le hall prend
   le doigt partout sauf sur la barre du bas. */
const jc=document.getElementById('joy'), jg=jc.getContext('2d');
let JDPR=1;
function tailleJoy(){
  JDPR=Math.max(1,Math.min(2,window.devicePixelRatio||1));
  jc.width=Math.round(innerWidth*JDPR);jc.height=Math.round(innerHeight*JDPR);
  jg.setTransform(JDPR,0,0,JDPR,0,0);
}
addEventListener('resize',tailleJoy);tailleJoy();
const RAYON=52, POUCE=22;
let J={actif:false,id:null,ox:0,oy:0,x:0,y:0,vie:0};
function prendre(x,y){
  const limite=innerHeight-86;
  if(y>limite)y=limite;
  J.actif=true;J.ox=x;J.oy=y;J.x=x;J.y=y;J.vie=1;joyX=joyY=0;
  try{navigator.vibrate&&navigator.vibrate(8);}catch(x2){}
}
function tirer(x,y){
  const dx=x-J.ox, dy=y-J.oy, d=Math.hypot(dx,dy), a=Math.atan2(dy,dx);
  const m=Math.min(d,RAYON);
  J.x=J.ox+Math.cos(a)*m;J.y=J.oy+Math.sin(a)*m;
  if(d>RAYON){J.ox=x-Math.cos(a)*RAYON;J.oy=y-Math.sin(a)*RAYON;}
  const n=Math.min(1,d/RAYON);
  joyX=d<1?0:Math.cos(a)*n;joyY=d<1?0:Math.sin(a)*n;
  if(Math.hypot(joyX,joyY)<.16)joyX=joyY=0;
}
function lacher(){J.actif=false;J.id=null;joyX=joyY=0;}
const surUnBouton=(c)=>!!(c&&c.closest&&c.closest('button,#bas'));
document.addEventListener('touchstart',ev=>{
  for(const t of ev.changedTouches){
    if(J.actif||surUnBouton(ev.target))continue;
    ev.preventDefault();J.id=t.identifier;prendre(t.clientX,t.clientY);
  }
},{passive:false});
document.addEventListener('touchmove',ev=>{
  for(const t of ev.changedTouches)if(t.identifier===J.id){
    ev.preventDefault();tirer(t.clientX,t.clientY);}
},{passive:false});
['touchend','touchcancel'].forEach(k=>document.addEventListener(k,ev=>{
  for(const t of ev.changedTouches)if(t.identifier===J.id){ev.preventDefault();lacher();}
},{passive:false}));
document.addEventListener('mousedown',ev=>{if(!surUnBouton(ev.target))prendre(ev.clientX,ev.clientY);});
addEventListener('mousemove',ev=>{if(J.actif)tirer(ev.clientX,ev.clientY);});
addEventListener('mouseup',()=>{if(J.actif)lacher();});
addEventListener('keydown',ev=>{const k={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],
  ArrowRight:[1,0],z:[0,-1],s:[0,1],q:[-1,0],d:[1,0]}[ev.key];if(k){joyX=k[0];joyY=k[1];}});
addEventListener('keyup',()=>{joyX=joyY=0;});
function dessinerJoy(dt){
  if(!J.actif&&J.vie>0)J.vie=Math.max(0,J.vie-dt*5);
  jg.clearRect(0,0,innerWidth,innerHeight);
  if(J.vie<=0)return;
  jg.save();jg.globalAlpha=J.vie;
  jg.beginPath();jg.arc(J.ox,J.oy,RAYON,0,7);
  const f=jg.createRadialGradient(J.ox,J.oy-14,6,J.ox,J.oy,RAYON);
  f.addColorStop(0,'rgba(246,239,220,.24)');f.addColorStop(1,'rgba(201,162,74,.12)');
  jg.fillStyle=f;jg.fill();
  jg.lineWidth=2.5;jg.strokeStyle='rgba(240,215,138,.38)';jg.stroke();
  const d=Math.hypot(J.x-J.ox,J.y-J.oy);
  if(d>6){const a=Math.atan2(J.y-J.oy,J.x-J.ox);
    jg.beginPath();jg.arc(J.ox,J.oy,RAYON-2,a-0.5,a+0.5);
    jg.lineWidth=4;jg.strokeStyle='rgba(240,215,138,.55)';jg.stroke();}
  jg.beginPath();jg.arc(J.x,J.y+3,POUCE,0,7);jg.fillStyle='rgba(10,6,8,.22)';jg.fill();
  const k=jg.createRadialGradient(J.x-5,J.y-8,3,J.x,J.y,POUCE+1);
  if(d>6){k.addColorStop(0,'#f0d78a');k.addColorStop(1,'#8a6a2a');}
  else{k.addColorStop(0,'#f6efdc');k.addColorStop(1,'#c9bda2');}
  jg.beginPath();jg.arc(J.x,J.y,POUCE,0,7);jg.fillStyle=k;jg.fill();
  jg.lineWidth=2.5;jg.strokeStyle=d>6?'#5a4418':'rgba(50,40,30,.4)';jg.stroke();
  jg.restore();
}

/* ================= L'ECRAN =================
   La toile est etiree au plus grand multiple ENTIER qui tient : c'est ce
   qui garde les pixels carres. Au besoin on complete avec un demi-pas,
   mais jamais en dessous de 1. */
function cadrer(){
  const w=innerWidth, h=innerHeight, dpr=Math.min(3,window.devicePixelRatio||1);
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  /* L'ECHELLE EST ENTIERE, tiree de la largeur : chaque pixel de la salle
     occupe un nombre rond de pixels d'ecran, et les dorures ne bavent pas.
     La hauteur de la salle se deduit ensuite de ce qu'il reste — c'est
     elle qui s'adapte a l'ecran, jamais le pixel. */
  /* On ARRONDIT au lieu de tronquer, et c'est la salle qui s'ajuste :
     tronquer donnait 2 au lieu de 2,6 sur un telephone, soit 600 pixels de
     salle sur 780 d'ecran et deux bandes noires sur les cotes. */
  /* L'ECHELLE EST CELLE DU JEU. Le hall etait grave a trois cents
     pixels de large, le jeu a cent quatre-vingt-seize : le meme
     personnage y paraissait deux tiers de sa taille, et l'on changeait
     de monde en passant la porte. On reprend donc la mesure du jeu —
     meme pixel, meme corps, meme pas. */
  ECH=Math.max(1,Math.round(Math.max(cv.width/196,cv.height/400)));
  /* LA VUE, c'est ce que l'ecran montre. LA SALLE, c'est ce qu'il y a.
     Les deux se confondaient, et c'est pour cela que la salle ne pouvait
     pas etre grande. */
  VUE_L=Math.ceil(cv.width/ECH);
  VUE_H=Math.ceil(cv.height/ECH);
  /* ELLE EST LARGE, PAS HAUTE. A une fois et demie la hauteur de l'ecran,
     le mur du fond sortait du cadre des qu'on s'en eloignait : on ne voyait
     plus qu'un marbre sans horizon, et une salle sans horizon n'est pas une
     salle, c'est un papier peint. On garde donc le fond presque toujours en
     vue, et c'est en largeur qu'on marche. */
  SALLE_L=Math.round(VUE_L*2.8);
  /* LA HAUTEUR RESTE CELLE DE L'ECRAN. Huit pour cent de plus suffisaient
     a faire sortir l'enseigne par le haut des qu'on descendait : on lisait
     « FESTIF » au lieu du nom du lieu. La salle est large, pas haute —
     c'est en largeur qu'on marche, et le fond ne bouge jamais. */
  SALLE_H=VUE_H;
  /* LA LIGNE DU SOL EST HAUTE. A un tiers de l'ecran, les deux tiers du
     cadre etaient du dallage et la salle n'avait pas de volume : c'est
     le mur qui fait la hauteur, pas le sol. Aux deux tiers, on marche
     dans une bande etroite au pied d'un grand mur — et c'est ce qu'on
     veut voir. */
  MUR=Math.max(170,Math.min(330,Math.round(VUE_H*0.66)));
  CX=SALLE_L/2;
  toile.width=VUE_L;toile.height=VUE_H;
  g.imageSmoothingEnabled=false;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.imageSmoothingEnabled=false;
}
let ECH=1, VUE_L=300, VUE_H=600;
const BORD=16;
addEventListener('resize',cadrer);cadrer();

let tPrec=0;
(function boucle(t){
  /* LE PAS DE TEMPS EST BORNE A 50 ms : revenir sur l'onglet apres une
     minute donnerait un seul bond de soixante secondes, et le joueur
     traverserait les murs d'un coup. */
  const dt=Math.min(.05,(t-tPrec)/1000);tPrec=t;
  majJoueur(dt);
  dessiner(t);
  dessinerJoy(dt);
  ctx.fillStyle='#0b0608';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(toile,0,0,VUE_L*ECH,VUE_H*ECH);
  requestAnimationFrame(boucle);
})(0);

document.getElementById('quai').onclick=sortir;
