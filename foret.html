<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Battle Dock · la forêt</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;background:#151a12;font-family:Georgia,serif;overflow:hidden;
  touch-action:none;overscroll-behavior:none}
#att{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding:22px;text-align:center;color:#c8bca0}
#att b{display:block;font:900 19px Georgia,serif;color:#e8c46a;margin-bottom:6px}
#att i{display:block;font:italic 13px Georgia,serif;line-height:1.6}
#att a{display:inline-block;margin-top:16px;color:#151a12;background:#e8c46a;text-decoration:none;
  border-radius:9px;padding:12px 20px;font:700 10px Arial,sans-serif;letter-spacing:2px}
#cv{display:block;position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated}
#hud{position:fixed;left:10px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:3;
  background:rgba(20,26,18,.82);border:1px solid #3a4a34;border-radius:9px;padding:8px 11px;
  color:#c8bca0;font:400 11.5px Georgia,serif;line-height:1.55;pointer-events:none}
#hud b{color:#e8c46a}
#act{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:4;
  border:0;border-radius:12px;padding:14px;background:rgba(20,26,18,.92);border:1px solid #c9a24a;
  color:#e8c46a;font:700 15px Georgia,serif;text-align:center}
#act small{display:block;font:700 8px Arial,sans-serif;letter-spacing:2px;color:#9a8a68;margin-top:3px}
</style></head><body>
<div id="att"><div><b>La forêt est fermée</b>
<i>Elle est en travaux. Elle rouvrira dans la nuit<br>de ce samedi 3 octobre.</i>
<a href="jeu.html">RETOURNER AU PORT</a></div></div>
<script>
/* ================= LA FORÊT, PAGE BLANCHE =================
   La carte fait 1500 sur 1000. Rien dessus pour l'instant : seulement
   le cadre, la grille de repère, et la caméra qui suit le doigt. */
const MONDE_L=1500, MONDE_H=1000;
const ELIAS='e029d1fb-7baa-4225-91fd-5cdbef6f8711';
(function(){
  let moi=null;
  try{moi=(JSON.parse(localStorage.getItem('bdl.pix.v2')||'{}')||{}).id||null;}catch(e){}
  if(moi!==ELIAS)return;                  /* les autres voient l'écriteau */
  document.getElementById('att').remove();

  /* ================= LE SOL =================
     Le tapis dense : la terre disparaît sous les feuilles mortes.
     Il est gravé une fois pour toutes dans une image de la taille de la
     carte, écrite directement en pixels pour que ce soit instantané. */
  const hs=n=>{const v=Math.sin(n*12.9898)*43758.5453;return v-Math.floor(v);};
  let SOL=null;
  function graverLeSol(){
    const c=document.createElement('canvas');c.width=MONDE_L;c.height=MONDE_H;
    const s=c.getContext('2d');s.imageSmoothingEnabled=false;
    /* la terre, en trois tons, écrite pixel par pixel sur une image réduite */
    const LW=Math.ceil(MONDE_L/2), LH=Math.ceil(MONDE_H/2);
    const pt=document.createElement('canvas');pt.width=LW;pt.height=LH;
    const pg=pt.getContext('2d');
    const img=pg.createImageData(LW,LH), px=new Uint32Array(img.data.buffer);
    const ent=(h)=>{const n=parseInt(h.slice(1),16);
      return (255<<24)|((n&255)<<16)|(((n>>8)&255)<<8)|((n>>16)&255);};
    const A=ent('#5a4428'), B=ent('#4a3820'), C=ent('#3d2e1a');
    for(let y=0;y<LH;y++){const ligne=y*LW;
      for(let x=0;x<LW;x++){
        const n=hs(x*0.42+y*0.26);
        px[ligne+x]=n<.36?A:(n<.70?B:C);}}
    pg.putImageData(img,0,0);
    s.drawImage(pt,0,0,LW,LH,0,0,LW*2,LH*2);
    /* le lac, avant les feuilles : elles ne tombent pas dans l'eau */
    graverLeLac(s);
    /* les feuilles mortes, posées à plat : nervure et reflet */
    const T=['#c9821a','#b4552a','#8a3a22','#d8a83a','#9a6a2a'];
    const nb=Math.round(MONDE_L*MONDE_H/40);   /* la même densité que l'aperçu */
    for(let k=0;k<nb;k++){
      const x=Math.floor(hs(k*1.37)*MONDE_L), y=Math.floor(hs(k*2.71)*MONDE_H);
      if(y>rive(x)-4)continue;                 /* pas de feuilles sur l'eau */
      const col=T[Math.floor(hs(k*3.11)*T.length)];
      const l=3+Math.floor(hs(k*4.3)*3), h=2+Math.floor(hs(k*5.7)*2);
      s.fillStyle=col;s.fillRect(x,y,l,h);
      s.fillStyle='rgba(255,255,255,.17)';s.fillRect(x,y,l,1);
      s.fillStyle='rgba(90,60,20,.34)';s.fillRect(x+Math.floor(l*0.45),y,1,h);
    }
    SOL=c;
  }

  /* ================= LE LAC =================
     Les trois cents points du bas. Eau profonde : bleu nuit au large,
     vert sombre près du bord, avec quelques roseaux plantés sur la rive. */
  const LAC_Y=MONDE_H-300;                 /* la hauteur moyenne de la rive */
  const rive=(x)=>LAC_Y+Math.sin(x*0.0075)*26+Math.sin(x*0.021+2)*11+Math.sin(x*0.052)*5;
  const dansLeLac=(x,y)=>y>rive(x);
  function graverLeLac(s){
    for(let x=0;x<MONDE_L;x++){
      const r=Math.round(rive(x));
      /* la berge de terre, juste avant l'eau */
      s.fillStyle='#6a5434';s.fillRect(x,r-5,1,5);
      s.fillStyle='#7a6240';s.fillRect(x,r-5,1,1);
      for(let y=r;y<MONDE_H;y++){
        const p=(y-r)/Math.max(1,MONDE_H-r);
        s.fillStyle=p<0.14?'#3f6a5a':(p<0.40?'#2a5260':(p<0.72?'#1d3f52':'#142c3e'));
        s.fillRect(x,y,1,1);}}
    /* les rides de lumière à la surface */
    for(let k=0;k<620;k++){
      const x=hs(k*3.1)*MONDE_L, r=rive(x);
      const y=r+8+hs(k*7.3)*(MONDE_H-r-14);
      s.fillStyle='rgba(150,200,220,.16)';
      s.fillRect(Math.round(x),Math.round(y),6+Math.round(hs(k)*7),1);}
    /* les touffes d'herbe du bord */
    for(let k=0;k<220;k++){
      const x=Math.round(hs(k*9.1)*MONDE_L), r=Math.round(rive(x));
      s.fillStyle='#4f7a3a';s.fillRect(x,r-1,5,2);
      s.fillStyle='#3f6a30';s.fillRect(x+1,r-3,3,2);}
  }

  /* ================= LA LISIÈRE =================
     Reprise à l'identique de l'ancienne carte : une bande de buissons
     sombres tout autour, puis la palissade de bois. */
  const LIS_PROF=30;                 /* profondeur du massif de buissons */
  const BARRIERE=44;                 /* la ligne de la palissade */
  const BOIS={sombre:'#5b3f26',bas:'#6b4a2a',moyen:'#7d5833',clair:'#96693c',haut:'#ab7a49'};
  function segmentPalissade(){
    const c=document.createElement('canvas');c.width=20;c.height=34;
    const g2=c.getContext('2d');g2.imageSmoothingEnabled=false;
    const R=(x,y,w,h,col)=>{g2.fillStyle=col;g2.fillRect(x|0,y|0,Math.max(1,w|0),Math.max(1,h|0));};
    const sol=31;
    R(0,sol,20,3,'rgba(30,44,22,.34)');                 /* l'ombre portée */
    R(0,sol-4,20,4,BOIS.sombre);                        /* le pied dans la terre */
    for(let i=0;i<20;i+=3){
      const h=18+((i*7)%3), t=(i/3)%3;
      R(i,sol-h,3,h,t===0?BOIS.moyen:(t===1?BOIS.bas:BOIS.clair));
      R(i,sol-h,1,h,BOIS.haut);                         /* la lumière sur la planche */
      R(i,sol-h-2,3,2,t===1?BOIS.clair:BOIS.moyen);     /* la pointe */
      R(i+2,sol-h+2,1,h-2,BOIS.sombre);                 /* l'ombre entre deux planches */
    }
    R(0,sol-14,20,3,BOIS.bas);                          /* les deux traverses */
    R(0,sol-14,20,1,BOIS.clair);
    R(0,sol-6,20,2,BOIS.sombre);
    return c;
  }
  function segmentProfil(){
    const c=document.createElement('canvas');c.width=12;c.height=20;
    const g2=c.getContext('2d');g2.imageSmoothingEnabled=false;
    const R=(x,y,w,h,col)=>{g2.fillStyle=col;g2.fillRect(x|0,y|0,Math.max(1,w|0),Math.max(1,h|0));};
    R(1,0,9,20,BOIS.moyen);R(1,0,1,20,BOIS.haut);R(9,0,1,20,BOIS.sombre);
    R(10,0,2,20,'rgba(30,44,22,.30)');
    for(let y=0;y<20;y+=3)R(1,y,9,1,BOIS.bas);          /* le haut des planches */
    return c;
  }
  let LISIERE=null;
  function construireLisiere(){
    const c=document.createElement('canvas');c.width=MONDE_L;c.height=MONDE_H;
    const g2=c.getContext('2d');g2.imageSmoothingEnabled=false;
    const bande=(x0,y0,x1,y1,graine)=>{
      for(let i=0;i<520;i++){
        const x=Math.round(x0+hs(i*1.3+graine)*(x1-x0));
        const y=Math.round(y0+hs(i*2.7+graine)*(y1-y0));
        const t=hs(i*3.9+graine);
        g2.fillStyle=t<.34?'#25542a':(t<.68?'#2f6b34':'#1e4522');
        g2.fillRect(x-13,y-10,26,20);
        g2.fillStyle=t<.5?'#3d7d3f':'#2f6b34';g2.fillRect(x-9,y-16,18,7);
        g2.fillStyle='#4a944a';g2.fillRect(x-5,y-19,10,4);
        g2.fillStyle='#1a3d1e';g2.fillRect(x-13,y+6,26,4);
      }};
/* LE LAC FERME LE SUD : pas de bande ni de palissade derrière lui,
   et les côtés s'arrêtent à la rive. */
    const basTerre=Math.round(rive(0));
    bande(-6,-6,MONDE_L+6,LIS_PROF,0);                        /* nord */
    bande(-6,-6,LIS_PROF,basTerre,77);                        /* ouest, jusqu'à l'eau */
    bande(MONDE_L-LIS_PROF,-6,MONDE_L+6,Math.round(rive(MONDE_L)),131);   /* est */
    const S=segmentPalissade(), P=segmentProfil();
    for(let x=0;x<MONDE_L;x+=20)g2.drawImage(S,x,BARRIERE-31,20,34);      /* nord */
    for(let y=0;y<MONDE_H;y+=20){
      if(y<rive(BARRIERE)-20)g2.drawImage(P,BARRIERE-9,y,12,20);          /* ouest */
      if(y<rive(MONDE_L-BARRIERE)-20)g2.drawImage(P,MONDE_L-BARRIERE-3,y,12,20);  /* est */
    }
    LISIERE=c;
  }

  /* ================= LA STATION DE MÉTRO =================
     Le quai de bois, au centre exact de la carte. Le M, son mât et
     l'escalier sont alignés sur le même axe ; les deux lanternes sont
     à la même hauteur, à égale distance des bords. */
  const METRO={x:MONDE_L/2, y:MONDE_H/2};
  let STATION=null;
  function graverStation(){
    const LW=110, LH=90;
    const c=document.createElement('canvas');c.width=LW;c.height=LH;
    const g2=c.getContext('2d');g2.imageSmoothingEnabled=false;
    const R=(x,y,w,h,col)=>{if(w<=0||h<=0)return;g2.fillStyle=col;
      g2.fillRect(Math.round(x),Math.round(y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)));};
    const cx=LW/2, sol=LH-6;
    const lettreM=(x,y,t,col)=>{const e=Math.max(1,t/5);
      R(x,y,e,t,col);R(x+t-e,y,e,t,col);
      for(let i=0;i<=t/2;i++){R(x+i*0.6,y+i,e,e,col);R(x+t-e-i*0.6,y+i,e,e,col);}};
    const lanterne=(x,y)=>{
      R(x,y,2,9,'#4a4a52');                      /* la potence */
      R(x-4,y+8,10,2,'#2a2f34');                 /* le chapeau */
      R(x-3,y+9,8,9,'#3a3f46');                  /* le boîtier */
      R(x-2,y+10,6,7,'#ffd96a');R(x-2,y+10,6,2,'#fff2b8');
      R(x,y+18,2,14,'#6b4a2a');                  /* le poteau jusqu'au plancher */
      for(let a=0;a<6.283;a+=0.4)R(x+1+Math.cos(a)*8,y+13+Math.sin(a)*8,2,2,'rgba(255,214,110,.13)');};
    const escalier=(x,y,w,n)=>{
      R(x-2,y-2,w+4,4,'#8a8a92');
      R(x,y,w,n*2.6+4,'#1a1f24');
      for(let k=0;k<n;k++){R(x+2,y+2+k*2.6,w-4,1.8,'#39424a');R(x+2,y+2+k*2.6,w-4,0.7,'#5a666e');}};
    R(cx-48,sol+1,96,4,'rgba(24,34,20,.26)');    /* l'ombre portée */
    /* le plancher */
    R(cx-46,sol-20,92,22,'#6b4a2a');
    for(let x=cx-46;x<cx+46;x+=6){
      R(x,sol-20,5,22,hs(x)<0.5?'#7d5833':'#6b4a2a');
      R(x,sol-20,5,1,'#96693c');}
    R(cx-46,sol+2,92,3,'#4a3218');
    escalier(cx-12,sol-18,24,6);                 /* l'escalier, au centre */
    /* la rampe */
    [cx-48,cx+44].forEach(x=>{R(x,sol-40,4,20,'#7d5833');R(x,sol-40,1.4,20,'#ab7a49');});
    R(cx-48,sol-42,96,3,'#7d5833');R(cx-48,sol-42,96,1,'#ab7a49');
    for(let x=cx-44;x<cx+44;x+=9)R(x,sol-40,2.4,18,'#6b4a2a');
    /* le banc */
    R(cx+22,sol-32,16,4,'#8a6238');R(cx+22,sol-32,16,1.4,'#a5764a');
    R(cx+24,sol-28,2,8,'#6b4a2a');R(cx+34,sol-28,2,8,'#6b4a2a');
    /* les deux lanternes, à la même hauteur */
    lanterne(cx-40,sol-58);lanterne(cx+38,sol-58);
    /* le panneau, dans l'axe */
    R(cx-1,sol-44,3,22,'#8a939a');
    R(cx-11,sol-62,23,18,'#17365a');R(cx-10,sol-61,21,16,'#1d5090');
    lettreM(cx-6,sol-58,12,'#f4f8fc');
    STATION={toile:c, W:LW, H:LH, sol:sol};
  }

  /* ================= LES ROSEAUX =================
     Le sprite de l'ancienne forêt, celui qu'on peut cueillir : trois tailles,
     un pied dans l'eau et une touffe de tiges avec ses épis bruns. */
  const P_ROS={tige:'#5e8a47',tigeC:'#7db35d',tigeO:'#48703a',epi:'#8a6238',epiC:'#a5764a'};
  const T_ROSEAUX=[{n:4,h:20,epis:0},{n:6,h:28,epis:3},{n:8,h:36,epis:5}];
  let ROSEAUX_GRAVES=null;
  function graverRoseaux(){
    ROSEAUX_GRAVES=T_ROSEAUX.map((E,v)=>{
      const W2=30, HC2=E.h+12;
      const c=document.createElement('canvas');c.width=W2;c.height=HC2;
      const g2=c.getContext('2d');g2.imageSmoothingEnabled=false;
      const R=(x,y,w,h,col)=>{g2.fillStyle=col;g2.fillRect(x|0,y|0,Math.max(1,w|0),Math.max(1,h|0));};
      const cx2=W2/2, sol2=HC2-2;
      g2.fillStyle='rgba(24,34,20,.24)';
      g2.beginPath();g2.ellipse(cx2+1,sol2-2,11,3,0,0,7);g2.fill();
      for(let i=0;i<E.n;i++){
        const dx=Math.round((i-(E.n-1)/2)*(22/E.n));
        const h=Math.round(E.h*(0.74+hs(i*3.1+v)*0.3));
        R(cx2+dx,sol2-h,2,h,P_ROS.tige);
        R(cx2+dx,sol2-h,1,Math.round(h*0.6),P_ROS.tigeC);
        R(cx2+dx,sol2-4,2,4,P_ROS.tigeO);}
      for(let i=0;i<E.epis;i++){
        const dx=Math.round((i-(E.epis-1)/2)*6);
        const h=Math.round(E.h*(0.86+hs(i*7.3+v)*0.22));
        R(cx2+dx-1,sol2-h-6,4,7,P_ROS.epi);
        R(cx2+dx-1,sol2-h-6,4,2,P_ROS.epiC);
        R(cx2+dx,sol2-h-7,2,1,P_ROS.epiC);}
      return {c,W:W2,HC:HC2};});
  }
  /* on les sème sur la rive, par paquets, et on les garde en objets */
  const DECOR=[];
  function semerLesRoseaux(){
    for(let k=0;k<160;k++){
      if(hs(k*5.7)<0.42)continue;                   /* ils viennent par paquets */
      const x=Math.round(hs(k*2.9+5)*(MONDE_L-120))+60;
      const r=Math.round(rive(x));
      const n=1+Math.floor(hs(k*3.3)*3);
      for(let i=0;i<n;i++){
        const dx=x+Math.round((hs(k*7+i)-0.5)*34);
        const dy=r+2+Math.round(hs(k*11+i)*7);
        if(dx<40||dx>MONDE_L-40)continue;
        DECOR.push({t:'roseaux',x:dx,y:dy,gr:Math.floor(hs(k*13+i)*3)});}}
    DECOR.sort((a,b)=>a.y-b.y);
  }

  /* ================= LE JOUEUR =================
     Un petit personnage qu'on déplace au doigt. La caméra le suit,
     il ne traverse ni l'eau, ni la palissade, ni le massif de buissons. */
  const joueur={x:MONDE_L/2, y:MONDE_H/2+40, dir:'bas', pas:0, marche:false};
  function dessinerJoueur(g2,x,y){
    const R=(a,b,w,h,c)=>{g2.fillStyle=c;g2.fillRect(Math.round(x+a),Math.round(y+b),
      Math.max(1,Math.round(w)),Math.max(1,Math.round(h)));};
    const bal=joueur.marche?Math.sin(joueur.pas)*1.2:0;
    g2.fillStyle='rgba(24,34,20,.26)';
    g2.beginPath();g2.ellipse(x,y,7,3,0,0,7);g2.fill();
    /* les jambes */
    R(-4,-9,3,9,'#3a4250');R(1,-9,3,9,'#3a4250');
    R(-4,-1+bal,3,2,'#e4d7c0');R(1,-1-bal,3,2,'#e4d7c0');
    /* le corps */
    R(-5,-19,10,11,'#b4442a');R(-5,-19,10,3,'#cf5a3a');
    R(-5,-13,10,2,'#f2ece0');                  /* la bande claire */
    /* les bras */
    R(-7,-18,2,8,'#b4442a');R(5,-18,2,8,'#b4442a');
    R(-7,-11,2,2,'#e0b48a');R(5,-11,2,2,'#e0b48a');
    /* la tête */
    R(-4,-28,8,9,'#e0b48a');
    R(-4,-29,8,4,'#7a5434');                   /* les cheveux */
    R(-5,-28,1,5,'#7a5434');R(4,-28,1,5,'#7a5434');
    if(joueur.dir!=='haut'){R(-2,-25,1,1,'#2a2018');R(2,-25,1,1,'#2a2018');}
  }
  /* ce qui bloque : l'eau, la palissade, le massif */
  function bloque(x,y){
    if(y>rive(x)-3)return true;                        /* le lac */
    if(y<BARRIERE+8)return true;                       /* la palissade nord */
    if(x<BARRIERE+6&&y<rive(BARRIERE)-20)return true;  /* l'ouest */
    if(x>MONDE_L-BARRIERE-6&&y<rive(MONDE_L-BARRIERE)-20)return true;
    if(x<12||x>MONDE_L-12)return true;
    return false;
  }

  const cv=document.createElement('canvas');cv.id='cv';document.body.appendChild(cv);
  const hud=document.createElement('div');hud.id='hud';document.body.appendChild(hud);
  const act=document.createElement('button');act.id='act';
  act.innerHTML='Prendre le métro<small>LIGNE 1 · PORT · FERME</small>';
  act.style.display='none';document.body.appendChild(act);
  act.onclick=()=>{location.href='jeu.html';};
  const g=cv.getContext('2d');
  let VW=0,VH=0,ECH=3;
  /* la caméra, au centre de la carte au départ */
  let camX=MONDE_L/2, camY=MONDE_H/2;

  function taille(){
    const dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
    /* une échelle ronde : chaque point du dessin occupe un nombre entier de pixels */
    ECH=Math.max(2,Math.round(Math.min(innerWidth/190,innerHeight/400)*dpr));
    const e=ECH/dpr;
    VW=Math.ceil(innerWidth/e)+1;VH=Math.ceil(innerHeight/e)+1;
    cv.width=Math.round(VW*ECH);cv.height=Math.round(VH*ECH);
    cv.style.width=(VW*e)+'px';cv.style.height=(VH*e)+'px';
    g.setTransform(ECH,0,0,ECH,0,0);g.imageSmoothingEnabled=false;
  }
  addEventListener('resize',taille);

  function dessiner(){
    const x0=Math.round(camX-VW/2), y0=Math.round(camY-VH/2);
    /* le vide autour de la carte */
    g.fillStyle='#0e1310';g.fillRect(0,0,VW,VH);
    /* le sol, puis la lisière par-dessus */
    if(!SOL)graverLeSol();
    g.drawImage(SOL,-x0,-y0);
    if(!LISIERE)construireLisiere();
    g.drawImage(LISIERE,-x0,-y0);
    /* la station et les roseaux, dans l'ordre de profondeur */
    if(!STATION)graverStation();
    if(!ROSEAUX_GRAVES)graverRoseaux();
    if(!DECOR.length)semerLesRoseaux();
    const pose=[];
    pose.push({y:METRO.y, f:()=>g.drawImage(STATION.toile,
      Math.round(METRO.x-STATION.W/2-x0), Math.round(METRO.y-STATION.sol-y0))});
    for(const o of DECOR){
      if(o.y<y0-60||o.y>y0+VH+60||o.x<x0-40||o.x>x0+VW+40)continue;
      const A=ROSEAUX_GRAVES[Math.min(2,o.gr||0)];
      pose.push({y:o.y, f:()=>g.drawImage(A.c,
        Math.round(o.x-A.W/2-x0), Math.round(o.y-A.HC+4-y0))});}
    pose.push({y:joueur.y, f:()=>dessinerJoueur(g,joueur.x-x0,joueur.y-y0)});
    pose.sort((a,b)=>a.y-b.y);
    pose.forEach(p=>p.f());
    /* le cadre */
    g.fillStyle='#e8c46a';
    g.fillRect(-x0,-y0,MONDE_L,1);g.fillRect(-x0,MONDE_H-1-y0,MONDE_L,1);
    g.fillRect(-x0,-y0,1,MONDE_H);g.fillRect(MONDE_L-1-x0,-y0,1,MONDE_H);
    hud.innerHTML='carte <b>'+MONDE_L+' × '+MONDE_H+'</b><br>'+
      'vue <b>'+VW+' × '+VH+'</b> points<br>'+
      'caméra <b>'+Math.round(camX)+' , '+Math.round(camY)+'</b><br>'+
      'toi <b>'+Math.round(joueur.x)+' , '+Math.round(joueur.y)+'</b>';
    const pres=Math.hypot(joueur.x-METRO.x,joueur.y-METRO.y)<42;
    act.style.display=pres?'block':'none';
  }

  /* ================= LE MANCHE =================
     On pose le doigt n'importe où : le point d'appui devient le centre,
     et l'écart donne la direction et la vitesse. */
  let manche=null;
  cv.addEventListener('pointerdown',(ev)=>{manche={x0:ev.clientX,y0:ev.clientY,dx:0,dy:0};
    cv.setPointerCapture(ev.pointerId);});
  cv.addEventListener('pointermove',(ev)=>{
    if(!manche)return;
    manche.dx=ev.clientX-manche.x0;manche.dy=ev.clientY-manche.y0;});
  const lache=()=>{manche=null;joueur.marche=false;};
  cv.addEventListener('pointerup',lache);cv.addEventListener('pointercancel',lache);

  /* ================= LA BOUCLE =================  */
  let dernier=0;
  function boucle(t){
    requestAnimationFrame(boucle);
    const dt=Math.min(0.05,(t-dernier)/1000||0);dernier=t;
    if(manche){
      const d=Math.hypot(manche.dx,manche.dy);
      if(d>8){
        const v=Math.min(1,(d-8)/42)*74;            /* la vitesse, en points par seconde */
        const ux=manche.dx/d, uy=manche.dy/d;
        const nx=joueur.x+ux*v*dt, ny=joueur.y+uy*v*dt;
        if(!bloque(nx,joueur.y))joueur.x=nx;
        if(!bloque(joueur.x,ny))joueur.y=ny;
        joueur.marche=true;joueur.pas+=dt*11;
        joueur.dir=Math.abs(ux)>Math.abs(uy)?(ux<0?'gauche':'droite'):(uy<0?'haut':'bas');
      }else joueur.marche=false;
    }
    /* la caméra suit, en douceur, et reste dans la carte */
    const cible=[joueur.x,joueur.y];
    camX+=(cible[0]-camX)*Math.min(1,dt*7);
    camY+=(cible[1]-camY)*Math.min(1,dt*7);
    camX=Math.max(VW/2,Math.min(MONDE_L-VW/2,camX));
    camY=Math.max(VH/2,Math.min(MONDE_H-VH/2,camY));
    dessiner();
  }

  window.__VOIR=(x,y)=>{joueur.x=x;joueur.y=y;camX=x;camY=y;dessiner();return [x,y];};
  window.__ETAT=()=>({joueur:[Math.round(joueur.x),Math.round(joueur.y)],
    metro:[METRO.x,METRO.y],
    distance:Math.round(Math.hypot(joueur.x-METRO.x,joueur.y-METRO.y)),
    roseaux:DECOR.length,
    bouton:getComputedStyle(act).display});
  taille();requestAnimationFrame(boucle);
})();
</script></body></html>
