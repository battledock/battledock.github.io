<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Battle Dock · la forêt</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#151a12;font-family:Georgia,serif;overflow:hidden}
#att{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding:22px;text-align:center;color:#c8bca0}
#att b{display:block;font:900 19px Georgia,serif;color:#e8c46a;margin-bottom:6px}
#att i{display:block;font:italic 13px Georgia,serif;line-height:1.6}
#att a{display:inline-block;margin-top:16px;color:#151a12;background:#e8c46a;text-decoration:none;
  border-radius:9px;padding:12px 20px;font:700 10px Arial,sans-serif;letter-spacing:2px}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
</style></head><body>
<div id="att"><div><b>La forêt est fermée</b>
<i>Elle est en travaux. Elle rouvrira dans la nuit<br>de ce samedi 3 octobre.</i>
<a href="jeu.html">RETOURNER AU PORT</a></div></div>
<script>
/* ================= LA FORÊT, PAGE BLANCHE =================
   Tout a été retiré. Seul Elias peut entrer, le temps de la rebâtir. */
const ELIAS='e029d1fb-7baa-4225-91fd-5cdbef6f8711';
(function(){
  let moi=null;
  try{moi=(JSON.parse(localStorage.getItem('bdl.pix.v2')||'{}')||{}).id||null;}catch(e){}
  if(moi!==ELIAS)return;                  /* les autres voient l'écriteau */
  document.getElementById('att').remove();
  const cv=document.createElement('canvas');document.body.appendChild(cv);
  const g=cv.getContext('2d');
  function taille(){
    const d=Math.min(2,window.devicePixelRatio||1);
    cv.width=Math.round(innerWidth*d);cv.height=Math.round(innerHeight*d);
    g.setTransform(d,0,0,d,0,0);g.imageSmoothingEnabled=false;dessiner();}
  function dessiner(){
    g.fillStyle='#151a12';g.fillRect(0,0,innerWidth,innerHeight);
    g.fillStyle='#3a4a34';g.font='italic 13px Georgia,serif';g.textAlign='center';
    g.fillText('la forêt — page blanche',innerWidth/2,innerHeight/2);
  }
  addEventListener('resize',taille);taille();
})();
</script></body></html>
