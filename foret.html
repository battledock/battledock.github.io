<!doctype html><html lang="fr"><head>
<script>
/* LE FACTEUR : il empêche Chrome de servir une vieille version du jeu. */
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Battle Dock · La forêt</title>
<style>
html,body{height:100%;margin:0;background:#1b2417;color:#e8e0c8;font-family:Georgia,serif;
  display:flex;align-items:center;justify-content:center}
div{text-align:center}
small{display:block;font:700 9px Arial;letter-spacing:3px;color:#8fae72}
b{display:block;font:400 26px Georgia;margin-top:6px}
i{display:block;font:italic 13px Georgia;color:#9db287;margin-top:10px}
</style></head><body>
<div><small>BATTLE DOCK</small><b>La forêt</b><i>On pousse la barrière…</i></div>
<script>
/* LA FORÊT A SON ADRESSE : battledock.fr/foret.html
   Elle ouvre le jeu directement sur sa carte, sans passer par le port. */
(function(){
  var p=new URLSearchParams(location.search);
  p.set('carte','foret');
  if(!p.get('v'))p.set('v',Date.now());
  location.replace('jeu.html?'+p.toString());
})();
</script></body></html>
