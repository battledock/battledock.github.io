<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Battle Dock · la forêt</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;background:#151a12;font-family:Georgia,serif;overflow:hidden;
  touch-action:none;overscroll-behavior:none}
#att{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding:22px;text-align:center;color:#c8bca0}
#att b{display:block;font:900 19px Georgia,serif;color:#e8c46a;margin-bottom:6px}
#att i{display:block;font:italic 13px Georgia,serif;line-height:1.6}
#att a{display:inline-block;margin-top:16px;color:#151a12;background:#e8c46a;text-decoration:none;
  border-radius:9px;padding:12px 20px;font:700 10px Arial,sans-serif;letter-spacing:2px}
#cv{display:block;position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated}
#hud{position:fixed;left:10px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:3;
  background:rgba(20,26,18,.82);border:1px solid #3a4a34;border-radius:9px;padding:8px 11px;
  color:#c8bca0;font:400 11.5px Georgia,serif;line-height:1.55;pointer-events:none}
#hud b{color:#e8c46a}
</style></head><body>
<div id="att"><div><b>La forêt est fermée</b>
<i>Elle est en travaux. Elle rouvrira dans la nuit<br>de ce samedi 3 octobre.</i>
<a href="jeu.html">RETOURNER AU PORT</a></div></div>
<script>
/* ================= LA FORÊT, PAGE BLANCHE =================
   La carte fait 1500 sur 1000. Rien dessus pour l'instant : seulement
   le cadre, la grille de repère, et la caméra qui suit le doigt. */
const MONDE_L=1500, MONDE_H=1000;
const ELIAS='e029d1fb-7baa-4225-91fd-5cdbef6f8711';
(function(){
  let moi=null;
  try{moi=(JSON.parse(localStorage.getItem('bdl.pix.v2')||'{}')||{}).id||null;}catch(e){}
  if(moi!==ELIAS)return;                  /* les autres voient l'écriteau */
  document.getElementById('att').remove();

  const cv=document.createElement('canvas');cv.id='cv';document.body.appendChild(cv);
  const hud=document.createElement('div');hud.id='hud';document.body.appendChild(hud);
  const g=cv.getContext('2d');
  let VW=0,VH=0,ECH=3;
  /* la caméra, au centre de la carte au départ */
  let camX=MONDE_L/2, camY=MONDE_H/2;

  function taille(){
    const dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
    /* une échelle ronde : chaque point du dessin occupe un nombre entier de pixels */
    ECH=Math.max(2,Math.round(Math.min(innerWidth/190,innerHeight/400)*dpr));
    const e=ECH/dpr;
    VW=Math.ceil(innerWidth/e)+1;VH=Math.ceil(innerHeight/e)+1;
    cv.width=Math.round(VW*ECH);cv.height=Math.round(VH*ECH);
    cv.style.width=(VW*e)+'px';cv.style.height=(VH*e)+'px';
    g.setTransform(ECH,0,0,ECH,0,0);g.imageSmoothingEnabled=false;
  }
  addEventListener('resize',taille);

  function dessiner(){
    const x0=Math.round(camX-VW/2), y0=Math.round(camY-VH/2);
    /* le vide autour de la carte */
    g.fillStyle='#0e1310';g.fillRect(0,0,VW,VH);
    /* la carte elle-même */
    g.fillStyle='#1b241a';
    g.fillRect(-x0,-y0,MONDE_L,MONDE_H);
    /* la grille de repère : un trait tous les cent points, marqué tous les cinq cents */
    for(let x=0;x<=MONDE_L;x+=100){
      g.fillStyle=(x%500===0)?'#40583c':'#27331f';
      g.fillRect(x-x0,-y0,1,MONDE_H);}
    for(let y=0;y<=MONDE_H;y+=100){
      g.fillStyle=(y%500===0)?'#40583c':'#27331f';
      g.fillRect(-x0,y-y0,MONDE_L,1);}
    /* le cadre */
    g.fillStyle='#e8c46a';
    g.fillRect(-x0,-y0,MONDE_L,1);g.fillRect(-x0,MONDE_H-1-y0,MONDE_L,1);
    g.fillRect(-x0,-y0,1,MONDE_H);g.fillRect(MONDE_L-1-x0,-y0,1,MONDE_H);
    /* le centre */
    g.fillStyle='#8a6a28';
    g.fillRect(MONDE_L/2-x0-6,MONDE_H/2-y0,13,1);
    g.fillRect(MONDE_L/2-x0,MONDE_H/2-y0-6,1,13);
    hud.innerHTML='carte <b>'+MONDE_L+' × '+MONDE_H+'</b><br>'+
      'vue <b>'+VW+' × '+VH+'</b> points<br>'+
      'caméra <b>'+Math.round(camX)+' , '+Math.round(camY)+'</b>';
  }

  /* le doigt fait glisser la carte */
  let prise=null;
  cv.addEventListener('pointerdown',(ev)=>{prise={x:ev.clientX,y:ev.clientY,cx:camX,cy:camY};
    cv.setPointerCapture(ev.pointerId);});
  cv.addEventListener('pointermove',(ev)=>{
    if(!prise)return;
    const dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
    const e=ECH/dpr;
    camX=prise.cx-(ev.clientX-prise.x)/e;
    camY=prise.cy-(ev.clientY-prise.y)/e;
    camX=Math.max(0,Math.min(MONDE_L,camX));
    camY=Math.max(0,Math.min(MONDE_H,camY));
    dessiner();});
  const lache=()=>{prise=null;};
  cv.addEventListener('pointerup',lache);cv.addEventListener('pointercancel',lache);

  taille();dessiner();
})();
</script></body></html>
