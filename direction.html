<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Direction — Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none}
body{font-family:'Inter',sans-serif;background:#f2f2f7;min-height:100vh;padding-bottom:32px}
.hdr{background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,0,0,.07);padding:calc(14px + env(safe-area-inset-top,44px)) 16px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.hdr-back{width:34px;height:34px;border-radius:8px;background:rgba(204,26,26,.08);display:flex;align-items:center;justify-content:center;font-size:16px;color:#cc1a1a;font-weight:800;cursor:pointer;border:none}
.hdr-title{font-family:'Bebas Neue',sans-serif;font-size:18px;color:#0f172a;letter-spacing:1.5px;flex:1}
.hdr-money{font-family:'Bebas Neue',sans-serif;font-size:13px;color:#16a34a}
.pad{padding:16px}
/* Hero card */
.hero{background:#111118;border-radius:16px;padding:24px;margin-bottom:12px;position:relative;overflow:hidden;text-align:center}
.hero::before{content:'';position:absolute;top:-40px;right:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(251,191,36,.08),transparent)}
.hero-emoji{font-size:48px;margin-bottom:8px}
.hero-label{font-size:8px;font-weight:800;color:rgba(255,255,255,.25);letter-spacing:3px;margin-bottom:4px}
.hero-amount{font-family:'Bebas Neue',sans-serif;font-size:56px;background:linear-gradient(135deg,#fbbf24,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
.hero-sub{font-size:10px;color:rgba(255,255,255,.3);margin-top:6px;font-weight:700}
/* Status */
.status-card{background:#fff;border-radius:14px;overflow:hidden;margin-bottom:12px}
.status-row{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid #f3f4f6}
.status-row:last-child{border:none}
.status-lbl{font-size:11px;color:#9ca3af;font-weight:700}
.status-val{font-family:'Bebas Neue',sans-serif;font-size:16px;color:#0f172a;letter-spacing:.5px}
/* Claim button */
.btn-claim{width:100%;padding:16px;border:none;border-radius:14px;background:#cc1a1a;font-family:'Bebas Neue',sans-serif;font-size:18px;color:#fff;letter-spacing:2px;cursor:pointer;margin-bottom:8px;position:relative;overflow:hidden}
.btn-claim::after{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent);animation:btnShine 3s ease infinite}
@keyframes btnShine{0%{transform:translateX(-100%) rotate(25deg)}100%{transform:translateX(300%) rotate(25deg)}}
.btn-claim:disabled{background:#e5e7eb;color:#9ca3af;cursor:not-allowed}
.btn-claim:disabled::after{display:none}
.btn-back{width:100%;padding:13px;border:none;border-radius:14px;background:transparent;font-size:12px;font-weight:700;color:#9ca3af;cursor:pointer}
/* History */
.hist-title{font-size:8px;font-weight:800;color:#9ca3af;letter-spacing:3px;padding:8px 0 10px}
.hist-card{background:#fff;border-radius:14px;overflow:hidden;margin-bottom:12px}
.hist-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #f3f4f6}
.hist-row:last-child{border:none}
.hist-day{font-size:11px;color:#9ca3af;font-weight:700}
.hist-amount{font-family:'Bebas Neue',sans-serif;font-size:15px;color:#16a34a}
/* Toast */
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,20px)+10px);left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:12px;font-size:12px;font-weight:700;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="hdr">
  <button class="hdr-back" onclick="location.href='game.html'">←</button>
  <div class="hdr-title">👔 DIRECTION</div>
  <div class="hdr-money" id="hdrMoney">— €</div>
</div>

<div class="pad">

  <!-- Hero : salaire du jour -->
  <div class="hero">
    <div class="hero-emoji">💼</div>
    <div class="hero-label">SALAIRE DU JOUR</div>
    <div class="hero-amount" id="salaryAmount">—</div>
    <div class="hero-sub" id="salaryDesc">Calcul en cours...</div>
  </div>

  <!-- Statuts -->
  <div class="status-card">
    <div class="status-row">
      <div class="status-lbl">Poste</div>
      <div class="status-val" id="statPoste">—</div>
    </div>
    <div class="status-row">
      <div class="status-lbl">Niveau</div>
      <div class="status-val" id="statLevel">—</div>
    </div>
    <div class="status-row">
      <div class="status-lbl">Total perçu</div>
      <div class="status-val" id="statTotal">—</div>
    </div>
    <div class="status-row">
      <div class="status-lbl">Jours consécutifs</div>
      <div class="status-val" id="statDays">—</div>
    </div>
  </div>

  <!-- Bouton -->
  <button class="btn-claim" id="btnClaim" onclick="claimSalary()" disabled>CHARGER...</button>
  <button class="btn-back" onclick="location.href='game.html'">← Retour au port</button>

  <!-- Historique -->
  <div class="hist-title">HISTORIQUE</div>
  <div class="hist-card" id="histCard">
    <div style="padding:20px;text-align:center;color:#9ca3af;font-size:11px">Aucun historique</div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
var SB_URL='https://drtsuhnbclhmgfjiykap.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
var sb=supabase.createClient(SB_URL,SB_KEY);
var currentUser=null,playerLevel=1,playerMoney=0,dirData={};

function fm(n){if(n>=1e6)return(n/1e6).toFixed(1)+'M€';if(n>=1e3)return Math.floor(n/1e3)+'k€';return n+'€';}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2500);}

function getSalary(lvl){
  // 500€ × niveau, bonus tous les 5 niveaux
  var base=lvl*500;
  var bonus=Math.floor(lvl/5)*1000;
  return base+bonus;
}

function getPoste(lvl){
  if(lvl>=50)return'PDG';
  if(lvl>=30)return'Directeur Général';
  if(lvl>=20)return'Directeur de Zone';
  if(lvl>=10)return'Chef de Service';
  if(lvl>=5)return'Responsable';
  return'Employé Cadre';
}

function todayStr(){
  var d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function render(){
  var salary=getSalary(playerLevel);
  var today=todayStr();
  var alreadyClaimed=dirData.lastSalaryDay===today;
  var days=dirData.days||0;

  document.getElementById('salaryAmount').textContent=fm(salary);
  document.getElementById('salaryDesc').textContent='Niveau '+playerLevel+' · '+getPoste(playerLevel);
  document.getElementById('statPoste').textContent=getPoste(playerLevel);
  document.getElementById('statLevel').textContent='NV. '+playerLevel;
  document.getElementById('statTotal').textContent=fm(dirData.totalClaimed||0);
  document.getElementById('statDays').textContent=(days||0)+' jour'+(days>1?'s':'');
  document.getElementById('hdrMoney').textContent=fm(playerMoney);

  var btn=document.getElementById('btnClaim');
  if(alreadyClaimed){
    btn.textContent='DÉJÀ RÉCUPÉRÉ AUJOURD\'HUI';
    btn.disabled=true;
  } else {
    btn.textContent='RÉCUPÉRER '+fm(salary);
    btn.disabled=false;
  }

  // Historique
  var hist=dirData.history||[];
  if(hist.length===0){
    document.getElementById('histCard').innerHTML='<div style="padding:20px;text-align:center;color:#9ca3af;font-size:11px">Aucun historique</div>';
  } else {
    var html='';
    hist.slice().reverse().slice(0,10).forEach(function(h){
      html+='<div class="hist-row"><div class="hist-day">'+h.date+'</div><div class="hist-amount">+'+fm(h.amount)+'</div></div>';
    });
    document.getElementById('histCard').innerHTML=html;
  }
}

async function claimSalary(){
  var salary=getSalary(playerLevel);
  var today=todayStr();
  if(dirData.lastSalaryDay===today)return toast('Déjà récupéré aujourd\'hui !');

  // Update
  var newMoney=playerMoney+salary;
  var newDays=(dirData.days||0)+1;
  var newTotal=(dirData.totalClaimed||0)+salary;
  var hist=dirData.history||[];
  hist.push({date:today,amount:salary});
  if(hist.length>30)hist=hist.slice(-30);

  dirData={lastSalaryDay:today,days:newDays,totalClaimed:newTotal,history:hist};

  var {data:gs}=await sb.from('game_stats').select('records').eq('user_id',currentUser.id).maybeSingle();
  var rec=(gs&&gs.records)||{};

  await sb.from('game_stats').update({
    money:newMoney,
    direction:dirData,
    records:rec
  }).eq('user_id',currentUser.id);

  playerMoney=newMoney;
  toast('💼 +'+fm(salary)+' perçu !');
  render();
}

(async function(){
  var r=await sb.auth.getSession();var s=r.data&&r.data.session;
  if(!s){location.href='index.html';return;}
  currentUser=s.user;

  var {data:gs}=await sb.from('game_stats').select('level,money,direction').eq('user_id',currentUser.id).maybeSingle();
  if(!gs){location.href='game.html';return;}

  playerLevel=gs.level||1;
  playerMoney=gs.money||0;
  dirData=gs.direction||{};

  render();
})();
</script>
</body>
</html>
