<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Mon Profil — Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bangers&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  font-family:'Inter',sans-serif;
  background:#f3f4f6;
  min-height:100vh;
  -webkit-user-select:none;user-select:none;
}

:root{
  --ink:#1a1a1a;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

/* ── SKELETON ── */
@keyframes skShimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.sk{border-radius:8px;background:linear-gradient(90deg,#e8e0cc 25%,#f0ead8 50%,#e8e0cc 75%);background-size:200% 100%;animation:skShimmer 1.4s ease-in-out infinite;}



/* ── PAGE CONTENT ── */
.page-content{
  padding-top:14px;
  padding-bottom:calc(20px + var(--safe-bottom));
  min-height:100vh;
}


/* AVATAR SELECTOR */
.section{background:#fff;border-radius:16px;margin:0 12px 12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.section-title{font-size:7px;font-weight:800;color:#9ca3af;letter-spacing:2.5px;padding:14px 14px 8px;text-align:center}
@keyframes skShimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.av-big-sk{width:90px;height:90px;border-radius:50%;background:linear-gradient(90deg,#e5e7eb 25%,#f3f4f6 50%,#e5e7eb 75%);background-size:200% 100%;animation:skShimmer 1.4s ease-in-out infinite;display:block}
@keyframes avGlow{0%,100%{box-shadow:0 0 0 0 rgba(0,0,0,.2)}50%{box-shadow:0 0 0 8px rgba(0,0,0,.06)}}
.av-main{display:flex;flex-direction:column;align-items:center;padding:0 14px 14px}
.av-big{width:90px;height:90px;border-radius:50%;border:3px solid #1a1a1a;overflow:hidden;background:#f5f5f5;animation:avGlow 2.5s ease-in-out infinite}
.av-big img{width:100%;height:100%;object-fit:contain}
.av-big-name{font-family:'Bebas Neue',sans-serif;font-size:16px;color:#1a1a1a;letter-spacing:1px;margin-top:8px}
.av-big-sub{font-size:8px;font-weight:700;color:#6b7280;margin-top:2px}
.av-scroll{display:flex;gap:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:10px 14px 14px}
.av-scroll::-webkit-scrollbar{display:none}
.av-thumb{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.av-thumb-ring{width:52px;height:52px;border-radius:50%;border:2.5px solid #e5e7eb;overflow:hidden;background:#f5f5f5;transition:border-color .15s}
.av-thumb-ring img{width:100%;height:100%;object-fit:contain}
.av-thumb-ring.active{border-color:#1a1a1a;box-shadow:0 0 0 3px rgba(0,0,0,.1)}
.av-thumb-ring.locked{filter:grayscale(1);opacity:.3}
.av-thumb-lbl{font-size:7px;font-weight:800;color:#9ca3af}
.av-thumb-lbl.active{color:#1a1a1a}



/* BANNIÈRE */
.banner{width:100%;height:120px;position:relative;overflow:hidden;flex-shrink:0}
.banner-bg{position:absolute;inset:0;background:linear-gradient(120deg,#000,#1a1a2e)}
.banner-av{position:absolute;bottom:0;right:16px;height:100px;width:100px;object-fit:contain}
.banner-info{position:absolute;bottom:14px;left:16px}
.banner-name{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#fff;letter-spacing:2px;line-height:1;text-shadow:0 2px 8px rgba(0,0,0,.2)}
.banner-grade{font-size:8px;font-weight:800;color:rgba(255,255,255,.55);letter-spacing:2px;margin-top:3px}

</style>
</head>
<body>

<div class="banner" id="bannerEl">
  <div class="banner-bg" id="bannerBg"></div>
  <img class="banner-av" id="bannerAv" src="" alt="">
  <div class="banner-info">
    <div class="banner-name" id="bannerName">—</div>
    <div class="banner-grade" id="bannerGrade">—</div>
  </div>
</div>

<!-- CONTENU PAGE (vide pour l'instant) -->
<div class="page-content">
  <div class="section">
    <div class="section-title">MON AVATAR</div>
    <div class="av-main">
      <div class="av-big" style="position:relative"><div class="av-big-sk" id="avBigSk"></div><img src="" id="avBigImg" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .3s"></div>
      <div class="av-big-name" id="avBigName">DOCKER</div>
      <div class="av-big-sub" id="avBigSub">Niveau 1 · Actif</div>
    </div>
    <div class="av-scroll" id="avatarGrid"></div>
    <button onclick="location.href='game.html'" style="display:block;width:calc(100% - 24px);margin:0 12px 20px;padding:14px;background:#1a1a1a;color:#fff;border:none;border-radius:12px;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px;cursor:pointer;">← RETOUR AU JEU</button>
</div>

<script>
const supabaseUrl  = 'https://drtsuhnbclhmgfjiykap.supabase.co';
const supabaseKey  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
const { createClient } = supabase;
const sb = createClient(supabaseUrl, supabaseKey);

function avatarForLevel(lvl) {
  if (lvl >= 50) return 'avatar-level-50.png';
  if (lvl >= 30) return 'avatar-level-30.png';
  if (lvl >= 20) return 'avatar-level-20.png';
  if (lvl >= 17) return 'avatar-level-17.png';
  if (lvl >= 15) return 'avatar-level-15.png';
  if (lvl >= 13) return 'avatar-level-13.png';
  if (lvl >= 10) return 'avatar-level-10.png';
  if (lvl >= 5)  return 'avatar-level-5.png';
  if (lvl >= 4)  return 'avatar-level-4.png';
  if (lvl >= 3)  return 'avatar-level-3.png';
  if (lvl >= 2)  return 'avatar-level-2.png';
  return 'avatar-default.png';
}

function getXpRequired(level) {
  if (level <= 10) return level * 500;
  if (level <= 25) return level * 1000;
  if (level <= 50) return level * 2000;
  return level * 4000;
}

function getGrade(level) {
  if (level <= 4)  return 'Docker Occasionnel';
  if (level <= 14) return 'Docker';
  if (level <= 29) return 'Docker Mensuel';
  if (level <= 49) return 'Contre-Maître';
  if (level <= 79) return 'Chef de Quai';
  return 'Magnat du Port';
}

const PROFILE_THEMES = {
  gold:    'linear-gradient(135deg,#b45309,#f59e0b)',
  emerald: 'linear-gradient(135deg,#047857,#10b981)',
  purple:  'linear-gradient(135deg,#6d28d9,#a855f7)',
  night:   'linear-gradient(135deg,#0f172a,#334155)',
  coral:   'linear-gradient(135deg,#be123c,#fb7185)',
};


var BANNERS = [
  {min:1,  bg:'linear-gradient(120deg,#000 0%,#1a1a2e 50%,#2d2d44 100%)',  dark:false},
  {min:2,  bg:'linear-gradient(120deg,#a8f0e4 0%,#c8f5ee 50%,#e0faf6 100%)', dark:true},
  {min:3,  bg:'linear-gradient(120deg,#1a9e88 0%,#5de8c8 60%,#80f0d8 100%)', dark:false},
  {min:4,  bg:'linear-gradient(120deg,#5aa8d8 0%,#b3d9f5 60%,#d4ecff 100%)', dark:false},
  {min:5,  bg:'linear-gradient(120deg,#90b8d8 0%,#b8d4f0 50%,#e8f4ff 100%)', dark:true},
  {min:10, bg:'linear-gradient(120deg,#2d8a50 0%,#5ab878 50%,#8fdc9e 100%)', dark:false},
  {min:13, bg:'linear-gradient(120deg,#3a7a4a 0%,#5aaa6a 50%,#7dcb8a 100%)', dark:false},
  {min:15, bg:'linear-gradient(120deg,#e0708a 0%,#f598b0 50%,#ffb8cc 100%)', dark:false},
  {min:17, bg:'linear-gradient(120deg,#d0507a 0%,#f07898 50%,#ff9ab5 100%)', dark:false},
  {min:20, bg:'linear-gradient(120deg,#cc4030 0%,#f06050 50%,#ff8070 100%)', dark:false},
  {min:30, bg:'linear-gradient(120deg,#7050b8 0%,#9878d8 50%,#c8b0f0 100%)', dark:false},
  {min:50, bg:'linear-gradient(120deg,#c8900a 0%,#e8b830 50%,#fad878 100%)', dark:false},
];

function getBannerForAvatar(avatarSrc){
  var map={
    'avatar-default.png': BANNERS[0],
    'avatar-level-2.png': BANNERS[1],
    'avatar-level-3.png': BANNERS[2],
    'avatar-level-4.png': BANNERS[3],
    'avatar-level-5.png': BANNERS[4],
    'avatar-level-10.png': BANNERS[5],
    'avatar-level-13.png': BANNERS[6],
    'avatar-level-15.png': BANNERS[7],
    'avatar-level-17.png': BANNERS[8],
    'avatar-level-20.png': BANNERS[9],
    'avatar-level-30.png': BANNERS[10],
    'avatar-level-50.png': BANNERS[11],
  };
  return map[avatarSrc]||BANNERS[0];
}

function renderBanner(lvl, username, grade, avatarSrc){
  var b=getBannerForAvatar(avatarSrc);
  document.getElementById('bannerBg').style.background=b.bg;
  document.getElementById('bannerAv').src=avatarSrc||'avatar-default.png';
  document.getElementById('bannerName').textContent=(username||'—').toUpperCase();
  document.getElementById('bannerName').style.color=b.dark?'#1a1a1a':'#fff';
  document.getElementById('bannerGrade').textContent=grade.toUpperCase()+' · NV.'+lvl;
  document.getElementById('bannerGrade').style.color=b.dark?'rgba(0,0,0,.4)':'rgba(255,255,255,.55)';
}

const AVATARS=[
  {src:'avatar-default.png',lbl:'NV.1',min:1},
  {src:'avatar-level-2.png',lbl:'NV.2',min:2},
  {src:'avatar-level-3.png',lbl:'NV.3',min:3},
  {src:'avatar-level-4.png',lbl:'NV.4',min:4},
  {src:'avatar-level-5.png',lbl:'NV.5',min:5},
  {src:'avatar-level-10.png',lbl:'NV.10',min:10},
  {src:'avatar-level-13.png',lbl:'NV.13',min:13},
  {src:'avatar-level-15.png',lbl:'NV.15',min:15},
  {src:'avatar-level-17.png',lbl:'NV.17',min:17},
  {src:'avatar-level-20.png',lbl:'NV.20',min:20},
  {src:'avatar-level-30.png',lbl:'NV.30',min:30},
  {src:'avatar-level-50.png',lbl:'NV.50',min:50},
];
let _curLvl=1,_curAv='avatar-default.png',_uid=null;

function renderAvatarGrid(lvl,curSrc){
  _curLvl=lvl;_curAv=curSrc;
  const unlocked=AVATARS.filter(function(av){return lvl>=av.min;});
  const active=AVATARS.find(function(av){return av.src===curSrc;})||AVATARS[0];

  // Grand avatar centré
  var _bi=document.getElementById('avBigImg');
  _bi.onload=function(){_bi.style.opacity='1';var sk=document.getElementById('avBigSk');if(sk)sk.style.display='none';};
  _bi.src=active.src;
  document.getElementById('avBigName').textContent='DOCKER NV.'+active.min;
  document.getElementById('avBigSub').textContent=unlocked.length+'/'+AVATARS.length+' debloqués';

  // Scroll thumbnails
  const g=document.getElementById('avatarGrid');
  g.innerHTML=AVATARS.map(function(av,i){
    var ok=lvl>=av.min,sel=curSrc===av.src;
    return '<div class="av-thumb"'+(ok?' onclick="selectAvatar('+i+')"':'')+'>'+
      '<div class="av-thumb-ring'+(sel?' active':'')+(ok?'':' locked')+'">'+(ok?'<img src="'+av.src+'" alt="">':'🔒')+'</div>'+
      '<div class="av-thumb-lbl'+(sel?' active':'')+'">'+av.lbl+'</div>'+
      '</div>';
  }).join('');
}

async function selectAvatar(idx){
  const av=AVATARS[idx];
  if(_curLvl<av.min)return;
  _curAv=av.src;
  if(document.getElementById('avBigImg'))document.getElementById('avBigImg').src=av.src;
  if(document.getElementById('bannerAv'))document.getElementById('bannerAv').src=av.src;
  var _b=getBannerForAvatar(av.src);document.getElementById('bannerBg').style.background=_b.bg;var _dark=_b.dark;document.getElementById('bannerName').style.color=_dark?'#1a1a1a':'#fff';document.getElementById('bannerGrade').style.color=_dark?'rgba(0,0,0,.4)':'rgba(255,255,255,.55)';
  renderAvatarGrid(_curLvl,av.src);
  await sb.from('profiles').update({avatar_url:av.src}).eq('user_id',_uid);
}

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = 'index.html'; return; }
  const uid = session.user.id;

  const [profileRes, statsRes] = await Promise.all([
    sb.from('profiles').select('username, avatar_url, background_color').eq('user_id', uid).maybeSingle(),
    sb.from('game_stats').select('level, xp, money, diamonds, trophies').eq('user_id', uid).maybeSingle()
  ]);

  const profile = profileRes.data;
  const stats   = statsRes.data;
  if (!profile || !stats) return;

  const level = stats.level || 1;
  const xp    = stats.xp || 0;
  const xpReq = getXpRequired(level);
  const pct   = Math.min((xp / xpReq) * 100, 100);

  // Avatar
  const _SPECIAL = ['avatar-millionaire.png', 'avatar-completionist.png'];



  // Avatar grid
  _uid=uid;
  renderBanner(level, profile.username, getGrade(level), profile.avatar_url||avatarForLevel(level));
  renderAvatarGrid(level, profile.avatar_url || avatarForLevel(level));

  // last_seen
  sb.from('profiles').update({ last_seen: new Date().toISOString() }).eq('user_id', uid);
}

init();
</script>
</body>
</html>
