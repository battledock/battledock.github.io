<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mon Profil — Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
:root{--st:env(safe-area-inset-top,44px);--sb:env(safe-area-inset-bottom,20px)}
html,body{min-height:100%;background:linear-gradient(180deg,#0c2a4a,#020810);font-family:'Inter',sans-serif;color:#fff;overflow-x:hidden}
.bebas{font-family:'Bebas Neue',sans-serif}

/* ── HEADER ── */
.hdr{padding:calc(var(--st)+8px) 18px 6px;display:flex;align-items:center;justify-content:space-between}
.hdr-back{width:42px;height:42px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:13px;color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;flex-shrink:0}
.hdr-title{font-size:13px;font-weight:800;color:rgba(255,255,255,.4);letter-spacing:2px}

/* ── HERO CENTRÉ ── */
.hero{padding:18px 20px 24px;text-align:center;position:relative}
.avatar-wrap{position:relative;width:104px;height:104px;margin:0 auto 14px;cursor:pointer}
.avatar-ring{width:104px;height:104px;border-radius:50%;background:linear-gradient(135deg,#22d3ee,#0369a1);padding:3px}
.avatar-img{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#0c2a4a;display:block}
.avatar-edit-badge{position:absolute;bottom:0;right:0;width:30px;height:30px;background:#fbbf24;border:3px solid #071a30;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px}
.name-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:2px}
.hero-name{font-size:clamp(24px,7vw,30px);letter-spacing:1px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.hero-grade{font-size:11px;color:#fbbf24;font-weight:800;letter-spacing:1px;margin-top:4px}
.hero-xpbar-wrap{width:78%;max-width:280px;margin:16px auto 0}
.hero-xpbar{height:8px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden;position:relative}
.hero-xpfill{height:100%;background:linear-gradient(90deg,#22d3ee,#4ade80);border-radius:4px;transition:width .5s}
.hero-xplabel{font-size:9px;color:rgba(255,255,255,.35);font-weight:700;margin-top:6px;letter-spacing:.5px}

/* ── STATS GRID ── */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 18px;margin-top:18px}
.stat-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:13px 6px;text-align:center;min-height:64px}
.stat-card-val{font-size:clamp(15px,4.5vw,18px);color:#fff;line-height:1}
.stat-card-lbl{font-size:8px;color:rgba(255,255,255,.35);font-weight:800;letter-spacing:1px;margin-top:4px;text-transform:uppercase}

/* ── SECTIONS ── */
.section{margin:14px 18px 0;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:16px}
.section-title{font-size:9px;font-weight:900;color:rgba(255,255,255,.3);letter-spacing:2px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.bio-text{font-size:13px;color:rgba(255,255,255,.7);line-height:1.5;min-height:20px}
.bio-empty{color:rgba(255,255,255,.25);font-style:italic}
.bio-edit-btn{margin-top:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:9px 14px;font-size:11px;font-weight:700;color:rgba(255,255,255,.6);cursor:pointer}
.bio-textarea{width:100%;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:10px;color:#fff;font-size:13px;font-family:'Inter',sans-serif;resize:none;min-height:70px}
.bio-save-row{display:flex;align-items:center;gap:10px;margin-top:8px}
.bio-save-btn{background:linear-gradient(135deg,#22d3ee,#0369a1);border:none;border-radius:10px;padding:9px 16px;font-size:11px;font-weight:800;color:#fff;cursor:pointer}
.bio-saved-msg{font-size:10px;color:#4ade80;font-weight:700;opacity:0;transition:opacity .3s}

.info-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.info-row:last-child{border-bottom:none}
.info-ico{font-size:16px;width:24px;text-align:center;flex-shrink:0}
.info-lbl{font-size:12px;color:rgba(255,255,255,.5);font-weight:600;flex:1}
.info-val{font-size:12px;color:#fff;font-weight:700}

/* ── AVATAR GRID MODAL ── */
.av-modal-bg{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center}
.av-modal-bg.show{display:flex}
.av-modal{background:#0c2a4a;border-radius:22px 22px 0 0;padding:24px 18px calc(var(--sb)+20px);width:100%;max-width:600px;max-height:75vh;overflow-y:auto}
.av-modal-title{font-size:18px;letter-spacing:1px;color:#fff;margin-bottom:4px}
.av-modal-sub{font-size:11px;color:rgba(255,255,255,.4);font-weight:600;margin-bottom:16px}
.av-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:10px}
.av-opt{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;border:2px solid rgba(255,255,255,.1);cursor:pointer}
.av-opt.locked{opacity:.3;cursor:not-allowed}
.av-opt.selected{border-color:#22d3ee;box-shadow:0 0 0 2px rgba(34,211,238,.3)}
.av-opt img{width:100%;height:100%;object-fit:cover;display:block}
.av-opt-lbl{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.7);font-size:clamp(7px,2.6vw,9px);font-weight:800;text-align:center;padding:4px 2px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.av-opt.locked .av-opt-lbl{color:rgba(255,255,255,.4)}
.av-close{width:100%;margin-top:18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:13px;padding:13px;font-size:13px;color:#fff;letter-spacing:1px;cursor:pointer}

/* ── BOUTIQUE ── */
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px}
.shop-opt{position:relative;border-radius:14px;overflow:hidden;border:2px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03)}
.shop-opt.owned{border-color:#4ade80}
.shop-opt img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.shop-opt-price{font-size:clamp(9px,2.8vw,11px);font-weight:800;text-align:center;padding:6px 4px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shop-opt-price.afford{cursor:pointer}
.shop-opt-price.cant-afford{opacity:.4}
.shop-opt-owned-lbl{font-size:10px;font-weight:800;text-align:center;padding:6px 4px;color:#4ade80}
.shop-opt-buying{font-size:10px;font-weight:800;text-align:center;padding:6px 4px;color:rgba(255,255,255,.4)}

.loader{position:fixed;inset:0;background:#020810;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:500}
.loader-spin{width:36px;height:36px;border:3px solid rgba(34,211,238,.2);border-top-color:#22d3ee;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="loader" id="loader">
  <div class="loader-spin"></div>
  <div style="font-size:11px;color:rgba(255,255,255,.4);font-weight:700">Chargement du profil...</div>
</div>

<div id="app" style="display:none">

<div class="hdr">
  <div style="width:42px;height:42px;flex-shrink:0"></div>
</div>

<div class="hero">
  <div class="avatar-wrap" onclick="openAvatarModal()">
    <div class="avatar-ring"><img class="avatar-img" id="avatarImg" src="avatar-default.png" alt="avatar"></div>
    <div class="avatar-edit-badge">📷</div>
  </div>
  <div class="name-row">
    <div class="hero-name bebas" id="heroName">—</div>
  </div>
  <div class="hero-grade" id="heroGrade">—</div>
  <div class="hero-xpbar-wrap">
    <div class="hero-xpbar"><div class="hero-xpfill" id="heroXpFill" style="width:0%"></div></div>
    <div class="hero-xplabel" id="heroXpLabel">— XP</div>
  </div>
</div>

<div class="stats-grid">
  <div class="stat-card"><div class="stat-card-val bebas" id="statMoney">—</div><div class="stat-card-lbl">Argent</div></div>
  <div class="stat-card"><div class="stat-card-val bebas" id="statDiamonds">—</div><div class="stat-card-lbl">Diamants</div></div>
  <div class="stat-card"><div class="stat-card-val bebas" id="statTrophies">—</div><div class="stat-card-lbl">Trophées</div></div>
</div>

<div class="section">
  <div class="section-title">🛒 BOUTIQUE AVATARS</div>
  <div class="shop-grid" id="shopGrid"></div>
</div>

<div class="section">
  <div class="section-title">✍️ À PROPOS</div>
  <div class="bio-text" id="bioDisplay">—</div>
  <div id="bioEditZone" style="display:none;margin-top:10px">
    <textarea class="bio-textarea" id="bioTextarea" maxlength="140" placeholder="Parle un peu de toi..."></textarea>
    <div class="bio-save-row">
      <button class="bio-save-btn" onclick="saveBio()">ENREGISTRER</button>
      <span class="bio-saved-msg" id="bioSavedMsg">✅ Enregistré</span>
    </div>
  </div>
  <button class="bio-edit-btn" id="bioEditBtn" onclick="toggleBioEdit()">Modifier</button>
</div>

<div class="section">
  <div class="section-title">📊 STATISTIQUES</div>
  <div class="info-row"><div class="info-ico">🔥</div><div class="info-lbl">Série en cours</div><div class="info-val" id="infoStreak">—</div></div>
  <div class="info-row"><div class="info-ico">⏱️</div><div class="info-lbl">Temps de jeu</div><div class="info-val" id="infoPlaytime">—</div></div>
  <div class="info-row"><div class="info-ico">📅</div><div class="info-lbl">Membre depuis</div><div class="info-val" id="infoSince">—</div></div>
  <div class="info-row"><div class="info-ico">🏅</div><div class="info-lbl">Classement richesse</div><div class="info-val" id="infoRank">—</div></div>
</div>

</div>

<!-- ── MODALE SÉLECTION AVATAR ── -->
<div class="av-modal-bg" id="avModalBg" onclick="if(event.target===this)closeAvatarModal()">
  <div class="av-modal">
    <div class="av-modal-title bebas">CHOISIR UN AVATAR</div>
    <div class="av-modal-sub">Débloqués au fil de ta progression</div>
    <div class="av-grid" id="avGrid"></div>
    <button class="av-close" onclick="closeAvatarModal()">FERMER</button>
  </div>
</div>

<script>
var SB_URL='https://drtsuhnbclhmgfjiykap.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
var sb=supabase.createClient(SB_URL,SB_KEY);

var _uid=null,_curLvl=1,_curAv='avatar-default.png',playerLevel=1,playerXp=0;

// ── Avatars débloquables par niveau (système conservé tel quel) ──
const AVATARS=[
  {src:'avatar-default.png',lbl:'NV.1',min:1},
  {src:'avatar-level-2.png',lbl:'NV.2',min:2},
  {src:'avatar-level-3.png',lbl:'NV.3',min:3},
  {src:'avatar-level-4.png',lbl:'NV.4',min:4},
  {src:'avatar-level-5.png',lbl:'NV.5',min:5},
  {src:'avatar-level-10.png',lbl:'NV.10',min:10},
  {src:'avatar-level-13.png',lbl:'NV.13',min:13},
  {src:'avatar-level-15.png',lbl:'NV.15',min:15},
  {src:'avatar-level-17.png',lbl:'NV.17',min:17},
  {src:'avatar-level-20.png',lbl:'NV.20',min:20},
  {src:'avatar-level-30.png',lbl:'NV.30',min:30},
  {src:'avatar-level-50.png',lbl:'NV.50',min:50},
];

// ── Avatars en vente dans la boutique (à compléter avec tes images) ──
// currency: 'money' ou 'diamonds'
const SHOP_AVATARS=[
  // {src:'avatar-shop-1.png',lbl:'Capitaine',price:5000,currency:'money'},
  // {src:'avatar-shop-2.png',lbl:'Légende',price:200,currency:'diamonds'},
];

var ownedAvatars=[];

function avatarForLevel(lvl){
  if(lvl>=50)return'avatar-level-50.png';
  if(lvl>=30)return'avatar-level-30.png';
  if(lvl>=20)return'avatar-level-20.png';
  if(lvl>=17)return'avatar-level-17.png';
  if(lvl>=15)return'avatar-level-15.png';
  if(lvl>=13)return'avatar-level-13.png';
  if(lvl>=10)return'avatar-level-10.png';
  if(lvl>=5)return'avatar-level-5.png';
  if(lvl>=4)return'avatar-level-4.png';
  if(lvl>=3)return'avatar-level-3.png';
  if(lvl>=2)return'avatar-level-2.png';
  return'avatar-default.png';
}

function getXpRequired(level){
  if(level<=10)return level*500;
  if(level<=25)return level*1000;
  if(level<=50)return level*2000;
  return level*4000;
}

// Même progression de poste que dans direction.html, pour rester cohérent partout
function getPoste(lvl){
  if(lvl>=50)return'PDG';if(lvl>=40)return'Directeur Exécutif';
  if(lvl>=30)return'Directeur Général';if(lvl>=20)return'Directeur de Zone';
  if(lvl>=10)return'Chef de Service';if(lvl>=5)return'Responsable';
  return'Employé Cadre';
}

function fm(n){return Math.floor(n||0).toLocaleString('fr-FR');}

function renderAvatarGrid(lvl,curSrc){
  var el=document.getElementById('avGrid');
  el.innerHTML=AVATARS.map(function(av){
    var unlocked=lvl>=av.min;
    var selected=curSrc===av.src;
    var cls='av-opt'+(unlocked?'':' locked')+(selected?' selected':'');
    return '<div class="'+cls+'" onclick="'+(unlocked?("selectAvatar('"+av.src+"')"):'')+'">'+
      '<img src="'+av.src+'" alt="">'+
      '<div class="av-opt-lbl">'+(unlocked?av.lbl:'🔒 '+av.lbl)+'</div>'+
      '</div>';
  }).join('');
}

function curMoney(){return parseInt(document.getElementById('statMoney').dataset.raw||0);}
function curDiamonds(){return parseInt(document.getElementById('statDiamonds').dataset.raw||0);}

function renderShopGrid(){
  var el=document.getElementById('shopGrid');
  if(!SHOP_AVATARS.length){el.innerHTML='<div style="grid-column:1/-1;font-size:11px;color:rgba(255,255,255,.3);text-align:center;padding:10px 0">Aucun avatar disponible pour le moment</div>';return;}
  var money=curMoney(),diamonds=curDiamonds();
  el.innerHTML=SHOP_AVATARS.map(function(av,i){
    var owned=ownedAvatars.indexOf(av.src)>=0;
    var sym=av.currency==='diamonds'?'💎':'€';
    var balance=av.currency==='diamonds'?diamonds:money;
    var afford=balance>=av.price;
    var cls='shop-opt'+(owned?' owned':'');
    var footer=owned
      ?'<div class="shop-opt-owned-lbl">✅ Possédé</div>'
      :'<div class="shop-opt-price '+(afford?'afford':'cant-afford')+'" '+(afford?('onclick="buyAvatar('+i+')"'):'')+'>'+fm(av.price)+sym+'</div>';
    return '<div class="'+cls+'"><img src="'+av.src+'" alt="">'+footer+'</div>';
  }).join('');
}

async function buyAvatar(i){
  var av=SHOP_AVATARS[i];
  if(!av||ownedAvatars.indexOf(av.src)>=0)return;
  var field=av.currency==='diamonds'?'diamonds':'money';
  var balance=av.currency==='diamonds'?curDiamonds():curMoney();
  if(balance<av.price)return;
  try{
    ownedAvatars.push(av.src);
    var newBalance=balance-av.price;
    var upd={};upd[field]=newBalance;
    await Promise.all([
      sb.from('profiles').update({owned_avatars:ownedAvatars}).eq('user_id',_uid),
      sb.from('game_stats').update(upd).eq('user_id',_uid)
    ]);
    if(field==='diamonds'){document.getElementById('statDiamonds').dataset.raw=newBalance;document.getElementById('statDiamonds').textContent=fm(newBalance)+'💎';}
    else{document.getElementById('statMoney').dataset.raw=newBalance;document.getElementById('statMoney').textContent=fm(newBalance)+'€';}
    renderShopGrid();
  }catch(e){
    ownedAvatars.splice(ownedAvatars.indexOf(av.src),1);
    console.error(e);
  }
}

function openAvatarModal(){
  renderAvatarGrid(_curLvl,_curAv);
  document.getElementById('avModalBg').classList.add('show');
}
function closeAvatarModal(){
  document.getElementById('avModalBg').classList.remove('show');
}

async function selectAvatar(src){
  _curAv=src;
  document.getElementById('avatarImg').src=src;
  renderAvatarGrid(_curLvl,src);
  try{await sb.from('profiles').update({avatar_url:src}).eq('user_id',_uid);}catch(e){}
}

function toggleBioEdit(){
  var zone=document.getElementById('bioEditZone');
  var btn=document.getElementById('bioEditBtn');
  var isOpen=zone.style.display==='block';
  zone.style.display=isOpen?'none':'block';
  btn.style.display=isOpen?'block':'none';
}

async function saveBio(){
  var val=document.getElementById('bioTextarea').value.trim();
  try{await sb.from('profiles').update({bio:val}).eq('user_id',_uid);}catch(e){}
  document.getElementById('bioDisplay').innerHTML=val?escapeHtml(val):'<span class="bio-empty">Aucune bio pour l\'instant</span>';
  document.getElementById('bioEditZone').style.display='none';
  document.getElementById('bioEditBtn').style.display='block';
  var s=document.getElementById('bioSavedMsg');
  s.style.opacity='1';
  setTimeout(function(){s.style.opacity='0';},2000);
}

function escapeHtml(s){
  var d=document.createElement('div');d.textContent=s;return d.innerHTML;
}

function fmtPlaytime(min){
  min=min||0;
  if(min<60)return min+'min';
  var h=Math.floor(min/60);
  var m=min%60;
  return h+'h'+(m>0?(' '+m+'min'):'');
}

function fmtSince(dateStr){
  if(!dateStr)return'—';
  var d=new Date(dateStr);
  var mois=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
  return mois[d.getMonth()]+' '+d.getFullYear();
}

async function init(){
  try{
    var r=await sb.auth.getSession();
    var session=r.data&&r.data.session;
    if(!session){location.href='index.html';return;}
    _uid=session.user.id;

    var res=await Promise.all([
      sb.from('profiles').select('username, avatar_url, background_color, bio, created_at, owned_avatars').eq('user_id',_uid).maybeSingle(),
      sb.from('game_stats').select('level, xp, money, diamonds, trophies, playtime_minutes, streak_days').eq('user_id',_uid).maybeSingle(),
      sb.from('game_stats').select('user_id,money').order('money',{ascending:false}).limit(500)
    ]);
    var profile=res[0].data||{};
    var stats=res[1].data||{};
    var allMoney=res[2].data||[];
    ownedAvatars=profile.owned_avatars||[];

    playerLevel=stats.level||1;
    playerXp=stats.xp||0;
    _curLvl=playerLevel;
    var needed=getXpRequired(playerLevel);
    var xpPct=Math.min(100,Math.round((playerXp/needed)*100));

    _curAv=(profile.avatar_url&&profile.avatar_url!=='avatar-default.png')?profile.avatar_url:avatarForLevel(playerLevel);

    document.getElementById('avatarImg').src=_curAv;
    document.getElementById('heroName').textContent=profile.username||'Docker';
    document.getElementById('heroGrade').textContent='⭐ '+getPoste(playerLevel).toUpperCase();
    document.getElementById('heroXpFill').style.width=xpPct+'%';
    document.getElementById('heroXpLabel').textContent=fm(playerXp)+' / '+fm(needed)+' XP — NV.'+playerLevel;

    document.getElementById('statMoney').textContent=fm(stats.money)+'€';
    document.getElementById('statMoney').dataset.raw=stats.money||0;
    document.getElementById('statDiamonds').textContent=fm(stats.diamonds)+'💎';
    document.getElementById('statDiamonds').dataset.raw=stats.diamonds||0;
    document.getElementById('statTrophies').textContent=fm(stats.trophies)+'🏆';

    renderShopGrid();

    var bio=profile.bio;
    document.getElementById('bioDisplay').innerHTML=bio?escapeHtml(bio):'<span class="bio-empty">Aucune bio pour l\'instant</span>';
    document.getElementById('bioTextarea').value=bio||'';

    document.getElementById('infoStreak').textContent=(stats.streak_days||0)+' jours';
    document.getElementById('infoPlaytime').textContent=fmtPlaytime(stats.playtime_minutes);
    document.getElementById('infoSince').textContent=fmtSince(profile.created_at);

    // Rang patrimoine (classement par argent, simple et déjà chargé)
    var sorted=allMoney.slice().sort(function(a,b){return (b.money||0)-(a.money||0);});
    var myRank=sorted.findIndex(function(r){return r.user_id===_uid;});
    document.getElementById('infoRank').textContent=myRank>=0?('#'+(myRank+1)+' / '+sorted.length):'—';

    document.getElementById('loader').style.display='none';
    document.getElementById('app').style.display='block';

    sb.from('profiles').update({last_seen:new Date().toISOString()}).eq('user_id',_uid).then(function(){});
  }catch(e){
    console.error(e);
    document.getElementById('loader').innerHTML='<div style="color:rgba(255,255,255,.5);font-size:13px">Erreur de chargement</div>';
  }
}

init();
</script>
</body>
