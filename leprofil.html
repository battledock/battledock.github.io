/* ── SKELETON ── */
@keyframes skShimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.sk{border-radius:8px;background:linear-gradient(90deg,#e8e0cc 25%,#f0ead8 50%,#e8e0cc 75%);background-size:200% 100%;animation:skShimmer 1.4s ease-in-out infinite;}



/* ── PAGE CONTENT ── */
.page-content{
  min-height:100vh;
  padding-top:14px;
  padding-bottom:calc(20px + var(--safe-bottom));
  min-height:100vh;
}

.section-title{font-size:7px;font-weight:800;color:#9ca3af;letter-spacing:2.5px;padding:14px 14px 8px;text-align:center}
@keyframes skShimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.av-big-sk{width:90px;height:90px;border-radius:50%;background:linear-gradient(90deg,#e5e7eb 25%,#f3f4f6 50%,#e5e7eb 75%);background-size:200% 100%;animation:skShimmer 1.4s ease-in-out infinite;display:block}
@keyframes avGlow{0%,100%{box-shadow:0 0 0 0 rgba(0,0,0,.2)}50%{box-shadow:0 0 0 8px rgba(0,0,0,.06)}}
.av-main{display:flex;flex-direction:column;align-items:center;padding:0 14px 14px}
.av-big{width:90px;height:90px;border-radius:50%;border:3px solid #1a1a1a;overflow:hidden;background:#f5f5f5;animation:avGlow 2.5s ease-in-out infinite}
.av-big img{width:100%;height:100%;object-fit:contain}
.av-big-name{font-family:'Bebas Neue',sans-serif;font-size:16px;color:#1a1a1a;letter-spacing:1px;margin-top:8px}
.av-big-sub{font-size:8px;font-weight:700;color:#6b7280;margin-top:2px}
.av-scroll{display:flex;gap:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:10px 14px 14px}
.av-scroll::-webkit-scrollbar{display:none}
.av-thumb{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.av-thumb-ring{width:52px;height:52px;border-radius:50%;border:2.5px solid #e5e7eb;overflow:hidden;background:#f5f5f5;transition:border-color .15s}
.av-thumb-ring img{width:100%;height:100%;object-fit:contain}
.av-thumb-ring.active{border-color:#1a1a1a;box-shadow:0 0 0 3px rgba(0,0,0,.1)}
.av-thumb-ring.locked{filter:grayscale(1);opacity:.3}
.av-thumb-lbl{font-size:7px;font-weight:800;color:#9ca3af}
.av-thumb-lbl.active{color:#1a1a1a}

.bio-save:active{opacity:.8}
.bio-saved{font-size:8px;font-weight:700;color:#16a34a;opacity:0;transition:opacity .3s}

.profil-hdr-sub{font-size:8px;font-weight:800;color:rgba(255,255,255,.55);letter-spacing:2px;margin-top:3px}

.profil-hdr-stat{flex:1;text-align:center;padding:8px 0;position:relative}

.profil-hdr-stat-lbl{font-size:6px;font-weight:800;color:rgba(255,255,255,.45);letter-spacing:1px;margin-top:2px}

.av-scroll{display:flex;gap:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:14px 14px 0}

.av-thumb{flex-shrink:0;width:44px;height:44px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);overflow:hidden;background:rgba(255,255,255,.15);cursor:pointer;transition:border-color .15s;position:relative}
.av-thumb img{width:100%;height:100%;object-fit:contain;display:block}

.share-btn:active{opacity:.8}

function getTitreForLevel(lvl){
  // Le titre correspond exactement au niveau atteint
  var t = ALL_TITRES.find(function(t){return t.lvl===lvl;});
  return t || ALL_TITRES[0];
}

function renderTitres(level){
  var grid = document.getElementById('titresGrid');
  if(!grid) return;
  var currentTitre = getTitreForLevel(level);
  grid.innerHTML = ALL_TITRES.map(function(t){
    var unlocked = level >= t.lvl;
    var active = t.lvl === level;
    var cls = 'titre-row' + (active?' active':'') + (unlocked?'':' locked');
    var badge = active
      ? '<span class="titre-badge active">ACTIF</span>'
      : unlocked
        ? '<span class="titre-badge done">Obtenu</span>'
        : '<span class="titre-badge lock">NV.'+t.lvl+'</span>';
    return '<div class="'+cls+'">'
      +'<div class="titre-ico">'+t.ico+'</div>'
      +'<div class="titre-info"><div class="titre-nom">'+t.nom+'</div>'
      +'<div class="titre-lvl">Niveau '+t.lvl+'</div></div>'
      +badge+'</div>';
  }).join('');
  // Also show active title in header
  if(document.getElementById('profilSub') && currentTitre){
    // Prepend title to sub
  }
}


function renderStats(stats, profile){
  if(document.getElementById('statDia'))document.getElementById('statDia').textContent=(stats.diamonds||0)+'';
  if(document.getElementById('statTrophees'))document.getElementById('statTrophees').textContent=(stats.trophies||0)+'';
  var mins=stats.playtime_minutes||0;
  var tps=mins>=60?Math.floor(mins/60)+'h'+(mins%60>0?Math.floor(mins%60)+'m':''):mins+'m';
  if(document.getElementById('statTemps'))document.getElementById('statTemps').textContent=tps||'—';
}


async function renderExtras(profile, stats, uid){
  // Date inscription
  if(profile.created_at){
    var d=new Date(profile.created_at);
    var opts={day:'2-digit',month:'long',year:'numeric'};
    document.getElementById('extraInscription').textContent='Docker depuis le '+d.toLocaleDateString('fr-FR',opts);
  }
  // Streak
  if(document.getElementById('extraStreak'))
    document.getElementById('extraStreak').textContent=(stats.streak_days||0)+' jour'+(stats.streak_days>1?'s':'');
  // Rang
  var {data:all}=await sb.from('game_stats').select('user_id,money').order('money',{ascending:false});
  if(all){
    var rank=all.findIndex(function(r){return r.user_id===uid;})+1;
    document.getElementById('extraRang').textContent='#'+rank+' sur '+all.length+' joueurs';
  }
}


async function shareProfil(){
  var name = document.getElementById('profilName') ? document.getElementById('profilName').textContent : 'Docker';
  var sub = document.getElementById('profilSub') ? document.getElementById('profilSub').textContent : '';
  var txt = name + ' — ' + sub + '\nBattle Dock · Port de Marseille\nbattledock.github.io';
  if(navigator.share){
    try{await navigator.share({title:'Mon profil Battle Dock', text:txt, url:'https://battledock.github.io'});}
    catch(e){}
  } else {
    await navigator.clipboard.writeText(txt);
    alert('Lien copié !');
  }
}

function fmtM2(n){if(n>=1000000)return(n/1000000).toFixed(1).replace('.0','')+'M';if(n>=1000)return Math.floor(n/1000)+'k';return n+'';}

function renderHeader(username,grade,level,money,diamonds,avatarSrc){
  var bg=getBannerForAvatar(avatarSrc);
  var dark=bg.dark;
  document.getElementById('profilHdrBg').style.background=bg.bg;
  document.getElementById('avBigImg').src=avatarSrc||'avatar-default.png';
  document.getElementById('profilName').textContent=(username||'—').toUpperCase();
  document.getElementById('profilName').style.color=dark?'#1a1a1a':'#fff';
  var _t=getTitreForLevel(level);
  document.getElementById('profilSub').textContent=(_t?_t.ico+' '+_t.nom:'').toUpperCase()+' · NV.'+level+' · '+fmtM2(money||0)+'€';
  document.getElementById('profilSub').style.color=dark?'rgba(0,0,0,.45)':'rgba(255,255,255,.55)';
  // Prochain avatar
  var nextAv=AVATARS.find(function(av){return av.min>level;});
  var nextEl=document.getElementById('profilNext');
  if(nextAv&&nextEl){
    nextEl.style.display='flex';
    document.getElementById('nextAvImg').src=nextAv.src;
    document.getElementById('nextAvTxt').innerHTML='Prochain avatar à NV.<span>'+nextAv.min+'</span>';
    document.getElementById('nextAvTxt').style.color=dark?'rgba(0,0,0,.5)':'rgba(255,255,255,.6)';
    document.getElementById('nextAvLvls').textContent='+'+(nextAv.min-level)+' NV.';
    document.getElementById('nextAvLvls').style.color=dark?'rgba(0,0,0,.35)':'rgba(255,255,255,.5)';
    // Couleur bg next
    var nextEl2=document.getElementById('profilNext');
    nextEl2.style.background=dark?'rgba(0,0,0,.08)':'rgba(0,0,0,.15)';
  }else if(nextEl){nextEl.style.display='none';}
}

function renderAvatarGrid(lvl,curSrc){
  _curLvl=lvl;_curAv=curSrc;
  const unlocked=AVATARS.filter(function(av){return lvl>=av.min;});
  const active=AVATARS.find(function(av){return av.src===curSrc;})||AVATARS[0];

  // Grand avatar centré
  var _bi=document.getElementById('avBigImg');
  _bi.onload=function(){_bi.style.opacity='1';};
  _bi.src=active.src;
  // Scroll thumbnails
  const g=document.getElementById('avatarGrid');
  g.innerHTML=AVATARS.map(function(av,i){
    var ok=lvl>=av.min,sel=curSrc===av.src;
    var cls='av-thumb'+(sel?' active':'')+(ok?'':' locked');
    if(ok){
      return '<div class="'+cls+'" onclick="selectAvatar('+i+')"><img src="'+av.src+'" alt=""></div>';
    }
    return '<div class="'+cls+'">🔒</div>';
  }).join('');
}

async function selectAvatar(idx){
  const av=AVATARS[idx];
  if(_curLvl<av.min)return;
  _curAv=av.src;
  document.getElementById('avBigImg').src=av.src;
  var _bg=getBannerForAvatar(av.src);document.getElementById('profilHdrBg').style.background=_bg.bg;
  renderAvatarGrid(_curLvl,av.src);
  await sb.from('profiles').update({avatar_url:av.src}).eq('user_id',_uid);
}

async function saveBio(){
  var val=document.getElementById('bioTextarea').value.trim();
  await sb.from('profiles').update({bio:val}).eq('user_id',_uid);
  var s=document.getElementById('bioSaved');
  s.style.opacity='1';
  setTimeout(function(){s.style.opacity='0';},2000);
}

function initBio(bio){
  var ta=document.getElementById('bioTextarea');
  ta.value=bio||'';
  document.getElementById('bioCount').textContent=(bio||'').length+'/120';
  ta.addEventListener('input',function(){
    document.getElementById('bioCount').textContent=ta.value.length+'/120';
  });
}

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = 'index.html'; return; }
  const uid = session.user.id;

  const [profileRes, statsRes] = await Promise.all([
    sb.from('profiles').select('username, avatar_url, background_color, bio, created_at').eq('user_id', uid).maybeSingle(),
    sb.from('game_stats').select('level, xp, money, diamonds, trophies, playtime_minutes, streak_days').eq('user_id', uid).maybeSingle()
  ]);

  const profile = profileRes.data;
  const stats   = statsRes.data;
  if (!profile || !stats) return;

  const level = stats.level || 1;
  const xp    = stats.xp || 0;
  const xpReq = getXpRequired(level);
  const pct   = Math.min((xp / xpReq) * 100, 100);

  // Avatar
  const _SPECIAL = ['avatar-millionaire.png', 'avatar-completionist.png'];



  // Avatar grid
  _uid=uid;
  var _avSrc=profile.avatar_url||avatarForLevel(level);
  renderHeader(profile.username,getGrade(level),level,stats.money,stats.diamonds,_avSrc);
  initBio(profile.bio);
  renderStats(stats, profile);
  renderExtras(profile, stats, uid);

  // last_seen
  sb.from('profiles').update({ last_seen: new Date().toISOString() }).eq('user_id', uid);
}

init();
