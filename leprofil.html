<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
:root{--st:env(safe-area-inset-top,44px);--sb:env(safe-area-inset-bottom,20px)}
body{font-family:'Inter',sans-serif;background:#fff;color:#1a1a1a;min-height:100dvh}

/* ══ HEADER ══ */
@keyframes skShimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.sk{border-radius:8px;background:linear-gradient(90deg,#e8e8ed 25%,#f3f3f6 50%,#e8e8ed 75%);background-size:200% 100%;animation:skShimmer 1.4s ease-in-out infinite}

.profile-header{
  position:fixed;top:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:600px;z-index:200;
  background:#fff;
  border-bottom:1px solid rgba(15,23,42,0.08);
  box-shadow:0 2px 16px rgba(15,23,42,0.07);
}
.skeleton-card{padding:calc(var(--st) + 14px) 16px 14px;display:none}
.skeleton-card.show{display:block}
.sk-row{display:flex;align-items:center;gap:12px}
.sk-avatar{width:54px;height:54px;border-radius:50%;flex-shrink:0}
.sk-line{height:12px}
.profile-card-btn{padding:calc(var(--st) + 12px) 16px 12px;display:none}
.profile-card-btn.show{display:block}
.pcb-row{display:flex;align-items:center;gap:14px}
.pcb-avatar{width:54px;height:54px;border-radius:50%;overflow:hidden;flex-shrink:0;border:2px solid #e5e7eb}
.pcb-avatar img{width:100%;height:100%;object-fit:cover}
.pcb-info{flex:1;min-width:0}
.pcb-name{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1.5px;color:#1a1a1a;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcb-grade{font-size:11px;color:#b8962e;font-weight:700;margin-top:3px}
.pcb-level-wrap{text-align:center;flex-shrink:0}
.pcb-level-num{font-family:'Bebas Neue',sans-serif;font-size:30px;color:#1a1a1a;line-height:1}
.pcb-level-lbl{font-size:9px;color:#9ca3af;letter-spacing:1px;font-weight:700}
.pcb-xp-wrap{margin-top:10px}
.pcb-xp-label{display:flex;justify-content:space-between;font-size:10px;color:#9ca3af;margin-bottom:4px;font-weight:600}
.pcb-xp-track{height:3px;background:#f3f4f6;border-radius:2px;overflow:hidden}
.pcb-xp-fill{height:100%;background:linear-gradient(90deg,#b8962e,#d4af37,#f5d060);border-radius:2px;transition:width .5s}

/* ══ LAYOUT ══ */
.page{padding-top:calc(var(--st) + 105px);padding-bottom:calc(var(--sb) + 20px);max-width:600px;margin:0 auto}

/* ══ SECTIONS ══ */
.section-lbl{font-size:10px;font-weight:800;color:#8e8e93;letter-spacing:1.5px;padding:18px 16px 8px;background:#f5f5f7}

/* ══ STATS 3 colonnes ══ */
.stats-row{display:flex;border-bottom:1px solid rgba(15,23,42,.06)}
.stat-col{flex:1;padding:16px 8px;text-align:center;position:relative}
.stat-col+.stat-col::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:1px;background:rgba(15,23,42,.06)}
.stat-val{font-family:'Bebas Neue',sans-serif;font-size:24px;line-height:1}
.stat-val.gold{color:#d97706}
.stat-val.blue{color:#2563eb}
.stat-val.gray{color:#1a1a1a}
.stat-ico{font-size:16px;margin-bottom:3px}
.stat-lbl{font-size:7px;font-weight:800;color:#9ca3af;letter-spacing:1.5px;margin-top:2px}

/* ══ STREAK ══ */
.streak-row{display:flex;align-items:center;gap:16px;padding:16px;border-bottom:1px solid rgba(15,23,42,.06)}
.streak-left{font-size:38px;flex-shrink:0}
.streak-info{flex:1}
.streak-val{font-family:'Bebas Neue',sans-serif;font-size:32px;line-height:1;color:#1a1a1a}
.streak-sub{font-size:10px;font-weight:700;color:#9ca3af;letter-spacing:1px;margin-top:2px}
.streak-msg{font-size:11px;font-weight:700;color:#f59e0b;margin-top:4px}
.streak-badge{background:#fff7ed;border:1px solid #fed7aa;border-radius:20px;padding:6px 14px;font-size:10px;font-weight:800;color:#c2410c;flex-shrink:0}

/* ══ FORMATIONS ══ */
.formations-row{display:flex;border-bottom:1px solid rgba(15,23,42,.06)}
.formation-item{flex:1;padding:14px 10px;display:flex;align-items:center;gap:10px;position:relative}
.formation-item+.formation-item::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:1px;background:rgba(15,23,42,.06)}
.formation-ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.formation-nom{font-size:13px;font-weight:700;color:#1a1a1a;line-height:1}
.formation-status{font-size:10px;font-weight:700;margin-top:3px}
.formation-status.ok{color:#16a34a}
.formation-status.nok{color:#9ca3af}

/* ══ RECORDS ══ */
.record-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid rgba(15,23,42,.06)}
.record-row:last-child{border-bottom:none}
.record-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.record-nom{font-size:13px;font-weight:700;color:#1a1a1a;flex:1}
.record-sub{font-size:9px;color:#9ca3af;margin-top:1px}
.record-val{font-family:'Bebas Neue',sans-serif;font-size:20px;line-height:1}

/* ══ BIO ══ */
.bio-row{padding:14px 16px;border-bottom:1px solid rgba(15,23,42,.06)}
.bio-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.bio-lbl{font-size:10px;font-weight:800;color:#8e8e93;letter-spacing:1px}
.bio-save{font-size:11px;font-weight:800;color:#cc1a1a;background:none;border:none;cursor:pointer}
.bio-saved{font-size:10px;font-weight:700;color:#16a34a;opacity:0;transition:opacity .3s}
.bio-area{width:100%;border:none;font-family:'Inter',sans-serif;font-size:14px;color:#1a1a1a;resize:none;outline:none;line-height:1.6;background:transparent;-webkit-user-select:text;user-select:text;height:48px}
.bio-area::placeholder{color:#c7c7cc}
.bio-count{font-size:8px;color:#c7c7cc;text-align:right;margin-top:4px}

/* ══ DÉCONNEXION ══ */
.deco-btn{display:flex;align-items:center;gap:14px;padding:16px;width:100%;background:none;border:none;cursor:pointer;border-top:1px solid rgba(15,23,42,.06)}
.deco-ico{width:36px;height:36px;border-radius:10px;background:#fef2f2;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.deco-lbl{font-size:14px;font-weight:600;color:#dc2626;flex:1;text-align:left}
.deco-arrow{font-size:16px;color:#c7c7cc}
</style>
</head>

  }catch(e){_serverNow=new Date();}

  const [profileRes, statsRes] = await Promise.all([
    sb.from('profiles').select('username, avatar_url, background_color, bio, created_at').eq('user_id', uid).maybeSingle(),

  const profile = profileRes.data;

var PRIME_PALIERS = [
  {days:1,  money:500,    trophees:0,  ico:'🌱', id:'pp1'},
  {days:3,  money:2000,   trophees:1,  ico:'⭐', id:'pp3'},
  {days:7,  money:8000,   trophees:3,  ico:'🔥', id:'pp7'},
  {days:14, money:25000,  trophees:8,  ico:'💎', id:'pp14'},
  {days:30, money:100000, trophees:20, ico:'👑', id:'pp30'},
];

function getPrimePalier(streak){
  var palier=PRIME_PALIERS[0];
  for(var i=PRIME_PALIERS.length-1;i>=0;i--){
    if(streak>=PRIME_PALIERS[i].days){palier=PRIME_PALIERS[i];break;}
  }
  return palier;
}

function fmtPrime(money){
  if(money>=1000000)return(money/1000000).toFixed(1)+'M€';
  if(money>=1000)return Math.floor(money/1000)+'k€';
  return money+'€';
}

function renderPrime(streak, lastClaim){
  var _now=_serverNow||new Date();
  var _card=document.getElementById('primeCard');
  if(_now<new Date('2026-07-01')||_now>=new Date('2026-08-01')){
    if(_card)_card.style.opacity='0.5';
    var _btn=document.getElementById('primeBtn');
    if(_btn){_btn.disabled=true;_btn.textContent='BIENTOT';}
    var _st=document.getElementById('primeStatus');
    if(_st){_st.textContent='Du 1er au 31 juillet';_st.className='prime-status claimed';}
  }
  var today=(_serverNow||new Date()).toDateString();
  var claimed=lastClaim===today;
  var palier=getPrimePalier(streak);

  // Paliers visuels
  PRIME_PALIERS.forEach(function(p){
    var el=document.getElementById(p.id);
    if(!el)return;
    var dot=el.querySelector('.prime-palier-dot');
    var lbl=el.querySelector('.prime-palier-lbl');
    if(streak>p.days){dot.className='prime-palier-dot done';lbl.className='prime-palier-lbl done';}
    else if(streak===p.days){dot.className='prime-palier-dot current';lbl.className='prime-palier-lbl current';}
    else{dot.className='prime-palier-dot';lbl.className='prime-palier-lbl';}
  });

  // Récompense actuelle
  var valTxt=fmtPrime(palier.money)+(palier.trophees>0?' + '+palier.trophees+'🏆':'');
  if(document.getElementById('primeVal'))document.getElementById('primeVal').textContent=valTxt;

  var nextPalier=PRIME_PALIERS.find(function(p){return p.days>streak;});
  var subTxt=claimed?'Déjà réclamée aujourd\'hui':nextPalier?'Prochain palier : '+nextPalier.days+'j':'Palier maximum atteint !';
  if(document.getElementById('primeSub'))document.getElementById('primeSub').textContent=subTxt;

  // Bouton
  var btn=document.getElementById('primeBtn');
  var status=document.getElementById('primeStatus');
  if(btn){btn.disabled=claimed;}
  if(status){
    status.textContent=claimed?'Réclamée ✓':'Disponible !';
    status.className='prime-status'+(claimed?' claimed':'');
  }
}

async function claimerPrime(){
  var _n=_serverNow||new Date();if(_n<new Date('2026-07-01')||_n>=new Date('2026-08-01'))return;
  var btn=document.getElementById('primeBtn');
  if(!btn||btn.disabled)return;
  btn.disabled=true;btn.textContent='...';

  try{
    // Vérif anti-triche côté client (Supabase vérifiera aussi)
    var gsR=await sb.from('game_stats').select('money,trophies,streak_days').eq('user_id',_uid).maybeSingle();
    var gs=gsR.data||{};
    var today=(_serverNow||new Date()).toDateString();

    var streak=gs.streak_days||0;
    var palier=getPrimePalier(streak);

    // Appliquer récompense
    var newMoney=(gs.money||0)+palier.money;
    var newTrophees=(gs.trophies||0)+palier.trophees;

    await sb.from('game_stats').update({
      money:newMoney,
      trophies:newTrophees,
    }).eq('user_id',_uid);

    // Feedback visuel
    btn.textContent='✓ RÉCLAMÉE';
    var status=document.getElementById('primeStatus');
    if(status){status.textContent='Réclamée ✓';status.className='prime-status claimed';}
    var sub=document.getElementById('primeSub');
    if(sub)sub.textContent='Déjà réclamée aujourd\'hui';
    var val=document.getElementById('primeVal');
    if(val)val.style.color='#16a34a';

    // Toast
    if(typeof toast==='function')toast('Prime réclamée ! +'+fmtPrime(palier.money)+(palier.trophees>0?' +'+palier.trophees+'🏆':''));

  }catch(e){
    btn.disabled=false;btn.textContent='RÉCLAMER';
  }
}
