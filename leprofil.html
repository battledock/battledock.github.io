<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  font-family:'Inter',sans-serif;
  background:#f3f4f6;
  min-height:100vh;
  -webkit-user-select:none;user-select:none;
}

:root{
  --ink:#1a1a1a;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

/* ── SKELETON ── */
@keyframes skShimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.sk{border-radius:8px;background:linear-gradient(90deg,#e8e0cc 25%,#f0ead8 50%,#e8e0cc 75%);background-size:200% 100%;animation:skShimmer 1.4s ease-in-out infinite;}



/* ── PAGE CONTENT ── */
.page-content{
  padding-top:14px;
  padding-bottom:calc(20px + var(--safe-bottom));
  min-height:100vh;
}


/* AVATAR SELECTOR */
.section{background:#fff;border-radius:16px;margin:0 12px 12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.section-title{font-size:7px;font-weight:800;color:#9ca3af;letter-spacing:2.5px;padding:14px 14px 8px;text-align:center}
@keyframes skShimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.av-big-sk{width:90px;height:90px;border-radius:50%;background:linear-gradient(90deg,#e5e7eb 25%,#f3f4f6 50%,#e5e7eb 75%);background-size:200% 100%;animation:skShimmer 1.4s ease-in-out infinite;display:block}
@keyframes avGlow{0%,100%{box-shadow:0 0 0 0 rgba(0,0,0,.2)}50%{box-shadow:0 0 0 8px rgba(0,0,0,.06)}}
.av-main{display:flex;flex-direction:column;align-items:center;padding:0 14px 14px}
.av-big{width:90px;height:90px;border-radius:50%;border:3px solid #1a1a1a;overflow:hidden;background:#f5f5f5;animation:avGlow 2.5s ease-in-out infinite}
.av-big img{width:100%;height:100%;object-fit:contain}
.av-big-name{font-family:'Bebas Neue',sans-serif;font-size:16px;color:#1a1a1a;letter-spacing:1px;margin-top:8px}
.av-big-sub{font-size:8px;font-weight:700;color:#6b7280;margin-top:2px}
.av-scroll{display:flex;gap:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:10px 14px 14px}
.av-scroll::-webkit-scrollbar{display:none}
.av-thumb{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.av-thumb-ring{width:52px;height:52px;border-radius:50%;border:2.5px solid #e5e7eb;overflow:hidden;background:#f5f5f5;transition:border-color .15s}
.av-thumb-ring img{width:100%;height:100%;object-fit:contain}
.av-thumb-ring.active{border-color:#1a1a1a;box-shadow:0 0 0 3px rgba(0,0,0,.1)}
.av-thumb-ring.locked{filter:grayscale(1);opacity:.3}
.av-thumb-lbl{font-size:7px;font-weight:800;color:#9ca3af}
.av-thumb-lbl.active{color:#1a1a1a}




/* BIO */
.bio-section{background:#fff;border-radius:16px;margin:0 12px 12px;padding:14px}
.bio-label{font-size:7px;font-weight:800;color:#9ca3af;letter-spacing:2.5px;margin-bottom:10px}
.bio-textarea{width:100%;border:1.5px solid #e5e7eb;border-radius:10px;padding:10px 12px;font-family:'Inter',sans-serif;font-size:13px;color:#1a1a1a;resize:none;outline:none;height:80px;line-height:1.5;transition:border-color .15s}
.bio-textarea:focus{border-color:#1a1a1a}
.bio-footer{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.bio-count{font-size:8px;font-weight:700;color:#9ca3af}
.bio-save{background:#1a1a1a;color:#fff;border:none;border-radius:8px;padding:7px 16px;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;cursor:pointer}
.bio-save:active{opacity:.8}
.bio-saved{font-size:8px;font-weight:700;color:#16a34a;opacity:0;transition:opacity .3s}


/* HEADER PROFIL IMMERSIF */
.profil-hdr{position:relative;overflow:hidden;padding-top:env(safe-area-inset-top)}
.profil-hdr-bg{position:absolute;inset:0;background:linear-gradient(160deg,#000,#1a1a2e);transition:background .4s}
.profil-hdr-back{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;z-index:10;background:rgba(0,0,0,.2);border:none;border-radius:50%;width:32px;height:32px;color:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.profil-hdr-inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;padding:calc(48px + env(safe-area-inset-top)) 16px 0}
.profil-av-big{width:88px;height:88px;border-radius:50%;overflow:hidden;border:3px solid rgba(255,255,255,.7);background:rgba(255,255,255,.15);margin-bottom:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);flex-shrink:0}
.profil-av-big img{width:100%;height:100%;object-fit:contain;display:block}
.profil-hdr-name{font-family:'Bebas Neue',sans-serif;font-size:26px;color:#fff;letter-spacing:3px;line-height:1}
.profil-hdr-sub{font-size:8px;font-weight:800;color:rgba(255,255,255,.55);letter-spacing:2px;margin-top:3px}
.profil-hdr-stats{display:flex;gap:0;margin-top:14px;width:100%}
.profil-hdr-stat{flex:1;text-align:center;padding:8px 0;position:relative}
.profil-hdr-stat+.profil-hdr-stat::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:1px;background:rgba(255,255,255,.15)}
.profil-hdr-stat-val{font-family:'Bebas Neue',sans-serif;font-size:18px;color:#fff;line-height:1}
.profil-hdr-stat-lbl{font-size:6px;font-weight:800;color:rgba(255,255,255,.45);letter-spacing:1px;margin-top:2px}
/* Scroll avatars */
.av-scroll{display:flex;gap:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:14px 14px 0}
.av-scroll::-webkit-scrollbar{display:none}
.av-thumb{flex-shrink:0;width:44px;height:44px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);overflow:hidden;background:rgba(255,255,255,.15);cursor:pointer;transition:border-color .15s;position:relative}
.av-thumb img{width:100%;height:100%;object-fit:contain;display:block}
.av-thumb.active{border-color:rgba(255,255,255,.9);box-shadow:0 0 0 3px rgba(255,255,255,.2)}
.av-thumb.locked{filter:grayscale(1);opacity:.3;cursor:default;display:flex;align-items:center;justify-content:center;font-size:18px}
.av-thumb.locked img{display:none}
/* Vague */
.profil-hdr-wave{display:block;width:100%;height:28px;margin-top:12px}
/* Sections sous header */
.section{background:#fff;border-radius:16px;margin:0 12px 12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.section-title{font-size:7px;font-weight:800;color:#9ca3af;letter-spacing:2.5px;padding:14px 14px 8px}


/* HEADER PROFIL — DESIGN B AUTO */

.profil-hdr-back{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;z-index:10;background:rgba(0,0,0,.2);border:none;border-radius:50%;width:32px;height:32px;color:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.profil-hdr-inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;padding:calc(48px + env(safe-area-inset-top)) 16px 0}
.profil-av-big{width:80px;height:80px;border-radius:50%;overflow:hidden;border:3px solid rgba(255,255,255,.7);background:rgba(255,255,255,.15);margin-bottom:8px;box-shadow:0 8px 20px rgba(0,0,0,.15)}
.profil-av-big img{width:100%;height:100%;object-fit:contain;display:block}
.profil-hdr-name{font-family:'Bebas Neue',sans-serif;font-size:24px;color:#fff;letter-spacing:2px;line-height:1}
.profil-hdr-sub{font-size:8px;font-weight:800;color:rgba(255,255,255,.55);letter-spacing:1.5px;margin-top:3px}
.profil-hdr-next{display:flex;align-items:center;gap:10px;margin-top:14px;background:rgba(0,0,0,.15);border-radius:12px;padding:8px 14px;width:100%}
.profil-hdr-next-av{width:32px;height:32px;border-radius:50%;overflow:hidden;border:2px solid rgba(255,255,255,.3);opacity:.5;filter:grayscale(1);flex-shrink:0}
.profil-hdr-next-av img{width:100%;height:100%;object-fit:contain;display:block}
.profil-hdr-next-txt{font-size:8px;color:rgba(255,255,255,.6);font-weight:700;flex:1}
.profil-hdr-next-txt span{color:#fff;font-weight:900}
.profil-hdr-next-lvls{font-family:'Bebas Neue',sans-serif;font-size:11px;color:rgba(255,255,255,.5)}
.profil-hdr-wave{display:block;width:100%;height:24px;margin-top:16px;position:relative;z-index:2}

</style>
</head>

function avatarForLevel(lvl) {
  if (lvl >= 50) return 'avatar-level-50.png';
  if (lvl >= 30) return 'avatar-level-30.png';
  if (lvl >= 20) return 'avatar-level-20.png';
  if (lvl >= 17) return 'avatar-level-17.png';

function getXpRequired(level) {
  if (level <= 10) return level * 500;
  if (level <= 25) return level * 1000;
  if (level <= 50) return level * 2000;
  return level * 4000;
}

function getGrade(level) {
  if (level <= 4)  return 'Docker Occasionnel';

var BANNERS = [
  {min:1,  bg:'linear-gradient(120deg,#000 0%,#1a1a2e 50%,#2d2d44 100%)',  dark:false},

function getBannerForAvatar(avatarSrc){
  var map={
    'avatar-default.png': BANNERS[0],
    'avatar-level-2.png': BANNERS[1],
    'avatar-level-3.png': BANNERS[2],
    'avatar-level-4.png': BANNERS[3],
    'avatar-level-5.png': BANNERS[4],
    'avatar-level-10.png': BANNERS[5],
    'avatar-level-13.png': BANNERS[6],
    'avatar-level-15.png': BANNERS[7],
    'avatar-level-17.png': BANNERS[8],
    'avatar-level-20.png': BANNERS[9],
    'avatar-level-30.png': BANNERS[10],
    'avatar-level-50.png': BANNERS[11],
  };
  return map[avatarSrc]||BANNERS[0];
}

}

const AVATARS=[
  {src:'avatar-default.png',lbl:'NV.1',min:1},
  {src:'avatar-level-2.png',lbl:'NV.2',min:2},
  {src:'avatar-level-3.png',lbl:'NV.3',min:3},

  {src:'avatar-level-50.png',lbl:'NV.50',min:50},
];
let _curLvl=1,_curAv='avatar-default.png',_uid=null;

function renderAvatarGrid(lvl,curSrc){
  _curLvl=lvl;_curAv=curSrc;
  const unlocked=AVATARS.filter(function(av){return lvl>=av.min;});
  const active=AVATARS.find(function(av){return av.src===curSrc;})||AVATARS[0];

  // Grand avatar centré
  var _bi=document.getElementById('avBigImg');
  _bi.onload=function(){_bi.style.opacity='1';};
  _bi.src=active.src;
  // Scroll thumbnails
  const g=document.getElementById('avatarGrid');
  g.innerHTML=AVATARS.map(function(av,i){
    var ok=lvl>=av.min,sel=curSrc===av.src;
    var cls='av-thumb'+(sel?' active':'')+(ok?'':' locked');
    if(ok){
      return '<div class="'+cls+'" onclick="selectAvatar('+i+')"><img src="'+av.src+'" alt=""></div>';
    }
    return '<div class="'+cls+'">🔒</div>';
  }).join('');
}

async function selectAvatar(idx){
  const av=AVATARS[idx];
  if(_curLvl<av.min)return;
  _curAv=av.src;
  document.getElementById('avBigImg').src=av.src;
  var _bg=getBannerForAvatar(av.src);document.getElementById('profilHdrBg').style.background=_bg.bg;
  renderAvatarGrid(_curLvl,av.src);
  await sb.from('profiles').update({avatar_url:av.src}).eq('user_id',_uid);
}

async function saveBio(){
  var val=document.getElementById('bioTextarea').value.trim();
  await sb.from('profiles').update({bio:val}).eq('user_id',_uid);
  var s=document.getElementById('bioSaved');
  s.style.opacity='1';
  setTimeout(function(){s.style.opacity='0';},2000);
}

function initBio(bio){
  var ta=document.getElementById('bioTextarea');
  ta.value=bio||'';
  document.getElementById('bioCount').textContent=(bio||'').length+'/120';
  ta.addEventListener('input',function(){
    document.getElementById('bioCount').textContent=ta.value.length+'/120';
  });
}

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = 'index.html'; return; }
  const uid = session.user.id;

  const [profileRes, statsRes] = await Promise.all([
    sb.from('profiles').select('username, avatar_url, background_color, bio').eq('user_id', uid).maybeSingle(),
    sb.from('game_stats').select('level, xp, money, diamonds, trophies').eq('user_id', uid).maybeSingle()
  ]);

  const profile = profileRes.data;
  const stats   = statsRes.data;
  if (!profile || !stats) return;

  const level = stats.level || 1;
