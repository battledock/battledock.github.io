<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Messagerie — Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
:root{--st:env(safe-area-inset-top,44px);--sb:env(safe-area-inset-bottom,16px)}
html,body{height:100%;background:#f2f2f7;font-family:'Inter',sans-serif;overflow:hidden}
.view{position:fixed;inset:0;display:flex;flex-direction:column;transition:transform .3s cubic-bezier(.4,0,.2,1);background:#f2f2f7}
.view.slide-out{transform:translateX(-30%);pointer-events:none}
.view.slide-hidden{transform:translateX(100%);pointer-events:none}

/* HEADER */
.hdr{background:linear-gradient(135deg,#cc1a1a,#0f172a);padding:calc(var(--st)+12px) 14px 12px;display:flex;align-items:center;gap:10px;flex-shrink:0;box-shadow:0 2px 16px rgba(0,0,0,.3)}
.hdr-back{background:rgba(255,255,255,.12);border:none;border-radius:10px;width:36px;height:36px;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hdr-title{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#fff;letter-spacing:2px;flex:1}
.hdr-badge{background:#fbbf24;border-radius:20px;font-family:'Bebas Neue',sans-serif;font-size:12px;color:#0f172a;padding:3px 10px;display:none}

/* TABS */
.tabs{display:flex;background:#fff;border-bottom:1px solid #f0f0f0;flex-shrink:0}
.tab{flex:1;padding:10px 4px;text-align:center;font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:1px;color:#9ca3af;cursor:pointer;border-bottom:3px solid transparent;transition:all .15s}
.tab.active{color:#cc1a1a;border-bottom-color:#cc1a1a}

/* LISTE JOUEURS + CONVERSATIONS */
.list{flex:1;overflow-y:auto;background:#fff;-webkit-overflow-scrolling:touch}
.section-hdr{padding:8px 14px;background:#f9fafb;border-bottom:1px solid #f0f0f0;font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:2px;color:#9ca3af}
.player-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #f9fafb;cursor:pointer;transition:background .1s}
.player-row:active{background:#f9fafb}
.player-row.has-unread{background:#fff8f8}
.av{width:50px;height:50px;border-radius:50%;background:#e5e7eb;display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden;border:2px solid #f0f0f0;flex-shrink:0;position:relative}
.av img{width:100%;height:100%;object-fit:cover}
.unread-dot{position:absolute;top:1px;right:1px;width:12px;height:12px;background:#cc1a1a;border:2.5px solid #fff;border-radius:50%}
.player-body{flex:1;min-width:0}
.player-name{font-weight:900;font-size:14px;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-name.dimmed{font-weight:600;color:#6b7280}
.player-preview{font-size:12px;color:#374151;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.player-preview.dimmed{color:#9ca3af}
.player-time{font-size:10px;color:#9ca3af;flex-shrink:0;text-align:right}
.player-meta{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.unread-count{background:#cc1a1a;color:#fff;border-radius:20px;font-size:10px;font-weight:900;padding:2px 7px;font-family:'Bebas Neue',sans-serif}
.player-title-lbl{font-size:9px;color:#9ca3af;font-weight:700}
/* joueur sans conv */
.player-row.no-conv .player-preview{color:#d1d5db;font-style:italic}

/* CONVERSATION */
#convView{background:#f2f2f7}
.conv-hdr{background:linear-gradient(160deg,#cc1a1a 0%,#7a0e0e 100%);padding:calc(var(--st)+12px) 14px 14px;flex-shrink:0}
.conv-av{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;overflow:hidden;border:2px solid rgba(255,255,255,.35)}
.conv-av img{width:100%;height:100%;object-fit:cover}
.conv-info{flex:1;min-width:0}
.conv-name{font-family:'Bebas Neue',sans-serif;font-size:21px;color:#fff;letter-spacing:1px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 4px rgba(0,0,0,.3)}
.conv-sub{font-size:10px;color:rgba(255,255,255,.65);margin-top:3px;display:flex;align-items:center;gap:4px}
.conv-online{display:none}
.conv-online-dot{width:6px;height:6px;border-radius:50%;background:#a8f0c0;flex-shrink:0}
.conv-online-txt{font-size:10px;color:rgba(255,255,255,.65)}
/* Menu contextuel */
.ctx-menu{position:fixed;z-index:500;background:#fff;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.2);overflow:hidden;display:none;min-width:200px}
.ctx-menu.show{display:block;animation:ctxIn .15s ease-out}
@keyframes ctxIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.ctx-item{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;font-size:14px;font-weight:600;color:#0f172a;border-bottom:1px solid #f9fafb;transition:background .1s}
.ctx-item:last-child{border-bottom:none}
.ctx-item:active{background:#f9fafb}
.ctx-item.danger{color:#ef4444}
.ctx-ico{font-size:18px;width:24px;text-align:center}
.ctx-overlay{position:fixed;inset:0;z-index:499;display:none}
.ctx-overlay.show{display:block}
.conv-body{flex:1;overflow-y:auto;padding:12px 14px 8px;display:flex;flex-direction:column;gap:6px;-webkit-overflow-scrolling:touch}
.bubble-row{display:flex;align-items:flex-end;gap:6px}
.bubble-row.me{flex-direction:row-reverse}
.bav{width:28px;height:28px;border-radius:50%;background:#e5e7eb;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;overflow:hidden}
.bav img{width:100%;height:100%;object-fit:cover}
.bubble{max-width:74%;padding:10px 13px;border-radius:18px;font-size:13px;line-height:1.55;position:relative;word-break:break-word}
.bubble.them{background:#fff;border:none;border-radius:20px 20px 20px 5px;color:#1a1a1a;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.bubble.me{background:#cc1a1a;color:#fff;border-radius:20px 20px 5px 20px;box-shadow:0 3px 12px rgba(204,26,26,.35)}
.bubble.chambrage{background:#fffbeb;color:#78350f;border:1px solid #fde68a;border-radius:20px 20px 20px 5px}
.chlbl{font-size:9px;font-weight:900;color:#d97706;letter-spacing:1px;margin-bottom:5px;display:block}
.btime{font-size:9px;opacity:.55;margin-top:5px;display:block;text-align:right}
.bcheck{font-size:10px;color:rgba(255,255,255,.6);margin-left:3px}
.date-sep{text-align:center;font-size:10px;font-weight:700;color:#9ca3af;letter-spacing:1px;padding:8px 0}
.limit-notice{text-align:center;background:rgba(251,191,36,.12);border-radius:20px;font-size:10px;font-weight:700;color:#d97706;padding:5px 14px;margin:4px auto;width:fit-content}
.conv-input{background:#fff;border-top:1px solid #f0f0f0;padding:10px 12px calc(var(--sb)+10px);display:flex;align-items:flex-end;gap:8px;flex-shrink:0}
.inp-field{flex:1;background:#f2f2f7;border:none;border-radius:20px;padding:10px 14px;font-size:14px;font-family:'Inter',sans-serif;resize:none;outline:none;color:#0f172a;max-height:100px;line-height:1.4;-webkit-user-select:text;user-select:text}
.inp-send{background:#cc1a1a;border:none;border-radius:50%;width:38px;height:38px;color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(204,26,26,.35);transition:transform .1s}
.inp-send:active{transform:scale(.9)}

/* SEARCH */
.search-wrap{padding:10px 14px;background:#fff;border-bottom:1px solid #f0f0f0;flex-shrink:0}
.search-inp{width:100%;background:#f2f2f7;border:none;border-radius:12px;padding:9px 14px;font-size:14px;font-family:'Inter',sans-serif;outline:none;color:#0f172a;-webkit-user-select:text;user-select:text}

/* SKELETON */
.sk-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #f9fafb}
.sk{background:linear-gradient(90deg,#f3f4f6 25%,#e5e7eb 50%,#f3f4f6 75%);background-size:400px;animation:ska 1.2s infinite;border-radius:6px}
@keyframes ska{0%{background-position:-400px 0}100%{background-position:400px 0}}

/* EMPTY */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;color:#9ca3af;flex:1}
.empty-ico{font-size:48px;margin-bottom:10px}
.empty-ttl{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:1px;color:#d1d5db;margin-bottom:4px}
.empty-sub{font-size:11px;text-align:center;line-height:1.5}

/* RT */
.rt-bar{background:#f0fdf4;border-bottom:1px solid #dcfce7;padding:5px 14px;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:#16a34a;flex-shrink:0}
.rt-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;animation:rtp 1.5s infinite;flex-shrink:0}
@keyframes rtp{0%,100%{opacity:1}50%{opacity:.35}}

/* TOAST */
.toast{position:fixed;top:calc(var(--st)+14px);left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:9px 18px;border-radius:20px;font-size:12px;font-weight:700;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>

<!-- VUE LISTE -->
<div class="view" id="listView">
  <div style="background:linear-gradient(160deg,#cc1a1a 0%,#7a0e0e 100%);padding:calc(var(--st) + 12px) 14px 14px;flex-shrink:0">
    <div style="display:flex;align-items:center;gap:12px">
      <button class="hdr-back" onclick="window.location.href='game.html'">←</button>
      <div id="myAvHdr" style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#fbbf24,#f59e0b);display:flex;align-items:center;justify-content:center;font-size:20px;border:2px solid rgba(255,255,255,.3);overflow:hidden;flex-shrink:0">⚓</div>
      <div style="flex:1;min-width:0">
        <div style="font-family:'Bebas Neue',sans-serif;font-size:20px;color:#fff;letter-spacing:2px;line-height:1">MESSAGERIE</div>
        <div style="font-size:10px;color:rgba(255,255,255,.5);margin-top:2px" id="hdrSub"><span id="hdrUser">—</span> · <span style="color:#fbbf24" id="hdrBadge">0 non lus</span></div>
      </div>
    </div>
  </div>
  <div class="tabs">
    <div class="tab active" id="tabConvs" onclick="switchTab('convs')">CONVERSATIONS</div>
    <div class="tab" id="tabJoueurs" onclick="switchTab('joueurs')">JOUEURS</div>
  </div>
  <div class="search-wrap">
    <input class="search-inp" id="searchInp" placeholder="🔍 Rechercher un joueur..." oninput="onSearch(this.value)" autocomplete="off">
  </div>
  <div class="list" id="list">
    <div class="sk-row"><div class="sk" style="width:50px;height:50px;border-radius:50%;flex-shrink:0"></div><div style="flex:1"><div class="sk" style="height:13px;width:45%;margin-bottom:8px"></div><div class="sk" style="height:11px;width:70%"></div></div></div>
    <div class="sk-row"><div class="sk" style="width:50px;height:50px;border-radius:50%;flex-shrink:0"></div><div style="flex:1"><div class="sk" style="height:13px;width:38%;margin-bottom:8px"></div><div class="sk" style="height:11px;width:60%"></div></div></div>
    <div class="sk-row"><div class="sk" style="width:50px;height:50px;border-radius:50%;flex-shrink:0"></div><div style="flex:1"><div class="sk" style="height:13px;width:50%;margin-bottom:8px"></div><div class="sk" style="height:11px;width:75%"></div></div></div>
  </div>
</div>

<!-- VUE CONVERSATION -->
<div class="view slide-hidden" id="convView">
  <div class="conv-hdr">
    <div style="display:flex;align-items:center;gap:12px">
      <button class="hdr-back" id="convBack">←</button>
      <div class="conv-av" id="convAv">⚓</div>
      <div class="conv-info">
        <div class="conv-name" id="convName">—</div>
        <div class="conv-sub" id="convSub">
          <div class="conv-online-dot" id="convOnlineDot" style="display:none"></div>
          <span id="convSubTxt">Docker</span>
        </div>
      </div>
    </div>
  </div>
  <!-- Menu contextuel (accessible via swipe ou long press — conservé pour supprimerConv/voirProfil depuis JS) -->
  <div class="ctx-overlay" id="ctxOverlay" onclick="closeCtxMenu()"></div>
  <div class="ctx-menu" id="ctxMenu">
    <div class="ctx-item" onclick="voirProfil()"><div class="ctx-ico">👤</div>Voir le profil</div>
    <div class="ctx-item danger" onclick="supprimerConv()"><div class="ctx-ico">🗑️</div>Supprimer la conversation</div>
  </div>
  <div class="conv-body" id="convBody" style="background:#f5f5f5"></div>
  <div style="background:#fff;border-top:1px solid #f0f0f0;padding:8px 12px calc(var(--sb)+12px)">
    <div style="display:flex;align-items:center;gap:8px;background:#f2f2f7;border-radius:24px;padding:8px 8px 8px 14px">
      <textarea id="convInp" placeholder="Écris un message..." maxlength="500" rows="1" style="flex:1;background:none;border:none;outline:none;font-size:14px;font-family:'Inter',sans-serif;resize:none;color:#0f172a;max-height:100px;line-height:1.4;-webkit-user-select:text;user-select:text;padding:2px 0"></textarea>
      <button id="convSendBtn" style="background:#cc1a1a;border:none;border-radius:50%;width:36px;height:36px;color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 3px 10px rgba(204,26,26,.35);transition:transform .1s;cursor:pointer">↑</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SB_URL='https://drtsuhnbclhmgfjiykap.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
const sb=supabase.createClient(SB_URL,SB_KEY);
const MAX_MSGS=15;

let me=null, myProfile=null;
let allPlayers=[];        // tous les joueurs du jeu
let convMap={};           // userId → {msgs:[], unread:0, profile:{}}
let tab='convs', convWith=null, convMsgs=[];
let realtimeSub=null, searchQ='';

// ── UTILS ──
const fmt=dt=>{const d=Date.now()-new Date(dt).getTime(),m=Math.floor(d/60000);return m<1?'maintenant':m<60?m+'min':m<1440?Math.floor(m/60)+'h':Math.floor(m/1440)+'j';};
const fmtTime=dt=>{const d=new Date(dt);return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');};
const fmtDate=dt=>{const d=new Date(dt),now=new Date();const diff=Math.floor((now-d)/86400000);if(diff===0)return'Aujourd\'hui';if(diff===1)return'Hier';return d.toLocaleDateString('fr-FR',{day:'numeric',month:'long'});};
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function makeAv(p,size=50){
  const s=`width:${size}px;height:${size}px;border-radius:50%;background:#e5e7eb;display:flex;align-items:center;justify-content:center;font-size:${Math.round(size*.45)}px;overflow:hidden;flex-shrink:0;border:2px solid #f0f0f0`;
  if(p?.avatar_url)return`<div style="${s}"><img src="${p.avatar_url}" style="width:100%;height:100%;object-fit:cover" onerror="this.parentElement.innerHTML='⚓'"></div>`;
  return`<div style="${s}">⚓</div>`;
}

// ── TABS ──
function switchTab(t){
  tab=t;
  ['Convs','Joueurs'].forEach(x=>document.getElementById('tab'+x).classList.remove('active'));
  document.getElementById('tab'+{convs:'Convs',joueurs:'Joueurs'}[t]).classList.add('active');
  renderList();
}

// ── RECHERCHE ──
let searchTimer=null;
function onSearch(v){
  searchQ=(v||'').trim().toLowerCase();
  clearTimeout(searchTimer);
  searchTimer=setTimeout(renderList,200);
}

// ── RENDER LISTE ──
function renderList(){
  const list=document.getElementById('list');
  // Joueurs avec conversations (triés par dernier message)
  const withConv=Object.entries(convMap)
    .filter(([uid,c])=>c.msgs.length>0)
    .sort((a,b)=>{
      const la=a[1].msgs[a[1].msgs.length-1]?.created_at||'';
      const lb=b[1].msgs[b[1].msgs.length-1]?.created_at||'';
      return lb.localeCompare(la);
    });
  // Joueurs sans conv
  const withoutConv=allPlayers.filter(p=>!convMap[p.user_id]||convMap[p.user_id].msgs.length===0);

  // Filtrer par recherche
  const filter=p=>{
    if(!searchQ)return true;
    return (p?.username||'').toLowerCase().includes(searchQ);
  };

  let html='';

  if(tab==='convs'){
    const filtered=withConv.filter(([uid,c])=>filter(c.profile));
    if(filtered.length){
      html+=`<div class="section-hdr">💬 CONVERSATIONS (${filtered.length})</div>`;
      html+=filtered.map(([uid,c])=>{
        const p=c.profile;
        const last=c.msgs[c.msgs.length-1];
        const unread=c.unread>0;
        const preview=last?(last.from_user_id===me.id?'Toi : ':'')+last.message:'';
        return `<div class="player-row${unread?' has-unread':''}" onclick="openConv('${uid}')">
          <div class="av">${makeAv(p,50).replace('<div','<div').replace('</div>',unread?'<div class="unread-dot"></div></div>':'</div>')}
          </div>
          <div class="player-body">
            <div class="player-name${unread?'':' dimmed'}">${p?.username||'Docker'}</div>
            <div class="player-preview${unread?'':' dimmed'}">${preview}</div>
          </div>
          <div class="player-meta">
            <span style="font-size:10px;color:#9ca3af">${last?fmt(last.created_at):''}</span>
            ${unread?`<span class="unread-count">${c.unread>9?'9+':c.unread}</span>`:''}
          </div>
        </div>`;
      }).join('');
    }
  }

  if(tab==='joueurs'){
    const filtered=withoutConv.filter(p=>filter(p));
    if(filtered.length){
      html+=`<div class="section-hdr">👥 TOUS LES JOUEURS (${filtered.length})</div>`;
      html+=filtered.map(p=>`<div class="player-row no-conv" onclick="openConv('${p.user_id}')">
        ${makeAv(p,50)}
        <div class="player-body">
          <div class="player-name dimmed">${p.username||'Docker'}</div>
          <div class="player-preview dimmed">${p.title||'Appuie pour envoyer un message'}</div>
        </div>
        <div style="font-size:18px;color:#d1d5db">→</div>
      </div>`).join('');
    }
  }

  if(!html){
    html='<div class="empty"><div class="empty-ico">📭</div><div class="empty-ttl">AUCUN JOUEUR</div><div class="empty-sub">Personne trouvé</div></div>';
  }
  list.innerHTML=html;
}

function updateBadge(){
  const n=Object.values(convMap).reduce((s,c)=>s+c.unread,0);
  const b=document.getElementById('hdrBadge');
  b.textContent=n>0?(n>9?'9+':n)+' non lu'+(n>1?'s':''):'aucun message';
  try{localStorage.setItem('bd_unread',n);}catch(e){}
}

// ── OUVRIR CONV ──
async function openConv(userId){
  convWith=userId;
  document.getElementById('listView').classList.add('slide-out');
  document.getElementById('convView').classList.remove('slide-hidden');
  // Header
  const c=convMap[userId];
  const p=c?.profile||(allPlayers.find(x=>x.user_id===userId)||{});
  const avEl=document.getElementById('convAv');
  if(p.avatar_url){avEl.innerHTML=`<img src="${p.avatar_url}" style="width:100%;height:100%;object-fit:cover">`;}
  else{avEl.textContent='⚓';}
  document.getElementById('convName').textContent=p.username||'Docker';
  document.getElementById('convSub').textContent=p.title||'Docker';
  // Marquer tout comme lu
  if(c&&c.unread>0){
    c.msgs.filter(m=>!m.read&&m.from_user_id===userId).forEach(m=>{m.read=true;});
    c.unread=0;
    updateBadge();renderList();
    sb.from('challenges').update({read:true}).eq('from_user_id',userId).eq('to_user_id',me.id).then(()=>{});
  }
  // Fusionner + trier + limiter
  const received=(c?.msgs||[]).filter(m=>m.from_user_id===userId);
  const {data:sent}=await sb.from('challenges').select('*').eq('from_user_id',me.id).eq('to_user_id',userId).order('created_at',{ascending:true});
  convMsgs=[...received,...(sent||[])].sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  // Garder max 15
  if(convMsgs.length>MAX_MSGS)convMsgs=convMsgs.slice(-MAX_MSGS);
  renderConv(convMsgs.length>=MAX_MSGS);
  setupConvRealtime();
}

function renderConv(showLimit=false){
  const body=document.getElementById('convBody');
  if(!convMsgs.length){
    body.innerHTML='<div class="empty"><div class="empty-ico">💬</div><div class="empty-ttl">NOUVEAU</div><div class="empty-sub">Envoie le premier message !</div></div>';
    return;
  }
  let lastDate='';
  let html=showLimit?`<div class="limit-notice">⏳ Affichage limité aux ${MAX_MSGS} derniers messages</div>`:'';
  html+=convMsgs.map(m=>{
    const isMe=m.from_user_id===me.id;
    const type=m.type||'chambrage';
    const dateStr=fmtDate(m.created_at);
    let dateSep=dateStr!==lastDate?`<div class="date-sep">${dateStr}</div>`:'';
    lastDate=dateStr;
    const myAvHtml=myProfile?.avatar_url?`<img src="${myProfile.avatar_url}" style="width:100%;height:100%;object-fit:cover">`:'⚓';
    const theirP=convMap[convWith]?.profile||(allPlayers.find(x=>x.user_id===convWith)||{});
    const theirAvHtml=theirP.avatar_url?`<img src="${theirP.avatar_url}" style="width:100%;height:100%;object-fit:cover">`:'⚓';
    const avContent=isMe?myAvHtml:theirAvHtml;
    let content=!isMe&&type==='chambrage'?`<span class="chlbl">🔥 CHAMBRAGE</span>${m.message||''}`:m.message||'';
    const bubbleCls=isMe?'me':type==='chambrage'?'chambrage':'them';
    const check=isMe?`<span class="bcheck">${m.read?'✓✓':'✓'}</span>`:'';
    return `${dateSep}<div class="bubble-row${isMe?' me':''}">
      <div class="bav">${avContent}</div>
      <div class="bubble ${bubbleCls}">${content}<span class="btime">${fmtTime(m.created_at)}${check}</span></div>
    </div>`;
  }).join('');
  body.innerHTML=html;
  body.scrollTop=body.scrollHeight;
}

// ── ENVOYER ──
document.getElementById('convSendBtn').addEventListener('click',sendMsg);
document.getElementById('convInp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}});
document.getElementById('convInp').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px';});

async function sendMsg(){
  const inp=document.getElementById('convInp');
  const msg=(inp.value||'').trim();
  if(!msg||!convWith||!me)return;
  inp.value='';inp.style.height='auto';
  const {data,error}=await sb.from('challenges').insert({from_user_id:me.id,to_user_id:convWith,message:msg,type:'message',read:false}).select().single();
  if(error){toast('❌ Erreur');return;}
  // Ajouter localement
  if(data){convMsgs.push(data);if(convMsgs.length>MAX_MSGS)convMsgs=convMsgs.slice(-MAX_MSGS);renderConv(convMsgs.length>=MAX_MSGS);}
}

// ── RETOUR ──
document.getElementById('convBack').addEventListener('click',()=>{
  document.getElementById('convView').classList.add('slide-hidden');
  document.getElementById('listView').classList.remove('slide-out');
  convWith=null;convMsgs=[];
  if(window._convRT){sb.removeChannel(window._convRT);window._convRT=null;}
  renderList();updateBadge();
});

// ── REALTIME ──
function setupListRealtime(){
  realtimeSub=sb.channel('msgs-in')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'challenges',filter:`to_user_id=eq.${me.id}`},async payload=>{
      const m=payload.new;
      const uid=m.from_user_id;
      if(!convMap[uid]){
        const {data:p}=await sb.from('profiles').select('user_id,username,avatar_url,title').eq('user_id',uid).single();
        convMap[uid]={msgs:[],unread:0,profile:p||{}};
        if(!allPlayers.find(x=>x.user_id===uid)&&p)allPlayers.unshift(p);
      }
      convMap[uid].msgs.push(m);
      if(convWith===uid){
        m.read=true;convMsgs.push(m);if(convMsgs.length>MAX_MSGS)convMsgs=convMsgs.slice(-MAX_MSGS);
        renderConv(convMsgs.length>=MAX_MSGS);
        sb.from('challenges').update({read:true}).eq('id',m.id).then(()=>{});
      } else {
        convMap[uid].unread++;
        updateBadge();renderList();
        toast(`💬 ${convMap[uid].profile?.username||'Docker'} : ${m.message}`);
      }
    })
    .subscribe();
}

function setupConvRealtime(){
  if(window._convRT)sb.removeChannel(window._convRT);
  window._convRT=sb.channel('msgs-out-'+convWith)
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'challenges',filter:`to_user_id=eq.${convWith}`},payload=>{
      const m=payload.new;
      const idx=convMsgs.findIndex(x=>x.id===m.id);
      if(idx>=0){convMsgs[idx]=m;renderConv(convMsgs.length>=MAX_MSGS);}
    })
    .subscribe();
}


// ── MENU CONTEXTUEL ──
function openCtxMenu(e){
  const menu=document.getElementById('ctxMenu');
  const overlay=document.getElementById('ctxOverlay');
  // Position sous le bouton ⋯
  const btn=e.currentTarget;
  const r=btn.getBoundingClientRect();
  menu.style.top=(r.bottom+6)+'px';
  menu.style.right=(window.innerWidth-r.right)+'px';
  menu.classList.add('show');
  overlay.classList.add('show');
}
function closeCtxMenu(){
  document.getElementById('ctxMenu').classList.remove('show');
  document.getElementById('ctxOverlay').classList.remove('show');
}
function voirProfil(){
  closeCtxMenu();
  if(convWith) window.location.href='leprofil.html?uid='+convWith;
}
async function supprimerConv(){
  closeCtxMenu();
  if(!convWith||!me) return;
  if(!confirm('Supprimer toute la conversation avec ce joueur ?')) return;
  // Supprimer messages reçus
  await sb.from('challenges').delete().eq('from_user_id',convWith).eq('to_user_id',me.id);
  // Supprimer messages envoyés
  await sb.from('challenges').delete().eq('from_user_id',me.id).eq('to_user_id',convWith);
  // Nettoyer localement
  delete convMap[convWith];
  toast('💬 Conversation supprimée');
  // Retour à la liste
  document.getElementById('convView').classList.add('slide-hidden');
  document.getElementById('listView').classList.remove('slide-out');
  convWith=null;convMsgs=[];
  renderList();updateBadge();
}

// ── INIT ──
async function init(){
  sb.auth.onAuthStateChange((e,s)=>{if(!s)window.location.href='index.html';});
  const {data,error}=await sb.auth.getSession();
  if(error||!data.session){window.location.href='index.html';return;}
  me=data.session.user;
  const {data:mp}=await sb.from('profiles').select('user_id,username,avatar_url,title').eq('user_id',me.id).single();
  myProfile=mp;
  // Header avatar + nom
  if(mp){
    const hdrUser=document.getElementById('hdrUser');
    if(hdrUser)hdrUser.textContent=mp.username||'Toi';
    const hdrAv=document.getElementById('myAvHdr');
    if(hdrAv&&mp.avatar_url){hdrAv.innerHTML=`<img src="${mp.avatar_url}" style="width:100%;height:100%;object-fit:cover">`;}
  }
  // Charger tous les joueurs
  const {data:players}=await sb.from('profiles').select('user_id,username,avatar_url,title').neq('user_id',me.id).order('last_seen',{ascending:false}).limit(100);
  allPlayers=players||[];
  // Charger tous les messages reçus
  const {data:msgs}=await sb.from('challenges').select('*').eq('to_user_id',me.id).order('created_at',{ascending:true});
  // Grouper par expéditeur
  (msgs||[]).forEach(m=>{
    const uid=m.from_user_id;
    const p=allPlayers.find(x=>x.user_id===uid)||{};
    if(!convMap[uid])convMap[uid]={msgs:[],unread:0,profile:p};
    convMap[uid].msgs.push(m);
    if(!m.read)convMap[uid].unread++;
  });
  updateBadge();
  renderList();
  setupListRealtime();
}
init();
</script>
