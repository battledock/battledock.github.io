<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Messagerie — Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
:root{--st:env(safe-area-inset-top,44px);--sb:env(safe-area-inset-bottom,16px)}
html,body{height:100%;background:#f2f2f7;font-family:'Inter',sans-serif;overflow:hidden}

/* ── VUES ── */
.view{position:fixed;inset:0;display:flex;flex-direction:column;transition:transform .3s cubic-bezier(.4,0,.2,1);background:#f2f2f7}
.view.slide-out{transform:translateX(-30%);pointer-events:none}
.view.slide-hidden{transform:translateX(100%);pointer-events:none}

/* ── HEADER ── */
.hdr{background:linear-gradient(135deg,#cc1a1a,#0f172a);padding:calc(var(--st) + 12px) 14px 12px;display:flex;align-items:center;gap:10px;flex-shrink:0;box-shadow:0 2px 16px rgba(0,0,0,.3)}
.hdr-back{background:rgba(255,255,255,.12);border:none;border-radius:10px;width:36px;height:36px;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hdr-title{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#fff;letter-spacing:2px;flex:1}
.hdr-badge{background:#fbbf24;border-radius:20px;font-family:'Bebas Neue',sans-serif;font-size:12px;color:#0f172a;padding:3px 10px;display:none}

/* ── REALTIME BAR ── */
.rt-bar{background:#f0fdf4;border-bottom:1px solid #dcfce7;padding:5px 14px;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:#16a34a;flex-shrink:0}
.rt-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;animation:rtPulse 1.5s infinite}
@keyframes rtPulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ── TABS ── */
.tabs{display:flex;background:#fff;border-bottom:1px solid #f0f0f0;flex-shrink:0}
.tab{flex:1;padding:10px 4px;text-align:center;font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:1px;color:#9ca3af;cursor:pointer;border-bottom:3px solid transparent;transition:all .15s}
.tab.active{color:#cc1a1a;border-bottom-color:#cc1a1a}

/* ── LISTE ── */
.list{flex:1;overflow-y:auto;background:#fff;-webkit-overflow-scrolling:touch}
.date-sep{text-align:center;padding:8px 0;font-size:10px;font-weight:700;color:#9ca3af;letter-spacing:1px;background:#f9fafb;border-bottom:1px solid #f3f4f6}
.msg-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #f9fafb;cursor:pointer;transition:background .1s;position:relative;active-background:#f9fafb}
.msg-item:active{background:#f9fafb}
.msg-item.unread{background:#fff8f8}
.av-wrap{position:relative;flex-shrink:0}
.av{width:50px;height:50px;border-radius:50%;background:#e5e7eb;display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden;border:2px solid #f0f0f0}
.av img{width:100%;height:100%;object-fit:cover}
.unread-dot{position:absolute;top:1px;right:1px;width:12px;height:12px;background:#cc1a1a;border:2.5px solid #fff;border-radius:50%}
.online-dot{position:absolute;bottom:2px;right:2px;width:11px;height:11px;background:#22c55e;border:2.5px solid #fff;border-radius:50%}
.msg-body{flex:1;min-width:0}
.msg-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px}
.msg-name{font-weight:900;font-size:14px;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.msg-name.read{font-weight:600;color:#6b7280}
.msg-time{font-size:10px;color:#9ca3af;flex-shrink:0;margin-left:8px}
.msg-prev{font-size:12px;color:#374151;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.msg-prev.read{color:#9ca3af}
.msg-meta{display:flex;align-items:center;gap:5px;margin-top:3px}
.badge{font-size:9px;font-weight:800;padding:2px 7px;border-radius:20px;letter-spacing:.5px}
.badge.message{background:#dbeafe;color:#1d4ed8}
.badge.chambrage{background:#fef3c7;color:#d97706}
.badge.système{background:#f3f4f6;color:#6b7280}
.check{font-size:10px;color:#22c55e;margin-left:auto}

/* ── VUE CONVERSATION ── */
#convView{background:#f2f2f7}
.conv-hdr{background:linear-gradient(135deg,#cc1a1a,#0f172a);padding:calc(var(--st) + 8px) 14px 10px;display:flex;align-items:center;gap:10px;flex-shrink:0;box-shadow:0 2px 16px rgba(0,0,0,.3)}
.conv-av{width:40px;height:40px;border-radius:50%;background:#dbeafe;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;overflow:hidden;border:2px solid rgba(255,255,255,.2);position:relative}
.conv-av img{width:100%;height:100%;object-fit:cover}
.conv-online{position:absolute;bottom:0;right:0;width:11px;height:11px;background:#22c55e;border:2px solid rgba(204,26,26,.8);border-radius:50%}
.conv-info{flex:1;min-width:0}
.conv-name{font-family:'Bebas Neue',sans-serif;font-size:18px;color:#fff;letter-spacing:1px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-status{font-size:10px;color:rgba(255,255,255,.5);margin-top:1px}

/* ── MESSAGES ── */
.conv-body{flex:1;overflow-y:auto;padding:12px 14px 8px;display:flex;flex-direction:column;gap:6px;-webkit-overflow-scrolling:touch}
.bubble-row{display:flex;align-items:flex-end;gap:6px}
.bubble-row.me{flex-direction:row-reverse}
.bubble-av{width:28px;height:28px;border-radius:50%;background:#e5e7eb;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;overflow:hidden}
.bubble-av img{width:100%;height:100%;object-fit:cover}
.bubble{max-width:74%;padding:10px 13px;border-radius:18px;font-size:13px;line-height:1.55;position:relative;word-break:break-word}
.bubble.them{background:#fff;border:1px solid #f0f0f0;border-bottom-left-radius:4px;color:#0f172a;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.bubble.me{background:linear-gradient(135deg,#cc1a1a,#991111);color:#fff;border-bottom-right-radius:4px;box-shadow:0 2px 10px rgba(204,26,26,.3)}
.bubble-time{font-size:9px;opacity:.55;margin-top:5px;display:block;text-align:right}
.bubble-check{font-size:10px;color:rgba(255,255,255,.6);margin-left:3px}
/* Chambrage */
.bubble.chambrage{background:linear-gradient(135deg,#fef3c7,#fde68a);color:#78350f;border:1px solid #fcd34d;border-bottom-left-radius:4px}
.chambrage-lbl{font-size:9px;font-weight:900;color:#d97706;letter-spacing:1px;margin-bottom:5px;display:block}
/* Système */
.sys-msg{text-align:center;padding:6px 16px;background:rgba(0,0,0,.05);border-radius:20px;font-size:11px;color:#9ca3af;font-weight:600;margin:4px auto;max-width:260px}
/* Typing */
.typing-row{display:flex;align-items:center;gap:6px;padding:2px 0}
.typing-bubbles{background:#fff;border:1px solid #f0f0f0;border-radius:18px;border-bottom-left-radius:4px;padding:10px 14px;display:flex;gap:4px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.typing-dot{width:7px;height:7px;border-radius:50%;background:#9ca3af;animation:typBounce 1s infinite}
.typing-dot:nth-child(2){animation-delay:.2s}
.typing-dot:nth-child(3){animation-delay:.4s}
@keyframes typBounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}

/* ── INPUT ── */
.conv-input{background:#fff;border-top:1px solid #f0f0f0;padding:10px 12px calc(var(--sb) + 10px);display:flex;align-items:flex-end;gap:8px;flex-shrink:0}
.inp-field{flex:1;background:#f2f2f7;border:none;border-radius:20px;padding:10px 14px;font-size:14px;font-family:'Inter',sans-serif;resize:none;outline:none;color:#0f172a;max-height:100px;line-height:1.4;-webkit-user-select:text;user-select:text}
.inp-send{background:#cc1a1a;border:none;border-radius:50%;width:38px;height:38px;color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(204,26,26,.35);transition:transform .1s}
.inp-send:active{transform:scale(.9)}

/* ── EMPTY ── */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;color:#9ca3af}
.empty-ico{font-size:52px;margin-bottom:12px}
.empty-ttl{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;color:#d1d5db;margin-bottom:6px}
.empty-sub{font-size:11px;text-align:center;line-height:1.5}
.conv-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;color:#9ca3af}
.conv-empty-ico{font-size:44px;margin-bottom:8px}
.conv-empty-txt{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:1px;color:#d1d5db;margin-bottom:4px}
.conv-empty-sub{font-size:11px;text-align:center;line-height:1.5}

/* ── SKELETON ── */
.sk-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #f9fafb}
.sk{background:linear-gradient(90deg,#f3f4f6 25%,#e5e7eb 50%,#f3f4f6 75%);background-size:400px;animation:skAnim 1.2s infinite;border-radius:6px}
@keyframes skAnim{0%{background-position:-400px 0}100%{background-position:400px 0}}

/* ── TOAST ── */
.toast{position:fixed;top:calc(var(--st) + 14px);left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:9px 18px;border-radius:20px;font-size:12px;font-weight:700;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>

<!-- ── VUE LISTE ── -->
<div class="view" id="listView">
  <div class="hdr">
    <button class="hdr-back" onclick="window.location.href='game.html'">←</button>
    <div class="hdr-title">✉️ MESSAGERIE</div>
    <div class="hdr-badge" id="hdrBadge">0</div>
  </div>
  <div class="rt-bar"><div class="rt-dot"></div> TEMPS RÉEL · EN DIRECT</div>
  <div class="tabs">
    <div class="tab active" id="tabAll" onclick="switchTab('all')">TOUS</div>
    <div class="tab" id="tabMsg" onclick="switchTab('message')">MESSAGES</div>
    <div class="tab" id="tabChamb" onclick="switchTab('chambrage')">CHAMBRAGES</div>
  </div>
  <div class="list" id="list">
    <div class="sk-item"><div class="sk" style="width:50px;height:50px;border-radius:50%;flex-shrink:0"></div><div style="flex:1"><div class="sk" style="height:13px;width:45%;margin-bottom:7px"></div><div class="sk" style="height:11px;width:72%"></div></div></div>
    <div class="sk-item"><div class="sk" style="width:50px;height:50px;border-radius:50%;flex-shrink:0"></div><div style="flex:1"><div class="sk" style="height:13px;width:38%;margin-bottom:7px"></div><div class="sk" style="height:11px;width:65%"></div></div></div>
  </div>
</div>

<!-- ── VUE CONVERSATION ── -->
<div class="view slide-hidden" id="convView">
  <div class="conv-hdr">
    <button class="hdr-back" id="convBack">←</button>
    <div class="conv-av" id="convAv">⚓</div>
    <div class="conv-info">
      <div class="conv-name" id="convName">—</div>
      <div class="conv-status" id="convStatus">Docker</div>
    </div>
  </div>
  <div class="conv-body" id="convBody">
    <div class="conv-empty">
      <div class="conv-empty-ico">💬</div>
      <div class="conv-empty-txt">CHARGEMENT...</div>
    </div>
  </div>
  <div class="conv-input">
    <textarea class="inp-field" id="convInp" placeholder="Écris un message..." maxlength="500" rows="1"></textarea>
    <button class="inp-send" id="convSend">↑</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SB_URL='https://drtsuhnbclhmgfjiykap.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
const sb=supabase.createClient(SB_URL,SB_KEY);

let me=null, myProfile=null, all=[], tab='all', convWith=null, convMsgs=[], realtimeSub=null, convRealtimeSub=null;

// ── UTILS ──
const fmt=dt=>{const d=Date.now()-new Date(dt).getTime(),m=Math.floor(d/60000);return m<1?'maintenant':m<60?m+'min':m<1440?Math.floor(m/60)+'h':Math.floor(m/1440)+'j';};
const fmtTime=dt=>{const d=new Date(dt);return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');};
const fmtDate=dt=>{const d=new Date(dt),now=new Date();const diff=Math.floor((now-d)/86400000);if(diff===0)return'Aujourd\'hui';if(diff===1)return'Hier';return d.toLocaleDateString('fr-FR',{day:'numeric',month:'long'});};
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function avHtml(profile,size=50){const s=`width:${size}px;height:${size}px;border-radius:50%;background:#e5e7eb;display:flex;align-items:center;justify-content:center;font-size:${Math.round(size*.46)}px;overflow:hidden;flex-shrink:0;border:2px solid #f0f0f0`;if(profile?.avatar_url)return`<div style="${s}"><img src="${profile.avatar_url}" style="width:100%;height:100%;object-fit:cover" onerror="this.parentElement.textContent='⚓'"></div>`;return`<div style="${s}">⚓</div>`;}

// ── ONGLETS ──
function switchTab(t){
  tab=t;
  document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));
  document.getElementById('tab'+{all:'All',message:'Msg',chambrage:'Chamb'}[t]).classList.add('active');
  renderList();
}

// ── LISTE ──
function renderList(){
  const items=tab==='all'?all:all.filter(m=>(m.type||'chambrage')===tab);
  const list=document.getElementById('list');
  if(!items.length){
    list.innerHTML='<div class="empty"><div class="empty-ico">📭</div><div class="empty-ttl">AUCUN MESSAGE</div><div class="empty-sub">Les chambrages et messages<br>des autres dockers apparaîtront ici</div></div>';
    return;
  }
  // Grouper par expéditeur + derniers messages
  // Afficher chaque message (simplifié — pas de déduplication expéditeur pour garder tous les chambrages)
  let lastDate='';
  list.innerHTML=items.map(m=>{
    const unread=!m.read;
    const type=m.type||'chambrage';
    const p=m._profile;
    const dateStr=fmtDate(m.created_at);
    let dateSep=dateStr!==lastDate?`<div class="date-sep">${dateStr}</div>`:'';
    lastDate=dateStr;
    return `${dateSep}<div class="msg-item${unread?' unread':''}" onclick="openConv('${m.from_user_id}','${m.id}')">
      <div class="av-wrap">
        ${avHtml(p,50)}
        ${unread?'<div class="unread-dot"></div>':''}
      </div>
      <div class="msg-body">
        <div class="msg-top">
          <div class="msg-name${unread?'':' read'}">${p?.username||'Docker'}</div>
          <div class="msg-time">${fmt(m.created_at)}</div>
        </div>
        <div class="msg-prev${unread?'':' read'}">${m.message||''}</div>
        <div class="msg-meta">
          <span class="badge ${type}">${type==='message'?'✉️ Message':'🔥 Chambrage'}</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

function updateBadge(){
  const n=all.filter(m=>!m.read).length;
  const b=document.getElementById('hdrBadge');
  b.style.display=n>0?'block':'none';
  if(n>0)b.textContent=n>9?'9+':n;
  const total=all.length,msgs=all.filter(m=>(m.type||'chambrage')==='message').length,chambs=all.filter(m=>(m.type||'chambrage')==='chambrage').length;
  document.getElementById('tabAll').textContent='TOUS'+(total?` (${total})`:'');
  document.getElementById('tabMsg').textContent='MESSAGES'+(msgs?` (${msgs})`:'');
  document.getElementById('tabChamb').textContent='CHAMBRAGES'+(chambs?` (${chambs})`:'');
  try{localStorage.setItem('bd_unread',n);}catch(e){}
}

// ── OUVRIR CONVERSATION ──
async function openConv(userId, msgId){
  convWith=userId;
  // Transition
  document.getElementById('listView').classList.add('slide-out');
  document.getElementById('convView').classList.remove('slide-hidden');
  // Charger profil
  const {data:prof}=await sb.from('profiles').select('*').eq('user_id',userId).single();
  const p=prof||{};
  // Header conv
  const avEl=document.getElementById('convAv');
  if(p.avatar_url){avEl.innerHTML=`<img src="${p.avatar_url}" style="width:100%;height:100%;object-fit:cover">`;} else{avEl.textContent='⚓';}
  document.getElementById('convName').textContent=p.username||'Docker';
  document.getElementById('convStatus').textContent=(p.grade||'Docker');
  // Marquer comme lu
  if(msgId){
    sb.from('challenges').update({read:true}).eq('id',msgId).then(()=>{});
    const m=all.find(x=>x.id===msgId);if(m)m.read=true;
    updateBadge();
  }
  // Charger historique
  await loadConv();
  // Realtime conversation
  setupConvRealtime();
}

async function loadConv(){
  const body=document.getElementById('convBody');
  // Charger les messages dans les deux sens (envoyés + reçus)
  const {data:received}=await sb.from('challenges')
    .select('*').eq('to_user_id',me.id).eq('from_user_id',convWith)
    .order('created_at',{ascending:true});
  const {data:sent}=await sb.from('challenges')
    .select('*').eq('from_user_id',me.id).eq('to_user_id',convWith)
    .order('created_at',{ascending:true});
  // Fusionner + trier
  convMsgs=[...(received||[]),...(sent||[])].sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  renderConv();
}

function renderConv(){
  const body=document.getElementById('convBody');
  if(!convMsgs.length){
    body.innerHTML='<div class="conv-empty"><div class="conv-empty-ico">💬</div><div class="conv-empty-txt">DÉBUT DE LA CONVERSATION</div><div class="conv-empty-sub">Envoie le premier message !</div></div>';
    return;
  }
  let lastDate='';
  body.innerHTML=convMsgs.map(m=>{
    const isMe=m.from_user_id===me.id;
    const type=m.type||'chambrage';
    const dateStr=fmtDate(m.created_at);
    let dateSep=dateStr!==lastDate?`<div class="date-sep" style="font-size:10px;font-weight:700;color:#9ca3af;text-align:center;padding:8px 0;letter-spacing:1px">${dateStr}</div>`:'';
    lastDate=dateStr;
    const avEmoji=isMe?(myProfile?.avatar_url?`<img src="${myProfile.avatar_url}" style="width:100%;height:100%;object-fit:cover">`:'⚓'):(convWith?'👤':'⚓');
    let bubbleContent='';
    if(type==='chambrage'&&!isMe){
      bubbleContent=`<span class="chambrage-lbl">🔥 CHAMBRAGE</span>${m.message||''}`;
    } else {
      bubbleContent=m.message||'';
    }
    const bubbleClass=isMe?'me':type==='chambrage'?'chambrage':'them';
    const checkMark=isMe?`<span class="bubble-check">${m.read?'✓✓':'✓'}</span>`:'';
    return `${dateSep}<div class="bubble-row${isMe?' me':''}">
      <div class="bubble-av">${avEmoji}</div>
      <div class="bubble ${bubbleClass}">
        ${bubbleContent}
        <span class="bubble-time">${fmtTime(m.created_at)}${checkMark}</span>
      </div>
    </div>`;
  }).join('');
  // Scroller en bas
  body.scrollTop=body.scrollHeight;
}

// ── ENVOYER MESSAGE ──
document.getElementById('convSend').addEventListener('click',sendMsg);
document.getElementById('convInp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}});
// Auto-resize textarea
document.getElementById('convInp').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px';});

async function sendMsg(){
  const inp=document.getElementById('convInp');
  const msg=(inp.value||'').trim();
  if(!msg||!convWith||!me)return;
  inp.value='';inp.style.height='auto';
  const {error}=await sb.from('challenges').insert({
    from_user_id:me.id, to_user_id:convWith,
    message:msg, type:'message', read:false
  });
  if(error){toast('❌ Erreur envoi');return;}
  // Pas besoin de recharger — realtime va le faire
}

// ── RETOUR ──
document.getElementById('convBack').addEventListener('click',()=>{
  document.getElementById('convView').classList.add('slide-hidden');
  document.getElementById('listView').classList.remove('slide-out');
  convWith=null;convMsgs=[];
  if(convRealtimeSub){sb.removeChannel(convRealtimeSub);convRealtimeSub=null;}
  renderList();
  updateBadge();
});

// ── REALTIME LISTE ──
function setupListRealtime(){
  realtimeSub=sb.channel('liste-msgs')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'challenges',filter:`to_user_id=eq.${me.id}`},async payload=>{
      const m=payload.new;
      const {data:prof}=await sb.from('profiles').select('username,avatar_url').eq('user_id',m.from_user_id).single();
      all.unshift({...m,_profile:prof||{}});
      updateBadge();
      renderList();
      // Si on est dans cette conversation, ajouter le message
      if(convWith===m.from_user_id){
        convMsgs.push(m);renderConv();
        // Marquer lu immédiatement
        sb.from('challenges').update({read:true}).eq('id',m.id).then(()=>{});
      }
    })
    .subscribe();
}

// ── REALTIME CONVERSATION ──
function setupConvRealtime(){
  if(convRealtimeSub){sb.removeChannel(convRealtimeSub);}
  convRealtimeSub=sb.channel('conv-'+convWith)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'challenges',filter:`from_user_id=eq.${me.id}`},payload=>{
      const m=payload.new;
      if(m.to_user_id===convWith){convMsgs.push(m);renderConv();}
    })
    .subscribe();
}

// ── INIT ──
async function init(){
  sb.auth.onAuthStateChange((e,s)=>{if(!s)window.location.href='index.html';});
  const {data,error}=await sb.auth.getSession();
  if(error||!data.session){window.location.href='index.html';return;}
  me=data.session.user;
  // Charger mon profil
  const {data:mp}=await sb.from('profiles').select('*').eq('user_id',me.id).single();
  myProfile=mp;
  // Charger messages reçus
  const {data:msgs}=await sb.from('challenges')
    .select('*').eq('to_user_id',me.id)
    .order('created_at',{ascending:false});
  if(!msgs||!msgs.length){
    document.getElementById('list').innerHTML='<div class="empty"><div class="empty-ico">📭</div><div class="empty-ttl">AUCUN MESSAGE</div><div class="empty-sub">Les chambrages et messages<br>des autres dockers apparaîtront ici</div></div>';
    updateBadge();
    setupListRealtime();
    return;
  }
  // Enrichir avec profils
  const uids=[...new Set(msgs.map(m=>m.from_user_id))];
  const {data:profs}=await sb.from('profiles').select('user_id,username,avatar_url,grade').in('user_id',uids);
  const pm={};(profs||[]).forEach(p=>pm[p.user_id]=p);
  all=msgs.map(m=>({...m,_profile:pm[m.from_user_id]||{}}));
  updateBadge();
  renderList();
  setupListRealtime();
}
init();
</script>
