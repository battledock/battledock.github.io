<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Crash - Battle Dock Casino</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      -moz-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(180deg, #450a0a, #7f1d1d, #991b1b);
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 6px;
      padding-bottom: 120px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    /* GAME AREA */
    .game-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 10px;
      overflow: hidden;
      min-height: 0;
    }

    /* CRASH DISPLAY */
    .crash-display {
      width: 100%;
      height: clamp(200px, 50vh, 280px);
      background: linear-gradient(135deg, #0f172a, #1e293b);
      border: 3px solid #fbbf24;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    .rocket {
      position: absolute;
      bottom: 20px;
      left: 20px;
      font-size: 40px;
      transition: all 0.1s linear;
      transform-origin: center;
    }

    .multiplier-display {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(48px, 12vw, 72px);
      color: #10b981;
      text-shadow: 0 4px 12px rgba(16, 185, 129, 0.8);
      letter-spacing: 2px;
    }

    .multiplier-display.crashed {
      color: #dc2626;
      text-shadow: 0 4px 12px rgba(220, 38, 38, 0.8);
    }

    .status-text {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      color: #fbbf24;
      letter-spacing: 1px;
    }

    /* CONTROLS */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      max-width: 340px;
      flex-shrink: 0;
    }

    .bet-control {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 10px;
      border-radius: 8px;
      border: 2px solid rgba(251, 191, 36, 0.3);
    }

    .bet-control label {
      font-weight: 700;
      font-size: 11px;
      color: #fbbf24;
      white-space: nowrap;
    }

    .bet-control input {
      flex: 1;
      padding: 6px;
      border: 2px solid #fbbf24;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      max-width: 100px;
    }

    .actions {
      display: flex;
      gap: 6px;
    }

    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      letter-spacing: 1.5px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #0f172a;
    }

    .btn-danger {
      background: linear-gradient(135deg, #dc2626, #991b1b);
      color: white;
    }

    /* RESULT */
    .result {
      display: none;
      padding: 8px 14px;
      border-radius: 10px;
      text-align: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 14px;
      letter-spacing: 1px;
      margin-top: 6px;
    }

    .result.win {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
    }

    .result.lose {
      background: linear-gradient(135deg, #dc2626, #991b1b);
      color: white;
    }

    /* BOTTOM BAR */
    .bottom-bar {
      background: linear-gradient(135deg, #7f1d1d, #991b1b);
      border: 2px solid rgba(251, 191, 36, 0.5);
      border-radius: 10px;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      min-height: 44px;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 480px;
      width: calc(100% - 20px);
      z-index: 100;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.5);
    }

    .back-btn {
      background: rgba(251, 191, 36, 0.2);
      border: 2px solid rgba(251, 191, 36, 0.5);
      color: #fbbf24;
      border-radius: 6px;
      padding: 4px 10px;
      font-weight: 700;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .back-btn:active {
      transform: scale(0.95);
    }

    .game-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      color: #fbbf24;
      letter-spacing: 1.5px;
      white-space: nowrap;
    }

    .balance {
      background: white;
      color: #0f172a;
      padding: 4px 10px;
      border-radius: 6px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    @media (max-width: 400px) {
      .bottom-bar {
        padding: 5px 8px;
        bottom: 15px;
      }

      .back-btn {
        padding: 3px 8px;
        font-size: 10px;
      }

      .game-title {
        font-size: 14px;
      }

      .balance {
        padding: 3px 8px;
        font-size: 12px;
      }

      .crash-display {
        height: clamp(180px, 45vh, 240px);
      }

      .rocket {
        font-size: 32px;
      }
    }

    @media (max-width: 320px) {
      .bottom-bar {
        bottom: 10px;
      }

      .back-btn {
        padding: 2px 6px;
        font-size: 9px;
      }

      .game-title {
        font-size: 12px;
        letter-spacing: 1px;
      }

      .balance {
        font-size: 11px;
        padding: 2px 6px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="game-area">
      <!-- CRASH DISPLAY -->
      <div class="crash-display">
        <div class="status-text" id="statusText">Prêt à décoller</div>
        <div class="rocket" id="rocket">🚀</div>
        <div class="multiplier-display" id="multiplier">1.00×</div>
      </div>

      <!-- CONTROLS -->
      <div class="controls">
        <div class="bet-control">
          <label>MISE:</label>
          <input type="number" id="betAmount" value="50" min="10" step="10">
        </div>
        <div class="actions">
          <button class="btn btn-primary" id="startBtn" onclick="startGame()">DÉCOLLER 🚀</button>
          <button class="btn btn-danger" id="cashoutBtn" onclick="cashout()" style="display: none;">ENCAISSER 💰</button>
        </div>
        <div class="result" id="result"></div>
      </div>
    </div>

    <!-- BOTTOM BAR -->
    <div class="bottom-bar">
      <button class="back-btn" onclick="window.location.href='casino.html'">← Casino</button>
      <div class="game-title">🚀 CRASH</div>
      <div class="balance" id="balance">0€</div>
    </div>
  </div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const sb = createClient(supabaseUrl, supabaseKey);

    let currentUser = null;
    let currentMoney = 0;
    let gameActive = false;
    let currentMultiplier = 1.0;
    let crashPoint = 1.0;
    let interval = null;
    let currentBet = 0;

async function loadMoney() {
      let retries = 3;
      while (retries > 0) {
        const { data: stats, error } = await sb
          .from('game_stats').select('money').eq('user_id', currentUser.id).single();
        if (error) { retries--; if (retries > 0) await new Promise(r => setTimeout(r, 500)); continue; }
        currentMoney = stats?.money || 0;
        const el = document.getElementById('balance');
        if (el) el.textContent = currentMoney.toLocaleString('fr-FR') + '€';
        return;
      }
    }

    async function updateMoney(newAmount) {
      const { error } = await sb.from('game_stats').update({ money: newAmount }).eq('user_id', currentUser.id);
      if (error) { console.error('updateMoney:', error.message); return; }
      currentMoney = newAmount;
      const el = document.getElementById('balance');
      if (el) el.textContent = currentMoney.toLocaleString('fr-FR') + '€';
    }

    async function recordBet(gameName, amountBet) {
      try {
        const username = (currentUser.email || '').split('@')[0] || 'Docker';
        await sb.from('casino_wins').insert({ user_id: currentUser.id, user_name: username, game_name: gameName, amount_bet: amountBet, amount_won: 0 });
        const contrib = Math.max(1, Math.floor(amountBet * 0.05));
        try { const { error: jErr } = await sb.rpc('increment_jackpot', { amount: contrib }); if(jErr) console.log('jackpot error:', jErr); } catch(e) {}
      } catch(e) { console.log('recordBet:', e.message); }
    }

    async function recordWin(gameName, amountWon) {
      try {
        const username = (currentUser.email || '').split('@')[0] || 'Docker';
        await sb.from('casino_wins').insert({ user_id: currentUser.id, user_name: username, game_name: gameName, amount_bet: 0, amount_won: amountWon });
      } catch(e) { console.log('recordWin:', e.message); }
    }

    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        await new Promise(r => setTimeout(r, 1000));
        const { data: { session: s2 } } = await sb.auth.getSession();
        if (!s2) { window.location.href = 'index.html'; return; }
        currentUser = s2.user;
      } else {
        currentUser = session.user;
      }
      await loadMoney();
    } } = await sb.auth.getSession();
      if (!session) {
        window.location.href = 'index.html';
        return;
      }
      currentUser = session.user;
      await loadMoney();
    }



    async function startGame() {
      const betInput = document.getElementById('betAmount');
      const bet = parseInt(betInput.value);

      if (bet < 10) {
        alert('Mise minimum : 10€');
        return;
      }

      if (bet > currentMoney) {
        alert('Solde insuffisant !');
        return;
      }

      currentBet = bet;
      gameActive = true;
      currentMultiplier = 1.0;

      // Déduire la mise
      await updateMoney(currentMoney - bet);
      await recordBet('Crash', bet);

      // Déterminer crash point (RTP 90%)
      const rand = Math.random();
      if (rand < 0.4) crashPoint = 1.0 + Math.random() * 0.5; // 40% entre 1.0-1.5x
      else if (rand < 0.7) crashPoint = 1.5 + Math.random() * 1.5; // 30% entre 1.5-3x
      else if (rand < 0.9) crashPoint = 3.0 + Math.random() * 4.0; // 20% entre 3-7x
      else crashPoint = 7.0 + Math.random() * 8.0; // 10% entre 7-15x

      document.getElementById('startBtn').style.display = 'none';
      document.getElementById('cashoutBtn').style.display = 'block';
      document.getElementById('result').style.display = 'none';
      document.getElementById('statusText').textContent = '🚀 EN VOL';
      document.getElementById('multiplier').className = 'multiplier-display';

      const rocket = document.getElementById('rocket');
      let position = 20;

      interval = setInterval(() => {
        currentMultiplier += 0.01;
        position += 1;

        rocket.style.bottom = position + 'px';
        rocket.style.left = (20 + position * 0.3) + 'px';
        rocket.style.transform = `rotate(${Math.min(position * 0.5, 45)}deg)`;

        document.getElementById('multiplier').textContent = currentMultiplier.toFixed(2) + '×';

        if (currentMultiplier >= crashPoint) {
          crash();
        }
      }, 100);
    }

    function crash() {
      clearInterval(interval);
      gameActive = false;

      document.getElementById('startBtn').style.display = 'block';
      document.getElementById('cashoutBtn').style.display = 'none';
      document.getElementById('statusText').textContent = '💥 CRASH !';
      document.getElementById('multiplier').classList.add('crashed');

      const res = document.getElementById('result');
      res.className = 'result lose';
      res.innerHTML = `💥 CRASH à ${crashPoint.toFixed(2)}× - Perdu ${currentBet.toLocaleString('fr-FR')}€`;
      res.style.display = 'block';

      // Reset rocket
      setTimeout(() => {
        document.getElementById('rocket').style.bottom = '20px';
        document.getElementById('rocket').style.left = '20px';
        document.getElementById('rocket').style.transform = 'rotate(0deg)';
        document.getElementById('statusText').textContent = 'Prêt à décoller';
        document.getElementById('multiplier').textContent = '1.00×';
        document.getElementById('multiplier').classList.remove('crashed');
      }, 2000);
    }

    async function cashout() {
      if (!gameActive) return;

      clearInterval(interval);
      gameActive = false;

      const win = Math.floor(currentBet * currentMultiplier);

      document.getElementById('startBtn').style.display = 'block';
      document.getElementById('cashoutBtn').style.display = 'none';
      document.getElementById('statusText').textContent = '💰 ENCAISSÉ !';

      const res = document.getElementById('result');
      res.className = 'result win';
      res.innerHTML = `🎉 Encaissé à ${currentMultiplier.toFixed(2)}× = +${win.toLocaleString('fr-FR')}€`;
      res.style.display = 'block';

      await updateMoney(currentMoney + win);
      await recordWin('Crash', win);

      // Reset rocket
      setTimeout(() => {
        document.getElementById('rocket').style.bottom = '20px';
        document.getElementById('rocket').style.left = '20px';
        document.getElementById('rocket').style.transform = 'rotate(0deg)';
        document.getElementById('statusText').textContent = 'Prêt à décoller';
        document.getElementById('multiplier').textContent = '1.00×';
      }, 2000);
    }

    // Anti-zoom
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('gesturechange', e => e.preventDefault());

    init();
  </script>
</body>
</html>
