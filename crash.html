<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crash - Casino</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
      min-height: 100vh;
      padding: 16px;
      padding-bottom: 80px;
    }

    .container { max-width: 700px; margin: 0 auto; }

    .header {
      background: white;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    .game-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      color: #4f46e5;
      letter-spacing: 3px;
      margin-bottom: 16px;
    }

    .balance {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      color: #1a1a1a;
      letter-spacing: 1px;
    }

    .game-area {
      background: linear-gradient(135deg, #312e81 0%, #1e1b4b 100%);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      position: relative;
      overflow: hidden;
    }

    .graph-area {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px;
      height: 250px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }

    .rocket {
      position: absolute;
      font-size: 48px;
      bottom: 20px;
      left: 20px;
      transition: all 0.1s linear;
    }

    .multiplier-display {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 72px;
      color: white;
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.8);
      letter-spacing: 3px;
    }

    .multiplier-display.crashed {
      color: #ef4444;
      animation: pulse-crash 0.5s;
    }

    @keyframes pulse-crash {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.2); }
    }

    .controls {
      text-align: center;
    }

    .bet-input {
      margin-bottom: 20px;
    }

    .bet-input input {
      width: 200px;
      padding: 14px;
      border: 3px solid #818cf8;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 700;
      text-align: center;
    }

    .btn {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      border: none;
      border-radius: 16px;
      padding: 18px 48px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
    }

    .btn:disabled {
      background: #6b7280;
      cursor: not-allowed;
      transform: none;
    }

    .btn-cashout {
      background: linear-gradient(135deg, #10b981, #059669);
      display: none;
    }

    .result {
      margin-top: 20px;
      padding: 20px;
      border-radius: 12px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      display: none;
    }

    .result.win {
      background: #d1fae5;
      color: #065f46;
      border: 3px solid #10b981;
    }

    .result.lose {
      background: #fee2e2;
      color: #991b1b;
      border: 3px solid #dc2626;
    }

    /* LEADERBOARD */
    .leaderboard {
      background: white;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .leaderboard-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      color: #4f46e5;
      letter-spacing: 2px;
      margin-bottom: 16px;
      text-align: center;
    }

    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #f3f4f6;
      border-radius: 8px;
      font-weight: 600;
    }

    .leaderboard-item.top-1 {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: white;
    }

    .leaderboard-item.top-2 {
      background: linear-gradient(135deg, #d1d5db, #9ca3af);
      color: white;
    }

    .leaderboard-item.top-3 {
      background: linear-gradient(135deg, #fb923c, #f97316);
      color: white;
    }

    .rank {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      min-width: 40px;
    }

    .username {
      flex: 1;
      padding-left: 12px;
    }

    .mult {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      letter-spacing: 1px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      padding: 12px 16px;
      box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.1);
      z-index: 100;
    }

    .nav-btn {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      display: flex;
      background: linear-gradient(135deg, #1e1b4b, #312e81);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="game-title">🚀 CRASH</div>
      <div class="balance" id="balance">0€</div>
    </div>

    <div class="game-area">
      <div class="graph-area" id="graphArea">
        <div class="rocket" id="rocket">🚀</div>
        <div class="multiplier-display" id="multiplier">×1.00</div>
      </div>

      <div class="controls">
        <div id="betScreen">
          <div class="bet-input">
            <input type="number" id="betAmount" value="100" min="100" step="50" placeholder="Mise">
          </div>
          <button class="btn" onclick="launch()">🚀 LANCER</button>
        </div>

        <div id="playScreen" style="display: none;">
          <button class="btn btn-cashout" id="cashoutBtn" onclick="cashout()">
            💰 ENCAISSER <span id="cashoutAmount">0€</span>
          </button>
        </div>

        <div class="result" id="result"></div>
      </div>
    </div>

    <!-- LEADERBOARD -->
    <div class="leaderboard">
      <div class="leaderboard-title">🏆 TOP MULTIPLICATEURS</div>
      <div class="leaderboard-list" id="leaderboard">
        <div style="text-align: center; color: #6b7280; padding: 20px;">
          Chargement...
        </div>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-btn" onclick="window.location.href='casino-menu.html'">
      ← RETOUR CASINO
    </button>
  </div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const sb = createClient(supabaseUrl, supabaseKey);

    let currentUser, userMoney = 0, bet = 0, mult = 1.00, interval, crashPoint, hasCashedOut = false;

    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { window.location.href = 'index.html'; return; }
      currentUser = session.user;
      await loadMoney();
      await loadLeaderboard();
      setInterval(loadLeaderboard, 10000);
    }

    async function loadMoney() {
      const { data } = await sb.from('game_stats').select('money').eq('user_id', currentUser.id).maybeSingle();
      if (!data) { await sb.auth.signOut(); window.location.href = 'index.html'; return; }
      userMoney = data?.money || 0;
      document.getElementById('balance').textContent = userMoney.toLocaleString('fr-FR') + '€';
    }

    async function updateMoney(amount) {
      userMoney += amount;
      await sb.from('game_stats').update({ money: userMoney }).eq('user_id', currentUser.id);
      document.getElementById('balance').textContent = userMoney.toLocaleString('fr-FR') + '€';
    }

    async function loadLeaderboard() {
      const { data, error } = await sb
        .from('game_crashes')
        .select('multiplier, profiles(username)')
        .order('multiplier', { ascending: false })
        .limit(10);

      if (error) { console.error('Leaderboard error:', error); return; }

      const list = document.getElementById('leaderboard');
      if (!data || data.length === 0) {
        list.innerHTML = '<div style="text-align: center; color: #6b7280; padding: 20px;">Aucun record encore !</div>';
        return;
      }

      list.innerHTML = data.map((record, i) => {
        const rank = i + 1;
        const className = rank === 1 ? 'top-1' : rank === 2 ? 'top-2' : rank === 3 ? 'top-3' : '';
        const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : '';
        return `
          <div class="leaderboard-item ${className}">
            <div class="rank">${medal} #${rank}</div>
            <div class="username">${record.profiles?.username || 'Anonyme'}</div>
            <div class="mult">×${parseFloat(record.multiplier).toFixed(2)}</div>
          </div>
        `;
      }).join('');
    }

    function generateCrashPoint() {
      const rand = Math.random();
      if (rand < 0.33) return 1.00 + Math.random() * 0.5;
      if (rand < 0.66) return 1.50 + Math.random() * 2;
      if (rand < 0.90) return 3.50 + Math.random() * 6.5;
      return 10 + Math.random() * 90;
    }

    async function launch() {
      bet = parseInt(document.getElementById('betAmount').value);
      if (bet < 100) { alert('Mise minimum: 100€'); return; }
      if (bet > userMoney) { alert('Pas assez d\'argent !'); return; }

      await updateMoney(-bet);
      mult = 1.00;
      hasCashedOut = false;
      crashPoint = generateCrashPoint();

      document.getElementById('betScreen').style.display = 'none';
      document.getElementById('playScreen').style.display = 'block';
      document.getElementById('cashoutBtn').style.display = 'inline-block';
      document.getElementById('result').style.display = 'none';
      document.getElementById('multiplier').classList.remove('crashed');

      const rocket = document.getElementById('rocket');
      rocket.style.bottom = '20px';
      rocket.style.left = '20px';

      interval = setInterval(() => {
        mult += 0.01;
        document.getElementById('multiplier').textContent = '×' + mult.toFixed(2);
        document.getElementById('cashoutAmount').textContent = Math.floor(bet * mult).toLocaleString('fr-FR') + '€';

        const progress = Math.min(mult / 10, 1);
        rocket.style.bottom = (20 + progress * 200) + 'px';
        rocket.style.left = (20 + progress * 300) + 'px';

        if (mult >= crashPoint) {
          crash();
        }
      }, 100);
    }

    async function cashout() {
      if (hasCashedOut) return;
      hasCashedOut = true;
      clearInterval(interval);

      const win = Math.floor(bet * mult);
      await updateMoney(win);

      await sb.from('game_crashes').insert({
        user_id: currentUser.id,
        multiplier: mult.toFixed(2),
        bet_amount: bet,
        win_amount: win
      });

      const res = document.getElementById('result');
      res.className = 'result win';
      res.textContent = `✅ ENCAISSÉ À ×${mult.toFixed(2)} ! +${win.toLocaleString('fr-FR')}€`;
      res.style.display = 'block';

      await loadLeaderboard();
      setTimeout(reset, 3000);
    }

    async function crash() {
      clearInterval(interval);
      document.getElementById('multiplier').classList.add('crashed');
      document.getElementById('multiplier').textContent = '💥 CRASH !';
      document.getElementById('rocket').textContent = '💥';

      const res = document.getElementById('result');
      if (!hasCashedOut) {
        res.className = 'result lose';
        res.textContent = `💥 CRASH à ×${mult.toFixed(2)} ! Perdu ${bet.toLocaleString('fr-FR')}€`;
      }
      res.style.display = 'block';

      setTimeout(reset, 3000);
    }

    function reset() {
      document.getElementById('betScreen').style.display = 'block';
      document.getElementById('playScreen').style.display = 'none';
      document.getElementById('cashoutBtn').style.display = 'none';
      document.getElementById('rocket').textContent = '🚀';
      document.getElementById('multiplier').textContent = '×1.00';
      document.getElementById('result').style.display = 'none';
    }

    init();
  </script>
</body>
</html>
