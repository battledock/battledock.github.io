<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Crash — Battle Dock</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
    html { height:100%; } body { height:100dvh; overflow:hidden; }
    body { font-family:'Inter',sans-serif; background:#0a0510; display:flex; flex-direction:column; }
    .page { flex:1; display:flex; flex-direction:column; max-width:480px; width:100%; margin:0 auto; }

    .hdr { display:flex; align-items:center; gap:10px; padding:calc(env(safe-area-inset-top)+34px) 14px 10px; flex-shrink:0; }
    .btn-back { background:rgba(255,255,255,0.06); border:1.5px solid rgba(255,255,255,0.12); color:rgba(255,255,255,0.5); border-radius:10px; padding:8px 12px; font-family:'Bebas Neue',sans-serif; font-size:13px; cursor:pointer; }
    .hdr-title { flex:1; text-align:center; font-family:'Bebas Neue',sans-serif; font-size:20px; color:white; letter-spacing:3px; }
    .hdr-bal { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); border-radius:10px; padding:7px 14px; }
    .hdr-bal-v { font-family:'Bebas Neue',sans-serif; font-size:17px; color:white; }

    /* Zone multiplicateur */
    .mult-zone { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; }
    .mult-label { font-size:9px; font-weight:700; color:rgba(255,255,255,0.2); letter-spacing:4px; }
    .mult-value { font-family:'Bebas Neue',sans-serif; font-size:clamp(72px,22vw,104px); color:white; line-height:1; transition:color .2s; }
    .mult-value.danger { color:#ff4444; }
    .mult-value.crashed { color:#ff2020; }
    .mult-value.cashed { color:#4ade80; }
    .mult-sub { font-size:12px; font-weight:700; color:rgba(255,255,255,0.3); letter-spacing:2px; }

    /* Graphe simplifié */
    .graph { width:100%; height:4px; background:rgba(255,255,255,0.05); margin:0 0 8px; flex-shrink:0; overflow:hidden; }
    .graph-fill { height:100%; width:0%; background:linear-gradient(90deg,#4ade80,#fbbf24); transition:width .1s linear; border-radius:2px; }
    .graph-fill.danger { background:linear-gradient(90deg,#fbbf24,#ff4444); }

    /* Gain potentiel */
    .potential { font-family:'Bebas Neue',sans-serif; font-size:20px; color:rgba(255,255,255,0.3); text-align:center; flex-shrink:0; min-height:28px; }

    /* Bouton ENCAISSER */
    .btn-cashout { width:calc(100% - 28px); margin:0 14px; padding:clamp(14px,4vw,21px); border:none; border-radius:18px; background:linear-gradient(135deg,#4ade80,#16a34a); color:white; font-family:'Bebas Neue',sans-serif; font-size:clamp(20px,5.5vw,27px); letter-spacing:3px; cursor:pointer; box-shadow:0 4px 20px rgba(74,222,128,0.35); transition:all .15s; flex-shrink:0; }
    .btn-cashout:active { transform:scale(0.97); }
    .btn-cashout:disabled { background:rgba(255,255,255,0.08); box-shadow:none; color:rgba(255,255,255,0.2); }
    .btn-cashout.crashed-btn { background:linear-gradient(135deg,#ff4444,#cc0000); box-shadow:0 4px 20px rgba(255,0,0,0.3); }

    /* Mise + bouton lancer */
    .chips { display:flex; gap:6px; padding:0 14px; flex-shrink:0; }
    .chip { flex:1; padding:9px; border-radius:10px; text-align:center; cursor:pointer; }
    .chip.sel { background:rgba(74,222,128,0.15); border:1.5px solid #4ade80; }
    .chip.sel .cv { color:#4ade80; }
    .chip:not(.sel) { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); }
    .chip:not(.sel) .cv { color:rgba(255,255,255,0.3); }
    .cv { font-family:'Bebas Neue',sans-serif; font-size:13px; }

    .btn-play { width:calc(100% - 28px); margin:8px 14px 0; padding:15px; border:none; border-radius:14px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.12); color:rgba(255,255,255,0.6); font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:2px; cursor:pointer; flex-shrink:0; }
    .btn-play:hover { background:rgba(255,255,255,0.12); }

    .btn-retour { width:calc(100% - 28px); margin:8px 14px calc(env(safe-area-inset-bottom)+12px); background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:12px; padding:11px; color:rgba(255,255,255,0.2); font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:2px; text-align:center; cursor:pointer; flex-shrink:0; }
  </style>
</head>
<body>
<div class="page">

  <div class="hdr">
    <button class="btn-back" onclick="window.location.href='casino.html'">← Salle</button>
    <div class="hdr-title">📈 CRASH</div>
    <div class="hdr-bal"><div class="hdr-bal-v" id="balDisplay">—</div></div>
  </div>

  <!-- Graphe -->
  <div class="graph"><div class="graph-fill" id="graphFill"></div></div>

  <!-- Multiplicateur -->
  <div class="mult-zone">
    <div class="mult-label">MULTIPLICATEUR</div>
    <div class="mult-value" id="multValue">1.00×</div>
    <div class="mult-sub" id="multSub">Lance une partie pour commencer</div>
  </div>

  <!-- Gain potentiel -->
  <div class="potential" id="potential"></div>

  <!-- Bouton encaisser / crashé -->
  <button class="btn-cashout" id="btnCashout" onclick="cashout()" disabled>ENCAISSER</button>

  <!-- Mise -->
  <div class="chips" style="margin-top:10px">
    <div class="chip sel" id="c1000" onclick="setBet(1000,'c1000')"><div class="cv">1K</div></div>
    <div class="chip" id="c5000" onclick="setBet(5000,'c5000')"><div class="cv">5K</div></div>
    <div class="chip" id="c10000" onclick="setBet(10000,'c10000')"><div class="cv">10K</div></div>
    <div class="chip" id="c50000" onclick="setBet(50000,'c50000')"><div class="cv">50K</div></div>
  </div>
  <button class="btn-play" id="btnPlay" onclick="startGame()">LANCER — <span id="betLabel">1 000€</span></button>

  <div class="btn-retour" onclick="window.location.href='casino.html'">← RETOUR AU CASINO</div>

</div>
<script>
  const SB_URL = 'https://drtsuhnbclhmgfjiykap.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
  const sb = supabase.createClient(SB_URL, SB_KEY);

  const fmt = n => Math.floor(n).toLocaleString('fr-FR');
  const fmtMult = n => n.toFixed(2) + '×';

  let money=0, bet=1000, currentUser=null;
  let mult=1, crashAt=1, running=false, cashedOut=false, interval=null;

  function setBet(val,id){
    bet=val;
    ['c1000','c5000','c10000','c50000'].forEach(i=>document.getElementById(i).classList.toggle('sel',i===id));
    document.getElementById('betLabel').textContent=fmt(val)+'€';
  }

  function updateBal(){ document.getElementById('balDisplay').textContent=fmt(money)+'€'; }

  // Crash point : distribution exponentielle, house edge ~10%
  function genCrashAt(){
    const r=Math.random();
    if(r < 0.01) return 1.0; // 1% crash immédiat
    return Math.max(1.0, 0.99 / (1 - Math.random()));
  }

  async function init(){
    const { data:{ session } }=await sb.auth.getSession();
    if(!session){ window.location.href='index.html'; return; }
    currentUser=session.user;
    const { data }=await sb.from('game_stats').select('money').eq('user_id',currentUser.id).maybeSingle();
    money=data?.money||0;
    updateBal();
  }

  function startGame(){
    if(running || money<bet) return;
    money-=bet; updateBal();
    cashedOut=false;
    mult=1.0;
    crashAt=genCrashAt();
    running=true;

    // UI
    document.getElementById('btnPlay').style.display='none';
    document.getElementById('btnCashout').disabled=false;
    document.getElementById('btnCashout').className='btn-cashout';
    document.getElementById('btnCashout').textContent='ENCAISSER';
    document.getElementById('multSub').textContent='Encaisse avant le crash !';
    document.getElementById('graphFill').style.width='0%';
    document.getElementById('graphFill').className='graph-fill';
    document.getElementById('potential').textContent='';

    const multEl=document.getElementById('multValue');
    multEl.className='mult-value';

    let speed=50; // ms par tick
    let elapsed=0;

    interval=setInterval(()=>{
      elapsed+=speed;
      // Croissance exponentielle
      mult=Math.pow(1.07, elapsed/100);

      multEl.textContent=fmtMult(mult);

      // Danger au-delà de 3x
      if(mult>5) multEl.className='mult-value danger';

      // Graphe
      const pct=Math.min((mult-1)/Math.max(crashAt-1,0.01)*100,100);
      document.getElementById('graphFill').style.width=pct+'%';
      if(mult>3) document.getElementById('graphFill').className='graph-fill danger';

      // Gain potentiel
      document.getElementById('potential').textContent='= '+fmt(Math.floor(bet*mult))+'€';

      // Bouton avec montant
      document.getElementById('btnCashout').textContent='ENCAISSER — '+fmt(Math.floor(bet*mult))+'€';

      // Crash ?
      if(mult>=crashAt){
        crash();
      }
    }, speed);
  }

  function cashout(){
    if(!running||cashedOut) return;
    cashedOut=true;
    clearInterval(interval);
    running=false;

    const gain=Math.floor(bet*mult);
    money+=gain; updateBal();

    document.getElementById('multValue').className='mult-value cashed';
    document.getElementById('multSub').textContent='ENCAISSÉ ! ✅';
    document.getElementById('potential').textContent='+'+fmt(gain)+'€';
    document.getElementById('btnCashout').textContent='ENCAISSÉ — '+fmt(gain)+'€';
    document.getElementById('btnCashout').disabled=true;

    save();
    setTimeout(reset, 2000);
  }

  function crash(){
    clearInterval(interval);
    running=false;
    if(cashedOut) return;

    document.getElementById('multValue').className='mult-value crashed';
    document.getElementById('multValue').textContent='💥 CRASH !';
    document.getElementById('multSub').textContent='à '+fmtMult(crashAt);
    document.getElementById('potential').textContent='Tout perdu…';
    document.getElementById('btnCashout').className='btn-cashout crashed-btn';
    document.getElementById('btnCashout').textContent='💥 CRASHÉ à '+fmtMult(crashAt);
    document.getElementById('btnCashout').disabled=true;

    if(navigator.vibrate) navigator.vibrate([100,50,200]);
    save();
    setTimeout(reset, 2500);
  }

  function reset(){
    document.getElementById('multValue').className='mult-value';
    document.getElementById('multValue').textContent='1.00×';
    document.getElementById('multSub').textContent='Lance une partie pour commencer';
    document.getElementById('potential').textContent='';
    document.getElementById('graphFill').style.width='0%';
    document.getElementById('graphFill').className='graph-fill';
    document.getElementById('btnPlay').style.display='block';
    document.getElementById('btnCashout').disabled=true;
    document.getElementById('btnCashout').className='btn-cashout';
    document.getElementById('btnCashout').textContent='ENCAISSER';
  }

  async function save(){
    if(currentUser) await sb.from('game_stats').update({money:Math.floor(money)}).eq('user_id',currentUser.id);
  }

  init();
</script>
</body>
</html>
