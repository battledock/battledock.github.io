<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Crash — Battle Dock</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
    html { height:100%; }
    body { height:100dvh; overflow:hidden; font-family:'Inter',sans-serif; background:#cc1a1a; display:flex; flex-direction:column; }
    .page { flex:1; display:flex; flex-direction:column; max-width:480px; width:100%; margin:0 auto; }

    .hdr { display:flex; align-items:center; justify-content:space-between; padding:calc(env(safe-area-inset-top)+20px) 16px 8px; flex-shrink:0; }
    .hdr-title { font-family:'Bebas Neue',sans-serif; font-size:22px; color:white; letter-spacing:3px; }
    .hdr-bal { background:#FDD835; border:2.5px solid #0a0a0a; border-radius:10px; padding:7px 14px; box-shadow:2px 2px 0 rgba(0,0,0,0.2); }
    .hdr-bal-v { font-family:'Bebas Neue',sans-serif; font-size:17px; color:#0a0a0a; }

    .main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:clamp(6px,2vh,14px); padding:0 16px; }
    .rocket { font-size:clamp(44px,10vh,72px); line-height:1; transition:filter .3s; }
    .rocket.crashed { filter:grayscale(1); }
    .rocket.cashed { filter:brightness(1.3); }

    .mult-val { font-family:'Bebas Neue',sans-serif; font-size:clamp(60px,14vh,96px); color:white; line-height:0.85; transition:color .2s; }
    .mult-val.danger { color:#ffe566; }
    .mult-val.crashed { color:#ff8888; }
    .mult-val.cashed { color:#88ffaa; }

    .mult-sub { font-size:clamp(9px,2.5vw,11px); font-weight:700; color:rgba(255,255,255,0.5); letter-spacing:3px; text-align:center; }

    .gain-box { background:rgba(0,0,0,0.2); border-radius:12px; padding:6px 18px; min-height:30px; display:flex; align-items:center; justify-content:center; }
    .gain-val { font-family:'Bebas Neue',sans-serif; font-size:clamp(16px,4.5vh,24px); color:#FDD835; }

    .btn-cashout { width:calc(100% - 32px); margin:0 16px; padding:clamp(12px,2.5vh,17px); border:3px solid #0a0a0a; border-radius:14px; background:#FDD835; color:#0a0a0a; font-family:'Bebas Neue',sans-serif; font-size:clamp(15px,4.5vh,21px); letter-spacing:2px; cursor:pointer; box-shadow:3px 3px 0 rgba(0,0,0,0.2); transition:all .15s; flex-shrink:0; }
    .btn-cashout:active { transform:translate(2px,2px); box-shadow:2px 2px 0 rgba(0,0,0,0.2); }
    .btn-cashout:disabled { background:rgba(0,0,0,0.15); border-color:rgba(255,255,255,0.2); color:rgba(255,255,255,0.3); box-shadow:none; }
    .btn-cashout.crashed-btn { background:rgba(0,0,0,0.3); border-color:rgba(255,255,255,0.2); color:rgba(255,255,255,0.4); box-shadow:none; }
    .btn-cashout.cashed-btn { background:#88ffaa; border-color:#0a0a0a; color:#0a0a0a; }

    .chips { display:flex; gap:6px; padding:0 16px; flex-shrink:0; }
    .chip { flex:1; padding:clamp(8px,1.8vh,11px); border-radius:10px; text-align:center; cursor:pointer; transition:all .15s; }
    .chip.sel { background:#FDD835; border:2.5px solid #0a0a0a; box-shadow:2px 2px 0 rgba(0,0,0,0.2); }
    .chip.sel .cv { color:#0a0a0a; }
    .chip:not(.sel) { background:rgba(0,0,0,0.15); border:2px solid rgba(255,255,255,0.2); }
    .chip:not(.sel) .cv { color:rgba(255,255,255,0.5); }
    .cv { font-family:'Bebas Neue',sans-serif; font-size:14px; }

    .btn-play { width:calc(100% - 32px); margin:6px 16px 0; padding:clamp(10px,1.8vh,14px); border:2px solid rgba(255,255,255,0.25); border-radius:12px; background:rgba(0,0,0,0.15); color:rgba(255,255,255,0.6); font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:2px; cursor:pointer; flex-shrink:0; }

    .btn-retour { width:calc(100% - 32px); margin:6px 16px calc(env(safe-area-inset-bottom)+10px); background:rgba(0,0,0,0.15); border:2px solid rgba(255,255,255,0.15); border-radius:12px; padding:clamp(9px,1.8vh,13px); color:rgba(255,255,255,0.4); font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:2px; text-align:center; cursor:pointer; flex-shrink:0; }
  </style>
</head>
<body>
<div class="page">

  <div class="hdr">
    <div class="hdr-title">🚀 CRASH</div>
    <div class="hdr-bal"><div class="hdr-bal-v" id="balDisplay">—</div></div>
  </div>

  <div class="main">
    <div class="rocket" id="rocketEl">🚀</div>
    <div class="mult-val" id="multVal">1.00×</div>
    <div class="mult-sub" id="multSub">Lance une partie pour commencer</div>
    <div class="gain-box"><div class="gain-val" id="gainVal"></div></div>
  </div>

  <button class="btn-cashout" id="btnCashout" onclick="cashout()" disabled>ENCAISSER</button>

  <div class="chips" style="margin-top:8px">
    <div class="chip sel" id="c1000" onclick="setBet(1000,'c1000')"><div class="cv">1K</div></div>
    <div class="chip" id="c5000" onclick="setBet(5000,'c5000')"><div class="cv">5K</div></div>
    <div class="chip" id="c10000" onclick="setBet(10000,'c10000')"><div class="cv">10K</div></div>
    <div class="chip" id="c50000" onclick="setBet(50000,'c50000')"><div class="cv">50K</div></div>
  </div>
  <button class="btn-play" id="btnPlay" onclick="startGame()">LANCER — <span id="betLabel">1 000€</span></button>
  <div class="btn-retour" onclick="window.location.href='casino.html'">← RETOUR AU CASINO</div>

</div>
<script>
  const SB_URL = 'https://drtsuhnbclhmgfjiykap.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
  const sb = supabase.createClient(SB_URL, SB_KEY);

  const fmt = n => Math.floor(n).toLocaleString('fr-FR');
  const fmtM = n => n.toFixed(2) + '×';

  let money=0, bet=1000, currentUser=null;
  let mult=1, crashAt=1, running=false, cashedOut=false, interval=null;

  const $ = id => document.getElementById(id);

  function setBet(val,id){
    bet=val;
    ['c1000','c5000','c10000','c50000'].forEach(i=>$(i).classList.toggle('sel',i===id));
    $('betLabel').textContent=fmt(val)+'€';
  }

  function updateBal(){ $('balDisplay').textContent=fmt(money)+'€'; }

  function genCrashAt(){
    if(Math.random()<0.01) return 1.0;
    return Math.max(1.0, 0.95/(1-Math.random()));
  }

  async function init(){
    const { data:{ session } }=await sb.auth.getSession();
    if(!session){ window.location.href='index.html'; return; }
    currentUser=session.user;
    const { data }=await sb.from('game_stats').select('money').eq('user_id',currentUser.id).maybeSingle();
    money=data?.money||0;
    updateBal();
  }

  function startGame(){
    if(running||money<bet) return;
    if(interval) clearInterval(interval);
    money-=bet; updateBal();
    cashedOut=false; mult=1.0; crashAt=genCrashAt(); running=true;

    $('btnPlay').style.display='none';
    $('btnCashout').disabled=false;
    $('btnCashout').className='btn-cashout';
    $('btnCashout').textContent='ENCAISSER';
    $('multSub').textContent='Encaisse avant le crash !';
    $('gainVal').textContent='';
    $('rocketEl').className='rocket';
    $('multVal').className='mult-val';

    let elapsed=0;
    interval=setInterval(()=>{
      elapsed+=50;
      mult=Math.pow(1.035,elapsed/100);
      $('multVal').textContent=fmtM(mult);
      if(mult>4) $('multVal').className='mult-val danger';
      const gain=Math.floor(bet*mult);
      $('gainVal').textContent='= '+fmt(gain)+'€';
      $('btnCashout').textContent='ENCAISSER — '+fmt(gain)+'€';
      if(mult>=crashAt) crash();
    },50);
  }

  function cashout(){
    if(!running||cashedOut) return;
    cashedOut=true; clearInterval(interval); running=false;
    const gain=Math.floor(bet*mult);
    money+=gain; updateBal();
    $('multVal').className='mult-val cashed';
    $('rocketEl').className='rocket cashed';
    $('multSub').textContent='ENCAISSÉ ! ✅';
    $('gainVal').textContent='+'+fmt(gain)+'€';
    $('btnCashout').textContent='ENCAISSÉ — '+fmt(gain)+'€';
    $('btnCashout').disabled=true;
    $('btnCashout').className='btn-cashout cashed-btn';
    save();
    setTimeout(reset,2000);
  }

  function crash(){
    clearInterval(interval); running=false;
    if(cashedOut) return;
    $('multVal').className='mult-val crashed';
    $('multVal').textContent='💥 CRASH !';
    $('rocketEl').className='rocket crashed';
    $('rocketEl').textContent='💥';
    $('multSub').textContent='crashé à '+fmtM(crashAt);
    $('gainVal').textContent='Tout perdu…';
    $('btnCashout').className='btn-cashout crashed-btn';
    $('btnCashout').textContent='💥 CRASHÉ à '+fmtM(crashAt);
    $('btnCashout').disabled=true;
    if(navigator.vibrate) navigator.vibrate([100,50,200]);
    save();
    setTimeout(reset,2500);
  }

  function reset(){
    $('multVal').className='mult-val';
    $('multVal').textContent='1.00×';
    $('multSub').textContent='Lance une partie pour commencer';
    $('gainVal').textContent='';
    $('rocketEl').textContent='🚀';
    $('rocketEl').className='rocket';
    $('btnPlay').style.display='block';
    $('btnCashout').disabled=true;
    $('btnCashout').className='btn-cashout';
    $('btnCashout').textContent='ENCAISSER';
  }

  async function save(){
    if(currentUser) await sb.from('game_stats').update({money:Math.floor(money)}).eq('user_id',currentUser.id);
  }

  init();
</script>
</body>
</html>
