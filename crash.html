<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Crash — Battle Dock Casino</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{height:100%;height:100dvh;overflow:hidden;font-family:'Inter',sans-serif}
body{background:radial-gradient(ellipse at top,#0f0c29,#302b63 40%,#24243e);display:flex;flex-direction:column}

/* HEADER */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,44px)+10px) 16px 10px;flex-shrink:0;z-index:10}
.btn-back{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:7px 14px;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;color:#fff;cursor:pointer}
.hdr-title{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#fbbf24;letter-spacing:3px}
.hdr-bal{background:rgba(0,0,0,.3);border:1px solid rgba(251,191,36,.3);border-radius:20px;padding:7px 14px;font-family:'Bebas Neue',sans-serif;font-size:15px;color:#fbbf24}

/* GAME */
.game{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 14px;gap:12px;min-height:0}

/* TABLE CRASH */
.crash-table{
  background:linear-gradient(180deg,#0a0a1a,#111128);
  border:3px solid rgba(251,191,36,.3);border-radius:24px;
  width:100%;max-width:420px;
  overflow:hidden;position:relative;
  flex-shrink:0;
}

/* SCÈNE */
.scene{
  height:clamp(180px,45vw,240px);
  position:relative;overflow:hidden;
  background:linear-gradient(180deg,#000510,#0a0a1a);
}
.stars{position:absolute;inset:0;pointer-events:none}
.explosion{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:80px;z-index:10}
.rocket-wrap{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);transition:bottom .05s linear;display:flex;flex-direction:column;align-items:center;gap:0}
.rocket-emoji{font-size:44px;line-height:1}
.flame{font-size:28px;line-height:1;animation:flameP .2s ease-in-out infinite alternate}
@keyframes flameP{from{transform:scaleY(.8)}to{transform:scaleY(1.2)}}

/* INFO MULT */
.table-info{padding:14px 16px 16px;display:flex;flex-direction:column;align-items:center;gap:8px}
.mult-val{font-family:'Bebas Neue',sans-serif;font-size:52px;color:#fbbf24;line-height:1;letter-spacing:2px;text-shadow:0 0 20px rgba(251,191,36,.3)}
.mult-sub{font-size:10px;font-weight:700;color:rgba(255,255,255,.4);letter-spacing:1px}
.gain-box{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.2);border-radius:12px;padding:8px 24px;min-width:140px;text-align:center;min-height:36px;display:flex;align-items:center;justify-content:center}
.gain-val{font-family:'Bebas Neue',sans-serif;font-size:20px;color:#fbbf24;letter-spacing:1px}
.btn-cashout{
  width:100%;padding:14px;border:none;border-radius:14px;
  background:linear-gradient(135deg,#4ade80,#16a34a);
  color:#0a0a0a;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;
  cursor:pointer;font-weight:900;transition:all .15s;
  box-shadow:0 4px 16px rgba(74,222,128,.3);
}
.btn-cashout:disabled{background:rgba(255,255,255,.07);color:rgba(255,255,255,.25);box-shadow:none;cursor:default}
.btn-cashout.cashed-btn{background:linear-gradient(135deg,#4ade80,#16a34a);color:#0a0a0a}
.btn-cashout.crashed-btn{background:rgba(220,38,38,.15);color:rgba(255,100,100,.5);box-shadow:none}

/* Chips */
.chips{display:flex;gap:6px;width:100%;max-width:420px}
.chip{flex:1;padding:10px 4px;border-radius:20px;text-align:center;cursor:pointer;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;border:1.5px solid rgba(255,255,255,.1);color:rgba(255,255,255,.4);background:rgba(255,255,255,.06);transition:all .15s}
.chip.sel{background:rgba(251,191,36,.2);border-color:#fbbf24;color:#fbbf24}
.chip:active{transform:scale(.96)}

/* Bouton */
.spin-btn{width:100%;max-width:420px;padding:16px;border:none;border-radius:16px;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a0000;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px;cursor:pointer;box-shadow:0 6px 24px rgba(251,191,36,.3);transition:all .15s;font-weight:900}
.spin-btn:active{transform:scale(.98);opacity:.9}
.spin-btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
</style>
</head>
<body>

<div class="hdr">
  <button class="btn-back" onclick="location.href='casino.html'">← CASINO</button>
  <div class="hdr-title">🚀 CRASH</div>
  <div class="hdr-bal" id="balance">0€</div>
</div>

<div class="game">
  <div class="crash-table" id="crashTable">
    <div class="scene" id="scene">
      <div class="stars" id="starsEl"></div>
      <div class="explosion" id="explosionEl">💥</div>
      <div class="rocket-wrap" id="rocketWrap">
        <div class="rocket-emoji" id="rocketEl">🚀</div>
        <div class="flame" id="flameEl">🔥</div>
      </div>
    </div>
    <div class="table-info">
      <div class="mult-val" id="multVal">1.00×</div>
      <div class="mult-sub" id="multSub">Lance une partie</div>
      <div style="font-size:8px;font-weight:700;color:rgba(255,255,255,.2);letter-spacing:1px;margin-top:-4px">Limite journalière · 100 000€ de gains</div>
      <div class="gain-box"><div class="gain-val" id="gainVal"></div></div>
      <button class="btn-cashout" id="btnCashout" onclick="cashout()" disabled>ENCAISSER</button>
    </div>
  </div>

  <div class="chips">
    <div class="chip sel" id="c1000" onclick="setBet(1000,'c1000')">1K</div>
    <div class="chip" id="c5000" onclick="setBet(5000,'c5000')">5K</div>
    <div class="chip" id="c10000" onclick="setBet(10000,'c10000')">10K</div>
    <div class="chip" id="c25000" onclick="setBet(25000,'c25000')">25K</div>
  </div>

  <button class="spin-btn" id="btnPlay" onclick="startGame()">LANCER — <span id="betLabel">1 000€</span></button>
</div>

<script>

  const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
  const { createClient } = supabase;
  const sb = createClient(supabaseUrl, supabaseKey);

  const fmt  = n => Math.floor(n).toLocaleString('fr-FR');
  const fmtM = n => n.toFixed(2) + '×';
  const $    = id => document.getElementById(id);

  let money=parseInt(localStorage.getItem("bd_money")||"0"),bet=1000,currentUser=null;
  let mult=1,crashAt=1,running=false,cashedOut=false,interval=null;
  const MAX_BET=25000,MAX_GAIN_DAY=100000,COOLDOWN=0;
  let dailyGain=0,lastGameEnd=0;
  let particleTimer=null;
  let rocketY = 20; // position bottom de la fusée en px

  // ── ÉTOILES ──
  function initStars() {
    const el = $('starsEl');
    el.innerHTML = '';
    for (let i=0;i<30;i++) {
      const s = document.createElement('div');
      s.className = 'star';
      const size = 1 + Math.random() * 2;
      s.style.cssText = `
        width:${size}px;height:${size}px;
        left:${Math.random()*100}%;top:${Math.random()*100}%;
        --d:${2+Math.random()*3}s;
        --delay:-${Math.random()*3}s;
        --op:${0.3+Math.random()*0.7};
      `;
      el.appendChild(s);
    }
  }

  // ── PARTICULES TRAIL ──
  function spawnParticles() {
    const scene = $('scene');
    const wrap  = $('rocketWrap');
    const wRect = wrap.getBoundingClientRect();
    const sRect = scene.getBoundingClientRect();
    const x = wRect.left - sRect.left + wRect.width/2;
    const y = wRect.top  - sRect.top  + wRect.height;

    for (let i=0;i<3;i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = 3 + Math.random() * 5;
      const hue  = 20 + Math.random() * 40; // orange-jaune
      const tx   = (Math.random()-0.5)*20;
      const ty   = 10 + Math.random()*20;
      p.style.cssText = `
        width:${size}px;height:${size}px;
        left:${x - size/2}px;top:${y}px;
        background:hsl(${hue},100%,${50+Math.random()*20}%);
        --dur:${0.4+Math.random()*0.3}s;
        --tx:${tx}px;--ty:${ty}px;
      `;
      scene.appendChild(p);
      setTimeout(() => p.remove(), 700);
    }
  }

  // ── FUSÉE — monte progressivement ──
  function updateRocket(m) {
    const maxH = 130; // hauteur max en px (scène - marges)
    const progress = Math.min((m - 1) / 9, 1); // 1x→10x = 0→100%
    rocketY = 20 + progress * maxH;
    const wrap = $('rocketWrap');
    wrap.style.bottom = rocketY + 'px';
    // Légère rotation selon la vitesse
    const tilt = Math.min((m - 1) * 2, 15);
    wrap.style.transform = `translateX(-50%) rotate(-${tilt}deg)`;
  }

  function setBet(val,id) {
    if(val>MAX_BET) val=MAX_BET;
    bet=val;
    ['c1000','c5000','c10000','c25000'].forEach(i=>$(i).classList.toggle('sel',i===id));
    $('betLabel').textContent=fmt(val)+'€';
  }

  function updateBal() { $('balance').textContent=fmt(money)+'€'; }

  function genCrashAt() {
    if(Math.random()<0.01) return 1.0;
    return Math.max(1.0,0.95/(1-Math.random()));
  }

  function toast(msg) {
    let t=document.getElementById('toast');
    if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:white;font-family:Bebas Neue,sans-serif;font-size:14px;letter-spacing:2px;padding:10px 20px;border-radius:10px;z-index:999;pointer-events:none;transition:opacity .3s';document.body.appendChild(t);}
    t.textContent=msg;t.style.opacity='1';clearTimeout(t._t);t._t=setTimeout(()=>t.style.opacity='0',2500);
  }

  function startGame() {
    const now=Date.now();
    if(now-lastGameEnd<COOLDOWN){toast(`⏳ ATTENDS ${Math.ceil((COOLDOWN-(now-lastGameEnd))/1000)}S`);return;}
    if(dailyGain>=MAX_GAIN_DAY){toast('🔒 LIMITE JOURNALIÈRE (100 000€)');return;}
    if(running||bet<=0||money<bet){toast("💸 PAS ASSEZ D'ARGENT");return;}
    if(interval) clearInterval(interval);
    if(particleTimer) clearInterval(particleTimer);

    money-=bet; updateBal();
    cashedOut=false;mult=1.0;crashAt=genCrashAt();running=true;

    // Reset scène
    rocketY=20;
    const wrap=$('rocketWrap');
    wrap.style.bottom='20px';
    wrap.style.transform='translateX(-50%) rotate(0deg)';
    $('rocketEl').className='rocket-emoji';
    $('rocketEl').textContent='🚀';
    $('flameEl').className='flame burning';
    $('explosionEl').className='explosion';

    $('btnPlay').disabled=true;$('btnPlay').style.opacity='0.4';
    $('btnCashout').disabled=false;
    $('btnCashout').className='btn-cashout';
    $('btnCashout').textContent='ENCAISSER';
    $('multSub').textContent='Encaisse avant le crash !';
    $('gainVal').textContent='';
    $('multVal').className='mult-val';
    $('crashTable').classList.remove('shaking');

    // Trail particules
    particleTimer=setInterval(()=>{ if(running) spawnParticles(); },80);

    let elapsed=0;
    interval=setInterval(()=>{
      elapsed+=50;
      mult=Math.pow(1.035,elapsed/100);
      $('multVal').textContent=fmtM(mult);

      // Couleur selon mult
      if(mult>10)      $('multVal').className='mult-val mega';
      else if(mult>4)  $('multVal').className='mult-val danger';
      else             $('multVal').className='mult-val';

      const gain=Math.floor(bet*mult);
      $('gainVal').textContent='= '+fmt(gain)+'€';
      $('btnCashout').textContent='ENCAISSER — '+fmt(gain)+'€';

      // Monter la fusée
      updateRocket(mult);

      if(mult>=crashAt) crash();
    },50);
  }

  function cashout() {
    if(!running||cashedOut) return;
    cashedOut=true;clearInterval(interval);clearInterval(particleTimer);running=false;
    const gain=Math.floor(bet*mult);
    money+=gain;updateBal();dailyGain+=gain;saveDailyGain();
    $('multVal').className='mult-val cashed';
    $('rocketEl').className='rocket-emoji cashed';
    $('flameEl').className='flame';
    $('multSub').textContent='ENCAISSÉ ! ✅';
    $('gainVal').textContent='+'+fmt(gain)+'€';
    $('btnCashout').textContent='ENCAISSÉ — '+fmt(gain)+'€';
    $('btnCashout').disabled=true;
    $('btnCashout').className='btn-cashout cashed-btn';
    lastGameEnd=Date.now();
    save();
    setTimeout(reset,2200);
  }

  function crash() {
    clearInterval(interval);clearInterval(particleTimer);running=false;
    if(cashedOut) return;

    // Explosion
    $('rocketEl').textContent='💥';
    $('rocketEl').className='rocket-emoji crashed';
    $('flameEl').className='flame';
    const exp=$('explosionEl');
    exp.className='explosion boom';
    setTimeout(()=>exp.className='explosion',700);

    // Shake table
    const table=$('crashTable');
    table.classList.add('shaking');
    setTimeout(()=>table.classList.remove('shaking'),500);

    $('multVal').className='mult-val crashed';
    $('multVal').textContent='💥 CRASH !';
    $('multSub').textContent='crashé à '+fmtM(crashAt);
    $('gainVal').textContent='Tout perdu…';
    $('btnCashout').className='btn-cashout crashed-btn';
    $('btnCashout').textContent='💥 CRASHÉ à '+fmtM(crashAt);
    $('btnCashout').disabled=true;
    if(navigator.vibrate) navigator.vibrate([100,50,200]);
    lastGameEnd=Date.now();
    save();
    setTimeout(reset,2500);
  }

  function reset() {
    $('multVal').className='mult-val';
    $('multVal').textContent='1.00×';
    $('gainVal').textContent='';
    $('rocketEl').textContent='🚀';
    $('rocketEl').className='rocket-emoji';
    $('flameEl').className='flame';
    rocketY=20;
    const wrap=$('rocketWrap');
    wrap.style.bottom='20px';
    wrap.style.transform='translateX(-50%) rotate(0deg)';
    $('btnCashout').disabled=true;
    $('btnCashout').className='btn-cashout';
    $('btnCashout').textContent='ENCAISSER';
    const btnPlay=$('btnPlay');
    let rem=COOLDOWN/1000;
    $('multSub').textContent=`Prochain lancer dans ${rem}s`;
    btnPlay.disabled=true;btnPlay.style.opacity='0.4';
    const cd=setInterval(()=>{
      rem--;
      if(rem<=0){clearInterval(cd);$('multSub').textContent='Lance une partie pour commencer';btnPlay.disabled=false;btnPlay.style.opacity='1';}
      else $('multSub').textContent=`Prochain lancer dans ${rem}s`;
    },1000);
  }

  async function save() {
    await saveMoney(money);
  }

  async function saveDailyGain() {
    if(!currentUser) return;
    const today=new Date().toDateString();
    const {data}=await sb.from('game_stats').select('records').eq('user_id',currentUser.id).maybeSingle();
    const records=data?.records||{};
    records.crash_daily={date:today,gain:dailyGain};
    await sb.from('game_stats').update({records}).eq('user_id',currentUser.id);
  }

  async function init() {
    const { data: _authData, error: _authError } = await sb.auth.getSession();
    if (_authError || !_authData.session) {
      await sb.auth.signOut().catch(() => {});
      window.location.href = 'index.html';
      return;
    }
    const session = _authData.session;
    currentUser = session.user;
    const {data}=await sb.from('game_stats').select('money,records').eq('user_id',currentUser.id).maybeSingle();
    money = data?.money || 0; localStorage.setItem("bd_money", money);
    const today=new Date().toDateString();
    const saved=data?.records?.crash_daily||{};
    dailyGain=saved.date===today?(saved.gain||0):0;
    updateBal();
    initStars();
  }

  document.addEventListener('gesturestart',e=>e.preventDefault());
  document.addEventListener('gesturechange',e=>e.preventDefault());

  async function saveMoney(amount) {
    const val = Math.floor(amount);
    localStorage.setItem('bd_money', val);
    if (!currentUser) return;
    for (let i = 0; i < 3; i++) {
      const { error } = await sb.from('game_stats').update({ money: val }).eq('user_id', currentUser.id);
      if (!error) return;
      await new Promise(r => setTimeout(r, 400));
    }
    console.warn('saveMoney: échec après 3 tentatives');
  }

  init();

</script>
</body>
</html>
