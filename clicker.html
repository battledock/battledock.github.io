<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Déchargement — Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; user-select:none;}
html, body{height:100%; overflow:hidden;}
body{
  font-family:'Inter', sans-serif;
  background:#f8f9fa;
}

#app{
  position:fixed; inset:0;
  display:flex; flex-direction:column;
  max-width:600px; margin:0 auto;
  background:#fff;
}

/* TOPBAR STYLE GAME.HTML */
.topbar{
  background:#ffffff;
  padding:12px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  position:relative;
  z-index:100;
}

.avatar{
  width:60px;
  height:60px;
  background:linear-gradient(135deg, #3b82f6, #2563eb);
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  flex-shrink:0;
}

.player-info{
  flex:1;
}

.player-name{
  font-family:'Bebas Neue', sans-serif;
  font-size:22px;
  letter-spacing:1px;
  color:#1a1a1a;
  line-height:1;
}

.player-grade{
  font-size:11px;
  color:#6b7280;
  font-weight:600;
  margin-top:2px;
}

.xp-container{
  margin-top:6px;
}

.xp-bar-bg{
  background:#e5e7eb;
  height:6px;
  border-radius:3px;
  overflow:hidden;
}

.xp-bar-fill{
  height:100%;
  background:linear-gradient(90deg, #3b82f6, #2563eb);
  border-radius:3px;
  transition:width 0.3s ease;
}

.xp-text{
  font-size:9px;
  color:#9ca3af;
  margin-top:2px;
}

.money-display{
  font-family:'Bebas Neue', sans-serif;
  font-size:20px;
  letter-spacing:1px;
  color:#10b981;
  flex-shrink:0;
}

/* STATS BAR */
.stats-bar{
  background:#f9fafb;
  padding:10px 16px;
  display:flex;
  justify-content:space-around;
  border-bottom:1px solid #e5e7eb;
}

.stat-item{
  text-align:center;
  flex:1;
}

.stat-label{
  font-size:9px;
  color:#6b7280;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:0.5px;
}

.stat-value{
  font-family:'Bebas Neue', sans-serif;
  font-size:18px;
  color:#1a1a1a;
  margin-top:2px;
  letter-spacing:0.5px;
}

/* DOCK AREA */
.dock-area{
  --sky1:#b9dceb; --sky2:#e0eef5;
  --sea1:#2b8aa6; --sea2:#0a4d68;
  --dock-floor:#8a8275; --dock-floor-dk:#6a6258;
  --mtn:rgba(60,80,100,.55);
  position:relative;
  flex:1; min-height:0;
  background:
    linear-gradient(180deg,
      transparent 0%, transparent 70%,
      #4a4238 70%, #4a4238 70.5%,
      var(--dock-floor) 70.5%, var(--dock-floor-dk) 100%
    ),
    linear-gradient(180deg,
      transparent 0%, transparent 35%,
      var(--sea1) 35%, var(--sea2) 70%,
      transparent 70%
    ),
    radial-gradient(circle at 82% 18%, rgba(255,220,150,.95) 0, rgba(255,220,150,0) 80px),
    linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 35%, var(--sky2) 35%);
  overflow:hidden;
}
.dock-area::before{
  content:''; position:absolute; left:0; right:0;
  top:35%; height:35%;
  background:repeating-linear-gradient(180deg, transparent 0 8px, rgba(255,255,255,.08) 8px 9px);
  pointer-events:none;
}
.dock-area::after{
  content:''; position:absolute; left:0; right:0;
  top:35%; height:35%;
  background-image:
    radial-gradient(ellipse 40px 3px at 20% 30%, rgba(255,255,255,.5), transparent),
    radial-gradient(ellipse 30px 2px at 60% 50%, rgba(255,255,255,.4), transparent),
    radial-gradient(ellipse 50px 3px at 80% 70%, rgba(255,255,255,.5), transparent);
  animation:waves 8s linear infinite;
  pointer-events:none;
}
@keyframes waves{
  0%{transform:translateX(0)}
  100%{transform:translateX(-30px)}
}

.mountains-deco{
  position:absolute; left:0; right:0;
  top:30%; height:6%;
  background:var(--mtn);
  clip-path:polygon(0 100%, 8% 60%, 14% 75%, 22% 40%, 30% 65%, 40% 30%, 48% 55%, 58% 35%, 68% 60%, 78% 25%, 88% 55%, 100% 40%, 100% 100%);
  pointer-events:none; z-index:1;
}

/* CONTAINER */
.container-target{
  position:absolute; left:50%; bottom:12%;
  transform:translateX(-50%);
  width:52%; max-width:200px; aspect-ratio:100/80;
  cursor:pointer; z-index:8;
  filter:drop-shadow(4px 6px 0 rgba(0,0,0,.45));
  touch-action:manipulation;
  transition:transform 0.1s;
}
.container-target:active{ transform:translateX(-50%) scale(0.95); }
.container-target svg{ width:100%; height:100%; display:block }

/* FX OVERLAY */
.fx-overlay{
  position:absolute; inset:0;
  pointer-events:none; z-index:9;
}
.float-num{
  position:absolute;
  font-family:'Bebas Neue', sans-serif;
  font-size:24px; color:#fbbf24;
  text-shadow:2px 2px 0 #000;
  pointer-events:none; user-select:none;
  transform:translateX(-50%);
  animation:floatup .9s ease-out forwards;
  white-space:nowrap;
}
@keyframes floatup{
  0%  { opacity:0; transform:translateX(-50%) translateY(0) scale(.7); }
  15% { opacity:1; transform:translateX(-50%) translateY(-10px) scale(1.1); }
  100%{ opacity:0; transform:translateX(-50%) translateY(-55px) scale(.9); }
}
.ripple{
  position:absolute; border-radius:50%;
  border:2px solid #fbbf24;
  pointer-events:none;
  transform:translate(-50%,-50%);
  animation:rip .5s ease-out forwards;
}
@keyframes rip{
  0%  { width:0; height:0; opacity:.8; }
  100%{ width:120px; height:120px; opacity:0; }
}

/* BOUTON RETOUR */
.back-btn{
  position:absolute;
  top:16px; left:16px;
  background:rgba(255,255,255,.9);
  border:2px solid #e5e7eb;
  border-radius:8px;
  padding:8px 12px;
  font-family:'Bebas Neue', sans-serif;
  font-size:16px;
  letter-spacing:1px;
  color:#1a1a1a;
  cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.1);
  z-index:10;
  transition:all .2s;
}
.back-btn:active{
  transform:scale(0.95);
}
</style>
</head>
<body>
  <div id="app">
    <!-- TOPBAR -->
    <div class="topbar">
      <div class="avatar" id="avatarDisplay">👤</div>
      <div class="player-info">
        <div class="player-name" id="usernameDisplay">Joueur</div>
        <div class="player-grade" id="gradeDisplay">Docker Occasionnel • Niveau <span id="levelDisplay">1</span></div>
        <div class="xp-container">
          <div class="xp-bar-bg">
            <div class="xp-bar-fill" id="xpBar" style="width:0%"></div>
          </div>
          <div class="xp-text"><span id="xpCurrent">0</span> / <span id="xpRequired">100</span> XP</div>
        </div>
      </div>
      <div class="money-display"><span id="moneyDisplay">100</span>€</div>
    </div>

    <!-- STATS BAR -->
    <div class="stats-bar">
      <div class="stat-item">
        <div class="stat-label">Par Clic</div>
        <div class="stat-value"><span id="perClickDisplay">1</span>€</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Combo</div>
        <div class="stat-value">x<span id="comboDisplay">1.0</span></div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Total</div>
        <div class="stat-value" id="totalClicksDisplay">0</div>
      </div>
    </div>

    <!-- DOCK AREA -->
    <div class="dock-area">
      <button class="back-btn" onclick="window.location.href='selectiontravail.html'">← Retour</button>
      <div class="mountains-deco"></div>
      <div class="fx-overlay" id="fxOverlay"></div>
      <div class="container-target" id="container">
        <svg viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg">
          <rect x="10" y="20" width="80" height="50" fill="#c0392b" stroke="#000" stroke-width="2"/>
          <rect x="15" y="25" width="70" height="40" fill="#d35400" stroke="#000" stroke-width="1.5"/>
          <line x1="50" y1="25" x2="50" y2="65" stroke="#000" stroke-width="2"/>
          <line x1="15" y1="45" x2="85" y2="45" stroke="#000" stroke-width="2"/>
          <rect x="40" y="35" width="20" height="20" fill="#2c3e50" stroke="#000" stroke-width="1.5"/>
          <text x="50" y="48" font-family="Arial" font-size="10" fill="#fff" text-anchor="middle" font-weight="bold">CMA</text>
        </svg>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ SÉCURITÉ : La clé API Supabase est exposée côté client.
    // Pour protéger les données, assure-toi d'avoir activé RLS (Row Level Security)
    // sur toutes tes tables Supabase. Exécute le fichier security-rls.sql dans Supabase.
    // Sans RLS, n'importe qui peut modifier les données en ouvrant la console du navigateur.
    
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const supabaseClient = createClient(supabaseUrl, supabaseKey);

    const userId = localStorage.getItem('userId');
    const username = localStorage.getItem('username');
    if (!userId) {
      window.location.href = 'index.html';
    }

    // State
    let money = 100;
    let level = 1;
    let xp = 0;
    let combo = 1;
    let lastClickTime = 0;
    let totalClicks = 0;
    let perClick = 1;
    let maxCombo = 1;
    let saveTimeout = null;

    loadPlayerData();

    async function loadPlayerData() {
      const { data: progressArray } = await supabaseClient
        .from('game_progress')
        .select('*')
        .eq('user_id', userId);

      if (progressArray && progressArray[0]) {
        const progress = progressArray[0];
        money = progress.money || 100;
        level = progress.level || 1;
        xp = progress.xp || 0;
        totalClicks = progress.total_clicks || 0;
        maxCombo = progress.max_combo || 1;
        
        updateDisplay();
      }

      document.getElementById('usernameDisplay').textContent = username || 'Joueur';
    }

    function getRank(level) {
      if (level < 15) return 'Docker Occasionnel';
      if (level < 30) return 'Docker';
      if (level < 50) return 'Docker Mensuel';
      if (level < 80) return 'Contre-Maître';
      if (level < 100) return 'Chef de Quai';
      return 'Directeur de Compagnie';
    }

    function getXpRequired(level) {
      return Math.floor(100 * Math.pow(1.15, level - 1));
    }

    // CLICK HANDLER
    const container = document.getElementById('container');
    container.addEventListener('click', clickContainer);
    container.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      clickContainer({ clientX: touch.clientX, clientY: touch.clientY });
    }, { passive: false });

    function clickContainer(e){
      const now = Date.now();

      // Combo system
      if(now - lastClickTime < 600){
        combo = Math.min(5, combo + 0.05);
      } else {
        combo = 1;
      }
      lastClickTime = now;
      if(combo > maxCombo) maxCombo = combo;

      const gain = Math.floor(perClick * combo);
      money += gain;
      totalClicks += 1;

      // XP gain (1 XP par clic)
      xp += 1;
      const xpRequired = getXpRequired(level);
      if (xp >= xpRequired) {
        xp -= xpRequired;
        level += 1;
      }

      // VIBRATION (si activée)
      const vibrationEnabled = localStorage.getItem('setting_vibration') === 'true';
      if (vibrationEnabled && navigator.vibrate) {
        navigator.vibrate(10);
      }

      // SON (si activé)
      const soundEnabled = localStorage.getItem('setting_sound') === 'true';
      if (soundEnabled) {
        playClickSound();
      }

      // Visual feedback
      const overlay = document.getElementById('fxOverlay');
      if(overlay){
        const oRect = overlay.getBoundingClientRect();
        const cx = e.clientX - oRect.left;
        const cy = e.clientY - oRect.top;

        const f = document.createElement('div');
        f.className = 'float-num';
        f.textContent = '+' + gain + '€';
        f.style.left = cx + 'px';
        f.style.top  = cy + 'px';
        overlay.appendChild(f);
        setTimeout(()=>f.remove(), 950);

        const r = document.createElement('div');
        r.className = 'ripple';
        r.style.left = cx + 'px';
        r.style.top  = cy + 'px';
        overlay.appendChild(r);
        setTimeout(()=>r.remove(), 550);
      }

      updateDisplay();
      scheduleSave();
    }

    // SON DE CLIC
    let audioContext = null;
    function playClickSound() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      
      oscillator.frequency.value = 800;
      oscillator.type = 'sine';
      
      gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
      
      oscillator.start(audioContext.currentTime);
      oscillator.stop(audioContext.currentTime + 0.1);
    }

    function updateDisplay() {
      const xpRequired = getXpRequired(level);
      const xpPercent = (xp / xpRequired) * 100;

      document.getElementById('moneyDisplay').textContent = money.toLocaleString('fr-FR');
      document.getElementById('levelDisplay').textContent = level;
      document.getElementById('gradeDisplay').textContent = getRank(level) + ' • Niveau ' + level;
      document.getElementById('xpCurrent').textContent = xp;
      document.getElementById('xpRequired').textContent = xpRequired;
      document.getElementById('xpBar').style.width = xpPercent + '%';
      
      document.getElementById('perClickDisplay').textContent = perClick;
      document.getElementById('comboDisplay').textContent = combo.toFixed(1);
      document.getElementById('totalClicksDisplay').textContent = totalClicks.toLocaleString('fr-FR');
    }

    function scheduleSave() {
      if (saveTimeout) clearTimeout(saveTimeout);
      
      saveTimeout = setTimeout(async () => {
        await supabaseClient
          .from('game_progress')
          .update({
            money: money,
            level: level,
            xp: xp,
            total_clicks: totalClicks,
            max_combo: maxCombo
          })
          .eq('user_id', userId);
      }, 2000);
    }

    window.addEventListener('beforeunload', async () => {
      if (saveTimeout) {
        clearTimeout(saveTimeout);
        await supabaseClient
          .from('game_progress')
          .update({
            money: money,
            level: level,
            xp: xp,
            total_clicks: totalClicks,
            max_combo: maxCombo
          })
          .eq('user_id', userId);
      }
    });
  </script>
</body>
</html>
