<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Clicker - Battle Dock</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    body { font-family: 'Inter', sans-serif; background: linear-gradient(180deg, #87ceeb 0%, #e0f6ff 100%); min-height: 100vh; overflow: hidden; }
    .header { background: white; padding: 16px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .header-btn { background: #3b82f6; border: none; color: white; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-family: 'Bebas Neue', sans-serif; font-size: 14px; }
    .header-money { font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: #10b981; }
    .scene { display: flex; flex-direction: column; align-items: center; justify-content: center; height: calc(100vh - 140px); position: relative; }
    .container-btn { width: 150px; height: 120px; background: linear-gradient(135deg, #cc3333, #990000); border: 3px solid #8b0000; border-radius: 8px; cursor: pointer; transition: all 0.1s; display: flex; align-items: center; justify-content: center; font-size: 32px; color: white; font-weight: bold; }
    .container-btn:hover { background: linear-gradient(135deg, #dd4444, #aa1111); }
    .container-btn:active { transform: scale(0.95); }
    .stats-bar { background: #1a1a1a; padding: 12px 16px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; color: white; text-align: center; }
    .stat-value { font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: #10b981; }
    .stat-label { font-size: 10px; color: #888; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="header">
    <button class="header-btn" onclick="goBack()">← RETOUR</button>
    <div class="header-money" id="headerMoney">0€</div>
    <button class="header-btn" onclick="goShop()">⚙️ AMÉLIORER</button>
  </div>
  <div class="scene">
    <button class="container-btn" onclick="clickContainer()">CMA CGM</button>
  </div>
  <div class="stats-bar">
    <div><div class="stat-value" id="sessionMoneyDisplay">0€</div><div class="stat-label">Session</div></div>
    <div><div class="stat-value" id="comboDisplay">1x</div><div class="stat-label">Combo</div></div>
    <div><div class="stat-value" id="cpsDisplay">0€/s</div><div class="stat-label">Gain/sec</div></div>
    <div><div class="stat-value" id="clicksDisplay">0</div><div class="stat-label">Clics</div></div>
  </div>
  <script>
    const SUPABASE_URL = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
    let currentUser = null, sessionMoney = 0, totalMoney = 0, combo = 1, clicks = 0, upgrades = {};
    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) window.location.href = 'index.html';
      currentUser = session.user;
      const { data: stats } = await sb.from('game_stats').select('money, upgrades').eq('user_id', currentUser.id).single();
      totalMoney = stats?.money || 0;
      upgrades = stats?.upgrades || {};
      updateDisplay();
      setInterval(autoClick, 1000);
      setInterval(save, 2000);
    }
    function clickContainer() {
      clicks++;
      const gain = (1 + (upgrades.earn_per_click || 0)) * combo;
      sessionMoney += gain;
      totalMoney += gain;
      combo = Math.min(combo + 0.01, 2);
      setTimeout(() => combo = 1, 800);
      updateDisplay();
    }
    function autoClick() {
      if (upgrades.auto_clicker) {
        sessionMoney += upgrades.auto_clicker;
        totalMoney += upgrades.auto_clicker;
        updateDisplay();
      }
    }
    function save() {
      sb.from('game_stats').update({ money: totalMoney }).eq('user_id', currentUser.id);
    }
    function updateDisplay() {
      document.getElementById('headerMoney').textContent = totalMoney.toLocaleString('fr-FR') + '€';
      document.getElementById('sessionMoneyDisplay').textContent = sessionMoney.toLocaleString('fr-FR') + '€';
      document.getElementById('comboDisplay').textContent = combo.toFixed(1) + 'x';
      document.getElementById('clicksDisplay').textContent = clicks;
      document.getElementById('cpsDisplay').textContent = (upgrades.auto_clicker || 0) + '€/s';
    }
    function goBack() { window.location.href = 'game.html'; }
    function goShop() { window.location.href = 'shop.html'; }
    init();
  </script>
</body>
</html>
