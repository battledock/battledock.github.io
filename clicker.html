<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Travailler - Battle Dock</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
    input { user-select:text; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #0ea5e9;
      display: flex;
      flex-direction: column;
    }

    /* ===================== SCÈNE COMPLÈTE ===================== */
    .scene {
      position: relative;
      flex: 1;
      overflow: hidden;
    }

    /* CIEL */
    .sky {
      position: absolute; inset: 0;
      background: linear-gradient(180deg,
        #1e40af 0%,
        #2563eb 15%,
        #3b82f6 35%,
        #60a5fa 55%,
        #93c5fd 70%,
        #bae6fd 80%,
        #e0f2fe 88%,
        #f0f9ff 92%
      );
    }

    /* SOLEIL */
    .sun {
      position: absolute;
      top: 28px; right: 60px;
      z-index: 2;
    }
    .sun-core {
      width: 52px; height: 52px;
      background: radial-gradient(circle at 40% 35%, #fef08a, #fbbf24 40%, #f59e0b 80%);
      border-radius: 50%;
      box-shadow:
        0 0 0 8px rgba(251,191,36,0.15),
        0 0 0 16px rgba(251,191,36,0.08),
        0 0 0 28px rgba(251,191,36,0.04),
        0 0 60px rgba(251,191,36,0.4);
      animation: sunPulse 4s ease-in-out infinite;
    }
    @keyframes sunPulse {
      0%,100% { box-shadow: 0 0 0 8px rgba(251,191,36,0.15), 0 0 0 16px rgba(251,191,36,0.08), 0 0 0 28px rgba(251,191,36,0.04), 0 0 60px rgba(251,191,36,0.4); }
      50%      { box-shadow: 0 0 0 12px rgba(251,191,36,0.2),  0 0 0 24px rgba(251,191,36,0.1), 0 0 0 40px rgba(251,191,36,0.05), 0 0 80px rgba(251,191,36,0.5); }
    }

    /* NUAGES */
    .cloud {
      position: absolute; z-index: 3;
      pointer-events: none;
    }
    .cloud-body {
      background: white;
      border-radius: 50px;
      opacity: 0.85;
      position: relative;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.08));
    }
    .cloud-body::before, .cloud-body::after {
      content: '';
      position: absolute;
      background: white;
      border-radius: 50%;
    }
    .cloud1 { top: 40px; left: -120px; animation: cloudDrift1 28s linear infinite; }
    .cloud1 .cloud-body { width:100px; height:28px; }
    .cloud1 .cloud-body::before { width:44px; height:44px; top:-22px; left:14px; }
    .cloud1 .cloud-body::after  { width:32px; height:32px; top:-16px; left:52px; }

    .cloud2 { top: 65px; left: -180px; animation: cloudDrift2 36s linear infinite 8s; opacity:0.6; }
    .cloud2 .cloud-body { width:70px; height:20px; }
    .cloud2 .cloud-body::before { width:30px; height:30px; top:-15px; left:10px; }
    .cloud2 .cloud-body::after  { width:22px; height:22px; top:-11px; left:36px; }

    .cloud3 { top: 22px; left: -80px; animation: cloudDrift3 22s linear infinite 14s; opacity:0.7; }
    .cloud3 .cloud-body { width:55px; height:16px; }
    .cloud3 .cloud-body::before { width:24px; height:24px; top:-12px; left:8px; }
    .cloud3 .cloud-body::after  { width:18px; height:18px; top:-9px; left:28px; }

    @keyframes cloudDrift1 { 0%{transform:translateX(0)}     100%{transform:translateX(calc(100vw + 200px))} }
    @keyframes cloudDrift2 { 0%{transform:translateX(0)}     100%{transform:translateX(calc(100vw + 260px))} }
    @keyframes cloudDrift3 { 0%{transform:translateX(0)}     100%{transform:translateX(calc(100vw + 180px))} }

    /* HORIZON BRUME */
    .horizon-haze {
      position: absolute;
      bottom: 42%; left: 0; right: 0;
      height: 60px; z-index: 3;
      background: linear-gradient(180deg, transparent, rgba(224,242,254,0.4), transparent);
      pointer-events: none;
    }

    /* EAU */
    .water {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 42%;
      z-index: 4;
      overflow: hidden;
    }

    .water-bg {
      position: absolute; inset: 0;
      background: linear-gradient(180deg,
        #1d4ed8 0%,
        #1e40af 30%,
        #1e3a8a 60%,
        #172554 100%
      );
    }

    /* Reflets soleil sur eau */
    .water-reflection {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 50%;
      background: linear-gradient(180deg,
        rgba(147,197,253,0.25) 0%,
        transparent 100%
      );
      pointer-events: none;
    }

    .sun-reflection {
      position: absolute;
      top: 0;
      right: 50px;
      width: 60px;
      background: linear-gradient(180deg, rgba(251,191,36,0.25), transparent);
      height: 100%;
      filter: blur(8px);
      pointer-events: none;
    }

    /* Vagues */
    .waves-wrap {
      position: absolute;
      top: -1px; left: 0; right: 0;
      height: 40px; z-index: 2;
      overflow: hidden;
    }

    .wave-svg { width: 200%; height: 100%; }
    .wave-svg.w1 { animation: waveSvg 4s linear infinite; position: absolute; top:0; left:0; opacity:0.9; }
    .wave-svg.w2 { animation: waveSvg 6s linear infinite reverse; position: absolute; top:4px; left:0; opacity:0.5; }
    .wave-svg.w3 { animation: waveSvg 8s linear infinite; position: absolute; top:8px; left:0; opacity:0.3; }
    @keyframes waveSvg { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }

    /* Ondulations eau */
    .ripple {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(147,197,253,0.15);
      animation: rippleOut 4s ease-out infinite;
      pointer-events: none;
    }
    @keyframes rippleOut {
      0%   { transform: scale(0); opacity: 0.5; }
      100% { transform: scale(8); opacity: 0; }
    }

    /* QUAI */
    .quay {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 28%;
      z-index: 5;
    }

    .quay-surface {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 16px;
      background: linear-gradient(180deg, #78716c, #57534e);
      border-top: 2px solid #a8a29e;
    }

    .quay-body {
      position: absolute;
      top: 14px; left: 0; right: 0; bottom: 0;
      background: linear-gradient(180deg, #44403c, #292524);
    }

    /* Planches du quai */
    .quay-planks {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 16px;
      background: repeating-linear-gradient(
        90deg,
        transparent 0px, transparent 18px,
        rgba(0,0,0,0.15) 18px, rgba(0,0,0,0.15) 20px
      );
    }

    /* GRUE */
    .crane {
      position: absolute;
      right: 20px; bottom: 25%;
      z-index: 6;
      width: 40px;
      pointer-events: none;
    }

    .crane-arm {
      position: absolute;
      top: 0; left: 0;
      width: 3px; height: 80px;
      background: linear-gradient(180deg, #fbbf24, #f59e0b);
      transform-origin: bottom center;
    }

    .crane-horizontal {
      position: absolute;
      top: 2px; left: -20px;
      width: 44px; height: 3px;
      background: #fbbf24;
    }

    .crane-cable {
      position: absolute;
      top: 5px; left: 20px;
      width: 1px; height: 30px;
      background: rgba(251,191,36,0.6);
      animation: cableSway 3s ease-in-out infinite;
      transform-origin: top center;
    }
    @keyframes cableSway { 0%,100%{transform:rotate(-3deg)} 50%{transform:rotate(3deg)} }

    .crane-hook {
      position: absolute;
      top: 35px; left: -3px;
      width: 7px; height: 5px;
      border: 2px solid #fbbf24;
      border-top: none;
      border-radius: 0 0 4px 4px;
    }

    /* CONTAINER CLIQUABLE */
    .container-zone {
      position: absolute;
      bottom: 18%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 7;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .container-wrap {
      position: relative;
      transition: transform 0.08s cubic-bezier(0.34,1.56,0.64,1);
    }

    .container-wrap:active { transform: scale(0.92); }

    .container-box {
      width: 140px;
      height: 92px;
      border-radius: 6px;
      border: 3px solid #880000;
      background: linear-gradient(135deg, #cc2200, #991100);
      position: relative;
      overflow: hidden;
      box-shadow:
        0 8px 24px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(255,255,255,0.1),
        inset 0 -1px 0 rgba(0,0,0,0.3);
    }

    /* Rainures container */
    .container-box::before {
      content: '';
      position: absolute; inset: 0;
      background: repeating-linear-gradient(
        90deg,
        transparent 0px, transparent 22px,
        rgba(0,0,0,0.18) 22px, rgba(0,0,0,0.18) 24px
      );
    }

    /* Reflet en haut */
    .container-box::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 35%;
      background: linear-gradient(180deg, rgba(255,255,255,0.08), transparent);
    }

    /* Poignées */
    .container-handle {
      position: absolute;
      top: 0; bottom: 0;
      width: 8px;
      background: linear-gradient(180deg, #555, #333, #555);
      border-radius: 2px;
    }
    .container-handle.left  { left: -3px; }
    .container-handle.right { right: -3px; }

    /* Ombre sous le container */
    .container-shadow {
      position: absolute;
      bottom: -10px; left: 10px; right: 10px;
      height: 16px;
      background: rgba(0,0,0,0.25);
      border-radius: 50%;
      filter: blur(6px);
    }

    /* Texte CLIQUER */
    .click-hint {
      position: absolute;
      bottom: -28px; left: 50%;
      transform: translateX(-50%);
      font-size: 9px;
      font-weight: 700;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 2px;
      white-space: nowrap;
      animation: hintPulse 2s ease-in-out infinite;
    }
    @keyframes hintPulse { 0%,100%{opacity:0.5} 50%{opacity:1} }

    /* ===================== HEADER ===================== */
    .header {
      position: relative;
      z-index: 20;
      background: rgba(6,11,20,0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .back-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      padding: 8px 12px;
      color: white;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 13px; letter-spacing: 1px;
      cursor: pointer; transition: all 0.2s;
      flex-shrink: 0;
    }
    .back-btn:hover { background: rgba(255,255,255,0.14); }

    .header-money {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px; color: #34d399; letter-spacing: 1px;
      text-shadow: 0 0 12px rgba(52,211,153,0.4);
      flex: 1; text-align: center;
    }

    .shop-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      padding: 8px 12px;
      color: white;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 13px; letter-spacing: 1px;
      cursor: pointer; transition: all 0.2s;
      flex-shrink: 0;
    }
    .shop-btn:hover { background: rgba(255,255,255,0.14); }

    /* ===================== XP BAR ===================== */
    .xp-bar-wrap {
      position: relative;
      z-index: 20;
      background: rgba(6,11,20,0.75);
      backdrop-filter: blur(16px);
      padding: 6px 14px 8px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .xp-bar-header {
      display: flex; justify-content: space-between;
      font-size: 9px; color: rgba(255,255,255,0.45); font-weight: 700;
      margin-bottom: 4px; letter-spacing: 0.5px;
    }

    .xp-track {
      height: 3px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px; overflow: hidden;
    }

    .xp-fill {
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #a5b4fc);
      border-radius: 2px;
      transition: width 0.4s ease;
      box-shadow: 0 0 6px rgba(99,102,241,0.6);
    }

    /* ===================== STATS BAR ===================== */
    .stats-bar {
      position: relative;
      z-index: 20;
      background: rgba(6,11,20,0.88);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255,255,255,0.07);
      padding: 10px 14px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .stat-item { text-align: center; }

    .stat-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px; letter-spacing: 1px;
      color: #34d399;
    }
    .stat-value.purple { color: #a78bfa; }
    .stat-value.white  { color: white; }

    .stat-label {
      font-size: 8px; color: rgba(255,255,255,0.3);
      text-transform: uppercase; letter-spacing: 0.5px;
      font-weight: 700; margin-top: 1px;
    }

    /* ===================== PARTICULES ===================== */
    .particle {
      position: fixed;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px; font-weight: 700;
      color: #34d399;
      text-shadow: 0 0 8px rgba(52,211,153,0.6);
      pointer-events: none; z-index: 999;
      animation: particleFly 0.9s ease-out forwards;
    }
    .particle.xp { color: #a78bfa; font-size: 14px; text-shadow: 0 0 8px rgba(167,139,250,0.6); }
    .particle.combo { color: #fbbf24; font-size: 22px; text-shadow: 0 0 12px rgba(251,191,36,0.8); }
    @keyframes particleFly {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-70px) scale(0.6); }
    }

    /* COMBO FLASH */
    .combo-flash {
      position: fixed; inset: 0; z-index: 998;
      background: rgba(251,191,36,0.06);
      pointer-events: none;
      animation: comboFlash 0.3s ease-out forwards;
    }
    @keyframes comboFlash { 0%{opacity:1} 100%{opacity:0} }

    /* ===================== ANIMATIONS ===================== */
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <button class="back-btn" onclick="goBack()">← RETOUR</button>
    <div class="header-money" id="headerMoney">0€</div>
    <button class="shop-btn" onclick="window.location.href='shop.html'">⚙️ SHOP</button>
  </div>

  <!-- XP BAR -->
  <div class="xp-bar-wrap">
    <div class="xp-bar-header">
      <span id="xpLabel">Niveau 1 • Docker Occasionnel</span>
      <span id="xpCounter">0 / 500 XP</span>
    </div>
    <div class="xp-track"><div class="xp-fill" id="xpFill" style="width:0%"></div></div>
  </div>

  <!-- SCÈNE PRINCIPALE -->
  <div class="scene">

    <!-- CIEL -->
    <div class="sky"></div>

    <!-- SOLEIL -->
    <div class="sun"><div class="sun-core"></div></div>

    <!-- NUAGES -->
    <div class="cloud cloud1"><div class="cloud-body"></div></div>
    <div class="cloud cloud2"><div class="cloud-body"></div></div>
    <div class="cloud cloud3"><div class="cloud-body"></div></div>

    <!-- BRUME HORIZON -->
    <div class="horizon-haze"></div>

    <!-- EAU -->
    <div class="water">
      <div class="water-bg"></div>
      <div class="water-reflection"></div>

      <!-- Vagues -->
      <div class="waves-wrap">
        <svg class="wave-svg w1" viewBox="0 0 2880 40" preserveAspectRatio="none">
          <path d="M0,20 C120,35 240,5 360,20 C480,35 600,5 720,20 C840,35 960,5 1080,20 C1200,35 1320,5 1440,20 C1560,35 1680,5 1800,20 C1920,35 2040,5 2160,20 C2280,35 2400,5 2520,20 C2640,35 2760,5 2880,20 L2880,0 L0,0 Z" fill="rgba(96,165,250,0.6)"/>
        </svg>
        <svg class="wave-svg w2" viewBox="0 0 2880 40" preserveAspectRatio="none">
          <path d="M0,15 C180,30 360,5 540,18 C720,30 900,5 1080,18 C1260,30 1440,15 1620,30 C1800,5 1980,18 2160,30 C2340,5 2520,18 2700,30 C2760,10 2820,5 2880,15 L2880,0 L0,0 Z" fill="rgba(147,197,253,0.4)"/>
        </svg>
        <svg class="wave-svg w3" viewBox="0 0 2880 40" preserveAspectRatio="none">
          <path d="M0,25 C100,12 200,32 360,22 C520,12 640,32 800,22 C960,12 1100,30 1440,20 C1580,12 1700,32 1860,22 C2020,12 2140,32 2300,22 C2460,12 2600,30 2880,20 L2880,0 L0,0 Z" fill="rgba(219,234,254,0.3)"/>
        </svg>
      </div>

      <!-- Ondulations -->
    </div>

    <!-- GRUE -->
    <div class="crane">
      <div class="crane-arm">
        <div class="crane-horizontal"></div>
        <div class="crane-cable"><div class="crane-hook"></div></div>
      </div>
    </div>

    <!-- QUAI -->
    <div class="quay">
      <div class="quay-surface">
        <div class="quay-planks"></div>
      </div>
      <div class="quay-body"></div>
    </div>

    <!-- CONTAINER -->
    <div class="container-zone" id="containerZone"
      ontouchstart="handleTouch(event)"
      onclick="handleClick(event)">
      <div class="container-wrap" id="containerWrap">
        <div class="container-box" id="containerBox">
          <div class="container-handle left"></div>
          <div class="container-handle right"></div>
        </div>
        <div class="container-shadow"></div>
        <div class="click-hint">Appuyer pour travailler</div>
      </div>
    </div>

  </div>

  <!-- STATS BAR -->
  <div class="stats-bar">
    <div class="stat-item">
      <div class="stat-value" id="sessionMoneyDisplay">0€</div>
      <div class="stat-label">Session</div>
    </div>
    <div class="stat-item">
      <div class="stat-value white" id="comboDisplay">×1.0</div>
      <div class="stat-label">Combo</div>
    </div>
    <div class="stat-item">
      <div class="stat-value purple" id="sessionXpDisplay">0</div>
      <div class="stat-label">XP Session</div>
    </div>
    <div class="stat-item">
      <div class="stat-value white" id="clicksDisplay">0</div>
      <div class="stat-label">Clics</div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

    // ===== XP SYSTEM =====
    function getXpRequired(level) {
      if (level <= 10) return level * 500;
      if (level <= 25) return level * 1000;
      if (level <= 50) return level * 2000;
      return level * 4000;
    }
    function getGrade(level) {
      if (level <= 4)  return 'Docker Occasionnel';
      if (level <= 14) return 'Docker';
      if (level <= 29) return 'Docker Mensuel';
      if (level <= 49) return 'Contre-Maître';
      if (level <= 79) return 'Chef de Quai';
      return 'Magnat du Port';
    }

    // ===== STATE =====
    let currentUser = null;
    let totalMoney = 0, sessionMoney = 0;
    let currentXp = 0, currentLevel = 1, sessionXp = 0;
    let combo = 1, comboTimeout = null;
    let clicks = 0;
    let upgrades = {};
    let lastTouchTime = 0;
    let lastComboFlash = 0;

    // ===== INIT =====
    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { window.location.href = 'index.html'; return; }
      currentUser = session.user;

      const [statsRes, profileRes] = await Promise.all([
        sb.from('game_stats').select('money, xp, level, grade').eq('user_id', currentUser.id).single(),
        sb.from('profiles').select('upgrades, skin_container').eq('user_id', currentUser.id).single()
      ]);

      if (statsRes.data) {
        totalMoney  = statsRes.data.money || 0;
        currentXp   = statsRes.data.xp    || 0;
        currentLevel = statsRes.data.level || 1;
      }

      upgrades = profileRes.data?.upgrades || {};

      // Skin conteneur
      const skin = profileRes.data?.skin_container || 'red';
      const skinColors = {
        red:    { bg:'linear-gradient(135deg,#cc2200,#991100)', border:'#880000' },
        blue:   { bg:'linear-gradient(135deg,#1d4ed8,#1e3a8a)', border:'#1e3a8a' },
        green:  { bg:'linear-gradient(135deg,#15803d,#14532d)', border:'#14532d' },
        gold:   { bg:'linear-gradient(135deg,#b45309,#92400e)', border:'#92400e' },
        black:  { bg:'linear-gradient(135deg,#1a1a1a,#000000)', border:'#000000' },
        purple: { bg:'linear-gradient(135deg,#7c3aed,#5b21b6)', border:'#5b21b6' }
      };
      const sc = skinColors[skin] || skinColors.red;
      const box = document.getElementById('containerBox');
      if (box) { box.style.background = sc.bg; box.style.borderColor = sc.border; }

      updateDisplay();
      if (upgrades.auto_clicker) setInterval(autoClick, 1000);
      setInterval(save, 2000);
    }

    // ===== INTERACTIONS =====
    function handleTouch(e) {
      e.preventDefault();
      const now = Date.now();
      if (now - lastTouchTime < 60) return;
      lastTouchTime = now;
      const count = Math.min(e.touches.length, 4);
      for (let i = 0; i < count; i++) doClick(e.touches[i].clientX, e.touches[i].clientY);
    }

    function handleClick(e) {
      if (e.sourceCapabilities && !e.sourceCapabilities.firesTouchEvents) {
        doClick(e.clientX, e.clientY);
      }
    }

    function doClick(x, y) {
      clicks++;

      // XP
      const xpGain = 1 + (upgrades.xp_bonus_1 ? 1 : 0) + (upgrades.xp_bonus_2 ? 2 : 0);
      sessionXp  += xpGain;
      currentXp  += xpGain;

      // Argent
      const baseGain = 1 + (upgrades.earn_per_click || 0);
      const gain = Math.floor(baseGain * combo);
      sessionMoney += gain;
      totalMoney   += gain;

      // Combo
      const oldCombo = Math.floor(combo);
      combo = Math.min(combo + 0.005, 2 + (upgrades.combo_max || 0) * 0.5);
      clearTimeout(comboTimeout);
      comboTimeout = setTimeout(() => { combo = 1; updateDisplay(); }, 400);

      // Flash combo si palier atteint
      if (Math.floor(combo) > oldCombo) {
        const flash = document.createElement('div');
        flash.className = 'combo-flash';
        document.body.appendChild(flash);
        setTimeout(() => flash.remove(), 300);
        spawnParticle(x, y, '×' + Math.floor(combo), 'combo');
      }

      // Particules
      spawnParticle(x, y, '+' + gain + '€', '');
      if (clicks % 4 === 0) spawnParticle(x + 20, y - 10, '+' + xpGain + ' XP', 'xp');

      // Masquer hint après 5 clics
      if (clicks === 5) {
        const hint = document.querySelector('.click-hint');
        if (hint) hint.style.display = 'none';
      }

      // Secouer le container
      const wrap = document.getElementById('containerWrap');
      wrap.style.transform = `scale(0.93) rotate(${(Math.random()-0.5)*3}deg)`;
      setTimeout(() => wrap.style.transform = '', 80);

      checkLevelUp();
      updateDisplay();
    }

    function checkLevelUp() {
      const xpNeeded = getXpRequired(currentLevel);
      if (currentXp >= xpNeeded) {
        currentXp -= xpNeeded;
        currentLevel++;
        save();
      }
    }

    function spawnParticle(x, y, text, type) {
      const p = document.createElement('div');
      p.className = 'particle' + (type ? ' ' + type : '');
      p.textContent = text;
      p.style.left = (x - 20 + Math.random() * 40) + 'px';
      p.style.top  = (y - 30) + 'px';
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 900);
    }

    function autoClick() {
      const gain = upgrades.auto_clicker || 0;
      sessionMoney += gain;
      totalMoney   += gain;
      updateDisplay();
    }

    function updateDisplay() {
      const xpNeeded = getXpRequired(currentLevel);
      const pct = Math.min((currentXp / xpNeeded) * 100, 100);
      document.getElementById('headerMoney').textContent     = totalMoney.toLocaleString('fr-FR') + '€';
      document.getElementById('sessionMoneyDisplay').textContent = sessionMoney.toLocaleString('fr-FR') + '€';
      document.getElementById('comboDisplay').textContent    = '×' + combo.toFixed(1);
      document.getElementById('sessionXpDisplay').textContent = sessionXp;
      document.getElementById('clicksDisplay').textContent   = clicks;
      document.getElementById('xpLabel').textContent = `Niveau ${currentLevel} • ${getGrade(currentLevel)}`;
      document.getElementById('xpCounter').textContent = `${currentXp} / ${xpNeeded} XP`;
      document.getElementById('xpFill').style.width = pct + '%';
    }

    async function save() {
      if (!currentUser) return;
      const { error } = await sb.from('game_stats').update({
        money: Math.floor(totalMoney),
        xp:    Math.floor(currentXp),
        level: currentLevel,
        grade: getGrade(currentLevel)
      }).eq('user_id', currentUser.id);
      if (error) console.error('Save error:', error);
    }

    async function goBack() {
      const btn = document.querySelector('.back-btn');
      btn.textContent = '💾...';
      btn.disabled = true;
      try {
        await sb.from('game_stats').update({
          money: Math.floor(totalMoney),
          xp:    Math.floor(currentXp),
          level: currentLevel,
          grade: getGrade(currentLevel)
        }).eq('user_id', currentUser.id);
      } catch(e) { console.error(e); }
      window.location.href = 'game.html';
    }

    init();
  </script>
</body>
</html>
