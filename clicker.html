    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }

    body { font-family:'Inter',sans-serif; height:100dvh; display:flex; flex-direction:column; position:relative; }

    /* Layout principal */
    .page { position:relative; z-index:5; flex:1; display:flex; flex-direction:column; overflow:hidden; }

    /* Header */
    .hdr { padding:calc(env(safe-area-inset-top) + 44px) 22px 0; flex-shrink:0; }
    .hdr-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    .hdr-label { font-family:'Bebas Neue',sans-serif; font-size:11px; letter-spacing:2px; color:rgba(255,255,255,0.7); }
    .hdr-title { font-family:'Bebas Neue',sans-serif; font-size:28px; color:white; line-height:1; }
    .hdr-money { font-family:'Bebas Neue',sans-serif; font-size:26px; color:white; line-height:1; text-align:right; }
    .hdr-session { font-size:9px; font-weight:700; color:rgba(255,255,255,0.55); letter-spacing:1px; text-align:right; }
    .xp-wrap { background:rgba(0,0,0,0.2); border:2px solid rgba(0,0,0,0.25); border-radius:10px; padding:8px 12px; display:flex; align-items:center; gap:10px; }
    .xp-lv { font-size:9px; font-weight:700; color:rgba(255,255,255,0.65); letter-spacing:1px; flex-shrink:0; }
    .xp-track { flex:1; height:7px; background:rgba(0,0,0,0.2); border-radius:3px; overflow:hidden; }
    .xp-fill { height:100%; width:0%; background:#FDD835; border-radius:2px; transition:width .3s ease; }
    .xp-ct { font-size:9px; font-weight:700; color:rgba(255,255,255,0.55); letter-spacing:1px; flex-shrink:0; white-space:nowrap; }

    /* Zone centrale */
    .scene { flex:1; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:16px; padding-top:80px; }

    /* Container cliquable */
    .container-box {
      width:186px; height:128px;
      background:linear-gradient(135deg,#cc2200,#991100);
      border-radius:10px; border:4px solid #0a0a0a;
      position:relative; overflow:hidden;
      cursor:pointer;
    }
    .container-box::before { content:''; position:absolute; inset:0; background:linear-gradient(180deg,rgba(255,255,255,0.07),transparent 50%); }
    .container-stripe { position:absolute; top:0; bottom:0; width:2px; background:rgba(0,0,0,0.22); }
    .container-label { position:absolute; bottom:16px; left:0; right:0; text-align:center; font-family:'Bebas Neue',sans-serif; font-size:14px; color:rgba(255,255,255,0.85); letter-spacing:3px; }

    /* Badge combo */
    .combo-badge { display:inline-flex; align-items:center; gap:6px; background:rgba(0,0,0,0.22); border:2px solid rgba(0,0,0,0.28); border-radius:20px; padding:7px 18px; }
    .combo-val { font-family:'Bebas Neue',sans-serif; font-size:19px; color:white; }
    .combo-lbl { font-size:9px; font-weight:700; color:rgba(255,255,255,0.55); letter-spacing:1px; }

    /* Stats bas */
    .stats { padding:0 18px; flex-shrink:0; }
    .stats-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:12px; }
    .stat { background:rgba(0,0,0,0.22); border:2px solid rgba(0,0,0,0.2); border-radius:12px; padding:10px; text-align:center; }
    .stat-v { font-family:'Bebas Neue',sans-serif; font-size:18px; color:white; }
    .stat-v.xp { color:#FDD835; }
    .stat-l { font-size:8px; font-weight:700; color:rgba(255,255,255,0.5); letter-spacing:1px; margin-top:1px; }

    /* Bouton retour */
    .btn-back { width:100%; background:white; border:none; border-radius:14px; padding:13px; color:#1565C0; font-family:'Bebas Neue',sans-serif; font-size:14px; letter-spacing:2px; cursor:pointer; margin-bottom:calc(env(safe-area-inset-bottom) + 24px); }

    /* Particules */
    .particle { position:fixed; pointer-events:none; font-family:'Bebas Neue',sans-serif; font-size:22px; font-weight:bold; color:#4ade80; z-index:999; animation:pflyup .8s ease-out forwards; }
    .particle.xp { color:#FDD835; font-size:17px; }
    @keyframes pflyup { 0%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-70px) scale(0.7)} }
  </style>
</head>

<script>
  const SB_URL = 'https://drtsuhnbclhmgfjiykap.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
  const { createClient } = supabase;
  const sb = createClient(SB_URL, SB_KEY);

  function getXpRequired(level) {
    if (level <= 10) return level * 500;
    if (level <= 25) return level * 1000;
    if (level <= 50) return level * 2000;
    return level * 4000;
  }
  function getGrade(level) {
    if (level <= 4)  return 'Docker Occasionnel';
    if (level <= 14) return 'Docker';
    if (level <= 29) return 'Docker Mensuel';
    if (level <= 49) return 'Contre-Maître';
    if (level <= 79) return 'Chef de Quai';
    return 'Magnat du Port';
  }

  let currentUser = null;
  let totalMoney = 0, sessionMoney = 0;
  let currentXp = 0, currentLevel = 1, sessionXp = 0;
  let combo = 1, comboTimeout = null, clicks = 0;
  let lastTouchTime = 0;

  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = 'index.html'; return; }
    currentUser = session.user;

    const { data: stats } = await sb.from('game_stats')
      .select('money,xp,level,xp_per_click,money_per_click')
      .eq('user_id', currentUser.id).maybeSingle();
    const { data: profile } = await sb.from('profiles')
      .select('skin_container').eq('user_id', currentUser.id).maybeSingle();

    if (stats) {
      totalMoney       = stats.money || 0;
      currentXp        = stats.xp    || 0;
      currentLevel     = stats.level || 1;
      window.xpPerClick    = Math.min(stats.xp_per_click    || 1, 11);
      window.moneyPerClick = Math.min(stats.money_per_click || 1, 30);
    }

    // Skin conteneur
    const skin = profile?.skin_container || 'red';
    const skins = {
      red:    ['linear-gradient(135deg,#cc2200,#991100)','#880000'],
      blue:   ['linear-gradient(135deg,#1d4ed8,#1e3a8a)','#1e3a8a'],
      green:  ['linear-gradient(135deg,#15803d,#14532d)','#14532d'],
      gold:   ['linear-gradient(135deg,#b45309,#92400e)','#92400e'],
      black:  ['linear-gradient(135deg,#1a1a1a,#000)','#000'],
      purple: ['linear-gradient(135deg,#7c3aed,#5b21b6)','#5b21b6'],
    };
    const [bg, border] = skins[skin] || skins.red;
    const box = document.getElementById('containerBtn');
    box.style.background = bg; box.style.borderColor = border;

    updateDisplay();
    setInterval(save, 10000);
  }

  function handleTouch(e) {
    e.preventDefault();
    const now = Date.now();
    if (now - lastTouchTime < 50) return;
    lastTouchTime = now;
    const count = Math.min(e.touches.length, 4);
    for (let i = 0; i < count; i++) doClick(e.touches[i].clientX, e.touches[i].clientY);
  }
  function handleClick(e) {
    if (e.sourceCapabilities && !e.sourceCapabilities.firesTouchEvents) doClick(e.clientX, e.clientY);
  }

  function doClick(x, y) {
    clicks++;
    const xpGain  = window.xpPerClick    || 1;
    const base    = window.moneyPerClick || 1;
    const gain    = Math.floor(base * combo);

    sessionXp    += xpGain;  currentXp   += xpGain;
    sessionMoney += gain;     totalMoney  += gain;

    combo = Math.min(combo + 0.005, 2.0);
    clearTimeout(comboTimeout);
    comboTimeout = setTimeout(() => { combo = 1; updateDisplay(); }, 400);

    spawnParticle(x, y, '+' + gain + '€', false);
    if (clicks % 3 === 0) spawnParticle(x - 20, y - 24, '+' + xpGain + ' XP', true);

    checkLevelUp();
    updateDisplay();
  }

  function checkLevelUp() {
    const needed = getXpRequired(currentLevel);
    if (currentXp >= needed) { currentXp -= needed; currentLevel++; save(); }
  }

  function spawnParticle(x, y, text, isXp) {
    const p = document.createElement('div');
    p.className = 'particle' + (isXp ? ' xp' : '');
    p.textContent = text;
    p.style.left = (x - 20 + Math.random() * 40) + 'px';
    p.style.top  = (y - 20) + 'px';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 800);
  }

  function updateDisplay() {
    const needed  = getXpRequired(currentLevel);
    const pct     = Math.min((currentXp / needed) * 100, 100);
    const grade   = getGrade(currentLevel);
    const mpc     = Math.floor((window.moneyPerClick || 1) * combo);

    document.getElementById('headerMoney').textContent      = totalMoney.toLocaleString('fr-FR') + '€';
    document.getElementById('xpLabel').textContent          = 'NV.' + currentLevel + ' · ' + grade;
    document.getElementById('xpCounter').textContent        = currentXp + ' / ' + needed + ' XP';
    document.getElementById('xpFill').style.width           = pct + '%';
    document.getElementById('comboDisplay').textContent     = '×' + combo.toFixed(1);
    document.getElementById('perClickMoney').textContent    = '+' + mpc + '€';
    document.getElementById('sessionXpDisplay').textContent = sessionXp + ' XP';
    document.getElementById('clicksDisplay').textContent    = clicks;
  }

  async function save() {
    if (!currentUser) return;
    const { data: fresh } = await sb.from('game_stats').select('money').eq('user_id', currentUser.id).maybeSingle();
    await sb.from('game_stats').update({
      money: Math.max(fresh?.money ?? 0, Math.floor(totalMoney)),
      xp:    Math.floor(currentXp),
      level: currentLevel,
      grade: getGrade(currentLevel)
    }).eq('user_id', currentUser.id);
  }

  async function goBack() {
    const btn = document.getElementById('backBtn');
    btn.textContent = '💾...'; btn.disabled = true;
    try {
      await sb.from('game_stats').update({
        money: Math.floor(totalMoney),
        xp:    Math.floor(currentXp),
        level: currentLevel,
        grade: getGrade(currentLevel)
      }).eq('user_id', currentUser.id);
    } catch(e) { console.error(e); }
    window.location.href = 'travail.html';
  }

  window.addEventListener('beforeunload', save);
  init();
</script>
</body>
</html>
