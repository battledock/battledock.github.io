<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Docker du Port - Battle Dock</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      position: fixed;
      inset: 0;
      touch-action: none;
    }

    /* TOPBAR */
    .topbar {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
      position: relative;
      z-index: 100;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid rgba(255, 255, 255, 0.3);
      color: #1a1a1a;
      padding: 8px 16px;
      border-radius: 8px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 14px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .back-btn:active {
      transform: scale(0.95);
    }

    .topbar-stats {
      display: flex;
      gap: 16px;
      flex: 1;
      justify-content: center;
    }

    .topbar-stat {
      text-align: center;
    }

    .topbar-stat-icon {
      font-size: 18px;
      margin-bottom: 2px;
    }

    .topbar-stat-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      color: white;
      letter-spacing: 0.5px;
    }

    .topbar-stat-label {
      font-size: 9px;
      color: rgba(255, 255, 255, 0.8);
      text-transform: uppercase;
      margin-top: 1px;
    }

    /* DOCK SCENE */
    .dock-scene {
      position: relative;
      width: 100%;
      height: calc(100vh - 52px);
      overflow: hidden;
      background: linear-gradient(180deg, #87ceeb 0%, #b9dceb 50%, #2b8aa6 100%);
    }

    /* Sun */
    .sun {
      position: absolute;
      top: 15%;
      right: 15%;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 220, 150, 1) 0%, rgba(255, 220, 150, 0.6) 70%, transparent 100%);
      pointer-events: none;
    }

    /* Mountains background */
    .mountains {
      position: absolute;
      bottom: 35%;
      width: 100%;
      height: 15%;
      background: linear-gradient(to bottom, transparent, #5a7a8a);
      clip-path: polygon(0% 100%, 15% 30%, 35% 65%, 50% 20%, 70% 55%, 85% 35%, 100% 70%, 100% 100%);
      opacity: 0.4;
      pointer-events: none;
    }

    /* Quai */
    .quai {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 35%;
      background: linear-gradient(to bottom, #8b7355 0%, #6b5744 100%);
      pointer-events: none;
    }

    .quai::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 8px;
      background: #a0826d;
    }

    /* Container cliquable */
    #container {
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translateX(-50%);
      width: 280px;
      height: 220px;
      cursor: pointer;
      transition: transform 0.1s ease;
      z-index: 10;
    }

    #container:active {
      transform: translateX(-50%) scale(0.95);
    }

    /* FX Overlay */
    #fxOverlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20;
    }

    .float-num {
      position: absolute;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      color: #fbbf24;
      font-weight: 700;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5), 0 0 10px rgba(251, 191, 36, 0.6);
      pointer-events: none;
      animation: floatup 0.9s ease-out forwards;
      z-index: 30;
    }

    @keyframes floatup {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-80px); }
    }

    .ripple {
      position: absolute;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(251, 191, 36, 0.4), transparent);
      transform: translate(-50%, -50%);
      animation: ripple 0.5s ease-out forwards;
      pointer-events: none;
      z-index: 25;
    }

    @keyframes ripple {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
    }

    /* STATS BAR */
    .stats-bar {
      background: #ffffff;
      padding: 12px 16px;
      display: flex;
      justify-content: space-around;
      gap: 8px;
      box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.1);
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
    }

    .stat-item {
      text-align: center;
      flex: 1;
    }

    .stat-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      color: #1a1a1a;
      letter-spacing: 0.5px;
    }

    .stat-label {
      font-size: 10px;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    /* RESPONSIVE */
    @media (max-width: 400px) {
      #container {
        width: 240px;
        height: 180px;
      }
      
      .float-num {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <button class="back-btn" onclick="goBack()">← RETOUR</button>
    <div class="topbar-stats">
      <div class="topbar-stat">
        <div class="topbar-stat-value" id="moneyTopDisplay">0€</div>
        <div class="topbar-stat-label">Argent</div>
      </div>
      <div class="topbar-stat">
        <div class="topbar-stat-value" id="xpTopDisplay">0 XP</div>
        <div class="topbar-stat-label">XP</div>
      </div>
      <div class="topbar-stat">
        <div class="topbar-stat-value" id="comboTopDisplay">×1</div>
        <div class="topbar-stat-label">Combo</div>
      </div>
    </div>
  </div>

  <div class="dock-scene">
    <div class="sun"></div>
    <div class="mountains"></div>
    <div class="quai"></div>
    <svg id="container" viewBox="0 0 200 160">
      <defs>
        <linearGradient id="containerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#991b1b;stop-opacity:1" />
        </linearGradient>
      </defs>
      <rect x="10" y="10" width="180" height="140" rx="15" fill="url(#containerGrad)" stroke="#7f1d1d" stroke-width="8"/>
      <rect x="30" y="20" width="140" height="20" rx="3" fill="rgba(255,255,255,0.4)" />
      <text x="100" y="90" font-family="Bebas Neue" font-size="36" fill="white" text-anchor="middle" dominant-baseline="middle" letter-spacing="4" text-shadow="0 4px 8px rgba(0,0,0,0.4)">CONTAINER</text>
    </svg>
    <div id="fxOverlay"></div>
  </div>

  <div class="stats-bar">
    <div class="stat-item">
      <div class="stat-value" id="moneyDisplay">0€</div>
      <div class="stat-label">Session</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="xpDisplay">0 XP</div>
      <div class="stat-label">Cette Session</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="totalClicksDisplay">0</div>
      <div class="stat-label">Total Clics</div>
    </div>
  </div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const supabaseClient = createClient(supabaseUrl, supabaseKey);

    let currentUser = null;
    let initialMoney = 0;
    let initialXp = 0;
    
    // État de session
    let money = 0;
    let xp = 0;
    let totalClicks = 0;
    let combo = 1;
    let lastClickTime = 0;
    let comboResetTimeout = null;
    let saveTimeout = null;

    async function init() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        window.location.href = 'index.html';
        return;
      }
      currentUser = session.user;
      
      // Charger les stats actuelles
      const { data: stats } = await supabaseClient
        .from('game_stats')
        .select('money, xp')
        .eq('user_id', currentUser.id)
        .single();

      if (stats) {
        initialMoney = stats.money || 0;
        initialXp = stats.xp || 0;
      }
      
      updateDisplay();
      setupClicker();
    }

    function setupClicker() {
      const container = document.getElementById('container');
      
      container.addEventListener('click', (e) => {
        clickContainer(e);
      });
      
      container.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const touches = e.touches;
        for (let i = 0; i < touches.length; i++) {
          clickContainer({
            clientX: touches[i].clientX,
            clientY: touches[i].clientY
          });
        }
      }, { passive: false });
    }

    function clickContainer(e) {
      const now = Date.now();
      const timeSinceLastClick = now - lastClickTime;

      // Combo system
      if (timeSinceLastClick < 600) {
        combo = Math.min(5, combo + 0.05);
      } else {
        combo = 1;
      }
      
      lastClickTime = now;

      // Réinitialiser le timeout de réduction du combo
      clearTimeout(comboResetTimeout);
      comboResetTimeout = setTimeout(() => {
        let tempCombo = combo;
        const decayInterval = setInterval(() => {
          tempCombo = Math.max(1, tempCombo - 0.2);
          combo = tempCombo;
          updateDisplay();
          
          if (tempCombo <= 1) {
            combo = 1;
            clearInterval(decayInterval);
            updateDisplay();
          }
        }, 50);
      }, 600);

      const gain = Math.floor(1 * combo);
      money += gain;
      xp += 1;
      totalClicks += 1;

      // Vibration
      if (navigator.vibrate) {
        navigator.vibrate(10);
      }

      // Visual feedback
      const overlay = document.getElementById('fxOverlay');
      if (overlay) {
        const oRect = overlay.getBoundingClientRect();
        const cx = e.clientX - oRect.left;
        const cy = e.clientY - oRect.top;

        const f = document.createElement('div');
        f.className = 'float-num';
        f.textContent = '+' + gain + '€';
        f.style.left = cx + 'px';
        f.style.top = cy + 'px';
        overlay.appendChild(f);
        setTimeout(() => f.remove(), 950);

        const r = document.createElement('div');
        r.className = 'ripple';
        r.style.left = cx + 'px';
        r.style.top = cy + 'px';
        overlay.appendChild(r);
        setTimeout(() => r.remove(), 550);
      }

      updateDisplay();
      scheduleSave();
    }

    function updateDisplay() {
      // Barre du haut
      document.getElementById('moneyTopDisplay').textContent = (initialMoney + money).toLocaleString('fr-FR') + '€';
      document.getElementById('xpTopDisplay').textContent = (initialXp + xp).toLocaleString('fr-FR');
      document.getElementById('comboTopDisplay').textContent = '×' + combo.toFixed(1);

      // Barre du bas (gains de cette session)
      document.getElementById('moneyDisplay').textContent = money.toLocaleString('fr-FR') + '€';
      document.getElementById('xpDisplay').textContent = xp.toLocaleString('fr-FR');
      document.getElementById('totalClicksDisplay').textContent = totalClicks.toLocaleString('fr-FR');
    }

    function scheduleSave() {
      if (saveTimeout) {
        clearTimeout(saveTimeout);
      }
      
      saveTimeout = setTimeout(() => {
        saveProgress();
      }, 1000);
    }

    async function saveProgress() {
      if (!currentUser) return;
      
      try {
        await supabaseClient
          .from('game_stats')
          .update({
            money: initialMoney + money,
            xp: initialXp + xp
          })
          .eq('user_id', currentUser.id);
        
        console.log('✅ Progression sauvegardée');
      } catch (err) {
        console.error('❌ Erreur sauvegarde:', err);
      }
    }

    async function goBack() {
      await saveProgress();
      window.location.href = 'game.html';
    }

    // Sauvegarde avant fermeture
    window.addEventListener('beforeunload', () => {
      saveProgress();
    });

    init();
  </script>
</body>
</html>
