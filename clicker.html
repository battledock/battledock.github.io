        ov.innerHTML=`<div style="background:white;border-radius:20px;padding:28px 22px;max-width:320px;width:90%;text-align:center"><div style="font-size:48px;margin-bottom:12px">🔒</div><div style="font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:#1a1a1a;margin-bottom:6px">En Maintenance</div><div style="font-size:12px;color:#6b7280;margin-bottom:20px;line-height:1.5">Le jeu est en cours de mise à jour.<br>Reviens bientôt !</div><input id="mInput" type="password" placeholder="Code d'accès..." style="-webkit-user-select:text;user-select:text;width:100%;padding:12px 14px;border:1px solid #e5e7eb;border-radius:10px;font-size:15px;outline:none;margin-bottom:10px;box-sizing:border-box;text-align:center;letter-spacing:3px"><button onclick="checkMaintenancePass()" style="width:100%;padding:13px;background:#1a1a1a;border:none;border-radius:10px;color:white;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px;cursor:pointer">ENTRER</button><div id="mErr" style="font-size:11px;color:#ef4444;margin-top:8px;display:none">Code incorrect</div></div>`;

      if(document.getElementById('mInput')?.value==='froid'){sessionStorage.setItem('bd_pass','froid');location.reload();}

  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
    html, body { height:100%; overflow:hidden; }
    body { font-family:'Inter',sans-serif; height:100dvh; display:flex; flex-direction:column; }

    #bg { position:fixed; inset:0; width:100%; height:100%; z-index:0; }

    @keyframes cloud { from{transform:translateX(var(--start))} to{transform:translateX(520px)} }
    .cl { position:fixed; top:0; left:0; width:375px; pointer-events:none; z-index:1; animation:cloud var(--dur) linear var(--delay) infinite; }

    .page { position:relative; z-index:5; flex:1; display:flex; flex-direction:column; overflow:hidden; }

    /* Header */
    .hdr { padding:calc(env(safe-area-inset-top) + 44px) 22px 0; flex-shrink:0; }
    .hdr-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    .hdr-title { font-family:'Bebas Neue',sans-serif; font-size:28px; color:white; line-height:1; }
    .hdr-label { font-family:'Bebas Neue',sans-serif; font-size:11px; letter-spacing:2px; color:rgba(255,255,255,0.7); }
    .hdr-money { font-family:'Bebas Neue',sans-serif; font-size:26px; color:white; line-height:1; text-align:right; }
    .hdr-session { font-size:9px; font-weight:700; color:rgba(255,255,255,0.55); letter-spacing:1px; text-align:right; }
    .xp-wrap { background:rgba(0,0,0,0.2); border:2px solid rgba(0,0,0,0.25); border-radius:10px; padding:8px 12px; display:flex; align-items:center; gap:10px; }
    .xp-lv { font-size:9px; font-weight:700; color:rgba(255,255,255,0.65); letter-spacing:1px; flex-shrink:0; }
    .xp-track { flex:1; height:7px; background:rgba(0,0,0,0.2); border-radius:3px; overflow:hidden; }
    .xp-fill { height:100%; width:0%; background:#FDD835; border-radius:2px; transition:width .3s ease; }
    .xp-ct { font-size:9px; font-weight:700; color:rgba(255,255,255,0.55); letter-spacing:1px; flex-shrink:0; white-space:nowrap; }

    /* Zone centrale */
    .scene { flex:1; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px; padding-top:40px; }

    /* Carte shift */
    .shift-card {
      display:flex; align-items:center; gap:10px;
      background:rgba(0,0,0,0.25); border:2px solid rgba(0,0,0,0.3);
      border-radius:14px; padding:9px 16px; width:290px;
      justify-content:space-between;
    }
    .shift-card.success-glow { border-color:rgba(74,222,128,0.5); background:rgba(74,222,128,0.1); }
    .shift-timer { font-family:'Bebas Neue',sans-serif; font-size:24px; color:#FDD835; line-height:1; min-width:38px; text-align:center; }
    .shift-timer.urgent { color:#f87171; }
    .shift-divider { width:1px; height:34px; background:rgba(255,255,255,0.1); flex-shrink:0; }
    .shift-obj { flex:1; padding:0 6px; }
    .shift-obj-lbl { font-size:8px; font-weight:700; color:rgba(255,255,255,0.4); letter-spacing:1px; }
    .shift-obj-val { font-family:'Bebas Neue',sans-serif; font-size:14px; color:white; letter-spacing:0.5px; margin-top:1px; }
    .shift-prime-amt { font-family:'Bebas Neue',sans-serif; font-size:16px; color:#4ade80; line-height:1; text-align:right; }
    .shift-prime-lbl { font-size:8px; font-weight:700; color:rgba(255,255,255,0.4); letter-spacing:1px; text-align:right; margin-top:1px; }

    /* Barre objectif */
    .obj-bar-wrap { width:290px; }
    .obj-bar-track { height:6px; background:rgba(0,0,0,0.2); border-radius:3px; overflow:hidden; border:1px solid rgba(0,0,0,0.2); }
    .obj-bar-fill { height:100%; width:0%; background:linear-gradient(90deg,#4ade80,#22c55e); border-radius:3px; transition:width .2s ease; }
    .obj-bar-fill.orange { background:linear-gradient(90deg,#f59e0b,#fbbf24); }
    .obj-bar-nums { display:flex; justify-content:space-between; margin-top:3px; }
    .obj-bar-nums span { font-size:8px; font-weight:700; color:rgba(255,255,255,0.4); }

    /* Calibration */
    .calib-card { display:flex; align-items:center; justify-content:space-between; gap:12px; background:rgba(0,0,0,0.2); border:2px solid rgba(0,0,0,0.2); border-radius:14px; padding:10px 16px; width:290px; }
    .calib-label { font-size:9px; font-weight:700; color:rgba(255,255,255,0.45); letter-spacing:2px; }
    .calib-hint { font-size:11px; color:rgba(255,255,255,0.5); margin-top:2px; }
    .calib-timer { font-family:'Bebas Neue',sans-serif; font-size:28px; color:rgba(255,255,255,0.5); }
    @keyframes dotPulse { 0%,100%{opacity:0.3}50%{opacity:1} }
    .calib-dot { width:6px; height:6px; border-radius:50%; background:#FDD835; animation:dotPulse 1s ease-in-out infinite; }

    /* Container cliquable */
    .container-box { width:186px; height:128px; background:linear-gradient(135deg,#cc2200,#991100); border-radius:10px; border:4px solid #0a0a0a; position:relative; overflow:hidden; cursor:pointer; }
    .container-box::before { content:''; position:absolute; inset:0; background:linear-gradient(180deg,rgba(255,255,255,0.07),transparent 50%); }
    .container-stripe { position:absolute; top:0; bottom:0; width:2px; background:rgba(0,0,0,0.22); }
    .container-label { position:absolute; bottom:16px; left:0; right:0; text-align:center; font-family:'Bebas Neue',sans-serif; font-size:14px; color:rgba(255,255,255,0.85); letter-spacing:3px; }

    /* Badge combo avec barre */
    .combo-wrap { display:inline-flex; align-items:center; gap:8px; background:rgba(0,0,0,0.22); border:2px solid rgba(0,0,0,0.28); border-radius:20px; padding:6px 14px; }
    .combo-val { font-family:'Bebas Neue',sans-serif; font-size:19px; color:white; min-width:40px; }
    .combo-bar-track { width:54px; height:4px; background:rgba(255,255,255,0.1); border-radius:2px; overflow:hidden; }
    .combo-bar-fill { height:100%; width:0%; background:linear-gradient(90deg,#fbbf24,#f59e0b); border-radius:2px; transition:width .1s linear; }
    .combo-lbl { font-size:9px; font-weight:700; color:rgba(255,255,255,0.45); letter-spacing:1px; }

    /* Stats bas */
    .stats { padding:0 18px; flex-shrink:0; }
    .stats-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:12px; }
    .stat { background:rgba(0,0,0,0.22); border:2px solid rgba(0,0,0,0.2); border-radius:12px; padding:10px; text-align:center; }
    .stat-v { font-family:'Bebas Neue',sans-serif; font-size:18px; color:white; }
    .stat-v.xp { color:#FDD835; }
    .stat-l { font-size:8px; font-weight:700; color:rgba(255,255,255,0.5); letter-spacing:1px; margin-top:1px; }
    .btn-back { width:100%; background:white; border:none; border-radius:14px; padding:13px; color:#1565C0; font-family:'Bebas Neue',sans-serif; font-size:14px; letter-spacing:2px; cursor:pointer; margin-bottom:calc(env(safe-area-inset-bottom, 20px) + 40px); }

    /* Music */
    .music-btn{position:fixed;top:calc(env(safe-area-inset-top,0px)+10px);right:12px;z-index:50;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.25);border:1.5px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer}
    .music-btn.playing{border-color:rgba(251,191,36,.4);animation:musicPulse 1.5s ease infinite}
    @keyframes musicPulse{0%,100%{box-shadow:0 0 0 rgba(251,191,36,0)}50%{box-shadow:0 0 10px rgba(251,191,36,.2)}}
    .music-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;align-items:flex-end;justify-content:center}
    .music-sheet{background:#1a1a1a;border-radius:20px 20px 0 0;width:100%;max-width:400px;padding:20px 16px calc(env(safe-area-inset-bottom,20px)+16px);animation:sheetUp .25s ease}
    @keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    .music-title{font-family:'Bebas Neue',sans-serif;font-size:18px;color:#fff;letter-spacing:2px;text-align:center;margin-bottom:14px}
    .music-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);margin-bottom:6px;cursor:pointer}
    .music-item.active{border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.08)}
    .music-item.locked{opacity:.35;pointer-events:none}
    .music-item-emoji{font-size:22px;width:36px;text-align:center}
    .music-item-name{flex:1;font-weight:700;font-size:12px;color:#fff}
    .music-item-status{font-size:9px;color:rgba(255,255,255,.3);font-weight:700}
    .music-item-status.active{color:#fbbf24}
    .music-close{width:100%;padding:12px;border:none;border-radius:12px;background:rgba(255,255,255,.06);color:rgba(255,255,255,.4);font-weight:700;font-size:12px;cursor:pointer;margin-top:8px}

    /* Popup shift */
    .shift-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:100; display:flex; align-items:center; justify-content:center; padding:24px; }
    .shift-popup { background:white; border-radius:24px; padding:32px 24px; width:100%; max-width:320px; text-align:center; animation:popIn .4s cubic-bezier(.34,1.56,.64,1); }
    @keyframes popIn { 0%{transform:scale(0.8);opacity:0} 100%{transform:scale(1);opacity:1} }
    .popup-emoji { font-size:52px; margin-bottom:8px; }
    .popup-tag { font-family:'Bebas Neue',sans-serif; font-size:11px; letter-spacing:3px; color:#9ca3af; margin-bottom:4px; }
    .popup-title { font-family:'Bebas Neue',sans-serif; font-size:34px; letter-spacing:1px; line-height:1; margin-bottom:4px; }
    .popup-title.success { color:#1565C0; }
    .popup-title.miss { color:#6b7280; }
    .popup-sub { font-size:13px; color:#9ca3af; margin-bottom:20px; }
    .popup-rewards { border-radius:16px; padding:16px; margin-bottom:16px; display:flex; justify-content:center; gap:24px; }
    .popup-rewards.success { background:#f0f6ff; }
    .popup-rewards.miss { background:#f9fafb; }
    .reward-item { text-align:center; }
    .reward-val { font-family:'Bebas Neue',sans-serif; font-size:28px; line-height:1; }
    .reward-val.money { color:#1565C0; }
    .reward-val.xp { color:#7c3aed; }
    .reward-val.neutral { color:#374151; }
    .reward-divider { width:1px; background:#e5e7eb; }
    .reward-lbl { font-size:9px; font-weight:700; color:#9ca3af; letter-spacing:1px; margin-top:3px; }
    .popup-stats { display:flex; justify-content:space-between; margin-bottom:16px; padding:0 4px; }
    .popup-stat { text-align:center; }
    .popup-stat-v { font-family:'Bebas Neue',sans-serif; font-size:17px; color:#0a0a0a; }
    .popup-stat-l { font-size:8px; font-weight:700; color:#9ca3af; letter-spacing:1px; margin-top:1px; }
    .popup-progress { margin-bottom:16px; }
    .popup-prog-lbl { font-size:9px; font-weight:700; color:#9ca3af; letter-spacing:1px; text-align:left; margin-bottom:5px; }
    .popup-prog-track { height:8px; background:#f3f4f6; border-radius:4px; overflow:hidden; }
    .popup-prog-fill { height:100%; background:linear-gradient(90deg,#f59e0b,#fbbf24); border-radius:4px; }
    .btn-primary { width:100%; background:#1565C0; border:none; border-radius:14px; padding:14px; color:white; font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:2px; cursor:pointer; margin-bottom:10px; }
    .btn-secondary { width:100%; background:transparent; border:none; color:#9ca3af; font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:1px; cursor:pointer; }

    /* Particules */
    .particle { position:fixed; pointer-events:none; font-family:'Bebas Neue',sans-serif; font-size:22px; font-weight:bold; color:#4ade80; z-index:999; animation:pflyup .8s ease-out forwards; }
    .particle.xp { color:#FDD835; font-size:17px; }
    @keyframes pflyup { 0%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-70px) scale(0.7)} }
  </style>
</head>

  const RHYTHM_WINDOW = 120000;          // fenêtre 2min pour détecter le rythme régulier
  let clickTimestamps = [];              // historique des timestamps de clics
  let suspiciousBlocked = false;         // si true, clics ignorés
  let suspiciousBlockUntil = 0;          // timestamp fin du blocage
  let rhythmSamples = [];                // échantillons de clics/sec
  let lastRhythmCheck = Date.now();

  function recordClick() {
    const now = Date.now();
    clickTimestamps.push(now);
    // Garder seulement la dernière seconde
    clickTimestamps = clickTimestamps.filter(t => now - t < 1000);
    return clickTimestamps.length;
  }

  function isAntiCheatBlocked() {
    const now = Date.now();
    if (suspiciousBlocked && now < suspiciousBlockUntil) return true;
    if (suspiciousBlocked && now >= suspiciousBlockUntil) suspiciousBlocked = false;
    return false;
  }

  function checkClickRate() {
    const cps = recordClick();
    // Si plus de 20 clics/sec → bloquer 5 secondes
    if (cps > MAX_CLICKS_PER_SEC) {
      suspiciousBlocked = true;
      suspiciousBlockUntil = Date.now() + 5000;
      return false;
    }
    return true;
  }

  // Vérification du rythme toutes les 10s
  function checkRhythm() {
    const now = Date.now();
    const elapsed = (now - lastRhythmCheck) / 1000;
    if (elapsed < 9) return;
    const cps = clicks / ((now - sessionStart) / 1000);
    rhythmSamples.push(cps);
    lastRhythmCheck = now;

    // Garder seulement les 12 derniers échantillons (2 minutes)
    if (rhythmSamples.length > 12) rhythmSamples = rhythmSamples.slice(-12);

    // Si au moins 12 échantillons (2 min) et variance très faible → autoclicker
    if (rhythmSamples.length >= 12) {
      const mean = rhythmSamples.reduce((a,b) => a+b, 0) / rhythmSamples.length;
      const variance = rhythmSamples.reduce((a,b) => a + Math.pow(b - mean, 2), 0) / rhythmSamples.length;
      // Variance < 0.5 sur 2min = rythme trop régulier
      if (mean > 2 && variance < 0.5) {
        flagSuspicious();
      }
    }
  }

  let sessionStart = Date.now();
  let flaggedSuspicious = false;

    if (flaggedSuspicious || !currentUser) return;

      if(calcXp !== (stats.xp_per_click||1) || calcMoney !== (stats.money_per_click||1)){

  // ── Calibration ──
  function startCalibration() {
    shiftState   = 'calibrating';
    calibSeconds = CALIB_DURATION;
    calibMoney   = 0;

  function activateShift() {
    // Calculer le rythme réel — plancher à 2€/s pour les joueurs immobiles
    const rate     = Math.max(calibMoney / CALIB_DURATION, 2);
    const factor   = getDifficultyFactor(currentLevel);
    // Objectif = taux × 75s × facteur (vise ~60-90s d'effort)
    shiftObjective = Math.round(rate * 75 * factor / 10) * 10; // arrondi à 10
    shiftPrime     = Math.round(shiftObjective * 0.15 / 5) * 5; // 15%, arrondi à 5
    shiftSeconds   = SHIFT_DURATION - CALIB_DURATION;           // temps restant (290s)
    shiftMoney     = 0;
    shiftMaxCombo  = combo;
    shiftXp        = 0;
    shiftClicks    = 0;
    shiftState     = 'active';

    document.getElementById('calibCard').style.display  = 'none';
    document.getElementById('shiftCard').style.display  = 'flex';
    document.getElementById('shiftObjLabel').textContent  = 'Gagne ' + shiftObjective.toLocaleString('fr-FR') + '€';
    document.getElementById('shiftPrimeLabel').textContent = '+' + shiftPrime.toLocaleString('fr-FR') + '€';
    document.getElementById('objBarTarget').textContent   = shiftObjective.toLocaleString('fr-FR') + '€';
    updateShiftBar();
    updateTimerDisplay();

    shiftInterval = setInterval(shiftTick, 1000);
  }

  function shiftTick() {
    if (shiftState !== 'active') return;
    shiftSeconds--;
    updateTimerDisplay();
    if (shiftSeconds <= 0) {
      clearInterval(shiftInterval);
      shiftEnded(false);
    }

    const m = Math.floor(shiftSeconds / 60);
    const s = shiftSeconds % 60;

  // ── Clic ──
  function handleTouch(e) {
    e.preventDefault();
    const now = Date.now();
    if (now - lastTouchTime < 50) return;
    lastTouchTime = now;
    const count = Math.min(e.touches.length, 4);
    for (let i = 0; i < count; i++) doClick(e.touches[i].clientX, e.touches[i].clientY);
  }
  function handleClick(e) {
    if (e.sourceCapabilities && !e.sourceCapabilities.firesTouchEvents) doClick(e.clientX, e.clientY);
  }

  function doClick(x, y) {
    // Anti-triche : vérification vitesse + blocage
    if (isAntiCheatBlocked()) return;
    if (!checkClickRate()) return;
    checkRhythm();

    clicks++;
    const xpGain = window.xpPerClick    || 1;
    const base   = window.moneyPerClick || 1;
    const gain   = Math.floor(base * combo);

    sessionXp    += xpGain;  currentXp   += xpGain;
    sessionMoney += gain;    totalMoney  += gain;

    // Combo
    const effectiveComboMax = window.COMBO_MAX_OVERRIDE || COMBO_MAX;
    combo = Math.min(combo + COMBO_INCREMENT, effectiveComboMax);
    if (shiftMaxCombo < combo) shiftMaxCombo = combo;

    if (shiftState === 'calibrating') {
      calibMoney += gain;
    } else if (shiftState === 'active') {
      shiftMoney  += gain;
      shiftXp     += xpGain;
      shiftClicks++;
      updateShiftBar();
      checkShiftSuccess();
    }

    spawnParticle(x, y, '+' + gain + '€', false);
    if (clicks % 3 === 0) spawnParticle(x - 20, y - 24, '+' + xpGain + ' XP', true);

    checkLevelUp();
    updateDisplay();
  }

  // ── Combo decay (progressif) ──
  function startComboDecay() {
    comboDecayInt = setInterval(() => {
      if (combo > 1) {
        combo = Math.max(1, combo - COMBO_DECAY_RATE);
        updateDisplay();
      }
    }, 100);
  }

  // ── Level up ──
  function checkLevelUp() {
    const needed = getXpRequired(currentLevel);
    if (currentXp >= needed) { currentXp -= needed; currentLevel++; save(); }
  }

  // ── Particules ──
  function spawnParticle(x, y, text, isXp) {
    const p = document.createElement('div');
    p.className = 'particle' + (isXp ? ' xp' : '');
    p.textContent = text;
    p.style.left = (x - 20 + Math.random() * 40) + 'px';
    p.style.top  = (y - 20) + 'px';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 800);
  }

  // ── Display ──
  function updateDisplay() {
    const needed = getXpRequired(currentLevel);
    const pct    = Math.min((currentXp / needed) * 100, 100);
    const mpc    = Math.floor((window.moneyPerClick || 1) * combo);

    document.getElementById('headerMoney').textContent   = totalMoney.toLocaleString('fr-FR') + '€';
    document.getElementById('xpLabel').textContent       = 'NV.' + currentLevel + ' · ' + getGrade(currentLevel);
    document.getElementById('xpCounter').textContent     = currentXp + ' / ' + needed + ' XP';
    document.getElementById('xpFill').style.width        = pct + '%';
    document.getElementById('comboDisplay').textContent  = '×' + combo.toFixed(1);
    document.getElementById('comboBarFill').style.width  = ((combo - 1) / (COMBO_MAX - 1) * 100) + '%';
    document.getElementById('perClickMoney').textContent = '+' + mpc + '€';
    document.getElementById('sessionXpDisplay').textContent = sessionXp + ' XP';
    document.getElementById('clicksDisplay').textContent = clicks;
  }

  // ── Save ──
  async function save() {
    if (!currentUser) return;

    // Plafonnement anti-triche : max 20 clics/sec × minutes jouées
    const minutesPlayed = (Date.now() - sessionStart) / 60000;
    const maxClicks = Math.ceil(minutesPlayed * 20 * 60);
    if (clicks > maxClicks && minutesPlayed > 1) {
      flagSuspicious();
    }

    // Mise à jour records clicker_clicks
    const { data: fresh } = await sb.from('game_stats').select('money, records').eq('user_id', currentUser.id).maybeSingle();
    const oldClicks = fresh?.records?.clicker_clicks || 0;
    const newClicks = oldClicks + clicks;

    await sb.from('game_stats').update({
      money:   Math.max(fresh?.money ?? 0, Math.floor(totalMoney)),
      xp:      Math.floor(currentXp),
      level:   currentLevel,
      grade:   getGrade(currentLevel),
      records: { ...(fresh?.records || {}), clicker_clicks: newClicks }
    }).eq('user_id', currentUser.id);
  }

  function goShop() {
    clearInterval(calibInterval);
    clearInterval(shiftInterval);
    clearInterval(comboDecayInt);
    save();
    window.location.href = 'boutiqueclicker.html';
  }

  async function goBack() {
    clearInterval(calibInterval);
    clearInterval(shiftInterval);
    clearInterval(comboDecayInt);
    const btn = document.getElementById('backBtn');
    btn.textContent = '💾...'; btn.disabled = true;
    try {
      await sb.from('game_stats').update({
        money: Math.floor(totalMoney),
        xp:    Math.floor(currentXp),
        level: currentLevel,
        grade: getGrade(currentLevel)
      }).eq('user_id', currentUser.id);
    } catch(e) { console.error(e); }
    window.location.href = 'travail.html';
  }

  window.addEventListener('beforeunload', save);
  init();


  </script>

<!-- Music Panel -->
<div class="music-overlay" id="musicOverlay" onclick="if(event.target===this)closeMusicPanel()">
  <div class="music-sheet">
    <div class="music-title">🎵 MUSIQUE</div>
    <div id="musicList"></div>
    <button class="music-close" onclick="closeMusicPanel()">FERMER</button>
  </div>
</div>

<script>
// ═══ MUSIC SYSTEM ═══
var MUSIC_CATALOG=[
  {id:'none',file:null,name:'Pas de musique',emoji:'🔇',price:0},
  {id:'rock-with-you',file:'music-rock-with-you.mp3',name:'La Danse du Container 🕺',price:35000,emoji:'🕺'},
  {id:'a-la-la',file:'music-a-la-la.mp3',name:'Docker en Vacances 🌴',price:40000,emoji:'🌴'},
  {id:'aventurier',file:'music-aventurier.mp3',name:'Aventurier des Quais ⚓',price:50000,emoji:'⚓'},
  {id:'demons-minuit',file:'music-demons-minuit.mp3',name:'Le Shift de 3h du Mat\' 🌙',price:50000,emoji:'🌙'},
  {id:'so-excited',file:'music-so-excited.mp3',name:'Vendredi Soir au Port 🎉',price:40000,emoji:'🎉'},
];
var _bgMusic=null,_selectedMusic='none',_unlockedMusic=['none'];

function toggleMusicPanel(){
  document.getElementById('musicOverlay').style.display='flex';
  renderMusicList();
}
function closeMusicPanel(){
  document.getElementById('musicOverlay').style.display='none';
}
function renderMusicList(){
  var html='';
  MUSIC_CATALOG.forEach(function(m){
    var unlocked=_unlockedMusic.indexOf(m.id)!==-1;
    var active=_selectedMusic===m.id;
    var cls='music-item'+(active?' active':'')+((!unlocked&&m.id!=='none')?' locked':'');
    html+='<div class="'+cls+'" onclick="selectMusic(\''+m.id+'\')">';
    html+='<div class="music-item-emoji">'+m.emoji+'</div>';
    html+='<div class="music-item-name">'+m.name+'</div>';
    if(!unlocked&&m.id!=='none')html+='<div class="music-item-status">🔒 BOUTIQUE</div>';
    else if(active)html+='<div class="music-item-status active">▶ EN COURS</div>';
    else html+='<div class="music-item-status">JOUER</div>';
    html+='</div>';
  });
  document.getElementById('musicList').innerHTML=html;
}
function selectMusic(id){
  _selectedMusic=id;
  var track=MUSIC_CATALOG.find(function(m){return m.id===id;});
  if(_bgMusic){_bgMusic.pause();_bgMusic=null;}
  document.getElementById('musicBtn').classList.remove('playing');
  if(track&&track.file){
    _bgMusic=new Audio(track.file);
    _bgMusic.loop=true;_bgMusic.volume=0.2;
    _bgMusic.play().catch(function(){});
    document.getElementById('musicBtn').classList.add('playing');
  }
  renderMusicList();
  // Save selection
  saveMusicChoice();
}
async function saveMusicChoice(){
  if(!window.currentUser)return;
  try{
    var gs=await window._sb.from('game_stats').select('records').eq('user_id',window.currentUser.id).maybeSingle();
    if(gs.data){var rec=gs.data.records||{};rec.selected_music=_selectedMusic;
      await window._sb.from('game_stats').update({records:rec}).eq('user_id',window.currentUser.id);}
  }catch(e){}
}
async function loadMusicPrefs(){
  if(!window.currentUser)return;
  try{
    var gs=await window._sb.from('game_stats').select('records').eq('user_id',window.currentUser.id).maybeSingle();
    if(gs.data&&gs.data.records){
      if(gs.data.records.unlocked_music)_unlockedMusic=['none'].concat(gs.data.records.unlocked_music);
      if(gs.data.records.selected_music){
        _selectedMusic=gs.data.records.selected_music;
        if(_unlockedMusic.indexOf(_selectedMusic)!==-1){
          var track=MUSIC_CATALOG.find(function(m){return m.id===_selectedMusic;});
          if(track&&track.file){
            _bgMusic=new Audio(track.file);_bgMusic.loop=true;_bgMusic.volume=0.2;
            _bgMusic.play().catch(function(){});
            document.getElementById('musicBtn').classList.add('playing');
          }
        }
      }
    }
  }catch(e){}
}
// Stop music when leaving
window.addEventListener('beforeunload',function(){if(_bgMusic)_bgMusic.pause();});
</script>
</body>
