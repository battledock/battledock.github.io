<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Docker du Port - Battle Dock</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      position: fixed;
      inset: 0;
      touch-action: none;
    }

    /* TOPBAR */
    .topbar {
      background: #ffffff;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      position: relative;
      z-index: 100;
    }

    .avatar {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
    }

    .player-info {
      flex: 1;
      min-width: 0;
    }

    .player-name {
      font-weight: 700;
      font-size: 14px;
      color: #1a1a1a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-grade {
      font-size: 11px;
      color: #6b7280;
    }

    .player-level {
      font-size: 11px;
      color: #6b7280;
      margin-top: 2px;
    }

    .money {
      text-align: right;
      flex-shrink: 0;
    }

    .money-amount {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      color: #10b981;
      letter-spacing: 0.5px;
    }

    .money-label {
      font-size: 10px;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* DOCK SCENE */
    .dock-scene {
      position: relative;
      width: 100%;
      height: calc(100vh - 72px - 80px);
      overflow: hidden;
      background: linear-gradient(180deg, #87ceeb 0%, #b9dceb 50%, #2b8aa6 100%);
    }

    /* Sun */
    .sun {
      position: absolute;
      top: 15%;
      right: 15%;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 220, 150, 1) 0%, rgba(255, 220, 150, 0.6) 70%, transparent 100%);
      pointer-events: none;
    }

    /* Mountains background */
    .mountains {
      position: absolute;
      bottom: 35%;
      width: 100%;
      height: 15%;
      background: linear-gradient(to bottom, transparent, #5a7a8a);
      clip-path: polygon(0% 100%, 15% 30%, 35% 65%, 50% 20%, 70% 55%, 85% 35%, 100% 70%, 100% 100%);
      opacity: 0.4;
      pointer-events: none;
    }

    /* Quai */
    .quai {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 35%;
      background: linear-gradient(to bottom, #8b7355 0%, #6b5744 100%);
      pointer-events: none;
    }

    .quai::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 8px;
      background: #a0826d;
    }

    /* Container cliquable */
    #container {
      position: absolute;
      bottom: 15%;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 160px;
      cursor: pointer;
      transition: transform 0.1s ease;
      z-index: 10;
    }

    #container:active {
      transform: translateX(-50%) scale(0.95);
    }

    /* FX Overlay */
    #fxOverlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20;
    }

    .float-num {
      position: absolute;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      color: #fbbf24;
      font-weight: 700;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5), 0 0 10px rgba(251, 191, 36, 0.6);
      pointer-events: none;
      animation: floatup 0.9s ease-out forwards;
      z-index: 30;
    }

    @keyframes floatup {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-80px); }
    }

    .ripple {
      position: absolute;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(251, 191, 36, 0.4), transparent);
      transform: translate(-50%, -50%);
      animation: ripple 0.5s ease-out forwards;
      pointer-events: none;
      z-index: 25;
    }

    @keyframes ripple {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
    }

    /* STATS BAR */
    .stats-bar {
      background: #ffffff;
      padding: 12px 16px;
      display: flex;
      justify-content: space-around;
      gap: 8px;
      box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.1);
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
    }

    .stat-item {
      text-align: center;
      flex: 1;
    }

    .stat-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      color: #1a1a1a;
      letter-spacing: 0.5px;
    }

    .stat-label {
      font-size: 10px;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    /* COMBO MULTIPLIER */
    .combo-display {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      padding: 12px 24px;
      border-radius: 12px;
      z-index: 50;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .combo-display.show {
      opacity: 1;
    }

    .combo-text {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      color: #fbbf24;
      text-shadow: 0 0 10px rgba(251, 191, 36, 0.8);
      letter-spacing: 1px;
    }

    /* BACK BUTTON */
    .back-btn {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border: 2px solid #e5e7eb;
      color: #1a1a1a;
      padding: 8px 16px;
      border-radius: 8px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      transition: all 0.2s;
      z-index: 60;
    }

    .back-btn:active {
      transform: scale(0.95);
    }

    /* RESPONSIVE */
    @media (max-width: 400px) {
      #container {
        width: 160px;
        height: 128px;
      }
      
      .float-num {
        font-size: 28px;
      }
      
      .stat-value {
        font-size: 18px;
      }
    }

    @media (max-height: 600px) {
      .dock-scene {
        height: calc(100vh - 60px - 70px);
      }
    }
  </style>
</head>
<body>
  <!-- TOPBAR -->
  <div class="topbar">
    <div class="avatar" id="avatar">⚓</div>
    <div class="player-info">
      <div class="player-name" id="usernameDisplay">Docker</div>
      <div class="player-grade" id="gradeDisplay">Docker Occasionnel</div>
      <div class="player-level">Niveau <span id="levelDisplay">1</span></div>
    </div>
    <div class="money">
      <div class="money-amount"><span id="moneyDisplay">100</span>€</div>
      <div class="money-label">Budget</div>
    </div>
  </div>

  <!-- DOCK SCENE -->
  <div class="dock-scene">
    <div class="sun"></div>
    <div class="mountains"></div>
    <div class="quai"></div>
    
    <button class="back-btn" onclick="goBack()">← Retour</button>
    
    <!-- COMBO DISPLAY -->
    <div class="combo-display" id="comboDisplay">
      <div class="combo-text">COMBO x<span id="comboValue">1.0</span></div>
    </div>

    <!-- CONTAINER SVG -->
    <svg id="container" viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg">
      <!-- Container rouge CMA CGM -->
      <defs>
        <linearGradient id="containerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#e74c3c"/>
          <stop offset="100%" style="stop-color:#c0392b"/>
        </linearGradient>
      </defs>
      
      <!-- Corps principal -->
      <rect x="5" y="20" width="90" height="55" fill="url(#containerGrad)" stroke="#a93226" stroke-width="1.5"/>
      
      <!-- Détails -->
      <rect x="10" y="25" width="80" height="7" fill="#c0392b" opacity="0.5"/>
      <rect x="10" y="67" width="80" height="5" fill="#a93226"/>
      
      <!-- Logo CMA CGM -->
      <text x="50" y="52" font-family="Arial" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">CMA CGM</text>
      
      <!-- Portes -->
      <rect x="15" y="35" width="12" height="25" fill="#2c3e50" stroke="#1a252f" stroke-width="0.8"/>
      <rect x="32" y="35" width="12" height="25" fill="#2c3e50" stroke="#1a252f" stroke-width="0.8"/>
      <rect x="56" y="35" width="12" height="25" fill="#2c3e50" stroke="#1a252f" stroke-width="0.8"/>
      <rect x="73" y="35" width="12" height="25" fill="#2c3e50" stroke="#1a252f" stroke-width="0.8"/>
      
      <!-- Reflets -->
      <rect x="8" y="22" width="35" height="3" fill="#fff" opacity="0.2"/>
      <rect x="60" y="22" width="30" height="3" fill="#fff" opacity="0.15"/>
    </svg>

    <!-- FX OVERLAY -->
    <div id="fxOverlay"></div>
  </div>

  <!-- STATS BAR -->
  <div class="stats-bar">
    <div class="stat-item">
      <div class="stat-value">+<span id="perClickDisplay">1</span>€</div>
      <div class="stat-label">Par Clic</div>
    </div>
    <div class="stat-item">
      <div class="stat-value">x<span id="comboDisplay2">1.0</span></div>
      <div class="stat-label">Combo</div>
    </div>
    <div class="stat-item">
      <div class="stat-value"><span id="totalClicksDisplay">0</span></div>
      <div class="stat-label">Total Clics</div>
    </div>
  </div>

  <script>
    console.log('🚀 [CLICKER] Initialisation du clicker Docker du Port');
    
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const supabaseClient = createClient(supabaseUrl, supabaseKey);

    const userId = localStorage.getItem('userId');
    const username = localStorage.getItem('username');
    
    console.log('👤 [CLICKER] userId:', userId);
    console.log('👤 [CLICKER] username:', username);
    
    if (!userId) {
      console.error('❌ [CLICKER] Pas de userId, redirection vers index.html');
      window.location.href = 'index.html';
    }

    // State
    let money = 100;
    let level = 1;
    let xp = 0;
    let combo = 1;
    let lastClickTime = 0;
    let totalClicks = 0;
    let perClick = 1;
    let maxCombo = 1;
    let saveTimeout = null;
    let currentAvatar = '⚓';

    loadPlayerData();

    async function loadPlayerData() {
      console.log('📥 [CLICKER] Chargement des données joueur...');
      
      try {
        const { data: progressArray, error } = await supabaseClient
          .from('game_progress')
          .select('*')
          .eq('user_id', userId);

        if (error) {
          console.error('❌ [CLICKER] Erreur chargement progression:', error);
          return;
        }

        if (progressArray && progressArray[0]) {
          const progress = progressArray[0];
          money = progress.money || 100;
          level = progress.level || 1;
          xp = progress.xp || 0;
          totalClicks = progress.total_clicks || 0;
          maxCombo = progress.max_combo || 1;
          
          console.log('✅ [CLICKER] Données chargées:', { money, level, xp, totalClicks, maxCombo });
        } else {
          console.warn('⚠️ [CLICKER] Aucune progression trouvée, valeurs par défaut utilisées');
        }

        // Charger l'avatar
        const { data: profile } = await supabaseClient
          .from('profiles')
          .select('avatar_url')
          .eq('user_id', userId)
          .single();
        
        if (profile) {
          currentAvatar = profile.avatar_url || '⚓';
          console.log('🎨 [CLICKER] Avatar chargé:', currentAvatar);
        }

        updateDisplay();
        
      } catch (err) {
        console.error('💥 [CLICKER] Exception lors du chargement:', err);
      }
    }

    function getRank(level) {
      if (level < 15) return 'Docker Occasionnel';
      if (level < 30) return 'Docker';
      if (level < 50) return 'Docker Mensuel';
      if (level < 80) return 'Contre-Maître';
      if (level < 100) return 'Chef de Quai';
      return 'Directeur de Compagnie';
    }

    function getXpRequired(level) {
      return Math.floor(100 * Math.pow(1.15, level - 1));
    }

    // CLICK HANDLER
    const container = document.getElementById('container');
    
    container.addEventListener('click', clickContainer);
    
    container.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      clickContainer({ clientX: touch.clientX, clientY: touch.clientY });
    }, { passive: false });

    function clickContainer(e) {
      const now = Date.now();
      const timeSinceLastClick = now - lastClickTime;

      // Combo system
      if (timeSinceLastClick < 600) {
        combo = Math.min(5, combo + 0.05);
      } else {
        combo = 1;
      }
      
      lastClickTime = now;
      if (combo > maxCombo) {
        maxCombo = combo;
        console.log('🔥 [CLICKER] Nouveau record de combo:', maxCombo.toFixed(2));
      }

      const gain = Math.floor(perClick * combo);
      money += gain;
      totalClicks += 1;

      // XP gain
      const oldLevel = level;
      xp += 1;
      const xpRequired = getXpRequired(level);
      
      if (xp >= xpRequired) {
        xp -= xpRequired;
        level += 1;
        console.log('⬆️ [CLICKER] Level UP!', oldLevel, '→', level);
      }

      // VIBRATION
      const vibrationEnabled = localStorage.getItem('setting_vibration') === 'true';
      if (vibrationEnabled && navigator.vibrate) {
        navigator.vibrate(10);
      }

      // SON
      const soundEnabled = localStorage.getItem('setting_sound') === 'true';
      if (soundEnabled) {
        playClickSound();
      }

      // Visual feedback
      const overlay = document.getElementById('fxOverlay');
      if (overlay) {
        const oRect = overlay.getBoundingClientRect();
        const cx = e.clientX - oRect.left;
        const cy = e.clientY - oRect.top;

        // Float number
        const f = document.createElement('div');
        f.className = 'float-num';
        f.textContent = '+' + gain + '€';
        f.style.left = cx + 'px';
        f.style.top = cy + 'px';
        overlay.appendChild(f);
        setTimeout(() => f.remove(), 950);

        // Ripple
        const r = document.createElement('div');
        r.className = 'ripple';
        r.style.left = cx + 'px';
        r.style.top = cy + 'px';
        overlay.appendChild(r);
        setTimeout(() => r.remove(), 550);
      }

      updateDisplay();
      scheduleSave();
    }

    // SON DE CLIC
    let audioContext = null;
    
    function playClickSound() {
      try {
        if (!audioContext) {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();
        
        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        
        oscillator.frequency.value = 800;
        oscillator.type = 'sine';
        
        gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
        
        oscillator.start(audioContext.currentTime);
        oscillator.stop(audioContext.currentTime + 0.1);
      } catch (err) {
        console.error('🔇 [CLICKER] Erreur son:', err);
      }
    }

    function updateDisplay() {
      document.getElementById('avatar').textContent = currentAvatar;
      document.getElementById('usernameDisplay').textContent = username || 'Joueur';
      document.getElementById('gradeDisplay').textContent = getRank(level);
      document.getElementById('levelDisplay').textContent = level;
      document.getElementById('moneyDisplay').textContent = money.toLocaleString('fr-FR');
      document.getElementById('perClickDisplay').textContent = perClick;
      document.getElementById('comboDisplay2').textContent = combo.toFixed(1);
      document.getElementById('totalClicksDisplay').textContent = totalClicks.toLocaleString('fr-FR');

      // Combo display
      const comboDisplayEl = document.getElementById('comboDisplay');
      const comboValueEl = document.getElementById('comboValue');
      
      if (combo > 1.5) {
        comboDisplayEl.classList.add('show');
        comboValueEl.textContent = combo.toFixed(1);
      } else {
        comboDisplayEl.classList.remove('show');
      }
    }

    function scheduleSave() {
      if (saveTimeout) {
        clearTimeout(saveTimeout);
      }
      
      saveTimeout = setTimeout(() => {
        saveProgress();
      }, 2000);
    }

    async function saveProgress() {
      console.log('💾 [CLICKER] Sauvegarde de la progression...');
      
      try {
        const { error: progressError } = await supabaseClient
          .from('game_progress')
          .update({
            money,
            level,
            xp,
            total_clicks: totalClicks,
            max_combo: maxCombo
          })
          .eq('user_id', userId);

        if (progressError) {
          console.error('❌ [CLICKER] Erreur sauvegarde progression:', progressError);
        } else {
          console.log('✅ [CLICKER] Progression sauvegardée');
        }

        // Update leaderboard
        const { error: leaderboardError } = await supabaseClient
          .from('leaderboard')
          .upsert({
            user_id: userId,
            score: money
          });

        if (leaderboardError) {
          console.error('❌ [CLICKER] Erreur update leaderboard:', leaderboardError);
        } else {
          console.log('✅ [CLICKER] Leaderboard mis à jour');
        }
        
      } catch (err) {
        console.error('💥 [CLICKER] Exception sauvegarde:', err);
      }
    }

    function goBack() {
      console.log('🔙 [CLICKER] Retour vers selectiontravail.html');
      saveProgress().then(() => {
        window.location.href = 'selectiontravail.html';
      });
    }

    // Sauvegarde avant fermeture
    window.addEventListener('beforeunload', () => {
      console.log('👋 [CLICKER] Fermeture de la page, sauvegarde...');
      saveProgress();
    });

    console.log('✅ [CLICKER] Initialisation terminée');
  </script>
</body>
</html>
