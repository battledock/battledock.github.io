<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Travailler - Battle Dock</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(180deg, #87ceeb 0%, #b8e4f7 60%, #d4a574 60%, #8b7355 100%);
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    .header {
      background: white;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      z-index: 10;
    }

    .header-btn {
      background: #3b82f6;
      border: none;
      color: white;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 14px;
      letter-spacing: 1px;
      transition: all 0.2s;
    }

    .header-btn.green { background: #10b981; }
    .header-btn:hover { transform: translateY(-2px); opacity: 0.9; }

    .header-money {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      color: #10b981;
      letter-spacing: 1px;
    }

    /* XP BAR */
    .xp-bar-container {
      background: #1a1a2e;
      padding: 8px 16px;
      z-index: 10;
    }

    .xp-bar-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .xp-bar-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 13px;
      color: #a78bfa;
      letter-spacing: 1px;
    }

    .xp-bar-track {
      width: 100%;
      height: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
      overflow: hidden;
    }

    .xp-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #7c3aed, #a78bfa);
      border-radius: 4px;
      transition: width 0.4s ease;
    }

    /* SCENE */
    .scene {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: 60px;
      padding-bottom: 80px;
      position: relative;
      overflow: hidden;
    }

    /* SUN */
    .sun {
      position: absolute;
      top: 30px;
      right: 60px;
      width: 70px;
      height: 70px;
      background: radial-gradient(circle, #fde68a, #fbbf24);
      border-radius: 50%;
      box-shadow: 0 0 40px rgba(251,191,36,0.5);
      animation: floatSun 4s ease-in-out infinite;
    }

    @keyframes floatSun { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }

    .clouds {
      position: absolute;
      top: 20px;
      left: 30px;
      font-size: 36px;
      opacity: 0.7;
      animation: drift 25s linear infinite;
    }

    @keyframes drift { 0%{transform:translateX(0)} 100%{transform:translateX(110vw)} }

    /* CONTAINER CLIQUABLE */
    .container-wrap {
      position: relative;
      cursor: pointer;
      transition: transform 0.1s;
      z-index: 5;
    }

    .container-wrap:active { transform: scale(0.93); }

    .container-box {
      width: 160px;
      height: 110px;
      background: linear-gradient(135deg, #cc2200, #991100);
      border-radius: 8px;
      border: 3px solid #880000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
      position: relative;
      overflow: hidden;
    }

    .container-box::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 40%;
      background: rgba(255,255,255,0.05);
    }

    .container-stripe {
      position: absolute;
      top: 0; bottom: 0;
      width: 3px;
      background: rgba(0,0,0,0.2);
    }

    .container-text {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      color: white;
      letter-spacing: 2px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      position: relative;
      z-index: 1;
    }

    .container-sub {
      font-size: 10px;
      color: rgba(255,255,255,0.7);
      letter-spacing: 1px;
      margin-top: 4px;
      position: relative;
      z-index: 1;
      text-align: center;
      width: 100%;
      z-index: 1;
    }

    /* CLICK PARTICLES */
    .particle {
      position: fixed;
      pointer-events: none;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      font-weight: bold;
      color: #10b981;
      text-shadow: 0 0 8px rgba(16,185,129,0.5);
      z-index: 999;
      animation: particleFly 0.8s ease-out forwards;
    }

    .particle.xp {
      color: #a78bfa;
      font-size: 16px;
    }

    @keyframes particleFly {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-60px) scale(0.7); }
    }

    /* STATS BAR */
    .stats-bar {
      background: linear-gradient(180deg, #1a1a2e, #0f0f1a);
      border-top: 2px solid #333;
      padding: 12px 16px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      z-index: 100;
      position: fixed;
      bottom: 0; left: 0; right: 0;
    }

    .stat-item { text-align: center; }

    .stat-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 17px;
      letter-spacing: 1px;
      color: #10b981;
    }

    .stat-value.purple { color: #a78bfa; }

    .stat-label {
      font-size: 9px;
      color: #666;
      text-transform: uppercase;
      margin-top: 2px;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <button class="header-btn" onclick="goBack()">← RETOUR</button>
    <div class="header-money" id="headerMoney">0€</div>
    <button class="header-btn green" onclick="window.location.href='shop.html'">⚙️ SHOP</button>
  </div>

  <!-- XP BAR -->
  <div class="xp-bar-container">
    <div class="xp-bar-header">
      <span class="xp-bar-label" id="xpLabel">Niveau 1 • Docker Occasionnel</span>
      <span class="xp-bar-label" id="xpCounter">0 / 200 XP</span>
    </div>
    <div class="xp-bar-track">
      <div class="xp-bar-fill" id="xpFill" style="width:0%"></div>
    </div>
  </div>

  <!-- SCENE -->
  <div class="scene" id="scene">
    <div class="sun"></div>
    <div class="clouds">☁️ ☁️</div>

    <div class="container-wrap" id="containerBtn" ontouchstart="handleTouch(event)" onclick="handleClick(event)">
      <div class="container-box">
        <div class="container-stripe" style="left:30px"></div>
        <div class="container-stripe" style="left:70px"></div>
        <div class="container-stripe" style="left:110px"></div>
        <div class="container-sub">CLIQUER POUR TRAVAILLER</div>
      </div>
    </div>
  </div>

  <!-- STATS BAR -->
  <div class="stats-bar">
    <div class="stat-item">
      <div class="stat-value" id="sessionMoneyDisplay">0€</div>
      <div class="stat-label">Session</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="comboDisplay">×1.0</div>
      <div class="stat-label">Combo</div>
    </div>
    <div class="stat-item">
      <div class="stat-value purple" id="sessionXpDisplay">0</div>
      <div class="stat-label">XP session</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="clicksDisplay">0</div>
      <div class="stat-label">Clics</div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

    // ===== XP SYSTEM =====
    function getXpRequired(level) {
      if (level <= 10) return level * 500;
      if (level <= 25) return level * 1000;
      if (level <= 50) return level * 2000;
      return level * 4000;
    }

    function getGrade(level) {
      if (level <= 4) return 'Docker Occasionnel';
      if (level <= 14) return 'Docker';
      if (level <= 29) return 'Docker Mensuel';
      if (level <= 49) return 'Contre-Maître';
      if (level <= 79) return 'Chef de Quai';
      return 'Magnat du Port';
    }

    // ===== STATE =====
    let currentUser = null;
    let totalMoney = 0;
    let sessionMoney = 0;
    let currentXp = 0;
    let currentLevel = 1;
    let sessionXp = 0;
    let combo = 1;
    let comboTimeout = null;
    let clicks = 0;
    let upgrades = {};
    let lastTouchTime = 0;

    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { window.location.href = 'index.html'; return; }
      currentUser = session.user;

      const { data: stats, error: statsErr } = await sb
        .from('game_stats')
        .select('money, xp, level, grade, xp_per_click, money_per_click')
        .eq('user_id', currentUser.id)
        .maybeSingle();

      if (statsErr) console.error('Stats error:', statsErr);

      const { data: profile } = await sb
        .from('profiles')
        .select('upgrades, skin_container')
        .eq('user_id', currentUser.id)
        .maybeSingle();

      if (stats) {
        totalMoney = stats.money || 0;
        currentXp = stats.xp || 0;
        currentLevel = stats.level || 1;
        window.xpPerClick    = stats.xp_per_click    || 1;
        window.moneyPerClick = stats.money_per_click  || 1;
      }

      upgrades = profile?.upgrades || {};

      // Appliquer skin conteneur
      const skin = profile?.skin_container || 'red';
      const skinColors = {
        red:    { bg: 'linear-gradient(135deg,#cc2200,#991100)', border: '#880000' },
        blue:   { bg: 'linear-gradient(135deg,#1d4ed8,#1e3a8a)', border: '#1e3a8a' },
        green:  { bg: 'linear-gradient(135deg,#15803d,#14532d)', border: '#14532d' },
        gold:   { bg: 'linear-gradient(135deg,#b45309,#92400e)', border: '#92400e' },
        black:  { bg: 'linear-gradient(135deg,#1a1a1a,#000000)', border: '#000000' },
        purple: { bg: 'linear-gradient(135deg,#7c3aed,#5b21b6)', border: '#5b21b6' }
      };
      const sc = skinColors[skin] || skinColors.red;
      const box = document.querySelector('.container-box');
      if (box) { box.style.background = sc.bg; box.style.borderColor = sc.border; }

      updateDisplay();
      if (upgrades.auto_clicker) setInterval(autoClick, 1000);
      setInterval(save, 10000);
    }

    function handleTouch(e) {
      e.preventDefault();
      const now = Date.now();
      if (now - lastTouchTime < 50) return;
      lastTouchTime = now;
      const count = Math.min(e.touches.length, 4);
      for (let i = 0; i < count; i++) doClick(e.touches[i].clientX, e.touches[i].clientY);
    }

    function handleClick(e) {
      if (e.sourceCapabilities && !e.sourceCapabilities.firesTouchEvents) {
        doClick(e.clientX, e.clientY);
      }
    }

    function doClick(x, y) {
      clicks++;
      const xpGain = window.xpPerClick || 1;
      sessionXp += xpGain;
      currentXp += xpGain;

      const baseGain = window.moneyPerClick || 1;
      const gain = Math.floor(baseGain * combo);

      sessionMoney += gain;
      totalMoney += gain;

      // Combo
      combo = Math.min(combo + 0.005, 2 + (upgrades.combo_max || 0) * 0.5);
      clearTimeout(comboTimeout);
      comboTimeout = setTimeout(() => { combo = 1; updateDisplay(); }, 400);

      // Particules
      spawnParticle(x, y, '+' + gain + '€', false);
      if (clicks % 3 === 0) spawnParticle(x - 20, y - 20, '+' + xpGain + ' XP', true);

      // Check level up
      checkLevelUp();
      updateDisplay();
    }

    function checkLevelUp() {
      const xpNeeded = getXpRequired(currentLevel);
      if (currentXp >= xpNeeded) {
        currentXp -= xpNeeded;
        currentLevel++;
        save();
      }
    }

    function spawnParticle(x, y, text, isXp) {
      const p = document.createElement('div');
      p.className = 'particle' + (isXp ? ' xp' : '');
      p.textContent = text;
      p.style.left = (x - 20 + Math.random() * 40) + 'px';
      p.style.top = (y - 20) + 'px';
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 800);
    }

    function autoClick() {
      const gain = upgrades.auto_clicker;
      sessionMoney += gain;
      totalMoney += gain;
      updateDisplay();
    }

    function updateDisplay() {
      const xpNeeded = getXpRequired(currentLevel);
      const percent = Math.min((currentXp / xpNeeded) * 100, 100);
      const grade = getGrade(currentLevel);

      document.getElementById('headerMoney').textContent = totalMoney.toLocaleString('fr-FR') + '€';
      document.getElementById('sessionMoneyDisplay').textContent = sessionMoney.toLocaleString('fr-FR') + '€';
      document.getElementById('comboDisplay').textContent = '×' + combo.toFixed(1);
      document.getElementById('sessionXpDisplay').textContent = sessionXp;
      document.getElementById('clicksDisplay').textContent = clicks;
      document.getElementById('xpLabel').textContent = `Niveau ${currentLevel} • ${grade}`;
      document.getElementById('xpCounter').textContent = `${currentXp} / ${xpNeeded} XP`;
      document.getElementById('xpFill').style.width = percent + '%';
    }

    async function save() {
      if (!currentUser) return;
      // Relire la BD et ajouter seulement la session en cours pour éviter d'écraser d'autres jeux
      const { data: fresh } = await sb.from('game_stats').select('money').eq('user_id', currentUser.id).maybeSingle();
      const baseMoney = fresh?.money ?? totalMoney;
      const { error } = await sb.from('game_stats').update({
        money: Math.max(baseMoney, Math.floor(totalMoney)),
        xp: Math.floor(currentXp),
        level: currentLevel,
        grade: getGrade(currentLevel)
      }).eq('user_id', currentUser.id);
      if (error) console.error('Save error:', error);
    }

    async function goBack() {
      const btn = document.querySelector('.header-btn');
      btn.textContent = '💾...';
      btn.disabled = true;
      try {
        const { error } = await sb.from('game_stats').update({
          money: Math.floor(totalMoney),
          xp: Math.floor(currentXp),
          level: currentLevel,
          grade: getGrade(currentLevel)
        }).eq('user_id', currentUser.id);
        if (error) {
          console.error('GoBack save error:', error);
          alert('Erreur sauvegarde: ' + error.message);
          btn.textContent = '← RETOUR';
          btn.disabled = false;
          return;
        }
      } catch(e) {
        console.error(e);
      }
      window.location.href = 'game.html';
    }

    window.addEventListener("beforeunload", save);
    init();
  </script>
</body>
</html>
