<!doctype html><html><head><meta charset="utf-8"><title>Façade ferme</title><style>
html,body{margin:0;background:#cdbfa0;font-family:monospace}
.wrap{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px}
canvas{image-rendering:pixelated;background:#e6e0d6;box-shadow:0 4px 20px rgba(0,0,0,.2)}
.lab{font-size:15px;font-weight:700;color:#2a2018}
.sub{font-size:12px;color:#6a5a40}
button{font-family:monospace;font-size:13px;padding:7px 14px;border:0;border-radius:8px;background:#2a62c8;color:#fff;font-weight:700}
</style></head><body>
<div class="wrap">
<div class="lab">Façade de la ferme — rendu moteur (niveau Galerie Bleue)</div>
<canvas id="cv" width="400" height="470"></canvas>
<div class="sub">x2 pour voir les détails. Aile de 200×210, posée à gauche du spawn.</div>
<button onclick="JOUR=!JOUR;rendre()">Basculer jour / nuit</button>
</div>
<script>
let JOUR=true;
const D=2;
const h=(x,y,k)=>{let n=((x*73856093)^(y*19349663)^(k*83492791))|0;n=(n^(n>>>13))*1274126177|0;return((n^(n>>>16))>>>0)/4294967296;};
const hx=s=>{const v=parseInt(s.slice(1),16);return[(v>>16)&255,(v>>8)&255,v&255];};
const mix=(a,b,k)=>{const A=hx(a),B=hx(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*k)).join(',')+')';};
const T=(c,d)=>{const a=hx(c);return '#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v+d))).toString(16).padStart(2,'0')).join('');};

/* ========================================================================
   FAÇADE DE LA FERME — même facture que dessinerTerrasses (galerie bleue) :
   demi-pixel, dégradés VG/HG, ombres OMB, pierre/bois texturés, toit de
   tuiles, grande porte de grange à double vantail, enseigne gravée,
   lanterne, lierre, cycle jour/nuit. Largeur DX=200, posée au sol.
   ======================================================================== */
function faceFerme(g,ST){
  const L=200, SOL=206, JOURv=ST.jour!==false;
  const q=v=>Math.round(v*2)/2;
  const R=(x,y,w,hh,c)=>{if(w<=0||hh<=0)return;const X=q(x),Y=q(y);g.fillStyle=c;g.fillRect(X,Y,Math.max(.5,q(x+w)-X),Math.max(.5,q(y+hh)-Y));};
  const VG=(x,y,w,hh,c1,c2)=>{for(let k=0;k<hh;k+=.5)R(x,y+k,w,.5,mix(c1,c2,k/Math.max(.5,hh-.5)));};
  const HG=(x,y,w,hh,st)=>{for(let k=0;k<w;k+=.5){const t=k/Math.max(.5,w-.5);let i=0;while(i<st.length-2&&t>st[i+1][0])i++;const[t0,c0]=st[i],[t1,c1]=st[i+1];R(x+k,y,.5,hh,mix(c0,c1,Math.min(1,Math.max(0,(t-t0)/(t1-t0)))));}};
  const OMB=(x,y,w,hh,a)=>{for(let k=0;k<hh;k+=.5)R(x,y+k,w,.5,'rgba(30,24,16,'+(a*(1-k/hh)).toFixed(3)+')');};
  const LUMS=[];

  /* teintes ferme : bois chaud, torchis, tuiles terre cuite, bardage rouge grange */
  const TORCHIS='#e6d3a8', TORCHIS_C='#f2e4c0', TORCHIS_S='#c8b088';
  const BOIS='#7a5230', BOIS_C='#996a3e', BOIS_S='#553720';
  const TUILE='#b4552e', TUILE_C='#cc6a3a', TUILE_S='#7e3a1e';
  const ROUGE='#9c3a2c', ROUGE_C='#b84a38', ROUGE_S='#6e2418';
  const TOIT=54;

  /* ---------- ciel ---------- */
  VG(0,-12,L,TOIT+14,JOURv?'#2a90d8':'#141c44',JOURv?'#8fcdec':'#323a6a');
  /* quelques collines derrière, douces */
  g.fillStyle=JOURv?'#8fae6a':'#2e3a52';g.beginPath();g.moveTo(0,TOIT+2);g.quadraticCurveTo(60,TOIT-16,120,TOIT+2);g.quadraticCurveTo(170,TOIT-10,L,TOIT-2);g.lineTo(L,TOIT+8);g.lineTo(0,TOIT+8);g.fill();

  /* ---------- le MUR de torchis texturé, à colombages ---------- */
  for(let y=TOIT;y<SOL;y+=8)for(let x=0;x<L;x+=16){const d=(h(x|0,y,3)-.5)*9;R(x,y,16,8,T(TORCHIS,d|0));R(x,y,16,.5,T(TORCHIS_C,d|0));}
  /* mouchetis du torchis */
  for(let i=0;i<300;i++){const x=h(i,1,9)*L,y=TOIT+h(i,2,9)*(SOL-TOIT);R(x,y,1,1,h(i,3,9)<.5?'rgba(120,96,60,.18)':'rgba(255,248,224,.14)');}
  /* colombages : poutres de bois en croix de Saint-André sur les panneaux latéraux */
  const colombage=(x0,x1)=>{
    R(x0,TOIT,3,SOL-TOIT,BOIS);R(x0,TOIT,3,SOL-TOIT,BOIS);R(x0,TOIT,1,SOL-TOIT,BOIS_C);
    R(x1-3,TOIT,3,SOL-TOIT,BOIS);R(x1-3,TOIT,1,SOL-TOIT,BOIS_C);
    for(const yy of [TOIT+2,(TOIT+SOL)/2,SOL-10]){R(x0,yy,x1-x0,3,BOIS);R(x0,yy,x1-x0,1,BOIS_C);}
    /* croix */
    g.strokeStyle=BOIS;g.lineWidth=3;g.beginPath();g.moveTo(x0+2,TOIT+4);g.lineTo(x1-2,(TOIT+SOL)/2);g.moveTo(x1-2,TOIT+4);g.lineTo(x0+2,(TOIT+SOL)/2);g.stroke();
    g.strokeStyle=BOIS_C;g.lineWidth=1;g.beginPath();g.moveTo(x0+2,TOIT+4);g.lineTo(x1-2,(TOIT+SOL)/2);g.stroke();
  };
  colombage(6,52);colombage(148,194);

  /* ---------- deux fenêtres à volets, vitres éclairées + fleurs ---------- */
  const fenetre=(fx,fy,fw,fh)=>{
    R(fx-3,fy-3,fw+6,fh+6,BOIS);R(fx-3,fy-3,fw+6,1.5,BOIS_C);OMB(fx-3,fy-3,fw+6,2,.25);
    const lum=!JOURv||h(fx|0,fy|0,7)<.6;
    if(lum){VG(fx,fy,fw,fh,'#fff2cc','#e8b86a');LUMS.push([fx,fy,fw,fh]);}
    else VG(fx,fy,fw,fh,'#bcd2de','#4a6470');
    /* croisillons */
    R(fx+fw/2-.5,fy,1,fh,BOIS);R(fx,fy+fh/2-.5,fw,1,BOIS);
    /* reflet */
    g.fillStyle='rgba(255,255,255,.22)';g.beginPath();g.moveTo(fx+1,fy+fh-2);g.lineTo(fx+fw*.5,fy+1);g.lineTo(fx+fw*.5+2,fy+1);g.lineTo(fx+3,fy+fh-2);g.closePath();g.fill();
    /* volets ouverts, de part et d'autre */
    for(const [sx,sg] of [[fx-3-7,0],[fx+fw+3,1]]){R(sx,fy-3,7,fh+6,ROUGE);R(sx,fy-3,7,1,ROUGE_C);
      for(let k=0;k<fh;k+=4)R(sx+1,fy+k,5,2,ROUGE_S);}
    /* jardinière fleurie sous la fenêtre */
    R(fx-2,fy+fh,fw+4,4,'#6a4a2e');R(fx-2,fy+fh,fw+4,1,'#8a6440');
    for(let k=0;k<fw+2;k+=4)R(fx+k-1,fy+fh-2,3,3,['#e85a6a','#f2c230','#e86a9a','#f28a30'][(k/4|0)%4]);
  };
  fenetre(20,86,24,24);fenetre(156,86,24,24);

  /* ---------- la GRANDE PORTE DE GRANGE, double vantail, au centre ---------- */
  const PX=68, PW=64, PY=118, PH=SOL-PY;
  /* linteau + jambages de pierre */
  R(PX-6,PY-6,PW+12,6,'#b7ac97');R(PX-6,PY-6,PW+12,1.5,'#cdc2a8');OMB(PX-6,PY,PW+12,2,.3);
  R(PX-6,PY-6,5,PH+6,'#b2a890');R(PX+PW+1,PY-6,5,PH+6,'#b2a890');
  /* l'ébrasement sombre */
  R(PX,PY,PW,PH,'#1c1208');
  /* les deux vantaux en planches rouges (porte fermée, entrebâillée par la lueur) */
  for(const [vx,vw] of [[PX+1,PW/2-1.5],[PX+PW/2+.5,PW/2-1.5]]){
    for(let x=vx;x<vx+vw;x+=5){const d=(h(x|0,2,76)-.5)*16;R(x,PY+1,5,PH-2,T(ROUGE,d|0));R(x,PY+1,1,PH-2,ROUGE_S);}
    R(vx,PY+1,vw,1.5,ROUGE_C);
    /* ferrures noires en Z */
    R(vx+1,PY+8,vw-2,2.5,'#2a211a');R(vx+1,PY+PH-16,vw-2,2.5,'#2a211a');
    g.strokeStyle='#2a211a';g.lineWidth=2.5;g.beginPath();g.moveTo(vx+1,PY+10),g.lineTo(vx+vw-1,PY+PH-16);g.stroke();
    /* clous */
    for(let k=0;k<vw;k+=6){R(vx+k+1,PY+9,1.5,1.5,'#4a3a2a');R(vx+k+1,PY+PH-15,1.5,1.5,'#4a3a2a');}
  }
  /* la fente centrale, d'où s'échappe la lumière chaude de la ferme */
  const gr=g.createLinearGradient(PX+PW/2-6,0,PX+PW/2+6,0);gr.addColorStop(0,'rgba(255,210,130,0)');gr.addColorStop(.5,'rgba(255,224,160,.75)');gr.addColorStop(1,'rgba(255,210,130,0)');
  g.fillStyle=gr;g.fillRect(PX+PW/2-6,PY+2,12,PH-4);
  R(PX+PW/2-.5,PY+1,1,PH-2,'#1a1008');
  /* deux anneaux-poignées en fer */
  for(const ax of [PX+PW/2-7,PX+PW/2+7]){g.strokeStyle='#1a140e';g.lineWidth=1.6;g.beginPath();g.arc(ax,PY+PH*.55,3,0,7);g.stroke();}

  /* ---------- le TOIT de tuiles, à deux pentes, débordant ---------- */
  /* pignon triangulaire au-dessus de la porte */
  g.fillStyle=TORCHIS;g.beginPath();g.moveTo(PX-14,PY-4);g.lineTo(PX+PW/2,PY-40);g.lineTo(PX+PW+14,PY-4);g.closePath();g.fill();
  for(let x=PX-12;x<PX+PW+12;x+=14){const yy=PY-4-36*(1-Math.abs(x-(PX+PW/2))/(PW/2+14));if(yy<PY-4){const d=(h(x|0,3,77)-.5)*8;R(x,yy,14,PY-4-yy,T(TORCHIS,d|0));}}
  /* colombage du pignon */
  g.strokeStyle=BOIS;g.lineWidth=2.5;g.beginPath();g.moveTo(PX-14,PY-4);g.lineTo(PX+PW/2,PY-40);g.lineTo(PX+PW+14,PY-4);g.moveTo(PX+PW/2,PY-40);g.lineTo(PX+PW/2,PY-4);g.stroke();
  /* lucarne à foin dans le pignon */
  R(PX+PW/2-7,PY-28,14,11,'#2a1c10');R(PX+PW/2-5,PY-26,10,8,'#140e06');R(PX+PW/2-4,PY-22,8,4,'#e0a830');R(PX+PW/2-4,PY-22,8,1.2,'#f2c250');
  /* poutre + poulie de grenier */
  R(PX+PW/2-1,PY-34,2,8,BOIS);R(PX+PW/2-3,PY-34,6,2,BOIS_S);

  /* toit principal : grande pente de tuiles sur toute la largeur */
  const tx0=-6, tx1=L+6, ty=TOIT;
  /* planche de rive */
  R(tx0,ty-2,tx1-tx0,4,BOIS);R(tx0,ty-2,tx1-tx0,1,BOIS_C);
  /* rangs de tuiles */
  for(let ry=ty-2;ry>ty-30;ry-=5){const prof=(ty-2-ry)/28;
    for(let x=tx0;x<tx1;x+=8){const d=(h(x|0,ry|0,5)-.5)*14;const base=mix(TUILE,'#8a4020',prof*.5);
      R(x,ry,8,5,T(base, d|0));R(x,ry,8,1,mix(TUILE_C,'#a85830',prof*.5));R(x+h(x,ry,6)*6,ry+1,1,3,TUILE_S);}
  }
  /* faîtière */
  R(tx0,ty-30,tx1-tx0,3,TUILE_S);R(tx0,ty-30,tx1-tx0,1,TUILE_C);
  OMB(0,ty+2,L,4,.3);

  /* ---------- l'ENSEIGNE en bois suspendue : "LA FERME" ---------- */
  {const ex=PX+PW/2, ey=PY-2;
   /* potence */
   R(PX+PW+6,PY-10,2,2,BOIS_S);
   const sx=52, sw=96, sy=SOL-PH+2;
   /* on la met plutôt en bandeau sous le toit, lisible */
   const bx=40,bw=120,by=TOIT+4;
   R(bx,by,bw,13,'#5a3c22');R(bx,by,bw,1.5,'#7a5230');R(bx,by+11.5,bw,1.5,'#3a2410');
   R(bx+2,by+2,bw-4,9,'#6a4628');
   g.fillStyle='#f4e6c4';g.font='bold 8px "Georgia",serif';g.textAlign='center';g.textBaseline='middle';
   g.fillText('LA FERME',bx+bw/2,by+7);
   /* petit épi de blé décoratif de chaque côté */
   for(const gx of [bx+10,bx+bw-10]){R(gx,by+4,1,6,'#d8a830');for(let k=0;k<3;k++){R(gx-2,by+4+k*2,2,1.5,'#e8c250');R(gx+1,by+4+k*2,2,1.5,'#e8c250');}}
  }

  /* ---------- lanterne allumée à droite de la porte ---------- */
  {const lx=PX+PW+10, ly=PY+30;R(lx-1,ly-10,2,10,'#2a2018');R(lx-3,ly,6,8,'#2a2018');
   VG(lx-2,ly+1,4,6,'#fff0c0','#f0b040');if(!JOURv||true)LUMS.push([lx-2,ly+1,4,6]);
   R(lx-3,ly-1,6,1.5,'#1a140e');
   const gr2=g.createRadialGradient(lx,ly+4,0,lx,ly+4,14);gr2.addColorStop(0,'rgba(255,220,140,'+(JOURv?.25:.6)+')');gr2.addColorStop(1,'rgba(255,220,140,0)');g.fillStyle=gr2;g.fillRect(lx-14,ly-10,28,28);}

  /* ---------- le sol : terre battue + paille devant la porte ---------- */
  R(0,SOL,L,210-SOL,'#c9b48a');
  for(let i=0;i<120;i++){const x=h(i,5,8)*L,y=SOL+h(i,6,8)*(210-SOL);R(x,y,2+h(i,7,8)*3,1,h(i,8,8)<.5?'#b8a074':'#d8c69a');}
  /* un peu de paille devant le seuil */
  for(let i=0;i<40;i++){const x=PX+h(i,1,12)*PW,y=SOL+h(i,2,12)*8;g.strokeStyle=['#d8b85a','#e8c860','#c8a040'][i%3];g.lineWidth=.6;g.beginPath();g.moveTo(x,y);g.lineTo(x+h(i,3,12)*5-2.5,y-h(i,4,12)*4);g.stroke();}
  R(0,SOL,L,1,'rgba(40,30,20,.25)');

  /* ---------- lierre qui grimpe sur le colombage droit ---------- */
  for(let side of [[50,-1],[150,1]]){let lx=side[0],ly=SOL-4;for(let j=0;j<16;j++){R(lx,ly,4,4,['#3a6a2e','#4a7a3a','#5a8a46'][j%3]);R(lx+side[1]*2,ly-3,3,3,'#4a7a3a');lx+=side[1]*(h(j,side[0],13)*2.5);ly-=6;}}

  /* ---------- NUIT ---------- */
  if(!JOURv){g.save();g.globalCompositeOperation='multiply';g.fillStyle='rgb(110,110,165)';g.fillRect(0,-12,L,222);g.restore();
    g.save();g.globalCompositeOperation='lighter';for(const [x,y,w,hh] of LUMS){g.fillStyle='rgba(140,90,35,.6)';g.fillRect(x,y,w,hh);}
    /* la lueur de la porte, plus forte la nuit */
    g.fillStyle='rgba(255,200,120,.5)';g.fillRect(PX+PW/2-6,PY+2,12,PH-4);g.restore();}
}

function rendre(){
  const cv=document.getElementById('cv'),g=cv.getContext('2d');
  g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,cv.width,cv.height);g.imageSmoothingEnabled=false;
  /* on dessine la façade (200×210) agrandie x2 pour voir les détails */
  const off=document.createElement('canvas');off.width=200*D;off.height=210*D;
  const og=off.getContext('2d');og.setTransform(D,0,0,D,0,0);og.imageSmoothingEnabled=false;
  faceFerme(og,{jour:JOUR});
  g.imageSmoothingEnabled=false;g.drawImage(off,0,0,200*D,210*D,0,20,400,420);
}
rendre();
</script></body></html>
