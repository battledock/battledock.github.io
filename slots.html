<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Slots - Battle Dock Casino</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(180deg, #0f172a 0%, #1e293b 50%, #334155 100%);
      min-height: 100vh;
      padding-bottom: 80px;
      overflow-x: hidden;
    }

    .container { max-width: 500px; margin: 0 auto; padding: 16px; }

    /* HEADER */
    .header {
      background: linear-gradient(135deg, #1e293b, #334155);
      border: 2px solid rgba(251, 191, 36, 0.3);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .back-btn {
      background: rgba(251, 191, 36, 0.2);
      border: 2px solid rgba(251, 191, 36, 0.5);
      color: #fbbf24;
      border-radius: 10px;
      padding: 8px 14px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    .game-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(20px, 5vw, 28px);
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
    }

    .balance {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #0f172a;
      padding: 6px 12px;
      border-radius: 10px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
    }

    /* GAME AREA */
    .game-area {
      background: linear-gradient(135deg, #1e293b, #334155);
      border: 2px solid rgba(251, 191, 36, 0.2);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    /* PAYTABLE */
    .paytable {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(251, 191, 36, 0.2);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 20px;
    }

    .paytable-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      color: #fbbf24;
      text-align: center;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .pay-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      margin-bottom: 4px;
    }

    .pay-symbols {
      font-size: 18px;
    }

    .pay-mult {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      color: #10b981;
    }

    /* SLOTS DISPLAY */
    .slots-display {
      display: flex;
      justify-content: center;
      gap: clamp(8px, 2vw, 16px);
      margin-bottom: 20px;
    }

    .slot-reel {
      width: min(90px, 28vw);
      height: min(120px, 40vw);
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 4px solid #fbbf24;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.5);
    }

    .reel-strip {
      position: absolute;
      width: 100%;
      top: 0;
      transition: top 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .slot-symbol {
      width: 100%;
      height: min(120px, 40vw);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(36px, 10vw, 50px);
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
    }

    /* CONTROLS */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .bet-control {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.05);
      padding: 12px 20px;
      border-radius: 12px;
      border: 2px solid rgba(251, 191, 36, 0.2);
    }

    .bet-control label {
      font-weight: 700;
      font-size: 14px;
      color: #fbbf24;
    }

    .bet-control input {
      width: 140px;
      padding: 10px;
      border: 2px solid #fbbf24;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }

    .play-btn {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #0f172a;
      border: none;
      border-radius: 14px;
      padding: 14px 48px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(251, 191, 36, 0.4);
      transition: all 0.2s;
    }

    .play-btn:active {
      transform: scale(0.95);
    }

    .play-btn:disabled {
      background: #475569;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* RESULT */
    .result {
      display: none;
      margin-top: 16px;
      padding: 16px;
      border-radius: 12px;
      text-align: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 1px;
      animation: slideUp 0.3s;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result.win {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.5);
    }

    .result.lose {
      background: linear-gradient(135deg, #dc2626, #991b1b);
      color: white;
      box-shadow: 0 4px 16px rgba(220, 38, 38, 0.5);
    }

    /* BOTTOM NAV */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(135deg, #1e293b, #334155);
      border-top: 2px solid rgba(251, 191, 36, 0.3);
      padding: 12px 16px;
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.5);
      z-index: 100;
    }

    .nav-btn {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      display: flex;
      background: rgba(251, 191, 36, 0.2);
      border: 2px solid rgba(251, 191, 36, 0.5);
      color: #fbbf24;
      border-radius: 12px;
      padding: 12px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      letter-spacing: 1px;
      cursor: pointer;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <button class="back-btn" onclick="window.location.href='casino-new.html'">← Casino</button>
      <div class="game-title">🎰 SLOTS</div>
      <div class="balance" id="balance">0€</div>
    </div>

    <div class="game-area">
      <div class="paytable">
        <div class="paytable-title">💰 TABLEAU DES GAINS</div>
        <div class="pay-row"><span class="pay-symbols">⚓ ⚓ ⚓</span><span class="pay-mult">×3</span></div>
        <div class="pay-row"><span class="pay-symbols">🚢 🚢 🚢</span><span class="pay-mult">×4</span></div>
        <div class="pay-row"><span class="pay-symbols">📦 📦 📦</span><span class="pay-mult">×5</span></div>
        <div class="pay-row"><span class="pay-symbols">💎 💎 💎</span><span class="pay-mult">×10</span></div>
        <div class="pay-row"><span class="pay-symbols">👑 👑 👑</span><span class="pay-mult">×20</span></div>
        <div class="pay-row"><span class="pay-symbols">🌟 🌟 🌟</span><span class="pay-mult">×50 🏆</span></div>
      </div>

      <div class="slots-display">
        <div class="slot-reel">
          <div class="reel-strip" id="strip1"></div>
        </div>
        <div class="slot-reel">
          <div class="reel-strip" id="strip2"></div>
        </div>
        <div class="slot-reel">
          <div class="reel-strip" id="strip3"></div>
        </div>
      </div>

      <div class="controls">
        <div class="bet-control">
          <label>MISE:</label>
          <input type="number" id="betInput" value="100" min="100" step="50">
        </div>
        <button class="play-btn" id="spinBtn" onclick="spin()">JOUER</button>
      </div>

      <div class="result" id="result"></div>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-btn" onclick="window.location.href='casino-new.html'">
      ← RETOUR AU CASINO
    </button>
  </div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const sb = createClient(supabaseUrl, supabaseKey);

    let currentUser, userMoney = 0;

    // Anti-zoom
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('gesturechange', e => e.preventDefault());

    // Système équilibré - Plus généreux (Avantage maison 12%)
    const symbols = {
      '⚓': { mult: 3, weight: 20 },   // 40% chance
      '🚢': { mult: 4, weight: 15 },   // 30%
      '📦': { mult: 5, weight: 10 },   // 20%
      '💎': { mult: 10, weight: 3 },   // 6%
      '👑': { mult: 20, weight: 1.5 }, // 3%
      '🌟': { mult: 50, weight: 0.5 }  // 1%
    };

    function getWeightedSymbol() {
      const totalWeight = Object.values(symbols).reduce((sum, s) => sum + s.weight, 0);
      let random = Math.random() * totalWeight;
      for (let [symbol, data] of Object.entries(symbols)) {
        random -= data.weight;
        if (random <= 0) return symbol;
      }
      return '⚓';
    }

    function initSlots() {
      for (let i = 1; i <= 3; i++) {
        const strip = document.getElementById('strip' + i);
        strip.innerHTML = '';
        for (let j = 0; j < 60; j++) {
          const div = document.createElement('div');
          div.className = 'slot-symbol';
          div.textContent = getWeightedSymbol();
          strip.appendChild(div);
        }
      }
    }

    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { window.location.href = 'index.html'; return; }
      currentUser = session.user;
      await loadMoney();
      initSlots();
    }

    async function loadMoney() {
      const { data } = await sb.from('game_stats').select('money').eq('user_id', currentUser.id).single();
      if (data) {
        userMoney = data.money || 0;
        document.getElementById('balance').textContent = userMoney.toLocaleString('fr-FR') + '€';
      }
    }

    async function updateMoney(amount) {
      userMoney += amount;
      await sb.from('game_stats').update({ money: userMoney }).eq('user_id', currentUser.id);
      document.getElementById('balance').textContent = userMoney.toLocaleString('fr-FR') + '€';
    }

    async function spin() {
      const bet = parseInt(document.getElementById('betInput').value);
      if (bet < 100 || bet > userMoney) { alert('Mise invalide !'); return; }

      const btn = document.getElementById('spinBtn');
      btn.disabled = true;
      await updateMoney(-bet);

      const results = [getWeightedSymbol(), getWeightedSymbol(), getWeightedSymbol()];

      // Animation avec timing différent pour chaque rouleau
      for (let i = 1; i <= 3; i++) {
        const strip = document.getElementById('strip' + i);
        const symbolHeight = strip.querySelector('.slot-symbol').offsetHeight;
        const spins = 20 + i * 5;
        const finalPosition = spins;
        const duration = 1500 + i * 300;

        strip.style.transition = `top ${duration}ms cubic-bezier(0.25, 0.46, 0.45, 0.94)`;
        strip.style.top = `-${symbolHeight * finalPosition}px`;

        setTimeout(() => {
          const syms = strip.querySelectorAll('.slot-symbol');
          if (syms[finalPosition]) syms[finalPosition].textContent = results[i - 1];
        }, duration - 100);
      }

      setTimeout(async () => {
        // Reset positions
        for (let i = 1; i <= 3; i++) {
          const strip = document.getElementById('strip' + i);
          strip.style.transition = 'none';
          strip.style.top = '0px';
        }

        const res = document.getElementById('result');
        if (results[0] === results[1] && results[1] === results[2]) {
          const mult = symbols[results[0]].mult;
          const win = bet * mult;
          res.className = 'result win';
          res.textContent = `🎉 ${results[0]} ${results[0]} ${results[0]} ! ×${mult} = +${win.toLocaleString('fr-FR')}€`;
          await updateMoney(win);
        } else {
          res.className = 'result lose';
          res.textContent = `💔 ${results[0]} ${results[1]} ${results[2]} - Perdu ${bet.toLocaleString('fr-FR')}€`;
        }

        res.style.display = 'block';
        btn.disabled = false;
      }, 2700);
    }

    init();
  </script>
</body>
</html>
