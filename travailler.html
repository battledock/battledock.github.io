<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Battle Dock — L'Accueil Légendaire</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Space+Grotesk:wght@500;700;900&family=Bungee&family=Luckiest+Guy&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  
  <style>
    :root {
      --port-dark-bg: #090d16;
      --port-panel: #151f32;
      --port-panel-border: #22314d;
      
      --comic-black: #000000;
      --comic-yellow: #facc15;
      --comic-orange: #f97316;
      --comic-red: #ef4444;
      --comic-green: #10b981;
      --comic-blue: #3b82f6;
      
      --border-thick: 4px solid #000000;
      --border-thin: 2px solid #000000;
      --3d-shadow: 0 8px 0px #000000;
      --3d-shadow-small: 0 4px 0px #000000;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background-color: var(--port-dark-bg);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .app-viewport {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background: linear-gradient(180deg, #0e1726 0%, var(--port-dark-bg) 100%);
      border-left: var(--border-thick);
      border-right: var(--border-thick);
      position: relative;
      display: flex;
      flex-direction: column;
      padding-bottom: 24px;
    }

    /* --- HEADER --- */
    .premium-header {
      background: linear-gradient(135deg, #111c30 0%, #090d16 100%);
      border-bottom: var(--border-thick);
      padding: 20px 16px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header-main-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .docker-profile-card {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .avatar-container {
      width: 76px;
      height: 76px;
      background: #243249;
      border: var(--border-thick);
      position: relative;
    }

    .avatar-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .level-badge {
      position: absolute;
      bottom: -6px;
      right: -6px;
      background: var(--comic-blue);
      border: var(--border-thin);
      color: #fff;
      font-family: 'Bungee', sans-serif;
      font-size: 11px;
      padding: 1px 5px;
      box-shadow: 2px 2px 0 #000;
    }

    .docker-name {
      font-family: 'Luckiest Guy', cursive;
      font-size: 19px;
      color: #ffffff;
      text-shadow: 2px 2px 0px #000;
    }

    .docker-rank-title {
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      color: var(--comic-orange);
    }

    .arcade-counters {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 125px;
    }

    .counter-slot {
      border: var(--border-thick);
      padding: 6px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 900;
      font-size: 14px;
      box-shadow: var(--3d-shadow-small);
    }

    .counter-slot.money { background: linear-gradient(180deg, var(--comic-yellow) 0%, #ca8a04 100%); color: #000; }
    .counter-slot.energy { background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%); color: #000; }

    .xp-milestone-bar {
      width: 100%;
      background: #060910;
      border: var(--border-thin);
      height: 12px;
    }

    .xp-fill-stream {
      width: 0%; 
      height: 100%;
      background: linear-gradient(90deg, var(--comic-green) 0%, #059669 100%);
    }

    /* --- MENU --- */
    .menu-stack {
      display: flex;
      flex-direction: column;
      width: 100%;
    }
    .menu-stack > * { border-bottom: var(--border-thick); }

    /* --- BOUTON PRINCIPAL TRAVAILLER --- */
    .hero-button-work {
      background: linear-gradient(135deg, #ffe066 0%, #facc15 50%, #ea580c 100%);
      padding: 44px 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: inset 0 8px 0 rgba(255, 255, 255, 0.45);
    }
    .hero-button-work:active { transform: scale(0.98); }

    .work-main-title {
      font-family: 'Bangers', cursive;
      font-size: 72px;
      color: #ffffff;
      text-shadow: 5px 5px 0px #000;
    }
    .work-description { font-size: 14px; color: #000; font-weight: 900; }
    .work-giga-avatar { font-size: 64px; filter: drop-shadow(3px 3px 0px #000); }

    .premium-row-node {
      background: var(--port-panel);
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      opacity: 0.4;
    }

    /* --- MODAL DE JEU (POPUP INTERNE) --- */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.9);
      z-index: 999;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .modal-content {
      background: var(--port-panel);
      border: var(--border-thick);
      box-shadow: var(--3d-shadow);
      width: 100%;
      max-width: 420px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: -12px;
      right: -12px;
      background: var(--comic-red);
      color: white;
      border: var(--border-thick);
      font-family: 'Bungee', sans-serif;
      padding: 4px 10px;
      cursor: pointer;
      box-shadow: 3px 3px 0 #000;
      z-index: 10;
    }

    .modal-title {
      font-family: 'Bangers', cursive;
      font-size: 32px;
      text-align: center;
      text-shadow: 2px 2px 0 #000;
      color: var(--comic-yellow);
    }

    /* --- ZONE ARCADE MINI-JEU --- */
    .game-viewport {
      width: 100%;
      height: 200px;
      background: #090d16;
      border: var(--border-thick);
      position: relative;
      overflow: hidden;
    }

    /* La ligne de tri ciblée (Le Scanner) */
    .target-zone {
      position: absolute;
      left: 110px;
      width: 60px;
      height: 100%;
      background: rgba(16, 185, 129, 0.2);
      border-left: 2px dashed var(--comic-green);
      border-right: 2px dashed var(--comic-green);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 5px;
      font-family: 'Bungee', sans-serif;
      font-size: 10px;
      color: var(--comic-green);
    }

    /* L'objet qui défile (Le Poisson) */
    .scrolling-item {
      position: absolute;
      top: 60px;
      left: 420px; /* Commence hors écran à droite */
      font-size: 44px;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Tableau des scores internes au round */
    .round-stats {
      display: flex;
      justify-content: space-between;
      font-family: 'Bungee', sans-serif;
      font-size: 14px;
      background: rgba(0,0,0,0.4);
      padding: 8px 12px;
      border: var(--border-thin);
    }

    .btn-game-hit {
      background: linear-gradient(180deg, var(--comic-orange) 0%, #c2410c 100%);
      border: var(--border-thick);
      font-family: 'Bungee', sans-serif;
      color: white;
      padding: 16px;
      font-size: 18px;
      cursor: pointer;
      box-shadow: var(--3d-shadow-small);
      text-align: center;
    }
    .btn-game-hit:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #000;
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    
    <div class="premium-header">
      <div class="header-main-row">
        <div class="docker-profile-card">
          <div class="avatar-container">
            <img src="notionists-1779298466584.png" alt="Avatar">
            <div class="level-badge" id="lvlIndicator">NIV.1</div>
          </div>
          <div class="docker-meta-details">
            <div class="docker-name" id="profileUsername">Chargement...</div>
            <div class="docker-rank-title">Docker Occasionnel</div>
          </div>
        </div>
        
        <div class="arcade-counters">
          <div class="counter-slot money"><span id="profileMoney">0 €</span> 💶</div>
          <div class="counter-slot energy"><span id="profileEnergy">100%</span> ⚡</div>
        </div>
      </div>
      
      <div class="xp-milestone-bar">
        <div class="xp-fill-stream" id="xpBarFill"></div>
      </div>
    </div>

    <div class="menu-stack">
      <div class="hero-button-work" onclick="openWorkModal()">
        <div class="work-left-content">
          <div class="work-main-title">TRAVAILLER</div>
          <div class="work-description">Lance le mini-jeu de tri portuaire !</div>
        </div>
        <div class="work-giga-avatar">💼</div>
      </div>

      <div class="premium-row-node">🎰 Mini-Jeux (Niveau supérieur requis)</div>
      <div class="premium-row-node">🛒 Boutique (Niveau supérieur requis)</div>
    </div>

    <div class="modal-overlay" id="workModal">
      <div class="modal-content">
        <button class="modal-close" onclick="closeWorkModal()">X</button>
        <div class="modal-title">TRI DES POISSONS 🐟</div>
        
        <div class="round-stats">
          <span>CAISSES TRIIÉES : <span id="roundScore" style="color:var(--comic-yellow);">0/5</span></span>
          <span id="gameAlert" style="color:var(--comic-green);">APPUIE AU BON MOMENT !</span>
        </div>

        <div class="game-viewport">
          <div class="target-zone">ZONE DE TRI</div>
          <div class="scrolling-item" id="fishItem">🐟</div>
        </div>

        <button class="btn-game-hit" id="btnAction" onclick="checkSortingTiming()">EMPAQUETER (ESPACE)</button>
      </div>
    </div>

  </div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const supabaseClient = createClient(supabaseUrl, supabaseKey);

    const userId = localStorage.getItem('userId');
    if (!userId) window.location.href = 'index.html';

    let currentMoney = 0;
    let currentEnergy = 100;
    let currentXp = 0;
    
    // Moteur d'animation interne du mini-jeu
    let scoreInRound = 0;
    let fishX = 420;
    let fishSpeed = 4;
    let animationFrameId = null;
    let isGameRunning = false;

    loadUserData();

    async function loadUserData() {
      try {
        const { data: profile } = await supabaseClient.from('profiles').select('username').eq('user_id', userId).single();
        const { data: progress } = await supabaseClient.from('game_progress').select('money, xp').eq('user_id', userId).single();

        if (profile) document.getElementById('profileUsername').textContent = profile.username;
        if (progress) {
          currentMoney = progress.money || 0;
          currentXp = progress.xp || 0;
          updateInterfaceElements();
        }
      } catch (err) { console.error(err); }
    }

    function updateInterfaceElements() {
      document.getElementById('profileMoney').textContent = currentMoney + ' €';
      document.getElementById('profileEnergy').textContent = currentEnergy + '%';
      
      let calculatedLevel = Math.floor(currentXp / 50) + 1;
      let currentLevelProgress = currentXp % 50;
      let progressPercentage = (currentLevelProgress / 50) * 100;

      document.getElementById('lvlIndicator').textContent = 'NIV.' + calculatedLevel;
      document.getElementById('xpBarFill').style.width = progressPercentage + '%';
    }

    function openWorkModal() {
      if (currentEnergy < 10) {
        alert("Prends une pause ! Tu n'as plus l'énergie pour manipuler les charges.");
        return;
      }
      document.getElementById('workModal').style.display = 'flex';
      startMiniGameRound();
    }

    function closeWorkModal() {
      document.getElementById('workModal').style.display = 'none';
      stopMiniGameRound();
    }

    // Boucle physique du jeu (Défilement horizontal continu)
    function startMiniGameRound() {
      isGameRunning = true;
      scoreInRound = 0;
      fishX = 420;
      fishSpeed = 4; // Vitesse de départ
      document.getElementById('roundScore').textContent = "0/5";
      document.getElementById('gameAlert').textContent = "PRÊT ? PARTEZ !";
      document.getElementById('gameAlert').style.color = "white";
      
      animateFish();
    }

    function stopMiniGameRound() {
      isGameRunning = false;
      cancelAnimationFrame(animationFrameId);
    }

    function animateFish() {
      if (!isGameRunning) return;

      fishX -= fishSpeed;
      // Si l'objet dépasse l'écran à gauche sans être trié, il réapparaît à droite
      if (fishX < -50) {
        fishX = 420;
        document.getElementById('gameAlert').textContent = "RATÉ ! MANQUÉ !";
        document.getElementById('gameAlert').style.color = "var(--comic-red)";
      }

      document.getElementById('fishItem').style.left = fishX + "px";
      animationFrameId = requestAnimationFrame(animateFish);
    }

    // VÉRIFICATION DU TIMING LORS DU CLIC / APPUIS TOUCHE
    function checkSortingTiming() {
      if (!isGameRunning) return;

      // La zone cible est située entre X = 110px et X = 170px
      if (fishX >= 95 && fishX <= 165) {
        scoreInRound++;
        fishX = 420; // Recommence une course à droite
        fishSpeed += 0.6; // Augmente la difficulté à chaque point réussi !
        
        document.getElementById('roundScore').textContent = scoreInRound + "/5";
        document.getElementById('gameAlert').textContent = "PARFAIT ! +1";
        document.getElementById('gameAlert').style.color = "var(--comic-green)";

        // Victoire totale : Fin de la session de travail
        if (scoreInRound >= 5) {
          endWorkShiftWithSuccess();
        }
      } else {
        document.getElementById('gameAlert').textContent = "MAUVAIS TIMING !";
        document.getElementById('gameAlert').style.color = "var(--comic-red)";
      }
    }

    // Envoi des récompenses réelles à la BDD Supabase une fois le jeu validé
    async function endWorkShiftWithSuccess() {
      stopMiniGameRound();
      document.getElementById('gameAlert').textContent = "QUART TERMINÉ ! 💰";
      
      const targetMoney = currentMoney + 15;
      const targetXp = currentXp + 5;
      currentEnergy -= 10;

      try {
        const { error } = await supabaseClient
          .from('game_progress')
          .update({ money: targetMoney, xp: targetXp })
          .eq('user_id', userId);

        if (error) throw error;

        currentMoney = targetMoney;
        currentXp = targetXp;
        updateInterfaceElements();
        alert("Félicitations ! Tu as correctement trié la livraison. Tu gagnes +15 € et +5 XP !");
      } catch (err) {
        console.error(err);
        currentEnergy += 10;
      } finally {
        closeWorkModal();
      }
    }

    // Raccourci clavier : Permet de jouer avec la barre d'espace pour plus de réactivité !
    window.addEventListener('keydown', function(e) {
      if (e.code === 'Space' && isGameRunning) {
        e.preventDefault();
        checkSortingTiming();
      }
    });
  </script>
</body>
</html>
