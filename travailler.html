<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a4d68">
<title>Travailler — Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Special+Elite&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
:root{
  --port-blue: #0a4d68;
  --port-blue-deep: #062c3e;
  --crane: #f4b13c;
  --gold: #e8c547;
  --ink: #1a1a1a;
  --paper: #f4ead0;
}

*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
html, body{height:100%; overflow:hidden; overscroll-behavior:none}
body{
  font-family:'Special Elite', 'Courier New', monospace;
  color:var(--ink);
  background:var(--port-blue-deep);
  user-select:none;
  -webkit-user-select:none;
  touch-action:manipulation;
}

#app{
  position:fixed; inset:0;
  display:flex; flex-direction:column;
  max-width:520px; margin:0 auto;
  overflow:hidden;
}

/* TOPBAR */
.topbar{
  position:relative; z-index:10;
  display:flex; align-items:center; justify-content:space-between;
  padding:12px;
  background:linear-gradient(180deg, rgba(6,44,62,.95), rgba(6,44,62,.85));
  border-bottom:3px solid var(--crane);
  box-shadow:0 2px 0 var(--ink), 0 4px 12px rgba(0,0,0,.4);
}
.topbar-left{
  display:flex; align-items:center; gap:12px;
}
.back-btn{
  background:transparent; border:none;
  color:var(--paper); font-size:28px;
  cursor:pointer; padding:0;
  line-height:1;
}
.topbar-title{
  font-family:'Bebas Neue', sans-serif;
  font-size:20px; letter-spacing:2px;
  color:var(--paper); text-shadow:1px 1px 0 #000;
}
.topbar-money{
  font-family:'Bebas Neue', sans-serif;
  font-size:22px; color:var(--gold);
  text-shadow:2px 2px 0 #000;
}

/* STATS BAR */
.stats-bar{
  position:relative; z-index:9;
  display:flex; justify-content:space-around;
  padding:10px 8px;
  background:rgba(6,44,62,.85);
  border-bottom:2px solid rgba(244,177,60,.3);
}
.stat-item{
  text-align:center; flex:1;
}
.stat-label{
  font-size:8px; color:rgba(255,255,255,.5);
  letter-spacing:1px; text-transform:uppercase;
}
.stat-value{
  font-family:'Bebas Neue', sans-serif;
  font-size:16px; color:var(--paper);
  letter-spacing:.5px; margin-top:2px;
}

/* DOCK AREA */
.dock-area{
  --sky1:#b9dceb; --sky2:#e0eef5;
  --sea1:#2b8aa6; --sea2:#0a4d68;
  --dock-floor:#8a8275; --dock-floor-dk:#6a6258;
  --mtn:rgba(60,80,100,.55);
  position:relative;
  flex:1; min-height:0;
  background:
    linear-gradient(180deg,
      transparent 0%, transparent 70%,
      #4a4238 70%, #4a4238 70.5%,
      var(--dock-floor) 70.5%, var(--dock-floor-dk) 100%
    ),
    linear-gradient(180deg,
      transparent 0%, transparent 35%,
      var(--sea1) 35%, var(--sea2) 70%,
      transparent 70%
    ),
    radial-gradient(circle at 82% 18%, rgba(255,220,150,.95) 0, rgba(255,220,150,0) 80px),
    linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 35%, var(--sky2) 35%);
  overflow:hidden;
  display:none;
}
.dock-area.active{ display:block; }
.dock-area::before{
  content:''; position:absolute; left:0; right:0;
  top:35%; height:35%;
  background:repeating-linear-gradient(180deg, transparent 0 8px, rgba(255,255,255,.08) 8px 9px);
  pointer-events:none;
}
.dock-area::after{
  content:''; position:absolute; left:0; right:0;
  top:35%; height:35%;
  background-image:
    radial-gradient(ellipse 40px 3px at 20% 30%, rgba(255,255,255,.5), transparent),
    radial-gradient(ellipse 30px 2px at 60% 50%, rgba(255,255,255,.4), transparent),
    radial-gradient(ellipse 50px 3px at 80% 70%, rgba(255,255,255,.5), transparent);
  animation:waves 8s linear infinite;
  pointer-events:none;
}
@keyframes waves{
  0%{transform:translateX(0)}
  100%{transform:translateX(-30px)}
}

/* ZONES SELECTOR */
.zones-container{
  flex:1; overflow-y:auto; padding:16px 12px 20px;
  background:linear-gradient(180deg, #f8f9fa 0%, #e5e7eb 100%);
}
.zone-card{
  background:#fff;
  border-radius:16px;
  padding:20px;
  margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  border:2px solid #e5e7eb;
  cursor:pointer;
  transition:all .2s;
  position:relative;
  overflow:hidden;
}
.zone-card:active{
  transform:scale(.98);
}
.zone-card.unlocked{
  border-color:#10b981;
}
.zone-card.unlocked::before{
  content:'';
  position:absolute;
  top:0; left:0; right:0;
  height:4px;
  background:linear-gradient(90deg, #10b981, #059669);
}
.zone-card.locked{
  opacity:.6;
  cursor:not-allowed;
}
.zone-card.locked::after{
  content:'🔒';
  position:absolute;
  top:12px; right:12px;
  font-size:24px;
}
.zone-header{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:12px;
}
.zone-icon{
  width:48px; height:48px;
  background:linear-gradient(135deg, #3b82f6, #2563eb);
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  flex-shrink:0;
}
.zone-info{
  flex:1;
}
.zone-name{
  font-family:'Bebas Neue', sans-serif;
  font-size:20px;
  letter-spacing:1px;
  color:#1a1a1a;
  margin-bottom:2px;
}
.zone-rank{
  font-size:12px;
  color:#6b7280;
  font-weight:600;
}
.zone-description{
  font-size:13px;
  color:#4b5563;
  line-height:1.4;
  margin-bottom:8px;
}
.zone-unlock{
  display:inline-block;
  background:#fef3c7;
  color:#92400e;
  padding:6px 12px;
  border-radius:8px;
  font-size:11px;
  font-weight:700;
  letter-spacing:0.5px;
}
.zone-card.unlocked .zone-unlock{
  background:#d1fae5;
  color:#065f46;
}


.mountains-deco{
  position:absolute; left:0; right:0;
  top:30%; height:6%;
  background:var(--mtn);
  clip-path:polygon(0 100%, 8% 60%, 14% 75%, 22% 40%, 30% 65%, 40% 30%, 48% 55%, 58% 35%, 68% 60%, 78% 25%, 88% 55%, 100% 40%, 100% 100%);
  pointer-events:none; z-index:1;
}

/* CONTAINER */
.container-target{
  position:absolute; left:50%; bottom:10%;
  transform:translateX(-50%);
  width:52%; max-width:200px; aspect-ratio:100/80;
  cursor:pointer; z-index:8;
  filter:drop-shadow(4px 6px 0 rgba(0,0,0,.45));
  touch-action:manipulation;
}
.container-target:active{ opacity:.9; transform:translateX(-50%) scale(0.95); }
.container-target svg{ width:100%; height:100%; display:block }

/* FX OVERLAY */
.fx-overlay{
  position:absolute; inset:0;
  pointer-events:none; z-index:9;
}
.float-num{
  position:absolute;
  font-family:'Bebas Neue', sans-serif;
  font-size:22px; color:var(--gold);
  text-shadow:2px 2px 0 #000;
  pointer-events:none; user-select:none;
  transform:translateX(-50%);
  animation:floatup .9s ease-out forwards;
  white-space:nowrap;
}
@keyframes floatup{
  0%  { opacity:0; transform:translateX(-50%) translateY(0) scale(.7); }
  15% { opacity:1; transform:translateX(-50%) translateY(-10px) scale(1.1); }
  100%{ opacity:0; transform:translateX(-50%) translateY(-55px) scale(.9); }
}
.ripple{
  position:absolute; border-radius:50%;
  border:2px solid var(--crane);
  pointer-events:none;
  transform:translate(-50%,-50%);
  animation:rip .5s ease-out forwards;
}
@keyframes rip{
  0%  { width:0; height:0; opacity:.8; }
  100%{ width:120px; height:120px; opacity:0; }
}
</style>
</head>

    let money = 100;
    let level = 1;
    let rank = 'Docker Occasionnel';

    loadPlayerData();

    async function loadPlayerData() {
      const { data: progressArray } = await supabaseClient
        .from('game_progress')
        .select('*')
        .eq('user_id', userId);

      if (progressArray && progressArray[0]) {
        const progress = progressArray[0];

        rank = getRank(level);

        renderZones();

    }

    function getRank(level) {
      if (level < 15) return 'Docker Occasionnel';
      if (level < 30) return 'Docker';
      if (level < 50) return 'Docker Mensuel';
      if (level < 80) return 'Contre-Maître';
      if (level < 100) return 'Chef de Quai';
      return 'Directeur de Compagnie';
    }

    function updateDisplay() {
      document.getElementById('moneyDisplay').textContent = money.toLocaleString('fr-FR');
      document.getElementById('moneyDisplayStat').textContent = money.toLocaleString('fr-FR');
      document.getElementById('levelDisplay').textContent = level;
      document.getElementById('rankDisplay').textContent = rank;
    }

    function renderZones() {
      const container = document.getElementById('zonesContainer');
      container.innerHTML = '';

      zones.forEach(zone => {
        const unlocked = level >= zone.minLevel;
        
        const card = document.createElement('div');
        card.className = `zone-card ${unlocked ? 'unlocked' : 'locked'}`;
        
        card.innerHTML = `

            <div class="zone-info">

              <div class="zone-rank">${zone.rank}</div>
            </div>
          </div>
          <div class="zone-description">${zone.description}</div>
          <div class="zone-unlock">
            ${unlocked ? '✓ Débloqué' : '🔒 Niveau ' + zone.minLevel + ' requis'}
          </div>
        `;

        if (unlocked && zone.gameplay === 'clicker') {
          card.addEventListener('click', () => openZone(zone));
        }

        container.appendChild(card);
      });
    }

    function openZone(zone) {
      if (zone.gameplay === 'clicker') {
        // Pour l'instant, on affiche juste une alerte
        alert('Zone : ' + zone.name + '\n\nGameplay clicker à venir !');
