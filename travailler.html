<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Travailler — Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
html, body{height:100%; overflow:hidden;}
body{
  font-family:'Inter', sans-serif;
  background:#f8f9fa;
}

#app{
  position:fixed; inset:0;
  display:flex; flex-direction:column;
  max-width:600px; margin:0 auto;
  background:#fff;
}

/* TOPBAR */
.topbar{
  background:#ffffff;
  padding:16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 2px 8px rgba(0,0,0,.1);
  border-bottom:1px solid #e5e7eb;
}
.topbar-left{
  display:flex;
  align-items:center;
  gap:12px;
}
.back-btn{
  background:transparent;
  border:none;
  font-size:24px;
  cursor:pointer;
  padding:4px;
  color:#1a1a1a;
}
.topbar-title{
  font-family:'Bebas Neue', sans-serif;
  font-size:22px;
  letter-spacing:1px;
  color:#1a1a1a;
}
.topbar-money{
  font-family:'Bebas Neue', sans-serif;
  font-size:20px;
  letter-spacing:1px;
  color:#10b981;
}

/* STATS BAR */
.stats-bar{
  display:flex;
  justify-content:space-around;
  padding:12px 16px;
  background:#f9fafb;
  border-bottom:1px solid #e5e7eb;
}
.stat-item{
  text-align:center;
  flex:1;
}
.stat-label{
  font-size:10px;
  color:#6b7280;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:0.5px;
}
.stat-value{
  font-family:'Bebas Neue', sans-serif;
  font-size:18px;
  letter-spacing:0.5px;
  color:#1a1a1a;
  margin-top:2px;
}

/* ZONES CONTAINER */
.zones-container{
  flex:1;
  overflow-y:auto;
  padding:16px;
  background:
    linear-gradient(180deg, 
      rgba(59, 130, 246, 0.05) 0%,
      rgba(16, 185, 129, 0.05) 50%,
      rgba(251, 191, 36, 0.05) 100%
    ),
    linear-gradient(135deg, #f8f9fa 0%, #e5e7eb 100%);
  position:relative;
}

.zones-container::before{
  content:'';
  position:absolute;
  inset:0;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(16, 185, 129, 0.08) 0%, transparent 50%),
    radial-gradient(circle at 50% 50%, rgba(251, 191, 36, 0.06) 0%, transparent 50%);
  animation:float 20s ease-in-out infinite;
  pointer-events:none;
}

@keyframes float {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-20px) scale(1.05); }
}

/* ZONE CARDS */
.zone-card{
  background:#fff;
  border-radius:16px;
  padding:20px;
  margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
  border:2px solid #e5e7eb;
  cursor:pointer;
  transition:all .2s;
  position:relative;
  z-index:1;
}
.zone-card:active{
  transform:scale(.98);
}
.zone-card.unlocked{
  border-color:#10b981;
}
.zone-card.locked{
  opacity:.6;
  cursor:not-allowed;
  background:#f9fafb;
}
.zone-card.locked::after{
  content:'🔒';
  position:absolute;
  top:16px; right:16px;
  font-size:28px;
}

.zone-header{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:12px;
}
.zone-icon{
  width:56px;
  height:56px;
  background:linear-gradient(135deg, #3b82f6, #2563eb);
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  flex-shrink:0;
}
.zone-card.locked .zone-icon{
  background:linear-gradient(135deg, #9ca3af, #6b7280);
}
.zone-info{
  flex:1;
}
.zone-name{
  font-family:'Bebas Neue', sans-serif;
  font-size:20px;
  letter-spacing:1px;
  color:#1a1a1a;
  margin-bottom:2px;
}
.zone-rank{
  font-size:12px;
  color:#6b7280;
  font-weight:600;
}
.zone-description{
  font-size:13px;
  color:#4b5563;
  line-height:1.5;
  margin-bottom:10px;
}
.zone-unlock{
  display:inline-block;
  padding:8px 14px;
  border-radius:8px;
  font-size:12px;
  font-weight:700;
  letter-spacing:0.5px;
}
.zone-card.locked .zone-unlock{
  background:#fef3c7;
  color:#92400e;
}
.zone-card.unlocked .zone-unlock{
  background:#d1fae5;
  color:#065f46;
}

.coming-soon{
  display:inline-block;
  margin-left:8px;
  padding:4px 8px;
  background:#fee2e2;
  color:#991b1b;
  border-radius:6px;
  font-size:10px;
  font-weight:700;
}
</style>
</head>
<body>
  <div id="app">
    <div class="topbar">
      <div class="topbar-left">
        <button class="back-btn" onclick="window.location.href='game.html'">←</button>
        <div class="topbar-title">💼 Travailler</div>
      </div>
      <div class="topbar-money"><span id="moneyDisplay">100</span>€</div>
    </div>

    <div class="stats-bar">
      <div class="stat-item">
        <div class="stat-label">Niveau</div>
        <div class="stat-value" id="levelDisplay">1</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Grade</div>
        <div class="stat-value" id="rankDisplay" style="font-size:13px;">Docker Occasionnel</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Zones</div>
        <div class="stat-value"><span id="unlockedDisplay">1</span>/6</div>
      </div>
    </div>

    <div class="zones-container" id="zonesContainer">
      <!-- Généré dynamiquement -->
    </div>
  </div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const supabaseClient = createClient(supabaseUrl, supabaseKey);

    const userId = localStorage.getItem('userId');
    if (!userId) {
      window.location.href = 'index.html';
    }

    const zones = [
      { 
        id: 'clicker',
        name: 'Déchargement de Conteneurs',
        icon: '📦',
        rank: 'Docker Occasionnel',
        minLevel: 1,
        description: 'Clique sur les conteneurs pour les décharger. Plus tu cliques vite, plus tu gagnes.',
        page: 'clicker.html',
        available: true
      },
      {
        id: 'docker',
        name: 'Gestion de Cargaisons',
        icon: '🚢',
        rank: 'Docker',
        minLevel: 15,
        description: 'Organise les cargaisons entrantes pour optimiser les profits.',
        page: null,
        available: false
      },
      {
        id: 'mensuel',
        name: 'Coordination Logistique',
        icon: '📋',
        rank: 'Docker Mensuel',
        minLevel: 30,
        description: 'Coordonne les équipes et planifie les opérations portuaires.',
        page: null,
        available: false
      },
      {
        id: 'contrema',
        name: 'Supervision d\'Équipe',
        icon: '👷',
        rank: 'Contre-Maître',
        minLevel: 50,
        description: 'Supervise les dockers et assure la productivité du quai.',
        page: null,
        available: false
      },
      {
        id: 'chef',
        name: 'Direction de Quai',
        icon: '🎯',
        rank: 'Chef de Quai',
        minLevel: 80,
        description: 'Dirige l\'ensemble des opérations et gère les contrats majeurs.',
        page: null,
        available: false
      },
      {
        id: 'directeur',
        name: 'Bureau du Directeur',
        icon: '👔',
        rank: 'Directeur de Compagnie',
        minLevel: 100,
        description: 'Pilote l\'empire maritime depuis ton bureau. Revenus passifs maximaux.',
        page: null,
        available: false
      }
    ];

    let money = 100;
    let level = 1;
    let rank = 'Docker Occasionnel';

    loadPlayerData();

    async function loadPlayerData() {
      const { data: progressArray } = await supabaseClient
        .from('game_progress')
        .select('*')
        .eq('user_id', userId);

      if (progressArray && progressArray[0]) {
        const progress = progressArray[0];
        money = progress.money || 100;
        level = progress.level || 1;
        rank = getRank(level);
        
        updateDisplay();
        renderZones();
      }
    }

    function getRank(level) {
      if (level < 15) return 'Docker Occasionnel';
      if (level < 30) return 'Docker';
      if (level < 50) return 'Docker Mensuel';
      if (level < 80) return 'Contre-Maître';
      if (level < 100) return 'Chef de Quai';
      return 'Directeur de Compagnie';
    }

    function updateDisplay() {
      document.getElementById('moneyDisplay').textContent = money.toLocaleString('fr-FR');
      document.getElementById('levelDisplay').textContent = level;
      document.getElementById('rankDisplay').textContent = rank;
      
      const unlockedCount = zones.filter(z => level >= z.minLevel).length;
      document.getElementById('unlockedDisplay').textContent = unlockedCount;
    }

    function renderZones() {
      const container = document.getElementById('zonesContainer');
      container.innerHTML = '';

      zones.forEach(zone => {
        const unlocked = level >= zone.minLevel;
        
        const card = document.createElement('div');
        card.className = `zone-card ${unlocked ? 'unlocked' : 'locked'}`;
        
        const comingSoon = !zone.available ? '<span class="coming-soon">Bientôt</span>' : '';
        
        card.innerHTML = `
          <div class="zone-header">
            <div class="zone-icon">${zone.icon}</div>
            <div class="zone-info">
              <div class="zone-name">${zone.name}${comingSoon}</div>
              <div class="zone-rank">${zone.rank}</div>
            </div>
          </div>
          <div class="zone-description">${zone.description}</div>
          <div class="zone-unlock">
            ${unlocked ? '✓ Débloqué' : '🔒 Niveau ' + zone.minLevel + ' requis'}
          </div>
        `;

        if (unlocked && zone.available && zone.page) {
          card.addEventListener('click', () => {
            window.location.href = zone.page;
          });
        }

        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
