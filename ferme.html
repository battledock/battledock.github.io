<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Battle Dock</title>
<script src="maintenance.js?v=2026-10-09-0130"></script>
<script>
/* PAS D'ÉCRAN D'ATTENTE : on part vers le jeu avant même d'avoir dessiné quoi
   que ce soit. La page ne montre rien, elle ne fait que passer la main.

   LA VERSION : on allait chercher Date.now(), donc l'adresse changeait à
   chaque visite et le téléphone retéléchargeait les 1,6 Mo du jeu à chaque
   passage. On lit maintenant le vrai numéro de version, comme la page
   d'accueil : le cache ne se vide que lors d'une vraie mise à jour. */
(function(){
  /* FERME EN TRAVAUX : maintenance.js a déjà posé le drapeau et affichera
     l'écran ici même. On ne redirige pas vers les 1,6 Mo du jeu pour rien. */
  if(window.__MAINTENANCE)return;
  var p=new URLSearchParams(location.search);
  p.set('carte','ferme');
  function partir(v){
    if(v)p.set('v',v);
    location.replace('jeu.html?'+p.toString());
  }
  if(p.get('v'))return partir(null);
  var fini=false;
  var t=setTimeout(function(){if(!fini){fini=true;partir(null);}},1200);
  try{
    fetch('version.json',{cache:'no-store'})
      .then(function(r){return r.json();})
      .then(function(d){if(fini)return;fini=true;clearTimeout(t);partir(d&&d.v);})
      .catch(function(){if(fini)return;fini=true;clearTimeout(t);partir(null);});
  }catch(x){if(!fini){fini=true;clearTimeout(t);partir(null);}}
})();
</script>
<style>html,body{margin:0;height:100%;background:#151a12}</style>
</head><body></body></html>
