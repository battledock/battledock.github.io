<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Échoppe de Fatou - Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; -webkit-font-smoothing:antialiased; }
  body { font-family:'Inter',sans-serif; background:#120c06; color:#f3ead9; min-height:100dvh; padding:0 14px 30px; }
  .bg { position:fixed; inset:0; z-index:0; pointer-events:none; background:
      radial-gradient(120% 60% at 50% -5%, rgba(217,119,6,0.22), transparent 60%),
      radial-gradient(80% 50% at 50% 100%, rgba(13,148,136,0.15), transparent 70%),
      linear-gradient(180deg,#1c1308,#120c06 55%,#0c0804); }
  .wrap { position:relative; z-index:1; max-width:540px; margin:0 auto; }

  .hdr { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px; padding:14px 4px;
    background:linear-gradient(180deg,#120c06,rgba(18,12,6,0.85)); backdrop-filter:blur(8px); }
  .back-btn { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:9px;
    padding:8px 12px; font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:1px; color:rgba(255,255,255,0.7); cursor:pointer; }
  .back-btn:active { transform:scale(0.95); }
  .hdr-title { flex:1; font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:2px;
    background:linear-gradient(135deg,#f59e0b,#fbbf24,#14b8a6); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }

  .sub { text-align:center; font-size:12px; color:rgba(255,220,170,0.6); font-style:italic; margin:4px 0 14px; }
  .wallet { display:flex; gap:10px; margin-bottom:16px; }
  .wbox { flex:1; background:rgba(255,255,255,0.04); border:1px solid rgba(251,191,36,0.2); border-radius:14px; padding:11px 14px; }
  .wlbl { font-size:9px; letter-spacing:2px; text-transform:uppercase; color:rgba(255,255,255,0.4); margin-bottom:3px; }
  .wval { font-family:'Bebas Neue',sans-serif; font-size:21px; letter-spacing:0.5px; }
  .wval.eur { color:#fbbf24; } .wval.dia { color:#7dd3fc; }

  .section-h { font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:2px; color:#fcd34d; margin:18px 4px 10px; display:flex; align-items:center; gap:8px; }
  .section-h::after { content:''; flex:1; height:1px; background:linear-gradient(90deg,rgba(251,191,36,0.3),transparent); }

  .item { display:flex; align-items:center; gap:13px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08);
    border-radius:14px; padding:13px; margin-bottom:10px; }
  .item-ic { width:46px; height:46px; border-radius:12px; background:rgba(251,191,36,0.12); display:flex; align-items:center; justify-content:center; font-size:24px; flex-shrink:0; }
  .item-mid { flex:1; min-width:0; }
  .item-name { font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:0.5px; color:#fff; }
  .item-desc { font-size:11px; color:rgba(255,255,255,0.5); margin-top:2px; }
  .buy { border:none; border-radius:11px; padding:10px 14px; font-family:'Bebas Neue',sans-serif; font-size:14px; letter-spacing:0.5px; cursor:pointer; flex-shrink:0; min-width:90px; }
  .buy.eur { background:linear-gradient(135deg,#d97706,#fbbf24); color:#3a1f00; }
  .buy.dia { background:linear-gradient(135deg,#0284c7,#38bdf8); color:#04243a; }
  .buy.equip { background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); color:#fff; }
  .buy.equipped { background:rgba(52,211,153,0.15); border:1px solid rgba(52,211,153,0.4); color:#6ee7b7; }
  .buy:disabled { opacity:0.4; cursor:default; }

  .themes { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .theme { border-radius:14px; padding:14px; border:2px solid rgba(255,255,255,0.1); position:relative; overflow:hidden; }
  .theme-name { font-family:'Bebas Neue',sans-serif; font-size:15px; letter-spacing:1px; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,0.5); margin-bottom:42px; }
  .theme-btn { position:absolute; left:12px; right:12px; bottom:12px; border:none; border-radius:10px; padding:9px; cursor:pointer;
    font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:0.5px; }
  .theme-btn.buy { background:rgba(0,0,0,0.4); color:#7dd3fc; }
  .theme-btn.equip { background:rgba(255,255,255,0.85); color:#1a1a1a; }
  .theme-btn.equipped { background:rgba(52,211,153,0.9); color:#04231a; }

  .toast { position:fixed; top:18px; left:50%; transform:translateX(-50%) translateY(-20px); z-index:200;
    background:rgba(30,20,8,0.97); border:1px solid rgba(251,191,36,0.4); border-radius:12px; padding:11px 18px; font-size:13px; font-weight:700;
    opacity:0; transition:all .35s; max-width:90%; text-align:center; color:#fde68a; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.bad { border-color:rgba(248,113,113,0.5); color:#fca5a5; }
  .toast.good { border-color:rgba(52,211,153,0.5); color:#86efac; }
  .loader { text-align:center; padding:50px; color:rgba(255,255,255,0.3); font-family:'Bebas Neue',sans-serif; letter-spacing:2px; }
  .back-bottom { width:100%; margin-top:22px; padding:15px; border-radius:14px; cursor:pointer;
    background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12); color:rgba(255,255,255,0.7);
    font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:2px; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="wrap">
    <div class="hdr">
      <button class="back-btn" onclick="window.location.href='game.html'">← Retour</button>
      <div class="hdr-title">🛒 Échoppe de Fatou</div>
    </div>
    <div class="sub">« Touche pas, mais regarde… et sors ton porte-monnaie. »</div>
    <div class="wallet">
      <div class="wbox"><div class="wlbl">Argent</div><div class="wval eur" id="money">—</div></div>
      <div class="wbox"><div class="wlbl">Diamants</div><div class="wval dia" id="diamonds">—</div></div>
    </div>

    <div class="section-h">🛠️ Améliorations</div>
    <div id="upgrades"><div class="loader">…</div></div>

    <div class="section-h">🎨 Thèmes de fiche <span style="font-size:10px;color:rgba(255,255,255,0.4);letter-spacing:1px">· en 💎</span></div>
    <div class="themes" id="themes"></div>

    <button class="back-bottom" onclick="window.location.href='game.html'">← Retour au jeu</button>
  </div>
  <div class="toast" id="toast"></div>

<script>
  const SB_URL = 'https://drtsuhnbclhmgfjiykap.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
  const sb = supabase.createClient(SB_URL, SB_KEY);

  const MPC_MAX=30, XPC_MAX=11;
  const THEMES = [
    { key:'blue',    name:'Bleu du Port', grad:'linear-gradient(135deg,#1d4ed8,#3b82f6)', cost:0 },
    { key:'gold',    name:'Or des Quais', grad:'linear-gradient(135deg,#b45309,#f59e0b)', cost:20 },
    { key:'emerald', name:'Émeraude',     grad:'linear-gradient(135deg,#047857,#10b981)', cost:20 },
    { key:'purple',  name:'Pourpre',      grad:'linear-gradient(135deg,#6d28d9,#a855f7)', cost:25 },
    { key:'night',   name:'Nuit du Port', grad:'linear-gradient(135deg,#0f172a,#334155)', cost:25 },
    { key:'coral',   name:'Corail',       grad:'linear-gradient(135deg,#be123c,#fb7185)', cost:30 },
  ];

  let currentUser=null, money=0, diamonds=0, mpc=1, xpc=1, owned=['blue'], bgColor='blue';
  const fmt=n=>Math.round(n).toLocaleString('fr-FR');

  async function init(){
    const { data:{ session } } = await sb.auth.getSession();
    if(!session){ window.location.href='index.html'; return; }
    currentUser=session.user;
    const [{ data:prof }, { data:gs }] = await Promise.all([
      sb.from('profiles').select('diamonds,background_color').eq('user_id',currentUser.id).maybeSingle(),
      sb.from('game_stats').select('money,money_per_click,xp_per_click,shop').eq('user_id',currentUser.id).maybeSingle()
    ]);
    diamonds = prof?.diamonds||0; bgColor = prof?.background_color||'blue';
    money = gs?.money||0; mpc = gs?.money_per_click||1; xpc = gs?.xp_per_click||1;
    const shop = (gs?.shop && typeof gs.shop==='object') ? gs.shop : {};
    owned = Array.isArray(shop.themes) ? shop.themes : [];
    if(!owned.includes('blue')) owned.push('blue');
    render();
  }

  function render(){
    document.getElementById('money').textContent = fmt(money)+'€';
    document.getElementById('diamonds').textContent = diamonds+' 💎';

    const eurPrice = mpc*3000, xpPrice = xpc*2500;
    document.getElementById('upgrades').innerHTML = `
      <div class="item">
        <div class="item-ic">💰</div>
        <div class="item-mid"><div class="item-name">Outils affûtés · +1 €/clic</div>
          <div class="item-desc">Niveau actuel : ${mpc} €/clic${mpc>=MPC_MAX?' (max)':''}</div></div>
        ${mpc>=MPC_MAX ? '<button class="buy" disabled>MAX</button>'
          : `<button class="buy eur" id="buyMpc" ${money<eurPrice?'disabled':''} onclick="buyMpc()">${fmt(eurPrice)}€</button>`}
      </div>
      <div class="item">
        <div class="item-ic">⭐</div>
        <div class="item-mid"><div class="item-name">Méthode de pro · +1 XP/clic</div>
          <div class="item-desc">Niveau actuel : ${xpc} XP/clic${xpc>=XPC_MAX?' (max)':''}</div></div>
        ${xpc>=XPC_MAX ? '<button class="buy" disabled>MAX</button>'
          : `<button class="buy eur" id="buyXpc" ${money<xpPrice?'disabled':''} onclick="buyXpc()">${fmt(xpPrice)}€</button>`}
      </div>`;

    document.getElementById('themes').innerHTML = THEMES.map(t=>{
      const isOwned = owned.includes(t.key);
      const isEq = bgColor===t.key;
      let btn;
      if(isEq) btn = `<button class="theme-btn equipped" disabled>✓ Équipé</button>`;
      else if(isOwned) btn = `<button class="theme-btn equip" onclick="equip('${t.key}')">Équiper</button>`;
      else btn = `<button class="theme-btn buy" ${diamonds<t.cost?'disabled style="opacity:.45"':''} onclick="buyTheme('${t.key}')">${t.cost} 💎</button>`;
      return `<div class="theme" style="background:${t.grad}"><div class="theme-name">${t.name}</div>${btn}</div>`;
    }).join('');
  }

  async function saveStats(){ try{ await sb.from('game_stats').update({ money:Math.round(money), money_per_click:mpc, xp_per_click:xpc, shop:{ themes:owned } }).eq('user_id',currentUser.id); }catch(e){console.log(e);} }
  async function saveProfile(){ try{ await sb.from('profiles').update({ diamonds, background_color:bgColor }).eq('user_id',currentUser.id); }catch(e){console.log(e);} }

  async function buyMpc(){
    const price=mpc*3000; if(mpc>=MPC_MAX||money<price) return;
    money-=price; mpc++; await saveStats(); render(); showToast(`Outils affûtés ! ${mpc} €/clic`, 'good');
  }
  async function buyXpc(){
    const price=xpc*2500; if(xpc>=XPC_MAX||money<price) return;
    money-=price; xpc++; await saveStats(); render(); showToast(`Méthode de pro ! ${xpc} XP/clic`, 'good');
  }
  async function buyTheme(key){
    const t=THEMES.find(x=>x.key===key); if(!t||owned.includes(key)) return;
    if(diamonds<t.cost){ showToast('Pas assez de diamants.', 'bad'); return; }
    diamonds-=t.cost; owned.push(key); bgColor=key;
    await Promise.all([saveStats(), saveProfile()]); render(); showToast(`${t.name} acheté et équipé !`, 'good');
  }
  async function equip(key){
    if(!owned.includes(key)) return; bgColor=key; await saveProfile(); render(); showToast('Thème équipé !', 'good');
  }

  let toastT=null;
  function showToast(msg,type){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show '+(type||''); clearTimeout(toastT); toastT=setTimeout(()=>t.className='toast '+(type||''),2400); }

  init();
</script>
</body>
</html>
