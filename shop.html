<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shop Casino - Battle Dock</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #0f0f0f;
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 100px;
      position: relative;
    }

    /* Fond animé casino */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        repeating-linear-gradient(
          90deg,
          #1a1a1a 0px,
          #1a1a1a 1px,
          #0f0f0f 1px,
          #0f0f0f 2px
        );
      pointer-events: none;
      z-index: -1;
      animation: scanlines 8s linear infinite;
    }

    @keyframes scanlines {
      0% { transform: translateY(0); }
      100% { transform: translateY(10px); }
    }

    /* Header casino */
    .header {
      background: linear-gradient(180deg, #1a1a1a 0%, #0f0f0f 100%);
      border-bottom: 4px solid #fbbf24;
      padding: 20px 16px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(251, 191, 36, 0.3);
    }

    .header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #fbbf24, transparent);
      animation: shimmer 2s infinite;
    }

    @keyframes shimmer {
      0% { opacity: 0; }
      50% { opacity: 1; }
      100% { opacity: 0; }
    }

    .header-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(32px, 8vw, 56px);
      color: #fbbf24;
      text-align: center;
      letter-spacing: 4px;
      text-shadow: 
        0 0 20px rgba(251, 191, 36, 0.8),
        0 0 40px rgba(251, 191, 36, 0.4),
        4px 4px 0px #000;
      margin-bottom: 20px;
      animation: pulse-text 2s ease-in-out infinite;
    }

    @keyframes pulse-text {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    .currencies {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      max-width: 600px;
      margin: 0 auto;
    }

    .currency-card {
      background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
      border: 2px solid #fbbf24;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      box-shadow: 
        0 0 10px rgba(251, 191, 36, 0.3),
        inset 0 0 10px rgba(251, 191, 36, 0.1);
    }

    .currency-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(20px, 5vw, 32px);
      color: #fbbf24;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(251, 191, 36, 0.6);
    }

    .currency-label {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      margin-top: 4px;
      letter-spacing: 1px;
    }

    /* Container */
    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 16px;
    }

    .section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(28px, 6vw, 40px);
      color: #fbbf24;
      text-shadow: 0 0 20px rgba(251, 191, 36, 0.6);
      letter-spacing: 2px;
      margin: 40px 0 20px 0;
      text-align: center;
      position: relative;
    }

    .section-title::before,
    .section-title::after {
      content: '★';
      margin: 0 12px;
      display: inline-block;
      animation: rotate 3s linear infinite;
    }

    @keyframes rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Grid améliorations */
    .upgrades-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 40px;
    }

    /* Carte amélioración casino */
    .upgrade-card {
      background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 50%, #1a1a1a 100%);
      border: 3px solid #fbbf24;
      border-radius: 8px;
      padding: 20px 16px;
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
      box-shadow: 
        0 8px 24px rgba(251, 191, 36, 0.2),
        inset 0 1px 0px rgba(255, 255, 255, 0.1);
    }

    .upgrade-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent, rgba(251, 191, 36, 0.1), transparent);
      animation: shine 3s infinite;
    }

    @keyframes shine {
      0% { transform: translate(-100%, -100%) rotate(45deg); }
      100% { transform: translate(100%, 100%) rotate(45deg); }
    }

    .upgrade-card:hover {
      transform: translateY(-8px);
      box-shadow: 
        0 12px 32px rgba(251, 191, 36, 0.4),
        inset 0 1px 0px rgba(255, 255, 255, 0.2);
      border-color: #ffd700;
    }

    .upgrade-card.maxed {
      opacity: 0.5;
      border-color: #10b981;
    }

    .upgrade-card.maxed::after {
      content: 'MAX';
      position: absolute;
      top: 8px;
      right: 8px;
      background: #10b981;
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .upgrade-icon {
      font-size: 56px;
      text-align: center;
      margin-bottom: 12px;
      display: block;
      filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.4));
      animation: bounce 2s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .upgrade-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      color: #fbbf24;
      letter-spacing: 1px;
      margin-bottom: 8px;
      text-align: center;
      text-shadow: 0 0 10px rgba(251, 191, 36, 0.4);
    }

    .upgrade-level {
      font-size: 12px;
      color: #888;
      text-align: center;
      margin-bottom: 12px;
    }

    .upgrade-bonus {
      background: rgba(251, 191, 36, 0.1);
      border: 1px solid rgba(251, 191, 36, 0.3);
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 12px;
      text-align: center;
    }

    .bonus-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      color: #fbbf24;
      letter-spacing: 2px;
      text-shadow: 0 0 8px rgba(251, 191, 36, 0.6);
    }

    .bonus-label {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .upgrade-price {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      color: #10b981;
      text-align: center;
      letter-spacing: 1px;
      text-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
      margin-bottom: 12px;
    }

    .buy-btn {
      width: 100%;
      background: linear-gradient(135deg, #10b981, #059669);
      border: 2px solid #10b981;
      color: white;
      padding: 12px;
      border-radius: 6px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
      z-index: 1;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .buy-btn:hover:not(:disabled) {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.6);
    }

    .buy-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Bottom nav */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(180deg, #1a1a1a, #0f0f0f);
      border-top: 3px solid #fbbf24;
      padding: 12px 16px;
      box-shadow: 0 -4px 20px rgba(251, 191, 36, 0.2);
      z-index: 100;
    }

    .nav-btn {
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
      background: linear-gradient(135deg, #10b981, #059669);
      border: 2px solid #10b981;
      color: white;
      padding: 14px;
      border-radius: 8px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .nav-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.6);
    }

    /* Alert */
    .alert {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #10b981;
      color: white;
      padding: 16px 24px;
      border-radius: 8px;
      font-family: 'Bebas Neue', sans-serif;
      z-index: 1000;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.6);
      animation: slideDown 0.3s ease-out;
    }

    .alert.error {
      background: #ef4444;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
    }

    @keyframes slideDown {
      0% { transform: translateX(-50%) translateY(-100%); opacity: 0; }
      100% { transform: translateX(-50%) translateY(0); opacity: 1; }
    }

    @media (max-width: 600px) {
      .upgrades-grid { grid-template-columns: repeat(2, 1fr); }
      .header-title { font-size: 36px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-title">🎰 CASINO SHOP 🎰</div>
    <div class="currencies">
      <div class="currency-card">
        <div class="currency-value" id="moneyDisplay">0€</div>
        <div class="currency-label">Argent</div>
      </div>
      <div class="currency-card">
        <div class="currency-value" id="diamondsDisplay">0</div>
        <div class="currency-label">Diamants</div>
      </div>
      <div class="currency-card">
        <div class="currency-value" id="trophiesDisplay">0</div>
        <div class="currency-label">Trophées</div>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="section-title">⚡ Améliorations Clicker</div>
    <div class="upgrades-grid" id="upgradesGrid"></div>
  </div>

  <div class="bottom-nav">
    <button class="nav-btn" onclick="goBack()">← RETOUR AU CLICKER</button>
  </div>

  <script>
    const SUPABASE_URL = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let profile = null;

    const UPGRADES = [
      {
        id: 'earn_per_click',
        name: 'Gain par Clic',
        icon: '💵',
        basePrice: 500,
        priceType: 'money',
        maxLevel: 10,
        bonus: (level) => `+${level}€/clic`
      },
      {
        id: 'combo_speed',
        name: 'Vitesse Combo',
        icon: '⚡',
        basePrice: 1000,
        priceType: 'money',
        maxLevel: 5,
        bonus: (level) => `+${level * 10}% plus vite`
      },
      {
        id: 'combo_max',
        name: 'Combo Max',
        icon: '🔥',
        basePrice: 50,
        priceType: 'diamonds',
        maxLevel: 8,
        bonus: (level) => `×${(2 + level * 0.5).toFixed(1)}`
      },
      {
        id: 'xp_multiplier',
        name: 'Multiplicateur XP',
        icon: '⭐',
        basePrice: 100,
        priceType: 'diamonds',
        maxLevel: 5,
        bonus: (level) => `×${level}`
      },
      {
        id: 'auto_clicker',
        name: 'Auto-Clicker',
        icon: '🤖',
        basePrice: 200,
        priceType: 'diamonds',
        maxLevel: 3,
        bonus: (level) => `+${level}€/sec`
      },
      {
        id: 'prestige',
        name: 'Prestige',
        icon: '👑',
        basePrice: 500,
        priceType: 'trophies',
        maxLevel: 1,
        bonus: (level) => `Réinitialise tout +bonus`
      }
    ];

    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        window.location.href = 'index.html';
        return;
      }

      currentUser = session.user;

      const { data } = await sb
        .from('profiles')
        .select('*')
        .eq('id', currentUser.id)
        .single();

      profile = data;
      updateDisplay();
      renderUpgrades();
    }

    function updateDisplay() {
      document.getElementById('moneyDisplay').textContent = (profile?.money || 0).toLocaleString('fr-FR') + '€';
      document.getElementById('diamondsDisplay').textContent = profile?.diamonds || 0;
      document.getElementById('trophiesDisplay').textContent = profile?.trophies || 0;
    }

    function renderUpgrades() {
      const grid = document.getElementById('upgradesGrid');
      grid.innerHTML = UPGRADES.map(upgrade => {
        const level = profile?.upgrades?.[upgrade.id] || 0;
        const price = upgrade.basePrice * (level + 1);
        const isMaxed = level >= upgrade.maxLevel;
        const hasResources = 
          (upgrade.priceType === 'money' && profile.money >= price) ||
          (upgrade.priceType === 'diamonds' && profile.diamonds >= price) ||
          (upgrade.priceType === 'trophies' && profile.trophies >= price);

        return `
          <div class="upgrade-card ${isMaxed ? 'maxed' : ''}">
            <span class="upgrade-icon">${upgrade.icon}</span>
            <div class="upgrade-name">${upgrade.name}</div>
            <div class="upgrade-level">Niveau ${level}/${upgrade.maxLevel}</div>
            <div class="upgrade-bonus">
              <div class="bonus-value">${upgrade.bonus(level)}</div>
              <div class="bonus-label">Bonus actif</div>
            </div>
            <div class="upgrade-price">
              ${upgrade.priceType === 'money' ? `${price}€` : 
                upgrade.priceType === 'diamonds' ? `💎${price}` : 
                `🏆${price}`}
            </div>
            <button class="buy-btn" 
              onclick="buyUpgrade('${upgrade.id}')"
              ${isMaxed || !hasResources ? 'disabled' : ''}>
              ${isMaxed ? 'MAX' : 'ACHETER'}
            </button>
          </div>
        `;
      }).join('');
    }

    async function buyUpgrade(upgradeId) {
      const upgrade = UPGRADES.find(u => u.id === upgradeId);
      const level = profile?.upgrades?.[upgrade.id] || 0;
      const price = upgrade.basePrice * (level + 1);

      let canBuy = false;
      if (upgrade.priceType === 'money') {
        canBuy = profile.money >= price;
      } else if (upgrade.priceType === 'diamonds') {
        canBuy = profile.diamonds >= price;
      } else if (upgrade.priceType === 'trophies') {
        canBuy = profile.trophies >= price;
      }

      if (!canBuy) {
        showAlert('Pas assez de ressources!', true);
        return;
      }

      try {
        const updates = { ...profile.upgrades };
        updates[upgradeId] = (updates[upgradeId] || 0) + 1;

        let updateObj = { upgrades: updates };
        if (upgrade.priceType === 'money') updateObj.money = profile.money - price;
        else if (upgrade.priceType === 'diamonds') updateObj.diamonds = profile.diamonds - price;
        else if (upgrade.priceType === 'trophies') updateObj.trophies = profile.trophies - price;

        await sb.from('profiles').update(updateObj).eq('id', currentUser.id);

        profile = { ...profile, ...updateObj };
        updateDisplay();
        renderUpgrades();
        showAlert(`✅ ${upgrade.name} acheté!`);
      } catch (error) {
        console.error(error);
        showAlert('Erreur lors de l\'achat', true);
      }
    }

    function showAlert(message, isError = false) {
      const alert = document.createElement('div');
      alert.className = `alert ${isError ? 'error' : ''}`;
      alert.textContent = message;
      document.body.appendChild(alert);
      setTimeout(() => alert.remove(), 3000);
    }

    function goBack() {
      window.location.href = 'clicker.html';
    }

    init();
  </script>
</body>
</html>
