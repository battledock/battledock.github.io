<script>
(function(){
'use strict';

/* ================= CONSTANTES DU MONDE ================= */
var W=1000, H=1600;
var URL_SB='https://zpfkekiavlfphialvphi.supabase.co';
var CLE_SB='sb_publishable__dfR2lEOwKjhhtavvJEvGw_KVACZnHP';

/* Les rues : des verticales (avenues) et des horizontales. L'autoroute est
   la bande horizontale du milieu, plus large, et elle traverse toute la ville. */
var RUES_V=[[150,220],[430,500],[760,830]];
var RUES_H=[[250,310],[640,760],[1000,1060],[1300,1360]];
var AUTOROUTE={y0:640,y1:760};

function intervalles(rues,max){
  var out=[],p=0;
  rues.forEach(function(r){out.push([p,r[0]]);p=r[1];});
  out.push([p,max]);
  return out;
}
var BLOCS_X=intervalles(RUES_V,W), BLOCS_Y=intervalles(RUES_H,H);

/* Les routes, pour le dessin : une bande d'asphalte par rue. */
var ROUTES=[{x:0,y:AUTOROUTE.y0,w:W,h:AUTOROUTE.y1-AUTOROUTE.y0,hw:true}];
RUES_V.forEach(function(r){ROUTES.push({x:r[0],y:0,w:r[1]-r[0],h:H});});
RUES_H.forEach(function(r){if(r[0]!==AUTOROUTE.y0)ROUTES.push({x:0,y:r[0],w:W,h:r[1]-r[0]});});

/* Les immeubles : un par îlot, sauf la place centrale qui reste ouverte. */
var NEONS=['#ff5a8a','#7ff0ff','#ffd27a','#b08cff','#7fe89a','#ff8a4a'];
var MOTS=['RAMEN','KARAOKÉ','POISSONS','NUIT','BAR','HÔTEL','ARCADE','PACHINKO'];
var BATIS=[], PLACE=null, ARMURERIE=null;
for(var bi=0;bi<BLOCS_X.length;bi++){
  for(var bj=0;bj<BLOCS_Y.length;bj++){
    var bx=BLOCS_X[bi], by=BLOCS_Y[bj];
    var r={x:bx[0]+8,y:by[0]+8,w:bx[1]-bx[0]-16,h:by[1]-by[0]-16};
    var graine=(bi*17+bj*31)%97;
    if(bi===1&&bj===1){PLACE=r;continue;}  /* la place : pas d'immeuble, on peut la traverser */
    var b={x:r.x,y:r.y,w:r.w,h:r.h,
           col:['#14142a','#1a1430','#101c2e','#1c1426'][graine%4],
           neon:NEONS[graine%NEONS.length],
           sign:MOTS[graine%MOTS.length],
           graine:graine};
    if(bi===2&&bj===3){b.sign='ARMURERIE';b.neon='#7ff0ff';b.boutique=true;ARMURERIE=b;}
    BATIS.push(b);
  }
}
/* La porte de l'armurerie : sur l'avenue, collée à la façade de l'immeuble. */
var PORTE={x:452,y:1160,w:44,h:44};
/* La sortie : tout au bout ouest de l'autoroute, vers le port. */
var SORTIE={x:0,y:AUTOROUTE.y0+8,w:34,h:AUTOROUTE.y1-AUTOROUTE.y0-16};

/* ================= LE CANVAS ================= */
var cv=document.getElementById('cv'), g=cv.getContext('2d');
var SW=0, SH=0, ZOOM=1, DPR=1;
function cadrer(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  SW=window.innerWidth; SH=window.innerHeight;
  cv.width=Math.round(SW*DPR); cv.height=Math.round(SH*DPR);
  cv.style.width=SW+'px'; cv.style.height=SH+'px';
  /* assez de ville à l'écran pour lire les rues, sans voir trop loin */
  ZOOM=Math.max(0.85,Math.min(1.7,SW/430));
}
window.addEventListener('resize',cadrer);
cadrer();

/* ================= LA VOITURE ================= */
var car={x:500,y:700,a:0,vx:0,vy:0};
var entree={porte:false, sortie:0, dedans:false};
var shopOuvert=false;

function dansBatiment(x,y,r){
  for(var i=0;i<BATIS.length;i++){
    var b=BATIS[i];
    if(x+r>b.x&&x-r<b.x+b.w&&y+r>b.y&&y-r<b.y+b.h)return true;
  }
  return false;
}
function dansZone(z,x,y){return x>z.x&&x<z.x+z.w&&y>z.y&&y<z.y+z.h;}
function surAutoroute(y){return y>AUTOROUTE.y0&&y<AUTOROUTE.y1;}

/* ================= LES COMMANDES ================= */
var joy={x:0,y:0}, keys={}, pouceVu=false;
var stick=document.getElementById('stick'), pouce=document.getElementById('pouce');
var poin=null, ox=0, oy=0;
stick.addEventListener('pointerdown',function(ev){
  poin=ev.pointerId; ox=ev.clientX; oy=ev.clientY;
  try{stick.setPointerCapture(ev.pointerId);}catch(e){}
  pouce.style.display='block'; pouce.style.left=ox+'px'; pouce.style.top=oy+'px';
  ev.preventDefault();
});
stick.addEventListener('pointermove',function(ev){
  if(ev.pointerId!==poin)return;
  var dx=ev.clientX-ox, dy=ev.clientY-oy;
  var m=Math.hypot(dx,dy), k=m>0?Math.min(1,m/56)/m:0;
  joy.x=dx*k; joy.y=dy*k;
  pouce.style.left=(ox+Math.max(-56,Math.min(56,dx)))+'px';
  pouce.style.top=(oy+Math.max(-56,Math.min(56,dy)))+'px';
});
function lacher(ev){
  if(ev&&ev.pointerId!==poin)return;
  poin=null; joy.x=0; joy.y=0; pouce.style.display='none';
}
stick.addEventListener('pointerup',lacher);
stick.addEventListener('pointercancel',lacher);
window.addEventListener('keydown',function(ev){keys[ev.key.toLowerCase()]=true;});
window.addEventListener('keyup',function(ev){keys[ev.key.toLowerCase()]=false;});

function entreeClavier(){
  var x=0,y=0;
  if(keys['arrowleft']||keys['a']||keys['q'])x-=1;
  if(keys['arrowright']||keys['d'])x+=1;
  if(keys['arrowup']||keys['w']||keys['z'])y-=1;
  if(keys['arrowdown']||keys['s'])y+=1;
  return {x:x,y:y};
}

/* ================= LA BOUCLE ================= */
var dernier=0;
function miseAJour(dt){
  if(shopOuvert){car.vx*=0.8;car.vy*=0.8;}
  var k=entreeClavier();
  var ix=joy.x+k.x, iy=joy.y+k.y;
  var m=Math.hypot(ix,iy);
  if(m>1){ix/=m;iy/=m;m=1;}
  if(shopOuvert){ix=0;iy=0;m=0;}

  /* l'autoroute donne le double de vitesse, et la ville se conduit prudemment */
  var vmax=2.4*(surAutoroute(car.y)?1.9:1);
  var tvx=ix*vmax, tvy=iy*vmax;
  var f=Math.min(1,dt*8);
  car.vx+=(tvx-car.vx)*f; car.vy+=(tvy-car.vy)*f;

  /* on bouge axe par axe : un mur bloque seulement le sens qui le heurte */
  var pas=dt*60;
  var nx=car.x+car.vx*pas;
  if(!dansBatiment(nx,car.y,9)&&nx>9&&nx<W-9)car.x=nx; else car.vx=0;
  var ny=car.y+car.vy*pas;
  if(!dansBatiment(car.x,ny,9)&&ny>9&&ny<H-9)car.y=ny; else car.vy=0;

  /* le cap suit la route, en douceur */
  var sp=Math.hypot(car.vx,car.vy);
  if(sp>0.12){
    var cible=Math.atan2(car.vy,car.vx);
    var d=cible-car.a;
    while(d>Math.PI)d-=2*Math.PI;
    while(d<-Math.PI)d+=2*Math.PI;
    car.a+=d*Math.min(1,dt*10);
  }

  /* les zones : l'armurerie s'ouvre une fois par passage, la sortie se
     garde une seconde avant de compter comme un départ */
  if(!shopOuvert){
    var dansPorte=dansZone(PORTE,car.x,car.y);
    if(dansPorte&&!entree.porte){entree.porte=true;ouvrirBoutique();}
    if(!dansPorte)entree.porte=false;
  }
  if(dansZone(SORTIE,car.x,car.y)){
    entree.sortie+=dt;
    if(entree.sortie>1.2&&!entree.dedans){entree.dedans=true;msg('Retour au port');setTimeout(retourPort,500);}
  }else{entree.sortie=0;}
}

function dessiner(){
  var t=Date.now()/1000;
  g.setTransform(DPR,0,0,DPR,0,0);
  g.fillStyle='#06060c';
  g.fillRect(0,0,SW,SH);

  g.save();
  g.translate(SW/2-car.x*ZOOM, SH/2-car.y*ZOOM);
  g.scale(ZOOM,ZOOM);

  /* le sol de la ville */
  g.fillStyle='#0b0b16';
  g.fillRect(0,0,W,H);

  /* les rues */
  ROUTES.forEach(function(r){
    g.fillStyle=r.hw?'#1b1d2c':'#15161f';
    g.fillRect(r.x,r.y,r.w,r.h);
  });
  /* la place : des dalles sombres et une fontaine néon */
  if(PLACE){
    g.fillStyle='#120f1e';g.fillRect(PLACE.x,PLACE.y,PLACE.w,PLACE.h);
    for(var px=PLACE.x+20;px<PLACE.x+PLACE.w;px+=40){
      g.fillStyle='rgba(127,240,255,.05)';g.fillRect(px,PLACE.y,1,PLACE.h);
    }
    var cx=PLACE.x+PLACE.w/2, cy=PLACE.y+PLACE.h/2;
    g.beginPath();g.arc(cx,cy,34,0,7);g.fillStyle='#0d1a26';g.fill();
    g.lineWidth=2;g.strokeStyle='rgba(127,240,255,.7)';g.stroke();
    g.beginPath();g.arc(cx,cy,12+Math.sin(t*2)*3,0,7);g.fillStyle='rgba(127,240,255,.25)';g.fill();
  }

  /* l'autoroute : les bords lumineux, la ligne centrale, les lampadaires */
  var ay0=AUTOROUTE.y0, ay1=AUTOROUTE.y1, ac=(ay0+ay1)/2;
  g.fillStyle='rgba(127,240,255,.55)';g.fillRect(0,ay0+3,W,2);g.fillRect(0,ay1-5,W,2);
  g.fillStyle='rgba(255,210,122,.8)';
  for(var lx=0;lx<W;lx+=46){g.fillRect(lx+(Math.floor(t*40)%46),ac-1,22,2);}
  for(var lp=20;lp<W;lp+=120){
    g.fillStyle='rgba(255,210,122,.9)';g.beginPath();g.arc(lp,ay0-6,3,0,7);g.fill();
    g.fillStyle='rgba(255,210,122,.9)';g.beginPath();g.arc(lp,ay1+6,3,0,7);g.fill();
  }
  /* les lignes des rues : pointillés blancs au centre */
  g.fillStyle='rgba(255,255,255,.14)';
  RUES_V.forEach(function(r){var cxr=(r[0]+r[1])/2;for(var y=0;y<H;y+=36)g.fillRect(cxr-1,y,2,18);});
  RUES_H.forEach(function(r){if(r[0]===AUTOROUTE.y0)return;var cyr=(r[0]+r[1])/2;for(var x=0;x<W;x+=36)g.fillRect(x,cyr-1,18,2);});

  /* les immeubles */
  BATIS.forEach(function(b){
    g.fillStyle=b.col;g.fillRect(b.x,b.y,b.w,b.h);
    /* la façade : un liseré de la couleur du néon */
    g.fillStyle='rgba(255,255,255,.04)';g.fillRect(b.x,b.y,b.w,6);
    g.strokeStyle=b.neon;g.globalAlpha=0.35;g.lineWidth=1;g.strokeRect(b.x+0.5,b.y+0.5,b.w-1,b.h-1);g.globalAlpha=1;
    /* les fenêtres : certaines allumées, qui scintillent doucement */
    for(var wy=b.y+14;wy<b.y+b.h-10;wy+=16){
      for(var wx=b.x+8;wx<b.x+b.w-10;wx+=14){
        var h=Math.abs(Math.sin((wx*12.9898+wy*78.233+b.graine)*0.37));
        if(h<0.42)continue;
        var couleurs=['#ffd27a','#8fe8ff','#ff6a9a','#b08cff','#7fe89a'];
        var c=couleurs[Math.floor(h*97)%couleurs.length];
        g.globalAlpha=0.45+0.4*Math.sin(t*2+h*20);
        g.fillStyle=c;g.fillRect(wx,wy,6,8);
      }
    }
    g.globalAlpha=1;
    /* l'enseigne du toit */
    g.font='bold 15px "Baloo 2", system-ui, sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    var ex=b.x+b.w/2, ey=b.y+12;
    g.shadowColor=b.neon;g.shadowBlur=b.boutique?16:8;
    g.fillStyle=b.neon;
    g.fillText(b.sign,ex,ey);
    g.shadowBlur=0;
  });

  /* la porte de l'armurerie, sur l'avenue */
  g.fillStyle='rgba(127,240,255,.18)';g.fillRect(PORTE.x,PORTE.y,PORTE.w,PORTE.h);
  g.strokeStyle='#7ff0ff';g.lineWidth=2;g.strokeRect(PORTE.x+1,PORTE.y+1,PORTE.w-2,PORTE.h-2);
  g.fillStyle='#7ff0ff';g.font='bold 9px ui-monospace, monospace';g.textAlign='center';
  g.fillText('ENTRÉE',PORTE.x+PORTE.w/2,PORTE.y+PORTE.h+8);

  /* la sortie vers le port */
  g.fillStyle='rgba(255,210,122,.2)';g.fillRect(SORTIE.x,SORTIE.y,SORTIE.w,SORTIE.h);
  g.fillStyle='#ffd27a';g.font='bold 9px ui-monospace, monospace';g.textAlign='center';
  g.save();g.translate(SORTIE.x+SORTIE.w/2,SORTIE.y+SORTIE.h/2);g.rotate(-Math.PI/2);
  g.fillText('PORT',0,0);g.restore();

  drawCar(t);
  g.restore();
}

function drawCar(t){
  g.save();
  g.translate(car.x,car.y);
  g.rotate(car.a);
  /* le halo sous la carte */
  g.fillStyle='rgba(255,90,138,'+(0.22+0.05*Math.sin(t*6))+')';
  g.beginPath();g.ellipse(0,0,18,11,0,0,7);g.fill();
  /* la carrosserie et le pare-brise */
  g.fillStyle='#ff5a8a';g.fillRect(-11,-6,22,12);
  g.fillStyle='#b8345e';g.fillRect(-11,-6,22,2);g.fillRect(-11,4,22,2);
  g.fillStyle='#16202c';g.fillRect(-2,-4.5,9,9);
  /* les phares et les feux arrière */
  g.fillStyle='#fff7c0';g.fillRect(10,-4,2,3);g.fillRect(10,1,2,3);
  g.fillStyle='#ff3030';g.fillRect(-12,-4,2,3);g.fillRect(-12,1,2,3);
  g.restore();
}

function boucle(ts){
  var dt=Math.min(0.05,(ts-(dernier||ts))/1000);
  dernier=ts;
  miseAJour(dt);
  dessiner();
  requestAnimationFrame(boucle);
}
requestAnimationFrame(boucle);

/* ================= LES MESSAGES ================= */
var msgT=0;
function msg(texte){
  var m=document.getElementById('msg');
  m.textContent=texte;m.classList.add('on');
  clearTimeout(msgT);msgT=setTimeout(function(){m.classList.remove('on');},1800);
}

/* ================= LE COMPTE ET LE COMPTOIR ================= */
var SB=null, SESSION=null;
async function supa(){
  if(SB)return SB;
  var urls=['https://esm.sh/@supabase/supabase-js@2','https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'];
  for(var i=0;i<urls.length;i++){
    try{
      var m=await import(urls[i]);
      SB=m.createClient(URL_SB,CLE_SB);
      try{SESSION=await window.BD_SESSION.reveiller(SB);}catch(x){}
      return SB;
    }catch(x){}
  }
  return null;
}
async function rpc(nom,args){
  await supa();
  if(!SB)return {erreur:'La ville ne répond pas. Vérifie ta connexion.'};
  if(!SESSION){
    try{SESSION=await window.BD_SESSION.reveiller(SB);}catch(x){}
  }
  if(!SESSION){
    try{window.BD_SESSION.prevenir('Tokyo');}catch(x){}
    return {erreur:window.BD_SESSION.mot||'Connecte-toi pour entrer dans la boutique.'};
  }
  try{
    var r=await SB.rpc(nom,args||{});
    if(r.error)return {erreur:r.error.message||'La boutique n’a pas répondu.'};
    return r.data;
  }catch(x){return {erreur:'La boutique n’a pas répondu.'};}
}

function lireSave(){try{return JSON.parse(localStorage.getItem('bdl.pix.v2')||'{}')||{};}catch(x){return {};}}
function enEuros(c){
  return ((c||0)/100).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
}
var SOLDE=null;
function noterSolde(c){
  SOLDE=c;
  document.getElementById('sou').textContent=enEuros(c);
  document.getElementById('shopSolde').textContent='Ton solde : '+enEuros(c);
  try{var s=lireSave();s.euros=c;localStorage.setItem('bdl.pix.v2',JSON.stringify(s));}catch(x){}
}
(async function(){
  var s=lireSave();
  if(typeof s.euros==='number')noterSolde(s.euros);
  await supa();
  if(!SB||!SESSION||!SESSION.user)return;
  try{
    var r=await SB.from('comptes').select('euros_cents').eq('id',SESSION.user.id).limit(1);
    if(!r.error&&r.data&&r.data.length&&typeof r.data[0].euros_cents==='number')noterSolde(r.data[0].euros_cents);
  }catch(x){}
})();

/* les armes en vente : ce que le comptoir de l'arcade vend, au même prix */
var NOMS={fusil:'FUSIL D’ARGENT',minigun:'MINIGUN',plasma:'PLASMA',railgun:'RAILGUN'};
var DITS={fusil:'Neuf plombs en éventail. De près, rien n’y échappe.',
          minigun:'Une rafale qui ne s’arrête jamais.',
          plasma:'Rebondit deux fois sur les murs.',
          railgun:'Un trait qui traverse tout, à très longue portée.'};
var COULEURS={fusil:'#e8f4ff',minigun:'#ffd27a',plasma:'#c08cff',railgun:'#9ff7ff'};
var BOUTIQUE=[], POSSEDEES=[];

function dessinerIcone(cvI,couleur){
  var c=cvI.getContext('2d');
  c.imageSmoothingEnabled=false;c.clearRect(0,0,cvI.width,cvI.height);
  /* un canon néon, avec sa lueur : la boutique se reconnaît à la couleur */
  c.fillStyle='#2a3038';c.fillRect(6,22,22,8);
  c.fillStyle='#3a4149';c.fillRect(10,14,14,8);
  c.fillStyle=couleur;c.fillRect(24,16,30,4);
  c.fillStyle='#ffffff';c.fillRect(24,16,30,1);
  c.fillStyle=couleur;c.globalAlpha=0.35;c.fillRect(52,12,4,12);c.globalAlpha=1;
}

async function chargerBoutique(){
  var r=await rpc('arcade_mon_arsenal',{});
  if(!r||r.erreur){
    document.getElementById('shopList').innerHTML='<p class="note">'+((r&&r.erreur)||'La boutique ne répond pas.')+'</p>';
    return;
  }
  POSSEDEES=r.possedees||[];
  BOUTIQUE=r.boutique||[];
  afficherBoutique();
}

function afficherBoutique(){
  var liste=document.getElementById('shopList');
  liste.innerHTML='';
  BOUTIQUE.forEach(function(b){
    var item=document.createElement('div');item.className='it';
    var c=document.createElement('canvas');c.width=64;c.height=40;
    dessinerIcone(c,COULEURS[b.arme]||'#ffffff');
    var n=document.createElement('span');n.className='n';
    n.innerHTML='<b></b><em></em>';
    n.querySelector('b').textContent=NOMS[b.arme]||b.arme;
    n.querySelector('em').textContent=DITS[b.arme]||'';
    item.appendChild(c);item.appendChild(n);
    if(b.possede){
      var ok=document.createElement('span');ok.className='ok';ok.textContent='✓ À TOI';item.appendChild(ok);
    }else{
      var bt=document.createElement('button');bt.textContent=enEuros(b.prix);
      bt.onclick=function(){acheter(b.arme,bt);};
      item.appendChild(bt);
    }
    liste.appendChild(item);
  });
}

async function acheter(arme,bouton){
  bouton.disabled=true;
  var r=await rpc('arcade_acheter_arme',{p_arme:arme});
  if(!r||r.erreur){
    bouton.disabled=false;
    msg((r&&r.erreur)||'La boutique n’a pas répondu.');
    return;
  }
  if(typeof r.euros==='number')noterSolde(r.euros);
  msg((NOMS[arme]||arme)+' est à toi.');
  await chargerBoutique();
}

function ouvrirBoutique(){
  shopOuvert=true;
  document.getElementById('shop').hidden=false;
  document.getElementById('shopList').innerHTML='<p class="note">Le vendeur ouvre les tiroirs…</p>';
  if(SOLDE!==null)document.getElementById('shopSolde').textContent='Ton solde : '+enEuros(SOLDE);
  chargerBoutique();
}
function fermerBoutique(){
  shopOuvert=false;
  document.getElementById('shop').hidden=true;
  /* on sort de la porte avant de pouvoir y rentrer : sinon la boutique se rouvre */
  entree.porte=true;
}
document.getElementById('shopX').onclick=fermerBoutique;
document.getElementById('shop').addEventListener('click',function(ev){
  if(ev.target===this)fermerBoutique();
});

/* ================= LE RETOUR ================= */
function retourPort(){
  window.location.href='jeu.html?v='+encodeURIComponent(window.MA_VERSION||Date.now());
}
document.getElementById('sortir').onclick=retourPort;

})();
</script>
