<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden;touch-action:manipulation}
body{background:#0a0a0a;font-family:'Inter',sans-serif}
canvas{display:block;width:100%;height:100%}
.hud{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px)+8px) 10px 0;z-index:10;pointer-events:none}
.hud-top{display:flex;align-items:flex-start;justify-content:space-between}
.hud-left{display:flex;flex-direction:column;gap:5px;pointer-events:auto}
.hud-back{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:5px 12px;font-family:'Bebas Neue',sans-serif;font-size:11px;color:rgba(255,255,255,.5);letter-spacing:1px;cursor:pointer;text-decoration:none;display:inline-block;width:fit-content}
.hud-lives-pill{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:5px 10px;display:flex;align-items:center;gap:4px;width:fit-content}
.hud-lives{font-size:13px}
.hud-lives-count{font-family:'Bebas Neue',sans-serif;font-size:16px;color:#fff}
.hud-center{text-align:center;pointer-events:auto}
.hud-score-pill{background:rgba(0,0,0,.4);border:1.5px solid rgba(255,255,255,.1);border-radius:16px;padding:6px 18px;display:inline-block}
.hud-score-lbl{font-size:7px;font-weight:700;color:rgba(255,255,255,.3);letter-spacing:2px}
.hud-score{font-family:'Bebas Neue',sans-serif;font-size:32px;color:#fff;line-height:1}
.hud-combo{font-family:'Bangers',cursive;font-size:14px;color:#fbbf24;letter-spacing:1px;margin-top:2px}
.hud-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;pointer-events:auto}
.hud-pause{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:5px 10px;font-size:12px;color:rgba(255,255,255,.5);cursor:pointer}
.hud-gains-pill{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:5px 10px;text-align:right}
.hud-money{font-family:'Bebas Neue',sans-serif;font-size:14px;color:#4ade80;line-height:1}
.hud-xp{font-family:'Bebas Neue',sans-serif;font-size:11px;color:#818cf8;line-height:1;margin-top:2px}
.hud-best{font-size:7px;color:rgba(255,255,255,.2);font-weight:700;letter-spacing:1px;margin-top:2px}

.feedback{position:fixed;top:32%;left:50%;transform:translate(-50%,-50%);z-index:20;pointer-events:none;text-align:center}
.fb-text{font-family:'Bangers',cursive;font-size:38px;letter-spacing:3px;opacity:0;transform:scale(.5) rotate(-3deg);transition:all .15s cubic-bezier(.175,.885,.32,1.275);text-shadow:3px 3px 0 rgba(0,0,0,.4);-webkit-text-stroke:1px rgba(0,0,0,.15)}
.fb-text.show{opacity:1;transform:scale(1) rotate(0)}
.fb-text.hide{opacity:0;transform:scale(1.2) translateY(-15px);transition:all .25s ease}
.fb-money{font-family:'Bebas Neue',sans-serif;font-size:20px;color:#4ade80;text-shadow:2px 2px 0 rgba(0,0,0,.3);opacity:0;transform:translateY(8px);transition:all .15s ease .08s}
.fb-money.show{opacity:1;transform:translateY(0)}

.gameover{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:16px}
.gameover.show{display:flex}
.go-card{background:rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.1);border-radius:24px;padding:24px 20px;text-align:center;max-width:320px;width:100%;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.go-title{font-family:'Bangers',cursive;font-size:28px;color:#fff;letter-spacing:3px}
.go-stat{display:flex;justify-content:center;gap:12px;margin:14px 0}
.go-stat-item{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px 14px;text-align:center;flex:1}
.go-stat-val{font-family:'Bebas Neue',sans-serif;font-size:24px;color:#fff}
.go-stat-lbl{font-size:6px;color:rgba(255,255,255,.3);font-weight:700;letter-spacing:1px;margin-top:2px}
.go-earned{background:rgba(74,222,128,.08);border:1.5px solid rgba(74,222,128,.15);border-radius:14px;padding:10px;margin:10px 0}
.go-earned-val{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#4ade80}
.go-btns{display:flex;gap:8px;margin-top:14px}
.go-btn{flex:1;padding:13px;border:none;border-radius:12px;font-family:'Bangers',cursive;font-size:15px;letter-spacing:2px;cursor:pointer}
.go-btn:active{transform:scale(.97)}
.go-retry{background:#fbbf24;color:#1a1a1a}
.go-quit{background:rgba(255,255,255,.08);color:rgba(255,255,255,.5)}

.start{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;padding:20px}
.start.hide{display:none}
.st-card{text-align:center;max-width:300px;background:rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.08);border-radius:28px;padding:32px 24px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.st-emoji{font-size:64px;filter:drop-shadow(0 4px 20px rgba(251,191,36,.2))}
.st-title{font-family:'Bangers',cursive;font-size:32px;color:#fbbf24;letter-spacing:3px;text-shadow:2px 2px 0 rgba(0,0,0,.4);margin-top:8px}
.st-sub{font-size:10px;color:rgba(255,255,255,.3);margin-top:8px;line-height:1.6}
.st-btn{margin-top:20px;width:100%;padding:15px;border:none;border-radius:14px;background:#fbbf24;color:#1a1a1a;font-family:'Bangers',cursive;font-size:18px;letter-spacing:2px;cursor:pointer}
.st-btn:active{transform:scale(.97)}
.st-back{margin-top:12px;background:none;border:none;color:rgba(255,255,255,.2);font-family:'Bangers',cursive;font-size:11px;letter-spacing:2px;cursor:pointer}
</style>
</head>

<div class="feedback"><div class="fb-text" id="fbText"></div><div class="fb-money" id="fbMoney"></div></div>
<div id="pauseOverlay" style="display:none;position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.75);align-items:center;justify-content:center;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)"><div style="text-align:center"><div style="font-family:Bangers,cursive;font-size:32px;color:#fff;letter-spacing:3px">PAUSE</div><button onclick="togglePause()" style="margin-top:16px;padding:13px 28px;border:none;border-radius:12px;background:#fbbf24;color:#1a1a1a;font-family:Bangers,cursive;font-size:16px;letter-spacing:2px;cursor:pointer">REPRENDRE</button></div></div>
<div class="start" id="startScreen"><div class="st-card">
  <div class="st-emoji">🏗️</div>
  <div class="st-title">GRUTIER</div>

  <button class="st-btn" onclick="startGame()">COMMENCER</button>
  <button class="st-back" onclick="location.href='travail.html'">← RETOUR</button>
</div></div>
<div class="gameover" id="gameoverScreen"><div class="go-card">
  <div style="font-size:48px;margin-bottom:6px" id="goEmoji">📦</div>
  <div class="go-title" id="goTitle">FIN DE SERVICE</div>
  <div class="go-stat">
    <div class="go-stat-item"><div class="go-stat-val" id="goScore">0</div><div class="go-stat-lbl">CHARGEMENTS</div></div>
    <div class="go-stat-item"><div class="go-stat-val" id="goCombo">0</div><div class="go-stat-lbl">MAX COMBO</div></div>
    <div class="go-stat-item"><div class="go-stat-val" id="goPerfect">0%</div><div class="go-stat-lbl">PARFAITS</div></div>
  </div>
  <div class="go-earned">
    <div class="go-earned-val" id="goEarned">+0€</div>
    <div style="font-size:14px;color:#818cf8;font-weight:800;margin-top:2px" id="goXP">+0 XP</div>
  </div>
  <div class="go-btns"><button class="go-btn go-retry" onclick="startGame()">REJOUER</button><button class="go-btn go-quit" onclick="location.href='travail.html'">QUITTER</button></div>
</div></div>

<script>
var SB_URL='https://drtsuhnbclhmgfjiykap.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
var sb=supabase.createClient(SB_URL,SB_KEY);
var _me=null,_bestScore=0;

// Audio removed

// Audio removed - music only
var _paused=false;
function togglePause(){
  if(state!=='playing'&&!_paused)return;
  _paused=!_paused;
  document.getElementById('pauseOverlay').style.display=_paused?'flex':'none';
  document.getElementById('pauseBtn').textContent=_paused?'▶':'⏸';
  if(_paused){state='paused';}else{state='playing';}
}
var canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),W,H,dpr;
function resize(){dpr=window.devicePixelRatio||1;W=window.innerWidth;H=window.innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);}
resize();window.addEventListener('resize',resize);

var BORDER=3,t=0;
var GOLDEN={base:'#d4af37',dark:'#92710a',hi:'#fde68a'};
var CAB_COLORS=['#2563eb','#dc2626','#059669','#d97706','#7c3aed','#0891b2'];
var COLORS=[
  {base:'#cc2200',dark:'#8a1700',hi:'#ff6644'},
  {base:'#1a6db5',dark:'#0e4a7a',hi:'#4da3e8'},
  {base:'#1a8a4a',dark:'#0d5e30',hi:'#3dbf6e'},
  {base:'#d97706',dark:'#92510a',hi:'#fbbf24'},
  {base:'#7c3aed',dark:'#5521a6',hi:'#a78bfa'},
  {base:'#c4366d',dark:'#8a2550',hi:'#f472b6'},
  {base:'#0891b2',dark:'#065a73',hi:'#22d3ee'},
  {base:'#b45309',dark:'#7a3907',hi:'#f59e0b'},
];

// ══ STATE ══
var state='start',score=0,combo=0,maxCombo=0,totalEarned=0,lives=3;
var particles=[],shakeX=0,shakeY=0,flashAlpha=0;
var loaded=null,truckLeaving=false;
var smokeParticles=[];
var clouds=[],gulls=[];

// Crane container (finger-controlled)
var crane={x:0,w:100,h:40,color:null,speed:1.8,dir:1};
var _dragging=false,_dragStartX=0,_craneStartX=0;
// Falling container
var falling=null; // {x,y,w,h,color,vy}
// Truck
var truck={x:0,y:0,w:120,speed:1.5,dir:1,trailerX:0,trailerW:110,wheelY:0,cabColor:'#2563eb'};
// Road Y position
var ROAD_Y;

var bgBoats=[];
function initAmbient(){
  clouds=[];gulls=[];bgBoats=[];
  for(var i=0;i<2;i++)bgBoats.push({x:W*.2+Math.random()*W*.6,y:H*.56+Math.random()*H*.04,size:.5+Math.random()*.5,speed:.1+Math.random()*.15,dir:Math.random()>.5?1:-1});
  for(var i=0;i<5;i++)clouds.push({x:Math.random()*W,y:15+Math.random()*H*.18,w:35+Math.random()*50,speed:.12+Math.random()*.18,opacity:.3+Math.random()*.3});
  for(var i=0;i<3;i++)gulls.push({x:Math.random()*W,y:30+Math.random()*H*.12,phase:Math.random()*6,speed:.25+Math.random()*.35});
}

// ══ DRAWING ══
function drawSky(){
  var g=ctx.createLinearGradient(0,0,0,H*.6);
  // Sky evolves with score
  if(score<10){
    g.addColorStop(0,'#7EC8E3');g.addColorStop(.4,'#5BA3D9');g.addColorStop(.8,'#3A7BC8');g.addColorStop(1,'#2563EB');
  }else if(score<20){
    g.addColorStop(0,'#f59e0b');g.addColorStop(.3,'#f97316');g.addColorStop(.6,'#6366f1');g.addColorStop(1,'#312e81');
  }else{
    g.addColorStop(0,'#1e1b4b');g.addColorStop(.3,'#312e81');g.addColorStop(.7,'#0f172a');g.addColorStop(1,'#020617');
  }
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H*.6);
  // Sun position changes
  var sunY=H*.08+Math.min(score,25)*H*.015;
  var sunX=W*.82-Math.min(score,25)*W*.015;
  if(score<25){
    ctx.beginPath();ctx.arc(sunX,sunY,24,0,Math.PI*2);
    ctx.fillStyle=score<10?'#FDE68A':score<20?'#f97316':'#ef4444';ctx.fill();
    ctx.beginPath();ctx.arc(sunX,sunY,32,0,Math.PI*2);
    ctx.fillStyle='rgba(253,230,138,.06)';ctx.fill();
  }
  // Stars at night (score 20+)
  if(score>=20){
    ctx.fillStyle='#fff';
    for(var i=0;i<15;i++){
      var sx=(i*137+50)%W,sy=(i*89+20)%(H*.4);
      ctx.globalAlpha=.3+Math.sin(t*.03+i)*.2;
      ctx.fillRect(sx,sy,1.5,1.5);
    }
    ctx.globalAlpha=1;
  }
}
function drawClouds(){
  clouds.forEach(function(c){c.x+=c.speed;if(c.x>W+80)c.x=-80;ctx.globalAlpha=c.opacity;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(c.x,c.y,c.w*.28,0,Math.PI*2);ctx.arc(c.x+c.w*.22,c.y-c.w*.08,c.w*.2,0,Math.PI*2);ctx.arc(c.x+c.w*.45,c.y,c.w*.22,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;});
}
function drawGulls(){
  gulls.forEach(function(g){g.x+=g.speed;if(g.x>W+30)g.x=-30;var fy=Math.sin(t*.02+g.phase)*5,wing=Math.sin(t*.08+g.phase)*3;ctx.strokeStyle='#1a1a1a';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(g.x-7,g.y+fy+wing);ctx.quadraticCurveTo(g.x,g.y+fy-2,g.x+7,g.y+fy+wing);ctx.stroke();});
}
function drawPort(){
  var y=H*.5;ctx.fillStyle='#162640';
  ctx.fillRect(0,y,W*.07,H*.12);ctx.fillRect(W*.05,y-H*.025,W*.04,H*.14);ctx.fillRect(W*.09,y+H*.02,W*.1,H*.1);
  ctx.fillRect(W*.87,y-H*.05,W*.035,H*.17);ctx.fillRect(W*.85,y-H*.015,W*.07,H*.13);
  ctx.beginPath();ctx.moveTo(W*.888,y-H*.05);ctx.lineTo(W*.891,y-H*.09);ctx.lineTo(W*.894,y-H*.05);ctx.fill();
  ctx.fillStyle='#1e3550';ctx.fillRect(W*.28,y-H*.07,2.5,H*.13);ctx.fillRect(W*.25,y-H*.07,W*.07,2.5);
  ctx.fillRect(W*.68,y-H*.05,2.5,H*.1);ctx.fillRect(W*.65,y-H*.05,W*.06,2.5);
}
function drawBoats(){
  bgBoats.forEach(function(b){
    b.x+=b.speed*b.dir;if(b.x>W+40)b.x=-40;if(b.x<-40)b.x=W+40;
    var s=b.size;
    ctx.fillStyle='#1e3550';
    // Hull
    ctx.beginPath();ctx.moveTo(b.x-18*s,b.y);ctx.lineTo(b.x-14*s,b.y+10*s);ctx.lineTo(b.x+14*s,b.y+10*s);ctx.lineTo(b.x+18*s,b.y);ctx.fill();
    // Mast
    ctx.fillRect(b.x-1,b.y-16*s,2,16*s);
    // Flag
    ctx.fillStyle='#ef4444';ctx.fillRect(b.x+1,b.y-16*s,8*s,5*s);
  });
}
function drawSea(){
  var sy=H*.55;
  var g=ctx.createLinearGradient(0,sy,0,ROAD_Y);
  g.addColorStop(0,'#1e3a5f');g.addColorStop(1,'#173050');
  ctx.fillStyle=g;ctx.fillRect(0,sy,W,ROAD_Y-sy);
  ctx.strokeStyle='rgba(255,255,255,.06)';ctx.lineWidth=1.5;
  for(var i=0;i<5;i++){ctx.beginPath();for(var x=0;x<W;x+=3)ctx.lineTo(x,sy+8+i*9+Math.sin(x*.02+t*.015+i*1.5)*5);ctx.stroke();}
}
function drawRoad(){
  // Quai/road
  ctx.fillStyle='#6B5B45';ctx.fillRect(0,ROAD_Y,W,H-ROAD_Y);
  ctx.strokeStyle='#1a1a1a';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(0,ROAD_Y);ctx.lineTo(W,ROAD_Y);ctx.stroke();
  // Road markings
  ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=2;ctx.setLineDash([20,15]);
  ctx.beginPath();ctx.moveTo(0,ROAD_Y+(H-ROAD_Y)*.5);ctx.lineTo(W,ROAD_Y+(H-ROAD_Y)*.5);ctx.stroke();
  ctx.setLineDash([]);
  // Bollards
  ctx.fillStyle='#d4af37';
  for(var bx=30;bx<W;bx+=80){ctx.fillRect(bx,ROAD_Y-8,6,8);ctx.strokeStyle='#1a1a1a';ctx.lineWidth=1.5;ctx.strokeRect(bx,ROAD_Y-8,6,8);}
}

function drawTruck(tx,ty){
  truck.wheelY=ty;
  var cabW=44,cabH=38,tw=truck.trailerW,th=10,wheelR=9;
  var cabX=tx;
  var tlx=cabX+cabW+4; // trailer right behind cab
  truck.trailerX=tlx;
  // ── Chassis (connects everything) ──
  ctx.fillStyle='#3a3a3a';
  ctx.fillRect(cabX+5,ty-3,cabW+tw+4,5);
  ctx.strokeStyle='#1a1a1a';ctx.lineWidth=1;ctx.strokeRect(cabX+5,ty-3,cabW+tw+4,5);
  // ── Trailer flatbed ──
  ctx.fillStyle='#5a5a5a';
  rr(ctx,tlx,ty-th-2,tw,th+2,3);ctx.fill();
  ctx.strokeStyle='#1a1a1a';ctx.lineWidth=BORDER;rr(ctx,tlx,ty-th-2,tw,th+2,3);ctx.stroke();
  // Deck planks
  ctx.strokeStyle='rgba(0,0,0,.12)';ctx.lineWidth=1;
  for(var px=tlx+14;px<tlx+tw-5;px+=16){ctx.beginPath();ctx.moveTo(px,ty-th);ctx.lineTo(px,ty-1);ctx.stroke();}
  // Side walls/stakes
  ctx.fillStyle='#777';
  var stakes=[tlx,tlx+tw/3,tlx+tw*2/3,tlx+tw-3];
  stakes.forEach(function(sx){ctx.fillRect(sx,ty-th-8,3,8);ctx.strokeStyle='#1a1a1a';ctx.lineWidth=1;ctx.strokeRect(sx,ty-th-8,3,8);});
  // ── Cab body ──
  ctx.fillStyle=truck.cabColor;
  rr(ctx,cabX,ty-cabH,cabW,cabH,6);ctx.fill();
  // Cab gradient
  var cg=ctx.createLinearGradient(cabX,ty-cabH,cabX,ty);
  cg.addColorStop(0,'rgba(255,255,255,.12)');cg.addColorStop(.4,'rgba(255,255,255,0)');
  ctx.fillStyle=cg;rr(ctx,cabX,ty-cabH,cabW,cabH,6);ctx.fill();
  ctx.strokeStyle='#1a1a1a';ctx.lineWidth=BORDER;rr(ctx,cabX,ty-cabH,cabW,cabH,6);ctx.stroke();
  // Bumper
  ctx.fillStyle='#c0c0c0';ctx.fillRect(cabX-3,ty-8,5,8);ctx.strokeStyle='#1a1a1a';ctx.lineWidth=1;ctx.strokeRect(cabX-3,ty-8,5,8);
  // Window
  ctx.fillStyle='rgba(135,206,235,.65)';
  rr(ctx,cabX+5,ty-cabH+5,16,15,3);ctx.fill();
  ctx.strokeStyle='#1a1a1a';ctx.lineWidth=1.5;rr(ctx,cabX+5,ty-cabH+5,16,15,3);ctx.stroke();
  // Window reflection
  ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(cabX+8,ty-cabH+7);ctx.lineTo(cabX+12,ty-cabH+7);ctx.stroke();
  // Headlights
  ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.arc(cabX+1,ty-14,3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ef4444';ctx.beginPath();ctx.arc(cabX+cabW-1,ty-14,2.5,0,Math.PI*2);ctx.fill();
  // Exhaust pipe
  ctx.fillStyle='#666';ctx.fillRect(cabX+cabW-6,ty-cabH-10,5,12);
  ctx.strokeStyle='#1a1a1a';ctx.lineWidth=1;ctx.strokeRect(cabX+cabW-6,ty-cabH-10,5,12);
  truck.exhaustX=cabX+cabW-4;truck.exhaustY=ty-cabH-10;
  // Headlights at night
  if(score>=20){ctx.fillStyle='rgba(251,191,36,.15)';ctx.beginPath();ctx.moveTo(cabX-3,ty-16);ctx.lineTo(cabX-40,ty+5);ctx.lineTo(cabX-3,ty-4);ctx.fill();}
  // ── Wheels ──
  var wPositions=[cabX+12,cabX+cabW-8,tlx+16,tlx+tw-16];
  wPositions.forEach(function(wx){
    // Tire
    ctx.fillStyle='#1a1a1a';ctx.beginPath();ctx.arc(wx,ty+2,wheelR,0,Math.PI*2);ctx.fill();
    // Rim
    ctx.fillStyle='#444';ctx.beginPath();ctx.arc(wx,ty+2,wheelR-3,0,Math.PI*2);ctx.fill();
    // Hub
    ctx.fillStyle='#666';ctx.beginPath();ctx.arc(wx,ty+2,2,0,Math.PI*2);ctx.fill();
    // BD border
    ctx.strokeStyle='#1a1a1a';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(wx,ty+2,wheelR,0,Math.PI*2);ctx.stroke();
  });
  // Fenders
  ctx.fillStyle=truck.cabColor;
  ctx.beginPath();ctx.arc(cabX+12,ty-1,wheelR+3,Math.PI,0);ctx.fill();
  ctx.beginPath();ctx.arc(cabX+cabW-8,ty-1,wheelR+3,Math.PI,0);ctx.fill();
}

function drawContainer(x,y,w,h,col,shadow){
  var r=4;
  if(shadow){ctx.fillStyle='rgba(0,0,0,.2)';rr(ctx,x+3,y+3,w,h,r);ctx.fill();}
  var g=ctx.createLinearGradient(x,y,x,y+h);
  g.addColorStop(0,col.hi);g.addColorStop(.15,col.base);g.addColorStop(1,col.dark);
  ctx.fillStyle=g;rr(ctx,x,y,w,h,r);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.1)';ctx.lineWidth=1;
  var gap=Math.max(8,w/10);for(var sx=x+gap;sx<x+w-2;sx+=gap){ctx.beginPath();ctx.moveTo(sx,y+3);ctx.lineTo(sx,y+h-3);ctx.stroke();}
  ctx.fillStyle='rgba(255,255,255,.08)';rr(ctx,x+2,y+1,w-4,h*.35,r);ctx.fill();
  ctx.strokeStyle='#1a1a1a';ctx.lineWidth=BORDER;rr(ctx,x,y,w,h,r);ctx.stroke();
  var bk=5;ctx.strokeStyle='rgba(255,255,255,.15)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(x+bk,y+2);ctx.lineTo(x+2,y+2);ctx.lineTo(x+2,y+bk);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x+w-bk,y+2);ctx.lineTo(x+w-2,y+2);ctx.lineTo(x+w-2,y+bk);ctx.stroke();
}

function drawCraneStructure(){
  var mx=crane.x+crane.w/2,hookY=H*.18;
  ctx.strokeStyle='#555';ctx.lineWidth=2;ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.moveTo(mx,0);ctx.lineTo(mx,hookY);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='#d4af37';ctx.beginPath();ctx.arc(mx,hookY-2,4,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#1a1a1a';ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle='#d97706';ctx.fillRect(0,6,W,4);
  ctx.strokeStyle='#1a1a1a';ctx.lineWidth=2;ctx.strokeRect(0,6,W,4);
  ctx.fillStyle='#fbbf24';ctx.fillRect(6,0,7,14);ctx.fillRect(W-13,0,7,14);
  ctx.strokeStyle='#1a1a1a';ctx.lineWidth=2;ctx.strokeRect(6,0,7,14);ctx.strokeRect(W-13,0,7,14);
}

function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}

function drawParticles(){particles.forEach(function(p){ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot||0);ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);ctx.restore();});ctx.globalAlpha=1;}
function spawnDust(x,y){
  for(var i=0;i<8;i++){
    particles.push({x:x+(Math.random()-.5)*30,y:y+5,vx:(Math.random()-.5)*3,vy:-Math.random()*1.5-.5,size:4+Math.random()*5,color:'rgba(139,115,85,.5)',life:.8,decay:.025+Math.random()*.015,rot:0});
  }
}
function spawnP(x,y,color,n){var c=typeof color==='object'?color.base:color;for(var i=0;i<n;i++)particles.push({x:x+(Math.random()-.5)*20,y:y,vx:(Math.random()-.5)*6,vy:-Math.random()*4-2,size:2+Math.random()*4,color:c,life:1,decay:.015+Math.random()*.02,rot:Math.random()*6});}

// ══ GAME ══
var wind=0;

function newRound(){
  if(goldenActive){crane.color=GOLDEN;goldenActive=false;}
  else{crane.color=COLORS[score%COLORS.length];}
  crane.x=W/2-crane.w/2;crane.dir=1;
  crane.w=Math.max(45,truck.trailerW-10-Math.min(score*2.5,45));
  crane.h=36;
  falling=null;
  loaded=null;truckLeaving=false;
  var windStr=Math.min(score*.08,2.5);
  wind=(Math.random()-.5)*2*windStr;
  // Truck always from right, never stops
  truck.dir=-1;truck.x=W+30;
  truck.cabColor=CAB_COLORS[Math.floor(Math.random()*CAB_COLORS.length)];
  // Slow at start, ramps up
  truck.speed=1.0+Math.min(score*.12,3);
}

function dropContainer(){
  if(!crane.color||falling||truckLeaving||state!=='playing')return;
  if(navigator.vibrate)navigator.vibrate(10);
  falling={x:crane.x,y:H*.18,w:crane.w,h:crane.h,color:crane.color,vy:0,vx:0};
}

function checkLanding(){
  if(!falling)return;
  var landY=truck.wheelY-14-falling.h;
  var cx=falling.x+falling.w/2;
  var tx=truck.trailerX+truck.trailerW/2;
  var diff=Math.abs(cx-tx);
  var halfT=truck.trailerW/2;

  // If container missed the truck entirely, let it fall off screen
  if(falling.y>H+50){
    lives--;updateLives();
    showFB('RATÉ !','#ef4444',0);
    shakeX=5;shakeY=3;
    if(navigator.vibrate)navigator.vibrate([30,30,60]);
    if(lives<=0){falling=null;setTimeout(gameOver,500);return;}
    falling=null;truckLeaving=true;truck.speed=3.5;
    setTimeout(newRound,300);return;
  }

  if(falling.y<landY)return; // still falling

  // Check if on the trailer or not
  falling.y=landY;
  // Check if container is on cab (not trailer) 
  var contLeft=falling.x;
  var contRight=falling.x+falling.w;
  var onCab=contLeft<truck.trailerX-5;
  if(diff>halfT+10||onCab){
    // Missed the trailer - container hits the ground
    totalMisses++;lives--;
    updateLives();
    showFB('RATÉ !','#ef4444',0);
    spawnP(falling.x+falling.w/2,falling.y,'#ef4444',15);spawnDust(falling.x+falling.w/2,falling.y+falling.h);
    shakeX=6;shakeY=4;
    if(navigator.vibrate)navigator.vibrate([30,30,60]);
    if(lives<=0){falling=null;setTimeout(gameOver,500);return;}
    falling=null;truckLeaving=true;truck.speed=3.5;
    setTimeout(newRound,300);return;
  }else if(diff<5){
    combo++;score++;
    var isGold=crane.color===GOLDEN;
    var earn=(isGold?400:180)*Math.min(combo,5);
    perfectStreak++;totalPerfects++;
    if(perfectStreak>=3&&!goldenActive){goldenActive=true;perfectStreak=0;showFB('CONTAINER DORÉ !','#d4af37',earn);}
    else{showFB('PARFAIT !','#fbbf24',earn);}
    flashAlpha=.4;
    if(totalPerfects>0&&totalPerfects%10===0&&lives<5){lives++;updateLives();showFB('+1 VIE !','#ef4444',0);}
    spawnP(cx,falling.y,'#fbbf24',25);spawnDust(cx,falling.y+falling.h);
    shakeX=3;shakeY=2;
    if(navigator.vibrate)navigator.vibrate([8,20,8]);
    totalEarned+=earn;
    totalXP+=(isGold?90:45)*Math.min(combo,5);
  }else if(diff<18){
    combo++;score++;
    var earn=60*Math.min(combo,5);
    perfectStreak=0;showFB('SUPER !','#4ade80',earn);
    spawnP(cx,falling.y,'#4ade80',15);spawnDust(cx,falling.y+falling.h);
    shakeY=1;
    totalEarned+=earn;
    totalXP+=18*Math.min(combo,5);
  }else{
    combo=0;score++;
    perfectStreak=0;var earn=25;
    showFB('CHARGÉ','rgba(255,255,255,.6)',earn);
    spawnP(cx,falling.y,'#fff',6);spawnDust(cx,falling.y+falling.h);
    totalEarned+=earn;
    totalXP+=10;
  }

  if(combo>maxCombo)maxCombo=combo;
  document.getElementById('hudScore').textContent=score;
  document.getElementById('hudMoney').textContent='+'+totalEarned.toLocaleString('fr-FR')+'€';
  document.getElementById('hudXP').textContent='+'+totalXP+' XP';
  document.getElementById('hudCombo').textContent=combo>1?'COMBO ×'+combo:'';
  // Milestones
  if(score===5)setTimeout(function(){showFB('ÉCHAUFFÉ !','#fbbf24',0);},300);
  if(score===10)setTimeout(function(){showFB('EN FEU 🔥','#f97316',0);},300);
  if(score===15)setTimeout(function(){showFB('INARRÊTABLE !','#ef4444',0);},300);
  if(score===20)setTimeout(function(){showFB('LÉGENDE DU PORT 👑','#d4af37',0);flashAlpha=.5;},300);

  // Container stays on truck, truck drives away
  loaded={x:truck.trailerX+5,y:falling.y,w:falling.w,h:falling.h,color:falling.color};
  falling=null;
  truckLeaving=true;
  truck.speed=2.5+Math.min(score*.12,3);
}

function updateLives(){
  document.getElementById('hudLives').textContent='×'+lives;
}

function showFB(text,color,money){
  var a=document.getElementById('fbText'),b=document.getElementById('fbMoney');
  a.textContent=text;a.style.color=color;b.textContent=money>0?'+'+money.toLocaleString('fr-FR')+'€':'';
  a.className='fb-text show';b.className='fb-money show';
  clearTimeout(a._t);a._t=setTimeout(function(){a.className='fb-text hide';b.className='fb-money hide';},500);
}

// ══ LOOP ══
function update(){
  t++;
  // Crane is finger-controlled — no auto-swing
  // Clamp crane to screen bounds
  if(crane.x<10)crane.x=10;
  if(crane.x+crane.w>W-10)crane.x=W-10-crane.w;
  // Truck movement: always moving, slows in center but never stops
  if(truckLeaving){
    truck.x+=truck.speed*truck.dir;
    if(loaded){loaded.x+=truck.speed*truck.dir;}
    if(truck.x<-250){newRound();}
  }else if(!falling&&state==='playing'){
    truck.x+=truck.speed*truck.dir;
    // Slight slowdown in center zone but never stops
    var truckCenter=truck.x+22+truck.trailerW/2;
    var target=W*.5;
    var dist=Math.abs(truckCenter-target);
    if(dist<W*.15){
      truck.speed=Math.max(0.6+Math.min(score*.05,1.5),truck.speed*.997);
    }
    // Truck off screen → lose a life
    if(truck.x<-truck.w-60){
      if(state==='playing'){lives--;updateLives();showFB('TROP LENT !','#f97316',0);if(lives<=0){setTimeout(gameOver,300);return;}newRound();}
    }
  }
  // Falling container — wind pushes sideways
  if(falling){
    falling.vy+=0.85;
    falling.y+=falling.vy;
    falling.vx+=wind*.015;
    falling.x+=falling.vx;
    falling.vx*=.98;
    // Truck keeps moving during fall
    if(!truckLeaving){truck.x+=truck.speed*truck.dir;}
    checkLanding();
  }
  // Exhaust smoke
  if(truck.exhaustX&&state==='playing'&&t%6===0){
    smokeParticles.push({x:truck.exhaustX,y:truck.exhaustY,vx:.2+Math.random()*.3,vy:-.5-Math.random()*.5,size:3+Math.random()*3,life:1,decay:.02+Math.random()*.01});
  }
  smokeParticles.forEach(function(s){s.x+=s.vx;s.y+=s.vy;s.size+=.08;s.life-=s.decay;});
  smokeParticles=smokeParticles.filter(function(s){return s.life>0;});
  // Shake decay
  shakeX*=.85;shakeY*=.85;
  if(flashAlpha>0)flashAlpha-=.08;
  // Particles
  particles.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.2;p.life-=p.decay;p.rot+=(p.vx*.08);});
  particles=particles.filter(function(p){return p.life>0;});
}

function draw(){
  ctx.save();ctx.translate(shakeX*(Math.random()-.5)*2,shakeY*(Math.random()-.5)*2);
  ctx.clearRect(-10,-10,W+20,H+20);
  drawSky();drawClouds();drawGulls();drawPort();drawBoats();drawSea();drawRoad();
  // Wind indicator
  if(Math.abs(wind)>0.05&&!falling&&crane.color){
    var wx=W/2,wy=H*.14;
    var arrLen=Math.min(Math.abs(wind)*12,30);
    var arrDir=wind>0?1:-1;
    ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(wx-arrLen*arrDir,wy);ctx.lineTo(wx+arrLen*arrDir,wy);ctx.stroke();
    ctx.beginPath();ctx.moveTo(wx+arrLen*arrDir,wy);ctx.lineTo(wx+(arrLen-6)*arrDir,wy-4);ctx.moveTo(wx+arrLen*arrDir,wy);ctx.lineTo(wx+(arrLen-6)*arrDir,wy+4);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.2)';ctx.font='7px Inter';ctx.textAlign='center';
    ctx.fillText('VENT',wx,wy-8);
  }
  // Truck
  drawTruck(truck.x,ROAD_Y+(H-ROAD_Y)*.45);
  // Loaded container on truck
  if(loaded)drawContainer(loaded.x,loaded.y,loaded.w,loaded.h,loaded.color,false);

  // Falling container
  if(falling){
    // Motion trail
    ctx.globalAlpha=.08;drawContainer(falling.x-falling.vx*2,falling.y-falling.vy*2,falling.w,falling.h,falling.color,false);
    ctx.globalAlpha=.15;drawContainer(falling.x-falling.vx,falling.y-falling.vy,falling.w,falling.h,falling.color,false);
    ctx.globalAlpha=1;drawContainer(falling.x,falling.y,falling.w,falling.h,falling.color,true);
  }
  // Crane container
  if(!falling&&!truckLeaving&&crane.color){
    var swingAngle=_dragging?0:Math.sin(t*.04)*0.03;
    ctx.save();ctx.translate(crane.x+crane.w/2,H*.18+crane.h/2);ctx.rotate(swingAngle);
    drawContainer(-crane.w/2,-crane.h/2,crane.w,crane.h,crane.color,true);
    ctx.restore();
  }
  drawCraneStructure();
  // Smoke
  smokeParticles.forEach(function(s){ctx.globalAlpha=s.life*.3;ctx.fillStyle='#999';ctx.beginPath();ctx.arc(s.x,s.y,s.size,0,Math.PI*2);ctx.fill();});ctx.globalAlpha=1;
  drawParticles();
  // White flash
  if(flashAlpha>0){ctx.fillStyle='rgba(255,255,255,'+flashAlpha+')';ctx.fillRect(0,0,W,H);}
  ctx.restore();
}

function loop(){if(state==='playing')update();if(state!=='paused')draw();requestAnimationFrame(loop);}

function startGame(){
  score=0;combo=0;maxCombo=0;totalEarned=0;totalXP=0;lives=3;perfectStreak=0;goldenActive=false;totalPerfects=0;totalMisses=0;
  particles=[];shakeX=0;shakeY=0;falling=null;
  ROAD_Y=H*.82;
  truck.wheelY=ROAD_Y+(H-ROAD_Y)*.45;
  state='playing';
  document.getElementById('startScreen').classList.add('hide');
  document.getElementById('gameoverScreen').classList.remove('show');
  document.getElementById('hudScore').textContent='0';
  document.getElementById('hudMoney').textContent='+0€';
  document.getElementById('hudXP').textContent='+0 XP';
  document.getElementById('hudCombo').textContent='';
  document.getElementById('goTitle').textContent='FIN DE SERVICE';
  updateLives();initAmbient();smokeParticles=[];
  
  truck.x=W+30;truck.dir=-1;truck.speed=2.0;
  newRound();
}

async function gameOver(){
  state='gameover';falling=null;crane.color=null;
  
  if(navigator.vibrate)navigator.vibrate([40,40,80]);
  if(_me){
    try{
      var gs=await sb.from('game_stats').select('money,xp,records').eq('user_id',_me.id).maybeSingle();
      if(gs.data){var rec=gs.data.records||{};if(!rec.grue_best||score>rec.grue_best)rec.grue_best=score;
      await sb.from('game_stats').update({money:(gs.data.money||0)+totalEarned,xp:(gs.data.xp||0)+totalXP,records:rec}).eq('user_id',_me.id);_bestScore=rec.grue_best;}
    }catch(e){}
  }
  document.getElementById('goScore').textContent=score;
  document.getElementById('goCombo').textContent=maxCombo;
  document.getElementById('goXP').textContent='+'+totalXP+' XP';
  document.getElementById('goPerfect').textContent=score>0?Math.round(totalPerfects/score*100)+'%':'0%';
  document.getElementById('goEarned').textContent='+'+totalEarned.toLocaleString('fr-FR')+'€';
  document.getElementById('goEmoji').textContent=score>=20?'🏆':score>=10?'⭐':score>=5?'🚛':'💀';
  document.getElementById('gameoverScreen').classList.add('show');
  var isNew=score>_bestScore&&score>0;
  if(isNew){totalEarned+=1000;totalXP+=150;}
  document.getElementById('hudBest').textContent='RECORD : '+Math.max(_bestScore,score);
  if(isNew){document.getElementById('goEmoji').textContent='🎉';document.getElementById('goTitle').textContent='NOUVEAU RECORD !';}
}

// ══ TOUCH/MOUSE: drag to move crane, release to drop ══
canvas.addEventListener('touchstart',function(e){
  e.preventDefault();
  if(state!=='playing'||falling||truckLeaving||!crane.color)return;
  _dragging=true;
  var tx=e.touches[0].clientX;
  _dragStartX=tx;_craneStartX=crane.x;
},{passive:false});
canvas.addEventListener('touchmove',function(e){
  e.preventDefault();
  if(!_dragging)return;
  var tx=e.touches[0].clientX;
  crane.x=_craneStartX+(tx-_dragStartX);
  if(crane.x<10)crane.x=10;
  if(crane.x+crane.w>W-10)crane.x=W-10-crane.w;
},{passive:false});
canvas.addEventListener('touchend',function(e){
  e.preventDefault();
  if(!_dragging)return;
  _dragging=false;
  if(state==='playing'&&!falling&&!truckLeaving&&crane.color)dropContainer();
},{passive:false});
// Mouse fallback
var _mouseDown=false;
canvas.addEventListener('mousedown',function(e){
  if(state!=='playing'||falling||truckLeaving||!crane.color)return;
  _mouseDown=true;_dragStartX=e.clientX;_craneStartX=crane.x;
});
canvas.addEventListener('mousemove',function(e){
  if(!_mouseDown)return;
  crane.x=_craneStartX+(e.clientX-_dragStartX);
  if(crane.x<10)crane.x=10;
  if(crane.x+crane.w>W-10)crane.x=W-10-crane.w;
});
canvas.addEventListener('mouseup',function(){
  if(!_mouseDown)return;
  _mouseDown=false;
  if(state==='playing'&&!falling&&!truckLeaving&&crane.color)dropContainer();
});

async function init(){
  ROAD_Y=H*.82;
  try{var s=await sb.auth.getSession();if(s.data&&s.data.session){_me=s.data.session.user;var gs=await sb.from('game_stats').select('records').eq('user_id',_me.id).maybeSingle();if(gs.data)_bestScore=(gs.data.records&&gs.data.records.grue_best)||0;document.getElementById('hudBest').textContent='RECORD : '+_bestScore;}}catch(e){}
  initAmbient();loop();
}
init();
</script>
