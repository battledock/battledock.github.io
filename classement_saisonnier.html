<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Classement Saisonnier - Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&family=Caveat:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  body { font-family:'Inter',sans-serif; background:#05110c; color:#e9fff3; min-height:100dvh; padding:0 14px 30px; }
  .bg { position:fixed; inset:0; z-index:0; pointer-events:none; background:radial-gradient(120% 60% at 50% -5%, rgba(16,185,129,0.22), transparent 60%), linear-gradient(180deg,#08241a,#06180f 55%,#05110c); }
  .wrap { position:relative; z-index:1; max-width:540px; margin:0 auto; }
  .hdr { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px; padding:14px 4px; background:linear-gradient(180deg,#06180f,rgba(6,24,15,0.85)); backdrop-filter:blur(8px); }
  .hdr-back { background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.14); color:#fff; width:38px; height:38px; border-radius:11px; font-size:18px; cursor:pointer; flex-shrink:0; }
  .hdr-title { flex:1; font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:2px; background:linear-gradient(135deg,#34d399,#a3e635); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .card { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.09); border-radius:16px; padding:16px; margin-bottom:12px; }
  .sect-lbl { font-size:11px; letter-spacing:1px; text-transform:uppercase; color:rgba(255,255,255,0.45); margin:18px 4px 10px; }
  .info { font-size:12.5px; color:rgba(255,255,255,0.5); line-height:1.6; }
  .hero { text-align:center; padding:20px 16px; border-radius:18px; margin-bottom:12px; background:linear-gradient(160deg,rgba(16,185,129,0.2),rgba(163,230,53,0.06)); border:1px solid rgba(52,211,153,0.4); }
  .season { font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:1px; color:#fff; }
  .ends { font-size:11px; color:rgba(255,255,255,0.55); margin-bottom:8px; }
  .pts { font-family:'Bebas Neue',sans-serif; font-size:48px; color:#a3e635; line-height:1; }
  .pts-lbl { font-size:12px; color:rgba(255,255,255,0.55); margin-bottom:12px; }
  .btn { width:100%; border:none; border-radius:14px; padding:15px; font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:1px; cursor:pointer; background:linear-gradient(135deg,#059669,#34d399); color:#04231a; margin-top:6px; }
  .btn:active{ transform:scale(0.98); } .btn:disabled{ opacity:0.5; }
  .row { display:flex; align-items:center; gap:11px; padding:11px 12px; border-radius:12px; margin-bottom:7px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); }
  .row.me { background:rgba(16,185,129,0.16); border-color:rgba(52,211,153,0.5); }
  .row-num { width:30px; text-align:center; font-family:'Bebas Neue',sans-serif; font-size:18px; color:#a3e635; flex-shrink:0; }
  .row-av { width:36px; height:36px; border-radius:50%; flex-shrink:0; overflow:hidden; background:#14342a; }
  .row-av img { width:100%; height:100%; object-fit:cover; }
  .row-name { flex:1; min-width:0; font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row-sc { font-family:'Bebas Neue',sans-serif; font-size:18px; color:#6ee7b7; flex-shrink:0; }
  .loader { text-align:center; padding:40px; color:rgba(255,255,255,0.3); font-family:'Bebas Neue',sans-serif; letter-spacing:2px; }
  .back-bottom { width:100%; margin-top:18px; padding:15px; border-radius:14px; cursor:pointer; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12); color:rgba(255,255,255,0.7); font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:2px; }
  .toast { position:fixed; top:18px; left:50%; transform:translateX(-50%) translateY(-20px); z-index:300; background:rgba(6,24,15,0.97); border:1px solid rgba(52,211,153,0.5); border-radius:12px; padding:11px 18px; font-size:13px; font-weight:700; opacity:0; transition:all .35s; max-width:92%; text-align:center; color:#6ee7b7; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
  <div class="hdr">
    <button class="hdr-back" onclick="window.location.href='game.html'">←</button>
    <div class="hdr-title">🏅 CLASSEMENT SAISONNIER</div>
  </div>
  <div id="content"><div class="loader">CHARGEMENT…</div></div>
  <button class="back-bottom" onclick="window.location.href='game.html'">← Retour au jeu</button>
</div>
<div class="toast" id="toast"></div>
<script>
  const SB_URL='https://drtsuhnbclhmgfjiykap.supabase.co';
  const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
  const sb=supabase.createClient(SB_URL,SB_KEY);
  const PLAY_SECONDS=8, PTS_PER_TAP=5;
  let currentUser=null, sdata={};
  const fmt=n=>Math.round(n).toLocaleString('fr-FR');
  const today=new Date().toISOString().slice(0,10);
  const NAMES={1:'Hiver',2:'Printemps',3:'Été',4:'Automne'};
  function quarter(d){ return Math.floor(d.getMonth()/3)+1; }
  function seasonKey(d){ return d.getFullYear()+'-T'+quarter(d); }
  function seasonName(d){ return NAMES[quarter(d)]+' '+d.getFullYear(); }
  const SK=seasonKey(new Date());
  function daysLeft(){ const n=new Date(); const q=quarter(n); const end=new Date(n.getFullYear(), q*3, 1); return Math.ceil((end-n)/86400000); }

  async function init(){
    const { data:{ session } }=await sb.auth.getSession();
    if(!session){ window.location.href='index.html'; return; }
    currentUser=session.user;
    const { data:gs }=await sb.from('game_stats').select('saison').eq('user_id',currentUser.id).maybeSingle();
    sdata=(gs?.saison&&typeof gs.saison==='object')?gs.saison:{};
    if(sdata.season!==SK){ sdata.season=SK; sdata.points=0; sdata.lastDaily=null; } // nouvelle saison
    render();
  }

  function render(){
    const doneToday=(sdata.lastDaily===today);
    document.getElementById('content').innerHTML=`
      <div class="hero">
        <div class="season">${seasonName(new Date())}</div>
        <div class="ends">fin de saison dans ${daysLeft()} j</div>
        <div class="pts">${fmt(sdata.points||0)}</div>
        <div class="pts-lbl">tes points de saison</div>
        ${doneToday
          ? '<div class="info">✓ Défi de saison déjà relevé aujourd\'hui. Reviens demain !</div>'
          : `<button class="btn" onclick="daily()">🏅 DÉFI DE SAISON (${PLAY_SECONDS}s)</button>`}
      </div>
      <div class="card info">Chaque jour, relève le <b>défi de saison</b> pour gagner des points. Le classement se remet à zéro à chaque nouvelle saison — à toi de finir en haut du tableau pour la gloire !</div>
      <div class="sect-lbl">Classement — ${seasonName(new Date())}</div>
      <div id="board"><div class="loader">…</div></div>`;
    loadBoard();
  }

  function daily(){
    const ov=document.createElement('div');
    ov.style.cssText='position:fixed;inset:0;z-index:300;background:linear-gradient(180deg,#08241a,#05110c);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;color:#fff';
    ov.innerHTML=`<div style="font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:1px;color:#34d399">🏅 DÉFI DE SAISON</div>
      <div id="sc" style="font-family:'Bebas Neue',sans-serif;font-size:50px;color:#a3e635;margin:8px 0">0</div>
      <div id="st" style="font-size:14px;color:rgba(255,255,255,0.6);margin-bottom:18px">${PLAY_SECONDS}.0 s</div>
      <button id="sb2" style="width:100%;max-width:420px;border:none;border-radius:18px;padding:46px 16px;font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:2px;background:linear-gradient(135deg,#059669,#34d399);color:#fff;cursor:pointer">APPUIE VITE !</button>`;
    document.body.appendChild(ov);
    const cEl=ov.querySelector('#sc'), tEl=ov.querySelector('#st'), b=ov.querySelector('#sb2');
    let taps=0, started=false, endT=0;
    function tick(){ const left=Math.max(0,endT-performance.now()); tEl.textContent=(left/1000).toFixed(1)+' s'; if(left<=0){ b.disabled=true; if(ov.parentNode) document.body.removeChild(ov); finishDaily(taps); return; } requestAnimationFrame(tick); }
    b.onpointerdown=(e)=>{ e.preventDefault(); if(!started){ started=true; endT=performance.now()+PLAY_SECONDS*1000; tick(); } taps++; cEl.textContent=taps; b.style.transform='scale(0.97)'; setTimeout(()=>b.style.transform='',40); };
  }

  async function finishDaily(taps){
    const gain=taps*PTS_PER_TAP;
    try {
      const { data:fresh }=await sb.from('game_stats').select('saison').eq('user_id',currentUser.id).maybeSingle();
      let s=(fresh?.saison&&typeof fresh.saison==='object')?fresh.saison:{};
      if(s.season!==SK){ s.season=SK; s.points=0; s.lastDaily=null; }
      if(s.lastDaily===today){ sdata=s; render(); showToast('Déjà fait aujourd\'hui.'); return; }
      s.points=(s.points||0)+gain; s.lastDaily=today;
      await sb.from('game_stats').update({ saison:s }).eq('user_id',currentUser.id);
      sdata=s;
      showToast(`+${fmt(gain)} points de saison !`);
      render();
    } catch(e){ console.log(e); showToast('Erreur, réessaie.'); }
  }

  async function loadBoard(){
    try {
      const { data:rows }=await sb.from('game_stats').select('user_id,saison');
      const players=(rows||[]).filter(r=>r.saison&&r.saison.season===SK&&(r.saison.points||0)>0)
        .map(r=>({ uid:r.user_id, pts:r.saison.points||0 })).sort((a,b)=>b.pts-a.pts);
      const board=document.getElementById('board'); if(!board) return;
      if(!players.length){ board.innerHTML='<div class="card info">La saison vient de commencer. Relève le défi pour ouvrir le classement !</div>'; return; }
      const { data:profs }=await sb.from('profiles').select('user_id,username,avatar_url').in('user_id',players.map(p=>p.uid));
      const medals={0:'🥇',1:'🥈',2:'🥉'};
      board.innerHTML=players.slice(0,30).map((p,i)=>{
        const pr=profs?.find(x=>x.user_id===p.uid)||{username:'Docker',avatar_url:'avatar-default.png'};
        const me=p.uid===currentUser.id;
        return `<div class="row ${me?'me':''}"><div class="row-num">${medals[i]||(i+1)}</div><div class="row-av"><img src="${pr.avatar_url||'avatar-default.png'}"></div><div class="row-name">${(pr.username||'Docker')}${me?' 👈':''}</div><div class="row-sc">${fmt(p.pts)} pts</div></div>`;
      }).join('');
    } catch(e){ console.log(e); }
  }

  let toastT; function showToast(m){ const t=document.getElementById('toast'); t.textContent=m; t.className='toast show'; clearTimeout(toastT); toastT=setTimeout(()=>t.className='toast',2800); }
  init();
</script>
</body>
</html>
