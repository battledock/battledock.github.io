<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Progression - Battle Dock</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }

    body {
      font-family:'Inter',sans-serif;
      background:#07071a;
      min-height:100vh;
      padding-bottom:60px;
      overflow-x:hidden;
    }

    /* ÉTOILES FIXES */
    .stars-bg { position:fixed; inset:0; z-index:0; pointer-events:none; }
    .star { position:absolute; border-radius:50%; background:white; animation:twinkle ease-in-out infinite; }
    @keyframes twinkle { 0%,100%{opacity:0.8;transform:scale(1)} 50%{opacity:0.1;transform:scale(0.3)} }

    /* NÉBULEUSES */
    .neb { position:fixed; border-radius:50%; filter:blur(100px); pointer-events:none; z-index:0; animation:nebDrift ease-in-out infinite; }
    .neb1 { width:500px;height:500px;background:radial-gradient(ellipse,rgba(99,102,241,0.18),transparent 70%);top:-150px;left:-150px;animation-duration:25s; }
    .neb2 { width:400px;height:400px;background:radial-gradient(ellipse,rgba(139,92,246,0.12),transparent 70%);bottom:-100px;right:-100px;animation-duration:30s;animation-direction:reverse; }
    .neb3 { width:300px;height:300px;background:radial-gradient(ellipse,rgba(67,56,202,0.1),transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);animation-duration:20s; }
    @keyframes nebDrift { 0%,100%{transform:translate(0,0)} 50%{transform:translate(40px,30px)} }

    /* HEADER */
    .header {
      position:sticky; top:0; z-index:100;
      background:rgba(7,7,26,0.85);
      backdrop-filter:blur(20px);
      border-bottom:1px solid rgba(99,102,241,0.15);
      padding:14px 16px;
      display:flex; align-items:center; gap:12px;
    }
    .back-btn {
      background:rgba(99,102,241,0.12); border:1px solid rgba(99,102,241,0.25);
      border-radius:8px; padding:8px 12px;
      font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:1px;
      color:rgba(165,180,252,0.8); cursor:pointer;
    }
    .header-title { font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:2px; color:white; flex:1; }

    /* HERO CARD */
    .hero {
      position:relative; z-index:1;
      margin:16px;
      background:linear-gradient(135deg,#0f0f2e 0%,#12122a 50%,#0a0a1a 100%);
      border:1px solid rgba(99,102,241,0.25);
      border-radius:20px; overflow:hidden;
      box-shadow:0 8px 40px rgba(99,102,241,0.2);
    }

    /* SVG HERO */
    .hero-svg { width:100%; height:120px; display:block; }

    /* Overlay infos sur le SVG */
    .hero-info {
      position:absolute; bottom:0; left:0; right:0;
      padding:14px 16px;
      background:linear-gradient(0deg,rgba(7,7,26,0.95) 0%,transparent 100%);
      display:flex; align-items:flex-end; justify-content:space-between;
    }
    .hero-left {}
    .hero-name  { font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:2px; color:white; line-height:1; }
    .hero-grade { font-size:11px; color:#a5b4fc; font-weight:700; margin-top:3px; }
    .hero-right { text-align:right; }
    .hero-lvl   { font-family:'Bebas Neue',sans-serif; font-size:42px; color:#a5b4fc; line-height:1; text-shadow:0 0 20px rgba(165,180,252,0.5); }
    .hero-lvl-lbl { font-size:9px; color:rgba(255,255,255,0.35); text-transform:uppercase; letter-spacing:1.5px; font-weight:700; }

    /* XP BAR */
    .xp-wrap { padding:12px 16px 16px; }
    .xp-labels { display:flex; justify-content:space-between; font-size:10px; color:rgba(255,255,255,0.35); font-weight:700; margin-bottom:6px; }
    .xp-track { height:4px; background:rgba(255,255,255,0.08); border-radius:2px; overflow:hidden; }
    .xp-fill  { height:100%; background:linear-gradient(90deg,#6366f1,#a5b4fc,#818cf8); border-radius:2px; transition:width 0.8s cubic-bezier(0.34,1.56,0.64,1); box-shadow:0 0 8px rgba(99,102,241,0.6); }

    /* QUICK STATS */
    .qs-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:0 16px 16px; position:relative; z-index:1; }
    .qs {
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(99,102,241,0.15);
      border-radius:12px; padding:10px 8px; text-align:center;
      backdrop-filter:blur(10px);
    }
    .qs-val { font-family:'Bebas Neue',sans-serif; font-size:17px; color:white; letter-spacing:0.5px; }
    .qs-lbl { font-size:9px; color:rgba(255,255,255,0.35); text-transform:uppercase; letter-spacing:0.5px; font-weight:700; margin-top:2px; }

    /* CONTAINER */
    .container { padding:0 16px; position:relative; z-index:1; }

    /* SECTION HEADER */
    .section-header {
      display:flex; align-items:center; gap:12px;
      margin:20px 0 12px;
    }
    .section-icon-wrap {
      width:36px; height:36px; border-radius:10px;
      background:rgba(99,102,241,0.15);
      border:1px solid rgba(99,102,241,0.25);
      display:flex; align-items:center; justify-content:center;
      font-size:18px; flex-shrink:0;
    }
    .section-title { font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:1.5px; color:white; flex:1; }
    .section-title::after { display:none; }
    .section-line { flex:1; height:1px; background:linear-gradient(90deg,rgba(99,102,241,0.3),transparent); }

    /* SVG BRANCHE */
    .branch-svg-wrap {
      background:rgba(255,255,255,0.03);
      border:1px solid rgba(99,102,241,0.12);
      border-radius:14px; overflow:hidden;
      margin-bottom:12px;
    }
    .branch-svg { width:100%; display:block; }

    /* NOEUDS LISTE */
    .nodes { display:flex; flex-direction:column; gap:6px; margin-bottom:4px; }

    .node {
      display:flex; align-items:center; gap:12px;
      padding:11px 14px;
      background:rgba(255,255,255,0.03);
      border:1px solid rgba(255,255,255,0.07);
      border-radius:12px; position:relative; overflow:hidden;
      transition:all 0.2s;
    }
    .node::before {
      content:''; position:absolute; left:0; top:0; bottom:0;
      width:3px; background:rgba(255,255,255,0.08); border-radius:2px 0 0 2px;
    }
    .node.unlocked { border-color:rgba(99,102,241,0.3); background:rgba(99,102,241,0.07); }
    .node.unlocked::before { background:linear-gradient(180deg,#6366f1,#a5b4fc); box-shadow:0 0 8px rgba(99,102,241,0.5); }
    .node.locked { opacity:0.4; }
    .node.current { border-color:rgba(165,180,252,0.3); background:rgba(99,102,241,0.05); }
    .node.current::before { background:rgba(165,180,252,0.4); }

    .node-av { width:38px; height:38px; border-radius:50%; overflow:hidden; border:2px solid rgba(255,255,255,0.1); flex-shrink:0; }
    .node.unlocked .node-av { border-color:rgba(99,102,241,0.6); box-shadow:0 0 10px rgba(99,102,241,0.3); }
    .node-av img { width:100%; height:100%; object-fit:cover; }

    .node-ico { width:38px; height:38px; border-radius:10px; background:rgba(255,255,255,0.05); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
    .node.unlocked .node-ico { background:rgba(99,102,241,0.15); }

    .node-info { flex:1; min-width:0; }
    .node-title { font-weight:700; font-size:13px; color:white; }
    .node-desc  { font-size:11px; color:rgba(255,255,255,0.35); margin-top:2px; }

    .node-badge { font-size:10px; font-weight:700; padding:3px 8px; border-radius:20px; flex-shrink:0; }
    .node-badge.unlocked { background:rgba(99,102,241,0.2); color:#a5b4fc; }
    .node-badge.locked   { background:rgba(255,255,255,0.05); color:rgba(255,255,255,0.25); }
    .node-badge.current  { background:rgba(165,180,252,0.1); color:#c7d2fe; border:1px solid rgba(165,180,252,0.2); }

    .node-connector { width:2px; height:6px; margin:0 auto 0 24px; }
    .node-connector.done { background:linear-gradient(180deg,#6366f1,#818cf8); }
    .node-connector.todo { background:rgba(255,255,255,0.08); }

    /* SUCCÈS */
    .ach-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
    .ach {
      background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.07);
      border-radius:12px; padding:12px; text-align:center;
    }
    .ach.done { border-color:rgba(99,102,241,0.3); background:rgba(99,102,241,0.08); }
    .ach-ico  { font-size:26px; margin-bottom:6px; filter:grayscale(1) opacity(0.3); }
    .ach.done .ach-ico { filter:none; }
    .ach-title { font-weight:700; font-size:12px; color:white; margin-bottom:2px; }
    .ach-desc  { font-size:10px; color:rgba(255,255,255,0.35); line-height:1.3; }
    .ach-done  { font-size:9px; color:#a5b4fc; font-weight:700; margin-top:4px; }

    /* STREAK */
    .streak-card {
      background:rgba(255,255,255,0.04); border:1px solid rgba(99,102,241,0.2);
      border-radius:14px; padding:14px 16px;
      display:flex; align-items:center; gap:14px;
    }
    .streak-val { font-family:'Bebas Neue',sans-serif; font-size:32px; color:white; text-shadow:0 0 16px rgba(255,150,50,0.4); }
    .streak-lbl { font-size:11px; color:rgba(255,255,255,0.35); font-weight:700; text-transform:uppercase; letter-spacing:0.5px; margin-top:2px; }
    .streak-sub { font-size:11px; color:#a5b4fc; font-weight:600; margin-top:3px; }
  </style>
</head>
<body>

  <div class="stars-bg" id="starsBg"></div>
  <div class="neb neb1"></div>
  <div class="neb neb2"></div>
  <div class="neb neb3"></div>

  <div class="header">
    <button class="back-btn" onclick="window.location.href='game.html'">← Retour</button>
    <div class="header-title">✦ Progression</div>
  </div>

  <!-- HERO -->
  <div class="hero">
    <svg class="hero-svg" id="heroSvg" viewBox="0 0 400 120" preserveAspectRatio="xMidYMid meet">
      <!-- Lignes -->
      <line x1="50" y1="60" x2="120" y2="30" stroke="#6366f1" stroke-width="1.5" opacity="0.7"/>
      <line x1="50" y1="60" x2="120" y2="90" stroke="#6366f1" stroke-width="1.5" opacity="0.4"/>
      <line x1="120" y1="30" x2="200" y2="30" stroke="#6366f1" stroke-width="1.5" opacity="0.7"/>
      <line x1="120" y1="90" x2="200" y2="90" stroke="#6366f1" stroke-width="1.5" opacity="0.25"/>
      <line x1="200" y1="30" x2="280" y2="60" stroke="#6366f1" stroke-width="1.5" opacity="0.4"/>
      <line x1="200" y1="90" x2="280" y2="60" stroke="#6366f1" stroke-width="1.5" opacity="0.2"/>
      <line x1="280" y1="60" x2="360" y2="60" stroke="#6366f1" stroke-width="1.5" opacity="0.15"/>

      <!-- Glow actifs -->
      <circle cx="50"  cy="60" r="20" fill="rgba(99,102,241,0.15)" id="glow1"/>
      <circle cx="120" cy="30" r="16" fill="rgba(99,102,241,0.1)"  id="glow2"/>

      <!-- Nœuds inactifs -->
      <circle cx="200" cy="90" r="9"  fill="#12122a" stroke="#6366f1" stroke-width="1.5" opacity="0.3" id="n4"/>
      <circle cx="280" cy="60" r="10" fill="#12122a" stroke="#6366f1" stroke-width="1.5" opacity="0.25" id="n5"/>
      <circle cx="360" cy="60" r="8"  fill="#12122a" stroke="#6366f1" stroke-width="1.5" opacity="0.15" id="n6"/>

      <!-- Nœuds actifs -->
      <circle cx="50"  cy="60" r="14" fill="#4338ca" stroke="#a5b4fc" stroke-width="2" id="n1">
        <animate attributeName="r" values="13;15;13" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="120" cy="30" r="11" fill="#4338ca" stroke="#a5b4fc" stroke-width="2" id="n2"/>
      <circle cx="200" cy="30" r="10" fill="#312e81" stroke="#818cf8" stroke-width="1.5" opacity="0.8" id="n3"/>

      <!-- Icônes -->
      <text x="50"  y="64"  text-anchor="middle" font-size="10" fill="white">⚡</text>
      <text x="120" y="34"  text-anchor="middle" font-size="9"  fill="white">⭐</text>
      <text x="200" y="34"  text-anchor="middle" font-size="9"  fill="rgba(255,255,255,0.6)" id="ico3">🔒</text>
      <text x="200" y="94"  text-anchor="middle" font-size="8"  fill="rgba(255,255,255,0.25)">🔒</text>
      <text x="280" y="64"  text-anchor="middle" font-size="8"  fill="rgba(255,255,255,0.2)">🔒</text>
      <text x="360" y="64"  text-anchor="middle" font-size="8"  fill="rgba(255,255,255,0.1)">🔒</text>

      <!-- Mini étoiles déco -->
      <circle cx="320" cy="20" r="1.5" fill="white" opacity="0.6"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="350" cy="40" r="1"   fill="white" opacity="0.4"><animate attributeName="opacity" values="0.4;0.1;0.4" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="90"  cy="10" r="1"   fill="white" opacity="0.5"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="240" cy="15" r="1.5" fill="white" opacity="0.3"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="370" cy="90" r="1"   fill="white" opacity="0.4"><animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.5s" repeatCount="indefinite"/></circle>
    </svg>

    <div class="hero-info">
      <div class="hero-left">
        <div class="hero-name"  id="heroName">...</div>
        <div class="hero-grade" id="heroGrade">Docker Occasionnel</div>
      </div>
      <div class="hero-right">
        <div class="hero-lvl"     id="heroLvl">1</div>
        <div class="hero-lvl-lbl">Niveau</div>
      </div>
    </div>

    <div class="xp-wrap">
      <div class="xp-labels">
        <span id="xpCurrent">0 XP</span>
        <span id="xpNext">500 XP</span>
      </div>
      <div class="xp-track"><div class="xp-fill" id="xpFill" style="width:0%"></div></div>
    </div>
  </div>

  <!-- QUICK STATS -->
  <div class="qs-grid">
    <div class="qs"><div class="qs-val" id="qsMoney">0€</div><div class="qs-lbl">Argent</div></div>
    <div class="qs"><div class="qs-val" id="qsStreak">0🔥</div><div class="qs-lbl">Streak</div></div>
    <div class="qs"><div class="qs-val" id="qsWin">0€</div><div class="qs-lbl">Meilleur gain</div></div>
  </div>

  <div class="container">

    <!-- STREAK -->
    <div class="section-header">
      <div class="section-icon-wrap">🔥</div>
      <div class="section-title">Série de connexions</div>
      <div class="section-line"></div>
    </div>
    <div class="streak-card">
      <div style="font-size:36px">🔥</div>
      <div>
        <div class="streak-val" id="streakVal">0</div>
        <div class="streak-lbl">Jours consécutifs</div>
        <div class="streak-sub" id="streakSub"></div>
      </div>
    </div>

    <!-- APPARENCE -->
    <div class="section-header" style="margin-top:24px">
      <div class="section-icon-wrap">🎨</div>
      <div class="section-title">Apparence</div>
      <div class="section-line"></div>
    </div>

    <!-- Mini SVG apparence -->
    <div class="branch-svg-wrap">
      <svg class="branch-svg" viewBox="0 0 360 50" style="height:50px">
        <line x1="30" y1="25" x2="90"  y2="25" stroke="#6366f1" stroke-width="1.5" opacity="0.6" id="al1"/>
        <line x1="90" y1="25" x2="150" y2="25" stroke="#6366f1" stroke-width="1.5" opacity="0.5" id="al2"/>
        <line x1="150" y1="25" x2="210" y2="25" stroke="#6366f1" stroke-width="1.5" opacity="0.3" id="al3"/>

        <line x1="270" y1="25" x2="330" y2="25" stroke="#6366f1" stroke-width="1.5" opacity="0.1" id="al5"/>
        <circle cx="30"  cy="25" r="10" fill="#4338ca" stroke="#a5b4fc" stroke-width="2" id="an1"><animate attributeName="r" values="9;11;9" dur="2s" repeatCount="indefinite"/></circle>
        <circle cx="90"  cy="25" r="9"  fill="#12122a" stroke="#6366f1" stroke-width="1.5" opacity="0.8" id="an2"/>
        <circle cx="150" cy="25" r="8"  fill="#12122a" stroke="#6366f1" stroke-width="1.5" opacity="0.5" id="an3"/>
        <circle cx="210" cy="25" r="8"  fill="#12122a" stroke="#6366f1" stroke-width="1.5" opacity="0.35" id="an4"/>
        <circle cx="270" cy="25" r="7"  fill="#12122a" stroke="#6366f1" stroke-width="1.5" opacity="0.2" id="an5"/>
        <circle cx="330" cy="25" r="6"  fill="#12122a" stroke="#6366f1" stroke-width="1.5" opacity="0.15" id="an6"/>
        <text x="30"  y="29" text-anchor="middle" font-size="8" fill="white">✦</text>
        <text x="90"  y="29" text-anchor="middle" font-size="7" fill="rgba(255,255,255,0.5)" id="at2">🔒</text>
        <text x="150" y="29" text-anchor="middle" font-size="7" fill="rgba(255,255,255,0.35)" id="at3">🔒</text>
        <text x="210" y="29" text-anchor="middle" font-size="7" fill="rgba(255,255,255,0.25)" id="at4">🔒</text>
        <text x="270" y="29" text-anchor="middle" font-size="7" fill="rgba(255,255,255,0.15)" id="at5">🔒</text>
        <text x="330" y="29" text-anchor="middle" font-size="7" fill="rgba(255,255,255,0.1)" id="at6">🔒</text>

      </svg>
    </div>
    <div class="nodes" id="nodesApparence"></div>

    <!-- COULEURS -->
    <div class="section-header" style="margin-top:20px">
      <div class="section-icon-wrap">🌈</div>
      <div class="section-title">Couleurs de profil</div>
      <div class="section-line"></div>
    </div>
    <div class="branch-svg-wrap">

        <circle cx="190" cy="25" r="8"  fill="#12122a" stroke="#6366f1" stroke-width="1.5" opacity="0.35" id="cn3"/>

        <text x="30"  y="29" text-anchor="middle" font-size="9" fill="white">🔵</text>

        <text x="260" y="29" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.15)" id="ct4">🔒</text>
        <circle cx="30" cy="25" r="18" fill="rgba(99,102,241,0.12)"/>
      </svg>
    </div>
    <div class="nodes" id="nodesCouleurs"></div>

    <!-- PORT -->
    <div class="section-header" style="margin-top:20px">
      <div class="section-icon-wrap">⚓</div>
      <div class="section-title">Port Maritime</div>
      <div class="section-line"></div>
    </div>
    <div class="branch-svg-wrap">
      <svg class="branch-svg" viewBox="0 0 320 50" style="height:50px">
        <line x1="30" y1="25" x2="110" y2="25" stroke="#6366f1" stroke-width="1.5" opacity="0.6"/>
        <line x1="110" y1="25" x2="200" y2="25" stroke="#6366f1" stroke-width="1.5" opacity="0.3"/>
        <line x1="200" y1="25" x2="285" y2="25" stroke="#6366f1" stroke-width="1.5" opacity="0.15"/>
        <circle cx="30"  cy="25" r="11" fill="#4338ca" stroke="#a5b4fc" stroke-width="2"><animate attributeName="r" values="10;12;10" dur="3s" repeatCount="indefinite"/></circle>
        <circle cx="110" cy="25" r="9"  fill="#12122a" stroke="#6366f1" stroke-width="1.5" opacity="0.7" id="pn2"/>
        <circle cx="200" cy="25" r="8"  fill="#12122a" stroke="#6366f1" stroke-width="1.5" opacity="0.35" id="pn3"/>
        <circle cx="285" cy="25" r="7"  fill="#12122a" stroke="#6366f1" stroke-width="1.5" opacity="0.2" id="pn4"/>
        <text x="30"  y="29" text-anchor="middle" font-size="9" fill="white">⚡</text>
        <text x="110" y="29" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.5)" id="pt2">🔒</text>
        <text x="200" y="29" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.3)" id="pt3">🔒</text>
        <text x="285" y="29" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.15)" id="pt4">🔒</text>
        <circle cx="30" cy="25" r="18" fill="rgba(99,102,241,0.12)"/>
      </svg>
    </div>
    <div class="nodes" id="nodesPort"></div>

    <!-- SUCCÈS -->
    <div class="section-header" style="margin-top:20px">
      <div class="section-icon-wrap">🏆</div>
      <div class="section-title">Succès</div>
      <div class="section-line"></div>
    </div>
    <div class="ach-grid" id="achGrid"></div>

  </div>

  <script>
    const SB_URL = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const sb = createClient(SB_URL, SB_KEY);

    let level=1, money=0, xp=0, streak=0, bigWin=0;

    function getXpReq(l) {
      if(l<=10) return l*500; if(l<=25) return l*1000;
      if(l<=50) return l*2000; return l*4000;
    }
    function getGrade(l) {
      if(!l||l<=4) return 'Docker Occasionnel';
      if(l<=14) return 'Docker'; if(l<=29) return 'Docker Mensuel';
      if(l<=49) return 'Contre-Maître'; if(l<=79) return 'Chef de Quai';
      return 'Magnat du Port';
    }

    const APPARENCE = [
      { level:1,  av:'avatar-default.png',   title:'Avatar Matelot',     desc:'Avatar de départ' },
      { level:5,  av:'avatar-level-5.png',    title:'Avatar Docker',       desc:'Niveau 5 requis' },
      { level:10, av:'avatar-level-10.png',   title:'Avatar Capitaine',    desc:'Niveau 10 requis' },
      { level:15, av:'avatar-level-15.png',   title:'Avatar Amiral',       desc:'Niveau 15 requis' },
      { level:30, av:'avatar-level-30.png',   title:'Avatar Légende',      desc:'Niveau 30 requis' },
      { level:50, av:'avatar-level-50.png',   title:'Avatar Maître',       desc:'Niveau 50 requis' },
      { level:0,  av:'avatar-millionaire.png',title:'Avatar Millionnaire', desc:'1 000 000€ requis', special:'money', specialVal:1000000 },
    ];
    const COULEURS = [
      { level:1,  ico:'🔵', title:'Bleu',   desc:'Couleur de départ' },
      { level:5,  ico:'🟢', title:'Vert',   desc:'Niveau 5 requis' },
      { level:10, ico:'🟡', title:'Jaune',  desc:'Niveau 10 requis' },
      { level:30, ico:'🔴', title:'Rouge',  desc:'Niveau 30 requis' },
    ];
    const PORT = [
      { level:3,  ico:'⚡', title:'+10% XP Clicker',    desc:'Plus d\'XP au port' },
      { level:8,  ico:'💵', title:'+5% Argent Clicker', desc:'Revenus augmentés' },
      { level:18, ico:'🔥', title:'Streak Bonus',        desc:'Bonus XP sur ta série' },
      { level:30, ico:'🏭', title:'Salaire passif',      desc:'100€/heure en ligne' },
    ];
    const ACHIEVEMENTS = [
      { ico:'🎮', title:'Première partie',   desc:'Lance ta 1ère partie',        check:()=>true },
      { ico:'⭐', title:'Docker confirmé',   desc:'Atteins le niveau 15',         check:()=>level>=15 },
      { ico:'💰', title:'Premier millier',   desc:'Accumule 1 000€',              check:()=>money>=1000 },
      { ico:'🃏', title:'Grand gagnant',     desc:'Gagne plus de 5 000€',         check:()=>bigWin>=5000 },
      { ico:'🔥', title:'Régulier',          desc:'7 jours de streak',            check:()=>streak>=7 },
      { ico:'📈', title:'Investisseur',      desc:'Achète tes premières actions', check:()=>false },
      { ico:'🌟', title:'Docker légendaire', desc:'Atteins le niveau 30',         check:()=>level>=30 },
      { ico:'💎', title:'Millionnaire',      desc:'Possède 1 000 000€',           check:()=>money>=1000000 },
    ];

    function isUnlocked(node) {
      if(node.special==='money') return money >= node.specialVal;
      return level >= node.level;
    }

    function renderNodes(containerId, nodes, useAvatar=false) {
      const el = document.getElementById(containerId);
      el.innerHTML = nodes.map((node, i) => {
        const unlocked = isUnlocked(node);
        const isCurrent = !unlocked && (i===0 || isUnlocked(nodes[i-1]));
        const cls = unlocked?'unlocked':isCurrent?'current':'locked';
        let badge = unlocked ? '✦ Débloqué' : isCurrent ? '⏳ En cours' : node.special==='money' ? '1M€' : `Niv. ${node.level}`;
        let badgeCls = unlocked?'unlocked':isCurrent?'current':'locked';

        const iconHtml = useAvatar
          ? `<div class="node-av"><img src="${node.av}"></div>`
          : `<div class="node-ico">${node.ico}</div>`;

        const connector = i < nodes.length-1
          ? `<div class="node-connector ${unlocked?'done':'todo'}"></div>` : '';

        return `
          <div class="node ${cls}">
            ${iconHtml}
            <div class="node-info">
              <div class="node-title">${node.title}</div>
              <div class="node-desc">${node.desc}</div>
            </div>
            <div class="node-badge ${badgeCls}">${badge}</div>
          </div>${connector}`;
      }).join('');
    }

    function updateSvgNodes() {
      // Hero SVG — allumer les nœuds selon le niveau
      const heroNodes = [
        { id:'n3', glow:null, level:5,  ico:'n3', icoEl:'ico3' },
      ];
      if(level>=5) {
        const n3 = document.getElementById('n3');
        if(n3) { n3.setAttribute('fill','#312e81'); n3.setAttribute('stroke','#818cf8'); n3.setAttribute('opacity','1'); }
        const ico3 = document.getElementById('ico3');
        if(ico3) { ico3.textContent='⭐'; ico3.setAttribute('fill','white'); }
      }

      // Apparence SVG
      const avLevels = [1,5,10,15,30,50];
      avLevels.forEach((lv, i) => {
        const n = document.getElementById(`an${i+1}`);
        const t = document.getElementById(`at${i+1}`);
        if(n && level>=lv) {
          n.setAttribute('fill','#4338ca'); n.setAttribute('stroke','#a5b4fc'); n.setAttribute('opacity','1');
        }
        if(t && level>=lv) { t.textContent='✦'; t.setAttribute('fill','white'); }
      });

      // Couleurs SVG
      const colorLevels = [1,5,10,30];
      colorLevels.forEach((lv, i) => {
        const n = document.getElementById(`cn${i+1}`);
        const t = document.getElementById(`ct${i+1}`);
        if(n && level>=lv) {
          n.setAttribute('fill','#4338ca'); n.setAttribute('stroke','#a5b4fc'); n.setAttribute('opacity','1');
        }
        if(t && level>=lv) { t.textContent='✦'; t.setAttribute('fill','white'); }
      });

      // Port SVG
      const portLevels = [3,8,18,30];
      portLevels.forEach((lv, i) => {
        const n = document.getElementById(`pn${i+1}`);
        const t = document.getElementById(`pt${i+1}`);
        if(n && level>=lv) {
          n.setAttribute('fill','#4338ca'); n.setAttribute('stroke','#a5b4fc'); n.setAttribute('opacity','1');
        }
        if(t && level>=lv) { t.textContent='✦'; t.setAttribute('fill','white'); }
      });
    }

    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if(!session) { window.location.href='index.html'; return; }

      const { data: profile } = await sb.from('profiles').select('username,avatar_url').eq('user_id',session.user.id).maybeSingle();
      const { data: stats }   = await sb.from('game_stats').select('*').eq('user_id',session.user.id).maybeSingle();

      if(stats) {
        level   = stats.level       || 1;
        money   = stats.money       || 0;
        xp      = stats.xp         || 0;
        streak  = stats.streak_days || 0;
        bigWin  = stats.biggest_win || 0;
      }

      // Hero
      document.getElementById('heroName').textContent  = profile?.username || 'Docker';
      document.getElementById('heroGrade').textContent = getGrade(level);
      document.getElementById('heroLvl').textContent   = level;

      // XP
      const xpReq = getXpReq(level);
      const pct   = Math.min(100, Math.round((xp/xpReq)*100));
      document.getElementById('xpCurrent').textContent = xp.toLocaleString('fr-FR') + ' XP';
      document.getElementById('xpNext').textContent    = xpReq.toLocaleString('fr-FR') + ' XP';
      setTimeout(() => document.getElementById('xpFill').style.width = pct+'%', 100);

      // Quick stats
      const m = money>=1000000?(money/1000000).toFixed(1)+'M€':money>=1000?Math.floor(money/1000)+'k€':money+'€';
      document.getElementById('qsMoney').textContent = m;
      document.getElementById('qsStreak').textContent = streak+'🔥';
      document.getElementById('qsWin').textContent = bigWin>=1000?Math.floor(bigWin/1000)+'k€':bigWin+'€';

      // Streak
      document.getElementById('streakVal').textContent = streak;
      document.getElementById('streakSub').textContent = streak>=7 ? '🏅 '+streak+' jours — Impressionnant !' : streak>0 ? 'Continue comme ça !' : 'Connecte-toi chaque jour !';

      // Rendu
      renderNodes('nodesApparence', APPARENCE, true);
      renderNodes('nodesCouleurs', COULEURS);
      renderNodes('nodesPort', PORT);

      // Succès
      document.getElementById('achGrid').innerHTML = ACHIEVEMENTS.map(a => {
        const done = a.check();
        return `<div class="ach ${done?'done':''}">
          <div class="ach-ico">${a.ico}</div>
          <div class="ach-title">${a.title}</div>
          <div class="ach-desc">${a.desc}</div>
          ${done?'<div class="ach-done">✦ Obtenu</div>':''}
        </div>`;
      }).join('');

      // SVG dynamiques
      updateSvgNodes();
    }

    // Étoiles
    (function() {
      const bg = document.getElementById('starsBg');
      for(let i=0;i<100;i++) {
        const s = document.createElement('div');
        s.className = 'star';
        const sz = 0.5+Math.random()*2.5;
        s.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-duration:${2+Math.random()*5}s;animation-delay:${Math.random()*6}s;opacity:${0.2+Math.random()*0.7}`;
        bg.appendChild(s);
      }
    })();

    init();
  </script>
</body>
</html>
