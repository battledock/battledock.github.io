<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Progression - Battle Dock</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }

    body {
      font-family: 'Inter', sans-serif;
      background: #060814;
      background-image:
        radial-gradient(ellipse at 30% 20%, rgba(99,102,241,0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 80%, rgba(79,70,229,0.06) 0%, transparent 50%);
      min-height: 100vh;
      padding-bottom: 40px;
      color: white;
    }

    /* ===================== ÉTOILES ===================== */
    .stars-bg {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    }
    .star {
      position: absolute; background: white; border-radius: 50%;
      animation: twinkle 3s ease-in-out infinite;
    }
    @keyframes twinkle { 0%,100%{opacity:0.8} 50%{opacity:0.2} }

    /* ===================== CONTAINER ===================== */
    .container { position: relative; z-index: 1; max-width: 500px; margin: 0 auto; padding: 16px; }

    /* ===================== BACK ===================== */
    .back-btn {
      display: flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px; padding: 10px 14px;
      color: rgba(255,255,255,0.6); font-family:'Bebas Neue',sans-serif;
      font-size: 14px; letter-spacing: 1px; cursor: pointer;
      margin-bottom: 16px; transition: all 0.2s; width: fit-content;
    }
    .back-btn:hover { background: rgba(255,255,255,0.08); color: white; }

    /* ===================== HERO CARD ===================== */
    .hero-card {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 16px;
      border: 1px solid rgba(99,102,241,0.2);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 60px rgba(99,102,241,0.06);
    }

    .hero-card-bg {
      position: absolute; inset: 0;
      background: linear-gradient(160deg, #0f0c29 0%, #1a1845 50%, #0c0b20 100%);
    }

    /* Nœuds décoratifs en fond */
    .hero-nodes {
      position: absolute; inset: 0; z-index: 1; overflow: hidden;
    }

    .hero-content {
      position: relative; z-index: 2;
      padding: 20px;
    }

    .hero-top {
      display: flex; align-items: center; gap: 16px; margin-bottom: 20px;
    }

    .hero-avatar {
      width: 60px; height: 60px; border-radius: 50%;
      border: 2px solid rgba(165,180,252,0.4);
      overflow: hidden; flex-shrink: 0;
      box-shadow: 0 0 20px rgba(99,102,241,0.3);
    }
    .hero-avatar img { width:100%; height:100%; object-fit:cover; }

    .hero-info { flex: 1; }
    .hero-name { font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:2px; color:white; }
    .hero-grade { font-size:11px; color:#a5b4fc; font-weight:700; text-transform:uppercase; letter-spacing:1px; margin-top:2px; }

    .hero-level-badge {
      font-family:'Bebas Neue',sans-serif;
      font-size:42px; color:#a5b4fc; letter-spacing:2px; line-height:1;
      text-shadow: 0 0 20px rgba(165,180,252,0.5);
    }
    .hero-level-lbl { font-size:9px; color:rgba(165,180,252,0.4); text-transform:uppercase; letter-spacing:2px; text-align:right; }

    .hero-xp { margin-bottom: 0; }
    .hero-xp-label { display:flex; justify-content:space-between; font-size:10px; color:rgba(255,255,255,0.35); margin-bottom:6px; font-weight:600; }
    .hero-xp-track { height:5px; background:rgba(255,255,255,0.06); border-radius:3px; overflow:hidden; }
    .hero-xp-fill { height:100%; background:linear-gradient(90deg,#4f46e5,#a5b4fc); border-radius:3px; transition:width 0.6s ease; box-shadow:0 0 10px rgba(99,102,241,0.6); }

    /* ===================== SKILL TREE ===================== */
    .skill-section {
      margin-bottom: 16px;
    }

    .section-title {
      font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:2px;
      color:rgba(255,255,255,0.25); text-transform:uppercase;
      margin-bottom:12px; display:flex; align-items:center; gap:8px;
    }
    .section-title::after { content:''; flex:1; height:1px; background:rgba(255,255,255,0.06); }

    .skill-tree-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 20px;
      position: relative; overflow: hidden;
    }

    /* ===================== STATS GRID ===================== */
    .stats-grid {
      display: grid; grid-template-columns: repeat(2,1fr);
      gap: 8px; margin-bottom: 16px;
    }

    .stat-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 16px 14px;
      display: flex; flex-direction: column; gap: 4px;
      position: relative; overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute; top:0; left:0; right:0; height:2px;
      background: linear-gradient(90deg, #4f46e5, #818cf8);
      opacity: 0.5;
    }

    .stat-icon { font-size: 22px; margin-bottom: 2px; }
    .stat-value { font-family:'Bebas Neue',sans-serif; font-size:22px; color:white; letter-spacing:1px; line-height:1; }
    .stat-label { font-size:10px; color:rgba(255,255,255,0.3); font-weight:700; text-transform:uppercase; letter-spacing:0.5px; }

    /* ===================== STREAKS ===================== */
    .streaks-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:16px; }

    .streak-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 14px 10px;
      text-align: center;
    }
    .streak-icon { font-size:24px; margin-bottom:6px; }
    .streak-value { font-family:'Bebas Neue',sans-serif; font-size:26px; color:#a5b4fc; letter-spacing:1px; }
    .streak-label { font-size:9px; color:rgba(255,255,255,0.3); text-transform:uppercase; letter-spacing:0.5px; margin-top:2px; font-weight:700; }

    /* ===================== UNLOCKS ===================== */
    .unlock-list { display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }

    .unlock-item {
      display:flex; align-items:center; gap:12px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 12px 14px;
      transition: all 0.2s;
    }

    .unlock-item.unlocked { border-color: rgba(99,102,241,0.25); background: rgba(99,102,241,0.06); }

    .unlock-icon { font-size:22px; flex-shrink:0; }
    .unlock-info { flex:1; }
    .unlock-title { font-size:13px; font-weight:700; color:white; }
    .unlock-req { font-size:11px; color:rgba(255,255,255,0.35); margin-top:2px; }
    .unlock-status { font-size:16px; flex-shrink:0; }

    /* ===================== ACHIEVEMENTS ===================== */
    .achieve-list { display:flex; flex-direction:column; gap:8px; }

    .achieve-item {
      display:flex; align-items:center; gap:12px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .achieve-item.unlocked { border-color: rgba(251,191,36,0.25); background: rgba(251,191,36,0.05); }
    .achieve-item.locked { opacity: 0.5; }

    .achieve-icon { font-size:22px; flex-shrink:0; }
    .achieve-info { flex:1; }
    .achieve-title { font-size:13px; font-weight:700; color:white; }
    .achieve-desc { font-size:11px; color:rgba(255,255,255,0.35); margin-top:2px; }
    .achieve-status { font-size:16px; flex-shrink:0; }
  </style>
</head>
<body>

  <!-- Étoiles fond -->
  <div class="stars-bg" id="starsBg"></div>

  <div class="container">

    <div class="back-btn" onclick="window.location.href='game.html'">← RETOUR</div>

    <!-- HERO CARD -->
    <div class="hero-card">
      <div class="hero-card-bg"></div>
      <div class="hero-nodes">
        <svg id="heroNodesSvg" width="100%" height="100%" style="position:absolute;inset:0;opacity:0.25"></svg>
      </div>
      <div class="hero-content">
        <div class="hero-top">
          <div class="hero-avatar"><img src="avatar-default.png" id="heroAvatar" alt="avatar"></div>
          <div class="hero-info">
            <div class="hero-name" id="heroName">...</div>
            <div class="hero-grade" id="heroGrade">Docker Occasionnel</div>
          </div>
          <div style="text-align:right;">
            <div class="hero-level-badge" id="heroLevel">1</div>
            <div class="hero-level-lbl">NIV</div>
          </div>
        </div>
        <div class="hero-xp">
          <div class="hero-xp-label">
            <span>Niveau <span id="heroCurrentLvl">1</span> → <span id="heroNextLvl">2</span></span>
            <span id="heroXpText">0 / 500 XP</span>
          </div>
          <div class="hero-xp-track"><div class="hero-xp-fill" id="heroXpFill" style="width:0%"></div></div>
        </div>
      </div>
    </div>

    <!-- SKILL TREE -->
    <div class="skill-section">
      <div class="section-title">⚡ Arbre de compétences</div>
      <div class="skill-tree-card">
        <svg id="skillSvg" viewBox="0 0 440 160" width="100%" style="display:block;"></svg>
      </div>
    </div>

    <!-- STATS -->
    <div class="section-title">📊 Statistiques</div>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">💰</div>
        <div class="stat-value" id="totalMoney">0€</div>
        <div class="stat-label">Argent total</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">⭐</div>
        <div class="stat-value" id="totalXp">0</div>
        <div class="stat-label">XP total</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">🎮</div>
        <div class="stat-value" id="gamesPlayed">0</div>
        <div class="stat-label">Parties jouées</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">🏆</div>
        <div class="stat-value" id="achievements">0</div>
        <div class="stat-label">Succès</div>
      </div>
    </div>

    <!-- STREAKS -->
    <div class="section-title">🔥 Séries actives</div>
    <div class="streaks-grid">
      <div class="streak-card"><div class="streak-icon">🔥</div><div class="streak-value" id="dailyStreak">0</div><div class="streak-label">jours consécutifs</div></div>
      <div class="streak-card"><div class="streak-icon">⭐</div><div class="streak-value" id="winStreak">0</div><div class="streak-label">victoires</div></div>
      <div class="streak-card"><div class="streak-icon">💰</div><div class="streak-value" id="moneyStreak">0</div><div class="streak-label">sessions +100€</div></div>
    </div>

    <!-- DÉBLOCAGES -->
    <div class="section-title">🔓 Déblocages par niveau</div>
    <div class="unlock-list" id="unlockList"></div>

    <!-- SUCCÈS -->
    <div class="section-title">🏅 Succès</div>
    <div class="achieve-list" id="achieveList"></div>

  </div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const sb = createClient(supabaseUrl, supabaseKey);

    let currentUser = null;

    // ===========================
    // ÉTOILES
    // ===========================
    const starsBg = document.getElementById('starsBg');
    for (let i = 0; i < 60; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      const size = 0.5 + Math.random() * 1.5;
      s.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*4}s;animation-duration:${2+Math.random()*3}s;opacity:${0.3+Math.random()*0.5}`;
      starsBg.appendChild(s);
    }

    // ===========================
    // XP SYSTEM
    // ===========================
    function getXpRequired(level) {
      if (level <= 10) return level * 500;
      if (level <= 25) return level * 1000;
      if (level <= 50) return level * 2000;
      return level * 4000;
    }

    function getGrade(level) {
      if (level <= 4)  return 'Docker Occasionnel';
      if (level <= 14) return 'Docker';
      if (level <= 29) return 'Docker Mensuel';
      if (level <= 49) return 'Contre-Maître';
      if (level <= 79) return 'Chef de Quai';
      return 'Magnat du Port';
    }

    // ===========================
    // SKILL TREE SVG
    // ===========================
    const NODES = [
      { id:'n0', x:40,  y:80, minLevel:1,  icon:'⚓', label:'Docker Occasionnel', size:14 },
      { id:'n1', x:110, y:40, minLevel:5,  icon:'⭐', label:'Docker',              size:12 },
      { id:'n2', x:110, y:120,minLevel:5,  icon:'💪', label:'Gants Niv.1',         size:11 },
      { id:'n3', x:190, y:40, minLevel:10, icon:'🔥', label:'Docker Mensuel',      size:12 },
      { id:'n4', x:190, y:120,minLevel:10, icon:'👦', label:'Apprenti',            size:11 },
      { id:'n5', x:270, y:60, minLevel:15, icon:'⚡', label:'Contre-Maître',       size:12 },
      { id:'n6', x:270, y:120,minLevel:15, icon:'📊', label:'XP Bonus',            size:11 },
      { id:'n7', x:350, y:80, minLevel:30, icon:'👑', label:'Chef de Quai',        size:13 },
      { id:'n8', x:410, y:80, minLevel:50, icon:'🏆', label:'Magnat',              size:14 },
    ];

    const EDGES = [
      ['n0','n1'],['n0','n2'],
      ['n1','n3'],['n2','n4'],
      ['n3','n5'],['n4','n6'],
      ['n5','n7'],['n6','n7'],
      ['n7','n8'],
    ];

    function renderSkillTree(level) {
      const svg = document.getElementById('skillSvg');
      svg.innerHTML = '';

      // Defs
      const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
      defs.innerHTML = `
        <filter id="nodeGlow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <radialGradient id="activeGrad" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#4f46e5"/></radialGradient>
        <radialGradient id="lockedGrad" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f0c29"/></radialGradient>
      `;
      svg.appendChild(defs);

      // Edges
      EDGES.forEach(([fromId, toId]) => {
        const from = NODES.find(n=>n.id===fromId);
        const to   = NODES.find(n=>n.id===toId);
        const fromUnlocked = level >= from.minLevel;
        const toUnlocked   = level >= to.minLevel;
        const line = document.createElementNS('http://www.w3.org/2000/svg','line');
        line.setAttribute('x1', from.x); line.setAttribute('y1', from.y);
        line.setAttribute('x2', to.x);   line.setAttribute('y2', to.y);
        line.setAttribute('stroke', fromUnlocked && toUnlocked ? 'rgba(99,102,241,0.6)' : 'rgba(255,255,255,0.06)');
        line.setAttribute('stroke-width', fromUnlocked && toUnlocked ? '1.5' : '1');
        if (fromUnlocked && toUnlocked) {
          line.setAttribute('stroke-dasharray', '0');
        } else {
          line.setAttribute('stroke-dasharray', '4 4');
        }
        svg.appendChild(line);
      });

      // Nodes
      NODES.forEach(node => {
        const unlocked = level >= node.minLevel;
        const g = document.createElementNS('http://www.w3.org/2000/svg','g');

        // Glow ring si unlocked
        if (unlocked) {
          const ring = document.createElementNS('http://www.w3.org/2000/svg','circle');
          ring.setAttribute('cx', node.x); ring.setAttribute('cy', node.y);
          ring.setAttribute('r', node.size + 6);
          ring.setAttribute('fill', 'rgba(99,102,241,0.1)');
          g.appendChild(ring);
        }

        // Cercle principal
        const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
        circle.setAttribute('cx', node.x); circle.setAttribute('cy', node.y);
        circle.setAttribute('r', node.size);
        circle.setAttribute('fill', unlocked ? 'url(#activeGrad)' : 'url(#lockedGrad)');
        circle.setAttribute('stroke', unlocked ? 'rgba(165,180,252,0.6)' : 'rgba(255,255,255,0.08)');
        circle.setAttribute('stroke-width', unlocked ? '1.5' : '1');
        if (unlocked) circle.setAttribute('filter', 'url(#nodeGlow)');
        g.appendChild(circle);

        // Icône
        const text = document.createElementNS('http://www.w3.org/2000/svg','text');
        text.setAttribute('x', node.x); text.setAttribute('y', node.y + 5);
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('font-size', Math.round(node.size * 0.9));
        text.setAttribute('fill', unlocked ? 'white' : 'rgba(255,255,255,0.2)');
        text.textContent = unlocked ? node.icon : '🔒';
        g.appendChild(text);

        // Label
        const label = document.createElementNS('http://www.w3.org/2000/svg','text');
        label.setAttribute('x', node.x); label.setAttribute('y', node.y + node.size + 12);
        label.setAttribute('text-anchor', 'middle');
        label.setAttribute('font-size', '7');
        label.setAttribute('fill', unlocked ? 'rgba(165,180,252,0.7)' : 'rgba(255,255,255,0.12)');
        label.setAttribute('font-family', 'Inter, sans-serif');
        label.textContent = node.label;
        g.appendChild(label);

        svg.appendChild(g);
      });
    }

    // ===========================
    // UNLOCK & ACHIEVEMENTS
    // ===========================
    const unlocks = [
      { icon:'💼', title:'Docker Occasionnel', req:'Niveau 1', level:1 },
      { icon:'⚓', title:'Grade Docker', req:'Niveau 5', level:5 },
      { icon:'📅', title:'Grade Docker Mensuel', req:'Niveau 15', level:15 },
      { icon:'🏗️', title:'Contre-Maître', req:'Niveau 30', level:30 },
      { icon:'🏢', title:'Créer sa Compagnie', req:'Niveau 30', level:30 },
      { icon:'👑', title:'Chef de Quai', req:'Niveau 50', level:50 },
      { icon:'⚡', title:'Fonctionnalités exclusives', req:'Niveau 50', level:50 },
      { icon:'💰', title:'Avatar Millionnaire', req:'1 000 000€ possédés', level:0, special:'money' },
    ];

    const achievements = [
      { icon:'🎮', title:'Première expérience', desc:'Joue 10 parties', condition:(s)=>s.gamesPlayed>=10 },
      { icon:'⭐', title:'Docker confirmé', desc:'Atteins le niveau 15', condition:(s)=>s.level>=15 },
      { icon:'🌟', title:'Docker expérimenté', desc:'Atteins le niveau 25', condition:(s)=>s.level>=25 },
      { icon:'💫', title:'Chef respecté', desc:'Atteins le niveau 40', condition:(s)=>s.level>=40 },
      { icon:'💰', title:'Capitaliste', desc:'Possède 1 000€', condition:(s)=>s.money>=1000 },
      { icon:'💎', title:'Riche docker', desc:'Possède 5 000€', condition:(s)=>s.money>=5000 },
      { icon:'👑', title:'Magnat du port', desc:'Possède 25 000€', condition:(s)=>s.money>=25000 },
      { icon:'🔥', title:'Grindeur', desc:'Accumule 5 000 XP', condition:(s)=>s.totalXp>=5000 },
      { icon:'⚡', title:'Travailleur acharné', desc:'Accumule 15 000 XP', condition:(s)=>s.totalXp>=15000 },
      { icon:'💥', title:'Légende du dock', desc:'Accumule 50 000 XP', condition:(s)=>s.totalXp>=50000 },
      { icon:'🎯', title:'Régulier', desc:'Joue 100 parties', condition:(s)=>s.gamesPlayed>=100 },
      { icon:'🏅', title:'Vétéran du port', desc:'Joue 500 parties', condition:(s)=>s.gamesPlayed>=500 },
      { icon:'👑', title:'Contremaître ultime', desc:'Atteins le niveau 50', condition:(s)=>s.level>=50 },
    ];

    // ===========================
    // INIT
    // ===========================
    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { window.location.href = 'index.html'; return; }
      currentUser = session.user;
      await loadProgression();
    }

    async function loadProgression() {
      const [profileRes, statsRes] = await Promise.all([
        sb.from('profiles').select('username, avatar_url').eq('user_id', currentUser.id).single(),
        sb.from('game_stats').select('*').eq('user_id', currentUser.id).single()
      ]);

      const profile = profileRes.data;
      const stats   = statsRes.data;
      if (!profile || !stats) return;

      const level = stats.level || 1;
      const xp    = stats.xp   || 0;
      const xpNeeded = getXpRequired(level);
      const pct = Math.min((xp / xpNeeded) * 100, 100);

      // Hero
      document.getElementById('heroAvatar').src = profile.avatar_url;
      document.getElementById('heroName').textContent   = profile.username;
      document.getElementById('heroGrade').textContent  = getGrade(level);
      document.getElementById('heroLevel').textContent  = level;
      document.getElementById('heroCurrentLvl').textContent = level;
      document.getElementById('heroNextLvl').textContent    = level + 1;
      document.getElementById('heroXpText').textContent = `${xp} / ${xpNeeded} XP`;
      document.getElementById('heroXpFill').style.width = pct + '%';

      // Nœuds héro en fond
      renderHeroNodes(level);

      // Skill tree
      renderSkillTree(level);

      // Stats
      let totalXp = 0;
      for (let i = 1; i < level; i++) totalXp += getXpRequired(i);
      totalXp += xp;

      document.getElementById('totalMoney').textContent = (stats.money||0).toLocaleString('fr-FR') + '€';
      document.getElementById('totalXp').textContent    = totalXp.toLocaleString('fr-FR');

      // Parties jouées
      try {
        const { data: sessions } = await sb.from('game_sessions').select('id').eq('user_id', currentUser.id);
        document.getElementById('gamesPlayed').textContent = sessions?.length || 0;
      } catch { document.getElementById('gamesPlayed').textContent = '0'; }

      const playerStats = { level, money: stats.money||0, totalXp, gamesPlayed: parseInt(document.getElementById('gamesPlayed').textContent) };

      const unlockedCount = achievements.filter(a => a.condition(playerStats)).length;
      document.getElementById('achievements').textContent = `${unlockedCount}/${achievements.length}`;

      // Streaks
      try {
        const { data: streaks } = await sb.from('user_streaks').select('*').eq('user_id', currentUser.id).single();
        document.getElementById('dailyStreak').textContent = streaks?.daily_login_streak || 0;
        document.getElementById('winStreak').textContent   = streaks?.win_streak || 0;
        document.getElementById('moneyStreak').textContent = streaks?.money_streak || 0;
      } catch { ['dailyStreak','winStreak','moneyStreak'].forEach(id => document.getElementById(id).textContent = '0'); }

      // Unlocks
      const ulList = document.getElementById('unlockList');
      ulList.innerHTML = unlocks.map(u => {
        const isUnlocked = u.special === 'money' ? playerStats.money >= 1000000 : playerStats.level >= u.level;
        return `<div class="unlock-item ${isUnlocked?'unlocked':''}">
          <div class="unlock-icon">${u.icon}</div>
          <div class="unlock-info"><div class="unlock-title">${u.title}</div><div class="unlock-req">${u.req}</div></div>
          <div class="unlock-status">${isUnlocked?'✅':'🔒'}</div>
        </div>`;
      }).join('');

      // Achievements
      const achList = document.getElementById('achieveList');
      achList.innerHTML = achievements.map(a => {
        const isUnlocked = a.condition(playerStats);
        return `<div class="achieve-item ${isUnlocked?'unlocked':'locked'}">
          <div class="achieve-icon">${a.icon}</div>
          <div class="achieve-info"><div class="achieve-title">${a.title}</div><div class="achieve-desc">${a.desc}</div></div>
          <div class="achieve-status">${isUnlocked?'🏅':'🔒'}</div>
        </div>`;
      }).join('');
    }

    function renderHeroNodes(level) {
      const svg = document.getElementById('heroNodesSvg');
      const w = 500, h = 140;
      svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
      const pts = [[60,70],[140,30],[140,110],[230,50],[230,90],[320,70],[400,40],[400,100]];
      const edges = [[0,1],[0,2],[1,3],[2,4],[3,5],[4,5],[5,6],[5,7]];
      edges.forEach(([a,b]) => {
        const line = document.createElementNS('http://www.w3.org/2000/svg','line');
        line.setAttribute('x1',pts[a][0]); line.setAttribute('y1',pts[a][1]);
        line.setAttribute('x2',pts[b][0]); line.setAttribute('y2',pts[b][1]);
        line.setAttribute('stroke','rgba(99,102,241,0.3)'); line.setAttribute('stroke-width','1');
        svg.appendChild(line);
      });
      pts.forEach((p,i) => {
        const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
        c.setAttribute('cx',p[0]); c.setAttribute('cy',p[1]); c.setAttribute('r','5');
        c.setAttribute('fill', i < Math.ceil(level/10) ? 'rgba(99,102,241,0.6)' : 'rgba(99,102,241,0.15)');
        c.setAttribute('stroke','rgba(165,180,252,0.3)'); c.setAttribute('stroke-width','1');
        svg.appendChild(c);
      });
    }

    init();
  </script>
</body>
</html>
