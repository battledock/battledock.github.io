<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pour Aurélia ✨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,900;1,600&family=Karla:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#2a1e47; --bg2:#1c1430;
  --acc:#ffb37a; --btn1:#ff6b6b; --btn2:#ff8e53;
  --creme:#fff4e6; --sub:#cfc3e8; --ok:#7fd8a4;
}
/* ---------- THÈMES ---------- */
body.t-jungle {--bg1:#1d4030;--bg2:#0d2118;--acc:#a8e6a1;--btn1:#2fbf71;--btn2:#7fd8a4;--sub:#a9d8bb}
body.t-sorbet {--bg1:#5a2431;--bg2:#2e1019;--acc:#ffd166;--btn1:#ef476f;--btn2:#ff8e53;--sub:#e8b8c2}
body.t-sunset {--bg1:#6b2d12;--bg2:#2e1005;--acc:#ffd166;--btn1:#ff7b3d;--btn2:#ffb347;--sub:#e8c4ad}
body.t-lav    {--bg1:#3b2f63;--bg2:#181233;--acc:#c9b8ff;--btn1:#8c6bff;--btn2:#b8a6e8;--sub:#c5badf}
body.t-savane {--bg1:#7a5c17;--bg2:#3a2a08;--acc:#ffe08a;--btn1:#e0a11f;--btn2:#ffd24d;--sub:#e2d0a0}
body.t-neon   {--bg1:#0c2b3a;--bg2:#040f16;--acc:#5eead4;--btn1:#06b6d4;--btn2:#5eead4;--sub:#9bd0d8}
body.t-rose   {--bg1:#57123a;--bg2:#26071a;--acc:#ff9ecb;--btn1:#ff4d94;--btn2:#ff9ecb;--sub:#e0aec8}
body.t-turq   {--bg1:#0e4d4a;--bg2:#052423;--acc:#7de8d8;--btn1:#14b8a6;--btn2:#7de8d8;--sub:#a3d4cd}
body.t-elec   {--bg1:#3a1a63;--bg2:#150829;--acc:#e08aff;--btn1:#a21caf;--btn2:#e08aff;--sub:#cfa8e0}
body.t-cafe   {--bg1:#4a3325;--bg2:#221610;--acc:#ffc98a;--btn1:#c0793a;--btn2:#e8a95c;--sub:#d8c0a8}
body.t-menthe {--bg1:#144d38;--bg2:#07271b;--acc:#9df5c8;--btn1:#10b981;--btn2:#6ee7b7;--sub:#a8d8c2}
body.t-horror {--bg1:#141416;--bg2:#050505;--acc:#9a9aa5;--btn1:#3a3a42;--btn2:#5a5a66;--sub:#8a8a95}
body.t-re     {--bg1:#3a0d0d;--bg2:#120303;--acc:#ff8a8a;--btn1:#d43f3f;--btn2:#ff6b6b;--sub:#c09090}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Karla',sans-serif;
  background:radial-gradient(120% 90% at 50% 0%, var(--bg1) 0%, var(--bg2) 70%);
  color:var(--creme);
  overflow:hidden;position:fixed;inset:0;
  user-select:none;-webkit-user-select:none;
  transition:background 1s;
}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0;transition:opacity .8s}
.star{position:absolute;border-radius:50%;background:var(--creme);opacity:.5;animation:tw 3s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.12}to{opacity:.7}}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
.screen{
  flex:1;display:flex;flex-direction:column;justify-content:center;
  padding:24px 22px calc(24px + env(safe-area-inset-bottom));gap:16px;justify-content:safe center;
  animation:pop .45s cubic-bezier(.2,.9,.3,1.2);
  overflow-y:auto;
}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
.eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);font-weight:700}
h1{font-family:'Fraunces',serif;font-weight:900;font-size:clamp(32px,8.5vw,42px);line-height:1.08}
h2{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(22px,6vw,28px);line-height:1.22}
h1 em,h2 em{font-style:italic;color:var(--acc)}
p.sub{color:var(--sub);font-size:15.5px;line-height:1.55}
.btn{
  appearance:none;border:none;cursor:pointer;
  font-family:'Karla',sans-serif;font-weight:700;font-size:17px;
  padding:15px 22px;border-radius:18px;
  background:linear-gradient(135deg,var(--btn1),var(--btn2));
  color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.35);
  transition:transform .15s;
}
.btn:disabled{opacity:.4}
.btn:active{transform:scale(.96)}
.btn.ghost{background:none;box-shadow:none;color:var(--sub);font-weight:600;font-size:15px}
.choices{display:flex;flex-direction:column;gap:11px}
.choice{
  appearance:none;border:1.5px solid rgba(255,244,230,.18);cursor:pointer;
  background:rgba(255,244,230,.06);color:var(--creme);
  font-family:'Karla',sans-serif;font-size:16px;font-weight:600;
  padding:15px 17px;border-radius:16px;text-align:left;
  display:flex;align-items:center;gap:12px;
  transition:all .15s;
}
.choice .emo{font-size:22px}
.choice:active{transform:scale(.97)}
.choice.sel{border-color:var(--acc);background:rgba(255,255,255,.12)}
.progress{display:flex;gap:5px;padding:16px 22px 0}
.progress i{flex:1;height:4px;border-radius:4px;background:rgba(255,244,230,.14);transition:background .4s}
.progress i.on{background:var(--acc)}
.tag-wrap{display:flex;flex-wrap:wrap;gap:9px}
.tag{
  appearance:none;border:1.5px solid rgba(255,244,230,.18);cursor:pointer;
  background:rgba(255,244,230,.06);color:var(--creme);
  font-family:'Karla',sans-serif;font-size:14.5px;font-weight:600;
  padding:10px 14px;border-radius:999px;transition:all .15s;
}
.tag.sel{border-color:var(--ok);background:rgba(127,216,164,.16);color:var(--ok)}
input[type=text]{
  width:100%;background:rgba(255,244,230,.07);border:1.5px solid rgba(255,244,230,.18);
  border-radius:16px;padding:15px;color:var(--creme);font-size:16px;font-family:'Karla',sans-serif;
  outline:none;user-select:text;-webkit-user-select:text;
}
input[type=text]:focus{border-color:var(--acc)}
.duel{display:flex;flex-direction:column;gap:12px}
.duel-row{display:flex;justify-content:space-between;font-weight:700;font-size:14.5px}
input[type=range]{width:100%;accent-color:var(--btn1)}
/* dessin */
#canvasBox{position:relative;border-radius:20px;overflow:hidden;border:1.5px solid rgba(255,244,230,.2)}
#draw{display:block;width:100%;background:#fffdf7;touch-action:none}
#timer{
  position:absolute;top:10px;right:10px;
  font-family:'Fraunces',serif;font-weight:900;font-size:24px;
  background:var(--bg2);color:var(--acc);
  padding:6px 14px;border-radius:14px;
}
.confetti{position:fixed;top:-20px;font-size:22px;z-index:9;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.recap{background:rgba(255,244,230,.07);border:1.5px solid rgba(255,244,230,.15);border-radius:18px;padding:15px 17px;font-size:14.5px;line-height:1.7}
.recap b{color:var(--acc)}
.girafe-final{width:100%;border-radius:16px;border:1.5px solid rgba(255,244,230,.2)}
.small{font-size:13px;color:var(--sub);opacity:.75}
/* swipe */
#deck{position:relative;height:min(56vh,410px)}
.card{
  position:absolute;inset:0;border-radius:24px;padding:26px 22px;
  display:flex;flex-direction:column;justify-content:flex-end;gap:8px;
  background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(0,0,0,.25));
  border:1.5px solid rgba(255,244,230,.25);
  box-shadow:0 14px 40px rgba(0,0,0,.4);
  touch-action:none;will-change:transform;backdrop-filter:blur(2px);
}
.card .big{font-size:64px}
.card h3{font-family:'Fraunces',serif;font-size:26px;font-weight:900;line-height:1.1}
.card p{color:var(--sub);font-size:14.5px;line-height:1.45}
.card .stamp{
  position:absolute;top:22px;font-family:'Fraunces',serif;font-weight:900;font-size:26px;
  padding:6px 14px;border-radius:12px;border:3px solid;transform:rotate(-12deg);opacity:0;
}
.stamp.yes{left:18px;color:var(--ok);border-color:var(--ok)}
.stamp.no{right:18px;color:#ff6b6b;border-color:#ff6b6b;transform:rotate(12deg)}
.swipe-btns{display:flex;gap:14px;justify-content:center}
.round{
  width:64px;height:64px;border-radius:50%;border:none;cursor:pointer;font-size:26px;
  display:flex;align-items:center;justify-content:center;transition:transform .12s;
}
.round:active{transform:scale(.88)}
.round.no{background:rgba(255,107,107,.18);border:2px solid #ff6b6b}
.round.yes{background:rgba(127,216,164,.18);border:2px solid var(--ok)}
/* réflexe */
#arena{
  position:relative;height:min(50vh,380px);border-radius:22px;
  background:rgba(255,244,230,.05);border:1.5px solid rgba(255,244,230,.18);overflow:hidden;
}
#target{position:absolute;font-size:46px;cursor:pointer;transition:transform .1s;user-select:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
#target:active{transform:scale(1.3)}
#score{font-family:'Fraunces',serif;font-weight:900;font-size:22px;color:var(--acc);text-align:center}
/* dilemmes */
.vs{display:flex;gap:12px;height:min(40vh,300px)}
.vs button{
  flex:1;border:none;border-radius:22px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  font-family:'Karla',sans-serif;font-weight:700;font-size:17px;color:var(--creme);
  background:rgba(255,244,230,.07);border:1.5px solid rgba(255,244,230,.18);
  transition:transform .12s;
}
.vs button:active{transform:scale(.95)}
.vs .emo{font-size:52px}
#vsCount{text-align:center;font-family:'Fraunces',serif;font-weight:900;font-size:20px;color:var(--sub)}
/* jauge */
#gaugeBox{position:relative;height:34px;border-radius:999px;background:rgba(255,244,230,.1);overflow:hidden;border:1.5px solid rgba(255,244,230,.18)}
#zone{position:absolute;top:0;bottom:0;background:rgba(127,216,164,.35);border-left:2px solid var(--ok);border-right:2px solid var(--ok)}
#needle{position:absolute;top:-4px;bottom:-4px;width:5px;background:var(--acc);border-radius:4px;box-shadow:0 0 12px var(--acc)}
/* banane */
#banZone{
  position:relative;height:min(44vh,330px);border-radius:22px;
  background:rgba(255,244,230,.05);border:1.5px solid rgba(255,244,230,.18);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
#banane{font-size:90px;cursor:pointer;transition:transform .06s;user-select:none}
#banane:active{transform:scale(1.25) rotate(-14deg)}
.pluie{position:absolute;font-size:26px;animation:fall 1.6s linear forwards;pointer-events:none;top:-30px}
/* horreur */
.fogwrap{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.fog{position:absolute;width:160%;height:60%;top:20%;left:-30%;
  background:radial-gradient(ellipse,rgba(200,200,210,.16),transparent 70%);
  filter:blur(18px);animation:fogmove 9s ease-in-out infinite alternate}
.fog:nth-child(2){top:50%;animation-duration:13s;animation-delay:-4s}
@keyframes fogmove{from{transform:translateX(-6%)}to{transform:translateX(10%)}}
.flicker{animation:flick 3.5s infinite}
@keyframes flick{0%,100%{opacity:1}92%{opacity:1}93%{opacity:.2}94%{opacity:1}96%{opacity:.4}97%{opacity:1}}
.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-8px,4px)}40%{transform:translate(9px,-5px)}60%{transform:translate(-7px,-4px)}80%{transform:translate(6px,5px)}}
.jump{
  position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#000;font-size:120px;animation:jumpin .18s;text-align:center;padding:20px;
}
@keyframes jumpin{from{transform:scale(3);opacity:0}to{transform:none;opacity:1}}
.jump .cri{font-family:'Fraunces',serif;font-size:34px;font-weight:900;color:#d43f3f;margin-top:8px}
.ammo{font-family:'Fraunces',serif;font-weight:900;color:#ff8a8a;font-size:18px}
.redveil{position:fixed;inset:0;pointer-events:none;z-index:4;box-shadow:inset 0 0 120px rgba(180,20,20,.55);animation:pulse 1.6s infinite alternate}
@keyframes pulse{from{opacity:.4}to{opacity:1}}
/* portrait */
.portrait{background:#fffdf7;border-radius:20px;padding:22px;text-align:center;border:1.5px solid rgba(255,244,230,.3);animation:reveal 1s cubic-bezier(.2,.9,.3,1.3)}
@keyframes reveal{from{transform:scale(.6) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
.portrait svg{width:60%;max-width:220px}
.portrait .cert{font-family:'Fraunces',serif;font-style:italic;color:#5a4a2e;font-size:14px;margin-top:6px}
#fw{position:fixed;inset:0;pointer-events:none;z-index:8}
/* ambiance flottante */
.amb{position:fixed;top:-40px;font-size:22px;z-index:2;pointer-events:none;opacity:.55;animation:ambfall linear forwards}
@keyframes ambfall{to{transform:translateY(115vh) rotate(340deg)}}
/* transition entre mondes */
#wipe{position:fixed;inset:0;background:#000;z-index:40;pointer-events:none;opacity:0;transition:opacity .28s}
#wipe.on{opacity:1}
/* bouton son */
#mute{
  position:fixed;top:14px;right:14px;z-index:60;width:42px;height:42px;border-radius:50%;
  border:1.5px solid rgba(255,244,230,.25);background:rgba(0,0,0,.3);color:var(--creme);
  font-size:18px;cursor:pointer;backdrop-filter:blur(4px);
}
@media (prefers-reduced-motion:reduce){
  .amb,.confetti,.fog{display:none}
}

</style>
</head>
<body>
<div class="stars" id="stars"></div>
<canvas id="fw"></canvas>
<div id="wipe"></div>
<button id="mute" title="Son">🔊</button>
<div class="progress" id="prog"></div>
<div id="app"></div>

<script>
const R = {};
let girafeImg = null;

/* ---------- SUPABASE (remplis tes clés) ---------- */
const SB_URL = 'https://jtijmythnvqgquizeizs.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp0aWpteXRobnZxZ3F1aXplaXpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ1NjU3NjAsImV4cCI6MjEwMDE0MTc2MH0.7Eo_DZarB7J6BCzRHh5pB7-ZKKwgIlwWkpqUV9MGbUc';
async function envoyerReponses(){
  try{
    await fetch(`${SB_URL}/rest/v1/aurelia_reponses`,{
      method:'POST',
      headers:{
        'apikey':SB_KEY,
        'Authorization':`Bearer ${SB_KEY}`,
        'Content-Type':'application/json',
        'Prefer':'return=minimal'
      },
      body:JSON.stringify({reponses:R, girafe:girafeImg})
    });
  }catch(e){/* silencieux : le jeu continue même sans réseau */}
}
const app = document.getElementById('app');

const st = document.getElementById('stars');
for(let i=0;i<40;i++){
  const s=document.createElement('i');s.className='star';
  const z=Math.random()*2.5+1;
  s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${z}px;height:${z}px;animation-delay:${Math.random()*3}s`;
  st.appendChild(s);
}


/* ---------- SON (WebAudio, zéro fichier) ---------- */
let AC=null,muted=false,droneNodes=null,heartIv=null;
function ac(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();}if(AC.state==='suspended')AC.resume();return AC;}
function tone(f,dur=.09,type='sine',vol=.12,when=0){
  if(muted)return;const a=ac(),o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(vol,a.currentTime+when);
  g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+when+dur);
  o.connect(g).connect(a.destination);
  o.start(a.currentTime+when);o.stop(a.currentTime+when+dur+.02);
}
const sTap=()=>tone(520,.06,'triangle',.08);
const sSel=()=>{tone(620,.07,'triangle',.1);tone(880,.09,'triangle',.08,.06);};
const sWin=()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.14,'triangle',.11,i*.09));};
const sBad=()=>tone(160,.18,'sawtooth',.09);
const sSting=()=>{if(muted)return;const a=ac(),o=a.createOscillator(),g=a.createGain();
  o.type='sawtooth';o.frequency.setValueAtTime(70,a.currentTime);
  o.frequency.exponentialRampToValueAtTime(400,a.currentTime+.12);
  g.gain.setValueAtTime(.28,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.7);
  o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.75);};
function droneStart(){
  if(muted||droneNodes)return;const a=ac();
  const o1=a.createOscillator(),o2=a.createOscillator(),g=a.createGain();
  o1.type='sine';o1.frequency.value=55;o2.type='sine';o2.frequency.value=58;
  g.gain.value=0;g.gain.linearRampToValueAtTime(.05,a.currentTime+1.5);
  o1.connect(g);o2.connect(g);g.connect(a.destination);o1.start();o2.start();
  droneNodes={o1,o2,g};
}
function droneStop(){
  if(!droneNodes)return;const a=AC;
  droneNodes.g.gain.linearRampToValueAtTime(0,a.currentTime+.8);
  const dn=droneNodes;droneNodes=null;
  setTimeout(()=>{try{dn.o1.stop();dn.o2.stop();}catch(e){}},900);
}
function heartStart(){
  if(heartIv)return;
  heartIv=setInterval(()=>{tone(65,.1,'sine',.2);tone(58,.12,'sine',.16,.16);vibr(30);},850);
}
function heartStop(){clearInterval(heartIv);heartIv=null;}
function vibr(ms){try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}}
document.getElementById('mute').onclick=function(){
  muted=!muted;this.textContent=muted?'🔇':'🔊';
  if(muted){droneStop();heartStop();}
};
/* sons globaux sur les interactions */
document.addEventListener('pointerdown',e=>{
  const t=e.target.closest('.choice,.tag,.btn,.round,.vs button,.mem,#banane,#target');
  if(!t)return;
  ac();vibr(12);
  if(t.classList.contains('choice')||t.matches('.vs button'))sSel();
  else sTap();
},{capture:true});

/* ---------- AMBIANCE flottante par monde ---------- */
const AMB={'t-jungle':['🍃','🌿'],'t-sorbet':['🍓','🍋'],'t-sunset':['🧡','☀️'],
  't-savane':['🌾','🦋'],'t-neon':['✦','◈'],'t-rose':['💗','🌸'],
  't-turq':['🫧','🐚'],'t-elec':['🎵','✨'],'t-cafe':['☕️','🤎'],'t-menthe':['🌱','🍀'],'t-lav':['💜','✨']};
let ambIv=null;
function ambiance(theme){
  clearInterval(ambIv);document.querySelectorAll('.amb').forEach(x=>x.remove());
  const set=AMB[theme];if(!set)return;
  ambIv=setInterval(()=>{
    const a=document.createElement('div');a.className='amb';
    a.textContent=set[Math.floor(Math.random()*set.length)];
    a.style.left=Math.random()*96+'vw';
    a.style.fontSize=(14+Math.random()*16)+'px';
    a.style.animationDuration=(6+Math.random()*6)+'s';
    document.body.appendChild(a);
    setTimeout(()=>a.remove(),12500);
  },1400);
}

/* ---------- thèmes ---------- */
const THEMES=['t-jungle','t-sorbet','t-sunset','t-lav','t-savane','t-neon','t-rose','t-turq','t-elec','t-cafe','t-menthe','t-horror','t-re'];
function setTheme(t){
  document.body.classList.remove(...THEMES);
  if(t)document.body.classList.add(t);
  const horror=(t==='t-horror'||t==='t-re');
  st.style.opacity=horror?'0':'';
  ambiance(horror?null:t);
  if(t==='t-horror'){droneStart();}
  else if(t==='t-re'){droneStart();heartStart();}
  else{droneStop();heartStop();}
}

/* ---------- feux d'artifice ---------- */
const fwc=document.getElementById('fw'),fx=fwc.getContext('2d');
let parts=[],fwOn=false;
function sizeFw(){fwc.width=innerWidth;fwc.height=innerHeight;}
sizeFw();addEventListener('resize',sizeFw);
function burst(x,y){
  const hue=Math.random()*360;
  for(let i=0;i<46;i++){
    const a=Math.random()*Math.PI*2,v=2+Math.random()*4.5;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,hue:hue+Math.random()*40,r:1.5+Math.random()*2});
  }
}
function fwLoop(){
  if(!fwOn&&parts.length===0){fx.clearRect(0,0,fwc.width,fwc.height);return;}
  fx.clearRect(0,0,fwc.width,fwc.height);
  parts=parts.filter(p=>p.l>0);
  parts.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.05;p.vx*=.985;p.vy*=.985;p.l-=.012;
    fx.globalAlpha=Math.max(0,p.l);
    fx.fillStyle=`hsl(${p.hue},95%,65%)`;

/* ---------- moteur ---------- */
const steps = [];
let idx = 0;
function progBar(){
  const p=document.getElementById('prog');p.innerHTML='';
  steps.forEach((_,i)=>{const b=document.createElement('i');if(i<=idx)b.classList.add('on');p.appendChild(b);});
}
const wipe=document.getElementById('wipe');
function go(i){
  const doIt=()=>{
    idx=i;progBar();app.innerHTML='';
    const d=document.createElement('div');d.className='screen';
    setTheme(steps[idx].theme||null);
    steps[idx].fn(d);
    app.appendChild(d);
    wipe.classList.remove('on');
  };
  if(i===0){doIt();return;}
  wipe.classList.add('on');
  setTimeout(doIt,300);
}
function next(){ if(idx<steps.length-1) go(idx+1); }
function confetti(){
  sWin();vibr(40);
  const emos=['✨','💛','🦒','🌟','🧡','⭐️'];
  for(let i=0;i<26;i++){
    const c=document.createElement('div');c.className='confetti';
    c.textContent=emos[Math.floor(Math.random()*emos.length)];
    c.style.left=Math.random()*100+'vw';
    c.style.animationDuration=(1.8+Math.random()*1.6)+'s';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),3600);
  }
}
function single(d,{eyebrow,title,sub,options,key}){

}
function multi(d,{eyebrow,title,sub,options,key,min=1}){
  d.innerHTML=`<div class="eyebrow">${eyebrow}</div><h2>${title}</h2><p class="sub">${sub}</p><div class="tag-wrap"></div><button class="btn" style="margin-top:8px" disabled>Continuer →</button>`;
  const box=d.querySelector('.tag-wrap'),btn=d.querySelector('.btn');
  const sel=new Set();
  options.forEach(o=>{
    const t=document.createElement('button');t.className='tag';t.textContent=o;
    t.onclick=()=>{
      t.classList.toggle('sel');
      t.classList.contains('sel')?sel.add(o):sel.delete(o);
      btn.disabled=sel.size<min;
    };
    box.appendChild(t);
  });
  btn.onclick=()=>{R[key]=[...sel];next();};
}

    {e:'🎳',t:'Bowling / arcade / laser game',s:'Esprit de compétition activé. Que le meilleur gagne.'},

    {e:'🧺',t:'Marché + cuisiner ensemble',s:'On choisit, on cuisine, on goûte. Chef à deux.'},
    {e:'🎡',t:'Fête foraine',s:'Grande roue, barbe à papa, peluches à gagner.'},
    {e:'🌌',t:'Regarder les étoiles',s:'Loin des lumières, une couverture, le silence, le ciel.'},
    {e:'🏛️',t:'Musée ou expo insolite',s:'Se perdre dans les salles et refaire le monde.'},
  ];
  let i=0;R.swipeYes=[];R.swipeNo=[];

    <div class="eyebrow">Monde 9 · Le grand tri</div>
    <h2>Swipe : ces sorties te tentent, <em>oui ou non</em> ?</h2>
    <div id="deck"></div>
    <div class="swipe-btns">
      <button class="round no">✖️</button>
      <button class="round yes">💚</button>
    </div>`;
  const deck=d.querySelector('#deck');
  function render(){
    deck.innerHTML='';
    if(i>=cards.length){confetti();setTimeout(next,600);return;}
    if(i+1<cards.length){
      const b=mk(cards[i+1]);b.style.transform='scale(.94) translateY(10px)';b.style.opacity='.6';
      deck.appendChild(b);
    }
    const c=mk(cards[i]);
    deck.appendChild(c);
    attach(c);
  }
  function mk(card){
    const c=document.createElement('div');c.className='card';
    c.innerHTML=`<div class="stamp yes">OUI !</div><div class="stamp no">BOF</div>
      <div class="big">${card.e}</div><h3>${card.t}</h3><p>${card.s}</p>`;
    return c;
  }
  function attach(c){
    let sx=0,dx=0,drag=false;
    const yes=c.querySelector('.stamp.yes'),no=c.querySelector('.stamp.no');
    c.addEventListener('pointerdown',e=>{drag=true;sx=e.clientX;c.setPointerCapture(e.pointerId);});
    c.addEventListener('pointermove',e=>{
      if(!drag)return;dx=e.clientX-sx;
      c.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;
      yes.style.opacity=Math.max(0,dx/80);
      no.style.opacity=Math.max(0,-dx/80);
    });
    c.addEventListener('pointerup',()=>{
      drag=false;
      if(dx>90)decide(true,c);
      else if(dx<-90)decide(false,c);
      else{c.style.transition='transform .25s';c.style.transform='';yes.style.opacity=0;no.style.opacity=0;setTimeout(()=>c.style.transition='',260);}
      dx=0;
    });
  }
  function decide(like,c){
    (like?R.swipeYes:R.swipeNo).push(cards[i].t);
    c.style.transition='transform .35s, opacity .35s';
    c.style.transform=`translateX(${like?120:-120}vw) rotate(${like?30:-30}deg)`;
    c.style.opacity='0';
    i++;setTimeout(render,240);
  }
  d.querySelector('.round.yes').onclick=()=>{const c=deck.lastElementChild;if(c)decide(true,c);};
  d.querySelector('.round.no').onclick=()=>{const c=deck.lastElementChild;if(c)decide(false,c);};
  render();
});

  options:['Pop 🎧','Rap FR 🇫🇷','R&B 💫','Rock 🎸','Électro 🔊','Latino 🔥','Afro 🥁','Old school 📻','Chanson française 🥖','Jazz / soul 🎷','Un peu de tout 🎲']
}));

/* ============ MANOIR · survival ============ */
S('t-re',d=>{
  const veil=document.createElement('div');veil.className='redveil';
  document.body.appendChild(veil);
  let step=0;
  const scenes=[
    {
      t:'Un manoir. Une porte qui grince. Quelque chose <em>gratte</em> de l\'autre côté…',
      s:'Inventaire : 1 spray au poivre 🌶️ · 1 sandwich 🥪 · ton courage (stock limité)',
      ch:['🚪 Ouvrir la porte d\'un coup','🤫 Regarder par le trou de la serrure','🥪 Glisser le sandwich sous la porte','🪑 Barricader et faire comme si de rien n\'était'],
      key:'manoir1'
    },
    {
      t:'La porte s\'ouvre toute seule. Un grognement. <em>« Grrraaah… »</em>',
      s:'Ton cœur : 180 bpm. Tes options : discutables.',
      ch:['🌶️ SPRAY AU POIVRE !!','🗣️ Négocier poliment','🏃‍♀️ Fuite stratégique (= courir en criant)','🤝 Proposer un câlin'],
      key:'manoir2'
    }
  ];
  function show(){
    if(step>=scenes.length){
      d.innerHTML=`<div style="text-align:center;font-size:100px">🍌🧟</div>
        <h2 style="text-align:center">C'était… une banane zombie ?</h2>
        <p class="sub" style="text-align:center">Elle voulait juste rejoindre le jeu.<br>Elle a un rôle important à la fin, paraît-il.</p>
        <button class="btn">Ok. Bizarre. On continue →</button>`;
      d.querySelector('.btn').onclick=()=>{veil.remove();next();};
      confetti();
      return;
    }
    const sc=scenes[step];
    d.innerHTML=`
      <div class="eyebrow">Chapitre interdit · survie</div>
      <div class="ammo">❤️❤️🖤 · spray : ${step===0?'1':'?'} </div>
      <h2>${sc.t}</h2>
      <p class="sub">${sc.s}</p>
      <div class="choices"></div>`;
    const box=d.querySelector('.choices');
    sc.ch.forEach(c=>{
      const b=document.createElement('button');b.className='choice';b.textContent=c;
      b.onclick=()=>{R[sc.key]=c;step++;d.classList.add('shake');setTimeout(()=>{d.classList.remove('shake');show();},450);};
      box.appendChild(b);
    });
  }
  show();
});

/* ============ FRÉNÉSIE BANANE · savane jaune ============ */
S('t-savane',d=>{
  d.innerHTML=`
    <div class="eyebrow">Monde 13 · Frénésie</div>
    <h2>Tape la banane un <em>maximum</em> de fois en 5 secondes 🍌</h2>
    <p class="sub" id="bInfo">Record du monde à battre : 47. (probablement faux)</p>
    <div id="banZone"><div id="banane">🍌</div></div>
    <button class="btn" id="bGo">GO 🍌⚡️</button>`;
  const ban=d.querySelector('#banane'),info=d.querySelector('#bInfo'),
        zone=d.querySelector('#banZone'),btn=d.querySelector('#bGo');
  let taps=0,run=false;
  ban.onpointerdown=()=>{
    if(!run)return;
    taps++;info.textContent=taps+' 🍌';
    const p=document.createElement('div');p.className='pluie';p.textContent='🍌';
    p.style.left=Math.random()*90+'%';
    zone.appendChild(p);setTimeout(()=>p.remove(),1600);
  };
  btn.onclick=function(){
    if(run)return;run=true;taps=0;
    let t=5;this.textContent='5s !';
    const iv=setInterval(()=>{
      t--;this.textContent=t+'s !';
      if(t<=0){
        clearInterval(iv);run=false;
        R.banane=taps+' bananes en 5s';
        info.innerHTML=`<b style="color:var(--acc)">${taps} bananes ! ${taps>=47?'RECORD BATTU 🌍🏆':'Honorable. 🍌'}</b>`;
        confetti();
        this.textContent='Continuer →';this.onclick=next;
      }
    },1000);
  };
});

/* ============ CARTE BLANCHE · nuit ============ */
S(null,d=>{
  d.innerHTML=`
    <div class="eyebrow">Dernier monde · Carte blanche</div>
    <h2>Décris ta sortie <em>parfaite</em> en une phrase.</h2>
    <p class="sub">La vraie. Celle que tu n'oses jamais proposer.</p>
    <input type="text" id="ideal" placeholder="Ex : glace, pieds dans l'eau, playlist parfaite…">
    <h2 style="margin-top:10px">Et un endroit où tu <em>rêves</em> d'aller (pas loin, hein) ?</h2>
    <input type="text" id="reve" placeholder="Ex : ce resto dont tout le monde parle, une île, un rooftop…">
    <button class="btn">Voir mes résultats 🏆</button>`;
  d.querySelector('.btn').onclick=()=>{
    R.ideal=d.querySelector('#ideal').value.trim()||'(elle garde le mystère…)';
    R.reve=d.querySelector('#reve').value.trim()||'(surprise totale acceptée)';
    next();
  };
});
