<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tournoi - Battle Dock</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    input { -webkit-user-select:text; user-select:text; }

    body {
      font-family:'Inter',sans-serif;
      background:linear-gradient(160deg,#1a0533 0%,#0d1a4a 40%,#003322 100%);
      min-height:100vh; padding-bottom:40px;
    }

    /* ANIMATEUR TV */
    .animator {
      position:fixed; bottom:16px; right:12px; z-index:50;
      display:flex; flex-direction:column; align-items:flex-end;
      pointer-events:none; gap:8px;
    }
    .animator-bubble {
      background:white;
      border-radius:20px 20px 6px 20px;
      padding:12px 16px;
      font-size:13px; font-weight:600; color:#1a1a1a;
      line-height:1.4; max-width:220px; text-align:right;
      box-shadow:0 8px 32px rgba(0,0,0,0.25), 0 2px 8px rgba(0,0,0,0.15);
      position:relative;
      animation:bubblePop 0.4s cubic-bezier(0.34,1.56,0.64,1);
    }
    .animator-bubble::after {
      content:'';
      position:absolute; bottom:-8px; right:20px;
      width:0; height:0;
      border-left:8px solid transparent;
      border-right:0px solid transparent;
      border-top:8px solid white;
    }
    @keyframes bubblePop { from{transform:scale(0.6) translateY(10px);opacity:0} to{transform:scale(1) translateY(0);opacity:1} }
    .animator-char {
      width:72px; height:72px;
      border-radius:50%; object-fit:cover;
      border:3px solid white;
      box-shadow:0 6px 20px rgba(0,0,0,0.4);
      animation:charIdle 2.5s ease-in-out infinite;
      background:white;
    }
    @keyframes charIdle {
      0%,100%{transform:translateY(0) rotate(-2deg)}
      50%{transform:translateY(-8px) rotate(2deg)}
    }

    /* ANIMATEUR TV */
    /* CONFETTIS BG */
    .bg-confetti { position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
    .confetti-piece { position:absolute; width:8px; height:8px; border-radius:2px; opacity:0.4; animation:confettiFall linear infinite; }
    @keyframes confettiFall {
      0%   { transform:translateY(-20px) rotate(0deg); opacity:0.4; }
      100% { transform:translateY(110vh) rotate(720deg); opacity:0; }
    }

    /* HEADER */
    .header {
      position:relative; z-index:10;
      background:rgba(0,0,0,0.4); backdrop-filter:blur(16px);
      border-bottom:1px solid rgba(255,255,255,0.1);
      padding:14px 16px; display:flex; align-items:center; gap:12px;
    }
    .back-btn { background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.15); border-radius:8px; padding:8px 12px; font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:1px; color:white; cursor:pointer; }
    .header-title { font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:2px; color:white; flex:1; }
    .countdown-badge {
      background:linear-gradient(135deg,#7c3aed,#a855f7);
      color:white; font-weight:700; font-size:11px; padding:5px 12px; border-radius:20px;
      font-family:'Bebas Neue',sans-serif; letter-spacing:1px;
    }

    /* HERO */
    .hero {
      position:relative; z-index:1;
      padding:24px 16px 20px; text-align:center;
    }
    .hero-logo { font-size:56px; margin-bottom:8px; filter:drop-shadow(0 0 20px rgba(251,191,36,0.6)); animation:logoFloat 3s ease-in-out infinite; }
    @keyframes logoFloat { 0%,100%{transform:translateY(0) rotate(-3deg)} 50%{transform:translateY(-8px) rotate(3deg)} }
    .hero-title { font-family:'Bebas Neue',sans-serif; font-size:42px; letter-spacing:5px; color:white; text-shadow:0 0 30px rgba(251,191,36,0.4); line-height:1; }
    .hero-sub { font-size:13px; color:rgba(255,255,255,0.5); margin-top:6px; }

    /* STATS BAR */
    .stats-bar {
      position:relative; z-index:1;
      display:flex; gap:10px; padding:0 16px 16px;
    }
    .stat-card {
      flex:1; border-radius:14px; padding:12px 8px; text-align:center;
    }
    .stat-card.s1 { background:linear-gradient(135deg,rgba(251,191,36,0.2),rgba(245,158,11,0.1)); border:1px solid rgba(251,191,36,0.3); }
    .stat-card.s2 { background:linear-gradient(135deg,rgba(99,102,241,0.2),rgba(79,70,229,0.1)); border:1px solid rgba(99,102,241,0.3); }
    .stat-card.s3 { background:linear-gradient(135deg,rgba(239,68,68,0.2),rgba(220,38,38,0.1)); border:1px solid rgba(239,68,68,0.3); }
    .stat-val { font-family:'Bebas Neue',sans-serif; font-size:20px; color:white; letter-spacing:0.5px; }
    .stat-lbl { font-size:9px; color:rgba(255,255,255,0.4); text-transform:uppercase; letter-spacing:1px; font-weight:700; margin-top:2px; }

    /* ZONE JEU */
    .game-zone { position:relative; z-index:1; padding:0 16px 16px; display:flex; flex-direction:column; align-items:center; gap:14px; }

    /* DOTS ESSAIS */
    .attempts-row { display:flex; gap:10px; justify-content:center; }
    .a-dot { width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; flex-direction:column; gap:1px; }
    .a-dot.pending  { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); color:rgba(255,255,255,0.3); }
    .a-dot.active   { background:linear-gradient(135deg,#7c3aed,#a855f7); border:none; color:white; box-shadow:0 4px 16px rgba(168,85,247,0.4); animation:aPulse 1s ease-in-out infinite; }
    .a-dot.done-great { background:linear-gradient(135deg,#16a34a,#22c55e); border:none; color:white; box-shadow:0 4px 12px rgba(34,197,94,0.3); }
    .a-dot.done-ok    { background:linear-gradient(135deg,#d97706,#fbbf24); border:none; color:white; box-shadow:0 4px 12px rgba(251,191,36,0.3); }
    .a-dot.done-bad   { background:linear-gradient(135deg,#dc2626,#ef4444); border:none; color:white; box-shadow:0 4px 12px rgba(239,68,68,0.3); }
    @keyframes aPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }

    /* ITEM CARD */
    .item-card {
      width:100%; max-width:440px;
      background:rgba(255,255,255,0.08);
      backdrop-filter:blur(20px);
      border:1px solid rgba(255,255,255,0.15);
      border-radius:24px; padding:28px 24px; text-align:center;
      box-shadow:0 8px 32px rgba(0,0,0,0.3);
      position:relative; overflow:hidden;
    }
    .item-card::before {
      content:''; position:absolute; inset:0;
      background:radial-gradient(circle at 50% -20%, rgba(251,191,36,0.08), transparent 60%);
    }
    .item-num { position:absolute; top:12px; right:14px; font-size:10px; font-weight:700; color:rgba(255,255,255,0.3); text-transform:uppercase; letter-spacing:1px; }
    .item-emoji { font-size:72px; margin-bottom:14px; filter:drop-shadow(0 4px 16px rgba(0,0,0,0.4)); animation:itemBob 2s ease-in-out infinite; }
    @keyframes itemBob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
    .item-name { font-family:'Bebas Neue',sans-serif; font-size:24px; letter-spacing:2px; color:white; margin-bottom:8px; }
    .item-desc { font-size:13px; color:rgba(255,255,255,0.55); line-height:1.6; margin-bottom:8px; }
    .item-hint {
      display:inline-block;
      background:rgba(251,191,36,0.15); border:1px solid rgba(251,191,36,0.25);
      color:#fbbf24; font-size:11px; font-weight:600;
      padding:4px 12px; border-radius:20px; margin-top:4px;
    }

    /* INPUT PRIX */
    .price-wrap { width:100%; max-width:440px; }
    .price-label { font-size:12px; color:rgba(255,255,255,0.5); font-weight:700; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; text-align:center; }
    .price-field-wrap {
      display:flex; align-items:center;
      background:rgba(255,255,255,0.1); backdrop-filter:blur(10px);
      border:2px solid rgba(255,255,255,0.2);
      border-radius:16px; overflow:hidden; transition:border 0.2s;
    }
    .price-field-wrap:focus-within { border-color:rgba(251,191,36,0.6); }
    .price-field { flex:1; background:none; border:none; padding:16px 16px; font-size:28px; font-weight:800; color:white; font-family:'Bebas Neue',sans-serif; letter-spacing:2px; outline:none; text-align:center; }
    .price-field::placeholder { color:rgba(255,255,255,0.2); }
    .price-euro { font-family:'Bebas Neue',sans-serif; font-size:28px; color:rgba(251,191,36,0.7); padding-right:16px; }

    /* BOUTON VALIDER */
    .validate-btn {
      width:100%; max-width:440px; height:64px; border:none; border-radius:18px;
      font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:3px;
      cursor:pointer; transition:all 0.15s; position:relative; overflow:hidden;
      background:linear-gradient(135deg,#f59e0b,#fbbf24,#f59e0b);
      color:#1a0a00; box-shadow:0 6px 24px rgba(251,191,36,0.4);
      font-weight:900;
    }
    .validate-btn:active { transform:scale(0.97); }
    .validate-btn:disabled { background:rgba(255,255,255,0.08); color:rgba(255,255,255,0.2); box-shadow:none; cursor:not-allowed; }
    .validate-btn.green { background:linear-gradient(135deg,#16a34a,#22c55e); color:white; box-shadow:0 6px 24px rgba(34,197,94,0.4); }

    /* RÉSULTAT */
    .result-card {
      width:100%; max-width:440px;
      border-radius:24px; padding:24px 20px; text-align:center;
      backdrop-filter:blur(20px);
      animation:resultPop 0.5s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes resultPop { from{transform:scale(0.7);opacity:0} to{transform:scale(1);opacity:1} }
    .result-card.perfect { background:linear-gradient(135deg,rgba(251,191,36,0.25),rgba(245,158,11,0.1)); border:2px solid rgba(251,191,36,0.5); box-shadow:0 8px 32px rgba(251,191,36,0.2); }
    .result-card.great   { background:linear-gradient(135deg,rgba(34,197,94,0.25),rgba(22,163,74,0.1));  border:2px solid rgba(34,197,94,0.5);  box-shadow:0 8px 32px rgba(34,197,94,0.2); }
    .result-card.good    { background:linear-gradient(135deg,rgba(99,102,241,0.25),rgba(79,70,229,0.1)); border:2px solid rgba(99,102,241,0.5); box-shadow:0 8px 32px rgba(99,102,241,0.2); }
    .result-card.bad     { background:linear-gradient(135deg,rgba(239,68,68,0.25),rgba(220,38,38,0.1));  border:2px solid rgba(239,68,68,0.5);  box-shadow:0 8px 32px rgba(239,68,68,0.2); }
    .result-emoji  { font-size:52px; margin-bottom:8px; }
    .result-grade  { font-family:'Bebas Neue',sans-serif; font-size:28px; letter-spacing:3px; margin-bottom:4px; color:white; }
    .result-score  { font-family:'Bebas Neue',sans-serif; font-size:52px; color:white; letter-spacing:1px; margin-bottom:8px; line-height:1; }
    .result-detail { font-size:13px; color:rgba(255,255,255,0.5); line-height:1.6; }
    .result-record { color:#fbbf24; font-weight:800; font-size:14px; margin-top:6px; }

    /* CLASSEMENT */
    .section { position:relative; z-index:1; padding:0 16px 20px; }
    .section-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
    .section-lbl { font-size:11px; font-weight:700; color:rgba(255,255,255,0.4); text-transform:uppercase; letter-spacing:1px; }
    .refresh-btn { background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.12); color:rgba(255,255,255,0.5); font-size:12px; font-weight:700; padding:5px 12px; border-radius:20px; cursor:pointer; }
    .rank-row { display:flex; align-items:center; gap:12px; background:rgba(255,255,255,0.06); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,0.08); border-radius:14px; padding:12px 14px; margin-bottom:8px; }
    .rank-row.me { background:rgba(251,191,36,0.1); border-color:rgba(251,191,36,0.3); }
    .rank-num { font-family:'Bebas Neue',sans-serif; font-size:18px; color:rgba(255,255,255,0.4); width:28px; text-align:center; flex-shrink:0; }
    .rank-num.gold   { color:#fbbf24; }
    .rank-num.silver { color:#94a3b8; }
    .rank-num.bronze { color:#cd7f32; }
    .rank-avatar { width:36px; height:36px; border-radius:50%; object-fit:cover; flex-shrink:0; border:2px solid rgba(255,255,255,0.1); }
    .rank-info { flex:1; }
    .rank-name  { font-weight:700; font-size:14px; color:white; }
    .rank-sub   { font-size:11px; color:rgba(255,255,255,0.3); margin-top:1px; }
    .rank-score { font-family:'Bebas Neue',sans-serif; font-size:16px; color:#fbbf24; letter-spacing:0.5px; }

    /* FINI */
    .done-card {
      position:relative; z-index:1; margin:0 16px 20px;
      background:rgba(255,255,255,0.08); backdrop-filter:blur(20px);
      border:1px solid rgba(255,255,255,0.15); border-radius:24px;
      padding:32px 20px; text-align:center;
    }
    .done-icon  { font-size:56px; margin-bottom:10px; }
    .done-title { font-family:'Bebas Neue',sans-serif; font-size:30px; letter-spacing:2px; color:white; margin-bottom:6px; }
    .done-score { font-family:'Bebas Neue',sans-serif; font-size:48px; color:#fbbf24; margin:8px 0 4px; filter:drop-shadow(0 0 16px rgba(251,191,36,0.4)); }
    .done-sub   { font-size:13px; color:rgba(255,255,255,0.4); line-height:1.6; }

    .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.8); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.1); color:white; padding:12px 20px; border-radius:20px; font-size:13px; font-weight:600; z-index:200; opacity:0; transition:opacity 0.3s; white-space:nowrap; }
    .toast.show { opacity:1; }
    .toast.success { background:rgba(22,163,74,0.9); }
    .toast.error   { background:rgba(239,68,68,0.9); }
  
    /* ANIMATEUR TV */
    .animator {
      position:fixed; bottom:0; right:0; z-index:50;
      display:flex; flex-direction:column; align-items:flex-end;
      pointer-events:none;
    }
    .animator-bubble {
      background:white; color:#1a1a1a;
      border-radius:18px 18px 4px 18px;
      padding:10px 14px; margin-bottom:8px; margin-right:70px;
      font-size:13px; font-weight:700; line-height:1.4;
      box-shadow:0 4px 20px rgba(0,0,0,0.3);
      max-width:200px; text-align:right;
      animation:bubblePop 0.4s cubic-bezier(0.34,1.56,0.64,1);
      pointer-events:none;
    }
    @keyframes bubblePop { from{transform:scale(0);opacity:0} to{transform:scale(1);opacity:1} }
    .animator-char {
      width:64px; height:64px; margin-right:8px; margin-bottom:4px;
      border-radius:50%; object-fit:cover;
      filter:drop-shadow(0 4px 12px rgba(0,0,0,0.5));
      animation:charIdle 2s ease-in-out infinite;
    }
    @keyframes charIdle { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }

  </style>
</head>

      { emoji:'🦩', name:'Flamant rose gonflable XXL 2m', desc:'Stabilité en cas de vent : nulle. Instagram : parfait.', hint:'Instagram vs réalité', price:37 },
      { emoji:'🐳', name:'Son de baleine en bouteille', desc:'QR code vers 3h de chants de baleines bosse. Format WAV.', hint:'Détente ou cauchemar au choix', price:8 },
      { emoji:'🧭', name:'Boussole de poche rétro', desc:'Pointe vers le nord, sauf près du frigo ou de la télé.', hint:'Utile si vous vous perdez chez vous', price:31 },
      { emoji:'🪸', name:'Aquarium de bureau 5 litres', desc:'Livré avec gravier et plante plastique. Poisson non inclus.', hint:'Zen mais désespérément vide', price:42 },
      { emoji:'🦀', name:'Pince de homard empaillée', desc:'Trouvée sur une plage bretonne. Odeur de souvenir garantie.', hint:'Original mais questionnable', price:16 },
      { emoji:'🚤', name:'Hélice de hors-bord d\'occasion', desc:'3 pales, légèrement tordue. Vendue comme œuvre d\'art.', hint:'Art industriel maritime tendance', price:73 },
      { emoji:'🐬', name:'Dauphin résine lumineuse', desc:'Change de couleur la nuit. Yeux légèrement inquiétants.', hint:'Pour les enfants ou les adultes bizarres', price:49 },
      { emoji:'🗿', name:'Tête de Neptune en béton 40cm', desc:'Regard sévère, parfait pour surveiller le jardin la nuit.', hint:'Art de jardin discutable', price:88 },
      { emoji:'🌡️', name:'Thermomètre marin antique cuivre', desc:'Années 1950. Indique une température approximative.', hint:'Vintage = cher même si inutile', price:165 },
      { emoji:'⛓️', name:'Chaîne d\'ancre miniature acier', desc:'50cm, chromé. Pour collier ou usage mystérieux.', hint:'Fashion ou fonctionnel, à vous de choisir', price:55 },
      { emoji:'🐋', name:'Squelette de poisson encadré', desc:'30cm, bois flotté, trouvé à Biarritz. Signé "M. le pêcheur".', hint:'Entre science et décoration', price:38 },
    ];

    let currentUser = null;
    let myRecord = null;
    let attemptsLeft = MAX_ATTEMPTS;
    let currentItem = null;
    let sessionScores = [];
    let usedItemIndices = [];


    // ANIMATEUR TV
    const ANIMATOR_LINES = {
      welcome: [
        "Bienvenue dans Le Juste Prix ! 🎉",
        "Prêt à devenir millionnaire ?",
        "Ici on blague, mais le score lui est vrai !",
      ],
      start: [
        "Et c'est parti ! Concentrez-vous !",
        "Votre prix, vos regrets, votre gloire !",
        "Le public retient son souffle... ou pas.",
        "Attention, question piège en vue !",
      ],
      perfect: [
        "INCROYABLE ! Vous êtes un génie ou vous trichez ?!",
        "LE PUBLIC EST EN DÉLIRE ! 🎊",
        "Voilà quelqu'un qui connaît ses prix !",
        "Je pleure de joie là... vraiment.",
      ],
      great: [
        "Excellent ! Vous avez l'instinct du shopping !",
        "Presque parfait ! Vous faites les courses vous-même ?",
        "Le public applaudit poliment.",
        "Bravo ! Votre femme serait fière.",
      ],
      good: [
        "Pas mal... mais on peut faire mieux !",
        "Hm. Le public reste sur sa faim.",
        "C'est dans la bonne direction au moins !",
        "On ne gagne pas Paris avec ça mais bon...",
      ],
      bad: [
        "Aïe. C'était... audacieux comme prix.",
        "Le public compatit. Enfin... presque.",
        "Vous faites vos courses où exactement ?!",
        "C'est pas grave, il reste des essais !",
        "Mon chien aurait trouvé mieux. Je dis ça je dis rien.",
      ],
      done: [
        "C'est terminé pour aujourd'hui ! On revient demain !",
        "Revenez demain, on aura de nouveaux articles absurdes !",
        "Bonne performance ! Le jury délibère... au bistrot.",
      ],
      attempts_left_1: [
        "DERNIER ESSAI ! Tout se joue maintenant !",
        "La pression est à son comble ! Respirez !",
        "Un seul essai restant... pas de pression hein.",
      ]
    };

    function showAnimatorLine(category) {
      const lines = ANIMATOR_LINES[category];
      if (!lines) return;
      const line = lines[Math.floor(Math.random() * lines.length)];
      const bubble = document.getElementById('animatorBubble');
      if (!bubble) return;
      bubble.textContent = line;
      bubble.style.display = 'block';
      bubble.style.animation = 'none';
      bubble.offsetHeight;
      bubble.style.animation = 'bubblePop 0.4s cubic-bezier(0.34,1.56,0.64,1)';
      clearTimeout(window._animatorTimeout);
      window._animatorTimeout = setTimeout(() => { bubble.style.display = 'none'; }, 4000);
    }

    // CONFETTIS
    function initConfetti() {
      const colors = ['#ef4444','#f59e0b','#22c55e','#3b82f6','#a855f7','#ec4899','#fbbf24'];
      const container = document.getElementById('bgConfetti');
      for(let i=0;i<25;i++) {
        const el = document.createElement('div');
        el.className = 'confetti-piece';
        el.style.cssText = `left:${Math.random()*100}%;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${6+Math.random()*8}s;animation-delay:${Math.random()*8}s;width:${4+Math.random()*8}px;height:${4+Math.random()*8}px;border-radius:${Math.random()>0.5?'50%':'2px'}`;
        container.appendChild(el);
      }
    }

    // COUNTDOWN
    function updateCountdown() {
      const now = new Date();
      const diff = END_DATE - now;
      const badge = document.getElementById('heroBadge');
      if (!badge) return;
      if (diff <= 0) { badge.textContent = '🏁 Tournoi terminé'; return; }
      const h = Math.floor(diff/3600000);
      const m = Math.floor((diff%3600000)/60000);
      const s = Math.floor((diff%60000)/1000);
      badge.textContent = `⏱ ${h}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`;
      setTimeout(updateCountdown, 1000);
    }

    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { window.location.href = 'index.html'; return; }
      currentUser = session.user;

      const { data } = await sb.from('tournament_scores').select('*').eq('user_id', currentUser.id).maybeSingle();
      if (data) {
        myRecord = data;
        const today = new Date().toISOString().split('T')[0];
        if (data.last_attempt_date !== today) {
          await sb.from('tournament_scores').update({ attempts_today:0, last_attempt_date:today }).eq('user_id', currentUser.id);
          myRecord.attempts_today = 0;
        }
        attemptsLeft = MAX_ATTEMPTS - (myRecord.attempts_today || 0);
      } else {
        attemptsLeft = MAX_ATTEMPTS;
      }

      updateStatsBar();
      loadLeaderboard();
      renderMain();
      initConfetti();
      updateCountdown();
      setTimeout(() => showAnimatorLine("welcome"), 1000);
    }

    function updateStatsBar() {
      document.getElementById('attemptsRemain').textContent = Math.max(0, attemptsLeft);
      document.getElementById('myBestScore').textContent = myRecord?.score != null ? parseFloat(myRecord.score).toFixed(4)+'%' : '--';
    }

    function renderMain() {
      if (attemptsLeft <= 0) { renderDone(); return; }
      pickRandomItem();
      renderGame();
    }

    function pickRandomItem() {
      let idx, tries = 0;
      do { idx = Math.floor(Math.random()*ITEMS.length); tries++; }
      while (usedItemIndices.includes(idx) && tries < 50);
      usedItemIndices.push(idx);
      currentItem = ITEMS[idx];
    }

    function getDotsHtml(activeIdx) {
      const used = MAX_ATTEMPTS - attemptsLeft;
      return Array.from({length:MAX_ATTEMPTS},(_,i) => {
        if (i < used) {
          const s = sessionScores[i];
          const cls = s != null ? (s >= 80 ? 'done-great' : s >= 50 ? 'done-ok' : 'done-bad') : 'done-ok';
          const label = s != null ? s.toFixed(0)+'%' : '✓';
          return `<div class="a-dot ${cls}">${label}</div>`;
        } else if (i === used && attemptsLeft > 0) {
          return `<div class="a-dot active">${i+1}</div>`;
        } else {
          return `<div class="a-dot pending">${i+1}</div>`;
        }
      }).join('');
    }

    function renderGame() {
      const used = MAX_ATTEMPTS - attemptsLeft;
      document.getElementById('mainContent').innerHTML = `
        <div class="game-zone">
          <div class="attempts-row">${getDotsHtml(used)}</div>
          <div class="item-card">
            <div class="item-num">Item ${used+1}/${MAX_ATTEMPTS}</div>
            <div class="item-emoji">${currentItem.emoji}</div>
            <div class="item-name">${currentItem.name}</div>
            <div class="item-desc">${currentItem.desc}</div>
            <div class="item-hint">💡 ${currentItem.hint}</div>
          </div>
          <div class="price-wrap">
            <div class="price-label">💶 Quel est le vrai prix ?</div>
            <div class="price-field-wrap">
              <input class="price-field" id="priceInput" type="number" placeholder="???" min="0" max="99999" onkeydown="if(event.key==='Enter')validate()">
              <div class="price-euro">€</div>
            </div>
          </div>
          <button class="validate-btn" onclick="validate()">🎯 Valider !</button>
        </div>`;
      setTimeout(() => { const el = document.getElementById('priceInput'); if(el) el.focus(); }, 150);
      setTimeout(() => showAnimatorLine("start"), 800);
    }

    async function validate() {
      const input = document.getElementById('priceInput');
      const guess = parseFloat(input?.value);
      if (!guess || guess <= 0) { showToast('Entre un prix !', 'error'); return; }

      document.querySelector('.validate-btn').disabled = true;

      const real = currentItem.price;
      const diff = Math.abs(guess - real);
      const precision = parseFloat(Math.max(0, (1 - diff / real) * 100).toFixed(4));

      sessionScores.push(precision);
      attemptsLeft--;
      await saveScore(precision);
      loadLeaderboard();
      updateStatsBar();
      renderResult(precision, real, guess);
    }

    function renderResult(precision, real, guess) {
      let cls, emoji, grade;
      if (precision >= 95)      { cls='perfect'; emoji='🎯'; grade='PARFAIT !'; showAnimatorLine('perfect'); }
      else if (precision >= 75) { cls='great';   emoji='🔥'; grade='EXCELLENT !'; showAnimatorLine('great'); }
      else if (precision >= 40) { cls='good';    emoji='👍'; grade='PAS MAL !'; showAnimatorLine('good'); }
      else                       { cls='bad';     emoji='💀'; grade='RATÉ !'; showAnimatorLine('bad'); }

      const isRecord = precision > parseFloat(myRecord?.score || 0);
      const used = MAX_ATTEMPTS - attemptsLeft;

      document.getElementById('mainContent').innerHTML = `
        <div class="game-zone">
          <div class="attempts-row">${getDotsHtml(used)}</div>
          <div class="result-card ${cls}">
            <div class="result-emoji">${emoji}</div>
            <div class="result-grade">${grade}</div>
            <div class="result-score">${precision.toFixed(4)}%</div>
            <div class="result-detail">
              Vrai prix : <strong style="color:white">${real}€</strong><br>
              Ta réponse : <strong style="color:white">${guess}€</strong><br>
              Écart : <strong style="color:white">${Math.abs(real-guess)}€</strong>
            </div>
            ${isRecord ? '<div class="result-record">🏆 Nouveau record personnel !</div>' : ''}
          </div>
          ${attemptsLeft > 0
            ? `<button class="validate-btn green" onclick="nextRound()">▶ Essai suivant (${attemptsLeft} restant${attemptsLeft>1?'s':''})</button>`
            : `<button class="validate-btn" onclick="renderDone()" style="background:rgba(255,255,255,0.1);color:white">Voir mon résultat final →</button>`
          }
        </div>`;
    }

    function nextRound() { pickRandomItem(); renderGame(); }

    function renderDone() { showAnimatorLine('done');
      const best = myRecord?.score != null ? parseFloat(myRecord.score).toFixed(4) : '--';
      document.getElementById('mainContent').innerHTML = `
        <div class="done-card">
          <div class="done-icon">🏁</div>
          <div class="done-title">Essais terminés !</div>
          <div class="done-score">${best}%</div>
          <div class="done-sub">Ton meilleur score est enregistré<br>Reviens demain pour 3 nouveaux essais</div>
        </div>`;
    }

    async function saveScore(precision) {
      const today = new Date().toISOString().split('T')[0];
      const currentBest = parseFloat(myRecord?.score || 0);
      const newBest = Math.max(currentBest, precision);
      const newAttempts = (myRecord?.attempts_today || 0) + 1;
      if (myRecord) {
        await sb.from('tournament_scores').update({ score:newBest, attempts_today:newAttempts, last_attempt_date:today, updated_at:new Date().toISOString() }).eq('user_id', currentUser.id);
        myRecord.score = newBest; myRecord.attempts_today = newAttempts;
      } else {
        await sb.from('tournament_scores').insert({ user_id:currentUser.id, score:precision, attempts_today:1, last_attempt_date:today });
        myRecord = { score:precision, attempts_today:1 };
      }
      document.getElementById('myBestScore').textContent = parseFloat(myRecord.score).toFixed(4) + '%';
    }

    async function loadLeaderboard() {
      const { data: scores } = await sb.from('tournament_scores').select('user_id, score').order('score', { ascending:false }).limit(10);
      if (!scores?.length) return;
      const { data: profiles } = await sb.from('profiles').select('user_id, username, avatar_url').in('user_id', scores.map(s=>s.user_id));
      const pm = {}; (profiles||[]).forEach(p => pm[p.user_id]=p);
      const myIdx = scores.findIndex(s=>s.user_id===currentUser.id);
      if (myIdx >= 0) document.getElementById('myRank').textContent = '#'+(myIdx+1);
      const medals = ['🥇','🥈','🥉'];
      document.getElementById('rankList').innerHTML = scores.map((s,i) => {
        const p = pm[s.user_id]||{username:'Docker',avatar_url:'avatar-default.png'};
        const isMe = s.user_id===currentUser.id;
        const nc = i===0?'gold':i===1?'silver':i===2?'bronze':'';
        return `<div class="rank-row ${isMe?'me':''}">
          <div class="rank-num ${nc}">${medals[i]||(i+1)}</div>
          <img class="rank-avatar" src="${p.avatar_url||'avatar-default.png'}">
          <div class="rank-info">
            <div class="rank-name">${p.username}${isMe?' 👈':''}</div>
            <div class="rank-sub">${parseFloat(s.score).toFixed(4)}%</div>
          </div>
          <div class="rank-score">${parseFloat(s.score).toFixed(2)}%</div>
        </div>`;
      }).join('');
    }

    function showToast(msg, type='') {
      const t = document.getElementById('toast');
      t.textContent=msg; t.className='toast show '+type;
      setTimeout(()=>t.className='toast',2800);
    }

    init();
  </script>
</body>
</html>
