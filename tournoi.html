<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tournoi Hebdo - Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&family=Caveat:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  body { font-family:'Inter',sans-serif; background:#070b14; color:#eaf0ff; min-height:100dvh; padding:0 14px 30px; }
  .bg { position:fixed; inset:0; z-index:0; pointer-events:none; background:radial-gradient(120% 60% at 50% -5%, rgba(59,130,246,0.22), transparent 60%), linear-gradient(180deg,#0c1530,#0a1020 55%,#070b14); }
  .wrap { position:relative; z-index:1; max-width:540px; margin:0 auto; }
  .hdr { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px; padding:14px 4px; background:linear-gradient(180deg,#0a1020,rgba(10,16,32,0.85)); backdrop-filter:blur(8px); }
  .hdr-back { background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.14); color:#fff; width:38px; height:38px; border-radius:11px; font-size:18px; cursor:pointer; flex-shrink:0; }
  .hdr-title { flex:1; font-family:'Bebas Neue',sans-serif; font-size:23px; letter-spacing:2px; background:linear-gradient(135deg,#60a5fa,#fbbf24); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .card { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.09); border-radius:16px; padding:16px; margin-bottom:12px; }
  .sect-lbl { font-size:11px; letter-spacing:1px; text-transform:uppercase; color:rgba(255,255,255,0.45); margin:18px 4px 10px; }
  .hero { text-align:center; padding:20px 16px; border-radius:18px; margin-bottom:12px; background:linear-gradient(160deg,rgba(59,130,246,0.18),rgba(251,191,36,0.06)); border:1px solid rgba(96,165,250,0.4); }
  .week { font-size:12px; color:rgba(255,255,255,0.6); }
  .best { font-family:'Bebas Neue',sans-serif; font-size:50px; color:#fbbf24; line-height:1; margin:6px 0; }
  .best-lbl { font-size:12px; color:rgba(255,255,255,0.55); margin-bottom:12px; }
  .btn { width:100%; border:none; border-radius:14px; padding:15px; font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:1px; cursor:pointer; background:linear-gradient(135deg,#2563eb,#60a5fa); color:#06122e; margin-top:6px; }
  .btn:active{ transform:scale(0.98); }
  .row { display:flex; align-items:center; gap:11px; padding:11px 12px; border-radius:12px; margin-bottom:7px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); }
  .row.me { background:rgba(59,130,246,0.16); border-color:rgba(96,165,250,0.5); }
  .row-num { width:30px; text-align:center; font-family:'Bebas Neue',sans-serif; font-size:18px; color:#fbbf24; flex-shrink:0; }
  .row-av { width:36px; height:36px; border-radius:50%; flex-shrink:0; overflow:hidden; background:#1e293b; }
  .row-av img { width:100%; height:100%; object-fit:cover; }
  .row-name { flex:1; min-width:0; font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row-sc { font-family:'Bebas Neue',sans-serif; font-size:18px; color:#93c5fd; flex-shrink:0; }
  .info { font-size:12.5px; color:rgba(255,255,255,0.5); line-height:1.6; }
  .loader { text-align:center; padding:40px; color:rgba(255,255,255,0.3); font-family:'Bebas Neue',sans-serif; letter-spacing:2px; }
  .back-bottom { width:100%; margin-top:18px; padding:15px; border-radius:14px; cursor:pointer; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12); color:rgba(255,255,255,0.7); font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:2px; }
  .toast { position:fixed; top:18px; left:50%; transform:translateX(-50%) translateY(-20px); z-index:300; background:rgba(12,21,48,0.97); border:1px solid rgba(96,165,250,0.5); border-radius:12px; padding:11px 18px; font-size:13px; font-weight:700; opacity:0; transition:all .35s; max-width:92%; text-align:center; color:#93c5fd; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
  <div class="hdr">
    <button class="hdr-back" onclick="window.location.href='game.html'">←</button>
    <div class="hdr-title">⚔️ TOURNOI HEBDO</div>
  </div>
  <div id="content"><div class="loader">CHARGEMENT…</div></div>
  <button class="back-bottom" onclick="window.location.href='game.html'">← Retour au jeu</button>
</div>
<div class="toast" id="toast"></div>
<script>
  const SB_URL='https://drtsuhnbclhmgfjiykap.supabase.co';
  const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
  const sb=supabase.createClient(SB_URL,SB_KEY);
  const PLAY_SECONDS=10, MONEY_PER_TAP=40, MONEY_CAP=10000, WEEK_DIAMONDS=5;
  let currentUser=null, money=0, diamonds=0, tdata={};
  const fmt=n=>Math.round(n).toLocaleString('fr-FR');

  function weekKey(d){ d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const day=(d.getUTCDay()+6)%7; d.setUTCDate(d.getUTCDate()-day+3); const firstThu=new Date(Date.UTC(d.getUTCFullYear(),0,4)); const wk=1+Math.round(((d-firstThu)/86400000-3+((firstThu.getUTCDay()+6)%7))/7); return d.getUTCFullYear()+'-S'+String(wk).padStart(2,'0'); }
  const WK=weekKey(new Date());

  async function init(){
    const { data:{ session } }=await sb.auth.getSession();
    if(!session){ window.location.href='index.html'; return; }
    currentUser=session.user;
    const { data:gs }=await sb.from('game_stats').select('money,diamonds,tournoi').eq('user_id',currentUser.id).maybeSingle();
    money=gs?.money||0; diamonds=gs?.diamonds||0;
    tdata=(gs?.tournoi&&typeof gs.tournoi==='object')?gs.tournoi:{};
    if(tdata.week!==WK){ tdata.week=WK; tdata.best=0; tdata.plays=0; } // nouvelle semaine
    render();
  }

  function render(){
    document.getElementById('content').innerHTML=`
      <div class="hero">
        <div class="week">Semaine ${WK}</div>
        <div class="best">${fmt(tdata.best||0)}</div>
        <div class="best-lbl">ton meilleur score de la semaine</div>
        <button class="btn" onclick="play()">⚔️ JOUER LE DÉFI (${PLAY_SECONDS}s)</button>
      </div>
      <div class="card info">Tape le plus vite possible pendant ${PLAY_SECONDS} secondes. Ton <b>meilleur score</b> de la semaine te classe. Chaque tentative rapporte de l'argent, et ta première partie de la semaine offre <b>+${WEEK_DIAMONDS} 💎</b>. Le classement repart à zéro chaque lundi !</div>
      <div class="sect-lbl">Classement de la semaine</div>
      <div id="board"><div class="loader">…</div></div>`;
    loadBoard();
  }

  function play(){
    const ov=document.createElement('div');
    ov.style.cssText='position:fixed;inset:0;z-index:300;background:linear-gradient(180deg,#0c1530,#060a16);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;color:#fff';
    ov.innerHTML=`<div style="font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:1px;color:#60a5fa">⚔️ MARTÈLE LE QUAI !</div>
      <div id="tc" style="font-family:'Bebas Neue',sans-serif;font-size:52px;color:#fbbf24;margin:10px 0">0</div>
      <div id="tt" style="font-size:14px;color:rgba(255,255,255,0.6);margin-bottom:18px">${PLAY_SECONDS}.0 s</div>
      <button id="tb" style="width:100%;max-width:420px;border:none;border-radius:18px;padding:46px 16px;font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:2px;background:linear-gradient(135deg,#1e40af,#3b82f6);color:#fff;cursor:pointer">APPUIE VITE !</button>`;
    document.body.appendChild(ov);
    const cEl=ov.querySelector('#tc'), tEl=ov.querySelector('#tt'), b=ov.querySelector('#tb');
    let taps=0, started=false, endT=0;
    function tick(){ const left=Math.max(0,endT-performance.now()); tEl.textContent=(left/1000).toFixed(1)+' s'; if(left<=0){ b.disabled=true; if(ov.parentNode) document.body.removeChild(ov); finishPlay(taps); return; } requestAnimationFrame(tick); }
    b.onpointerdown=(e)=>{ e.preventDefault(); if(!started){ started=true; endT=performance.now()+PLAY_SECONDS*1000; tick(); } taps++; cEl.textContent=taps; b.style.transform='scale(0.97)'; setTimeout(()=>b.style.transform='',40); };
  }

  async function finishPlay(score){
    const reward=Math.min(score*MONEY_PER_TAP, MONEY_CAP);
    try {
      const { data:fresh }=await sb.from('game_stats').select('money,diamonds,tournoi').eq('user_id',currentUser.id).maybeSingle();
      let t=(fresh?.tournoi&&typeof fresh.tournoi==='object')?fresh.tournoi:{};
      if(t.week!==WK){ t.week=WK; t.best=0; t.plays=0; }
      let dGain=0;
      if(t.rewardWeek!==WK){ dGain=WEEK_DIAMONDS; t.rewardWeek=WK; }
      t.plays=(t.plays||0)+1;
      if(score>(t.best||0)) t.best=score;
      const upd={ money:(fresh?.money||0)+reward, tournoi:t };
      if(dGain) upd.diamonds=(fresh?.diamonds||0)+dGain;
      await sb.from('game_stats').update(upd).eq('user_id',currentUser.id);
      money=upd.money; diamonds=upd.diamonds??diamonds; tdata=t;
      showToast(`Score ${score} · +${fmt(reward)} €` + (dGain?` · +${dGain} 💎`:''));
      render();
    } catch(e){ console.log(e); showToast('Erreur, réessaie.'); }
  }

  async function loadBoard(){
    try {
      const { data:rows }=await sb.from('game_stats').select('user_id,tournoi');
      const players=(rows||[]).filter(r=>r.tournoi&&r.tournoi.week===WK&&(r.tournoi.best||0)>0)
        .map(r=>({ uid:r.user_id, best:r.tournoi.best||0 })).sort((a,b)=>b.best-a.best);
      const board=document.getElementById('board'); if(!board) return;
      if(!players.length){ board.innerHTML='<div class="card info">Personne n\'a encore joué cette semaine. Sois le premier à marquer !</div>'; return; }
      const { data:profs }=await sb.from('profiles').select('user_id,username,avatar_url').in('user_id',players.map(p=>p.uid));
      const medals={0:'🥇',1:'🥈',2:'🥉'};
      board.innerHTML=players.slice(0,30).map((p,i)=>{
        const pr=profs?.find(x=>x.user_id===p.uid)||{username:'Docker',avatar_url:'avatar-default.png'};
        const me=p.uid===currentUser.id;
        return `<div class="row ${me?'me':''}"><div class="row-num">${medals[i]||(i+1)}</div><div class="row-av"><img src="${pr.avatar_url||'avatar-default.png'}"></div><div class="row-name">${(pr.username||'Docker')}${me?' 👈':''}</div><div class="row-sc">${fmt(p.best)}</div></div>`;
      }).join('');
    } catch(e){ console.log(e); }
  }

  let toastT; function showToast(m){ const t=document.getElementById('toast'); t.textContent=m; t.className='toast show'; clearTimeout(toastT); toastT=setTimeout(()=>t.className='toast',2800); }
  init();
</script>
</body>
</html>
