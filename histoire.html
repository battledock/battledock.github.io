    .scene-bg { position:fixed; inset:0; z-index:0; overflow:hidden; }

    .header-title { font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:3px; color:rgba(255,255,255,0.5); flex:1; text-align:center; }

    .menu-sub { font-size:12px; color:rgba(255,255,255,0.3); text-align:center; letter-spacing:2px; text-transform:uppercase; margin-bottom:16px; }

    .chapter-card {
      border-radius:16px; overflow:hidden; cursor:pointer;
      transition:transform .15s, box-shadow .15s;
      position:relative;
    }
    .chapter-card:active { transform:scale(0.97); }
    .chapter-card.locked { cursor:default; opacity:0.5; }
    .chapter-card.locked:active { transform:none; }

    .chapter-card.done { border:1px solid rgba(74,222,128,0.2); background:linear-gradient(135deg,#0a1f0a,#0d2a0d); }
    .chapter-card.available { border:1px solid rgba(251,191,36,0.3); background:linear-gradient(135deg,#1a1200,#2a1800); box-shadow:0 4px 20px rgba(251,191,36,0.1); }
    .chapter-card.locked { border:1px solid rgba(255,255,255,0.06); background:rgba(255,255,255,0.03); }

    .chapter-inner { padding:16px 18px; display:flex; align-items:center; gap:14px; }
    .chapter-num { font-family:'Bebas Neue',sans-serif; font-size:36px; color:rgba(255,255,255,0.15); min-width:36px; text-align:center; line-height:1; }
    .chapter-card.done .chapter-num { color:rgba(74,222,128,0.4); }
    .chapter-card.available .chapter-num { color:rgba(251,191,36,0.5); }

    .chapter-info { flex:1; }
    .chapter-title { font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:1.5px; color:white; margin-bottom:3px; }
    .chapter-desc { font-size:11px; color:rgba(255,255,255,0.35); line-height:1.4; }
    .chapter-card.done .chapter-desc { color:rgba(74,222,128,0.5); }

    .chapter-badge { font-size:10px; font-weight:700; padding:4px 10px; border-radius:20px; flex-shrink:0; letter-spacing:0.5px; }
    .badge-done      { background:rgba(74,222,128,0.12); color:#4ade80; }
    .badge-available { background:rgba(251,191,36,0.12); color:#fbbf24; }
    .badge-locked    { background:rgba(255,255,255,0.06); color:rgba(255,255,255,0.3); }

    /* SCÈNE */
    .scene-wrap { position:relative; z-index:2; flex:1; display:flex; flex-direction:column; max-width:500px; margin:0 auto; width:100%; overflow:hidden; }
    .char-zone { flex:1; display:flex; align-items:flex-end; justify-content:center; overflow:hidden; }
    .char-svg { width:200px; height:280px; flex-shrink:0; }

    .dialogue-box { position:relative; z-index:10; flex-shrink:0; background:rgba(10,15,26,0.95); backdrop-filter:blur(20px); border-top:1px solid rgba(255,255,255,0.08); padding:16px 16px 12px; min-height:180px; display:flex; flex-direction:column; gap:10px; }
    .char-name { font-family:'Bebas Neue',sans-serif; font-size:14px; letter-spacing:2px; margin-bottom:2px; }
    .char-name.pasturon { color:#fbbf24; }
    .char-name.vigile   { color:#9ca3af; }
    .char-name.narrateur { color:rgba(255,255,255,0.35); font-style:italic; font-family:'Inter',sans-serif; font-size:11px; letter-spacing:1px; }
    .dialogue-text { font-size:15px; color:rgba(255,255,255,0.88); line-height:1.65; min-height:50px; }
    .dialogue-text.narratif { font-size:13px; color:rgba(255,255,255,0.5); font-style:italic; }

    .choices { display:flex; flex-direction:column; gap:8px; }
    .choice-btn { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:12px 14px; font-size:13px; color:rgba(255,255,255,0.8); cursor:pointer; text-align:left; transition:all .15s; display:flex; align-items:center; gap:10px; }
    .choice-btn:active { background:rgba(255,255,255,0.12); transform:scale(0.98); }
    .choice-icon { font-size:16px; flex-shrink:0; }

    .btn-next { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:14px; width:100%; font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:2px; color:rgba(255,255,255,0.6); cursor:pointer; transition:all .15s; display:flex; align-items:center; justify-content:center; gap:8px; }
    .btn-next:active { background:rgba(255,255,255,0.12); }

    .surnom-input { background:rgba(0,0,0,0.4); border:1px solid rgba(255,255,255,0.15); border-radius:10px; padding:12px 14px; width:100%; font-size:18px; font-weight:700; color:white; font-family:'Bebas Neue',sans-serif; letter-spacing:2px; outline:none; transition:border .2s; }
    .surnom-input:focus { border-color:rgba(251,191,36,0.5); }
    .surnom-input::placeholder { color:rgba(255,255,255,0.2); font-size:14px; letter-spacing:1px; font-family:'Inter',sans-serif; }

    .btn-valider { background:linear-gradient(135deg,#fbbf24,#f59e0b); border:none; border-radius:12px; padding:14px; width:100%; font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:2px; color:#1a0a00; cursor:pointer; transition:all .15s; }
    .btn-valider:active { transform:scale(0.97); }
    .btn-valider:disabled { background:rgba(255,255,255,0.08); color:rgba(255,255,255,0.2); cursor:not-allowed; }

    .badge-icon  { font-size:40px; margin-bottom:6px; }
    .badge-title { font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:2px; color:#fbbf24; }
    .badge-desc  { font-size:11px; color:rgba(255,255,255,0.35); margin-top:4px; }

    // ── MENU ──
    function showMenu() {
      document.getElementById('menuView').style.display = 'flex';
      document.getElementById('sceneView').style.display = 'none';
      document.getElementById('headerTitle').textContent = '📖 HISTOIRE';
      activeChapter = null;
      setNight(false);

      const surnom = progress.surnom || '';
      document.getElementById('menuSub').textContent = surnom ? `🔵 ${surnom} · Port de Marseille` : 'Port de Marseille';

      const list = document.getElementById('chapterList');
      list.innerHTML = '';

      CHAPTERS.forEach(ch => {
        const done      = !!progress[ch.doneKey];
        const available = !ch.requires || !!progress[ch.requires];
        const locked    = !available && !done;

        const card = document.createElement('div');
        card.className = `chapter-card ${done ? 'done' : available ? 'available' : 'locked'}`;

        let badgeText = done ? '✓ TERMINÉ' : available ? '▶ JOUER' : '🔒';
        let badgeClass = done ? 'badge-done' : available ? 'badge-available' : 'badge-locked';

        card.innerHTML = `
          <div class="chapter-inner">
            <div class="chapter-num">${ch.id}</div>
            <div class="chapter-info">
              <div class="chapter-title">${ch.title}</div>
              <div class="chapter-desc">${done ? ch.reward : ch.desc}</div>
            </div>
            <div class="chapter-badge ${badgeClass}">${badgeText}</div>
          </div>`;

        if (available && !done) {
          card.onclick = () => startChapter(ch);
        } else if (done) {
          card.style.cursor = 'default';
        }
        list.appendChild(card);
      });
    }

    // ── CHAPITRE ──
    let currentScenes = [], currentSceneIdx = 0, currentChapter = null;

    function startChapter(ch) {
      currentChapter = ch;
      currentScenes = ch.scenes;
      currentSceneIdx = 0;
      activeChapter = ch;
      document.getElementById('menuView').style.display = 'none';
      document.getElementById('sceneView').style.display = 'flex';
      document.getElementById('headerTitle').textContent = `CH.${ch.id} — ${ch.title.toUpperCase()}`;
      showScene(0);
    }

    function showScene(idx) {
      const s = currentScenes[idx];
      if (!s) return;
      currentSceneIdx = idx;

      // Nuit
      setNight(!!s.night);

      // Personnage
      const charZone = document.getElementById('charZone');
      charZone.innerHTML = SVG[s.char] || '';

      // Nom
      const nameEl = document.getElementById('charName');
      if (s.char === 'narrateur') {
        nameEl.className = 'char-name narrateur'; nameEl.textContent = '—';
      } else if (s.char === 'pasturon') {
        nameEl.className = 'char-name pasturon'; nameEl.textContent = s.name;
      } else if (s.char === 'ferrotti') {
        nameEl.className = 'char-name'; nameEl.style.color = '#a78bfa'; nameEl.textContent = s.name;
      } else {
        nameEl.className = 'char-name vigile'; nameEl.textContent = s.name;
      }

      // Texte
      const textEl = document.getElementById('dialogueText');
      textEl.className = s.char === 'narrateur' ? 'dialogue-text narratif fade-in' : 'dialogue-text fade-in';
      textEl.textContent = s.text;

      // Actions
      const actEl = document.getElementById('actionsZone');
      actEl.innerHTML = '';

      if (s.actions === 'next') {
        const btn = document.createElement('button');
        btn.className = 'btn-next fade-in';
        btn.innerHTML = '▶ Continuer';
        btn.onclick = () => showScene(s.next);
        actEl.appendChild(btn);

      } else if (s.actions === 'choices') {
        const div = document.createElement('div');
        div.className = 'choices fade-in';
        s.choices.forEach(ch => {
          const btn = document.createElement('button');
          btn.className = 'choice-btn';
          btn.innerHTML = `<span class="choice-icon">${ch.icon}</span>${ch.text}`;
          btn.onclick = () => showScene(ch.next);
          div.appendChild(btn);
        });
        actEl.appendChild(div);

      } else if (s.actions === 'surnom') {
        const input = document.createElement('input');
        input.className = 'surnom-input fade-in';
        input.type = 'text'; input.maxLength = 20;
        input.placeholder = 'Ton surnom au port...';
        input.autocomplete = 'off';
        actEl.appendChild(input);
        const btn = document.createElement('button');
        btn.className = 'btn-valider fade-in';
        btn.textContent = "C'est parti !";
        btn.disabled = true;
        btn.style.marginTop = '8px';
        input.addEventListener('input', () => { btn.disabled = input.value.trim().length < 2; });
        btn.onclick = () => {
          surnom = input.value.trim();
          if (surnom.length < 2) return;
          showSurnomReaction();
        };
        actEl.appendChild(btn);
        setTimeout(() => input.focus(), 200);

      } else if (s.actions === 'ch2work') {
        const btn = document.createElement('button');
        btn.className = 'btn-next fade-in';
        btn.style.cssText = 'background:linear-gradient(135deg,#cc2200,#991100);color:white;border:none;font-family:\'Bebas Neue\',sans-serif;font-size:18px;letter-spacing:2px';
        btn.innerHTML = '📦 Aller travailler →';
        btn.onclick = () => {
          sessionStorage.setItem('histoire_ch2_pending', '1');
          window.location.href = 'clicker.html';
        };
        actEl.appendChild(btn);

      } else if (s.actions === 'ovni') {
        document.getElementById('ovni').style.opacity = '1';
        const btn = document.createElement('button');
        btn.className = 'btn-next fade-in';
        btn.innerHTML = '👽 ...';
        btn.onclick = () => {
          document.getElementById('ovni').style.opacity = '0';
          showScene(s.next);
        };
        actEl.appendChild(btn);

      } else if (s.actions === 'ch3end') {
        const btn = document.createElement('button');
        btn.className = 'btn-next fade-in';
        btn.style.cssText = 'background:linear-gradient(135deg,#7c3aed,#a78bfa);color:white;border:none;font-family:\'Bebas Neue\',sans-serif;font-size:18px;letter-spacing:2px';
        btn.innerHTML = '🎰 Entrer au Casino';
        btn.onclick = finishChapter3;
        actEl.appendChild(btn);
      }
    }

    function setNight(on) {
      document.getElementById('nightBg').style.opacity = on ? '0.95' : '0';
      document.getElementById('stars').style.opacity   = on ? '1' : '0';
      if (!on) document.getElementById('ovni').style.opacity = '0';
    }

    // ── SURNOM CH1 ──
    function showSurnomReaction() {
      const responses = [
        `${surnom} ! J'aime bien. Bienvenue au port !`,
        `${surnom} ? Parfait. On t'appellera comme ça.`,
        `${surnom} ! Ferrotti va sûrement y voir un signe cosmique.`,
        `Ah, ${surnom} ! Moi au début on m'appelait "le futur CDI". Bref.`,
      ];
      document.getElementById('charZone').innerHTML = SVG.pasturon;
      document.getElementById('charName').className = 'char-name pasturon';
      document.getElementById('charName').textContent = 'Pasturon';
      document.getElementById('dialogueText').className = 'dialogue-text fade-in';
      document.getElementById('dialogueText').textContent = responses[Math.floor(Math.random()*responses.length)];

      const actEl = document.getElementById('actionsZone');
      actEl.innerHTML = '';
      const badge = document.createElement('div');
      badge.className = 'badge-wrap';
      badge.innerHTML = '<div class="badge-icon">🔵</div><div class="badge-title">Bleu du Port</div><div class="badge-desc">Titre débloqué · Visible sur ton profil</div>';
      actEl.appendChild(badge);
      const btn = document.createElement('button');
      btn.className = 'btn-next'; btn.style.marginTop = '8px';
      btn.innerHTML = '← Terminer le chapitre';
      btn.onclick = finishChapter1;
      actEl.appendChild(btn);
    }

    async function finishChapter1() {
      try {
        const { data: fresh } = await sb.from('game_stats').select('story_progress').eq('user_id', currentUser.id).maybeSingle();
        const newProgress = { ...(fresh?.story_progress||{}), scene1_done:true, surnom };
        await sb.from('game_stats').update({ story_progress: newProgress }).eq('user_id', currentUser.id);
        await sb.from('profiles').update({ bio:`🔵 Bleu du Port · "${surnom}"` }).eq('user_id', currentUser.id);
        progress = newProgress;
      } catch(e) { console.log(e); }
      showMenu();
    }

    // ── CH2 REWARD ──
    async function showRewardCh2() {
      document.getElementById('menuView').style.display = 'none';
      document.getElementById('sceneView').style.display = 'flex';
      document.getElementById('charZone').innerHTML = SVG.pasturon;
      document.getElementById('charName').className = 'char-name pasturon';
      document.getElementById('charName').textContent = 'Pasturon';
      document.getElementById('dialogueText').className = 'dialogue-text fade-in';
      document.getElementById('dialogueText').textContent = "Bien joué ! T'as l'instinct. Moi le premier jour j'avais failli signer mon CDI tellement j'étais bon.";

      const actEl = document.getElementById('actionsZone');
      actEl.innerHTML = '';
      const badge = document.createElement('div');
      badge.className = 'badge-wrap';
      badge.innerHTML = '<div class="badge-icon">⚡</div><div class="badge-title">Premier Jour</div><div class="badge-desc">+500€ · +50 XP · Badge débloqué</div>';
      actEl.appendChild(badge);
      const btn = document.createElement('button');
      btn.className = 'btn-next'; btn.style.marginTop = '8px';
      btn.innerHTML = '← Retour aux chapitres';
      btn.onclick = showMenu;
      actEl.appendChild(btn);

      try {
        const { data: fresh } = await sb.from('game_stats').select('money, xp, story_progress').eq('user_id', currentUser.id).maybeSingle();
        const newProgress = { ...(fresh?.story_progress||{}), scene2_done:true };
        await sb.from('game_stats').update({ money:(fresh?.money||0)+500, xp:(fresh?.xp||0)+50, story_progress:newProgress }).eq('user_id', currentUser.id);
        progress = newProgress;
      } catch(e) { console.log(e); }
    }

    // ── CH3 FINISH ──
    async function finishChapter3() {
      try {
        const { data: fresh } = await sb.from('game_stats').select('story_progress, jetons').eq('user_id', currentUser.id).maybeSingle();
        const newProgress = { ...(fresh?.story_progress||{}), scene3_done:true };
        await sb.from('game_stats').update({ story_progress:newProgress, jetons:(fresh?.jetons||0)+5 }).eq('user_id', currentUser.id);
        progress = newProgress;
      } catch(e) { console.log(e); }

      document.getElementById('charZone').innerHTML = SVG.ferrotti;
      setNight(true);
      document.getElementById('charName').style.color = '#a78bfa';
      document.getElementById('charName').textContent = 'Ferrotti';
      document.getElementById('dialogueText').textContent = "Les dés sont jetés. Bonne chance. Ou plutôt... les astres décideront.";

      const actEl = document.getElementById('actionsZone');
      actEl.innerHTML = '';
      const badge = document.createElement('div');
      badge.className = 'badge-wrap';
      badge.style.cssText = 'border-color:rgba(124,58,237,0.3);background:rgba(124,58,237,0.08)';
      badge.innerHTML = '<div class="badge-icon">🎰</div><div class="badge-title" style="color:#a78bfa">Casino Débloqué</div><div class="badge-desc">+5 jetons offerts par Ferrotti</div>';
      actEl.appendChild(badge);

      const btn1 = document.createElement('button');
      btn1.className = 'btn-next'; btn1.style.cssText = 'margin-top:8px;background:linear-gradient(135deg,#7c3aed,#a78bfa);color:white;border:none';
      btn1.innerHTML = '🎰 Aller au Casino';
      btn1.onclick = () => window.location.href = 'casino.html';
      actEl.appendChild(btn1);

      const btn2 = document.createElement('button');
      btn2.className = 'btn-next'; btn2.style.marginTop = '8px';
      btn2.innerHTML = '← Retour aux chapitres';
      btn2.onclick = showMenu;
      actEl.appendChild(btn2);
    }

    function goBack() {
      if (activeChapter) { showMenu(); }
      else { window.location.href = 'game.html'; }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.className = 'toast show';
      setTimeout(() => t.className = 'toast', 2800);
    }

    async function init() {
      const { data:{ session } } = await sb.auth.getSession();
      if (!session) { window.location.href = 'index.html'; return; }
      currentUser = session.user;

      const { data } = await sb.from('game_stats').select('story_progress').eq('user_id', currentUser.id).maybeSingle();
      progress = data?.story_progress || {};

      // Retour du clicker après ch2
      if (sessionStorage.getItem('histoire_ch2_pending') === '1') {
        sessionStorage.removeItem('histoire_ch2_pending');
        if (!progress.scene2_done) { await showRewardCh2(); return; }
      }

      showMenu();
    }

    init();
  </script>
