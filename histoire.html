<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Histoire - Battle Dock</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    input { -webkit-user-select:text !important; user-select:text !important; }
    html, body { height:100%; overflow:hidden; }
    body { font-family:'Inter',sans-serif; background:#fff; height:100dvh; display:flex; flex-direction:column; color:#0a0a0a; }

    /* FOND PORT */
    .scene-bg { position:fixed; inset:0; z-index:0; overflow:hidden; }

    /* HEADER */


    /* MENU CHAPITRES */
    .menu-wrap { position:relative; z-index:2; flex:1; overflow-y:auto; padding:16px 14px 40px; display:flex; flex-direction:column; gap:10px; max-width:500px; margin:0 auto; width:100%; overscroll-behavior:none; }

    .chapter-card { border-radius:16px; overflow:hidden; position:relative; transition:transform .15s; }
    .chapter-card.available { cursor:pointer; border:1px solid rgba(251,191,36,0.3); background:linear-gradient(135deg,#1a1200,#2a1800); box-shadow:0 4px 20px rgba(251,191,36,0.1); }
    .chapter-card.available:active { transform:scale(0.97); }
    .chapter-card.done { border:1px solid rgba(74,222,128,0.2); background:linear-gradient(135deg,#0a1f0a,#0d2a0d); cursor:default; }
    .chapter-card.locked { border:1px solid rgba(255,255,255,0.06); background:rgba(255,255,255,0.03); opacity:0.5; cursor:default; }

    .chapter-inner { padding:16px 18px; display:flex; align-items:center; gap:14px; }
    .chapter-num { font-family:'Bebas Neue',sans-serif; font-size:32px; min-width:32px; text-align:center; line-height:1; }
    .chapter-card.done .chapter-num     { color:rgba(74,222,128,0.5); }
    .chapter-card.available .chapter-num{ color:rgba(251,191,36,0.6); }
    .chapter-card.locked .chapter-num   { color:rgba(255,255,255,0.2); }

    .chapter-info { flex:1; }
    .chapter-title { font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:1.5px; color:white; margin-bottom:3px; }
    .chapter-desc  { font-size:11px; color:rgba(255,255,255,0.35); line-height:1.4; }
    .chapter-card.done .chapter-desc { color:rgba(74,222,128,0.5); }

    .chapter-badge { font-size:10px; font-weight:700; padding:4px 10px; border-radius:20px; flex-shrink:0; letter-spacing:0.5px; }
    .badge-done      { background:rgba(74,222,128,0.12); color:#4ade80; }
    .badge-available { background:rgba(251,191,36,0.12); color:#fbbf24; }
    .badge-locked    { background:rgba(255,255,255,0.05); color:rgba(255,255,255,0.25); }

    /* ===== CARTE / CHEMIN ===== */
    .map-top { position:sticky; top:0; z-index:6; padding:12px 14px 14px; margin:-16px -14px 0;
      background:linear-gradient(180deg, rgba(18,8,40,0.96) 60%, rgba(18,8,40,0)); }
    .mt-title { font-family:'Permanent Marker',cursive; font-size:21px; color:#fff; text-align:center; text-shadow:0 2px 12px rgba(167,139,250,0.6); }
    .map-top .sp-bar { position:relative; height:9px; border-radius:20px; background:rgba(255,255,255,0.12); overflow:hidden; margin-top:9px; }
    .map-top .sp-fill { height:100%; border-radius:20px; background:linear-gradient(90deg,#a78bfa,#7c3aed,#fbbf24); box-shadow:0 0 12px rgba(167,139,250,0.7); transition:width .6s; }
    .map-top .sp-meta { display:flex; justify-content:space-between; font-size:10.5px; font-weight:700; letter-spacing:0.5px; color:rgba(255,255,255,0.7); margin-top:5px; }

    .road-map { position:relative; width:100%; }
    .road-map svg.scene { position:absolute; inset:0; width:100%; height:100%; display:block; z-index:0; }

    .stop { position:absolute; transform:translate(-50%,-50%); z-index:2; width:122px; text-align:center; }
    .stop-badge { position:relative; width:54px; height:54px; border-radius:50%; margin:0 auto; display:flex; align-items:center; justify-content:center;
      font-family:'Bebas Neue',sans-serif; font-size:22px; border:3px solid; }
    .stop.done .stop-badge { background:radial-gradient(circle at 35% 28%, #4ade80, #15803d); border-color:#bbf7d0; color:#fff; box-shadow:0 5px 16px rgba(34,197,94,0.5); }
    .stop.available .stop-badge { background:radial-gradient(circle at 35% 28%, #fde68a, #f59e0b); border-color:#fff7d6; color:#1a1208; cursor:pointer;
      box-shadow:0 0 0 4px rgba(251,191,36,0.22), 0 5px 18px rgba(251,191,36,0.6); animation:stopPulse 1.6s ease-in-out infinite; }
    .stop.locked .stop-badge { background:radial-gradient(circle at 35% 28%, #4b5563, #1f2937); border-color:rgba(255,255,255,0.16); color:rgba(255,255,255,0.4); }
    @keyframes stopPulse { 0%,100%{ box-shadow:0 0 0 4px rgba(251,191,36,0.2), 0 5px 16px rgba(251,191,36,0.5);} 50%{ box-shadow:0 0 0 9px rgba(251,191,36,0.07), 0 5px 24px rgba(251,191,36,0.95);} }
    .stop-num { position:absolute; top:-8px; right:-8px; width:21px; height:21px; border-radius:50%; background:#1e0a3c; border:2px solid rgba(255,255,255,0.35);
      color:#c4b5fd; font-family:'Bebas Neue',sans-serif; font-size:11px; display:flex; align-items:center; justify-content:center; }
    .stop-label { margin-top:7px; display:inline-block; max-width:120px; font-family:'Bebas Neue',sans-serif; font-size:12px; letter-spacing:0.4px; line-height:1.12; color:#fff;
      background:rgba(10,6,24,0.72); border:1px solid rgba(255,255,255,0.13); border-radius:9px; padding:3px 8px; }
    .stop.locked .stop-label { color:rgba(255,255,255,0.42); }
    .play-flag { position:absolute; top:-28px; left:50%; transform:translateX(-50%); background:#fbbf24; color:#1a1208;
      font-family:'Bebas Neue',sans-serif; font-size:11px; letter-spacing:1px; padding:2px 9px; border-radius:6px; white-space:nowrap; animation:flagBob 1.2s ease-in-out infinite; }
    @keyframes flagBob { 0%,100%{ transform:translateX(-50%) translateY(0);} 50%{ transform:translateX(-50%) translateY(-4px);} }
    .act-flag { position:absolute; transform:translate(-50%,-50%); z-index:1; font-family:'Bebas Neue',sans-serif; font-size:11px; letter-spacing:1px;
      color:#fde68a; background:rgba(30,10,60,0.82); border:1px solid rgba(251,191,36,0.4); border-radius:8px; padding:3px 10px; white-space:nowrap; }
    .map-close { position:fixed; top:12px; right:14px; z-index:32; width:42px; height:42px; border-radius:50%;
      background:rgba(10,6,24,0.72); border:1px solid rgba(255,255,255,0.25); color:#fff; font-size:19px; line-height:1; cursor:pointer;
      backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; box-shadow:0 4px 14px rgba(0,0,0,0.45); }
    .map-close:active { transform:scale(0.94); }

    /* SCÈNE */
    .scene-wrap { position:relative; z-index:2; flex:1; display:flex; flex-direction:column; overflow:hidden; background:#0a1020; }
    .scene-bg { position:absolute; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
    .scene-bg svg { width:100%; height:100%; display:block; }
    .char-zone { flex:1; display:flex; align-items:flex-end; justify-content:center; overflow:hidden; position:relative; z-index:1; }
    .char-svg { width:200px; height:280px; flex-shrink:0; }

    /* DIALOGUE */
    .dialogue-box { position:relative; z-index:10; flex-shrink:0; background:rgba(8,12,20,0.97); backdrop-filter:blur(20px); border-top:1px solid rgba(255,255,255,0.07); padding:16px 16px 14px; display:flex; flex-direction:column; gap:10px; }
    .char-name { font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:2px; margin-bottom:2px; }
    .char-name.gegé     { color:#fbbf24; }
    .char-name.vigile   { color:#9ca3af; }
    .char-name.lavagne  { color:#10b981; }
    .char-name.jeff     { color:#f97316; }
    .char-name.doudou   { color:#eab308; }
    .char-name.titouan  { color:#9ca3af; }
    .char-name.narrateur{ color:rgba(255,255,255,0.3); font-style:italic; font-family:'Inter',sans-serif; font-size:11px; letter-spacing:1px; }
    .dialogue-text { font-size:15px; color:rgba(255,255,255,0.88); line-height:1.65; min-height:44px; }
    .dialogue-text.narratif { font-size:13px; color:rgba(255,255,255,0.45); font-style:italic; }

    /* CHOIX */
    .choices { display:flex; flex-direction:column; gap:8px; }
    .choice-btn { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:12px 14px; font-size:13px; color:rgba(255,255,255,0.8); cursor:pointer; text-align:left; display:flex; align-items:center; gap:10px; transition:background .1s; }
    .choice-btn:active { background:rgba(255,255,255,0.12); }
    .choice-icon { font-size:16px; flex-shrink:0; }

    /* BOUTON SUITE */
    .btn-next { background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:14px; width:100%; font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:2px; color:rgba(255,255,255,0.6); cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; transition:background .1s; }
    .btn-next:active { background:rgba(255,255,255,0.14); }

    /* INPUT SURNOM */
    .surnom-wrap { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:14px; }
    .surnom-label { font-size:10px; color:rgba(255,255,255,0.4); font-weight:700; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
    .surnom-input { width:100%; background:rgba(0,0,0,0.4); border:1px solid rgba(255,255,255,0.12); border-radius:8px; padding:11px 14px; font-size:18px; font-weight:700; color:white; font-family:'Bebas Neue',sans-serif; letter-spacing:2px; outline:none; transition:border .2s; }
    .surnom-input:focus { border-color:rgba(251,191,36,0.4); }
    .surnom-input::placeholder { color:rgba(255,255,255,0.2); font-size:13px; letter-spacing:1px; font-family:'Inter',sans-serif; font-weight:400; }

    /* BADGE FINAL */
    .badge-wrap { background:rgba(251,191,36,0.07); border:1px solid rgba(251,191,36,0.2); border-radius:14px; padding:16px; text-align:center; animation:popIn .5s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes popIn { from{transform:scale(0.7);opacity:0} to{transform:scale(1);opacity:1} }
    .badge-icon  { font-size:38px; margin-bottom:6px; }
    .badge-title { font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:2px; color:#fbbf24; }
    .badge-desc  { font-size:11px; color:rgba(255,255,255,0.35); margin-top:3px; }

    /* BADGE TAMPONNE */
    .badge-stamp-wrap { display:flex; justify-content:center; margin-bottom:8px; }
    .badge-stamp { width:120px; height:80px; background:rgba(255,255,255,0.05); border:2px solid rgba(251,191,36,0.3); border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; animation:stampIn .4s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes stampIn { from{transform:scale(0) rotate(-20deg);opacity:0} to{transform:scale(1) rotate(-3deg);opacity:1} }
    .badge-stamp-label { font-size:9px; color:rgba(251,191,36,0.6); font-weight:700; letter-spacing:2px; text-transform:uppercase; }
    .badge-stamp-num { font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:3px; color:#fbbf24; }
    .badge-stamp-sub { font-size:8px; color:rgba(255,255,255,0.3); letter-spacing:1px; }

    @keyframes bgScan { 0%{transform:translateX(-100%)} 100%{transform:translateX(100%)} }
    @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
    /* Transition de scène */
    @keyframes sceneIn { from{opacity:0} to{opacity:1} }
    @keyframes slideUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }
    @keyframes charEnter { from{opacity:0;transform:translateY(40px) scale(0.95)} to{opacity:1;transform:translateY(0) scale(1)} }
    .scene-wrap { animation:sceneIn .4s ease; }
    .char-svg { animation:charEnter .5s cubic-bezier(0.34,1.3,0.64,1) forwards; }
    .dialogue-box { animation:slideUp .35s ease forwards; }
    .fade-in { animation:fadeIn .35s ease forwards; }
    .typewriter { overflow:hidden; white-space:pre-wrap; }
    @keyframes typing { from{opacity:0} to{opacity:1} }

    /* CHOIX PASSÉ — cartes horizontales */
    .past-choices { display:flex; flex-direction:column; gap:10px; }
    .past-card { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:14px; padding:14px 16px; cursor:pointer; display:flex; align-items:center; gap:14px; transition:all .15s; }
    .past-card:active { background:rgba(255,255,255,0.1); transform:scale(0.98); }
    .past-card-icon { font-size:28px; flex-shrink:0; }
    .past-card-text { flex:1; }
    .past-card-title { font-weight:700; font-size:14px; color:white; margin-bottom:3px; }
    .past-card-desc { font-size:12px; color:rgba(255,255,255,0.45); line-height:1.4; font-style:italic; }

    .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.85); border:1px solid rgba(255,255,255,0.1); color:white; padding:10px 18px; border-radius:20px; font-size:13px; font-weight:600; z-index:100; opacity:0; transition:opacity .3s; white-space:nowrap; }
    .toast.show { opacity:1; }
  
    /* ===== BD : fond blanc ===== */
    body.histoire-menu { background:#fff; }
    body.histoire-menu #bgFond { display:none; }

    /* ===== En-tête fixe nouveau design ===== */
    .hist-hero {
      position:fixed; top:0; left:0; right:0; z-index:30;
      background:#fff;
      padding:calc(14px + env(safe-area-inset-top)) 16px 14px;
      border-bottom:1px solid rgba(0,0,0,0.06);
    }
    .hh-inner { max-width:500px; margin:0 auto; }
    .hh-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    .hh-back { background:rgba(0,0,0,0.05); border:1px solid rgba(0,0,0,0.08); border-radius:10px; padding:8px 14px; color:rgba(0,0,0,0.35); font-family:'Bebas Neue',sans-serif; font-size:12px; letter-spacing:1px; cursor:pointer; }
    .hh-badge { background:rgba(124,58,237,0.08); border:1px solid rgba(124,58,237,0.2); border-radius:8px; padding:4px 12px; font-family:'Bebas Neue',sans-serif; font-size:11px; letter-spacing:1px; color:#7c3aed; }
    .hh-title { font-family:'Bebas Neue',sans-serif; font-size:30px; letter-spacing:3px; color:#0a0a0a; margin-bottom:3px; }
    .hh-subtitle { font-size:9px; font-weight:700; color:rgba(0,0,0,0.2); letter-spacing:2px; margin-bottom:10px; }
    .hh-bar { height:5px; background:rgba(0,0,0,0.06); border-radius:3px; overflow:hidden; }
    .hh-fill { height:100%; background:linear-gradient(90deg,#7c3aed,#a78bfa,#ec4899,#f97316,#fbbf24); border-radius:3px; transition:width .6s ease; }
    .hh-meta { display:flex; justify-content:space-between; margin-top:5px; }
    .hh-meta span { font-size:8px; font-weight:700; color:rgba(0,0,0,0.2); letter-spacing:1px; }
    /* Masquer l'ancien canvas stars */
    .hist-hero canvas.hh-stars { display:none; }
    .hist-hero .hh-skyline { display:none; }
    .hh-caption { display:none; }

    /* ===== Vue par actes nouveau design ===== */
    .act-sec { margin-bottom:8px; }
    .act-head {
      display:flex; align-items:center; gap:10px; padding:8px 0 6px;
    }
    .act-rom { font-family:'Bebas Neue',sans-serif; font-size:11px; letter-spacing:2px; color:rgba(0,0,0,0.3); }
    .act-name { flex:1; font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:1px; color:rgba(0,0,0,0.5); }
    .act-prog { font-size:10px; color:rgba(0,0,0,0.25); font-weight:700; }

    /* Cartes chapitres nouveau design */
    .ch-row {
      display:flex; align-items:center; gap:12px;
      padding:13px 14px; margin-bottom:8px;
      background:#f9f9f9; border:1px solid rgba(0,0,0,0.06);
      border-radius:16px;
      transition:transform .12s ease;
    }
    .ch-row.available { cursor:pointer; }
    .ch-row.available:active { transform:scale(0.98); }
    .ch-row.done { background:#f9f9f9; border-color:rgba(0,0,0,0.05); }
    .ch-row.locked { opacity:0.35; }
    .ch-row.current {
      background:rgba(124,58,237,0.06); border-color:rgba(124,58,237,0.2);
      box-shadow:0 4px 20px rgba(124,58,237,0.08);
    }
    .ch-badge {
      width:38px; height:38px; flex-shrink:0; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      font-family:'Bebas Neue',sans-serif; font-size:18px;
      background:rgba(22,163,74,0.08); border:1.5px solid rgba(22,163,74,0.2);
      color:rgba(0,0,0,0.5);
    }
    .ch-row.done .ch-badge { background:rgba(22,163,74,0.08); border-color:rgba(22,163,74,0.2); color:#16a34a; }
    .ch-row.current .ch-badge { background:linear-gradient(135deg,#7c3aed,#a78bfa); border-color:transparent; color:#fff; box-shadow:0 4px 12px rgba(124,58,237,0.3); }
    .ch-row.locked .ch-badge { color:rgba(0,0,0,0.2); }
    .ch-mid { flex:1; min-width:0; }
    .ch-name { font-family:'Bebas Neue',sans-serif; font-size:15px; letter-spacing:1px; color:#0a0a0a; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .ch-desc { font-size:10px; color:rgba(0,0,0,0.3); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .ch-row.done .ch-name { color:rgba(0,0,0,0.35); }
    .ch-go {
      flex-shrink:0; font-family:'Bebas Neue',sans-serif; font-size:11px; letter-spacing:1px;
      color:#fff; background:linear-gradient(135deg,#7c3aed,#a78bfa); padding:7px 13px;
      border-radius:9px; border:none; box-shadow:0 3px 10px rgba(124,58,237,0.3);
    }
    .ch-tag { flex-shrink:0; font-size:9px; font-weight:700; letter-spacing:1px; color:rgba(0,0,0,0.2); padding:5px 8px; background:rgba(0,0,0,0.04); border:1px solid rgba(0,0,0,0.07); border-radius:6px; }
    .ch-tag.done { color:rgba(22,163,74,0.7); background:rgba(22,163,74,0.07); border-color:rgba(22,163,74,0.2); }
    .ch-row.coming { opacity:0.3; border-style:dashed; }
    .ch-row.coming .ch-badge { color:rgba(0,0,0,0.15); }

    /* ===== Pagination ===== */
    .act-pager { display:flex; gap:8px; margin:16px 0 10px; }
    .act-pager .pg-btn {
      flex:1; font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:1px;
      border:1px solid rgba(0,0,0,0.1); cursor:pointer; padding:12px 16px;
      border-radius:12px; background:#f5f5f5; color:rgba(0,0,0,0.4);
      transition:background .1s;
    }
    .act-pager .pg-next { background:#0a0a0a; color:#fff; border-color:#0a0a0a; }
    .act-pager .pg-btn:active { opacity:0.8; }
    .act-pager .pg-btn:disabled { opacity:0.2; cursor:default; }


</style>


</head>
<body class="histoire-menu">

  <!-- FOND HISTOIRE — même style que le bouton -->
  <div id="bgFond" style="position:fixed;inset:0;z-index:0;background:linear-gradient(135deg,#1e0a3c,#2d1060,#1a0845)">
    <canvas id="bgCanvas" style="position:absolute;inset:0;width:100%;height:100%;opacity:0.5;pointer-events:none"></canvas>
    <div style="position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#a78bfa,#7c3aed,transparent);animation:bgScan 3s linear infinite;pointer-events:none"></div>
  </div>



  <!-- MENU -->
  <div id="menuView" class="menu-wrap" style="display:none">
    <div id="chapterList"></div>
  </div>

  <!-- SCÈNE -->
  <div id="sceneView" class="scene-wrap" style="display:none">
    <div class="scene-bg" id="sceneBg"></div>
    <div class="char-zone" id="charZone"></div>
    <div class="dialogue-box" id="dialogueBox">
      <div>
        <div class="char-name" id="charName"></div>
        <div class="dialogue-text" id="dialogueText"></div>
      </div>
      <div id="actionsZone"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

    let currentActIdx = null;
    function showMenu() {
      document.body.classList.add('histoire-menu');
      document.getElementById('menuView').style.display = 'flex';
      document.getElementById('sceneView').style.display = 'none';
      activeChapter = null;
      setNight(false);

      const list = document.getElementById('chapterList');
      const chs = CHAPTERS.slice().sort((a,b) => a.id - b.id);
      const total = chs.filter(c => !c.coming).length;
      const doneCount = chs.filter(c => progress[c.doneKey]).length;
      const pct = Math.round(doneCount / total * 100);
      const curId = (chs.find(c => !c.coming && (!c.requires || progress[c.requires]) && !progress[c.doneKey]) || chs.filter(c => !c.coming).slice(-1)[0] || chs[chs.length-1]).id;

      const xbtn = document.getElementById('mapClose'); if (xbtn) xbtn.style.display = 'flex';

      // Regrouper par acte
      const acts = [];
      chs.forEach(ch => {
        const a = actOf(ch.id);
        let grp = acts.find(g => g.n === a.n);
        if (!grp) { grp = { n:a.n, name:a.name, items:[] }; acts.push(grp); }
        grp.items.push(ch);
      });

      // Acte affiché : par défaut celui du chapitre courant
      if (currentActIdx === null) {
        const curActN = actOf(curId).n;
        currentActIdx = Math.max(0, acts.findIndex(g => g.n === curActN));
      }
      currentActIdx = Math.max(0, Math.min(currentActIdx, acts.length - 1));
      const grp = acts[currentActIdx];

      // En-tête fixe : MODE HISTOIRE + barre
      let html = `<div class="hist-hero">
        <div class="hh-inner">
          <div class="hh-top">
            <button class="hh-back" onclick="window.location.href='game.html'">← RETOUR</button>
            <div class="hh-badge">CH.${curId} EN COURS</div>
          </div>
          <div class="hh-title">MODE HISTOIRE</div>
          <div class="hh-subtitle">PORT DE MARSEILLE</div>
          <div class="hh-bar"><div class="hh-fill" style="width:${pct}%"></div></div>
          <div class="hh-meta"><span>${doneCount} / ${total} CHAPITRES</span><span>${pct}%</span></div>
        </div>
      </div>`;

      // Acte courant
      const aDone = grp.items.filter(c => progress[c.doneKey]).length;
      const aTotal = grp.items.filter(c => !c.coming).length;
      html += `<div class="act-sec"><div class="act-head"><span class="act-rom">ACTE ${grp.n}</span><span class="act-name">${grp.name}</span><span class="act-prog">${aDone}/${aTotal}</span></div>`;
      grp.items.forEach(ch => {
        const done = !!progress[ch.doneKey];
        const coming = !!ch.coming;
        const available = !coming && (!ch.requires || !!progress[ch.requires]);
        const state = coming ? 'coming' : (done ? 'done' : available ? 'available' : 'locked');
        const isCur = (ch.id === curId) && available && !done;
        const icon = coming ? '🔜' : (done ? '✓' : (state === 'locked' ? '🔒' : '▶'));
        const tag = coming ? '<div class="ch-tag">À venir</div>'
                  : (available && !done ? '<div class="ch-go">JOUER</div>'
                  : (done ? '<div class="ch-tag done">✓ Terminé</div>' : '<div class="ch-tag">🔒</div>'));
        html += `<div class="ch-row ${state} ${isCur ? 'current' : ''}" data-id="${ch.id}">
          <div class="ch-badge">${icon}</div>
          <div class="ch-mid"><div class="ch-name">Chapitre ${ch.id} · ${ch.title}</div>${ch.desc ? `<div class="ch-desc">${ch.desc}</div>` : ''}</div>
          ${tag}
        </div>`;
      });
      html += `</div>`;

      // Pagination des actes
      html += `<div class="act-pager">
        <button class="pg-btn pg-prev" ${currentActIdx===0?'disabled':''} onclick="histPrevAct()">← Précédent</button>
        <button class="pg-btn pg-next" ${currentActIdx===acts.length-1?'disabled':''} onclick="histNextAct()">Page suivante →</button>
      </div>
      <button onclick="window.location.href='game.html'" style="width:100%;margin:4px 0 20px;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:2px;background:#f5f5f5;color:rgba(0,0,0,0.3);border:1px solid rgba(0,0,0,0.08);border-radius:12px;padding:13px;cursor:pointer;">← REVENIR AU JEU</button>`;

      list.innerHTML = html;

      // Décaler le contenu sous l'en-tête fixe
      const hero = list.querySelector('.hist-hero');
      if (hero) setTimeout(() => { list.style.paddingTop = (hero.offsetHeight + 14) + 'px'; }, 50);

      // Clics sur les chapitres jouables de l'acte affiché
      grp.items.forEach(ch => {
        const done = !!progress[ch.doneKey];
        const available = !ch.coming && (!ch.requires || !!progress[ch.requires]);
        if (available && !done) {
          const el = list.querySelector('.ch-row[data-id="' + ch.id + '"]');
          if (el) el.onclick = () => startChapter(ch);
        }
      });

      // Centrer sur le chapitre courant s'il est dans l'acte affiché
      setTimeout(() => {
        const el = list.querySelector('.ch-row[data-id="' + curId + '"]');
        if (el) el.scrollIntoView({ block: 'center', behavior: 'auto' });
      }, 40);
    }
    window.histPrevAct = function(){ if (currentActIdx > 0) { currentActIdx--; showMenu(); const l=document.getElementById('menuView'); if(l) l.scrollTo({top:0}); } };

    async function chooseFocus(f) {

    async function seedCh8Objectives(focusId) {
      try {
        const today = new Date().toISOString().split('T')[0];
        const { data: existing } = await sb.from('daily_objectives').select('objectives').eq('user_id', currentUser.id).eq('date', today).maybeSingle();
        if (existing) return; // ne pas écraser une liste déjà générée
        const { data: gs } = await sb.from('game_stats').select('level,records,bourse_profit').eq('user_id', currentUser.id).maybeSingle();
        const records = (gs?.records && typeof gs.records === 'object') ? gs.records : {};
        const cur = (m) => m==='level' ? (gs?.level||1) : m==='bourse_profit' ? (gs?.bourse_profit||0) : (records[m]||0);
        const TPL = {
          tower:    { id:'tower',    title:"Bats ton record d'étages (Tower)",   icon:'🏗️', mode:'beat',     metric:'tower_floor',    reward:{type:'money',amount:6000} },
          pointeau: { id:'pointeau', title:'Bats ton record de score (Pointeau)', icon:'📋', mode:'beat',     metric:'pointeau_score', reward:{type:'money',amount:6000} },
          bourse:   { id:'bourse',   title:'Réalise un profit à la Bourse',       icon:'📈', mode:'increase', metric:'bourse_profit',  reward:{type:'money',amount:8000} },
        };
        const login   = { id:'login', title:'Connexion du jour', icon:'🔥', mode:'free', reward:{type:'diamonds',amount:2} };
        const levelUp = { id:'level', title:'Gagne un niveau',    icon:'⭐', mode:'inc', metric:'level', amount:1, reward:{type:'diamonds',amount:3} };
        const chosen = [login, TPL[focusId] || TPL.tower, levelUp];
        const objectives = chosen.map(t => ({ id:t.id, title:t.title, icon:t.icon, mode:t.mode, metric:t.metric||null, amount:t.amount||null, baseline: t.mode==='free'?0:cur(t.metric), reward:t.reward, completed:t.mode==='free', claimed:false }));
        await sb.from('daily_objectives').upsert({ user_id:currentUser.id, date:today, objectives }, { onConflict:'user_id,date' });
      } catch(e) { console.log('seed obj:', e); }
    }

    // ── BONUS MINI-JEUX DE CHAPITRE ──
    async function grantChapterBonus(chKey, money, xp){
      try {
        const { data:fresh } = await sb.from('game_stats').select('money,xp,level,story_progress').eq('user_id',currentUser.id).maybeSingle();
        const sp = fresh?.story_progress || {};
        if (sp[chKey]) return false; // déjà récupéré
        let nXp=(fresh?.xp||0)+xp, nLvl=fresh?.level||1;
        while (nXp >= getXpRequired(nLvl)) { nXp -= getXpRequired(nLvl); nLvl++; }
        sp[chKey]=true;
        await sb.from('game_stats').update({ money:(fresh?.money||0)+money, xp:nXp, level:nLvl, story_progress:sp }).eq('user_id',currentUser.id);
        await awardTrophies(nLvl-(fresh?.level||1));
        progress = sp;
        return true;
      } catch(e){ console.log('bonus:',e); return false; }
    }

    // — Mini-jeu : Attrape le bouquet —
    function playBouquet(onDone) {
      const ov = document.createElement('div');
      ov.style.cssText = 'position:fixed;inset:0;z-index:100;background:linear-gradient(180deg,#bae6fd,#dcfce7);display:flex;flex-direction:column;align-items:center;padding:18px;';
      ov.innerHTML =
        '<div style="font-family:\'Bebas Neue\',sans-serif;font-size:30px;letter-spacing:1px;color:#9d174d;margin-top:8px">💐 Attrape le bouquet !</div>' +
        '<div style="font-size:13px;color:#3f6212;font-weight:700;margin:4px 0 6px;text-align:center">Glisse ton doigt pour déplacer le panier 🧺</div>' +
        '<div id="bqScore" style="font-family:\'Bebas Neue\',sans-serif;font-size:22px;color:#db2777">0 bouquet</div>' +
        '<div id="bqZone" style="position:relative;width:100%;max-width:440px;flex:1;margin-top:8px;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,0.4),rgba(167,243,208,0.35));border:2px solid rgba(157,23,80,0.2);touch-action:none">' +
          '<div id="bqBasket" style="position:absolute;bottom:6px;font-size:38px;transform:translateX(-50%)">🧺</div>' +
        '</div>';
      document.body.appendChild(ov);
      const zone = ov.querySelector('#bqZone'), basket = ov.querySelector('#bqBasket'), scoreEl = ov.querySelector('#bqScore');
      let W = zone.clientWidth, H = zone.clientHeight;
      let basketX = W/2, targetX = W/2, caught = 0, bouquets = [], running = true, raf = null, lastSpawn = 0, start = 0;
      function moveTo(clientX){ const r = zone.getBoundingClientRect(); targetX = Math.max(26, Math.min(W-26, clientX - r.left)); }
      zone.addEventListener('touchmove', e => { if (e.touches[0]) moveTo(e.touches[0].clientX); }, { passive:true });
      zone.addEventListener('touchstart', e => { if (e.touches[0]) moveTo(e.touches[0].clientX); }, { passive:true });
      zone.addEventListener('pointermove', e => moveTo(e.clientX));
      zone.addEventListener('pointerdown', e => moveTo(e.clientX));
      function spawn(){
        const el = document.createElement('div'); el.textContent = '💐';
        el.style.cssText = 'position:absolute;font-size:30px;transform:translateX(-50%)';
        const x = 30 + Math.random()*(W-60); el.style.left = x+'px'; el.style.top = '-30px';
        zone.appendChild(el); bouquets.push({ el, x, y:-30, vy: 2.3 + Math.random()*1.7, done:false });
      }
      function loop(now){
        if (!running) return;
        if (!start) start = now;
        basketX += (targetX - basketX) * 0.25; basket.style.left = basketX + 'px';
        if (now - lastSpawn > 700){ lastSpawn = now; if (now - start < 8000) spawn(); }
        bouquets.forEach(b => {
          if (b.done) return;
          b.y += b.vy; b.el.style.top = b.y + 'px';
          if (b.y >= H - 46){
            b.done = true;
            if (Math.abs(b.x - basketX) < 42){ caught++; scoreEl.textContent = caught + ' bouquet' + (caught>1?'s':''); b.el.textContent = '✨'; }
            else { b.el.style.opacity = '0.3'; }
            setTimeout(() => { if (b.el.parentNode) b.el.parentNode.removeChild(b.el); }, 220);
          }
        });
        if (start && now - start >= 8800 && bouquets.every(b => b.done)){ end(); return; }
        raf = requestAnimationFrame(loop);
      }
      function end(){
        running = false; cancelAnimationFrame(raf);

    function ch15Mini(label, color, onDone) {
      const ov = document.createElement('div');
      ov.style.cssText = 'position:fixed;inset:0;z-index:120;background:linear-gradient(180deg,#2a0d08,#0d0503);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;color:#fff';
      ov.innerHTML = `<div style="font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:1px;color:${color}">${label}</div>
        <div id="m15c" style="font-family:'Bebas Neue',sans-serif;font-size:48px;color:#fcd34d;margin:10px 0">0</div>
        <div id="m15t" style="font-size:14px;color:rgba(255,255,255,0.6);margin-bottom:18px">5.0 s</div>
        <button id="m15b" style="width:100%;max-width:420px;border:none;border-radius:18px;padding:42px 16px;font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:2px;background:linear-gradient(135deg,#7f1d1d,#ef4444);color:#fff;cursor:pointer">APPUIE VITE !</button>`;
      document.body.appendChild(ov);
      const cEl=ov.querySelector('#m15c'), tEl=ov.querySelector('#m15t'), b=ov.querySelector('#m15b');
      let taps=0, started=false, endT=0;
      function tick(){ const left=Math.max(0,endT-performance.now()); tEl.textContent=(left/1000).toFixed(1)+' s'; if(left<=0){ b.disabled=true; if(ov.parentNode) document.body.removeChild(ov); onDone(taps); return; } requestAnimationFrame(tick); }
      b.onpointerdown = (e) => { e.preventDefault(); if(!started){ started=true; endT=performance.now()+5000; tick(); } taps++; cEl.textContent=taps; b.style.transform='scale(0.97)'; setTimeout(()=>b.style.transform='',40); };
    }
    async function finishChapter15(joined, taps) {
      const bonus = Math.min((taps||0)*150, 6000);
      const base = joined ? 3000 : 12000;
      const total = base + bonus;
      try {
        const { data: fresh } = await sb.from('game_stats').select('money,xp,level,syndicat,story_progress').eq('user_id', currentUser.id).maybeSingle();
        const newProgress = { ...(fresh?.story_progress||{}), scene15_done: true };
        let nXp = (fresh?.xp||0) + 1500, nLvl = fresh?.level||1;
        while (nXp >= getXpRequired(nLvl)) { nXp -= getXpRequired(nLvl); nLvl++; }
        const upd = { money: (fresh?.money||0) + total, xp: nXp, level: nLvl, story_progress: newProgress };
        if (joined) {
          const syn = (fresh?.syndicat && typeof fresh.syndicat==='object') ? fresh.syndicat : {};
          syn.member = true; if (syn.contributed==null) syn.contributed = 0;
          upd.syndicat = syn;
        }
        await sb.from('game_stats').update(upd).eq('user_id', currentUser.id);
        await awardTrophies(nLvl - (fresh?.level||1));
        progress = newProgress;
      } catch(e) { console.log(e); }

    // ===== Fin de chapitre générique (Act 5) =====
    async function applyChapterEnd(doneKey, money, xpGain, diamonds, extraProgress) {
      try {
        const { data: fresh } = await sb.from('game_stats').select('money,xp,level,diamonds,story_progress').eq('user_id', currentUser.id).maybeSingle();
        const newProgress = { ...(fresh?.story_progress||{}), [doneKey]: true, ...(extraProgress||{}) };
        let nXp = (fresh?.xp||0) + xpGain, nLvl = fresh?.level||1;
        while (nXp >= getXpRequired(nLvl)) { nXp -= getXpRequired(nLvl); nLvl++; }
        const upd = { money:(fresh?.money||0)+money, xp:nXp, level:nLvl, story_progress:newProgress };
        if (diamonds) upd.diamonds = (fresh?.diamonds||0) + diamonds;
        await sb.from('game_stats').update(upd).eq('user_id', currentUser.id);
        await awardTrophies(nLvl - (fresh?.level||1));
        progress = newProgress;
      } catch(e) { console.log(e); }
    }

      act.appendChild(badge);
    }

      setChar('gegé', 'Gégé', 'port_matin');
      document.getElementById('dialogueText').className = 'dialogue-text fade-in';
      document.getElementById('dialogueText').textContent = "Règle numéro un : si Lavagne te sourit, méfie-toi.";
      showNext(() => showGege2b());
    }

    function showGege2b() {
      setChar('gegé', 'Gégé', 'port_matin');
      document.getElementById('dialogueText').className = 'dialogue-text fade-in';
      document.getElementById('dialogueText').textContent = "Ici on charge, on décharge, on encaisse. Le port dort jamais. Toi non plus, bientôt.";
      showNext(() => showLavagne());
    }

    function showLavagne() {
      showNarrateur(
        "Gégé t'explique quelque chose quand une silhouette en costume apparaît.",
        () => {
          setChar('lavagne', 'Patrick Lavagne', 'bureau');
          document.getElementById('dialogueText').className = 'dialogue-text fade-in';
          document.getElementById('dialogueText').textContent = "Ah ! Le nouveau ! Bienvenue dans la famille.";
          showNext(() => showLavagne2());
        }
      );
    }

    function showLavagne2() {
      setChar('lavagne', 'Patrick Lavagne');
      document.getElementById('dialogueText').textContent = "Mon bureau est toujours ouvert.";
      showNext(() => showGege3());
    }

    function showGege3() {
      showNarrateur(
        "Lavagne repart sans attendre ta réponse. Gégé te chuchote :",
        () => {
          setChar('gegé', 'Gégé', 'port_matin');
          document.getElementById('dialogueText').className = 'dialogue-text fade-in';
          document.getElementById('dialogueText').textContent = "Son bureau est toujours fermé.";
          showChoices([
            { icon:'🤨', text:'"Il a l\'air sympa pourtant."', next: showGege3b },
            { icon:'😏', text:'"Compris. Je me méfie."', next: showGege3b },
            { icon:'🤐', text:'(Ne rien dire)', next: showGege3b },
          ]);
        }
      );
    }

    function showGege3b() {
      setChar('gegé', 'Gégé', 'port_matin');
      document.getElementById('dialogueText').className = 'dialogue-text fade-in';
      document.getElementById('dialogueText').textContent = "T'apprendras. Allez, assez parlé du patron.";
      showNext(() => showSurnom());
    }

    function showSurnom() {
      setChar('gegé', 'Gégé', 'port_matin');
      document.getElementById('dialogueText').textContent = "Ici tout le monde a un surnom. Toi on t'appellera comment ?";

      const act = document.getElementById('actionsZone');
      act.innerHTML = '';

      const wrap = document.createElement('div');
      wrap.className = 'surnom-wrap fade-in';
      wrap.innerHTML = `<div class="surnom-label">Ton surnom au port</div>`;

      const input = document.createElement('input');
      input.className = 'surnom-input';
      input.type = 'text';
      input.maxLength = 20;
      input.placeholder = 'Ton surnom...';
      input.autocomplete = 'off';
      wrap.appendChild(input);
      act.appendChild(wrap);

      const btn = document.createElement('button');
      btn.className = 'btn-next';
      btn.style.marginTop = '8px';
      btn.style.background = 'linear-gradient(135deg,#fbbf24,#f59e0b)';
      btn.style.color = '#1a0a00';
      btn.style.border = 'none';
      btn.innerHTML = "C'est parti !";
      btn.disabled = true;

      input.addEventListener('input', () => { btn.disabled = input.value.trim().length < 2; });
      btn.onclick = () => {
        surnom = input.value.trim();
        showFinaleBadge();
      };
      act.appendChild(btn);
      setTimeout(() => input.focus(), 200);
    }

    function showFinaleBadge() {
      const responses = [
        `${surnom} ! Ça sonne bien. Allez, au boulot.`,
        `${surnom} ? Parfait. On t'appellera comme ça. Suis-moi.`,
        `${surnom}... J'aime bien. Bienvenue au port.`,
      ];
      setChar('gegé', 'Gégé', 'port_matin');
      document.getElementById('dialogueText').textContent = responses[Math.floor(Math.random()*responses.length)];

      const act = document.getElementById('actionsZone');
      act.innerHTML = '';

      // Badge
      const badge = document.createElement('div');
      badge.className = 'badge-wrap';
      badge.innerHTML = `
        <div class="badge-icon">🔵</div>
        <div class="badge-title">Bleu du Port</div>
        <div class="badge-desc">Surnom · Titre · Travailler débloqué</div>`;
      act.appendChild(badge);

      const btn = document.createElement('button');
      btn.className = 'btn-next fade-in';
      btn.innerHTML = '▶ Terminer le chapitre';
      btn.style.marginTop = '8px';
      btn.onclick = finishChapter1;
      act.appendChild(btn);
      addBonusButton('ch1_bonus','🕐 Le Pointage', playMiniCh1);
    }

    async function finishChapter1() {
      try {
        const { data: fresh } = await sb.from('game_stats').select('story_progress').eq('user_id', currentUser.id).maybeSingle();
        const newProgress = { ...(fresh?.story_progress||{}), scene1_done:true, surnom };
        await sb.from('game_stats').update({ story_progress: newProgress }).eq('user_id', currentUser.id);
        await sb.from('profiles').update({ bio:`🔵 Bleu du Port · "${surnom}"` }).eq('user_id', currentUser.id);
        progress = newProgress;
      } catch(e) { console.log(e); }
      showMenu();
    }

    // ── TRANSITION DE SCÈNE (fondu noir) ──
    function showSceneTransition(cb) {
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;background:#000;z-index:100;opacity:0;transition:opacity .4s ease;pointer-events:none';
      document.body.appendChild(overlay);
      requestAnimationFrame(() => {
        overlay.style.opacity = '1';
        setTimeout(() => {
          if (cb) cb();
          overlay.style.opacity = '0';
          setTimeout(() => overlay.remove(), 400);
        }, 350);
      });
    }

    // ── HELPERS ──
    function setChar(type, name, bg) {
      if (bg) setBg(bg);
      document.getElementById('charZone').innerHTML = SVG[type] || '';
      const nameEl = document.getElementById('charName');
      nameEl.className = 'char-name ' + (type || '');
      nameEl.textContent = name || '';
      if (type === 'lavagne') { nameEl.style.color = '#10b981'; }
      else if (type === 'jeff')    { nameEl.style.color = '#f97316'; }
      else if (type === 'doudou')  { nameEl.style.color = '#eab308'; }
      else if (type === 'titouan') { nameEl.style.color = '#9ca3af'; }
      else { nameEl.style.color = ''; }
    }

    // ── TYPEWRITER ──
    function typewrite(el, text, speed=22, cb) {
      el.textContent = '';
      el.classList.add('typewriter');
      let i = 0;
      const tick = () => {
        if (i < text.length) {
          el.textContent += text[i++];
          setTimeout(tick, speed);
        } else if (cb) cb();
      };
      tick();
    }

    function showNarrateur(text, next, bg) {
      if (bg) setBg(bg);
      document.getElementById('charZone').innerHTML = '';
      document.getElementById('charName').className = 'char-name narrateur';
      document.getElementById('charName').textContent = '—';
      document.getElementById('dialogueText').className = 'dialogue-text narratif fade-in';
      document.getElementById('dialogueText').textContent = text;
      showNext(next);
    }

    function showNext(next) {
      const act = document.getElementById('actionsZone');
      act.innerHTML = '';
      const btn = document.createElement('button');
      btn.className = 'btn-next fade-in';
      btn.innerHTML = '▶ Continuer';
      btn.onclick = next;
      act.appendChild(btn);
    }

    function showChoices(choices) {
      const act = document.getElementById('actionsZone');
      act.innerHTML = '';
      const div = document.createElement('div');
      div.className = 'choices fade-in';
      choices.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.innerHTML = `<span class="choice-icon">${c.icon}</span>${c.text}`;
        btn.onclick = c.next;
        div.appendChild(btn);
      });
      act.appendChild(div);
    }

    function setNight(on) {
      // Pour les prochains chapitres
    }

    function goBack() {
      if (activeChapter) { showMenu(); }
      else { window.location.href = 'game.html'; }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.className = 'toast show';
      setTimeout(() => t.className = 'toast', 2800);
    }

    // ── AUTH ──
    function initBgCanvas() {
      const canvas = document.getElementById('bgCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
      const particles = Array.from({length:40}, () => ({
        x: Math.random()*canvas.width, y: Math.random()*canvas.height,
        r: Math.random()*1.5+0.2, speed: Math.random()*0.35+0.08, op: Math.random()*0.7+0.2
      }));
      (function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        particles.forEach(p => {
          ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
          ctx.fillStyle = `rgba(167,139,250,${p.op})`; ctx.fill();
          p.y -= p.speed; p.op -= 0.0015;
          if (p.y<0||p.op<=0) { p.x=Math.random()*canvas.width; p.y=canvas.height; p.op=Math.random()*0.7+0.2; }
        });
        requestAnimationFrame(draw);
      })();
    }

    async function init() {
      try {
        initBgCanvas();
        const { data:{ session } } = await sb.auth.getSession();
        if (!session) { window.location.href = 'index.html'; return; }
        currentUser = session.user;
        const { data } = await sb.from('game_stats').select('story_progress').eq('user_id', currentUser.id).maybeSingle();
        progress = data?.story_progress || {};
        try { localStorage.setItem('bd_story_progress', JSON.stringify(progress)); } catch(_) {}
        currentActIdx = null;

        // Retour depuis clicker après CH.2
        if (sessionStorage.getItem('histoire_ch2_pending') === '1') {
          sessionStorage.removeItem('histoire_ch2_pending');
          if (!progress.scene2_done) { await showRewardCh2(); return; }
        }

        showMenu();
      } catch(e) {
        console.error('Erreur init histoire:', e);
        // Afficher quand même le menu
        showMenu();
      }
    }

    // Affichage instantané : on rend le menu tout de suite avec la progression en cache,
    // puis init() confirme/rafraîchit avec les données serveur.
    try { const _c = localStorage.getItem('bd_story_progress'); if (_c) progress = JSON.parse(_c) || {}; } catch(_) {}
    showMenu();
    init();
  </script>
