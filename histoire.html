<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Histoire - Battle Dock</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    input { -webkit-user-select:text; user-select:text; }
    html, body { height:100%; overflow:hidden; }

    body {
      font-family:'Inter',sans-serif;
      background:#0a0f1a;
      height:100dvh;
      display:flex; flex-direction:column;
      color:white;
    }

    /* ── FOND PORT MATIN ── */
    .scene-bg {
      position:fixed; inset:0; z-index:0;
      overflow:hidden;
    }

    /* ── HEADER ── */
    .header {
      position:relative; z-index:10; flex-shrink:0;
      padding:11px 16px; display:flex; align-items:center; gap:12px;
      background:rgba(0,0,0,0.5); backdrop-filter:blur(12px);
      border-bottom:1px solid rgba(255,255,255,0.06);
    }
    .back-btn { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); color:rgba(255,255,255,0.6); padding:7px 12px; border-radius:8px; cursor:pointer; font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:1px; }
    .header-title { font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:3px; color:rgba(255,255,255,0.5); flex:1; text-align:center; }
    .header-chapter { font-size:11px; color:rgba(255,255,255,0.3); font-weight:700; letter-spacing:1px; }

    /* ── ZONE PERSONNAGE ── */
    .char-zone {
      position:relative; z-index:2;
      flex:1; display:flex; align-items:flex-end; justify-content:center;
      padding-bottom:0; overflow:hidden;
    }
    .char-svg { width:200px; height:280px; flex-shrink:0; }

    /* ── BOITE DIALOGUE ── */
    .dialogue-box {
      position:relative; z-index:10; flex-shrink:0;
      background:rgba(10,15,26,0.95);
      backdrop-filter:blur(20px);
      border-top:1px solid rgba(255,255,255,0.08);
      padding:16px 16px 12px;
      min-height:180px;
      display:flex; flex-direction:column; gap:10px;
    }

    .char-name {
      font-family:'Bebas Neue',sans-serif; font-size:14px;
      letter-spacing:2px; margin-bottom:2px;
    }
    .char-name.pasturon { color:#fbbf24; }
    .char-name.vigile   { color:#9ca3af; }
    .char-name.narrateur { color:rgba(255,255,255,0.35); font-style:italic; font-family:'Inter',sans-serif; font-size:11px; letter-spacing:1px; }

    .dialogue-text {
      font-size:15px; color:rgba(255,255,255,0.88);
      line-height:1.65;
      min-height:50px;
    }
    .dialogue-text.narratif {
      font-size:13px; color:rgba(255,255,255,0.5);
      font-style:italic;
    }

    /* ── BOUTONS CHOIX ── */
    .choices { display:flex; flex-direction:column; gap:8px; }
    .choice-btn {
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:12px; padding:12px 14px;
      font-size:13px; color:rgba(255,255,255,0.8);
      cursor:pointer; text-align:left; transition:all .15s;
      display:flex; align-items:center; gap:10px;
    }
    .choice-btn:active { background:rgba(255,255,255,0.12); transform:scale(0.98); }
    .choice-btn .choice-icon { font-size:16px; flex-shrink:0; }

    /* Bouton continuer simple */
    .btn-next {
      background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);
      border-radius:12px; padding:14px; width:100%;
      font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:2px;
      color:rgba(255,255,255,0.6); cursor:pointer; transition:all .15s;
      display:flex; align-items:center; justify-content:center; gap:8px;
    }
    .btn-next:active { background:rgba(255,255,255,0.12); }

    /* ── INPUT SURNOM ── */
    .surnom-input {
      background:rgba(0,0,0,0.4); border:1px solid rgba(255,255,255,0.15);
      border-radius:10px; padding:12px 14px; width:100%;
      font-size:18px; font-weight:700; color:white;
      font-family:'Bebas Neue',sans-serif; letter-spacing:2px;
      outline:none; transition:border .2s;
    }
    .surnom-input:focus { border-color:rgba(251,191,36,0.5); }
    .surnom-input::placeholder { color:rgba(255,255,255,0.2); font-size:14px; letter-spacing:1px; font-family:'Inter',sans-serif; }

    .btn-valider {
      background:linear-gradient(135deg,#fbbf24,#f59e0b);
      border:none; border-radius:12px; padding:14px; width:100%;
      font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:2px;
      color:#1a0a00; cursor:pointer; transition:all .15s;
    }
    .btn-valider:active { transform:scale(0.97); }
    .btn-valider:disabled { background:rgba(255,255,255,0.08); color:rgba(255,255,255,0.2); cursor:not-allowed; }

    /* ── BADGE FINAL ── */
    .badge-wrap {
      background:rgba(251,191,36,0.08); border:1px solid rgba(251,191,36,0.2);
      border-radius:14px; padding:16px; text-align:center; margin-bottom:8px;
      animation:popIn .5s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes popIn { from{transform:scale(0.7);opacity:0} to{transform:scale(1);opacity:1} }
    .badge-icon  { font-size:40px; margin-bottom:6px; }
    .badge-title { font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:2px; color:#fbbf24; }
    .badge-desc  { font-size:11px; color:rgba(255,255,255,0.35); margin-top:4px; }

    /* ── DÉJÀ FAIT ── */
    .done-screen {
      position:relative; z-index:10;
      flex:1; display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      padding:40px 20px; text-align:center; gap:12px;
    }

    /* ANIMATIONS */
    .fade-in { animation:fadeIn .4s ease forwards; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

    .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.8); border:1px solid rgba(255,255,255,0.1); color:white; padding:10px 18px; border-radius:20px; font-size:13px; font-weight:600; z-index:100; opacity:0; transition:opacity .3s; white-space:nowrap; }
    .toast.show { opacity:1; }
    .toast.error { background:rgba(239,68,68,0.9); }
  </style>
</head>

      <rect x="142" y="142" width="40" height="20" rx="8" fill="#1e3a5f"/>
      <!-- COU -->
      <rect x="88" y="116" width="26" height="26" rx="4" fill="#c4855a"/>
      <!-- TÊTE -->
      <ellipse cx="101" cy="88" rx="40" ry="38" fill="#c4855a"/>
      <!-- Casquette -->
      <ellipse cx="101" cy="55" rx="44" ry="14" fill="#1e3a5f"/>
      <rect x="57" y="55" width="88" height="18" fill="#1e3a5f"/>
      <ellipse cx="101" cy="73" rx="44" ry="10" fill="#1a3354"/>
      <!-- Visière -->
      <path d="M60,70 Q101,80 142,70" stroke="#111" stroke-width="3" fill="#111"/>
      <!-- Oreilles -->
      <ellipse cx="61" cy="88" rx="8" ry="10" fill="#b4754a"/>
      <ellipse cx="141" cy="88" rx="8" ry="10" fill="#b4754a"/>
      <!-- Yeux sévères -->
      <ellipse cx="85" cy="84" rx="9" ry="8" fill="white"/>
      <ellipse cx="117" cy="84" rx="9" ry="8" fill="white"/>
      <circle cx="85" cy="85" r="5" fill="#1f2937"/>
      <circle cx="117" cy="85" r="5" fill="#1f2937"/>
      <!-- Sourcils froncés -->
      <path d="M76,75 Q85,72 94,75" stroke="#4a3020" stroke-width="2.5" fill="none"/>
      <path d="M108,75 Q117,72 126,75" stroke="#4a3020" stroke-width="2.5" fill="none"/>
      <!-- Bouche neutre -->
      <path d="M88,104 Q101,104 114,104" stroke="#8b5e3c" stroke-width="2" fill="none"/>
      <!-- Badge -->
      <rect x="112" y="158" width="24" height="32" rx="3" fill="white"/>
      <rect x="115" y="162" width="18" height="4" rx="1" fill="#1e3a5f"/>
      <rect x="115" y="170" width="12" height="3" rx="1" fill="#9ca3af"/>
      <rect x="115" y="176" width="14" height="3" rx="1" fill="#9ca3af"/>
    </svg>`;

    // ── SCÉNARIO ──
    let step = 0;
    let choice1 = null; // choix du joueur sur la scène vigile

    const SCENES = [
      // 0 — Vigile
      {
        char: 'vigile', charName: 'Le Vigile', charSvg: null,
        text: "T'es le nouveau ?",
        actions: 'choices',
        choices: [
          { icon:'😐', text:'Oui, bonjour.', next: 1 },
          { icon:'😤', text:'"Docker, pas stagiaire."', next: 1 },
        ]
      },
      // 1 — Vigile réponse
      {
        char: 'vigile', charName: 'Le Vigile', charSvg: null,
        text: "Demande Pasturon. Bonne chance.",
        actions: 'next', nextStep: 2
      },
      // 2 — Pasturon arrive
      {
        char: 'narrateur', charName: null,
        text: "Un homme arrive en trottinant. Badge à l'envers. Thermos à moitié renversé.",
        actions: 'next', nextStep: 3
      },
      // 3 — Pasturon parle
      {
        char: 'pasturon', charName: 'Pasturon',
        text: "T'es le nouveau ! Moi c'est Pasturon. Je signe bientôt.",
        actions: 'choices',
        choices: [
          { icon:'🤔', text:'"Signe quoi ?"', next: 4 },
          { icon:'🤝', text:'"Enchanté."', next: 5 },
        ]
      },
      // 4 — Pasturon répond (signe quoi)
      {
        char: 'pasturon', charName: 'Pasturon',
        text: "Mon CDI ! Je suis occasionnel depuis... peu importe. C'est temporaire.",
        actions: 'next', nextStep: 6
      },
      // 5 — Pasturon répond (enchanté)
      {
        char: 'pasturon', charName: 'Pasturon',
        text: "Enchanté aussi ! Bon, je signe bientôt mon CDI. C'est une question de jours.",
        actions: 'next', nextStep: 6
      },
      // 6 — Pasturon sur Ferrotti
      {
        char: 'pasturon', charName: 'Pasturon',
        text: "Si tu vois un grand avec des ongles vernis qui regarde le ciel... c'est Ferrotti. Tu fais semblant de rien.",
        actions: 'next', nextStep: 7
      },
      // 7 — Surnom
      {
        char: 'pasturon', charName: 'Pasturon',
        text: "Au fait — tout le monde a son surnom ici. Toi on t'appellera comment ?",
        actions: 'surnom'
      },
      // 8 — Badge (géré dynamiquement)
    ];

    function showStep(idx) {
      const s = SCENES[idx];
      if (!s) return;

      // Personnage
      const charZone = document.getElementById('charZone');
      if (s.char === 'vigile') {
        charZone.innerHTML = SVG_VIGILE;
      } else if (s.char === 'pasturon') {
        charZone.innerHTML = SVG_PASTURON;
      } else {
        charZone.innerHTML = '';
      }

      // Nom
      const nameEl = document.getElementById('charName');
      if (s.char === 'narrateur') {
        nameEl.className = 'char-name narrateur';
        nameEl.textContent = '—';
      } else if (s.char === 'pasturon') {
        nameEl.className = 'char-name pasturon';
        nameEl.textContent = s.charName;
      } else if (s.char === 'vigile') {
        nameEl.className = 'char-name vigile';
        nameEl.textContent = s.charName;
      } else {
        nameEl.textContent = '';
      }

      // Texte
      const textEl = document.getElementById('dialogueText');
      textEl.className = s.char === 'narrateur' ? 'dialogue-text narratif fade-in' : 'dialogue-text fade-in';
      textEl.textContent = s.text;

      // Actions
      const actEl = document.getElementById('actionsZone');
      actEl.innerHTML = '';

      if (s.actions === 'next') {
        const btn = document.createElement('button');
        btn.className = 'btn-next fade-in';
        btn.innerHTML = '▶ Continuer';
        btn.onclick = () => showStep(s.nextStep);
        actEl.appendChild(btn);
      } else if (s.actions === 'choices') {
        const div = document.createElement('div');
        div.className = 'choices fade-in';
        s.choices.forEach(ch => {
          const btn = document.createElement('button');
          btn.className = 'choice-btn';
          btn.innerHTML = `<span class="choice-icon">${ch.icon}</span>${ch.text}`;
          btn.onclick = () => showStep(ch.next);
          div.appendChild(btn);
        });
        actEl.appendChild(div);
      } else if (s.actions === 'surnom') {
        const input = document.createElement('input');
        input.className = 'surnom-input fade-in';
        input.type = 'text';
        input.maxLength = 20;
        input.placeholder = 'Ton surnom au port...';
        input.autocomplete = 'off';
        actEl.appendChild(input);

        const btn = document.createElement('button');
        btn.className = 'btn-valider fade-in';
        btn.textContent = "C'est parti !";
        btn.disabled = true;
        btn.style.marginTop = '8px';
        input.addEventListener('input', () => { btn.disabled = input.value.trim().length < 2; });
        btn.onclick = () => {
          surnom = input.value.trim();
          if (surnom.length < 2) return;
          showBadge();
        };
        actEl.appendChild(btn);
        setTimeout(() => input.focus(), 200);
      }
    }

    function showBadge() {
      // Pasturon réagit
      const responses = [
        `${surnom} ! J'aime bien. Bienvenue au port !`,
        `${surnom} ? Parfait. On t'appellera comme ça.`,
        `${surnom} ! Ferrotti va sûrement y voir un signe cosmique.`,
        `Ah, ${surnom} ! Moi au début on m'appelait "le futur CDI". Bref.`,
      ];
      document.getElementById('charName').className = 'char-name pasturon';
      document.getElementById('charName').textContent = 'Pasturon';
      document.getElementById('dialogueText').className = 'dialogue-text fade-in';
      document.getElementById('dialogueText').textContent = responses[Math.floor(Math.random()*responses.length)];
      document.getElementById('charZone').innerHTML = SVG_PASTURON;

      const actEl = document.getElementById('actionsZone');
      actEl.innerHTML = '';

      const badge = document.createElement('div');
      badge.className = 'badge-wrap';
      badge.innerHTML = `
        <div class="badge-icon">🔵</div>
        <div class="badge-title">Bleu du Port</div>
        <div class="badge-desc">Titre débloqué · Visible sur ton profil</div>`;
      actEl.appendChild(badge);

      const btn = document.createElement('button');
      btn.className = 'btn-next';
      btn.style.marginTop = '8px';
      btn.innerHTML = '← Retour au Port';
      btn.onclick = finishScene;
      actEl.appendChild(btn);
    }

    async function finishScene() {
      try {
        const { data: fresh } = await sb.from('game_stats').select('story_progress').eq('user_id', currentUser.id).maybeSingle();
        const progress = { ...(fresh?.story_progress||{}), scene1_done:true, surnom };
        await sb.from('game_stats').update({ story_progress:progress }).eq('user_id', currentUser.id);
        await sb.from('profiles').update({ bio:`🔵 Bleu du Port · "${surnom}"` }).eq('user_id', currentUser.id);
      } catch(e) { console.log(e); }
      window.location.href = 'game.html';
    }

    async function init() {
      const { data:{ session } } = await sb.auth.getSession();
      if (!session) { window.location.href='index.html'; return; }
      currentUser = session.user;

      const { data } = await sb.from('game_stats').select('story_progress').eq('user_id', currentUser.id).maybeSingle();
      const progress = data?.story_progress || {};

      if (progress.scene1_done) {
        // Écran déjà fait
        document.getElementById('mainContent').innerHTML = `
          <div class="done-screen fade-in">
            <div style="font-size:52px">🔵</div>
            <div style="font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:#fbbf24">${progress.surnom || ''}</div>
            <div style="font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px;color:rgba(255,255,255,0.5)">Bleu du Port</div>
            <div style="font-size:13px;color:rgba(255,255,255,0.35);line-height:1.6">Tu as déjà vécu ton premier jour.<br>La suite arrive bientôt...</div>
            <button class="btn-next" onclick="window.location.href='game.html'" style="max-width:280px">← Retour au Port</button>
          </div>`;
      } else {
        showStep(0);
      }
    }

    function showToast(msg, type='') {
      const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show '+type;
      setTimeout(()=>t.className='toast',2800);
    }

    init();
  </script>
</body>
</html>
