  /* ================= LE DESSIN ================= */
  dessine:function(s,L,H){
    /* ON EFFACE D'ABORD. Sans cela, les pixels de la salle precedente
       restent dans tout ce que le decor ne recouvre pas — on voyait le
       beige de l'entrepot dans les coins du quai de nuit. */
    R(0,0,L,H,'#0a0c0e');
    /* LA CAMERA SUIT AVEC UN PEU DE RETARD et s'arrete aux murs : un
       cadrage colle au joueur donne le mal de mer, un cadrage fixe
       cacherait la moitie de l'arene. */
    var vx=Math.max(0,Math.min(HG_L-L, s.j.x-L/2));
    var vy=Math.max(0,Math.min(HG_H-H, s.j.y-H*0.56));
    s.cam.x+=(vx-s.cam.x)*0.14;
    s.cam.y+=(vy-s.cam.y)*0.14;
    if(HG_L<=L)s.cam.x=(HG_L-L)/2;
    if(HG_H<=H)s.cam.y=(HG_H-H)/2;
    /* LA SECOUSSE : deux cent quarante millisecondes apres une
       explosion, et elle s'eteint toute seule. Sans elle le bidon ne
       pese rien ; avec, on sursaute. */
    var sx=0, sy=0;
    if(s.sec>0){
      s.sec-=16;
      var am=Math.min(4,s.sec/60);
      sx=(Math.random()-0.5)*am*2;sy=(Math.random()-0.5)*am*2;
    }
    var ox=Math.round(-s.cam.x+sx), oy=Math.round(-s.cam.y+sy);
    G.save();G.translate(ox,oy);

    if(s.phase==='pret'){
      G.restore();
      R(0,0,L,H,'#15181c');
      G.fillStyle='#8fa8b4';G.font='bold 9px ui-monospace,monospace';
      G.textAlign='center';
      /* LE HANGAR NE SE JOUE PLUS QU'A UNE MANCHE : le rappel parlait
         encore d'une droite qui n'existe plus. */
      G.fillText('POSE LE POUCE ET MARCHE',L/2,H/2-8);
      G.fillStyle='#6f8694';
      G.fillText('— ca tire tout seul —',L/2,H/2+10);
      G.textAlign='left';
      return;
    }

    /* LE SOL EST DEJA GRAVE : dalle, habillage, bandes, egout et toute
       la lumiere. On ne fait plus que le poser. */
    if(!HG_SOL_T)hgCuire(s);
    G.drawImage(HG_SOL_T,0,0);
    /* LES LAMPES QUI CLIGNOTENT, elles, sont vivantes : deux ou trois
       par salle, et c'est ce battement qui empeche la salle de
       ressembler a une photo. */
    var LPZ=HG_LAMPES[s.cle||'entrepot']||HG_LAMPES.entrepot;
    for(var icl=0;icl<(s.lampes||[]).length;icl++){
      var lc=s.lampes[icl];
      if(!lc.on||!lc.cl)continue;
      var batt=(Math.sin(s.t/90+lc.ph)>0.1)?1:0.12;
      G.save();G.globalCompositeOperation='lighter';
      var rg2=G.createRadialGradient(lc.x,lc.y+6,2,lc.x,lc.y+6,LPZ.r);
      rg2.addColorStop(0,'rgba('+LPZ.c+','+(LPZ.f*0.8*batt).toFixed(3)+')');
      rg2.addColorStop(1,'rgba('+LPZ.c+',0)');
      G.fillStyle=rg2;G.fillRect(lc.x-LPZ.r,lc.y+6-LPZ.r,LPZ.r*2,LPZ.r*2);
      G.restore();
      R(lc.x-6,lc.y-1,12,3,batt>0.5?'rgba('+LPZ.c+',.92)':'#1b1f24');
    }
    /* les taches de sang, posees pour de bon */
    for(var tc=0;tc<s.tach.length;tc++){
      var ta=s.tach[tc];
      for(var ti=-ta.r;ti<=ta.r;ti++)for(var tj=-ta.r*0.6;tj<=ta.r*0.6;tj++)
        if(ti*ti/(ta.r*ta.r)+tj*tj/(ta.r*ta.r*0.36)<=1)
          R(ta.x+ti,ta.y+tj,1,1,'rgba(122,30,24,.72)');
    }
    /* LES BRAISES, posees sur le sol et vues de loin : on doit pouvoir
       les contourner en reculant, pas les decouvrir au dernier moment */
    for(var ib3=0;ib3<s.braises.length;ib3++){
      var br2=s.braises[ib3];
      var pu=0.6+0.4*Math.sin(s.t/240+ib3);
      for(var bi=-br2.r;bi<=br2.r;bi++)for(var bj=-br2.r*0.6;bj<=br2.r*0.6;bj++){
        var q2=bi*bi/(br2.r*br2.r)+bj*bj/(br2.r*br2.r*0.36);
        if(q2<=1)R(br2.x+bi,br2.y+bj,1,1,
          q2<0.35?'rgba(255,'+Math.round(140+70*pu)+',40,.92)':
          (q2<0.7?'rgba(220,80,20,.82)':'rgba(120,36,12,.7)'));
      }
      if(Math.random()<0.2)
        s.part.push({x:br2.x+(Math.random()-0.5)*br2.r,y:br2.y,vie:300,t:'flam',
                     vx:(Math.random()-0.5)*0.008,vy:-0.016});
    }
    /* LES FLAQUES DE NAPALM. Elles s'eteignent — une tache de feu qui
       reste pour toujours ferait de la salle un piege impraticable. */
    for(var ifd=0;ifd<(s.feux||[]).length;ifd++){
      var fd=s.feux[ifd];
      var ki=Math.min(1,fd.vie/700);
      var pu2=0.55+0.45*Math.sin(s.t/160+ifd*1.7);
      for(var fi=-fd.r;fi<=fd.r;fi++)for(var fj=-fd.r*0.6;fj<=fd.r*0.6;fj++){
        var qf=fi*fi/(fd.r*fd.r)+fj*fj/(fd.r*fd.r*0.36);
        if(qf>1)continue;
        R(fd.x+fi,fd.y+fj,1,1,
          qf<0.3?'rgba(255,'+Math.round(180+60*pu2)+',90,'+(0.9*ki).toFixed(2)+')':
          (qf<0.68?'rgba(240,110,20,'+(0.82*ki).toFixed(2)+')':
                   'rgba(140,42,10,'+(0.7*ki).toFixed(2)+')'));
      }
    }
    /* les murs */
    var ZM=HG_ZONES[s.zone||0].mur;
    R(0,0,HG_L,HG_MUR,ZM[0]);R(0,0,HG_L,2,ZM[1]);R(0,HG_MUR-2,HG_L,2,ZM[2]);
    R(0,HG_H-HG_MUR,HG_L,HG_MUR,ZM[0]);R(0,HG_H-HG_MUR,HG_L,2,ZM[1]);
    R(0,0,HG_MUR,HG_H,ZM[0]);R(0,0,2,HG_H,ZM[1]);R(HG_MUR-2,0,2,HG_H,ZM[2]);
    R(HG_L-HG_MUR,0,HG_MUR,HG_H,ZM[0]);R(HG_L-2,0,2,HG_H,ZM[2]);
    for(var mx=4;mx<HG_L;mx+=9){R(mx,2,2,HG_MUR-4,'rgba(0,0,0,.14)');}
    if(s.cle==='neon'){
      G.save();G.globalCompositeOperation='lighter';
      var nb2=(Math.sin(s.t/300)>-0.7)?1:0.4;
      G.fillStyle='rgba(255,79,176,'+(0.8*nb2)+')';G.fillRect(HG_MUR,HG_MUR,HG_L-2*HG_MUR,1);
      G.fillStyle='rgba(127,232,255,.7)';G.fillRect(HG_MUR,HG_H-HG_MUR-1,HG_L-2*HG_MUR,1);
      G.fillStyle='rgba(255,79,176,'+(0.22*nb2)+')';G.fillRect(HG_MUR,HG_MUR+1,HG_L-2*HG_MUR,4);
      G.restore();
    }
    /* la porte du fond */
    for(var ipd=0;ipd<(s.portes||[s.porte]).length;ipd++){
    var pd=(s.portes||[s.porte])[ipd];
    /* LA PORTE PEUT ETRE SUR N'IMPORTE QUEL MUR : on la dessine debout (haut/bas) ou couchee (gauche/droite) */
    G.save();
    if(pd.cote==='b'){G.translate(pd.x,HG_H);G.rotate(Math.PI);G.translate(-pd.x,0);}
    else if(pd.cote==='g'){G.translate(0,pd.y);G.rotate(-Math.PI/2);G.translate(-pd.y,0);}
    else if(pd.cote==='d'){G.translate(HG_L,pd.y);G.rotate(Math.PI/2);G.translate(-pd.y,0);}
    else G.translate(0,0);
    var px0=(pd.cote==='g'||pd.cote==='d')?pd.y:pd.x;
    if(pd.ouvert){
      R(px0-15,0,30,HG_MUR,'#c6e8f4');
      R(px0-15,HG_MUR-5,30,5,'#5ea8c4');
      R(px0-15,0,2,HG_MUR,'#6f6354');R(px0+13,0,2,HG_MUR,'#6f6354');
      var cl=(Math.floor(s.t/320)%2)===0;
      R(px0-15,HG_MUR,30,1,cl?'#8ad07a':'rgba(138,208,122,.4)');
      /* une fleche au sol qui pulse vers la sortie */
      var fa=0.35+0.35*Math.sin(s.t/180);G.fillStyle='rgba(138,208,122,'+fa+')';G.beginPath();G.moveTo(px0,HG_MUR+4);G.lineTo(px0-8,HG_MUR+14);G.lineTo(px0+8,HG_MUR+14);G.fill();
    }else{
      R(px0-15,0,30,HG_MUR,'#6a5a46');
      for(var pk=0;pk<5;pk++)R(px0-13+pk*6,1,4,HG_MUR-2,'#51442f');
      R(px0-15,HG_MUR-2,30,2,'#3a3024');
      R(px0-2,HG_MUR-4,4,3,'#d8a030');   /* le cadenas */
    }
    G.restore();
    /* CE QUE PROMET LA PORTE : une bulle devant elle, visible des l'entree */
    if(pd.rec){var ix=pd.x+(pd.cote==='g'?26:pd.cote==='d'?-26:0), iy=pd.y+(pd.cote==='h'?44:pd.cote==='b'?-30:0);
      hgBullePorte(G,ix,iy,pd.rec,s.t,pd.ouvert);}
    }
    /* LES PIEGES, au sol */
    for(var ipd2=0;ipd2<(s.pieges||[]).length;ipd2++){var Pd=s.pieges[ipd2];
      if(Pd.t==='scie'){R(Pd.x1-4,Pd.y-2,Pd.x2-Pd.x1+8,4,'#2a2622');R(Pd.x1-4,Pd.y-2,Pd.x2-Pd.x1+8,1,'#5a544c');
        R(Pd.x1-6,Pd.y-4,5,8,'#4a4440');R(Pd.x2+1,Pd.y-4,5,8,'#4a4440');
        for(var pq_tr2=Pd.x1;pq_tr2<Pd.x2;pq_tr2+=8)R(pq_tr2,Pd.y+1,2,1,'#e8b818');}
      else if(Pd.t==='piques'){var pq_ph2=Pd.ph, pq_al=pq_ph2>1800&&pq_ph2<=2400, pq_so=pq_ph2>2400;
        R(Pd.x-12,Pd.y-12,24,24,'#3e3a36');R(Pd.x-12,Pd.y-12,24,1,'#5e5852');R(Pd.x-12,Pd.y+11,24,1,'#24201c');
        for(var pq_py2=0;pq_py2<4;pq_py2++)for(var pq_px2=0;pq_px2<4;pq_px2++){var pq_hx=Pd.x-9+pq_px2*6, pq_hy=Pd.y-9+pq_py2*6;
          if(pq_so){R(pq_hx,pq_hy-3,2,5,'#d8dce0');R(pq_hx,pq_hy-3,1,5,'#fff');R(pq_hx-1,pq_hy+1,4,1,'#6a6460');}
          else R(pq_hx,pq_hy,2,2,pq_al&&(Math.floor(s.t/90)%2===0)?'#ff4a3a':'#1a1612');}}
      else if(Pd.t==='flamme'){var pq_gx2=Pd.cote==='g'?HG_MUR:HG_L-HG_MUR-6, pq_chauffe=Pd.ph>2600&&Pd.ph<=3200, pq_feu=Pd.ph>3200;
        R(pq_gx2,Pd.y-5,6,10,'#4a4440');R(pq_gx2,Pd.y-5,6,2,'#6a645e');R(Pd.cote==='g'?pq_gx2+6:pq_gx2-2,Pd.y-2,2,4,pq_chauffe||pq_feu?'#ff8a2a':'#2a2622');
        if(pq_chauffe&&Math.random()<0.5)s.part.push({x:Pd.cote==='g'?pq_gx2+8:pq_gx2-2,y:Pd.y,vie:200,t:'flam',vx:(Pd.cote==='g'?1:-1)*0.03,vy:-0.01});
        if(pq_feu){var pq_fx0=Pd.cote==='g'?HG_MUR+6:HG_L-HG_MUR-6-Pd.L+6;G.save();G.globalAlpha=0.35+0.15*Math.sin(s.t/40);G.fillStyle='#ff7a1a';G.fillRect(Math.round(pq_fx0),Math.round(Pd.y-6),Pd.L-6,12);G.globalAlpha=0.5;G.fillStyle='#ffd060';G.fillRect(Math.round(pq_fx0),Math.round(Pd.y-3),Pd.L-6,6);G.restore();}
        else{G.save();G.globalAlpha=pq_chauffe?0.25:0.08;G.strokeStyle='#ff6a2a';G.setLineDash([3,3]);var pq_fx1=Pd.cote==='g'?HG_MUR+6:HG_L-HG_MUR-Pd.L;G.strokeRect(Math.round(pq_fx1)+0.5,Math.round(Pd.y-6)+0.5,Pd.L-6,12);G.restore();}}
    }
    /* les obstacles */
    for(var io=0;io<s.obs.length;io++){
      var o=s.obs[io];
      hgOmbre(o.x+o.w/2,o.y+o.h,o.w);
      if(o.t==='beton'){
        /* LE BLOC DE BETON : il ne bouge pas, il ne casse pas */
        var MZ=(HG_ZONES[s.zone]||HG_ZONES[0]).mur||['#6a6a6a','#8a8a8a','#4a4a4a'];
        R(o.x,o.y,o.w,o.h,MZ[0]);R(o.x,o.y,o.w,3,MZ[1]);R(o.x,o.y+o.h-3,o.w,3,MZ[2]);R(o.x,o.y,1,o.h,MZ[1]);
        R(o.x+4,o.y+7,2,2,MZ[2]);R(o.x+o.w-7,o.y+o.h-9,2,2,MZ[2]);
      }else if(o.t==='caisse'){
        R(o.x,o.y,o.w,o.h,'#a87a42');R(o.x,o.y,o.w,2,'#cf9e62');
        R(o.x,o.y+o.h-2,o.w,2,'#654420');R(o.x,o.y+o.h/2-1,o.w,2,'#654420');
        R(o.x+o.w/3,o.y,2,o.h,'#654420');R(o.x+o.w*2/3,o.y,2,o.h,'#654420');
        R(o.x+1,o.y+2,4,4,'rgba(255,255,255,.11)');
      }else if(o.t==='baril'){
        /* LE BIDON EXPLOSIF SE VOIT DE LOIN : rouge vif, bande jaune et
           une flamme peinte. On ne doit jamais le decouvrir en sautant. */
        var cb=o.ex?'#d8402a':'#9a3a2a', ch=o.ex?'#ff6a4a':'#c4593e';
        R(o.x,o.y,o.w,o.h,cb);R(o.x,o.y,o.w,2,ch);
        R(o.x,o.y+o.h-2,o.w,2,'#5e2016');
        R(o.x,o.y+5,o.w,2,o.ex?'#f0c020':'#5e2016');
        R(o.x,o.y+o.h-7,o.w,2,o.ex?'#f0c020':'#5e2016');
        R(o.x+2,o.y+2,3,o.h-5,'rgba(255,255,255,.14)');
        if(o.ex){
          R(o.x+o.w/2-2,o.y+8,4,5,'#1a1008');
          R(o.x+o.w/2-1,o.y+9,2,3,'#ff9a2a');R(o.x+o.w/2-1,o.y+9,1,1,'#ffe08a');
        }else R(o.x+o.w/2-1,o.y+o.h/2-1,3,3,'#e8d040');
      }else if(o.t==='conteneur'){
        /* LE CONTENEUR : de la tole ondulee, un cadre, une etiquette.
           C'est le couvert le plus haut de la salle, donc il doit se
           reconnaitre d'un bord a l'autre. */
        R(o.x,o.y,o.w,o.h,'#2f6a7a');
        R(o.x,o.y,o.w,2,'#4d94a6');R(o.x,o.y+o.h-3,o.w,3,'#1a4150');
        for(var ic=2;ic<o.w-2;ic+=3){
          R(o.x+ic,o.y+2,1,o.h-5,'#246070');
          R(o.x+ic+1,o.y+2,1,o.h-5,'#39808f');
        }
        R(o.x,o.y,2,o.h,'#4d94a6');R(o.x+o.w-2,o.y,2,o.h,'#1a4150');
        R(o.x+3,o.y+o.h-9,o.w-6,4,'#d8d2c0');
        R(o.x+4,o.y+o.h-8,2,2,'#2a2a2e');R(o.x+8,o.y+o.h-8,2,2,'#2a2a2e');
        R(o.x+12,o.y+o.h-8,2,2,'#2a2a2e');
      }else if(o.t==='touret'){
        /* LE TOURET DE CABLE : rond, la ou tout le reste est carre. */
        var tcx=o.x+o.w/2, tcy=o.y+o.h/2, tr=o.w/2;
        for(var ti2=-tr;ti2<=tr;ti2++)for(var tj=-tr;tj<=tr;tj++){
          var q3=(ti2*ti2+tj*tj)/(tr*tr);
          if(q3>1)continue;
          R(tcx+ti2,tcy+tj,1,1,q3>0.82?'#5f4628':(q3>0.3?'#8f7047':'#3a3a40'));
        }
        for(var ta2=0;ta2<8;ta2++){
          var an2=ta2/8*6.283;
          R(tcx+Math.cos(an2)*tr*0.62-1,tcy+Math.sin(an2)*tr*0.62-1,2,2,'#ad8a52');
        }
        R(tcx-2,tcy-2,4,4,'#2a2a2e');
      }else if(o.t==='fut'){
        /* LE FUT, pas explosif : bleu, cercle, et pas de flamme peinte —
           on ne doit jamais le confondre avec le bidon rouge. */
        R(o.x,o.y,o.w,o.h,'#2f5a7a');R(o.x,o.y,o.w,2,'#4e86aa');
        R(o.x,o.y+o.h-2,o.w,2,'#1a3448');
        R(o.x,o.y+4,o.w,1,'#1a3448');R(o.x,o.y+o.h-6,o.w,1,'#1a3448');
        R(o.x+2,o.y+2,2,o.h-5,'rgba(255,255,255,.14)');
        R(o.x+o.w/2-2,o.y+o.h/2-1,4,3,'#9ab0c0');
      }else if(o.t==='sacs'){
        /* DES SACS EMPILES : trois bosses, pas un rectangle. */
        R(o.x,o.y+3,o.w,o.h-3,'#8e7b5a');
        R(o.x,o.y+o.h-2,o.w,2,'#5c4c32');
        for(var sk=0;sk<3;sk++){
          var sx2=o.x+1+sk*Math.round((o.w-2)/3);
          var sw2=Math.round((o.w-2)/3)-1;
          R(sx2,o.y,sw2,5,'#a69272');
          R(sx2,o.y,sw2,1,'#c2ad8a');
          R(sx2,o.y+4,sw2,1,'#6e5c40');
        }
        R(o.x+2,o.y+6,o.w-4,1,'rgba(90,74,50,.6)');
      }else if(o.t==='poutre'){
        /* UNE POUTRE COUCHEE : longue et basse, un couvert qu'on
           enjambe du regard mais pas du pas. */
        R(o.x,o.y,o.w,o.h,'#6a6f76');
        R(o.x,o.y,o.w,2,'#8f959d');R(o.x,o.y+o.h-2,o.w,2,'#3f444a');
        for(var pb=3;pb<o.w-2;pb+=7){
          R(o.x+pb,o.y+2,1,o.h-4,'#4e535a');
          R(o.x+pb+1,o.y+2,1,o.h-4,'#7c828a');
        }
        R(o.x+1,o.y+o.h/2-1,o.w-2,1,'rgba(220,140,60,.3)');
      }else if(o.t==='etal'){
        /* L'ETAL DU MARCHE : le comptoir de bois, le lit de glace pilee,
           les poissons alignes, l'ardoise du prix */
        R(o.x,o.y,o.w,o.h,'#6a4a2a');R(o.x,o.y,o.w,1,'#8a6a42');R(o.x,o.y+o.h-2,o.w,2,'#3e2a16');
        R(o.x+2,o.y+2,o.w-4,o.h-6,'#dff2fa');
        for(var gk=0;gk<10;gk++)R(o.x+2+al(gk*3.1+o.x)*(o.w-5),o.y+2+al(gk*1.7+o.y)*(o.h-7),1,1,'#ffffff');
        for(var fp=0;fp<4;fp++){var fx3=o.x+4+fp*6, fy3=o.y+3+(fp%2);
          R(fx3,fy3,4,3,fp%2?'#9ab0c0':'#c8d4dc');R(fx3,fy3,4,1,'#eef4f8');R(fx3+4,fy3,1,3,'#7a909e');R(fx3+1,fy3+1,1,1,'#14141a');}
        R(o.x+o.w-7,o.y+o.h-5,6,4,'#1c1c20');R(o.x+o.w-6,o.y+o.h-4,4,1,'#f4f4f6');
      }else if(o.t==='caisseP'){
        /* LA CAISSE DE POISSON : plastique bleu, glace, deux queues qui depassent */
        R(o.x,o.y,o.w,o.h,'#2a6ab0');R(o.x,o.y,o.w,1,'#4a8ad0');R(o.x,o.y+o.h-2,o.w,2,'#16407a');
        R(o.x+2,o.y+2,o.w-4,o.h-5,'#e6f4fa');

    if(primeV){G.fillStyle=HG_REC_P[s.rec].c;G.font='bold 6px ui-monospace,monospace';G.fillText('PRIME : '+HG_REC_P[s.rec].n,L-5,s.mod?36:29);G.font='bold 7px ui-monospace,monospace';}
    if(s.mod){G.fillStyle='#b8a0ff';G.font='bold 6px ui-monospace,monospace';G.fillText({rapides:'RAPIDES ×1,5',butin:'DOUBLE BUTIN',ricochet:'RICOCHETS',noir:'COUPURE',blindes:'BLINDÉS ×1,5'}[s.mod],L-5,29);G.font='bold 7px ui-monospace,monospace';}
    G.textAlign='left';
    G.font='bold 8px ui-monospace,monospace';
    /* le mot de la salle */

    /* LE PALIER : un bandeau d'or, la pluie de pieces fait le reste */
    if(s.palierT>0){
      s.palierT-=16;var ap2=Math.min(1,s.palierT/500), zo=1+Math.max(0,(s.palierT-3200)/400)*0.4;
      G.save();G.globalAlpha=ap2;G.fillStyle='rgba(20,14,0,.72)';G.fillRect(0,H*0.3-18,L,38);
      G.fillStyle='#ffd21f';G.fillRect(0,H*0.3-18,L,1);G.fillRect(0,H*0.3+19,L,1);

       LA CARTE SE LIT D'UN COUP D'OEIL, OU ELLE NE SE LIT PAS. Une
       icone a gauche dit la famille avant qu'on ait lu un mot ; le nom
       et l'effet tiennent sur deux lignes ; les cases a droite disent
       combien de fois on l'a deja prise, sans chiffre a dechiffrer. Et

/* LES PROMESSES DES PORTES : une couleur, un dessin, un mot */
var HG_REC_P={arme:{c:'#ff8a4a',n:'ARME'},carte:{c:'#c08cff',n:'2 CARTES'},soin:{c:'#ff5a6a',n:'SOIN'},or:{c:'#ffd21f',n:'POINTS'},
  elite:{c:'#ff3b3b',n:'ÉLITE'},evenement:{c:'#5ad8ff',n:'???'},boss:{c:'#ff3b3b',n:'BOSS'},marchand:{c:'#8ad07a',n:'MARCHAND'}};
function hgDessinRec(G,x,y,rec){
  function R(a,b,w,h,c){G.fillStyle=c;G.fillRect(Math.round(a),Math.round(b),w,h);}
  if(rec==='arme'){R(x-6,y-2,12,3,'#d8dde4');R(x-6,y-2,12,1,'#fff');R(x-4,y+1,3,3,'#a0703a');R(x+4,y-3,2,1,'#d8dde4');}
  else if(rec==='carte'){R(x-5,y-5,7,9,'#3a2a5a');R(x-5,y-5,7,9,'#c08cff');R(x-4,y-4,5,7,'#2a1a44');R(x-2,y-3,9,9,'#e8d8ff');R(x-1,y-2,7,7,'#9a6ae0');R(x+1,y,3,3,'#ffd21f');}
  else if(rec==='soin'){R(x-2,y-5,4,10,'#fff');R(x-5,y-2,10,4,'#fff');}
  else if(rec==='or'){G.fillStyle='#ffd21f';G.beginPath();G.arc(x,y,5,0,7);G.fill();R(x-1,y-3,2,6,'#a87a10');R(x-3,y-3,1,1,'#fff6c0');}
  else if(rec==='elite'||rec==='boss'){R(x-4,y-5,8,7,'#f4ece0');R(x-3,y+2,6,2,'#f4ece0');R(x-3,y-3,2,2,'#2a0a0a');R(x+1,y-3,2,2,'#2a0a0a');R(x-1,y,2,1,'#2a0a0a');
    if(rec==='elite'){R(x-4,y-8,8,2,'#ffd21f');R(x-4,y-10,2,2,'#ffd21f');R(x-1,y-10,2,2,'#ffd21f');R(x+2,y-10,2,2,'#ffd21f');}}
  else if(rec==='marchand'){R(x-4,y-3,8,7,'#c8a060');R(x-4,y-3,8,1,'#e8c890');R(x-2,y-6,4,3,'#8a6a3a');G.fillStyle='#2a1a08';G.font='bold 6px ui-monospace,monospace';G.textAlign='center';G.fillText('$',x,y+3);}
  else{G.fillStyle='#fff';G.font='bold 9px ui-monospace,monospace';G.textAlign='center';G.fillText('?',x,y+3);}
}
function hgBullePorte(G,x,y,rec,t,ouv){
  var P=HG_REC_P[rec]||HG_REC_P.evenement, f=ouv?(0.8+0.2*Math.sin(t/200)):0.55, gy=ouv?Math.sin(t/260)*1.5:0;
  G.save();G.globalAlpha=f;
  G.fillStyle='rgba(8,10,14,.78)';G.beginPath();G.arc(x,y+gy,10,0,7);G.fill();
  G.strokeStyle=P.c;G.lineWidth=1.5;G.beginPath();G.arc(x,y+gy,10,0,7);G.stroke();
  hgDessinRec(G,x,y+gy,rec);

  var w=G.measureText(P.n).width+4;G.fillStyle='rgba(8,10,14,.78)';G.fillRect(Math.round(x-w/2),Math.round(y+gy+12),Math.round(w),7);

function hgPalier(s,salle){

      s.palierT=3600;s.palierN=r.palier;s.sec=Math.max(s.sec,160);

function hgArmeMain(gx,gy,gauche,arme,t){
  var L=HG_ARME_LOOK[arme]||HG_ARME_LOOK.pistolet, d=gauche?-1:1;
  var B=function(x,y,w,h,c){R(d>0?gx+x:gx-x-w+1,gy+y,w,h,c);};
  B(-4,1,4,2,L.b);B(-4,1,4,1,'rgba(255,255,255,.18)');                 /* la crosse */
  B(0,0,L.l,L.tube?4:3,L.c);B(0,0,L.l,1,L.h);                          /* le corps et son arete */
  B(L.l,1,1,1,L.h);
  B(1,3,2,2,'#2a2228');                                                 /* la poignee */
  if(L.pompe)B(5,3,4,1,L.b);
  if(L.chargeur){B(3,3,2,3,'#1a1c22');B(3,3,2,1,'#5a5e68');}
  if(L.barillet){B(2,-1,3,5,L.c);B(3,0,1,3,'#2a2a30');}
  if(L.corps){B(0,-1,5,5,L.c);B(0,-1,5,1,L.h);}
  if(L.reservoir){B(-2,3,4,4,L.b);B(-2,3,4,1,'rgba(255,255,255,.35)');}
  if(L.fleche){B(L.l+1,1,3,1,'#d8e8f0');B(L.l+3,0,1,3,'#d8e8f0');}
  if(L.disque){var r2=Math.round(t/40)%2;B(L.l-1,-1,4,4,'#cfd8e0');B(L.l,0,2,2,r2?'#ffffff':'#8a929e');}
  if(L.canons){var k=Math.round(t/30)%3;for(var i=0;i<3;i++)B(L.l-4,((i+k)%3),5,1,i===0?L.h:'#1a1a20');}
  if(L.rails){B(3,-1,L.l-3,1,L.h);B(3,3,L.l-3,1,L.h);}
  G.save();G.globalCompositeOperation='lighter';
  if(L.bobine)for(var j=0;j<3;j++)if(Math.random()<0.6)B(2+j*3,1,1,1,'#bfeaff');
  if(L.lueur){var p=0.5+0.5*Math.sin(t/120);G.fillStyle=hgRgba(L.lueur,0.35+0.4*p);B(L.l-1,0,2,3,G.fillStyle);B(L.l+1,1,1,1,hgRgba(L.lueur,0.6*p));}
  if(L.rails)B(4,1,L.l-4,1,hgRgba(L.h,0.5+0.3*Math.sin(t/90)));
  if(L.veille){var f=Math.random();B(L.l+1,1,1,1,f<0.5?'#ffd060':'#ff8a2a');if(f<0.3)B(L.l+1,0,1,1,'#ffe8a0');}
  G.restore();
}

/* LES CARTES, EN PAGE NETTE. Dessinees dans la scene, elles etaient en
   pixels de scene — cent trente de large — et le texte bavait. En page,
   elles sont nettes, elles s'animent a l'entree, et la legendaire brille. */
function hgCartesDOM(s,M){
  var sc=document.getElementById('scene'), el=document.getElementById('hgCartes');
  if(!s||!s.cartes){if(el)el.remove();return;}
  var pretes=(s.cartesT||0)>=CARTES_PRETES;
  if(!el||el._jeu!==s.cartes){
    if(el)el.remove();
    el=document.createElement('div');el.id='hgCartes';el._jeu=s.cartes;
    var h='<div class="hc-tete"><small>'+(s.cartesTitre||('SALLE '+s.salle+' NETTOYÉE'))+'</small><b>Choisis ton bonus</b><i class="hc-barre"><u></u></i></div>';
    s.cartes.forEach(function(c,i){
      var Rr=HG_RAR[c.rar||'commune'], pris=s.am[c.c]||0, pips='';
      if(c.c!=='soin'&&c.max<=8)for(var k=0;k<c.max;k++)pips+='<i class="'+(k<pris?'on':'')+'"></i>';
      h+='<button class="hc-carte '+(c.rar||'commune')+'" data-i="'+i+'" style="--c:'+Rr.c+';animation-delay:'+(i*90)+'ms">'+
         '<span class="hc-ico">'+hgIcone(c.c,Rr.c)+'</span>'+
         '<span class="hc-tx"><em>'+Rr.nom+'</em><b>'+c.nom+'</b><span>'+c.dit+'</span><span class="hc-pips">'+pips+'</span></span>'+
         '<span class="hc-niv">'+(pris?'NIV '+(pris+1):'NOUVEAU')+'</span></button>';
    });
    var deja=HG_CARTES.filter(function(c){return s.am[c.c];}).map(function(c){var cc=HG_RAR[c.rar||'commune'].c;
      return '<i style="--c:'+cc+'">'+hgIcone(c.c,cc,13)+'×'+s.am[c.c]+'</i>';}).join('');
    h+='<div class="hc-deja"><small>TON ÉQUIPEMENT · '+HG_ARMES[s.arme].nom+'</small><div>'+(deja||'<span>Rien encore — c’est ta première.</span>')+'</div></div>';
    el.innerHTML=h;sc.appendChild(el);
    [].forEach.call(el.querySelectorAll('.hc-carte'),function(b){
      b.onclick=function(ev){ev.stopPropagation();if((s.cartesT||0)<CARTES_PRETES)return;
        try{navigator.vibrate&&navigator.vibrate(12);}catch(x){}
        M.prendreCarte(s,+b.dataset.i);hgCartesDOM(s,M);};
    });
  }
  el.classList.toggle('pret',pretes);

/* L'ICONE D'UNE ARME SE DEDUIT DE SES CHIFFRES, elle n'est pas dessinee
   a la main. Douze dessins faits un par un auraient douze styles et
   douze erreurs ; ici la longueur du canon vient de la portee, son
   epaisseur des degats, le chargeur du nombre de coups, et la marque du
   bout vient de ce que l'arme fait de particulier. Une arme qu'on
   reglerait demain changerait d'icone toute seule. */
function hgArmeIcone(g2,A,L2,H2){
  var P=function(x,y,w,h,c){g2.fillStyle=c;g2.fillRect(x,y,w,h);};
  g2.clearRect(0,0,L2,H2);
  var sol=H2-5;
  var lon=Math.round(5+Math.min(11,A.por/24));      /* la portee fait le canon */
  var ep=Math.max(2,Math.min(5,1+A.deg));            /* les degats, son epaisseur */
  var ch=Math.max(2,Math.min(9,Math.round(A.chg/8)+2));
  var x0=4;
  /* la crosse */
  P(x0,sol-5,5,6,'#6b4a28');P(x0,sol-5,5,1,'#8d6436');P(x0,sol,5,1,'#3f2c18');
  /* le corps */
  P(x0+4,sol-7,8,8,'#3a4149');P(x0+4,sol-7,8,1,'#636d78');P(x0+4,sol,8,1,'#1d2126');
  /* le chargeur, sous le corps */
  P(x0+6,sol+1,4,ch,'#2a3038');P(x0+6,sol+1,4,1,'#4e5660');
  /* le canon */
  var by=sol-5-Math.floor(ep/2);
  P(x0+12,by,lon,ep,'#515a64');P(x0+12,by,lon,1,'#8d97a2');
  P(x0+12,by+ep-1,lon,1,'#272c32');
  var bx=x0+12+lon;
  /* LA MARQUE DU BOUT : c'est elle qu'on lit en premier, donc c'est
     elle qui doit dire ce que l'arme a d'unique. */
  if(A.feu){for(var k=0;k<4;k++)P(bx+k,by-1+((k%2)?0:1),2,ep,
      k<2?'#ff9a2a':'rgba(255,154,42,.5)');}
  else if(A.arc){for(var z=0;z<5;z++)P(bx+z,by-2+((z%2)?3:0),2,2,A.c);}
  else if(A.rayon){P(bx,by+Math.floor(ep/2)-1,10,2,A.c);
    P(bx,by+Math.floor(ep/2)-1,10,1,'#ffffff');}
  else if(A.obus){P(bx,by-2,5,ep+4,'#8d9a6a');P(bx,by-2,5,1,'#c8d0a0');}
  else if(A.ric){
    for(var ii=-4;ii<=4;ii++)for(var jj=-4;jj<=4;jj++)
      if(ii*ii+jj*jj<=16)P(bx+2+ii,by+Math.floor(ep/2)+jj,1,1,
        (ii*ii+jj*jj>10)?'#dfe8f0':'#9aa6b2');
  }
  else{P(bx,by,3,ep,A.c);P(bx,by,3,1,'#ffffff');}
  /* LES ARMES DE LA BOUTIQUE ONT UNE LUEUR : un liseré de leur couleur
     autour de la bouche, pour qu'on les reconnaisse du premier coup d'œil */
  if(A.halo){P(bx-1,by-1,1,ep+2,A.c);P(bx+3,by-1,1,ep+2,A.c);P(bx,by-2,3,1,A.c);}
}
/* LA VIGNETTE D'UNE ZONE : sa dalle, ses murs, un reste de lumiere. On
   ne montre pas une capture — on montre la COULEUR du lieu, qui est la
   seule chose qu'on reconnait de loin. */
function hgZoneVignette(g2,Z,L2,H2){
  var SOL=HG_SOLS[Z.sol];
  g2.clearRect(0,0,L2,H2);
  for(var y=0;y<H2;y+=6)for(var x=0;x<L2;x+=6){
    g2.fillStyle=SOL[Math.floor(al(x*7.1+y*3.3)*3)];
    g2.fillRect(x,y,6,6);
    g2.fillStyle=SOL[3];g2.fillRect(x,y,6,1);g2.fillRect(x,y,1,6);
  }
  g2.fillStyle=Z.mur[0];g2.fillRect(0,0,L2,5);g2.fillRect(0,H2-5,L2,5);
  g2.fillStyle=Z.mur[1];g2.fillRect(0,0,L2,1);g2.fillRect(0,H2-5,L2,1);
  var LP=HG_LAMPES[Z.cle]||HG_LAMPES.entrepot;
  g2.save();g2.globalCompositeOperation='lighter';
  for(var lx=22;lx<L2;lx+=46){
    var rg=g2.createRadialGradient(lx,H2/2,2,lx,H2/2,24);
    rg.addColorStop(0,'rgba('+LP.c+','+(LP.f*1.3).toFixed(2)+')');
    rg.addColorStop(1,'rgba('+LP.c+',0)');
    g2.fillStyle=rg;g2.fillRect(lx-24,H2/2-24,48,48);
  }
  g2.restore();
  g2.fillStyle='rgba(6,8,12,'+((HG_AMB[Z.cle]||0.1)*1.4).toFixed(2)+')';
  g2.fillRect(0,0,L2,H2);
}

/* la ferme chronometree est retiree de la salle (la ferme se joue dans le jeu) */

function boucle(ts){
  if(!BORNE){RAF=null;return;}
  var dt=Math.min(60,ts-(boucle.vu||ts));boucle.vu=ts;
  var av=S.phase;
  BORNE.pas(S,dt);
  /* UNE BORNE PEUT DEMANDER QU'ON RANGE LES MANCHES — un ecran de choix,
     une pause. Les zones couvrent toute la scene : tant qu'elles sont
     la, rien ne peut etre touche sur le canvas. */
  var fige=!!(BORNE.fige&&BORNE.fige(S));
  if(fige!==boucle.fige){
    boucle.fige=fige;
    JEU.classList.toggle('fige',fige);
    if(fige){MG.lache();MD.lache();}
  }
  /* une partie qui se termine toute seule — on meurt, le chrono tombe —
     doit rendre son chrome sans attendre un clic */
  if(S.phase!==av)majPlein();
  /* ON LE DIT AU MOMENT OU ON PASSE DEVANT, pas a la fin : c'est ce
     moment-la qu'on vient chercher. */
  if(!REC_BATTU&&REC.score>0&&S.score>REC.score){
    REC_BATTU=true;dire('RECORD BATTU · '+REC.pseudo.toUpperCase()+' DÉPASSÉ','gros');
  }
  BORNE.dessine(S,SL,SH);
  RAF=requestAnimationFrame(boucle);
}

function ouvrirBorne(B){
  BORNE=MOTEUR[B.cle];if(!BORNE)return;
  BORNE.cle=B.cle;
  S=BORNE.init();
  PARTIE=null;OCCUPE=false;
  document.getElementById('jtitre').querySelector('b').textContent=BORNE.nom;
  document.getElementById('jtitre').querySelector('small').textContent=BORNE.sous;
  JEU.hidden=false;
  majSolde();
  dire('Un jeton, et c’est parti.');
  monterActions();
  mnuFermer();
  JEU.classList.remove('fige');boucle.fige=false;
  /* UNE BORNE PEUT N'EN VOULOIR QU'UNE. Le Hangar tire tout seul : une
     manche droite qui ne sert a rien occupe un pouce et la moitie de
     l'ecran pour rien. */
  var deux=(BORNE.manches&&BORNE.manches!=='une');
  ['mg','zg','sg'].forEach(function(k){
    document.getElementById(k).classList.toggle('on',!!BORNE.manches);
  });
  ['md','zd','sd'].forEach(function(k){
    document.getElementById(k).classList.toggle('on',deux);
  });
  document.getElementById('zg').style.width=deux?'50%':'100%';
  document.getElementById('hgAct').classList.toggle('on',BORNE===MOTEUR.hangar);
  document.getElementById('sg').classList.remove('parti');
  document.getElementById('sd').classList.remove('parti');
  MG.lache();MD.lache();
  cadrer();
  boucle.vu=0;
  if(!RAF)RAF=requestAnimationFrame(boucle);
  CV.onpointerdown=function(ev){
    if(!BORNE||!S||S.phase!=='jeu')return;
    ev.preventDefault();
    if(!BORNE.tape)return;
    var b=CV.getBoundingClientRect();
    BORNE.tape(S,(ev.clientX-b.left)/b.width*SL,(ev.clientY-b.top)/b.height*SH);
  };
  chargerClassement(B.cle);
  /* LE RECORD DU JOUEUR, LU AU COMPTOIR : c'est lui qui dit quelles
     armes sont deja debloquees. La page ne le calcule pas, elle le
     demande. */
  fmBoutons();
  if(B.cle==='ferme'){MNU_ONG='jouer';mnuOuvrir();fmCharger();}
  if(B.cle==='hangar'){
    mnuOuvrir();
    chargerArsenal();
    hgCharger();
    (async function(){
      try{var r=await rpc('arcade_record',{p_borne:'hangar'});
          if(r&&typeof r.score==='number'){HG_REC=r.score;
            HG_PARTIES=r.parties||0;
            if(!MNU.hidden)mnuMaj();}}catch(e){}
    })();
  }
}
function fermerBorne(){
  var hcx=document.getElementById('hgCartes');if(hcx)hcx.remove();
  mnuFermer();
  /* ON POSE LE SCORE AVANT DE PARTIR. Sans ca, quitter en cours de
     partie serait le moyen le plus simple d'effacer une mauvaise
     manche — le jeton serait paye pour rien, mais le tableau ne
     retiendrait que les bonnes. */
  if(S&&PARTIE&&S.phase!=='pret'&&S.phase!=='fini')finirPartie(S.score,true);
  JEU.hidden=true;JEU.classList.remove('plein');
  if(RAF){cancelAnimationFrame(RAF);RAF=null;}
  BORNE=null;S=null;CV.onpointerdown=null;try{document.getElementById('hgAct').classList.remove('on');fmBoutons();}catch(x){}
  document.getElementById('mg').classList.remove('on');
  document.getElementById('md').classList.remove('on');
  MG.lache();MD.lache();
  majSolde();
}
document.getElementById('sortie').onclick=function(){if(!OCCUPE)fermerBorne();};
document.getElementById('retourJeu').onclick=function(){if(!OCCUPE)fermerBorne();};

/* LE PLEIN ECRAN NE DURE QUE LE TEMPS DE LA PARTIE. Entre deux, on
   remet le bandeau, le solde et le tableau : c'est a ce moment-la qu'on
   les regarde, et une borne qui garde son chrome pendant qu'on tire
   n'est plus une borne, c'est une page web avec un jeu dedans. */
function majPlein(){
  var p=!!(S&&S.phase==='jeu');
  if(JEU.classList.contains('plein')===p)return;
  JEU.classList.toggle('plein',p);
  /* la scene change de taille : il faut recadrer avant la prochaine
     image, sinon on dessine une frame a l'ancienne dimension */
  if(BORNE)cadrer();
}
function monterActions(){
  if(!BORNE)return;
  majPlein();
  JACT.innerHTML=BORNE.actions(S);
  [].forEach.call(JACT.querySelectorAll('button'),function(b){
    b.onclick=function(){
      var a=b.getAttribute('data-a');
      if(a==='commencer'||a==='rejouer')return prendreJeton();
      if(BORNE.action)BORNE.action(S,a);
    };
  });
}
function verrou(v){
  OCCUPE=v;
  [].forEach.call(JACT.querySelectorAll('button'),function(b){b.disabled=v;});
}

async function prendreJeton(arme){
  verrou(true);dire('On glisse le jeton…');
  var choisie=arme||CHOIX_ARME||'pistolet';
  var sem=(BORNE.cle==='hangar'&&MODE_HG==='semaine');
  var r=sem?await rpc('arcade_demarrer_semaine',{p_arme:choisie}):await rpc('arcade_demarrer',{p_borne:BORNE.cle,p_arme:choisie});
  if(!r||r.erreur){dire((r&&r.erreur)||'La salle ne répond pas.','mal');verrou(false);return;}
  GRAINE=(sem&&r.graine)?r.graine:null;
  PARTIE=r.partie;
  ARME_DEPART=r.arme||choisie;
  if(typeof r.euros==='number'){SOLDE=r.euros;noterEuros(r.euros);majSolde();}
  /* ON PASSE EN PLEIN ECRAN AVANT DE GARNIR LA SCENE. L'inverse posait
     les conteneurs du grappin avec les mesures de l'ecran reduit, puis
     la scene s'agrandissait : la pile restait a mi-hauteur et le crochet
     descendait dans le vide tout en la ramassant quand meme. */
  S=BORNE.init();
  S.phase='jeu';
  REC_BATTU=false;
  majPlein();
  if(BORNE.demarrer)BORNE.demarrer(S);
  else if(BORNE.remplir)BORNE.remplir(S);
  dire('');
  monterActions();verrou(false);
}

async function finirPartie(score,silencieux){
  var p=PARTIE;PARTIE=null;
  if(!p)return;
  monterActions();
  var hg=!!(BORNE&&BORNE===MOTEUR.hangar&&S), stats={};
  if(hg){stats=Object.assign({},S.st||{});stats.salle=S.salle;stats.tues=S.tues||0;}
  var r=await rpc('arcade_score',hg?{p_partie:p,p_score:Math.round(score),p_stats:stats}:{p_partie:p,p_score:Math.round(score)});
  if(hg&&r&&!r.erreur){HG_DEFIS=null;HG_SEM=null;if(typeof r.record==='number')HG_REC=Math.max(HG_REC,r.record);hgCharger();}
  if(silencieux)return;
  if(r&&r.erreur){dire(r.erreur,'mal');return;}
  if(!r)return;
  if(typeof r.euros==='number'){SOLDE=r.euros;noterEuros(r.euros);majSolde();}
  var m=score.toLocaleString('fr-FR')+' points · '+r.rang+(r.rang===1?'er':'e')+' au tableau'+
        (r.gain>0?' · +'+(r.gain/100).toFixed(2).replace('.',',')+' € · +'+r.points+' au classement':'');
  /* LE RANG FRANCHI et LES DEFIS REUSSIS passent avant tout le reste */
  if(r.grade_gain>0)m='NOUVEAU RANG : '+HG_GRADES[r.grade].n+' · +'+enEuros(r.grade_gain)+' · '+m;
  if(r.defis&&r.defis.length)m='DÉFI'+(r.defis.length>1?'S':'')+' RÉUSSI'+(r.defis.length>1?'S':'')+' · +'+enEuros(r.defis_gain)+' · '+m;
  if(r.semaine)m='LA SEMAINE · '+m;
  dire(m,(r.rang<=3||r.grade_gain>0||r.defis_gain>0)?'gros':'bon');
  chargerClassement(BORNE?BORNE.cle:null);
}

async function chargerClassement(cle){
  if(!cle)return;
  REC={score:0,pseudo:''};
  JCLS.innerHTML='<div class="t">LE TABLEAU DE LA BORNE</div>';
  var r=await rpc('arcade_classement',{p_borne:cle});
  if(!r||r.erreur||!r.length){
    JCLS.innerHTML+='<div class="l"><u>Personne n’a encore posé de score.</u></div>';
    return;
  }
  REC={score:r[0].score, pseudo:r[0].pseudo};
  var h='';
  r.slice(0,8).forEach(function(l,i){
    h+='<div class="l'+(l.joueur===MOI?' moi':'')+'">'+
       '<i>'+(i+1)+'</i><u>'+l.pseudo+'</u><b>'+l.score.toLocaleString('fr-FR')+'</b></div>';
  });
  JCLS.innerHTML='<div class="t">LE TABLEAU DE LA BORNE</div>'+h;
}

window.addEventListener('resize',function(){if(BORNE)cadrer();});
window.addEventListener('orientationchange',function(){
  setTimeout(function(){if(BORNE)cadrer();},180);
});
