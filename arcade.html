<script>
/* LA VERSION, comme sur toutes les pages du jeu. Le drapeau anti-boucle
   porte le chemin de la page : s'il ne le portait pas, une page deja
   rechargee pour la version du jour empecherait celle-ci de se recharger
   a son tour, et l'on jouerait une vieille copie sans le savoir. */
(function(){
  var MA_VERSION='2026-10-16-3500';
  window.MA_VERSION=MA_VERSION;
  var cle='bdl.version.vue:'+location.pathname.split('?')[0];
  function verifier(){
    fetch('version.json?t='+Date.now(),{cache:'no-store'})
      .then(function(r){return r.json();})
      .then(function(d){
        if(!d||!d.v)return;
        try{localStorage.setItem('bdl.v',d.v);}catch(e){}
        if(d.v===MA_VERSION)return;
        var deja=null;try{deja=sessionStorage.getItem(cle);}catch(e){}
        if(deja===d.v)return;
        try{sessionStorage.setItem(cle,d.v);}catch(e){}
        location.replace(location.pathname.split('?')[0]+'?v='+encodeURIComponent(d.v));
      }).catch(function(){});
  }
  verifier();
  var vu=Date.now();
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState!=='visible')return;
    if(Date.now()-vu>120000)verifier();
    vu=Date.now();
  });
})();
</script>

/* LES DEUX MANCHES. Posees PAR-DESSUS l'ecran, aux deux coins du bas,
   et pas dessinees dedans : le canvas est agrandi d'un facteur entier
   qui depend du telephone, donc une manche dessinee dans la scene ferait
   trois centimetres sur un grand ecran et un centimetre sur un petit.
   En points d'ecran, elles font toujours la taille d'un pouce.
   TRANSPARENTES ET BASSES : elles couvrent le bas de l'arene, la ou l'on
   ne va pas souvent, et on voit a travers. */
/* =====================================================================
   LES MANCHES SONT FLOTTANTES, comme le joystick du jeu.
   Fixees dans les coins, elles obligeaient a aller chercher un rond de
   cent six pixels toujours au meme endroit, avec une course de
   quarante-cinq : le pouce partait de loin et arrivait au bout avant
   que le personnage n'ait pris sa vitesse. Maintenant la manche nait
   SOUS LE POUCE, la ou il se pose, avec une course de trente-quatre —
   la meme que partout ailleurs dans Battle Dock. La moitie gauche de
   l'ecran marche, la moitie droite vise.
   ===================================================================== */

 background:conic-gradient(rgba(255,255,255,.08) calc(var(--p,1) * 360deg),rgba(0,0,0,.55) 0);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25);display:grid;place-items:center;user-select:none;-webkit-user-select:none}

/* =====================================================================
   LE PLEIN ECRAN, pendant la partie seulement.

   Le bandeau du haut, la barre de boutons et le tableau des scores
   disparaissent : il ne reste que le jeu, bord a bord. Ce qui doit
   rester a portee de pouce se pose PAR-DESSUS, en points d'ecran — le
   retour, l'action, le message — pour les memes raisons que les manches.

   Le tableau et le solde reviennent entre deux parties : c'est la qu'on
   les regarde, pas pendant qu'on tire.
   ===================================================================== */
#jeu.plein #jb,
#jeu.plein #jcls{display:none}

  background:none;border-top:0;padding:0;pointer-events:none}

#retourJeu:active{background:rgba(90,216,255,.26)}
/* =====================================================================
   LE MENU DE LA BORNE
   La borne n'avait qu'un bouton : COMMENCER. Tout ce qu'elle contenait —
   douze armes, cinq zones, neuf especes, un record — n'existait que
   pendant la partie, c'est-a-dire au moment ou l'on n'a pas une seconde
   pour le lire. On ne savait donc pas ce qu'on jouait, ni ce qui restait
   a ouvrir, ni pourquoi relancer.
   Le menu est la reponse : quatre onglets, et chacun montre une partie
   du jeu qu'on ne voyait pas. C'est lui qui donne envie de la salle
   suivante, pas l'ecran de mort.
   ===================================================================== *//* LE MENU PREND LA PLACE DE LA SCENE, il ne se pose pas dessus : pose
   dessus, la scene continuait de tourner derriere pour rien, et la
   barre du bas montrait un COMMENCER qui faisait double emploi avec le
   bouton du menu. */

#jeu.menu #scene,#jeu.menu #jbas{display:none}
/* LE MENU SIMPLE : quatre onglets avec une icone, un ecran d'accueil qui
   tient sur un telephone sans defiler, et le gros bouton en bas. */

var CV=document.getElementById('ecran'), G=CV.getContext('2d');
var SL=0, SH=0, ECH=1;
/* =====================================================================
   LA SCENE EPOUSE L'ECRAN.

   Premiere version : chaque borne annoncait sa taille — 120 sur 168, 128
   sur 140 — et le canvas se posait au milieu avec du noir autour. Sur un
   telephone en portrait ca faisait un timbre-poste a mi-hauteur, et le
   jeu avait l'air d'etre une fenetre dans une page plutot qu'une borne.

   Maintenant c'est l'inverse : on prend l'ecran, on choisit un facteur
   d'agrandissement ENTIER qui donne un pixel bien gras, et la taille
   logique se deduit de ce qui reste. Une borne ne connait donc plus sa
   largeur a l'avance ; elle recoit L et H a chaque image et se range
   dedans. C'est la seule facon qu'un meme jeu tienne sur un petit
   telephone comme sur une tablette sans bande noire ni pixel bave.

   POURQUOI UN FACTEUR ENTIER, ENCORE. A 2,75 fois, un pixel sur quatre
   fait trois points et les autres deux : les traits deviennent inegaux
   et tout le dessin tremble des qu'il bouge. On perd au pire quelques
   points sur les bords, et c'est tout ce que ca coute.
   ===================================================================== */
function cadrer(){
  var b=document.getElementById('scene').getBoundingClientRect();
  var dl=Math.max(80,Math.floor(b.width)), dh=Math.max(80,Math.floor(b.height));
  /* on vise environ 150 pixels de scene en largeur : en dessous le
     dessin devient trop grossier pour qu'on lise les bestioles, au-dessus
     le pixel n'est plus assez gros pour qu'on voie que c'en est un */
  var vise=(BORNE&&BORNE.vise)||150;
  ECH=Math.max(2,Math.min(7,Math.round(dl/vise)));
  SL=Math.floor(dl/ECH);SH=Math.floor(dh/ECH);
  var D=Math.max(1,Math.min(3,Math.floor(window.devicePixelRatio||1)));
  CV.width=SL*ECH*D;CV.height=SH*ECH*D;
  CV.style.width=(SL*ECH)+'px';CV.style.height=(SH*ECH)+'px';
  G.setTransform(ECH*D,0,0,ECH*D,0,0);G.imageSmoothingEnabled=false;
  if(BORNE&&BORNE.cadre&&S)BORNE.cadre(S,SL,SH);
}

/* =====================================================================
   LES MANCHES. Chacune rend un vecteur de -1 a 1 ; une manche lachee
   rend zero. On suit le doigt par son pointerId, sinon deux pouces sur
   l'ecran se volent mutuellement leur manche.
   ===================================================================== */
var RAYON_M=34;         /* la course de la manche, la meme que dans le jeu */
function Manche(el,zone,sou){
  var M={x:0,y:0,n:0,id:null,el:el,ox:0,oy:0,
         bout:el.querySelector('u')};
  function poser(x,y){
    /* L'ORIGINE SUIT LE POUCE QUAND IL DEPASSE LA COURSE. Sans cela, un
       doigt qui glisse loin reste bloque a fond dans une direction et
       l'on ne peut plus corriger sa trajectoire sans relacher. */
    var dx=x-M.ox, dy=y-M.oy, d=Math.hypot(dx,dy);
    if(d>RAYON_M){
      var a=Math.atan2(dy,dx);
      M.ox=x-Math.cos(a)*RAYON_M;M.oy=y-Math.sin(a)*RAYON_M;
      dx=Math.cos(a)*RAYON_M;dy=Math.sin(a)*RAYON_M;d=RAYON_M;
      el.style.transform='translate('+M.ox+'px,'+M.oy+'px)';
    }
    M.x=d<1?0:dx/RAYON_M;M.y=d<1?0:dy/RAYON_M;M.n=Math.min(1,d/RAYON_M);
    if(M.n<0.14){M.x=M.y=0;M.n=0;}
    M.bout.style.transform='translate('+dx.toFixed(1)+'px,'+dy.toFixed(1)+'px)';
  }
  function naitre(x,y){
    M.ox=x;M.oy=y;
    el.style.transform='translate('+x+'px,'+y+'px)';
    el.classList.add('tenue');
    if(sou)sou.classList.add('parti');
    poser(x,y);
  }
  function lache(){
    M.id=null;M.x=M.y=M.n=0;
    M.bout.style.transform='';el.classList.remove('tenue');
  }
  zone.addEventListener('pointerdown',function(ev){
    if(M.id!==null)return;
    ev.preventDefault();
    M.id=ev.pointerId;
    /* LA CAPTURE PEUT LEVER — pointeur deja relache, evenement
       synthetique — et une exception ici avortait la prise : la manche
       ne naissait jamais sous le pouce. Elle est un confort, pas une
       condition. */
    try{zone.setPointerCapture&&zone.setPointerCapture(ev.pointerId);}catch(e){}
    naitre(ev.clientX,ev.clientY);
  });
  zone.addEventListener('pointermove',function(ev){
    if(ev.pointerId!==M.id)return;
    ev.preventDefault();poser(ev.clientX,ev.clientY);
  });
  ['pointerup','pointercancel'].forEach(function(k){
    zone.addEventListener(k,function(ev){if(ev.pointerId===M.id)lache();});
  });
  M.lache=lache;
  return M;
}

    for(var i=0;i<l.length;i++){
      var c=pal[l[i]];if(!c)continue;
      var px=z.mir?l.length-1-i:i, dx=0, dy=0;
      if(j<tete){dx=f+recul;dy=dodel;}                 /* la tete en avant, qui dodeline */
      else if(j<pied){dx=recul;}
      else{                                            /* les jambes en ciseaux */
        var gauche=chien?((Math.floor(i/3)%2)===0):(i<w/2);
        dx=gauche?st:-st;
        if(j===n-1&&st!==0&&((st>0)===gauche))dy=-1;   /* le pied qui avance se leve */
      }
      R(x+px+dx,y+j+dy+enfoui,1,1,c);
    }
  }
  /* LES BRAS TENDUS, quand la proie est a portee */
  if(z.proche&&!chien&&z.art!==4&&!(z.nait>0)){
    var sy=y+Math.round(n*0.44), cx=x+Math.round(w/2)+f*3, bat=Math.round(Math.sin(t/110+(z.x||0))*1);
    var peau=pal['5']||'#a9ba91', ombre=pal['7']||'#647553';
    for(var k=0;k<2;k++){
      var yy=sy+k*3+(k?bat:-bat), L2=7+k;
      R(Math.min(cx,cx+f*L2),yy,L2,2,peau);
      R(Math.min(cx,cx+f*L2),yy+1,L2,1,ombre);
      R(cx+f*L2-(f<0?1:0),yy-1,2,3,ombre);              /* la main crispee */
    }
  }
}
/* LE CADAVRE : il bascule vers l'arriere, pivote sur ses pieds jusqu'au
   sol, reste un moment allonge dans sa flaque, puis s'efface. */
function hgCadavre(m,t){
  var art=m.gros?HGA_G:HGA_Z[m.art], pal=m.gros?(m.pal||HGP_G):HGP_Z;
  if(!art)return;
  var n=art.length, w=art[0].length;
  var k=Math.min(1,m.t/240), ang=m.dir*k*k*Math.PI/2;
  var a=m.t>1700?Math.max(0,1-(m.t-1700)/900):1;
  var fl=Math.min(1,m.t/700)*(m.gros?11:7);
  G.save();G.globalAlpha=a*0.85;
  G.fillStyle='rgba(110,24,20,.75)';G.beginPath();G.ellipse(m.x+m.dir*n*0.45,m.y+5,fl*1.4,fl*0.6,0,0,7);G.fill();
  G.globalAlpha=a;
  G.translate(Math.round(m.x),Math.round(m.y+6));G.rotate(ang);
  hgArt(-Math.round(w/2),-n,art,pal,m.mir);
  G.restore();
}
function hgOmbre(cx,cy,w){
  var rx=w/2, ry=Math.max(2,w*0.22);
  for(var i=-rx;i<=rx;i++)for(var j=-ry;j<=ry;j++){
    var q=(i*i)/(rx*rx)+(j*j)/(ry*ry);
    if(q<=1)R(cx+i,cy+j,1,1,q<0.45?'rgba(0,0,0,.3)':'rgba(0,0,0,.17)');
  }
}

/* =====================================================================
   LE SOL SE CUIT UNE FOIS PAR SALLE
   Le carrelage se redessinait a chaque image : six cents cases, trois
   rectangles chacune, avant meme d'avoir pose le premier zombie. En y
   ajoutant l'habillage et la lumiere on serait passe a dix mille
   rectangles par image, sur un telephone. Or rien de tout cela ne
   bouge : on le grave UNE FOIS dans une toile de la taille de l'arene,
   et l'image ne fait plus qu'un drawImage.
   ===================================================================== */
var HG_SOL_T=null;
function hgCuire(s){
  if(!HG_SOL_T){HG_SOL_T=document.createElement('canvas');
    HG_SOL_T.width=HG_L;HG_SOL_T.height=HG_H;}
  var c=HG_SOL_T, g2=c.getContext('2d');
  g2.imageSmoothingEnabled=false;
  g2.clearRect(0,0,HG_L,HG_H);
  var P=function(x,y,w,h,col){g2.fillStyle=col;
    g2.fillRect(Math.round(x),Math.round(y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)));};
  var SOL=HG_SOLS[s.teinte||0];
  var CLS=s.cle||'entrepot', INDUS=['marche','neon','cimetiere'].indexOf(CLS)<0;
  if(CLS==='marche'){
    /* LE CARRELAGE DU MARCHE : de petits carreaux blancs, des joints gris,
       et l'eau qui ruisselle en longues traces brillantes */
    for(var y=0;y<HG_H;y+=8)for(var x=0;x<HG_L;x+=8){
      P(x,y,8,8,SOL[Math.floor(al(x*7.1+y*3.3)*3)]);
      P(x,y,8,1,SOL[3]);P(x,y,1,8,SOL[3]);
      if(al(x*1.3+y*5.7)<0.08)P(x+2,y+2,3,1,'rgba(255,255,255,.7)');
    }
    for(var rv=0;rv<9;rv++){var rx0=HG_MUR+al(rv*3.1)*(HG_L-2*HG_MUR);
      for(var ry=HG_MUR;ry<HG_H-HG_MUR;ry+=2)P(rx0+Math.sin(ry/23+rv)*4,ry,2,2,'rgba(120,170,200,.10)');}
  }else if(CLS==='neon'){
    /* L'ASPHALTE DE TOKYO : grain, places peintes, et un passage pieton */
    for(var y=0;y<HG_H;y+=4)for(var x=0;x<HG_L;x+=4)P(x,y,4,4,SOL[Math.floor(al(x*7.1+y*3.3)*3)]);
    for(var gn=0;gn<900;gn++)P(HG_MUR+al(gn*1.7)*(HG_L-2*HG_MUR),HG_MUR+al(gn*2.9)*(HG_H-2*HG_MUR),1,1,'rgba(255,255,255,.05)');
    for(var lx=HG_MUR+14;lx<HG_L-HG_MUR;lx+=40){P(lx,HG_MUR+70,2,44,'rgba(235,235,245,.35)');P(lx,HG_H-HG_MUR-140,2,44,'rgba(235,235,245,.35)');}
    P(HG_MUR,HG_MUR+70,HG_L-2*HG_MUR,2,'rgba(235,235,245,.3)');P(HG_MUR,HG_H-HG_MUR-98,HG_L-2*HG_MUR,2,'rgba(235,235,245,.3)');
    for(var cp=HG_MUR+20;cp<HG_L-HG_MUR-20;cp+=12)P(cp,HG_H/2-8,7,22,'rgba(235,235,245,.22)');
  }else if(CLS==='cimetiere'){
    /* LA TERRE DU CIMETIERE : herbe rase par plaques, sable, une allee de dalles */
    for(var y=0;y<HG_H;y+=3)for(var x=0;x<HG_L;x+=3){
      var tt3=al(x*0.37+y*0.71);P(x,y,3,3,tt3<0.4?SOL[0]:(tt3<0.75?SOL[1]:SOL[2]));
      if(al(x*2.1+y*1.3)<0.05)P(x,y,1,2,'#7a8a4a');}
    for(var dy2=HG_MUR+20;dy2<HG_H-HG_MUR;dy2+=16){var dx2=HG_L/2-9+Math.round(Math.sin(dy2/40)*6);
      P(dx2,dy2,18,12,'#8a8676');P(dx2,dy2,18,1,'#a8a494');P(dx2,dy2+11,18,1,'#5c584c');}
  }else{
  /* la dalle */
  for(var y=0;y<HG_H;y+=12)for(var x=0;x<HG_L;x+=12){
    P(x,y,12,12,SOL[Math.floor(al(x*7.1+y*3.3)*3)]);
    P(x,y,12,1,SOL[3]);P(x,y,1,12,SOL[3]);
  }
  }
  /* l'habillage */
  for(var i=0;i<(s.deco||[]).length;i++)hgDeco(P,g2,s.deco[i],s);
  /* les bandes de securite : seulement dans les lieux industriels */
  if(INDUS)for(var bx=HG_MUR+4;bx<HG_L-HG_MUR-4;bx++){
    var tt=Math.floor(bx/4)%2===0;
    P(bx,HG_MUR+4,1,2,tt?'#f0b800':'#1d1d1d');
    P(bx,HG_H-HG_MUR-6,1,2,tt?'#f0b800':'#1d1d1d');
  }
  if(INDUS)for(var by=HG_MUR+4;by<HG_H-HG_MUR-4;by++){
    var t2=Math.floor(by/4)%2===0;
    P(HG_MUR+4,by,2,1,t2?'#f0b800':'#1d1d1d');
    P(HG_L-HG_MUR-6,by,2,1,t2?'#f0b800':'#1d1d1d');
  }
  /* la bouche d'egout */
  if(INDUS||CLS==='neon'){P(HG_L/2-5,HG_H/2+40,10,8,'#4a4a4e');P(HG_L/2-5,HG_H/2+40,10,1,'#6a6a70');
  for(var dg=0;dg<4;dg++)P(HG_L/2-4,HG_H/2+42+dg*2,8,1,'#2a2a2e');}
  /* =================== LA LUMIERE ===================
     D'abord on assombrit toute la salle, ensuite on rallume sous
     chaque lampe. Fait dans l'autre sens, les flaques auraient l'air
     de taches blanches posees sur un sol deja clair. */
  var CLE=s.cle||'entrepot', amb=HG_AMB[CLE]||0.1, LP=HG_LAMPES[CLE]||HG_LAMPES.entrepot;
  g2.fillStyle='rgba(6,8,12,'+amb.toFixed(3)+')';
  g2.fillRect(0,0,HG_L,HG_H);
  g2.save();g2.globalCompositeOperation='lighter';
  for(var il=0;il<(s.lampes||[]).length;il++){
    var la=s.lampes[il];if(!la.on)continue;
    var LC=(LP.c2&&il%2)?LP.c2:LP.c;      /* a Tokyo, les neons alternent rose et cyan */
    var rg=g2.createRadialGradient(la.x,la.y+6,2,la.x,la.y+6,LP.r);
    rg.addColorStop(0,'rgba('+LC+','+(LP.f*1.25).toFixed(3)+')');
    rg.addColorStop(0.55,'rgba('+LC+','+(LP.f*0.42).toFixed(3)+')');
    rg.addColorStop(1,'rgba('+LC+',0)');
    g2.fillStyle=rg;g2.fillRect(la.x-LP.r,la.y+6-LP.r,LP.r*2,LP.r*2);
  }
  g2.restore();
  /* le corps de la lampe, vu de dessous : une reglette et son tube */
  for(var il2=0;il2<(s.lampes||[]).length;il2++){
    var l2=s.lampes[il2];
    P(l2.x-5,l2.y-2,10,5,'rgba(26,30,36,.8)');
    P(l2.x-5,l2.y-2,10,1,'rgba(90,98,108,.6)');
    P(l2.x-4,l2.y-1,8,2,l2.on?'rgba('+((LP.c2&&il2%2)?LP.c2:LP.c)+',.8)':'rgba(24,28,33,.8)');
    P(l2.x-1,l2.y-4,2,2,'rgba(50,56,64,.7)');
  }
}
/* UN MORCEAU D'HABILLAGE. Rien de tout cela n'arrete une balle : si
   l'on devait les eviter, il faudrait les lire au premier coup d'oeil,
   et une salle lisible n'est plus une salle sale. */
function hgDeco(P,g2,d,s){
  var t=d.t, x=Math.round(d.x), y=Math.round(d.y), r=d.r;
  var ovale=function(cx,cy,rx,ry,col){
    for(var i=-rx;i<=rx;i++)for(var j=-ry;j<=ry;j++)
      if(i*i/(rx*rx)+j*j/(ry*ry)<=1)P(cx+i,cy+j,1,1,col);
  };
  if(t==='huile'){
    ovale(x,y,r*0.8,r*0.44,'rgba(26,22,18,.3)');
    ovale(x-1,y-1,r*0.45,r*0.24,'rgba(12,10,8,.34)');
    P(x-r*0.4,y-r*0.3,2,1,'rgba(90,110,130,.3)');
  }else if(t==='crasse'){
    ovale(x,y,r*1.3,r*0.8,'rgba(40,36,30,.17)');
  }else if(t==='fissure'){
    var fx=x, fy=y;
    for(var k=0;k<r*2.4;k++){
      P(fx,fy,1,1,'rgba(30,28,24,.55)');
      P(fx,fy+1,1,1,'rgba(255,255,255,.07)');
      fx+=Math.round(Math.cos(d.a+Math.sin(k*0.7)*0.9));
      fy+=Math.round(Math.sin(d.a+Math.sin(k*0.7)*0.9));
    }
  }else if(t==='bande'){
    for(var bi=0;bi<r*2.6;bi++)
      if((bi+Math.floor(d.g*4))%7<5)P(x+bi,y,1,3,'rgba(222,178,40,'+(0.26+d.g*0.2).toFixed(2)+')');
  }else if(t==='bandeL'){
    for(var bl=HG_MUR;bl<HG_L-HG_MUR;bl++){
      if(bl%9<6){P(bl,y,1,3,'rgba(222,178,40,.3)');P(bl,y+9,1,3,'rgba(222,178,40,.22)');}
    }
  }else if(t==='grille'){
    var gw=Math.round(r*1.5), gh=Math.round(r*1.0);
    P(x,y,gw,gh,'rgba(70,74,80,.68)');P(x,y,gw,1,'rgba(130,138,148,.5)');
    for(var gi=1;gi<gh-1;gi+=2)P(x+1,y+gi,gw-2,1,'rgba(30,33,38,.7)');
    P(x,y+gh-1,gw,1,'rgba(20,23,27,.7)');
  }else if(t==='rail'||t==='railL'){
    var x0=(t==='railL')?HG_MUR:x, x1=(t==='railL')?HG_L-HG_MUR:x+Math.round(r*4);
    for(var rx=x0;rx<x1;rx++){
      P(rx,y,1,2,'#6f737a');P(rx,y+1,1,1,'#4a4e54');
      P(rx,y+11,1,2,'#6f737a');P(rx,y+12,1,1,'#4a4e54');
      if(rx%8===0)P(rx,y-1,3,15,'rgba(60,48,34,.45)');
    }
  }else if(t==='givre'){
    for(var ga=0;ga<6;ga++){
      var an=ga/6*6.283+d.a;
      for(var gk=0;gk<r;gk++)
        P(x+Math.round(Math.cos(an)*gk),y+Math.round(Math.sin(an)*gk*0.6),1,1,
          'rgba(228,246,255,'+(0.34-gk/r*0.26).toFixed(2)+')');
    }
    ovale(x,y,2,1,'rgba(240,250,255,.5)');
  }else if(t==='flaque'){
    ovale(x,y,r,r*0.6,'rgba(18,26,34,.45)');
    ovale(x,y,r-1,r*0.6-1,'rgba(32,52,70,.4)');
    P(x-r*0.5,y-r*0.28,Math.max(2,r*0.6),1,'rgba(180,215,245,.3)');
    P(x+r*0.1,y+r*0.2,Math.max(1,r*0.3),1,'rgba(150,190,225,.2)');
  }else if(t==='plaque'||t==='plaqueL'){
    if(t==='plaqueL'){
      for(var py=HG_MUR;py<HG_H-HG_MUR;py+=22){
        P(HG_MUR,py,HG_L-2*HG_MUR,1,'rgba(20,24,28,.2)');
        P(HG_MUR,py+1,HG_L-2*HG_MUR,1,'rgba(255,255,255,.04)');
      }
      for(var px=HG_MUR;px<HG_L-HG_MUR;px+=34)
        P(px,HG_MUR,1,HG_H-2*HG_MUR,'rgba(20,24,28,.14)');
    }else{
      var pw=Math.round(r*2.6), ph=Math.round(r*1.8);
      P(x,y,pw,ph,'rgba(120,128,136,.3)');
      P(x,y,pw,1,'rgba(190,200,210,.22)');
      P(x,y+ph-1,pw,1,'rgba(18,22,26,.35)');
      for(var qi=2;qi<pw-1;qi+=5){P(x+qi,y+1,1,1,'rgba(230,236,242,.4)');
        P(x+qi,y+ph-2,1,1,'rgba(230,236,242,.3)');}
    }
  }else if(t==='rivets'){
    for(var vi=0;vi<r;vi++){
      var vx=x+Math.round(Math.cos(d.a)*vi*4), vy=y+Math.round(Math.sin(d.a)*vi*4);
      P(vx,vy,2,2,'rgba(200,208,216,.3)');P(vx,vy+1,2,1,'rgba(20,24,28,.4)');

  }else if(t==='ecaille'){
    for(var ei=0;ei<r;ei++)P(x+Math.round((al(ei*3.1+x)-0.5)*r*2),y+Math.round((al(ei*1.7+y)-0.5)*r),1,1,'rgba(220,235,245,.75)');
  }else if(t==='glacons'){
    for(var gi2=0;gi2<Math.round(r/2);gi2++){var gx=x+Math.round((al(gi2*2.3+x)-0.5)*r*2),gy=y+Math.round((al(gi2*4.1+y)-0.5)*r);
      P(gx,gy,2,2,'rgba(230,248,255,.85)');P(gx,gy,1,1,'#ffffff');}
  }else if(t==='flaqueNeon'){
    ovale(x,y,r,r*0.55,'rgba(10,8,18,.55)');
    P(x-r*0.6,y-1,Math.max(3,r*0.7),1,'rgba(255,79,176,.55)');
    P(x-r*0.1,y+1,Math.max(2,r*0.5),1,'rgba(127,232,255,.5)');
  }else if(t==='passage'){
    for(var pi=0;pi<5;pi++)P(x+pi*6,y,4,Math.round(r*1.6),'rgba(235,235,245,.16)');
  }else if(t==='herbe'){
    for(var hi=0;hi<Math.round(r*1.5);hi++){var hx=x+Math.round((al(hi*1.9+x)-0.5)*r*2);
      P(hx,y-Math.round(al(hi+y)*3),1,3,al(hi*5.3)<0.5?'#6f8a3e':'#87a24a');}
  }else if(t==='pierre'){
    ovale(x,y,Math.max(2,r*0.4),Math.max(1,r*0.28),'#7a776a');P(x-1,y-1,2,1,'#9a978a');
  }else if(t==='feuilles'){
    for(var fi=0;fi<Math.round(r);fi++)P(x+Math.round((al(fi*2.7+x)-0.5)*r*2),y+Math.round((al(fi*3.3+y)-0.5)*r),2,1,['#8a5a2a','#a8742e','#6a4a22'][fi%3]);
  }else if(t==='scorie'){
    ovale(x,y,r,r*0.6,'rgba(24,18,16,.6)');
    for(var si=0;si<r;si++)
      P(x+Math.round((Math.random()-0.5)*r*1.4),y+Math.round((Math.random()-0.5)*r*0.9),
        1,1,'rgba(90,70,60,.6)');
  }
}

/* SEPT ARMES, ET CHACUNE CHANGE LA FACON DE SE PLACER. Une arme qui ne

    if(r<0.58)return this.pose(s,x,y,13,15,'fut');
    if(r<0.66)return this.pose(s,x,y,22,13,'sacs');
    if(r<0.73)return this.pose(s,x,y,30,8,'poutre');
    return this.pose(s,x,y,20,19,'caisse');
  },
  PATRONS:['eparpille','couloir','piliers','anneau','travees','fosse'],
  /* LES PATRONS PROPRES A UN LIEU : des allees d'etals, un parking, des rangs de tombes */
  /* LES SALLES FAITES A LA MAIN : un plan dessine case par case (22 px),
     retourne au hasard, avec ses pieges a sa place. On garde toujours deux
     cases libres le long des murs : les portes restent joignables. */
  batirMain:function(s,nom){
    var P=HG_SALLES[nom], fx=Math.random()<0.5, fy=Math.random()<0.5, C=22, X0=HG_MUR+(HG_L-2*HG_MUR-13*C)/2, Y0=HG_MUR+(HG_H-2*HG_MUR-19*C)/2;
    var rails={};
    for(var r=0;r<15;r++)for(var c=0;c<9;c++){
      var ch=P[fy?14-r:r][fx?8-c:c], gx=X0+(c+2)*C, gy=Y0+(r+2)*C;
      if(ch==='.')continue;
      if(ch==='s'){(rails[r]=rails[r]||[]).push(gx+C/2);continue;}
      if(ch==='P'){s.pieges.push({t:'piques',x:gx+C/2,y:gy+C/2,ph:Math.random()*3300});continue;}
      var w=ch==='X'?C:ch==='C'?20:14, h=ch==='X'?C:ch==='C'?19:16, ox=gx+(C-w)/2, oy=gy+(C-h)/2;
      if(Math.abs(ox+w/2-s.j.x)<30&&Math.abs(oy+h/2-s.j.y)<30)continue;
      var libre=true;for(var kp=0;kp<s.portes.length;kp++)if(Math.hypot(ox+w/2-s.portes[kp].x,oy+h/2-s.portes[kp].y)<46)libre=false;
      if(!libre)continue;
      var o={x:ox,y:oy,w:w,h:h,t:ch==='X'?'beton':ch==='C'?'caisse':'baril'};
      if(o.t==='caisse')o.pv=o.pvm=HG_CASSE.caisse;
      if(o.t==='baril')o.ex=true;
      s.obs.push(o);
    }
    for(var rk in rails){var xs=rails[rk];if(xs.length<2)continue;var y=Y0+((+rk)+2)*C+C/2;
      s.pieges.push({t:'scie',x1:Math.min.apply(null,xs),x2:Math.max.apply(null,xs),y:y,x:xs[0],v:0.07,sens:1,a:0});}
  },
  /* LES PIEGES SEMES dans une salle ordinaire : une scie sur rail, des piques, un jet de flammes */
  semerPieges:function(s){
    var n=s.salle, nb=(n>=3&&Math.random()<0.55)?1+(n>=8&&Math.random()<0.5?1:0)+(n>=15&&Math.random()<0.4?1:0):0;
    for(var k=0;k<nb;k++){
      var t=['scie','piques','flamme'][Math.floor(Math.random()*3)];
      for(var e=0;e<40;e++){
        if(t==='scie'){var L2=80+Math.random()*60, x1=HG_MUR+20+Math.random()*(HG_L-2*HG_MUR-40-L2), y=HG_MUR+60+Math.random()*(HG_H-2*HG_MUR-120), ok=true;
          for(var q=0;q<=10;q++)if(this.heurte(s,x1+L2*q/10,y,9))ok=false;
          if(!ok||Math.abs(y-s.j.y)<50)continue;
          s.pieges.push({t:'scie',x1:x1,x2:x1+L2,y:y,x:x1,v:0.06+Math.random()*0.03,sens:1,a:0});break;}
        if(t==='piques'){var px=HG_MUR+30+Math.random()*(HG_L-2*HG_MUR-60), py=HG_MUR+50+Math.random()*(HG_H-2*HG_MUR-100);
          if(Math.hypot(px-s.j.x,py-s.j.y)<70||this.heurte(s,px,py,14))continue;
          s.pieges.push({t:'piques',x:px,y:py,ph:Math.random()*3300});break;}
        if(t==='flamme'){var cg=Math.random()<0.5?'g':'d', fy2=HG_MUR+60+Math.random()*(HG_H-2*HG_MUR-120);
          if(s.entree===cg||s.portes.some(function(P){return P.cote===cg&&Math.abs(P.y-fy2)<40;})||Math.abs(fy2-s.j.y)<40)continue;
          s.pieges.push({t:'flamme',cote:cg,y:fy2,L:90,ph:Math.random()*4000});break;}
      }
    }
  },
  batir:function(s,p){
    var i,j,cx=HG_L/2, cy=HG_H/2+16;
    if(p==='couloir'){
      /* deux murs de caisses qui laissent un couloir au milieu */
      for(j=HG_MUR+34;j<HG_H-HG_MUR-40;j+=24){
        this.caisseAu(s, cx-66, j);
        this.caisseAu(s, cx+46, j+12);
      }
      for(i=0;i<3;i++)this.caisseAu(s, cx-24+i*24, HG_MUR+26);
    }else if(p==='piliers'){
      /* une grille de piliers : on tourne autour, ils tournent autour */
      /* DES PILIERS DE SORTES DIFFERENTES : une grille de douze caisses
         identiques se lit comme un motif de papier peint, pas comme un
         entrepot. */
      var SP=[[20,19,'caisse'],[24,21,'conteneur'],[18,18,'touret'],[22,13,'sacs']];
      for(j=0;j<4;j++)for(i=0;i<3;i++){
        var sp=SP[(i+j*2)%SP.length];
        this.pose(s, HG_MUR+34+i*86, HG_MUR+48+j*92, sp[0],sp[1],sp[2]);
      }
    }else if(p==='anneau'){
      /* un anneau de bidons : le centre est un piege, le tour est sur */
      for(i=0;i<12;i++){
        var a=i/12*6.283;
        this.pose(s, cx+Math.cos(a)*78-7, cy+Math.sin(a)*96-8, 14,16,'baril');
      }
      this.caisseAu(s, cx-10, cy-9);
    }else if(p==='travees'){
      /* des rayonnages, comme un vrai entrepot */
      var ST=[[26,11,'palette'],[22,13,'sacs'],[30,8,'poutre'],[26,11,'palette']];
      for(j=0;j<4;j++)for(i=0;i<4;i++){
        var st=ST[(i+j)%ST.length];
        this.pose(s, HG_MUR+26+i*66, HG_MUR+52+j*88, st[0],st[1],st[2]);
      }
    }else if(p==='allees'){
      for(j=HG_MUR+64;j<HG_H-HG_MUR-60;j+=70)
        for(i=HG_MUR+16+((j/70)%2?20:0);i<HG_L-HG_MUR-36;i+=46)
          if(Math.random()<0.82)this.pose(s,i,j,30,14,Math.random()<0.8?'etal':'caisseP');
    }else if(p==='parking'){
      for(i=HG_MUR+14;i<HG_L-HG_MUR-34;i+=40){
        if(Math.random()<0.8){var c1=this.pose(s,i+5,HG_MUR+80,30,16,'voiture');if(c1)c1.c=HG_VOIT[Math.floor(Math.random()*HG_VOIT.length)];}
        if(Math.random()<0.8){var c2=this.pose(s,i+5,HG_H-HG_MUR-130,30,16,'voiture');if(c2)c2.c=HG_VOIT[Math.floor(Math.random()*HG_VOIT.length)];}
      }
      for(j=HG_MUR+150;j<HG_H-HG_MUR-170;j+=56){this.pose(s,HG_MUR+6,j,14,18,'distrib');this.pose(s,HG_L-HG_MUR-20,j+24,14,18,'distrib');}
    }else if(p==='tombes'){
      for(j=HG_MUR+50;j<HG_H-HG_MUR-60;j+=44)
        for(i=HG_MUR+22;i<HG_L-HG_MUR-28;i+=36)
          if(Math.random()<0.66&&Math.abs(i-HG_L/2)>22)this.pose(s,i+Math.round((Math.random()-0.5)*8),j+Math.round((Math.random()-0.5)*6),Math.random()<0.6?12:10,14,Math.random()<0.62?'tombe':'croix');
      this.pose(s,HG_L/2-20,HG_H/2-30,40,20,'coque');
    }else if(p==='fosse'){
      /* le pourtour encombre, le milieu nu : tout se joue au centre */
      for(i=0;i<9;i++){
        this.caisseAu(s, HG_MUR+20+i*30, HG_MUR+30);
        this.caisseAu(s, HG_MUR+20+i*30, HG_H-HG_MUR-42);
      }
      for(j=0;j<4;j++){
        this.caisseAu(s, HG_MUR+14, HG_MUR+80+j*62);
        this.caisseAu(s, HG_L-HG_MUR-36, HG_MUR+80+j*62);
      }
    }else{
      var essais=0, voulus=10+Math.min(7,Math.floor(s.salle/2));
      while(s.obs.length<voulus&&essais<500){
        essais++;
        this.caisseAu(s, HG_MUR+6+Math.random()*(HG_L-2*HG_MUR-34),
                         HG_MUR+26+Math.random()*(HG_H-2*HG_MUR-70));
      }
    }
  },
  garnir:function(s){
    /* LA SEMAINE : le meme parcours pour tout le monde. Le hasard du plan
       (portes, patron, caisses, pieges) sort d'une graine ; les zombies
       restent libres. */
    var MR=Math.random;
    if(s.graine)Math.random=hgGraine(s.graine+':'+s.salle+':'+(s.rec||'')+':'+(s.entree||''));
    try{this.garnir2(s);}finally{Math.random=MR;}
  },
  garnir2:function(s){
    var n=s.salle;
    s.obs=[];s.ram=[];s.bossA=0;
    /* la premiere salle est toujours la simple : on apprend a marcher
       avant d'apprendre a se placer */
    s.zone=Math.floor((n-1)/5)%HG_ZONES.length;
    var Z=HG_ZONES[s.zone];
    s.patron=(n===1)?'eparpille':((Z.patrons&&Math.random()<0.75)?Z.patrons[Math.floor(Math.random()*Z.patrons.length)]
             :this.PATRONS[Math.floor(Math.random()*this.PATRONS.length)]);
    s.teinte=Z.sol;
    /* LES BRAISES DE LA FONDERIE : des flaques qui brulent, posees une
       fois pour toutes. On les voit, donc on peut les eviter — et c'est
       le fait de devoir les contourner en reculant qui fait le sel. */
    s.braises=[];
    if(Z.braises){
      for(var fb=0;fb<6+Math.floor(n/4);fb++)
        s.braises.push({x:HG_MUR+20+Math.random()*(HG_L-2*HG_MUR-40),
                        y:HG_MUR+36+Math.random()*(HG_H-2*HG_MUR-70),
                        r:7+Math.random()*7});
    }
    /* L'HABILLAGE DU SOL, seme une fois pour toutes a l'entree de la
       salle : il ne bouge pas, donc il ne coute rien a l'image. */
    var CLE=Z.cle||'entrepot';
    s.cle=CLE;
    s.deco=[];
    var SORTES=HG_DECO[CLE]||HG_DECO.entrepot;
    var nd=26+Math.floor(Math.random()*12);
    for(var id=0;id<nd;id++){
      s.deco.push({t:SORTES[Math.floor(Math.random()*SORTES.length)],
        x:HG_MUR+8+Math.random()*(HG_L-2*HG_MUR-16),
        y:HG_MUR+14+Math.random()*(HG_H-2*HG_MUR-28),
        r:4+Math.random()*9, a:Math.random()*6.283, g:Math.random()});
    }
    /* une bande peinte en travers, et des rails : ce sont les deux
       seules choses qui traversent toute la salle, donc elles donnent
       son echelle a tout le reste */
    if(CLE==='entrepot'){
      s.deco.push({t:'bandeL',x:0,y:HG_MUR+Math.round(Math.random()*40)+60,r:0,a:0,g:0});
      s.deco.push({t:'railL',x:0,y:HG_H-HG_MUR-Math.round(Math.random()*50)-60,r:0,a:0,g:0});
    }
    if(CLE==='cale')s.deco.push({t:'plaqueL',x:0,y:0,r:0,a:0,g:0});
    /* LES LAMPES. Une grille lache, un peu bousculee : une rangee trop
       reguliere fait plafond de bureau. Certaines sont cassees — c'est
       le noir entre deux lampes qui rend les autres utiles. */
    var LP=HG_LAMPES[CLE]||HG_LAMPES.entrepot;
    s.lampes=[];
    for(var ly=HG_MUR+46;ly<HG_H-HG_MUR-20;ly+=106){
      for(var lx=HG_MUR+44;lx<HG_L-HG_MUR-20;lx+=104){
        s.lampes.push({x:Math.round(lx+(Math.random()-0.5)*18),
                       y:Math.round(ly+(Math.random()-0.5)*18),
                       on:Math.random()>LP.cass,
                       cl:Math.random()<0.18, ph:Math.random()*6.283});
      }
    }
    /* LA PORTE CHANGE DE MUR A CHAQUE SALLE, jamais celui par lequel on entre :
       on ne sait pas d'avance ou il faudra aller, donc on ne campe plus devant. */
    /* LE PARCOURS : chaque salle propose 2 ou 3 portes, une par mur, et chacune
       annonce ce que paiera la salle d'apres. Avant un boss une seule porte ;
       apres le boss, le marchand. */
    var REC=s.rec||null, marche=(REC==='marchand');
    s.calme=marche;s.ev=null;s.surv=null;s.coffre=null;s.bonusC=false;s.eliteB=(REC==='elite');
    var cotes=['h','b','g','d'].filter(function(c){return c!==s.entree;});
    for(var ic0=cotes.length-1;ic0>0;ic0--){var jc0=Math.floor(Math.random()*(ic0+1)),tc0=cotes[ic0];cotes[ic0]=cotes[jc0];cotes[jc0]=tc0;}
    if(n===1)cotes.sort(function(a,b){return (b==='h')-(a==='h');});
    var recs;
    if(!marche&&n%5===0)recs=['marchand'];
    else if(!marche&&(n+1)%5===0)recs=['boss'];
    else{
      var pool=['carte','soin','or','elite'];
      if(n>=2)pool.push('arme');
      if(n>=3)pool.push('evenement');
      if(n<3)pool=pool.filter(function(r){return r!=='elite';});
      for(var ip0=pool.length-1;ip0>0;ip0--){var jp0=Math.floor(Math.random()*(ip0+1)),tp0=pool[ip0];pool[ip0]=pool[jp0];pool[jp0]=tp0;}
      /* un blesse voit plus souvent la porte du soin */
      if(s.vies<=2&&pool.indexOf('soin')>1){pool.splice(pool.indexOf('soin'),1);pool.unshift('soin');}
      recs=pool.slice(0,(n>=6&&Math.random()<0.4)?3:2);
    }
    s.portes=[];
    for(var ir0=0;ir0<recs.length;ir0++){
      var cp=cotes[ir0], P={ouvert:false,cote:cp,rec:recs[ir0]};
      if(cp==='h'||cp==='b'){P.x=Math.round(HG_L*(0.25+Math.random()*0.5));P.y=cp==='h'?HG_MUR:HG_H-HG_MUR;}
      else{P.y=Math.round(HG_H*(marche?(Math.random()<0.5?0.2:0.68)+Math.random()*0.12:0.25+Math.random()*0.5));P.x=cp==='g'?HG_MUR:HG_L-HG_MUR;}
      s.portes.push(P);
    }
    s.porte=s.portes[0];
    s.campT=0;s.ancre={x:s.j.x,y:s.j.y};
    if(marche){s.obs=[];
      /* LE MARCHAND : pas un zombie, trois etals, on paie en points */
      var px=[HG_L/2-62,HG_L/2,HG_L/2+62], arts=['vie','arme','carte'];
      if(s.vies>=(s.viesMax||5))arts[0]='vieMax';
      var PRIX={vie:40,vieMax:80,arme:60,carte:90};
      for(var ia0=0;ia0<3;ia0++)s.ram.push({x:px[ia0],y:HG_H/2+10,t:'achat',a:arts[ia0],prix:PRIX[arts[ia0]]*n,c:0});
    }
    else{
      s.pieges=[];s.faite=null;
      /* une salle sur trois, a partir de la deuxieme, est dessinee a la main */
      if(n>=2&&n%5!==0&&Math.random()<0.33){var NS=Object.keys(HG_SALLES);s.faite=NS[Math.floor(Math.random()*NS.length)];this.batirMain(s,s.faite);}
      else{this.batir(s,s.patron);if(n%5!==0)this.semerPieges(s);}
    }
    if(marche)s.pieges=[];
    /* QUELQUES BIDONS EXPLOSIFS, repartis dans la salle : ils changent
       une salle encombree en salle qu'on peut ouvrir au bon moment. */
    var nb=1+Math.min(4,Math.floor(n/3));
    var bidons=[];
    for(var e=0;e<s.obs.length;e++)if(s.obs[e].t==='baril')bidons.push(s.obs[e]);
    /* UNE SALLE SANS BIDON N'AVAIT AUCUN EXPLOSIF : les travees et les
       piliers n'en posent pas, et la salle perdait son seul moyen de
       s'ouvrir. On en convertit alors. */
    while(bidons.length<nb&&s.obs.length){
      var c=s.obs[Math.floor(Math.random()*s.obs.length)];
      if(bidons.indexOf(c)>=0||c.t==='beton')break;
      c.t='baril';c.w=14;c.h=16;delete c.pv;bidons.push(c);
    }
    for(var e2=0;e2<s.obs.length;e2++)s.obs[e2].ex=false;
    for(var e3=0;e3<nb&&e3<bidons.length;e3++)bidons[e3].ex=true;
    s.z=[];s.b=[];s.arcs=[];s.feux=[];s.morts=[];s.eb=[];s.explos=[];s.zd=[];s.ff=null;
    s.bouclier=((PERSO.niveaux||{}).armure||0)+(s.am.bouclier||0);
    s.reste=Math.min(28, 5+n*2);
    s.aNaitre=s.reste;
    s.porte.ouvert=false;
    /* L'OBJECTIF DE LA SALLE : nettoyer n'est plus la seule facon d'ouvrir la porte.
       Les deux premieres salles et les salles de boss restent des nettoyages. */
    var tO=(n<=2||n%5===0)?'nettoyer':(function(){var r=Math.random();return r<0.32?'nettoyer':r<0.52?'survivre':r<0.72?'carbu':r<0.88?'cle':'evasion';})();
    s.obj={t:tO,n:0,T:0,fait:false};
    if(tO!=='nettoyer'){s.reste=999;s.aNaitre=999;}
    if(tO==='survivre')s.obj.T=Math.min(45000,30000+n*600);
    if(tO==='carbu'){/* trois bidons d'essence, loin les uns des autres et loin de l'entree */
      for(var kc=0,ess=0;kc<3&&ess<300;ess++){var cx2=HG_MUR+20+Math.random()*(HG_L-2*HG_MUR-40), cy2=HG_MUR+30+Math.random()*(HG_H-2*HG_MUR-60);
        if(this.heurte(s,cx2,cy2,8)||Math.hypot(cx2-s.j.x,cy2-s.j.y)<110)continue;
        if(s.ram.some(function(r){return r.t==='carbu'&&Math.hypot(r.x-cx2,r.y-cy2)<90;}))continue;
        s.ram.push({x:cx2,y:cy2,t:'carbu'});kc++;}}
    if(tO==='cle')s.obj.cleT=1800;                 /* le porteur sort un peu apres les autres */
    if(n%5===0){s.obj={t:'boss',fait:false,n:0};s.reste=1;s.aNaitre=0;s.bossA=1400;s.zd=[];}
    if(tO==='evasion'){s.obj.T=10000;s.obj.gaz=0;s.obj.de=s.entree;}
    /* LE MODIFICATEUR : une salle sur trois, a partir de la quatrieme, change une regle */
    s.mod=(n>=4&&n%5!==0&&Math.random()<0.34)?['rapides','butin','ricochet','noir','blindes'][Math.floor(Math.random()*5)]:null;
    /* CE QUE LA PORTE AVAIT PROMIS change la salle elle-meme */
    if(s.eliteB&&n%5!==0){s.mod=Math.random()<0.5?'rapides':'blindes';if(tO==='nettoyer'){s.reste=Math.round(s.reste*1.3);s.aNaitre=s.reste;}}
    if(REC==='evenement'&&n%5!==0){
      s.mod=null;s.ev=Math.random()<0.5?'coffre':'survivant';
      /* on degage le centre ou l'on pose le coffre ou la cage */
      var ex0=HG_L/2, ey0=HG_H/2-20;
      if(s.ev==='survivant'){for(var es=0;es<200;es++){var sx=HG_MUR+30+Math.random()*(HG_L-2*HG_MUR-60), sy=HG_MUR+40+Math.random()*(HG_H-2*HG_MUR-80);
        if(Math.hypot(sx-s.j.x,sy-s.j.y)>170){ex0=sx;ey0=sy;break;}}}
      s.obs=s.obs.filter(function(o){return Math.hypot(o.x+o.w/2-ex0,o.y+o.h/2-ey0)>34;});
      if(s.ev==='coffre'){s.obj={t:'coffre',fait:false,n:0};s.coffre={x:ex0,y:ey0,c:0,ouvert:false};s.reste=999;s.aNaitre=0;}
      else{s.obj={t:'survivant',fait:false,n:0};s.surv={x:ex0,y:ey0,pv:3,libre:false,c:0,inv:0,mort:false};s.reste=999;s.aNaitre=999;}
      s.ff=null;
    }
    if(marche){s.obj={t:'marchand',fait:true,n:0};s.reste=0;s.aNaitre=0;s.mod=null;s.bossA=0;s.z=[];}
    s.pause=600;
    var NOMS={eparpille:'LE DEPOT',couloir:'LE COULOIR',piliers:'LES PILIERS',
              anneau:'L\u2019ANNEAU',travees:'LES TRAVEES',fosse:'LA FOSSE',
              allees:'LES \u00c9TALS',parking:'LE PARKING',tombes:'LES TOMBES'};
    /* a l'entree d'une zone on annonce la zone, pas le patron : c'est
       le changement de lieu qu'on vient chercher */
    var OBJ={nettoyer:'',survivre:'TIENS BON',carbu:'TROIS BIDONS POUR LA PORTE',cle:'ABATS LE PORTEUR DE CLÉ',evasion:'LE GAZ MONTE · FILE'};
    var MODS={rapides:'ILS SONT RAPIDES · POINTS ×1,5',butin:'DOUBLE BUTIN',ricochet:'TES BALLES RICOCHENT',noir:'COUPURE DE COURANT',blindes:'ILS SONT BLINDÉS · POINTS ×1,5'};
    if((n-1)%5===0){s.mot=HG_ZONES[s.zone].nom;s.motT=2200;}
    else{s.mot=OBJ[tO]||('SALLE '+n+' \u00b7 '+(NOMS[s.patron]||''));s.motT=2000;}
    if(s.faite&&(n-1)%5!==0&&tO==='nettoyer'){s.mot=s.faite;s.motT=2000;}
    else if(s.faite&&(n-1)%5!==0&&!s.motSuite)s.motSuite=s.faite;
    if(s.ev==='coffre'){s.mot='UN COFFRE… PIÉGÉ ?';s.motT=2000;}
    if(s.ev==='survivant'){s.mot='UN SURVIVANT · LIBÈRE-LE';s.motT=2000;}
    if(marche){s.mot='LE MARCHAND';s.motT=2000;s.motSuite=null;}
    if(s.eliteB&&s.mod)s.motSuite='SALLE ÉLITE · '+MODS[s.mod];
    s.motSuite=s.mod?MODS[s.mod]:null;     /* le modificateur s'annonce juste apres */
    s.tach=s.tach||[];
    hgCuire(s);
  },
  /* LES REGLAGES DE L'ARME, UNE FOIS LES AMELIORATIONS APPLIQUEES.
     L'arme de base ne change jamais ; c'est ce qu'on a ramasse en
     chemin qui la transforme, et la carte garde donc toute sa valeur
     quand on change d'arme. */
  regle:function(s){
    var A=HG_ARMES[s.arme], a=s.am;
    return {nom:A.nom, c:A.c, gros:A.gros, feu:A.feu, rec:A.rec, plombs:A.plombs,
            ecart:A.ecart, ric:(A.ric||0)+(s.mod==='ricochet'?1:0), arc:A.arc, saut:A.saut, obus:A.obus,
            flaque:A.flaque, rayon:A.rayon,
            cad:A.cad*Math.pow(0.82,a.cad||0),
            deg:A.deg+(a.deg||0)+((PERSO.niveaux||{}).degats||0),
            chg:Math.round(A.chg*Math.pow(1.4,a.chg||0)*(1+0.2*((PERSO.niveaux||{}).chargeur||0))),
            rech:A.rech*Math.pow(0.75,a.rech||0),
            por:A.por*Math.pow(1.25,a.por||0),
            perce:(A.perce||0)+(a.perce||0),
            vit:A.vit};
  },
  demarrer:function(s){
    s.salle=1;s.score=0;s.tach=[];s.am={};s.cartes=null;s.neuf=null;s.rec=null;s.traqueT=0;s.cartesBis=false;s.st={};s.graine=GRAINE||null;
    var NV=PERSO.niveaux||{};
    s.viesMax=5+(NV.vie||0);s.vies=s.viesMax;s.tues=0;s.nbTirs=0;s.orbA=0;s.drones=[];s.eb=[];s.explos=[];
    s.arcs=[];s.feux=[];
    /* L'ARME DE DEPART EST CELLE QU'ON A CHOISIE AU COMPTOIR, validee par le serveur */
    s.arme=ARME_DEPART||'pistolet';s.chg=HG_ARMES[s.arme].chg;s.rech=0;
    s.j.x=HG_L/2;s.j.y=HG_H-60;s.j.vx=s.j.vy=0;s.entree='b';
    s.roule=0;s.rouleCD=0;s.grenCD=0;s.gren=[];
    this.garnir(s);
  },

  /* ================= LE MOUVEMENT ================= */
  pas:function(s,dt){
    if(s.phase!=='jeu'){s.t+=dt;return;}
    s.t+=dt;
    /* LE CHOIX D'AMELIORATION ARRETE TOUT. Choisir sous la pression
       n'est pas choisir : c'est appuyer au hasard sur la carte du
       milieu. On fige la salle, on lit les trois, on reprend. */
    if(s.cartes){ s.cartesT=(s.cartesT||0)+dt; if(s.motT>0)s.motT-=dt; return; }
    if(s.motT>0)s.motT-=dt;
    if(s.motT<=0&&s.motSuite){s.mot=s.motSuite;s.motT=1700;s.motSuite=null;}
    if(s.inv>0)s.inv-=dt;
    if(s.pause>0)s.pause-=dt;
    var j=s.j, A=this.regle(s);

    /* LE DEPLACEMENT EST LISSE, PAS COMMUTE. Poser la vitesse a la
       valeur de la manche donne une marche qui claque : on demarre et on
       s'arrete en une image. On vise donc la vitesse voulue et on s'en
       approche d'une fraction constante par milliseconde, ce qui donne
       un demarrage franc et un arret qui glisse d'un demi-pas. */
    var Z=HG_ZONES[s.zone];
    var VM=0.072*Math.pow(1.10,s.am.vit||0)*(1+0.07*((PERSO.niveaux||{}).vitesse||0));
    var cx=MG.x*VM, cy=MG.y*VM;
    /* LA CONSTANTE DE SOUPLESSE, et elle se lit. On rejoint la vitesse
       voulue avec un temps caracteristique de quatre-vingt-quinze
       millisecondes : la marche part franchement en deux images, et
       lacher la manche laisse glisser d'un demi-pas au lieu de planter
       le personnage sur place. */
    /* SUR LA GLACE ON NE S'ARRETE PAS : le temps caracteristique passe
       de quatre-vingt-quinze millisecondes a trois cent vingt, et il
       faut anticiper ses virages une demi-seconde a l'avance. */
    var k=1-Math.exp(-dt/(Z.glace?320:95));
    if(!(s.roule>0)){j.vx+=(cx-j.vx)*k; j.vy+=(cy-j.vy)*k;}
    if(Math.abs(j.vx)<0.0012)j.vx=0;
    if(Math.abs(j.vy)<0.0012)j.vy=0;
    /* on glisse le long des obstacles : chaque axe est teste a part,
       sinon on se colle dans les angles */
    this.bouger(s,j,j.vx*dt,j.vy*dt,5);
    /* LE PAS SUIT LA VITESSE REELLE, pas la manche : ralenti par la
       glace ou bloque contre une caisse, le personnage cesse de
       pedaler dans le vide. */
    var allure=Math.hypot(j.vx,j.vy);
    if(allure>0.006){
      j.pas=(j.pas||0)+dt*allure*0.052;
      s.poussiere=(s.poussiere||0)+dt*allure;
      if(s.poussiere>7){
        s.poussiere=0;
        s.part.push({x:j.x+(Math.random()-0.5)*5,y:j.y+9,vie:220,t:'pous',
                     vx:-j.vx*0.1,vy:-0.004});
      }
    }else{ j.pas=0; }

    /* LE CAMPEUR : rester dans un rayon de 40 px plus de 4 s, c'est se faire repérer */
    if(!s.ancre||Math.hypot(j.x-s.ancre.x,j.y-s.ancre.y)>40){s.ancre={x:j.x,y:j.y};if(s.campT>4000){s.mot='';s.motT=0;}s.campT=0;}
    else{s.campT=(s.campT||0)+dt;if(s.campT>4000&&s.campT-dt<=4000&&s.aNaitre>0){s.mot='ILS T’ONT REPÉRÉ — BOUGE';s.motT=1400;}}
    /* LA ROULADE : un bond dans le sens de la marche, intouchable le temps du bond */
    if(s.rouleCD>0)s.rouleCD-=dt;
    if(HG_ACT.roule){HG_ACT.roule=false;
      if(s.rouleCD<=0&&!s.roule){var dx=j.vx, dy=j.vy, nn=Math.hypot(dx,dy);
        if(nn<0.01){dx=MG.x;dy=MG.y;nn=Math.hypot(dx,dy);}
        if(nn<0.01){dx=Math.cos(j.vise||-1.5708);dy=Math.sin(j.vise||-1.5708);nn=1;}
        s.roule=210;s.rouleD={x:dx/nn,y:dy/nn};s.rouleCD=1100;s.inv=Math.max(s.inv,280);}}
    if(s.roule>0){s.roule-=dt;j.vx=s.rouleD.x*0.27;j.vy=s.rouleD.y*0.27;
      if(Math.random()<0.6)s.part.push({x:j.x+(Math.random()-0.5)*6,y:j.y+6,vie:260,t:'pous',vx:-s.rouleD.x*0.03,vy:-s.rouleD.y*0.03});
      if(s.roule<=0){s.roule=0;j.vx*=0.4;j.vy*=0.4;}}
    /* LA GRENADE : lancée vers le gros du troupeau, elle tombe en une demi-seconde */
    if(s.grenCD>0)s.grenCD-=dt;
    if(HG_ACT.gren){HG_ACT.gren=false;
      if(s.grenCD<=0){var tg=this.plusProche(s,j.x,j.y,170), tx, ty;
        if(tg){var mx=0,my=0,nm=0;for(var gq=0;gq<s.z.length;gq++){var zq=s.z[gq];if(Math.hypot(zq.x-tg.x,zq.y-tg.y)<50){mx+=zq.x;my+=zq.y;nm++;}}tx=mx/nm;ty=my/nm;}
        else{tx=j.x+Math.cos(j.vise||-1.5708)*80;ty=j.y+Math.sin(j.vise||-1.5708)*80;}
        s.gren.push({x0:j.x,y0:j.y-6,x:tx,y:ty,t:0,T:520});s.grenCD=8000;}}
    for(var gi=s.gren.length-1;gi>=0;gi--){var gr=s.gren[gi];gr.t+=dt;if(gr.t>=gr.T){s.gren.splice(gi,1);this.eclater(s,gr.x,gr.y);}}
    hgMajBoutons(s);

    /* LES PIEGES : ils blessent tout le monde, toi compris — attire-les dedans */
    for(var ipg=0;ipg<(s.pieges||[]).length;ipg++){var Pg=s.pieges[ipg], actif=s.pause<=0;
      if(Pg.t==='scie'){Pg.x+=Pg.v*Pg.sens*dt;if(Pg.x>Pg.x2){Pg.x=Pg.x2;Pg.sens=-1;}if(Pg.x<Pg.x1){Pg.x=Pg.x1;Pg.sens=1;}Pg.a+=dt*0.03;
        if(!actif)continue;
        if(s.inv<=0&&Math.hypot(j.x-Pg.x,j.y-Pg.y)<11){if(this.blesser(s,(Pg.x-j.x)/11,(Pg.y-j.y)/11))return;}
        for(var zp=s.z.length-1;zp>=0;zp--){var zq=s.z[zp];if(zq.nait>0||(zq.pgT||0)>s.t)continue;if(Math.hypot(zq.x-Pg.x,zq.y-Pg.y)<zq.r+7){zq.pgT=s.t+450;zq.pv-=3;zq.clign=120;zq.pouss=10;zq.pa=Math.atan2(zq.y-Pg.y,zq.x-Pg.x);
          for(var es2=0;es2<5;es2++)s.part.push({x:zq.x,y:zq.y,vie:260,t:'sang',vx:(Math.random()-0.5)*0.1,vy:(Math.random()-0.5)*0.1});
          if(zq.pv<=0){(s.st=s.st||{}).pieges=(s.st.pieges||0)+1;this.abattre(s,zq,zp);}}}}
      else if(Pg.t==='piques'){Pg.ph=(Pg.ph+dt)%3300;var sort=Pg.ph>2400, act=Pg.ph>2400&&Pg.ph-dt<=2400;
        if(!actif||!sort)continue;
        if(s.inv<=0&&Math.abs(j.x-Pg.x)<12&&Math.abs(j.y-Pg.y)<12){if(this.blesser(s))return;}
        if(act)for(var zp2=s.z.length-1;zp2>=0;zp2--){var zr=s.z[zp2];if(zr.nait>0)continue;if(Math.abs(zr.x-Pg.x)<12&&Math.abs(zr.y-Pg.y)<12){zr.pv-=zr.gros?4:3;zr.clign=120;if(zr.pv<=0){(s.st=s.st||{}).pieges=(s.st.pieges||0)+1;this.abattre(s,zr,zp2);}}}}
      else if(Pg.t==='flamme'){Pg.ph=(Pg.ph+dt)%4000;if(!actif||Pg.ph<3200)continue;
        var x0=Pg.cote==='g'?HG_MUR:HG_L-HG_MUR-Pg.L, x1=x0+Pg.L;
        if(Math.random()<0.6)s.part.push({x:Pg.cote==='g'?HG_MUR+4:HG_L-HG_MUR-4,y:Pg.y+(Math.random()-0.5)*6,vie:420,t:'flam',vx:(Pg.cote==='g'?1:-1)*(0.18+Math.random()*0.06),vy:(Math.random()-0.5)*0.03});
        if(s.inv<=0&&j.x>x0&&j.x<x1&&Math.abs(j.y-Pg.y)<9){if(this.blesser(s,0,0))return;}
        for(var zp3=0;zp3<s.z.length;zp3++){var zf3=s.z[zp3];if(zf3.x>x0&&zf3.x<x1&&Math.abs(zf3.y-Pg.y)<10&&!(zf3.brule>0)){zf3.brule=1500;zf3.brT=0;}}}
    }
    /* LES BRAISES : on les traverse, on ne s'y installe pas */
    if(s.braises.length&&s.inv<=0){
      for(var fb2=0;fb2<s.braises.length;fb2++){
        var br=s.braises[fb2];
        if(Math.hypot(j.x-br.x,j.y-br.y)<br.r){
          if(this.blesser(s))return;
          break;
        }
      }
    }

    /* L'ORIENTATION : la manche droite si on la tient, sinon le plus
       proche, sinon le sens de la marche. */
    /* LE FUSIL CHERCHE TOUT SEUL. On ne vise jamais : le pouce sert a se
       placer, et se placer EST la decision. L'orientation revient au sens
       de la marche quand il n'y a rien a portee, pour que le personnage
       ne reste pas fige de profil au milieu d'une salle vide. */
    var cible=this.plusProche(s,j.x,j.y,A.por+40);
    if(cible){
      var vc=Math.atan2(cible.y-j.y,cible.x-j.x);
      /* on tourne vers la cible au lieu d'y sauter : un canon qui se
         teleporte d'un bord a l'autre fait sursauter l'oeil */
      var dd=((vc-j.vise+Math.PI*3)%(Math.PI*2))-Math.PI;
      j.vise+=dd*Math.min(1,dt/70);
    }
    else if(j.vx||j.vy)j.vise=Math.atan2(j.vy,j.vx);

    /* ---------- le tir ---------- */
    if(s.rech>0){
      s.rech-=dt;
      if(s.rech<=0){s.chg=A.chg;}
    }else{
      if(s.cad>0)s.cad-=dt;
      var tire=(cible&&Math.hypot(cible.x-j.x,cible.y-j.y)<A.por);
      if(tire&&s.cad<=0&&s.pause<=0){
        if(s.chg<=0){ s.rech=A.rech; }
        else{
          s.chg--;s.cad=A.cad;s.recul=80;
          s.nbTirs=(s.nbTirs||0)+1;
          if((s.am.chaine||0)&&s.nbTirs%8===0)
            this.foudre(s,{arc:2+s.am.chaine,por:120,deg:1+s.am.chaine,saut:52,c:'#9ad8ff'});
          /* TROIS FACONS DE PORTER LE DEGAT. La balle part et voyage ;
             l'eclair et le rayon touchent dans l'image meme — il n'y a
             rien a esquiver, mais il faut etre dans l'axe. */
          if(A.arc){this.foudre(s,A);}
          else if(A.rayon){this.rayon(s,A);}
          else for(var p=0;p<A.plombs;p++){
            var a=j.vise+(Math.random()-0.5)*A.ecart*(A.plombs>1?2:1);
            var por2=A.por;
            if(A.obus){
              /* L'OBUS TOMBE SUR LA CIBLE, pas au bout de sa portee :
                 c'est ce qui permet de frapper derriere une caisse. */
              por2=Math.min(A.por,Math.max(26,Math.hypot(cible.x-j.x,cible.y-j.y)));
            }
            s.b.push({x:j.x+Math.cos(j.vise)*11, y:j.y+Math.sin(j.vise)*6-4,
                      vx:Math.cos(a)*A.vit, vy:Math.sin(a)*A.vit,
                      vie:por2/A.vit, deg:A.deg,
                      perce:A.perce||0, dejaTouche:null,
                      c:A.c, gros:!!A.gros, feu:!!A.feu,
                      ric:A.ric||0, obus:A.obus||0, flaque:A.flaque||0,
                      sorte:A.ric?'lame':(A.obus?'obus':''), tour:0});
          }
          /* LE RECUL SE SENT. Une pompe qui ne pousse pas le tireur ne
             pese rien dans la main ; celle-ci le repousse, et ce recul
             devient une facon de se degager quand on est cerne. */
          if(A.rec){j.vx-=Math.cos(j.vise)*A.rec*0.012;j.vy-=Math.sin(j.vise)*A.rec*0.012;}
          s.part.push({x:j.x+Math.cos(j.vise)*12,y:j.y+Math.sin(j.vise)*6-4,
                       vie:A.feu?40:70,t:'feu'});
          /* LA DOUILLE saute, retombe, rebondit une fois et reste un instant par terre */
          if(!A.feu&&!A.arc&&!A.rayon&&!A.ric&&!A.obus){
            var cs=Math.cos(j.vise);
            s.part.push({x:j.x+cs*4,y:j.y-5,vie:900,t:'douille',vx:-cs*0.03+(Math.random()-0.5)*0.03,vy:-0.07-Math.random()*0.03,sol:j.y+7+Math.random()*3});
          }
          if(A.rec||A.gros)s.sec=Math.max(s.sec,A.gros?70:45);
        }
      }
      if(s.chg<=0&&s.rech<=0)s.rech=A.rech;
    }

    /* ---------- les balles ---------- */
    for(var i=s.b.length-1;i>=0;i--){
      var b=s.b[i];
      b.x+=b.vx*dt;b.y+=b.vy*dt;b.vie-=dt;b.tour=(b.tour||0)+dt;
      var mort=false;
      /* ---- LES MURS. La lame rebondit, tout le reste s'y arrete. ---- */
      if(b.x<HG_MUR||b.x>HG_L-HG_MUR){
        if(b.ric>0){b.ric--;b.vx=-b.vx;b.x=Math.max(HG_MUR+1,Math.min(HG_L-HG_MUR-1,b.x));
          s.part.push({x:b.x,y:b.y,vie:160,t:'eclat',vx:b.vx*0.1,vy:0});
          b.dejaTouche=null;}
        else mort=true;
      }
      if(!mort&&(b.y<HG_MUR||b.y>HG_H-HG_MUR)){
        if(b.ric>0){b.ric--;b.vy=-b.vy;b.y=Math.max(HG_MUR+1,Math.min(HG_H-HG_MUR-1,b.y));
          s.part.push({x:b.x,y:b.y,vie:160,t:'eclat',vx:0,vy:b.vy*0.1});
          b.dejaTouche=null;}
        else mort=true;
      }
      if(b.vie<=0)mort=true;
      if(!mort)for(var o=0;o<s.obs.length;o++){
        var ob=s.obs[o];
        if(b.x>ob.x&&b.x<ob.x+ob.w&&b.y>ob.y&&b.y<ob.y+ob.h){
          if(ob.ex){mort=true;this.sauter(s,ob,o);break;}
          if(ob.pv>0){ob.pv-=Math.max(1,b.deg||1);ob.tape=s.t+90;if(ob.pv<=0){this.casser(s,ob,o);mort=true;break;}}
          if(b.ric>0){
            /* ON REBONDIT SUR LA FACE LA PLUS PROCHE : le plus petit
               enfoncement dit par ou la lame est entree. */
            b.ric--;
            var dG=b.x-ob.x, dD=ob.x+ob.w-b.x, dH=b.y-ob.y, dB=ob.y+ob.h-b.y;
            var mn=Math.min(dG,dD,dH,dB);
            if(mn===dG){b.vx=-Math.abs(b.vx);b.x=ob.x-1;}
            else if(mn===dD){b.vx=Math.abs(b.vx);b.x=ob.x+ob.w+1;}
            else if(mn===dH){b.vy=-Math.abs(b.vy);b.y=ob.y-1;}
            else{b.vy=Math.abs(b.vy);b.y=ob.y+ob.h+1;}
            b.dejaTouche=null;
            s.part.push({x:b.x,y:b.y,vie:160,t:'eclat',vx:b.vx*0.1,vy:b.vy*0.1});
          }else{
            mort=true;
            s.part.push({x:b.x,y:b.y,vie:200,t:'eclat',vx:-b.vx*0.1,vy:-b.vy*0.1});
          }
          break;
        }
      }
      if(!mort)for(var m=0;m<s.z.length;m++){
        var z=s.z[m];
        if(z===b.dejaTouche)continue;
        if(Math.hypot(b.x-z.x,b.y-z.y)<z.r+2){
          if(z.cmp==='bouclier'&&!(b.perce>0)){var ab=Math.atan2(-b.vy,-b.vx), dfb=Math.abs(Math.atan2(Math.sin(ab-z.face),Math.cos(ab-z.face)));
            if(dfb<1.15){mort=true;for(var es2=0;es2<4;es2++)s.part.push({x:b.x,y:b.y,vie:180,t:'etincelle',vx:-b.vx*0.25+(Math.random()-0.5)*0.15,vy:-b.vy*0.25+(Math.random()-0.5)*0.15});break;}}
          /* LE PERCAGE : le harpon et le revolver traversent. On note la
             derniere bete touchee pour ne pas lui mettre dix coups en
             passant dessus pendant dix images. */
          if(b.perce>0){b.perce--;b.dejaTouche=z;}else{mort=true;}
          /* LE TABLIER DU SOUDEUR mange un point a chaque coup, jamais
             plus : une arme a un seul gros coup ne vaut pas mieux
             qu'une cadence contre lui, et c'est tout le propos. */
          var dgB=Math.max(1,b.deg-(z.blinde||0));
          if(z.gros&&z.stun>0){dgB*=2;if(Math.random()<0.4)s.part.push({x:z.x,y:z.y-14,vie:400,t:'crit',vx:0,vy:-0.02});}
          if(z.gros&&z.inv>0)dgB=0;
          if((s.am.crit||0)&&Math.random()<0.12*s.am.crit){dgB*=3;s.part.push({x:z.x,y:z.y-12,vie:520,t:'crit',vx:0,vy:-0.02});}
          if(s.am.gel)z.gel=1200*s.am.gel;
          for(var et=0;et<3;et++)s.part.push({x:b.x,y:b.y,vie:160+Math.random()*80,t:'etincelle',vx:-b.vx*0.15+(Math.random()-0.5)*0.12,vy:-b.vy*0.15+(Math.random()-0.5)*0.12});
          z.pv-=dgB;z.pouss=b.gros?12:6;z.pa=Math.atan2(b.vy,b.vx);z.clign=90;
          if(b.feu){z.brule=1400;z.brT=0;}
          for(var e=0;e<3;e++)s.part.push({x:b.x,y:b.y,vie:260,t:'sang',

        else if(ra.t==='cle'){s.obj.n=1;s.score+=50*s.salle;s.mot='LA CLÉ !';s.motT=900;}
        else if(ra.t==='vie'){s.vies=Math.min(s.viesMax||5,s.vies+1);s.mot='+1 VIE';s.motT=900;}
        else if(ra.t==='mun'){s.chg=HG_ARMES[s.arme].chg;s.rech=0;s.mot='CHARGEUR PLEIN';s.motT=900;}
        else{s.arme=ra.t;s.chg=HG_ARMES[ra.t].chg;s.rech=0;
             s.mot=HG_ARMES[ra.t].nom;s.motT=1100;}
        s.ram.splice(r2,1);
      }
    }

    /* ---------- les particules ---------- */
    for(var q=s.part.length-1;q>=0;q--){
      var pa=s.part[q];
      pa.vie-=dt;
      if(pa.t==='douille'||pa.t==='piece'){
        pa.vy+=(pa.t==='piece'?0.0002:0.0005)*dt;pa.x+=pa.vx*dt;pa.y+=pa.vy*dt;
        if(pa.y>pa.sol){pa.y=pa.sol;pa.vy*=-0.35;pa.vx*=0.55;if(Math.abs(pa.vy)<0.01){pa.vy=0;pa.vx=0;}}
      }else if(pa.vx){pa.x+=pa.vx*dt;pa.y+=pa.vy*dt;pa.vx*=0.93;pa.vy*=0.93;}
      if(pa.vie<=0){
        if(pa.t==='sang'&&s.tach.length<140)s.tach.push({x:pa.x,y:pa.y,r:1+Math.random()*2});
        s.part.splice(q,1);
      }
    }
    if(j.clign>0)j.clign-=dt;

    /* ---------- la salle est nettoyee ---------- */
    if(s.reste<=0&&!s.porte.ouvert){
      for(var ip1=0;ip1<s.portes.length;ip1++)s.portes[ip1].ouvert=true;
      if(!s.calme){
      s.mot=s.portes.length>1?'CHOISIS TA PORTE':'LA PORTE S’OUVRE';s.motT=1600;
      /* CE QUE LA PORTE AVAIT PROMIS */
      var RC=s.rec;
      if(RC==='or'){s.score+=150*s.salle;s.motSuite='+'+(150*s.salle)+' POINTS';}
      if(RC==='elite'){(s.st=s.st||{}).elites=(s.st.elites||0)+1;s.score+=300*s.salle;s.bonusC=true;s.motSuite='SALLE ÉLITE · +'+(300*s.salle)+' POINTS';}
      if(RC==='carte')s.bonusC=true;
      if(RC==='soin'){if(s.vies>=(s.viesMax||5)&&(s.viesMax||5)<9){s.viesMax=(s.viesMax||5)+1;s.vies=s.viesMax;s.motSuite='+1 VIE MAX';}
        else{s.vies=Math.min(s.viesMax||5,s.vies+2);s.motSuite='+2 VIES';}}
      /* LE PALIER : toutes les dix salles, le serveur verse 10 000 EUR (une fois par palier) */
      if(s.salle%10===0&&PARTIE)hgPalier(s,s.salle);
      s.score+=60*s.salle;
      this.tirerCartes(s,s.bonusC);
      if(RC==='carte'){s.cartesBis=true;s.cartesTitre='PORTE DES CARTES · PRENDS-EN DEUX';}
      else if(RC==='elite')s.cartesTitre='SALLE ÉLITE NETTOYÉE · BONUS RARE';
      else if(s.ev==='coffre')s.cartesTitre='LE COFFRE · BONUS RARE';
      /* de quoi repartir : on choisit entre deux, et le choix compte */
      /* DEUX OBJETS, ET IL FAUT CHOISIR : on ne ramasse que ce qu'on va
         chercher, et l'arme qu'on laisse est l'arme qu'on n'aura pas. */
      var lot=[];
      if(s.vies<(s.viesMax||5))lot.push('vie');
      lot.push('mun');
      if(s.salle>=2&&(RC==='arme'||Math.random()<0.3)){
        /* ON NE FAIT TOMBER QUE CE QUI EST DEBLOQUE. Le seuil est le
           meilleur score du joueur, lu au comptoir a l'ouverture de la
           borne : une arme qu'on n'a jamais vue tomber est une raison
           de relancer. */
        var ouvert=HG_DEBLOQUE.filter(function(c){
          return Math.max(HG_REC,s.score)>=c.s;}).map(function(c){return c.a;});
        var dispo=ouvert.filter(function(k){return k!==s.arme;});
        var tire=dispo.splice(Math.floor(Math.random()*dispo.length),1)[0];
        if(tire)lot.unshift(tire);
        /* LA PORTE DE L'ARMERIE : deux armes au choix */
        if(RC==='arme'&&dispo.length)lot.splice(1,0,dispo[Math.floor(Math.random()*dispo.length)]);
      }
      for(var g2=0;g2<Math.min(2,lot.length);g2++){
        s.ram.push({x:HG_L/2-20+g2*40, y:HG_H/2+30, t:lot[g2]});
      }
      }
    }
    var Po=null, dedans=false;
    for(var ip2=0;ip2<s.portes.length&&!dedans;ip2++){Po=s.portes[ip2];if(!Po.ouvert)continue;
      if(Po.cote==='h')dedans=s.j.y<HG_MUR+8&&Math.abs(s.j.x-Po.x)<16;
      else if(Po.cote==='b')dedans=s.j.y>HG_H-HG_MUR-8&&Math.abs(s.j.x-Po.x)<16;
      else if(Po.cote==='g')dedans=s.j.x<HG_MUR+8&&Math.abs(s.j.y-Po.y)<16;
      else dedans=s.j.x>HG_L-HG_MUR-8&&Math.abs(s.j.y-Po.y)<16;}
    if(dedans){
      /* LE SURVIVANT RAMENE : il paie sa dette */
      var Sd=s.surv, merci=null;
      if(Sd&&Sd.libre&&!Sd.mort&&Math.hypot(Sd.x-s.j.x,Sd.y-s.j.y)<70){(s.st=s.st||{}).survivants=(s.st.survivants||0)+1;s.viesMax=Math.min(9,(s.viesMax||5)+1);s.vies=Math.min(s.viesMax,s.vies+1);s.score+=200*s.salle;merci='SURVIVANT SAUVÉ · +1 VIE MAX';}
      s.rec=Po.rec;
      /* le marchand est une halte : il ne compte pas comme une salle */
      if(Po.rec!=='marchand')s.salle++;
      s.score+=40;
      /* on entre dans la salle suivante par le mur d'en face */
      var opp={h:'b',b:'h',g:'d',d:'g'}[Po.cote];s.entree=opp;
      if(opp==='b'){s.j.x=HG_L/2;s.j.y=HG_H-50;}else if(opp==='h'){s.j.x=HG_L/2;s.j.y=50;}
      else if(opp==='g'){s.j.x=50;s.j.y=HG_H/2;}else{s.j.x=HG_L-50;s.j.y=HG_H/2;}
      s.j.vx=s.j.vy=0;
      s.tach=[];s.part=[];
      this.garnir(s);
      if(merci){s.motSuite=s.mot;s.mot=merci;s.motT=1500;}
    }

    /* ---------- la camera ---------- */
    s.cam.vx=j.x; s.cam.vy=j.y;
  },

  /* LA BLESSURE, EN UN SEUL ENDROIT : le bouclier encaisse d'abord, puis
     les vies ; le personnage recule et tressaille. Renvoie vrai si c'est fini. */
  blesser:function(s,ax,ay){
    if(s.inv>0)return false;
    var j=s.j;
    if(s.bouclier>0){
      s.bouclier--;s.inv=700;s.bouclierFlash=420;
      for(var e=0;e<14;e++){var a=e/14*6.283;s.part.push({x:j.x+Math.cos(a)*9,y:j.y-4+Math.sin(a)*9,vie:260,t:'eclat',vx:Math.cos(a)*0.06,vy:Math.sin(a)*0.06});}
      s.mot='BOUCLIER';s.motT=600;return false;
    }
    s.vies--;s.inv=1100;j.clign=600;j.aie=280;
    if(ax!==undefined){j.vx=-ax*0.26;j.vy=-ay*0.26;}
    if(s.vies<=0){this.fin(s);return true;}
    return false;
  },
  bouger:function(s,e,dx,dy,r){
    var nx=e.x+dx;
    if(!this.heurte(s,nx,e.y,r))e.x=nx;
    var ny=e.y+dy;
    if(!this.heurte(s,e.x,ny,r))e.y=ny;
    /* les portes ouvertes laissent passer le joueur, et lui seul */
    var lg=false,ld=false,lh=false,lb=false, PS=s.portes||[s.porte];
    if(e===s.j)for(var ip=0;ip<PS.length;ip++){var P=PS[ip];if(!P.ouvert)continue;
      if((P.cote==='g'||P.cote==='d')&&Math.abs(e.y-P.y)<16){if(P.cote==='g')lg=true;else ld=true;}
      if((P.cote==='h'||P.cote==='b')&&Math.abs(e.x-P.x)<16){if(P.cote==='h')lh=true;else lb=true;}}
    e.x=Math.max(lg?2:HG_MUR+r,Math.min(ld?HG_L-2:HG_L-HG_MUR-r,e.x));
    e.y=Math.max(lh?2:HG_MUR+r,Math.min(lb?HG_H-2:HG_H-HG_MUR-r,e.y));
  },
  heurte:function(s,x,y,r){
    for(var i=0;i<s.obs.length;i++){
      var o=s.obs[i];
      if(x+r>o.x&&x-r<o.x+o.w&&y+r>o.y&&y-r<o.y+o.h)return true;
    }
    return false;
  },
  plusProche:function(s,x,y,por){
    var meilleur=null, dm=por;
    for(var i=0;i<s.z.length;i++){
      var d=Math.hypot(s.z[i].x-x,s.z[i].y-y);
      if(d<dm){dm=d;meilleur=s.z[i];}
    }
    return meilleur;
  },
  naitre:function(s){
    s.aNaitre--;
    var gros=(s.salle%5===0&&s.aNaitre===0);
    var ouvertes=Math.max(1,Math.min(HG_Z.length,1+Math.floor(s.salle/2)));
    var e=gros?HG_GROS:HG_Z[Math.floor(Math.random()*ouvertes)];
    /* une part des naissances est une espece a comportement, si elle est deja arrivee */
    if(!gros){var sp=HG_Z2.filter(function(q){return s.salle>=q.des;});
      if(sp.length&&Math.random()<Math.min(0.45,0.22+0.012*s.salle))e=sp[Math.floor(Math.random()*sp.length)];}
    /* ils entrent par un bord, jamais sur le joueur */
    var x,y,essais=0, terre=!!HG_ZONES[s.zone||0].terre&&!gros;
    /* ILS ENTRENT PAR LES QUATRE MURS, et aussi par la porte de sortie : elle n'est
       plus un abri. Celui qui reste planté au même endroit est repéré : ils sortent
       alors tout près de lui (à 55-90 px), il faut bouger. */
    var traque=((s.campT||0)>4000||(s.traqueT||0)>0)&&!gros;
    do{
      var c=terre?3:(traque?5:(Math.random()<0.18?4:6+Math.floor(Math.random()*4)));
      if(c===3){x=HG_MUR+16+Math.random()*(HG_L-2*HG_MUR-32);y=HG_MUR+30+Math.random()*(HG_H-2*HG_MUR-60);}
      else if(c===5){var aT=Math.random()*6.283, dT=55+Math.random()*35;x=s.j.x+Math.cos(aT)*dT;y=s.j.y+Math.sin(aT)*dT;
        x=Math.max(HG_MUR+10,Math.min(HG_L-HG_MUR-10,x));y=Math.max(HG_MUR+12,Math.min(HG_H-HG_MUR-12,y));}
      else if(c===4){var P=s.portes?s.portes[Math.floor(Math.random()*s.portes.length)]:s.porte;x=Math.max(HG_MUR+10,Math.min(HG_L-HG_MUR-10,P.x+(P.cote==='g'?12:P.cote==='d'?-12:(Math.random()-0.5)*20)));
        y=Math.max(HG_MUR+12,Math.min(HG_H-HG_MUR-12,P.y+(P.cote==='h'?12:P.cote==='b'?-12:(Math.random()-0.5)*20)));}
      else if(c===6){x=HG_MUR+8+Math.random()*(HG_L-2*HG_MUR-16);y=HG_MUR+10;}
      else if(c===7){x=HG_MUR+10;y=HG_MUR+30+Math.random()*(HG_H-2*HG_MUR-60);}
      else if(c===8){x=HG_L-HG_MUR-10;y=HG_MUR+30+Math.random()*(HG_H-2*HG_MUR-60);}
      else{x=HG_MUR+8+Math.random()*(HG_L-2*HG_MUR-16);y=HG_H-HG_MUR-10;}
      essais++;
    }while(essais<30&&(Math.hypot(x-s.j.x,y-s.j.y)<(traque?50:70)||this.heurte(s,x,y,e.r)));
    var mR=(s.mod==='rapides')?1.35:1, mB=(s.mod==='blindes')?2:0, mP=(s.mod==='rapides'||s.mod==='blindes')?1.5:1;
    s.z.push({x:x,y:y,v:e.v*(1+s.salle*0.018)*mR,pv:e.pv+Math.floor(s.salle/3)+mB,
              pvm:e.pv+Math.floor(s.salle/3)+mB,pts:Math.round(e.pts*mP),r:e.r,
              art:gros?-1:e.art,mir:false,pouss:0,pa:0,clign:0,pas:0,
              feu:!gros&&!!e.feu, blinde:gros?0:(e.blinde||0),
              gros:gros, nait:700, proche:false, dj:999,
              boss:gros?(HG_BOSS[s.cle]||HG_BOSS.entrepot):null,
              pal:gros?hgPalBoss(HG_BOSS[s.cle]||HG_BOSS.entrepot):(e.cmp?HG_PAL2[e.cmp]||null:null),
              cmp:gros?null:(e.cmp||null), bt:Math.random()*1500});
    var zN=s.z[s.z.length-1];
    if(zN.cmp==='bouclier')zN.face=Math.atan2(s.j.y-zN.y,s.j.x-zN.x);
    /* L'ELITE : une aura de couleur, plus solide, et un meilleur butin */
    if(!gros&&(s.eliteB?Math.random()<0.4:(s.salle>=6&&Math.random()<0.12))){var ks=Object.keys(HG_ELITES), el=ks[Math.floor(Math.random()*ks.length)];
      zN.elite=el;zN.pv=Math.round(zN.pv*1.6)+1;zN.pvm=zN.pv;zN.pts*=2;if(el==='rapide')zN.v*=1.4;if(el==='blinde')zN.blinde=(zN.blinde||0)+1;}
    if(gros){s.mot='BOSS \u00b7 '+(HG_BOSS[s.cle]||HG_BOSS.entrepot).nom;s.motT=2000;s.sec=Math.max(s.sec,120);}
  },
  /* LE BIDON QUI SAUTE emporte ce qui est autour, zombies compris. Une
     salle encombree devient une salle qu'on peut ouvrir, si l'on a su
     attendre qu'ils soient trois autour du bidon. */
  /* =====================================================================
     LE FOUDROYEUR
     Il ne vise qu'une bete et en touche cinq. L'eclair saute de proie en
     proie, toujours vers la plus proche qu'il n'a pas encore brulee —
     donc l'arme recompense celui qui laisse le troupeau se former au
     lieu de l'eparpiller. C'est exactement l'inverse de la pompe.
     ===================================================================== */
  foudre:function(s,A){
    var j=s.j, vus=[], dep={x:j.x+Math.cos(j.vise)*10,y:j.y+Math.sin(j.vise)*6-4};
    var reste=A.arc||3, por=A.por;
    while(reste-->0){
      var meil=null, md=1e9;
      for(var m=0;m<s.z.length;m++){
        var z=s.z[m];
        if(vus.indexOf(z)>=0)continue;
        var d=Math.hypot(z.x-dep.x,z.y-dep.y);
        if(d<por&&d<md){md=d;meil=z;}
      }
      if(!meil)break;
      vus.push(meil);
      s.arcs.push({x1:dep.x,y1:dep.y,x2:meil.x,y2:meil.y-4,vie:110,c:A.c});
      meil.pv-=Math.max(1,A.deg-(meil.blinde||0));meil.clign=90;meil.pouss=4;
      meil.pa=Math.atan2(meil.y-dep.y,meil.x-dep.x);
      for(var e=0;e<3;e++)s.part.push({x:meil.x,y:meil.y-4,vie:220,t:'sang',
        vx:(Math.random()-0.5)*0.08,vy:(Math.random()-0.5)*0.08});
      var idx=s.z.indexOf(meil);
      dep={x:meil.x,y:meil.y-4};
      por=A.saut||50;
      if(meil.pv<=0&&idx>=0)this.abattre(s,meil,idx);
    }
    if(!vus.length)s.arcs.push({x1:dep.x,y1:dep.y,
      x2:dep.x+Math.cos(j.vise)*40,y2:dep.y+Math.sin(j.vise)*40,vie:80,c:A.c});
  },
  /* =====================================================================
     LE LASER
     Il touche avant que quoi que ce soit ait voyage : tout ce qui est
     dans l'axe prend, jusqu'au premier mur. Rien a esquiver, donc — il
     faut seulement aligner, et c'est la seule arme ou l'on se deplace
     pour ALIGNER plutot que pour fuir.
     ===================================================================== */
  rayon:function(s,A){
    var j=s.j, cx=Math.cos(j.vise), cy=Math.sin(j.vise);
    var x=j.x+cx*10, y=j.y+cy*6-4, vus=[];
    var fin=A.por;
    for(var d=0;d<A.por;d+=2){
      x+=cx*2;y+=cy*2;
      if(x<HG_MUR||x>HG_L-HG_MUR||y<HG_MUR||y>HG_H-HG_MUR){fin=d;break;}
      var bloque=false;
      for(var o=0;o<s.obs.length;o++){
        var ob=s.obs[o];
        if(x>ob.x&&x<ob.x+ob.w&&y>ob.y&&y<ob.y+ob.h){
          if(ob.ex)this.sauter(s,ob,o);
          else if(ob.pv>0){ob.pv-=Math.max(1,A.deg);ob.tape=s.t+90;if(ob.pv<=0)this.casser(s,ob,o);}
          bloque=true;break;
        }
      }
      if(bloque){fin=d;break;}
      for(var m=s.z.length-1;m>=0;m--){
        var z=s.z[m];
        if(vus.indexOf(z)>=0)continue;
        if(Math.hypot(x-z.x,y-z.y)<z.r+2){
          vus.push(z);
          z.pv-=Math.max(1,A.deg-(z.blinde||0));z.clign=80;z.pouss=3;z.pa=j.vise;
          s.part.push({x:x,y:y,vie:220,t:'sang',vx:cx*0.06,vy:cy*0.06});
          if(z.pv<=0)this.abattre(s,z,m);
        }
      }
    }
    s.arcs.push({x1:j.x+cx*10,y1:j.y+cy*6-4,
                 x2:j.x+cx*(10+fin),y2:j.y+cy*6-4+cy*fin,
                 vie:90,c:A.c,droit:true});
  },
  /* L'EXPLOSION DE L'OBUS : la meme onde que le bidon, mais elle ne
     detruit pas le couvert — sinon le mortier demonterait la salle en
     trois coups et il n'y aurait plus ou se mettre. */
  boum:function(s,cx,cy,r,deg){
    this.casserAutour(s,cx,cy,r);
    for(var e=0;e<24;e++){
      var a=Math.random()*6.283, v=0.03+Math.random()*0.13;
      s.part.push({x:cx,y:cy,vie:200+Math.random()*260,t:'flam',
                   vx:Math.cos(a)*v,vy:Math.sin(a)*v});
    }
    s.sec=Math.max(s.sec,150);
    for(var m=s.z.length-1;m>=0;m--){
      var z=s.z[m];
      var d=Math.hypot(z.x-cx,z.y-cy);
      if(d<r){
        z.pv-=Math.max(1,Math.round(deg*(1-d/r)+1));
        z.pouss=12;z.pa=Math.atan2(z.y-cy,z.x-cx);z.clign=120;
        if(z.pv<=0)this.abattre(s,z,m);
      }
    }
    /* un bidon dans le souffle part a son tour : les chaines sont le sel
       du mortier */
    for(var o=s.obs.length-1;o>=0;o--){
      var ob=s.obs[o];
      if(!ob||!ob.ex)continue;
      if(Math.hypot(ob.x+ob.w/2-cx,ob.y+ob.h/2-cy)<r)this.sauter(s,ob,o);
    }
  },
  /* LE NAPALM POSE LE DEGAT PAR TERRE. On ne tire pas sur une bete, on
     tire sur le chemin qu'elle va prendre — et c'est la seule arme qui
     se joue en regardant devant soi au lieu de regarder la cible. */
  poserFeu:function(s,x,y,r){
    if(s.feux.length>26)s.feux.shift();
    s.feux.push({x:x,y:y,r:r,vie:3400+Math.random()*900,T:0});
  },
  /* LE CHEMIN : une carte des distances au joueur, case par case, qui contourne les blocs.
     Chaque zombie descend la pente : il fait le tour d'une caisse au lieu de s'y coller. */
  chemin:function(s){
    var C=8, W=Math.ceil(HG_L/C), H=Math.ceil(HG_H/C), N=W*H;
    if(!s.ff||s.ff.no!==s.obs.length||s.ff.W!==W){
      var bl=new Uint8Array(N);
      for(var k=0;k<s.obs.length;k++){var o=s.obs[k];
        for(var cy=Math.max(0,Math.floor((o.y-4)/C));cy<=Math.min(H-1,Math.floor((o.y+o.h+4)/C));cy++)
          for(var cx=Math.max(0,Math.floor((o.x-4)/C));cx<=Math.min(W-1,Math.floor((o.x+o.w+4)/C));cx++)bl[cy*W+cx]=1;}
      s.ff={W:W,H:H,C:C,bl:bl,d:new Uint16Array(N),no:s.obs.length,t:0,pc:-1};}
    var F=s.ff, pc=Math.floor(s.j.y/C)*W+Math.floor(s.j.x/C);
    if(pc===F.pc&&F.t<220)return F;
    F.t=0;F.pc=pc;var d=F.d;d.fill(65535);
    if(pc<0||pc>=N)return F;
