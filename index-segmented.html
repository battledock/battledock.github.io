<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a4d68">
<title>Docker du Port — Marseille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Special+Elite&family=Pirata+One&display=swap" rel="stylesheet">

<!-- ========================================================================
     STYLE TAGS: Organized by feature area
     • 1. VARIABLES & BASE
     • 2. APP SHELL
     • 3. HEADER (TOPBAR)
     • 4. HUB SCREEN (Clicker)
     • 5. FIGHT SYSTEM (Bagarre)
     • 6. WORKSHOP (Syndicat/Bags)
     • 7. MODALS & UI ELEMENTS
     • 8. UPGRADES & BADGES
     • 9. PROFILE & SETTINGS
     • 10. ANIMATIONS & EFFECTS
     ======================================================================== -->

<style>
/* ========================================================================
   1. VARIABLES & BASE STYLES
   ======================================================================== */

:root{
  /* Color Palette — Marseille dockyard theme */
  --port-blue: #0a4d68;
  --port-blue-deep: #062c3e;
  --port-blue-light: #1a7a9e;
  --sea: #2b8aa6;
  --sky: #c8e6f0;
  --sand: #e8d8b0;
  --concrete: #b9b3a3;
  --concrete-dk: #6e6a5e;
  --rust: #b65d2e;
  --crane: #f4b13c;
  --crane-dk: #c8861a;
  --om-blue: #2e9bd4;
  --om-white: #fafbfc;
  --pastis: #d4d878;
  --red: #c0392b;
  --green: #4a7c2a;
  --ink: #1a1a1a;
  --paper: #f4ead0;
  --paper-dk: #d9c896;
  --gold: #e8c547;

  /* Shadow effects */
  --shadow-hard: 4px 4px 0 #000;
  --shadow-med: 3px 3px 0 #000;
  --shadow-soft: 2px 2px 0 rgba(0,0,0,.5);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
}

body {
  font-family: 'Special Elite', 'Courier New', monospace;
  color: var(--ink);
  background: var(--port-blue-deep);
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
  color: inherit;
}


/* ========================================================================
   2. APP SHELL
   ======================================================================== */

#app {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  max-width: 520px;
  margin: 0 auto;
  background: linear-gradient(180deg, #87ceeb 0%, #c8e6f0 30%, #2b8aa6 30%, #0a4d68 100%);
  overflow: hidden;
  contain: layout;
}

/* Seagulls — decorative only on hub */
.gull {
  position: absolute;
  font-size: 14px;
  z-index: 4;
  animation: fly linear infinite;
  pointer-events: none;
  color: #fff;
  text-shadow: 0 0 2px rgba(0,0,0,.5);
}

.gull::before {
  content: '~';
  display: inline-block;
  transform: scaleY(.5);
  font-weight: bold;
}

@keyframes fly {
  0% { transform: translateX(-40px) translateY(0); }
  50% { transform: translateX(50vw) translateY(-15px); }
  100% { transform: translateX(110vw) translateY(0); }
}

@keyframes waves {
  0% { transform: translateX(0); }
  100% { transform: translateX(-30px); }
}


/* ========================================================================
   3. HEADER (TOPBAR)
   ======================================================================== */

.topbar {
  position: relative;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px 6px;
  background: linear-gradient(180deg, rgba(6,44,62,.95), rgba(6,44,62,.85));
  border-bottom: 3px solid var(--crane);
  box-shadow: 0 2px 0 var(--ink), 0 4px 12px rgba(0,0,0,.4);
  flex-wrap: wrap;
}

.topbar .avatar-mini {
  width: 44px;
  height: 44px;
  background: var(--paper);
  border: 3px solid var(--ink);
  box-shadow: var(--shadow-soft);
  image-rendering: pixelated;
  flex-shrink: 0;
}

.topbar .avatar-mini svg {
  width: 100%;
  height: 100%;
  display: block;
}

.topbar .who {
  flex: 1;
  min-width: 0;
}

.topbar .blaze {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 17px;
  letter-spacing: 1px;
  line-height: 1;
  color: var(--paper);
  text-shadow: 1px 1px 0 #000;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.topbar .grade {
  font-size: 10px;
  color: var(--crane);
  margin-top: 1px;
  text-shadow: 1px 1px 0 #000;
}

.topbar .money {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 20px;
  color: var(--gold);
  text-shadow: 2px 2px 0 #000;
  text-align: right;
  line-height: 1;
}

.topbar .money small {
  font-size: 10px;
  color: var(--paper);
  display: block;
  letter-spacing: .5px;
}

/* Mini stats row */
.topbar-stats {
  width: 100%;
  display: flex;
  gap: 0;
  border-top: 1px solid rgba(244,177,60,.2);
  margin-top: 4px;
  padding-top: 4px;
}

.topbar-stat {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  border-right: 1px solid rgba(255,255,255,.08);
  padding: 0 4px;
}

.topbar-stat:last-child {
  border-right: none;
}

.topbar-stat-lbl {
  font-family: 'Special Elite', monospace;
  font-size: 8px;
  color: rgba(255,255,255,.4);
  letter-spacing: 1px;
  text-transform: uppercase;
}

.topbar-stat-val {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 13px;
  color: var(--paper);
  letter-spacing: .5px;
  line-height: 1;
}


/* ========================================================================
   4. SCREEN STRUCTURE
   ======================================================================== */

.screen {
  position: relative;
  z-index: 5;
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  min-height: 0;
  -webkit-overflow-scrolling: touch;
  display: none;
}

.screen.active {
  display: block;
}

#screen-hub.active {
  display: flex;
  flex-direction: column;
}

.screen-pad {
  padding: 14px 14px 100px;
}


/* ========================================================================
   5. HUB / CLICKER SCREEN
   ======================================================================== */

/* Main game area with dock scenery */
.dock-area {
  --sky1: #b9dceb;
  --sky2: #e0eef5;
  --sea1: #2b8aa6;
  --sea2: #0a4d68;
  --dock-floor: #8a8275;
  --dock-floor-dk: #6a6258;
  --mtn: rgba(60,80,100,.55);
  --sun-opacity: 1;
  
  position: relative;
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  
  background:
    /* dock floor (bottom 30%) */
    linear-gradient(180deg,
      transparent 0%, transparent 70%,
      #4a4238 70%, #4a4238 70.5%,
      var(--dock-floor) 70.5%, var(--dock-floor-dk) 100%
    ),
    /* sea (35%-70%) */
    linear-gradient(180deg,
      transparent 0%, transparent 35%,
      var(--sea1) 35%, var(--sea2) 70%,
      transparent 70%
    ),
    /* sky + sun */
    radial-gradient(circle at 82% 18%, rgba(255,220,150,calc(var(--sun-opacity) * .95)) 0, rgba(255,220,150,0) 80px),
    linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 35%, var(--sky2) 35%);
}

/* Zone variations */
.dock-area.zone-vieux-port {
  --sky1: #bfe1f0;
  --sky2: #dceff7;
  --sea1: #1a6b8c;
  --sea2: #0f4f6e;
  --dock-floor: #9b8a72;
  --dock-floor-dk: #6a5d4a;
  --mtn: rgba(108,128,148,.65);
  --sun-opacity: 1;
}

.dock-area.zone-j4 {
  --sky1: #f5d6a8;
  --sky2: #fde9c4;
  --sea1: #1a5870;
  --sea2: #0a3d54;
  --dock-floor: #aaa39a;
  --dock-floor-dk: #7d7568;
  --mtn: rgba(90,110,133,.65);
  --sun-opacity: 1.2;
}

.dock-area.zone-j4::before {
  background: repeating-linear-gradient(180deg, transparent 0 6px, rgba(255,180,80,.12) 6px 7px);
}

.dock-area.zone-fos {
  --sky1: #9aaec9;
  --sky2: #b8c8dc;
  --sea1: #244a5e;
  --sea2: #0f2a3a;
  --dock-floor: #7a7a7a;
  --dock-floor-dk: #525252;
  --mtn: rgba(61,74,94,.75);
  --sun-opacity: .4;
}

.dock-area.zone-fos::after {
  background-image:
    radial-gradient(ellipse 50px 3px at 30% 30%, rgba(255,255,255,.3), transparent),
    radial-gradient(ellipse 40px 2px at 70% 50%, rgba(255,255,255,.25), transparent),
    radial-gradient(ellipse 60px 3px at 50% 70%, rgba(255,255,255,.3), transparent);
}

/* Sea wave overlay */
.dock-area::before {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  top: 35%;
  height: 35%;
  background: repeating-linear-gradient(180deg, transparent 0 8px, rgba(255,255,255,.08) 8px 9px);
  pointer-events: none;
}

.dock-area::after {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  top: 35%;
  height: 35%;
  background-image:
    radial-gradient(ellipse 40px 3px at 20% 30%, rgba(255,255,255,.5), transparent),
    radial-gradient(ellipse 30px 2px at 60% 50%, rgba(255,255,255,.4), transparent),
    radial-gradient(ellipse 50px 3px at 80% 70%, rgba(255,255,255,.5), transparent);
  animation: waves 8s linear infinite;
  pointer-events: none;
}

/* Mountain decoration */
.mountains-deco {
  position: absolute;
  left: 0;
  right: 0;
  top: 30%;
  height: 6%;
  background: var(--mtn);
  clip-path: polygon(0 100%, 8% 60%, 14% 75%, 22% 40%, 30% 65%, 40% 30%, 48% 55%, 58% 35%, 68% 60%, 78% 25%, 88% 55%, 100% 40%, 100% 100%);
  pointer-events: none;
  z-index: 1;
}

/* Crane in background */
.crane-stage {
  position: absolute;
  bottom: 22%;
  left: -5px;
  width: 78px;
  height: 200px;
  z-index: 2;
  pointer-events: none;
  opacity: .92;
}

.crane-stage svg {
  width: 100%;
  height: 100%;
  display: block;
}

/* Boats on water */
.boat-stage {
  position: absolute;
  top: 42%;
  right: -8px;
  width: 175px;
  height: 65px;
  z-index: 2;
  pointer-events: none;
  animation: bob 4s ease-in-out infinite;
}

.boat-stage-2 {
  top: 38%;
  right: auto;
  left: 5%;
  width: 130px;
  height: 48px;
  animation: bob 5s ease-in-out infinite;
  animation-delay: -1.2s;
  opacity: .85;
}

.boat-stage-3 {
  top: 46%;
  right: auto;
  left: 35%;
  width: 100px;
  height: 38px;
  animation: bob 6s ease-in-out infinite;
  animation-delay: -2.5s;
  opacity: .7;
}

@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-1px); }
}

/* Dock floor texture */
.dock-floor-deco {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 30%;
  background: repeating-linear-gradient(90deg, transparent 0 60px, rgba(0,0,0,.18) 60px 62px);
  pointer-events: none;
  z-index: 2;
}

/* Oil stains on dock */
.dock-floor-deco::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(ellipse 30px 6px at 25% 60%, rgba(0,0,0,.3), transparent),
    radial-gradient(ellipse 20px 5px at 75% 80%, rgba(0,0,0,.25), transparent),
    radial-gradient(ellipse 18px 4px at 55% 40%, rgba(0,0,0,.2), transparent);
}

/* Main click target — the container */
.container-target {
  position: absolute !important;
  left: 50% !important;
  bottom: 8% !important;
  transform: translateX(-50%) !important;
  width: 52%;
  max-width: 210px;
  aspect-ratio: 100/80;
  cursor: pointer;
  z-index: 8;
  opacity: 1 !important;
  filter: drop-shadow(4px 6px 0 rgba(0,0,0,.45));
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

.container-target:active {
  opacity: .85;
}

.container-target svg {
  opacity: 1 !important;
  visibility: visible !important;
  width: 100%;
  height: 100%;
  display: block;
}

/* Click feedback floats */
.float-num.sweet {
  font-size: 28px;
  color: #fff;
  text-shadow: 2px 2px 0 #c0392b, -1px -1px 0 #c0392b, 1px -1px 0 #c0392b, -1px 1px 0 #c0392b, 0 0 12px #f4b13c;
}

.float-num.rhythm {
  color: #fff;
  text-shadow: 2px 2px 0 #c0392b, 0 0 8px #c0392b;
}

/* HUD stats on hub */
.hud {
  position: relative;
  z-index: 6;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  padding: 8px 10px;
  background: linear-gradient(180deg, rgba(6,44,62,.9), rgba(6,44,62,.95));
  border-top: 2px solid var(--crane);
}

.hud .stat {
  background: var(--paper);
  border: 2px solid #000;
  padding: 5px 8px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 14px;
  letter-spacing: .5px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: var(--shadow-soft);
}

.hud .stat .lbl {
  color: var(--port-blue-deep);
  font-size: 11px;
  opacity: .75;
}

.hud .stat .val {
  color: var(--rust);
  font-weight: bold;
}


/* ========================================================================
   6. FIGHT SYSTEM (BAGARRE)
   ======================================================================== */

.fight-back {
  background: radial-gradient(ellipse at 50% 50%, rgba(192,57,43,.85) 0%, rgba(0,0,0,.92) 80%);
}

.fight-modal {
  background: linear-gradient(180deg, #2a1010 0%, #1a0808 100%) !important;
  color: var(--paper);
  border-color: #000;
  max-width: 380px;
  position: relative;
}

.fight-modal h2 {
  color: #f4b13c;
}

.fight-title {
  text-align: center;
  font-family: 'Pirata One', serif;
  font-size: 42px;
  color: #f4b13c;
  text-shadow: 3px 3px 0 #000, 0 0 18px #c0392b;
  margin-bottom: 6px;
  line-height: 1;
}

.fight-sub {
  font-family: 'Special Elite', monospace;
  font-size: 12px;
  color: #fef4d8;
  text-align: center;
  font-style: italic;
  margin-bottom: 14px;
}

.fight-arena {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 8px;
  align-items: center;
  margin-bottom: 12px;
}

.fight-side {
  background: rgba(244,235,208,.1);
  border: 2px solid #000;
  padding: 6px;
  text-align: center;
  transition: transform .15s, background .15s;
}

.fight-side.flash-hit {
  background: rgba(74,124,42,.5);
  transform: scale(1.05);
}

.fight-side.flash-hurt {
  background: rgba(192,57,43,.6);
  transform: scale(.95) translateX(-4px);
}

.fight-modal.flash-tie {
  animation: fightTie .25s;
}

@keyframes fightTie {
  0%, 100% { transform: translate(0); }
  50% { transform: translate(2px, -1px); }
}

.fight-ava {
  width: 48px;
  height: 48px;
  margin: 0 auto 4px;
  background: #fff;
  border: 2px solid #000;
  overflow: hidden;
  image-rendering: pixelated;
}

.fight-ava svg {
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
}

.fight-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 13px;
  letter-spacing: 1px;
  color: #fef4d8;
  margin-bottom: 3px;
}

.fight-hp {
  height: 8px;
  background: #000;
  border: 1px solid #555;
  overflow: hidden;
}

.fight-hp-fill {
  height: 100%;
  background: linear-gradient(90deg, #4a7c2a, #6a9c3a);
  width: 100%;
  transition: width .25s;
}

.fight-hp-fill.foe {
  background: linear-gradient(90deg, #c0392b, #e85a4a);
}

.fight-hp-num {
  font-family: 'Special Elite', monospace;
  font-size: 10px;
  color: #fef4d8;
  margin-top: 2px;
}

.fight-vs {
  font-family: 'Pirata One', serif;
  font-size: 32px;
  color: #f4b13c;
  text-shadow: 2px 2px 0 #000;
  text-align: center;
}

.fight-log {
  background: #000;
  border: 2px solid #444;
  font-family: 'Special Elite', monospace;
  font-size: 11px;
  color: #fef4d8;
  padding: 6px 8px;
  min-height: 60px;
  margin-bottom: 12px;
  line-height: 1.5;
}

.fight-log .hit { color: #6acf4a; }
.fight-log .hurt { color: #ff6a4a; }
.fight-log .tie { color: #f4b13c; }

.fight-moves {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 6px;
  margin-bottom: 10px;
}

.fight-move {
  background: #3a1a1a;
  color: #fef4d8;
  border: 2px solid #000;
  padding: 8px 4px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: 'Bebas Neue', sans-serif;
  box-shadow: 2px 2px 0 #000;
  transition: transform .1s;
}

.fight-move:active {
  transform: translate(2px,2px);
  box-shadow: none;
}

.fight-move .ic { font-size: 24px; margin-bottom: 2px; }
.fight-move .lab { font-size: 13px; letter-spacing: 1px; }
.fight-move .hint { font-size: 9px; opacity: .7; font-family: 'Special Elite', monospace; }

.fight-flee {
  width: 100%;
  font-size: 13px;
}

.fight-result {
  text-align: center;
  font-family: 'Special Elite', monospace;
  font-size: 14px;
  padding: 14px;
  margin-bottom: 14px;
  border: 2px solid #000;
}

.fight-result.win {
  background: rgba(74,124,42,.3);
  color: #a8e6c1;
}

.fight-result.lose {
  background: rgba(192,57,43,.3);
  color: #ff8a7a;
}


/* ========================================================================
   7. WORKSHOP (SYNDICAT - Punition aux bagages)
   ======================================================================== */

.synd-back {
  background: rgba(10,37,64,.92);
}

.synd-modal {
  background: linear-gradient(180deg, #1a2a4a 0%, #0a1a3a 100%) !important;
  color: var(--paper);
  border-color: #000;
  max-width: 360px;
}

.synd-title {
  text-align: center;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 38px;
  letter-spacing: 4px;
  color: #f4b13c;
  text-shadow: 3px 3px 0 #000;
  margin-bottom: 8px;
}

.synd-sub {
  font-family: 'Special Elite', monospace;
  font-size: 13px;
  color: #fef4d8;
  text-align: center;
  font-style: italic;
  margin-bottom: 14px;
  line-height: 1.5;
}

.synd-rules {
  background: rgba(0,0,0,.4);
  border: 2px solid #000;
  padding: 10px;
  font-family: 'Special Elite', monospace;
  font-size: 13px;
  color: #fef4d8;
  margin-bottom: 14px;
}

.synd-rules div { padding: 3px 0; }
.synd-rules .muted { font-size: 10px; margin-top: 6px; color: #f4a4a4; }

/* Bag puzzle */
.bag-area {
  background: linear-gradient(180deg, #5a4a30 0%, #3a3018 100%);
  border: 3px solid #000;
  padding: 10px;
  margin-bottom: 12px;
  position: relative;
  user-select: none;
}

.bag-area.flash-good { background: linear-gradient(180deg, #4a7c2a 0%, #3a6c1a 100%); }
.bag-area.flash-bad { background: linear-gradient(180deg, #c0392b 0%, #a02919 100%); }
.bag-area.flash-miss { background: linear-gradient(180deg, #888 0%, #555 100%); }

.bag-zones {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 6px;
  margin-bottom: 8px;
}

.bag-zone {
  padding: 8px 4px;
  background: #fef4d8;
  border: 3px solid #000;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 13px;
  letter-spacing: 1px;
  text-align: center;
  cursor: pointer;
  color: #0a2540;
  box-shadow: 2px 2px 0 #000;
  line-height: 1.2;
}

.bag-zone:active {
  transform: translate(2px,2px);
  box-shadow: none;
}

.bag-conv {
  position: relative;
  height: 60px;
  background: repeating-linear-gradient(90deg, #2a2010 0 12px, #1a1308 12px 24px);
  border: 2px solid #000;
  overflow: hidden;
}

.bag-item {
  position: absolute;
  top: 50%;
  width: 36px;
  height: 32px;
  margin-top: -16px;
  border: 2px solid #000;
  border-radius: 3px;
  box-shadow: 2px 2px 0 #000;
}

.bag-item::before {
  content: '';
  position: absolute;
  top: -8px;
  left: 50%;
  transform: translateX(-50%);
  width: 14px;
  height: 6px;
  background: transparent;
  border: 2px solid #000;
  border-bottom: none;
  border-radius: 6px 6px 0 0;
}

.bag-rouge { background: #c0392b; }

}

.sealed-anim {

.sealed-light {

.sealed-light[data-color="rouge"] { background: #7a1a1a; }
.sealed-light[data-color="bleu"] { background: #0a3d54; }

.sealed-light.flash[data-color="rouge"] { background: #ff4040; box-shadow: 0 0 24px #ff4040; opacity: 1; }
.sealed-light.flash[data-color="bleu"] { background: #3aaadc; box-shadow: 0 0 24px #3aaadc; opacity: 1; }
.sealed-light.flash[data-color="jaune"] { background: #f4d44a; box-shadow: 0 0 24px #f4b13c; opacity: 1; }

.sealed-light:active { transform: scale(.95); }

.sealed-progress {

  justify-content: center;

  margin-bottom: 12px;
}

.sealed-progress .dot {

.sealed-progress .dot.on.color-rouge { background: #ff4040; }
.sealed-progress .dot.on.color-bleu { background: #3aaadc; }
.sealed-progress .dot.on.color-jaune { background: #f4d44a; }

}

.sealed-time .bar {

  font-size: 13px;

/* Rhythm/Cadence indicator */
.rhythm-indic {
  position: absolute;
  bottom: 6px;
  left: 50%;
  transform: translateX(-50%);
  width: 42%;
  max-width: 200px;
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(10,37,64,.85);
  border: 2px solid #000;
  padding: 4px 8px;
  z-index: 8;
  font-family: 'Bebas Neue', sans-serif;
}

.rhythm-heart {
  font-size: 18px;
  color: #c0392b;
  text-shadow: 0 0 4px #c0392b;
  width: 20px;
  text-align: center;
  transition: transform .12s;
}

.rhythm-heart.beat {
  animation: heartBeat .4s ease;
}

@keyframes heartBeat {
  0% { transform: scale(1); }
  20% { transform: scale(1.5); color: #fff; }
  50% { transform: scale(1.1); }
  100% { transform: scale(1); }
}

.rhythm-gauge {
  flex: 1;
  height: 8px;
  background: #000;
  border: 1px solid rgba(255,255,255,.2);
  overflow: hidden;
}

.rhythm-gauge-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #f4b13c 0%, #c0392b 70%, #fff 100%);
  transition: width .15s ease;
}

.rhythm-label {
  font-size: 11px;
  color: #f4b13c;
  letter-spacing: 1px;
  min-width: 60px;
  text-align: center;
}

.rhythm-indic.frenzy {
  background: rgba(192,57,43,.95);
  animation: frenzyPulse .5s ease infinite;
  border-color: #fff;
}

.rhythm-indic.frenzy .rhythm-heart { color: #fff; }
.rhythm-indic.frenzy .rhythm-label { color: #fff; }

@keyframes frenzyPulse {
  0%, 100% { box-shadow: 0 0 8px #c0392b; }
  50% { box-shadow: 0 0 18px #c0392b, 0 0 30px #f4b13c; }
}

.frenzy-banner {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  z-index: 200;
  padding: 14px 28px;
  background: linear-gradient(135deg, #c0392b, #f4b13c);
  border: 4px solid #000;
  font-family: 'Pirata One', serif;
  font-size: 36px;
  color: #fff;
  text-shadow: 2px 2px 0 #000;
  box-shadow: 6px 6px 0 #000;
  pointer-events: none;
  transition: transform .3s cubic-bezier(.5, 1.7, .6, 1), opacity .3s;
  opacity: 0;
}

.frenzy-banner.show {
  transform: translate(-50%, -50%) scale(1);
  opacity: 1;
}

/* Sweet spots (weak points) */
.sweet-spots {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 10;
}

.sweet-spot {
  position: absolute;
  width: 36px;
  height: 36px;
  margin: -18px 0 0 -18px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(244,177,60,.95) 0%, rgba(244,177,60,.5) 50%, transparent 70%);
  border: 2px solid #fff;
  box-shadow: 0 0 12px #f4b13c, inset 0 0 6px #fff;
  animation: sweetPulse 1.2s ease-in-out infinite;
}

.sweet-spot::after {
  content: '⚡';
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: #c0392b;
  text-shadow: 0 0 4px #fff;
}

@keyframes sweetPulse {
  0%, 100% { transform: scale(1); opacity: .85; }
  50% { transform: scale(1.18); opacity: 1; }
}

.sweet-particle {
  position: absolute;
  width: 8px;
  height: 8px;
  margin: -4px 0 0 -4px;
  background: #f4b13c;
  border: 1px solid #fff;
  border-radius: 50%;
  pointer-events: none;
  z-index: 60;
  box-shadow: 0 0 6px #f4b13c;
  animation: sweetBurst .55s ease-out forwards;
}

@keyframes sweetBurst {
  0% { transform: translate(0,0) scale(1); opacity: 1; }
  100% { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; }
}


/* ========================================================================
   9. UPGRADES & BADGES
   ======================================================================== */

/* Upgrades screen */
.upgrade-card {
  background: var(--paper);
  border: 3px solid #000;
  box-shadow: var(--shadow-hard);
  margin-bottom: 12px;
  padding: 10px 12px;
  display: grid;
  grid-template-columns: 54px 1fr auto;
  gap: 10px;
  align-items: center;
  position: relative;
  transition: transform .1s;
}

.upgrade-card.locked {
  opacity: .55;
  filter: grayscale(.6);
}

.upgrade-card.affordable:not(.locked) {
  background: linear-gradient(135deg, #fff5cc 0%, var(--paper) 100%);
}

.upgrade-card .ico {
  width: 54px;
  height: 54px;
  background: #fff;
  border: 2px solid #000;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
}

.upgrade-card .ico svg {
  width: 46px;
  height: 46px;
}

.upgrade-card .info {
  min-width: 0;
}

.upgrade-card .info h3 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 18px;
  letter-spacing: .5px;
  color: var(--port-blue-deep);
  line-height: 1;
}

.upgrade-card .info p {
  font-size: 11px;
  color: #5a4a30;
  margin-top: 3px;
  line-height: 1.3;
}

.upgrade-card .info .lvl {
  display: inline-block;
  margin-top: 4px;
  font-family: 'Bebas Neue', sans-serif;
  background: var(--port-blue);
  color: var(--crane);
  padding: 1px 6px;
  font-size: 12px;
}

.upgrade-card .buy {
  background: var(--green);
  color: #fff;
  border: 2px solid #000;
  padding: 8px 10px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 14px;
  letter-spacing: .5px;
  box-shadow: 2px 2px 0 #000;
  min-width: 80px;
  line-height: 1;
}

.upgrade-card .buy:active {
  transform: translate(2px,2px);
  box-shadow: none;
}

.upgrade-card .buy.cant {
  background: #888;
  cursor: not-allowed;
}

.upgrade-card .buy small {
  display: block;
  font-size: 9px;
  opacity: .85;
  margin-top: 2px;
}

/* Badges grid */
.badge-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.badge {
  background: var(--paper);
  border: 3px solid #000;
  box-shadow: var(--shadow-soft);
  aspect-ratio: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 6px;
  position: relative;
  text-align: center;
  overflow: hidden;
}

.badge.locked {
  background: #3a3a3a;
  color: #666;
}

.badge.locked .ico { filter: grayscale(1) brightness(.4); }
.badge.locked .name { color: #888; }

.badge .ico {
  font-size: 30px;
  line-height: 1;
  margin-bottom: 4px;
}

.badge .name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 12px;
  line-height: 1;
  color: var(--port-blue-deep);
  letter-spacing: .3px;
}

.badge .rarity-tag {
  position: absolute;
  top: 0;
  left: 0;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 9px;
  letter-spacing: 1px;
  padding: 1px 5px;
  color: #000;
}

.rarity-common .rarity-tag { background: #bbb; }
.rarity-uncommon .rarity-tag { background: #7bc46c; }
.rarity-rare .rarity-tag { background: #5da9e8; }
.rarity-epic .rarity-tag { background: #b074d6; color: #fff; }
.rarity-legendary .rarity-tag { background: linear-gradient(135deg, #f4b13c, #c0392b); color: #fff; }

.rarity-mythic {
  animation: mythicPulse 2.4s ease-in-out infinite;
}

.rarity-mythic .rarity-tag {
  background: linear-gradient(90deg, #ff0066, #f4b13c, #2e9bd4, #ff0066);
  background-size: 200% 100%;
  color: #fff;
  animation: mythGrad 3s linear infinite;
}

@keyframes mythGrad {
  0% { background-position: 0 0; }
  100% { background-position: 200% 0; }
}

@keyframes mythicPulse {
  0%, 100% { box-shadow: var(--shadow-soft), 0 0 0 0 rgba(244,177,60,.6); }
  50% { box-shadow: var(--shadow-soft), 0 0 18px 3px rgba(244,177,60,.7); }
}

   10. NAVIGATION & MISC
   ======================================================================== */

/* Bottom tab navigation */
.tabbar {
  position: relative;
  z-index: 20;
  display: grid;
  grid-template-columns: repeat(6,1fr);
  gap: 0;
  background: #ffffff;
  border-top: 1px solid #e0d8cc;
  box-shadow: 0 -2px 8px rgba(0,0,0,.08);
  padding-bottom: env(safe-area-inset-bottom, 0);
}

.tabbar button {
  position: relative;
  padding: 7px 1px 5px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  color: #8a7a6a;
  opacity: 1;
  transition: color .15s, transform .1s;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 9px;
  letter-spacing: .5px;
}

.tabbar button .ic { font-size: 18px; line-height: 1; }

.tabbar button.on {
  color: var(--port-blue-deep);
}

.tabbar button.on::before {
  content: '';
  position: absolute;
  top: 0;
  left: 20%;
  right: 20%;
  height: 2px;
  background: var(--crane);
}

.tabbar button:active { transform: scale(.95); }

.tabbar button .badge-dot {
  position: absolute;
  top: 5px;
  right: 14%;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--red);
  border: 1px solid rgba(0,0,0,.2);
  display: none;
}

.tabbar button .badge-dot.on { display: block; }

/* Swipe arrow guide */
.swipe-arrow {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-family: 'Bebas Neue', sans-serif;
  font-size: 64px;
  color: #fff;
  text-shadow: 3px 3px 0 #c0392b, -2px -2px 0 #c0392b, 2px -2px 0 #c0392b, -2px 2px 0 #c0392b, 0 0 20px rgba(244,177,60,.8);
  pointer-events: none;
  z-index: 12;
  animation: swipeArrowPulse 1s ease infinite;
}

@keyframes swipeArrowPulse {
  0%, 100% { transform: translate(-50%, -50%) scale(1); }
  50% { transform: translate(-50%, -50%) scale(1.2); }
}

.swipe-arrow[data-dir="up"] { animation: swipeArrowUp 1s ease infinite; }
.swipe-arrow[data-dir="down"] { animation: swipeArrowDown 1s ease infinite; }
.swipe-arrow[data-dir="left"] { animation: swipeArrowLeft 1s ease infinite; }
.swipe-arrow[data-dir="right"] { animation: swipeArrowRight 1s ease infinite; }

@keyframes swipeArrowUp {
  0%, 100% { transform: translate(-50%, -50%) translateY(0); }
  50% { transform: translate(-50%, -50%) translateY(-12px); }
}

@keyframes swipeArrowDown {
  0%, 100% { transform: translate(-50%, -50%) translateY(0); }
  50% { transform: translate(-50%, -50%) translateY(12px); }
}

@keyframes swipeArrowLeft {
  0%, 100% { transform: translate(-50%, -50%) translateX(0); }
  50% { transform: translate(-50%, -50%) translateX(-12px); }
}

@keyframes swipeArrowRight {
  0%, 100% { transform: translate(-50%, -50%) translateX(0); }
  50% { transform: translate(-50%, -50%) translateX(12px); }
}

/* Container shake animation */
@keyframes shake {
  0%, 100% { transform: translateX(-50%); }
  25% { transform: translateX(-55%); }
  50% { transform: translateX(-45%); }
  75% { transform: translateX(-53%); }
}
