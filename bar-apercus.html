<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bar des Docks · aperçus</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}html,body{height:100%;overflow:hidden}body{font-family:'Helvetica Neue',Arial,sans-serif}
#choix{position:fixed;left:0;right:0;top:0;z-index:50;display:flex;gap:6px;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 6px) 6px 6px;color:#999}
#choix button{border:0;border-radius:14px;padding:7px 14px;font:600 12px Arial;background:rgba(128,128,128,.25);color:inherit}#choix button.on{background:#c9a24a;color:#111}
.v{position:fixed;inset:0;padding:calc(env(safe-area-inset-top,0px) + 46px) 18px 20px;display:none;flex-direction:column;overflow-y:auto}.v.on{display:flex}
#N{background:#0d0d0f;color:#f2efe8}
#N .t{font:300 11px 'Helvetica Neue',Arial;letter-spacing:6px;color:#c9a24a}#N h1{font:400 30px Georgia,serif;letter-spacing:.5px;margin:6px 0 2px}#N .s{font:13px Georgia,serif;color:#8a8a90;margin-bottom:22px}
#N .c{position:relative;border-radius:16px;padding:18px 18px 16px;margin-bottom:14px;overflow:hidden;cursor:pointer;background:#17171a;border:1px solid #2a2a2e}
#N .c canvas.g{position:absolute;inset:0;width:100%;height:100%;opacity:.5}
#N .c .l{position:absolute;left:0;top:0;bottom:0;width:4px}
#N .c .h{position:relative;display:flex;justify-content:space-between;align-items:baseline}#N .c .h b{font:400 21px Georgia,serif}#N .c .h span{font:600 16px 'Helvetica Neue',Arial}
#N .c .m{position:relative;margin-top:14px;display:flex;justify-content:space-between;align-items:flex-end}#N .c .m small{font:500 9px Arial;letter-spacing:3px;color:#8a8a90}#N .c .m em{display:block;font:300 26px 'Helvetica Neue',Arial;font-style:normal;color:#c9a24a;margin-top:2px}
#N .c .m i{font:500 10px Arial;letter-spacing:2px;color:#6a6a70;font-style:normal}
#N .p{margin-top:auto;font:12px Georgia,serif;color:#6a6a70;text-align:center;padding-top:10px}
#I{background:#f3efe6;color:#1a1a1c}
#I .t{font:600 10px Arial;letter-spacing:5px;color:#8a7a5a}#I h1{font:400 32px Georgia,serif;margin:6px 0 2px}#I .s{font:italic 13px Georgia,serif;color:#7a7268;margin-bottom:22px}
#I .c{position:relative;border-top:1px solid #1a1a1c;padding:16px 2px;cursor:pointer;display:flex;align-items:center;gap:14px}#I #listeI .c:last-child{border-bottom:1px solid #1a1a1c}
#I .c .pt{flex:none;width:12px;height:12px;border-radius:50%}#I .c .x{flex:1}#I .c b{display:block;font:400 20px Georgia,serif}#I .c small{font:11px Arial;letter-spacing:1px;color:#7a7268}
#I .c em{flex:none;font:400 22px Georgia,serif;font-style:normal}
#I .p{margin-top:auto;font:italic 12px Georgia,serif;color:#8a8278;text-align:center;padding-top:14px}
#gt{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px}#gt.on{display:flex}
#gt.n{background:rgba(8,8,10,.92);color:#f2efe8}#gt.i{background:rgba(243,239,230,.96);color:#1a1a1c}
#gt .tk{width:min(90vw,350px);border-radius:18px;overflow:hidden;position:relative}
#gt.n .tk{background:#17171a;border:1px solid #2e2e32;box-shadow:0 20px 50px rgba(0,0,0,.6)}#gt.i .tk{background:#fffdf7;border:1px solid #1a1a1c;box-shadow:0 14px 34px rgba(0,0,0,.12)}
#gt .tk .hd{padding:16px 18px 10px;display:flex;justify-content:space-between;align-items:baseline}#gt .tk .hd b{font:400 21px Georgia,serif}#gt .tk .hd span{font:500 10px Arial;letter-spacing:3px;opacity:.6}
#gt .zone{position:relative;margin:0 14px;border-radius:10px;overflow:hidden;aspect-ratio:3/2}
#gt.n .zone{background:#0f0f11}#gt.i .zone{background:#f6f1e6}
#gt .cases{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr)}
#gt .cases div{display:flex;align-items:center;justify-content:center;font:300 26px 'Helvetica Neue',Arial}
#gt.n .cases div{border:1px solid #232326}#gt.i .cases div{border:1px solid #e0d8c8}
#gt .cases div.gg{font-weight:600}#gt.n .cases div.gg{color:#c9a24a;background:rgba(201,162,74,.08)}#gt.i .cases div.gg{color:#b8321e;background:rgba(184,50,30,.06)}
#gt canvas.pel{position:absolute;inset:0;width:100%;height:100%;touch-action:none;transition:opacity .5s}#gt canvas.pel.parti{opacity:0}
#gt canvas.pou{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#gt .pd{padding:12px 18px 14px;display:flex;justify-content:space-between;font:10px 'Courier New',monospace;opacity:.55}
#gt .rg{font:13px Georgia,serif;opacity:.7}
#gt .res{font:400 22px Georgia,serif;min-height:30px;text-align:center}#gt.n .res span{color:#c9a24a}#gt.i .res span{color:#b8321e}
#gt .ok{border:0;border-radius:24px;padding:12px 30px;font:600 14px Arial;letter-spacing:1px;visibility:hidden}#gt.n .ok{background:#c9a24a;color:#111}#gt.i .ok{background:#1a1a1c;color:#fff}
</style></head><body>
<div class="v on" id="N"><div class="t">BAR DES DOCKS</div><h1>Jeux à gratter</h1><div class="s">Trois montants identiques, c'est gagné.</div><div id="listeN"></div><div class="p">Vingt tickets par jour · remise à zéro à minuit</div></div>
<div class="v" id="I"><div class="t">BAR · TABAC · PMU</div><h1>La Grattouille</h1><div class="s">Trois montants identiques, c'est gagné.</div><div id="listeI"></div><div class="p">Vingt tickets par jour · remise à zéro à minuit</div></div>
<div id="choix"><button data-v="N" class="on">Noir &amp; or</button><button data-v="I">Ivoire &amp; encre</button></div>
<div id="gt"><div class="tk" id="tk"></div><div class="rg">Gratte les six cases du doigt</div><div class="res" id="res"></div><button class="ok" id="ok">Continuer</button></div>
<script>
const T=[{id:'poisson',nom:'Le Petit Poisson',px:1,max:100,c:'#3a8ab0',gains:[1,2,5,20,100]},{id:'filet',nom:'Le Filet d’Or',px:3,max:300,c:'#c9a24a',gains:[3,6,15,50,300]},{id:'cargo',nom:'Le Gros Cargo',px:10,max:500,c:'#b8321e',gains:[10,20,50,150,500]}];
let STYLE='N';
function guilloche(g,W,H,col,a){g.strokeStyle=col;g.globalAlpha=a;g.lineWidth=.6;for(let k=0;k<18;k++){g.beginPath();for(let x=0;x<=W;x+=3){const y=H/2+Math.sin(x/W*Math.PI*4+k*.35)*H*.32*Math.cos(k*.2)+Math.sin(x/37+k)*4;x?g.lineTo(x,y):g.moveTo(x,y);}g.stroke();}g.globalAlpha=1;}
function lister(){document.getElementById('listeN').innerHTML=T.map((t,k)=>'<div class="c" data-t="'+t.id+'"><canvas class="g"></canvas><span class="l" style="background:'+t.c+'"></span><div class="h"><b>'+t.nom+'</b><span>'+t.px+' €</span></div><div class="m"><div><small>GAIN MAXIMUM</small><em>'+t.max+' €</em></div><i>TICKET N° '+(100+k)+'</i></div></div>').join('');
  document.querySelectorAll('#listeN canvas.g').forEach((cv,k)=>{const r=cv.getBoundingClientRect();cv.width=Math.max(10,r.width*2);cv.height=Math.max(10,r.height*2);guilloche(cv.getContext('2d'),cv.width,cv.height,T[k].c,.35);});
  document.getElementById('listeI').innerHTML=T.map(t=>'<div class="c" data-t="'+t.id+'"><span class="pt" style="background:'+t.c+'"></span><div class="x"><b>'+t.nom+'</b><small>JUSQU’À '+t.max+' €</small></div><em>'+t.px+' €</em></div>').join('');
  document.querySelectorAll('[data-t]').forEach(el=>el.onclick=()=>ouvrir(T.find(x=>x.id===el.dataset.t)));}
function tirage(t){const gagne=Math.random()<.35, g=gagne?t.gains[Math.random()<.7?0:(Math.random()<.7?1:2)]:0, L=gagne?[g,g,g]:[], autres=t.gains.filter(x=>x!==g);
  while(L.length<6){const c=autres[Math.floor(Math.random()*autres.length)];if(L.filter(x=>x===c).length<2)L.push(c);}for(let i=5;i>0;i--){const j=Math.floor(Math.random()*(i+1));[L[i],L[j]]=[L[j],L[i]];}return {grille:L,gain:g};}
function ouvrir(t){const d=tirage(t), noir=STYLE==='N', gt=document.getElementById('gt');gt.className='on '+(noir?'n':'i');
  document.getElementById('tk').innerHTML='<div class="hd"><b>'+t.nom+'</b><span>'+t.px+' €</span></div><div class="zone" id="zone"><div class="cases">'+d.grille.map(m=>'<div data-m="'+m+'">'+m+'&thinsp;€</div>').join('')+'</div><canvas class="pel"></canvas><canvas class="pou"></canvas></div><div class="pd"><span>N° '+String(Math.floor(Math.random()*1e6)).padStart(6,'0')+'</span><span>BAR DES DOCKS</span></div>';
  document.getElementById('res').innerHTML='';document.getElementById('ok').style.visibility='hidden';
  const z=document.getElementById('zone'),cv=z.querySelector('.pel'),pc=z.querySelector('.pou');
  requestAnimationFrame(()=>{const rr=z.getBoundingClientRect(),D=Math.min(3,devicePixelRatio||1);cv.width=Math.round(rr.width*D);cv.height=Math.round(rr.height*D);pc.width=Math.round(rr.width);pc.height=Math.round(rr.height);
    const W=cv.width,H=cv.height,g=cv.getContext('2d');
    const gr=g.createLinearGradient(0,0,W,H);if(noir){gr.addColorStop(0,'#8a7a50');gr.addColorStop(.45,'#d8c28a');gr.addColorStop(.55,'#c9a24a');gr.addColorStop(1,'#7a6a40');}
    else{gr.addColorStop(0,'#b8bcc2');gr.addColorStop(.45,'#eceef0');gr.addColorStop(.55,'#d0d4d8');gr.addColorStop(1,'#a8acb2');}
    g.fillStyle=gr;g.fillRect(0,0,W,H);guilloche(g,W,H,noir?'#fff6d8':'#ffffff',.25);guilloche(g,W,H*1.2,noir?'#5a4a20':'#8a8e94',.12);
    for(let k=0;k<W*H/90;k++){g.fillStyle=Math.random()<.5?'rgba(255,255,255,.18)':'rgba(0,0,0,.06)';g.fillRect(Math.random()*W,Math.random()*H,D,D);}
    g.fillStyle=noir?'rgba(60,45,15,.35)':'rgba(80,84,90,.3)';g.font='300 '+Math.round(11*D)+'px "Helvetica Neue",Arial';g.textAlign='center';g.textBaseline='middle';g.fillText('G R A T T E Z   I C I',W/2,H/2);
    g.globalCompositeOperation='destination-out';g.lineCap='round';g.lineJoin='round';
    const MW=60,MH=40,m=document.createElement('canvas');m.width=MW;m.height=MH;const mg=m.getContext('2d');mg.fillStyle='#000';mg.fillRect(0,0,MW,MH);mg.strokeStyle='#fff';mg.lineCap='round';
    const R=16*D;let fini=false,der=null,file=[],pou=[],raf=0,mes=0,tp=performance.now();const pg=pc.getContext('2d');
    const devoiler=()=>{if(fini)return;fini=true;cv.classList.add('parti');const cs=[...z.querySelectorAll('.cases div')];
      if(d.gain){cs.filter(c=>+c.dataset.m===d.gain).forEach(c=>c.classList.add('gg'));document.getElementById('res').innerHTML='Gagné · <span>'+d.gain+' €</span>';if(navigator.vibrate)navigator.vibrate([25,40,25]);}
      else document.getElementById('res').innerHTML='Pas cette fois';document.getElementById('ok').style.visibility='visible';};
    const mesurer=()=>{const px=mg.getImageData(0,0,MW,MH).data;let v=0;for(let i=0;i<px.length;i+=4)if(px[i]>128)v++;if(v/(MW*MH)>=.7)devoiler();};
    const trait=(a,b)=>{for(let q=0;q<3;q++){g.lineWidth=R*2*(.84+q*.08);g.beginPath();g.moveTo(a.x+(q-1)*D,a.y+(q-1)*D*.6);g.lineTo(b.x+(q-1)*D*.6,b.y-(q-1)*D);g.stroke();}
      mg.lineWidth=R*2*MW/W;mg.beginPath();mg.moveTo(a.x*MW/W,a.y*MH/H);mg.lineTo(b.x*MW/W,b.y*MH/H);mg.stroke();if(Math.random()<.45)pou.push({x:b.x/D,y:b.y/D,vx:(Math.random()-.5)*50,vy:-15-Math.random()*30,t:0});};
    const boucle=(ts)=>{raf=0;for(const p of file){trait(der||p,der?p:{x:p.x+.1,y:p.y+.1});der=p;}file=[];if(!fini&&ts-mes>120){mes=ts;mesurer();}
      const nw=performance.now(),dt=Math.min(.05,(nw-tp)/1000);tp=nw;pg.clearRect(0,0,pc.width,pc.height);pou=pou.filter(p=>(p.t+=dt)<.6);
      for(const p of pou){p.vy+=240*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;pg.fillStyle=(noir?'rgba(216,194,138,':'rgba(200,204,210,')+(1-p.t/.6).toFixed(2)+')';pg.fillRect(p.x,p.y,1.5,1.5);}if(pou.length)raf=requestAnimationFrame(boucle);};
    const pt=(ev)=>{const r=cv.getBoundingClientRect();return {x:(ev.clientX-r.left)*D,y:(ev.clientY-r.top)*D};};
    const prendre=(ev)=>{const L=ev.getCoalescedEvents?ev.getCoalescedEvents():[];for(const x of (L.length?L:[ev]))file.push(pt(x));if(!raf)raf=requestAnimationFrame(boucle);};
    cv.onpointerdown=(ev)=>{ev.preventDefault();cv.setPointerCapture(ev.pointerId);der=null;prendre(ev);};cv.onpointermove=(ev)=>{if(cv.hasPointerCapture(ev.pointerId))prendre(ev);};
    cv.onpointerup=cv.onpointercancel=()=>{der=null;requestAnimationFrame(mesurer);};});}
document.getElementById('ok').onclick=()=>document.getElementById('gt').classList.remove('on');
document.querySelectorAll('#choix button').forEach(b=>b.onclick=()=>{STYLE=b.dataset.v;document.querySelectorAll('#choix button,.v').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.v).classList.add('on');lister();});
lister();
</script></body></html>
