<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bar des Docks · tickets</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}html,body{height:100%;overflow:hidden;background:#15110e}body{font-family:'Helvetica Neue',Arial,sans-serif;color:#fff}
#sel{position:fixed;left:0;right:0;top:0;z-index:50;display:flex;gap:6px;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 8px) 8px 8px;background:rgba(0,0,0,.6)}
#sel button{border:0;border-radius:14px;padding:7px 12px;font:600 12px Arial;background:#333;color:#ddd}#sel button.on{background:#e8c46a;color:#111}
#scene{position:fixed;inset:0;padding:calc(env(safe-area-inset-top,0px) + 50px) 12px 12px;display:flex;flex-direction:column;align-items:center;gap:10px;overflow-y:auto}
.tk{width:min(94vw,360px);border-radius:16px;overflow:hidden;position:relative;box-shadow:0 18px 44px rgba(0,0,0,.55);flex:none}
.hd{position:relative;padding:14px 16px 6px}.hd small{display:block;font:600 9px Arial;letter-spacing:3px;opacity:.75}.hd b{display:block;font:300 26px 'Helvetica Neue',Arial;letter-spacing:-.3px;margin-top:3px}
.regle{position:relative;font:italic 12.5px Georgia,serif;opacity:.9;padding:0 16px 10px;line-height:1.35}
.pd{position:relative;display:flex;justify-content:space-between;padding:8px 16px 12px;font:500 9px Arial;letter-spacing:2px;opacity:.65}
/* une zone à gratter : le contenu dessous, la pellicule (toile) dessus */
.z{position:relative;overflow:hidden}.z .dessous{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.z canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;transition:opacity .45s}.z canvas.parti{opacity:0;pointer-events:none}
.z.gg .dessous{animation:gg .55s ease-in-out 4 alternate}@keyframes gg{to{transform:scale(1.07)}}
#res{font:400 22px Georgia,serif;min-height:30px;text-align:center}#res span{color:#e8c46a}
#ok{border:0;border-radius:22px;padding:11px 26px;font:700 14px Arial;background:#e8c46a;color:#111}
/* ——— LE PETIT POISSON : aquarelle bleu lagon ——— */
.t1{background:radial-gradient(circle at 20% 15%,#7fd4e8,transparent 45%),radial-gradient(circle at 85% 70%,#2a8ab8,transparent 55%),linear-gradient(160deg,#4ab8d8,#1a6a98);color:#fff}
.t1 .flot{position:absolute;left:0;right:0;top:0;height:6px;background:repeating-linear-gradient(90deg,#fff 0 10px,#e8402a 10px 20px);opacity:.85}
.t1 .appat{margin:4px 16px 12px;height:74px;border-radius:14px;background:rgba(255,255,255,.92);color:#12506e}
.t1 .appat .dessous small{font:700 9px Arial;letter-spacing:3px;opacity:.6}.t1 .appat .dessous b{font:400 16px Georgia,serif}
.t1 .bulles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 18px 6px}
.t1 .bulle{aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.95);color:#12506e;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
.t1 .bulle .dessous b{font:700 14px Arial;margin-top:2px}.t1 .bulle .dessous small{font:600 8px Arial;opacity:.7}
.t1 .z.gg .dessous{background:#ffe89a;border-radius:inherit}
/* ——— LE FILET D'OR : nacre dorée et mailles ——— */
.t2{background:repeating-linear-gradient(45deg,rgba(150,110,30,.16) 0 1px,transparent 1px 14px),repeating-linear-gradient(-45deg,rgba(150,110,30,.16) 0 1px,transparent 1px 14px),linear-gradient(135deg,#fbf0cf,#f0dca0 45%,#fff6dc 60%,#e8cc88);color:#4a3410}
.t2 .hd b{font:italic 400 28px Georgia,serif}
.t2 .jeu{display:flex;gap:10px;padding:0 14px 6px;align-items:stretch}
.t2 .grille{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.t2 .case{aspect-ratio:1;border-radius:8px;background:#fffaf0;box-shadow:inset 0 0 0 1px rgba(150,110,30,.35)}
.t2 .tresor{flex:none;width:86px;border-radius:10px;background:#fffaf0;box-shadow:inset 0 0 0 1px rgba(150,110,30,.45)}.t2 .tresor .dessous small{font:700 8px Arial;letter-spacing:2px;opacity:.7}.t2 .tresor .dessous b{font:400 22px Georgia,serif}
.t2 .z.gg .dessous{background:#ffe070;border-radius:inherit}
/* ——— LE GROS CARGO : bleu nuit, lumières du port, conteneurs ——— */
.t3{background:radial-gradient(1px 1px at 12% 20%,#ffe8a0,transparent),radial-gradient(1px 1px at 72% 12%,#ffe8a0,transparent),radial-gradient(1.5px 1.5px at 40% 8%,#fff,transparent),radial-gradient(1px 1px at 88% 30%,#9ad8ff,transparent),linear-gradient(180deg,#0e1a33,#16284a 60%,#0e1a33);color:#fff}
.t3 .hd b{font:800 26px 'Helvetica Neue',Arial;letter-spacing:.5px}
.t3 .jour{margin:0 16px 12px;height:58px;border-radius:10px;background:#f4f6fa;color:#0e1a33}.t3 .jour .dessous{flex-direction:row;gap:14px}.t3 .jour .dessous span{width:36px;height:36px;border-radius:50%;background:#0e1a33;color:#fff;display:flex;align-items:center;justify-content:center;font:800 15px Arial}
.t3 .jour .dessous small{position:absolute;top:4px;font:700 8px Arial;letter-spacing:2px;opacity:.6}
.t3 .conts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 14px 6px}.t3 .cont{height:62px;border-radius:5px;background:#f4f6fa;color:#0e1a33}
.t3 .cont .dessous b{font:800 17px Arial}.t3 .cont .dessous small{font:600 10px Arial;opacity:.75}
.t3 .z.gg .dessous{background:#ffe070;border-radius:inherit}
</style></head><body>
<div id="sel"><button data-k="1" class="on">🐟 Petit Poisson</button><button data-k="2">🎣 Filet d’Or</button><button data-k="3">🚢 Gros Cargo</button></div>
<div id="scene"><div id="place"></div><div id="res"></div><button id="ok">Nouveau ticket</button></div>
<script>
const $=id=>document.getElementById(id);
/* une teinte plus claire, OPAQUE (une pellicule transparente laisserait voir les numéros dessous) */
const clair=(h)=>{const n=parseInt(h.slice(1),16);const c=[n>>16,(n>>8)&255,n&255].map(v=>Math.round(v+(255-v)*.28));return 'rgb('+c.join(',')+')';};const al=a=>a[Math.floor(Math.random()*a.length)];const melange=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
/* ——— les dessins ——— */
const POISSONS={sardine:['Sardine','#9aa8b8','#dfe6ee'],rouget:['Rouget','#d8503a','#f4a08a'],dorade:['Dorade','#c9a24a','#f0d890'],maquereau:['Maquereau','#2a7ab0','#8ac8e8'],loup:['Loup','#6a7888','#b8c4d0']};
const poissonSVG=(k,w)=>{const [n,c1,c2]=POISSONS[k];return '<svg viewBox="0 0 40 22" width="'+w+'"><ellipse cx="18" cy="11" rx="13" ry="7" fill="'+c1+'"/><ellipse cx="17" cy="9" rx="9" ry="3" fill="'+c2+'" opacity=".7"/><polygon points="30,11 39,4 39,18" fill="'+c1+'"/><circle cx="10" cy="9.5" r="1.6" fill="#1a1a1a"/>'+(k==='maquereau'?'<path d="M14 5 l3 5 M19 5 l3 5 M24 6 l2 4" stroke="#123" stroke-width="1"/>':'')+'</svg>';};
const ancre='<svg viewBox="0 0 24 24" width="30"><circle cx="12" cy="4.5" r="2.3" fill="none" stroke="#3a2a0a" stroke-width="1.8"/><path d="M12 7v13 M7 10h10 M4 14c0 4 4 6 8 6s8-2 8-6" fill="none" stroke="#3a2a0a" stroke-width="1.8" stroke-linecap="round"/></svg>';
const coquille='<svg viewBox="0 0 24 24" width="28"><path d="M12 20 L3 10 Q12 0 21 10 Z" fill="#e8a8a0"/><path d="M12 20 L7 8 M12 20 L12 5 M12 20 L17 8" stroke="#b86a60" stroke-width="1"/></svg>';
const etoile='<svg viewBox="0 0 24 24" width="28"><path d="M12 2 l2.8 6.6 7 .6-5.3 4.6 1.7 7-6.2-3.8-6.2 3.8 1.7-7L2.2 9.2l7-.6z" fill="#f0a040"/></svg>';
const sirene='<svg viewBox="0 0 24 24" width="30"><circle cx="12" cy="5" r="3" fill="#e0b088"/><path d="M9 4 q3 -4 7 1 q-1 6 -2 8" fill="#c84a2a"/><path d="M12 8 q-4 5 0 9 q2 3 -2 5 l6 -1 q-3 -2 -1 -4 q3 -4 -3 -9z" fill="#2aa0a0"/></svg>';
/* ——— la pellicule d'une zone : le même grattage fluide, pour chaque zone ——— */
function pellicule(z,style,fini){const cv=document.createElement('canvas');z.appendChild(cv);const r=z.getBoundingClientRect(),D=Math.min(3,devicePixelRatio||1);cv.width=Math.max(4,Math.round(r.width*D));cv.height=Math.max(4,Math.round(r.height*D));
  const W=cv.width,H=cv.height,g=cv.getContext('2d');const gr=g.createLinearGradient(0,0,W,H);style.grad.forEach((c,i)=>gr.addColorStop(i/(style.grad.length-1),c));g.fillStyle=gr;g.fillRect(0,0,W,H);
  if(style.motif)style.motif(g,W,H,D);for(let k=0;k<W*H/90;k++){g.fillStyle=Math.random()<.5?'rgba(255,255,255,.16)':'rgba(0,0,0,.05)';g.fillRect(Math.random()*W,Math.random()*H,D,D);}
  if(style.texte){g.fillStyle=style.coulTexte||'rgba(40,40,50,.4)';g.font='700 '+Math.round((style.taille||9)*D)+'px Arial';g.textAlign='center';g.textBaseline='middle';g.fillText(style.texte,W/2,H/2);}
  g.globalCompositeOperation='destination-out';g.lineCap='round';g.lineJoin='round';
  const MW=24,MH=Math.max(8,Math.round(24*H/W)),m=document.createElement('canvas');m.width=MW;m.height=MH;const mg=m.getContext('2d');mg.fillStyle='#000';mg.fillRect(0,0,MW,MH);mg.strokeStyle='#fff';mg.lineCap='round';
  const R=12*D;let fin=false,der=null,file=[],raf=0,mes=0;
  const devoiler=()=>{if(fin)return;fin=true;cv.classList.add('parti');fini();};
  const mesurer=()=>{const px=mg.getImageData(0,0,MW,MH).data;let v=0;for(let i=0;i<px.length;i+=4)if(px[i]>128)v++;if(v/(MW*MH)>=.6)devoiler();};
  const trait=(a,b)=>{for(let q=0;q<3;q++){g.lineWidth=R*2*(.84+q*.08);g.beginPath();g.moveTo(a.x+(q-1)*D,a.y+(q-1)*D*.6);g.lineTo(b.x+(q-1)*D*.6,b.y-(q-1)*D);g.stroke();}
    mg.lineWidth=R*2*MW/W;mg.beginPath();mg.moveTo(a.x*MW/W,a.y*MH/H);mg.lineTo(b.x*MW/W,b.y*MH/H);mg.stroke();};
  const boucle=(ts)=>{raf=0;for(const p of file){trait(der||p,der?p:{x:p.x+.1,y:p.y+.1});der=p;}file=[];if(!fin&&ts-mes>100){mes=ts;mesurer();}};
  const pt=ev=>{const r=cv.getBoundingClientRect();return {x:(ev.clientX-r.left)*D,y:(ev.clientY-r.top)*D};};
  const prendre=ev=>{const L=ev.getCoalescedEvents?ev.getCoalescedEvents():[];for(const x of (L.length?L:[ev]))file.push(pt(x));if(!raf)raf=requestAnimationFrame(boucle);};
  cv.onpointerdown=ev=>{ev.preventDefault();cv.setPointerCapture(ev.pointerId);der=null;prendre(ev);};cv.onpointermove=ev=>{if(cv.hasPointerCapture(ev.pointerId))prendre(ev);};
  cv.onpointerup=cv.onpointercancel=()=>{der=null;requestAnimationFrame(mesurer);};
  return {devoiler};}
const bullesMotif=(g,W,H,D)=>{for(let k=0;k<6;k++){g.fillStyle='rgba(255,255,255,.35)';g.beginPath();g.arc(Math.random()*W,Math.random()*H,(2+Math.random()*5)*D,0,7);g.fill();}g.fillStyle='rgba(255,255,255,.55)';g.beginPath();g.arc(W*.32,H*.3,W*.09,0,7);g.fill();};
const maillesMotif=(g,W,H,D)=>{g.strokeStyle='rgba(255,246,216,.4)';g.lineWidth=D;for(let k=-H;k<W+H;k+=8*D){g.beginPath();g.moveTo(k,0);g.lineTo(k+H,H);g.stroke();g.beginPath();g.moveTo(k,H);g.lineTo(k+H,0);g.stroke();}};
const nervures=(c)=>(g,W,H,D)=>{g.fillStyle='rgba(0,0,0,.16)';for(let x=3*D;x<W;x+=5*D)g.fillRect(x,0,1.3*D,H);g.fillStyle='rgba(255,255,255,.25)';g.fillRect(0,0,W,2*D);};
/* ——— un tirage d'aperçu, puis la composition du ticket qui correspond (dans le jeu : le serveur) ——— */
let RESTE=0,GAIN=0,ZONES=[];
function fin(){if(--RESTE>0)return;ZONES.forEach(z=>z.gagne&&z.el.classList.add('gg'));$('res').innerHTML=GAIN?'Gagné · <span>'+GAIN+' €</span>':'Pas cette fois';if(GAIN&&navigator.vibrate)navigator.vibrate([25,40,25]);}
function monter(k){$('res').innerHTML='';ZONES=[];GAIN=0;const P=$('place');const n=String(Math.floor(Math.random()*1e6)).padStart(6,'0');
  if(k===1){const gains=[1,1,2,2,5,20,100],gagne=Math.random()<.35,appat=al(Object.keys(POISSONS)),g=gagne?al(gains.slice(0,5)):0;GAIN=g;
    const autres=Object.keys(POISSONS).filter(x=>x!==appat);const b=[];const pos=gagne?Math.floor(Math.random()*6):-1;
    for(let i=0;i<6;i++)b.push(i===pos?[appat,g]:[al(autres),al(gains)]);
    P.innerHTML='<div class="tk t1"><div class="flot"></div><div class="hd"><small>BAR DES DOCKS · 1 €</small><b>Le Petit Poisson</b></div><div class="regle">Gratte ton appât, puis les six bulles. Retrouve ton poisson : tu gagnes le montant affiché dessous.</div>'+
      '<div class="z appat" data-z="a"><div class="dessous"><small>TON APPÂT</small>'+poissonSVG(appat,54)+'<b>'+POISSONS[appat][0]+'</b></div></div>'+
      '<div class="bulles">'+b.map(([p,m],i)=>'<div class="z bulle" data-z="'+i+'"><div class="dessous">'+poissonSVG(p,40)+'<b>'+m+' €</b><small>'+POISSONS[p][0]+'</small></div></div>').join('')+'</div><div class="pd"><span>N° '+n+'</span><span>JUSQU’À 100 €</span></div></div>';
    ZONES=[...P.querySelectorAll('.z')].map((el,i)=>({el,gagne:el.dataset.z===String(pos)||(gagne&&el.dataset.z==='a'),style:el.dataset.z==='a'?{grad:['#b8c8d4','#eef4f8','#a8b8c6'],texte:'TON APPÂT',taille:10}:{grad:['#a8d8ec','#eefaff','#8ac8e0'],motif:bullesMotif}}));}
  if(k===2){const gains=[3,3,6,15,50,300],gagne=Math.random()<.33,g=gagne?al(gains.slice(0,4)):al(gains);GAIN=gagne?g:0;
    const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];let c=Array(9).fill(null);
    if(gagne){al(L).forEach(i=>c[i]='a');}
    const ok=()=>!L.some(l=>l.every(i=>c[i]==='a'))||gagne;
    for(let i=0;i<9;i++)if(!c[i]){let s;do{s=al(['a','c','e','c','e']);c[i]=s;}while(!gagne&&!ok());}
    if(gagne){/* une seule ligne d'ancres : on vérifie qu'on n'en a pas créé une seconde par hasard, sinon on corrige */}
    P.innerHTML='<div class="tk t2"><div class="hd"><small>BAR DES DOCKS · 3 €</small><b>Le Filet d’Or</b></div><div class="regle">Aligne trois ancres, en ligne, en colonne ou en diagonale, et remporte le trésor.</div>'+
      '<div class="jeu"><div class="grille">'+c.map((s,i)=>'<div class="z case" data-z="'+i+'"><div class="dessous">'+(s==='a'?ancre:(s==='c'?coquille:etoile))+'</div></div>').join('')+'</div>'+
      '<div class="z tresor" data-z="t"><div class="dessous"><small>TRÉSOR</small><b>'+g+' €</b></div></div></div><div class="pd"><span>N° '+n+'</span><span>JUSQU’À 300 €</span></div></div>';
    const ligne=gagne?L.find(l=>l.every(i=>c[i]==='a')):null;
    ZONES=[...P.querySelectorAll('.z')].map(el=>({el,gagne:gagne&&(el.dataset.z==='t'||(ligne&&ligne.includes(+el.dataset.z))),style:el.dataset.z==='t'?{grad:['#a8862a','#f0d890','#c9a24a','#8a6a1a'],texte:'TRÉSOR',taille:9,coulTexte:'rgba(60,40,10,.45)'}:{grad:['#c9a24a','#f8e4a8','#b8902a'],motif:maillesMotif}}));}
  if(k===3){const gains=[10,20,50,150,500],gagne=Math.random()<.35;const jour=melange([...Array(30)].map((_,i)=>i+1)).slice(0,3);
    const nb=gagne?(Math.random()<.8?1:2):0,sir=gagne&&Math.random()<.25;let total=0;const conts=[];const autres=[...Array(30)].map((_,i)=>i+1).filter(x=>!jour.includes(x));
    for(let i=0;i<8;i++){if(i<nb){const m=al(gains.slice(0,3));conts.push({num:al(jour),m,gagne:true});total+=m;}else conts.push({num:al(autres),m:al(gains),gagne:false});}
    if(sir){conts[7]={sirene:true,gagne:true};total*=2;}melange(conts);GAIN=total;
    const coul=['#d8402a','#2a6ab0','#e8b830','#3a9a5a','#e87a2a','#8a5ad8','#c83a6a','#2aa0a0'];
    P.innerHTML='<div class="tk t3"><div class="hd"><small>BAR DES DOCKS · 10 €</small><b>LE GROS CARGO</b></div><div class="regle">Chaque conteneur qui porte un numéro du jour te fait gagner son montant. La sirène double tout !</div>'+
      '<div class="z jour" data-z="j"><div class="dessous"><small>NUMÉROS DU JOUR</small>'+jour.map(x=>'<span>'+x+'</span>').join('')+'</div></div>'+
      '<div class="conts">'+conts.map((c,i)=>'<div class="z cont" data-z="'+i+'"><div class="dessous">'+(c.sirene?sirene+'<small>× 2</small>':'<b>'+c.num+'</b><small>'+c.m+' €</small>')+'</div></div>').join('')+'</div><div class="pd"><span>N° '+n+'</span><span>JUSQU’À 500 €</span></div></div>';
    ZONES=[...P.querySelectorAll('.z')].map(el=>{const i=el.dataset.z;const c=i==='j'?null:conts[+i];return {el,gagne:i==='j'?gagne:c.gagne,style:i==='j'?{grad:['#9aa4b4','#eef1f6','#a8b0bc'],texte:'NUMÉROS DU JOUR',taille:9}:{grad:[coul[+i],clair(coul[+i]),coul[+i]],motif:nervures()}};});}
  RESTE=ZONES.length;requestAnimationFrame(()=>ZONES.forEach(Z=>pellicule(Z.el,Z.style,fin)));}
let K=1;document.querySelectorAll('#sel button').forEach(b=>b.onclick=()=>{K=+b.dataset.k;document.querySelectorAll('#sel button').forEach(x=>x.classList.remove('on'));b.classList.add('on');monter(K);});
$('ok').onclick=()=>monter(K);monter(1);
</script></body></html>
