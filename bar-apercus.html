<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bar des Docks · aperçus</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}html,body{height:100%;overflow:hidden;background:#111}body{font-family:'Helvetica Neue',Arial,sans-serif}
#sel{position:fixed;opacity:.92;left:0;right:0;top:0;z-index:50;padding:calc(env(safe-area-inset-top,0px) + 6px) 8px 6px;background:rgba(0,0,0,.8);display:flex;flex-direction:column;gap:5px}
#sel div{display:flex;gap:5px;justify-content:center;align-items:center;font:600 10px Arial;letter-spacing:1px;color:#aaa}#sel button{border:0;border-radius:12px;padding:5px 10px;font:600 11px Arial;background:#333;color:#ddd}#sel button.on{background:#c9a24a;color:#111}
.m{position:fixed;inset:0;padding:calc(env(safe-area-inset-top,0px) + 70px) 16px 18px;display:none;flex-direction:column;overflow-y:auto}.m.on{display:flex}
/* ——— MENU 1 · LA VITRINE DU BURALISTE : bois sombre, laiton, vitrine éclairée ——— */
#m1{background:#1d130c;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.02) 0 2px,transparent 2px 9px);color:#f2e6cc}
#m1 .enseigne{display:flex;align-items:center;gap:12px;margin-bottom:14px}#m1 .los{width:22px;height:34px;background:#c8281e;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);box-shadow:0 0 14px rgba(255,60,40,.7);flex:none}
#m1 h1{font:400 26px Georgia,serif;letter-spacing:.5px}#m1 .sub{font:600 9px Arial;letter-spacing:4px;color:#c9a24a}
#m1 .vitrine{border-radius:10px;padding:14px 12px 4px;background:linear-gradient(180deg,rgba(255,236,190,.14),rgba(255,236,190,.03));border:2px solid #7a5a2a;box-shadow:inset 0 0 0 1px rgba(255,220,150,.2),0 10px 24px rgba(0,0,0,.5)}
#m1 .tk{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid rgba(201,162,74,.25);cursor:pointer}#m1 .tk:last-child{border-bottom:0}
#m1 .tk .mini{flex:none;width:54px;height:72px;border-radius:5px;box-shadow:0 4px 10px rgba(0,0,0,.5);transform:rotate(-4deg)}
#m1 .tk b{display:block;font:400 18px Georgia,serif}#m1 .tk small{font:11px Arial;color:#b8a888;letter-spacing:.5px}#m1 .tk em{margin-left:auto;font:400 20px Georgia,serif;font-style:normal;color:#e8c46a}
#m1 .laiton{height:8px;border-radius:4px;background:linear-gradient(#e8c870,#9a7a30);margin:0 -4px}
#m1 .pied{margin-top:14px;font:italic 12px Georgia,serif;color:#9a8a6a;text-align:center}
/* ——— MENU 2 · LE MIROIR DU ZINC : miroir aux lettres dorées, carreaux de ciment, comptoir en zinc ——— */
#m2{background:#e8e2d4;background-image:conic-gradient(from 45deg at 50% 50%,#2a3a4a 0 25%,#e8e2d4 0 50%,#2a3a4a 0 75%,#e8e2d4 0);background-size:26px 26px;color:#f4ecd8}
#m2 .miroir{border-radius:12px;padding:18px 16px 14px;background:linear-gradient(135deg,#1c2226,#2a3238 60%,#1c2226);border:6px solid #b8923a;box-shadow:inset 0 0 0 2px #e8c870,0 12px 26px rgba(0,0,0,.4)}
#m2 h1{text-align:center;font:italic 400 30px Georgia,serif;color:#e8c46a;text-shadow:0 1px 0 #8a6a20}#m2 .sub{text-align:center;font:600 9px Arial;letter-spacing:5px;color:#c9a24a;margin:4px 0 14px}
#m2 .ligne{display:flex;align-items:baseline;gap:8px;padding:10px 2px;cursor:pointer}#m2 .ligne b{font:400 19px Georgia,serif;color:#f4ecd8;white-space:nowrap}#m2 .ligne .pts{flex:1;border-bottom:2px dotted rgba(232,196,106,.5);transform:translateY(-4px)}#m2 .ligne em{font:400 19px Georgia,serif;font-style:normal;color:#e8c46a}
#m2 .ligne small{display:block;font:italic 11px Georgia,serif;color:#9aa4ac;margin-top:-6px;padding-left:2px}
#m2 .zinc{margin-top:14px;height:30px;border-radius:6px;background:linear-gradient(#e0e4e8,#9aa0a6 60%,#70767c);box-shadow:0 6px 12px rgba(0,0,0,.35)}
/* ——— MENU 3 · L'ENSEIGNE ROUGE : bleu nuit, losange rouge, typographie nette ——— */
#m3{background:#101a2c;color:#fff}
#m3 .hd{display:flex;align-items:center;gap:14px;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:8px}
#m3 .los{width:30px;height:46px;background:#e3261d;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);flex:none;display:flex;align-items:center;justify-content:center;font:900 6px Arial;color:#fff}
#m3 h1{font:700 22px 'Helvetica Neue',Arial;letter-spacing:.5px}#m3 .sub{font:500 11px Arial;color:#8a96b0}
#m3 .tk{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid rgba(255,255,255,.08);cursor:pointer}
#m3 .tk .dot{flex:none;width:44px;height:44px;border-radius:12px}#m3 .tk b{display:block;font:600 16px Arial}#m3 .tk small{font:12px Arial;color:#8a96b0}
#m3 .tk em{margin-left:auto;font:700 15px Arial;font-style:normal;background:#fff;color:#101a2c;padding:7px 12px;border-radius:18px}
#m3 .pied{margin-top:auto;padding-top:16px;font:12px Arial;color:#6a7690;text-align:center}
/* ——— LE TICKET À GRATTER ——— */
#gt{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;background:rgba(8,6,4,.9)}#gt.on{display:flex}
#tk{width:min(90vw,340px);aspect-ratio:3/4.3;border-radius:14px;overflow:hidden;position:relative;box-shadow:0 20px 50px rgba(0,0,0,.6);display:flex;flex-direction:column}
#tk .zone{position:relative;border-radius:8px;overflow:hidden}
#tk .cases{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr)}
#tk .cases div{display:flex;align-items:center;justify-content:center;font:600 22px Georgia,serif}
#tk canvas.pel{position:absolute;inset:0;width:100%;height:100%;touch-action:none;transition:opacity .5s}#tk canvas.pel.parti{opacity:0}#tk canvas.pou{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#gt .res{font:400 22px Georgia,serif;color:#fff;min-height:30px}#gt .res span{color:#e8c46a}
#gt .ok{border:0;border-radius:22px;padding:12px 28px;font:600 14px Arial;background:#e8c46a;color:#111;visibility:hidden}
/* ticket A · Art déco : bleu nuit, rayons d'or */
#tk.A{background:#0f1c33;color:#e8c46a}#tk.A .fond{position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 16%,rgba(232,196,106,.14) 0 6deg,transparent 6deg 12deg)}
#tk.A .t{position:relative;text-align:center;padding:18px 14px 6px}#tk.A .t small{font:600 9px Arial;letter-spacing:5px}#tk.A .t b{display:block;font:400 26px Georgia,serif;letter-spacing:2px;margin:6px 0}
#tk.A .t i{display:block;height:1px;background:linear-gradient(90deg,transparent,#e8c46a,transparent);margin:6px 30px}#tk.A .zone{margin:10px 16px;flex:1;background:#fbf4e2;border:2px solid #e8c46a}#tk.A .cases div{color:#0f1c33;border:1px solid rgba(15,28,51,.12)}#tk.A .cases div.g{background:#e8c46a}
#tk.A .p{position:relative;display:flex;justify-content:space-between;padding:6px 16px 14px;font:10px Arial;letter-spacing:2px}
/* ticket B · L'affiche ancienne : papier crème, filets rouges et bleus, silhouette du port */
#tk.B{background:#f4ead4;color:#1f2f5a;border:1px solid #c8b890}#tk.B .cadre{position:absolute;inset:8px;border:2px solid #b8321e;border-radius:8px;pointer-events:none}#tk.B .cadre:after{content:'';position:absolute;inset:4px;border:1px solid #1f2f5a;border-radius:5px}
#tk.B .t{text-align:center;padding:22px 14px 4px}#tk.B .t small{font:700 9px Arial;letter-spacing:4px;color:#b8321e}#tk.B .t b{display:block;font:italic 700 26px Georgia,serif;margin:4px 0 2px}
#tk.B svg{display:block;width:70%;margin:0 auto}#tk.B .zone{margin:8px 20px;flex:1;background:#fffaf0;border:1px solid #1f2f5a}#tk.B .cases div{color:#1f2f5a;border:1px dashed rgba(31,47,90,.2)}#tk.B .cases div.g{color:#b8321e;background:#fbe8c8}
#tk.B .p{display:flex;justify-content:space-between;padding:4px 22px 18px;font:italic 11px Georgia,serif}
/* ticket C · Nacre : un dégradé irisé, doux et moderne */
#tk.C{background:linear-gradient(135deg,#f6d3e6,#d5e3fb 40%,#d8f5ea 70%,#fbf0cf);color:#2a2a3a}
#tk.C .t{padding:20px 18px 6px}#tk.C .t small{font:600 10px Arial;letter-spacing:3px;opacity:.6}#tk.C .t b{display:block;font:300 30px 'Helvetica Neue',Arial;letter-spacing:-.5px;margin-top:4px}
#tk.C .zone{margin:12px 18px;flex:1;background:rgba(255,255,255,.85);border-radius:14px}#tk.C .cases div{font:300 24px 'Helvetica Neue',Arial;color:#2a2a3a}#tk.C .cases div.g{font-weight:700;background:rgba(255,255,255,.95);color:#c8408a}
#tk.C .p{display:flex;justify-content:space-between;padding:6px 18px 16px;font:500 10px Arial;letter-spacing:2px;opacity:.6}

.scene{padding:0!important;background:#1a100a}.scene canvas.dessin{position:absolute;left:0;top:0;width:100%;height:100%;image-rendering:pixelated}
.scene .calque{position:absolute;inset:0}.scene .fente{position:absolute;border-radius:3px;cursor:pointer;box-shadow:0 0 0 1px rgba(255,255,255,.35),0 3px 8px rgba(0,0,0,.4);background:linear-gradient(135deg,#f6d3e6,#d5e3fb 40%,#d8f5ea 70%,#fbf0cf)}
.scene .fente i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);font:600 11px Georgia;color:#3a3a4a;letter-spacing:1px;font-style:normal}
.scene .fente span{position:absolute;left:50%;bottom:-18px;transform:translateX(-50%);white-space:nowrap;font:700 10px Arial;color:#fff;background:rgba(0,0,0,.6);padding:2px 6px;border-radius:8px}
.scene .fente:active{transform:translateY(2px)}
.scene .bande{position:absolute;left:0;right:0;bottom:0;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 16px);background:linear-gradient(transparent,rgba(10,6,4,.9) 40%);color:#f4ecd8;text-align:center}
.scene .bande b{display:block;font:400 24px Georgia,serif}.scene .bande span{font:italic 13px Georgia,serif;color:#d8c8a8}
</style></head><body>
<div id="sel"><div>MENU <button data-m="4" class="on">1 · Derrière le comptoir</button><button data-m="5">2 · Le coin jeux</button></div></div>
<div class="m on scene" id="m4"><canvas class="dessin" data-s="comptoir"></canvas><div class="calque" id="l4"></div><div class="bande"><b>Bar des Docks</b><span>Touche un ticket dans le distributeur</span></div></div>
<div class="m scene" id="m5"><canvas class="dessin" data-s="coin"></canvas><div class="calque" id="l5"></div><div class="bande"><b>Le coin jeux</b><span>Touche un ticket au mur</span></div></div>
<div id="gt"><div id="tk"></div><div class="res" id="res"></div><button class="ok" id="ok">Continuer</button></div>
<script>
const T=[{id:'poisson',nom:'Le Petit Poisson',px:1,max:100,c:'#3a8ab0',gains:[1,2,5,20,100]},{id:'filet',nom:'Le Filet d’Or',px:3,max:300,c:'#c9a24a',gains:[3,6,15,50,300]},{id:'cargo',nom:'Le Gros Cargo',px:10,max:500,c:'#b8321e',gains:[10,20,50,150,500]}];
let MENU='4',KT='C';
const MINI={A:'background:#0f1c33;background-image:repeating-conic-gradient(from 0deg at 50% 20%,rgba(232,196,106,.35) 0 8deg,transparent 8deg 16deg)',B:'background:#f4ead4;border:2px solid #b8321e',C:'background:linear-gradient(135deg,#f6d3e6,#d5e3fb 50%,#d8f5ea)'};
function lister(){
  document.getElementById('l1').innerHTML=T.map(t=>'<div class="tk" data-t="'+t.id+'"><span class="mini" style="'+MINI[KT]+'"></span><div><b>'+t.nom+'</b><small>jusqu’à '+t.max+' €</small></div><em>'+t.px+' €</em></div>').join('');
  document.getElementById('l2').innerHTML=T.map(t=>'<div class="ligne" data-t="'+t.id+'"><b>'+t.nom+'</b><span class="pts"></span><em>'+t.px+' €</em></div><small style="display:block;font:italic 11px Georgia;color:#9aa4ac;margin:-6px 0 4px 2px">jusqu’à '+t.max+' €</small>').join('');
  document.getElementById('l3').innerHTML=T.map(t=>'<div class="tk" data-t="'+t.id+'"><span class="dot" style="'+MINI[KT]+'"></span><div><b>'+t.nom+'</b><small>Jusqu’à '+t.max+' €</small></div><em>'+t.px+' €</em></div>').join('');
  document.querySelectorAll('[data-t]').forEach(el=>el.onclick=()=>ouvrir(T.find(x=>x.id===el.dataset.t)));}
function tirage(t){const gagne=Math.random()<.35,g=gagne?t.gains[Math.random()<.7?0:(Math.random()<.7?1:2)]:0,L=gagne?[g,g,g]:[],a=t.gains.filter(x=>x!==g);
  while(L.length<6){const c=a[Math.floor(Math.random()*a.length)];if(L.filter(x=>x===c).length<2)L.push(c);}for(let i=5;i>0;i--){const j=Math.floor(Math.random()*(i+1));[L[i],L[j]]=[L[j],L[i]];}return {grille:L,gain:g};}
const PORT='<svg viewBox="0 0 120 30"><path d="M0 26 L120 26" stroke="#1f2f5a" stroke-width="1"/><path d="M8 26 L8 14 L14 10 L20 14 L20 26 M24 26 L24 8 L28 4 L32 8 L32 26 M60 26 L60 6 L62 2 L64 6 L64 26 M58 12 L66 12 M90 26 L94 16 L104 16 L108 26" fill="none" stroke="#1f2f5a" stroke-width="1.2"/><path d="M40 24 L52 24 L50 27 L42 27 Z M46 24 L46 12 L52 22" fill="none" stroke="#b8321e" stroke-width="1.2"/><path d="M70 28 q5 -2 10 0 t10 0 t10 0" stroke="#b8321e" fill="none" stroke-width=".8"/></svg>';
function ouvrir(t){const d=tirage(t),tk=document.getElementById('tk'),n=String(Math.floor(Math.random()*1e6)).padStart(6,'0');tk.className=KT;
  const cases='<div class="zone" id="zone"><div class="cases">'+d.grille.map(m=>'<div data-m="'+m+'">'+m+'&thinsp;€</div>').join('')+'</div><canvas class="pel"></canvas><canvas class="pou"></canvas></div>';
  if(KT==='A')tk.innerHTML='<div class="fond"></div><div class="t"><small>BAR DES DOCKS</small><b>'+t.nom.toUpperCase()+'</b><i></i><small>GAGNEZ JUSQU’À '+t.max+' €</small></div>'+cases+'<div class="p"><span>N° '+n+'</span><span>'+t.px+' €</span></div>';
  if(KT==='B')tk.innerHTML='<div class="cadre"></div><div class="t"><small>BAR DES DOCKS · MARSEILLE</small><b>'+t.nom+'</b></div>'+PORT+cases+'<div class="p"><span>Jusqu’à '+t.max+' €</span><span>N° '+n+'</span></div>';
  if(KT==='C')tk.innerHTML='<div class="t"><small>BAR DES DOCKS</small><b>'+t.nom+'</b></div>'+cases+'<div class="p"><span>JUSQU’À '+t.max+' €</span><span>'+t.px+' € · N° '+n+'</span></div>';
  document.getElementById('gt').classList.add('on');document.getElementById('res').innerHTML='';document.getElementById('ok').style.visibility='hidden';
  const z=document.getElementById('zone'),cv=z.querySelector('.pel'),pc=z.querySelector('.pou');
  requestAnimationFrame(()=>{const rr=z.getBoundingClientRect(),D=Math.min(3,devicePixelRatio||1);cv.width=Math.round(rr.width*D);cv.height=Math.round(rr.height*D);pc.width=Math.round(rr.width);pc.height=Math.round(rr.height);
    const W=cv.width,H=cv.height,g=cv.getContext('2d');
    const gr=g.createLinearGradient(0,0,W,H);
    if(KT==='A'){gr.addColorStop(0,'#8a6a2a');gr.addColorStop(.45,'#f0d890');gr.addColorStop(.55,'#c9a24a');gr.addColorStop(1,'#7a5a20');}
    else if(KT==='B'){gr.addColorStop(0,'#9aa0a8');gr.addColorStop(.5,'#e4e6e8');gr.addColorStop(1,'#a0a6ae');}
    else{gr.addColorStop(0,'#e8c8f0');gr.addColorStop(.3,'#c8e0ff');gr.addColorStop(.6,'#c8f4e4');gr.addColorStop(1,'#f8e8c0');}
    g.fillStyle=gr;g.fillRect(0,0,W,H);
    if(KT==='A'){g.strokeStyle='rgba(255,246,216,.35)';g.lineWidth=D;for(let k=-H;k<W;k+=10*D){g.beginPath();g.moveTo(k,0);g.lineTo(k+H,H);g.stroke();}}
    if(KT==='C'){for(let k=0;k<40;k++){g.fillStyle='rgba(255,255,255,'+(.12+Math.random()*.2)+')';g.beginPath();g.arc(Math.random()*W,Math.random()*H,(4+Math.random()*16)*D,0,7);g.fill();}}
    for(let k=0;k<W*H/90;k++){g.fillStyle=Math.random()<.5?'rgba(255,255,255,.18)':'rgba(0,0,0,.05)';g.fillRect(Math.random()*W,Math.random()*H,D,D);}
    g.fillStyle=KT==='A'?'rgba(70,50,15,.4)':(KT==='B'?'rgba(31,47,90,.35)':'rgba(90,70,110,.35)');g.font=(KT==='B'?'italic 400 ':'300 ')+Math.round(12*D)+'px Georgia';g.textAlign='center';g.textBaseline='middle';g.fillText(KT==='C'?'grattez ici':'Grattez ici',W/2,H/2);
    g.globalCompositeOperation='destination-out';g.lineCap='round';g.lineJoin='round';
    const MW=60,MH=40,m=document.createElement('canvas');m.width=MW;m.height=MH;const mg=m.getContext('2d');mg.fillStyle='#000';mg.fillRect(0,0,MW,MH);mg.strokeStyle='#fff';mg.lineCap='round';
    const R=15*D;let fini=false,der=null,file=[],pou=[],raf=0,mes=0,tp=performance.now();const pg=pc.getContext('2d');
    const devoiler=()=>{if(fini)return;fini=true;cv.classList.add('parti');const cs=[...z.querySelectorAll('.cases div')];
      if(d.gain){cs.filter(c=>+c.dataset.m===d.gain).forEach(c=>c.classList.add('g'));document.getElementById('res').innerHTML='Gagné · <span>'+d.gain+' €</span>';if(navigator.vibrate)navigator.vibrate([25,40,25]);}
      else document.getElementById('res').innerHTML='Pas cette fois';document.getElementById('ok').style.visibility='visible';};
    const mesurer=()=>{const px=mg.getImageData(0,0,MW,MH).data;let v=0;for(let i=0;i<px.length;i+=4)if(px[i]>128)v++;if(v/(MW*MH)>=.7)devoiler();};
    const trait=(a,b)=>{for(let q=0;q<3;q++){g.lineWidth=R*2*(.84+q*.08);g.beginPath();g.moveTo(a.x+(q-1)*D,a.y+(q-1)*D*.6);g.lineTo(b.x+(q-1)*D*.6,b.y-(q-1)*D);g.stroke();}
      mg.lineWidth=R*2*MW/W;mg.beginPath();mg.moveTo(a.x*MW/W,a.y*MH/H);mg.lineTo(b.x*MW/W,b.y*MH/H);mg.stroke();if(Math.random()<.45)pou.push({x:b.x/D,y:b.y/D,vx:(Math.random()-.5)*50,vy:-15-Math.random()*30,t:0});};
    const coul=KT==='A'?'232,196,106':(KT==='B'?'190,195,202':'210,190,230');
    const boucle=(ts)=>{raf=0;for(const p of file){trait(der||p,der?p:{x:p.x+.1,y:p.y+.1});der=p;}file=[];if(!fini&&ts-mes>120){mes=ts;mesurer();}
      const nw=performance.now(),dt=Math.min(.05,(nw-tp)/1000);tp=nw;pg.clearRect(0,0,pc.width,pc.height);pou=pou.filter(p=>(p.t+=dt)<.6);
      for(const p of pou){p.vy+=240*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;pg.fillStyle='rgba('+coul+','+(1-p.t/.6).toFixed(2)+')';pg.fillRect(p.x,p.y,1.5,1.5);}if(pou.length)raf=requestAnimationFrame(boucle);};
    const pt=(ev)=>{const r=cv.getBoundingClientRect();return {x:(ev.clientX-r.left)*D,y:(ev.clientY-r.top)*D};};
    const prendre=(ev)=>{const L=ev.getCoalescedEvents?ev.getCoalescedEvents():[];for(const x of (L.length?L:[ev]))file.push(pt(x));if(!raf)raf=requestAnimationFrame(boucle);};
    cv.onpointerdown=(ev)=>{ev.preventDefault();cv.setPointerCapture(ev.pointerId);der=null;prendre(ev);};cv.onpointermove=(ev)=>{if(cv.hasPointerCapture(ev.pointerId))prendre(ev);};
    cv.onpointerup=cv.onpointercancel=()=>{der=null;requestAnimationFrame(mesurer);};});}

function scene(cv,sorte){const r=cv.getBoundingClientRect(),E=3,W=Math.ceil(r.width/E),H=Math.ceil(r.height/E);cv.width=W*2;cv.height=H*2;const g=cv.getContext('2d');g.setTransform(2,0,0,2,0,0);g.imageSmoothingEnabled=false;
  const R=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.round(x*2)/2,Math.round(y*2)/2,Math.max(.5,w),Math.max(.5,h));};const al=(n)=>{const v=Math.sin(n*12.9898)*43758.5453;return v-Math.floor(v);};
  /* le mur : boiserie sombre en bas, papier peint vert bouteille à filets en haut */
