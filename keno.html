<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Keno — Battle Dock Casino</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{height:100%;height:100dvh;overflow:hidden;font-family:'Inter',sans-serif}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,44px)+10px) 16px 10px;flex-shrink:0}
.btn-back{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:7px 14px;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;color:#fff;cursor:pointer}
.hdr-title{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#fbbf24;letter-spacing:3px}
.hdr-bal{background:rgba(0,0,0,.3);border:1px solid rgba(251,191,36,.3);border-radius:20px;padding:7px 14px;font-family:'Bebas Neue',sans-serif;font-size:15px;color:#fbbf24}
    body{background:radial-gradient(ellipse at top,#7f1d1d,#450a0a 60%,#1a0000);display:flex;flex-direction:column}
    .table { background:linear-gradient(135deg,#1e293b,#0f172a);border:4px solid #fbbf24;border-radius:14px;padding:12px;box-shadow:0 8px 32px rgba(0,0,0,0.6);width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:10px;flex-shrink:0; }
    .zone-label { font-size:9px;font-weight:700;color:rgba(255,255,255,0.35);letter-spacing:3px; }
    .drawn-row { display:flex;gap:5px;flex-wrap:wrap;justify-content:center;min-height:36px;align-items:center; }
    .drawn-ball {
      width:32px;height:32px;border-radius:50%;
      background:linear-gradient(135deg,#fbbf24,#b45309);
      border:2px solid #0f172a;
      display:flex;align-items:center;justify-content:center;
      font-family:'Bebas Neue',sans-serif;font-size:13px;color:#0f172a;
      box-shadow:0 3px 8px rgba(0,0,0,0.4);
      animation:ballPop .25s cubic-bezier(0.34,1.56,0.64,1);
    }
    .hit { background:linear-gradient(135deg,#4ade80,#15803d);color:white;border-color:rgba(255,255,255,0.3); }
    .keno-grid { display:grid;grid-template-columns:repeat(8,1fr);gap:4px;width:100%; }
    .knum {
      aspect-ratio:1;border-radius:6px;
      background:rgba(255,255,255,0.06);
      border:1.5px solid rgba(255,255,255,0.1);
      display:flex;align-items:center;justify-content:center;
      font-family:'Bebas Neue',sans-serif;font-size:clamp(10px,2.8vw,13px);
      color:rgba(255,255,255,0.4);cursor:pointer;transition:all .12s;
    }
    .knum:active { transform:scale(0.88); }
    .sel  { background:#fbbf24;border-color:#0f172a;color:#0f172a; }
    .hit  { background:linear-gradient(135deg,#4ade80,#15803d);border-color:rgba(255,255,255,0.3);color:white; }
    .miss { opacity:0.25; }
    .pick-info { font-size:9px;font-weight:700;color:rgba(255,255,255,0.3);letter-spacing:2px; }
    .win  { background:linear-gradient(135deg,#10b981,#059669);color:white;box-shadow:0 4px 14px rgba(16,185,129,0.4); }
    .lose { background:linear-gradient(135deg,#dc2626,#991b1b);color:white; }
    .controls { display:flex;flex-direction:column;gap:6px;width:100%;max-width:340px;flex-shrink:0; }
    .sel { background:#fbbf24;color:#0f172a; }
    
    .chips{display:flex;gap:6px;width:100%;max-width:420px}
    .chip{flex:1;padding:10px 4px;border-radius:20px;text-align:center;cursor:pointer;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;border:1.5px solid rgba(255,255,255,.1);color:rgba(255,255,255,.4);background:rgba(255,255,255,.06);transition:all .15s}
    .chip.sel{background:rgba(251,191,36,.2);border-color:#fbbf24;color:#fbbf24}
    .chip:active{transform:scale(.96)}
    .spin-btn{width:100%;max-width:420px;padding:16px;border:none;border-radius:16px;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a0000;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px;cursor:pointer;box-shadow:0 6px 24px rgba(251,191,36,.35);transition:all .15s;font-weight:900}
    .spin-btn:active{transform:scale(.98);opacity:.9}
    .spin-btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
    .result{display:none;padding:13px 16px;border-radius:16px;text-align:center;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;width:100%;max-width:420px;animation:pop .3s cubic-bezier(.34,1.56,.64,1)}
    @keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
    .result.win{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;box-shadow:0 4px 16px rgba(22,163,74,.4)}
    .result.lose{background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.6)}
    .result.jackpot,.result.win-big{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a0000;box-shadow:0 4px 16px rgba(251,191,36,.5)}
    .game{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 16px;gap:14px;min-height:0}
</style>
</head>
<body>

<div class="hdr">
  <button class="btn-back" onclick="location.href='casino.html'">← CASINO</button>
  <div class="hdr-title">🎱 Keno</div>
  <div class="hdr-bal" id="balance">0€</div>
</div>

<div class="game">
<div class="table">
      <div class="zone-label">TIRAGE — 10 BOULES</div>
      <div class="drawn-row" id="drawnRow"></div>
      <div class="zone-label">CHOISIS 1 À 10 NUMÉROS</div>
      <div class="keno-grid" id="kenoGrid"></div>
      <div class="pick-info" id="pickInfo">0 / 10 sélectionnés</div>
<div class="result" id="result"></div>
<div class="result" id="result"></div>
      <div class="chips">
        <div class="chip sel" id="c500"  onclick="setBet(500,'c500')">500€</div>
        <div class="chip"    id="c1000" onclick="setBet(1000,'c1000')">1K</div>
        <div class="chip"    id="c2000" onclick="setBet(2000,'c2000')">2K</div>
        <div class="chip"    id="c5000" onclick="setBet(5000,'c5000')">5K</div>
      </div>
      <button class="spin-btn" id="btnPlay" onclick="play()" disabled>CHOISIR DES NUMÉROS</button>
</div>

<script>

  var sb = supabase.createClient('https://drtsuhnbclhmgfjiykap.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg');
  var fmt=function(n){return Math.floor(n).toLocaleString('fr-FR');};
  var el=function(id){return document.getElementById(id);};

  var money=parseInt(localStorage.getItem("bd_money")||"0"),bet=500,currentUser=null,busy=false;
  var selected=new Set();
  var MAX_PICK=10, TOTAL=40, DRAW=10;

  // Paliers gains : [picks_choisis][hits] = multiplicateur
  // RTP ~70% sur chaque configuration
  function showToast(msg){var t=document.getElementById("ktoast");if(!t){t=document.createElement("div");t.id="ktoast";t.style.cssText="position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#0f172a;color:white;padding:8px 16px;border-radius:20px;font-size:12px;font-weight:700;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none";document.body.appendChild(t);}t.textContent=msg;t.style.opacity=1;clearTimeout(t._t);t._t=setTimeout(()=>t.style.opacity=0,2000);}
  var PAYOUTS = {
    1:  {1: 3.5},
    2:  {2: 15},
    3:  {2: 3.6, 3: 32},
    4:  {2: 2.2, 3: 7.2, 4: 58},
    5:  {3: 7, 4: 28, 5: 184},
    6:  {3: 3.6, 4: 12.6, 5: 54, 6: 359},
    7:  {3: 2.4, 4: 6.3, 5: 23.6, 6: 94, 7: 787},
    8:  {4: 7, 5: 19, 6: 71, 7: 353, 8: 2352},
    9:  {4: 4.3, 5: 11, 6: 33, 7: 130, 8: 868, 9: 4341},
    10: {5: 14, 6: 34, 7: 103, 8: 410, 9: 2050, 10: 17082}
  };

  function setBet(val,id){
    bet=val;
    ['c500','c1000','c2000','c5000'].forEach(function(i){el(i).classList.toggle('sel',i===id);});
    updateBtn();
  }

  function updateBtn(){
    var n=selected.size;
    el('pickInfo').textContent=n+' / '+MAX_PICK+' sélectionné'+(n>1?'s':'');
    if(n>0){
      el('btnPlay').disabled=false;
      el('btnPlay').textContent='LANCER — '+n+' NUM. — '+fmt(bet)+'€';
    } else {
      el('btnPlay').disabled=true;
      el('btnPlay').textContent='CHOISIR DES NUMÉROS';
    }
  }

  function updateBal(){el('balance').textContent=fmt(money)+'€';}

  function buildGrid(){
    var g=el('kenoGrid'); g.innerHTML='';
    for(var i=1;i<=TOTAL;i++){
      (function(n){
        var d=document.createElement('div');
        d.className='knum'; d.id='kn'+n; d.textContent=n;
        d.onclick=function(){toggleNum(n);};
        g.appendChild(d);
      })(i);
    }
  }

  function toggleNum(n){
    if(busy)return;
    if(selected.has(n)){
      selected.delete(n);
      el('kn'+n).className='knum';
    } else {
      if(selected.size>=MAX_PICK) return;
      selected.add(n);
      el('kn'+n).className='knum sel';
    }
    updateBtn();
  }

  async function play(){
    if(busy||selected.size===0||money<bet||bet<=0)return;
  if(bet>25000){showToast('Mise max : 25 000€');return;}
    busy=true; money-=bet; updateBal();
    el('btnPlay').disabled=true; el('result').style.display='none';
    el('drawnRow').innerHTML='';

    // Reset grille
    selected.forEach(function(n){
      var k=el('kn'+n);
      if(k) k.className='knum sel';
    });

    // Tirer 10 numéros aléatoires parmi 1-40
    var pool=[];
    for(var i=1;i<=TOTAL;i++) pool.push(i);
    pool.sort(function(){return Math.random()-0.5;});
    var drawn=pool.slice(0,DRAW);

    // Animer les boules une par une
    var hits=0;
    for(var i=0;i<drawn.length;i++){
      await new Promise(function(r){setTimeout(r,220);});
      var n=drawn[i];
      var isHit=selected.has(n);
      if(isHit) hits++;
      // Boule
      var b=document.createElement('div');
      b.className='drawn-ball'+(isHit?' hit':'');
      b.textContent=n;
      el('drawnRow').appendChild(b);
      // Colorier la grille
      var k=el('kn'+n);
      if(k){
        if(isHit) k.className='knum hit';
        else k.classList.add('drawn');
      }
    }

    // Colorier les non-touchés sélectionnés
    selected.forEach(function(n){
      var k=el('kn'+n);
      if(k&&!drawn.includes(n)) k.className='knum miss';
    });

    await new Promise(function(r){setTimeout(r,300);});

    // Calculer gain
    var picked=selected.size;
    var table=PAYOUTS[picked]||{};
    var mult=table[hits]||0;
    var r=el('result');
    if(mult>0){
      var gain=Math.floor(bet*mult);
      money+=gain; updateBal();
      r.textContent=hits+' BONS SUR '+picked+' ! +'+fmt(gain)+'€ (x'+mult+')';
      r.className='result win';
    } else {
      r.textContent=hits+' bon'+(hits>1?'s':'')+' sur '+picked+' — pas de gain';
      r.className='result lose';
    }
    r.style.display='block';

    await saveMoney(money);

    setTimeout(function(){
      selected.clear();
      buildGrid();
      updateBtn();
      busy=false;
    },2200);
  }

  async function init(){
    var res=await sb.auth.getSession();
    var s=res.data&&res.data.session;
    if(!s||res.error){
      try{await sb.auth.signOut();}catch(e){}
      window.location.href='index.html';return;
    }
    currentUser=s.user;
    var d=await sb.from('game_stats').select('money').eq('user_id',currentUser.id).maybeSingle();
    money = (d.data&&d.data.money)||0; localStorage.setItem("bd_money", money); updateBal();
    buildGrid();
  }

  document.addEventListener('gesturestart',function(e){e.preventDefault();});

  async function saveMoney(amount) {
    const val = Math.floor(amount);
    localStorage.setItem('bd_money', val);
    if (!currentUser) return;
    for (let i = 0; i < 3; i++) {
      const { error } = await sb.from('game_stats').update({ money: val }).eq('user_id', currentUser.id);
      if (!error) return;
      await new Promise(r => setTimeout(r, 400));
    }
    console.warn('saveMoney: échec après 3 tentatives');
  }

  init().then(function(){
    setTimeout(function(){
      var b=document.getElementById('balance');
      if(b && (b.textContent==='0€'||b.textContent==='0€')){
        b.textContent=(money||0).toLocaleString('fr-FR')+'€';
      }
    },2000);
  });

document.addEventListener('gesturestart',function(e){e.preventDefault();},{passive:false});
document.addEventListener('gesturechange',function(e){e.preventDefault();},{passive:false});
document.addEventListener('touchmove',function(e){if(e.touches.length>1)e.preventDefault();},{passive:false});
document.addEventListener('dblclick',function(e){e.preventDefault();});
document.addEventListener('selectstart',function(e){e.preventDefault();});
document.addEventListener('contextmenu',function(e){e.preventDefault();});
</script>
</body>
</html>
