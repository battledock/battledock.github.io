<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Keno - Battle Dock Casino</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * { margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent; }
    body { font-family:'Inter',sans-serif;background:linear-gradient(180deg,#450a0a,#7f1d1d,#991b1b);min-height:100vh;overflow:hidden;display:flex;flex-direction:column; }
    .container { max-width:500px;margin:0 auto;padding:6px;padding-bottom:120px;flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden; }
    .game-area { flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;overflow:hidden;min-height:0; }
    .table { background:linear-gradient(135deg,#1e293b,#0f172a);border:4px solid #fbbf24;border-radius:14px;padding:12px;box-shadow:0 8px 32px rgba(0,0,0,0.6);width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:10px;flex-shrink:0; }

    .zone-label { font-size:9px;font-weight:700;color:rgba(255,255,255,0.35);letter-spacing:3px; }

    /* BOULES TIRÉES */
    .drawn-row { display:flex;gap:5px;flex-wrap:wrap;justify-content:center;min-height:36px;align-items:center; }
    .drawn-ball {
      width:32px;height:32px;border-radius:50%;
      background:linear-gradient(135deg,#fbbf24,#b45309);
      border:2px solid #0f172a;
      display:flex;align-items:center;justify-content:center;
      font-family:'Bebas Neue',sans-serif;font-size:13px;color:#0f172a;
      box-shadow:0 3px 8px rgba(0,0,0,0.4);
      animation:ballPop .25s cubic-bezier(0.34,1.56,0.64,1);
    }
    .drawn-ball.hit { background:linear-gradient(135deg,#4ade80,#15803d);color:white;border-color:rgba(255,255,255,0.3); }
    @keyframes ballPop { 0%{transform:scale(0);opacity:0} 100%{transform:scale(1);opacity:1} }

    /* GRILLE JOUEUR */
    .keno-grid { display:grid;grid-template-columns:repeat(8,1fr);gap:4px;width:100%; }
    .knum {
      aspect-ratio:1;border-radius:6px;
      background:rgba(255,255,255,0.06);
      border:1.5px solid rgba(255,255,255,0.1);
      display:flex;align-items:center;justify-content:center;
      font-family:'Bebas Neue',sans-serif;font-size:clamp(10px,2.8vw,13px);
      color:rgba(255,255,255,0.4);cursor:pointer;transition:all .12s;
    }
    .knum:active { transform:scale(0.88); }
    .knum.sel  { background:#fbbf24;border-color:#0f172a;color:#0f172a; }
    .knum.hit  { background:linear-gradient(135deg,#4ade80,#15803d);border-color:rgba(255,255,255,0.3);color:white; }
    .knum.miss { opacity:0.25; }
    .knum.drawn:not(.sel) { border-color:rgba(251,191,36,0.4); }

    .pick-info { font-size:9px;font-weight:700;color:rgba(255,255,255,0.3);letter-spacing:2px; }

    .result { display:none;padding:7px 12px;border-radius:10px;text-align:center;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:1px;width:100%; }
    .result.win  { background:linear-gradient(135deg,#10b981,#059669);color:white;box-shadow:0 4px 14px rgba(16,185,129,0.4); }
    .result.lose { background:linear-gradient(135deg,#dc2626,#991b1b);color:white; }

    .controls { display:flex;flex-direction:column;gap:6px;width:100%;max-width:340px;flex-shrink:0; }
    .chips { display:flex;gap:6px;background:rgba(255,255,255,0.05);padding:6px;border-radius:8px;border:2px solid rgba(251,191,36,0.3); }
    .chip { flex:1;padding:7px 4px;border-radius:6px;text-align:center;cursor:pointer;transition:all .15s;font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:1px; }
    .chip.sel { background:#fbbf24;color:#0f172a; }
    .chip:not(.sel) { background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.4);border:1px solid rgba(251,191,36,0.2); }
    .spin-btn { width:100%;padding:10px;background:linear-gradient(135deg,#fbbf24,#f59e0b);border:none;border-radius:10px;color:#0f172a;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:1.5px;cursor:pointer;box-shadow:0 6px 20px rgba(251,191,36,0.5);transition:all .2s; }
    .spin-btn:active { transform:scale(0.98); }
    .spin-btn:disabled { opacity:0.4;cursor:not-allowed;box-shadow:none; }
    .bottom-bar { background:linear-gradient(135deg,#7f1d1d,#991b1b);border:2px solid rgba(251,191,36,0.5);border-radius:10px;padding:6px 10px;display:flex;justify-content:space-between;align-items:center;min-height:44px;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);max-width:480px;width:calc(100% - 20px);z-index:100;box-shadow:0 -4px 20px rgba(0,0,0,0.5); }
    .back-btn { background:rgba(251,191,36,0.2);border:2px solid rgba(251,191,36,0.5);color:#fbbf24;border-radius:6px;padding:4px 10px;font-weight:700;font-size:11px;cursor:pointer;white-space:nowrap; }
    .game-title { font-family:'Bebas Neue',sans-serif;font-size:16px;color:#fbbf24;letter-spacing:1.5px; }
    .balance { background:white;color:#0f172a;padding:4px 10px;border-radius:6px;font-family:'Bebas Neue',sans-serif;font-size:14px;font-weight:700;white-space:nowrap; }
  </style>
</head>
<body>
<div class="container">
  <div class="game-area">
    <div class="table">
      <div class="zone-label">TIRAGE — 10 BOULES</div>
      <div class="drawn-row" id="drawnRow"></div>
      <div class="zone-label">CHOISIS 1 À 10 NUMÉROS</div>
      <div class="keno-grid" id="kenoGrid"></div>
      <div class="pick-info" id="pickInfo">0 / 10 sélectionnés</div>
    </div>
    <div class="controls">
      <div class="result" id="result"></div>
      <div class="chips">
        <div class="chip sel" id="c500"  onclick="setBet(500,'c500')">500€</div>
        <div class="chip"    id="c1000" onclick="setBet(1000,'c1000')">1K</div>
        <div class="chip"    id="c2000" onclick="setBet(2000,'c2000')">2K</div>
        <div class="chip"    id="c5000" onclick="setBet(5000,'c5000')">5K</div>
      </div>
      <button class="spin-btn" id="btnPlay" onclick="play()" disabled>CHOISIR DES NUMÉROS</button>
    </div>
  </div>
  <div class="bottom-bar">
    <button class="back-btn" onclick="window.location.href='casino.html'">&#8592; Casino</button>
    <div class="game-title">KENO</div>
    <div class="balance" id="balance">0&#8364;</div>
  </div>
</div>
<script>
  var sb = supabase.createClient('https://drtsuhnbclhmgfjiykap.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg');
  var fmt=function(n){return Math.floor(n).toLocaleString('fr-FR');};
  var el=function(id){return document.getElementById(id);};

  var money=0,bet=500,currentUser=null,busy=false;
  var selected=new Set();
  var MAX_PICK=10, TOTAL=40, DRAW=10;

  // Paliers gains : [picks_choisis][hits] = multiplicateur
  // RTP ~70% sur chaque configuration
  var PAYOUTS = {
    1:  {1: 2.5},
    2:  {2: 6},
    3:  {2: 2, 3: 18},
    4:  {2: 1.5, 3: 5, 4: 40},
    5:  {3: 3, 4: 12, 5: 80},
    6:  {3: 2, 4: 7, 5: 30, 6: 200},
    7:  {3: 1.5, 4: 4, 5: 15, 6: 60, 7: 500},
    8:  {4: 3, 5: 8, 6: 30, 7: 150, 8: 1000},
    9:  {4: 2, 5: 5, 6: 15, 7: 60, 8: 400, 9: 2000},
    10: {5: 4, 6: 10, 7: 30, 8: 120, 9: 600, 10: 5000}
  };

  function setBet(val,id){
    bet=val;
    ['c500','c1000','c2000','c5000'].forEach(function(i){el(i).classList.toggle('sel',i===id);});
    updateBtn();
  }

  function updateBtn(){
    var n=selected.size;
    el('pickInfo').textContent=n+' / '+MAX_PICK+' sélectionné'+(n>1?'s':'');
    if(n>0){
      el('btnPlay').disabled=false;
      el('btnPlay').textContent='LANCER — '+n+' NUM. — '+fmt(bet)+'€';
    } else {
      el('btnPlay').disabled=true;
      el('btnPlay').textContent='CHOISIR DES NUMÉROS';
    }
  }

  function updateBal(){el('balance').textContent=fmt(money)+'€';}

  function buildGrid(){
    var g=el('kenoGrid'); g.innerHTML='';
    for(var i=1;i<=TOTAL;i++){
      (function(n){
        var d=document.createElement('div');
        d.className='knum'; d.id='kn'+n; d.textContent=n;
        d.onclick=function(){toggleNum(n);};
        g.appendChild(d);
      })(i);
    }
  }

  function toggleNum(n){
    if(busy)return;
    if(selected.has(n)){
      selected.delete(n);
      el('kn'+n).className='knum';
    } else {
      if(selected.size>=MAX_PICK) return;
      selected.add(n);
      el('kn'+n).className='knum sel';
    }
    updateBtn();
  }

  async function play(){
    if(busy||selected.size===0||money<bet)return;
    busy=true; money-=bet; updateBal();
    el('btnPlay').disabled=true; el('result').style.display='none';
    el('drawnRow').innerHTML='';

    // Reset grille
    selected.forEach(function(n){
      var k=el('kn'+n);
      if(k) k.className='knum sel';
    });

    // Tirer 10 numéros aléatoires parmi 1-40
    var pool=[];
    for(var i=1;i<=TOTAL;i++) pool.push(i);
    pool.sort(function(){return Math.random()-0.5;});
    var drawn=pool.slice(0,DRAW);

    // Animer les boules une par une
    var hits=0;
    for(var i=0;i<drawn.length;i++){
      await new Promise(function(r){setTimeout(r,220);});
      var n=drawn[i];
      var isHit=selected.has(n);
      if(isHit) hits++;
      // Boule
      var b=document.createElement('div');
      b.className='drawn-ball'+(isHit?' hit':'');
      b.textContent=n;
      el('drawnRow').appendChild(b);
      // Colorier la grille
      var k=el('kn'+n);
      if(k){
        if(isHit) k.className='knum hit';
        else k.classList.add('drawn');
      }
    }

    // Colorier les non-touchés sélectionnés
    selected.forEach(function(n){
      var k=el('kn'+n);
      if(k&&!drawn.includes(n)) k.className='knum miss';
    });

    await new Promise(function(r){setTimeout(r,300);});

    // Calculer gain
    var picked=selected.size;
    var table=PAYOUTS[picked]||{};
    var mult=table[hits]||0;
    var r=el('result');
    if(mult>0){
      var gain=Math.floor(bet*mult);
      money+=gain; updateBal();
      r.textContent=hits+' BONS SUR '+picked+' ! +'+fmt(gain)+'€ (x'+mult+')';
      r.className='result win';
    } else {
      r.textContent=hits+' bon'+(hits>1?'s':'')+' sur '+picked+' — pas de gain';
      r.className='result lose';
    }
    r.style.display='block';

    if(currentUser) sb.from('game_stats').update({money:Math.floor(money)}).eq('user_id',currentUser.id);

    setTimeout(function(){
      selected.clear();
      buildGrid();
      updateBtn();
      busy=false;
    },2200);
  }

  async function init(){
    var res=await sb.auth.getSession();
    var s=res.data&&res.data.session;
    if(!s){await new Promise(function(r){setTimeout(r,1000);});res=await sb.auth.getSession();s=res.data&&res.data.session;if(!s){window.location.href='index.html';return;}}
    currentUser=s.user;
    var d=await sb.from('game_stats').select('money').eq('user_id',currentUser.id).maybeSingle();
    money=(d.data&&d.data.money)||0; updateBal();
    buildGrid();
  }

  document.addEventListener('gesturestart',function(e){e.preventDefault();});
  init();
</script>
</body>
</html>
