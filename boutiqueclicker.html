<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Boutique — Battle Dock</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
body{font-family:'Inter',sans-serif;background:#f5f5f7;color:#1a1a1a;height:100dvh;display:flex;flex-direction:column}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(env(safe-area-inset-bottom,20px)+80px)}
.header{padding:calc(env(safe-area-inset-top,0px)+14px) 16px 14px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between}
.header-left{display:flex;align-items:center;gap:10px}
.header-back{font-size:18px;color:#3b82f6;cursor:pointer;font-weight:700}
.header-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px}
.header-coins{padding:5px 12px;border-radius:20px;background:#ecfdf5;font-family:'Bebas Neue',sans-serif;font-size:13px;color:#16a34a}
.tabs{display:flex;margin:12px 16px 0;background:#fff;border-radius:12px;padding:3px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.tab{flex:1;padding:9px;text-align:center;font-size:11px;font-weight:800;color:#9ca3af;cursor:pointer;border-radius:10px;letter-spacing:.5px;transition:all .2s}
.tab.active{background:#1a1a1a;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.section-label{font-size:10px;font-weight:800;color:#9ca3af;letter-spacing:2px;margin-bottom:10px}
/* Pack cards */
.packs-section{padding:16px}
.pack-featured{background:#fff;border-radius:20px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.06);text-align:center;margin-bottom:12px;position:relative;overflow:hidden}
.pack-featured::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#f59e0b,#fbbf24,#f59e0b)}
.pack-featured-badge{display:inline-block;font-size:8px;font-weight:800;color:#f59e0b;background:#fffbeb;padding:3px 10px;border-radius:20px;margin-bottom:8px;letter-spacing:1px}
.pack-featured-emoji{font-size:44px}
.pack-featured-name{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;margin-top:4px}
.pack-featured-desc{font-size:10px;color:#6b7280;margin-top:4px}
.pack-featured-price{font-family:'Bebas Neue',sans-serif;font-size:18px;color:#f59e0b;margin-top:8px}
.pack-featured-btn{margin-top:10px;padding:12px 36px;border:none;border-radius:14px;background:#1a1a1a;color:#fff;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:2px;cursor:pointer}
.pack-featured-btn:disabled{opacity:.4}
.pack-featured-odds{display:flex;justify-content:center;gap:8px;margin-top:10px}
.odds-chip{padding:3px 8px;border-radius:12px;font-size:8px;font-weight:800}
.odds-chip.r{background:#eff6ff;color:#3b82f6}.odds-chip.e{background:#faf5ff;color:#a855f7}.odds-chip.l{background:#fffbeb;color:#f59e0b}.odds-chip.c{background:#f3f4f6;color:#9ca3af}
.packs-row{display:flex;gap:8px}
.pack-small{flex:1;background:#fff;border-radius:16px;padding:14px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.04);cursor:pointer;transition:all .15s}
.pack-small:active{transform:scale(.97)}
.pack-small-emoji{font-size:28px}
.pack-small-name{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;margin-top:4px;color:#374151}
.pack-small-price{font-size:11px;color:#9ca3af;font-weight:700;margin-top:2px}
/* Collection */
.coll-section{padding:16px;display:none}
.coll-tabs{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:12px;padding-bottom:2px}
.coll-tab{flex-shrink:0;padding:6px 14px;border-radius:20px;font-size:10px;font-weight:800;color:#9ca3af;cursor:pointer;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.04);letter-spacing:.5px;white-space:nowrap;transition:all .15s}
.coll-tab.active{background:#1a1a1a;color:#fff}
.coll-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.coll-card{background:#fff;border-radius:14px;padding:12px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.04);cursor:pointer;transition:all .15s;border:2px solid transparent;position:relative}
.coll-card:active{transform:scale(.97)}
.coll-card.equipped{border-color:#3b82f6;box-shadow:0 2px 8px rgba(59,130,246,.12)}
.coll-card.locked{opacity:.25;pointer-events:none}
.coll-card-badge{position:absolute;top:6px;right:6px;font-size:7px;font-weight:800;padding:2px 6px;border-radius:8px;letter-spacing:.5px}
.coll-card-badge.commun{background:#f3f4f6;color:#9ca3af}.coll-card-badge.rare{background:#eff6ff;color:#3b82f6}
.coll-card-badge.epique{background:#faf5ff;color:#a855f7}.coll-card-badge.legendaire{background:#fffbeb;color:#f59e0b}
.coll-card-preview{height:40px;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.coll-card-skin{width:52px;height:30px;border-radius:6px;border:1px solid #e5e7eb}
.coll-card-emoji{font-size:26px}
.coll-card-name{font-size:10px;font-weight:800;color:#374151}
.coll-card-status{font-size:8px;font-weight:700;margin-top:3px;color:#9ca3af;cursor:pointer}
.coll-card-status.eq{color:#3b82f6}
/* Opening overlay */
.open-ov{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column}
.open-pack{width:130px;height:170px;border-radius:18px;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;position:relative}
.open-pack-glow{position:absolute;inset:-25px;border-radius:30px;opacity:0;transition:opacity .4s}
.open-emoji{font-size:52px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.3))}
.open-label{font-family:'Bebas Neue',sans-serif;font-size:15px;color:#fff;letter-spacing:2px;margin-top:6px}
.open-hint{color:rgba(255,255,255,.25);font-size:11px;margin-top:16px;animation:hp 1.5s ease infinite}
@keyframes hp{0%,100%{opacity:.25}50%{opacity:.6}}
.shake{animation:sh .4s ease}
@keyframes sh{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}75%{transform:rotate(-4deg)}}
.burst{animation:bu .35s ease forwards}
@keyframes bu{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(0);opacity:0}}
/* Reveal */
.reveal{display:none;text-align:center;animation:rv .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes rv{from{transform:scale(0) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.reveal-rarity{font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:3px;margin-bottom:8px}
.reveal-rarity.commun{color:#9ca3af}.reveal-rarity.rare{color:#60a5fa}.reveal-rarity.epique{color:#c084fc}.reveal-rarity.legendaire{color:#fbbf24}
.reveal-box{width:160px;height:110px;border-radius:16px;margin:0 auto;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;overflow:hidden}
.reveal-box.commun{background:#374151;border:2px solid #6b7280}
.reveal-box.rare{background:linear-gradient(135deg,#1e3a8a,#2563eb);border:2px solid #3b82f6;box-shadow:0 0 20px rgba(59,130,246,.3)}
.reveal-box.epique{background:linear-gradient(135deg,#581c87,#7c3aed);border:2px solid #a855f7;box-shadow:0 0 25px rgba(168,85,247,.3)}
.reveal-box.legendaire{background:linear-gradient(135deg,#78350f,#d97706);border:2px solid #fbbf24;box-shadow:0 0 30px rgba(251,191,36,.4)}
.reveal-emoji{font-size:36px;position:relative;z-index:1}
.reveal-name{font-family:'Bebas Neue',sans-serif;font-size:18px;color:#fff;letter-spacing:2px;margin-top:10px}
.reveal-type{font-size:9px;color:rgba(255,255,255,.4);margin-top:3px;font-weight:700;letter-spacing:1px}
.reveal-prev{margin-top:10px}
.reveal-prev-box{width:56px;height:32px;border-radius:6px;margin:0 auto;border:1.5px solid rgba(255,255,255,.15)}
.reveal-dupe{font-size:10px;color:rgba(255,255,255,.3);margin-top:6px}
.reveal-btn{margin-top:16px;padding:12px 36px;border:none;border-radius:14px;background:rgba(255,255,255,.1);color:#fff;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:2px;cursor:pointer}
.confetti{position:fixed;width:8px;height:11px;z-index:100;border-radius:1px;animation:cf 1.4s ease-out forwards}
@keyframes cf{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
.bottom-bar{position:fixed;bottom:0;left:0;right:0;padding:8px 16px calc(env(safe-area-inset-bottom,20px)+8px);background:#fff;border-top:1px solid #e5e7eb;z-index:20}
.back-btn{width:100%;padding:12px;border:none;border-radius:12px;background:#f3f4f6;color:#6b7280;font-weight:700;font-size:12px;cursor:pointer}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#1a1a1a;color:#fff;padding:12px 24px;border-radius:14px;font-size:12px;font-weight:700;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="header">
  <div class="header-left"><div class="header-back" onclick="goBack()">←</div><div class="header-title">BOUTIQUE</div></div>
  <div class="header-coins" id="moneyDisplay">💰 —</div>
</div>
<div class="tabs">
  <div class="tab active" id="tabP" onclick="showTab('packs')">🎰 PACKS</div>
  <div class="tab" id="tabC" onclick="showTab('coll')">📋 COLLECTION</div>
  <div class="tab" id="tabE" onclick="showTab('epi')">🛠 EPI</div>
</div>
<div class="content">
  <!-- PACKS -->
  <div class="packs-section" id="viewPacks">
    <div class="section-label">PACK VEDETTE</div>
    <div class="pack-featured">
      <div class="pack-featured-badge">⭐ RECOMMANDÉ</div>

      <div class="pack-featured-price">50 000€</div>
      <button class="pack-featured-btn" id="btnOr" onclick="openPack('or')">OUVRIR</button>
      <div class="pack-featured-odds"><div class="odds-chip r">25% Rare</div><div class="odds-chip e">55% Épique</div><div class="odds-chip l">20% Légend.</div></div>
    </div>
    <div class="section-label">AUTRES PACKS</div>
    <div class="packs-row">
      <div class="pack-small" onclick="openPack('bronze')"><div class="pack-small-emoji">📦</div><div class="pack-small-name">BRONZE</div><div class="pack-small-price">10 000€</div></div>
      <div class="pack-small" onclick="openPack('argent')"><div class="pack-small-emoji">🎁</div><div class="pack-small-name">ARGENT</div><div class="pack-small-price">25 000€</div></div>
    </div>
    <div style="text-align:center;margin-top:10px;font-size:8px;color:#d1d5db">Doublons remboursés à 30% · 20 items au total</div>
  </div>
  <!-- COLLECTION -->
  <div class="coll-section" id="viewColl">
    <div class="coll-tabs" id="collTabs"></div>
    <div class="coll-grid" id="collGrid"></div>
  </div>
  <!-- EPI -->
  <div id="viewEpi" style="display:none;padding:16px">
    <div class="section-label">ÉQUIPEMENT DE PROTECTION</div>
    <div id="epiBody"></div>
  </div>
</div>
<div class="bottom-bar"><button class="back-btn" onclick="goBack()">← RETOUR AU CLICKER</button></div>
<div class="toast" id="toast"></div>

<!-- Pack opening overlay -->
<div class="open-ov" id="openOv">
  <div class="open-pack" id="openPack" onclick="tapPack()">
    <div class="open-pack-glow" id="openGlow"></div>
    <div id="openInner"><div class="open-emoji" id="openEmoji">📦</div><div class="open-label" id="openLabel">PACK</div></div>
  </div>
  <div class="open-hint" id="openHint">Appuie pour ouvrir</div>
  <div class="reveal" id="reveal">
    <div class="reveal-rarity" id="rvRarity"></div>
    <div class="reveal-box" id="rvBox"><div class="reveal-emoji" id="rvEmoji"></div></div>
    <div class="reveal-name" id="rvName"></div>
    <div class="reveal-type" id="rvType"></div>
    <div class="reveal-prev" id="rvPrev"></div>
    <div class="reveal-dupe" id="rvDupe"></div>
    <button class="reveal-btn" onclick="closeReveal()">CONTINUER</button>
  </div>
</div>

<script>
var SB_URL='https://drtsuhnbclhmgfjiykap.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
var sb=supabase.createClient(SB_URL,SB_KEY);
var currentUser=null,money=0,records={};

// ═══ ALL ITEMS ═══
var ITEMS=[
  {id:'neon',cat:'skin',name:'Néon Portuaire',emoji:'✨',rarity:'rare',preview:'linear-gradient(135deg,#00ff88,#00cc66)',shadow:'0 0 8px rgba(0,255,136,.3)'},
  {id:'ice',cat:'skin',name:'Givré Polaire',emoji:'🧊',rarity:'rare',preview:'linear-gradient(135deg,#67e8f9,#0e7490)',shadow:''},
  {id:'fire',cat:'skin',name:'Flammes du Quai',emoji:'🔥',rarity:'epique',preview:'linear-gradient(135deg,#ff4500,#ff8c00)',shadow:'0 0 8px rgba(255,69,0,.3)'},
  {id:'rainbow',cat:'skin',name:'Arc-en-Ciel',emoji:'🌈',rarity:'epique',preview:'linear-gradient(135deg,#ff0000,#ff8800,#ffff00,#00ff00,#0088ff)',shadow:''},
  {id:'galaxy',cat:'skin',name:'Galaxie du Docker',emoji:'🌌',rarity:'legendaire',preview:'linear-gradient(135deg,#1a0533,#4a1a8a)',shadow:'0 0 8px rgba(100,50,200,.3)'},
  {id:'marseille',cat:'skin',name:'Fierté Marseillaise',emoji:'🏟️',rarity:'legendaire',preview:'linear-gradient(135deg,#0078D7,#fff,#0078D7)',shadow:''},
  {id:'etoiles',cat:'effet',name:'Pluie d\'Étoiles',emoji:'⭐',rarity:'commun'},
  {id:'bulles',cat:'effet',name:'Bulles de Mer',emoji:'🫧',rarity:'commun'},
  {id:'confettis',cat:'effet',name:'Fête au Port',emoji:'🎊',rarity:'rare'},
  {id:'explosion',cat:'effet',name:'Big Bang',emoji:'💥',rarity:'epique'},
  {id:'feu_effet',cat:'effet',name:'Docker Enflammé',emoji:'🔥',rarity:'epique'},
  {id:'coucher',cat:'fond',name:'Coucher de Soleil',emoji:'🌅',rarity:'commun',preview:'linear-gradient(180deg,#ff6b35,#ffa94d)'},
  {id:'nuit',cat:'fond',name:'Nuit Étoilée',emoji:'🌙',rarity:'rare',preview:'linear-gradient(180deg,#0a0a2e,#1a1a4e)'},
  {id:'orage',cat:'fond',name:'Orage sur le Port',emoji:'⛈️',rarity:'epique',preview:'linear-gradient(180deg,#374151,#6b7280)'},
  {id:'aurore',cat:'fond',name:'Aurore Boréale',emoji:'💜',rarity:'legendaire',preview:'linear-gradient(180deg,#ec4899,#f9a8d4)'},
  {id:'rock-with-you',cat:'musique',name:'La Danse du Container',emoji:'🕺',rarity:'rare'},
  {id:'a-la-la',cat:'musique',name:'Docker en Vacances',emoji:'🌴',rarity:'rare'},
  {id:'aventurier',cat:'musique',name:'Aventurier des Quais',emoji:'⚓',rarity:'epique'},
  {id:'demons-minuit',cat:'musique',name:'Le Shift de 3h du Mat\'',emoji:'🌙',rarity:'epique'},
  {id:'so-excited',cat:'musique',name:'Vendredi Soir au Port',emoji:'🎉',rarity:'rare'},
];

var PACK_ODDS={bronze:{commun:.55,rare:.35,epique:.08,legendaire:.02},argent:{commun:.15,rare:.50,epique:.28,legendaire:.07},or:{commun:0,rare:.25,epique:.55,legendaire:.20}};
var PACK_PRICES={bronze:10000,argent:25000,or:50000};
var PACK_EMOJIS={bronze:'📦',argent:'🎁',or:'👑'};
var PACK_COLORS={bronze:['#92400e','#fde68a'],argent:['#4b5563','#e5e7eb'],or:['#b45309','#fbbf24']};

var owned=[],equipped={skin:'red',effet:'standard',fond:'jour',musique:'none'};
var _taps=0,_packTier='',_state='idle',_drawn=null;

function showTab(id){
  document.getElementById('tabP').classList.toggle('active',id==='packs');
  document.getElementById('tabC').classList.toggle('active',id==='coll');
  document.getElementById('tabE').classList.toggle('active',id==='epi');
  document.getElementById('viewPacks').style.display=id==='packs'?'block':'none';
  document.getElementById('viewColl').style.display=id==='coll'?'block':'none';
  document.getElementById('viewEpi').style.display=id==='epi'?'block':'none';
  if(id==='coll')renderColl('skin');
}

function showToast(t){var e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(function(){e.classList.remove('show');},1500);}
function goBack(){window.location.href='clicker.html';}

// ═══ PACK OPENING ═══
function openPack(tier){
  if(money<PACK_PRICES[tier]){showToast('❌ Pas assez d\'argent');return;}
  money-=PACK_PRICES[tier];updateMoney();
  _packTier=tier;_taps=0;_state='waiting';
  document.getElementById('openOv').style.display='flex';
  document.getElementById('reveal').style.display='none';
  document.getElementById('openPack').style.display='flex';
  document.getElementById('openHint').style.display='block';
  var inner=document.getElementById('openInner');inner.classList.remove('burst');inner.style.display='flex';
  document.getElementById('openInner').style.background='linear-gradient(135deg,'+PACK_COLORS[tier][0]+','+PACK_COLORS[tier][1]+')';
  document.getElementById('openInner').style.borderRadius='18px';document.getElementById('openInner').style.width='130px';document.getElementById('openInner').style.height='170px';
  document.getElementById('openEmoji').textContent=PACK_EMOJIS[tier];
  document.getElementById('openLabel').textContent='PACK '+tier.toUpperCase();
  document.getElementById('openGlow').style.opacity='0';
  document.getElementById('openGlow').style.background='radial-gradient(circle,'+PACK_COLORS[tier][1]+',transparent 70%)';
}

function tapPack(){
  if(_state!=='waiting')return;_taps++;
  var p=document.getElementById('openPack');p.classList.remove('shake');void p.offsetWidth;p.classList.add('shake');
  if(navigator.vibrate)navigator.vibrate(8+_taps*5);
  document.getElementById('openGlow').style.opacity=Math.min(.7,_taps*.15);
  if(_taps>=4){
    _state='opening';_drawn=drawItem(_packTier);
    document.getElementById('openInner').classList.add('burst');
    document.getElementById('openHint').style.display='none';
    document.getElementById('openGlow').style.opacity='1';
    if(navigator.vibrate)navigator.vibrate([25,15,25,15,40]);
    setTimeout(function(){document.getElementById('openPack').style.display='none';showReveal(_drawn);},450);
  }
}

function drawItem(tier){
  var odds=PACK_ODDS[tier],r=Math.random(),cum=0,rarity='commun';
  for(var k in odds){cum+=odds[k];if(r<cum){rarity=k;break;}}
  var pool=ITEMS.filter(function(it){return it.rarity===rarity;});
  if(!pool.length)pool=ITEMS.filter(function(it){return it.rarity==='commun';});
  return pool[Math.floor(Math.random()*pool.length)];
}

function showReveal(item){
  _state='revealed';
  var isDupe=owned.indexOf(item.id)!==-1;
  var rl={commun:'COMMUN',rare:'RARE',epique:'ÉPIQUE',legendaire:'LÉGENDAIRE'};
  document.getElementById('rvRarity').textContent=rl[item.rarity];document.getElementById('rvRarity').className='reveal-rarity '+item.rarity;
  document.getElementById('rvBox').className='reveal-box '+item.rarity;
  document.getElementById('rvEmoji').textContent=item.emoji;
  document.getElementById('rvName').textContent=item.name;
  document.getElementById('rvType').textContent={skin:'SKIN DE CONTAINER',effet:'EFFET DE CLIC',fond:'FOND D\'ÉCRAN',musique:'MUSIQUE'}[item.cat];
  var prev=document.getElementById('rvPrev');
  prev.innerHTML=item.preview?'<div class="reveal-prev-box" style="background:'+item.preview+';'+(item.shadow?'box-shadow:'+item.shadow:'')+'"></div>':'';
  if(isDupe){var refund=Math.floor(PACK_PRICES[_packTier]*.3);money+=refund;updateMoney();
    document.getElementById('rvDupe').textContent='DOUBLON — +'+refund.toLocaleString('fr-FR')+'€ remboursé';
  }else{owned.push(item.id);document.getElementById('rvDupe').textContent='✨ NOUVEAU !';}
  document.getElementById('reveal').style.display='block';
  document.getElementById('reveal').style.animation='none';void document.getElementById('reveal').offsetWidth;
  document.getElementById('reveal').style.animation='rv .6s cubic-bezier(.34,1.56,.64,1)';
  if(item.rarity==='epique'||item.rarity==='legendaire')spawnConfetti(item.rarity==='legendaire'?20:10);
  saveData();
}

function closeReveal(){document.getElementById('openOv').style.display='none';_state='idle';}

function spawnConfetti(n){
  var cols=['#fbbf24','#ef4444','#3b82f6','#22c55e','#a855f7','#ec4899'];
  for(var i=0;i<n;i++){var c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.top='-10px';
    c.style.background=cols[Math.floor(Math.random()*cols.length)];c.style.animationDelay=(Math.random()*.4)+'s';
    document.body.appendChild(c);setTimeout(function(){c.remove();},2000);}
}

// ═══ COLLECTION ═══
var _collCat='skin';
function renderColl(cat){
  _collCat=cat;
  var cats=[{id:'skin',label:'📦 Skins'},{id:'effet',label:'💥 Effets'},{id:'fond',label:'🌅 Fonds'},{id:'musique',label:'🎵 Musiques'}];
  var th='';cats.forEach(function(c){th+='<div class="coll-tab'+(c.id===cat?' active':'')+'" onclick="renderColl(\''+c.id+'\')">'+c.label+'</div>';});
  document.getElementById('collTabs').innerHTML=th;
  var items=ITEMS.filter(function(it){return it.cat===cat;});
  var html='';
  // Add defaults
  if(cat==='fond')html+=makeCollCard({id:'jour',cat:'fond',name:'Jour',emoji:'☀️',rarity:'defaut',preview:'linear-gradient(180deg,#2196F3,#64B5F6)'},true);
  if(cat==='effet')html+=makeCollCard({id:'standard',cat:'effet',name:'Standard',emoji:'📝',rarity:'defaut'},true);
  if(cat==='musique')html+=makeCollCard({id:'none',cat:'musique',name:'Pas de musique',emoji:'🔇',rarity:'defaut'},true);
  items.forEach(function(it){html+=makeCollCard(it,owned.indexOf(it.id)!==-1);});
  document.getElementById('collGrid').innerHTML=html;
}

function makeCollCard(item,isOwned){
  var isEquipped=equipped[item.cat]===item.id;
  var rLabel={commun:'COMMUN',rare:'RARE',epique:'ÉPIQUE',legendaire:'LÉGEND.',defaut:'DÉFAUT'}[item.rarity]||'???';
  var cls='coll-card'+(isEquipped?' equipped':'')+(!isOwned&&item.rarity!=='defaut'?' locked':'');
  var h='<div class="'+cls+'">';
  h+='<div class="coll-card-badge '+item.rarity+'">'+rLabel+'</div>';
  h+='<div class="coll-card-preview">';
  if(item.preview)h+='<div class="coll-card-skin" style="background:'+item.preview+';'+(item.shadow?'box-shadow:'+item.shadow:'')+'"></div>';
  else h+='<div class="coll-card-emoji">'+item.emoji+'</div>';
  h+='</div>';
  h+='<div class="coll-card-name">'+(isOwned||item.rarity==='defaut'?item.name:'???')+'</div>';
  if(isEquipped)h+='<div class="coll-card-status eq">✅ Équipé</div>';
  else if(isOwned||item.rarity==='defaut')h+='<div class="coll-card-status" onclick="equipItem(\''+item.cat+'\',\''+item.id+'\')">Équiper</div>';
  else h+='<div class="coll-card-status" style="color:#d1d5db">🔒</div>';
  h+='</div>';return h;
}

async function equipItem(cat,id){
  equipped[cat]=id;
  if(cat==='skin')await sb.from('profiles').update({skin_container:id}).eq('user_id',currentUser.id);
  var rec=records;rec.click_effect=equipped.effet;rec.bg_theme=equipped.fond;rec.selected_music=equipped.musique;
  await sb.from('game_stats').update({records:rec}).eq('user_id',currentUser.id);
  renderColl(_collCat);showToast('✅ Équipé !');
}

// ═══ DATA ═══
function updateMoney(){document.getElementById('moneyDisplay').textContent='💰 '+money.toLocaleString('fr-FR')+'€';
  document.getElementById('btnOr').disabled=money<50000;}

async function saveData(){
  records.unlocked_packs=owned;
  await sb.from('game_stats').update({money:money,records:records}).eq('user_id',currentUser.id);
  updateMoney();
}

async function init(){
  try{
    var s=await sb.auth.getSession();if(!s.data.session){location.href='index.html';return;}
    currentUser=s.data.session.user;
    var gs=await sb.from('game_stats').select('money,records').eq('user_id',currentUser.id).maybeSingle();
    var pr=await sb.from('profiles').select('skin_container').eq('user_id',currentUser.id).maybeSingle();
    if(gs.data){money=gs.data.money||0;records=gs.data.records||{};}
    owned=records.unlocked_packs||[];
    equipped.skin=pr?.data?.skin_container||'red';
    equipped.effet=records.click_effect||'standard';
    equipped.fond=records.bg_theme||'jour';
    equipped.musique=records.selected_music||'none';
    updateMoney();
    // EPI render (keep existing system)
    renderEpi();
  }catch(e){console.error(e);showToast('❌ Erreur');}
}

// ═══ EPI (simplified from existing) ═══
var EPI=[
  {id:'casque',name:'Casque de chantier',emoji:'🪖',desc:'+XP par clic',
    tiers:[{id:'casque_commune',rar:'COMM.',val:'+1 XP',price:5000},{id:'casque_rare',rar:'RARE',val:'+2 XP',price:25000},{id:'casque_epique',rar:'ÉPIQUE',val:'+4 XP',price:100000},{id:'casque_legendaire',rar:'LÉGEND.',val:'+8 XP',price:500000}]},
  {id:'gilet',name:'Gilet de sécurité',emoji:'🦺',desc:'+€ par clic',
    tiers:[{id:'gilet_commune',rar:'COMM.',val:'+1€',price:5000},{id:'gilet_rare',rar:'RARE',val:'+2€',price:25000},{id:'gilet_epique',rar:'ÉPIQUE',val:'+4€',price:100000},{id:'gilet_legendaire',rar:'LÉGEND.',val:'+8€',price:500000}]},
  {id:'chaussures',name:'Chaussures de sécu',emoji:'👟',desc:'Combo max',
    tiers:[{id:'chaussures_commune',rar:'COMM.',val:'×4',price:5000},{id:'chaussures_rare',rar:'RARE',val:'×5',price:25000},{id:'chaussures_epique',rar:'ÉPIQUE',val:'×6',price:100000},{id:'chaussures_legendaire',rar:'LÉGEND.',val:'×9',price:500000}]},
];
var ownedEpi=[],equippedEpi={};

function renderEpi(){
  ownedEpi=records.unlocked_epi||[];
  equippedEpi=records.equipped_epi||{};
  var html='';
  EPI.forEach(function(e){
    html+='<div style="background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.04)">';
    html+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><span style="font-size:24px">'+e.emoji+'</span><div><div style="font-family:\'Bebas Neue\',sans-serif;font-size:15px;letter-spacing:1px">'+e.name+'</div><div style="font-size:9px;color:#9ca3af">'+e.desc+'</div></div></div>';
    html+='<div style="display:flex;gap:4px">';
    e.tiers.forEach(function(t){
      var owns=ownedEpi.indexOf(t.id)!==-1;var eq=equippedEpi[e.id]===t.id;
      html+='<div style="flex:1;padding:8px 4px;border-radius:8px;text-align:center;font-size:8px;font-weight:800;border:1.5px solid '+(eq?'#3b82f6':owns?'#d1d5db':'#f3f4f6')+';background:'+(eq?'#eff6ff':'#fff')+';cursor:pointer" onclick="buyEpi(\''+e.id+'\',\''+t.id+'\','+t.price+')">';
      html+='<div style="color:'+(eq?'#3b82f6':'#374151')+'">'+t.rar+'</div>';
      html+='<div style="color:#6b7280;margin-top:2px">'+t.val+'</div>';
      html+='<div style="margin-top:3px;color:'+(owns?(eq?'#3b82f6':'#9ca3af'):'#d1d5db')+'">'+(owns?(eq?'✅':'ÉQUIPER'):t.price.toLocaleString('fr-FR')+'€')+'</div>';
      html+='</div>';
    });
    html+='</div></div>';
  });
  document.getElementById('epiBody').innerHTML=html;
}

async function buyEpi(epiId,tierId,price){
  if(ownedEpi.indexOf(tierId)!==-1){
    equippedEpi[epiId]=tierId;records.equipped_epi=equippedEpi;
    await sb.from('game_stats').update({records:records}).eq('user_id',currentUser.id);
    renderEpi();showToast('✅ Équipé !');return;
  }
  if(money<price){showToast('❌ Pas assez');return;}
  money-=price;ownedEpi.push(tierId);equippedEpi[epiId]=tierId;
  records.unlocked_epi=ownedEpi;records.equipped_epi=equippedEpi;
  await sb.from('game_stats').update({money:money,records:records}).eq('user_id',currentUser.id);
  updateMoney();renderEpi();showToast('🎉 Acheté et équipé !');
}

init();
</script>
