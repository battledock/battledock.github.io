<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Plinko - Battle Dock Casino</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(180deg, #0f172a 0%, #1e293b 50%, #334155 100%);
      min-height: 100vh;
      padding-bottom: 80px;
      overflow-x: hidden;
    }

    .container { max-width: 500px; margin: 0 auto; padding: 16px; }

    .header {
      background: linear-gradient(135deg, #1e293b, #334155);
      border: 2px solid rgba(251, 191, 36, 0.3);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .back-btn { background: rgba(251, 191, 36, 0.2); border: 2px solid rgba(251, 191, 36, 0.5); color: #fbbf24; border-radius: 10px; padding: 8px 14px; font-weight: 700; font-size: 13px; cursor: pointer; }
    .game-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(20px, 5vw, 28px); background: linear-gradient(135deg, #fbbf24, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 2px; }
    .balance { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #0f172a; padding: 6px 12px; border-radius: 10px; font-family: 'Bebas Neue', sans-serif; font-size: 16px; }

    .game-area { background: linear-gradient(135deg, #1e293b, #334155); border: 2px solid rgba(251, 191, 36, 0.2); border-radius: 16px; padding: 20px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); }

    .plinko-board {
      width: min(350px, 95vw);
      height: min(400px, 110vw);
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      border: 4px solid rgba(251, 191, 36, 0.3);
      border-radius: 16px;
      position: relative;
      overflow: hidden;
    }

    .peg {
      position: absolute;
      width: 8px;
      height: 8px;
      background: #fbbf24;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(251, 191, 36, 0.6);
    }

    .ball {
      position: absolute;
      width: 16px;
      height: 16px;
      background: radial-gradient(circle, #dc2626, #991b1b);
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(220, 38, 38, 0.8);
      transition: all 0.1s linear;
      z-index: 10;
    }

    .multipliers {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-around;
      padding: 8px 4px;
      background: rgba(0, 0, 0, 0.3);
    }

    .mult-box {
      flex: 1;
      text-align: center;
      padding: 6px 2px;
      border-radius: 6px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(11px, 3vw, 14px);
      font-weight: 700;
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    .mult-0 { background: #1f2937; color: #6b7280; }
    .mult-03 { background: #ef4444; color: white; }
    .mult-06 { background: #f97316; color: white; }
    .mult-1 { background: #3b82f6; color: white; }
    .mult-15 { background: #8b5cf6; color: white; }
    .mult-25 { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #0f172a; box-shadow: 0 0 12px rgba(251, 191, 36, 0.6); }

    .controls { display: flex; flex-direction: column; gap: 12px; align-items: center; }
    .bet-control { display: flex; align-items: center; gap: 12px; background: rgba(255, 255, 255, 0.05); padding: 12px 20px; border-radius: 12px; border: 2px solid rgba(251, 191, 36, 0.2); }
    .bet-control label { font-weight: 700; font-size: 14px; color: #fbbf24; }
    .bet-control input { width: 140px; padding: 10px; border: 2px solid #fbbf24; border-radius: 10px; font-size: 16px; font-weight: 700; text-align: center; background: rgba(255, 255, 255, 0.1); color: white; }
    .play-btn { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #0f172a; border: none; border-radius: 14px; padding: 14px 48px; font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 2px; cursor: pointer; box-shadow: 0 8px 24px rgba(251, 191, 36, 0.4); transition: all 0.2s; }
    .play-btn:active { transform: scale(0.95); }
    .play-btn:disabled { background: #475569; cursor: not-allowed; box-shadow: none; }

    .result { display: none; margin-top: 16px; padding: 16px; border-radius: 12px; text-align: center; font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 1px; animation: slideUp 0.3s; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .result.win { background: linear-gradient(135deg, #10b981, #059669); color: white; box-shadow: 0 4px 16px rgba(16, 185, 129, 0.5); }
    .result.lose { background: linear-gradient(135deg, #dc2626, #991b1b); color: white; box-shadow: 0 4px 16px rgba(220, 38, 38, 0.5); }
    .result.push { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; box-shadow: 0 4px 16px rgba(59, 130, 246, 0.5); }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: linear-gradient(135deg, #1e293b, #334155); border-top: 2px solid rgba(251, 191, 36, 0.3); padding: 12px 16px; box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.5); z-index: 100; }
    .nav-btn { width: 100%; max-width: 500px; margin: 0 auto; display: flex; background: rgba(251, 191, 36, 0.2); border: 2px solid rgba(251, 191, 36, 0.5); color: #fbbf24; border-radius: 12px; padding: 12px; font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 1px; cursor: pointer; justify-content: center; align-items: center; gap: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <button class="back-btn" onclick="window.location.href='casino-new.html'">← Casino</button>
      <div class="game-title">🔴 PLINKO</div>
      <div class="balance" id="balance">0€</div>
    </div>

    <div class="game-area">
      <div class="plinko-board" id="board">
        <div class="multipliers">
          <div class="mult-box mult-0">×0</div>
          <div class="mult-box mult-03">×0.3</div>
          <div class="mult-box mult-06">×0.6</div>
          <div class="mult-box mult-1">×1</div>
          <div class="mult-box mult-15">×1.5</div>
          <div class="mult-box mult-25">×2.5</div>
          <div class="mult-box mult-15">×1.5</div>
          <div class="mult-box mult-1">×1</div>
          <div class="mult-box mult-06">×0.6</div>
          <div class="mult-box mult-03">×0.3</div>
          <div class="mult-box mult-0">×0</div>
        </div>
      </div>

      <div class="controls">
        <div class="bet-control">
          <label>MISE:</label>
          <input type="number" id="betInput" value="100" min="100" step="50">
        </div>
        <button class="play-btn" id="dropBtn" onclick="drop()">LÂCHER LA BILLE</button>
      </div>

      <div class="result" id="result"></div>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-btn" onclick="window.location.href='casino-new.html'">← RETOUR AU CASINO</button>
  </div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const sb = createClient(supabaseUrl, supabaseKey);

    let currentUser, userMoney = 0;
    
    // CORRECTION CRITIQUE : Centre ×10 → ×2.5 (Avantage maison 12%)
    const multipliers = [0, 0.3, 0.6, 1, 1.5, 2.5, 1.5, 1, 0.6, 0.3, 0];
    const ROWS = 10, COLS = 11;

    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('gesturechange', e => e.preventDefault());

    function createBoard() {
      const board = document.getElementById('board');
      const boardWidth = board.offsetWidth;
      const boardHeight = board.offsetHeight - 50;
      const pegSpacingX = boardWidth / (COLS + 1);
      const pegSpacingY = boardHeight / (ROWS + 1);

      for (let row = 0; row < ROWS; row++) {
        const offset = row % 2 === 0 ? pegSpacingX / 2 : 0;
        const pegsInRow = row % 2 === 0 ? COLS : COLS - 1;
        
        for (let col = 0; col < pegsInRow; col++) {
          const peg = document.createElement('div');
          peg.className = 'peg';
          peg.style.left = `${offset + pegSpacingX * (col + 1) - 4}px`;
          peg.style.top = `${pegSpacingY * (row + 1) - 4}px`;
          board.appendChild(peg);
        }
      }
    }

    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { window.location.href = 'index.html'; return; }
      currentUser = session.user;
      await loadMoney();
      createBoard();
    }

    async function loadMoney() {
      const { data } = await sb.from('game_stats').select('money').eq('user_id', currentUser.id).single();
      if (data) {
        userMoney = data.money || 0;
        document.getElementById('balance').textContent = userMoney.toLocaleString('fr-FR') + '€';
      }
    }

    async function updateMoney(amount) {
      userMoney += amount;
      await sb.from('game_stats').update({ money: userMoney }).eq('user_id', currentUser.id);
      document.getElementById('balance').textContent = userMoney.toLocaleString('fr-FR') + '€';
    }

    async function drop() {
      const bet = parseInt(document.getElementById('betInput').value);
      if (bet < 100 || bet > userMoney) { alert('Mise invalide !'); return; }

      const btn = document.getElementById('dropBtn');
      btn.disabled = true;
      document.getElementById('result').style.display = 'none';
      await updateMoney(-bet);

      const board = document.getElementById('board');
      const ball = document.createElement('div');
      ball.className = 'ball';
      board.appendChild(ball);

      const boardWidth = board.offsetWidth;
      let xPos = boardWidth / 2;
      let yPos = 20;

      const pegSpacingY = (board.offsetHeight - 50) / (ROWS + 1);
      const pegSpacingX = boardWidth / (COLS + 1);

      for (let row = 0; row < ROWS; row++) {
        await new Promise(resolve => setTimeout(resolve, 150));
        yPos += pegSpacingY;
        xPos += (Math.random() - 0.5) * pegSpacingX * 0.8;
        xPos = Math.max(20, Math.min(boardWidth - 20, xPos));
        ball.style.left = xPos + 'px';
        ball.style.top = yPos + 'px';
      }

      await new Promise(resolve => setTimeout(resolve, 300));
      
      const slotWidth = boardWidth / COLS;
      const slotIndex = Math.floor(xPos / slotWidth);
      const finalSlot = Math.max(0, Math.min(COLS - 1, slotIndex));
      
      ball.remove();

      const mult = multipliers[finalSlot];
      const win = Math.floor(bet * mult);
      const res = document.getElementById('result');

      if (win > bet) {
        res.className = 'result win';
        res.textContent = `🎉 ×${mult} ! +${win.toLocaleString('fr-FR')}€`;
        await updateMoney(win);
      } else if (win === bet) {
        res.className = 'result push';
        res.textContent = `↔️ ×${mult} - Remboursé ${bet.toLocaleString('fr-FR')}€`;
        await updateMoney(win);
      } else if (win > 0) {
        res.className = 'result lose';
        res.textContent = `📉 ×${mult} = ${win.toLocaleString('fr-FR')}€ (perte: ${(bet - win).toLocaleString('fr-FR')}€)`;
        await updateMoney(win);
      } else {
        res.className = 'result lose';
        res.textContent = `💔 ×0 - Perdu ${bet.toLocaleString('fr-FR')}€`;
      }

      res.style.display = 'block';
      btn.disabled = false;
    }

    init();
  </script>
</body>
</html>
