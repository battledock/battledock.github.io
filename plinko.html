<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Plinko - Battle Dock Casino</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      -moz-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(180deg, #450a0a, #7f1d1d, #991b1b);
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 6px;
      padding-bottom: 120px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .game-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 10px;
      overflow: hidden;
      min-height: 0;
    }

    /* BOARD */
    .plinko-board {
      width: 100%;
      max-width: 340px;
      height: clamp(280px, 55vh, 380px);
      background: linear-gradient(135deg, #0f172a, #1e293b);
      border: 3px solid #fbbf24;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    .ball {
      position: absolute;
      top: 10px;
      width: 20px;
      height: 20px;
      background: #fbbf24;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(251, 191, 36, 0.8);
      transition: all 0.3s;
    }

    .peg {
      position: absolute;
      width: 8px;
      height: 8px;
      background: rgba(251, 191, 36, 0.5);
      border-radius: 50%;
    }

    .multipliers {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      height: 40px;
    }

    .mult-slot {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 11px;
      color: white;
      border-left: 1px solid rgba(251, 191, 36, 0.2);
    }

    .mult-slot:first-child {
      border-left: none;
    }

    .mult-slot.low { background: rgba(220, 38, 38, 0.3); }
    .mult-slot.mid { background: rgba(251, 191, 36, 0.3); }
    .mult-slot.high { background: rgba(16, 185, 129, 0.3); }

    /* CONTROLS */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      max-width: 340px;
      flex-shrink: 0;
    }

    .bet-control {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 10px;
      border-radius: 8px;
      border: 2px solid rgba(251, 191, 36, 0.3);
    }

    .bet-control label {
      font-weight: 700;
      font-size: 11px;
      color: #fbbf24;
      white-space: nowrap;
    }

    .bet-control input {
      flex: 1;
      padding: 6px;
      border: 2px solid #fbbf24;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      max-width: 100px;
    }

    .drop-btn {
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      border: none;
      border-radius: 10px;
      color: #0f172a;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      letter-spacing: 1.5px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .drop-btn:active {
      transform: scale(0.98);
    }

    .drop-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .result {
      display: none;
      padding: 8px 14px;
      border-radius: 10px;
      text-align: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 14px;
      letter-spacing: 1px;
      margin-top: 6px;
    }

    .result.win {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
    }

    .result.lose {
      background: linear-gradient(135deg, #dc2626, #991b1b);
      color: white;
    }

    /* BOTTOM BAR */
    .bottom-bar {
      background: linear-gradient(135deg, #7f1d1d, #991b1b);
      border: 2px solid rgba(251, 191, 36, 0.5);
      border-radius: 10px;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      min-height: 44px;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 480px;
      width: calc(100% - 20px);
      z-index: 100;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.5);
    }

    .back-btn {
      background: rgba(251, 191, 36, 0.2);
      border: 2px solid rgba(251, 191, 36, 0.5);
      color: #fbbf24;
      border-radius: 6px;
      padding: 4px 10px;
      font-weight: 700;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .back-btn:active {
      transform: scale(0.95);
    }

    .game-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      color: #fbbf24;
      letter-spacing: 1.5px;
      white-space: nowrap;
    }

    .balance {
      background: white;
      color: #0f172a;
      padding: 4px 10px;
      border-radius: 6px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    @media (max-width: 400px) {
      .bottom-bar {
        padding: 5px 8px;
        bottom: 15px;
      }

      .back-btn {
        padding: 3px 8px;
        font-size: 10px;
      }

      .game-title {
        font-size: 14px;
      }

      .balance {
        padding: 3px 8px;
        font-size: 12px;
      }

      .plinko-board {
        height: clamp(260px, 50vh, 340px);
      }
    }

    @media (max-width: 320px) {
      .bottom-bar {
        bottom: 10px;
      }

      .back-btn {
        padding: 2px 6px;
        font-size: 9px;
      }

      .game-title {
        font-size: 12px;
        letter-spacing: 1px;
      }

      .balance {
        font-size: 11px;
        padding: 2px 6px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="game-area">
      <!-- PLINKO BOARD -->
      <div class="plinko-board" id="board">
        <div class="multipliers">
          <div class="mult-slot low">0.2×</div>
          <div class="mult-slot low">0.5×</div>
          <div class="mult-slot mid">1×</div>
          <div class="mult-slot mid">1.5×</div>
          <div class="mult-slot high">3×</div>
          <div class="mult-slot mid">1.5×</div>
          <div class="mult-slot mid">1×</div>
          <div class="mult-slot low">0.5×</div>
          <div class="mult-slot low">0.2×</div>
        </div>
      </div>

      <!-- CONTROLS -->
      <div class="controls">
        <div class="bet-control">
          <label>MISE:</label>
          <input type="number" id="betAmount" value="50" min="10" step="10">
        </div>
        <button class="drop-btn" id="dropBtn" onclick="dropBall()">LÂCHER LA BILLE 🎲</button>
        <div class="result" id="result"></div>
      </div>
    </div>

    <!-- BOTTOM BAR -->
    <div class="bottom-bar">
      <button class="back-btn" onclick="window.location.href='casino.html'">← Casino</button>
      <div class="game-title">🎲 PLINKO</div>
      <div class="balance" id="balance">0€</div>
    </div>
  </div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const sb = createClient(supabaseUrl, supabaseKey);

    let currentUser = null;
    let currentMoney = 0;

    const multipliers = [0.2, 0.5, 1, 1.5, 3, 1.5, 1, 0.5, 0.2];

    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        window.location.href = 'index.html';
        return;
      }
      currentUser = session.user;
      await loadMoney();
      createPegs();
    }

    async function loadMoney() {
      const { data: stats } = await sb
        .from('game_stats')
        .select('money')
        .eq('user_id', currentUser.id)
        .single();

      currentMoney = stats?.money || 0;
      document.getElementById('balance').textContent = currentMoney.toLocaleString('fr-FR') + '€';
    }

    async function updateMoney(newAmount) {
      await sb
        .from('game_stats')
        .update({ money: newAmount })
        .eq('user_id', currentUser.id);
      
      currentMoney = newAmount;
      document.getElementById('balance').textContent = newAmount.toLocaleString('fr-FR') + '€';
    }

    function createPegs() {
      const board = document.getElementById('board');
      const rows = 10;
      const boardWidth = board.offsetWidth;
      const boardHeight = board.offsetHeight - 40;

      for (let row = 0; row < rows; row++) {
        const pegsInRow = row + 3;
        const spacing = boardWidth / (pegsInRow + 1);
        const y = (boardHeight / rows) * row + 30;

        for (let i = 0; i < pegsInRow; i++) {
          const peg = document.createElement('div');
          peg.className = 'peg';
          peg.style.left = spacing * (i + 1) + 'px';
          peg.style.top = y + 'px';
          board.appendChild(peg);
        }
      }
    }

    async function dropBall() {
      const betInput = document.getElementById('betAmount');
      const bet = parseInt(betInput.value);
      const btn = document.getElementById('dropBtn');
      const res = document.getElementById('result');

      if (bet < 10) {
        alert('Mise minimum : 10€');
        return;
      }

      if (bet > currentMoney) {
        alert('Solde insuffisant !');
        return;
      }

      btn.disabled = true;
      res.style.display = 'none';

      // Déduire la mise
      await updateMoney(currentMoney - bet);

      const board = document.getElementById('board');
      const ball = document.createElement('div');
      ball.className = 'ball';
      ball.style.left = (board.offsetWidth / 2 - 10) + 'px';
      board.appendChild(ball);

      // Simuler chute (distribution normale vers centre)
      let position = 4; // Centre
      for (let i = 0; i < 10; i++) {
        await new Promise(r => setTimeout(r, 200));
        const direction = Math.random() > 0.5 ? 1 : -1;
        position += direction * (Math.random() > 0.3 ? 1 : 0);
        position = Math.max(0, Math.min(8, position));

        const x = (board.offsetWidth / 9) * position + (board.offsetWidth / 18);
        const y = 30 + (i + 1) * ((board.offsetHeight - 70) / 10);
        ball.style.left = x + 'px';
        ball.style.top = y + 'px';
      }

      await new Promise(r => setTimeout(r, 500));

      const mult = multipliers[position];
      const win = Math.floor(bet * mult);

      if (win > bet) {
        res.className = 'result win';
        res.innerHTML = `🎉 ${mult}× = +${win.toLocaleString('fr-FR')}€`;
        await updateMoney(currentMoney + win);
      } else if (win === bet) {
        res.className = 'result win';
        res.innerHTML = `⚖️ ${mult}× = Remboursé`;
        await updateMoney(currentMoney + win);
      } else {
        res.className = 'result lose';
        res.innerHTML = `💔 ${mult}× = ${win > 0 ? win.toLocaleString('fr-FR') + '€' : 'Perdu ' + bet.toLocaleString('fr-FR') + '€'}`;
        if (win > 0) await updateMoney(currentMoney + win);
      }

      res.style.display = 'block';
      board.removeChild(ball);
      btn.disabled = false;
    }

    // Anti-zoom
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('gesturechange', e => e.preventDefault());

    init();
  </script>
</body>
</html>
