<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Régate — Battle Dock Casino</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{height:100%;height:100dvh;overflow:hidden;font-family:'Inter',sans-serif}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,44px)+10px) 16px 10px;flex-shrink:0}
.btn-back{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:7px 14px;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;color:#fff;cursor:pointer}
.hdr-title{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#fbbf24;letter-spacing:3px}
.hdr-bal{background:rgba(0,0,0,.3);border:1px solid rgba(251,191,36,.3);border-radius:20px;padding:7px 14px;font-family:'Bebas Neue',sans-serif;font-size:15px;color:#fbbf24}
    body{background:radial-gradient(ellipse at top,#7f1d1d,#450a0a 60%,#1a0000);display:flex;flex-direction:column}
    .table { background:linear-gradient(135deg,#1e293b,#0f172a);border:4px solid #fbbf24;border-radius:14px;padding:14px;box-shadow:0 8px 32px rgba(0,0,0,0.6);width:100%;max-width:340px;display:flex;flex-direction:column;gap:8px;flex-shrink:0; }
    .finish-line { text-align:right;font-size:9px;color:rgba(255,255,255,0.2);letter-spacing:2px; }
    .track {
      display:flex;align-items:center;gap:8px;
      background:rgba(255,255,255,0.04);border:1.5px solid rgba(255,255,255,0.08);
      border-radius:8px;padding:7px 10px;cursor:pointer;transition:all .15s;
      position:relative;overflow:hidden;
    }
    .sel    { border-color:rgba(251,191,36,0.6);background:rgba(251,191,36,0.08); }
    .winner { border-color:rgba(74,222,128,0.6);background:rgba(74,222,128,0.08); }
    .loser  { opacity:0.4; }
    .track-bar { position:absolute;left:0;top:0;bottom:0;width:0%;border-radius:8px;opacity:0.15;transition:width .08s linear; }
    .track-boat { font-size:22px;flex-shrink:0; }
    .track-name { flex:1;font-family:'Bebas Neue',sans-serif;font-size:13px;color:white;letter-spacing:1px; }
    .track-odds { font-family:'Bebas Neue',sans-serif;font-size:14px;padding:3px 8px;border-radius:6px;background:rgba(251,191,36,0.15);color:#fbbf24;flex-shrink:0; }
    .track-odds { background:#fbbf24;color:#0f172a; }
    .win  { background:linear-gradient(135deg,#10b981,#059669);color:white;box-shadow:0 4px 14px rgba(16,185,129,0.4); }
    .lose { background:linear-gradient(135deg,#dc2626,#991b1b);color:white; }
    .controls { display:flex;flex-direction:column;gap:6px;width:100%;max-width:340px;flex-shrink:0; }
    .sel { background:#fbbf24;color:#0f172a; }
    
    .chips{display:flex;gap:6px;width:100%;max-width:420px}
    .chip{flex:1;padding:10px 4px;border-radius:20px;text-align:center;cursor:pointer;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;border:1.5px solid rgba(255,255,255,.1);color:rgba(255,255,255,.4);background:rgba(255,255,255,.06);transition:all .15s}
    .chip.sel{background:rgba(251,191,36,.2);border-color:#fbbf24;color:#fbbf24}
    .chip:active{transform:scale(.96)}
    .spin-btn{width:100%;max-width:420px;padding:16px;border:none;border-radius:16px;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a0000;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px;cursor:pointer;box-shadow:0 6px 24px rgba(251,191,36,.35);transition:all .15s;font-weight:900}
    .spin-btn:active{transform:scale(.98);opacity:.9}
    .spin-btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
    .result{display:none;padding:13px 16px;border-radius:16px;text-align:center;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;width:100%;max-width:420px;animation:pop .3s cubic-bezier(.34,1.56,.64,1)}
    @keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
    .result.win{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;box-shadow:0 4px 16px rgba(22,163,74,.4)}
    .result.lose{background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.6)}
    .result.jackpot,.result.win-big{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a0000;box-shadow:0 4px 16px rgba(251,191,36,.5)}
    .game{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 16px;gap:14px;min-height:0}
</style>
</head>
<body>

<div class="hdr">
  <button class="btn-back" onclick="location.href='casino.html'">← CASINO</button>
  <div class="hdr-title">⛵ Régate</div>
  <div class="hdr-bal" id="balance">0€</div>
</div>

<div class="game">
<div class="table">
      <div class="finish-line">ARRIVEE 🏁</div>
      <div id="trackWrap"></div>
<div class="result" id="result"></div>
<div class="result" id="result"></div>
      <div class="chips">
        <div class="chip sel" id="c1000"  onclick="setBet(1000,'c1000')">1K</div>
        <div class="chip"     id="c5000"  onclick="setBet(5000,'c5000')">5K</div>
        <div class="chip"     id="c10000" onclick="setBet(10000,'c10000')">10K</div>
        <div class="chip"     id="c25000" onclick="setBet(25000,'c25000')">25K</div>
      </div>
      <button class="spin-btn" id="btnPlay" onclick="startRace()" disabled>CHOISIR UN BATEAU</button>
</div>

<script>

  var SUPABASE_URL = 'https://drtsuhnbclhmgfjiykap.supabase.co';
  var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
  var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  function fmt(n) { return Math.floor(n).toLocaleString('fr-FR'); }
  function el(id) { return document.getElementById(id); }

  var money = parseInt(localStorage.getItem("bd_money")||"0"), bet = 1000, currentUser = null, busy = false, selectedBoat = -1;

  var BOATS = [
    {boat:'[1]', name:'MISTRAL',    odds:2.5,  prob:0.35, color:'#0ea5e9'},
    {boat:'[2]', name:'TRAMONTANE', odds:3.5,  prob:0.25, color:'#22c55e'},
    {boat:'[3]', name:'SIROCCO',    odds:4.4,  prob:0.20, color:'#f59e0b'},
    {boat:'[4]', name:'LIBECCIO',   odds:6.7,  prob:0.13, color:'#a855f7'},
    {boat:'[5]', name:'PONANT',     odds:12.5, prob:0.07, color:'#f87171'}
  ];

  function buildTracks() {
    var wrap = el('trackWrap');
    wrap.innerHTML = '';
    for (var i = 0; i < BOATS.length; i++) {
      (function(idx) {
        var b = BOATS[idx];
        var div = document.createElement('div');
        div.className = 'track';
        div.id = 'track' + idx;
        div.innerHTML =
          '<div class="track-bar" id="bar' + idx + '" style="background:' + b.color + '"></div>' +
          '<div class="track-boat">' + b.boat + '</div>' +
          '<div class="track-name">' + b.name + '</div>' +
          '<div class="track-odds" id="odds' + idx + '">' + b.odds.toFixed(1) + 'x</div>';
        div.onclick = function() { selectBoat(idx); };
        wrap.appendChild(div);
      })(i);
    }
  }

  function selectBoat(idx) {
    if (busy) return;
    selectedBoat = idx;
    for (var i = 0; i < BOATS.length; i++) {
      var t = el('track' + i);
      if (t) t.className = (i === idx) ? 'track sel' : 'track';
    }
    var btn = el('btnPlay');
    btn.disabled = false;
    btn.textContent = 'PARIER SUR ' + BOATS[idx].name + ' — x' + BOATS[idx].odds.toFixed(1);
  }

  function setBet(val, id) {
    bet = val;
    var ids = ['c1000','c5000','c10000','c25000'];
    for (var i = 0; i < ids.length; i++) {
      el(ids[i]).classList.toggle('sel', ids[i] === id);
    }
    if (selectedBoat >= 0) {
      el('btnPlay').textContent = 'PARIER SUR ' + BOATS[selectedBoat].name + ' — x' + BOATS[selectedBoat].odds.toFixed(1);
    }
  }

  function updateBal() { el('balance').textContent = fmt(money) + '\u20ac'; }

  function weightedRandom() {
    var r = Math.random(), cum = 0;
    for (var i = 0; i < BOATS.length; i++) {
      cum += BOATS[i].prob;
      if (r < cum) return i;
    }
    return BOATS.length - 1;
  }

  function startRace() {
    if (busy || selectedBoat < 0 || money < bet || bet <= 0) return;
    busy = true;
    money -= bet;
    updateBal();
    el('btnPlay').disabled = true;
    el('result').style.display = 'none';

    // Bloquer sélection
    for (var i = 0; i < BOATS.length; i++) {
      el('track' + i).onclick = null;
      el('track' + i).style.cursor = 'default';
    }

    var winner = weightedRandom();
    var positions = [0, 0, 0, 0, 0];
    var speeds = [];
    for (var i = 0; i < BOATS.length; i++) {
      speeds.push(0.6 + Math.random() * 1.2);
    }
    speeds[winner] *= 1.25;

    var raceInterval = setInterval(function() {
      var done = false;
      for (var i = 0; i < BOATS.length; i++) {
        positions[i] = Math.min(positions[i] + speeds[i] * (0.8 + Math.random() * 0.4), 100);
        var bar = el('bar' + i);
        if (bar) bar.style.width = positions[i] + '%';
      }
      if (positions[winner] >= 100) {
        clearInterval(raceInterval);
        endRace(winner);
      }
    }, 80);
  }

  function endRace(winner) {
    for (var i = 0; i < BOATS.length; i++) {
      var t = el('track' + i);
      if (!t) continue;
      t.classList.remove('sel');
      t.classList.add(i === winner ? 'winner' : 'loser');
    }

    var r = el('result');
    if (winner === selectedBoat) {
      var gain = Math.floor(bet * BOATS[winner].odds);
      money += gain;
      updateBal();
      r.textContent = '\ud83c\udfc6 ' + BOATS[winner].name + ' GAGNE ! +' + fmt(gain) + '\u20ac';
      r.className = 'result win';
    } else {
      r.textContent = '\ud83c\udfc1 ' + BOATS[winner].name + ' GAGNE \u2014 RAT\u00c9 !';
      r.className = 'result lose';
    }
    r.style.display = 'block';

    if (currentUser) {
      saveMoney(money);
    }

    setTimeout(function() {
      buildTracks();
      selectedBoat = -1;
      el('btnPlay').disabled = true;
      el('btnPlay').textContent = 'CHOISIR UN BATEAU';
      busy = false;
    }, 2500);
  }

  async function init() {
    try {
      var res = await sb.auth.getSession();
      var session = res.data && res.data.session;
      if (!session || res.error) {
        await sb.auth.signOut().catch(function(){});
        window.location.href = 'index.html'; return;
      }
      currentUser = session.user;
      var dres = await sb.from('game_stats').select('money').eq('user_id', currentUser.id).maybeSingle();
      money = (dres.data && dres.data.money) || 0;
      updateBal();
      buildTracks();
    } catch(e) {
      console.error('init error:', e);
      buildTracks();
    }
  }

  document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
  document.addEventListener('gesturechange', function(e) { e.preventDefault(); });

  async function saveMoney(amount) {
    const val = Math.floor(amount);
    localStorage.setItem('bd_money', val);
    if (!currentUser) return;
    for (let i = 0; i < 3; i++) {
      const { error } = await sb.from('game_stats').update({ money: val }).eq('user_id', currentUser.id);
      if (!error) return;
      await new Promise(r => setTimeout(r, 400));
    }
    console.warn('saveMoney: échec après 3 tentatives');
  }

  init().then(function(){ 
    setTimeout(function(){
      var b=document.getElementById('balance');
      if(b && (b.textContent==='0€' || b.textContent==='0&#8364;')){
        b.textContent=(money||0).toLocaleString('fr-FR')+'€';
      }
    }, 2000);
  });

document.addEventListener('gesturestart',function(e){e.preventDefault();},{passive:false});
document.addEventListener('gesturechange',function(e){e.preventDefault();},{passive:false});
document.addEventListener('touchmove',function(e){if(e.touches.length>1)e.preventDefault();},{passive:false});
document.addEventListener('dblclick',function(e){e.preventDefault();});
document.addEventListener('selectstart',function(e){e.preventDefault();});
document.addEventListener('contextmenu',function(e){e.preventDefault();});
</script>
</body>
</html>
