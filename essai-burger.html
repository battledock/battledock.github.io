<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crousti’Port · le burger</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;background:#241c16;font-family:Georgia,serif;overflow:hidden;
  touch-action:none;overscroll-behavior:none}
#ec{position:fixed;inset:0;display:flex;flex-direction:column}
/* l'en-tête */
#tete{flex:none;background:linear-gradient(180deg,#c8281e,#8a1a12);border-bottom:3px solid #e8b030;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;display:flex;align-items:center;gap:9px}
#tete b{flex:1;font:900 15px Georgia;color:#fff6e0;letter-spacing:.5px}
#tete b i{display:block;font:italic 10px Georgia;color:#ffd9a8;font-weight:400}
#tete .paye{background:#5a1008;border:1px solid #e8b030;border-radius:13px;padding:5px 9px;text-align:right}
#tete .paye span{display:block;font:700 6px Arial;letter-spacing:1.4px;color:#f0b89a}
#tete .paye b{display:block;font:700 12px Georgia;color:#ffd76a}
/* la commande */
#cmd{flex:none;background:#2f2820;padding:9px 12px;display:flex;align-items:center;gap:9px}
#cmd .q{flex:1;min-width:0}
#cmd .q small{display:block;font:700 6.5px Arial;letter-spacing:1.8px;color:#b8a888}
#cmd .q b{display:block;font:700 13px Georgia;color:#f6efdc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chrono{flex:none;width:62px;height:6px;border-radius:3px;background:#1a1510;overflow:hidden}
#chrono i{display:block;height:100%;background:linear-gradient(90deg,#8ae0a0,#e8c040 60%,#e05a3a)}
/* la scène */
#scene{flex:1;position:relative;overflow:hidden;background:
  radial-gradient(ellipse at 50% 34%,#3f342a,#241c16 72%)}
#planche{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;width:290px;height:20px;
  background:#8a6238;border-radius:7px 7px 0 0;box-shadow:0 -3px 0 #a5764a inset}
#pile{position:absolute;left:50%;transform:translateX(-50%);bottom:38px;width:230px}
.et{height:18px;border-radius:7px;margin-top:-3px;position:relative;
  box-shadow:0 2px 4px rgba(0,0,0,.3);animation:tombe .22s cubic-bezier(.3,1.6,.5,1)}
@keyframes tombe{from{transform:translateY(-54px) scaleX(.88);opacity:.2}to{transform:none;opacity:1}}
.et.bas{height:22px;border-radius:7px 7px 11px 11px}
.et.haut{height:26px;border-radius:14px 14px 6px 6px}
#fantome{position:absolute;left:50%;transform:translateX(-50%);bottom:38px;width:230px;
  opacity:.3;pointer-events:none;filter:grayscale(.5)}
#fantome:after{content:'LE MODÈLE';position:absolute;left:0;right:0;bottom:100%;margin-bottom:6px;
  text-align:center;font:700 7px Arial;letter-spacing:2px;color:#8a7a66}
#fantome .et{animation:none;box-shadow:none}
#bravo{position:absolute;left:0;right:0;top:16px;text-align:center;font:900 20px Georgia;
  color:#ffd76a;opacity:0;transform:scale(.8);transition:.18s;text-shadow:0 2px 0 rgba(0,0,0,.35)}
#bravo.on{opacity:1;transform:scale(1)}
/* les ingrédients */
#bac{flex:none;background:#f6efdc;border-top:3px solid #e8b030;padding:10px 10px calc(env(safe-area-inset-bottom,0px) + 12px)}
#aide{text-align:center;font:italic 11.5px Georgia;color:#8a7454;margin-bottom:8px;min-height:17px}
#gr{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.ing{background:#fff;border:1px solid #e0d3b4;border-radius:10px;padding:7px 4px 6px;text-align:center;
  box-shadow:0 2px 0 rgba(120,96,56,.14);transition:transform .1s}
.ing:active{transform:scale(.94)}
.ing .v{height:19px;border-radius:5px;margin-bottom:4px}
.ing small{font:700 8px Arial;letter-spacing:.6px;color:#5f4d34}
#fin{position:absolute;inset:0;z-index:9;display:none;flex-direction:column;align-items:center;
  justify-content:center;background:rgba(36,28,22,.94);text-align:center;padding:24px}
#fin.on{display:flex}
#fin b{font:900 30px Georgia;color:#ffd76a}
#fin p{font:italic 14px Georgia;color:#e8dcc0;margin-top:8px;line-height:1.5}
#fin button{margin-top:18px;border:0;border-radius:11px;padding:15px 28px;background:#c8281e;
  color:#fff6e0;font:700 11px Arial;letter-spacing:2px}
</style></head><body>
<div id="ec">
  <div id="tete"><b>CROUSTI’PORT<i id="sous">Service · burger 3</i></b>
    <span class="paye"><span>TA PAIE</span><b id="paye">6,40 €</b></span></div>
  <div id="cmd"><div class="q"><small>LA COMMANDE</small><b id="recette">—</b></div>
    <div id="chrono"><i></i></div></div>
  <div id="scene">
    <div id="bravo"></div>
    <div id="fantome"></div>
    <div id="pile"></div>
    <div id="planche"></div>
  </div>
  <div id="bac"><div id="aide">Pose les ingrédients de bas en haut.</div><div id="gr"></div></div>
</div>
<div id="fin"><b id="finT"></b><p id="finP"></p><button id="rej">UN AUTRE</button></div>
<script>
const $=(id)=>document.getElementById(id);
const vib=n=>{try{navigator.vibrate&&navigator.vibrate(n);}catch(e){}};
/* les ingrédients : couleur, nom, et la classe de forme */
const ING={
 pain_bas:['#d8a048','pain',' bas'],  steak:['#6a4028','steak',''],
 cheddar:['#e8a83a','cheddar',''],    salade:['#6aa83a','salade',''],
 tomate:['#c8402a','tomate',''],      oignon:['#e8dcd0','oignon',''],
 cornichon:['#8aa83a','cornichon',''],bacon:['#b4553a','bacon',''],
 sauce:['#e8c46a','sauce',''],        poisson:['#9fc0d0','poisson',''],
 pain_haut:['#d8a048','pain',' haut']};
const RECETTES=[
 ['Le Docker','pain_bas,steak,cheddar,salade,pain_haut'],
 ['Le Marseillais','pain_bas,poisson,tomate,oignon,sauce,pain_haut'],
 ['Le Gros Cargo','pain_bas,steak,bacon,cheddar,cornichon,salade,pain_haut'],
 ['Le Végé du Quai','pain_bas,salade,tomate,oignon,cornichon,sauce,pain_haut']];
let R=[], pose=0, paye=640, nb=3, t0=0, duree=18000, boucle=0, fini=false;
function etage(id,fantome){
  const [c,n,cl]=ING[id];
  const d=document.createElement('div');
  d.className='et'+cl;d.style.background=c;
  if(id==='salade')d.style.background='repeating-linear-gradient(90deg,#6aa83a 0 7px,#8ac84a 7px 14px)';
  if(id==='bacon')d.style.background='repeating-linear-gradient(90deg,#b4553a 0 6px,#e09070 6px 11px)';
  if(cl===' haut')d.style.background='linear-gradient(180deg,#e8b45a,#c88a38)';
  if(fantome)d.style.opacity='1';
  return d;}
function rendreFantome(){
  const f=$('fantome');f.innerHTML='';
  for(let i=R.length-1;i>=0;i--)f.appendChild(etage(R[i],true));}
function rendreIng(){
  const g=$('gr');g.innerHTML='';
  Object.keys(ING).forEach(id=>{
    const [c,n]=ING[id];
    const b=document.createElement('div');b.className='ing';
    b.innerHTML='<div class="v" style="background:'+c+'"></div><small>'+n+'</small>';
    b.onpointerdown=(ev)=>{ev.preventDefault();poser(id);};
    g.appendChild(b);});}
function nouvelle(){
  const [nom,l]=RECETTES[Math.floor(Math.random()*RECETTES.length)];
  R=l.split(',');pose=0;fini=false;
  $('recette').textContent=nom+' · '+R.length+' étages';
  $('pile').innerHTML='';rendreFantome();
  $('aide').textContent='Pose les ingrédients de bas en haut.';
  $('fin').classList.remove('on');
  t0=performance.now();duree=4000+R.length*2600;
  cancelAnimationFrame(boucle);tic();}
function tic(){
  boucle=requestAnimationFrame(tic);
  if(fini)return;
  const k=1-(performance.now()-t0)/duree;
  $('chrono').firstElementChild.style.width=Math.max(0,k*100)+'%';
  if(k<=0)rate('Le client est parti.','Trop long : il a filé chez le voisin.');}
function poser(id){
  if(fini)return;
  if(id!==R[pose]){
    vib(26);$('aide').textContent='Pas celui-là : il faut ' + ING[R[pose]][1] + '.';
    const s=$('scene');s.style.transform='translateX(4px)';
    setTimeout(()=>s.style.transform='translateX(-4px)',60);
    setTimeout(()=>s.style.transform='',120);
    paye=Math.max(0,paye-30);$('paye').textContent=(paye/100).toFixed(2).replace('.',',')+' €';
    return;}
  const p=$('pile');p.insertBefore(etage(id),p.firstChild);
  pose++;vib(9);
  $('fantome').style.opacity=String(0.22*(1-pose/R.length));
  $('aide').textContent=pose<R.length?('Et maintenant : '+ING[R[pose]][1]+'.'):'';
  if(pose>=R.length)reussi();}
function montre(t){const b=$('bravo');b.textContent=t;b.classList.add('on');
  setTimeout(()=>b.classList.remove('on'),700);}
function reussi(){
  fini=true;cancelAnimationFrame(boucle);
  const reste=Math.max(0,1-(performance.now()-t0)/duree);
  const prime=Math.round(reste*180), gain=120+R.length*40+prime;
  paye+=gain;$('paye').textContent=(paye/100).toFixed(2).replace('.',',')+' €';
  montre('SERVI !');vib([14,30,14]);
  setTimeout(()=>{
    $('finT').textContent='+ '+(gain/100).toFixed(2).replace('.',',')+' €';
    $('finP').innerHTML='Burger servi en '+((performance.now()-t0)/1000).toFixed(1).replace('.',',')+' s.'+
      (prime>40?'<br>Prime de rapidité : '+(prime/100).toFixed(2).replace('.',',')+' €':'');
    $('fin').classList.add('on');},700);}
function rate(t,p){
  fini=true;cancelAnimationFrame(boucle);vib([40,60,40]);
  $('finT').textContent=t;$('finP').textContent=p;$('fin').classList.add('on');}
$('rej').onpointerup=(ev)=>{ev.stopPropagation();nb++;$('sous').textContent='Service · burger '+nb;nouvelle();};
rendreIng();nouvelle();
</script></body></html>
