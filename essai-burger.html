<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crousti’Port · le burger</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;background:#241c16;font-family:Georgia,serif;overflow:hidden;
  touch-action:none;overscroll-behavior:none}
#ec{position:fixed;inset:0;display:flex;flex-direction:column}
/* l'en-tête */
#tete{flex:none;background:linear-gradient(180deg,#c8281e,#8a1a12);border-bottom:3px solid #e8b030;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;display:flex;align-items:center;gap:9px}
#tete b{flex:1;font:900 15px Georgia;color:#fff6e0;letter-spacing:.5px}
#tete b i{display:block;font:italic 10px Georgia;color:#ffd9a8;font-weight:400}
#tete .paye{background:#5a1008;border:1px solid #e8b030;border-radius:13px;padding:5px 9px;text-align:right}
#tete .paye span{display:block;font:700 6px Arial;letter-spacing:1.4px;color:#f0b89a}
#tete .paye b{display:block;font:700 12px Georgia;color:#ffd76a}
/* la commande */
#cmd{flex:none;background:#2f2820;padding:9px 12px;display:flex;align-items:center;gap:9px}
#cmd .q{flex:1;min-width:0}
#cmd .q small{display:block;font:700 6.5px Arial;letter-spacing:1.8px;color:#b8a888}
#cmd .q b{display:block;font:700 13px Georgia;color:#f6efdc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chrono{flex:none;width:62px;height:6px;border-radius:3px;background:#1a1510;overflow:hidden}
#chrono i{display:block;height:100%;background:linear-gradient(90deg,#8ae0a0,#e8c040 60%,#e05a3a)}
/* la scène */
#scene{flex:1;position:relative;overflow:hidden;background:
  radial-gradient(ellipse at 50% 34%,#3f342a,#241c16 72%)}
#planche{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;width:290px;height:20px;
  background:#8a6238;border-radius:7px 7px 0 0;box-shadow:0 -3px 0 #a5764a inset}
#pile{position:absolute;left:50%;transform:translateX(-50%);bottom:38px;width:230px}
.et{height:18px;border-radius:7px;margin-top:-3px;position:relative;
  box-shadow:0 2px 4px rgba(0,0,0,.3);animation:tombe .22s cubic-bezier(.3,1.6,.5,1)}
@keyframes tombe{from{transform:translateY(-54px) scaleX(.88);opacity:.2}to{transform:none;opacity:1}}
.et.bas{height:22px;border-radius:7px 7px 11px 11px}
.et.haut{height:26px;border-radius:14px 14px 6px 6px}
#fantome{position:absolute;left:50%;transform:translateX(-50%);bottom:38px;width:230px;
  opacity:.3;pointer-events:none;filter:grayscale(.5)}
#fantome:after{content:'LE MODÈLE';position:absolute;left:0;right:0;bottom:100%;margin-bottom:6px;
  text-align:center;font:700 7px Arial;letter-spacing:2px;color:#8a7a66}
#fantome .et{animation:none;box-shadow:none}
#bravo{position:absolute;left:0;right:0;top:16px;text-align:center;font:900 20px Georgia;
  color:#ffd76a;opacity:0;transform:scale(.8);transition:.18s;text-shadow:0 2px 0 rgba(0,0,0,.35)}
#bravo.on{opacity:1;transform:scale(1)}
/* les ingrédients */
#bac{flex:none;background:#f6efdc;border-top:3px solid #e8b030;padding:10px 10px calc(env(safe-area-inset-bottom,0px) + 12px)}
#aide{text-align:center;font:italic 11.5px Georgia;color:#8a7454;margin-bottom:8px;min-height:17px}
#gr{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.ing{background:#fff;border:1px solid #e0d3b4;border-radius:10px;padding:7px 4px 6px;text-align:center;
  box-shadow:0 2px 0 rgba(120,96,56,.14);transition:transform .1s}
.ing:active{transform:scale(.94)}
.ing .v{height:19px;border-radius:5px;margin-bottom:4px}
.ing small{font:700 8px Arial;letter-spacing:.6px;color:#5f4d34}
#fin{position:absolute;inset:0;z-index:9;display:none;flex-direction:column;align-items:center;
  justify-content:center;background:rgba(36,28,22,.94);text-align:center;padding:24px}
#fin.on{display:flex}
#fin b{font:900 30px Georgia;color:#ffd76a}
#fin p{font:italic 14px Georgia;color:#e8dcc0;margin-top:8px;line-height:1.5}
#fin button{margin-top:18px;border:0;border-radius:11px;padding:15px 28px;background:#c8281e;
  color:#fff6e0;font:700 11px Arial;letter-spacing:2px}
/* le client */
#tete2{width:38px;height:38px;image-rendering:pixelated;flex:none;border-radius:9px;background:#443a30}
#bulle{position:absolute;left:58px;right:14px;top:calc(env(safe-area-inset-top,0px) + 62px);
  background:#f6efdc;border-radius:11px;padding:9px 12px;font:italic 12.5px Georgia;color:#2f2820;
  box-shadow:0 5px 14px rgba(0,0,0,.4);opacity:0;transform:translateY(-7px);transition:.2s;
  pointer-events:none;z-index:8}
#bulle.on{opacity:1;transform:none}
#bulle:before{content:'';position:absolute;left:14px;top:-7px;border:7px solid transparent;
  border-bottom-color:#f6efdc;border-top:0}
/* les étages restants */
/* les dix burgers du service */
#dix{flex:none;display:flex;gap:4px;padding:7px 12px;background:#1a1510;justify-content:center}
#dix i{flex:1;max-width:28px;height:6px;border-radius:3px;background:#3a3026}
#dix i.ok{background:linear-gradient(90deg,#e8b030,#ffd76a)}
#dix i.en{background:#c8281e}
#reste{display:flex;gap:5px;justify-content:center;margin-bottom:8px;min-height:13px}
#reste i{width:22px;height:9px;border-radius:3px;opacity:.9;box-shadow:0 1px 0 rgba(120,96,56,.3)}
#reste i.fait{opacity:.18}
/* la série */
#combo{position:absolute;right:12px;top:14px;background:rgba(200,40,30,.92);color:#ffd76a;
  border-radius:11px;padding:5px 11px;font:900 14px Georgia;opacity:0;transform:scale(.7);
  transition:.16s;z-index:7}
#combo.on{opacity:1;transform:scale(1)}
/* les étincelles */
.pouf{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffd76a;pointer-events:none;
  animation:pouf .5s ease-out forwards}
@keyframes pouf{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
/* l'étage qui rate : il glisse et tombe */
@keyframes chute{to{transform:translate(90px,120px) rotate(38deg);opacity:0}}
.et.rate{animation:chute .42s ease-in forwards}
/* le papier d'emballage à la fin */
/* le papier se referme sur le burger, puis le plateau part à droite */
#papier{position:absolute;left:50%;bottom:38px;width:252px;height:0;border-radius:12px;
  background:repeating-linear-gradient(45deg,#f6efdc 0 9px,#ffffff 9px 18px);
  box-shadow:0 6px 18px rgba(0,0,0,.4);z-index:4;opacity:0;
  transform:translateX(-50%);transition:height .26s ease-out,opacity .12s}
#papier.on{height:118px;opacity:1}
#pile.part,#papier.part{animation:part .5s ease-in forwards}
@keyframes part{to{transform:translateX(calc(-50% + 240px)) rotate(7deg);opacity:0}}
</style></head><body>
<div id="ec">
  <div id="tete"><b>CROUSTI’PORT<i id="sous">Service · burger 1 sur 10</i></b>
    <span class="paye"><span>TA PAIE</span><b id="paye">6,40 €</b></span></div>
  <div id="dix"></div>
  <div id="cmd"><canvas id="tete2" width="112" height="112"></canvas>
    <div class="q"><small id="qui">LE CLIENT</small><b id="recette">—</b></div>
    <div id="chrono"><i></i></div></div>
  <div id="bulle"></div>
  <div id="scene">
    <div id="bravo"></div><div id="combo"></div><div id="papier"></div>
    <div id="fantome"></div>
    <div id="pile"></div>
    <div id="planche"></div>
  </div>
  <div id="bac"><div id="reste"></div>
    <div id="aide">Pose les ingrédients de bas en haut.</div><div id="gr"></div></div>
</div>
<div id="fin"><b id="finT"></b><p id="finP"></p><button id="rej">UN AUTRE</button></div>
<script>
const $=(id)=>document.getElementById(id);
const vib=n=>{try{navigator.vibrate&&navigator.vibrate(n);}catch(e){}};
/* les ingrédients : couleur, nom, et la classe de forme */
const ING={
 pain_bas:['#d8a048','pain',' bas'],  steak:['#6a4028','steak',''],
 cheddar:['#e8a83a','cheddar',''],    salade:['#6aa83a','salade',''],
 tomate:['#c8402a','tomate',''],      oignon:['#e8dcd0','oignon',''],
 cornichon:['#8aa83a','cornichon',''],bacon:['#b4553a','bacon',''],
 sauce:['#e8c46a','sauce',''],        poisson:['#9fc0d0','poisson',''],
 pain_haut:['#d8a048','pain',' haut']};
const CLIENTS=[
 ['Un docker pressé','#c8281e','#4a3220',['Deux minutes, pas plus !','J’ai la grue qui m’attend.']],
 ['Une touriste','#e8a83a','#d9c48a',['C’est vous le fameux Crousti ?','On m’a dit que c’était le meilleur.']],
 ['Le vieux Marius','#5a6b8f','#c9c9c9',['Comme d’habitude, petit.','Et sans oignon, hein.']],
 ['Un gamin du quai','#2f7a4a','#8a5f30',['Le plus gros que vous avez !','Pépé paie.']],
 ['Fanny du bar','#8a4a6a','#1c140d',['Je ferme dans dix minutes.','Fais-moi plaisir.']]];
const BRAVOS=['NICKEL !','PILE POIL','BIEN VU','ET D’UN !','ÇA GLISSE'];
const RECETTES=[
 ['Le Docker','pain_bas,steak,cheddar,salade,pain_haut'],
 ['Le Marseillais','pain_bas,poisson,tomate,oignon,sauce,pain_haut'],
 ['Le Gros Cargo','pain_bas,steak,bacon,cheddar,cornichon,salade,pain_haut'],
 ['Le Végé du Quai','pain_bas,salade,tomate,oignon,cornichon,sauce,pain_haut']];
let R=[], pose=0, paye=0, nb=0, t0=0, duree=18000, boucle=0, fini=false, serie=0;
const TOTAL=10;
function rendreDix(){const d=$('dix');d.innerHTML='';
  for(let i=0;i<TOTAL;i++){const e2=document.createElement('i');
    e2.className=i<nb-1?'ok':(i===nb-1?'en':'');d.appendChild(e2);}}
function etage(id,fantome){
  const [c,n,cl]=ING[id];
  const d=document.createElement('div');
  d.className='et'+cl;d.style.background=c;
  if(id==='salade')d.style.background='repeating-linear-gradient(90deg,#6aa83a 0 7px,#8ac84a 7px 14px)';
  if(id==='bacon')d.style.background='repeating-linear-gradient(90deg,#b4553a 0 6px,#e09070 6px 11px)';
  if(cl===' haut')d.style.background='linear-gradient(180deg,#e8b45a,#c88a38)';
  if(fantome)d.style.opacity='1';
  return d;}
function rendreFantome(){
  const f=$('fantome');f.innerHTML='';
  for(let i=R.length-1;i>=0;i--)f.appendChild(etage(R[i],true));}
function rendreIng(){
  const g=$('gr');g.innerHTML='';
  Object.keys(ING).forEach(id=>{
    const [c,n]=ING[id];
    const b=document.createElement('div');b.className='ing';
    b.innerHTML='<div class="v" style="background:'+c+'"></div><small>'+n+'</small>';
    b.onpointerdown=(ev)=>{ev.preventDefault();poser(id);};
    g.appendChild(b);});}
function tete(c1,c2){
  const cv=$('tete2'),g=cv.getContext('2d');g.imageSmoothingEnabled=false;
  const S=cv.width/28;g.setTransform(S,0,0,S,0,0);g.clearRect(0,0,28,28);
  const R2=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x,y,w,h);};
  R2(7,4,14,6,c2);R2(6,9,16,12,'#e8c8a8');R2(6,9,16,2,c2);
  R2(10,13,2.4,2.4,'#2a1a14');R2(16,13,2.4,2.4,'#2a1a14');R2(12,18,5,1.4,'#b08a6a');
  R2(4,21,20,7,c1);R2(4,21,20,2,'rgba(255,255,255,.3)');}
function direBulle(t){const b=$('bulle');b.textContent='« '+t+' »';b.classList.add('on');
  clearTimeout(direBulle.t);direBulle.t=setTimeout(()=>b.classList.remove('on'),2400);}
function rendreReste(){
  const r=$('reste');r.innerHTML='';
  R.forEach((id,i)=>{const e2=document.createElement('i');
    e2.style.background=ING[id][0];if(i<pose)e2.className='fait';r.appendChild(e2);});}
function etincelles(n){
  const s2=$('scene'),r=$('pile').getBoundingClientRect(),rs=s2.getBoundingClientRect();
  for(let i=0;i<n;i++){const d=document.createElement('span');d.className='pouf';
    d.style.left=(r.left-rs.left+r.width/2)+'px';d.style.top=(r.top-rs.top)+'px';
    d.style.setProperty('--dx',(Math.random()*120-60)+'px');
    d.style.setProperty('--dy',(-30-Math.random()*60)+'px');
    s2.appendChild(d);setTimeout(()=>d.remove(),520);}}
function nouvelle(){
  nb++;
  if(nb>TOTAL){finService();return;}
  $('sous').textContent='Service · burger '+nb+' sur '+TOTAL;
  rendreDix();
  const [nom,l]=RECETTES[Math.floor(Math.random()*RECETTES.length)];
  const C=CLIENTS[Math.floor(Math.random()*CLIENTS.length)];
  tete(C[1],C[2]);$('qui').textContent=C[0].toUpperCase();
  setTimeout(()=>direBulle(C[3][Math.floor(Math.random()*C[3].length)]),380);
  serie=0;$('combo').classList.remove('on');
  $('papier').classList.remove('on');
  R=l.split(',');pose=0;fini=false;
  $('recette').textContent=nom+' · '+R.length+' étages';
  rendreReste();
  $('pile').classList.remove('part');$('papier').classList.remove('part');
  $('pile').innerHTML='';rendreFantome();
  $('aide').textContent='Pose les ingrédients de bas en haut.';
  $('fin').classList.remove('on');
  t0=performance.now();duree=4000+R.length*2600;
  cancelAnimationFrame(boucle);tic();}
function tic(){
  boucle=requestAnimationFrame(tic);
  if(fini)return;
  const k=1-(performance.now()-t0)/duree;
  $('chrono').firstElementChild.style.width=Math.max(0,k*100)+'%';
  if(k<=0)rate('Le client est parti.','Trop long : il a filé chez le voisin.');}
function poser(id){
  if(fini)return;
  if(id!==R[pose]){
    vib(26);$('aide').textContent='Pas celui-là : il faut ' + ING[R[pose]][1] + '.';
    const p2=$('pile'), t=etage(id);t.classList.add('rate');
    p2.insertBefore(t,p2.firstChild);setTimeout(()=>t.remove(),430);
    serie=0;$('combo').classList.remove('on');
    const s=$('scene');s.style.transition='transform .06s';s.style.transform='translateX(5px)';
    setTimeout(()=>s.style.transform='translateX(-5px)',60);
    setTimeout(()=>{s.style.transform='';s.style.transition='';},120);
    paye=Math.max(0,paye-30);$('paye').textContent=(paye/100).toFixed(2).replace('.',',')+' €';
    return;}
  const p=$('pile'), el=etage(id);
  el.style.marginLeft=(Math.random()*9-4.5)+'px';     /* chaque burger est fait main */
  p.insertBefore(el,p.firstChild);
  pose++;vib(9);serie++;
  if(serie>=3){const c=$('combo');c.textContent='×'+serie;c.classList.add('on');}
  if(serie===3||serie===6)montre(BRAVOS[Math.floor(Math.random()*BRAVOS.length)]);
  etincelles(serie>=3?7:3);
  $('fantome').style.opacity=String(0.3*(1-pose/R.length));
  rendreReste();
  $('aide').textContent=pose<R.length?('Et maintenant : '+ING[R[pose]][1]+'.'):'';
  if(pose>=R.length)reussi();}
function montre(t){const b=$('bravo');b.textContent=t;b.classList.add('on');
  setTimeout(()=>b.classList.remove('on'),700);}
function reussi(){
  fini=true;cancelAnimationFrame(boucle);
  const reste=Math.max(0,1-(performance.now()-t0)/duree);
  const prime=Math.round(reste*180), gain=120+R.length*40+prime;
  paye+=gain;$('paye').textContent=(paye/100).toFixed(2).replace('.',',')+' €';
  montre('SERVI !');vib([14,30,14]);etincelles(16);
  setTimeout(()=>$('papier').classList.add('on'),180);
  setTimeout(()=>{$('papier').classList.add('part');$('pile').classList.add('part');},680);
  direBulle(reste>0.5?'Rapide, merci !':'Ça valait l’attente.');
  setTimeout(()=>{
    $('finT').textContent='+ '+(gain/100).toFixed(2).replace('.',',')+' €';
    $('finP').innerHTML='Burger servi en '+((performance.now()-t0)/1000).toFixed(1).replace('.',',')+' s.'+
      (prime>40?'<br>Prime de rapidité : '+(prime/100).toFixed(2).replace('.',',')+' €':'');
    $('fin').classList.add('on');},700);}
function rate(t,p){
  fini=true;cancelAnimationFrame(boucle);vib([40,60,40]);
  $('finT').textContent=t;$('finP').textContent=p;$('fin').classList.add('on');}
function finService(){
  fini=true;cancelAnimationFrame(boucle);
  $('finT').textContent='Dix burgers servis';
  $('finP').innerHTML='Tu as gagné <b>'+(paye/100).toFixed(2).replace('.',',')+' €</b> au comptoir.<br>'+
    'Le patron te fait signe : « Passe au piano, j’ai les frites qui attendent. »';
  $('rej').textContent='AUX FRITES';
  $('rej').dataset.suite='frites';
  $('fin').classList.add('on');}
$('rej').onpointerup=(ev)=>{ev.stopPropagation();
  if($('rej').dataset.suite==='frites'){location.href='essai-frites.html';return;}
  nouvelle();};
rendreIng();nouvelle();
</script></body></html>
