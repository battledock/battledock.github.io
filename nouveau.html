<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Battle Dock — Nouveau</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="personnage.js"></script>
<script>
(function(){
'use strict';
const W=1000,H=1000;
const cv=document.getElementById('c');
const g=cv.getContext('2d');
let vw=window.innerWidth,vh=window.innerHeight;
cv.width=vw;cv.height=vh;

/* ========== PSEUDO-RANDOM DETERMINISTE ========== */
const alea=(n)=>{const v=Math.sin(n*127.1)*43758.5453;return v-Math.floor(v);};
const A=(i)=>alea(i*1.37+0.5);

/* ========== PALETTES (port.js) ========== */
const PIERRE=['#d6d2ca','#d2cec5','#dad6ce','#cfcbc2','#d4d0c8','#ccc8bf'];
const HERBE_CLAIR=['#5a9648','#528e42','#4e8a3c','#569444','#5c9a4c','#4a8638'];
const HERBE_FONCE=['#3e7e32','#468836','#3a7a2e','#428434','#4a8c3a','#367a2a'];
const CHEMIN=['#c8b898','#c4b494','#ccbc9c','#c0b090','#c8b898','#d0c0a0'];

/* ========== CONSTRUCTION DU SOL TOP-DOWN ========== */
/* Comme construireSolExtramar dans port.js : on grave tout le sol
   sur un canvas hors-écran, pixel par pixel là où c'est nécessaire,
   dalles par dalles sur les chemins de pierre. */

function construireSol(){
const c=document.createElement('canvas');
c.width=W;c.height=H;
const ctx=c.getContext('2d');
const R=(x,y,w,h,col)=>{ctx.fillStyle=col;ctx.fillRect(x|0,y|0,Math.max(1,w|0),Math.max(1,h|0));};

/* ================================================================
   FOND D'HERBE — tout le terrain est d'abord un pré
   Variation pixel par pixel, comme port.js varie ses dalles.
   ================================================================ */
for(let y=0;y<H;y++){
  for(let x=0;x<W;x++){
    const n=A(x*0.73+y*1.31);
    const pal=n>.5?HERBE_CLAIR:HERBE_FONCE;
    const ci=Math.floor(A(x*2.1+y*3.7)*pal.length);
    R(x,y,1,1,pal[ci]);
  }
}

/* ================================================================
   TACHES D'HERBE — zones plus sombres ou plus claires
   Comme les variations de teinte sur le quai de port.js.
   ================================================================ */
for(let i=0;i<120;i++){
  const cx=Math.floor(A(i+100)*W);
  const cy=Math.floor(A(i+200)*H);
  const r=8+Math.floor(A(i+300)*18);
  const dark=A(i+400)>.5;
  for(let dy=-r;dy<=r;dy++){
    for(let dx=-r;dx<=r;dx++){
      if(dx*dx+dy*dy>r*r) continue;
      const px=cx+dx,py=cy+dy;
      if(px<0||px>=W||py<0||py>=H) continue;
      const a=0.06+A(px*1.1+py*2.3)*0.08;
      R(px,py,1,1,dark?`rgba(30,50,15,${a})`:`rgba(120,180,80,${a})`);
    }
  }
}

/* ================================================================
   CHEMINS DE TERRE — des sentiers qui traversent la carte
   Un chemin principal est-ouest, un nord-sud, et quelques
   embranchements.
   ================================================================ */
function tracerChemin(points,largeur){
  for(let i=0;i<points.length-1;i++){
    const x0=points[i][0],y0=points[i][1];
    const x1=points[i+1][0],y1=points[i+1][1];
    const dist=Math.sqrt((x1-x0)**2+(y1-y0)**2);
    const steps=Math.ceil(dist);
    for(let s=0;s<=steps;s++){
      const t=s/steps;
      const cx=x0+(x1-x0)*t;
      const cy=y0+(y1-y0)*t;
      const demiL=largeur/2+Math.sin(s/8)*1.5;
      for(let d=-demiL;d<=demiL;d++){
        const nx=-(y1-y0)/dist, ny=(x1-x0)/dist;
        const px=Math.round(cx+nx*d);
        const py=Math.round(cy+ny*d);
        if(px<0||px>=W||py<0||py>=H) continue;
        const ci=Math.floor(A(px*1.3+py*0.7)*CHEMIN.length);
        R(px,py,1,1,CHEMIN[ci]);
      }
    }
  }
}

/* chemin principal est-ouest */
tracerChemin([[0,480],[120,490],[280,470],[450,500],[600,490],[780,510],[900,495],[1000,500]],28);
/* chemin principal nord-sud */
tracerChemin([[500,0],[490,150],[510,320],[500,500],[495,680],[505,850],[500,1000]],26);
/* embranchements */
tracerChemin([[280,470],[250,350],[220,200]],18);
tracerChemin([[780,510],[820,400],[850,280]],18);
tracerChemin([[500,500],[620,620],[700,780]],16);
tracerChemin([[500,500],[380,600],[300,750]],16);

/* détails sur les chemins : ornières, cailloux */
for(let i=0;i<200;i++){
  const cx=Math.floor(A(i+500)*W);
  const cy=Math.floor(A(i+600)*H);
  R(cx,cy,2,1,'rgba(100,80,50,.12)');
}

/* ================================================================
   DALLE DE PIERRE — une place centrale, dallesDuQuai style
   Un carré de 120×120 au croisement des chemins.
   ================================================================ */
{
const PX=440,PY=440,PW=120,PH=120;
/* fond uni */
for(let y=PY;y<PY+PH;y++){
  for(let x=PX;x<PX+PW;x++){
    R(x,y,1,1,'#d4d0c8');
  }
}
/* dalles rangée par rangée (dallesDuQuai) */
let rowY=0;
while(rowY<PH){
  const rowH=16+Math.floor(A(rowY*0.77+99)*9);
  let bx=PX-Math.floor(A(rowY*0.77+99)*20);
  while(bx<PX+PW){
    const bw=36+Math.floor(A(bx*0.31+rowY+99)*4)*10;
    const col=PIERRE[Math.floor(A(bx+rowY*3.1+99)*PIERRE.length)];
    const x0=Math.max(PX,bx),x1=Math.min(PX+PW,bx+bw);
    const y0=Math.max(PY,PY+rowY),y1=Math.min(PY+PH,PY+rowY+rowH);
    if(x0<x1&&y0<y1){
      R(x0,y0,x1-x0,y1-y0,col);
      /* joint haut */
      R(x0,y0,x1-x0,1,'rgba(118,114,106,.30)');
      /* joint gauche */
      if(bx>=PX) R(x0,y0,1,y1-y0,'rgba(118,114,106,.30)');
      /* grain */
      for(let gi=0;gi<3;gi++){
        const gx=x0+2+Math.floor(A(bx*1.9+rowY+gi+99)*(x1-x0-4));
        const gy=y0+2+Math.floor(A(bx*2.3+rowY*1.1+gi+99)*(y1-y0-4));
        R(gx,gy,2,1,'rgba(255,255,255,.12)');
      }
      /* usure */
      if(A(bx*1.7+rowY+99)<.12){
        const wx=x0+3+Math.floor(A(bx+99)*(x1-x0-7));
        const wy=y0+3+Math.floor(A(rowY+99)*(y1-y0-6));
        R(wx,wy,3,1,'rgba(110,108,104,.35)');
      }
    }
    bx+=bw;
  }
  rowY+=rowH;
}
/* bordure de la place */
R(PX,PY,PW,1,'rgba(80,70,55,.25)');
R(PX,PY,1,PH,'rgba(80,70,55,.25)');
R(PX,PY+PH-1,PW,1,'rgba(80,70,55,.20)');
R(PX+PW-1,PY,1,PH,'rgba(80,70,55,.20)');
}

/* ================================================================
   EAU — un étang au sud-est, avec reflets
   ================================================================ */
{
const EX=720,EY=200,ER=50;
for(let dy=-ER-4;dy<=ER+4;dy++){
  for(let dx=-ER-4;dx<=ER+4;dx++){
    const d=Math.sqrt(dx*dx+dy*dy);
    if(d>ER+4) continue;
    const px=EX+dx,py=EY+dy;
    if(px<0||px>=W||py<0||py>=H) continue;
    if(d>ER){
      /* berge */
      R(px,py,1,1,'#6a8a52');
    } else {
      /* eau avec variation de teinte (port.js style) */
      const n=A(px*1.7+py*2.3);
      const b=Math.floor(140+n*30);
      const gb=Math.floor(160+n*20);
      R(px,py,1,1,`rgb(${60+Math.floor(n*20)},${gb},${b})`);
      /* reflets */
      if(A(px*3.1+py*0.9)>.92) R(px,py,1,1,'rgba(200,230,255,.25)');
    }
  }
}
}

/* ================================================================
   ARBRES VUS DU DESSUS — tronc + couronne circulaire
   ================================================================ */
const ARBRES=[];
for(let i=0;i<55;i++){
  const tx=Math.floor(A(i+700)*W);
  const ty=Math.floor(A(i+800)*H);
  /* pas sur les chemins ni la place */
  const surChemin=Math.abs(ty-490)<20||Math.abs(tx-500)<18;
  const surPlace=tx>430&&tx<570&&ty>430&&ty<570;
  const surEau=Math.sqrt((tx-720)**2+(ty-200)**2)<60;
  if(surChemin||surPlace||surEau) continue;
  const cr=6+Math.floor(A(i+900)*6);
  ARBRES.push({x:tx,y:ty,r:cr});
  /* ombre au sol */
  for(let dy=-cr-2;dy<=cr+2;dy++){
    for(let dx=-cr-2;dx<=cr+2;dx++){
      if(dx*dx+dy*dy>(cr+2)*(cr+2)) continue;
      const px=tx+dx+3,py=ty+dy+3;
      if(px>=0&&px<W&&py>=0&&py<H) R(px,py,1,1,'rgba(0,0,0,.08)');
    }
  }
  /* couronne */
  for(let dy=-cr;dy<=cr;dy++){
    for(let dx=-cr;dx<=cr;dx++){
      if(dx*dx+dy*dy>cr*cr) continue;
      const px=tx+dx,py=ty+dy;
      if(px<0||px>=W||py<0||py>=H) continue;
      const n=A(px*2.7+py*1.3);
      const gc=n>.5?'#3a7a2e':'#468838';
      R(px,py,1,1,gc);
      /* lumière (haut-gauche, port.js style) */
      if(dx<-cr*0.3&&dy<-cr*0.3&&A(px+py*3)>.6) R(px,py,1,1,'rgba(120,200,80,.25)');
    }
  }
  /* tronc au centre */
  R(tx-1,ty-1,3,3,'#5a4030');
  R(tx,ty,1,1,'#6a5040');
}

/* ================================================================
   FLEURS ET DETAILS
   ================================================================ */
for(let i=0;i<60;i++){
  const fx=Math.floor(A(i+1000)*W);
  const fy=Math.floor(A(i+1100)*H);
  const fc=['#e84848','#e8c848','#e848a8','#48a8e8','#e8e848','#e89848','#ffffff'][Math.floor(A(i+1200)*7)];
  R(fx,fy,2,2,fc);
  R(fx,fy,1,1,'rgba(255,255,255,.3)');
}
/* petits cailloux */
for(let i=0;i<40;i++){
  const sx=Math.floor(A(i+1300)*W);
  const sy=Math.floor(A(i+1400)*H);
  R(sx,sy,2,2,'#9a9282');
  R(sx,sy,2,1,'#b0a898');
}

return c;
}

/* ========== CONSTRUCTION ========== */
const TERRAIN=construireSol();

/* ========== JOUEUR ========== */
const PJ={x:500,y:500,vx:0,vy:0,dir:'bas',pas:0,bouge:false};
const SPEED=2.5,FRIC=0.7;
const AP=window.Perso?Object.assign({},Perso.DEF_AP):{};
let walkPhase=0;

/* ========== CONTROLES ========== */
const keys={};
window.addEventListener('keydown',e=>{keys[e.key]=true;});
window.addEventListener('keyup',e=>{keys[e.key]=false;});

/* D-pad tactile */
const touch={up:false,down:false,left:false,right:false};
const touchIds={};
const DPAD_R=55,DPAD_CX=75,DPAD_CY_OFF=95; /* centre du D-pad depuis le bas-gauche */

function getTouchDir(tx,ty){
  const cx=DPAD_CX,cy=vh-DPAD_CY_OFF;
  const dx=tx-cx,dy=ty-cy;
  if(Math.sqrt(dx*dx+dy*dy)>DPAD_R*1.8) return null;
  if(Math.abs(dx)>Math.abs(dy)) return dx<0?'left':'right';
  return dy<0?'up':'down';
}

cv.addEventListener('touchstart',e=>{
  e.preventDefault();
  for(let i=0;i<e.changedTouches.length;i++){
    const t=e.changedTouches[i];
    const z=getTouchDir(t.clientX,t.clientY);
    if(z){touch[z]=true;touchIds[t.identifier]=z;}
  }
},{passive:false});
cv.addEventListener('touchend',e=>{
  e.preventDefault();
  for(let i=0;i<e.changedTouches.length;i++){
    const t=e.changedTouches[i];
    const z=touchIds[t.identifier];
    if(z){touch[z]=false;delete touchIds[t.identifier];}
  }
},{passive:false});
cv.addEventListener('touchcancel',e=>{
  for(let i=0;i<e.changedTouches.length;i++){
    const t=e.changedTouches[i];
    const z=touchIds[t.identifier];
    if(z){touch[z]=false;delete touchIds[t.identifier];}
  }
});

/* ========== RESIZE ========== */
window.addEventListener('resize',()=>{
  vw=window.innerWidth;vh=window.innerHeight;
  cv.width=vw;cv.height=vh;
});

/* ========== CAMERA ========== */
const cam={x:0,y:0};

/* ========== UPDATE ========== */
function update(){
  const left=keys['ArrowLeft']||keys['q']||keys['a']||touch.left;
  const right=keys['ArrowRight']||keys['d']||touch.right;
  const up=keys['ArrowUp']||keys['z']||keys['w']||touch.up;
  const down=keys['ArrowDown']||keys['s']||touch.down;

  let mx=0,my=0;
  if(left){mx=-1;PJ.dir='gauche';}
  if(right){mx=1;PJ.dir='droite';}
  if(up){my=-1;PJ.dir='haut';}
  if(down){my=1;PJ.dir='bas';}

  /* diagonale normalisée */
  if(mx&&my){mx*=0.707;my*=0.707;}

  PJ.bouge=!!(mx||my);
  if(PJ.bouge){
    PJ.vx=mx*SPEED;
    PJ.vy=my*SPEED;
  } else {
    PJ.vx*=FRIC;PJ.vy*=FRIC;
    if(Math.abs(PJ.vx)<0.1)PJ.vx=0;
    if(Math.abs(PJ.vy)<0.1)PJ.vy=0;
  }

  PJ.x+=PJ.vx;
  PJ.y+=PJ.vy;

  /* bornes */
  if(PJ.x<24)PJ.x=24;
  if(PJ.x>W-24)PJ.x=W-24;
  if(PJ.y<40)PJ.y=40;
  if(PJ.y>H-10)PJ.y=H-10;

  /* phase de marche */
  if(PJ.bouge){walkPhase+=0.15;}
  else{walkPhase=0;}
  PJ.pas=walkPhase;

  /* caméra centrée */
  cam.x=PJ.x-vw/2;
  cam.y=PJ.y-vh/2;
  if(cam.x<0)cam.x=0;
  if(cam.x>W-vw)cam.x=Math.max(0,W-vw);
  if(cam.y<0)cam.y=0;
  if(cam.y>H-vh)cam.y=Math.max(0,H-vh);
}

/* ========== DRAW ========== */
function draw(){
  g.clearRect(0,0,vw,vh);
  const ox=-cam.x,oy=-cam.y;

  /* ---- TERRAIN ---- */
  g.drawImage(TERRAIN,ox,oy);

  /* ---- JOUEUR (personnage.js) ---- */
  if(window.Perso&&Perso.sprite){
    Perso.sprite(g,PJ.x+ox,PJ.y+oy,AP,PJ.dir,PJ.pas,PJ.bouge);
  }

  /* ---- D-PAD TACTILE ---- */
  if('ontouchstart' in window){
    const cx=DPAD_CX,cy=vh-DPAD_CY_OFF;
    /* fond du D-pad */
    g.globalAlpha=0.12;
    g.fillStyle='#fff';
    g.beginPath();g.arc(cx,cy,DPAD_R,0,Math.PI*2);g.fill();
    g.globalAlpha=1;
    /* flèches */
    g.fillStyle='rgba(255,255,255,0.35)';
    g.font='20px sans-serif';
    g.textAlign='center';
    g.textBaseline='middle';
    g.fillText('▲',cx,cy-32);     /* haut */
    g.fillText('▼',cx,cy+32);     /* bas */
    g.fillText('◀',cx-32,cy);     /* gauche */
    g.fillText('▶',cx+32,cy);     /* droite */
  }
}

/* ========== BOUCLE ========== */
function loop(){update();draw();requestAnimationFrame(loop);}
loop();
})();
</script>
</body>
</html>
