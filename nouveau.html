<script>
(function(){
'use strict';

/* ========== CARTE ========== */
const MONDE_W=1000, MONDE_H=1000;

/* ========== PSEUDO-RANDOM DÉTERMINISTE (alea de moteur.js) ========== */
const alea=(n)=>{const v=Math.sin(n*127.1)*43758.5453;return v-Math.floor(v);};
const A=(i)=>alea(i*1.37+0.5);

/* ========== PALETTE PIERRE CALCAIRE (quai de la Joliette) ========== */
const PIERRE=['#d8d4cc','#d2cec4','#dcd8d0','#cec8be','#d6d2c8','#ccc8be',
              '#dad6ce','#d4d0c8','#d0ccc2','#d6d0c6'];

/* ========== PORT — CONSTANTES ========== */
const QUAI_Y=745, EAU_Y=775;
const CONT_C=['#b83230','#2574a9','#1e8449','#d4740b','#7d3c98','#d4a017','#148f77','#2c3e50'];
const HANGARS=[{x:30,y:20,w:180,h:100},{x:250,y:10,w:220,h:110},{x:520,y:25,w:160,h:95},{x:720,y:15,w:240,h:105}];

/* ========== CONSTRUCTION DU SOL — QUAI CALCAIRE ========== */
function construireSol(){
const c=document.createElement('canvas');
c.width=MONDE_W;c.height=MONDE_H;
const ctx=c.getContext('2d');
const R=(x,y,w,h,col)=>{ctx.fillStyle=col;ctx.fillRect(x|0,y|0,Math.max(1,w|0),Math.max(1,h|0));};

/* --- BASE CALCAIRE --- */
ctx.fillStyle='#d4d0c8';
ctx.fillRect(0,0,MONDE_W,MONDE_H);

/* --- DALLES IRRÉGULIÈRES (rangées de hauteur variable, dalles de largeur variable) --- */
let rowY=0, rowIdx=0;
while(rowY<MONDE_H){
  const rowH=18+Math.floor(A(rowIdx*0.77+3.1)*15);
  const offset=Math.floor(A(rowIdx*1.43+7.7)*30)-15;
  let bx=offset-80;

  while(bx<MONDE_W){
    const bw=36+Math.floor(A(bx*0.31+rowIdx*2.1+5.5)*8)*8;
    const col=PIERRE[Math.floor(A(bx*0.19+rowIdx*3.1+2.2)*PIERRE.length)];

    const x0=Math.max(0,bx), x1=Math.min(MONDE_W,bx+bw);
    const y0=Math.max(0,rowY), y1=Math.min(MONDE_H,rowY+rowH);

    if(x0<x1&&y0<y1){
      R(x0,y0,x1-x0,y1-y0,col);
      R(x0,y0,x1-x0,1,'rgba(118,114,106,.28)');
      if(bx>=0) R(x0,y0,1,y1-y0,'rgba(118,114,106,.28)');

      const ng=3+Math.floor(A(bx*1.1+rowIdx*0.3+8.8)*3);
      for(let gi=0;gi<ng;gi++){
        const gx=x0+2+Math.floor(A(bx*1.9+rowIdx+gi*3.7+1.1)*(x1-x0-4));
        const gy=y0+2+Math.floor(A(bx*2.3+rowIdx*1.1+gi*2.9+4.4)*(y1-y0-4));
        R(gx,gy,2,1,'rgba(255,255,255,.10)');
      }

      if(A(bx*0.7+rowIdx*1.9+6.6)>.4){
        const gx=x0+3+Math.floor(A(bx*3.1+rowIdx*0.9+9.9)*(x1-x0-6));
        const gy=y0+2+Math.floor(A(bx*0.8+rowIdx*2.7+3.3)*(y1-y0-4));
        R(gx,gy,2,1,'rgba(110,105,95,.08)');
      }

      if(A(bx*1.7+rowIdx*0.5+1.1)<.10){
        const ux=x0+3+Math.floor(A(bx*0.9+rowIdx*1.3+7.7)*(x1-x0-8));
        const uy=y0+3+Math.floor(A(rowIdx*0.6+bx*1.1+2.2)*(y1-y0-6));
        R(ux,uy,4+Math.floor(A(bx+rowIdx+5.5)*3),2,'rgba(110,108,100,.12)');
      }

      if(A(bx*2.3+rowIdx*1.7+4.4)<.04){
        const tx=(x0+x1)/2, ty=(y0+y1)/2;
        const tr=4+Math.floor(A(bx*0.3+rowIdx+8.8)*6);
        for(let dy=-tr;dy<=tr;dy++)for(let dx=-tr;dx<=tr;dx++){
          if(dx*dx+dy*dy>tr*tr) continue;
          const px=Math.floor(tx+dx),py=Math.floor(ty+dy);
          if(px>=x0&&px<x1&&py>=y0&&py<y1){
            R(px,py,1,1,'rgba(90,85,75,.04)');
          }
        }
      }
    }
    bx+=bw;
  }
  rowY+=rowH;
  rowIdx++;
}

/* --- TACHES DE PATINE --- */
for(let i=0;i<40;i++){
  const cx=Math.floor(A(i*1.3+100)*MONDE_W);
  const cy=Math.floor(A(i*1.7+200)*MONDE_H);
  const rx=10+Math.floor(A(i*2.1+300)*20);
  const ry=6+Math.floor(A(i*0.9+400)*12);
  for(let dy=-ry;dy<=ry;dy++)for(let dx=-rx;dx<=rx;dx++){
    const d=(dx*dx)/(rx*rx)+(dy*dy)/(ry*ry);
    if(d>1) continue;
    const px=cx+dx,py=cy+dy;
    if(px<0||px>=MONDE_W||py<0||py>=MONDE_H) continue;
    const a=(.03+A(px*1.1+py*2.3)*.03)*(1-d);
    R(px,py,1,1,`rgba(80,75,65,${a.toFixed(3)})`);
  }
}

/* --- VEINURES CALCAIRE --- */
for(let i=0;i<60;i++){
  const sx=Math.floor(A(i*1.1+500)*MONDE_W);
  const sy=Math.floor(A(i*0.7+600)*MONDE_H);
  const len=8+Math.floor(A(i*2.3+700)*20);
  const ang=A(i*1.9+800)*Math.PI;
  for(let s=0;s<len;s++){
    const px=Math.floor(sx+Math.cos(ang)*s);
    const py=Math.floor(sy+Math.sin(ang)*s);
    if(px>=0&&px<MONDE_W&&py>=0&&py<MONDE_H){
      R(px,py,1,1,'rgba(190,185,175,.15)');
    }
  }
}

/* --- MER MÉDITERRANÉE (gradient turquoise du port actuel) --- */
for(let y=EAU_Y;y<MONDE_H;y++){
  const k=(y-EAU_Y)/(MONDE_H-EAU_Y);
  const bord=(y-EAU_Y)*1.4;
  const p=Math.min(1,bord/90)*0.6+k*0.4;
  const r=Math.round(52-p*22), g=Math.round(168-p*58), b=Math.round(186-p*30);
  for(let x=0;x<MONDE_W;x+=2){
    ctx.fillStyle='rgb('+r+','+g+','+b+')';ctx.fillRect(x,y,2,1);
  }
}
/* (reflets statiques retirés — remplacés par caustiques animés) */

/* --- QUAI — margelle pierre dorée (port actuel) --- */
/* margelle (bordure supérieure dorée) */
R(0,QUAI_Y-4,MONDE_W,5,'#bfae88');
R(0,QUAI_Y-4,MONDE_W,1,'#efe3c4');
/* face du quai sous la margelle */
R(0,QUAI_Y+1,MONDE_W,EAU_Y-QUAI_Y-1,'#8f8468');
R(0,EAU_Y-2,MONDE_W,2,'rgba(10,40,60,.35)');
/* Bollards (bittes d'amarrage) */
for(let x=40;x<MONDE_W;x+=70){
  const bx=x+Math.floor(A(x*0.7+50)*8)-4;
  R(bx-3,QUAI_Y+4,6,5,'#3b3f44');
  R(bx-4,QUAI_Y+2,8,3,'#4a4f55');
  R(bx-4,QUAI_Y+2,8,1,'#646a71');
}

/* --- VOIES DE CIRCULATION --- */
for(let x=100;x<MONDE_W;x+=180){
  for(let y=180;y<QUAI_Y-20;y+=16)
    R(x,y,2,8,'rgba(255,255,255,.18)');
}
for(let x=50;x<MONDE_W-60;x+=200){
  R(x,700,120,2,'rgba(200,168,50,.2)');
  R(x,720,120,2,'rgba(200,168,50,.2)');
}

/* --- HANGARS (haut de carte) --- */
HANGARS.forEach((h,hi)=>{
  ctx.fillStyle=['#7a7268','#6e6860','#7e7870','#706a62'][hi];
  ctx.fillRect(h.x,h.y,h.w,h.h);
  ctx.fillStyle='rgba(0,0,0,.15)';
  ctx.fillRect(h.x,h.y,h.w,2);ctx.fillRect(h.x,h.y,2,h.h);
  ctx.fillStyle='rgba(255,255,255,.06)';
  ctx.fillRect(h.x+2,h.y+2,h.w-4,1);
  for(let lx=h.x+6;lx<h.x+h.w-4;lx+=8)
    R(lx,h.y+4,3,h.h-8,'rgba(255,255,255,.04)');
  /* Porte */
  const px=h.x+Math.floor(h.w/2)-10;
  R(px,h.y+h.h-16,20,16,'rgba(0,0,0,.08)');
  R(px+1,h.y+h.h-14,18,12,'rgba(200,180,100,.12)');
});

return c;
}


/* ========== INIT MOTEUR DE RENDU ========== */
Render.init('c',MONDE_W,MONDE_H,{zoom:1.1});
Render.setSol(construireSol());
/* Render.debug.fps=true; */ /* décommenter pour le compteur FPS */

/* ========== INIT GRILLE PATHFINDING ========== */
Actors.setGrille(Math.ceil(MONDE_W/16),Math.ceil(MONDE_H/16),16);

/* ========== OBSTACLES : EAU + HANGARS ========== */
for(let gx=0;gx<Math.ceil(MONDE_W/16);gx++)
  for(let gy=Math.ceil(QUAI_Y/16);gy<Math.ceil(MONDE_H/16);gy++)
    Actors.setObstacle(gx,gy,1);
HANGARS.forEach(h=>{
  for(let gy=Math.floor(h.y/16);gy<=Math.floor((h.y+h.h)/16);gy++)
    for(let gx=Math.floor(h.x/16);gx<=Math.floor((h.x+h.w)/16);gx++)
      Actors.setObstacle(gx,gy,1);
});

/* ========== CONTAINERS ========== */
function dessinerCont(ctx,x,y,w,couleur,emp){
  const h=14,cote=7;
  ctx.fillStyle='rgba(0,0,0,.12)';
  ctx.fillRect(x+2,y+h+cote+1,w-1,3);
  const pr=parseInt(couleur.slice(1,3),16),pg=parseInt(couleur.slice(3,5),16),pb=parseInt(couleur.slice(5,7),16);
  ctx.fillStyle=`rgb(${pr*.6|0},${pg*.6|0},${pb*.6|0})`;
  ctx.fillRect(x,y+h,w,cote);
  ctx.fillStyle='rgba(0,0,0,.12)';
  ctx.fillRect(x+(w>>1),y+h+1,1,cote-2);
  ctx.fillStyle=couleur;
  ctx.fillRect(x,y,w,h);
  ctx.fillStyle='rgba(255,255,255,.09)';
  for(let i=3;i<w-2;i+=4) ctx.fillRect(x+i,y+1,2,h-2);
  ctx.fillStyle='rgba(255,255,255,.05)';
  ctx.fillRect(x,y,w,1);
  if(emp){
    ctx.fillStyle=couleur;
    ctx.fillRect(x+1,y-10,w-2,9);
    ctx.fillStyle=`rgb(${pr*.5|0},${pg*.5|0},${pb*.5|0})`;
    ctx.fillRect(x+1,y-3,w-2,3);
    ctx.fillStyle='rgba(255,255,255,.07)';
    for(let i=3;i<w-2;i+=4) ctx.fillRect(x+i,y-9,2,6);
  }
}

(function placerConteneurs(){
  const zones=[
    {x:60,y:180,r:3,c:5},{x:370,y:170,r:4,c:6},{x:720,y:200,r:3,c:4},
    {x:100,y:400,r:2,c:7},{x:480,y:420,r:3,c:5},{x:780,y:380,r:2,c:3},
    {x:180,y:570,r:2,c:6},{x:550,y:590,r:2,c:4},
  ];
  let n=0;
  zones.forEach((z,zi)=>{
    for(let row=0;row<z.r;row++) for(let col=0;col<z.c;col++){
      const cx=z.x+col*52, cy=z.y+row*26;
      const clr=CONT_C[Math.floor(A(n*1.7+zi*3.3)*CONT_C.length)];
      const emp=A(n*2.1+5.5)>.55;
      Render.ajouterEntite('c'+n,{
        x:cx+24,y:cy+21,w:48,h:emp?31:21,ySort:cy+21,
        draw(c2,camX,camY){dessinerCont(c2,cx-camX,cy-camY,48,clr,emp);}
      });
      const g1=Actors.mondeVersGrille(cx-2,cy-(emp?10:0));
      const g2=Actors.mondeVersGrille(cx+50,cy+22);
      for(let gy=g1.cy;gy<=g2.cy;gy++)
        for(let gx=g1.cx;gx<=g2.cx;gx++)
          Actors.setObstacle(gx,gy,1);
      n++;
    }
  });
})();

/* ========== GRUES DE QUAI ========== */
function dessinerGrue(ctx,gx,gy,cx,cy){
  const px=gx-cx,py=gy-cy;
  ctx.fillStyle='rgba(0,0,0,.06)';
  ctx.fillRect(px+3,py-80,3,82);
  ctx.fillStyle='#555';
  ctx.fillRect(px-25,py+2,50,2);
  ctx.fillStyle='#e0a020';
  ctx.fillRect(px-22,py-2,5,6);ctx.fillRect(px+17,py-2,5,6);
  ctx.fillStyle='#e8a820';
  ctx.fillRect(px-1,py-80,3,82);
  for(let ty=py-75;ty<py;ty+=12) ctx.fillRect(px-5,ty,11,2);
  ctx.fillStyle='#c89018';
  ctx.fillRect(px-5,py-12,11,10);
  ctx.fillStyle='#78b8d0';
  ctx.fillRect(px-4,py-11,9,6);
  ctx.fillStyle='#666';
  ctx.fillRect(px,py-50,1,22);
  ctx.fillStyle='#555';
  ctx.fillRect(px-1,py-29,3,2);
}
[{x:180,y:730},{x:500,y:725},{x:820,y:730}].forEach((g,i)=>{
  Render.ajouterEntite('grue'+i,{
    x:g.x,y:g.y,w:50,h:85,ySort:g.y,
    draw(c2,cx,cy){dessinerGrue(c2,g.x,g.y,cx,cy);}
  });
});

/* ========== DOCKERS PNJ ========== */
(function creerDockers(){
  const postes=[
    {x:300,y:350,comp:'rodeur',cx:300,cy:350,rayon:100},
    {x:550,y:280,comp:'rodeur',cx:550,cy:280,rayon:120},
    {x:200,y:550,comp:'sentinelle',ax:200,ay:550,bx:450,by:550},
    {x:700,y:520,comp:'idle'},
    {x:430,y:650,comp:'rodeur',cx:430,cy:650,rayon:70},
    {x:850,y:350,comp:'idle'},
    {x:650,y:700,comp:'sentinelle',ax:550,ay:700,bx:850,by:700},
    {x:150,y:300,comp:'idle'},
  ];
  const PHRASES=['Salut matelot !','Eh, du nerf !','Attention aux containers !',
    'La Joliette, c\'est chez nous.','Allez, on charge !','Pause café bientôt...',
    'T\'es nouveau ici ?','Le mistral souffle fort !'];
  postes.forEach((p,i)=>{
    const ap=window.Perso?Object.assign({},Perso.DEF_AP):{};
    let comp;
    if(p.comp==='rodeur') comp=Actors.comportementRodeur(p.cx,p.cy,p.rayon,2+A(i*3.1)*3);
    else if(p.comp==='sentinelle') comp=Actors.comportementSentinelle(p.ax,p.ay,p.bx,p.by,2.5);
    else comp=Actors.comportementIdle(3+A(i*2.7)*4);
    Actors.creer('docker'+i,{
      x:p.x,y:p.y,vitesse:35+A(i*1.9)*25,
      comportement:comp,interactif:true,rayonInteraction:40,
      dialogue:[{texte:PHRASES[i],duree:3}],
      draw(c2,cx,cy,act){
        if(window.Perso&&Perso.sprite)
          Perso.sprite(c2,act.x-cx,act.y-cy,ap,act.dir,act.pas,act.marche);
        else{
          c2.fillStyle='#3a5a8a';c2.fillRect(act.x-cx-4,act.y-cy-12,8,12);
          c2.fillStyle='#ddb89a';c2.fillRect(act.x-cx-3,act.y-cy-16,6,5);
        }
      }
    });
  });
})();

/* ========== AMBIANCE — poussière ========== */
Anim.emetteur({
  x:()=>joueur.x+(Math.random()-.5)*400,
  y:()=>joueur.y+(Math.random()-.5)*300,
  debit:2,dureeVie:[3,6],vitesse:[3,10],angle:[-.5,.2],
  tailleDebut:1,tailleFin:0,
  couleurs:['rgba(180,170,155,.12)','rgba(160,150,135,.08)'],
  alphaDebut:.12,alphaFin:0,forme:'cercle',couche:'effets',max:20,
});


/* ========== JOUEUR ========== */
const joueur={x:350,y:360,dir:'bas',dir8:'bas',dirVue:'bas',pas:0,marche:false};
const AP=window.Perso?Object.assign({},Perso.DEF_AP):{};

/* Enregistrer le joueur comme entité (tri-Y automatique) */
Render.ajouterEntite('joueur',{
  get x(){return joueur.x;},
  get y(){return joueur.y;},
  w:64, h:80,
  get ySort(){return joueur.y;},
  draw(ctx,cx,cy){
    if(window.Perso&&Perso.sprite)
      Perso.sprite(ctx,joueur.x-cx,joueur.y-cy,AP,joueur.dir,joueur.pas,joueur.marche);
  }
});


/* ========== MOUVEMENT (inertie, 8 directions) ========== */
const VITESSE=112;
const POUSSE_BASSE=0.60, POUSSE_HAUTE=1.00;
const COURSE_ENTREE=0.88, COURSE_SORTIE=0.80;
const ORDRE8=['droite','bas-droite','bas','bas-gauche','gauche','haut-gauche','haut','haut-droite'];
const CADENCE_PAS=0.55*24/(4*13);
let vx=0, vy=0;
let court=false;

function tournerEnDouceur(dt){
const cible=joueur.dir8||joueur.dir;
if(!joueur.dirVue){joueur.dirVue=cible;return;}
if(joueur.dirVue===cible)return;
joueur._tVue=(joueur._tVue||0)+dt;
if(joueur._tVue<0.042)return;
joueur._tVue=0;
const a=ORDRE8.indexOf(joueur.dirVue), b=ORDRE8.indexOf(cible);
if(a<0||b<0){joueur.dirVue=cible;return;}
const d=(b-a+8)%8;
joueur.dirVue=ORDRE8[(a+(d<=4?1:-1)+8)%8];
}


/* ========== JOYSTICK VIRTUEL ========== */
let joyX=0, joyY=0;
const jc=document.getElementById('joy');
const jg=jc.getContext('2d');
let JDPR=1;
const JOY_C=100;
const RAYON=34, POUCE=13;
const J={actif:false,id:null,ox:0,oy:0,x:0,y:0,vie:0};

function tailleJoy(){
JDPR=Math.max(1,Math.min(3,window.devicePixelRatio||1));
jc.width=Math.round(JOY_C*JDPR);jc.height=Math.round(JOY_C*JDPR);
jc.style.width=JOY_C+'px';jc.style.height=JOY_C+'px';
}
tailleJoy();
addEventListener('resize',tailleJoy);

function prendre(x,y){
J.actif=true;J.ox=x;J.oy=y;J.x=x;J.y=y;J.vie=1;
joyX=joyY=0;
try{navigator.vibrate&&navigator.vibrate(20);}catch(e){}
}
function tirer(x,y){
const dx=x-J.ox, dy=y-J.oy, d=Math.hypot(dx,dy);
const a=Math.atan2(dy,dx);
const m=Math.min(d,RAYON);
J.x=J.ox+Math.cos(a)*m;J.y=J.oy+Math.sin(a)*m;
if(d>RAYON){J.ox=x-Math.cos(a)*RAYON;J.oy=y-Math.sin(a)*RAYON;}
const n=Math.min(1,d/RAYON);
joyX=d<1?0:Math.cos(a)*n;
joyY=d<1?0:Math.sin(a)*n;
if(Math.hypot(joyX,joyY)<.16)joyX=joyY=0;
}
function lacher(){J.actif=false;J.id=null;joyX=joyY=0;}

/* Touch */
document.addEventListener('touchstart',ev=>{
for(const t of ev.changedTouches){
  if(J.actif) continue;
  ev.preventDefault();
  J.id=t.identifier;
  prendre(t.clientX,t.clientY);
}
},{passive:false});
document.addEventListener('touchmove',ev=>{
for(const t of ev.changedTouches){
  if(t.identifier===J.id){ev.preventDefault();tirer(t.clientX,t.clientY);}
}
},{passive:false});
['touchend','touchcancel'].forEach(k=>document.addEventListener(k,ev=>{
for(const t of ev.changedTouches) if(t.identifier===J.id){ev.preventDefault();lacher();}
},{passive:false}));

/* Souris (fallback desktop) */
document.addEventListener('mousedown',ev=>{prendre(ev.clientX,ev.clientY);});
addEventListener('mousemove',ev=>{if(J.actif)tirer(ev.clientX,ev.clientY);});
addEventListener('mouseup',()=>{if(J.actif)lacher();});

/* Clavier (fallback) */
const keysDown=new Set();
addEventListener('keydown',ev=>{
const k={ArrowUp:'z',ArrowDown:'s',ArrowLeft:'q',ArrowRight:'d',w:'z',a:'q'}[ev.key]||ev.key;
keysDown.add(k);
updateKeyJoy();
});
addEventListener('keyup',ev=>{
const k={ArrowUp:'z',ArrowDown:'s',ArrowLeft:'q',ArrowRight:'d',w:'z',a:'q'}[ev.key]||ev.key;
keysDown.delete(k);
updateKeyJoy();
});
function updateKeyJoy(){
if(J.actif) return;
let kx=0,ky=0;
if(keysDown.has('q'))kx=-1;
if(keysDown.has('d'))kx=1;
if(keysDown.has('z'))ky=-1;
if(keysDown.has('s'))ky=1;
joyX=kx;joyY=ky;
}


/* ========== DESSIN DU JOYSTICK ========== */
let joySale=false;
function dessinerJoy(dt){
if(!J.actif&&J.vie>0) J.vie=Math.max(0,J.vie-dt*5);
if(J.vie<=0){
  if(joySale){jg.setTransform(1,0,0,1,0,0);jg.clearRect(0,0,jc.width,jc.height);joySale=false;jc.style.visibility='hidden';}
  return;
}
if(!joySale) jc.style.visibility='visible';
const jox=Math.round(J.ox), joy=Math.round(J.oy);
jc.style.transform='translate('+(jox-JOY_C/2)+'px,'+(joy-JOY_C/2)+'px)';
jg.setTransform(1,0,0,1,0,0);jg.clearRect(0,0,jc.width,jc.height);
jg.setTransform(JDPR,0,0,JDPR,JDPR*(JOY_C/2-jox),JDPR*(JOY_C/2-joy));
joySale=true;
jg.save();
jg.globalAlpha=J.vie;
const d=Math.hypot(J.x-J.ox,J.y-J.oy), a=Math.atan2(J.y-J.oy,J.x-J.ox);
const pousse=Math.min(1,d/RAYON), course=pousse>0.88;

jg.beginPath();jg.arc(J.ox,J.oy,RAYON,0,7);
jg.fillStyle='rgba(20,14,8,.12)';jg.fill();
jg.lineWidth=3;jg.strokeStyle='rgba(20,14,8,.25)';jg.stroke();
jg.lineWidth=1.5;jg.strokeStyle='rgba(250,244,228,.75)';jg.stroke();

if(d>6){jg.beginPath();jg.arc(J.ox,J.oy,RAYON,a-0.4,a+0.4);jg.lineWidth=3;jg.strokeStyle=course?'#e8c06a':'#f4ecd8';jg.stroke();}

jg.beginPath();jg.arc(J.x,J.y+2.5,POUCE,0,7);jg.fillStyle='rgba(20,14,8,.3)';jg.fill();
jg.beginPath();jg.arc(J.x,J.y,POUCE,0,7);jg.fillStyle='#f4ecd8';jg.fill();

jg.save();jg.translate(J.x,J.y);
if(d>6){
  jg.rotate(a);jg.fillStyle=course?'#a8791f':'#7a1f2b';
  jg.beginPath();jg.moveTo(5.5,0);jg.lineTo(-2.5,-4.5);jg.lineTo(-0.5,0);jg.lineTo(-2.5,4.5);jg.closePath();jg.fill();
} else {
  jg.fillStyle='#7a1f2b';jg.beginPath();jg.arc(0,0,2,0,7);jg.fill();
}
jg.restore();
jg.restore();
}


/* ========== MISE À JOUR JOUEUR ========== */
function majJoueur(dt){
tournerEnDouceur(dt);
const n=Math.hypot(joyX,joyY);
const pousse=Math.min(1,n);

const r=Math.max(0,Math.min(1,(pousse-POUSSE_BASSE)/(POUSSE_HAUTE-POUSSE_BASSE)));
const allure=VITESSE+(VITESSE*0.36)*r;

court=(pousse>(court?COURSE_SORTIE:COURSE_ENTREE));

const cibleX=n>0.16?(joyX/n)*allure*pousse:0;
const cibleY=n>0.16?(joyY/n)*allure*pousse:0;

const k=1-Math.exp(-(n>0.16?7.5:9)*dt);

if(cibleX*vx<0&&Math.abs(vx)>30) vx*=0.55;
if(cibleY*vy<0&&Math.abs(vy)>30) vy*=0.55;

vx+=(cibleX-vx)*k;
vy+=(cibleY-vy)*k;

const v=Math.hypot(vx,vy);

if(v>1){
  joueur.x+=vx*dt;
  joueur.y+=vy*dt;
  joueur.pas+=v*dt*CADENCE_PAS;

  const versX=Math.abs(vx)>Math.abs(vy)*1.35;
  const versY=Math.abs(vy)>Math.abs(vx)*1.35;
  if(versX) joueur.dir=vx>0?'droite':'gauche';
  else if(versY) joueur.dir=vy>0?'bas':'haut';

  const ang=Math.atan2(vy,vx), sect=Math.round(ang/(Math.PI/4));
  const D8={0:'droite',1:'bas-droite',2:'bas',3:'bas-gauche',4:'gauche','-4':'gauche','-3':'haut-gauche','-2':'haut','-1':'haut-droite'}[sect];
  if(D8&&D8!==joueur.dir8){
    const centre=sect*(Math.PI/4), ecart=Math.abs(((ang-centre+Math.PI*3)%(Math.PI*2))-Math.PI);
    if(ecart<Math.PI/8*0.8||!joueur.dir8) joueur.dir8=D8;
  }
  joueur.marche=true;
} else {
  vx=vy=0;
  joueur.pas=0;
  joueur.marche=false;
}

if(joueur.x<24)joueur.x=24;
if(joueur.x>MONDE_W-24)joueur.x=MONDE_W-24;
if(joueur.y<40)joueur.y=40;
if(joueur.y>QUAI_Y-15)joueur.y=QUAI_Y-15;
}


/* ========== POISSONS (état persistant) ========== */
const poissons=[];
for(let i=0;i<7;i++){
  poissons.push({
    x:A(i+7000)*MONDE_W, y:EAU_Y+25+A(i+7100)*(MONDE_H-EAU_Y-50),
    vx:8+A(i+7200)*14, sz:7+A(i+7300)*11, ph:A(i+7400)*6.28, w:0,
    dir:A(i+7500)>.5?1:-1
  });
}

/* ========== BOUCLE DE JEU ========== */
let t0=0, eauT=0;
requestAnimationFrame(function boucle(t){
requestAnimationFrame(boucle);
if(!t0){t0=t;return;}
const dt=Math.min(.05,(t-t0)/1000);
t0=t;
eauT+=dt;
majJoueur(dt);
Actors.maj(dt);

/* Eau animée — caustiques fluides + ombres de poissons */
Render.dessinerSur('ombres',(c2,cx,cy,vw,vh)=>{
  const sy0=Math.max(0,EAU_Y-cy), sy1=Math.min(vh,MONDE_H-cy);
  if(sy0>=sy1) return;

  /* --- Caustiques 2D (lumière sous-marine) --- */
  const S=6;
  for(let sy=sy0;sy<sy1;sy+=S){
    const wy=cy+sy;
    for(let sx=0;sx<vw;sx+=S){
      const wx=cx+sx;
      const v=Math.sin(wx*.02+eauT*.7)*Math.sin(wy*.025+eauT*.5)
             +Math.sin((wx+wy)*.015+eauT*.3)*.5
             +Math.sin(wx*.04-eauT*1.1)*Math.sin(wy*.03+eauT*.8)*.3;
      if(v>.15){
        c2.fillStyle=`rgba(180,240,250,${((v-.15)*.08).toFixed(3)})`;
        c2.fillRect(sx,sy,S,S);
      }else if(v<-.2){
        c2.fillStyle=`rgba(10,50,80,${((.2+v)*-.05).toFixed(3)})`;
        c2.fillRect(sx,sy,S,S);
      }
    }
  }

  /* --- Ondulations de surface (bord eau) --- */
  const bandH=12;
  const sby=Math.max(sy0,EAU_Y-cy), sey=Math.min(sy0+bandH,sy1);
  for(let sy=sby;sy<sey;sy++){
    const wy=cy+sy;
    const a=(.03-.025*((sy-sby)/bandH));
    const off=Math.sin(eauT*.6+wy*.1)*2;
    c2.fillStyle=`rgba(200,245,255,${a.toFixed(3)})`;
    c2.fillRect(off,sy,vw,1);
  }

  /* --- Ombres de poissons --- */
  for(const f of poissons){
    f.w+=dt*3;
    f.x+=f.vx*f.dir*dt;
    if(f.dir>0&&f.x>MONDE_W+30){f.x=-30;f.y=EAU_Y+25+Math.random()*(MONDE_H-EAU_Y-50);}
    if(f.dir<0&&f.x<-30){f.x=MONDE_W+30;f.y=EAU_Y+25+Math.random()*(MONDE_H-EAU_Y-50);}
    const px=f.x-cx, py=f.y-cy;
    if(px<-40||px>vw+40||py<sy0-10||py>sy1+10) continue;
    const tw=Math.sin(f.w+f.ph)*.3;
    c2.save();
    c2.translate(px,py);
    c2.scale(f.dir,1);
    c2.globalAlpha=.1;
    c2.fillStyle='#0a2a3a';
    c2.beginPath();
    c2.ellipse(0,0,f.sz,f.sz*.38,0,0,Math.PI*2);
    c2.fill();
    c2.beginPath();
    c2.moveTo(-f.sz*.8,0);
    c2.lineTo(-f.sz*1.4,-f.sz*.35+tw*f.sz);
    c2.lineTo(-f.sz*1.4,f.sz*.35+tw*f.sz);
    c2.closePath();
    c2.fill();
    c2.restore();
  }
});

Anim.maj(dt);
Render.camSuivre(joueur,dt);
Render.frame(dt);
dessinerJoy(dt);
});

})();
</script>
