<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Press Start 2P', monospace;
  width: 390px; height: 844px;
  overflow: hidden;
  background: #1b1b2f;
  color: #fff;
  image-rendering: pixelated;
}

.screen {
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  position: relative;
}

/* Scène du port en fond */
.scene {
  position: absolute; inset: 0;
}
.scene canvas {
  width: 100%; height: 100%;
  image-rendering: pixelated;
}

/* Contenu par-dessus */
.ui {
  position: relative; z-index: 2;
  flex: 1;
  display: flex;
  flex-direction: column;
}

/* Titre en haut */
.title-bar {
  padding: 48px 0 0;
  text-align: center;
}
.title-bar h1 {
  font-size: 11px;
  color: #e8c41c;
  letter-spacing: 2px;
  text-shadow: 2px 2px 0 rgba(0,0,0,0.5);
  line-height: 1.8;
}
.title-bar .sub {
  font-size: 7px;
  color: rgba(255,255,255,0.5);
  margin-top: 4px;
  text-shadow: 1px 1px 0 rgba(0,0,0,0.5);
}

/* Zone perso (le perso est dessiné dans la scène) */
.perso-space {
  flex: 1;
}

/* Panneau du bas style jeu */
.panel {
  background: rgba(10,10,30,0.92);
  border-top: 3px solid #e8c41c;
  padding: 14px 16px 36px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.panel::before {
  content: '';
  position: absolute;
  top: -6px; left: 0; right: 0;
  height: 3px;
  background: rgba(232,196,28,0.3);
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.field-label {
  font-size: 7px;
  color: #e8c41c;
  letter-spacing: 2px;
}

/* Input style RPG */
.rpg-input {
  width: 100%;
  height: 38px;
  background: #0a0a1a;
  border: 2px solid #3a3a5c;
  padding: 0 10px;
  font-size: 10px;
  color: #fff;
  font-family: 'Press Start 2P', monospace;
  outline: none;
}
.rpg-input:focus { border-color: #e8c41c; }

/* Sélection de visage */
.face-row {
  display: flex;
  gap: 6px;
}
.face-box {
  flex: 1;
  height: 56px;
  background: #0a0a1a;
  border: 2px solid #3a3a5c;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: border-color 0.1s;
}
.face-box.sel {
  border-color: #e8c41c;
  background: #141428;
}
.face-box canvas {
  image-rendering: pixelated;
  width: 32px; height: 42px;
}

/* Skin */
.skin-row {
  display: flex;
  gap: 4px;
}
.skin-sq {
  flex: 1;
  height: 24px;
  border: 2px solid #3a3a5c;
  cursor: pointer;
  transition: border-color 0.1s;
}
.skin-sq.sel {
  border-color: #e8c41c;
  box-shadow: 0 0 6px rgba(232,196,28,0.4);
}

/* Bouton */
.btn-row {
  display: flex;
  gap: 8px;
  margin-top: 2px;
}
.btn-go {
  flex: 1;
  height: 42px;
  border: 2px solid #e8c41c;
  background: transparent;
  font-size: 9px;
  font-family: 'Press Start 2P', monospace;
  color: #e8c41c;
  cursor: pointer;
  letter-spacing: 1px;
  transition: all 0.1s;
}
.btn-go:hover, .btn-go:active {
  background: #e8c41c;
  color: #0a0a1a;
}

.name-display {
  position: absolute;
  z-index: 3;
  font-size: 8px;
  color: #fff;
  text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
  text-align: center;
  width: 100%;
  pointer-events: none;
}
.rank-display {
  position: absolute;
  z-index: 3;
  font-size: 6px;
  color: #e8c41c;
  text-shadow: 1px 1px 0 #000;
  text-align: center;
  width: 100%;
  pointer-events: none;
}
</style>
</head><body>
<div class="screen">
  <div class="scene"><canvas id="bg"></canvas></div>

  <div class="name-display" id="nameLabel" style="top:340px">Eliasse</div>
  <div class="rank-display" id="rankLabel" style="top:354px">Occasionnel</div>

  <div class="ui">
    <div class="title-bar">
      <h1>NOUVEAU DOCKER</h1>
      <div class="sub">Port de Marseille</div>
    </div>

    <div class="perso-space"></div>

    <div class="panel">
      <div class="field">
        <div class="field-label">PRENOM</div>
        <input class="rpg-input" type="text" value="Eliasse" maxlength="14" oninput="document.getElementById('nameLabel').textContent=this.value||'...'">
      </div>
      <div class="field">
        <div class="field-label">GUEULE</div>
        <div class="face-row" id="faces"></div>
      </div>
      <div class="field">
        <div class="field-label">PEAU</div>
        <div class="skin-row" id="skins"></div>
      </div>
      <div class="btn-row">
        <button class="btn-go" onclick="">EMBARQUER ▶</button>
      </div>
    </div>
  </div>
</div>

<script src="personnage.js"></script>
<script>
// Dessiner la scène du port
const bgCanvas = document.getElementById('bg');
bgCanvas.width = 390; bgCanvas.height = 844;
const bg = bgCanvas.getContext('2d');

function drawScene() {
  // Ciel dégradé nuit/crépuscule
  const skyGrad = bg.createLinearGradient(0, 0, 0, 400);
  skyGrad.addColorStop(0, '#0a0a20');
  skyGrad.addColorStop(0.4, '#1a1a3a');
  skyGrad.addColorStop(0.7, '#2a2040');
  skyGrad.addColorStop(1, '#3a2840');
  bg.fillStyle = skyGrad;
  bg.fillRect(0, 0, 390, 400);

  // Étoiles
  bg.fillStyle = '#fff';
  const stars = [[30,40],[80,25],[150,50],[200,20],[280,45],[340,30],[60,80],[180,75],[310,65],[120,35],[250,55],[370,40],[45,60],[220,70]];
  stars.forEach(([x,y]) => {
    bg.globalAlpha = 0.3 + Math.random() * 0.5;
    bg.fillRect(x, y, 1, 1);
  });
  bg.globalAlpha = 1;

  // Lune
  bg.fillStyle = '#e8c41c';
  bg.globalAlpha = 0.15;
  bg.beginPath(); bg.arc(320, 60, 20, 0, Math.PI*2); bg.fill();
  bg.globalAlpha = 0.5;
  bg.beginPath(); bg.arc(320, 60, 12, 0, Math.PI*2); bg.fill();
  bg.globalAlpha = 1;

  // Grues portuaires en silhouette
  bg.fillStyle = '#1a1a2a';
  // Grue 1
  bg.fillRect(40, 180, 8, 200);
  bg.fillRect(20, 180, 50, 8);
  bg.fillRect(20, 172, 6, 16);
  bg.fillRect(60, 175, 4, 30);
  // Bras
  bg.fillRect(20, 180, 80, 4);

  // Grue 2
  bg.fillRect(300, 160, 10, 220);
  bg.fillRect(280, 160, 55, 8);
  bg.fillRect(280, 152, 6, 16);
  bg.fillRect(325, 155, 4, 30);
  bg.fillRect(275, 160, 90, 4);

  // Conteneurs au fond
  bg.fillStyle = '#c0392b'; bg.fillRect(100, 340, 40, 25);
  bg.fillStyle = '#2980b9'; bg.fillRect(142, 340, 40, 25);
  bg.fillStyle = '#27ae60'; bg.fillRect(184, 340, 40, 25);
  bg.fillStyle = '#8e44ad'; bg.fillRect(80, 315, 40, 25);
  bg.fillStyle = '#e8c41c'; bg.fillRect(122, 315, 40, 25);
  bg.fillStyle = '#c0392b'; bg.fillRect(260, 340, 40, 25);
  bg.fillStyle = '#2980b9'; bg.fillRect(302, 340, 35, 25);
  // Lignes conteneurs
  bg.strokeStyle = 'rgba(0,0,0,0.3)';
  bg.lineWidth = 1;
  [100,142,184,260,302].forEach(x => { bg.strokeRect(x, 340, 40, 25); });
  [80,122].forEach(x => { bg.strokeRect(x, 315, 40, 25); });

  // Quai
  bg.fillStyle = '#4a4a52';
  bg.fillRect(0, 365, 390, 20);
  // Lignes quai
  bg.fillStyle = '#5a5a62';
  for(let x = 0; x < 390; x += 30) bg.fillRect(x, 370, 20, 2);
  // Bord quai
  bg.fillStyle = '#e8c41c';
  bg.fillRect(0, 383, 390, 2);

  // Eau
  const waterGrad = bg.createLinearGradient(0, 385, 0, 500);
  waterGrad.addColorStop(0, '#0a1628');
  waterGrad.addColorStop(1, '#0d1f3c');
  bg.fillStyle = waterGrad;
  bg.fillRect(0, 385, 390, 460);

  // Reflets sur l'eau
  bg.fillStyle = 'rgba(232,196,28,0.06)';
  for(let y = 390; y < 500; y += 6) {
    bg.fillRect(160 + Math.sin(y*0.1)*20, y, 60 + Math.sin(y*0.2)*10, 2);
  }
  // Vaguettes
  bg.strokeStyle = 'rgba(255,255,255,0.04)';
  bg.lineWidth = 1;
  for(let y = 395; y < 500; y += 12) {
    bg.beginPath();
    bg.moveTo(0, y);
    for(let x = 0; x < 390; x += 20) {
      bg.quadraticCurveTo(x+10, y + (Math.sin(x*0.05+y)*3), x+20, y);
    }
    bg.stroke();
  }

  // Sol en bas (sous le panel)
  bg.fillStyle = '#0a0a1a';
  bg.fillRect(0, 500, 390, 344);
}
drawScene();

// Dessiner le perso sur le quai
const SKINS = Perso.PALETTES.peau;
const FACES = [
  {formeYeux:0, nez:1, bouche:0, sourcils:0, coiffe:0, barbe:0},
  {formeYeux:4, nez:0, bouche:1, sourcils:2, coiffe:2, barbe:0},
  {formeYeux:2, nez:2, bouche:3, sourcils:1, coiffe:5, barbe:0},
  {formeYeux:1, nez:3, bouche:0, sourcils:3, coiffe:16, barbe:0},
];
let currentSkin = 3, currentFace = 0;

function getAp(s, f) {
  return Object.assign({}, Perso.DEF_AP, {peau:s, cheveux:0}, FACES[f]);
}

function renderChar(canvas, ap, scale) {
  const w = Perso.CASE_L, h = Perso.CASE_H;
  canvas.width = w * scale; canvas.height = h * scale;
  const g = canvas.getContext('2d');
  g.setTransform(scale, 0, 0, scale, 0, 0);
  Perso.sprite(g, w/2, h - 10, ap, 'bas', 0, false);
}

function updateAll() {
  // Perso sur le quai dans la scène
  drawScene();
  const ap = getAp(currentSkin, currentFace);
  // Dessiner le perso directement sur le bg canvas
  const scale = 3;
  const w = Perso.CASE_L, h = Perso.CASE_H;
  // Position : centré sur le quai
  const px = 195 - (w*scale)/2;
  const py = 365 - (h*scale) + 18;
  bg.save();
  bg.translate(px, py);
  bg.scale(scale, scale);
  Perso.sprite(bg, w/2, h - 10, ap, 'bas', 0, false);
  bg.restore();

  // Ombre au sol
  bg.fillStyle = 'rgba(0,0,0,0.3)';
  bg.fillRect(px + 20, 375, w*scale - 40, 4);

  // Miniatures faces
  document.querySelectorAll('.face-box canvas').forEach((c,i) => {
    renderChar(c, getAp(currentSkin, i), 2);
  });
}

const facesEl = document.getElementById('faces');
FACES.forEach((_,i) => {
  const d = document.createElement('div');
  d.className = 'face-box'+(i===0?' sel':'');
  const c = document.createElement('canvas');
  d.appendChild(c);
  d.onclick = () => {
    document.querySelectorAll('.face-box').forEach(e=>e.classList.remove('sel'));
    d.classList.add('sel');
    currentFace = i;
    updateAll();
  };
  facesEl.appendChild(d);
});

const skinsEl = document.getElementById('skins');
SKINS.forEach((color, i) => {
  const d = document.createElement('div');
  d.className = 'skin-sq'+(i===currentSkin?' sel':'');
  d.style.background = color;
  d.onclick = () => {
    document.querySelectorAll('.skin-sq').forEach(e=>e.classList.remove('sel'));
    d.classList.add('sel');
    currentSkin = i;
    updateAll();
  };
  skinsEl.appendChild(d);
});
updateAll();
</script>
</body></html>
