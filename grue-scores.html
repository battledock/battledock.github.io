<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Classement Grutiers — Battle Dock</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Bebas+Neue&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
body{background:#fff;font-family:'Inter',sans-serif;padding-bottom:env(safe-area-inset-bottom)}

.header{
  background:#2d2d2d;
  padding:calc(env(safe-area-inset-top,0px)+14px) 16px 16px;
  text-align:center;
  border-bottom:4px solid #d4af37;
  position:relative;
}
.header::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='6' height='6' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='1' height='1' fill='rgba(255,255,255,0.015)'/%3E%3C/svg%3E");pointer-events:none}
.header-emoji{font-size:36px;filter:drop-shadow(0 2px 8px rgba(251,191,36,.3))}
.header-title{font-family:'Bangers',cursive;font-size:22px;color:#fbbf24;letter-spacing:3px;text-shadow:2px 2px 0 rgba(0,0,0,.5);margin-top:4px}
.header-sub{font-size:9px;color:rgba(255,255,255,.25);margin-top:2px}

.content{padding:14px}
.sec{font-family:'Bangers',cursive;font-size:14px;color:#1a1a1a;letter-spacing:2px;margin:12px 0 8px;display:flex;align-items:center;gap:8px}
.sec::after{content:'';flex:1;height:2px;background:#1a1a1a}

.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:16px 0 20px}
.podium-item{text-align:center;background:#fff;border:2.5px solid #1a1a1a;border-radius:14px;box-shadow:3px 3px 0 #1a1a1a;padding:12px 10px;width:100px}
.podium-item.gold{border-color:#d4af37;box-shadow:3px 3px 0 #d4af37;transform:scale(1.05)}
.podium-rank{font-family:'Bangers',cursive;font-size:24px}
.podium-name{font-family:'Bangers',cursive;font-size:12px;color:#1a1a1a;letter-spacing:1px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.podium-score{font-family:'Bebas Neue',sans-serif;font-size:20px;color:#d4af37;margin-top:2px}
.podium-label{font-size:7px;color:#9ca3af;font-weight:700;letter-spacing:1px}

.rank-list{background:#fff;border:2.5px solid #1a1a1a;border-radius:14px;box-shadow:3px 3px 0 #1a1a1a;overflow:hidden}
.rank-item{display:flex;align-items:center;gap:10px;padding:10px 12px}
.rank-item+.rank-item{border-top:1.5px solid #f3f4f6}
.rank-item.me{background:#fefce8}
.rank-pos{font-family:'Bangers',cursive;font-size:16px;color:#9ca3af;width:28px;text-align:center}
.rank-pos.top3{color:#d4af37}
.rank-name{font-family:'Bangers',cursive;font-size:13px;color:#1a1a1a;letter-spacing:1px;flex:1}
.rank-val{font-family:'Bebas Neue',sans-serif;font-size:18px;color:#1a1a1a}

.empty{text-align:center;padding:40px 20px;color:#9ca3af}
.empty-icon{font-size:48px;margin-bottom:8px}
.empty-text{font-size:11px}

.back-btn{width:100%;margin-top:16px;padding:13px;background:#0f172a;border:2.5px solid #1a1a1a;border-radius:12px;box-shadow:3px 3px 0 #1a1a1a;font-family:'Bangers',cursive;font-size:15px;letter-spacing:2px;color:#d4af37;cursor:pointer;margin-bottom:14px}
.back-btn:active{box-shadow:0 0 0;transform:translate(3px,3px)}

.loading{text-align:center;padding:40px;color:#9ca3af;font-size:11px}
</style>
</head>
<body>

<div class="header">
  <div class="header-emoji">🏗️</div>
  <div class="header-title">CLASSEMENT GRUTIERS</div>
  <div class="header-sub">QUI CHARGE LE PLUS DE CAMIONS ?</div>
</div>

<div class="content">
  <div class="sec">🏆 PODIUM</div>
  <div class="podium" id="podium"><div class="loading">Chargement...</div></div>

  <div class="sec">📋 CLASSEMENT</div>
  <div class="rank-list" id="rankList"><div class="loading">Chargement...</div></div>

  <button class="back-btn" onclick="window.location.href='travail.html'">⬅ RETOUR</button>
</div>

<script>
var SB_URL='https://drtsuhnbclhmgfjiykap.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
var sb=supabase.createClient(SB_URL,SB_KEY);

async function load(){
  try{
    var sess=await sb.auth.getSession();
    var myUid=sess.data&&sess.data.session?sess.data.session.user.id:null;

    // Fetch all players with grue_best record
    var{data:stats}=await sb.from('game_stats').select('user_id,records');
    var{data:profiles}=await sb.from('profiles').select('user_id,username,avatar_url');

    var profMap={};
    (profiles||[]).forEach(function(p){profMap[p.user_id]=p;});

    // Extract grue_best and sort
    var players=[];
    (stats||[]).forEach(function(s){
      var best=s.records&&s.records.grue_best?s.records.grue_best:0;
      if(best>0){
        var p=profMap[s.user_id]||{};
        players.push({uid:s.user_id,name:p.username||'???',score:best});
      }
    });
    players.sort(function(a,b){return b.score-a.score;});

    // Podium
    var podiumEl=document.getElementById('podium');
    if(players.length===0){
      podiumEl.innerHTML='<div class="empty"><div class="empty-icon">🏗️</div><div class="empty-text">Aucun score pour le moment</div></div>';
      document.getElementById('rankList').innerHTML='';
      return;
    }

    var medals=['🥇','🥈','🥉'];
    var podiumHTML='';
    // Show in order: 2nd, 1st, 3rd
    var order=[1,0,2];
    order.forEach(function(idx){
      if(idx>=players.length)return;
      var p=players[idx];
      podiumHTML+='<div class="podium-item'+(idx===0?' gold':'')+'">';
      podiumHTML+='<div class="podium-rank">'+medals[idx]+'</div>';
      podiumHTML+='<div class="podium-name">'+p.name+'</div>';
      podiumHTML+='<div class="podium-score">'+p.score+'</div>';
      podiumHTML+='<div class="podium-label">CONTAINERS</div>';
      podiumHTML+='</div>';
    });
    podiumEl.innerHTML=podiumHTML;

    // Full ranking
    var listHTML='';
    players.forEach(function(p,i){
      var isMe=p.uid===myUid;
      listHTML+='<div class="rank-item'+(isMe?' me':'')+'">';
      listHTML+='<div class="rank-pos'+(i<3?' top3':'')+'">'+('#'+(i+1))+'</div>';
      listHTML+='<div class="rank-name">'+p.name+'</div>';
      listHTML+='<div class="rank-val">'+p.score+' 📦</div>';
      listHTML+='</div>';
    });
    document.getElementById('rankList').innerHTML=listHTML;

  }catch(e){
    document.getElementById('podium').innerHTML='<div class="empty"><div class="empty-text">Erreur de chargement</div></div>';
  }
}
load();
</script>
</body>
</html>
