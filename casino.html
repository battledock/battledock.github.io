<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Casino — Battle Dock</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
    html, body { height:100dvh; overflow:hidden; }
    body { font-family:'Inter',sans-serif; background:#cc1a1a; display:flex; flex-direction:column; }

    .page { flex:1; display:flex; flex-direction:column; overflow:hidden; max-width:480px; width:100%; margin:0 auto; }

    /* Header */
    .hdr { padding:calc(env(safe-area-inset-top) + 40px) 22px 0; flex-shrink:0; }
    .hdr-row { display:flex; justify-content:space-between; align-items:flex-end; }
    .hdr-title { font-family:'Bebas Neue',sans-serif; font-size:52px; color:white; line-height:0.85; letter-spacing:2px; }
    .hdr-balance { text-align:right; }
    .hdr-balance-lbl { font-size:8px; font-weight:700; color:rgba(255,255,255,0.55); letter-spacing:2px; }
    .hdr-balance-val { font-family:'Bebas Neue',sans-serif; font-size:24px; color:white; line-height:1; }
    .hdr-line { height:1px; background:rgba(0,0,0,0.2); margin-top:14px; }

    /* Bloc jetons */
    .jetons-bloc { margin:14px 22px 0; border:1px solid rgba(0,0,0,0.15); border-radius:14px; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; flex-shrink:0; }
    .jetons-lbl { font-size:8px; font-weight:700; color:rgba(255,255,255,0.55); letter-spacing:2px; margin-bottom:3px; }
    .jetons-val { font-family:'Bebas Neue',sans-serif; font-size:30px; color:white; line-height:1; }
    .jetons-btn { background:rgba(0,0,0,0.2); border:1px solid rgba(255,255,255,0.25); border-radius:10px; padding:8px 14px; color:white; font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:1px; cursor:pointer; flex-shrink:0; }
    .jetons-btn:active { opacity:0.7; }

    /* Mise slider */
    .mise-wrap { padding:14px 22px 0; flex-shrink:0; }
    .mise-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
    .mise-lbl { font-size:8px; font-weight:700; color:rgba(255,255,255,0.55); letter-spacing:2px; }
    .mise-val { font-family:'Bebas Neue',sans-serif; font-size:16px; color:white; }
    .mise-track { height:3px; background:rgba(0,0,0,0.2); border-radius:2px; }
    .mise-fill { height:100%; background:#0a0a0a; border-radius:2px; width:30%; transition:width .2s; }
    .mise-labels { display:flex; justify-content:space-between; margin-top:4px; }
    .mise-labels span { font-size:7px; color:rgba(255,255,255,0.35); }
    /* Boutons mise -->
    .mise-btns { display:flex; gap:8px; margin-top:10px; }
    .mise-btn { flex:1; padding:8px; border-radius:10px; background:rgba(0,0,0,0.15); border:1px solid rgba(255,255,255,0.15); text-align:center; cursor:pointer; }
    .mise-btn.active { background:rgba(0,0,0,0.3); border-color:rgba(255,255,255,0.4); }
    .mise-btn span { font-family:'Bebas Neue',sans-serif; font-size:14px; color:white; }
    .mise-btn:active { opacity:0.7; }

    /* Jeux */
    .jeux-wrap { flex:1; overflow:hidden; padding:14px 22px 0; display:flex; flex-direction:column; gap:0; }
    .jeux-lbl { font-size:8px; font-weight:700; color:rgba(255,255,255,0.4); letter-spacing:3px; margin-bottom:8px; }
    .jeu-row { display:flex; align-items:center; gap:14px; padding:13px 0; border-bottom:1px solid rgba(0,0,0,0.12); cursor:pointer; }
    .jeu-row:last-child { border-bottom:none; }
    .jeu-row:active { opacity:0.7; }
    .jeu-icon { width:40px; height:40px; background:rgba(0,0,0,0.15); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
    .jeu-name { font-family:'Bebas Neue',sans-serif; font-size:20px; color:white; letter-spacing:1px; flex:1; }
    .jeu-mult { font-family:'Bebas Neue',sans-serif; font-size:11px; color:rgba(255,255,255,0.4); }
    .jeu-locked { font-size:9px; color:rgba(255,255,255,0.25); background:rgba(0,0,0,0.15); padding:3px 7px; border-radius:4px; }

    /* Retour */
    .btn-retour { margin:10px 22px calc(env(safe-area-inset-bottom) + 14px); background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.2); border-radius:14px; padding:13px; color:rgba(255,255,255,0.7); font-family:'Bebas Neue',sans-serif; font-size:14px; letter-spacing:2px; cursor:pointer; flex-shrink:0; }
    .btn-retour:active { opacity:0.7; }
  </style>
</head>
<body>
<div class="page">

  <!-- Header -->
  <div class="hdr">
    <div class="hdr-row">
      <div class="hdr-title">CASINO</div>
      <div class="hdr-balance">
        <div class="hdr-balance-lbl">SOLDE</div>
        <div class="hdr-balance-val" id="soldeDisplay">—</div>
      </div>
    </div>
    <div class="hdr-line"></div>
  </div>

  <!-- Jetons -->
  <div class="jetons-bloc">
    <div>
      <div class="jetons-lbl">JETONS</div>
      <div class="jetons-val" id="jetonsDisplay">—</div>
    </div>
    <button class="jetons-btn" onclick="openGuichet()">+ ACHETER</button>
  </div>

  <!-- Mise -->
  <div class="mise-wrap">
    <div class="mise-row">
      <div class="mise-lbl">MISE PAR PARTIE</div>
      <div class="mise-val" id="miseVal">1 JETON</div>
    </div>
    <div class="mise-track"><div class="mise-fill" id="miseFill"></div></div>
    <div class="mise-labels"><span>1</span><span>5</span><span>10</span><span>25</span></div>
    <div class="mise-btns">
      <div class="mise-btn active" onclick="setMise(1,0)" id="mb1"><span>×1</span></div>
      <div class="mise-btn" onclick="setMise(5,33)" id="mb5"><span>×5</span></div>
      <div class="mise-btn" onclick="setMise(10,66)" id="mb10"><span>×10</span></div>
      <div class="mise-btn" onclick="setMise(25,100)" id="mb25"><span>×25</span></div>
    </div>
  </div>

  <!-- Jeux -->
  <div class="jeux-wrap">
    <div class="jeux-lbl">LES JEUX</div>
    <div class="jeu-row" onclick="lancerJeu('slots.html')">
      <div class="jeu-icon">🎰</div>
      <div class="jeu-name">MACHINE À SOUS</div>
      <div class="jeu-mult">JACKPOT ×3</div>
    </div>
    <div class="jeu-row" onclick="lancerJeu('roulette.html')">
      <div class="jeu-icon">🎡</div>
      <div class="jeu-name">ROULETTE</div>
      <div class="jeu-mult">ROUGE/NOIR ×2</div>
    </div>
    <div class="jeu-row" onclick="lancerJeu('blackjack.html')">
      <div class="jeu-icon">🃏</div>
      <div class="jeu-name">BLACKJACK</div>
      <div class="jeu-mult">BEAT 21 ×2.5</div>
    </div>
    <div class="jeu-row" onclick="lancerJeu('crash.html')">
      <div class="jeu-icon">🚀</div>
      <div class="jeu-name">CRASH</div>
      <div class="jeu-mult">FUSÉE ×?</div>
    </div>
    <div class="jeu-row" onclick="lancerJeu('higher-lower.html')">
      <div class="jeu-icon">🎴</div>
      <div class="jeu-name">HIGHER / LOWER</div>
      <div class="jeu-mult">CARTES ×2</div>
    </div>
  </div>

  <button class="btn-retour" onclick="window.location.href='game.html'">← RETOUR AU JEU</button>

</div>

<!-- Guichet modal -->
<div id="guichetModal" onclick="fermerGuichet(event)" style="display:none;position:fixed;inset:0;z-index:999;background:rgba(0,0,0,0.75);backdrop-filter:blur(8px);align-items:center;justify-content:center">
  <div style="background:white;border-radius:22px;padding:24px 20px;max-width:320px;width:90%;text-align:center">
    <div style="font-size:36px;margin-bottom:8px">🎟️</div>
    <div style="font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:2px;color:#cc1a1a;margin-bottom:2px">GUICHET</div>
    <div style="font-size:11px;color:#9ca3af;margin-bottom:6px">1 jeton = 500€</div>
    <div style="font-family:'Bebas Neue',sans-serif;font-size:20px;color:#0a0a0a;margin-bottom:16px" id="guichetJetons">— 🎟️</div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px">
      <button onclick="acheterJetons(10)" style="background:#f5f5f5;border:none;border-radius:12px;padding:13px;color:#0a0a0a;font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:1px;cursor:pointer">10 jetons — 5 000€</button>
      <button onclick="acheterJetons(25)" style="background:#f5f5f5;border:none;border-radius:12px;padding:13px;color:#0a0a0a;font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:1px;cursor:pointer">25 jetons — 12 500€</button>
      <button onclick="acheterJetons(50)" style="background:#cc1a1a;border:none;border-radius:12px;padding:13px;color:white;font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:1px;cursor:pointer">50 jetons — 25 000€ ⭐</button>
    </div>
    <button onclick="fermerGuichet()" style="width:100%;background:none;border:1px solid rgba(0,0,0,0.1);border-radius:12px;padding:11px;color:#9ca3af;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;cursor:pointer">Fermer</button>
  </div>
</div>

<script>
  const SB_URL = 'https://drtsuhnbclhmgfjiykap.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
  const { createClient } = supabase;
  const sb = createClient(SB_URL, SB_KEY);

  let currentUser = null;
  let currentMise = 1;

  function setMise(val, pct) {
    currentMise = val;
    document.getElementById('miseVal').textContent = val + ' JETON' + (val > 1 ? 'S' : '');
    document.getElementById('miseFill').style.width = Math.max(10, pct) + '%';
    ['mb1','mb5','mb10','mb25'].forEach(id => document.getElementById(id).classList.remove('active'));
    document.getElementById('mb' + val).classList.add('active');
  }

  async function init() {
    const { data:{ session } } = await sb.auth.getSession();
    if (!session) { window.location.href = 'index.html'; return; }
    currentUser = session.user;

    // Vérif déblocage ch3
    const { data: gs } = await sb.from('game_stats')
      .select('money, jetons, story_progress')
      .eq('user_id', currentUser.id).maybeSingle();

    if (!gs?.story_progress?.scene3_done) {
      document.body.innerHTML = `<div style="min-height:100dvh;background:#cc1a1a;display:flex;align-items:center;justify-content:center;padding:20px"><div style="max-width:300px;text-align:center"><div style="font-size:64px;margin-bottom:16px">🔒</div><div style="font-family:'Bebas Neue',sans-serif;font-size:28px;color:white;margin-bottom:8px;letter-spacing:2px">CASINO FERMÉ</div><div style="font-size:13px;color:rgba(255,255,255,0.5);line-height:1.6;margin-bottom:24px">Se débloque au Chapitre 3 du mode Histoire</div><button onclick="window.location.href='histoire.html'" style="width:100%;padding:14px;border:none;border-radius:12px;background:white;color:#cc1a1a;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px;cursor:pointer;margin-bottom:8px">MODE HISTOIRE →</button><button onclick="window.location.href='game.html'" style="width:100%;padding:12px;border:1px solid rgba(255,255,255,0.25);border-radius:12px;background:transparent;color:rgba(255,255,255,0.5);font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;cursor:pointer">← Retour</button></div></div>`;
      return;
    }

    window._currentUserId = currentUser.id;
    window._currentJetons = gs?.jetons || 0;
    document.getElementById('soldeDisplay').textContent = (gs?.money || 0).toLocaleString('fr-FR') + '€';
    document.getElementById('jetonsDisplay').textContent = window._currentJetons + ' 🎟️';
  }

  function openGuichet() {
    document.getElementById('guichetJetons').textContent = (window._currentJetons || 0) + ' 🎟️';
    document.getElementById('guichetModal').style.display = 'flex';
  }

  function fermerGuichet(e) {
    if (e && e.target !== e.currentTarget) return;
    document.getElementById('guichetModal').style.display = 'none';
  }

  async function acheterJetons(qty) {
    const price = qty * 500;
    const { data: fresh } = await sb.from('game_stats').select('money,jetons').eq('user_id', window._currentUserId).maybeSingle();
    if (!fresh || fresh.money < price) { alert('Pas assez d\'argent ! Il te faut ' + price.toLocaleString('fr-FR') + '€'); return; }
    const newMoney  = fresh.money - price;
    const newJetons = (fresh.jetons || 0) + qty;
    await sb.from('game_stats').update({ money: newMoney, jetons: newJetons }).eq('user_id', window._currentUserId);
    window._currentJetons = newJetons;
    document.getElementById('jetonsDisplay').textContent  = newJetons + ' 🎟️';
    document.getElementById('guichetJetons').textContent  = newJetons + ' 🎟️';
    document.getElementById('soldeDisplay').textContent   = newMoney.toLocaleString('fr-FR') + '€';
    fermerGuichet();
  }

  async function lancerJeu(url) {
    if ((window._currentJetons || 0) < currentMise) { openGuichet(); return; }
    const { data: fresh } = await sb.from('game_stats').select('jetons').eq('user_id', window._currentUserId).maybeSingle();
    if (!fresh || fresh.jetons < currentMise) { openGuichet(); return; }
    const newJetons = fresh.jetons - currentMise;
    await sb.from('game_stats').update({ jetons: newJetons }).eq('user_id', window._currentUserId);
    window._currentJetons = newJetons;
    document.getElementById('jetonsDisplay').textContent = newJetons + ' 🎟️';
    window.location.href = url;
  }

  init();
</script>
</body>
</html>
