<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Casino - Battle Dock</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #7f1d1d 0%, #991b1b 50%, #dc2626 100%); min-height: 100vh; padding: 16px; padding-bottom: 80px; }
    .container { max-width: 800px; margin: 0 auto; }
    
    /* HEADER */
    .header { background: linear-gradient(135deg, #fbbf24, #f59e0b); border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 8px 32px rgba(251, 191, 36, 0.5); }
    .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 12px; }
    .casino-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(20px, 5vw, 32px); color: #7f1d1d; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2); letter-spacing: 2px; white-space: nowrap; }
    .balance-box { background: white; border-radius: 12px; padding: 8px 16px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15); display: flex; align-items: center; gap: 8px; }
    .balance-icon { font-size: 24px; }
    .balance-info { display: flex; flex-direction: column; }
    .balance-label { font-size: 10px; color: #6b7280; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .balance-amount { font-family: 'Bebas Neue', sans-serif; font-size: clamp(18px, 4vw, 24px); color: #7f1d1d; letter-spacing: 1px; line-height: 1; }
    .casino-subtitle { font-size: clamp(11px, 2.5vw, 13px); color: rgba(127, 29, 29, 0.8); font-weight: 600; text-align: center; }

    /* MENU */
    .games-menu { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
    .game-card { background: white; border-radius: 16px; padding: 20px 12px; cursor: pointer; transition: all 0.3s; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15); position: relative; text-decoration: none; display: block; }
    .game-card:active { transform: scale(0.95); }
    .game-icon { font-size: 44px; text-align: center; margin-bottom: 8px; }
    .game-name { font-family: 'Bebas Neue', sans-serif; font-size: 16px; color: #dc2626; text-align: center; letter-spacing: 1px; }
    .game-badge { position: absolute; top: 6px; right: 6px; background: #ef4444; color: white; font-size: 8px; font-weight: 700; padding: 3px 7px; border-radius: 6px; }

    /* BOTTOM NAV */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #e5e7eb; padding: 12px 16px; box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.1); z-index: 100; }
    .nav-btn { width: 100%; max-width: 800px; margin: 0 auto; display: flex; background: linear-gradient(135deg, #7f1d1d, #991b1b); color: white; border: none; border-radius: 12px; padding: 12px; font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 1px; cursor: pointer; align-items: center; justify-content: center; gap: 8px; }

    @media (min-width: 400px) {
      .games-menu { grid-template-columns: repeat(3, 1fr); }
    }
    @media (min-width: 600px) {
      .games-menu { grid-template-columns: repeat(4, 1fr); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-top">
        <div class="casino-title">🎰 BATTLE DOCK CASINO 🎰</div>
        <div class="balance-box">
          <div class="balance-icon">💰</div>
          <div class="balance-info">
            <div class="balance-label">Ton Solde</div>
            <div class="balance-amount" id="balance">0€</div>
          </div>
        </div>
      </div>
      <div class="casino-subtitle">🎲 Choisis ton jeu et tente ta chance 🍀</div>
    </div>

    <div class="games-menu">
      <a href="roulette.html" class="game-card">
        <div class="game-icon">🎡</div>
        <div class="game-name">Roulette</div>
      </a>
      <a href="slots.html" class="game-card">
        <div class="game-icon">🎰</div>
        <div class="game-name">Slots</div>
      </a>
      <a href="coin.html" class="game-card">
        <div class="game-icon">🪙</div>
        <div class="game-name">Pile ou Face</div>
      </a>
      <a href="higher-lower.html" class="game-card">
        <div class="game-badge">NEW</div>
        <div class="game-icon">🃏</div>
        <div class="game-name">Higher/Lower</div>
      </a>
      <a href="plinko.html" class="game-card">
        <div class="game-badge">NEW</div>
        <div class="game-icon">🔴</div>
        <div class="game-name">Plinko</div>
      </a>
      <a href="blackjack.html" class="game-card">
        <div class="game-badge">NEW</div>
        <div class="game-icon">🃏</div>
        <div class="game-name">Blackjack</div>
      </a>
      <a href="crash.html" class="game-card">
        <div class="game-badge">NEW</div>
        <div class="game-icon">🚀</div>
        <div class="game-name">Crash</div>
      </a>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-btn" onclick="window.location.href='game.html'">← RETOUR AU JEU</button>
  </div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const sb = createClient(supabaseUrl, supabaseKey);

    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('gesturechange', e => e.preventDefault());

    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { window.location.href = 'index.html'; return; }
      const { data } = await sb.from('game_stats').select('money').eq('user_id', session.user.id).maybeSingle();
      if (!data) { await sb.auth.signOut(); window.location.href = 'index.html'; return; }
      document.getElementById('balance').textContent = (data?.money || 0).toLocaleString('fr-FR') + '€';
    }

    init();
  </script>
</body>
</html>
