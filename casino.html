        return;

        .from('game_stats')
        .select('money')
        .eq('user_id', session.user.id)
        .single();

      document.getElementById('balance').textContent = (stats?.money || 0).toLocaleString('fr-FR') + '€';
      
      await loadJackpot();
      await loadStats();
      await loadRecentWins();

      setInterval(loadJackpot, 1000);
      setInterval(loadStats, 3000);

        const { data: { session } } = await sb.auth.getSession();
        const today = new Date().toISOString().split('T')[0];

        const { data: allWins } = await sb
          .from('casino_wins')
          .select('amount_won, amount_bet')
          .eq('user_id', session.user.id)
          .gte('created_at', today + 'T00:00:00');

        let totalBet = 0;
        let totalWins = 0;

        if (allWins) {
          allWins.forEach(w => {
            totalBet  += w.amount_bet  || 0;
            if (w.amount_won > 0) totalWins += w.amount_won;
          });
        }

        document.getElementById('totalBet').textContent = totalBet.toLocaleString('fr-FR') + '€';
        document.getElementById('totalWins').textContent = totalWins.toLocaleString('fr-FR') + '€';
      } catch (e) {
        console.log('Erreur stats:', e.message);
      }
    }

    async function loadRecentWins() {
      try {
        const { data: wins, error } = await sb
          .from('casino_wins')
          .select('user_name, game_name, amount_won')
          .order('created_at', { ascending: false })
          .limit(5);

        const feedEl = document.getElementById('liveFeed');
        
        if (error) {
          console.log('Erreur BD gains:', error.message);
          return;
        }

        if (!wins || wins.length === 0) {
          feedEl.innerHTML = '<div class="feed-item">Aucun gain pour le moment...</div>';
          return;
        }

        const gameEmojis = {
          'Roulette': '🎡',
          'Blackjack': '♠️',
          'Slots': '🎰',
          'Crash': '🚀',
          'Higher/Lower': '🃏',
          'JACKPOT PROGRESSIF': '🎯'
        };

        const gains = wins.filter(w => w.amount_won > 0);
        if (!gains.length) {
          feedEl.innerHTML = '<div class="feed-item">Aucun gain pour le moment...</div>';
          return;
        }
        feedEl.innerHTML = gains.map(win => {
          const emoji = gameEmojis[win.game_name] || '🎉';
          const preposition = (win.game_name === 'Roulette' || win.game_name === 'Higher/Lower') ? 'à la' : 'au';
          return `<div class="feed-item">${emoji} <b>${win.user_name}</b> a gagné <b>${win.amount_won.toLocaleString('fr-FR')}€</b> ${preposition} ${win.game_name}</div>`;
        }).join('');
      } catch (e) {
        console.log('Erreur fetch gains:', e.message);
      }
    }

    // Anti-zoom et anti-copie
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('gesturechange', e => e.preventDefault());
    
    let lastTouchEnd = 0;
    document.addEventListener('touchend', e => {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) {
        e.preventDefault();
      }
      lastTouchEnd = now;
    }, false);
    
    document.addEventListener('copy', e => e.preventDefault());
    document.addEventListener('cut', e => e.preventDefault());
    document.addEventListener('paste', e => e.preventDefault());
    document.addEventListener('contextmenu', e => e.preventDefault());

    init();
  </script>
</body>
</html>
