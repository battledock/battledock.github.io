<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>Casino — Survivre</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0d0a0e;font-family:system-ui,sans-serif;
  user-select:none;-webkit-user-select:none}
#cv{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%)}
#joy{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}

#hud{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top));z-index:4;
  display:flex;align-items:center;gap:9px;padding:9px 15px;border-radius:14px;
  background:rgba(246,245,241,.94);border:1px solid rgba(40,35,25,.1);
  box-shadow:0 5px 16px rgba(0,0,0,.35)}
#hud b{font:400 18px Georgia,serif;color:#16140f}
#hud i{font:600 8px system-ui;letter-spacing:1.6px;color:#a29c92;font-style:normal}

#action{position:fixed;right:14px;bottom:calc(26px + env(safe-area-inset-bottom));z-index:5;
  display:none;flex-direction:column;align-items:center;gap:2px;padding:13px 17px;border-radius:15px;
  border:0;background:#16140f;box-shadow:0 5px 18px rgba(0,0,0,.45);
  font:600 13px system-ui;color:#f6f5f1}
#action.on{display:flex}
#action:active{transform:translateY(2px);box-shadow:0 2px 8px rgba(0,0,0,.4)}
#action small{font:600 8.5px system-ui;letter-spacing:1.2px;color:#a29c92}

#page{position:fixed;inset:0;z-index:20;display:none}
#page.on{display:block}
.fond{position:absolute;inset:0;background:#f6f5f1;display:flex;flex-direction:column;
  animation:ap .22s cubic-bezier(.2,.85,.3,1)}
@keyframes ap{from{opacity:0;transform:scale(1.02)}}
.tete{background:#fff;border-bottom:1px solid #e9e7e0;
  padding:calc(13px + env(safe-area-inset-top)) 14px 14px;display:flex;align-items:center;gap:11px}
.x{width:34px;height:34px;border-radius:50%;background:#f1efe9;border:0;
  color:#5f5b54;font:600 13px system-ui;display:flex;align-items:center;justify-content:center}
.t1{font:400 20px Georgia,serif;color:#16140f}
.t2{font:600 8px system-ui;letter-spacing:1.8px;color:#a29c92;margin-top:3px}
.jet{margin-left:auto;text-align:right}
.jet b{display:block;font:400 20px Georgia,serif;color:#16140f}
.jet i{display:block;font:600 7.5px system-ui;letter-spacing:1.4px;color:#a29c92;font-style:normal}
.corps{position:relative;flex:1;padding:14px;overflow-y:auto}

.caisseVue{border-radius:16px;padding:14px 12px 12px;margin-bottom:4px;background:#fff;
  border:1px solid #eceae3;box-shadow:0 2px 10px rgba(40,35,25,.08)}
.tiroir{display:flex;gap:12px;justify-content:center;padding:4px 0 10px}
.rang{display:flex;flex-direction:column;align-items:center;gap:5px}
.pileC{position:relative;width:38px;height:46px;display:block}
.jc{position:absolute;left:0;filter:drop-shadow(0 2px 3px rgba(40,35,25,.22))}
.nom{font:600 9px system-ui;color:#a29c92}
.mot{font:400 12.5px/1.6 Georgia,serif;color:#4a453c;text-align:center;padding:8px 6px 2px}
.titreP{font:600 8px system-ui;letter-spacing:2px;color:#a29c92;margin:18px 0 10px}

.ech{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:13px;
  background:#fff;box-shadow:0 2px 7px rgba(40,35,25,.07);margin-bottom:9px;
  border-left:4px solid #9c3232}
.ech.gris{opacity:.5;border-left-color:#d8d4ca;box-shadow:0 2px 7px rgba(40,35,25,.04)}
.ech .ic{width:38px;height:38px;border-radius:10px;background:#f4f2ec;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ech .tx{flex:1;min-width:0}
.ech .tx b{display:block;font:600 13px system-ui;color:#16140f}
.ech .tx span{display:block;font:400 10px system-ui;color:#a29c92;margin-top:2px}
.ech .val{font:400 17px Georgia,serif;color:#16140f}
.ech.gris .val{color:#b4afa4}
.ech button{padding:10px 13px;border-radius:10px;border:0;background:#16140f;
  font:600 11px system-ui;color:#f6f5f1}
.ech button:disabled{background:#eceae3;color:#b4afa4}
.tout{display:block;width:100%;margin-top:6px;padding:15px;border-radius:13px;border:0;
  background:#16140f;font:700 14px system-ui;color:#f6f5f1;
  box-shadow:0 3px 10px rgba(20,18,12,.22)}
.tout:active{transform:translateY(2px)}
.vide{text-align:center;font:400 11.5px/1.6 system-ui;color:#a29c92;padding:14px}
.res{text-align:center;font:600 12px system-ui;color:#3f7d4a;min-height:20px;margin-top:12px}
.res b{color:#16140f}
.pluie{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pluie i{position:absolute;top:-34px;animation:tombeJ 1.8s cubic-bezier(.4,0,.7,1) forwards}
@keyframes tombeJ{60%{transform:translateY(56vh) rotate(220deg)}
  75%{transform:translateY(50vh) rotate(250deg)}100%{transform:translateY(54vh) rotate(260deg);opacity:.9}}
</style></head>
<body>
<canvas id="cv"></canvas>
<canvas id="joy"></canvas>
<div id="hud"><b id="jetons">0</b><i>JETONS</i></div>
<button id="action"></button>
<div id="page"><div class="fond" id="pageFond"></div></div>

<script type="module">
const $=id=>document.getElementById(id);
const cv=$('cv'), ctx=cv.getContext('2d');
const alea=s=>{const v=Math.sin(s*127.1)*43758.5453;return v-Math.floor(v);};
let GESTE={t:0};
let joyX=0, joyY=0;

/* ================= le personnage, en pixels =================
   Proportions : 40 pixels de haut, quatre têtes.
   Repère : x au milieu des pieds, y au sol.                     */
const PALETTES={
 peau:['#f6ddc0','#f0d0ae','#e8c49a','#d8a878','#c08a58','#a2683c','#7d4e2a','#5a3720'],
 cheveux:['#1c140d','#2b1d12','#4a3220','#6b4726','#8a5f30','#b58a4a','#d9c48a','#f2e6c8',
          '#8a8f96','#c9c9c9','#a8402c','#c2604a','#6b3f8f','#2f6b8f','#3f7d4a','#b53f6b'],
 yeux:['#26241f','#3f5f6b','#4a6b3f','#6b4a3f','#5a4a6b','#7d6a3f','#2f6b8f','#8f4a3f'],
 veste:['#4f7d5c','#5a6b8f','#8a5a4a','#6b5f8f','#7d6a3f','#3f5f6b','#8f6a3f','#54606b',
        '#a8524a','#3f7d4a','#c2a04a','#2f3a4a','#7a4f6b','#4a7d7d','#9c5f2f','#5f5f5f'],
 pantalon:['#3a4358','#4a4038','#2f3a2f','#5a4a3a','#3a3a44','#6b5f4a','#2b3340','#7d6a4a'],
 chaussures:['#4a3524','#2f2a24','#5a4a3a','#6b4a28','#3f4a53','#7d5934'],
 sac:['aucun','#7d5934','#4a5c6b','#6b4a4a','#4f6b4a','#8a6a44','#54606b']
};
const COIFFES=['courts','très courts','dégradé','bol','carré','mi-longs','longs','très longs',
               'queue','couettes','chignon','chignon haut','tresse','tresses','ondulés','bouclés',
               'afro','dreads','banane','crête','crâne','hirsute'];
const BARBES=['aucune','naissante','fine','courte','pleine','longue','bouc','moustache',
              'collier','favoris','impériale','fourchue'];
const CHAPEAUX=['aucun','casquette','bandana','bonnet','capuche','chapeau','beret','cagoule'];
const YEUX_F=['normaux','plisses','ronds','fatigues','doux','severes'];
const SILHOUETTES=['fine','svelte','moyenne','athlétique','forte'];
const HAUTS=['veste','t-shirt','chemise','pull','débardeur','manteau','gilet','tunique'];
const BAS=['pantalon','short','jupe','treillis','longue jupe','bermuda'];
const SOULIERS=['bottes','baskets','sandales','bottillons'];
const SOURCILS=['fins','epais','arques','fronces'];
const NEZ=['petit','droit','large','retrousse'];
const BOUCHES=['neutre','sourire','severe','entrouverte','lèvres','pincée'];
const MARQUES=['aucune','taches','cicatrice','grain','fard','peinture'];
const BOUCLES=['aucune','anneau','perle','plume'];
const DEF_AP={peau:2,cheveux:2,coiffe:0,barbe:0,yeux:0,formeYeux:0,veste:0,pantalon:0,
              chaussures:0,chapeau:0,sac:1,
              sourcils:0,nez:1,bouche:0,marque:0,boucle:0,
              corps:0,haut:0,bas:0,souliers:0};
const teint=(c,k)=>{
  const n=parseInt(c.slice(1),16);
  const f=v=>Math.max(0,Math.min(255,v+k));
  return '#'+((1<<24)+(f((n>>16)&255)<<16)+(f((n>>8)&255)<<8)+f(n&255)).toString(16).slice(1);
};

function sprite(g,x,y,ap0,dir,pas,bouge){
  const p=Object.assign({},DEF_AP,ap0||{});
  const P=PALETTES;
  const peau=P.peau[p.peau]||P.peau[2], peauO=teint(peau,-24), peauC=teint(peau,14), peauT=teint(peau,-52);
  const chev=P.cheveux[p.cheveux]||P.cheveux[2], chevC=teint(chev,22), chevO=teint(chev,-22);
  const veste=P.veste[p.veste]||P.veste[0], vesteC=teint(veste,20), vesteO=teint(veste,-26), vesteT=teint(veste,-48);
  const pant=P.pantalon[p.pantalon]||P.pantalon[0], pantO=teint(pant,-18), pantC=teint(pant,12);
  const chau=P.chaussures[p.chaussures]||P.chaussures[0], chauC=teint(chau,20);
  const oeil=P.yeux[p.yeux]||P.yeux[0];
  const coiffe=COIFFES[p.coiffe]||'courts', barbe=BARBES[p.barbe]||'aucune';
  const chapeau=CHAPEAUX[p.chapeau]||'aucun', sacC=P.sac[p.sac]||'aucun';
  const fy=YEUX_F[p.formeYeux]||'normaux';
  const sourcil=SOURCILS[p.sourcils]||'fins';
  const nez=NEZ[p.nez]||'droit';
  const bouche=BOUCHES[p.bouche]||'neutre';
  const marque=MARQUES[p.marque]||'aucune';
  const boucle=BOUCLES[p.boucle]||'aucune';
  const silhouette=SILHOUETTES[p.corps]||'masculine';
  const hautT=HAUTS[p.haut]||'veste';
  const basT=BAS[p.bas]||'pantalon';
  const soulier=SOULIERS[p.souliers]||'bottes';
  /* la silhouette : largeur d'épaules, taille, hanches */
  const SIL={'fine'      :{ep:6,ta:5,ha:6,tete:5,menton:1},
             'svelte'    :{ep:7,ta:5,ha:7,tete:5,menton:1},
             'moyenne'   :{ep:8,ta:7,ha:7,tete:6,menton:2},
             'athlétique':{ep:9,ta:7,ha:7,tete:6,menton:2},
             'forte'     :{ep:9,ta:9,ha:9,tete:6,menton:3}}[silhouette]||{ep:8,ta:7,ha:7,tete:6,menton:2};
  const EP=SIL.ep, TA=SIL.ta, HA=SIL.ha;   /* demi-largeurs */
  const N='#1b1712';
  const R=(a,b,w,h,c)=>{g.fillStyle=c;g.fillRect(x+a,y+b,w,h);};

  /* marche souple, huit temps */
  const F=bouge?(Math.floor(pas)%8):-1;
  const AN={corps:[0,0,-1,0,0,0,-1,0],
            jg:[2,1,-1,-2,-2,-1,1,2], jd:[-2,-1,1,2,2,1,-1,-2],
            pg:[0,0,1,0,0,0,0,0],     pd:[0,0,0,0,0,0,1,0],
            bg:[-2,-1,1,2,2,1,-1,-2], bd:[2,1,-1,-2,-2,-1,1,2],
            reb:[0,0,1,0,0,0,1,0]};
  const souffle=bouge?0:((Date.now()/1400|0)%3===0?1:0);
  const Y=bouge?AN.corps[F]:souffle;
  const jgP=bouge?AN.jg[F]:0, jdP=bouge?AN.jd[F]:0;
  const jgL=bouge?AN.pg[F]:0, jdL=bouge?AN.pd[F]:0;
  const bgP=bouge?AN.bg[F]:0, bdP=bouge?AN.bd[F]:0;
  const reb=bouge?AN.reb[F]:0;
  const prof=dir==='haut', cote=dir==='gauche'||dir==='droite';
  const MANCHE_AR={'veste':11,'chemise':11,'pull':11,'manteau':11,'tunique':9,
                   'gilet':0,'t-shirt':4,'débardeur':0}[HAUTS[p.haut]||'veste'];
  const s=dir==='droite'?1:-1;

  /* ---- mesures du corps (quatre têtes) ----
     pieds 0 · jambes 13 · torse 15 · tête 11, sommet à -40 */
  const JH=13, TH=15, HT=11;
  const yT=-JH-TH;                 /* haut du torse  = -28 */
  const yTete=yT-HT-2;             /* la tête est décollée du torse : le cou apparaît */

  /* ---- le geste de frappe, en trois temps ----
     1 → 0,58 : l'élan, la pioche part en arrière
     0,58 → 0,42 : l'abattage, très rapide
     0,42 → 0   : la reprise, le corps se redresse                */
  const fr=(typeof GESTE!=='undefined'&&GESTE.t>0)?GESTE.t:0;
  const typeGeste=(typeof GESTE!=='undefined'&&GESTE.type)||'pioche';
  let phase=0, arc=0, penche=0, tasse=0;
  if(fr>0&&typeGeste==='cueille'){
    /* la cueillette : on se penche, le bras part vers le buisson, on se relève */
    if(fr>0.55){const t=(1-fr)/0.45;penche=doux(t)*2.6;tasse=doux(t)*1.6;arc=1.1*doux(t);phase=1;}
    else if(fr>0.3){const t=(0.55-fr)/0.25;penche=2.6;tasse=1.6;arc=1.1+t*0.5;phase=2;}
    else{const t=1-fr/0.3;penche=2.6*(1-sortRap(t));tasse=1.6*(1-sortRap(t));arc=1.6*(1-sortRap(t));phase=3;}
  }else if(fr>0&&typeGeste==='hache'){
    /* la hache : élan haut, balayage large, reprise lente */
    if(fr>0.62){const t=(1-fr)/0.38;arc=-1.9*doux(t);penche=-doux(t)*2;tasse=doux(t)*1.4;phase=1;}
    else if(fr>0.42){const t=(0.62-fr)/0.2;arc=-1.9+entreRap(t)*3.3;penche=-2+t*5.2;tasse=1.4-t*2.8;phase=2;}
    else{const t=1-fr/0.42;arc=1.4*(1-sortRap(t));penche=3.2*(1-sortRap(t));tasse=-1.4*(1-sortRap(t));phase=3;}
  }else if(fr>0){
    if(fr>0.58){const t=(1-fr)/0.42;arc=-1.45*doux(t);penche=-doux(t)*1.6;tasse=doux(t)*1.2;phase=1;}
    else if(fr>0.42){const t=(0.58-fr)/0.16;arc=-1.45+entreRap(t)*2.75;penche=-1.6+t*4.4;tasse=1.2-t*2.4;phase=2;}
    else{const t=1-fr/0.42;arc=1.3*(1-sortRap(t));penche=2.8*(1-sortRap(t));tasse=-1.2*(1-sortRap(t));phase=3;}
  }

  R(-6,1,12,2,'rgba(40,60,28,.42)');

  /* sac */
  if(sacC!=='aucun'&&prof){                     /* de dos : le sac, bien posé entre les épaules */
    const w2=Math.min(10,EP*2-4);
    R(-(w2>>1),yT+2-reb,w2,13,teint(sacC,-8));
    R(-(w2>>1),yT+2-reb,w2,2,teint(sacC,16));
    R(-(w2>>1),yT+12-reb,w2,2,teint(sacC,-26));
    R(-2,yT+6-reb,4,4,teint(sacC,10));          /* la poche */
    R(-2,yT+6-reb,4,1,teint(sacC,-30));
  }else if(sacC!=='aucun'&&cote){               /* de profil : il dépasse dans le dos */
    const sx=s>0?-(EP+1):EP-2;
    R(sx,yT+2-reb,4,12,teint(sacC,-16));
    R(sx,yT+2-reb,4,2,teint(sacC,10));
    R(sx,yT+12-reb,4,1,teint(sacC,-30));
  }

  /* ---- jambes ---- */
  /* la chaussure, dessinée selon son type */
  const pied=(px2,py,col)=>{
    if(soulier==='bottes'){
      R(px2,py-2,5,2,teint(col,-16));              /* la tige monte sur la cheville */
      R(px2,py,5,3,col);
      R(px2,py,5,1,teint(col,20));
      R(px2,py+2,5,1,teint(col,-26));             /* la semelle */
    }else if(soulier==='bottillons'){
      R(px2,py-1,5,1,teint(col,-16));
      R(px2,py,5,3,col);
      R(px2,py,5,1,teint(col,18));
      R(px2,py+2,5,1,teint(col,-30));
    }else if(soulier==='baskets'){
      R(px2,py,5,2,col);
      R(px2,py,5,1,teint(col,22));
      R(px2+1,py,2,1,'#f2efe4');                   /* le lacet */
      R(px2,py+2,5,1,'#e8e4d8');                   /* la semelle claire */
    }else{                                          /* sandales : le pied reste visible */
      R(px2+1,py,3,2,peauO);
      R(px2,py+1,5,1,col);
      R(px2+1,py,3,1,col);
      R(px2,py+2,5,1,teint(col,-22));
    }
  };

  /* jusqu'où le tissu descend, selon le bas porté */
  const TISSU={'pantalon':JH,'short':6,'jupe':5,'treillis':JH,'longue jupe':10,'bermuda':8}[basT];
  const jambeProfil=(dec,plie,col,botte)=>{
    const h=JH-plie;
    R(-2+dec,-JH,4,h,peau);                    /* la jambe nue */
    if(TISSU>0)R(-2+dec,-JH,4,Math.min(h,TISSU),col);
    if(TISSU>=h)R(-2+dec,-4,4,4,teint(col,-12));
    if(basT==='treillis'){R(-2+dec,-JH+5,4,1,teint(col,-22));R(-1+dec,-JH+6,2,2,teint(col,14));}
    pied(-3+dec,-JH+h,botte);
  };
  const jambeFace=(cx,phase,col,botte)=>{
    const avance=phase>0;
    const h=avance?JH:JH-2;
    const ec=Math.abs(phase)>1?(avance?-1:1):0;
    R(cx+ec,-JH,4,h,avance?teint(peau,4):teint(peau,-14));   /* la jambe */
    if(TISSU>0){
      R(cx+ec,-JH,4,Math.min(h,TISSU),avance?teint(col,8):teint(col,-10));
      R(cx+ec,-JH,4,1,pantC);
    }
    if(basT==='treillis'){R(cx+ec,-JH+5,4,1,teint(col,-22));R(cx+1+ec,-JH+6,2,2,teint(col,14));}
    pied(cx-1+ec,-JH+h,avance?botte:teint(botte,-14));
  };
  if(cote){
    jambeProfil(jdP*0.9-1,jdL,pantO,teint(chau,-14));
    jambeProfil(jgP*0.9-1,jgL,pant,chau);
  }else{
    if(jgP>=jdP){jambeFace(1,jdP,pantO,teint(chau,-14));jambeFace(-5,jgP,pant,chau);}
    else{jambeFace(-5,jgP,pant,chau);jambeFace(1,jdP,pantO,teint(chau,-14));}
  }

  /* jupe : un trapèze par-dessus le haut des jambes */
  if(basT==='jupe'||basT==='longue jupe'){
    const hj=basT==='jupe'?6:9;
    for(let i=0;i<hj;i++){
      const w2=HA-1+Math.round(i*(basT==='jupe'?0.7:0.55));
      R(-w2,-JH+i,w2*2,1,i<2?pantC:pant);
    }
    R(-(HA+3),-JH+hj-1,(HA+3)*2,1,pantO);
  }

  /* hanches : elles ferment la jonction entre le torse et les jambes */
  R(-(HA+1),-JH-2,(HA+1)*2,3,N);
  R(-HA,-JH-1,HA*2,2,pantO);
  R(-HA,-JH-1,HA*2,1,pant);

  /* ---- bras arrière (profil) ---- */
  if(cote){
    const ar=bgP;
    const bx=(s>0?-6:3)-ar*s;
    R(bx,yT+2,3,11,peauT);
    if(MANCHE_AR>0)R(bx,yT+2,3,MANCHE_AR,vesteT);
    R(bx,yT+13,3,3,peauT);
  }

  /* ---- torse : la coupe du vêtement suit la silhouette ---- */
  const colH=veste, colHC=vesteC, colHO=vesteO, colHT=vesteT;
  const pen=fr>0?Math.round(penche*(dir==='gauche'?-1:1)):0;   /* il se penche dans l'effort */
  const tas=fr>0?Math.max(0,Math.round(tasse)):0;              /* et se tasse */
  R(-EP+pen,yT-1+tas,EP*2,TH+1-tas,N);           /* contour aux épaules */
  R(-EP+1,yT,EP*2-2,3,colH);                     /* les épaules */
  R(-EP+1,yT,EP*2-2,2,colHC);
  for(let i=3;i<TH-1;i++){                       /* le buste, resserré à la taille */
    const w2=Math.round(EP-1-(EP-TA)*Math.min(1,(i-2)/(TH-5)));
    R(-w2,yT+i,w2*2,1,colH);
    R(-w2,yT+i,2,1,colHT);
    R(w2-2,yT+i,2,1,colHO);
  }
  R(-TA,yT+TH-4,TA*2,2,colHO);                   /* ceinture */
  R(-1,yT+TH-4,2,2,'#c9a24a');
  /* les détails propres à chaque haut */
  if(hautT==='veste'&&!prof){R(-1,yT,2,TH-5,colHO);R(-4,yT,3,2,colHC);R(1,yT,3,2,colHC);}
  if(hautT==='chemise'&&!prof){
    R(-1,yT,2,TH-5,colHT);
    R(-4,yT,4,3,colHC);R(0,yT,4,3,colHC);        /* col ouvert */
    for(let i=0;i<3;i++)R(0,yT+4+i*3,1,1,'#f2efe4');
  }
  if(hautT==='pull'&&!prof){
    R(-3,yT-2,6,3,colHC);R(-3,yT-2,6,1,colH);    /* col montant */
    for(let i=4;i<TH-4;i+=3)R(-EP+2,yT+i,EP*2-4,1,teint(colH,-12));
  }
  if(hautT==='t-shirt'&&!prof){R(-3,yT,6,2,peau);R(-3,yT,6,1,peauC);}
  if(hautT==='débardeur'){
    R(-4,yT,8,3,peau);R(-4,yT,8,1,peauC);        /* décolleté */
    R(-EP+1,yT,2,4,colH);R(EP-3,yT,2,4,colHO);   /* bretelles */
  }
  if(hautT==='gilet'&&!prof){
    R(-2,yT,4,TH-5,peau);R(-2,yT,4,1,peauC);
    R(-2,yT+TH-6,4,2,colHO);
  }
  if(hautT==='manteau'){
    R(-TA,yT+TH-2,TA*2,6,colH);                  /* les pans descendent */
    R(-TA,yT+TH-2,TA*2,1,colHC);
    R(-TA,yT+TH+3,TA*2,1,colHT);
    if(!prof)R(-1,yT+TH-2,2,6,colHT);
  }
  if(hautT==='tunique'){
    R(-TA,yT+TH-2,TA*2,4,colH);
    R(-TA,yT+TH-2,TA*2,1,colHC);
    R(-TA,yT+TH+1,TA*2,1,colHT);
    if(!prof){R(-4,yT,8,2,colHC);R(-1,yT,2,4,colHO);}
  }
  R(-EP+1,yT+TH-2,EP*2-2,1,colHT);

  /* de face : on ne voit du sac que les deux sangles sur la poitrine */
  if(sacC!=='aucun'&&dir==='bas'){
    R(-EP+2,yT+2,2,8,teint(sacC,-6));
    R(EP-4,yT+2,2,8,teint(sacC,-18));
    R(-EP+2,yT+6,EP*2-6,1,teint(sacC,-24));
  }

  /* ---- bras : la manche s'arrête selon le vêtement ---- */
  const MANCHE={'veste':11,'chemise':11,'pull':11,'manteau':11,'tunique':9,
                'gilet':0,'t-shirt':4,'débardeur':0}[hautT];
  const brasCol=(dev)=>dev?veste:vesteT;
  const bras=(bx,by,dev)=>{
    R(bx,by,3,11,dev?teint(peau,2):peauO);       /* le bras nu */
    if(MANCHE>0){
      R(bx,by,3,MANCHE,brasCol(dev));
      R(bx,by,3,2,dev?vesteC:vesteO);
      if(MANCHE<11)R(bx,by+MANCHE-1,3,1,teint(brasCol(dev),-20));
    }
    R(bx,by+11,3,3,dev?peau:peauO);              /* la main */
  };
  if(cote){
    bras((s>0?1:-4)+bdP*s,yT+1,true);
  }else{
    bras(-(EP+2),yT+1,bgP>0);
    bras(EP-1,yT+1,bdP>0);
  }
  /* ---- l'outil et les bras, selon l'angle sous lequel on regarde ----
     De profil : grand arc de côté, un seul bras visible.
     De face   : l'outil s'abat vers nous, les deux mains le tiennent, il se raccourcit.
     De dos    : il part en arrière au-dessus des épaules, on voit le dos des mains. */
  if(fr>0){
    const outil=(gg,ech)=>{
      if(typeGeste==='hache')dessinerHache(gg,0,0,ech||1);
      else dessinerPioche(gg,0,0,ech||1);
    };
    if(cote){
      const sens=dir==='gauche'?-1:1;
      const epx=sens>0?EP-1:-(EP+2);
      const ey=yT+1-Math.round(tasse*3);
      R(epx,ey,3,9,veste);R(epx,ey,3,2,vesteC);R(epx,ey+9,3,3,peau);
      if(typeGeste!=='cueille'){
        g.save();
        g.translate(x+epx+1.5,y+ey+2);
        g.rotate(sens*arc);
        outil(g,1);
        if(phase===2){g.globalAlpha=.3;g.fillStyle='#f2f5f8';g.fillRect(-1,-15,2,13);g.globalAlpha=1;}
        g.restore();
      }else{
        const av=Math.round(arc*3);
        R(epx+(sens>0?av:-av),ey+7,3,3,peau);
      }
    }else if(dir==='bas'){
      /* de face : l'outil passe au-dessus de la tête puis descend vers nous.
         On l'écrase verticalement pour simuler le raccourci. */
      const t=(arc+1.9)/3.6;                       /* 0 en arrière, 1 en avant */
      const haut=yT-14+Math.round((1-t)*-8);
      const ey=yT+1-Math.round(tasse*3);
      if(typeGeste!=='cueille'){
        g.save();
        g.translate(x,y+haut+t*24);
        g.scale(1.15,0.45+t*0.75);                 /* il grandit en venant vers nous */
        g.rotate(Math.PI*(1-t)*0.12);
        outil(g,1.2);
        if(phase===2){g.globalAlpha=.26;g.fillStyle='#f2f5f8';
          g.fillRect(-8,-4,16,4);g.globalAlpha=1;}
        g.restore();
      }
      /* les deux bras tiennent l'outil, ils se rapprochent devant le corps */
      const ecart=Math.round(3+ (1-t)*3);
      R(-EP-2+ecart,ey,3,9,vesteT);R(-EP-2+ecart,ey+9,3,3,peauO);
      R(EP-1-ecart,ey,3,9,veste);  R(EP-1-ecart,ey+9,3,3,peau);
      if(typeGeste==='cueille'){                   /* la main s'avance vers le bas */
        R(-2,ey+10+Math.round(arc*3),4,3,peau);
      }
    }else{
      /* de dos : l'outil part derrière les épaules, on ne voit que sa tête dépasser */
      const t=(arc+1.9)/3.6;
      const ey=yT+1-Math.round(tasse*3);
      if(typeGeste!=='cueille'){
        g.save();
        g.translate(x,y+yT-10-(1-t)*10);
        g.scale(1.1,0.5+(1-t)*0.6);
        outil(g,1.1);
        g.restore();
      }
      const ecart=Math.round(3+(1-t)*3);
      R(-EP-2+ecart,ey,3,9,vesteT);R(-EP-2+ecart,ey+9,3,3,peauO);
      R(EP-1-ecart,ey,3,9,veste);  R(EP-1-ecart,ey+9,3,3,peau);
    }
  }

  /* ---- tête ---- */
  const YT=yTete+(fr>0?Math.round(tasse*1.2):0);  /* la tête plonge avec le buste */
  R(-3,yT-3+Y,6,4-Y,N);                        /* le cou s'étire quand le corps descend */
  R(-2,yT-2+Y,4,3-Y,peau);
  R(-2,yT-2+Y,4,1,peauT);                      /* ombre du menton */
  R(-2,yT-2+Y,2,3-Y,peauO);

  const LT=SIL.tete;                            /* demi-largeur de la tête */
  for(let i=0;i<HT;i++){
    let w2=LT;
    if(i>=HT-SIL.menton)w2=LT-1;                /* le menton se resserre */
    if(i===0)w2=LT-1;                           /* le sommet du crâne s'arrondit */
    R(-w2-1,YT+i,(w2+1)*2,1,N);
    R(-w2,YT+i,w2*2,1,peau);
    R(-w2,YT+i,Math.min(3,w2),1,peauO);
  }
  R(-LT,YT,LT*2,1,peauC);                       /* front éclairé */
  if(!prof){R(-LT-2,YT+5,2,3,peauO);R(LT,YT+5,2,3,peau);}   /* oreilles */
  if(prof){R(-LT,YT+1,LT*2,HT-1,teint(peau,-12));           /* nuque */
           R(-LT,YT+HT-3,LT*2,2,teint(peau,-30));}
  /* ---- la barbe ----
     Elle épouse la mâchoire : plus large en haut des joues, resserrée sous le menton.
     Trois valeurs, comme les cheveux, et une version propre au profil. */
  if(barbe!=='aucune'&&!prof){
    const LB=SIL.tete;                          /* demi-largeur du visage */
    const bas=YT+HT-1;                          /* le bas du menton */
    const B=chev, BC=chevC, BO=chevO, BT=teint(chev,-40);
    const joue=(y0,h2,ep)=>{                    /* les côtés, le long de la mâchoire */
      for(let i=0;i<h2;i++){
        const w2=LB-(i>=h2-2?1:0);
        R(-w2,y0+i,ep,1,B);
        R(w2-ep,y0+i,ep,1,BO);
      }
    };
    const menton=(y0,h2,larg)=>{                /* la masse sous la bouche */
      for(let i=0;i<h2;i++){
        const w2=Math.max(1,larg-(i>=h2-2?1:0)-(i>=h2-1?1:0));
        R(-w2,y0+i,w2*2,1,i<1?BC:(i>h2-2?BT:B));
      }
    };
    if(cote){
      /* de profil : la barbe suit le bord avant du visage */
      const av=s>0?1:-4;
      if(barbe==='naissante'){g.globalAlpha=.5;R(av-1,YT+7,5,4,BO);g.globalAlpha=1;}
      else if(barbe==='fine'){R(av-1,YT+7,5,3,BO);R(av,YT+10,3,1,BT);}
      else if(barbe==='courte'){R(av-2,YT+6,6,5,B);R(av-1,YT+10,4,1,BO);}
      else if(barbe==='pleine'){R(av-3,YT+5,7,7,B);R(av-3,YT+5,2,7,BO);R(av-2,YT+11,5,2,BT);}
      else if(barbe==='longue'){R(av-3,YT+5,7,7,B);R(av-2,YT+11,5,6,B);R(av-2,YT+15,5,2,BT);}
      else if(barbe==='bouc'){R(av-1,YT+8,4,5,B);R(av-1,YT+11,4,2,BO);}
      else if(barbe==='moustache'){R(av-1,YT+7,4,1,B);R(av+2,YT+7,1,1,BO);}
      else if(barbe==='collier'){R(av-4,YT+4,2,8,B);R(av-3,YT+10,6,2,B);}
      else if(barbe==='favoris'){R(av-4,YT+3,2,6,B);}
      else if(barbe==='impériale'){R(av-1,YT+7,4,1,B);R(av,YT+9,3,3,B);}
      else if(barbe==='fourchue'){R(av-3,YT+5,7,7,B);R(av-2,YT+11,2,5,B);R(av+1,YT+11,2,4,BO);}
    }else{
      if(barbe==='naissante'){                  /* juste une ombre sur la mâchoire */
        g.globalAlpha=.42;
        joue(YT+6,5,2);menton(YT+9,3,3);
        g.globalAlpha=1;
      }
      else if(barbe==='fine'){
        joue(YT+7,4,1);
        R(-3,YT+10,6,1,BO);R(-2,YT+11,4,1,BT);
      }
      else if(barbe==='courte'){
        joue(YT+6,5,2);
        menton(YT+9,3,4);
        R(-3,YT+8,6,1,BC);                      /* le sillon sous la lèvre */
      }
      else if(barbe==='pleine'){
        joue(YT+4,7,2);
        menton(YT+8,5,LB-1);
        R(-LB+1,YT+4,LB*2-2,1,BC);              /* le haut des joues, éclairé */
        R(-2,YT+8,4,1,teint(peau,-30));         /* la bouche reste lisible */
      }
      else if(barbe==='longue'){
        joue(YT+4,7,2);
        menton(YT+8,5,LB-1);
        for(let i=0;i<6;i++){                   /* elle descend sur la poitrine */
          const w2=Math.max(1,4-Math.floor(i/2));
          R(-w2,YT+HT+i-1,w2*2,1,i<4?B:BT);
        }
        R(-LB+1,YT+4,LB*2-2,1,BC);
        R(-2,YT+8,4,1,teint(peau,-30));
      }
      else if(barbe==='bouc'){
        R(-2,YT+10,4,3,B);R(-2,YT+10,2,3,BC);R(-1,YT+12,2,1,BT);
        R(-3,YT+7,6,1,B);                       /* avec sa moustache */
      }
      else if(barbe==='moustache'){
        R(-3,YT+7,6,1,B);R(-4,YT+7,1,1,BO);R(3,YT+7,1,1,BO);
        R(-3,YT+8,2,1,BO);R(1,YT+8,2,1,BO);
      }
      else if(barbe==='collier'){               /* le tour du visage, joues rasées */
        R(-LB,YT+4,1,7,B);R(LB-1,YT+4,1,7,BO);
        menton(YT+10,2,4);
        R(-3,YT+7,6,1,B);
      }
      else if(barbe==='favoris'){               /* seulement devant les oreilles */
        R(-LB,YT+3,2,5,B);R(LB-2,YT+3,2,5,BO);
        R(-LB,YT+7,2,1,BT);R(LB-2,YT+7,2,1,BT);
      }
      else if(barbe==='impériale'){             /* moustache et touffe sous la lèvre */
        R(-4,YT+7,8,1,B);R(-5,YT+6,1,1,BO);R(4,YT+6,1,1,BO);
        R(-1,YT+10,3,3,B);R(-1,YT+10,1,3,BC);
      }
      else if(barbe==='fourchue'){
        joue(YT+4,7,2);
        menton(YT+8,4,LB-1);
        R(-4,YT+HT-1,3,5,B);R(1,YT+HT-1,3,4,BO);   /* les deux pointes */
        R(-4,YT+HT+3,3,1,BT);R(1,YT+HT+2,3,1,BT);
        R(-LB+1,YT+4,LB*2-2,1,BC);
      }
    }
  }

  /* ---- les cheveux ----
     Une même coupe se décline en trois vues :
       de face  : calotte + frange + pans qui pendent de chaque côté du visage
       de dos   : la masse couvre tout le crâne, les longueurs tombent dans le dos
       de profil: calotte + un seul pan, derrière la tête                        */
  const C=chev, CC=chevC, CO=chevO, CT=teint(chev,-42);
  const tr=bouge?(cote?-s:0):0;

  /* description de chaque coupe :
     vol  volume au-dessus du crâne · fr  frange · pan longueur des pans latéraux
     dos  longueur dans le dos      · ras côtés rasés                            */
  const D={
   'courts'      :{vol:2,fr:'courte',pan:3, dos:12},
   'très courts' :{vol:1,fr:'rase',  pan:2, dos:12},
   'dégradé'     :{vol:3,fr:'cote',  pan:1, dos:12,ras:1},
   'bol'         :{vol:2,fr:'droite',pan:5, dos:14},
   'carré'       :{vol:2,fr:'droite',pan:9, dos:17},
   'mi-longs'    :{vol:2,fr:'cote',  pan:8, dos:18},
   'longs'       :{vol:2,fr:'cote',  pan:14,dos:24,large:14},
   'très longs'  :{vol:2,fr:'cote',  pan:20,dos:30,large:14},
   'queue'       :{vol:2,fr:'courte',pan:2, dos:12,queue:14},
   'couettes'    :{vol:2,fr:'droite',pan:2, dos:12,couettes:9},
   'chignon'     :{vol:2,fr:'courte',pan:2, dos:12,chignon:1},
   'chignon haut':{vol:1,fr:'courte',pan:1, dos:12,chignon:2},
   'tresse'      :{vol:2,fr:'cote',  pan:3, dos:12,tresse:1},
   'tresses'     :{vol:2,fr:'droite',pan:2, dos:12,tresses:1},
   'ondulés'     :{vol:2,fr:'cote',  pan:12,dos:21,onde:1,large:14},
   'bouclés'     :{vol:4,fr:'boucle',pan:5, dos:16,boucle:1,large:16},
   'afro'        :{vol:6,fr:'rase',  pan:5, dos:16,afro:1,large:18},
   'dreads'      :{vol:2,fr:'rase',  pan:9, dos:20,dreads:1,large:14},
   'banane'      :{vol:5,fr:'arriere',pan:2,dos:12},
   'crête'       :{vol:0,fr:'rase',  pan:0, dos:0, crete:1},
   'crâne'       :{vol:0,fr:'rase',  pan:0, dos:0, rase:1},
   'hirsute'     :{vol:3,fr:'meche', pan:4, dos:14,hirsute:1}
  }[coiffe]||{vol:2,fr:'courte',pan:3,dos:3};

  if(D.rase){
    R(-6,YT-1,12,2,CO);
    if(prof)R(-6,YT-1,12,6,CO);
  }else{
    /* le dessus du crâne, commun aux trois vues */
    if(!D.crete){
      R(-6,YT-1-D.vol,12,2+D.vol,C);
      R(-6,YT-D.vol,4,1,CC);                    /* la lumière tombe à gauche */
      R(4,YT-1-D.vol,2,2+D.vol,CO);
    }
    if(prof){
      /* ---- de dos ---- */
      const y0=YT-1-D.vol;                      /* le sommet du crâne */
      const hd=Math.max(HT+2+D.vol,D.dos);      /* jamais moins que le crâne entier */
      const lg=D.large||12;                     /* largeur de la masse */
      const g0=-(lg>>1);
      /* une masse aux angles adoucis, pas un bloc */
      R(g0+1,y0,lg-2,hd,C);                     /* corps */
      R(g0,y0+1,lg,hd-2,C);                     /* flancs, un pixel plus bas */
      R(g0+1,y0+1,4,3,CC);                      /* la lumière en haut à gauche */
      R(g0+lg-4,y0+1,3,hd-2,CO);                /* le côté à l'ombre */
      R(g0+2,y0+hd-2,lg-4,2,CT);                /* les pointes */
      if(D.queue){R(-3,YT+2,6,3,C);                 /* l'attache */
        R(-2,YT+4,4,D.queue,C);R(-2,YT+4,2,D.queue,CC);R(-2,YT+D.queue+1,4,3,CT);}
      if(D.couettes){R(-9,YT+1,3,D.couettes,C);R(6,YT+1,3,D.couettes,CO);
        R(-9,YT+D.couettes-1,3,2,CT);R(6,YT+D.couettes-1,3,2,CT);}
      if(D.tresse)for(let i=0;i<6;i++)R(-2,YT+2+i*3,4,3,i%2?CO:C);
      if(D.tresses)for(let i=0;i<5;i++){R(-8,YT+1+i*3,3,3,i%2?CO:C);R(5,YT+1+i*3,3,3,i%2?C:CO);}
      if(D.chignon===1)R(-3,YT-5-D.vol-reb,6,5,C);
      if(D.chignon===2){R(-2,YT-8-reb,5,6,C);R(-2,YT-8-reb,2,2,CC);}
      if(D.crete){R(-6,YT-1,12,5,CO);R(-2,YT-9-reb,4,9,C);R(-2,YT-9-reb,2,9,CC);}
    }else if(cote){
      /* ---- de profil : un seul pan, derrière la tête ---- */
      const der=s>0?-8:6;                        /* le côté opposé au regard */
      if(D.pan>1){
        R(der+tr,YT+1,3,D.pan,C);
        if(D.pan>6)R(der+tr,YT+D.pan-2,3,3,CT);
      }
      if(D.fr==='droite')R(s>0?-6:0,YT+1,6,2,CO);
      if(D.fr==='cote')R(s>0?-2:-4,YT+1,6,2,CO);
      if(D.fr==='courte')R(s>0?-1:-5,YT+1,6,1,CO);
      if(D.fr==='arriere')R(s>0?-5:0,YT-2-D.vol,6,2,CC);
      if(!D.ras&&D.pan>=2)R(s>0?-6:2,YT+1,4,3,C);   /* la tempe visible */
      if(D.queue){R(der+tr,YT+1,3,D.queue,C);R(der+tr,YT+D.queue-2,3,3,CT);}
      if(D.couettes)R(der+tr,YT+2,3,D.couettes,C);
      if(D.tresse)for(let i=0;i<5;i++)R(der+tr,YT+2+i*3,3,3,i%2?CO:C);
      if(D.tresses)for(let i=0;i<4;i++)R(der+tr,YT+2+i*3,3,3,i%2?CO:C);
      if(D.chignon===1)R(der+2,YT-4-reb,5,5,C);
      if(D.chignon===2)R(-1,YT-8-reb,5,6,C);
      if(D.crete){R(-6,YT-1,12,4,CO);R(-2,YT-9-reb,4,9,C);}
      if(D.afro){R(der-1,YT-6,5,10,C);R(-6,YT-7,12,7,C);R(-6,YT-6,4,3,CC);}
      if(D.dreads)for(let i=0;i<4;i++)R(der+tr,YT+1+i*3,3,7,i%2?CO:C);
      if(D.boucle){R(der,YT-4,4,7,C);R(-6,YT-5,12,5,C);R(-6,YT-4,4,2,CC);}
    }else{
      /* ---- de face ---- */
      if(D.fr==='droite')R(-6,YT+1,12,2,CO);     /* frange qui barre le front */
      if(D.fr==='cote'){R(-6,YT+1,7,2,CO);R(1,YT+1,5,1,CO);}
      if(D.fr==='courte')R(-6,YT+1,12,1,CO);
      if(D.fr==='meche'){R(-6,YT+1,5,2,CO);R(2,YT+1,4,1,CO);}
      if(D.fr==='boucle'){R(-6,YT+1,4,2,C);R(-1,YT+1,3,2,CO);R(3,YT+1,3,2,C);}
      if(!D.ras&&D.pan>=2){                       /* les tempes, seulement si la coupe les a */
        const ht=Math.max(3,Math.min(5,D.pan));
        R(-6,YT+1,2,ht,C);
        R(4,YT+1,2,ht,CO);
      }
      if(D.pan>4){                                /* les pans qui pendent */
        R(-7+tr,YT+1,2,D.pan,C);
        R(5+tr,YT+1,2,D.pan,CO);
        R(-7+tr,YT+D.pan-2,2,3,CT);
        R(5+tr,YT+D.pan-2,2,3,CT);
      }
      if(D.onde){R(-8+tr,YT+4,2,5,C);R(6+tr,YT+4,2,5,CO);}
      if(D.queue){R(5+tr,YT+1,2,3,C);R(6+tr,YT+2,1,3,CO);}  /* elle dépasse à peine */
      if(D.couettes){
        R(-8+tr,YT,3,D.couettes,C);      R(5+tr,YT,3,D.couettes,CO);
        R(-8+tr,YT,3,1,CC);
        R(-8+tr,YT+D.couettes,2,2,CT);   R(6+tr,YT+D.couettes,2,2,CT);}
      if(D.tresse){R(5+tr,YT+1,3,4,CO);}
      if(D.tresses)for(let i=0;i<4;i++){R(-8+tr,YT+1+i*3,3,3,i%2?CO:C);R(5+tr,YT+1+i*3,3,3,i%2?C:CO);}
      if(D.chignon===1){R(-3,YT-3-D.vol-reb,5,3,C);R(-3,YT-3-D.vol-reb,2,1,CC);R(1,YT-3-D.vol-reb,1,3,CO);}
      if(D.chignon===2){R(-2,YT-8-reb,5,6,C);R(-2,YT-8-reb,2,2,CC);R(-3,YT-3,7,2,C);}
      if(D.afro){R(-9,YT-6,18,8,C);R(-9,YT-5,6,3,CC);R(5,YT-6,4,8,CO);
        R(-9,YT+1,3,5,C);R(6,YT+1,3,5,CO);}
      if(D.boucle){R(-7,YT-4,14,5,C);R(-7,YT-3,4,2,CC);R(4,YT-4,3,5,CO);
        R(-8,YT+1,3,4,C);R(5,YT+1,3,4,CO);R(-5,YT-6,4,2,CC);R(1,YT-6,4,2,C);}
      if(D.dreads){                              /* elles encadrent le visage, sans le couvrir */
        for(let i=0;i<3;i++){
          R(-8+tr,YT+1+i*4,3,5,i%2?CO:C);
          R(5+tr,YT+1+i*4,3,5,i%2?C:CO);
        }
        R(-6,YT+1,12,2,CO);                       /* la racine sur le front */
        R(-8+tr,YT+11,3,2,CT);R(5+tr,YT+11,3,2,CT);
      }
      if(D.crete){R(-6,YT-1,12,2,CO);R(-2,YT-9-reb,4,9,C);R(-2,YT-9-reb,2,9,CC);}
      if(D.hirsute){R(-8,YT-3,3,3,C);R(5,YT-4,3,3,CO);R(-3,YT-4-reb,3,3,C);R(2,YT-5-reb,2,3,CC);}
      if(D.fr==='arriere'){
        R(-5,YT-2-D.vol,10,2,C);
        R(-4,YT-4-D.vol,8,2,C);
        R(-2,YT-5-D.vol,6,1,CC);
        R(3,YT-4-D.vol,2,4,CO);}
    }
  }

  /* ---- ce qu'on porte sur la tête : ajusté à la largeur du crâne ---- */
  const LTc=SIL.tete;                              /* demi-largeur de la tête */
  if(chapeau==='casquette'){
    R(-LTc-1,YT-4,(LTc+1)*2,4,'#3f5f6b');          /* la calotte épouse le crâne */
    R(-LTc-1,YT-4,(LTc+1)*2,1,'#547a88');
    R(-LTc,YT-1,LTc*2,1,'#33505a');
    const vx=cote?(s>0?1:-LTc*2-1):-LTc-1;         /* la visière part vers l'avant */
    R(vx,YT,LTc*2+1,2,'#33505a');
    R(vx,YT,LTc*2+1,1,'#456a76');
  }
  else if(chapeau==='bandana'){
    R(-LTc-1,YT-2,(LTc+1)*2,3,'#a8524a');
    R(-LTc-1,YT-2,(LTc+1)*2,1,'#c46a5e');
    R(-LTc+1,YT-1,3,1,'#8f4038');                  /* le nœud */
    R(LTc-1+tr,YT,3,5,'#8f4038');                  /* les pans qui pendent */
    R(LTc-1+tr,YT+4,3,1,'#71322c');
  }
  else if(chapeau==='bonnet'){
    R(-LTc-1,YT-6,(LTc+1)*2,6,'#8a4a3a');
    R(-LTc-1,YT-6,(LTc+1)*2,1,'#a85c48');
    R(-LTc-1,YT-1,(LTc+1)*2,2,'#a85c48');          /* le revers */
    R(-LTc-1,YT+1,(LTc+1)*2,1,'#71392c');
    R(-2,YT-9-reb,4,3,'#c07260');                  /* le pompon */
    R(-2,YT-9-reb,2,1,'#d9897a');
  }
  else if(chapeau==='capuche'){
    R(-LTc-2,YT-5,(LTc+2)*2,HT+3,'#54606b');       /* le tissu enveloppe la tête */
    R(-LTc-2,YT-5,(LTc+2)*2,2,'#68757f');
    R(-LTc-2,YT+3,2,HT-5,'#465059');
    R(LTc,YT+3,2,HT-5,'#465059');
    R(-LTc,YT+1,LTc*2,HT-2,peau);                  /* le visage reste dégagé */
    R(-LTc,YT+1,3,HT-2,peauO);
    R(-LTc,YT+1,LTc*2,1,teint(peau,-30));          /* l'ombre de la capuche */
  }
  else if(chapeau==='chapeau'){
    R(-LTc-4,YT-1,(LTc+4)*2,2,'#5a4a2c');          /* le bord large */
    R(-LTc-4,YT-1,(LTc+4)*2,1,'#7a663c');
    R(-LTc,YT-6,LTc*2,5,'#8f7a49');                /* la calotte */
    R(-LTc,YT-6,LTc*2,1,'#a08a56');
    R(-LTc,YT-3,LTc*2,2,'#5a4a2c');                /* le ruban */
  }
  else if(chapeau==='beret'){
    R(-LTc-1,YT-4,(LTc+1)*2-1,4,'#2f4a5c');
    R(-LTc-1,YT-4,LTc,2,'#3f6076');
    R(LTc-2,YT-6-reb,2,2,'#2f4a5c');               /* la queue sur le dessus */
  }
  else if(chapeau==='cagoule'){
    R(-LTc-1,YT-2,(LTc+1)*2,HT+2,'#3a3a44');
    R(-LTc-1,YT-2,(LTc+1)*2,2,'#4a4a56');
    if(!prof){R(-4,YT+4,3,3,peau);R(1,YT+4,3,3,peau);}   /* les deux fentes */
    R(-LTc-1,YT+HT-2,(LTc+1)*2,1,'#2b2b33');
  }

  /* ---- le visage ----
     Il tient dans dix pixels de large : chaque pixel compte. */
  const blanc='#f6f3ec', ombreOeil=teint(peau,-38);
  if(dir==='bas'&&chapeau==='cagoule'){
    R(-4,YT+5,3,2,oeil);R(2,YT+5,3,2,oeil);      /* on ne voit que les yeux */
  }else if(dir==='bas'){
    const clin=(Date.now()+x*53)%4600<130;
    /* sourcils */
    if(sourcil==='fins'){R(-4,YT+3,3,1,chevO);R(2,YT+3,3,1,chevO);}
    if(sourcil==='epais'){R(-4,YT+2,3,2,chevO);R(2,YT+2,3,2,chevO);}
    if(sourcil==='arques'){R(-4,YT+3,2,1,chevO);R(-2,YT+2,1,1,chevO);
                           R(3,YT+3,2,1,chevO);R(2,YT+2,1,1,chevO);}
    if(sourcil==='fronces'){R(-4,YT+3,3,1,chevO);R(2,YT+3,3,1,chevO);
                            R(-1,YT+3,2,1,chevO);}
    /* creux des orbites */
    R(-4,YT+4,3,1,ombreOeil);R(2,YT+4,3,1,ombreOeil);
    /* yeux */
    if(clin){R(-4,YT+6,3,1,chevO);R(2,YT+6,3,1,chevO);}
    else{
      const dessine=(gx,h,ty)=>{
        R(gx,YT+ty,3,h,blanc);
        R(gx+1,YT+ty,1,h,oeil);                 /* iris */
        R(gx+1,YT+ty,1,1,teint(oeil,40));       /* reflet */
      };
      if(fy==='ronds'){dessine(-4,3,4);dessine(2,3,4);}
      else if(fy==='plisses'){R(-4,YT+5,3,1,oeil);R(2,YT+5,3,1,oeil);}
      else if(fy==='fatigues'){dessine(-4,2,5);dessine(2,2,5);
        R(-4,YT+7,3,1,peauT);R(2,YT+7,3,1,peauT);}
      else if(fy==='doux'){dessine(-4,2,5);dessine(2,2,5);
        R(-4,YT+4,3,1,peau);R(2,YT+4,3,1,peau);}
      else if(fy==='severes'){dessine(-4,2,5);dessine(2,2,5);
        R(-4,YT+4,3,1,chevO);R(2,YT+4,3,1,chevO);}
      else{dessine(-4,2,5);dessine(2,2,5);}
    }
    /* nez */
    if(nez==='petit'){R(0,YT+7,1,1,peauT);}
    if(nez==='droit'){R(0,YT+6,1,2,ombreOeil);R(0,YT+8,1,1,peauT);}
    if(nez==='large'){R(-1,YT+7,3,1,ombreOeil);R(-1,YT+8,3,1,peauT);}
    if(nez==='retrousse'){R(0,YT+6,1,2,ombreOeil);R(-1,YT+8,2,1,peauT);}
    /* cils : c'est le regard qui les porte, pas la carrure */
    if((fy==='doux'||fy==='ronds')&&!clin){R(-5,YT+4,1,1,chevO);R(4,YT+4,1,1,chevO);}
    /* bouche */
    const lev=(bouche==='lèvres');
    if(bouche==='neutre')R(-2,YT+9,4,1,teint(peau,-64));
    if(lev){R(-2,YT+9,4,1,'#b06a68');R(-2,YT+10,4,1,teint(peau,-24));R(-1,YT+8,2,1,'#c47f7c');}
    if(bouche==='sourire'){R(-2,YT+9,4,1,SIL.levres?'#b06a68':teint(peau,-64));
      R(-3,YT+8,1,1,peauO);R(2,YT+8,1,1,peauO);R(-1,YT+10,2,1,teint(peau,-30));}
    if(bouche==='severe'){R(-3,YT+9,6,1,teint(peau,-70));}
    if(bouche==='entrouverte'){R(-2,YT+9,4,1,teint(peau,-70));R(-1,YT+10,2,1,'#8a4a4a');}
    if(bouche==='pincée'){R(-1,YT+9,3,1,teint(peau,-70));R(-2,YT+9,1,1,peauT);R(2,YT+9,1,1,peauT);}
    /* marques */
    if(marque==='taches'){R(-4,YT+7,1,1,peauT);R(-2,YT+8,1,1,peauT);R(3,YT+7,1,1,peauT);R(2,YT+6,1,1,peauT);}
    if(marque==='cicatrice'){R(3,YT+2,1,5,teint(peau,-46));R(2,YT+3,1,1,teint(peau,-46));}
    if(marque==='grain'){R(-3,YT+8,1,1,teint(peau,-70));}
    if(marque==='fard'){R(-4,YT+8,3,1,'#c9707a');R(2,YT+8,3,1,'#c9707a');}
    if(marque==='peinture'){R(-4,YT+4,3,3,'#a8524a');R(2,YT+4,3,3,'#a8524a');
      R(-4,YT+4,3,1,'#c46a5e');R(2,YT+4,3,1,'#c46a5e');}
    /* boucles d'oreille */
    const oy=YT+7, ox=SIL.tete+1;
    if(boucle==='anneau'){R(-ox,oy,1,2,'#c9a24a');R(ox-1,oy,1,2,'#c9a24a');}
    if(boucle==='perle'){R(-ox,oy,1,1,'#f2efe4');R(ox-1,oy,1,1,'#f2efe4');}
    if(boucle==='plume'){R(ox-1,oy,1,4,'#4a7d7d');R(ox-1,oy+3,1,1,'#7fbdbd');}
  }else if(cote){
    const dx=s>0?2:-4;
    if(sourcil==='epais')R(dx,YT+2,2,2,chevO);else R(dx,YT+3,2,1,chevO);
    R(dx,YT+4,2,1,ombreOeil);
    R(dx,YT+5,2,2,blanc);
    R(dx+(s>0?1:0),YT+5,1,2,oeil);
    R(s>0?5:-6,YT+6,1,2,peauT);                 /* le nez dépasse du profil */
    R(s>0?4:-5,YT+9,2,1,teint(peau,-64));       /* bouche */
    if(boucle!=='aucune')R(s>0?-4:3,YT+7,1,2,boucle==='perle'?'#f2efe4':'#c9a24a');
    if(marque==='fard')R(dx-1,YT+8,3,1,'#c9707a');
  }
}

/* ================= le hall, vu de dessus =================
   Sol plat, murs en bordure, meubles vus d'au-dessus.
   Le décor est peint en triple résolution : aucun pixel visible. */
const SALLE_L=420, SALLE_H=560;
const SUR=3;
const MUR=18;                                   /* l'épaisseur de la bordure */
let SOL=null;

function construireSol(){
  const c=document.createElement('canvas');
  c.width=SALLE_L*SUR;c.height=SALLE_H*SUR;
  const g=c.getContext('2d');
  g.setTransform(SUR,0,0,SUR,0,0);
  const lin=(x0,y0,x1,y1,et)=>{const d=g.createLinearGradient(x0,y0,x1,y1);
    et.forEach(([p,col])=>d.addColorStop(p,col));return d;};
  const rad=(x,y,r,et)=>{const d=g.createRadialGradient(x,y,0,x,y,r);
    et.forEach(([p,col])=>d.addColorStop(p,col));return d;};

  /* le marbre, en diagonale douce */
  g.fillStyle=lin(0,0,SALLE_L,SALLE_H,
    [[0,'#c2bcb2'],[.4,'#a49e95'],[.75,'#8e887f'],[1,'#79736b']]);
  g.fillRect(0,0,SALLE_L,SALLE_H);
  /* les veines, dans le plan du sol */
  g.save();g.globalAlpha=.17;g.strokeStyle='#f4f1eb';g.lineCap='round';
  for(let i=0;i<16;i++){
    const y=30+i*36+alea(i)*18;
    g.lineWidth=.7+alea(i*3)*1.6;
    g.beginPath();g.moveTo(-20,y);
    for(let x=0;x<=SALLE_L+20;x+=64)
      g.quadraticCurveTo(x+32,y+(alea(i*7+x)-.5)*30,x+64,y+(alea(i*5+x)-.5)*18);
    g.stroke();
  }
  g.globalAlpha=.1;g.strokeStyle='#5d5850';
  for(let i=0;i<9;i++){
    const y=54+i*62+alea(i*11)*20;
    g.lineWidth=.8;
    g.beginPath();g.moveTo(-20,y);
    for(let x=0;x<=SALLE_L+20;x+=80)
      g.quadraticCurveTo(x+40,y+(alea(i*13+x)-.5)*24,x+80,y+(alea(i*17+x)-.5)*14);
    g.stroke();
  }
  g.restore();

  /* la rosace incrustée, au centre du hall */
  const cx=SALLE_L/2, cy=340;
  const or=lin(cx-60,cy-60,cx+60,cy+60,
    [[0,'#fff3cd'],[.35,'#e2ba69'],[.62,'#9a7225'],[1,'#f0d79a']]);
  g.save();g.globalAlpha=.6;g.strokeStyle=or;
  [[62,2.4],[48,1],[18,1.8]].forEach(([r,w])=>{
    g.lineWidth=w;g.beginPath();g.arc(cx,cy,r,0,7);g.stroke();});
  g.lineWidth=1.1;
  for(let i=0;i<8;i++){
    const a=i/8*6.283;
    g.beginPath();
    g.moveTo(cx+Math.cos(a)*20,cy+Math.sin(a)*20);
    g.lineTo(cx+Math.cos(a)*46,cy+Math.sin(a)*46);
    g.stroke();
  }
  g.globalAlpha=.5;g.fillStyle=or;
  g.font='600 22px Georgia,serif';g.textAlign='center';
  g.fillText('C',cx,cy+8);
  g.restore();

  /* la bordure : les murs, vus d'en haut */
  const bois=lin(0,0,0,MUR,[[0,'#3a2a1c'],[.5,'#2a1c12'],[1,'#1d130c']]);
  g.fillStyle=bois;
  g.fillRect(0,0,(SALLE_L-LOGE.w)/2,MUR+LOGE.h);          /* mur à gauche de la loge */
  g.fillRect((SALLE_L+LOGE.w)/2,0,(SALLE_L-LOGE.w)/2,MUR+LOGE.h);
  g.fillRect(0,0,SALLE_L,MUR*0.7);
  g.fillRect(0,SALLE_H-MUR,SALLE_L,MUR);
  g.fillRect(0,0,MUR,SALLE_H);
  g.fillRect(SALLE_L-MUR,0,MUR,SALLE_H);
  /* le chant doré, côté pièce */
  g.fillStyle=or;
  g.fillRect(0,MUR-2.5,SALLE_L,2.5);
  g.fillRect(0,SALLE_H-MUR,SALLE_L,2.5);
  g.fillRect(MUR-2.5,0,2.5,SALLE_H);
  g.fillRect(SALLE_L-MUR,0,2.5,SALLE_H);
  /* l'ombre que la bordure projette vers l'intérieur */
  g.save();
  g.fillStyle=rad(cx,cy,300,[[.62,'rgba(0,0,0,0)'],[1,'rgba(0,0,0,.5)']]);
  g.fillRect(MUR,MUR,SALLE_L-MUR*2,SALLE_H-MUR*2);
  g.restore();

  /* la loge du guichet, creusée dans le mur du haut */
  peindreLoge(g,or,lin,rad);

  /* l'ouverture d'entrée, en bas : le seuil */
  g.fillStyle=lin(0,SALLE_H-MUR,0,SALLE_H,[[0,'#5c3a20'],[1,'#37200f']]);
  g.fillRect(cx-20,SALLE_H-MUR,40,MUR);
  g.fillStyle=or;g.fillRect(cx-20,SALLE_H-MUR,40,2.5);
  /* le tapis d'entrée, à la largeur de la porte */
  g.fillStyle=lin(0,SALLE_H-52,0,SALLE_H-MUR,[[0,'#7d2434'],[1,'#5a1a26']]);
  g.fillRect(cx-24,SALLE_H-52,48,52-MUR);
  g.strokeStyle=or;g.lineWidth=1.6;
  g.strokeRect(cx-23,SALLE_H-51,46,50-MUR);
  return c;
}


/* ================= le mobilier, vu de dessus ================= */
const orDe=(g,x0,y0,x1,y1)=>{
  const d=g.createLinearGradient(x0,y0,x1,y1);
  d.addColorStop(0,'#fff3cd');d.addColorStop(.35,'#e2ba69');
  d.addColorStop(.62,'#9a7225');d.addColorStop(1,'#f0d79a');return d;};
const ombreSous=(g,x,y,rx,ry,a)=>{
  const d=g.createRadialGradient(x,y,0,x,y,rx);
  d.addColorStop(0,'rgba(0,0,0,'+(a||.45)+')');d.addColorStop(1,'rgba(0,0,0,0)');
  g.save();g.translate(x,y);g.scale(1,ry/rx);
  g.fillStyle=d;g.beginPath();g.arc(0,0,rx,0,7);g.fill();g.restore();};

/* ================= le guichet, vu de dessus ================= */

/* ================= la loge du guichet, creusée dans le mur ================= */
const LOGE={x:SALLE_L/2, y:34, w:150, h:96};     /* le renfoncement */
const COMPTOIR={x:SALLE_L/2, y:132, w:150, h:26};

/* on peint la loge dans la toile du sol : parquet, étagères, ombres */
function peindreLoge(g,or,lin,rad){
  const L=LOGE, x0=L.x-L.w/2, y0=MUR;
  /* le parquet, à lames */
  const par=lin(x0,y0,x0+L.w,y0+L.h,[[0,'#7a5230'],[.45,'#5f3d1f'],[1,'#452a13']]);
  g.fillStyle=par;g.fillRect(x0,y0,L.w,L.h);
  g.save();
  g.beginPath();g.rect(x0,y0,L.w,L.h);g.clip();
  /* les lames et leurs joints */
  for(let i=0;i<7;i++){
    const y=y0+i*14;
    g.fillStyle='rgba(0,0,0,.3)';g.fillRect(x0,y,L.w,1.2);
    g.fillStyle='rgba(255,225,180,.07)';g.fillRect(x0,y+1.2,L.w,2);
    /* les bouts de lame, décalés d'une rangée à l'autre */
    for(let k=(i%2?0:22);k<L.w;k+=44){
      g.fillStyle='rgba(0,0,0,.26)';g.fillRect(x0+k,y,1.2,14);
    }
  }
  /* le grain du bois */
  g.globalAlpha=.12;g.strokeStyle='#c99a63';
  for(let i=0;i<18;i++){
    const y=y0+alea(i*3)*L.h;
    g.lineWidth=.6;
    g.beginPath();g.moveTo(x0,y);
    for(let k=0;k<=L.w;k+=30)
      g.quadraticCurveTo(x0+k+15,y+(alea(i*7+k)-.5)*5,x0+k+30,y+(alea(i*5+k)-.5)*3);
    g.stroke();
  }
  g.globalAlpha=1;
  /* les murs de la loge projettent leur ombre dedans */
  g.fillStyle=rad(L.x,y0+L.h*0.7,L.w*0.8,
    [[.45,'rgba(0,0,0,0)'],[1,'rgba(0,0,0,.62)']]);
  g.fillRect(x0,y0,L.w,L.h);
  g.restore();
  /* le chant de laiton autour de l'ouverture */
  g.fillStyle=or;
  g.fillRect(x0-2.5,y0-2.5,L.w+5,2.5);
  g.fillRect(x0-2.5,y0,2.5,L.h);
  g.fillRect(x0+L.w,y0,2.5,L.h);
  /* la moulure du plafond de la loge, vue d'en haut */
  g.fillStyle=lin(x0,y0,x0,y0+8,[[0,'rgba(0,0,0,.55)'],[1,'rgba(0,0,0,0)']]);
  g.fillRect(x0,y0,L.w,8);
}

/* les étagères du fond de la loge */
function etageres(g,x,y,w){
  const or=orDe(g,x-w/2,y-12,x+w/2,y+12);
  g.fillStyle='rgba(0,0,0,.45)';
  g.beginPath();g.roundRect(x-w/2+2,y-10,w,22,3);g.fill();
  const b=g.createLinearGradient(0,y-13,0,y+11);
  b.addColorStop(0,'#5a3a1e');b.addColorStop(.5,'#3d2612');b.addColorStop(1,'#291808');
  g.fillStyle=b;g.beginPath();g.roundRect(x-w/2,y-13,w,24,3);g.fill();
  g.strokeStyle=or;g.lineWidth=1.4;g.stroke();
  /* la tablette, plus claire */
  g.fillStyle='#6b4526';g.beginPath();g.roundRect(x-w/2+3,y-11,w-6,9,2);g.fill();
  g.fillStyle='rgba(255,230,190,.18)';g.fillRect(x-w/2+3,y-11,w-6,2);
  /* quatre casiers de jetons, rangés */
  const cols=[['#dc5044','#8f2a22'],['#4a8fd4','#255184'],
              ['#f0cf7d','#9a7225'],['#8fd8a0','#2f7050']];
  cols.forEach((c,i)=>{
    const cx=x-w/2+16+i*26;
    g.fillStyle='#1a1108';g.beginPath();g.roundRect(cx-9,y-9,18,7,1.6);g.fill();
    for(let k=0;k<2;k++){
      g.fillStyle=k?c[0]:c[1];
      g.beginPath();g.ellipse(cx-4+k*8,y-5.5,4,2,0,0,7);g.fill();
      g.strokeStyle='rgba(255,255,255,.3)';g.lineWidth=.5;
      g.beginPath();g.ellipse(cx-4+k*8,y-5.5,3,1.4,0,0,7);g.stroke();
    }
  });
  /* le coffre, encastré à droite */
  g.fillStyle='#20202a';g.beginPath();g.roundRect(x+w/2-32,y-9,26,16,2);g.fill();
  g.strokeStyle='#6b6b7a';g.lineWidth=1;g.stroke();
  g.fillStyle=orDe(g,x+w/2-24,y-4,x+w/2-14,y+4);
  g.beginPath();g.arc(x+w/2-19,y-1,4,0,7);g.fill();
  g.strokeStyle='#2b2b36';g.lineWidth=1.2;
  g.beginPath();g.arc(x+w/2-19,y-1,1.8,0,7);g.stroke();
  g.strokeStyle='rgba(255,255,255,.12)';g.lineWidth=.8;
  g.beginPath();g.moveTo(x+w/2-30,y+4);g.lineTo(x+w/2-8,y+4);g.stroke();
}

/* la chaise de l'hôtesse, vue de dessus */
function chaise(g,x,y){
  g.fillStyle='rgba(0,0,0,.4)';
  g.beginPath();g.ellipse(x+1.5,y+4,12,5,0,0,7);g.fill();
  /* le dossier, derrière */
  const d=g.createLinearGradient(0,y-11,0,y-4);
  d.addColorStop(0,'#8f3040');d.addColorStop(1,'#5a1a26');
  g.fillStyle=d;g.beginPath();g.roundRect(x-11,y-11,22,6,3);g.fill();
  g.strokeStyle=orDe(g,x-11,y-11,x+11,y-5);g.lineWidth=1;g.stroke();
  /* l'assise */
  const a=g.createRadialGradient(x-3,y-3,2,x,y,12);
  a.addColorStop(0,'#a03a4a');a.addColorStop(.65,'#7d2434');a.addColorStop(1,'#54141f');
  g.fillStyle=a;g.beginPath();g.ellipse(x,y,11,7.5,0,0,7);g.fill();
  g.strokeStyle=orDe(g,x-11,y-8,x+11,y+8);g.lineWidth=1.2;g.stroke();
  g.save();g.globalAlpha=.22;g.fillStyle='#fff';
  g.beginPath();g.ellipse(x-3.4,y-2.4,4.6,2.4,0,0,7);g.fill();g.restore();
}

/* le comptoir du guichet : il ferme la loge */
function comptoirLoge(g,x,y,w,h){
  const or=orDe(g,x-w/2,y-h/2,x+w/2,y+h/2);
  /* ombre au sol, côté hall */
  g.fillStyle='rgba(0,0,0,.45)';
  g.beginPath();g.roundRect(x-w/2+3,y-h/2+10,w,h,4);g.fill();
  /* la façade de bois, côté hall */
  const f=g.createLinearGradient(0,y+h/2-6,0,y+h/2+12);
  f.addColorStop(0,'#5c3a20');f.addColorStop(.5,'#3f2711');f.addColorStop(1,'#281707');
  g.fillStyle=f;g.beginPath();g.roundRect(x-w/2,y-h/2,w,h+12,4);g.fill();
  /* panneaux sculptés de la façade */
  g.save();g.strokeStyle='rgba(255,222,175,.15)';g.lineWidth=1;
  for(let i=0;i<4;i++)g.strokeRect(x-w/2+12+i*(w-24)/4,y+h/2+2,(w-24)/4-8,8);
  g.restore();
  /* le plateau de marbre */
  const m=g.createLinearGradient(x-w/2,y-h/2,x+w/2,y+h/2);
  m.addColorStop(0,'#e8e3d8');m.addColorStop(.4,'#cfc9bc');
  m.addColorStop(.78,'#b2aba0');m.addColorStop(1,'#9a938a');
  g.fillStyle=m;g.beginPath();g.roundRect(x-w/2+3,y-h/2+3,w-6,h-4,3);g.fill();
  g.save();
  g.beginPath();g.roundRect(x-w/2+3,y-h/2+3,w-6,h-4,3);g.clip();
  g.globalAlpha=.2;g.strokeStyle='#6b665c';
  for(let i=0;i<4;i++){
    const yy=y-h/2+7+i*5;
    g.lineWidth=.5+alea(i*5)*.9;
    g.beginPath();g.moveTo(x-w/2,yy);
    for(let k=0;k<=w;k+=26)
      g.quadraticCurveTo(x-w/2+k+13,yy+(alea(i*9+k)-.5)*7,x-w/2+k+26,yy+(alea(i*3+k)-.5)*4);
    g.stroke();
  }
  g.globalAlpha=.3;
  const ref=g.createLinearGradient(x-w/2,y-h/2,x-w/6,y+h/2);
  ref.addColorStop(0,'rgba(255,255,255,.85)');ref.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=ref;g.fillRect(x-w/2,y-h/2,w*0.45,h);
  g.restore();
  /* chants de laiton haut et bas */
  g.fillStyle=or;
  g.fillRect(x-w/2,y-h/2,w,2.4);
  g.fillRect(x-w/2,y+h/2-1.4,w,2.4);

  /* la vitre : montants de laiton et verre, avec l'ouverture au centre */
  const vitre=(x0,larg)=>{
    g.fillStyle='rgba(150,215,240,.35)';
    g.fillRect(x0,y-h/2-7,larg,6);
    g.fillStyle='rgba(255,255,255,.5)';
    g.fillRect(x0,y-h/2-7,larg,1.4);
    g.fillStyle='rgba(120,180,210,.5)';
    g.fillRect(x0,y-h/2-2,larg,1.2);
  };
  vitre(x-w/2+7,w/2-24);
  vitre(x+16,w/2-23);
  [x-w/2+3,x-14,x+14,x+w/2-6].forEach(mx=>{
    g.fillStyle=or;g.fillRect(mx,y-h/2-9,4,10);
    g.fillStyle='rgba(255,255,255,.35)';g.fillRect(mx,y-h/2-9,1.4,10);
  });

  /* le passe-monnaie, creusé dans le plateau */
  g.fillStyle='#150f09';g.beginPath();g.roundRect(x-13,y-6,26,11,2);g.fill();
  g.fillStyle='#2a2018';g.beginPath();g.roundRect(x-11,y-4,22,7,1.5);g.fill();
  g.strokeStyle=or;g.lineWidth=1.2;
  g.beginPath();g.roundRect(x-13,y-6,26,11,2);g.stroke();

  /* ce qui est posé sur le comptoir */
  /* casier à jetons, à gauche */
  g.fillStyle='#32200f';g.beginPath();g.roundRect(x-w/2+12,y-7,34,13,2);g.fill();
  g.strokeStyle=or;g.lineWidth=1;g.stroke();
  [['#dc5044','#8f2a22'],['#4a8fd4','#255184'],['#f0cf7d','#9a7225']].forEach((c,i)=>{
    const cx=x-w/2+20+i*11;
    g.fillStyle='#1a1108';g.beginPath();g.roundRect(cx-4.6,y-5,9.2,9,1.4);g.fill();
    for(let k=0;k<2;k++){
      g.fillStyle=k?c[0]:c[1];
      g.beginPath();g.ellipse(cx,y+1-k*3,4,1.9,0,0,7);g.fill();
    }
  });
  /* le registre, à droite */
  g.fillStyle='#f2ecdc';g.beginPath();g.roundRect(x+w/2-46,y-7,26,13,1.5);g.fill();
  g.strokeStyle='#8a7a58';g.lineWidth=.7;g.stroke();
  g.fillStyle='#6b5a3a';g.fillRect(x+w/2-33.6,y-7,1.2,13);
  g.save();g.globalAlpha=.45;g.strokeStyle='#5f5240';g.lineWidth=.6;
  for(let i=0;i<3;i++){
    g.beginPath();g.moveTo(x+w/2-43,y-4+i*3.4);g.lineTo(x+w/2-36,y-4+i*3.4);
    g.moveTo(x+w/2-31,y-4+i*3.4);g.lineTo(x+w/2-24,y-4+i*3.4);g.stroke();
  }
  g.restore();
  /* la sonnette, tout à droite */
  g.fillStyle='rgba(0,0,0,.4)';
  g.beginPath();g.ellipse(x+w/2-11,y+2,7,3.4,0,0,7);g.fill();
  g.fillStyle=or;g.beginPath();g.ellipse(x+w/2-12,y-1,7,4.8,0,0,7);g.fill();
  g.fillStyle='rgba(255,255,255,.5)';
  g.beginPath();g.ellipse(x+w/2-14,y-2.4,2.6,1.5,0,0,7);g.fill();
  g.fillStyle=or;g.beginPath();g.arc(x+w/2-12,y-6.4,1.6,0,7);g.fill();

  /* la plaque gravée, sur la façade côté hall */
  g.fillStyle='#1d1309';g.beginPath();g.roundRect(x-30,y+h/2+14,60,12,2);g.fill();
  g.strokeStyle=or;g.lineWidth=1.2;g.stroke();
  g.fillStyle=or;g.font='700 7.5px Georgia,serif';g.textAlign='center';
  g.fillText('CHANGE',x,y+h/2+22.6);g.textAlign='left';
}

/* une pile de jetons, vue de dessus */
function pileJetons(g,x,y,c1,c2){
  ombreSous(g,x+1.5,y+2,7,4,.4);
  g.fillStyle=c1;g.beginPath();g.arc(x,y,6,0,7);g.fill();
  g.fillStyle=c2;g.beginPath();g.arc(x,y,3.6,0,7);g.fill();
  g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=.8;
  g.beginPath();g.arc(x,y,5,0,7);g.stroke();
}

/* une plante, vue de dessus : le feuillage s'étale */
function planteHaut(g,x,y){
  ombreSous(g,x+2,y+3,16,7,.4);
  const pot=g.createRadialGradient(x-4,y-4,2,x,y,14);
  pot.addColorStop(0,'#6b4527');pot.addColorStop(1,'#33200f');
  g.fillStyle=pot;g.beginPath();g.arc(x,y,14,0,7);g.fill();
  g.strokeStyle=orDe(g,x-14,y-14,x+14,y+14);g.lineWidth=1.4;g.stroke();
  g.fillStyle='#2a1a0e';g.beginPath();g.arc(x,y,11,0,7);g.fill();
  const f=(dx,dy,r,c1,c2)=>{
    const d=g.createRadialGradient(x+dx-r*.35,y+dy-r*.35,1,x+dx,y+dy,r);
    d.addColorStop(0,c1);d.addColorStop(1,c2);
    g.fillStyle=d;g.beginPath();g.arc(x+dx,y+dy,r,0,7);g.fill();};
  f(-5,-3,7.5,'#4d9c5a','#1f4a28');f(5,-5,8,'#57a85e','#254f2c');
  f(0,5,7.5,'#4a9452','#22492a');f(0,-1,5.5,'#78cc7d','#357038');
}

/* le halo d'un lustre, projeté au sol */
function halo(g,x,y,r,a){
  const d=g.createRadialGradient(x,y,0,x,y,r);
  d.addColorStop(0,'rgba(255,228,170,'+a+')');
  d.addColorStop(.6,'rgba(255,228,170,'+(a*.35)+')');
  d.addColorStop(1,'rgba(255,228,170,0)');
  g.fillStyle=d;g.beginPath();g.arc(x,y,r,0,7);g.fill();
}

/* le panneau JETONS, posé sur le comptoir */
function panneau(g,x,y,txt){
  g.fillStyle='rgba(0,0,0,.4)';
  g.beginPath();g.roundRect(x-31,y-6,62,15,4);g.fill();
  const d=g.createLinearGradient(0,y-8,0,y+7);
  d.addColorStop(0,'#2a2030');d.addColorStop(1,'#171019');
  g.fillStyle=d;g.beginPath();g.roundRect(x-32,y-8,64,15,4);g.fill();
  g.strokeStyle=orDe(g,x-32,y-8,x+32,y+7);g.lineWidth=1.4;g.stroke();
  g.fillStyle='#f0cf7d';g.font='700 8px system-ui';g.textAlign='center';
  g.fillText(txt,x,y+3);g.textAlign='left';
}

/* la porte, dans la bordure du bas */
function porteBas(g,x,y){
  const d=g.createLinearGradient(0,y-9,0,y+9);
  d.addColorStop(0,'#6b4425');d.addColorStop(1,'#331f0e');
  g.fillStyle=d;g.beginPath();g.roundRect(x-20,y-9,40,18,3);g.fill();
  g.strokeStyle=orDe(g,x-20,y-9,x+20,y+9);g.lineWidth=1.8;g.stroke();
  /* les deux battants */
  g.strokeStyle='rgba(0,0,0,.45)';g.lineWidth=1.2;
  g.beginPath();g.moveTo(x,y-8);g.lineTo(x,y+8);g.stroke();
  g.fillStyle=orDe(g,x-6,y-2,x+6,y+2);
  g.beginPath();g.arc(x-4,y,1.6,0,7);g.fill();
  g.beginPath();g.arc(x+4,y,1.6,0,7);g.fill();
  g.fillStyle='#f0cf7d';g.font='700 7px system-ui';g.textAlign='center';
  g.fillText('SORTIE',x,y-13);g.textAlign='left';
}


/* ================= ce qu'il y a dans le hall ================= */
const CX=SALLE_L/2;
const HOTESSE={x:CX,y:106,ap:{peau:1,cheveux:4,coiffe:10,yeux:2,veste:0,haut:2,pantalon:3,bas:4,
  souliers:1,chapeau:0,sourcils:1,nez:1,bouche:2,corps:1}};
const PORTE={x:CX,y:SALLE_H-MUR/2};

function bloque(x,y){
  if(x<MUR+10||x>SALLE_L-MUR-10)return true;
  /* la loge est réservée à l'hôtesse : on s'arrête au comptoir */
  if(y<COMPTOIR.y+COMPTOIR.h/2+8)return true;
  if(y>SALLE_H-MUR-8&&Math.abs(x-CX)>20)return true;   /* on ne passe que par la porte */
  if(y>SALLE_H-6)return true;
  /* les plantes */
  for(const p of [[MUR+30,300],[SALLE_L-MUR-30,300],[MUR+30,470],[SALLE_L-MUR-30,470]])
    if(Math.hypot(p[0]-x,p[1]-y)<20)return true;
  return false;
}

/* ================= la caméra ================= */
const ZOOM=2;
let ECH=ZOOM, VW=0, VH=0;
function taille(){
  const dpr=Math.max(1,Math.floor(window.devicePixelRatio||1));
  ECH=dpr*ZOOM;
  const w=window.innerWidth, h=window.innerHeight;
  VW=Math.ceil(w/ZOOM)+1;VH=Math.ceil(h/ZOOM)+1;
  cv.width=VW*ECH;cv.height=VH*ECH;
  cv.style.width=(VW*ZOOM)+'px';cv.style.height=(VH*ZOOM)+'px';
}
addEventListener('resize',taille);

let joueur={x:CX,y:SALLE_H-MUR-30,dir:'haut',pas:0,marche:false};
let vx=0,vy=0;
const VITESSE=88;
function majJoueur(dt){
  const n=Math.hypot(joyX,joyY), pousse=Math.min(1,n);
  const cx2=n>0.16?(joyX/n)*VITESSE*pousse:0;
  const cy2=n>0.16?(joyY/n)*VITESSE*pousse:0;
  const k=Math.min(1,dt*(n>0.16?11:16));
  vx+=(cx2-vx)*k;vy+=(cy2-vy)*k;
  const v=Math.hypot(vx,vy);
  if(v>1.2){
    const nx=joueur.x+vx*dt, ny=joueur.y+vy*dt;
    let ax=joueur.x, ay=joueur.y;
    if(!bloque(nx,joueur.y))ax=nx;
    if(!bloque(ax,ny))ay=ny;
    joueur.x=ax;joueur.y=ay;
    joueur.pas+=v*dt*0.34;
    if(Math.abs(vx)>Math.abs(vy)*1.35)joueur.dir=vx>0?'droite':'gauche';
    else if(Math.abs(vy)>Math.abs(vx)*1.35)joueur.dir=vy>0?'bas':'haut';
  }else{vx=vy=0;joueur.pas=0;}
  joueur.marche=v>4;
  /* on ressort par la porte du bas */
  if(joueur.y>SALLE_H-MUR-14&&Math.abs(joueur.x-PORTE.x)<18&&!sortie){
    sortie=true;sortir();
  }
}
let sortie=false, fondu=1;
function sortir(){
  sauver();direOuJeSuis('terrain');
  fondu=-1;                                    /* on ferme au noir, puis on s'en va */
  setTimeout(()=>{location.href='jeu.html';},420);
}

function dessiner(){
  if(!SOL)SOL=construireSol();
  const camX=Math.max(0,Math.min(SALLE_L-VW,joueur.x-VW/2));
  const camY=Math.max(0,Math.min(SALLE_H-VH,joueur.y-VH/2));
  const iX=Math.floor(camX), iY=Math.floor(camY);
  ctx.setTransform(ECH,0,0,ECH,Math.round(-(camX-iX)*ECH),Math.round(-(camY-iY)*ECH));
  ctx.fillStyle='#0d0a0e';ctx.fillRect(-2,-2,VW+4,VH+4);
  const lw=Math.min(VW+2,SALLE_L-iX), lh=Math.min(VH+2,SALLE_H-iY);
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  ctx.drawImage(SOL,iX*SUR,iY*SUR,lw*SUR,lh*SUR,0,0,lw,lh);

  /* les halos des lustres, au sol */
  halo(ctx,CX-iX,86-iY,72,.2);                   /* la lampe de la loge */
  halo(ctx,CX-iX,330-iY,100,.17);
  halo(ctx,MUR+60-iX,470-iY,56,.1);
  halo(ctx,SALLE_L-MUR-60-iX,470-iY,56,.1);

  /* le mobilier et les personnages, triés par profondeur */
  const objets=[
    {y:62,f:()=>etageres(ctx,CX-iX,62-iY,LOGE.w-18)},
    {y:96,f:()=>chaise(ctx,CX-iX,96-iY)},
    {y:106,f:()=>dessinerHotesse(iX,iY)},
    {y:132,f:()=>comptoirLoge(ctx,COMPTOIR.x-iX,COMPTOIR.y-iY,COMPTOIR.w,COMPTOIR.h)},
    {y:300,f:()=>{planteHaut(ctx,MUR+30-iX,300-iY);planteHaut(ctx,SALLE_L-MUR-30-iX,300-iY);}},
    {y:470,f:()=>{planteHaut(ctx,MUR+30-iX,470-iY);planteHaut(ctx,SALLE_L-MUR-30-iX,470-iY);}},
    {y:SALLE_H-MUR/2,f:()=>porteBas(ctx,PORTE.x-iX,PORTE.y-iY)},
    {y:joueur.y,f:()=>dessinerJoueur(iX,iY)}
  ].sort((a,b)=>a.y-b.y);
  objets.forEach(o=>o.f());

  /* le fondu d'entrée et de sortie */
  if(fondu!==0){
    ctx.setTransform(1,0,0,1,0,0);
    const a=fondu>0?fondu:-fondu;
    ctx.fillStyle='rgba(8,6,10,'+Math.min(1,a).toFixed(3)+')';
    ctx.fillRect(0,0,cv.width,cv.height);
  }
}

function pixel(f){
  ctx.imageSmoothingEnabled=false;f();ctx.imageSmoothingEnabled=true;
}
function dessinerJoueur(iX,iY){
  const px=Math.round((joueur.x-iX)*ECH)/ECH, py=Math.round((joueur.y-iY)*ECH)/ECH;
  const om=ctx.createRadialGradient(px,py,0,px,py,13);
  om.addColorStop(0,'rgba(0,0,0,.5)');om.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=om;ctx.beginPath();ctx.ellipse(px,py,13,4.5,0,0,7);ctx.fill();
  ctx.save();ctx.globalAlpha=.15;
  ctx.translate(px,py+1);ctx.scale(1,-0.36);ctx.translate(-px,-py);
  pixel(()=>sprite(ctx,px,py,e.ap,joueur.dir,joueur.pas,false));
  ctx.restore();
  pixel(()=>sprite(ctx,px,py,e.ap,joueur.dir,joueur.pas,!!joueur.marche));
}
let clinT=0;
function dessinerHotesse(iX,iY){
  const x=HOTESSE.x-iX, y=HOTESSE.y-iY;
  const om=ctx.createRadialGradient(x,y,0,x,y,12);
  om.addColorStop(0,'rgba(0,0,0,.45)');om.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=om;ctx.beginPath();ctx.ellipse(x,y,12,4,0,0,7);ctx.fill();
  /* elle se balance doucement, comme quelqu'un qui attend */
  const t=Date.now()/1000;
  /* assise : on ne voit que le buste au-dessus du dossier */
  ctx.save();
  ctx.beginPath();ctx.rect(x-20,y-52,40,46);ctx.clip();
  const bal=Math.sin(t*0.9)*0.6;
  pixel(()=>sprite(ctx,x,y+9+bal,HOTESSE.ap,'bas',0,false));
  ctx.restore();
}

/* on décompose une somme en jetons, comme au vrai guichet */
function enJetons(n){
  const out=[];
  [100,25,5,1].forEach(v=>{
    const q=Math.floor(n/v);
    if(q){out.push({v,q:Math.min(q,9)});n-=q*v;}
  });
  return out;
}
function svgJeton(v,taille){
  const j=VALEURS.find(x=>x.v===v)||VALEURS[0];
  const t=taille||30;
  return '<svg viewBox="0 0 40 40" width="'+t+'" height="'+t+'">'+
   '<circle cx="20" cy="20" r="18.5" fill="rgba(40,35,25,.12)"/>'+
   '<circle cx="20" cy="20" r="18" fill="'+j.c2+'"/>'+
   '<circle cx="20" cy="20" r="15.5" fill="'+j.c1+'"/>'+
   '<circle cx="20" cy="20" r="11" fill="none" stroke="'+j.c2+'" stroke-width="2.6"/>'+
   [0,45,90,135,180,225,270,315].map(a=>
     '<rect x="18.6" y="1.4" width="2.8" height="5" fill="'+j.c2+'" transform="rotate('+a+' 20 20)"/>').join('')+
   '<text x="20" y="24.5" font-size="10" font-family="Georgia,serif" font-weight="700" '+
   'fill="'+j.c2+'" text-anchor="middle">'+v+'</text></svg>';
}
function ouvrirGuichet(){

    const n=(e.sac&&e.sac[k])||0;
    const bord=({bois:'#8a6238',pierre:'#6f767d',fibre:'#8a9a4a',baies:'#9c3232',
      argile:'#7d888f',roseaux:'#5e8a47',champignons:'#a83a3a',herbes:'#6ba84a',plumes:'#c9c2b0',
      fer:'#b06a3a',cuivre:'#3f9e7a',charbon:'#3a373c',resine:'#e8a94a'})[k];
    return '<div class="ech'+(n?'':' gris')+'" style="border-left-color:'+(n?bord:'#d8d4ca')+'">'+

  }).join('');
  $('pageFond').innerHTML=
   '<div class="tete"><button class="x" id="p-x">✕</button>'+
     '<span><span class="t1">Le guichet</span><span class="t2">CHANGE ET JETONS</span></span>'+
     '<span class="jet"><b id="p-jet">'+e.jetons+'</b><i>JETONS</i></span></div>'+
   '<div class="corps">'+

       '<div class="tiroir">'+
         VALEURS.map(j=>'<span class="rang">'+
           '<span class="pileC">'+Array.from({length:3},(_,i)=>
             '<span class="jc" style="bottom:'+(i*7)+'px">'+svgJeton(j.v,34)+'</span>').join('')+'</span>'+
           '<span class="nom">'+j.v+'</span></span>').join('')+

           : '<div class="vide">Ton sac est vide. Reviens avec du bois, de la pierre ou des baies.</div>')+
     '<div class="res" id="res"></div>'+

function changer(k,muet){
  const n=(e.sac&&e.sac[k])||0;
  if(!n)return;
  const gain=n*TAUX[k];
  e.sac[k]=0;e.jetons+=gain;
  sauver();majJetons();
  if(muet)return;
  ouvrirGuichet();
  const r=$('res');
  if(r)r.innerHTML=n+' '+NOMS[k].toLowerCase()+' → <b>'+gain+' jetons</b>';
  pluieDeJetons(gain);
  try{navigator.vibrate&&navigator.vibrate([10,30,18]);}catch(x){}

/* les jetons rendus tombent sur le comptoir */
function pluieDeJetons(gain){
  const zone=$('pluie');if(!zone)return;
  const lot=enJetons(gain).flatMap(x=>Array.from({length:x.q},()=>x.v)).slice(0,14);
  zone.innerHTML=lot.map((v,i)=>
    '<i style="left:'+(8+Math.random()*84)+'%;animation-delay:'+(i*0.06).toFixed(2)+'s">'+
    svgJeton(v,26)+'</i>').join('');
  setTimeout(()=>{if(zone)zone.innerHTML='';},2000);
}

/* ================= le bouton d'action ================= */
function majAction(){
  const b=$('action');
  if($('page').classList.contains('on')){b.classList.remove('on');return;}
  const pres=Math.abs(joueur.x-COMPTOIR.x)<COMPTOIR.w/2+10&&joueur.y-COMPTOIR.y<70;
  if(pres){b.innerHTML='Parler<small>GUICHET · CHANGER SON BUTIN</small>';b.classList.add('on');return;}

}
$('action').onclick=()=>{
  if(Math.abs(joueur.x-COMPTOIR.x)<COMPTOIR.w/2+10&&joueur.y-COMPTOIR.y<70)return ouvrirGuichet();
  if(Math.hypot(joueur.x-PORTE.x,joueur.y-PORTE.y)<50&&!sortie){sortie=true;sortir();}
};

/* ================= le joystick, flottant =================
   Il n'a pas de place fixe : il apparaît là où le pouce se pose,
   dans toute la moitié gauche de l'écran, et s'efface quand on lâche. */
const jc=$('joy'), jg=jc.getContext('2d');
let JDPR=1;
function tailleJoy(){
  JDPR=Math.max(1,Math.min(3,window.devicePixelRatio||1));
  jc.width=Math.round(window.innerWidth*JDPR);
  jc.height=Math.round(window.innerHeight*JDPR);
  jg.setTransform(JDPR,0,0,JDPR,0,0);
}
addEventListener('resize',tailleJoy);
tailleJoy();

const RAYON=52, POUCE=22;
let J={actif:false,id:null,ox:0,oy:0,x:0,y:0,vie:0};

const pointDe=t=>[t.clientX,t.clientY];
function prendre(x,y){
  const limite=window.innerHeight-96;          /* la barre du bas */
  if(y>limite)y=limite;
  J.actif=true;J.ox=x;J.oy=y;J.x=x;J.y=y;J.vie=1;
  joyX=joyY=0;
  try{navigator.vibrate&&navigator.vibrate(8);}catch(x2){}   /* un petit clic sous le doigt */
}
function tirer(x,y){
  const dx=x-J.ox, dy=y-J.oy, d=Math.hypot(dx,dy);
  const a=Math.atan2(dy,dx);
  const m=Math.min(d,RAYON);
  J.x=J.ox+Math.cos(a)*m;J.y=J.oy+Math.sin(a)*m;
  /* si le pouce s'éloigne trop, le manche se déplace avec lui */
  if(d>RAYON){J.ox=x-Math.cos(a)*RAYON;J.oy=y-Math.sin(a)*RAYON;}
  const n=Math.min(1,d/RAYON);
  joyX=d<1?0:Math.cos(a)*n;joyY=d<1?0:Math.sin(a)*n;
  if(Math.hypot(joyX,joyY)<.16)joyX=joyY=0;
}
function lacher(){J.actif=false;J.id=null;joyX=joyY=0;}

/* on n'accepte le doigt que dans la moitié gauche : la droite reste libre */
const pageOuverte=()=>$('page').classList.contains('on');
const surUnBouton=(c)=>!!(c&&c.closest&&c.closest('button,#hud,#plan,#page'));
const zoneMarche=(x,y,c)=>!pageOuverte()&&!surUnBouton(c);

/* on écoute la page entière, mais on ne prend le doigt que dans la zone de marche :
   ailleurs, le toucher passe normalement aux boutons */
document.addEventListener('touchstart',ev=>{
  for(const t of ev.changedTouches){
    if(J.actif)continue;
    const [x,y]=pointDe(t);
    if(!zoneMarche(x,y,ev.target))continue;
    ev.preventDefault();
    J.id=t.identifier;prendre(x,y);
  }
},{passive:false});
document.addEventListener('touchmove',ev=>{
  for(const t of ev.changedTouches)if(t.identifier===J.id){
    ev.preventDefault();
    const [x,y]=pointDe(t);tirer(x,y);
  }
},{passive:false});
['touchend','touchcancel'].forEach(k=>document.addEventListener(k,ev=>{
  for(const t of ev.changedTouches)if(t.identifier===J.id){ev.preventDefault();lacher();}
},{passive:false}));

document.addEventListener('mousedown',ev=>{
  if(zoneMarche(ev.clientX,ev.clientY,ev.target))prendre(ev.clientX,ev.clientY);});
addEventListener('mousemove',ev=>{if(J.actif)tirer(ev.clientX,ev.clientY);});
addEventListener('mouseup',()=>{if(J.actif)lacher();});

addEventListener('keydown',ev=>{const k={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],
  z:[0,-1],s:[0,1],q:[-1,0],d:[1,0]}[ev.key];if(k){joyX=k[0];joyY=k[1];}});
addEventListener('keyup',()=>{joyX=joyY=0;});

function dessinerJoy(dt){
  /* il s'efface doucement quand on lâche */
  if(!J.actif&&J.vie>0)J.vie=Math.max(0,J.vie-dt*5);
  jg.clearRect(0,0,window.innerWidth,window.innerHeight);
  if(J.vie<=0)return;
  jg.save();
  jg.globalAlpha=J.vie;
  /* la couronne */
  jg.beginPath();jg.arc(J.ox,J.oy,RAYON,0,7);
  const f=jg.createRadialGradient(J.ox,J.oy-14,6,J.ox,J.oy,RAYON);
  f.addColorStop(0,'rgba(240,246,238,.26)');f.addColorStop(1,'rgba(200,212,198,.12)');
  jg.fillStyle=f;jg.fill();
  jg.lineWidth=2.5;jg.strokeStyle='rgba(240,246,238,.38)';jg.stroke();
  /* le sens, en léger */
  const d=Math.hypot(J.x-J.ox,J.y-J.oy);
  if(d>6){
    const a=Math.atan2(J.y-J.oy,J.x-J.ox);
    jg.beginPath();
    jg.arc(J.ox,J.oy,RAYON-2,a-0.5,a+0.5);
    jg.lineWidth=4;jg.strokeStyle='rgba(169,232,138,.5)';jg.stroke();
  }
  /* le manche */
  jg.beginPath();jg.arc(J.x,J.y+3,POUCE,0,7);jg.fillStyle='rgba(10,18,12,.22)';jg.fill();
  const k=jg.createRadialGradient(J.x-5,J.y-8,3,J.x,J.y,POUCE+1);
  if(d>6){k.addColorStop(0,'#a9e88a');k.addColorStop(1,'#3f7d4a');}
  else{k.addColorStop(0,'#f4f7f0');k.addColorStop(1,'#c9d2c2');}
  jg.beginPath();jg.arc(J.x,J.y,POUCE,0,7);jg.fillStyle=k;jg.fill();
  jg.lineWidth=2.5;jg.strokeStyle=d>6?'#2c6b32':'rgba(40,50,40,.4)';jg.stroke();
  jg.restore();
}




/* ================= la boucle ================= */
taille();
let t0=performance.now();
(function boucle(t){
  requestAnimationFrame(boucle);
  const dt=Math.min(.05,(t-t0)/1000);t0=t;
  if(!pageOuverte()&&!sortie)majJoueur(dt);
  if(fondu>0)fondu=Math.max(0,fondu-dt*2);
  else if(fondu<0)fondu=Math.max(-1.2,fondu-dt*3);
  majAction();dessiner();dessinerJoy(dt);
})(t0);
addEventListener('pagehide',()=>{sauver();
  /* si on ferme la page dans le casino, on ne reste pas invisible pour toujours */
  try{navigator.sendBeacon&&navigator.sendBeacon(URL_SB+'/rest/v1/joueurs?apikey='+CLE_SB,
    new Blob([JSON.stringify([{id:e.id,pseudo:e.pseudo||'survivant',lieu:'terrain',
      maj:new Date().toISOString()}])],{type:'application/json'}));}catch(x){}
});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){SOL=null;taille();}else sauver();
});
</script>
