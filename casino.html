<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Scroll Casino</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      padding: 20px;
      padding-bottom: 120px;
    }

    .header {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .games {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .game {
      background: #334155;
      padding: 40px 20px;
      border-radius: 12px;
      text-align: center;
      font-size: 18px;
    }

    .bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #1e293b;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>CASINO TEST SCROLL</h1>
    <p>Si tu vois les 6 jeux, le scroll fonctionne !</p>
  </div>

  <div class="games">
    <div class="game">🎡 Jeu 1</div>
    <div class="game">🎰 Jeu 2</div>
    <div class="game">🚀 Jeu 3</div>
    <div class="game">🔴 Jeu 4</div>
    <div class="game">🃏 Jeu 5</div>
    <div class="game">♠️ Jeu 6</div>
  </div>

  <div class="bottom">BOTTOM NAV</div>
</body>
</html>
