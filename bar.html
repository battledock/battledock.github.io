<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bar du Port - Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  body { font-family:'Inter',sans-serif; background:#150a04; color:#f0e6da; min-height:100dvh; overflow-x:hidden; }
  .bg { position:fixed; inset:0; z-index:0; pointer-events:none; background:
      radial-gradient(120% 70% at 50% 0%, rgba(220,90,40,0.18), transparent 60%),
      linear-gradient(180deg,#1c0d05,#150a04 60%,#0d0602); }
  .bg::after { content:''; position:absolute; inset:0; background-image:
      radial-gradient(2px 2px at 18% 22%, rgba(255,160,80,0.25), transparent),
      radial-gradient(2px 2px at 76% 16%, rgba(255,120,60,0.2), transparent),
      radial-gradient(1.5px 1.5px at 50% 30%, rgba(255,180,90,0.18), transparent); }
  .wrap { position:relative; z-index:1; max-width:540px; margin:0 auto; padding:0 14px 40px; }

  .hdr { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px; padding:14px 4px;
    background:linear-gradient(180deg,#150a04,rgba(21,10,4,0.85)); backdrop-filter:blur(8px); }
  .back-btn { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:9px;
    padding:8px 12px; font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:1px; color:rgba(255,255,255,0.7); cursor:pointer; }
  .back-btn:active { transform:scale(0.95); }
  .hdr-title { flex:1; font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:3px;
    background:linear-gradient(135deg,#f59e0b,#fbbf24,#f97316); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }

  .neon { font-family:'Bebas Neue',sans-serif; text-align:center; font-size:30px; letter-spacing:4px; color:#fbbf24;
    text-shadow:0 0 12px rgba(251,191,36,0.6), 0 0 30px rgba(249,115,22,0.4); margin:10px 0 4px; }
  .sub { text-align:center; font-size:12px; color:rgba(255,255,255,0.45); margin-bottom:14px; }

  .panel { background:rgba(255,255,255,0.04); border:1px solid rgba(245,158,11,0.2); border-radius:16px; padding:14px; margin-bottom:14px; }
  .panel-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-size:12px; color:rgba(255,255,255,0.6); }
  .panel-val { font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:1px; color:#fbbf24; }
  .pay-btn { width:100%; padding:14px; border:none; border-radius:13px; background:linear-gradient(135deg,#d97706,#fbbf24);
    color:#2a1500; font-family:'Bebas Neue',sans-serif; font-size:17px; letter-spacing:1.5px; cursor:pointer; transition:transform .1s; }
  .pay-btn:active { transform:scale(0.97); }
  .pay-btn:disabled { opacity:0.4; cursor:default; }

  .warn { background:rgba(248,113,113,0.08); border:1px solid rgba(248,113,113,0.2); border-radius:12px; padding:11px 14px;
    font-size:11px; color:rgba(255,200,200,0.7); text-align:center; margin-bottom:16px; line-height:1.5; }

  .rumor { background:rgba(255,255,255,0.04); border:1px solid rgba(245,158,11,0.18); border-radius:16px; padding:14px; margin-bottom:12px; }
  .rumor-top { display:flex; align-items:center; gap:11px; margin-bottom:10px; }
  .rumor-ava { width:42px; height:42px; border-radius:50%; background:rgba(245,158,11,0.12); border:1px solid rgba(245,158,11,0.3);
    display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
  .rumor-src { flex:1; min-width:0; }
  .rumor-name { font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:1px; color:#fbbf24; }
  .rumor-tag { font-size:10px; color:rgba(255,255,255,0.45); }
  .rumor-time { font-size:10px; color:rgba(255,255,255,0.35); text-align:right; }
  .rel { display:inline-block; padding:2px 8px; border-radius:20px; font-size:10px; font-weight:700; margin-top:3px; }
  .rumor-quote { font-size:14px; line-height:1.5; color:#f0e6da; font-style:italic; margin-bottom:12px; }
  .rumor-claim { display:flex; align-items:center; gap:8px; background:rgba(0,0,0,0.3); border-radius:11px; padding:9px 12px; margin-bottom:10px; }
  .claim-dir { font-family:'Bebas Neue',sans-serif; font-size:17px; letter-spacing:1px; }
  .claim-up { color:#34d399; } .claim-down { color:#f87171; }
  .claim-co { flex:1; font-size:13px; color:#fff; font-weight:600; }
  .rumor-go { width:100%; padding:11px; border:none; border-radius:11px; background:linear-gradient(135deg,#059669,#34d399);
    color:#022; font-family:'Bebas Neue',sans-serif; font-size:14px; letter-spacing:1px; cursor:pointer; }
  .rumor-go:active { transform:scale(0.97); }

  .muted { text-align:center; color:rgba(255,255,255,0.35); padding:30px 10px; font-size:13px; line-height:1.6; }
  .loader { text-align:center; padding:50px 20px; color:rgba(255,255,255,0.3); font-family:'Bebas Neue',sans-serif; letter-spacing:2px; }

  .toast { position:fixed; top:64px; left:50%; transform:translateX(-50%) translateY(-20px); z-index:200;
    background:rgba(30,15,5,0.97); border:1px solid rgba(245,158,11,0.4); border-radius:12px; padding:11px 18px;
    font-size:12px; font-weight:600; opacity:0; transition:all .35s; max-width:90%; text-align:center; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.bad { border-color:rgba(248,113,113,0.5); color:#fca5a5; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="wrap">
    <div class="hdr">
      <button class="back-btn" onclick="window.location.href='game.html'">← Retour</button>
      <div class="hdr-title">Bar du Port</div>
    </div>
    <div class="neon">🍺 RUMEURS DU PORT</div>
    <div class="sub">Paie ta tournée, on te glisse un tuyau sur le fret</div>

    <div class="panel">
      <div class="panel-row"><span>💰 Liquidités</span><span class="panel-val" id="money">—</span></div>
      <div class="panel-row"><span>🍺 Tuyaux aujourd'hui</span><span class="panel-val" id="left">—</span></div>
      <button class="pay-btn" id="payBtn" onclick="buyRumor()">Payer un tuyau — 5 000 €</button>
    </div>

    <div class="warn">⚠️ La fiabilité est indiquée en %, mais rien n'est sûr : même à 80% un tuyau peut être bidon. À toi de parier. 3 tuyaux max par jour.</div>

    <div id="rumors"><div class="loader">On s'installe au comptoir…</div></div>
  </div>
  <div class="toast" id="toast"></div>

<script>
  const SB_URL = 'https://drtsuhnbclhmgfjiykap.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
  const sb = supabase.createClient(SB_URL, SB_KEY);

  const COMPANIES = [
    { sym:'CALANCA',  name:'Calanca Lines' },
    { sym:'MISTRAL',  name:'Mistral Cargo' },
    { sym:'PHOCEA',   name:'Phocéa Maritime' },
    { sym:'STJEAN',   name:'Saint-Jean Shipping' },
    { sym:'CAPVERT',  name:'Cap Vert Fret' },
    { sym:'LACYDON',  name:'Lacydon Container' },
    { sym:'BONNEMER', name:'Bonne-Mère Lines' },
    { sym:'ESTAQUE',  name:'Estaque Maritime' },
  ];
  const NAME = {}; COMPANIES.forEach(c=>NAME[c.sym]=c.name);

  // Sources = pur folklore (la fiabilité est aléatoire pour tout le monde)
  const SOURCES = [
    { name:'Gégé', emoji:'🧔' }, { name:'Lavagne', emoji:'👨‍🍳' },
    { name:'Doudou', emoji:'😋' }, { name:'Titouan', emoji:'😐' },
    { name:'Jeff', emoji:'🍺' }, { name:'Le type du fond', emoji:'🕶️' },
  ];
  const QUOTES_UP = [
    "Paraît qu'{co} signe un méga contrat. Ça va décoller.",
    "{co} ? On charge à fond leurs cales. Ça monte, je te dis.",
    "Un armateur m'a soufflé que {co} explose bientôt.",
    "Mets sur {co}. Crois-moi, demain tu me remercies.",
  ];
  const QUOTES_DOWN = [
    "Évite {co}. Y'a une avarie qui se prépare, ça va plonger.",
    "{co} ? Leurs bateaux restent à quai. Ça sent le plongeon.",
    "On dit que {co} perd un gros client. Lâche l'affaire.",
    "Si t'as du {co}, revends. Ça va chuter, j'le sens.",
  ];

  const RUMOR_PRICE = 5000, DAILY_MAX = 3, RUMOR_TTL = 15*60*1000;
  let currentUser=null, money=0, bar={ day:'', count:0, ids:[] };

  const rand = a => a[Math.floor(Math.random()*a.length)];
  const fmt = n => Math.round(n).toLocaleString('fr-FR');
  function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }

  async function init(){
    const { data:{ session } } = await sb.auth.getSession();
    if(!session){ window.location.href='index.html'; return; }
    currentUser = session.user;
    const { data } = await sb.from('game_stats').select('money,bar').eq('user_id',currentUser.id).maybeSingle();
    money = data?.money || 0;
    const b = (data?.bar && typeof data.bar==='object') ? data.bar : {};
    bar = { day:b.day||'', count:b.count||0, ids:Array.isArray(b.ids)?b.ids:[] };
    if (bar.day !== todayStr()){ bar = { day:todayStr(), count:0, ids:[] }; await save(); }
    renderControls();
    loadOwned();
  }

  function renderControls(){
    document.getElementById('money').textContent = fmt(money)+'€';
    const left = DAILY_MAX - bar.count;
    document.getElementById('left').textContent = `${left}/${DAILY_MAX}`;
    const btn = document.getElementById('payBtn');
    if (left<=0){ btn.disabled=true; btn.textContent='Limite atteinte (revient demain)'; }
    else if (money<RUMOR_PRICE){ btn.disabled=true; btn.textContent='Pas assez de liquidités'; }
    else { btn.disabled=false; btn.textContent=`Payer un tuyau — ${fmt(RUMOR_PRICE)} €`; }
  }

  async function loadOwned(){
    const el = document.getElementById('rumors');
    if(!bar.ids.length){ el.innerHTML='<div class="muted">Aucun tuyau pour le moment.<br>Paie une tournée pour qu\'on te glisse un mot à l\'oreille.</div>'; return; }
    try {
      const { data } = await sb.from('bourse_rumors').select('*').in('id', bar.ids).gt('expires_at', new Date().toISOString()).order('created_at',{ascending:false});
      render(data||[]);
    } catch(e){ el.innerHTML='<div class="muted">Indisponible.</div>'; }
  }

  function srcEmoji(name){ const s=SOURCES.find(x=>x.name===name); return s?s.emoji:'🗣️'; }
  function relColor(p){ if(p>=70) return 'background:rgba(52,211,153,0.15);color:#34d399'; if(p>=50) return 'background:rgba(251,191,36,0.15);color:#fbbf24'; return 'background:rgba(248,113,113,0.15);color:#f87171'; }

  function render(rumors){
    const el = document.getElementById('rumors');
    if(!rumors.length){ el.innerHTML='<div class="muted">Tes tuyaux du jour ont expiré.<br>Reviens demain pour du frais.</div>'; return; }
    const now = Date.now();
    el.innerHTML = rumors.map(r=>{
      const mins = Math.max(1, Math.ceil((new Date(r.expires_at).getTime()-now)/60000));
      const up = r.dir>0; const co = NAME[r.sym]||r.sym;
      const pct = parseInt((r.source_tag||'').replace(/\D/g,'')) || 50;
      return `<div class="rumor">
        <div class="rumor-top">
          <div class="rumor-ava">${r.source_emoji||srcEmoji(r.source)}</div>
          <div class="rumor-src"><div class="rumor-name">${r.source}</div>
            <span class="rel" style="${relColor(pct)}">Fiabilité estimée : ${pct}%</span></div>
          <div class="rumor-time">⏳ ${mins} min</div>
        </div>
        <div class="rumor-quote">« ${r.quote} »</div>
        <div class="rumor-claim">
          <span class="claim-dir ${up?'claim-up':'claim-down'}">${up?'📈 VA MONTER':'📉 VA CHUTER'}</span>
          <span class="claim-co">${co}</span>
        </div>
        <button class="rumor-go" onclick="window.location.href='bourse.html'">→ Voir à la Bourse</button>
      </div>`;
    }).join('');
  }

  async function buyRumor(){
    if (bar.count>=DAILY_MAX){ showToast('Limite de 3 tuyaux par jour atteinte.', true); return; }
    if (money<RUMOR_PRICE){ showToast('Liquidités insuffisantes.', true); return; }
    const co = rand(COMPANIES);
    const src = rand(SOURCES);
    const dir = Math.random()<0.5 ? 1 : -1;
    const rel = 0.30 + Math.random()*0.55;            // fiabilité aléatoire 30–85% pour tous
    const truth = Math.random() < rel;
    const quote = (dir>0 ? rand(QUOTES_UP) : rand(QUOTES_DOWN)).replace('{co}', co.name);
    const row = {
      sym: co.sym, dir, source: src.name, source_emoji: src.emoji,
      source_tag: `Fiabilité estimée ${Math.round(rel*100)}%`,
      quote, truth, expires_at: new Date(Date.now()+RUMOR_TTL).toISOString()
    };
    let newId=null;
    try {
      const { data, error } = await sb.from('bourse_rumors').insert(row).select('id').single();
      if (error) throw error;
      newId = data.id;
    } catch(e){ showToast('Le barman fait la sourde oreille (erreur).', true); return; }
    money -= RUMOR_PRICE; bar.count++; bar.ids.push(newId);
    await save();
    renderControls(); loadOwned();
    showToast('🍺 On te glisse un tuyau…', false);
  }

  async function save(){
    try { await sb.from('game_stats').update({ money: Math.round(money), bar }).eq('user_id', currentUser.id); }
    catch(e){ console.log('save bar:', e); }
  }

  let toastT=null;
  function showToast(msg,bad){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show'+(bad?' bad':''); clearTimeout(toastT); toastT=setTimeout(()=>t.className='toast'+(bad?' bad':''),2600); }

  init();
</script>
</body>
</html>
