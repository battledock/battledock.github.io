<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Battle Dock — Le métro</title>
<style>
:root{--or:#e8c06a;--nuit:#0c0e14;--creme:#f2efe4;--bleu:#1d3f8f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--nuit);color:var(--creme);
  font:400 15px Georgia,serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#scene{display:block;width:100%;max-width:560px;margin:0 auto;image-rendering:pixelated;
  padding-top:env(safe-area-inset-top)}
#bas{max-width:560px;margin:0 auto;padding:14px 16px calc(18px + env(safe-area-inset-bottom))}
.surT{font:700 10px ui-monospace,monospace;letter-spacing:2px;color:var(--or)}
h1{font:400 24px Georgia,serif;margin:4px 0 6px}
#bourse{font:700 12px ui-monospace,monospace;color:#b8b3a2;margin-bottom:14px}
#bourse b{color:var(--creme)}
.prixT{font:700 12px ui-monospace,monospace;background:#1b1b1b;color:#f2c230;border-radius:6px;padding:3px 7px}
/* LE PLAN DE LIGNE : comme sur les murs des vieilles stations */
#plan{background:#f4f1e6;color:#1b1b1b;border-radius:10px;padding:14px 16px 12px;
  border:3px solid #1b1b1b;box-shadow:0 4px 0 rgba(0,0,0,.4)}
#plan .ligneT{display:flex;align-items:center;gap:8px;font:700 12px ui-monospace,monospace;margin-bottom:12px}
#plan .num{width:24px;height:24px;border-radius:50%;background:var(--or);color:#1b1b1b;border:2px solid #1b1b1b;
  display:flex;align-items:center;justify-content:center;font:700 13px ui-monospace,monospace}
#trace{position:relative;padding-left:22px}
#trace::before{content:'';position:absolute;left:8px;top:10px;bottom:10px;width:6px;background:var(--or);
  border:2px solid #1b1b1b;border-radius:3px}
.arret{position:relative;display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;
  padding:9px 8px;margin-left:-8px;font:inherit;color:#1b1b1b;text-align:left;border-radius:8px;opacity:1}
.arret:disabled{color:#1b1b1b}
.arret::before{content:'';position:absolute;left:-11px;width:12px;height:12px;border-radius:50%;
  background:#fff;border:3px solid #1b1b1b}
.arret.ici::before{background:#1b1b1b;box-shadow:0 0 0 3px var(--or)}
.arret b{font:700 16px Georgia,serif;color:#1b1b1b}
.arret span span{font:400 11px ui-monospace,monospace;color:#6a6658}
.arret.choisi{background:rgba(232,192,106,.35)}
.arret.ferme{opacity:.42}
.boutons{display:flex;gap:10px;margin-top:14px}
.boutons button{flex:1;border:0;border-radius:12px;padding:14px 8px;font:700 14px Georgia,serif}
#partir{background:var(--or);color:#2a1d0c;box-shadow:0 3px 0 #8a6a2a}
#partir:disabled{opacity:.45}
#remonter{background:#2a2f3c;color:var(--creme);box-shadow:0 3px 0 #141821}
#frauder{display:block;width:100%;margin-top:10px;border:1px dashed #6a6658;border-radius:12px;
  background:none;color:#b8b3a2;padding:11px 8px;font:700 13px Georgia,serif}
#frauder:disabled{opacity:.4}
#trajet.controle #trajLigne::before{background:repeating-linear-gradient(90deg,#c0392b 0 10px,transparent 10px 16px);opacity:.6}
#trajet.controle #trajTitre{color:#ff6a5a}
#mot{min-height:18px;margin-top:10px;font:400 12px ui-monospace,monospace;color:#b8b3a2;text-align:center}
/* LE CHARGEMENT SPÉCIAL MÉTRO */
#trajet{position:fixed;inset:0;z-index:20;background:#07080c;display:none;flex-direction:column;
  animation:entreeT .5s ease-out}
#trajet.on{display:flex}
@keyframes entreeT{from{opacity:0}to{opacity:1}}
#tunnel{display:block;width:100%;max-width:560px;margin:0 auto;image-rendering:pixelated;
  padding-top:env(safe-area-inset-top)}
#trajBas{max-width:560px;width:100%;margin:0 auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
#trajTitre{font:400 22px Georgia,serif;margin:4px 0 18px}
#trajLigne{position:relative;height:10px;background:#2a2f3c;border-radius:5px;margin:0 8px}
#trajLigne::before{content:'';position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:5px;
  background:repeating-linear-gradient(90deg,#e8c06a 0 10px,transparent 10px 16px);opacity:.35}
#trajPastille{position:absolute;top:50%;left:0;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;
  background:#e8c06a;border:3px solid #1b1b1b;box-shadow:0 0 12px rgba(232,192,106,.7);
  display:flex;align-items:center;justify-content:center;font:700 12px ui-monospace,monospace;color:#1b1b1b}
.trajNoms{display:flex;justify-content:space-between;margin-top:14px;font:700 11px ui-monospace,monospace;
  letter-spacing:1.5px;color:#b8b3a2}
#trajConseil{margin-top:22px;text-align:center;font:italic 400 15px Georgia,serif;color:#e9e6db;min-height:20px}
#trajPc{margin-top:6px;text-align:center;font:700 11px ui-monospace,monospace;color:#6a6658}
#trajFin{display:none;gap:10px;margin-top:18px}
#trajFin button{flex:1;border:0;border-radius:12px;padding:14px 8px;font:700 14px Georgia,serif;
  background:#e8c06a;color:#2a1d0c;box-shadow:0 3px 0 #8a6a2a}
#voile{position:fixed;inset:0;background:#000;pointer-events:none;opacity:1;transition:opacity .45s}
#voile.parti{opacity:0}
</style>
</head>
<body>
<canvas id="scene" width="192" height="144"></canvas>
<div id="bas">
  <div class="surT">MÉTRO · LIGNE 1</div>
  <h1 id="nomStation">Station</h1>
  <div id="bourse">TON ARGENT · <b id="solde">—</b></div>
  <div id="plan">
    <div class="ligneT"><span class="num">1</span>VILLAGE ⇄ EXTRAMAR</div>
    <div id="trace"></div>
  </div>
  <div class="boutons">
    <button id="remonter">↑ Remonter</button>
    <button id="partir" disabled>Choisis un arrêt</button>
  </div>
  <button id="frauder" disabled>🤫 Frauder · risque de contrôle</button>
  <div id="mot"></div>
</div>
<div id="trajet">
  <canvas id="tunnel" width="192" height="120"></canvas>
  <div id="trajBas">
    <div class="surT">LIGNE 1 · SOUS LA VILLE</div>
    <div id="trajTitre">Prochain arrêt : Extramar</div>
    <div id="trajLigne"><div id="trajPastille">1</div></div>
    <div class="trajNoms"><span id="trajDe">VILLAGE</span><span id="trajA">EXTRAMAR</span></div>
    <div id="trajConseil"></div>
    <div id="trajPc">0 %</div>
    <div id="trajFin"><button id="trajRetour">← Revenir au Village</button></div>
  </div>
</div>
<div id="voile"></div>
<script>
/* =====================================================================
   LE MÉTRO — première station : le quai du Village.
   On est DEBOUT sur le quai, face aux voies : de l'autre côté, la voûte
   carrelée de blanc, la plaque émaillée, les affiches. Rien ne part en
   Realtime ici : le métro ne coûte rien.
   ===================================================================== */
const $=id=>document.getElementById(id);

/* LES STATIONS. Ajouter une station = ajouter une ligne ici, et son quai. */
const STATIONS=[
  {id:'village',nom:'Village',sous:'la place, la fontaine',ouvert:true,sortie:'jeu.html',prix:500},
  {id:'port',nom:'Extramar',sous:'le port, les docks, les grues',ouvert:true,sortie:'jeu.html?carte=extramar&arrivee=1',prix:500},
];
/* LA STATION OÙ L'ON EST : metro.html (Village) ou metro.html?station=port */
const ICI=STATIONS.find(s=>s.id===new URLSearchParams(location.search).get('station'))||STATIONS[0];
const LAS=STATIONS.find(s=>s.id!==ICI.id);          /* l'autre bout de la ligne */
const AU_PORT=ICI.id==='port';
/* L'ARGENT : le même joueur que dans le jeu. Le serveur seul débite, et
   fixe le prix : le navigateur ne fait que l'afficher. */
const URL_SB='https://zpfkekiavlfphialvphi.supabase.co';
const CLE_SB='sb_publishable__dfR2lEOwKjhhtavvJEvGw_KVACZnHP';
const CLE='bdl.pix.v2';
const DEMO=!/battledock\.fr$|github\.io$/.test(location.hostname);   /* l'aperçu ne débite rien */
let e={};
try{e=JSON.parse(localStorage.getItem(CLE)||'{}')||{};}catch(x){}
if(DEMO&&typeof e.euros!=='number')e.euros=1240;
const enEuros=c=>((c||0)/100).toFixed(2).replace('.',',')+' €';
function majSolde(){$('solde').textContent=typeof e.euros==='number'?enEuros(e.euros):'—';}
function garder(){if(DEMO)return;try{e.quand=Date.now();localStorage.setItem(CLE,JSON.stringify(e));}catch(x){}}
/* LA FRAUDE : il faut avoir le prix du ticket sur soi. Le serveur tire au
   sort le contrôle (une chance sur quatre) et, s'il tombe, vide tout. */
let FRAUDE=null;
async function tenterLaFraude(dest){
  if(DEMO){
    if(e.euros<dest.prix)return {erreur:'pas_assez',euros:e.euros,prix:dest.prix};
    if(Math.random()>=0.25)return {controle:false,euros:e.euros};
    const perdu=e.euros;e.euros=0;
    return {controle:true,euros:0,perdu_cents:perdu,objets:12};
  }
  if(!e.id)return {erreur:'compte'};
  try{
    const r=await fetch(URL_SB+'/rest/v1/rpc/frauder_metro',{method:'POST',
      headers:{'apikey':CLE_SB,'Authorization':'Bearer '+CLE_SB,'Content-Type':'application/json'},
      body:JSON.stringify({p_joueur:e.id,p_de:ICI.id,p_vers:dest.id})});
    return await r.json();
  }catch(x){return null;}
}
async function payerLeTicket(dest){
  if(DEMO){
    if(e.euros<dest.prix)return {erreur:'pas_assez',euros:e.euros,prix:dest.prix};
    e.euros-=dest.prix;return {euros:e.euros,prix:dest.prix};
  }
  if(!e.id)return {erreur:'compte'};
  try{
    const r=await fetch(URL_SB+'/rest/v1/rpc/ticket_metro',{method:'POST',
      headers:{'apikey':CLE_SB,'Authorization':'Bearer '+CLE_SB,'Content-Type':'application/json'},
      body:JSON.stringify({p_joueur:e.id,p_de:ICI.id,p_vers:dest.id})});
    return await r.json();
  }catch(x){return null;}
}
let choix=null;

/* ---------- une petite police de 3×5, pour les plaques ---------- */
const POLICE={
A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',
E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',
I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',
M:'101111111101101',N:'110101101101101',O:'010101101101010',P:'110101110100100',
Q:'010101101110011',R:'110101110101101',S:'011100010001110',T:'111010010010010',
U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',
Y:'101101010010010',Z:'111001010100111','0':'111101101101111','1':'010110010010111',
'2':'110001010100111','3':'110001010001110','4':'101101111001001','5':'111100110001110',
'-':'000000111000000','>':'100010001010100',' ':'000000000000000'};
function ecrire(g,txt,x,y,coul){
  g.fillStyle=coul;
  [...txt.toUpperCase()].forEach((ch,i)=>{
    const m=POLICE[ch]||POLICE[' '];
    for(let k=0;k<15;k++)if(m[k]==='1')g.fillRect(x+i*4+(k%3),y+Math.floor(k/3),1,1);
  });
}
const largeur=t=>t.length*4-1;

/* ---------- le décor fixe, gravé une seule fois ---------- */
const W=192,H=144;
const VOUTE_BAS=98;           /* là où le mur rencontre la fosse des voies */
function hauteurVoute(x){
  /* une voûte en anse de panier : plate au milieu, qui plonge vers les bords */
  const u=(x-W/2)/(W*0.62);
  return 10+Math.round((1-Math.sqrt(Math.max(0,1-u*u)))*70);
}
let FOND=null;
function graverLeQuai(){
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const g=c.getContext('2d');
  g.fillStyle='#07080c';g.fillRect(0,0,W,H);

  /* LE CARRELAGE BLANC BISEAUTÉ : briquettes de 6×3, joints décalés */
  for(let x=0;x<W;x++){
    const haut=hauteurVoute(x);
    for(let y=haut;y<VOUTE_BAS;y++){
      const rang=Math.floor((y-haut)/3);
      const dx=(x+(rang%2?3:0))%6, dy=(y-haut)%3;
      let col='#e9e6db';
      if(dy===0||dx===0)col='#bdb8a8';                /* le joint */
      else if(dy===1&&dx<=2)col='#f8f6ee';            /* le reflet du biseau */
      else if(dy===2)col='#dcd8ca';                   /* l'ombre sous la brique */
      g.fillStyle=col;g.fillRect(x,y,1,1);
    }
    /* la voûte s'assombrit vers le haut : l'éclairage vient des globes */
    const ombre=Math.max(0,(40-haut)/40);
    if(haut<VOUTE_BAS){
      const grd=g.createLinearGradient(0,haut,0,haut+26);
      grd.addColorStop(0,'rgba(10,12,20,.55)');grd.addColorStop(1,'rgba(10,12,20,0)');
      g.fillStyle=grd;g.fillRect(x,haut,1,26);
    }
    void ombre;
  }
  /* la bordure de la voûte : un liseré sombre */
  for(let x=0;x<W;x++){g.fillStyle='#3b3a36';g.fillRect(x,hauteurVoute(x)-1,1,1);}

  /* LA FRISE : un bandeau de carreaux ocre et vert bouteille, comme autrefois */
  for(let x=0;x<W;x++){
    if(hauteurVoute(x)>60)continue;
    g.fillStyle=(Math.floor(x/4)%2)?(AU_PORT?'#f2efe4':'#b0873a'):(AU_PORT?'#2d6fb0':'#2f5b3e');g.fillRect(x,62,1,3);
    g.fillStyle='#8a6a2a';g.fillRect(x,61,1,1);g.fillRect(x,65,1,1);
  }
  /* LE SOUBASSEMENT : carreaux plus sombres, en bas du mur */
  for(let x=0;x<W;x++){
    const h0=Math.max(hauteurVoute(x),84);
    for(let y=h0;y<VOUTE_BAS;y++){
      const dx=x%8,dy=(y-84)%7;
      g.fillStyle=(dx===0||dy===0)?(AU_PORT?'#2a4f7a':'#4c5a4a'):(AU_PORT?'#3a6ea5':'#6f8266');g.fillRect(x,y,1,1);
    }
  }

  /* LES AFFICHES, dans leurs cadres de bois */
  affiche(g,26,34,34,24,AU_PORT?'village':'port');
  affiche(g,132,34,34,24,'jeu');

  /* LA PLAQUE ÉMAILLÉE : bleu profond, liseré blanc, lettres blanches */
  const nom=ICI.nom.toUpperCase(), lw=largeur(nom)+12, px=Math.round(W/2-lw/2), py=40;
  g.fillStyle='#0f1f4a';g.fillRect(px-1,py-1,lw+2,13);
  g.fillStyle='#1d3f8f';g.fillRect(px,py,lw,11);
  g.fillStyle='#e9e6db';g.fillRect(px+1,py+1,lw-2,1);g.fillRect(px+1,py+9,lw-2,1);
  g.fillRect(px+1,py+1,1,9);g.fillRect(px+lw-2,py+1,1,9);
  ecrire(g,nom,px+6,py+3,'#ffffff');
  /* ses deux vis */
  g.fillStyle='#7f8aa8';g.fillRect(px+3,py+5,1,1);g.fillRect(px+lw-4,py+5,1,1);

  /* LES BOUCHES DU TUNNEL, aux deux bouts : le noir s'épaissit */
  [[0,1],[W,-1]].forEach(([x0,s])=>{
    const grd=g.createLinearGradient(x0,0,x0+s*38,0);
    grd.addColorStop(0,'rgba(4,5,8,.95)');grd.addColorStop(1,'rgba(4,5,8,0)');
    g.fillStyle=grd;g.fillRect(s>0?0:W-38,0,38,H-26);
  });

  /* LA FOSSE DES VOIES */
  g.fillStyle='#15161b';g.fillRect(0,VOUTE_BAS,W,22);
  for(let i=0;i<260;i++){                          /* le ballast */
    const x=(i*37)%W, y=VOUTE_BAS+4+((i*13)%16);
    g.fillStyle=['#26272d','#1c1d22','#302f33'][i%3];g.fillRect(x,y,1,1);
  }
  for(let x=2;x<W;x+=9){g.fillStyle='#2b2019';g.fillRect(x,VOUTE_BAS+9,5,9);}  /* les traverses */
  /* les deux rails, qui accrochent la lumière */
  [VOUTE_BAS+8,VOUTE_BAS+16].forEach(y=>{
    g.fillStyle='#3a3b42';g.fillRect(0,y,W,2);
    g.fillStyle='#9aa0ad';g.fillRect(0,y,W,1);
  });

  /* LE QUAI, au premier plan */
  const Q=VOUTE_BAS+22;
  g.fillStyle='#6b6a66';g.fillRect(0,Q,W,H-Q);
  for(let x=0;x<W;x++)for(let y=Q;y<H;y++){
    const dx=x%12,dy=(y-Q)%8;
    if(dx===0||dy===0){g.fillStyle='#57564f';g.fillRect(x,y,1,1);}
  }
  g.fillStyle='#8f8d86';g.fillRect(0,Q,W,1);                 /* l'arête du quai */
  g.fillStyle='#d8b43a';g.fillRect(0,Q+3,W,3);               /* la ligne jaune */
  for(let x=1;x<W;x+=3){g.fillStyle='#b0902a';g.fillRect(x,Q+4,1,1);}
  const grd=g.createLinearGradient(0,Q,0,H);
  grd.addColorStop(0,'rgba(0,0,0,0)');grd.addColorStop(1,'rgba(0,0,0,.35)');
  g.fillStyle=grd;g.fillRect(0,Q,W,H-Q);
  FOND=c;
}
function affiche(g,x,y,w,h,sorte){
  g.fillStyle='#4a3420';g.fillRect(x-2,y-2,w+4,h+4);
  g.fillStyle='#6b4a2c';g.fillRect(x-1,y-1,w+2,h+2);
  if(sorte==='port'){
    /* LE PORT : ciel du soir, la mer, une grue et un cargo */
    for(let j=0;j<h;j++){g.fillStyle=j<12?(j<6?'#f0a860':'#f6c77e'):'#2c6e9e';g.fillRect(x,y+j,w,1);}
    g.fillStyle='#7ab3d6';for(let i=0;i<w;i+=5)g.fillRect(x+i,y+15+(i%3),2,1);
    g.fillStyle='#2a1d18';g.fillRect(x+5,y+3,2,10);g.fillRect(x+5,y+3,11,2);g.fillRect(x+14,y+5,1,4);
    g.fillStyle='#8c2f2a';g.fillRect(x+16,y+10,14,3);g.fillStyle='#e9e6db';g.fillRect(x+25,y+8,3,2);
    ecrire(g,'EXTRAMAR',x+w/2-15,y+h-6,'#ffffff');
  }else if(sorte==='village'){
    /* LE VILLAGE : ciel bleu, la fontaine, les toits */
    for(let j=0;j<h;j++){g.fillStyle=j<13?'#8fc3e0':'#d9c7a0';g.fillRect(x,y+j,w,1);}
    g.fillStyle='#c96a3f';g.fillRect(x+2,y+7,9,3);g.fillRect(x+23,y+6,9,3);
    g.fillStyle='#e8c9a0';g.fillRect(x+2,y+10,9,4);g.fillStyle='#f0d78a';g.fillRect(x+23,y+9,9,5);
    g.fillStyle='#9aa2a8';g.fillRect(x+13,y+9,8,5);g.fillStyle='#6fb3d6';g.fillRect(x+15,y+6,4,3);
    ecrire(g,'VILLAGE',x+w/2-13,y+h-6,'#1b1b1b');
  }else{
    /* L'AFFICHE DU JEU : deux épées croisées sur fond rouge */
    g.fillStyle='#8c2f2a';g.fillRect(x,y,w,h);
    g.fillStyle='#b8453c';g.fillRect(x,y,w,2);
    g.fillStyle='#e9e6db';
    for(let i=0;i<11;i++){g.fillRect(x+11+i,y+3+i,1,1);g.fillRect(x+22-i,y+3+i,1,1);}
    g.fillStyle='#e8c06a';g.fillRect(x+10,y+13,3,1);g.fillRect(x+21,y+13,3,1);
    ecrire(g,'BATTLE',x+w/2-11,y+h-8,'#ffffff');
  }
  /* un coin décollé */
  g.fillStyle='rgba(255,255,255,.35)';g.fillRect(x+w-3,y,3,1);g.fillRect(x+w-2,y+1,2,1);
}

/* ---------- ce qui vit : les globes, le panneau, la poussière ---------- */
const GLOBES=[40,152];          /* le panneau des rames tient le milieu */
const POUSSIERE=Array.from({length:18},(_,i)=>({x:(i*53)%W,y:20+(i*29)%70,v:0.02+(i%5)*0.01}));
function dessiner(t){
  const g=$('scene').getContext('2d');
  g.imageSmoothingEnabled=false;
  majRame(t);
  /* la rame qui freine fait trembler le quai */
  const tremble=(RAME.etat==='arrive'&&RAME.vitesse>.15&&Math.random()<.35)?1:0;
  g.save();g.translate(0,tremble);
  g.drawImage(FOND,0,0);
  dessinerLaRame(g,t);
  /* LES GLOBES : suspendus à la voûte, avec leur halo */
  GLOBES.forEach((x,i)=>{
    const top=hauteurVoute(x), y=top+14;
    const vacille=(i===2&&Math.sin(t/140)>0.93)?0.35:1;   /* le dernier grésille */
    g.fillStyle='#2a2a2a';g.fillRect(x,top,1,y-top-2);
    const halo=g.createRadialGradient(x+.5,y+2,1,x+.5,y+2,30);

/* =====================================================================
   LA RAME : elle sort du tunnel à gauche, freine, s'arrête porte face à
   nous, les portes s'ouvrent… et on part.
   ===================================================================== */
const RAME={etat:'absente',t0:0,x0:-260,ouverture:0};
const LONG_VOITURE=92, ECART=4;
const X_ARRET=2;                       /* la rame s'arrête au BOUT du quai : on la voit en entier */
const DUREE_ARRIVEE=3400;
function appelerLaRame(){
  if(RAME.etat!=='absente')return;
  RAME.etat='annonce';RAME.t0=performance.now();
  carillon();
}
function majRame(t){
  const dt=t-RAME.t0;
  if(RAME.etat==='annonce'&&dt>1100){RAME.etat='arrive';RAME.t0=t;}
  if(RAME.etat==='arrive'){
    const p=Math.min(1,(t-RAME.t0)/DUREE_ARRIVEE);
    RAME.x0=-260+(X_ARRET+260)*(1-Math.pow(1-p,3));
    RAME.vitesse=Math.pow(1-p,2);
    if(p>=1){RAME.etat='ouvre';RAME.t0=t;RAME.vitesse=0;}
  }
  if(RAME.etat==='ouvre'){
    RAME.ouverture=Math.min(6,(t-RAME.t0)/100);
    if(t-RAME.t0>1400){RAME.etat='partie';lancerLeTrajet();}
  }
}

function dessinerLaRame(g,t){
  if(RAME.etat==='absente')return;

    const f=(t-RAME.t0)/1100;

/* ---------- un carillon de quai, deux notes ---------- */
let AUDIO=null;
function carillon(){
  try{
    AUDIO=AUDIO||new (window.AudioContext||window.webkitAudioContext)();
    [[659,0],[523,0.32]].forEach(([f,d])=>{
      const o=AUDIO.createOscillator(),v=AUDIO.createGain();
      o.type='sine';o.frequency.value=f;
      v.gain.setValueAtTime(0,AUDIO.currentTime+d);
      v.gain.linearRampToValueAtTime(.18,AUDIO.currentTime+d+.02);
      v.gain.exponentialRampToValueAtTime(.001,AUDIO.currentTime+d+.9);
      o.connect(v).connect(AUDIO.destination);o.start(AUDIO.currentTime+d);o.stop(AUDIO.currentTime+d+1);
    });
  }catch(x){}
}

function pointSurLaTrace(q){
  let tot=0;const seg=[];

      const [x1,y1]=TRACE[i],[x2,y2]=TRACE[i+1];
      return [x1+(x2-x1)*k,y1+(y2-y1)*k,Math.atan2(y2-y1,x2-x1)];}
    r-=seg[i];
  }
}
const ETOILES=Array.from({length:26},(_,i)=>[(i*67)%190,(i*23)%34,i]);
function dessinerLeTrajet(t){
  if(!TRAJET)return;
  let p=Math.min(1,(t-TRAJET.t0)/DUREE_TRAJET);
  const controle=FRAUDE&&FRAUDE.controle;
  if(controle&&p>=.45){p=.45;if(!TRAJET.pris)controler();}
  const q=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;            /* on accélère, on file, on freine */
  const vit=Math.sin(Math.PI*p);
  const c=$('tunnel'),g=c.getContext('2d');g.imageSmoothingEnabled=false;
  const Wt=c.width,Ht=c.height, sec=(t-TRAJET.t0)/1000;
  if(!COUPE)COUPE=graverLaCoupe(Wt,Ht);
  g.drawImage(COUPE,0,0);
  /* les étoiles scintillent, l'eau bouge, le cargo cligne */
  ETOILES.forEach(([x,y,i])=>{if(Math.sin(sec*2+i)>-.3){g.fillStyle=i%4?'#8a93b8':'#f4eed8';g.fillRect(x,y,1,1);}});
  g.fillStyle='rgba(200,230,245,.55)';
  for(let x=152;x<Wt;x+=7)g.fillRect(x+Math.round(Math.sin(sec*2+x)*1.5),SOL+4,3,1);
  if(Math.floor(sec*2)%2){g.fillStyle='#ff5a4a';g.fillRect(181,SOL-11,1,1);}
  /* la fumée des cheminées */
  for(let k=0;k<3;k++){const a=(sec*0.6+k/3)%1;g.fillStyle='rgba(200,200,210,'+(.4*(1-a))+')';
    g.fillRect(22+Math.round(Math.sin(a*6)*2),SOL-16-Math.round(a*12),2,2);}
  /* LA RAME : jaune et rose, sa lumière éclaire le tunnel devant elle */
  const [rx,ry]=pointSurLaTrace(AU_PORT?1-q:q);
  const halo=g.createRadialGradient(rx+6,ry,1,rx+6,ry,16);
  halo.addColorStop(0,'rgba(255,236,170,.55)');halo.addColorStop(1,'rgba(255,236,170,0)');
  g.fillStyle=halo;g.fillRect(rx-12,ry-16,34,32);
  const x0=Math.round(rx)-12,y0=Math.round(ry)-3;
  for(let v=0;v<2;v++){const vx=x0+v*7;
    g.fillStyle='#f2c230';g.fillRect(vx,y0,6,3);
    g.fillStyle='#e2709a';g.fillRect(vx,y0+3,6,2);
    g.fillStyle='#fff4d2';g.fillRect(vx+1,y0+1,1,1);g.fillRect(vx+3,y0+1,1,1);}
  g.fillStyle='#fff4d2';g.fillRect(x0+13,y0+3,1,1);                /* le phare */
  /* LE CONTRÔLE : la rame s'arrête dans le tunnel, gyrophare rouge */
  if(TRAJET.pris){
    const bat=Math.floor(sec*4)%2;
    const rouge=g.createRadialGradient(rx,ry,1,rx,ry,22);
    rouge.addColorStop(0,'rgba(255,60,50,'+(bat?.55:.2)+')');rouge.addColorStop(1,'rgba(255,60,50,0)');
    g.fillStyle=rouge;g.fillRect(rx-24,ry-24,48,48);
    /* le contrôleur, casquette et veste bleu marine */
    const cx=x0+15,cy=y0-1;
    g.fillStyle='#1b2a4a';g.fillRect(cx,cy+2,3,4);
    g.fillStyle='#e0b48a';g.fillRect(cx,cy,3,2);
    g.fillStyle='#10182c';g.fillRect(cx-1,cy-1,5,1);
    g.fillStyle='#e8c06a';g.fillRect(cx+1,cy-1,1,1);
  }
  /* les étincelles quand ça file */
  if(vit>.6&&Math.random()<.6){g.fillStyle='#ffd76a';g.fillRect(x0+Math.round(Math.random()*12),y0+5,1,1);}
  /* toute la ville tremble un peu au passage */
  $('tunnel').style.transform=(vit>.5&&Math.random()<.15)?'translateY(1px)':'none';
  /* la pastille avance sur la ligne */
  $('trajPastille').style.left=(q*100)+'%';
  if(!TRAJET.pris){
    $('trajPc').textContent=Math.round(q*100)+' %';
    $('trajConseil').textContent=CONSEILS[Math.floor(sec/2.2)%CONSEILS.length];
  }
  if(TRAJET.pris){requestAnimationFrame(dessinerLeTrajet);return;}
  if(p<1)requestAnimationFrame(dessinerLeTrajet);
  else arriver();
}
function controler(){
  TRAJET.pris=true;
  const F=FRAUDE;
  /* le serveur a déjà tout pris : le téléphone suit, pour que le jeu ne
     remette pas l'ancien sac en remontant */
  e.euros=0;e.sac={};garder();majSolde();
  $('trajet').classList.add('controle');
  $('trajTitre').textContent='Contrôle des titres !';
  $('trajConseil').textContent='Pas de ticket ? Le contrôleur te prend tout : −'+enEuros(F.perdu_cents||0)+
    ((F.objets||0)>0?' et les '+F.objets+' objets de ton sac.':' et ton sac.');
  $('trajPc').textContent='AMENDE';
  $('trajRetour').textContent='← Reconduit à quai';
  $('trajRetour').onclick=revenirAuQuai;
  $('trajFin').style.display='flex';
  if(navigator.vibrate)try{navigator.vibrate([60,40,60,40,120]);}catch(x){}
}
function arriver(){
  $('trajTitre').textContent='Terminus : '+TRAJET.dest.nom;
  $('trajConseil').textContent=(FRAUDE?'Pas vu, pas pris. ':'')+'Tout le monde descend.';
  $('trajRetour').textContent='Sortir à '+TRAJET.dest.nom+' ↑';
  $('trajRetour').onclick=()=>sortirA(TRAJET.dest);
  $('trajFin').style.display='flex';
  if(navigator.vibrate)try{navigator.vibrate([10,40,10]);}catch(x){}
}
function revenirAuQuai(){
  $('trajet').classList.remove('on','controle');
  $('trajRetour').onclick=revenirAuQuai;
  FRAUDE=null;$('frauder').disabled=true;
  TRAJET=null;RAME.etat='absente';RAME.x0=-260;RAME.ouverture=0;
  choix=null;dessinerLePlan();
  $('partir').disabled=true;$('partir').textContent='Choisis un arrêt';$('mot').textContent='';
}

$('nomStation').textContent='Station '+ICI.nom;
graverLeQuai();
majSolde();
dessinerLePlan();
requestAnimationFrame(dessiner);
requestAnimationFrame(()=>$('voile').classList.add('parti'));
</script>
