<script>/* pas de sélection ni de copier-coller, sauf dans les champs où l'on écrit */
(function(){var champ=function(t){return t&&t.closest&&t.closest('input,textarea,[contenteditable="true"]');};
['selectstart','copy','cut','contextmenu','dragstart'].forEach(function(k){document.addEventListener(k,function(e){if(!champ(e.target))e.preventDefault();},{capture:true});});})();</script>

<script>/* PAS DE ZOOM : ni pincer, ni double-tap, ni Ctrl + molette. Safari iOS ignore
   user-scalable=no : il faut aussi couper ses gestes à la main. */

['gesturestart','gesturechange','gestureend'].forEach(function(t){document.addEventListener(t,non,{passive:false});});
document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault();},{passive:false});
window.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault();},{passive:false});

<script>window.__JEU_DEMARRE=true;   /* le métro n'a pas besoin du garde « navigateur trop ancien » du jeu */</script>
<script>
/* Ajouté au signet, un navigateur garde la page en mémoire et ne va plus
   jamais la rechercher. On lui demande donc, à chaque ouverture, quelle est
   la version publiée : si elle a changé, on recharge une seule fois avec une
   adresse neuve — c'est la seule façon de percer le cache d'un raccourci. */
(function(){
  var MA_VERSION='2026-09-22-1407';
            /* visible par tout le jeu (les réglages l'affichent) */
  var cle='bdl.version.vue';
  function verifier(){
    fetch('version.json?t='+Date.now(),{cache:'no-store'})
      .then(function(r){return r.json();})
      .then(function(d){
        if(!d||!d.v||d.v===MA_VERSION)return;
        /* on ne recharge qu'une fois par version, sinon on bouclerait */
        var deja=null;
        try{deja=sessionStorage.getItem(cle);}catch(e){}
        if(deja===d.v)return;
        try{sessionStorage.setItem(cle,d.v);}catch(e){}
        var q=new URLSearchParams(location.search);q.set('v',d.v);var u=location.pathname.split('?')[0]+'?'+q.toString();   /* on garde la station */
        location.replace(u);
      })
      .catch(function(){});
  }
  verifier();
  /* LE FILET DES VIEUX NAVIGATEURS : si le jeu n'a pas démarré une fois la page lue, c'est que ce
     navigateur ne sait pas le lire. On le dit, avec la marche à suivre, au lieu d'un écran figé. */
  /* les scripts du jeu s'exécutent toujours AVANT « DOMContentLoaded » : si, à ce moment-là, le jeu
     n'a pas démarré, c'est qu'il n'a pas pu être lu (et non qu'il charge lentement) */
  document.addEventListener('DOMContentLoaded',function(){setTimeout(function(){
    if(window.__JEU_DEMARRE)return;
    var d=document.createElement('div');d.style.cssText='position:fixed;inset:0;z-index:9999;background:#1d1a14;color:#f2e8d0;display:flex;align-items:center;justify-content:center;padding:24px;font:16px Georgia,serif;text-align:center;line-height:1.5';
    d.innerHTML='<div><b style="font-size:20px">Ton navigateur est trop ancien pour Battle Dock</b><br><br>Mets à jour <b>Chrome</b> ou <b>Samsung Internet</b> depuis le Play Store, puis rouvre le jeu.<br><br><small style="opacity:.7">'+(navigator.userAgent||'').replace(/[<>]/g,'').slice(0,160)+'</small></div>';
    document.body.appendChild(d);
  },1500);});
  /* et quand on revient sur l'onglet après un moment */
  var vu=Date.now();
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState!=='visible')return;
    if(Date.now()-vu<60000)return;
    vu=Date.now();verifier();
  });
})();
</script>

<script>
/* =====================================================================
   LE MÉTRO — première station : le quai du Village.
   On est DEBOUT sur le quai, face aux voies : de l'autre côté, la voûte
   carrelée de blanc, la plaque émaillée, les affiches. Rien ne part en
   Realtime ici : le métro ne coûte rien.
   ===================================================================== */
const $=id=>document.getElementById(id);

/* LES STATIONS. Ajouter une station = ajouter une ligne ici, et son quai. */
/* LES TESTEURS : Saumaski leur est ouvert avant tout le monde */
const TESTEUR=(()=>{try{const x=JSON.parse(localStorage.getItem('bdl.pix.v2')||'{}');return x.id==='e029d1fb-7baa-4225-91fd-5cdbef6f8711';}catch(e){return false;}})();
const STATIONS=[
  /* LA LIGNE 1, de la mer aux sommets : le port, la ferme, la forêt, la montagne */
  {id:'port',nom:'Le port',sous:'Le Vieux-Port, les docks, le casino',ouvert:true,sortie:'jeu.html?carte=extramar&arrivee=1',prix:0},
  {id:'ferme',nom:'La ferme',sous:'Le champ, l’étal des graines, le poulailler',ouvert:true,sortie:'jeu.html?carte=ferme&arrivee=1',prix:0},
  {id:'foret',nom:'La forêt',sous:'bientôt ouverte',ouvert:false,sortie:'',prix:0},
  {id:'montagne',nom:'La montagne',sous:TESTEUR?'Saumaski · accès testeur':'bientôt ouverte',ouvert:TESTEUR,sortie:'jeu.html?carte=montagne&arrivee=1',prix:0},
];
/* LA STATION OÙ L'ON EST : metro.html (Village) ou metro.html?station=port */
const ICI=STATIONS.find(s=>s.id===new URLSearchParams(location.search).get('station'))||STATIONS.find(s=>s.id==='port');   /* (le village est fermé) */
/* LE MÉTRO EST GRATUIT : plus de ticket à payer, plus de fraude */
const LAS=STATIONS.find(s=>s.id===(ICI.id==='port'?'ferme':'port'));   /* la prochaine rame : la montagne depuis le port, le port sinon */   /* la prochaine rame : le port depuis le Village, le Village sinon */
const AU_PORT=ICI.id==='port';
/* L'ARGENT : le même joueur que dans le jeu. Le serveur seul débite, et
   fixe le prix : le navigateur ne fait que l'afficher. */
const URL_SB='https://zpfkekiavlfphialvphi.supabase.co';
const CLE_SB='sb_publishable__dfR2lEOwKjhhtavvJEvGw_KVACZnHP';
const CLE='bdl.pix.v2';
const DEMO=!/battledock\.fr$|github\.io$/.test(location.hostname);   /* l'aperçu ne débite rien */
let e={};
try{e=JSON.parse(localStorage.getItem('bdl.pix.v2')||'{}')||{};}catch(x){}
if(DEMO&&typeof e.euros!=='number')e.euros=1240;
const enEuros=c=>((c||0)/100).toFixed(2).replace('.',',')+' €';
function majSolde(){$('solde').textContent=typeof e.euros==='number'?enEuros(e.euros):'—';}
function garder(){if(DEMO)return;try{e.quand=Date.now();localStorage.setItem(CLE,JSON.stringify(e));}catch(x){}}
/* LA FRAUDE : il faut avoir le prix du ticket sur soi. Le serveur tire au
   sort le contrôle (une chance sur quatre) et, s'il tombe, vide tout. */
let FRAUDE=null;
async function tenterLaFraude(dest){
  if(DEMO){
    if(e.euros<dest.prix)return {erreur:'pas_assez',euros:e.euros,prix:dest.prix};
    if(Math.random()>=0.25)return {controle:false,euros:e.euros};
    const perdu=e.euros;e.euros=0;
    return {controle:true,euros:0,perdu_cents:perdu,objets:12};
  }
  if(!e.id)return {erreur:'compte'};
  try{
    const r=await fetch(URL_SB+'/rest/v1/rpc/frauder_metro',{method:'POST',
      headers:{'apikey':CLE_SB,'Authorization':'Bearer '+CLE_SB,'Content-Type':'application/json'},
      body:JSON.stringify({p_joueur:e.id,p_de:ICI.id,p_vers:dest.id})});
    /* une erreur du serveur n'est JAMAIS un succès : sans ça, on partait sans avoir payé */
    const d=await r.json();
    if(!r.ok||!d||typeof d!=='object')return {erreur:'serveur'};
    return d;
  }catch(x){return null;}
}
async function payerLeTicket(dest){
  if(DEMO){
    if(e.euros<dest.prix)return {erreur:'pas_assez',euros:e.euros,prix:dest.prix};
    e.euros-=dest.prix;return {euros:e.euros,prix:dest.prix};
  }
  if(!e.id)return {erreur:'compte'};
  try{
    const r=await fetch(URL_SB+'/rest/v1/rpc/ticket_metro',{method:'POST',
      headers:{'apikey':CLE_SB,'Authorization':'Bearer '+CLE_SB,'Content-Type':'application/json'},
      body:JSON.stringify({p_joueur:e.id,p_de:ICI.id,p_vers:dest.id})});
    /* une erreur du serveur n'est JAMAIS un succès : sans ça, on partait sans avoir payé */
    const d=await r.json();
    if(!r.ok||!d||typeof d!=='object')return {erreur:'serveur'};
    return d;
  }catch(x){return null;}
}
let choix=null;

/* ---------- une petite police de 3×5, pour les plaques ---------- */
const POLICE={
A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',
E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',
I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',
M:'101111111101101',N:'110101101101101',O:'010101101101010',P:'110101110100100',
Q:'010101101110011',R:'110101110101101',S:'011100010001110',T:'111010010010010',
U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',
Y:'101101010010010',Z:'111001010100111','0':'111101101101111','1':'010110010010111',
'2':'110001010100111','3':'110001010001110','4':'101101111001001','5':'111100110001110',
'-':'000000111000000','>':'100010001010100',' ':'000000000000000'};
function ecrire(g,txt,x,y,coul){
  g.fillStyle=coul;
  [...txt.toUpperCase()].forEach((ch,i)=>{
    const m=POLICE[ch]||POLICE[' '];
    for(let k=0;k<15;k++)if(m[k]==='1')g.fillRect(x+i*4+(k%3),y+Math.floor(k/3),1,1);
  });
}
const largeur=t=>t.length*4-1;

/* ---------- le décor fixe, gravé une seule fois ---------- */
const W=192,H=144;
const VOUTE_BAS=98;           /* là où le mur rencontre la fosse des voies */
function hauteurVoute(x){
  /* une voûte en anse de panier : plate au milieu, qui plonge vers les bords */
  const u=(x-W/2)/(W*0.62);
  return 10+Math.round((1-Math.sqrt(Math.max(0,1-u*u)))*70);
}
let FOND=null;
function graverLeQuai(){
  /* LE QUAI EN PIXEL FIN : même dessin, deux fois plus détaillé. Le carrelage
     biseauté a ses joints, ses reflets et ses nuances ; la frise est émaillée ;
     le ballast est caillou par caillou ; le quai a son grain et sa bande podotactile. */
  const S=2, c=document.createElement('canvas');c.width=W*S;c.height=H*S;
  const g=c.getContext('2d');g.imageSmoothingEnabled=false;
  const img=g.createImageData(W*S,H*S), d=img.data;
  const hx=(a,b,k)=>{let n=(a*374761393+b*668265263+k*1442695041)|0;n=(n^(n>>>13))*1274126177;return ((n^(n>>>16))>>>0)/4294967296;};
  const hex=(h)=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const pose=(X,Y,col,v)=>{const o=(Y*W*S+X)*4;const c2=typeof col==='string'?hex(col):col;v=v||0;
    d[o]=Math.max(0,Math.min(255,c2[0]+v));d[o+1]=Math.max(0,Math.min(255,c2[1]+v));d[o+2]=Math.max(0,Math.min(255,c2[2]+v));d[o+3]=255;};
  for(let Y=0;Y<H*S;Y++)for(let X=0;X<W*S;X++)pose(X,Y,'#07080c');
  /* le carrelage biseauté : briquettes de 12 × 6 pixels fins */
  for(let X=0;X<W*S;X++){const haut=hauteurVoute(X/S)*S;
    for(let Y=haut;Y<VOUTE_BAS*S;Y++){const rang=Math.floor((Y-haut)/6), dx=(X+(rang%2?6:0))%12, dy=(Y-haut)%6;
      const nuance=Math.round((hx(Math.floor((X+(rang%2?6:0))/12),rang,3)-0.5)*10);
      let col='#e9e6db';
      if(dy===0||dx===0)col='#b8b3a3';
      else if(dy===1||dx===1)col='#fbfaf4';
      else if(dy===5||dx===11)col='#d6d2c3';
      else if(dy===2&&dx<5)col='#f4f2ea';
      pose(X,Y,col,dy&&dx?nuance:0);}}
  /* la frise émaillée */
  for(let X=0;X<W*S;X++){if(hauteurVoute(X/S)>60)continue;
    const alt=Math.floor(X/8)%2, base=alt?(AU_PORT?'#f2efe4':'#b0873a'):(AU_PORT?'#2d6fb0':'#2f5b3e');
    for(let Y=122;Y<130;Y++){const dy=Y-122, dx=X%8;pose(X,Y,dy===0||dx===0?'#8a6a2a':base,dy===1&&dx<4?26:(dy===7?-20:0));}
    pose(X,121,'#6a4a1a');pose(X,130,'#6a4a1a');}
  /* le soubassement : carreaux plus sombres */
  for(let X=0;X<W*S;X++){const h0=Math.max(hauteurVoute(X/S),84)*S;
    for(let Y=h0;Y<VOUTE_BAS*S;Y++){const dx=X%16, dy=(Y-168)%14;
      pose(X,Y,(dx===0||dy===0)?(AU_PORT?'#2a4f7a':'#4c5a4a'):(AU_PORT?'#3a6ea5':'#6f8266'),dy===1||dx===1?18:(dy===13?-14:0));}}
  /* la fosse des voies : ballast caillou par caillou */
  for(let Y=VOUTE_BAS*S;Y<(VOUTE_BAS+22)*S;Y++)for(let X=0;X<W*S;X++){const t=hx(X,Y,7);
    pose(X,Y,t<0.2?'#26272d':(t<0.4?'#1c1d22':(t<0.47?'#3a3a40':'#15161b')));}
  /* le quai : dalles de 24 × 16 pixels fins, grain et joints */
  const Q=(VOUTE_BAS+22)*S;
  for(let Y=Q;Y<H*S;Y++)for(let X=0;X<W*S;X++){const dx=X%24, dy=(Y-Q)%16, t=hx(X,Y,9);
    pose(X,Y,(dx===0||dy===0)?'#57564f':'#6b6a66',dx===1||dy===1?12:(t<0.08?-10:(t>0.95?10:0)));}
  g.putImageData(img,0,0);
  g.setTransform(S,0,0,S,0,0);
  /* la voûte s'assombrit vers le haut, son liseré */
  for(let x=0;x<W;x+=0.5){const haut=hauteurVoute(x);
    const grd=g.createLinearGradient(0,haut,0,haut+26);grd.addColorStop(0,'rgba(10,12,20,.55)');grd.addColorStop(1,'rgba(10,12,20,0)');
    g.fillStyle=grd;g.fillRect(x,haut,0.5,26);g.fillStyle='#3b3a36';g.fillRect(x,haut-0.5,0.5,0.5);}
  /* les affiches, dans leurs cadres de bois veinés */
  affiche(g,26,34,34,24,AU_PORT?'montagne':'port');
  affiche(g,132,34,34,24,'jeu');
  [[26,34],[132,34]].forEach(([x,y])=>{g.fillStyle='rgba(255,220,160,.25)';g.fillRect(x-2,y-2,38,0.5);g.fillStyle='rgba(0,0,0,.35)';g.fillRect(x-2,y+25.5,38,0.5);
    g.fillStyle='rgba(255,255,255,.12)';g.fillRect(x+2,y+1,10,0.5);});
  /* la plaque émaillée */
  const nom=ICI.nom.toUpperCase(), lw=largeur(nom)+12, px=Math.round(W/2-lw/2), py=40;
  g.fillStyle='#0f1f4a';g.fillRect(px-1,py-1,lw+2,13);
  g.fillStyle='#1d3f8f';g.fillRect(px,py,lw,11);
  g.fillStyle='#2d57b0';g.fillRect(px,py,lw,0.5);
  g.fillStyle='#e9e6db';g.fillRect(px+1,py+1,lw-2,1);g.fillRect(px+1,py+9,lw-2,1);g.fillRect(px+1,py+1,1,9);g.fillRect(px+lw-2,py+1,1,9);
  ecrire(g,nom,px+6,py+3,'#ffffff');
  g.fillStyle='rgba(255,255,255,.25)';g.fillRect(px+2,py+2,lw*0.3,0.5);                     /* l'émail qui brille */
  g.fillStyle='#7f8aa8';g.fillRect(px+3,py+5,1,1);g.fillRect(px+lw-4,py+5,1,1);g.fillStyle='#d8dee8';g.fillRect(px+3,py+5,0.5,0.5);g.fillRect(px+lw-4,py+5,0.5,0.5);
  /* les bouches du tunnel */
  [[0,1],[W,-1]].forEach(([x0,s2])=>{const grd=g.createLinearGradient(x0,0,x0+s2*38,0);
    grd.addColorStop(0,'rgba(4,5,8,.95)');grd.addColorStop(1,'rgba(4,5,8,0)');g.fillStyle=grd;g.fillRect(s2>0?0:W-38,0,38,H-26);});
  /* les traverses de bois, veinées */
  for(let x=2;x<W;x+=9){g.fillStyle='#2b2019';g.fillRect(x,VOUTE_BAS+9,5,9);g.fillStyle='#3a2c22';g.fillRect(x,VOUTE_BAS+9,5,0.5);g.fillStyle='#1c140e';g.fillRect(x+2,VOUTE_BAS+10,0.5,7);}
  /* les deux rails, qui accrochent la lumière */
  [VOUTE_BAS+8,VOUTE_BAS+16].forEach(y=>{g.fillStyle='#3a3b42';g.fillRect(0,y,W,2);g.fillStyle='#9aa0ad';g.fillRect(0,y,W,1);g.fillStyle='#d8dee8';g.fillRect(0,y,W,0.5);
    for(let x=4;x<W;x+=9){g.fillStyle='#55565e';g.fillRect(x,y+1.5,1,0.5);}});
  /* l'arête du quai, la bande jaune et ses picots */
  const Qg=VOUTE_BAS+22;
  g.fillStyle='#8f8d86';g.fillRect(0,Qg,W,1);g.fillStyle='#b8b6ae';g.fillRect(0,Qg,W,0.5);
  g.fillStyle='#d8b43a';g.fillRect(0,Qg+3,W,3);g.fillStyle='#f0d060';g.fillRect(0,Qg+3,W,0.5);
  for(let x=0.5;x<W;x+=1.5)for(let r=0;r<2;r++){g.fillStyle='#b0902a';g.fillRect(x+(r?0.75:0),Qg+3.75+r*1.25,0.5,0.5);}
  const grd=g.createLinearGradient(0,Qg,0,H);grd.addColorStop(0,'rgba(0,0,0,0)');grd.addColorStop(1,'rgba(0,0,0,.35)');
  g.fillStyle=grd;g.fillRect(0,Qg,W,H-Qg);
  FOND=c;
}
function affiche(g,x,y,w,h,sorte){
  g.fillStyle='#4a3420';g.fillRect(x-2,y-2,w+4,h+4);
  g.fillStyle='#6b4a2c';g.fillRect(x-1,y-1,w+2,h+2);
  if(sorte==='port'){
    /* LE PORT : ciel du soir, la mer, une grue et un cargo */
    for(let j=0;j<h;j++){g.fillStyle=j<12?(j<6?'#f0a860':'#f6c77e'):'#2c6e9e';g.fillRect(x,y+j,w,1);}
    g.fillStyle='#7ab3d6';for(let i=0;i<w;i+=5)g.fillRect(x+i,y+15+(i%3),2,1);
    g.fillStyle='#2a1d18';g.fillRect(x+5,y+3,2,10);g.fillRect(x+5,y+3,11,2);g.fillRect(x+14,y+5,1,4);
    g.fillStyle='#8c2f2a';g.fillRect(x+16,y+10,14,3);g.fillStyle='#e9e6db';g.fillRect(x+25,y+8,3,2);
    ecrire(g,'LE PORT',x+w/2-13,y+h-6,'#ffffff');
  }else if(sorte==='montagne'){
    /* LA MONTAGNE : ciel clair, deux sommets enneigés, un chalet */
    for(let j=0;j<h;j++){g.fillStyle=j<14?'#c8e4f4':'#f4f8fb';g.fillRect(x,y+j,w,1);}
    g.fillStyle='#6a7a8a';for(let i=0;i<12;i++){g.fillRect(x+4+i,y+14-i,24-2*i,1);}
    g.fillStyle='#ffffff';g.fillRect(x+13,y+3,4,2);g.fillRect(x+12,y+5,6,1);
    g.fillStyle='#8a5a30';g.fillRect(x+26,y+11,5,4);g.fillStyle='#f4f8fb';g.fillRect(x+25,y+10,7,1);
    ecrire(g,'MONTAGNE',x+w/2-15,y+h-6,'#1b1b1b');
  }else if(sorte==='village'){
    /* LE VILLAGE : ciel bleu, la fontaine, les toits */
    for(let j=0;j<h;j++){g.fillStyle=j<13?'#8fc3e0':'#d9c7a0';g.fillRect(x,y+j,w,1);}
    g.fillStyle='#c96a3f';g.fillRect(x+2,y+7,9,3);g.fillRect(x+23,y+6,9,3);
    g.fillStyle='#e8c9a0';g.fillRect(x+2,y+10,9,4);g.fillStyle='#f0d78a';g.fillRect(x+23,y+9,9,5);
    g.fillStyle='#9aa2a8';g.fillRect(x+13,y+9,8,5);g.fillStyle='#6fb3d6';g.fillRect(x+15,y+6,4,3);
    ecrire(g,'VILLAGE',x+w/2-13,y+h-6,'#1b1b1b');
  }else{
    /* L'AFFICHE DU JEU : deux épées croisées sur fond rouge */
    g.fillStyle='#8c2f2a';g.fillRect(x,y,w,h);
    g.fillStyle='#b8453c';g.fillRect(x,y,w,2);
    g.fillStyle='#e9e6db';
    for(let i=0;i<11;i++){g.fillRect(x+11+i,y+3+i,1,1);g.fillRect(x+22-i,y+3+i,1,1);}
    g.fillStyle='#e8c06a';g.fillRect(x+10,y+13,3,1);g.fillRect(x+21,y+13,3,1);
    ecrire(g,'BATTLE',x+w/2-11,y+h-8,'#ffffff');
  }
  /* un coin décollé */
  g.fillStyle='rgba(255,255,255,.35)';g.fillRect(x+w-3,y,3,1);g.fillRect(x+w-2,y+1,2,1);
}

/* ---------- ce qui vit : les globes, le panneau, la poussière ---------- */
const GLOBES=[40,152];          /* le panneau des rames tient le milieu */
const POUSSIERE=Array.from({length:18},(_,i)=>({x:(i*53)%W,y:20+(i*29)%70,v:0.02+(i%5)*0.01}));
function dessiner(t){
  const g=$('scene').getContext('2d');
  g.setTransform(2,0,0,2,0,0);                          /* le quai en pixel fin : on dessine au double */
  g.imageSmoothingEnabled=false;
  majRame(t);
  /* la rame qui freine fait trembler le quai */
  const tremble=(RAME.etat==='arrive'&&RAME.vitesse>.15&&Math.random()<.35)?1:0;
  g.save();g.translate(0,tremble);
  g.drawImage(FOND,0,0,W,H);
  dessinerLaRame(g,t);
  /* LES GLOBES : suspendus à la voûte, avec leur halo */
  GLOBES.forEach((x,i)=>{
    const top=hauteurVoute(x), y=top+14;
    const vacille=(i===2&&Math.sin(t/140)>0.93)?0.35:1;   /* le dernier grésille */
    g.fillStyle='#2a2a2a';g.fillRect(x,top,1,y-top-2);
    const halo=g.createRadialGradient(x+.5,y+2,1,x+.5,y+2,30);
    halo.addColorStop(0,'rgba(255,226,160,'+(.30*vacille)+')');halo.addColorStop(1,'rgba(255,226,160,0)');
    g.fillStyle=halo;g.fillRect(x-30,y-28,61,60);
    g.fillStyle='#3a3a3a';g.fillRect(x-1,y-2,3,1);
    g.fillStyle=vacille<1?'#b8a47a':'#fff4d2';g.fillRect(x-2,y-1,5,4);g.fillRect(x-1,y+3,3,1);
    g.fillStyle='#ffffff';g.fillRect(x-1,y,1,1);
  });
  /* LE PANNEAU DES PROCHAINES RAMES, accroché sous la voûte */
  const bx=W/2-27, by=hauteurVoute(W/2)+6;
  g.fillStyle='#2a2a2a';g.fillRect(bx+6,by-6,1,6);g.fillRect(bx+47,by-6,1,6);
  g.fillStyle='#111';g.fillRect(bx,by,54,11);
  g.fillStyle='#333';g.fillRect(bx,by,54,1);
  const cligne=Math.floor(t/600)%2;
  ecrire(g,LAS.nom.toUpperCase(),bx+3,by+3,'#ffb640');
  const aQuai=RAME.etat!=='absente';
  ecrire(g,aQuai?(cligne?'QUAI':''):(cligne?'2 MN':''),bx+36,by+3,'#ffb640');
  /* la poussière qui flotte dans la lumière */
  POUSSIERE.forEach(p=>{
    p.y-=p.v;p.x+=Math.sin((t/900)+p.y)*0.05;
    if(p.y<12){p.y=90;p.x=(p.x+37)%W;}
    g.fillStyle='rgba(255,240,200,.35)';g.fillRect(Math.round(p.x),Math.round(p.y),1,1);
  });
  g.restore();
  requestAnimationFrame(dessiner);
}

/* ---------- le plan de ligne ---------- */
function vignetteStation(c,k){

  const g=c.getContext('2d');g.setTransform(2,0,0,2,0,0);g.imageSmoothingEnabled=false;const W2=64,H2=36;
  const R=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(x,y,w,h);};
  if(k==='port'){for(let y=0;y<18;y++)R(0,y,W2,1,y<9?'#f6c77e':'#f0a860');R(0,18,W2,18,'#2c6e9e');for(let i=0;i<W2;i+=5)R(i+(i%3),21+(i%4)*3,2.5,.5,'#7ab3d6');
    R(0,17,W2,1.5,'#d9c7a0');R(40,5,1.5,12,'#2a1d18');R(34,5,16,1.5,'#2a1d18');R(48,6.5,.5,5,'#2a1d18');R(47,11,3,2,'#8c2f2a');
    R(8,22,18,4,'#f4ecd8');R(8,25.5,18,1,'#c0392b');R(16,12,.8,10,'#5a3a20');g.fillStyle='#fff';g.beginPath();g.moveTo(16.8,12.5);g.lineTo(24,21);g.lineTo(16.8,21);g.fill();
    R(36,24,20,4,'#8c2f2a');R(40,21,6,3,'#e9e6db');R(52,20,1,4,'#2a1d18');}
  if(k==='ferme'){R(0,0,W2,16,'#bfe3f0');R(6,3,6,.5,'#fff');R(8,2.5,4,.5,'#fff');R(0,16,W2,20,'#8fb35a');
    for(let i=0;i<6;i++){R(0,19+i*3,34,1,'#6a8a3a');for(let x=1;x<34;x+=3)R(x,18.5+i*3,.5,.5,'#c9e07a');}
    R(38,10,20,14,'#b03a2a');g.fillStyle='#7a2a1a';g.beginPath();g.moveTo(36,11);g.lineTo(48,3);g.lineTo(60,11);g.fill();R(45,16,6,8,'#f4ecd8');R(47.5,16,1,8,'#b03a2a');R(46,17.5,4,.5,'#b03a2a');R(46,20.5,4,.5,'#b03a2a');
    R(40,12.5,3,2.5,'#f4ecd8');R(53,12.5,3,2.5,'#f4ecd8');R(28,11,2,6,'#e0b850');R(27,10,4,1.5,'#c9a24a');}
  if(k==='foret'){for(let y=0;y<36;y++)R(0,y,W2,1,y<20?'#a8d4c0':'#8cbfa8');R(0,28,W2,8,'#4a6a2a');
    for(let i=0;i<9;i++){const x=i*7.5-3,h=12+(i*5)%9;[['#1f4a28',0],['#2f5b34',1],['#3d6b3a',2]].forEach(([col,o])=>{g.fillStyle=col;g.beginPath();g.moveTo(x+o*.6,30);g.lineTo(x+4.5,30-h+o*2.5);g.lineTo(x+9-o*.6,30);g.fill();});R(x+4,30,1,2,'#5a3a20');}
    R(30,31,2.5,1.5,'#c0392b');R(30.5,31,.5,.5,'#fff');R(31,32.5,.5,1.5,'#f4ecd8');R(44,32,2,1,'#e0a040');}
  if(k==='montagne'){for(let y=0;y<36;y++)R(0,y,W2,1,y<18?'#c8e4f4':'#b0d4ec');
    g.fillStyle='#5a6a7a';g.beginPath();g.moveTo(-4,36);g.lineTo(20,6);g.lineTo(44,36);g.fill();g.fillStyle='#7a8a9a';g.beginPath();g.moveTo(20,36);g.lineTo(46,10);g.lineTo(70,36);g.fill();
    g.fillStyle='#fff';g.beginPath();g.moveTo(20,6);g.lineTo(14,14);g.lineTo(17,13);g.lineTo(20,15);g.lineTo(23,13);g.lineTo(26,14);g.fill();
    g.beginPath();g.moveTo(46,10);g.lineTo(40,17);g.lineTo(44,16);g.lineTo(47,18);g.lineTo(52,17);g.fill();R(0,31,W2,5,'#f4f8fb');
    R(8,26,6,5,'#8a5a30');g.fillStyle='#fff';g.beginPath();g.moveTo(7,26.5);g.lineTo(11,23);g.lineTo(15,26.5);g.fill();R(10,28,1.5,1.5,'#ffd76a');}
}
function dessinerLePlan(){
  const joignable=(s)=>s.ouvert&&s.id!==ICI.id;
  const iA=STATIONS.findIndex(x=>x.id===ICI.id);
  $('ligneH').innerHTML=STATIONS.map((s,i)=>'<span class="st'+(s.id===ICI.id?' ici':'')+(s.ouvert||s.id===ICI.id?'':' ferme')+(choix===s.id?' choisi':'')+
    '" style="left:'+(8+i*(84/(STATIONS.length-1)))+'%"><i></i>'+s.nom.toUpperCase()+'</span>').join('');
  $('trace').innerHTML=STATIONS.map((s,i)=>{
    const ici=s.id===ICI.id, n=Math.abs(i-iA);
    const bas=ici?'Tu es ici':(s.ouvert?n+' arrêt'+(n>1?'s':''):s.sous);
    return '<button class="carteSt arret'+(ici?' ici':'')+(choix===s.id?' choisi':'')+(joignable(s)||ici?'':' ferme')+'" data-s="'+s.id+'"'+(ici?' disabled':'')+'>'+
      (!s.ouvert&&!ici?'<span class="cad">BIENTÔT</span>':'')+'<canvas width="128" height="72" data-v="'+s.id+'"></canvas>'+s.nom+'<small>'+bas+'</small></button>';
  }).join('');
  $('trace').querySelectorAll('canvas[data-v]').forEach(c=>vignetteStation(c,c.dataset.v));
  $('trace').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{

/* =====================================================================
   LA RAME : elle sort du tunnel à gauche, freine, s'arrête porte face à
   nous, les portes s'ouvrent… et on part.
   ===================================================================== */
const RAME={etat:'absente',t0:0,x0:-260,ouverture:0};
const LONG_VOITURE=92, ECART=4;
const X_ARRET=2;                       /* la rame s'arrête au BOUT du quai : on la voit en entier */
const DUREE_ARRIVEE=3400;
function appelerLaRame(){
  if(RAME.etat!=='absente')return;
  RAME.etat='annonce';RAME.t0=performance.now();
  carillon();
}
function majRame(t){
  const dt=t-RAME.t0;
  if(RAME.etat==='annonce'&&dt>1100){RAME.etat='arrive';RAME.t0=t;}
  if(RAME.etat==='arrive'){
    const p=Math.min(1,(t-RAME.t0)/DUREE_ARRIVEE);
    RAME.x0=-260+(X_ARRET+260)*(1-Math.pow(1-p,3));
    RAME.vitesse=Math.pow(1-p,2);
    if(p>=1){RAME.etat='ouvre';RAME.t0=t;RAME.vitesse=0;}
  }
  if(RAME.etat==='ouvre'){
    RAME.ouverture=Math.min(6,(t-RAME.t0)/100);
    if(t-RAME.t0>1400){RAME.etat='partie';lancerLeTrajet();}
  }
}

  /* les portes : deux battants qui glissent */

    const ov=RAME.ouverture;

function dessinerLaRame(g,t){
  if(RAME.etat==='absente')return;
  if(RAME.etat==='annonce'){
    /* les phares balaient les rails avant qu'on voie la rame */
    const f=(t-RAME.t0)/1100;
    const grd=g.createLinearGradient(0,0,70,0);
    grd.addColorStop(0,'rgba(255,240,190,'+(.45*f)+')');grd.addColorStop(1,'rgba(255,240,190,0)');
    g.fillStyle=grd;g.fillRect(0,VOUTE_BAS-6,70,26);
    return;
  }
  const y=VOUTE_BAS-26;
  voiture(g,Math.round(RAME.x0),y,t,false,true);
  g.fillStyle='#16171b';g.fillRect(Math.round(RAME.x0)+LONG_VOITURE,y+26,ECART,3);  /* l'attelage */
  voiture(g,Math.round(RAME.x0)+LONG_VOITURE+ECART,y,t,true,false);
  /* les étincelles du freinage */
  if(RAME.etat==='arrive'&&RAME.vitesse>0.05&&RAME.vitesse<0.7){
    for(let i=0;i<5;i++){
      const o=[10,22,70,82][i%4]+(i>1?LONG_VOITURE+ECART:0);
      if(Math.random()<.55){g.fillStyle=Math.random()<.5?'#ffd76a':'#fff4d2';
        g.fillRect(Math.round(RAME.x0)+o+(Math.random()*6-3)|0,y+42+(Math.random()*3|0),1,1);}
    }
  }
}
/* ---------- un carillon de quai, deux notes ---------- */
let AUDIO=null;
function carillon(){
  try{
    AUDIO=AUDIO||new (window.AudioContext||window.webkitAudioContext)();
    [[659,0],[523,0.32]].forEach(([f,d])=>{
      const o=AUDIO.createOscillator(),v=AUDIO.createGain();
      o.type='sine';o.frequency.value=f;
      v.gain.setValueAtTime(0,AUDIO.currentTime+d);
      v.gain.linearRampToValueAtTime(.18,AUDIO.currentTime+d+.02);
      v.gain.exponentialRampToValueAtTime(.001,AUDIO.currentTime+d+.9);
      o.connect(v).connect(AUDIO.destination);o.start(AUDIO.currentTime+d);o.stop(AUDIO.currentTime+d+1);
    });
  }catch(x){}
}

function pointSurLaTrace(q){
  const TRACE=VERS_MONT()?TRACE_M:TRACE_P;
  let tot=0;const seg=[];
  for(let i=0;i<TRACE.length-1;i++){const d=Math.hypot(TRACE[i+1][0]-TRACE[i][0],TRACE[i+1][1]-TRACE[i][1]);seg.push(d);tot+=d;}
  let r=q*tot;
  for(let i=0;i<seg.length;i++){
    if(r<=seg[i]||i===seg.length-1){const k=Math.min(1,r/seg[i]);
      const [x1,y1]=TRACE[i],[x2,y2]=TRACE[i+1];
      return [x1+(x2-x1)*k,y1+(y2-y1)*k,Math.atan2(y2-y1,x2-x1)];}
    r-=seg[i];
  }
}

/* L'INTÉRIEUR DE LA RAME, en pixel fin (dessiné au double) : plafond et plan lumineux, deux vitres où

  const q=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2, vit=Math.sin(Math.PI*p), sec=(t-TRAJET.t0)/1000;
  const c=$('rameInt');const D=Math.min(2,window.devicePixelRatio||1);
  if(c.width!==Math.round(c.clientWidth*D)){c.width=Math.round(c.clientWidth*D);c.height=Math.round(c.clientHeight*D);}
  const g=c.getContext('2d'),K=c.width/130,H=c.height/K;g.setTransform(K,0,0,K,0,0);g.imageSmoothingEnabled=false;
  const R=(x,y,w,h,col)=>{if(w<=0||h<=0)return;g.fillStyle=col;g.fillRect(Math.round(x*2)/2,Math.round(y*2)/2,w,h);};
  const tangue=Math.sin(sec*3.1)*.6*vit+(vit>.6&&Math.sin(sec*17)>.97?.8:0);
  g.save();g.translate(0,tangue);
  const hautV=H*0.24, basV=H*0.46, siege=H*0.49, sol=H*0.60;
  /* le plafond et ses néons (qui vacillent une fois, au milieu du trajet) */

  R(0,-2,130,hautV-10,'#c3cbcf');for(let x=6;x<130;x+=22)R(x,5,16,2.5,neon);R(0,hautV-12,130,1,'#8f9aa0');
  /* le plan lumineux de la ligne, au-dessus des portes */
  const IDS=STATIONS.map(s=>s.id),i0=IDS.indexOf(ICI.id),i1=IDS.indexOf(TRAJET.dest.id);
  R(18,hautV-24,94,10,'#1d2a44');R(22,hautV-20,86,2,'#0f8a7a');
  IDS.forEach((id,i)=>{const x=24+i*27.3;let col='#6a7a8a';if(i===i0)col='#e84a3a';
    if(i===i1)col=(Math.floor(sec*2.5)%2||p>=1)?'#ffd24a':'#3a4a5a';if(i!==i0&&i!==i1&&((i>i0&&i<i1)||(i<i0&&i>i1)))col='#8fd0b8';
    R(x-2,hautV-22,4,4,'#1d2a44');R(x-1.5,hautV-21.5,3,3,col);});

  R(0,hautV-11,130,basV-hautV+16,'#d3d9db');
  /* les deux vitres : le tunnel qui file (ou le quai, au départ et à l'arrivée) */

    R(x-2,y-2,L+4,Hv+4,'#8f9aa0');R(x,y,L,Hv,'#11151d');
    const aQuai=p<.07||p>.95;

      R(x,y+Hv*0.62,L,Hv*0.12,'#2a5aa8');R(x,y+Hv-4,L,4,'#b9b3a2');}
    else{const v=18+vit*140;
      for(let k=0;k<5;k++){const yy=y+5+k*(Hv-10)/4, lg=10+vit*28;let xx=((k*37+w*19-sec*v)%(L+lg)+(L+lg))%(L+lg)-lg;
        R(x+Math.max(0,xx),yy,Math.min(L,xx+lg)-Math.max(0,xx),.8,k%2?'#ffcf7a':'#ffe0a0');R(x+Math.max(0,xx),yy-.5,Math.min(L,xx+lg)-Math.max(0,xx),.5,'rgba(255,207,122,.35)');}
      for(let k=0;k<7;k++){let xx=((k*9-sec*v*0.6)%63+63)%63-4;R(x+Math.max(0,xx),y+Hv-5,Math.min(3,L-xx),2,'#2a2e38');}}
    R(x,y,L,1,'rgba(255,255,255,.1)');g.fillStyle='rgba(255,255,255,.1)';g.beginPath();g.moveTo(x+4,y+3);g.lineTo(x+14,y+3);g.lineTo(x+4,y+Hv*0.6);g.lineTo(x-4+4,y+Hv*0.6);g.fill();});
  /* les banquettes vertes */
  R(0,siege-3,130,3,'#8f9aa0');
  for(let x=0;x<130;x+=32){R(x+2,siege,28,sol-siege-4,'#0f8a7a');R(x+2,siege,28,2,'#3fc8b0');for(let k=0;k<5;k++)R(x+5+k*5,siege+4,2,sol-siege-10,'#0b6a5e');R(x+4,sol-4,24,4,'#0b6a5e');}
  /* les barres */
  [30,96].forEach(x=>{R(x,hautV-11,2,sol-hautV+11,'#b9c1c7');R(x+.5,hautV-11,.5,sol-hautV+11,'#fff');});
  /* le sol carrelé */
  R(0,sol,130,H-sol+4,'#5a6068');for(let y=sol;y<H+4;y+=6)for(let x=((y-sol)/6%2)*6;x<130;x+=12)R(x,y,6,6,'#50565e');
  /* deux passagers assis : toi (à gauche) et une passagère avec son panier */
  const perso=(x,y,cheveux,haut)=>{R(x,y-17,8,7,'#e8b890');R(x-1,y-19,10,3.5,cheveux);R(x+2,y-14,1,1,'#1c1c1c');R(x+5,y-14,1,1,'#1c1c1c');
    R(x-1,y-10,10,10,haut);R(x-1,y-10,10,1,'rgba(255,255,255,.2)');R(x,y,8,3,'#2a3a5a');R(x,y+3,3,7,'#2a3a5a');R(x+5,y+3,3,7,'#2a3a5a');R(x-.5,y+10,4,1.5,'#3a2616');R(x+4.5,y+10,4,1.5,'#3a2616');};
