<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Profil — Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#f8f8f8;font-family:'Inter',sans-serif;min-height:100dvh;padding-bottom:40px}

.cover{height:130px;background:linear-gradient(135deg,#cc1a1a,#0f172a);position:relative}
.cover-back{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;width:36px;height:36px;border-radius:10px;background:rgba(0,0,0,0.25);border:none;color:white;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.av-wrap{position:absolute;bottom:-36px;left:50%;transform:translateX(-50%);width:72px;height:72px;border-radius:50%;border:4px solid white;overflow:hidden;background:#dbeafe;box-shadow:0 4px 16px rgba(0,0,0,0.15)}
.av-wrap img{width:100%;height:100%;object-fit:cover}

.body{padding:44px 16px 0;text-align:center}
.username-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:4px}
.username{font-weight:900;font-size:22px;color:#0f172a;line-height:1;text-transform:uppercase}
.rank-badge{background:#fbbf24;border-radius:5px;font-family:'Bebas Neue',sans-serif;font-size:12px;color:#0f172a;padding:2px 8px}
.grade{font-size:11px;color:#9ca3af;margin-bottom:4px}
.online{font-size:10px;font-weight:700;margin-bottom:12px}

.bio-wrap{background:white;border-radius:12px;padding:12px 14px;margin-bottom:12px;border:1.5px solid #e5e7eb;text-align:left}
.bio-label{font-size:8px;font-weight:700;color:#9ca3af;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px}
.bio-text{font-size:13px;color:#374151;line-height:1.5}
.bio-empty{font-size:13px;color:#d1d5db;font-style:italic}

.xp-card{background:white;border-radius:12px;padding:12px 14px;margin-bottom:12px;border:1.5px solid #e5e7eb}
.xp-header{display:flex;justify-content:space-between;font-size:10px;font-weight:700;color:#9ca3af;margin-bottom:6px}
.xp-bar{background:#f3f4f6;border-radius:10px;height:7px;overflow:hidden}
.xp-fill{height:100%;border-radius:10px;background:linear-gradient(90deg,#cc1a1a,#fbbf24);transition:width .5s ease}

.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.stat-card{background:white;border-radius:12px;padding:14px;border:1.5px solid #e5e7eb;text-align:center}
.stat-v{font-family:'Bebas Neue',sans-serif;font-size:28px;line-height:1;color:#0f172a}
.stat-l{font-size:9px;color:#9ca3af;margin-top:3px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.section-title{font-size:9px;font-weight:700;color:#9ca3af;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;text-align:left}

.btn-chambrer{width:100%;padding:14px;border:none;border-radius:12px;background:#cc1a1a;color:white;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;cursor:pointer;margin-bottom:8px}
.btn-back{width:100%;padding:12px;border:1.5px solid #e5e7eb;border-radius:12px;background:white;color:#9ca3af;font-weight:700;font-size:13px;cursor:pointer}

.loader{text-align:center;padding:60px 20px;font-family:'Bebas Neue',sans-serif;font-size:16px;color:#9ca3af;letter-spacing:2px}

.toast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#0f172a;color:white;padding:9px 18px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:1px;z-index:300;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>

<div id="loaderEl" class="loader">CHARGEMENT...</div>

<div id="mainContent" style="display:none">
  <div class="cover">
    <button class="cover-back" onclick="history.back()">←</button>
    <div class="av-wrap"><img id="avatarImg" src="avatar-default.png" alt="avatar"></div>
  </div>

  <div class="body">
    <div class="username-row">
      <div class="username" id="usernameEl">—</div>
      <div class="rank-badge" id="rankEl">#—</div>
    </div>
    <div class="grade" id="gradeEl">—</div>
    <div class="online" id="onlineEl"></div>

    <div class="bio-wrap">
      <div class="bio-label">Bio</div>
      <div id="bioEl" class="bio-empty">Pas de bio</div>
    </div>

    <div class="xp-card">
      <div class="xp-header">
        <span id="xpLabel">0 XP</span>
        <span id="xpNext">→ Niv. 2</span>
      </div>
      <div class="xp-bar"><div class="xp-fill" id="xpFill" style="width:0%"></div></div>
    </div>

    <div class="section-title">Statistiques</div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-v" id="statLevel">—</div><div class="stat-l">Niveau</div></div>
      <div class="stat-card"><div class="stat-v" id="statMoney">—</div><div class="stat-l">Argent</div></div>
      <div class="stat-card"><div class="stat-v" id="statTrophies" style="color:#d97706">—</div><div class="stat-l">🏆 Trophées</div></div>
      <div class="stat-card"><div class="stat-v" id="statDiamonds" style="color:#7c3aed">—</div><div class="stat-l">💎 Diamants</div></div>
      <div class="stat-card"><div class="stat-v" id="statPower">—</div><div class="stat-l">⚡ Puissance</div></div>
      <div class="stat-card"><div class="stat-v" id="statStreak">—</div><div class="stat-l">🔥 Streak</div></div>
    </div>

    <button class="btn-chambrer" id="btnChambrer">💬 CHAMBRER</button>
    <button class="btn-back" onclick="history.back()">← Retour</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SB_URL='https://drtsuhnbclhmgfjiykap.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
const sb=supabase.createClient(SB_URL,SB_KEY);

function fmt(n){return n>=1000000?(n/1000000).toFixed(1)+'M€':n>=1000?Math.floor(n/1000)+'k€':n+'€';}
function xpForLevel(l){return l*500;}
function powerScore(p){return (p.level||1)*100+Math.floor((p.money||0)/10000);}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

function getOnlineStatus(lastSeen){
  if(!lastSeen) return {text:'Hors ligne',color:'#9ca3af'};
  const diff=Date.now()-new Date(lastSeen).getTime();
  const min=Math.floor(diff/60000);
  if(min<5) return {text:'🟢 En ligne',color:'#15803d'};
  if(min<60) return {text:'Il y a '+min+'min',color:'#9ca3af'};
  const h=Math.floor(min/60);
  if(h<24) return {text:'Il y a '+h+'h',color:'#9ca3af'};
  return {text:'Il y a '+(Math.floor(h/24))+'j',color:'#9ca3af'};
}

const TRASH=['T\'as vu mon rang ?','Tu dors encore ?','Viens me chercher quand tu veux 😏','Le port c\'est mon terrain','Ton niveau dit tout 🫡'];

async function init(){
  sb.auth.onAuthStateChange((e,s)=>{if(!s) window.location.href='index.html';});
  const {data:sess}=await sb.auth.getSession();
  if(!sess?.session){window.location.href='index.html';return;}
  const me=sess.session.user;

  // Récupérer l'ID depuis l'URL
  const params=new URLSearchParams(location.search);
  const targetId=params.get('id');
  if(!targetId){window.location.href='classement.html';return;}

  // Si c'est son propre profil → rediriger
  if(targetId===me.id){window.location.href='profil.html';return;}

  const [gRes,pRes,allRes]=await Promise.all([
    sb.from('game_stats').select('*').eq('user_id',targetId).maybeSingle(),
    sb.from('profiles').select('*').eq('user_id',targetId).maybeSingle(),
    sb.from('game_stats').select('user_id,level,money').order('level',{ascending:false})
  ]);
  const g=gRes.data, p=pRes.data;
  if(!g||!p){document.getElementById('loaderEl').textContent='PROFIL INTROUVABLE';return;}

  // Rang
  let rank='—';
  if(allRes.data){
    const sorted=[...allRes.data].sort((a,b)=>((b.level||0)*100+Math.floor((b.money||0)/10000))-((a.level||0)*100+Math.floor((a.money||0)/10000)));
    const idx=sorted.findIndex(x=>x.user_id===targetId);
    if(idx>=0) rank='#'+(idx+1);
  }

  // Afficher
  document.getElementById('loaderEl').style.display='none';
  document.getElementById('mainContent').style.display='block';

  if(p.avatar_url) document.getElementById('avatarImg').src=p.avatar_url;
  document.getElementById('usernameEl').textContent=(p.username||'Docker').toUpperCase();
  document.getElementById('rankEl').textContent=rank;
  document.getElementById('gradeEl').textContent=g.grade||'Docker Occasionnel';

  const status=getOnlineStatus(p.last_seen);
  const onlineEl=document.getElementById('onlineEl');
  onlineEl.textContent=status.text; onlineEl.style.color=status.color;

  // Bio
  const bioEl=document.getElementById('bioEl');
  if(p.bio){bioEl.textContent=p.bio;bioEl.className='bio-text';}

  // XP
  const xpNeeded=xpForLevel(g.level||1);
  const xpPct=Math.min(100,Math.round(((g.xp||0)/xpNeeded)*100));
  document.getElementById('xpFill').style.width=xpPct+'%';
  document.getElementById('xpLabel').textContent=(g.xp||0)+' XP';
  document.getElementById('xpNext').textContent='→ Niv. '+((g.level||1)+1);

  // Stats
  document.getElementById('statLevel').textContent=g.level||1;
  document.getElementById('statMoney').textContent=fmt(g.money||0);
  document.getElementById('statTrophies').textContent=g.trophies||0;
  document.getElementById('statDiamonds').textContent=g.diamonds||0;
  document.getElementById('statPower').textContent=powerScore(g);
  document.getElementById('statStreak').textContent=(g.streak_days||0)+'j';

  // Chambrer
  document.getElementById('btnChambrer').onclick=async function(){
    const msg=TRASH[Math.floor(Math.random()*TRASH.length)];
    await sb.from('challenges').insert({from_user_id:me.id,to_user_id:targetId,message:msg}).then(()=>{}).catch(()=>{});
    showToast('💬 Chambrage envoyé !');
  };
}
init();
</script>
</body>
</html>
