<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
body{font-family:"Inter",sans-serif;background:#fff;min-height:100vh;padding-bottom:32px}
/* STORY */
.story-section{padding:28px 20px;position:relative;overflow:hidden;background:#fff;border-bottom:1px solid #f3f4f6}
.story-bg-text{position:absolute;top:-10px;left:-4px;font-family:"Bebas Neue",sans-serif;font-size:80px;color:rgba(0,0,0,.03);letter-spacing:-2px;line-height:1;pointer-events:none;white-space:nowrap}
.story-text{font-size:15px;color:#374151;line-height:1.7;position:relative;z-index:1}
.story-text b{color:#cc1a1a;font-weight:900}
.story-since{font-size:10px;font-weight:700;color:#d1d5db;letter-spacing:2px;margin-top:10px;position:relative;z-index:1}
/* RECORDS */
.rec-section{padding:0 0 20px;background:#fff;border-bottom:1px solid #f3f4f6}
.rec-label{padding:20px 20px 4px;font-size:8px;font-weight:800;color:#d1d5db;letter-spacing:3px}
.rec-hero{padding:8px 20px 16px;display:flex;align-items:baseline;gap:10px;border-bottom:1px solid #f8f8f8}
.rec-hero-num{font-family:"Bebas Neue",sans-serif;font-size:72px;line-height:1;letter-spacing:-1px}
.rec-hero-name{font-size:12px;font-weight:800;color:#374151}
.rec-hero-sub{font-size:10px;color:#d1d5db;margin-top:2px}
.rec-row{display:flex;padding:0 20px}
.rec-mini{flex:1;padding:16px 0;border-right:1px solid #f3f4f6}
.rec-mini:last-child{border:none;padding-left:16px}
.rec-mini:not(:first-child){padding-left:16px}
.rec-mini-num{font-family:"Bebas Neue",sans-serif;font-size:32px;line-height:1}
.rec-mini-lbl{font-size:8px;font-weight:800;color:#d1d5db;letter-spacing:1.5px;margin-top:3px}
/* BADGES */
.badges-section{padding:20px 0;background:#fff;border-bottom:1px solid #f3f4f6;overflow:hidden}
.badges-label{padding:0 20px 14px;font-size:8px;font-weight:800;color:#d1d5db;letter-spacing:3px}
.badges-scroll{display:flex;gap:10px;overflow-x:auto;padding:0 20px 4px;scrollbar-width:none}
.badges-scroll::-webkit-scrollbar{display:none}
.bdg{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.bdg-ico{width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:24px}
.bdg-ico.on{background:#fff8f0;border:2px solid #fed7aa}
.bdg-ico.lock{background:#fafafa;border:2px solid #f3f4f6;filter:grayscale(1);opacity:.25}
.bdg-lbl{font-size:7px;font-weight:800;color:#d1d5db;letter-spacing:.5px;text-align:center}
.bdg-lbl.on{color:#ea580c}
/* VITRINE */
.vitrine-section{padding:20px;background:#fff;border-bottom:1px solid #f3f4f6}
.sec-lbl{font-size:8px;font-weight:800;color:#d1d5db;letter-spacing:3px;margin-bottom:14px}
.vitrine-cards{display:flex;gap:10px;align-items:center}
.vc{flex:1;aspect-ratio:.72;border-radius:12px;position:relative;overflow:hidden}
.vc-main{flex:1.15;transform:translateY(-6px);box-shadow:0 12px 28px rgba(0,0,0,.12)}
.vc-bg{position:absolute;inset:0}
.vc-content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;z-index:2}
.vc-emo{font-size:26px}.vc-main .vc-emo{font-size:32px}
.vc-name{font-family:"Bebas Neue",sans-serif;font-size:9px;color:#fff;text-align:center;letter-spacing:.5px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.vc-main .vc-name{font-size:11px}
.vc-crown{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:12px;z-index:3}
/* BIO */
.bio-section{padding:24px 20px;background:#fff;border-bottom:1px solid #f3f4f6}
.bio-text{font-size:16px;color:#111827;font-style:italic;line-height:1.5;font-weight:500}
.bio-placeholder{font-size:16px;color:#d1d5db;font-style:italic}
/* INFOS */
.info-section{padding:20px;background:#fff;border-bottom:1px solid #f3f4f6}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info-item{padding:12px;background:#fafafa;border-radius:12px}
.info-v{font-family:"Bebas Neue",sans-serif;font-size:20px;color:#111827;letter-spacing:.5px}
.info-l{font-size:8px;font-weight:800;color:#d1d5db;letter-spacing:1.5px;margin-top:2px}
/* ONLINE */
.online-badge{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:700;padding:3px 10px;border-radius:20px;margin-top:4px}
/* BTN */
.btn-back{width:100%;padding:15px;border:none;border-radius:14px;background:#cc1a1a;font-family:"Bebas Neue",sans-serif;font-size:16px;color:#fff;letter-spacing:1.5px;cursor:pointer;display:block;text-align:center}
/* SKELETON */
@keyframes skShimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.sk{background:linear-gradient(90deg,#f3f4f6 25%,#f9fafb 50%,#f3f4f6 75%);background-size:200%;animation:skShimmer 1.4s ease-in-out infinite;border-radius:6px}
/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:12px;font-size:12px;font-weight:700;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>

function getOnlineStatus(last){if(!last)return{text:'Hors ligne',bg:'rgba(0,0,0,.3)',color:'rgba(255,255,255,.3)'};var d=Date.now()-new Date(last).getTime(),m=Math.floor(d/60000);if(m<5)return{text:'🟢 En ligne',bg:'rgba(74,222,128,.15)',color:'#4ade80'};if(m<60)return{text:'Il y a '+m+'min',bg:'rgba(0,0,0,.3)',color:'rgba(255,255,255,.3)'};var h=Math.floor(m/60);if(h<24)return{text:'Il y a '+h+'h',bg:'rgba(0,0,0,.3)',color:'rgba(255,255,255,.3)'};return{text:'Il y a '+(Math.floor(h/24))+'j',bg:'rgba(0,0,0,.3)',color:'rgba(255,255,255,.3)'};}

function renderBadges(g,rec){
  var html='';
  BADGES.forEach(function(b){
    var on=b.check(g,rec);
    html+='<div class="bdg"><div class="bdg-ico '+(on?'on':'lock')+'">'+b.icon+'</div><div class="bdg-lbl '+(on?'on':'')+'">'+b.lbl+'</div></div>';
  });
  document.getElementById('bdgGrid').innerHTML=html;
}

function renderVitrine(picks,cards){
  while(picks.length<3)picks.push(null);
  var html='';
  picks.forEach(function(cid,i){
    var isMain=i===1;
    if(cid===null){
      html+='<div class="vc'+(isMain?' vc-main':'')+'">'
        +'<div class="vc-bg" style="background:#1a1a2e;border:1.5px dashed #2a2a3e"></div>'
        +'<div class="vc-content" style="opacity:.2"><div style="font-size:20px">　</div></div>'
        +'</div>';
      return;
    }
    var card=CARD_DEFS[cid];if(!card)return;
    var bg=RARITY_BG[card.rarity]||RARITY_BG.C;
    var border=RARITY_BORDER[card.rarity]||'#6b7280';
    html+='<div class="vc'+(isMain?' vc-main':'')+'">';
    if(isMain)html+='<div class="vc-crown">👑</div>';
    html+='<div class="vc-bg" style="background:'+bg+';border:1.5px solid '+border+'"></div>';
    html+='<div class="vc-content"><div class="vc-emo">'+card.emoji+'</div><div class="vc-name">'+card.name+'</div></div>';
    html+='</div>';
  });
  document.getElementById('vitrineCards').innerHTML=html;
}

(async function(){
  var {data:sess}=await sb.auth.getSession();
  if(!sess||!sess.session){location.href='index.html';return;}

  var params=new URLSearchParams(location.search);
  var targetId=params.get('id');
  if(!targetId){location.href='classement.html';return;}
  if(targetId===sess.session.user.id){location.href='profil.html';return;}

  var [gRes,pRes,allRes]=await Promise.all([
    sb.from('game_stats').select('level,xp,money,diamonds,trophies,streak_days,playtime_minutes,records,biggest_win,bourse_profit').eq('user_id',targetId).maybeSingle(),
    sb.from('profiles').select('username,avatar_url,bio,created_at,last_seen').eq('user_id',targetId).maybeSingle(),
    sb.from('game_stats').select('user_id,level,money').order('level',{ascending:false})
  ]);

  var g=gRes.data,p=pRes.data;
  if(!g||!p){document.getElementById('skeletonEl').innerHTML='<div style="padding:40px;text-align:center;color:#9ca3af;font-family:Bebas Neue,sans-serif;letter-spacing:2px">PROFIL INTROUVABLE</div>';return;}

  var rec=g.records||{};
  var lvl=g.level||1;
  var xp=g.xp||0;
  while(xp>=getXpRequired(lvl)){xp-=getXpRequired(lvl);lvl++;}
  var pct=Math.round(xp/getXpRequired(lvl)*100);

  // Rank
  var myRank=1;
  if(allRes.data){
    var sorted=allRes.data.slice().sort(function(a,b){return((b.level||0)*100+Math.floor((b.money||0)/10000))-((a.level||0)*100+Math.floor((a.money||0)/10000));});
    var idx=sorted.findIndex(function(x){return x.user_id===targetId;});
    if(idx>=0)myRank=idx+1;
  }

  // Cover
  var coverId=(rec.active_cover)||'port_nuit';
  // Replace cover SVG
  var svgWrap=document.getElementById('coverEl').parentElement;
  var newDiv=document.createElement('div');
  newDiv.innerHTML=getCoverSVG(coverId);
  var newSvg=newDiv.firstElementChild;
  newSvg.id='coverEl';
  newSvg.style.cssText='position:absolute;inset:0;width:100%;height:100%';
  newSvg.setAttribute('viewBox','0 0 390 240');
  newSvg.setAttribute('preserveAspectRatio','xMidYMid slice');
  document.getElementById('coverEl').replaceWith(newSvg);

  // Header
  document.getElementById('avatarImg').src=p.avatar_url||'avatar-default.png';
  document.getElementById('usernameEl').textContent=(p.username||'Docker').toUpperCase();
  document.getElementById('rankEl').textContent='#'+myRank+' DU PORT';
  document.getElementById('gradeEl').textContent=getGrade(lvl)+' · NV.'+lvl;
  document.getElementById('xpFill').style.width=pct+'%';
  document.getElementById('xpVal').textContent=pct+'% → NV.'+(lvl+1);
  var status=getOnlineStatus(p.last_seen);
  var oel=document.getElementById('onlineEl');
  oel.textContent=status.text;oel.style.background=status.bg;oel.style.color=status.color;

  // Story
  var months=Math.max(1,Math.floor((Date.now()-new Date(p.created_at).getTime())/2628e6));
  var clicks=rec.clicker_clicks||0;var clarkWins=rec.clark_wins||0;var bigWin=g.biggest_win||0;
  var parts=[];
  parts.push('Arrivé au port il y a <b>'+months+(months>1?' mois':' mois')+'</b>');
  if(clicks>0)parts.push('a chargé <b>'+fmShort(clicks)+' containers</b>');
  if(clarkWins>0)parts.push('remporté <b>'+clarkWins+' course'+(clarkWins>1?'s de Clarks':' de Clarks')+'</b>');
  if(bigWin>0)parts.push('raflé <b>'+fm(bigWin)+'</b> au casino');
  document.getElementById('storyBg').textContent=(p.username||'Docker').toUpperCase();
  document.getElementById('storyText').innerHTML=parts.join(', ')+'.';
  document.getElementById('storySince').textContent='DOCKER DEPUIS LE '+formatDate(p.created_at)+' · '+formatPlaytime(g.playtime_minutes)+' DE JEU';

  // Records
  document.getElementById('recHeroNum').textContent=fmShort(clicks);
  document.getElementById('recHeroName').textContent='📦 Containers cliqués';
  document.getElementById('recHeroSub').textContent='Record personnel';
  document.getElementById('recGrue').textContent=(rec.grue_best||0)+' PTS';
  document.getElementById('recClark').textContent=rec.clark_best?rec.clark_best.toFixed(1)+'S':'—';
  document.getElementById('recCasino').textContent=fmShort(bigWin)+(bigWin?'€':'—');

  // Badges
  renderBadges(g,rec);

  // Vitrine
  var picks=rec.vitrine_cards||[];
  var cards=rec.cards||{};
  renderVitrine(picks.filter(function(id){return Object.keys(cards).indexOf(String(id))!==-1;}),cards);

  // Bio
  if(p.bio){document.getElementById('bioEl').textContent=p.bio;document.getElementById('bioEl').className='bio-text';}

  // Infos
  document.getElementById('infoSince').textContent=formatDate(p.created_at);
  document.getElementById('infoPlaytime').textContent=formatPlaytime(g.playtime_minutes);
  document.getElementById('infoTrophies').textContent=(g.trophies||0)+' 🏆';
  document.getElementById('infoBourse').textContent=(g.bourse_profit>0?'+':'')+fm(g.bourse_profit||0);

  document.getElementById('skeletonEl').style.display='none';
  document.getElementById('mainContent').style.display='block';
})();
</script>
