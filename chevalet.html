<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Chevalet — Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
:root{--st:env(safe-area-inset-top,44px);--sb:env(safe-area-inset-bottom,16px)}
html,body{height:100%;overflow:hidden;background:#111;font-family:'Inter',sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%}

/* HUD */
.hud-top{position:fixed;top:calc(var(--st)+10px);left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:flex-start;padding:0 14px;pointer-events:none}
.hud-box{background:rgba(0,0,0,.65);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:8px 14px}
.timer{font-family:'Bebas Neue',sans-serif;font-size:30px;color:#fff;letter-spacing:2px;line-height:1}
.timer.urgent{color:#ef4444;animation:urg .5s infinite}
@keyframes urg{0%,100%{opacity:1}50%{opacity:.45}}
.timer-lbl{font-size:8px;color:rgba(255,255,255,.35);font-weight:700;letter-spacing:1px;margin-top:1px}
.earn-val{font-family:'Bebas Neue',sans-serif;font-size:20px;color:#fbbf24;letter-spacing:1px;line-height:1;text-align:right}
.earn-lbl{font-size:8px;color:rgba(255,255,255,.35);font-weight:700;letter-spacing:1px;margin-top:1px;text-align:right}

/* Trucks dots */
.trucks{position:fixed;top:calc(var(--st)+82px);left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:8px;align-items:center;pointer-events:none}
.tdot{width:11px;height:11px;border-radius:50%;border:2px solid rgba(255,255,255,.25);transition:all .3s}
.tdot.done{background:#22c55e;border-color:#4ade80;box-shadow:0 0 8px rgba(34,197,94,.5)}
.tdot.cur{background:#fbbf24;border-color:#fbbf24;box-shadow:0 0 10px rgba(251,191,36,.6)}
.truck-type{font-family:'Bebas Neue',sans-serif;font-size:11px;color:rgba(255,255,255,.5);letter-spacing:2px;margin-left:8px}

/* Phase label */
.phase-lbl{position:fixed;top:calc(var(--st)+100px);left:50%;transform:translateX(-50%);z-index:20;background:rgba(0,0,0,.65);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:7px 18px;font-family:'Bebas Neue',sans-serif;font-size:15px;color:#fff;letter-spacing:2px;white-space:nowrap;pointer-events:none;transition:opacity .3s}

/* Bouton action */
.action-btn{position:fixed;bottom:calc(var(--sb)+96px);left:50%;transform:translateX(-50%);z-index:20;background:linear-gradient(135deg,#fbbf24,#f59e0b);border:none;border-radius:14px;padding:14px 40px;font-family:'Bebas Neue',sans-serif;font-size:20px;color:#1a1a1a;letter-spacing:2px;cursor:pointer;box-shadow:0 8px 28px rgba(251,191,36,.45);transition:transform .1s,opacity .2s}
.action-btn:active{transform:translateX(-50%) scale(.95)}
.action-btn.hidden{opacity:0;pointer-events:none}

/* Manivelle */
.manivelle-wrap{position:fixed;bottom:calc(var(--sb)+96px);left:50%;transform:translateX(-50%);z-index:20;display:none;flex-direction:column;align-items:center;gap:6px}
#manivelleCanvas{touch-action:none}
.mani-hint{font-size:10px;color:rgba(255,255,255,.45);font-weight:700;letter-spacing:2px}

/* Progress béquille */
.bek-wrap{position:fixed;bottom:calc(var(--sb)+92px);left:15%;right:15%;z-index:20;display:none}
.bek-bar{height:10px;background:rgba(255,255,255,.08);border-radius:5px;overflow:hidden;border:1px solid rgba(255,255,255,.1)}
.bek-fill{height:100%;background:linear-gradient(90deg,#22c55e,#4ade80);border-radius:5px;transition:width .05s}
.bek-lbl{text-align:center;font-size:10px;color:rgba(255,255,255,.45);font-weight:700;letter-spacing:1px;margin-top:5px}

/* Gégé */
.comm{position:fixed;bottom:calc(var(--sb)+6px);left:12px;right:12px;z-index:20;background:rgba(0,0,0,.72);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:10px}
.comm-av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#4a90d9,#2563eb);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.comm-txt{font-size:11px;color:rgba(255,255,255,.9);font-weight:600;line-height:1.3}.comm-txt b{color:#fbbf24}

/* Flash */
.flash{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0}
.flash.show{animation:fl 1.6s ease-out forwards}
@keyframes fl{0%{opacity:0;transform:scale(.4) rotate(-5deg)}12%{opacity:1;transform:scale(1.08)}22%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.flash-txt{font-family:'Bebas Neue',sans-serif;font-size:72px;letter-spacing:2px;text-shadow:0 6px 28px rgba(0,0,0,.7);-webkit-text-stroke:2px rgba(0,0,0,.2)}

/* Écran fin */
.endcard{position:fixed;inset:0;z-index:40;background:rgba(5,8,16,.92);backdrop-filter:blur(14px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:30px}
.endcard.show{display:flex}
.end-title{font-family:'Bebas Neue',sans-serif;font-size:56px;letter-spacing:2px;text-align:center;text-shadow:0 4px 20px rgba(0,0,0,.7)}
.end-sub{font-size:14px;color:rgba(255,255,255,.75);font-weight:700;text-align:center;line-height:1.6}
.end-earn{font-family:'Bebas Neue',sans-serif;font-size:36px;color:#fbbf24;letter-spacing:2px}
.end-btn{background:linear-gradient(135deg,#fbbf24,#f59e0b);border:none;border-radius:14px;padding:15px 32px;font-family:'Bebas Neue',sans-serif;font-size:20px;color:#1a1a1a;letter-spacing:2px;cursor:pointer;box-shadow:0 8px 28px rgba(251,191,36,.4)}
.end-btn2{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:12px 24px;font-family:'Bebas Neue',sans-serif;font-size:16px;color:rgba(255,255,255,.7);letter-spacing:2px;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud-top">
  <div class="hud-box"><div class="timer" id="timer">60</div><div class="timer-lbl">SECONDES</div></div>
  <div class="hud-box"><div class="earn-val" id="earnVal">0€</div><div class="earn-lbl">GAGNÉ</div></div>
</div>
<div class="trucks" id="trucks"></div>
<div class="phase-lbl" id="phaseLbl">👋 APPROCHE-TOI</div>
<!-- Zone de tap plein écran bas -->
<div id="tapZone" onclick="onAction()" style="position:fixed;bottom:0;left:0;right:0;height:42%;z-index:15;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(var(--sb)+90px)">
  <div id="actionBtn" style="background:linear-gradient(135deg,#fbbf24,#f59e0b);border-radius:14px;padding:14px 40px;font-family:'Bebas Neue',sans-serif;font-size:20px;color:#1a1a1a;letter-spacing:2px;box-shadow:0 8px 28px rgba(251,191,36,.45);transition:transform .1s;pointer-events:none">AVANCER</div>
</div>
<div class="manivelle-wrap" id="maniWrap">
  <canvas id="manivelleCanvas" width="130" height="130" style="touch-action:none;width:130px;height:130px"></canvas>
  <div class="mani-hint">TOURNE EN CERCLE ↻</div>
</div>
<div class="bek-wrap" id="bekWrap">
  <div class="bek-bar"><div class="bek-fill" id="bekFill" style="width:0%"></div></div>
  <div class="bek-lbl" id="bekLbl">BÉQUILLE : 0%</div>
</div>
<div class="flash" id="flash"><div class="flash-txt" id="flashTxt">✓</div></div>
<div class="comm"><div class="comm-av">🧔</div><div class="comm-txt" id="comm"><b>Gégé :</b> "..."</div></div>
<div class="endcard" id="endcard">
  <div class="end-title" id="endTitle">JOURNÉE TERMINÉE !</div>
  <div class="end-earn" id="endEarn">+0€</div>
  <div class="end-sub" id="endSub">4 remorques calées</div>
  <button class="end-btn" onclick="restartGame()">REJOUER</button>
  <button class="end-btn2" onclick="location.href='travail.html'">← RETOUR</button>
</div>

<script>
const SB_URL='https://drtsuhnbclhmgfjiykap.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
const sb=supabase.createClient(SB_URL,SB_KEY);
let currentUser=null;

// ── TYPES DE REMORQUES ──
const TRUCK_TYPES=[
  {
    id:'plateau',
    name:'PLATEAU',
    emoji:'🪵',
    color:'#8B5E3C',
    colorDark:'#5a3a1a',
    colorLight:'#c4855a',
    logoText:'TRANSPORT LAVAGNE',
    logoColor:'#fbbf24',
    reward:250,
    turns:3,    // tours de manivelle requis
    desc:'Remorque plateau standard',
    comms:{
      approach:['"Allez minot, la remorque plateau attend ! Hop hop !"','"Ce plateau va nulle part sans son chevalet !"'],
      pick:['"Prends le chevalet à tes pieds fiston !"','"Le chevalet ! L\'objet en métal là !"'],
      place:['"Sous le châssis, bien centré !"','"Attention à la position, pas à l\'arrache !"'],
      crank:['"3 tours de manivelle, en cercle !"','"Tourne ! En cercle comme ta tête !"'],
      done:['"Parfait ! Plateau calé nickel !"','"C\'est ça le boulot propre fiston !"'],
    }
  },
  {
    id:'frigo',
    name:'FRIGO',
    emoji:'🧊',
    color:'#1e40af',
    colorDark:'#1e3a8a',
    colorLight:'#3b82f6',
    logoText:'SARDINES FRAÎCHES',
    logoColor:'#fff',
    reward:350,
    turns:4,
    desc:'Remorque réfrigérée — manivelle plus longue',
    comms:{
      approach:['"Frigo ! Fais gaffe aux sangles frigorifiques minot !"','"Celle-là elle transporte des sardines. Fais vite !"'],
      pick:['"Chevalet renforcé pour le frigo !"','"Prends le gros chevalet, le frigo c\'est lourd !"'],
      place:['"Bien positionné sous le châssis frigo !"','"Centre-le bien, cette bête est lourde !"'],
      crank:['"4 tours minimum pour le frigo ! C\'est lourd !"','"Plus fort ! Le frigo ça pardonne pas !"'],
      done:['"Frigo calé ! Les sardines sont sauvées !"','"Impeccable ! Même le poissonnier serait fier !"'],
    }
  },
  {
    id:'citerne',
    name:'CITERNE',
    emoji:'🛢️',
    color:'#374151',
    colorDark:'#1f2937',
    colorLight:'#6b7280',
    logoText:'GAZOLE',
    logoColor:'#ef4444',
    reward:450,
    turns:5,
    hasDual:true, // double béquille
    desc:'Citerne — double béquille !',
    comms:{
      approach:['"Citerne ! Deux béquilles, double boulot !"','"Attention fiston, citerne de gazole. Pas de cigarette !"'],
      pick:['"Deux chevalets pour la citerne !"','"Double chevalet, double salaire !"'],
      place:['"Les deux chevalets sous la citerne !"','"Attention à bien les aligner tous les deux !"'],
      crank:['"5 tours ! La citerne c\'est du sérieux !"','"Allez, force dans les bras !"'],
      done:['"CITERNE CALÉE ! +450€ dans la poche !"','"Magnifique ! Le pétrole est en sécurité !"'],
    }
  }
];

// ── ÉTAT ──
const TOTAL=4;
let trucks=[],truckIdx=0,phase='approach',earned=0,timeLeft=60,gameOver=false;
let bekPct=0,maniAngle=0,maniTurns=0,maniActive=false,maniLastAngle=null;
let camDist=0.95,walkAnim=0,currentTruck=null;

function pickTrucks(){
  trucks=[];
  for(let i=0;i<TOTAL;i++) trucks.push(TRUCK_TYPES[Math.floor(Math.random()*TRUCK_TYPES.length)]);
}
pickTrucks();

function renderDots(){
  const el=document.getElementById('trucks');
  el.innerHTML='';
  for(let i=0;i<TOTAL;i++){
    const d=document.createElement('div');
    d.className='tdot'+(i<truckIdx?' done':i===truckIdx?' cur':'');
    el.appendChild(d);
  }
  const tt=document.getElementById('truck-type-lbl')||document.createElement('span');
  tt.id='truck-type-lbl';tt.className='truck-type';
  if(trucks[truckIdx]) tt.textContent=trucks[truckIdx].emoji+' '+trucks[truckIdx].name;
  el.appendChild(tt);
}
renderDots();

// ── TIMER ──
const timerEl=document.getElementById('timer');
let timerInt=setInterval(()=>{
  if(gameOver)return;
  timeLeft--;
  timerEl.textContent=timeLeft;
  if(timeLeft<=15)timerEl.classList.add('urgent');
  if(timeLeft<=0)endGame(false);
},1000);

// ── COMMENTAIRES ──
function say(ph){
  const t=trucks[truckIdx];if(!t)return;
  const arr=(t.comms&&t.comms[ph])||['"Allez fiston !"'];
  document.getElementById('comm').innerHTML='<b>Gégé :</b> '+arr[Math.floor(Math.random()*arr.length)];
}

// ── PHASE ──
const PHASES={
  approach:{lbl:'👋 APPROCHE-TOI',btn:'AVANCER'},
  pick:{lbl:'🤲 RAMASSE LE CHEVALET',btn:'RAMASSER'},
  place:{lbl:'📦 PLACE SOUS LA REMORQUE',btn:'PLACER'},
  crank:{lbl:'🔧 TOURNE LA BÉQUILLE',btn:null},
  done:{lbl:'✅ BIEN CALÉ !',btn:'SUIVANT →'},
};
function setPhase(p){
  phase=p;
  currentTruck=trucks[truckIdx];
  const cfg=PHASES[p];
  document.getElementById('phaseLbl').textContent=cfg.lbl;
  const btn=document.getElementById('actionBtn');
  if(cfg.btn){btn.textContent=cfg.btn;document.getElementById('tapZone').style.display='flex';}
  else{document.getElementById('tapZone').style.display='none';}
  const mw=document.getElementById('maniWrap'),bw=document.getElementById('bekWrap');
  mw.style.display=p==='crank'?'flex':'none';
  bw.style.display=p==='crank'?'block':'none';
  // Transition caméra
  if(p==='approach')camDist=0.95;
  say(p);
}

function onAction(){
  if(phase==='approach') setPhase('pick');
  else if(phase==='pick') setPhase('place');
  else if(phase==='place'){setPhase('crank');resetManivelle();}
  else if(phase==='done'){
    truckIdx++;
    if(truckIdx>=TOTAL){endGame(true);return;}
    renderDots();bekPct=0;maniTurns=0;
    document.getElementById('bekFill').style.width='0%';
    document.getElementById('bekLbl').textContent='BÉQUILLE : 0%';
    setPhase('approach');
  }
}

// ── MANIVELLE ──
const MC=document.getElementById('manivelleCanvas');
const MCX=MC.getContext('2d');
function getAng(cx,cy,x,y){return Math.atan2(y-cy,x-cx);}
function resetManivelle(){maniAngle=0;maniTurns=0;maniActive=false;maniLastAngle=null;drawMani();}

MC.addEventListener('touchstart',e=>{e.preventDefault();const r=MC.getBoundingClientRect(),t=e.touches[0];maniLastAngle=getAng(65,65,t.clientX-r.left*(130/r.width),t.clientY-r.top*(130/r.height));maniActive=true;},{passive:false});
MC.addEventListener('touchmove',e=>{e.preventDefault();if(!maniActive)return;const r=MC.getBoundingClientRect(),t=e.touches[0];doTurn((t.clientX-r.left)*(130/r.width),(t.clientY-r.top)*(130/r.height));},{passive:false});
MC.addEventListener('touchend',()=>{maniActive=false;maniLastAngle=null;});
MC.addEventListener('mousedown',e=>{const r=MC.getBoundingClientRect();maniLastAngle=getAng(65,65,(e.clientX-r.left)*(130/r.width),(e.clientY-r.top)*(130/r.height));maniActive=true;});
window.addEventListener('mousemove',e=>{if(!maniActive)return;const r=MC.getBoundingClientRect();doTurn((e.clientX-r.left)*(130/r.width),(e.clientY-r.top)*(130/r.height));});
window.addEventListener('mouseup',()=>{maniActive=false;maniLastAngle=null;});

function doTurn(x,y){
  const a=getAng(80,80,x,y);
  if(maniLastAngle!==null){
    let d=a-maniLastAngle;
    if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;
    if(d>0){
      maniAngle+=d;maniTurns+=d/(Math.PI*2);
      const req=currentTruck?.turns||3;
      bekPct=Math.min(100,maniTurns/req*100);
      document.getElementById('bekFill').style.width=Math.round(bekPct)+'%';
      document.getElementById('bekLbl').textContent='BÉQUILLE : '+Math.round(bekPct)+'%';
      if(bekPct>=100&&phase==='crank'){
        const reward=currentTruck?.reward||250;
        earned+=reward;
        document.getElementById('earnVal').textContent=earned.toLocaleString('fr-FR')+'€';
        showFlash('+'+ reward+'€ 🔧','#22c55e');
        setTimeout(()=>setPhase('done'),700);
      }
    }
  }
  maniLastAngle=a;drawMani();
}

function drawMani(){
  MCX.clearRect(0,0,130,130);
  // Fond
  MCX.fillStyle='rgba(255,255,255,.05)';MCX.beginPath();MCX.arc(65,65,58,0,Math.PI*2);MCX.fill();
  MCX.strokeStyle='rgba(255,255,255,.08)';MCX.lineWidth=8;MCX.beginPath();MCX.arc(65,65,50,0,Math.PI*2);MCX.stroke();
  // Arc progression
  const col=bekPct>=100?'#fbbf24':'#22c55e';
  MCX.strokeStyle=col;MCX.lineWidth=8;MCX.lineCap='round';
  MCX.beginPath();MCX.arc(65,65,50,-Math.PI/2,-Math.PI/2+bekPct/100*Math.PI*2);MCX.stroke();
  // Bras
  const mx=65+Math.cos(maniAngle)*42,my=65+Math.sin(maniAngle)*42;
  MCX.strokeStyle='rgba(255,255,255,.85)';MCX.lineWidth=4;MCX.lineCap='round';
  MCX.beginPath();MCX.moveTo(65,65);MCX.lineTo(mx,my);MCX.stroke();
  MCX.fillStyle='#fbbf24';MCX.beginPath();MCX.arc(mx,my,8,0,Math.PI*2);MCX.fill();
  MCX.strokeStyle='rgba(0,0,0,.3)';MCX.lineWidth=2;MCX.stroke();
  MCX.fillStyle='rgba(255,255,255,.5)';MCX.beginPath();MCX.arc(65,65,5,0,Math.PI*2);MCX.fill();
}
drawMani();

// ── FLASH ──
function showFlash(t,c){
  const f=document.getElementById('flash'),ft=document.getElementById('flashTxt');
  ft.textContent=t;ft.style.color=c;f.className='flash show';
  setTimeout(()=>f.className='flash',1600);
}

// ── FIN ──
async function endGame(win){
  gameOver=true;clearInterval(timerInt);
  const done=truckIdx+(phase==='done'?1:0);
  document.getElementById('endTitle').textContent=win?'JOURNÉE TERMINÉE ! 🏆':'TEMPS ÉCOULÉ...';
  document.getElementById('endTitle').style.color=win?'#22c55e':'#ef4444';
  document.getElementById('endEarn').textContent='+'+earned.toLocaleString('fr-FR')+'€';
  document.getElementById('endSub').textContent=done+' remorque'+(done>1?'s':'')+' calée'+(done>1?'s':'');
  if(!win) document.getElementById('comm').innerHTML='<b>Gégé :</b> "Oh con... même Titouan fait mieux. Et lui il dort debout !"';
  setTimeout(()=>document.getElementById('endcard').className='endcard show',600);
  // Sauvegarder
  if(currentUser&&earned>0){
    try{
      const {data:gs}=await sb.from('game_stats').select('money,records').eq('user_id',currentUser.id).single();
      const newMoney=(gs?.money||0)+earned;
      const rec=gs?.records||{};
      const prev=rec.chevalet_best||0;
      if(earned>prev)rec.chevalet_best=earned;
      await sb.from('game_stats').update({money:newMoney,records:rec}).eq('user_id',currentUser.id);
    }catch(e){console.error(e);}
  }
}

function restartGame(){
  truckIdx=0;earned=0;timeLeft=60;gameOver=false;bekPct=0;maniTurns=0;phase='approach';camDist=0.95;walkAnim=0;
  timerEl.textContent=60;timerEl.classList.remove('urgent');
  document.getElementById('earnVal').textContent='0€';
  document.getElementById('endcard').className='endcard';
  document.getElementById('bekFill').style.width='0%';
  document.getElementById('bekLbl').textContent='BÉQUILLE : 0%';
  document.getElementById('actionBtn').classList.remove('hidden');
  pickTrucks();renderDots();setPhase('approach');
  clearInterval(timerInt);
  timerInt=setInterval(()=>{if(gameOver)return;timeLeft--;timerEl.textContent=timeLeft;if(timeLeft<=15)timerEl.classList.add('urgent');if(timeLeft<=0)endGame(false);},1000);
}

// ── RENDU 3D CANVAS ──
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H;
function resize(){W=cv.width=window.innerWidth*window.devicePixelRatio;H=cv.height=window.innerHeight*window.devicePixelRatio;ctx.scale(1,1);}
resize();window.addEventListener('resize',resize);

function loop(ts){
  const w=cv.width,h=cv.height;
  ctx.clearRect(0,0,w,h);

  // ── FOND : Ciel port ──
  const skyG=ctx.createLinearGradient(0,0,0,h*.55);
  skyG.addColorStop(0,'#87ceeb');skyG.addColorStop(.6,'#b8ddf0');skyG.addColorStop(1,'#d4ecf7');
  ctx.fillStyle=skyG;ctx.fillRect(0,0,w,h*.55);

  // Nuages
  [[.1,.12,.18],[.45,.08,.22],[.75,.14,.15]].forEach(([cx,cy,cr])=>{
    const x=w*cx,y=h*cy,r=w*cr;
    const cg=ctx.createRadialGradient(x,y,r*.1,x,y,r);cg.addColorStop(0,'rgba(255,255,255,.9)');cg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=cg;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  });

  // ── SOL ASPHALTE ──
  const groundG=ctx.createLinearGradient(0,h*.52,0,h);
  groundG.addColorStop(0,'#4a4a4a');groundG.addColorStop(.5,'#383838');groundG.addColorStop(1,'#222');
  ctx.fillStyle=groundG;ctx.fillRect(0,h*.52,w,h*.48);
  // Lignes de marquage
  ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=3;ctx.setLineDash([w*.05,w*.04]);
  ctx.beginPath();ctx.moveTo(w/2,h*.55);ctx.lineTo(w/2,h);ctx.stroke();ctx.setLineDash([]);
  // Bord du quai
  ctx.fillStyle='#fbbf24';ctx.fillRect(0,h*.52,w,h*.006);

  // ── SKYLINE PORT (arrière-plan) ──
  ctx.fillStyle='rgba(50,60,80,.6)';
  [[.02,.32,.08,.2],[.12,.3,.06,.22],[.20,.28,.05,.24],[.28,.33,.09,.18],[.38,.31,.05,.2],[.45,.29,.07,.23],[.78,.3,.06,.21],[.86,.33,.08,.19],[.93,.31,.05,.22]].forEach(([x,y,w2,h2])=>{ctx.fillRect(w*x,h*y,w*w2,h*h2);});
  // Grue
  ctx.fillStyle='rgba(40,50,70,.7)';
  ctx.fillRect(w*.65,h*.22,w*.012,h*.3);ctx.fillRect(w*.52,h*.22,w*.16,h*.012);ctx.fillRect(w*.65,h*.22,w*.008,h*.12);
  ctx.strokeStyle='rgba(40,50,70,.5)';ctx.lineWidth=w*.004;ctx.beginPath();ctx.moveTo(w*.775,h*.232);ctx.lineTo(w*.775,h*.52);ctx.stroke();

  // ── REMORQUE (FPS perspective) ──
  const t=trucks[truckIdx];if(!t)return;
  const targetDist=(phase==='approach')?0.55:0.05;
  camDist+=(targetDist-camDist)*0.055;
  if(phase==='approach') walkAnim+=0.09;

  const bob=Math.sin(walkAnim)*(phase==='approach'?h*.004:h*.001);

  ctx.save();ctx.translate(0,bob);

  const sc=1+(1-camDist)*0.6;
  const rw=w*0.88*sc,rh=h*0.42*sc;
  const rx=(w-rw)/2,ry=h*.08-(camDist*h*.04);

  // Ombre portée remorque
  const shadow=ctx.createLinearGradient(0,ry+rh*.8,0,ry+rh);shadow.addColorStop(0,'rgba(0,0,0,.35)');shadow.addColorStop(1,'transparent');
  ctx.fillStyle=shadow;ctx.fillRect(rx-w*.02,ry+rh*.78,rw+w*.04,rh*.22);

  if(t.id==='citerne'){
    // CITERNE — forme cylindrique
    const cG=ctx.createLinearGradient(rx,ry,rx+rw,ry+rh*.75);
    cG.addColorStop(0,t.colorLight);cG.addColorStop(.4,t.colorLight);cG.addColorStop(.7,t.color);cG.addColorStop(1,t.colorDark);
    ctx.fillStyle=cG;ctx.beginPath();ctx.roundRect(rx,ry+rh*.05,rw,rh*.7,rh*.35);ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.2)';ctx.lineWidth=3;ctx.stroke();
    // Anneaux
    for(let i=1;i<5;i++){ctx.strokeStyle='rgba(0,0,0,.15)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(rx+rw*(i/5),ry+rh*.05);ctx.lineTo(rx+rw*(i/5),ry+rh*.75);ctx.stroke();}
    // Logo
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(rx+rw*.25,ry+rh*.2,rw*.5,rh*.25);
    ctx.fillStyle=t.logoColor;ctx.font=`bold ${rw*.05}px Bebas Neue,Arial`;ctx.textAlign='center';
    ctx.fillText(t.logoText,w/2,ry+rh*.38);
    ctx.fillStyle=t.colorDark;ctx.fillRect(rx,ry+rh*.75,rw,rh*.04);
    // Bouchon
    ctx.fillStyle='#aaa';ctx.beginPath();ctx.arc(w/2,ry+rh*.05,rw*.04,0,Math.PI*2);ctx.fill();

  } else if(t.id==='frigo'){
    // FRIGO — blanc avec moteur
    const fG=ctx.createLinearGradient(rx,ry,rx,ry+rh*.78);
    fG.addColorStop(0,'#e8e8e8');fG.addColorStop(.2,'#ffffff');fG.addColorStop(.8,'#d0d0d0');fG.addColorStop(1,'#b0b0b0');
    ctx.fillStyle=fG;ctx.beginPath();ctx.roundRect(rx,ry,rw,rh*.78,6);ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.15)';ctx.lineWidth=3;ctx.stroke();
    // Bande bleue
    ctx.fillStyle=t.color;ctx.fillRect(rx,ry+rh*.08,rw,rh*.18);
    ctx.fillStyle=t.logoColor;ctx.font=`bold ${rw*.06}px Bebas Neue,Arial`;ctx.textAlign='center';
    ctx.fillText(t.logoText,w/2,ry+rh*.21);
    // Moteur frigo (droite)
    ctx.fillStyle='#555';ctx.fillRect(rx+rw*.82,ry+rh*.28,rw*.15,rh*.28);
    ctx.fillStyle='#333';ctx.fillRect(rx+rw*.83,ry+rh*.3,rw*.12,rh*.06);
    ctx.fillStyle='#888';ctx.fillRect(rx+rw*.83,ry+rh*.38,rw*.12,rh*.06);
    // Joints
    for(let i=0;i<3;i++){ctx.strokeStyle='rgba(0,0,0,.12)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(rx,ry+rh*(0.3+i*.15));ctx.lineTo(rx+rw*.82,ry+rh*(0.3+i*.15));ctx.stroke();}
    // Flocon
    ctx.fillStyle='rgba(59,130,246,.3)';ctx.font=`${rh*.18}px Arial`;ctx.textAlign='center';ctx.fillText('❄️',w*.3,ry+rh*.65);

  } else {
    // PLATEAU — standard
    const pG=ctx.createLinearGradient(rx,ry,rx,ry+rh*.78);
    pG.addColorStop(0,'#d4a56a');pG.addColorStop(.5,'#c4955a');pG.addColorStop(1,'#8B5E3C');
    ctx.fillStyle=pG;ctx.fillRect(rx,ry,rw,rh*.12); // plancher
    ctx.fillStyle='#8B5E3C';ctx.fillRect(rx,ry+rh*.12,rw,rh*.04); // bordure
    // Cargaison (containers)
    const cols=['#dc2626','#2563eb','#16a34a','#d97706','#7c3aed'];
    for(let i=0;i<5;i++){
      const cx=rx+rw*(.08+i*.175),cy2=ry+rh*.16,cw=rw*.16,ch2=rh*.42;
      ctx.fillStyle=cols[i];ctx.fillRect(cx,cy2,cw,ch2);
      ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=2;ctx.strokeRect(cx,cy2,cw,ch2);
      // Détails container
      ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(cx+cw*.5,cy2);ctx.lineTo(cx+cw*.5,cy2+ch2);ctx.stroke();
      ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(cx+cw*.35,cy2+ch2*.4,cw*.3,cw*.08);
    }
    // Sangles
    ctx.strokeStyle='rgba(255,200,50,.6)';ctx.lineWidth=3;ctx.setLineDash([]);
    for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(rx,ry+rh*(.25+i*.12));ctx.lineTo(rx+rw,ry+rh*(.25+i*.12));ctx.stroke();}
    // Logo bas
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(rx+rw*.3,ry+rh*.62,rw*.4,rh*.16);
    ctx.fillStyle=t.logoColor;ctx.font=`bold ${rw*.045}px Bebas Neue,Arial`;ctx.textAlign='center';
    ctx.fillText(t.logoText,w/2,ry+rh*.73);
  }

  // Châssis commun
  ctx.fillStyle='#333';ctx.fillRect(rx-w*.01,ry+rh*.76,rw+w*.02,rh*.05);
  ctx.fillStyle='#555';ctx.fillRect(rx+rw*.05,ry+rh*.76,w*.03,rh*.04);
  ctx.fillStyle='#555';ctx.fillRect(rx+rw*.92,ry+rh*.76,w*.03,rh*.04);

  // Roues (4 ou 6 selon type)
  const wheelPositions=t.id==='citerne'?[.1,.22,.5,.62,.78,.9]:[.1,.22,.72,.85];
  wheelPositions.forEach(wx=>{
    const xx=rx+rw*wx,wy2=ry+rh*.81,wr=rh*.085;
    // Pneu
    const wg=ctx.createRadialGradient(xx,wy2,wr*.1,xx,wy2,wr);wg.addColorStop(0,'#555');wg.addColorStop(1,'#1a1a1a');
    ctx.fillStyle=wg;ctx.beginPath();ctx.arc(xx,wy2,wr,0,Math.PI*2);ctx.fill();
    // Jante
    ctx.fillStyle='#888';ctx.beginPath();ctx.arc(xx,wy2,wr*.6,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#444';ctx.beginPath();ctx.arc(xx,wy2,wr*.35,0,Math.PI*2);ctx.fill();
    for(let s=0;s<5;s++){const a=s*Math.PI*.4;ctx.strokeStyle='#666';ctx.lineWidth=wr*.12;ctx.beginPath();ctx.moveTo(xx+Math.cos(a)*wr*.38,wy2+Math.sin(a)*wr*.38);ctx.lineTo(xx+Math.cos(a)*wr*.58,wy2+Math.sin(a)*wr*.58);ctx.stroke();}
  });

  // Dessous châssis (zone chevalet)
  const underX=rx+rw*.3,underY=ry+rh*.77,underW=rw*.4,underH=rh*.06;
  ctx.fillStyle='rgba(0,0,0,.8)';ctx.fillRect(underX,underY,underW,underH);
  // Zone cible si phase place
  if(phase==='place'){
    ctx.strokeStyle='rgba(251,191,36,.7)';ctx.lineWidth=3;ctx.setLineDash([8,5]);
    ctx.strokeRect(underX+underW*.1,underY+underH*.1,underW*.8,underH*.8);ctx.setLineDash([]);
    ctx.fillStyle='rgba(251,191,36,.12)';ctx.fillRect(underX+underW*.1,underY+underH*.1,underW*.8,underH*.8);
  }
  // Chevalet placé
  if(phase==='crank'||phase==='done'){
    const chW=underW*.22,chX=underX+underW*.39,chY=underY+underH*.05;
    // Corps chevalet
    ctx.fillStyle='#888';ctx.fillRect(chX,chY,chW,underH*.5);
    ctx.fillStyle='#aaa';ctx.fillRect(chX+chW*.1,chY,chW*.8,underH*.12);
    if(t.hasDual){ctx.fillStyle='#888';ctx.fillRect(underX+underW*.2,chY,chW*.8,underH*.5);ctx.fillStyle='#aaa';ctx.fillRect(underX+underW*.22,chY,chW*.6,underH*.12);}
    // Béquille (longueur selon bekPct)
    const bekLen=underH*(.4+bekPct/100*1.8);
    const bekW=underW*.04;
    ctx.fillStyle='#bbb';ctx.fillRect(chX+chW*.45,chY+underH*.5,bekW,bekLen);
    // Pied
    ctx.fillStyle='#999';ctx.fillRect(chX+chW*.2,chY+underH*.5+bekLen,chW*.6,bekW*.6);
    if(t.hasDual){const b2L=underH*(.4+bekPct/100*1.8);ctx.fillStyle='#bbb';ctx.fillRect(underX+underW*.44,chY+underH*.5,bekW,b2L);ctx.fillStyle='#999';ctx.fillRect(underX+underW*.3,chY+underH*.5+b2L,chW*.6,bekW*.6);}
  }

  // ── MAINS FPS ──
  const skinColor='#e8b882',skinDark='#c4956a',sleeveColor='#cc7722';
  if(phase==='approach'){
    const sw=Math.sin(walkAnim)*h*.06;
    ctx.save();ctx.translate(w*.15,h*.72+sw);
    ctx.fillStyle=sleeveColor;ctx.beginPath();ctx.roundRect(-w*.07,-h*.12,w*.14,h*.22,8);ctx.fill();
    ctx.fillStyle=skinColor;ctx.beginPath();ctx.arc(0,h*.1,w*.055,0,Math.PI*2);ctx.fill();
    ctx.restore();
    ctx.save();ctx.translate(w*.85,h*.72-sw);
    ctx.fillStyle=sleeveColor;ctx.beginPath();ctx.roundRect(-w*.07,-h*.12,w*.14,h*.22,8);ctx.fill();
    ctx.fillStyle=skinColor;ctx.beginPath();ctx.arc(0,h*.1,w*.055,0,Math.PI*2);ctx.fill();
    ctx.restore();
  } else if(phase==='pick'||phase==='place'){
    // Main gauche
    ctx.fillStyle=sleeveColor;ctx.beginPath();ctx.roundRect(w*.02,h*.72,w*.17,h*.24,8);ctx.fill();
    ctx.fillStyle=skinColor;ctx.beginPath();ctx.roundRect(w*.04,h*.82,w*.13,h*.12,6);ctx.fill();
    // Main droite
    ctx.fillStyle=sleeveColor;ctx.beginPath();ctx.roundRect(w*.81,h*.74,w*.17,h*.22,8);ctx.fill();
    ctx.fillStyle=skinColor;ctx.beginPath();ctx.roundRect(w*.83,h*.84,w*.13,h*.12,6);ctx.fill();
    // Chevalet dans les mains
    if(phase==='pick'){
      ctx.fillStyle='#777';ctx.fillRect(w*.12,h*.6,w*.08,h*.13);
      ctx.fillStyle='#999';ctx.fillRect(w*.08,h*.6,w*.16,w*.025);
      ctx.fillStyle='#888';ctx.fillRect(w*.115,h*.73,w*.04,h*.05);
    }
  } else if(phase==='done'){
    // Mains croisées / fières
    ctx.fillStyle=sleeveColor;ctx.beginPath();ctx.roundRect(w*.05,h*.78,w*.14,h*.18,8);ctx.fill();
    ctx.fillStyle=skinColor;ctx.beginPath();ctx.arc(w*.12,h*.93,w*.04,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=sleeveColor;ctx.beginPath();ctx.roundRect(w*.81,h*.78,w*.14,h*.18,8);ctx.fill();
    ctx.fillStyle=skinColor;ctx.beginPath();ctx.arc(w*.88,h*.93,w*.04,0,Math.PI*2);ctx.fill();
    // Pouce levé
    ctx.fillStyle=skinColor;ctx.beginPath();ctx.arc(w*.12,h*.78,w*.035,0,Math.PI*2);ctx.fill();
  }

  ctx.restore();

  // Vignette
  const vig=ctx.createRadialGradient(w/2,h/2,h*.2,w/2,h/2,h*.8);vig.addColorStop(0,'transparent');vig.addColorStop(1,'rgba(0,0,0,.45)');
  ctx.fillStyle=vig;ctx.fillRect(0,0,w,h);

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ── INIT ──
async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){location.href='index.html';return;}
  currentUser=session.user;
  say('approach');
  document.getElementById('comm').innerHTML='<b>Gégé :</b> "'+trucks[0].emoji+' '+trucks[0].name+' en premier ! Allez fiston, avance !"';
}
init();

document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});
</script>
