<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Chevalet — Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
:root{--st:env(safe-area-inset-top,44px);--sb:env(safe-area-inset-bottom,16px)}
html,body{height:100%;overflow:hidden;background:#1a1a2e;font-family:'Inter',sans-serif;touch-action:none}

/* HEADER */
.hdr{position:fixed;top:0;left:0;right:0;z-index:30;background:linear-gradient(160deg,#cc1a1a,#7a0e0e);padding:calc(var(--st)+10px) 16px 12px;display:flex;align-items:center;justify-content:space-between}
.hdr-back{background:rgba(0,0,0,.25);border:none;border-radius:10px;width:36px;height:36px;color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.hdr-title{font-family:'Bebas Neue',sans-serif;font-size:20px;color:#fff;letter-spacing:2px}
.hdr-earn{text-align:right}
.hdr-earn-val{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#fbbf24;letter-spacing:1px;line-height:1}
.hdr-earn-lbl{font-size:8px;color:rgba(255,255,255,.4);font-weight:700;letter-spacing:1px}

/* SCENE 3D */
canvas{position:fixed;left:0;right:0;z-index:1}

/* TRUCKS DOTS */
.dots{position:fixed;z-index:20;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.25);transition:all .3s}
.dot.done{background:#22c55e;border-color:#4ade80;box-shadow:0 0 8px rgba(34,197,94,.5)}
.dot.cur{background:#fbbf24;border-color:#fbbf24;box-shadow:0 0 10px rgba(251,191,36,.6);animation:dotPulse 1s infinite}
@keyframes dotPulse{0%,100%{box-shadow:0 0 8px rgba(251,191,36,.6)}50%{box-shadow:0 0 16px rgba(251,191,36,.9)}}
.truck-badge{font-family:'Bebas Neue',sans-serif;font-size:11px;color:rgba(255,255,255,.5);letter-spacing:2px;margin-left:6px}

/* MANIVELLE ZONE */
.mani-zone{position:fixed;z-index:20;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px}
.mani-title{font-family:'Bebas Neue',sans-serif;font-size:14px;color:rgba(255,255,255,.6);letter-spacing:3px}
#maniCanvas{touch-action:none;cursor:grab}
#maniCanvas:active{cursor:grabbing}

/* BARRE BÉQUILLE */
.bek-zone{position:fixed;z-index:20;left:12%;right:12%}
.bek-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.bek-label{font-family:'Bebas Neue',sans-serif;font-size:14px;color:#fff;letter-spacing:2px}
.bek-pct{font-family:'Bebas Neue',sans-serif;font-size:20px;color:#fbbf24;letter-spacing:1px}
.bek-track{height:14px;background:rgba(255,255,255,.08);border-radius:7px;overflow:hidden;border:1px solid rgba(255,255,255,.1)}
.bek-fill{height:100%;border-radius:7px;background:linear-gradient(90deg,#22c55e,#4ade80);transition:width .05s;position:relative}
.bek-fill::after{content:'';position:absolute;right:0;top:0;bottom:0;width:4px;background:rgba(255,255,255,.5);border-radius:0 7px 7px 0}

/* REWARD FLASH */
.reward-flash{position:fixed;inset:0;z-index:35;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0}
.reward-flash.show{animation:rf 1.4s ease-out forwards}
@keyframes rf{0%{opacity:0;transform:scale(.4)}12%{opacity:1;transform:scale(1.1)}22%{transform:scale(1)}75%{opacity:1}100%{opacity:0}}
.reward-txt{font-family:'Bebas Neue',sans-serif;font-size:80px;letter-spacing:2px;text-shadow:0 6px 30px rgba(0,0,0,.7);-webkit-text-stroke:2px rgba(0,0,0,.2)}

/* GÉGÉ */
.gegé{position:fixed;z-index:20;left:12px;right:12px;background:rgba(0,0,0,.72);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:9px 13px;display:flex;align-items:center;gap:9px}
.gege-av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#4a90d9,#2563eb);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.gege-txt{font-size:11px;color:rgba(255,255,255,.9);font-weight:600;line-height:1.35}.gege-txt b{color:#fbbf24}

/* TIMER */
.timer-wrap{position:fixed;z-index:20;right:16px}
.timer-val{font-family:'Bebas Neue',sans-serif;font-size:42px;color:#fff;line-height:1;text-align:right}
.timer-val.urgent{color:#ef4444;animation:urg .5s infinite}
@keyframes urg{0%,100%{opacity:1}50%{opacity:.4}}
.timer-lbl{font-size:8px;color:rgba(255,255,255,.35);font-weight:700;letter-spacing:1px;text-align:right}

/* END CARD */
.endcard{position:fixed;inset:0;z-index:50;background:rgba(5,8,16,.93);backdrop-filter:blur(16px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px}
.endcard.show{display:flex}
.end-ico{font-size:56px}
.end-title{font-family:'Bebas Neue',sans-serif;font-size:52px;letter-spacing:2px;text-align:center}
.end-earn{font-family:'Bebas Neue',sans-serif;font-size:40px;color:#fbbf24;letter-spacing:2px}
.end-sub{font-size:13px;color:rgba(255,255,255,.65);font-weight:700;text-align:center;line-height:1.6}
.end-btn{background:linear-gradient(135deg,#fbbf24,#f59e0b);border:none;border-radius:14px;padding:14px 32px;font-family:'Bebas Neue',sans-serif;font-size:20px;color:#1a1a1a;letter-spacing:2px;cursor:pointer;box-shadow:0 8px 28px rgba(251,191,36,.4);width:100%;max-width:280px}
.end-btn2{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:11px 24px;font-family:'Bebas Neue',sans-serif;font-size:15px;color:rgba(255,255,255,.65);letter-spacing:2px;cursor:pointer;width:100%;max-width:280px}
</style>
</head>
<body>

<div class="hdr">
  <button class="hdr-back" onclick="location.href='travail.html'">←</button>
  <div class="hdr-title">🔧 CHEVALET</div>
  <div class="hdr-earn">
    <div class="hdr-earn-val" id="earnVal">0€</div>
    <div class="hdr-earn-lbl">GAGNÉ</div>
  </div>
</div>

<canvas id="sceneCanvas"></canvas>

<div class="dots" id="dots" style="top:0"></div>

<div class="timer-wrap" id="timerWrap">
  <div class="timer-val" id="timerVal">60</div>
  <div class="timer-lbl">SEC</div>
</div>

<div class="mani-zone" id="maniZone">
  <div class="mani-title">↻ TOURNE LA BÉQUILLE</div>
  <canvas id="maniCanvas" width="180" height="180" style="width:180px;height:180px"></canvas>
</div>

<div class="bek-zone" id="bekZone">
  <div class="bek-header">
    <div class="bek-label" id="bekLabel">BÉQUILLE</div>
    <div class="bek-pct" id="bekPct">0%</div>
  </div>
  <div class="bek-track"><div class="bek-fill" id="bekFill" style="width:0%"></div></div>
</div>

<div class="gegé" id="gege">
  <div class="gege-av">🧔</div>
  <div class="gege-txt" id="gegeTxt"><b>Gégé :</b> "Tourne la béquille en cercle fiston !"</div>
</div>

<div class="reward-flash" id="rewardFlash"><div class="reward-txt" id="rewardTxt">+250€</div></div>

<div class="endcard" id="endcard">
  <div class="end-ico" id="endIco">🏆</div>
  <div class="end-title" id="endTitle" style="color:#22c55e">JOURNÉE TERMINÉE !</div>
  <div class="end-earn" id="endEarn">+0€</div>
  <div class="end-sub" id="endSub">4 remorques calées</div>
  <button class="end-btn" onclick="restart()">REJOUER</button>
  <button class="end-btn2" onclick="location.href='travail.html'">← RETOUR</button>
</div>

<script>
const SB_URL='https://drtsuhnbclhmgfjiykap.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
const sb=supabase.createClient(SB_URL,SB_KEY);
let me=null;

// ── TYPES ──
const TYPES=[
  {id:'plateau',emoji:'🪵',name:'PLATEAU',reward:250,turns:3,color:'#c4955a',colorB:'#8B5E3C',gege:[
    '"Plateau standard, 3 tours et c\'est bon !"','"Allez, plateau calé vite fait !"'
  ]},
  {id:'frigo',emoji:'🧊',name:'FRIGO',reward:350,turns:4,color:'#3b82f6',colorB:'#1e40af',gege:[
    '"Frigo ! 4 tours minimum, c\'est lourd !"','"Les sardines attendent pas fiston !"'
  ]},
  {id:'citerne',emoji:'🛢️',name:'CITERNE',reward:450,turns:5,color:'#6b7280',colorB:'#374151',gege:[
    '"CITERNE ! 5 tours et fais gaffe au gazole !"','"Celle-là elle est pleine, force dans les bras !"'
  ]},
];

// ── ÉTAT ──
const TOTAL=4;
let trucks=[],truckIdx=0,earned=0,timeLeft=60,gameOver=false;
let bekPct=0,maniAngle=0,maniTurns=0,maniActive=false,maniLast=null;

function pickTrucks(){trucks=[];for(let i=0;i<TOTAL;i++)trucks.push(TYPES[Math.floor(Math.random()*TYPES.length)]);}
pickTrucks();

// ── LAYOUT ──
let W=0,H=0,HDR_H=0,GEGE_H=0;
function measure(){
  W=window.innerWidth;H=window.innerHeight;
  const hdr=document.querySelector('.hdr');
  HDR_H=hdr?hdr.getBoundingClientRect().bottom:90;
  GEGE_H=60;
  const sb2=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sb'))||16;
  const gegeEl=document.getElementById('gege');
  if(gegeEl){gegeEl.style.bottom=(sb2+6)+'px';}
  const gegeTop=H-(sb2+6+GEGE_H+10);
  // Zone disponible entre header et gégé
  const available=gegeTop-HDR_H;
  const dotTop=HDR_H+8;
  document.getElementById('dots').style.top=dotTop+'px';
  // Timer en haut à droite sous hdr
  const tw=document.getElementById('timerWrap');
  if(tw)tw.style.top=(HDR_H+8)+'px';
  // Scène canvas
  const sc=document.getElementById('sceneCanvas');
  if(sc){sc.style.top=HDR_H+'px';sc.width=W*devicePixelRatio;sc.height=(gegeTop-HDR_H)*devicePixelRatio;sc.style.height=(gegeTop-HDR_H)+'px';}
  // Zone manivelle + barre centrée dans la scène
  const sceneH=gegeTop-HDR_H;
  const maniSize=Math.min(180,sceneH*.38);
  // Manivelle EN BAS juste au-dessus de Gégé
  const sb3=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sb'))||16;
  const gegeBottom=sb3+6+52; // hauteur gégé
  const maniBottom=gegeBottom+10;
  const mz=document.getElementById('maniZone');
  if(mz){mz.style.top='';mz.style.bottom=maniBottom+'px';}
  const mc=document.getElementById('maniCanvas');
  if(mc){mc.style.width=maniSize+'px';mc.style.height=maniSize+'px';}
  // Barre de béquille au-dessus de la manivelle
  const bekBottom=maniBottom+maniSize+36;
  const bz=document.getElementById('bekZone');
  if(bz){bz.style.top='';bz.style.bottom=bekBottom+'px';}
}
measure();window.addEventListener('resize',()=>{measure();drawScene();});

// ── DOTS ──
function renderDots(){
  const el=document.getElementById('dots');
  el.innerHTML='';
  trucks.forEach((t,i)=>{
    const d=document.createElement('div');
    d.className='dot'+(i<truckIdx?' done':i===truckIdx?' cur':'');
    el.appendChild(d);
  });
  const badge=document.createElement('span');
  badge.className='truck-badge';
  badge.textContent=trucks[truckIdx]?trucks[truckIdx].emoji+' '+trucks[truckIdx].name:'';
  el.appendChild(badge);
}
renderDots();

// ── TIMER ──
const timerEl=document.getElementById('timerVal');
let timerInt=setInterval(()=>{
  if(gameOver)return;
  timeLeft--;timerEl.textContent=timeLeft;
  if(timeLeft<=15)timerEl.classList.add('urgent');
  if(timeLeft<=0)endGame(false);
},1000);

// ── GÉGÉ ──
function say(txt){document.getElementById('gegeTxt').innerHTML='<b>Gégé :</b> '+txt;}
function sayTruck(){const t=trucks[truckIdx];if(!t)return;say(t.gege[Math.floor(Math.random()*t.gege.length)]);}
sayTruck();

// ── SCÈNE 3D ──
const SC=document.getElementById('sceneCanvas');
const SCX=SC.getContext('2d');
function drawScene(){
  const w=SC.width,h=SC.height;
  const dpr=devicePixelRatio;
  SCX.clearRect(0,0,w,h);
  const t=trucks[truckIdx];if(!t)return;

  // Ciel
  const sky=SCX.createLinearGradient(0,0,0,h*.55);sky.addColorStop(0,'#87ceeb');sky.addColorStop(1,'#c8e6f5');
  SCX.fillStyle=sky;SCX.fillRect(0,0,w,h*.55);
  // Sol
  const gnd=SCX.createLinearGradient(0,h*.52,0,h);gnd.addColorStop(0,'#444');gnd.addColorStop(1,'#1a1a1a');
  SCX.fillStyle=gnd;SCX.fillRect(0,h*.52,w,h*.48);
  SCX.fillStyle='rgba(251,191,36,.4)';SCX.fillRect(0,h*.52,w,h*.005);

  // Silhouettes
  SCX.fillStyle='rgba(40,50,70,.5)';
  [[0,.35,.07,.17],[.08,.32,.05,.20],[.85,.34,.08,.18],[.93,.31,.06,.21]].forEach(([x,y,ww,hh])=>{SCX.fillRect(w*x,h*y,w*ww,h*hh);});

  // Remorque
  const rw=w*.82,rh=h*.44,rx=(w-rw)/2,ry=h*.04;
  // Corps
  const rg=SCX.createLinearGradient(rx,ry,rx,ry+rh*.78);
  rg.addColorStop(0,t.color);rg.addColorStop(.5,t.color);rg.addColorStop(1,t.colorB);
  SCX.fillStyle=rg;SCX.beginPath();SCX.roundRect(rx,ry,rw,rh*.78,6*dpr);SCX.fill();
  SCX.strokeStyle='rgba(0,0,0,.2)';SCX.lineWidth=2*dpr;SCX.stroke();
  // Logo
  SCX.fillStyle='rgba(0,0,0,.5)';SCX.fillRect(rx+rw*.2,ry+rh*.25,rw*.6,rh*.22);
  SCX.fillStyle='#fff';SCX.font=`bold ${rw*.055}px Bebas Neue,Arial`;SCX.textAlign='center';SCX.textBaseline='middle';
  SCX.fillText('TRANSPORT LAVAGNE & CIE',w/2,ry+rh*.36);
  // Châssis
  SCX.fillStyle='#333';SCX.fillRect(rx-w*.01,ry+rh*.78,rw+w*.02,rh*.04);
  // Roues
  [.12,.24,.68,.81].forEach(wx=>{
    const xx=rx+rw*wx,wy=ry+rh*.82,wr=rh*.085;
    SCX.fillStyle='#111';SCX.beginPath();SCX.arc(xx,wy,wr,0,Math.PI*2);SCX.fill();
    SCX.fillStyle='#666';SCX.beginPath();SCX.arc(xx,wy,wr*.55,0,Math.PI*2);SCX.fill();
    SCX.fillStyle='#333';SCX.beginPath();SCX.arc(xx,wy,wr*.28,0,Math.PI*2);SCX.fill();
  });
  // Dessous / béquille
  const bx=rx+rw*.38,by=ry+rh*.78,bw=rw*.24,bh=rh*.04;
  SCX.fillStyle='rgba(0,0,0,.75)';SCX.fillRect(bx,by,bw,bh);
  // Corps chevalet
  SCX.fillStyle='#888';SCX.fillRect(bx+bw*.15,by-rh*.04,bw*.7,rh*.06);
  SCX.fillStyle='#999';SCX.fillRect(bx+bw*.2,by-rh*.08,bw*.6,rh*.04);
  // Béquille qui descend
  const bekLen=rh*.05+bekPct/100*rh*.16;
  SCX.fillStyle='#bbb';SCX.fillRect(bx+bw*.44,by,bw*.12,bekLen);
  // Pied
  if(bekPct>5){SCX.fillStyle='#999';SCX.fillRect(bx+bw*.3,by+bekLen,bw*.4,rh*.02);}
  SCX.textBaseline='alphabetic';
}

// ── MANIVELLE ──
const MC=document.getElementById('maniCanvas');
const MCX=MC.getContext('2d');
function getAng(cx,cy,x,y){return Math.atan2(y-cy,x-cx);}
function getRelPos(e,el){
  const r=el.getBoundingClientRect();
  const scaleX=MC.width/r.width,scaleY=MC.height/r.height;
  const src=e.touches?e.touches[0]:e;
  return{x:(src.clientX-r.left)*scaleX,y:(src.clientY-r.top)*scaleY};
}
const CX=90,CY=90,RAD=72;
MC.addEventListener('touchstart',e=>{e.preventDefault();const p=getRelPos(e,MC);maniLast=getAng(CX,CY,p.x,p.y);maniActive=true;},{passive:false});
MC.addEventListener('touchmove',e=>{e.preventDefault();if(!maniActive)return;const p=getRelPos(e,MC);doTurn(p.x,p.y);},{passive:false});
MC.addEventListener('touchend',()=>{maniActive=false;maniLast=null;});
MC.addEventListener('mousedown',e=>{const p=getRelPos(e,MC);maniLast=getAng(CX,CY,p.x,p.y);maniActive=true;});
window.addEventListener('mousemove',e=>{if(!maniActive)return;const p=getRelPos(e,MC);doTurn(p.x,p.y);});
window.addEventListener('mouseup',()=>{maniActive=false;maniLast=null;});

function doTurn(x,y){
  const a=getAng(CX,CY,x,y);
  if(maniLast!==null){
    let d=a-maniLast;
    if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;
    if(d>0.01){
      maniAngle+=d;maniTurns+=d/(Math.PI*2);
      const req=trucks[truckIdx]?.turns||3;
      bekPct=Math.min(100,maniTurns/req*100);
      document.getElementById('bekFill').style.width=Math.round(bekPct)+'%';
      document.getElementById('bekPct').textContent=Math.round(bekPct)+'%';
      if(bekPct>=100)onBekDone();
    }
  }
  maniLast=a;drawMani();
}

let bekDoneLock=false;
function onBekDone(){
  if(bekDoneLock)return;bekDoneLock=true;
  const t=trucks[truckIdx];
  earned+=t.reward;
  document.getElementById('earnVal').textContent=earned.toLocaleString('fr-FR')+'€';
  // Flash
  const rf=document.getElementById('rewardFlash'),rt=document.getElementById('rewardTxt');
  rt.textContent='+'+t.reward+'€ '+t.emoji;rt.style.color='#22c55e';
  rf.className='reward-flash show';setTimeout(()=>rf.className='reward-flash',1400);
  // Gégé content
  const doneComms=['"PARFAIT ! Béquille calée nickel !"','"C\'est ça le boulot propre fiston !"','"Même Lavagne pourrait pas faire mieux !"'];
  say(doneComms[Math.floor(Math.random()*doneComms.length)]);
  setTimeout(()=>{
    truckIdx++;
    if(truckIdx>=TOTAL){endGame(true);return;}
    bekPct=0;maniTurns=0;maniAngle=0;bekDoneLock=false;
    document.getElementById('bekFill').style.width='0%';
    document.getElementById('bekPct').textContent='0%';
    renderDots();sayTruck();drawMani();
  },900);
}

function drawMani(){
  MCX.clearRect(0,0,180,180);
  // Fond
  MCX.fillStyle='rgba(255,255,255,.05)';MCX.beginPath();MCX.arc(CX,CY,RAD+8,0,Math.PI*2);MCX.fill();
  // Piste
  MCX.strokeStyle='rgba(255,255,255,.08)';MCX.lineWidth=10;MCX.beginPath();MCX.arc(CX,CY,RAD,0,Math.PI*2);MCX.stroke();
  // Arc progression
  const col=bekPct>=100?'#fbbf24':'#22c55e';
  MCX.strokeStyle=col;MCX.lineWidth=10;MCX.lineCap='round';
  MCX.beginPath();MCX.arc(CX,CY,RAD,-Math.PI/2,-Math.PI/2+bekPct/100*Math.PI*2);MCX.stroke();
  // Bras
  const bx=CX+Math.cos(maniAngle)*RAD*.72,by=CY+Math.sin(maniAngle)*RAD*.72;
  MCX.strokeStyle='rgba(255,255,255,.9)';MCX.lineWidth=5;MCX.lineCap='round';
  MCX.beginPath();MCX.moveTo(CX,CY);MCX.lineTo(bx,by);MCX.stroke();
  // Poignée
  MCX.fillStyle=col;MCX.beginPath();MCX.arc(bx,by,11,0,Math.PI*2);MCX.fill();
  MCX.strokeStyle='rgba(0,0,0,.25)';MCX.lineWidth=2;MCX.stroke();
  // Centre
  MCX.fillStyle='rgba(255,255,255,.4)';MCX.beginPath();MCX.arc(CX,CY,5,0,Math.PI*2);MCX.fill();
  // Flèche directionnelle
  if(bekPct<100){
    MCX.fillStyle='rgba(255,255,255,.2)';MCX.font='bold 11px Inter';MCX.textAlign='center';MCX.textBaseline='middle';MCX.fillText('↻',CX,CY);
  } else {
    MCX.fillStyle='#fbbf24';MCX.font='bold 16px Arial';MCX.textAlign='center';MCX.textBaseline='middle';MCX.fillText('✓',CX,CY);
  }
}
drawMani();

// ── FLASH ──
function showFlash(t,c){
  const f=document.getElementById('rewardFlash'),ft=document.getElementById('rewardTxt');
  ft.textContent=t;ft.style.color=c;f.className='reward-flash show';setTimeout(()=>f.className='reward-flash',1400);
}

// ── FIN ──
async function endGame(win){
  gameOver=true;clearInterval(timerInt);
  const done=truckIdx;
  document.getElementById('endIco').textContent=win?'🏆':'⏱️';
  document.getElementById('endTitle').textContent=win?'JOURNÉE TERMINÉE !':'TEMPS ÉCOULÉ...';
  document.getElementById('endTitle').style.color=win?'#22c55e':'#ef4444';
  document.getElementById('endEarn').textContent='+'+earned.toLocaleString('fr-FR')+'€';
  document.getElementById('endSub').textContent=done+' remorque'+(done>1?'s':'')+' calée'+(done>1?'s':'');
  say(win?'"Impeccable fiston ! Même Titouan aurait mis 3 heures."':'"Temps écoulé... t\'as même pas fini. Titouan fait mieux."');
  setTimeout(()=>document.getElementById('endcard').className='endcard show',700);
  if(me&&earned>0){
    try{
      const {data:gs}=await sb.from('game_stats').select('money,records').eq('user_id',me.id).single();
      const newMoney=(gs?.money||0)+earned;
      const rec=gs?.records||{};
      if(earned>(rec.chevalet_best||0))rec.chevalet_best=earned;
      await sb.from('game_stats').update({money:newMoney,records:rec}).eq('user_id',me.id);
    }catch(e){console.error(e);}
  }
}

function restart(){
  truckIdx=0;earned=0;timeLeft=60;gameOver=false;bekPct=0;maniTurns=0;maniAngle=0;bekDoneLock=false;
  timerEl.textContent=60;timerEl.classList.remove('urgent');
  document.getElementById('earnVal').textContent='0€';
  document.getElementById('endcard').className='endcard';
  document.getElementById('bekFill').style.width='0%';
  document.getElementById('bekPct').textContent='0%';
  pickTrucks();renderDots();sayTruck();drawMani();
  clearInterval(timerInt);
  timerInt=setInterval(()=>{if(gameOver)return;timeLeft--;timerEl.textContent=timeLeft;if(timeLeft<=15)timerEl.classList.add('urgent');if(timeLeft<=0)endGame(false);},1000);
}

// ── BOUCLE SCÈNE ──
function loop(){drawScene();requestAnimationFrame(loop);}
requestAnimationFrame(loop);

// ── INIT ──
async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){location.href='index.html';return;}
  me=session.user;
  measure();
}
init();
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});
</script>
