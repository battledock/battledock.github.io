<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Roulette — Battle Dock Casino</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{height:100%;height:100dvh;overflow:hidden;font-family:'Inter',sans-serif}
body{
  background:radial-gradient(ellipse at top,#1e3a5f,#0c1e33 60%,#000d1a);
  display:flex;flex-direction:column;
}

/* ══ HEADER ══ */
.hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top,44px) + 10px) 16px 10px;
  flex-shrink:0;
}
.btn-back{
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
  border-radius:20px;padding:7px 14px;
  font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;color:#fff;
  cursor:pointer;
}
.hdr-title{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#fbbf24;letter-spacing:3px}
.hdr-balance{
  background:rgba(0,0,0,.3);border:1px solid rgba(251,191,36,.3);
  border-radius:20px;padding:7px 14px;
  font-family:'Bebas Neue',sans-serif;font-size:15px;color:#fbbf24;
}

/* ══ CONTENU ══ */
.game-wrap{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0 16px;gap:14px;min-height:0;
}

/* ══ TABLE ══ */
.table{
  background:linear-gradient(180deg,#1a0a00,#0f0500);
  border:4px solid #fbbf24;border-radius:24px;
  width:100%;max-width:400px;
  padding:20px 16px;
  box-shadow:0 0 40px rgba(251,191,36,.15),inset 0 0 20px rgba(0,0,0,.5);
  display:flex;flex-direction:column;align-items:center;gap:16px;
}

/* Roue */
.wheel-wrap{position:relative;display:flex;align-items:center;justify-content:center}
.wheel-wrap svg{
  width:min(200px,55vw);height:min(200px,55vw);
  filter:drop-shadow(0 0 20px rgba(251,191,36,.2));
  cursor:pointer;
}

/* Paris */
.bets{display:flex;gap:8px;width:100%}
.bet-btn{
  flex:1;padding:12px 6px;
  border:2.5px solid rgba(0,0,0,.4);border-radius:14px;
  font-family:'Bebas Neue',sans-serif;font-size:16px;color:#fff;
  text-align:center;cursor:pointer;
  transition:all .15s;
  box-shadow:0 4px 12px rgba(0,0,0,.3);
}
.bet-btn:active{transform:scale(.96)}
.bet-btn.sel{outline:3px solid #fbbf24;outline-offset:2px;transform:scale(1.03)}
.bet-btn.red{background:linear-gradient(135deg,#cc1a1a,#991111)}
.bet-btn.green{background:linear-gradient(135deg,#047857,#035740)}
.bet-btn.black{background:linear-gradient(135deg,#1f2937,#111827)}
.bet-sub{font-size:9px;color:rgba(255,255,255,.5);font-family:'Inter',sans-serif;margin-top:3px;font-weight:700;letter-spacing:.5px}

/* Résultat */
.result{
  display:none;padding:12px 16px;border-radius:14px;
  text-align:center;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;
  animation:resultPop .3s cubic-bezier(.34,1.56,.64,1);
  width:100%;max-width:400px;
}
@keyframes resultPop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
.result.win{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;box-shadow:0 4px 16px rgba(22,163,74,.4)}
.result.lose{background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.7)}

/* Chips */
.chips{display:flex;gap:6px;width:100%;max-width:400px}
.chip{
  flex:1;padding:10px 4px;border-radius:20px;text-align:center;cursor:pointer;
  font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;
  border:1.5px solid rgba(255,255,255,.1);color:rgba(255,255,255,.4);
  background:rgba(255,255,255,.06);transition:all .15s;
}
.chip.sel{background:rgba(251,191,36,.2);border-color:#fbbf24;color:#fbbf24}
.chip:active{transform:scale(.96)}

/* Bouton */
.spin-btn{
  width:100%;max-width:400px;padding:16px;border:none;border-radius:16px;
  background:linear-gradient(135deg,#fbbf24,#f59e0b);
  color:#1a0000;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px;
  cursor:pointer;box-shadow:0 6px 24px rgba(251,191,36,.35);
  transition:all .15s;font-weight:900;
}
.spin-btn:active{transform:scale(.98);opacity:.9}
.spin-btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <button class="btn-back" onclick="location.href='casino.html'">← CASINO</button>
  <div class="hdr-title">🎡 ROULETTE</div>
  <div class="hdr-balance" id="balance">0€</div>
</div>

<!-- JEU -->
<div class="game-wrap">

  <div class="table">
    <!-- ROUE SVG -->
    <div class="wheel-wrap">
      <svg viewBox="0 0 200 200" id="roulWheel" onclick="play()">
        <circle cx="100" cy="100" r="98" fill="#0a0a0a" stroke="#fbbf24" stroke-width="3"/>
        <path d="M100,100 L100,2 A98,98,0,0,1,168,31 Z" fill="#cc1a1a" opacity="0.9"/>
        <path d="M100,100 L168,31 A98,98,0,0,1,198,100 Z" fill="#0a0a0a" opacity="0.85"/>
        <path d="M100,100 L198,100 A98,98,0,0,1,168,169 Z" fill="#cc1a1a" opacity="0.9"/>
        <path d="M100,100 L168,169 A98,98,0,0,1,100,198 Z" fill="#0a0a0a" opacity="0.85"/>
        <path d="M100,100 L100,198 A98,98,0,0,1,32,169 Z" fill="#cc1a1a" opacity="0.9"/>
        <path d="M100,100 L32,169 A98,98,0,0,1,2,100 Z" fill="#0a0a0a" opacity="0.85"/>
        <path d="M100,100 L2,100 A98,98,0,0,1,32,31 Z" fill="#cc1a1a" opacity="0.9"/>
        <path d="M100,100 L32,31 A98,98,0,0,1,100,2 Z" fill="#047857" opacity="0.95"/>
        <circle cx="100" cy="100" r="50" fill="#0a0a0a" stroke="#fbbf24" stroke-width="2"/>
        <circle cx="100" cy="100" r="30" fill="#1a0a0a" stroke="rgba(251,191,36,0.3)" stroke-width="1"/>
        <circle cx="100" cy="100" r="14" fill="#fbbf24"/>
        <text x="100" y="108" text-anchor="middle" font-family="Bebas Neue" font-size="20" fill="#0a0a0a" id="roulNum">?</text>
        <circle cx="100" cy="8" r="9" fill="white" stroke="#fbbf24" stroke-width="1.5" id="roulBall"/>
      </svg>
    </div>

    <!-- PARIS -->
    <div class="bets">
      <div class="bet-btn red sel" id="rb-red" onclick="selCouleur('red')">ROUGE<div class="bet-sub">×1.9 · 1—7</div></div>
      <div class="bet-btn green" id="rb-green" onclick="selCouleur('green')">VERT<div class="bet-sub">×14 · 0</div></div>
      <div class="bet-btn black" id="rb-black" onclick="selCouleur('black')">NOIR<div class="bet-sub">×1.9 · 8—14</div></div>
    </div>
  </div>

  <!-- RÉSULTAT -->
  <div class="result" id="result"></div>

  <!-- CHIPS -->
  <div class="chips">
    <div class="chip sel" id="c1000" onclick="setBet(1000,'c1000')">1K</div>
    <div class="chip" id="c5000" onclick="setBet(5000,'c5000')">5K</div>
    <div class="chip" id="c10000" onclick="setBet(10000,'c10000')">10K</div>
    <div class="chip" id="c50000" onclick="setBet(50000,'c50000')">50K</div>
  </div>

  <!-- BOUTON -->
  <button class="spin-btn" id="btnPlay" onclick="play()">LANCER — <span id="betLabel">1 000€</span></button>

</div>

<script>

    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const sb = createClient(supabaseUrl, supabaseKey);

    let money = parseInt(localStorage.getItem("bd_money")||"0"), bet = 1000, couleur = 'red', busy = false, currentUser = null;

    const fmt = n => Math.floor(n).toLocaleString('fr-FR');
    const colorOf = n => n === 0 ? 'green' : n <= 7 ? 'red' : 'black';

    function selCouleur(c) {
      couleur = c;
      ['red','green','black'].forEach(x => document.getElementById('rb-'+x).classList.toggle('sel', x===c));
    }

    function setBet(val, chipId) {
      bet = val;
      ['c1000','c5000','c10000','c50000'].forEach(id => document.getElementById(id).classList.toggle('sel', id===chipId));
      document.getElementById('betLabel').textContent = fmt(val) + '€';
    }

    function updateBal() {
      var fmt2=function(n){return n>=1000000?(n/1000000).toFixed(1)+'M€':n>=1000?Math.floor(n/1000)+'k€':Math.floor(n).toLocaleString('fr-FR')+'€';}; document.getElementById('balance').textContent = fmt2(money);
    }

    function showResult(msg, cls) {
      const el = document.getElementById('result');
      el.textContent = msg;
      el.className = 'result ' + cls;
      el.style.display = 'block';
    }

    // Secteurs de la roue (degrés depuis le haut, sens horaire)
    const SECTORS = [
      [0,45,'red'],[45,90,'black'],[90,135,'red'],[135,180,'black'],
      [180,225,'red'],[225,270,'black'],[270,315,'red'],[315,360,'green']
    ];
    let ballAngle = 0;
    let animFrame = null;

    function setBallPos(angle) {
      const rad = (angle - 90) * Math.PI / 180;
      const x = 100 + 88 * Math.cos(rad);
      const y = 100 + 88 * Math.sin(rad);
      const ball = document.getElementById('roulBall');
      if (ball) { ball.setAttribute('cx', x.toFixed(2)); ball.setAttribute('cy', y.toFixed(2)); }
    }

    function targetAngle(color) {
      const matching = SECTORS.filter(s => s[2] === color);
      const sector = matching[Math.floor(Math.random() * matching.length)];
      return sector[0] + 10 + Math.random() * 25;
    }

    function animateBall(target, onDone) {
      if (animFrame) cancelAnimationFrame(animFrame);
      const start = ballAngle % 360;
      const tours = 4 + Math.floor(Math.random() * 2);
      let delta = target - start;
      if (delta < 0) delta += 360;
      const totalDeg = tours * 360 + delta;
      const duration = 3200;
      const startTime = performance.now();
      function step(now) {
        const t = Math.min((now - startTime) / duration, 1);
        const ease = 1 - Math.pow(1 - t, 3);
        ballAngle = start + totalDeg * ease;
        setBallPos(ballAngle);
        if (t < 1) { animFrame = requestAnimationFrame(step); }
        else { ballAngle = target; setBallPos(target); onDone(); }
      }
      animFrame = requestAnimationFrame(step);
    }

    function play() {
      if (busy || bet <= 0 || money < bet) { showResult("Pas assez d'argent !", 'lose'); return; }
      busy = true;
      money -= bet;
      updateBal();
      document.getElementById('result').style.display = 'none';
      document.getElementById('btnPlay').disabled = true;

      const numEl = document.getElementById('roulNum');
      const result = Math.floor(Math.random() * 15);
      numEl.textContent = '?';

      animateBall(targetAngle(colorOf(result)), () => {
        numEl.textContent = result;
        settle(result);
      });
    }

    async function settle(result) {
      const c = colorOf(result);
      const emoji = c === 'green' ? '🟢' : c === 'red' ? '🔴' : '⚫';
      let msg = '', cls = 'lose';

      if (c === couleur) {
        const mult = c === 'green' ? 14 : 1.9;
        const gain = Math.floor(bet * mult);
        money += gain;
        msg = emoji + ' ' + result + ' ! +' + fmt(gain - bet) + '€';
        cls = 'win';
      } else {
        msg = emoji + ' ' + result + ' — Raté !';
      }

      updateBal();
      showResult(msg, cls);
      document.getElementById('btnPlay').disabled = false;
      busy = false;

      await saveMoney(money);
    }

    async function init() {
      const { data: _authData, error: _authError } = await sb.auth.getSession();
      if (_authError || !_authData.session) {
        await sb.auth.signOut().catch(() => {});
        window.location.href = 'index.html';
        return;
      }
      const session = _authData.session;
      currentUser = session.user;
      const { data } = await sb.from('game_stats').select('money').eq('user_id', currentUser.id).maybeSingle();
      money = data?.money || 0; localStorage.setItem("bd_money", money);
      updateBal();
      setBallPos(0);
    }

    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('gesturechange', e => e.preventDefault());
  
  async function saveMoney(amount) {
    const val = Math.floor(amount);
    localStorage.setItem('bd_money', val);
    if (!currentUser) return;
    for (let i = 0; i < 3; i++) {
      const { error } = await sb.from('game_stats').update({ money: val }).eq('user_id', currentUser.id);
      if (!error) return;
      await new Promise(r => setTimeout(r, 400));
    }
    console.warn('saveMoney: échec après 3 tentatives');
  }

  init();
  
</script>
</body>
</html>
