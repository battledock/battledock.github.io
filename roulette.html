<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Roulette — Battle Dock</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
    html { height:100%; } body { height:100dvh; overflow:hidden; }
    body { font-family:'Inter',sans-serif; background:#cc1a1a; display:flex; flex-direction:column; }
    .page { flex:1; display:flex; flex-direction:column; max-width:480px; width:100%; margin:0 auto; }

    .hdr { display:flex; align-items:center; gap:10px; padding:calc(env(safe-area-inset-top)+36px) 14px 10px; flex-shrink:0; }
    .btn-back { background:rgba(0,0,0,0.2); border:2px solid rgba(255,255,255,0.2); color:white; border-radius:10px; padding:8px 12px; font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:1px; cursor:pointer; }
    .hdr-title { flex:1; text-align:center; font-family:'Bebas Neue',sans-serif; font-size:20px; color:white; letter-spacing:2px; }
    .hdr-bal { background:#FDD835; border:2.5px solid #0a0a0a; border-radius:10px; padding:7px 14px; box-shadow:2px 2px 0 rgba(0,0,0,0.2); }
    .hdr-bal-v { font-family:'Bebas Neue',sans-serif; font-size:17px; color:#0a0a0a; }

    /* Roue */
    .wheel-wrap { flex:1; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; padding:0 14px; }
    @keyframes spin-wheel { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    .wheel-spinning { animation:spin-wheel .3s linear infinite; }

    /* Paris */
    .bets { display:flex; gap:8px; width:100%; }
    .bet-btn { flex:1; padding:13px 4px; border:3px solid #0a0a0a; border-radius:14px; font-family:'Bebas Neue',sans-serif; font-size:15px; color:white; text-align:center; cursor:pointer; box-shadow:3px 3px 0 rgba(0,0,0,0.2); transition:all .15s; }
    .bet-btn:active { transform:translate(2px,2px); box-shadow:1px 1px 0 rgba(0,0,0,0.2); }
    .bet-btn.sel { outline:3px solid #FDD835; outline-offset:2px; }
    .bet-btn.red { background:#cc1a1a; }
    .bet-btn.green { background:#047857; }
    .bet-btn.black { background:#1f2937; }
    .bet-sub { font-size:9px; color:rgba(255,255,255,0.6); font-family:'Inter',sans-serif; font-weight:400; }

    /* Chips */
    .chips { display:flex; gap:6px; width:100%; }
    .chip { flex:1; padding:9px; border-radius:10px; text-align:center; cursor:pointer; transition:all .15s; }
    .chip.sel { background:#FDD835; border:2.5px solid #0a0a0a; box-shadow:2px 2px 0 rgba(0,0,0,0.2); }
    .chip.sel .chip-v { color:#0a0a0a; }
    .chip:not(.sel) { background:rgba(0,0,0,0.15); border:2px solid rgba(255,255,255,0.2); }
    .chip:not(.sel) .chip-v { color:rgba(255,255,255,0.5); }
    .chip-v { font-family:'Bebas Neue',sans-serif; font-size:13px; }

    .result { font-family:'Bebas Neue',sans-serif; font-size:20px; color:white; text-align:center; min-height:28px; }

    .btn-play { width:100%; padding:clamp(12px,3.5vw,16px); border:3px solid #0a0a0a; border-radius:14px; background:white; color:#cc1a1a; font-family:'Bebas Neue',sans-serif; font-size:clamp(15px,4.5vw,19px); letter-spacing:3px; cursor:pointer; box-shadow:4px 4px 0 rgba(0,0,0,0.2); }
    .btn-play:active { transform:translate(2px,2px); box-shadow:2px 2px 0 rgba(0,0,0,0.2); }
    .btn-play:disabled { opacity:0.5; }

    .btn-retour { width:calc(100% - 28px); margin:8px 14px calc(env(safe-area-inset-bottom)+14px); background:rgba(0,0,0,0.15); border:2px solid rgba(255,255,255,0.15); border-radius:12px; padding:12px; color:rgba(255,255,255,0.45); font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:2px; text-align:center; cursor:pointer; flex-shrink:0; }
  </style>
</head>
<body>
<div class="page">

  <div class="hdr">
    <button class="btn-back" onclick="window.location.href='casino.html'">← Salle</button>
    <div class="hdr-title">ROULETTE</div>
    <div class="hdr-bal"><div class="hdr-bal-v" id="balDisplay">—</div></div>
  </div>

  <div class="wheel-wrap">
    <!-- Roue SVG -->
    <svg width="min(200px,52vw)" height="min(200px,52vw)" viewBox="0 0 200 200" id="roulWheel" style="cursor:pointer" onclick="play()">
      <circle cx="100" cy="100" r="98" fill="#0a0a0a" stroke="#FDD835" stroke-width="3"/>
      <path d="M100,100 L100,2 A98,98,0,0,1,168,31 Z" fill="#cc1a1a" opacity="0.9"/>
      <path d="M100,100 L168,31 A98,98,0,0,1,198,100 Z" fill="#0a0a0a" opacity="0.85"/>
      <path d="M100,100 L198,100 A98,98,0,0,1,168,169 Z" fill="#cc1a1a" opacity="0.9"/>
      <path d="M100,100 L168,169 A98,98,0,0,1,100,198 Z" fill="#0a0a0a" opacity="0.85"/>
      <path d="M100,100 L100,198 A98,98,0,0,1,32,169 Z" fill="#cc1a1a" opacity="0.9"/>
      <path d="M100,100 L32,169 A98,98,0,0,1,2,100 Z" fill="#0a0a0a" opacity="0.85"/>
      <path d="M100,100 L2,100 A98,98,0,0,1,32,31 Z" fill="#cc1a1a" opacity="0.9"/>
      <path d="M100,100 L32,31 A98,98,0,0,1,100,2 Z" fill="#047857" opacity="0.95"/>
      <circle cx="100" cy="100" r="50" fill="#0a0a0a" stroke="#FDD835" stroke-width="2"/>
      <circle cx="100" cy="100" r="30" fill="#1a0a0a" stroke="rgba(251,191,36,0.3)" stroke-width="1"/>
      <circle cx="100" cy="100" r="14" fill="#FDD835"/>
      <text x="100" y="108" text-anchor="middle" font-family="Bebas Neue" font-size="20" fill="#0a0a0a" id="roulNum">?</text>
      <circle cx="100" cy="8" r="8" fill="white" id="roulBall"/>
    </svg>

    <!-- Paris -->
    <div class="bets">
      <div class="bet-btn red sel" id="rb-red" onclick="selCouleur('red')">ROUGE<div class="bet-sub">×2 · 1-7</div></div>
      <div class="bet-btn green" id="rb-green" onclick="selCouleur('green')">VERT<div class="bet-sub">×14 · 0</div></div>
      <div class="bet-btn black" id="rb-black" onclick="selCouleur('black')">NOIR<div class="bet-sub">×2 · 8-14</div></div>
    </div>

    <!-- Chips -->
    <div class="chips">
      <div class="chip sel" id="c1000" onclick="setBet(1000,'c1000')"><div class="chip-v">1K</div></div>
      <div class="chip" id="c5000" onclick="setBet(5000,'c5000')"><div class="chip-v">5K</div></div>
      <div class="chip" id="c10000" onclick="setBet(10000,'c10000')"><div class="chip-v">10K</div></div>
      <div class="chip" id="c50000" onclick="setBet(50000,'c50000')"><div class="chip-v">50K</div></div>
    </div>

    <div class="result" id="result"></div>
    <button class="btn-play" id="btnPlay" onclick="play()">LANCER — 1 000€</button>
  </div>

  <div class="btn-retour" onclick="window.location.href='casino.html'">← RETOUR AU CASINO</div>

</div>

<script>
  const SB_URL = 'https://drtsuhnbclhmgfjiykap.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
  const sb = supabase.createClient(SB_URL, SB_KEY);

  let money = 0, bet = 1000, couleur = 'red', busy = false, currentUser = null;

  const fmt = n => Math.floor(n).toLocaleString('fr-FR');
  const colorOf = n => n===0 ? 'green' : n<=7 ? 'red' : 'black';

  function selCouleur(c){
    couleur = c;
    ['red','green','black'].forEach(x=>document.getElementById('rb-'+x).classList.toggle('sel',x===c));
  }

  function setBet(val, chipId){
    bet = val;
    ['c1000','c5000','c10000','c50000'].forEach(id=>document.getElementById(id).classList.toggle('sel',id===chipId));
    document.getElementById('btnPlay').textContent = 'LANCER — '+fmt(val)+'€';
  }

  function updateBal(){ document.getElementById('balDisplay').textContent = fmt(money)+'€'; }

  async function init(){
    const { data:{ session } } = await sb.auth.getSession();
    if(!session){ window.location.href='index.html'; return; }
    currentUser = session.user;
    const { data } = await sb.from('game_stats').select('money').eq('user_id',currentUser.id).maybeSingle();
    money = data?.money || 0;
    updateBal();
  }

  function play(){
    if(busy || money<bet){ document.getElementById('result').textContent='Pas assez d\'argent !'; return; }
    busy = true;
    money -= bet;
    updateBal();
    document.getElementById('result').textContent='';
    document.getElementById('btnPlay').disabled=true;

    const wheel = document.getElementById('roulWheel');
    const numEl = document.getElementById('roulNum');
    const result = Math.floor(Math.random()*15);

    wheel.classList.add('wheel-spinning');
    numEl.textContent='?';

    let n=0;
    const spinInt = setInterval(()=>{ n=Math.floor(Math.random()*15); numEl.textContent=n; },70);

    setTimeout(()=>{
      clearInterval(spinInt);
      wheel.classList.remove('wheel-spinning');
      numEl.textContent = result;
      settle(result);
    }, 1800);
  }

  async function settle(result){
    const c = colorOf(result);
    let mult = 0, msg = '';
    if(c===couleur){
      mult = c==='green' ? 14 : 2;
      const gain = Math.floor(bet*mult);
      money += gain;
      msg = (c==='green'?'🟢':'c'==='red'?'🔴':'⚫') + ' ' + result + ' ! +'+fmt(gain)+'€';
    } else {
      msg = (c==='green'?'🟢':c==='red'?'🔴':'⚫') + ' ' + result + '… Raté';
    }

    updateBal();
    document.getElementById('result').textContent = msg;
    document.getElementById('btnPlay').disabled = false;
    busy = false;

    if(currentUser) await sb.from('game_stats').update({ money: Math.floor(money) }).eq('user_id',currentUser.id);
  }

  init();
</script>
</body>
</html>
