<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Roulette - Battle Dock Casino</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(180deg, #0f172a 0%, #1e293b 50%, #334155 100%);
      min-height: 100vh;
      padding-bottom: 80px;
      overflow-x: hidden;
    }

    .container { max-width: 500px; margin: 0 auto; padding: 16px; }

    /* HEADER */
    .header {
      background: linear-gradient(135deg, #1e293b, #334155);
      border: 2px solid rgba(251, 191, 36, 0.3);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .back-btn {
      background: rgba(251, 191, 36, 0.2);
      border: 2px solid rgba(251, 191, 36, 0.5);
      color: #fbbf24;
      border-radius: 10px;
      padding: 8px 14px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    .game-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(20px, 5vw, 28px);
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
    }

    .balance {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #0f172a;
      padding: 6px 12px;
      border-radius: 10px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
    }

    /* GAME AREA */
    .game-area {
      background: linear-gradient(135deg, #1e293b, #334155);
      border: 2px solid rgba(251, 191, 36, 0.2);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    /* LEGEND */
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
      justify-content: center;
    }

    .legend-item {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }

    .legend-color {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.3);
    }

    .legend-mult {
      font-family: 'Bebas Neue', sans-serif;
      color: white;
      font-size: 14px;
    }

    /* WHEEL */
    .wheel-container {
      position: relative;
      width: min(300px, 90vw);
      height: min(300px, 90vw);
      margin: 0 auto 20px;
    }

    .wheel-pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 24px solid #fbbf24;
      z-index: 20;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.5));
      animation: pointer-pulse 2s infinite;
    }

    @keyframes pointer-pulse {
      0%, 100% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.1); }
    }

    .wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      position: relative;
      box-shadow: 0 0 0 12px rgba(251, 191, 36, 0.3), 0 12px 40px rgba(0, 0, 0, 0.6);
      transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
      overflow: hidden;
    }

    .wheel-segment {
      position: absolute;
      width: 100%;
      height: 100%;
      clip-path: polygon(50% 50%, 50% 0%, 100% 0%);
      transform-origin: center;
    }

    /* 12 segments de 30° */
    .seg-0 { background: #1f2937; transform: rotate(0deg); }
    .seg-1 { background: #ef4444; transform: rotate(30deg); }
    .seg-2 { background: #3b82f6; transform: rotate(60deg); }
    .seg-3 { background: #10b981; transform: rotate(90deg); }
    .seg-4 { background: #ef4444; transform: rotate(120deg); }
    .seg-5 { background: #8b5cf6; transform: rotate(150deg); }
    .seg-6 { background: #10b981; transform: rotate(180deg); }
    .seg-7 { background: #3b82f6; transform: rotate(210deg); }
    .seg-8 { background: #10b981; transform: rotate(240deg); }
    .seg-9 { background: #8b5cf6; transform: rotate(270deg); }
    .seg-10 { background: #f97316; transform: rotate(300deg); }
    .seg-11 { background: #fbbf24; transform: rotate(330deg); }

    .wheel-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: clamp(60px, 18vw, 90px);
      height: clamp(60px, 18vw, 90px);
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      border-radius: 50%;
      border: 4px solid white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(28px, 7vw, 40px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      z-index: 10;
    }

    /* CONTROLS */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .bet-control {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.05);
      padding: 12px 20px;
      border-radius: 12px;
      border: 2px solid rgba(251, 191, 36, 0.2);
    }

    .bet-control label {
      font-weight: 700;
      font-size: 14px;
      color: #fbbf24;
    }

    .bet-control input {
      width: 140px;
      padding: 10px;
      border: 2px solid #fbbf24;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }

    .play-btn {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #0f172a;
      border: none;
      border-radius: 14px;
      padding: 14px 48px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(251, 191, 36, 0.4);
      transition: all 0.2s;
    }

    .play-btn:active {
      transform: scale(0.95);
    }

    .play-btn:disabled {
      background: #475569;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* RESULT */
    .result {
      display: none;
      margin-top: 16px;
      padding: 16px;
      border-radius: 12px;
      text-align: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 1px;
      animation: slideUp 0.3s;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result.win {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.5);
    }

    .result.lose {
      background: linear-gradient(135deg, #dc2626, #991b1b);
      color: white;
      box-shadow: 0 4px 16px rgba(220, 38, 38, 0.5);
    }

    .result.push {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      box-shadow: 0 4px 16px rgba(59, 130, 246, 0.5);
    }

    /* BOTTOM NAV */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(135deg, #1e293b, #334155);
      border-top: 2px solid rgba(251, 191, 36, 0.3);
      padding: 12px 16px;
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.5);
      z-index: 100;
    }

    .nav-btn {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      display: flex;
      background: rgba(251, 191, 36, 0.2);
      border: 2px solid rgba(251, 191, 36, 0.5);
      color: #fbbf24;
      border-radius: 12px;
      padding: 12px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      letter-spacing: 1px;
      cursor: pointer;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <button class="back-btn" onclick="window.location.href='casino-new.html'">← Casino</button>
      <div class="game-title">🎡 ROULETTE</div>
      <div class="balance" id="balance">0€</div>
    </div>

    <div class="game-area">
      <div class="legend">
        <div class="legend-item"><div class="legend-color" style="background: #1f2937;"></div><div class="legend-mult">×0</div></div>
        <div class="legend-item"><div class="legend-color" style="background: #ef4444;"></div><div class="legend-mult">×0.5</div></div>
        <div class="legend-item"><div class="legend-color" style="background: #3b82f6;"></div><div class="legend-mult">×0.8</div></div>
        <div class="legend-item"><div class="legend-color" style="background: #10b981;"></div><div class="legend-mult">×1.2</div></div>
        <div class="legend-item"><div class="legend-color" style="background: #8b5cf6;"></div><div class="legend-mult">×1.5</div></div>
        <div class="legend-item"><div class="legend-color" style="background: #f97316;"></div><div class="legend-mult">×2</div></div>
        <div class="legend-item"><div class="legend-color" style="background: #fbbf24;"></div><div class="legend-mult">×5 🏆</div></div>
      </div>

      <div class="wheel-container">
        <div class="wheel-pointer"></div>
        <div class="wheel" id="wheel">
          <div class="wheel-segment seg-0"></div>
          <div class="wheel-segment seg-1"></div>
          <div class="wheel-segment seg-2"></div>
          <div class="wheel-segment seg-3"></div>
          <div class="wheel-segment seg-4"></div>
          <div class="wheel-segment seg-5"></div>
          <div class="wheel-segment seg-6"></div>
          <div class="wheel-segment seg-7"></div>
          <div class="wheel-segment seg-8"></div>
          <div class="wheel-segment seg-9"></div>
          <div class="wheel-segment seg-10"></div>
          <div class="wheel-segment seg-11"></div>
          <div class="wheel-center">🎯</div>
        </div>
      </div>

      <div class="controls">
        <div class="bet-control">
          <label>MISE:</label>
          <input type="number" id="betInput" value="50" min="50" step="10">
        </div>
        <button class="play-btn" id="spinBtn" onclick="spin()">TOURNER LA ROUE</button>
      </div>

      <div class="result" id="result"></div>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-btn" onclick="window.location.href='casino-new.html'">
      ← RETOUR AU CASINO
    </button>
  </div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const sb = createClient(supabaseUrl, supabaseKey);

    let currentUser, userMoney = 0;

    // Anti-zoom
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('gesturechange', e => e.preventDefault());

    // Nouveau système équilibré - 12 segments de 30° (avantage maison 12%)
    const segments = [
      { color: 'Noir', mult: 0, bgColor: '#1f2937' },       // 0° - 8.33%
      { color: 'Rouge', mult: 0.5, bgColor: '#ef4444' },    // 30° - 8.33%
      { color: 'Bleu', mult: 0.8, bgColor: '#3b82f6' },     // 60° - 8.33%
      { color: 'Vert', mult: 1.2, bgColor: '#10b981' },     // 90° - 8.33%
      { color: 'Rouge', mult: 0.5, bgColor: '#ef4444' },    // 120° - 8.33%
      { color: 'Violet', mult: 1.5, bgColor: '#8b5cf6' },   // 150° - 8.33%
      { color: 'Vert', mult: 1.2, bgColor: '#10b981' },     // 180° - 8.33%
      { color: 'Bleu', mult: 0.8, bgColor: '#3b82f6' },     // 210° - 8.33%
      { color: 'Vert', mult: 1.2, bgColor: '#10b981' },     // 240° - 8.33%
      { color: 'Violet', mult: 1.5, bgColor: '#8b5cf6' },   // 270° - 8.33%
      { color: 'Orange', mult: 2, bgColor: '#f97316' },     // 300° - 8.33%
      { color: 'Or', mult: 5, bgColor: '#fbbf24' }          // 330° - 8.33%
    ];

    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { window.location.href = 'index.html'; return; }
      currentUser = session.user;
      await loadMoney();
    }

    async function loadMoney() {
      const { data } = await sb.from('game_stats').select('money').eq('user_id', currentUser.id).single();
      if (data) {
        userMoney = data.money || 0;
        document.getElementById('balance').textContent = userMoney.toLocaleString('fr-FR') + '€';
      }
    }

    async function updateMoney(amount) {
      userMoney += amount;
      await sb.from('game_stats').update({ money: userMoney }).eq('user_id', currentUser.id);
      document.getElementById('balance').textContent = userMoney.toLocaleString('fr-FR') + '€';
    }

    async function spin() {
      const bet = parseInt(document.getElementById('betInput').value);
      if (bet < 50 || bet > userMoney) { alert('Mise invalide !'); return; }

      const btn = document.getElementById('spinBtn');
      btn.disabled = true;
      await updateMoney(-bet);

      const wheel = document.getElementById('wheel');
      const spins = 5 + Math.random() * 3; // 5-8 tours
      const segmentIndex = Math.floor(Math.random() * 12); // 0-11
      const segmentAngle = segmentIndex * 30; // 30° par segment
      const offsetInSegment = 15; // Centre du segment

      const finalAngle = (spins * 360) + segmentAngle + offsetInSegment;
      wheel.style.transform = `rotate(${finalAngle}deg)`;

      setTimeout(async () => {
        const normalizedAngle = finalAngle % 360;
        const pointerAngle = (360 - normalizedAngle) % 360;
        const hitSegment = Math.floor(pointerAngle / 30);

        const segment = segments[hitSegment];
        const win = Math.floor(bet * segment.mult);
        const res = document.getElementById('result');

        if (win > bet) {
          res.className = 'result win';
          res.innerHTML = `🎉 <span style="color: ${segment.bgColor}; font-weight: 700;">${segment.color.toUpperCase()}</span> ! ×${segment.mult} = +${win.toLocaleString('fr-FR')}€`;
          await updateMoney(win);
        } else if (win === bet) {
          res.className = 'result push';
          res.innerHTML = `↔️ <span style="color: ${segment.bgColor}; font-weight: 700;">${segment.color.toUpperCase()}</span> - Remboursé ${bet.toLocaleString('fr-FR')}€`;
          await updateMoney(win);
        } else if (win > 0) {
          res.className = 'result lose';
          res.innerHTML = `📉 <span style="color: ${segment.bgColor}; font-weight: 700;">${segment.color.toUpperCase()}</span> ×${segment.mult} = ${win.toLocaleString('fr-FR')}€ (perte: ${(bet - win).toLocaleString('fr-FR')}€)`;
          await updateMoney(win);
        } else {
          res.className = 'result lose';
          res.innerHTML = `💔 <span style="color: ${segment.bgColor}; font-weight: 700;">${segment.color.toUpperCase()}</span> - Perdu ${bet.toLocaleString('fr-FR')}€`;
        }

        res.style.display = 'block';
        btn.disabled = false;

        setTimeout(() => {
          wheel.style.transition = 'none';
          wheel.style.transform = 'rotate(0deg)';
          setTimeout(() => {
            wheel.style.transition = 'transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99)';
          }, 50);
        }, 100);
      }, 4000);
    }

    init();
  </script>
</body>
</html>
