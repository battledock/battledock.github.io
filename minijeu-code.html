<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Code de Sécurité - Battle Dock</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    .container {
      max-width: 600px;
      width: 100%;
      padding: 20px;
    }

    .header {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      letter-spacing: 2px;
      color: #11998e;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: #6b7280;
    }

    .game-area {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      padding: 40px 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      text-align: center;
      margin-bottom: 20px;
      min-height: 500px;
    }

    .attempts-left {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      color: #6b7280;
      margin-bottom: 20px;
    }

    .code-input-container {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin: 30px 0;
    }

    .code-digit {
      width: 70px;
      height: 80px;
      border: 3px solid #11998e;
      border-radius: 12px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 48px;
      text-align: center;
      outline: none;
      transition: all 0.2s;
    }

    .code-digit:focus {
      border-color: #38ef7d;
      box-shadow: 0 0 0 3px rgba(56, 239, 125, 0.2);
    }

    .submit-btn {
      background: linear-gradient(135deg, #11998e, #38ef7d);
      color: white;
      border: none;
      padding: 16px 48px;
      border-radius: 12px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(17, 153, 142, 0.4);
      transition: all 0.2s;
      margin-top: 20px;
    }

    .submit-btn:active {
      transform: scale(0.95);
    }

    .attempts-history {
      margin-top: 30px;
      text-align: left;
      max-height: 200px;
      overflow-y: auto;
    }

    .attempt-item {
      background: #f9fafb;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .attempt-code {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      letter-spacing: 4px;
      color: #1a1a1a;
    }

    .attempt-hint {
      font-size: 14px;
      color: #6b7280;
    }

    .hint-correct {
      color: #10b981;
      font-weight: 600;
    }

    .hint-wrong {
      color: #ef4444;
      font-weight: 600;
    }

    .result-popup {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      animation: fadeIn 0.3s;
    }

    .result-popup.show {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-content {
      background: white;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      max-width: 400px;
      animation: popIn 0.5s;
    }

    @keyframes popIn {
      0% { transform: scale(0.5); }
      70% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .result-icon {
      font-size: 80px;
      margin-bottom: 20px;
    }

    .result-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      color: #11998e;
      margin-bottom: 12px;
    }

    .result-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 64px;
      color: #10b981;
      margin-bottom: 20px;
    }

    .close-btn {
      background: #11998e;
      color: white;
      border: none;
      padding: 12px 32px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .close-btn:active {
      transform: scale(0.95);
    }

    .back-btn {
      background: white;
      color: #11998e;
      border: 2px solid #11998e;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s;
    }

    .back-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">🔐 Code de Sécurité</div>
      <div class="subtitle">Trouve le code à 4 chiffres en 10 essais !</div>
    </div>

    <div class="game-area">
      <div class="attempts-left" id="attemptsLeft">10 essais restants</div>

      <div class="code-input-container">
        <input type="text" class="code-digit" id="digit1" maxlength="1" inputmode="numeric" pattern="[0-9]">
        <input type="text" class="code-digit" id="digit2" maxlength="1" inputmode="numeric" pattern="[0-9]">
        <input type="text" class="code-digit" id="digit3" maxlength="1" inputmode="numeric" pattern="[0-9]">
        <input type="text" class="code-digit" id="digit4" maxlength="1" inputmode="numeric" pattern="[0-9]">
      </div>

      <button class="submit-btn" onclick="submitCode()">Vérifier</button>

      <div class="attempts-history" id="attemptsHistory"></div>
    </div>

    <button class="back-btn" onclick="goBack()">← Retour aux mini-jeux</button>
  </div>

  <div class="result-popup" id="resultPopup">
    <div class="result-content">
      <div class="result-icon" id="resultIcon">🎉</div>
      <div class="result-title" id="resultTitle">Trouvé !</div>
      <div class="result-value" id="resultValue">+0€</div>
      <button class="close-btn" onclick="closeResult()">Continuer</button>
    </div>
  </div>

  <script>
    console.log('🔐 [CODE] Initialisation');

    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const supabaseClient = createClient(supabaseUrl, supabaseKey);

    const userId = localStorage.getItem('userId');
    if (!userId) window.location.href = 'index.html';

    let secretCode = '';
    let attemptsLeft = 10;
    let attempts = [];

    // Auto-focus next input
    ['digit1', 'digit2', 'digit3', 'digit4'].forEach((id, index) => {
      const input = document.getElementById(id);
      input.addEventListener('input', (e) => {
        e.target.value = e.target.value.replace(/[^0-9]/g, '');
        if (e.target.value && index < 3) {
          document.getElementById(['digit1', 'digit2', 'digit3', 'digit4'][index + 1]).focus();
        }
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && index > 0) {
          document.getElementById(['digit1', 'digit2', 'digit3', 'digit4'][index - 1]).focus();
        }
      });
    });

    startNewGame();

    function startNewGame() {
      // Generate random 4-digit code
      secretCode = '';
      for (let i = 0; i < 4; i++) {
        secretCode += Math.floor(Math.random() * 10);
      }
      
      console.log('🔐 [CODE] Code secret:', secretCode);
      
      attemptsLeft = 10;
      attempts = [];
      
      updateDisplay();
      clearInputs();
    }

    function clearInputs() {
      ['digit1', 'digit2', 'digit3', 'digit4'].forEach(id => {
        document.getElementById(id).value = '';
      });
      document.getElementById('digit1').focus();
    }

    function updateDisplay() {
      document.getElementById('attemptsLeft').textContent = attemptsLeft + ' essais restants';
      
      const historyDiv = document.getElementById('attemptsHistory');
      historyDiv.innerHTML = '';
      
      attempts.forEach(attempt => {
        const div = document.createElement('div');
        div.className = 'attempt-item';
        div.innerHTML = `
          <div class="attempt-code">${attempt.code}</div>
          <div class="attempt-hint">
            <span class="hint-correct">${attempt.correct} bon(s)</span> • 
            <span class="hint-wrong">${attempt.misplaced} mal placé(s)</span>
          </div>
        `;
        historyDiv.appendChild(div);
      });
    }

    function submitCode() {
      const code = ['digit1', 'digit2', 'digit3', 'digit4']
        .map(id => document.getElementById(id).value)
        .join('');
      
      if (code.length !== 4) {
        alert('Entre 4 chiffres !');
        return;
      }
      
      console.log('🔍 [CODE] Vérification:', code);
      
      // Check code
      let correct = 0;
      let misplaced = 0;
      const secretArray = secretCode.split('');
      const codeArray = code.split('');
      
      // Count correct positions
      for (let i = 0; i < 4; i++) {
        if (codeArray[i] === secretArray[i]) {
          correct++;
        }
      }
      
      // Count misplaced (correct digit, wrong position)
      for (let i = 0; i < 4; i++) {
        if (codeArray[i] !== secretArray[i] && secretArray.includes(codeArray[i])) {
          misplaced++;
        }
      }
      
      attempts.unshift({ code, correct, misplaced });
      attemptsLeft--;
      
      updateDisplay();
      clearInputs();
      
      // Check win
      if (correct === 4) {
        winGame();
      } else if (attemptsLeft === 0) {
        loseGame();
      }
    }

    async function winGame() {
      console.log('🎉 [CODE] Code trouvé !');
      
      const reward = (11 - attempts.length) * 50; // More reward for fewer attempts
      
      document.getElementById('resultIcon').textContent = '🎉';
      document.getElementById('resultTitle').textContent = 'Code trouvé !';
      document.getElementById('resultValue').textContent = '+' + reward + '€';
      document.getElementById('resultPopup').classList.add('show');
      
      // Save reward
      try {
        const { data: progressArray } = await supabaseClient
          .from('game_progress')
          .select('money')
          .eq('user_id', userId);

        if (progressArray && progressArray[0]) {
          const newMoney = (progressArray[0].money || 0) + reward;

          await supabaseClient
            .from('game_progress')
            .update({ money: newMoney })
            .eq('user_id', userId);

          console.log('✅ [CODE] Argent ajouté');
        }
      } catch (err) {
        console.error('❌ [CODE] Erreur:', err);
      }
    }

    function loseGame() {
      console.log('😔 [CODE] Plus d\'essais');
      
      document.getElementById('resultIcon').textContent = '😔';
      document.getElementById('resultTitle').textContent = 'Raté !';
      document.getElementById('resultValue').textContent = 'Code: ' + secretCode;
      document.getElementById('resultPopup').classList.add('show');
    }

    function closeResult() {
      document.getElementById('resultPopup').classList.remove('show');
      startNewGame();
    }

    function goBack() {
      window.location.href = 'jeux.html';
    }
  </script>
</body>
</html>
