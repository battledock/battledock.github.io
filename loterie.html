<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Loterie — Battle Dock Casino</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{height:100%;height:100dvh;overflow:hidden;font-family:'Inter',sans-serif}
body{background:radial-gradient(ellipse at top,#1a1600,#0d0b00 60%,#050400);display:flex;flex-direction:column}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,44px)+12px) 16px 12px;flex-shrink:0;background:rgba(0,0,0,.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.btn-back{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:7px 14px;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;color:#fff;cursor:pointer}
.hdr-title{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#fbbf24;letter-spacing:3px}
.hdr-bal{background:rgba(0,0,0,.3);border:1px solid rgba(251,191,36,.3);border-radius:20px;padding:7px 14px;font-family:'Bebas Neue',sans-serif;font-size:15px;color:#fbbf24}
.game{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 16px;gap:14px;min-height:0}
.chips{display:flex;gap:6px;width:100%;max-width:420px}
.chip{flex:1;padding:10px 4px;border-radius:20px;text-align:center;cursor:pointer;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;border:1.5px solid rgba(255,255,255,.1);color:rgba(255,255,255,.4);background:rgba(255,255,255,.06);transition:all .15s}
.chip.sel{background:rgba(251,191,36,.2);border-color:#fbbf24;color:#fbbf24}
.chip:active{transform:scale(.96)}
.spin-btn{width:100%;max-width:420px;padding:16px;border:none;border-radius:16px;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a0000;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px;cursor:pointer;box-shadow:0 6px 24px rgba(251,191,36,.35);transition:all .15s;font-weight:900}
.spin-btn:active{transform:scale(.98);opacity:.9}
.spin-btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.result{display:none;padding:13px 16px;border-radius:16px;text-align:center;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;width:100%;max-width:420px;animation:pop .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
.result.win{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;box-shadow:0 4px 16px rgba(22,163,74,.4)}
.result.lose{background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.6)}
.result.jackpot{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a0000;box-shadow:0 4px 16px rgba(251,191,36,.5)}

.ticket{background:linear-gradient(135deg,#1a1a1a,#2d2d2d);border:2px solid #fbbf24;border-radius:20px;width:100%;max-width:420px;padding:20px 16px;position:relative;overflow:hidden}
.ticket::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#fbbf24,#f59e0b)}
.ticket-title{font-family:'Bebas Neue',sans-serif;font-size:11px;color:rgba(255,255,255,.3);letter-spacing:3px;text-align:center;margin-bottom:14px}
.ticket-nums{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.ticket-num{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:20px;color:rgba(255,255,255,.4);cursor:pointer;transition:all .2s}
.ticket-num.drawn{background:linear-gradient(135deg,#fbbf24,#f59e0b);border-color:#fbbf24;color:#1a0000;transform:scale(1.1);box-shadow:0 0 16px rgba(251,191,36,.4)}
.ticket-num.miss{background:rgba(220,38,38,.15);border-color:#dc2626;color:#dc2626}
.ticket-sep{width:100%;height:1px;background:rgba(255,255,255,.08);margin:10px 0;position:relative}
.ticket-sep::before,.ticket-sep::after{content:'';position:absolute;top:50%;transform:translateY(-50%);width:12px;height:12px;border-radius:50%;background:#0a0a0a;border:2px solid rgba(255,255,255,.08)}
.ticket-sep::before{left:-8px}.ticket-sep::after{right:-8px}
.ticket-prize{font-family:'Bebas Neue',sans-serif;font-size:14px;color:rgba(255,255,255,.3);letter-spacing:2px;text-align:center}
.ticket-prize span{color:#fbbf24}
</style>
</head>
<body>
<div class="hdr">
  <button class="btn-back" onclick="location.href='casino.html'">← CASINO</button>
  <div class="hdr-title">🎟️ LOTERIE</div>
  <div class="hdr-bal" id="balance">0€</div>
</div>
<div class="game">
  <div class="ticket">
    <div class="ticket-title">🎟️ BILLET DE LOTERIE · PORT DE MARSEILLE</div>
    <div class="ticket-nums" id="ticketNums">
      <div class="ticket-num" id="n1">?</div>
      <div class="ticket-num" id="n2">?</div>
      <div class="ticket-num" id="n3">?</div>
      <div class="ticket-num" id="n4">?</div>
      <div class="ticket-num" id="n5">?</div>
    </div>
    <div class="ticket-sep"></div>
    <div class="ticket-prize">Gagnant si <span>3+</span> numéros sortent · Max <span>×50</span></div>
  </div>
  <div class="result" id="result"></div>
  <div class="chips">
    <div class="chip" id="c500" onclick="setBet(500,'c500')">500€</div>
    <div class="chip sel" id="c1000" onclick="setBet(1000,'c1000')">1K</div>
    <div class="chip" id="c5000" onclick="setBet(5000,'c5000')">5K</div>
    <div class="chip" id="c10000" onclick="setBet(10000,'c10000')">10K</div>
  </div>
<button class="spin-btn" id="btnPlay" onclick="play()">TIRER — <span id="betLabel">1 000€</span></button>
</div>
<script>

  const supabaseUrl='https://drtsuhnbclhmgfjiykap.supabase.co';
  const supabaseKey='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
  const {createClient}=supabase;
  const sb=createClient(supabaseUrl,supabaseKey);

  const fmt=n=>Math.floor(n).toLocaleString('fr-FR');
  const $=id=>document.getElementById(id);

  let money=parseInt(localStorage.getItem("bd_money")||"0"),bet=500,currentUser=null,busy=false;
  let selected=new Set();
  const MAX_NUMS=30,PICK=5;

  // Paliers de gains (nombre de bons numéros + bonus)
  // RTP ~69% — 30 numéros
  const PRIZES = {
    '5+1': 3500, '5+0': 600, '4+1': 120, '4+0': 36,
    '3+1': 15,   '3+0': 6,  '2+1': 5,  '2+0': 3,
    '1+1': 2.5,  '0+1': 1.2
  };

  function setBet(val,id){
    bet=val;
    ['c500','c1000','c2000','c5000'].forEach(i=>$(i).classList.toggle('sel',i===id));
    $('betLabel').textContent=fmt(val)+'€';
  }

  function updateBal(){ $('balance').textContent=fmt(money)+'€'; }

  function buildGrid(){
    const grid=$('numGrid');
    grid.innerHTML='';
    for(let i=1;i<=MAX_NUMS;i++){
      const btn=document.createElement('div');
      const rang = i<=10?'r1':i<=20?'r2':'r3';
      btn.className='num-btn '+rang;
      btn.textContent=i;
      btn.id='n'+i;
      btn.onclick=()=>toggleNum(i);
      grid.appendChild(btn);
    }
  }

  function toggleNum(n){
    if(busy) return;
    const btn=$('n'+n);
    if(selected.has(n)){
      selected.delete(n);
      btn.classList.remove('sel');
    } else {
      if(selected.size>=PICK) return;
      selected.add(n);
      btn.classList.add('sel');
    }
    $('btnPlay').disabled=(selected.size!==PICK);
  }

  function randFrom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  function drawNumbers(){
    const pool=Array.from({length:MAX_NUMS},(_,i)=>i+1);
    const drawn=[];
    while(drawn.length<PICK){
      const idx=Math.floor(Math.random()*pool.length);
      drawn.push(pool.splice(idx,1)[0]);
    }
    const bonus=randFrom(pool);
    return {drawn,bonus};
  }

  function ballClass(n){
    if(n<=10) return 'bc-red';
    if(n<=20) return 'bc-blue';
    return 'bc-green';
  }

  async function play(){
    if(busy||selected.size!==PICK||money<bet||bet<=0) return;
    busy=true;
    $('btnPlay').disabled=true;
    money-=bet; updateBal();

    // Reset boules
    const row=$('drawnBalls');
    const slots=row.querySelectorAll('.ball:not(.bonus)');
    slots.forEach(b=>{b.className='ball empty';b.textContent='○';});
    $('bonusBall').className='ball bonus empty';$('bonusBall').textContent='★';
    $('result').style.display='none';
    // Reset couleurs grille
    selected.forEach(n=>{const b=$('n'+n);if(b){b.classList.remove('hit','miss');}});

    const {drawn,bonus}=drawNumbers();

    // Animer boules une par une
    for(let i=0;i<drawn.length;i++){
      await new Promise(r=>setTimeout(r,350));
      const slot=slots[i];
      slot.className=`ball ${ballClass(drawn[i])} drawn`;
      slot.textContent=drawn[i];
    }
    await new Promise(r=>setTimeout(r,400));
    $('bonusBall').className='ball bonus drawn';
    $('bonusBall').textContent=bonus;

    // Calculer score
    const hits=drawn.filter(n=>selected.has(n)).length;
    const bonusHit=selected.has(bonus)?1:0;
    const key=`${hits}+${bonusHit}`;
    const mult=PRIZES[key]||0;

    // Colorier la grille
    selected.forEach(n=>{
      const b=$('n'+n);if(!b) return;
      if(drawn.includes(n)||n===bonus) b.classList.add('hit');
      else b.classList.add('miss');
    });

    await new Promise(r=>setTimeout(r,300));

    // Afficher résultat
    const el=$('result');
    if(mult>0){
      const gain=Math.floor(bet*mult);
      money+=gain; updateBal();
      el.textContent=`🎉 ${hits} BON${hits>1?'S':''} + ${bonusHit?'✅':''} BONUS ! +${fmt(gain)}€ (×${mult})`;
      el.className='result win';
    } else {
      el.textContent=`${hits} bon${hits>1?'s':''} — Pas de gain cette fois`;
      el.className='result lose';
    }
    el.style.display='block';

    await saveMoney(money);

    // Reset pour nouveau tirage
    setTimeout(()=>{
      selected.clear();
      document.querySelectorAll('.num-btn').forEach(b=>b.classList.remove('sel','hit','miss'));
      busy=false;
    },2500);
  }

  async function init(){
    const { data: _authData, error: _authError } = await sb.auth.getSession();
    if (_authError || !_authData.session) {
      await sb.auth.signOut().catch(() => {});
      window.location.href = 'index.html';
      return;
    }
    const session = _authData.session;
    currentUser=session.user;
    const {data}=await sb.from('game_stats').select('money').eq('user_id',currentUser.id).maybeSingle();
    money = data?.money || 0; localStorage.setItem("bd_money", money); updateBal();
    buildGrid();
    $('btnPlay').disabled=true;
  }

  document.addEventListener('gesturestart',e=>e.preventDefault());
  document.addEventListener('gesturechange',e=>e.preventDefault());

  async function saveMoney(amount) {
    const val = Math.floor(amount);
    localStorage.setItem('bd_money', val);
    if (!currentUser) return;
    for (let i = 0; i < 3; i++) {
      const { error } = await sb.from('game_stats').update({ money: val }).eq('user_id', currentUser.id);
      if (!error) return;
      await new Promise(r => setTimeout(r, 400));
    }
    console.warn('saveMoney: échec après 3 tentatives');
  }

  init();

</script>
</body>
</html>
