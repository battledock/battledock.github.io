<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Loterie - Battle Dock Casino</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * { margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent; }
    body { font-family:'Inter',sans-serif;background:linear-gradient(180deg,#450a0a,#7f1d1d,#991b1b);min-height:100vh;overflow:hidden;display:flex;flex-direction:column; }
    .container { max-width:500px;margin:0 auto;padding:6px;padding-bottom:120px;flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden; }
    .game-area { flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;overflow:hidden;min-height:0; }

    /* TABLE */
    .lot-table { background:linear-gradient(135deg,#1e293b,#0f172a);border:4px solid #fbbf24;border-radius:14px;padding:14px;box-shadow:0 8px 32px rgba(0,0,0,0.6);width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:12px;flex-shrink:0; }

    /* BOULES */
    .balls-row { display:flex;gap:8px;justify-content:center;align-items:center;min-height:64px; }
    .ball {
      width:52px;height:52px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-family:'Bebas Neue',sans-serif;font-size:20px;
      border:3px solid rgba(0,0,0,0.4);
      box-shadow:inset 0 -4px 8px rgba(0,0,0,0.3),inset 0 4px 8px rgba(255,255,255,0.15),0 4px 12px rgba(0,0,0,0.4);
      transition:all .3s;
      color:white;
      flex-shrink:0;
    }
    .ball.empty { background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.1);color:rgba(255,255,255,0.15);font-size:24px; }
    .ball.drawn { animation:ballPop .3s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes ballPop { 0%{transform:scale(0.3);opacity:0} 100%{transform:scale(1);opacity:1} }

    /* couleurs boules par numéro */
    .ball.b1,.ball.b2,.ball.b3,.ball.b4,.ball.b5,.ball.b6,.ball.b7,.ball.b8,.ball.b9 { background:linear-gradient(135deg,#cc1a1a,#991b1b); }
    .ball.b10,.ball.b11,.ball.b12,.ball.b13,.ball.b14,.ball.b15,.ball.b16,.ball.b17,.ball.b18,.ball.b19 { background:linear-gradient(135deg,#1565C0,#0d2d6e); }
    .ball.b20,.ball.b21,.ball.b22,.ball.b23,.ball.b24,.ball.b25,.ball.b26,.ball.b27,.ball.b28,.ball.b29 { background:linear-gradient(135deg,#15803d,#064e3b); }
    .ball.b30,.ball.b31,.ball.b32,.ball.b33,.ball.b34,.ball.b35,.ball.b36,.ball.b37,.ball.b38,.ball.b39 { background:linear-gradient(135deg,#7c3aed,#4c1d95); }
    .ball.b40,.ball.b41,.ball.b42,.ball.b43,.ball.b44,.ball.b45 { background:linear-gradient(135deg,#c2410c,#7c2d12); }

    .ball.bonus { background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#0f172a;border-color:rgba(0,0,0,0.5); }
    .ball-sep { color:rgba(255,255,255,0.3);font-size:18px;font-weight:700;flex-shrink:0; }

    /* GRILLE JOUEUR */
    .grid-label { font-size:9px;font-weight:700;color:rgba(255,255,255,0.35);letter-spacing:3px; }
    .num-grid { display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:300px; }
    .num-btn {
      width:36px;height:36px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-family:'Bebas Neue',sans-serif;font-size:13px;
      background:rgba(255,255,255,0.07);
      border:2px solid rgba(255,255,255,0.12);
      color:rgba(255,255,255,0.5);
      cursor:pointer;transition:all .15s;
    }
    .num-btn:active { transform:scale(0.9); }
    .num-btn.sel { background:#fbbf24;border-color:#0f172a;color:#0f172a;box-shadow:0 2px 8px rgba(251,191,36,0.4); }
    .num-btn.hit { background:#10b981;border-color:#0f172a;color:white;box-shadow:0 2px 8px rgba(16,185,129,0.5); }
    .num-btn.miss { opacity:0.3; }

    /* RÉSULTAT */
    .result { display:none;padding:7px 12px;border-radius:10px;text-align:center;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:1px;width:100%;animation:resultPop .3s; }
    @keyframes resultPop { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
    .result.win  { background:linear-gradient(135deg,#10b981,#059669);color:white;box-shadow:0 4px 14px rgba(16,185,129,0.4); }
    .result.lose { background:linear-gradient(135deg,#dc2626,#991b1b);color:white; }
    .result.push { background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:white; }

    /* CONTROLS */
    .controls { display:flex;flex-direction:column;gap:6px;width:100%;max-width:340px;flex-shrink:0; }
    .chips { display:flex;gap:6px;background:rgba(255,255,255,0.05);padding:6px;border-radius:8px;border:2px solid rgba(251,191,36,0.3); }
    .chip { flex:1;padding:7px 4px;border-radius:6px;text-align:center;cursor:pointer;transition:all .15s;font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:1px; }
    .chip.sel { background:#fbbf24;color:#0f172a; }
    .chip:not(.sel) { background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.4);border:1px solid rgba(251,191,36,0.2); }
    .spin-btn { width:100%;padding:10px;background:linear-gradient(135deg,#fbbf24,#f59e0b);border:none;border-radius:10px;color:#0f172a;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:1.5px;cursor:pointer;box-shadow:0 6px 20px rgba(251,191,36,0.5);transition:all .2s; }
    .spin-btn:active { transform:scale(0.98); }
    .spin-btn:disabled { opacity:0.4;cursor:not-allowed;box-shadow:none; }

    /* BOTTOM BAR */
    .bottom-bar { background:linear-gradient(135deg,#7f1d1d,#991b1b);border:2px solid rgba(251,191,36,0.5);border-radius:10px;padding:6px 10px;display:flex;justify-content:space-between;align-items:center;min-height:44px;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);max-width:480px;width:calc(100% - 20px);z-index:100;box-shadow:0 -4px 20px rgba(0,0,0,0.5); }
    .back-btn { background:rgba(251,191,36,0.2);border:2px solid rgba(251,191,36,0.5);color:#fbbf24;border-radius:6px;padding:4px 10px;font-weight:700;font-size:11px;cursor:pointer;white-space:nowrap; }
    .back-btn:active { transform:scale(0.95); }
    .game-title { font-family:'Bebas Neue',sans-serif;font-size:16px;color:#fbbf24;letter-spacing:1.5px; }
    .balance { background:white;color:#0f172a;padding:4px 10px;border-radius:6px;font-family:'Bebas Neue',sans-serif;font-size:14px;font-weight:700;white-space:nowrap; }
  </style>
</head>
<body>
<div class="container">
  <div class="game-area">

    <div class="lot-table">
      <!-- BOULES TIRÉES -->
      <div class="grid-label">TIRAGE</div>
      <div class="balls-row" id="drawnBalls">
        <div class="ball empty">○</div>
        <div class="ball empty">○</div>
        <div class="ball empty">○</div>
        <div class="ball empty">○</div>
        <div class="ball empty">○</div>
        <div class="ball-sep">+</div>
        <div class="ball bonus empty" id="bonusBall">★</div>
      </div>

      <!-- GRILLE JOUEUR -->
      <div class="grid-label">TES NUMÉROS — CHOISIS 5</div>
      <div class="num-grid" id="numGrid"></div>
    </div>

    <!-- CONTROLS -->
    <div class="controls">
      <div class="result" id="result"></div>
      <div class="chips">
        <div class="chip sel" id="c500"  onclick="setBet(500,'c500')">500€</div>
        <div class="chip"     id="c1000" onclick="setBet(1000,'c1000')">1K</div>
        <div class="chip"     id="c2000" onclick="setBet(2000,'c2000')">2K</div>
        <div class="chip"     id="c5000" onclick="setBet(5000,'c5000')">5K</div>
      </div>
      <button class="spin-btn" id="btnPlay" onclick="play()">TIRER — <span id="betLabel">500€</span></button>
    </div>

  </div>

  <div class="bottom-bar">
    <button class="back-btn" onclick="window.location.href='casino.html'">← Casino</button>
    <div class="game-title">🎱 LOTERIE</div>
    <div class="balance" id="balance">0€</div>
  </div>
</div>

<script>
  const supabaseUrl='https://drtsuhnbclhmgfjiykap.supabase.co';
  const supabaseKey='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
  const {createClient}=supabase;
  const sb=createClient(supabaseUrl,supabaseKey);

  const fmt=n=>Math.floor(n).toLocaleString('fr-FR');
  const $=id=>document.getElementById(id);

  let money=0,bet=500,currentUser=null,busy=false;
  let selected=new Set();
  const MAX_NUMS=45,PICK=5;

  // Paliers de gains (nombre de bons numéros + bonus)
  const PRIZES = {
    '5+1': 1000, '5+0': 200, '4+1': 50, '4+0': 20,
    '3+1': 10,   '3+0': 5,  '2+1': 3,  '1+1': 2
  };

  function setBet(val,id){
    bet=val;
    ['c500','c1000','c2000','c5000'].forEach(i=>$(i).classList.toggle('sel',i===id));
    $('betLabel').textContent=fmt(val)+'€';
  }

  function updateBal(){ $('balance').textContent=fmt(money)+'€'; }

  function buildGrid(){
    const grid=$('numGrid');
    grid.innerHTML='';
    for(let i=1;i<=MAX_NUMS;i++){
      const btn=document.createElement('div');
      btn.className='num-btn';
      btn.textContent=i;
      btn.id='n'+i;
      btn.onclick=()=>toggleNum(i);
      grid.appendChild(btn);
    }
  }

  function toggleNum(n){
    if(busy) return;
    const btn=$('n'+n);
    if(selected.has(n)){
      selected.delete(n);
      btn.classList.remove('sel');
    } else {
      if(selected.size>=PICK) return;
      selected.add(n);
      btn.classList.add('sel');
    }
    $('btnPlay').disabled=(selected.size!==PICK);
  }

  function randFrom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  function drawNumbers(){
    const pool=Array.from({length:MAX_NUMS},(_,i)=>i+1);
    const drawn=[];
    while(drawn.length<PICK){
      const idx=Math.floor(Math.random()*pool.length);
      drawn.push(pool.splice(idx,1)[0]);
    }
    const bonus=randFrom(pool);
    return {drawn,bonus};
  }

  function ballClass(n){
    if(n<=9)  return 'b'+n+' b1';
    if(n<=19) return 'b'+n+' b10';
    if(n<=29) return 'b'+n+' b20';
    if(n<=39) return 'b'+n+' b30';
    return 'b'+n+' b40';
  }

  async function play(){
    if(busy||selected.size!==PICK||money<bet) return;
    busy=true;
    $('btnPlay').disabled=true;
    money-=bet; updateBal();

    // Reset boules
    const row=$('drawnBalls');
    const slots=row.querySelectorAll('.ball:not(.bonus)');
    slots.forEach(b=>{b.className='ball empty';b.textContent='○';});
    $('bonusBall').className='ball bonus empty';$('bonusBall').textContent='★';
    $('result').style.display='none';
    // Reset couleurs grille
    selected.forEach(n=>{const b=$('n'+n);if(b){b.classList.remove('hit','miss');}});

    const {drawn,bonus}=drawNumbers();

    // Animer boules une par une
    for(let i=0;i<drawn.length;i++){
      await new Promise(r=>setTimeout(r,350));
      const slot=slots[i];
      slot.className=`ball ${ballClass(drawn[i])} drawn`;
      slot.textContent=drawn[i];
    }
    await new Promise(r=>setTimeout(r,400));
    $('bonusBall').className='ball bonus drawn';
    $('bonusBall').textContent=bonus;

    // Calculer score
    const hits=drawn.filter(n=>selected.has(n)).length;
    const bonusHit=selected.has(bonus)?1:0;
    const key=`${hits}+${bonusHit}`;
    const mult=PRIZES[key]||0;

    // Colorier la grille
    selected.forEach(n=>{
      const b=$('n'+n);if(!b) return;
      if(drawn.includes(n)||n===bonus) b.classList.add('hit');
      else b.classList.add('miss');
    });

    await new Promise(r=>setTimeout(r,300));

    // Afficher résultat
    const el=$('result');
    if(mult>0){
      const gain=Math.floor(bet*mult);
      money+=gain; updateBal();
      el.textContent=`🎉 ${hits} BON${hits>1?'S':''} + ${bonusHit?'✅':''} BONUS ! +${fmt(gain)}€ (×${mult})`;
      el.className='result win';
    } else {
      el.textContent=`${hits} bon${hits>1?'s':''} — Pas de gain cette fois`;
      el.className='result lose';
    }
    el.style.display='block';

    if(currentUser) await sb.from('game_stats').update({money:Math.floor(money)}).eq('user_id',currentUser.id);

    // Reset pour nouveau tirage
    setTimeout(()=>{
      selected.clear();
      document.querySelectorAll('.num-btn').forEach(b=>b.classList.remove('sel','hit','miss'));
      busy=false;
    },2500);
  }

  async function init(){
    const {data:{session}}=await sb.auth.getSession();
    if(!session){await new Promise(r=>setTimeout(r,1000));const {data:{session:s2}}=await sb.auth.getSession();if(!s2){window.location.href='index.html';return;}currentUser=s2.user;}
    else currentUser=session.user;
    const {data}=await sb.from('game_stats').select('money').eq('user_id',currentUser.id).maybeSingle();
    money=data?.money||0; updateBal();
    buildGrid();
    $('btnPlay').disabled=true;
  }

  document.addEventListener('gesturestart',e=>e.preventDefault());
  document.addEventListener('gesturechange',e=>e.preventDefault());
  init();
</script>
</body>
</html>
