<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tower - Battle Dock</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }

    body {
      font-family:'Inter',sans-serif;
      overflow:hidden; height:100vh;
      display:flex; flex-direction:column;
      background:linear-gradient(180deg,#87ceeb 0%,#b8e4f7 55%,#d4a574 55%,#8b7355 100%);
    }
    body.theme-night {
      background:linear-gradient(180deg,#0f2027 0%,#203a43 50%,#2c5364 100%);
    }

    /* DÉCO */
    .sun { position:fixed; top:24px; right:50px; z-index:1; width:56px; height:56px; border-radius:50%; pointer-events:none; animation:floatSun 6s ease-in-out infinite; }
    body.theme-day   .sun { background:radial-gradient(circle,#fde68a,#fbbf24); box-shadow:0 0 40px rgba(251,191,36,0.6); }
    body.theme-night .sun { background:radial-gradient(circle at 35% 35%,#fef9c3,#fde68a); box-shadow:0 0 20px rgba(254,249,195,0.2); width:44px; height:44px; }
    @keyframes floatSun { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }

    .cloud { position:fixed; z-index:1; animation:drift linear infinite; pointer-events:none; }
    .cloud1 { font-size:44px; animation-duration:28s; top:8px; left:-80px; }
    .cloud2 { font-size:28px; animation-duration:38s; animation-delay:-14s; top:26px; left:-60px; opacity:0.6; }
    body.theme-night .cloud { color:rgba(255,255,255,0.1); }
    @keyframes drift { 0%{transform:translateX(0)} 100%{transform:translateX(110vw)} }

    .star-dot { position:fixed; border-radius:50%; background:white; animation:starTwinkle ease-in-out infinite; pointer-events:none; }
    @keyframes starTwinkle { 0%,100%{opacity:0.9} 50%{opacity:0.2} }
    body.theme-day .star-dot { display:none; }

    /* HEADER */
    .header {
      position:relative; z-index:10; flex-shrink:0;
      padding:12px 16px; display:flex; align-items:center; gap:12px;
    }
    body.theme-day   .header { background:rgba(255,255,255,0.85); border-bottom:1px solid rgba(0,0,0,0.08); backdrop-filter:blur(10px); }
    body.theme-night .header { background:rgba(15,32,39,0.9); border-bottom:1px solid rgba(255,255,255,0.08); backdrop-filter:blur(10px); }
    .back-btn { background:#3b82f6; border:none; color:white; padding:7px 12px; border-radius:6px; cursor:pointer; font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:1px; }
    .header-title { font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:2px; flex:1; text-align:center; }
    body.theme-day   .header-title { color:#1a1a1a; }
    body.theme-night .header-title { color:white; }
    .header-score { font-family:'Bebas Neue',sans-serif; font-size:16px; color:#10b981; min-width:70px; text-align:right; }

    /* INFO BAR */
    .info-bar { position:relative; z-index:10; flex-shrink:0; display:flex; }
    body.theme-day   .info-bar { background:rgba(255,255,255,0.7); border-bottom:1px solid rgba(0,0,0,0.06); }
    body.theme-night .info-bar { background:rgba(15,32,39,0.7); border-bottom:1px solid rgba(255,255,255,0.06); }
    .info-item { flex:1; padding:8px; text-align:center; border-right:1px solid rgba(0,0,0,0.06); }
    .info-item:last-child { border-right:none; }
    .info-val { font-family:'Bebas Neue',sans-serif; font-size:17px; }
    body.theme-day   .info-val { color:#1a1a1a; }
    body.theme-night .info-val { color:white; }
    .info-lbl { font-size:9px; color:#9ca3af; text-transform:uppercase; letter-spacing:1px; font-weight:700; }

    /* CANVAS */
    .game-area { flex:1; position:relative; overflow:hidden; z-index:2; }
    #towerCanvas { position:absolute; top:0; left:0; width:100%; height:100%; }

    /* BOUTON */
    .tap-zone {
      position:fixed; bottom:0; left:0; right:0; z-index:20;
      padding:16px; display:flex; justify-content:center;
      background:linear-gradient(0deg,rgba(0,0,0,0.4) 0%,transparent 100%);
    }
    .tap-btn {
      width:240px; height:64px; border:none; border-radius:16px;
      font-family:'Bebas Neue',sans-serif; font-size:24px; letter-spacing:3px;
      cursor:pointer; transition:transform 0.1s;
      color:white; font-weight:900;
      background:linear-gradient(135deg,#cc2200,#991100);
      box-shadow:0 6px 24px rgba(204,34,0,0.5), inset 0 1px 0 rgba(255,255,255,0.15);
      border:2px solid rgba(255,255,255,0.15);
    }
    .tap-btn:active { transform:scale(0.95); }
    .tap-btn.ready {
      background:linear-gradient(135deg,#10b981,#059669);
      box-shadow:0 6px 24px rgba(16,185,129,0.5);
    }

    /* OVERLAY */
    .overlay { position:fixed; inset:0; z-index:50; background:rgba(0,0,0,0.7); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; }
    .overlay-card { max-width:320px; width:90%; border-radius:20px; padding:28px 22px; text-align:center; animation:popIn 0.4s cubic-bezier(0.34,1.56,0.64,1); background:white; }
    body.theme-night .overlay-card { background:rgba(25,35,45,0.98); border:1px solid rgba(255,255,255,0.1); }
    @keyframes popIn { from{transform:scale(0.7);opacity:0} to{transform:scale(1);opacity:1} }
    .oc-icon  { font-size:56px; margin-bottom:10px; }
    .oc-title { font-family:'Bebas Neue',sans-serif; font-size:28px; letter-spacing:2px; margin-bottom:4px; }
    body.theme-day   .oc-title { color:#1a1a1a; }
    body.theme-night .oc-title { color:white; }
    .oc-sub   { font-size:12px; color:#9ca3af; margin-bottom:12px; }
    .oc-gain  { font-family:'Bebas Neue',sans-serif; font-size:44px; color:#10b981; letter-spacing:1px; text-shadow:0 0 20px rgba(16,185,129,0.4); margin-bottom:4px; }
    .oc-mult  { font-size:12px; color:#9ca3af; margin-bottom:20px; }
    .oc-rules { background:rgba(0,0,0,0.04); border-radius:10px; padding:12px; text-align:left; margin-bottom:16px; }
    body.theme-night .oc-rules { background:rgba(255,255,255,0.05); }
    .oc-rule  { font-size:12px; color:#6b7280; padding:2px 0; display:flex; gap:8px; }
    .btn-play { width:100%; height:54px; border:none; border-radius:12px; background:linear-gradient(135deg,#cc2200,#991100); color:white; font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:2px; cursor:pointer; margin-bottom:8px; box-shadow:0 4px 16px rgba(204,34,0,0.3); }
    .btn-back { width:100%; height:42px; border-radius:12px; background:none; border:1px solid #e5e7eb; color:#6b7280; font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:1px; cursor:pointer; }

    /* LOCKED */
    .locked-card { max-width:320px; width:90%; border-radius:20px; padding:28px 22px; text-align:center; background:white; }
    body.theme-night .locked-card { background:rgba(25,35,45,0.98); border:1px solid rgba(255,255,255,0.1); }

    /* FLASH */
    .flash { position:fixed; top:20%; left:50%; transform:translateX(-50%); font-family:'Bebas Neue',sans-serif; font-size:28px; color:#fbbf24; text-shadow:0 0 16px rgba(251,191,36,0.8); pointer-events:none; z-index:30; white-space:nowrap; animation:flashUp 0.7s ease-out forwards; }
    @keyframes flashUp { 0%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)} 100%{opacity:0;transform:translateX(-50%) translateY(-50px) scale(1.3)} }
  </style>
</head>
<body class="theme-day">

  <div class="sun"></div>
  <div class="cloud cloud1">☁️</div>
  <div class="cloud cloud2">☁️</div>

  <div class="header">
    <button class="back-btn" onclick="window.location.href='travail.html'">← RETOUR</button>
    <div class="header-title">🏗️ Tower</div>
    <div class="header-score" id="headerScore">0€</div>
  </div>

  <div class="info-bar">
    <div class="info-item"><div class="info-val" id="infoFloors">0</div><div class="info-lbl">Étages</div></div>
    <div class="info-item"><div class="info-val" id="infoMult">×1.0</div><div class="info-lbl">Multiplicateur</div></div>
    <div class="info-item"><div class="info-val" id="infoGain">0€</div><div class="info-lbl">Gain estimé</div></div>
  </div>

  <div class="game-area">
    <canvas id="towerCanvas"></canvas>
  </div>

  <div class="tap-zone">
    <button class="tap-btn ready" id="tapBtn" onclick="handleTap()">▶ COMMENCER</button>
  </div>

  <!-- START -->
  <div class="overlay" id="startOverlay">
    <div class="overlay-card">
      <div class="oc-icon">📦</div>
      <div class="oc-title">Tower of Containers</div>
      <div class="oc-sub">Empile les conteneurs le plus haut possible !</div>
      <div class="oc-rules">
        <div class="oc-rule"><span>📦</span><span>Conteneur qui oscille → tape pour poser</span></div>
        <div class="oc-rule"><span>✂️</span><span>La partie qui dépasse tombe</span></div>
        <div class="oc-rule"><span>📈</span><span>Plus haut = plus d'argent</span></div>
        <div class="oc-rule"><span>💀</span><span>Game over si conteneur trop petit</span></div>
      </div>
      <button class="btn-play" onclick="startGame()">C'est parti !</button>
      <button class="btn-back" onclick="window.location.href='travail.html'">← Retour</button>
    </div>
  </div>

  <!-- RÉSULTAT -->
  <div class="overlay" id="resultOverlay" style="display:none">
    <div class="overlay-card">
      <div class="oc-icon" id="ocEmoji">📦</div>
      <div class="oc-title" id="ocTitle">Game Over</div>
      <div class="oc-sub" id="ocSub">0 étage</div>
      <div class="oc-gain" id="ocGain">+0€</div>
      <div class="oc-mult" id="ocMult"></div>
      <button class="btn-play" onclick="startGame()">▶ Rejouer</button>
      <button class="btn-back" onclick="window.location.href='travail.html'">← Retour au Port</button>
    </div>
  </div>

  <div class="flash" id="flashEl" style="display:none"></div>

  <script>
    const SB_URL = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const sb = createClient(SB_URL, SB_KEY);

    // Thème
    const h = new Date().getHours();
    if (h >= 18 || h < 7) document.body.classList.replace('theme-day','theme-night');

    // Étoiles
    for(let i=0;i<20;i++){
      const s=document.createElement('div'); s.className='star-dot';
      const sz=0.5+Math.random()*1.5;
      s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*50}%;animation-duration:${2+Math.random()*4}s;animation-delay:${Math.random()*4}s`;
      document.body.appendChild(s);
    }

    let currentUser=null, currentMoney=0, userLevel=1;

    const BLOCK_H = 32;
    const MIN_W   = 20;
    const COLORS  = [
      '#cc2200','#991100', // rouge conteneur (début)
      '#1d4ed8','#1e3a8a', // bleu
      '#15803d','#14532d', // vert
      '#b45309','#92400e', // or
      '#7c3aed','#5b21b6', // violet
    ];

    let canvas, ctx, W, H;
    let blocks   = [];   // tous les blocs en coordonnées monde
    let swinger  = null; // bloc en mouvement
    let animId   = null;
    let running  = false;
    let floor    = 0;
    let camY     = 0;    // offset caméra : monde → écran = monde_y - camY

    // ===== AUTH =====
    async function initAuth() {
      const {data:{session}} = await sb.auth.getSession();
      if(!session){window.location.href='index.html';return;}
      currentUser=session.user;
      const {data} = await sb.from('game_stats').select('money,level').eq('user_id',currentUser.id).maybeSingle();
      currentMoney=data?.money||0;
      userLevel=data?.level||1;
      document.getElementById('headerScore').textContent=currentMoney.toLocaleString('fr-FR')+'€';

      if(userLevel < 10){
        document.getElementById('startOverlay').innerHTML='';
        document.getElementById('startOverlay').innerHTML=`
          <div class="locked-card">
            <div class="oc-icon">🔒</div>
            <div class="oc-title">Niveau 10 requis</div>
            <div class="oc-sub" style="margin-bottom:20px">Tu es niveau ${userLevel}. Continue à travailler au port !</div>
            <button class="btn-play" onclick="window.location.href='travail.html'">← Retour</button>
          </div>`;
      }
    }

    // ===== CANVAS =====
    function initCanvas(){
      canvas=document.getElementById('towerCanvas');
      const area=document.querySelector('.game-area');
      W=area.clientWidth; H=area.clientHeight;
      canvas.width=W; canvas.height=H;
      ctx=canvas.getContext('2d');
    }

    // ===== DÉMARRER =====
    function startGame(){
      document.getElementById('startOverlay').style.display='none';
      document.getElementById('resultOverlay').style.display='none';
      document.getElementById('tapBtn').className='tap-btn';
      document.getElementById('tapBtn').textContent='🎯 POSER !';

      blocks=[]; floor=0;
      initCanvas();

      // Bloc sol au centre bas
      const groundW=200;
      const groundX=(W-groundW)/2;
      const groundY=H-50; // coordonnée monde = coordonnée écran au départ

      blocks.push({x:groundX, y:groundY, w:groundW, isGround:true});

      // La caméra commence à 0 — monde_y = écran_y au départ
      camY=0;

      running=true;
      spawnSwinger();
      cancelAnimationFrame(animId);
      loop();
      updateInfoBar();
    }

    // ===== SPAWN SWINGER =====
    function spawnSwinger(){
      const last=blocks[blocks.length-1];
      // Le swinger est positionné en coordonnées monde
      const swingerWorldY = last.y - BLOCK_H - 6;
      const speed=Math.min(2+floor*0.2, 8);
      swinger={
        worldX:-last.w,          // démarre hors écran gauche
        worldY:swingerWorldY,
        w:last.w, h:BLOCK_H,
        speed, dir:1,
        colorIdx: floor % (COLORS.length/2)
      };
    }

    // ===== BOUCLE =====
    function loop(){
      if(!running) return;
      swinger.worldX += swinger.speed * swinger.dir;
      if(swinger.worldX + swinger.w > W+20) swinger.dir=-1;
      if(swinger.worldX < -20)              swinger.dir=1;
      draw();
      animId=requestAnimationFrame(loop);
    }

    // ===== DESSIN =====
    function draw(){
      ctx.clearRect(0,0,W,H);

      // Tous les blocs
      [...blocks, swinger].forEach(b => {
        if(!b) return;
        const screenY = b.worldY - camY;
        if(screenY > H+50 || screenY < -BLOCK_H-50) return;
        const screenX = b.x !== undefined ? b.x : b.worldX;
        drawBlock(screenX, screenY, b.w, b.isGround ? '#6b7280' : getColor(b.colorIdx ?? floor), b===swinger);
      });
    }

    function getColor(idx){
      return COLORS[idx * 2] || COLORS[0];
    }

    function drawBlock(x, y, w, color, isMoving){
      const h = BLOCK_H;
      // Ombre
      ctx.fillStyle='rgba(0,0,0,0.2)';
      ctx.fillRect(x+4, y+4, w, h);
      // Corps
      ctx.fillStyle=color;
      ctx.fillRect(x, y, w, h);
      // Reflet haut
      ctx.fillStyle='rgba(255,255,255,0.15)';
      ctx.fillRect(x, y, w, 5);
      // Contour
      ctx.strokeStyle=isMoving?'rgba(255,255,255,0.5)':'rgba(255,255,255,0.2)';
      ctx.lineWidth=isMoving?2:1;
      ctx.strokeRect(x, y, w, h);
      // Striping vertical
      ctx.strokeStyle='rgba(0,0,0,0.2)'; ctx.lineWidth=1;
      for(let i=1;i<4;i++){
        const lx=x+(w/4)*i;
        ctx.beginPath(); ctx.moveTo(lx,y+4); ctx.lineTo(lx,y+h-2); ctx.stroke();
      }
      // Emoji 📦
      if(w>45){
        ctx.font=`${Math.min(h-8,16)}px serif`;
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillStyle='rgba(255,255,255,0.7)';
        ctx.fillText('📦', x+w/2, y+h/2);
      }
    }

    // ===== TAP =====
    function handleTap(){
      if(!running||!swinger) return;
      const last=blocks[blocks.length-1];

      const sL=swinger.worldX, sR=swinger.worldX+swinger.w;
      const bL=last.x,         bR=last.x+last.w;
      const left=Math.max(sL,bL), right=Math.min(sR,bR);
      const overlap=right-left;

      if(overlap<=0||overlap<MIN_W){ gameOver(); return; }

      const isPerfect=overlap/last.w > 0.92;
      const newX=isPerfect ? last.x : left;
      const newW=isPerfect ? last.w : overlap;

      // Poser le bloc en coordonnées monde
      const posedBlock={
        x:newX,
        worldY:swinger.worldY,
        w:newW,
        colorIdx:floor % (COLORS.length/2)
      };
      blocks.push(posedBlock);
      floor++;

      if(isPerfect) showFlash('PARFAIT ! 🎯');
      if(navigator.vibrate) navigator.vibrate(isPerfect?[40,20,40]:15);

      // Scroll caméra vers le haut pour garder la tour visible
      // On veut que le dernier bloc soit à 40% du haut de l'écran
      const targetScreenY = H * 0.4;
      const currentScreenY = posedBlock.worldY - camY;
      if(currentScreenY < targetScreenY + BLOCK_H*3){
        camY += (BLOCK_H + 6);
      }

      spawnSwinger();
      updateInfoBar();
    }

    // ===== INFO BAR =====
    function updateInfoBar(){
      const mult=(1+floor*0.1).toFixed(1);
      const gain=Math.floor(floor*20*parseFloat(mult));
      document.getElementById('infoFloors').textContent=floor;
      document.getElementById('infoMult').textContent='×'+mult;
      document.getElementById('infoGain').textContent=gain.toLocaleString('fr-FR')+'€';
    }

    // ===== GAME OVER =====
    async function gameOver(){
      running=false; cancelAnimationFrame(animId);
      const mult=parseFloat((1+floor*0.1).toFixed(1));
      const gain=Math.floor(floor*20*mult);
      if(navigator.vibrate) navigator.vibrate([80,40,150]);

      let emoji,title;
      if(floor===0)       {emoji='😅';title='Aïe !';}
      else if(floor<5)    {emoji='📦';title='Pas mal !';}
      else if(floor<10)   {emoji='🏗️';title='Belle tour !';}
      else if(floor<20)   {emoji='⭐';title='Impressionnant !';}
      else                {emoji='🏆';title='LÉGENDAIRE !';}

      document.getElementById('ocEmoji').textContent=emoji;
      document.getElementById('ocTitle').textContent=title;
      document.getElementById('ocSub').textContent=`${floor} étage${floor>1?'s':''} construits`;
      document.getElementById('ocGain').textContent=gain>0?`+${gain.toLocaleString('fr-FR')}€`:'0€';
      document.getElementById('ocMult').textContent=`×${mult} multiplicateur`;
      document.getElementById('resultOverlay').style.display='flex';

      if(gain>0 && currentUser){
        currentMoney+=gain;
        document.getElementById('headerScore').textContent=currentMoney.toLocaleString('fr-FR')+'€';
        await sb.from('game_stats').update({money:currentMoney}).eq('user_id',currentUser.id);
      }
    }

    // ===== FLASH =====
    function showFlash(txt){
      const el=document.createElement('div'); el.className='flash'; el.textContent=txt;
      document.body.appendChild(el); setTimeout(()=>el.remove(),700);
    }

    initAuth();
  </script>
</body>
</html>
