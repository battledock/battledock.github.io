<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tower - Battle Dock</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }

    body {
      font-family:'Inter',sans-serif;
      overflow:hidden; height:100dvh;
      display:flex; flex-direction:column;
      background:#1a1a1a;
    }

    /* FOND ENTREPÔT */
    .warehouse-bg {
      position:fixed; inset:0; z-index:0; pointer-events:none;
      overflow:hidden;
    }

    /* Sol béton */
    .floor-concrete {
      position:absolute; bottom:0; left:0; right:0; height:80px;
      background:linear-gradient(180deg,#2a2a2a,#1a1a1a);
      border-top:3px solid #333;
    }
    .floor-line {
      position:absolute; bottom:0; left:0; right:0;
      height:80px;
      background:repeating-linear-gradient(90deg, transparent 0px, transparent 60px, rgba(255,255,255,0.03) 60px, rgba(255,255,255,0.03) 62px);
    }

    /* Murs */
    .wall-left, .wall-right {
      position:absolute; top:0; width:40px; bottom:80px;
      background:linear-gradient(90deg,#1e1e1e,#252525);
    }
    .wall-left  { left:0; border-right:2px solid #333; }
    .wall-right { right:0; border-left:2px solid #333; }

    /* Plafond */
    .ceiling {
      position:absolute; top:0; left:0; right:0; height:60px;
      background:linear-gradient(180deg,#111,#1a1a1a);
      border-bottom:3px solid #2a2a2a;
    }

    /* Poutres métalliques */
    .beam {
      position:absolute; top:60px; left:0; right:0; height:12px;
      background:linear-gradient(180deg,#2d2d2d,#222);
      border-bottom:1px solid #333;
    }
    .beam-v {
      position:absolute; top:60px; bottom:80px; width:8px;
      background:linear-gradient(90deg,#222,#2d2d2d,#222);
    }

    /* Lampes industrielles */
    .lamp {
      position:absolute; top:52px;
      display:flex; flex-direction:column; align-items:center;
    }
    .lamp-body {
      width:28px; height:16px;
      background:linear-gradient(180deg,#3a3a3a,#2a2a2a);
      border-radius:4px 4px 0 0;
      border:1px solid #444;
    }
    .lamp-glow {
      width:0; height:0;
      border-left:40px solid transparent;
      border-right:40px solid transparent;
      border-top:60px solid rgba(255,220,80,0.06);
      margin-top:-1px;
    }
    .lamp-light {
      position:absolute; top:68px;
      width:80px; height:80px;
      background:radial-gradient(circle, rgba(255,220,80,0.12), transparent 70%);
      transform:translateX(-26px);
    }

    /* Rayures de danger sur le sol */
    .danger-stripe {
      position:absolute; bottom:0; left:0; right:0; height:12px;
      background:repeating-linear-gradient(90deg, #f59e0b 0px, #f59e0b 20px, #1a1a1a 20px, #1a1a1a 40px);
      opacity:0.4;
    }

    /* Grille de fond */
    .grid-bg {
      position:absolute; inset:0;
      background-image:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size:40px 40px;
    }

    /* HEADER */
    .header {
      position:relative; z-index:10; flex-shrink:0;
      padding:11px 16px; display:flex; align-items:center; gap:10px;
      background:rgba(0,0,0,0.7); backdrop-filter:blur(10px);
      border-bottom:1px solid #333;
    }
    .back-btn {
      background:#cc2200; border:none; color:white;
      padding:7px 12px; border-radius:6px; cursor:pointer;
      font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:1px;
    }
    .header-title {
      font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:3px;
      color:#f59e0b; flex:1; text-align:center;
      text-shadow:0 0 10px rgba(245,158,11,0.3);
    }
    .header-score {
      font-family:'Bebas Neue',sans-serif; font-size:16px; color:#10b981; min-width:70px; text-align:right;
    }

    /* INFO BAR */
    .info-bar {
      position:relative; z-index:10; flex-shrink:0;
      display:flex;
      background:rgba(0,0,0,0.6);
      border-bottom:1px solid #2a2a2a;
    }
    .info-item { flex:1; padding:8px 4px; text-align:center; border-right:1px solid #2a2a2a; }
    .info-item:last-child { border-right:none; }
    .info-val { font-family:'Bebas Neue',sans-serif; font-size:17px; color:#f59e0b; letter-spacing:0.5px; }
    .info-lbl { font-size:9px; color:#555; text-transform:uppercase; letter-spacing:1px; font-weight:700; }

    /* CANVAS */
    .game-area { flex:1; position:relative; overflow:hidden; z-index:2; }
    #towerCanvas { position:absolute; top:0; left:0; width:100%; height:100%; }

    /* BOUTON POSER — côté droit, centré verticalement */
    .tap-btn {
      position:fixed; right:12px; top:50%; transform:translateY(-50%);
      z-index:20;
      width:64px; height:64px; border-radius:50%; border:none;
      font-size:28px; cursor:pointer; transition:transform 0.1s;
      background:linear-gradient(135deg,#cc2200,#991100);
      box-shadow:0 4px 20px rgba(204,34,0,0.6), 0 0 0 3px rgba(204,34,0,0.2);
      display:flex; align-items:center; justify-content:center;
    }
    .tap-btn:active { transform:translateY(-50%) scale(0.9); }
    .tap-btn.ready {
      background:linear-gradient(135deg,#10b981,#059669);
      box-shadow:0 4px 20px rgba(16,185,129,0.6), 0 0 0 3px rgba(16,185,129,0.2);
      width:72px; height:72px;
      animation:btnPulse 1.5s ease-in-out infinite;
    }
    @keyframes btnPulse { 0%,100%{box-shadow:0 4px 20px rgba(16,185,129,0.6),0 0 0 3px rgba(16,185,129,0.2)} 50%{box-shadow:0 4px 30px rgba(16,185,129,0.9),0 0 0 8px rgba(16,185,129,0.1)} }

    /* OVERLAY */
    .overlay {
      position:fixed; inset:0; z-index:50;
      background:rgba(0,0,0,0.85); backdrop-filter:blur(8px);
      display:flex; align-items:center; justify-content:center;
    }
    .overlay-card {
      max-width:320px; width:90%; border-radius:20px; padding:28px 22px; text-align:center;
      background:#1e1e1e; border:1px solid #333;
      animation:popIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes popIn { from{transform:scale(0.7);opacity:0} to{transform:scale(1);opacity:1} }
    .oc-icon  { font-size:56px; margin-bottom:10px; }
    .oc-title { font-family:'Bebas Neue',sans-serif; font-size:28px; letter-spacing:2px; color:#f59e0b; margin-bottom:4px; }
    .oc-sub   { font-size:12px; color:#666; margin-bottom:12px; }
    .oc-gain  { font-family:'Bebas Neue',sans-serif; font-size:44px; color:#10b981; letter-spacing:1px; text-shadow:0 0 20px rgba(16,185,129,0.4); margin-bottom:4px; }
    .oc-mult  { font-size:12px; color:#555; margin-bottom:20px; }
    .oc-rules { background:rgba(255,255,255,0.03); border:1px solid #2a2a2a; border-radius:10px; padding:12px; text-align:left; margin-bottom:16px; }
    .oc-rule  { font-size:12px; color:#777; padding:2px 0; display:flex; gap:8px; }
    .btn-play { width:100%; height:54px; border:none; border-radius:12px; background:linear-gradient(135deg,#cc2200,#991100); color:white; font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:2px; cursor:pointer; margin-bottom:8px; box-shadow:0 4px 16px rgba(204,34,0,0.4); }
    .btn-back { width:100%; height:42px; border-radius:12px; background:none; border:1px solid #333; color:#555; font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:1px; cursor:pointer; }

    /* FLASH */
    .flash { position:fixed; top:20%; left:50%; transform:translateX(-50%); font-family:'Bebas Neue',sans-serif; font-size:28px; color:#f59e0b; text-shadow:0 0 16px rgba(245,158,11,0.8); pointer-events:none; z-index:30; white-space:nowrap; animation:flashUp 0.7s ease-out forwards; }
    @keyframes flashUp { 0%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)} 100%{opacity:0;transform:translateX(-50%) translateY(-50px) scale(1.3)} }
  </style>
</head>
<body>

  <!-- FOND ENTREPÔT -->
  <div class="warehouse-bg">
    <div class="grid-bg"></div>
    <div class="ceiling"></div>
    <div class="beam"></div>
    <div class="beam-v" style="left:25%"></div>
    <div class="beam-v" style="left:50%"></div>
    <div class="beam-v" style="left:75%"></div>
    <div class="wall-left"></div>
    <div class="wall-right"></div>
    <!-- Lampes -->
    <div class="lamp" style="left:20%"><div class="lamp-body"></div><div class="lamp-glow"></div><div class="lamp-light"></div></div>
    <div class="lamp" style="left:50%"><div class="lamp-body"></div><div class="lamp-glow"></div><div class="lamp-light"></div></div>
    <div class="lamp" style="left:80%"><div class="lamp-body"></div><div class="lamp-glow"></div><div class="lamp-light"></div></div>
    <div class="floor-concrete"></div>
    <div class="floor-line"></div>
    <div class="danger-stripe"></div>
  </div>

  <div class="header">
    <button class="back-btn" onclick="window.location.href='travail.html'">← RETOUR</button>
    <div class="header-title">🏗️ TOWER</div>
    <div class="header-score" id="headerScore">0€</div>
  </div>

  <div class="info-bar">
    <div class="info-item"><div class="info-val" id="infoFloors">0</div><div class="info-lbl">Étages</div></div>
    <div class="info-item"><div class="info-val" id="infoMult">×1.0</div><div class="info-lbl">Multiplicateur</div></div>
    <div class="info-item"><div class="info-val" id="infoGain">0€</div><div class="info-lbl">Gain estimé</div></div>
  </div>

  <div class="game-area">
    <canvas id="towerCanvas"></canvas>
  </div>

  <!-- BOUTON POSER -->
  <button class="tap-btn ready" id="tapBtn" onclick="handleTap()">▶</button>

  <!-- START -->
  <div class="overlay" id="startOverlay">
    <div class="overlay-card">
      <div class="oc-icon">📦</div>
      <div class="oc-title">Tower of Containers</div>
      <div class="oc-sub">Empile les conteneurs le plus haut possible !</div>
      <div class="oc-rules">
        <div class="oc-rule"><span>📦</span><span>Conteneur qui oscille → tape pour poser</span></div>
        <div class="oc-rule"><span>✂️</span><span>La partie qui dépasse tombe</span></div>
        <div class="oc-rule"><span>📈</span><span>Plus haut = plus d'argent</span></div>
        <div class="oc-rule"><span>💀</span><span>Game over si conteneur trop petit</span></div>
      </div>
      <button class="btn-play" onclick="startGame()">C'est parti !</button>
      <button class="btn-back" onclick="window.location.href='travail.html'">← Retour</button>
    </div>
  </div>

  <!-- RÉSULTAT -->
  <div class="overlay" id="resultOverlay" style="display:none">
    <div class="overlay-card">
      <div class="oc-icon" id="ocEmoji">📦</div>
      <div class="oc-title" id="ocTitle">Game Over</div>
      <div class="oc-sub" id="ocSub">0 étage</div>
      <div class="oc-gain" id="ocGain">+0€</div>
      <div class="oc-mult" id="ocMult"></div>
      <button class="btn-play" onclick="startGame()">▶ Rejouer</button>
      <button class="btn-back" onclick="window.location.href='travail.html'">← Retour</button>
    </div>
  </div>

  <script>
    const SB_URL = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const sb = createClient(SB_URL, SB_KEY);

    let currentUser=null, currentMoney=0, userLevel=1;

    // Conteneurs style industriel — couleurs métal/industriel
    const CONTAINER_COLORS = [
      { body:'#cc2200', top:'#e63300', stripe:'#991100', label:'MAERSK' },
      { body:'#1d4ed8', top:'#2563eb', stripe:'#1e3a8a', label:'MSC' },
      { body:'#15803d', top:'#16a34a', stripe:'#14532d', label:'CMA CGM' },
      { body:'#92400e', top:'#b45309', stripe:'#78350f', label:'EVERGREEN' },
      { body:'#6d28d9', top:'#7c3aed', stripe:'#5b21b6', label:'HAPAG' },
      { body:'#be123c', top:'#e11d48', stripe:'#9f1239', label:'COSCO' },
    ];

    const BLOCK_H = 36;
    const MIN_W   = 22;

    let canvas, ctx, W, H;
    let blocks  = [];
    let swinger = null;
    let animId  = null;
    let running = false;
    let floor   = 0;

    async function initAuth() {
      const {data:{session}} = await sb.auth.getSession();
      if(!session){window.location.href='index.html';return;}
      currentUser=session.user;
      const {data} = await sb.from('game_stats').select('money,level').eq('user_id',currentUser.id).maybeSingle();
      currentMoney=data?.money||0; userLevel=data?.level||1;
      document.getElementById('headerScore').textContent=currentMoney.toLocaleString('fr-FR')+'€';
      if(userLevel<10){
        document.getElementById('startOverlay').innerHTML=`
          <div class="overlay-card">
            <div class="oc-icon">🔒</div>
            <div class="oc-title">Niveau 10 requis</div>
            <div class="oc-sub" style="margin-bottom:20px">Tu es niveau ${userLevel}. Continue au port !</div>
            <button class="btn-play" onclick="window.location.href='travail.html'">← Retour</button>
          </div>`;
      }
    }

    function initCanvas(){
      canvas=document.getElementById('towerCanvas');
      const area=document.querySelector('.game-area');
      W=area.clientWidth; H=area.clientHeight;
      canvas.width=W; canvas.height=H;
      ctx=canvas.getContext('2d');
    }

    function startGame(){
      document.getElementById('startOverlay').style.display='none';
      document.getElementById('resultOverlay').style.display='none';
      const btn=document.getElementById('tapBtn');
      btn.className='tap-btn'; btn.textContent='🎯';
      blocks=[]; floor=0;
      initCanvas();
      const gW=Math.min(W*0.55, 220);
      const gX=(W-gW)/2;
      const gY=H-90;
      blocks.push({x:gX, y:gY, w:gW, colorIdx:-1, isGround:true});
      running=true;
      spawnSwinger();
      cancelAnimationFrame(animId);
      loop();
      updateInfoBar();
    }

    function spawnSwinger(){
      const last=blocks[blocks.length-1];
      const speed=Math.min(1.8+floor*0.18, 7.5);
      let sy=last.y-BLOCK_H-5;
      if(sy < H*0.22){
        const shift=Math.round(H*0.22-sy)+BLOCK_H+5;
        blocks.forEach(b=>b.y+=shift);
        sy=blocks[blocks.length-1].y-BLOCK_H-5;
      }
      swinger={x:-last.w, y:sy, w:last.w, speed, dir:1, colorIdx:floor%CONTAINER_COLORS.length};
    }

    function loop(){
      if(!running) return;
      swinger.x+=swinger.speed*swinger.dir;
      if(swinger.x+swinger.w>W+20) swinger.dir=-1;
      if(swinger.x<-20)            swinger.dir=1;
      draw();
      animId=requestAnimationFrame(loop);
    }

    function draw(){
      ctx.clearRect(0,0,W,H);
      blocks.forEach(b=>drawContainer(b.x,b.y,b.w,b.colorIdx,b.isGround,false));
      if(swinger) drawContainer(swinger.x,swinger.y,swinger.w,swinger.colorIdx,false,true);
    }

    function drawContainer(x,y,w,colorIdx,isGround,isMoving){
      const h=BLOCK_H;
      if(isGround){
        // Palette de béton pour le sol
        ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.fillRect(x+4,y+4,w,h);
        ctx.fillStyle='#3a3a3a'; ctx.fillRect(x,y,w,h);
        ctx.fillStyle='rgba(255,255,255,0.05)'; ctx.fillRect(x,y,w,4);
        ctx.strokeStyle='#555'; ctx.lineWidth=1; ctx.strokeRect(x,y,w,h);
        ctx.font='bold 11px Inter'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillStyle='rgba(255,255,255,0.2)'; ctx.fillText('⬛ BASE', x+w/2, y+h/2);
        return;
      }

      const col=CONTAINER_COLORS[colorIdx]||CONTAINER_COLORS[0];

      // Ombre portée
      ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fillRect(x+5,y+5,w,h);

      // Corps principal
      ctx.fillStyle=col.body; ctx.fillRect(x,y,w,h);

      // Face supérieure (effet 3D léger)
      ctx.fillStyle=col.top; ctx.fillRect(x,y,w,5);

      // Bande inférieure
      ctx.fillStyle=col.stripe; ctx.fillRect(x,y+h-5,w,5);

      // Striping vertical (rainures)
      ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.lineWidth=1.5;
      const stripeCount=Math.max(2, Math.floor(w/28));
      for(let i=1;i<stripeCount;i++){
        const lx=x+(w/stripeCount)*i;
        ctx.beginPath(); ctx.moveTo(lx,y+6); ctx.lineTo(lx,y+h-6); ctx.stroke();
      }

      // Reflet métallique
      ctx.fillStyle='rgba(255,255,255,0.08)'; ctx.fillRect(x+2,y+6,w-4,3);

      // Contour
      ctx.strokeStyle=isMoving?'rgba(255,255,255,0.7)':'rgba(255,255,255,0.15)';
      ctx.lineWidth=isMoving?2:1; ctx.strokeRect(x,y,w,h);

      // Label compagnie maritime
      if(w>60){
        ctx.font=`bold ${Math.min(9,Math.floor(h*0.28))}px Inter`;
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillStyle='rgba(255,255,255,0.55)';
        ctx.fillText(col.label, x+w/2, y+h/2);
      }

      // Coins de verrouillage
      if(w>40){
        ctx.fillStyle='rgba(0,0,0,0.4)';
        [[x+4,y+4],[x+w-10,y+4],[x+4,y+h-10],[x+w-10,y+h-10]].forEach(([cx,cy])=>{
          ctx.fillRect(cx,cy,6,6);
        });
        ctx.fillStyle='rgba(255,255,255,0.3)';
        [[x+4,y+4],[x+w-10,y+4],[x+4,y+h-10],[x+w-10,y+h-10]].forEach(([cx,cy])=>{
          ctx.fillRect(cx+1,cy+1,4,4);
        });
      }
    }

    function handleTap(){
      if(!running||!swinger) return;
      const last=blocks[blocks.length-1];
      const left=Math.max(swinger.x,last.x);
      const right=Math.min(swinger.x+swinger.w,last.x+last.w);
      const overlap=right-left;
      if(overlap<=0||overlap<MIN_W){gameOver();return;}
      const perfect=overlap/last.w>0.92;
      blocks.push({
        x:perfect?last.x:left,
        y:last.y-BLOCK_H-5,
        w:perfect?last.w:overlap,
        colorIdx:swinger.colorIdx
      });
      floor++;
      if(perfect) showFlash('PARFAIT ! 🎯');
      if(navigator.vibrate) navigator.vibrate(perfect?[40,20,40]:15);
      spawnSwinger();
      updateInfoBar();
    }

    function updateInfoBar(){
      const mult=(1+floor*0.1).toFixed(1);
      const gain=Math.floor(floor*20*parseFloat(mult));
      document.getElementById('infoFloors').textContent=floor;
      document.getElementById('infoMult').textContent='×'+mult;
      document.getElementById('infoGain').textContent=gain.toLocaleString('fr-FR')+'€';
    }

    async function gameOver(){
      running=false; cancelAnimationFrame(animId);
      const mult=parseFloat((1+floor*0.1).toFixed(1));
      const gain=Math.floor(floor*20*mult);
      if(navigator.vibrate) navigator.vibrate([80,40,150]);
      const t=floor===0?0:floor<5?1:floor<10?2:floor<20?3:4;
      const titles=[['😅','Aïe !'],['📦','Pas mal !'],['🏗️','Belle tour !'],['⭐','Impressionnant !'],['🏆','LÉGENDAIRE !']];
      document.getElementById('ocEmoji').textContent=titles[t][0];
      document.getElementById('ocTitle').textContent=titles[t][1];
      document.getElementById('ocSub').textContent=`${floor} étage${floor>1?'s':''} construits`;
      document.getElementById('ocGain').textContent=gain>0?`+${gain.toLocaleString('fr-FR')}€`:'0€';
      document.getElementById('ocMult').textContent=`×${mult} multiplicateur`;
      document.getElementById('resultOverlay').style.display='flex';
      if(gain>0&&currentUser){
        currentMoney+=gain;
        document.getElementById('headerScore').textContent=currentMoney.toLocaleString('fr-FR')+'€';
        await sb.from('game_stats').update({money:currentMoney}).eq('user_id',currentUser.id);
      }
    }

    function showFlash(txt){
      const el=document.createElement('div'); el.className='flash'; el.textContent=txt;
      document.body.appendChild(el); setTimeout(()=>el.remove(),700);
    }

    initAuth();
  </script>
</body>
</html>
