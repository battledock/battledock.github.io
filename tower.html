<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tower - Battle Dock</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
    body { font-family:'Inter',sans-serif; overflow:hidden; height:100dvh; display:flex; flex-direction:column; background:#111; }

    /* ── ENTREPÔT ── */
    .wh {
      position:fixed; inset:0; z-index:0; pointer-events:none;
      background:linear-gradient(180deg,#0d0d0d 0%,#141414 60%,#1a1a1a 100%);
    }
    /* Mur du fond — briques */
    .wh-wall {
      position:absolute; top:0; left:0; right:0; bottom:70px;
      background:
        repeating-linear-gradient(0deg, transparent, transparent 28px, rgba(255,255,255,0.025) 28px, rgba(255,255,255,0.025) 30px),
        repeating-linear-gradient(90deg, transparent, transparent 58px, rgba(255,255,255,0.02) 58px, rgba(255,255,255,0.02) 60px);
    }
    /* Poutres plafond */
    .wh-beam-h { position:absolute; left:0; right:0; height:10px; background:linear-gradient(180deg,#222,#1a1a1a); border-bottom:1px solid #2a2a2a; }
    .wh-beam-v { position:absolute; top:0; bottom:70px; width:7px; background:linear-gradient(90deg,#1e1e1e,#282828,#1e1e1e); }
    /* Sol */
    .wh-floor { position:absolute; bottom:0; left:0; right:0; height:70px; background:linear-gradient(180deg,#222,#181818); border-top:3px solid #2d2d2d; }
    .wh-floor-lines { position:absolute; bottom:0; left:0; right:0; height:70px; background:repeating-linear-gradient(90deg,transparent,transparent 59px,rgba(255,255,255,0.04) 59px,rgba(255,255,255,0.04) 60px); }
    .wh-danger { position:absolute; bottom:0; left:0; right:0; height:10px; background:repeating-linear-gradient(90deg,#f59e0b,#f59e0b 18px,#1a1a1a 18px,#1a1a1a 36px); opacity:0.5; }
    /* Lampes */
    .lamp { position:absolute; top:0; display:flex; flex-direction:column; align-items:center; pointer-events:none; }
    .lamp-body { width:24px; height:14px; background:linear-gradient(180deg,#333,#222); border-radius:3px 3px 0 0; border:1px solid #3a3a3a; }
    .lamp-cone { width:0; height:0; border-left:50px solid transparent; border-right:50px solid transparent; border-top:70px solid rgba(255,215,60,0.07); margin-top:0; }
    .lamp-spot { position:absolute; top:84px; width:100px; height:100px; background:radial-gradient(ellipse, rgba(255,215,60,0.1), transparent 70%); transform:translateX(-38px); }

    /* ── HEADER ── */
    .header { position:relative; z-index:10; flex-shrink:0; padding:11px 14px; display:flex; align-items:center; gap:10px; background:rgba(0,0,0,0.75); backdrop-filter:blur(10px); border-bottom:1px solid #2a2a2a; }
    .back-btn { background:#cc2200; border:none; color:white; padding:7px 12px; border-radius:6px; cursor:pointer; font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:1px; transition:opacity .15s; }
    .back-btn:active { opacity:.8; }
    .header-title { font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:3px; color:#f59e0b; flex:1; text-align:center; }
    .header-score { font-family:'Bebas Neue',sans-serif; font-size:15px; color:#10b981; min-width:70px; text-align:right; }

    /* ── INFO BAR ── */
    .info-bar { position:relative; z-index:10; flex-shrink:0; display:flex; background:rgba(0,0,0,0.6); border-bottom:1px solid #222; }
    .info-item { flex:1; padding:7px 4px; text-align:center; border-right:1px solid #222; }
    .info-item:last-child { border-right:none; }
    .info-val { font-family:'Bebas Neue',sans-serif; font-size:16px; color:#f59e0b; }
    .info-lbl { font-size:8px; color:#444; text-transform:uppercase; letter-spacing:1px; font-weight:700; }

    /* ── CANVAS ── */
    .game-area { flex:1; position:relative; overflow:hidden; z-index:2; }
    #towerCanvas { position:absolute; top:0; left:0; }

    /* ── BOUTON ROND CÔTÉ DROIT ── */
    .tap-btn {
      position:fixed; right:14px; top:50%; transform:translateY(-50%);
      z-index:20; width:60px; height:60px; border-radius:50%; border:none;
      cursor:pointer; transition:transform .1s;
      display:flex; align-items:center; justify-content:center;
      font-size:22px;
    }
    .tap-btn:active { transform:translateY(-50%) scale(0.9); }
    .tap-btn.go {
      background:linear-gradient(135deg,#10b981,#059669);
      box-shadow:0 4px 20px rgba(16,185,129,0.5), 0 0 0 3px rgba(16,185,129,0.15);
      animation:goPulse 1.5s ease-in-out infinite;
    }
    .tap-btn.play {
      background:linear-gradient(135deg,#cc2200,#991100);
      box-shadow:0 4px 20px rgba(204,34,0,0.5);
    }
    @keyframes goPulse { 0%,100%{box-shadow:0 4px 20px rgba(16,185,129,0.5),0 0 0 3px rgba(16,185,129,0.15)} 50%{box-shadow:0 4px 28px rgba(16,185,129,0.8),0 0 0 8px rgba(16,185,129,0.08)} }

    /* ── OVERLAYS ── */
    .overlay { position:fixed; inset:0; z-index:50; background:rgba(0,0,0,0.85); backdrop-filter:blur(8px); display:flex; align-items:center; justify-content:center; }
    .ocard { max-width:310px; width:90%; border-radius:20px; padding:26px 20px; text-align:center; background:#1c1c1c; border:1px solid #2d2d2d; animation:popIn .4s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes popIn { from{transform:scale(0.7);opacity:0} to{transform:scale(1);opacity:1} }
    .ocard-icon  { font-size:54px; margin-bottom:10px; }
    .ocard-title { font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:2px; color:#f59e0b; margin-bottom:4px; }
    .ocard-sub   { font-size:12px; color:#555; margin-bottom:10px; }
    .ocard-gain  { font-family:'Bebas Neue',sans-serif; font-size:42px; color:#10b981; text-shadow:0 0 16px rgba(16,185,129,0.4); margin-bottom:3px; }
    .ocard-mult  { font-size:11px; color:#444; margin-bottom:18px; }
    .ocard-rules { background:rgba(255,255,255,0.03); border:1px solid #2a2a2a; border-radius:10px; padding:12px; text-align:left; margin-bottom:14px; }
    .ocard-rule  { font-size:11px; color:#666; padding:2px 0; display:flex; gap:8px; }
    .btn-start { width:100%; height:52px; border:none; border-radius:12px; background:linear-gradient(135deg,#cc2200,#991100); color:white; font-family:'Bebas Neue',sans-serif; font-size:19px; letter-spacing:2px; cursor:pointer; margin-bottom:8px; box-shadow:0 4px 16px rgba(204,34,0,0.4); }
    .btn-back  { width:100%; height:40px; border-radius:12px; background:none; border:1px solid #2a2a2a; color:#444; font-family:'Bebas Neue',sans-serif; font-size:12px; letter-spacing:1px; cursor:pointer; }

    /* ── FLASH ── */
    .flash { position:fixed; top:22%; left:50%; transform:translateX(-50%); font-family:'Bebas Neue',sans-serif; font-size:26px; color:#f59e0b; text-shadow:0 0 14px rgba(245,158,11,0.9); pointer-events:none; z-index:30; white-space:nowrap; animation:flashUp .7s ease-out forwards; }
    @keyframes flashUp { 0%{opacity:1;transform:translateX(-50%) translateY(0) scale(1.1)} 100%{opacity:0;transform:translateX(-50%) translateY(-50px) scale(1.3)} }
  </style>
</head>
<body>

  <!-- ENTREPÔT -->
  <div class="wh">
    <div class="wh-wall"></div>
    <div class="wh-beam-h" style="top:0"></div>
    <div class="wh-beam-h" style="top:10px;opacity:.5"></div>
    <div class="wh-beam-v" style="left:0"></div>
    <div class="wh-beam-v" style="left:25%;margin-left:-3px"></div>
    <div class="wh-beam-v" style="left:50%;margin-left:-3px"></div>
    <div class="wh-beam-v" style="left:75%;margin-left:-3px"></div>
    <div class="wh-beam-v" style="right:0"></div>
    <div class="lamp" style="left:calc(12.5% - 12px)"><div class="lamp-body"></div><div class="lamp-cone"></div><div class="lamp-spot"></div></div>
    <div class="lamp" style="left:calc(37.5% - 12px)"><div class="lamp-body"></div><div class="lamp-cone"></div><div class="lamp-spot"></div></div>
    <div class="lamp" style="left:calc(62.5% - 12px)"><div class="lamp-body"></div><div class="lamp-cone"></div><div class="lamp-spot"></div></div>
    <div class="lamp" style="left:calc(87.5% - 12px)"><div class="lamp-body"></div><div class="lamp-cone"></div><div class="lamp-spot"></div></div>
    <div class="wh-floor"></div>
    <div class="wh-floor-lines"></div>
    <div class="wh-danger"></div>
  </div>

  <div class="header">
    <button class="back-btn" onclick="window.location.href='travail.html'">← RETOUR</button>
    <div class="header-title">🏗️ TOWER</div>
    <div class="header-score" id="headerScore">--</div>
  </div>

  <div class="info-bar">
    <div class="info-item"><div class="info-val" id="infoFloors">0</div><div class="info-lbl">Étages</div></div>
    <div class="info-item"><div class="info-val" id="infoMult">×1.0</div><div class="info-lbl">Multiplicateur</div></div>
    <div class="info-item"><div class="info-val" id="infoGain">0€</div><div class="info-lbl">Gain estimé</div></div>
  </div>

  <div class="game-area"><canvas id="towerCanvas"></canvas></div>

  <button class="tap-btn go" id="tapBtn" onclick="handleTap()">▶</button>

  <!-- START -->
  <div class="overlay" id="startOverlay">
    <div class="ocard">
      <div class="ocard-icon">📦</div>
      <div class="ocard-title">Tower of Containers</div>
      <div class="ocard-sub">Entrepôt du Port Maritime</div>
      <div class="ocard-rules">
        <div class="ocard-rule"><span>📦</span><span>Conteneur qui oscille → bouton ▶ pour poser</span></div>
        <div class="ocard-rule"><span>✂️</span><span>La partie qui dépasse tombe et rétrécit</span></div>
        <div class="ocard-rule"><span>📈</span><span>Plus haut = multiplicateur + argent</span></div>
        <div class="ocard-rule"><span>💀</span><span>Game over si conteneur trop petit</span></div>
      </div>
      <button class="btn-start" onclick="startGame()">C'est parti !</button>
      <button class="btn-back" onclick="window.location.href='travail.html'">← Retour</button>
    </div>
  </div>

  <!-- RÉSULTAT -->
  <div class="overlay" id="resultOverlay" style="display:none">
    <div class="ocard">
      <div class="ocard-icon" id="ocIcon">📦</div>
      <div class="ocard-title" id="ocTitle">Game Over</div>
      <div class="ocard-sub" id="ocSub">0 étage</div>
      <div class="ocard-gain" id="ocGain">+0€</div>
      <div class="ocard-mult" id="ocMult"></div>
      <button class="btn-start" onclick="startGame()">▶ Rejouer</button>
      <button class="btn-back" onclick="window.location.href='travail.html'">← Retour</button>
    </div>
  </div>

  <script>
    const SB_URL = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const sb = createClient(SB_URL, SB_KEY);

    let currentUser = null;

    // Conteneurs maritimes — style industriel
    const CONTAINERS = [
      { body:'#cc2200', hi:'#e63300', lo:'#881800', label:'MAERSK' },
      { body:'#1d4ed8', hi:'#2563eb', lo:'#1e3a8a', label:'MSC' },
      { body:'#15803d', hi:'#16a34a', lo:'#14532d', label:'CMA CGM' },
      { body:'#b45309', hi:'#d97706', lo:'#92400e', label:'EVERGREEN' },
      { body:'#7c3aed', hi:'#8b5cf6', lo:'#5b21b6', label:'HAPAG' },
      { body:'#be123c', hi:'#e11d48', lo:'#9f1239', label:'COSCO' },
    ];

    const BH = 38, MIN_W = 22;
    let canvas, ctx, W, H;
    let blocks = [], swinger = null, animId = null, running = false, floor = 0;

    // ── AUTH ──
    async function initAuth() {
      const { data:{ session } } = await sb.auth.getSession();
      if (!session) { window.location.href = 'index.html'; return; }
      currentUser = session.user;
      const { data } = await sb.from('game_stats').select('money,level').eq('user_id', currentUser.id).maybeSingle();
      document.getElementById('headerScore').textContent = (data?.money||0).toLocaleString('fr-FR') + '€';
      if ((data?.level||1) < 10) {
        document.getElementById('startOverlay').innerHTML = `<div class="ocard"><div class="ocard-icon">🔒</div><div class="ocard-title">Niveau 10 requis</div><div class="ocard-sub" style="margin-bottom:20px">Tu es niveau ${data?.level||1}. Continue au port !</div><button class="btn-start" onclick="window.location.href='travail.html'">← Retour</button></div>`;
      }
    }

    // ── CANVAS ──
    function initCanvas() {
      canvas = document.getElementById('towerCanvas');
      const a = document.querySelector('.game-area');
      W = a.clientWidth; H = a.clientHeight;
      canvas.width = W; canvas.height = H;
      canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
      ctx = canvas.getContext('2d');
    }

    // ── START ──
    function startGame() {
      document.getElementById('startOverlay').style.display = 'none';
      document.getElementById('resultOverlay').style.display = 'none';
      const btn = document.getElementById('tapBtn');
      btn.className = 'tap-btn play'; btn.textContent = '🎯';
      blocks = []; floor = 0;
      initCanvas();
      const gW = Math.min(W * 0.55, 210);
      blocks.push({ x:(W-gW)/2, y:H-80, w:gW, ci:-1, ground:true });
      running = true;
      spawn();
      cancelAnimationFrame(animId);
      loop();
      updateBar();
    }

    // ── SPAWN ──
    function spawn() {
      const last = blocks[blocks.length-1];
      const speed = Math.min(1.8 + floor*0.18, 7.5);
      let sy = last.y - BH - 5;
      if (sy < H * 0.20) {
        const shift = Math.round(H * 0.20 - sy) + BH + 10;
        blocks.forEach(b => b.y += shift);
        sy = blocks[blocks.length-1].y - BH - 5;
      }
      swinger = { x:-last.w, y:sy, w:last.w, speed, dir:1, ci:floor % CONTAINERS.length };
    }

    // ── LOOP ──
    function loop() {
      if (!running) return;
      swinger.x += swinger.speed * swinger.dir;
      if (swinger.x + swinger.w > W + 20) swinger.dir = -1;
      if (swinger.x < -20)                swinger.dir = 1;
      draw();
      animId = requestAnimationFrame(loop);
    }

    // ── DRAW ──
    function draw() {
      ctx.clearRect(0, 0, W, H);
      blocks.forEach(b => drawBlock(b));
      if (swinger) drawBlock(swinger, true);
    }

    function drawBlock(b, moving) {
      const x = b.x, y = b.y, w = b.w, h = BH;
      if (b.ground) {
        ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(x+4, y+4, w, h);
        ctx.fillStyle = '#2d2d2d'; ctx.fillRect(x, y, w, h);
        ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.fillRect(x, y, w, 4);
        ctx.strokeStyle = '#3a3a3a'; ctx.lineWidth = 1; ctx.strokeRect(x, y, w, h);
        ctx.font = 'bold 10px Inter'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillText('SOL', x+w/2, y+h/2);
        return;
      }
      const col = CONTAINERS[b.ci] || CONTAINERS[0];
      // Ombre
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(x+5, y+5, w, h);
      // Corps
      ctx.fillStyle = col.body; ctx.fillRect(x, y, w, h);
      // Bande haute
      ctx.fillStyle = col.hi; ctx.fillRect(x, y, w, 5);
      // Bande basse
      ctx.fillStyle = col.lo; ctx.fillRect(x, y+h-5, w, 5);
      // Rainures verticales
      ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1.5;
      const n = Math.max(2, Math.floor(w/26));
      for (let i=1; i<n; i++) { const lx=x+(w/n)*i; ctx.beginPath(); ctx.moveTo(lx,y+6); ctx.lineTo(lx,y+h-6); ctx.stroke(); }
      // Reflet
      ctx.fillStyle = 'rgba(255,255,255,0.07)'; ctx.fillRect(x+2, y+6, w-4, 3);
      // Contour
      ctx.strokeStyle = moving ? 'rgba(255,255,255,0.7)' : 'rgba(255,255,255,0.12)';
      ctx.lineWidth = moving ? 2 : 1; ctx.strokeRect(x, y, w, h);
      // Label
      if (w > 55) {
        ctx.font = `bold ${Math.min(9,Math.floor(h*0.26))}px Inter`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.fillText(col.label, x+w/2, y+h/2);
      }
      // Coins
      if (w > 40) {
        [[x+3,y+3],[x+w-9,y+3],[x+3,y+h-9],[x+w-9,y+h-9]].forEach(([cx,cy])=>{
          ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(cx,cy,6,6);
          ctx.fillStyle='rgba(255,255,255,0.25)'; ctx.fillRect(cx+1,cy+1,4,4);
        });
      }
    }

    // ── TAP ──
    function handleTap() {
      if (!running || !swinger) return;
      const last = blocks[blocks.length-1];
      const left = Math.max(swinger.x, last.x);
      const right = Math.min(swinger.x+swinger.w, last.x+last.w);
      const overlap = right - left;
      if (overlap <= 0 || overlap < MIN_W) { gameOver(); return; }
      const perfect = overlap / last.w > 0.92;
      blocks.push({ x:perfect?last.x:left, y:last.y-BH-5, w:perfect?last.w:overlap, ci:swinger.ci });
      floor++;
      if (perfect) showFlash('PARFAIT ! 🎯');
      if (navigator.vibrate) navigator.vibrate(perfect ? [40,20,40] : 15);
      spawn();
      updateBar();
    }

    function updateBar() {
      const mult = (1+floor*0.1).toFixed(1);
      const gain = Math.floor(floor*20*parseFloat(mult));
      document.getElementById('infoFloors').textContent = floor;
      document.getElementById('infoMult').textContent = '×'+mult;
      document.getElementById('infoGain').textContent = gain.toLocaleString('fr-FR')+'€';
    }

    // ── GAME OVER — relit la BD avant de sauver ──
    async function gameOver() {
      running = false; cancelAnimationFrame(animId);
      if (navigator.vibrate) navigator.vibrate([80,40,150]);

      const mult = parseFloat((1+floor*0.1).toFixed(1));
      const gain = Math.floor(floor*20*mult);
      const t = floor===0?0:floor<5?1:floor<10?2:floor<20?3:4;
      const titles = [['😅','Aïe !'],['📦','Pas mal !'],['🏗️','Belle tour !'],['⭐','Impressionnant !'],['🏆','LÉGENDAIRE !']];
      document.getElementById('ocIcon').textContent = titles[t][0];
      document.getElementById('ocTitle').textContent = titles[t][1];
      document.getElementById('ocSub').textContent = `${floor} étage${floor>1?'s':''} construits`;
      document.getElementById('ocGain').textContent = gain>0 ? `+${gain.toLocaleString('fr-FR')}€` : '0€';
      document.getElementById('ocMult').textContent = `×${mult} multiplicateur`;
      document.getElementById('resultOverlay').style.display = 'flex';

      if (gain > 0 && currentUser) {
        // Relire le solde depuis la BD avant d'ajouter
        const { data: fresh } = await sb.from('game_stats').select('money').eq('user_id', currentUser.id).maybeSingle();
        const newMoney = (fresh?.money || 0) + gain;
        await sb.from('game_stats').update({ money: newMoney }).eq('user_id', currentUser.id);
        document.getElementById('headerScore').textContent = newMoney.toLocaleString('fr-FR') + '€';
      }
    }

    function showFlash(txt) {
      const el = document.createElement('div'); el.className = 'flash'; el.textContent = txt;
      document.body.appendChild(el); setTimeout(()=>el.remove(), 700);
    }

    initAuth();
  </script>
</body>
</html>
