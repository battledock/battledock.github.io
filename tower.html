<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tower - Battle Dock</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
    html, body { height:100%; overflow:hidden; }

    body {
      font-family:'Inter',sans-serif;
      background:#0d0d0d;
      display:flex; flex-direction:column;
      height:100dvh;
    }

    /* ── SVG ENTREPÔT ── */
    .wh-svg {
      position:fixed; inset:0; z-index:0; pointer-events:none;
      width:100%; height:100%;
    }

    /* ── HEADER ── */
    .header {
      position:relative; z-index:10; flex-shrink:0;
      padding:11px 14px; display:flex; align-items:center; gap:10px;
      background:rgba(0,0,0,0.7); backdrop-filter:blur(12px);
      border-bottom:1px solid rgba(255,255,255,0.07);
    }
    .back-btn { background:rgba(204,34,0,0.15); border:1px solid rgba(204,34,0,0.3); color:#ef4444; padding:7px 12px; border-radius:6px; cursor:pointer; font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:1px; transition:background .15s; }
    .back-btn:active { background:rgba(204,34,0,0.3); }
    .header-title { font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:3px; color:#f59e0b; flex:1; text-align:center; }
    .header-score { font-family:'Bebas Neue',sans-serif; font-size:15px; color:#10b981; min-width:70px; text-align:right; }

    /* ── INFO BAR ── */
    .info-bar { position:relative; z-index:10; flex-shrink:0; display:flex; background:rgba(0,0,0,0.5); border-bottom:1px solid rgba(255,255,255,0.05); }
    .info-item { flex:1; padding:7px 4px; text-align:center; border-right:1px solid rgba(255,255,255,0.05); }
    .info-item:last-child { border-right:none; }
    .info-val { font-family:'Bebas Neue',sans-serif; font-size:16px; color:#f59e0b; letter-spacing:0.5px; }
    .info-lbl { font-size:8px; color:#3a3a3a; text-transform:uppercase; letter-spacing:1px; font-weight:700; }

    /* ── CANVAS ── */
    .game-area { flex:1; position:relative; overflow:hidden; z-index:2; }
    #towerCanvas { position:absolute; top:0; left:0; image-rendering:pixelated; }

    /* ── BOUTON POSER ── */
    .tap-btn {
      position:fixed; right:14px; top:50%; transform:translateY(-50%);
      z-index:20; width:58px; height:58px; border-radius:50%; border:none;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      font-size:20px; font-family:'Bebas Neue',sans-serif; letter-spacing:1px;
      transition:transform .08s;
      will-change:transform;
    }
    .tap-btn:active { transform:translateY(-50%) scale(0.88) !important; }
    .tap-btn.go {
      background:linear-gradient(135deg,#10b981,#059669);
      box-shadow:0 4px 20px rgba(16,185,129,0.5), 0 0 0 3px rgba(16,185,129,0.15);
      animation:goPulse 1.8s ease-in-out infinite;
      color:white;
    }
    .tap-btn.play {
      background:linear-gradient(135deg,#cc2200,#991100);
      box-shadow:0 4px 20px rgba(204,34,0,0.5);
      color:white;
    }
    @keyframes goPulse {
      0%,100% { box-shadow:0 4px 20px rgba(16,185,129,0.5),0 0 0 3px rgba(16,185,129,0.15); }
      50%      { box-shadow:0 4px 28px rgba(16,185,129,0.8),0 0 0 8px rgba(16,185,129,0.08); }
    }

    /* ── OVERLAYS ── */
    .overlay { position:fixed; inset:0; z-index:50; background:rgba(0,0,0,0.82); backdrop-filter:blur(10px); display:flex; align-items:center; justify-content:center; }
    .ocard { max-width:310px; width:90%; border-radius:20px; padding:26px 20px; text-align:center; background:#161616; border:1px solid #2a2a2a; animation:popIn .4s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes popIn { from{transform:scale(0.7);opacity:0} to{transform:scale(1);opacity:1} }
    .ocard-icon  { font-size:52px; margin-bottom:10px; }
    .ocard-title { font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:2px; color:#f59e0b; margin-bottom:4px; }
    .ocard-sub   { font-size:12px; color:#444; margin-bottom:10px; }
    .ocard-gain  { font-family:'Bebas Neue',sans-serif; font-size:42px; color:#10b981; text-shadow:0 0 16px rgba(16,185,129,0.4); margin-bottom:3px; }
    .ocard-mult  { font-size:11px; color:#333; margin-bottom:18px; }
    .ocard-rules { background:rgba(255,255,255,0.02); border:1px solid #222; border-radius:10px; padding:12px; text-align:left; margin-bottom:14px; }
    .ocard-rule  { font-size:11px; color:#555; padding:3px 0; display:flex; gap:8px; line-height:1.4; }
    .btn-start   { width:100%; height:52px; border:none; border-radius:12px; background:linear-gradient(135deg,#cc2200,#991100); color:white; font-family:'Bebas Neue',sans-serif; font-size:19px; letter-spacing:2px; cursor:pointer; margin-bottom:8px; box-shadow:0 4px 16px rgba(204,34,0,0.4); transition:opacity .15s; }
    .btn-start:active { opacity:.85; }
    .btn-back    { width:100%; height:40px; border-radius:12px; background:none; border:1px solid #222; color:#333; font-family:'Bebas Neue',sans-serif; font-size:12px; letter-spacing:1px; cursor:pointer; }

    /* ── FLASH ── */
    .flash { position:fixed; top:22%; left:50%; transform:translateX(-50%); font-family:'Bebas Neue',sans-serif; font-size:26px; color:#f59e0b; text-shadow:0 0 14px rgba(245,158,11,0.9); pointer-events:none; z-index:30; white-space:nowrap; animation:flashUp .7s ease-out forwards; }
    @keyframes flashUp { 0%{opacity:1;transform:translateX(-50%) translateY(0) scale(1.1)} 100%{opacity:0;transform:translateX(-50%) translateY(-50px) scale(1.3)} }
  </style>
</head>
<body>

  <div class="header">
    <button class="back-btn" onclick="window.location.href='travail.html'">← RETOUR</button>
    <div class="header-title">TOWER</div>
    <div class="header-score" id="headerScore">--</div>
  </div>

  <div class="info-bar">
    <div class="info-item"><div class="info-val" id="infoFloors">0</div><div class="info-lbl">Étages</div></div>
    <div class="info-item"><div class="info-val" id="infoMult">×1.0</div><div class="info-lbl">Multiplicateur</div></div>
    <div class="info-item"><div class="info-val" id="infoGain">0€</div><div class="info-lbl">Gain estimé</div></div>
  </div>

  <div class="game-area"><canvas id="towerCanvas"></canvas></div>

  <button class="tap-btn go" id="tapBtn" onclick="handleTap()">▶</button>

  <!-- START -->
  <div class="overlay" id="startOverlay">
    <div class="ocard">
      <div class="ocard-icon">📦</div>
      <div class="ocard-title">Tower of Containers</div>
      <button class="btn-start" id="startBtn" onclick="startGame()" style="display:none">C'est parti !</button>
      <button class="btn-back" onclick="window.location.href='travail.html'">← Retour</button>
    </div>

  <!-- RÉSULTAT -->
  <div class="overlay" id="resultOverlay" style="display:none">
    <div class="ocard">
      <div class="ocard-icon" id="ocIcon">📦</div>
      <div class="ocard-title" id="ocTitle">Game Over</div>
      <div class="ocard-sub" id="ocSub">0 étage</div>
      <div class="ocard-gain" id="ocGain">+0€</div>
      <div class="ocard-mult" id="ocMult"></div>
      <div class="ocard-mult" id="ocXp" style="color:#3b82f6;margin-top:-12px"></div>
      <button class="btn-start" onclick="startGame()">▶ Rejouer</button>

  <script>
    const SB_URL = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const sb = createClient(SB_URL, SB_KEY);

    let currentUser = null;

    const CONTAINERS = [
      { body:'#cc2200', hi:'#e63300', lo:'#881800', label:'MAERSK' },
      { body:'#1d4ed8', hi:'#2563eb', lo:'#1e3a8a', label:'MSC' },
      { body:'#15803d', hi:'#16a34a', lo:'#14532d', label:'CMA CGM' },
      { body:'#b45309', hi:'#d97706', lo:'#92400e', label:'EVERGREEN' },
      { body:'#7c3aed', hi:'#8b5cf6', lo:'#5b21b6', label:'HAPAG' },
      { body:'#be123c', hi:'#e11d48', lo:'#9f1239', label:'COSCO' },
    ];

    const BH = 36, MIN_W = 22;
    let canvas, ctx, W, H;
    let blocks = [], swinger = null, animId = null, running = false, floor = 0;

    // ── AUTH ──
    async function initAuth() {
      const { data:{ session } } = await sb.auth.getSession();
      if (!session) { window.location.href = 'index.html'; return; }
      currentUser = session.user;
      const { data } = await sb.from('game_stats').select('money,level,xp,story_progress').eq('user_id', currentUser.id).maybeSingle();
      window._currentXp = data?.xp || 0;
      window._currentLevel = data?.level || 1;
      document.getElementById('headerScore').textContent = (data?.money||0).toLocaleString('fr-FR') + '€';
      if (!data?.story_progress?.scene2_done) {
        document.getElementById('startOverlay').innerHTML = '<div class="ocard"><div class="ocard-icon">🔒</div><div class="ocard-title">Chapitre 2 requis</div><div class="ocard-sub" style="margin-bottom:20px">Joue le Chapitre 2 du Mode Histoire pour débloquer.</div><button class="btn-start" onclick="window.location.href=\'histoire.html\'">▶ Mode Histoire</button></div>';
        return;
      }
      startGame();
    }

    // ── CANVAS ──
    function initCanvas() {
      canvas = document.getElementById('towerCanvas');
      const a = document.querySelector('.game-area');
      W = a.clientWidth; H = a.clientHeight;
      canvas.width = W; canvas.height = H;
      canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
      ctx = canvas.getContext('2d');
    }

    // ── START ──
    function startGame() {
      document.getElementById('startOverlay').style.display = 'none';
      document.getElementById('resultOverlay').style.display = 'none';
      const btn = document.getElementById('tapBtn');
      btn.className = 'tap-btn play'; btn.textContent = '🎯';
      blocks = []; floor = 0;
      initCanvas();
      const gW = Math.min(W * 0.52, 200);
      blocks.push({ x:(W-gW)/2, y:H-72, w:gW, ci:-1, ground:true });
      running = true;
      spawn();
      cancelAnimationFrame(animId);
      loop();
      updateBar();
    }

    // ── SPAWN ──
    function spawn() {
      const last = blocks[blocks.length-1];
      // Vitesse plus douce au début, progressive
      const speed = Math.min(1.5 + floor * 0.15, 7);
      let sy = last.y - BH - 5;
      // Scroll si la tour monte trop haut
      if (sy < H * 0.22) {
        const shift = Math.round(H * 0.22 - sy) + BH + 8;
        blocks.forEach(b => b.y += shift);
        sy = blocks[blocks.length-1].y - BH - 5;
      }
      swinger = { x: -last.w, y: sy, w: last.w, speed, dir: 1, ci: floor % CONTAINERS.length };
    }

    // ── LOOP — requestAnimationFrame fluide ──
    let lastTime = 0;
    function loop(ts = 0) {
      if (!running) return;
      const dt = Math.min((ts - lastTime) / 16.67, 2); // delta normalisé 60fps
      lastTime = ts;
      swinger.x += swinger.speed * swinger.dir * dt;
      if (swinger.x + swinger.w > W + 20) swinger.dir = -1;
      if (swinger.x < -20)                swinger.dir = 1;
      draw();
      animId = requestAnimationFrame(loop);
    }

    // ── DRAW ──
    function draw() {
      ctx.clearRect(0, 0, W, H);
      blocks.forEach(b => drawBlock(b, false));
      if (swinger) drawBlock(swinger, true);
    }

    function drawBlock(b, moving) {
      const x = b.x, y = b.y, w = b.w, h = BH;
      if (b.ground) {
        ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(x+4, y+4, w, h);
        ctx.fillStyle = '#262626'; ctx.fillRect(x, y, w, h);
        ctx.fillStyle = 'rgba(255,255,255,0.04)'; ctx.fillRect(x, y, w, 4);
        ctx.strokeStyle = '#333'; ctx.lineWidth = 1; ctx.strokeRect(x, y, w, h);
        return;
      }
      const col = CONTAINERS[b.ci] || CONTAINERS[0];
      // Ombre douce
      ctx.shadowColor = 'rgba(0,0,0,0.5)';
      ctx.shadowBlur = moving ? 10 : 6;
      ctx.shadowOffsetY = 3;
      // Corps
      ctx.fillStyle = col.body; ctx.fillRect(x, y, w, h);
      ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
      // Bande haute
      ctx.fillStyle = col.hi; ctx.fillRect(x, y, w, 5);
      // Bande basse
      ctx.fillStyle = col.lo; ctx.fillRect(x, y+h-5, w, 5);
      // Rainures
      ctx.strokeStyle = 'rgba(0,0,0,0.28)'; ctx.lineWidth = 1.5;
      const n = Math.max(2, Math.floor(w/24));
      for (let i=1; i<n; i++) {
        const lx = x + (w/n)*i;
        ctx.beginPath(); ctx.moveTo(lx, y+6); ctx.lineTo(lx, y+h-6); ctx.stroke();
      }
      // Reflet
      ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fillRect(x+2, y+6, w-4, 3);
      // Contour
      ctx.strokeStyle = moving ? 'rgba(255,255,255,0.65)' : 'rgba(255,255,255,0.1)';
      ctx.lineWidth = moving ? 2 : 0.8; ctx.strokeRect(x, y, w, h);
      // Label
      if (w > 55) {
        ctx.font = `bold ${Math.min(9, Math.floor(h*0.26))}px Inter`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = 'rgba(255,255,255,0.45)';
        ctx.fillText(col.label, x+w/2, y+h/2);
      }
      // Coins métalliques
      if (w > 40) {
        const corners = [[x+3,y+3],[x+w-9,y+3],[x+3,y+h-9],[x+w-9,y+h-9]];
        corners.forEach(([cx,cy])=>{
          ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(cx,cy,6,6);
          ctx.fillStyle='rgba(255,255,255,0.2)'; ctx.fillRect(cx+1,cy+1,4,4);
        });
      }
    }

    // ── TAP ──
    function handleTap() {
      if (!running || !swinger) return;
      const last = blocks[blocks.length-1];
      const left  = Math.max(swinger.x, last.x);
      const right = Math.min(swinger.x + swinger.w, last.x + last.w);
      const overlap = right - left;
      if (overlap <= 0 || overlap < MIN_W) { gameOver(); return; }
      const perfect = overlap / last.w > 0.92;
      blocks.push({
        x: perfect ? last.x : left,
        y: last.y - BH - 5,
        w: perfect ? last.w : overlap,
        ci: swinger.ci
      });
      floor++;
      window._sessionXp = (window._sessionXp||0) + (4 + floor); // étage 1 = +5, étage 2 = +6, etc.
      if (perfect) { showFlash('PARFAIT ! 🎯'); window._sessionXp += 5; }
      if (navigator.vibrate) navigator.vibrate(perfect ? [40,20,40] : 15);
      spawn();
      updateBar();
    }

    function updateBar() {
      const mult = (1 + floor*0.2).toFixed(1);
      const gain = Math.floor(floor * 20 * parseFloat(mult));
      document.getElementById('infoFloors').textContent = floor;
      document.getElementById('infoMult').textContent = '×' + mult;
      document.getElementById('infoGain').textContent = gain.toLocaleString('fr-FR') + '€';
    }

    // ── GAME OVER ──
    async function gameOver() {
      running = false; cancelAnimationFrame(animId);
      if (navigator.vibrate) navigator.vibrate([80,40,150]);
      const mult = parseFloat((1+floor*0.2).toFixed(1));
      const gain = Math.floor(floor * 20 * mult);
      const t = floor===0?0:floor<5?1:floor<10?2:floor<20?3:4;
      const titles=[['😅','Aïe !'],['📦','Pas mal !'],['🏗️','Belle tour !'],['⭐','Impressionnant !'],['🏆','LÉGENDAIRE !']];
      document.getElementById('ocIcon').textContent  = titles[t][0];
      document.getElementById('ocTitle').textContent = titles[t][1];
      document.getElementById('ocSub').textContent   = `${floor} étage${floor>1?'s':''} construits`;
      document.getElementById('ocGain').textContent  = gain>0 ? `+${gain.toLocaleString('fr-FR')}€` : '0€';
      document.getElementById('ocMult').textContent  = `×${mult} multiplicateur`;
      document.getElementById('ocXp').textContent     = `+${(window._sessionXp||0)} XP`;
      document.getElementById('resultOverlay').style.display = 'flex';
      if (gain > 0 && currentUser) {
        const { data: fresh } = await sb.from('game_stats').select('money,xp,level,records').eq('user_id', currentUser.id).maybeSingle();
        const newMoney = (fresh?.money||0) + gain;
        let nXp = (fresh?.xp||0) + (window._sessionXp||0);
        let nLvl = fresh?.level||1;
        while (nXp >= getXpRequired(nLvl)) { nXp -= getXpRequired(nLvl); nLvl++; }
        window._sessionXp = 0;
        const rec = (fresh?.records && typeof fresh.records==='object') ? fresh.records : {};
        rec.tower_floor = Math.max(rec.tower_floor||0, floor);
        rec.tower_gain  = Math.max(rec.tower_gain||0, gain);
        await sb.from('game_stats').update({ money: newMoney, xp: nXp, level: nLvl, records: rec }).eq('user_id', currentUser.id);
        document.getElementById('headerScore').textContent = newMoney.toLocaleString('fr-FR') + '€';
      }
    }

    function getXpRequired(l){ if(l<=10)return l*500; if(l<=25)return l*1000; if(l<=50)return l*2000; return l*4000; }

    function showFlash(txt) {
      const el = document.createElement('div'); el.className = 'flash'; el.textContent = txt;
      document.body.appendChild(el); setTimeout(() => el.remove(), 700);
    }

    initAuth();
  </script>
</body>
</html>
