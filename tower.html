<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tower — Combo</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#111; padding:24px; display:flex; justify-content:center; font-family:'Inter',sans-serif; }
.phone { width:375px;height:720px;overflow:hidden;position:relative;border-radius:44px;box-shadow:0 32px 80px rgba(0,0,0,0.7); }
</style>
</head>
<body>
<div class="phone">

<!-- Design 3 : Aube rosée méditerranée -->
<svg style="position:absolute;inset:0;width:100%;height:100%" viewBox="0 0 375 720" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d0520"/><stop offset="35%" stop-color="#5c1a3a"/><stop offset="65%" stop-color="#c0306a"/><stop offset="100%" stop-color="#ff8c42"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3a0c18"/><stop offset="100%" stop-color="#1a0408"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="375" height="720" fill="url(#sky)"/>
  <!-- Halo horizon -->
  <ellipse cx="188" cy="560" rx="240" ry="90" fill="rgba(255,140,66,0.28)" filter="url(#glow)"/>
  <!-- Étoiles -->
  <g fill="white"><circle cx="30" cy="35" r="1" opacity="0.6"/><circle cx="80" cy="18" r="0.9" opacity="0.5"/><circle cx="140" cy="42" r="0.7" opacity="0.4"/><circle cx="310" cy="22" r="1" opacity="0.5"/><circle cx="350" cy="48" r="0.8" opacity="0.45"/><circle cx="200" cy="15" r="0.8" opacity="0.5"/></g>
  <!-- Silhouettes bâtiments fond -->
  <g fill="#060210">
    <rect x="0" y="350" width="28" height="212"/><rect x="30" y="330" width="22" height="232"/>
    <rect x="54" y="358" width="18" height="204"/>
    <rect x="298" y="338" width="28" height="224"/><rect x="328" y="322" width="24" height="240"/><rect x="354" y="348" width="21" height="214"/>
  </g>
  <!-- Fenêtres bâtiments fond -->
  <g fill="rgba(255,180,80,0.2)"><rect x="5" y="366" width="4" height="3"/><rect x="14" y="358" width="4" height="3"/><rect x="35" y="348" width="4" height="3"/><rect x="302" y="355" width="4" height="3"/><rect x="333" y="340" width="4" height="3"/></g>
  <!-- Mer sombre -->
  <rect x="0" y="562" width="375" height="158" fill="url(#sea)"/>
  <path d="M0,566 Q47,556 94,566 Q141,576 188,566 Q235,556 282,566 Q329,576 375,566" fill="none" stroke="rgba(200,80,50,0.2)" stroke-width="1.5"/>
  <!-- Quai sombre -->
  <rect x="0" y="530" width="375" height="34" fill="#080310"/>
  <line x1="0" y1="530" x2="375" y2="530" stroke="#1a0810" stroke-width="2.5"/>
  <!-- Containers quai colorés -->
  <rect x="6" y="494" width="62" height="38" rx="3" fill="#E53935" stroke="#0a0a0a" stroke-width="2.5"/>
  <line x1="27" y1="494" x2="27" y2="532" stroke="#0a0a0a" stroke-width="1.5"/><line x1="47" y1="494" x2="47" y2="532" stroke="#0a0a0a" stroke-width="1.5"/>
  <rect x="70" y="500" width="52" height="32" rx="3" fill="#1565C0" stroke="#0a0a0a" stroke-width="2.5"/>
  <line x1="90" y1="500" x2="90" y2="532" stroke="#0a0a0a" stroke-width="1.5"/>
  <rect x="124" y="494" width="62" height="38" rx="3" fill="#2E7D32" stroke="#0a0a0a" stroke-width="2.5"/>
  <line x1="145" y1="494" x2="145" y2="532" stroke="#0a0a0a" stroke-width="1.5"/><line x1="165" y1="494" x2="165" y2="532" stroke="#0a0a0a" stroke-width="1.5"/>
  <rect x="270" y="497" width="58" height="34" rx="3" fill="#F57F17" stroke="#0a0a0a" stroke-width="2.5"/>
  <!-- TOUR containers colorés -->
  <rect x="150" y="454" width="88" height="42" rx="3" fill="#E53935" stroke="#0a0a0a" stroke-width="3"/>
  <line x1="179" y1="454" x2="179" y2="496" stroke="#0a0a0a" stroke-width="1.5"/><line x1="208" y1="454" x2="208" y2="496" stroke="#0a0a0a" stroke-width="1.5"/>
  <rect x="154" y="412" width="80" height="42" rx="3" fill="#1565C0" stroke="#0a0a0a" stroke-width="3"/>
  <line x1="181" y1="412" x2="181" y2="454" stroke="#0a0a0a" stroke-width="1.5"/>
  <rect x="158" y="370" width="72" height="42" rx="3" fill="#2E7D32" stroke="#0a0a0a" stroke-width="3"/>
  <rect x="162" y="328" width="64" height="42" rx="3" fill="#F57F17" stroke="#0a0a0a" stroke-width="3"/>
  <rect x="166" y="286" width="56" height="42" rx="3" fill="#E53935" stroke="#0a0a0a" stroke-width="3"/>
  <!-- Container oscillant coloré -->
  <rect x="46" y="232" width="80" height="38" rx="3" fill="#1565C0" stroke="#0a0a0a" stroke-width="3" opacity="0.92"/>
  <line x1="68" y1="232" x2="68" y2="270" stroke="#0a0a0a" stroke-width="1.5"/>
  <line x1="86" y1="30" x2="86" y2="232" stroke="#0a0a0a" stroke-width="2" stroke-dasharray="5,4"/>
  <!-- Grue BD jaune -->
  <rect x="72" y="20" width="12" height="512" fill="#F9C846" stroke="#0a0a0a" stroke-width="3"/>
  <rect x="72" y="20" width="130" height="10" fill="#F9C846" stroke="#0a0a0a" stroke-width="3"/>
  <rect x="198" y="30" width="7" height="38" fill="#F9C846" stroke="#0a0a0a" stroke-width="2.5"/>
  <line x1="77" y1="20" x2="112" y2="60" stroke="#0a0a0a" stroke-width="2.5"/>
  <rect x="88" y="68" width="28" height="20" rx="2" fill="#F9C846" stroke="#0a0a0a" stroke-width="2"/>
  <rect x="58" y="528" width="24" height="8" rx="4" fill="#2a2a2a" stroke="#0a0a0a" stroke-width="2"/>
  <rect x="0" y="0" width="375" height="280" fill="rgba(13,5,32,0.15)"/>
</svg>

<!-- TA : Affichage étage + argent GRAND -->
<div style="position:absolute;top:0;left:0;right:0;z-index:10;padding:52px 22px 0">
  <div style="display:flex;justify-content:space-between;align-items:flex-start">
    <div>
      <div style="font-family:'Bebas Neue',sans-serif;font-size:32px;color:rgba(255,255,255,0.75);letter-spacing:3px;line-height:1">ÉTAGE</div>
      <div style="font-family:'Bebas Neue',sans-serif;font-size:88px;color:white;line-height:0.9;margin-top:-4px;text-shadow:3px 3px 0 rgba(0,0,0,0.2)">5</div>
    </div>
    <div style="text-align:right;padding-top:6px">
      <div style="font-family:'Bebas Neue',sans-serif;font-size:30px;color:#FDD835;line-height:1;text-shadow:2px 2px 0 rgba(0,0,0,0.2)">2 200€</div>
      <div style="font-size:9px;font-weight:700;color:rgba(255,255,255,0.45);letter-spacing:2px;margin-top:2px">GAINS</div>
      <div style="font-size:9px;font-weight:700;color:rgba(255,255,255,0.25);letter-spacing:1px;margin-top:4px">RECORD : 12</div>
    </div>
  </div>
</div>

<!-- Stats barre milieu -->
<div style="position:absolute;bottom:130px;left:22px;right:22px;z-index:10">
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
    <div style="background:rgba(0,0,0,0.22);border:2px solid rgba(0,0,0,0.25);border-radius:12px;padding:10px;text-align:center">
      <div style="font-family:'Bebas Neue',sans-serif;font-size:18px;color:white">×1.5</div>
      <div style="font-size:7px;font-weight:700;color:rgba(255,255,255,0.45);letter-spacing:1px;margin-top:1px">MULTIPLICATEUR</div>
    </div>
    <div style="background:rgba(0,0,0,0.22);border:2px solid rgba(0,0,0,0.25);border-radius:12px;padding:10px;text-align:center">
      <div style="font-family:'Bebas Neue',sans-serif;font-size:18px;color:#FDD835">+35 XP</div>
      <div style="font-size:7px;font-weight:700;color:rgba(255,255,255,0.45);letter-spacing:1px;margin-top:1px">SESSION</div>
    </div>
    <div style="background:rgba(0,0,0,0.22);border:2px solid rgba(0,0,0,0.25);border-radius:12px;padding:10px;text-align:center">
      <div style="font-family:'Bebas Neue',sans-serif;font-size:18px;color:white">12</div>
      <div style="font-size:7px;font-weight:700;color:rgba(255,255,255,0.45);letter-spacing:1px;margin-top:1px">RECORD</div>
    </div>
  </div>
</div>

<!-- Bouton POSER style Nuit Mistral -->
<div style="position:absolute;bottom:0;left:0;right:0;z-index:10;padding:0 22px 36px">
  <button style="width:100%;background:rgba(74,222,128,0.92);border:none;border-radius:16px;padding:18px;color:white;font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;box-shadow:0 4px 20px rgba(74,222,128,0.35)">POSER</button>
  <button style="width:100%;background:transparent;border:none;color:rgba(255,255,255,0.35);font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:2px;margin-top:8px">← RETOUR</button>
</div>

</div>
</body>
</html>
