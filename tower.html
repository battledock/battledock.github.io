<script>
  const SB_URL = 'https://drtsuhnbclhmgfjiykap.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
  const { createClient } = supabase;
  const sb = createClient(SB_URL, SB_KEY);

  function getXpRequired(lvl) {
    if (lvl <= 10) return lvl * 500;
    if (lvl <= 25) return lvl * 1000;
    if (lvl <= 50) return lvl * 2000;
    return lvl * 4000;
  }
  function getGrade(lvl) {
    if (lvl <= 4)  return 'Docker Occasionnel';
    if (lvl <= 14) return 'Docker';
    if (lvl <= 29) return 'Docker Mensuel';
    if (lvl <= 49) return 'Contre-Maître';
    if (lvl <= 79) return 'Chef de Quai';
    return 'Magnat du Port';
  }

  const CONTAINERS = [
    { body:'#cc2200', hi:'#e63300', lo:'#881800', label:'MAERSK' },
    { body:'#1d4ed8', hi:'#2563eb', lo:'#1e3a8a', label:'MSC' },
    { body:'#15803d', hi:'#16a34a', lo:'#14532d', label:'CMA CGM' },
    { body:'#b45309', hi:'#d97706', lo:'#92400e', label:'EVERGREEN' },
    { body:'#7c3aed', hi:'#8b5cf6', lo:'#5b21b6', label:'HAPAG' },
    { body:'#be123c', hi:'#e11d48', lo:'#9f1239', label:'COSCO' },
  ];

  const BH = 38, MIN_W = 22;
  let canvas, ctx, W, H;
  let blocks = [], swinger = null, animId = null, running = false, floor = 0;
  let currentUser = null, totalMoney = 0, currentXp = 0, currentLevel = 1;
  let sessionXp = 0, personalRecord = 0;

  async function init() {
    const { data:{ session } } = await sb.auth.getSession();
    if (!session) { window.location.href = 'index.html'; return; }
    currentUser = session.user;
    const { data } = await sb.from('game_stats')
      .select('money,level,xp,records').eq('user_id', currentUser.id).maybeSingle();
    totalMoney   = data?.money  || 0;
    currentXp    = data?.xp     || 0;
    currentLevel = data?.level  || 1;
    personalRecord = data?.records?.tower || 0;
    document.getElementById('hdrMoney').textContent  = totalMoney.toLocaleString('fr-FR') + '€';
    document.getElementById('hdrRecord').textContent = 'RECORD : ' + (personalRecord || '—');
    document.getElementById('ocRecord').textContent  = personalRecord || '—';
    if (currentLevel >= 5) {
      document.getElementById('startBtn').style.display = 'block';
    } else {
      document.getElementById('startOverlay').querySelector('.ocard').innerHTML =
        '<div class="ocard-icon">🔒</div><div class="ocard-title">Niveau 5 requis</div><div class="ocard-sub" style="margin-bottom:20px">Tu es niveau ' + currentLevel + '. Continue au port !</div><button class="btn-retour" onclick="goBack()">← Retour</button>';
    }
  }

  function initCanvas() {
    canvas = document.getElementById('towerCanvas');
    const a = document.getElementById('gameArea');
    W = a.clientWidth; H = a.clientHeight;
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx = canvas.getContext('2d');
  }

  function startGame() {
    document.getElementById('resultOverlay').style.display = 'none';
    document.getElementById('btnPoser').disabled = false;
    blocks = []; floor = 0; sessionXp = 0;
    initCanvas();
    const gW = Math.min(W * 0.52, 200);
    blocks.push({ x:(W-gW)/2, y:H-72, w:gW, ci:-1, ground:true });
    running = true;
    spawn();
    cancelAnimationFrame(animId);
    loop();
    updateBar();
  }

  function spawn() {
    const last  = blocks[blocks.length-1];
    const speed = Math.min(1.6 + floor * 0.14, 7);
    let sy = last.y - BH - 4;
    if (sy < H * 0.22) {
      const shift = Math.round(H * 0.22 - sy) + BH + 8;
      blocks.forEach(b => b.y += shift);
      sy = blocks[blocks.length-1].y - BH - 4;
    }
    swinger = { x:-last.w, y:sy, w:last.w, speed, dir:1, ci: floor % CONTAINERS.length };
  }

  let lastTime = 0;
  function loop(ts = 0) {
    if (!running) return;
    const dt = Math.min((ts - lastTime) / 16.67, 2);
    lastTime = ts;
    swinger.x += swinger.speed * swinger.dir * dt;
    if (swinger.x + swinger.w > W + 20) swinger.dir = -1;
    if (swinger.x < -20)                swinger.dir =  1;
    draw();
    animId = requestAnimationFrame(loop);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    blocks.forEach(b => drawBlock(b, false));
    if (swinger) drawBlock(swinger, true);
  }

  function drawBlock(b, moving) {
    const x = b.x, y = b.y, w = b.w, h = BH;
    if (b.ground) {
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(x+4, y+4, w, h);
      ctx.fillStyle = '#1a0810';         ctx.fillRect(x, y, w, h);
      ctx.fillStyle = 'rgba(255,255,255,0.03)'; ctx.fillRect(x, y, w, 4);
      ctx.strokeStyle = 'rgba(255,100,50,0.2)'; ctx.lineWidth = 1; ctx.strokeRect(x, y, w, h);
      return;
    }
    const col = CONTAINERS[b.ci] || CONTAINERS[0];
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur  = moving ? 12 : 6;
    ctx.shadowOffsetY = 3;
    ctx.fillStyle = col.body; ctx.fillRect(x, y, w, h);
    ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    ctx.fillStyle = col.hi;               ctx.fillRect(x, y, w, 5);
    ctx.fillStyle = col.lo;               ctx.fillRect(x, y+h-5, w, 5);
    ctx.strokeStyle = 'rgba(0,0,0,0.28)'; ctx.lineWidth = 1.5;
    const n = Math.max(2, Math.floor(w/24));
    for (let i=1; i<n; i++) {
      const lx = x + (w/n)*i;
      ctx.beginPath(); ctx.moveTo(lx, y+6); ctx.lineTo(lx, y+h-6); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fillRect(x+2, y+6, w-4, 3);
    ctx.strokeStyle = moving ? 'rgba(255,255,255,0.7)' : 'rgba(255,255,255,0.12)';
    ctx.lineWidth   = moving ? 2 : 0.8; ctx.strokeRect(x, y, w, h);
    if (w > 55) {
      ctx.font = 'bold ' + Math.min(9, Math.floor(h*0.26)) + 'px Inter';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.fillText(col.label, x+w/2, y+h/2);
    }
    if (w > 40) {
      [[x+3,y+3],[x+w-9,y+3],[x+3,y+h-9],[x+w-9,y+h-9]].forEach(([cx,cy])=>{
        ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(cx,cy,6,6);
        ctx.fillStyle='rgba(255,255,255,0.2)'; ctx.fillRect(cx+1,cy+1,4,4);
      });
    }
  }

  function handleTap() {
    if (!running || !swinger) return;
    const last    = blocks[blocks.length-1];
    const left    = Math.max(swinger.x, last.x);
    const right   = Math.min(swinger.x + swinger.w, last.x + last.w);
    const overlap = right - left;
    if (overlap <= 0 || overlap < MIN_W) { gameOver(); return; }
    const perfect = overlap / last.w > 0.92;
    blocks.push({ x: perfect ? last.x : left, y: last.y - BH - 4, w: perfect ? last.w : overlap, ci: swinger.ci });
    floor++;
    sessionXp += 5;
    if (perfect) { showFlash('PARFAIT ! 🎯'); sessionXp += 5; }
    if (navigator.vibrate) navigator.vibrate(perfect ? [40,20,40] : 15);
    spawn();
    updateBar();
    document.getElementById('hdrFloor').textContent = floor;
  }

  function updateBar() {
    const mult = (1 + floor * 0.1).toFixed(1);
    const gain = Math.floor(floor * 20 * parseFloat(mult));
    document.getElementById('statMult').textContent = '×' + mult;
    document.getElementById('statXp').textContent   = '+' + sessionXp + ' XP';
    document.getElementById('statGain').textContent = gain.toLocaleString('fr-FR') + '€';
  }

  async function gameOver() {
    running = false;
    cancelAnimationFrame(animId);
    document.getElementById('btnPoser').disabled = true;
    if (navigator.vibrate) navigator.vibrate([80,40,150]);
    const mult = parseFloat((1 + floor * 0.1).toFixed(1));
    const gain = Math.floor(floor * 20 * mult);
    const xpGain = sessionXp + 20;
    const titles = [['😅','Aïe !'],['📦','Pas mal !'],['🏗️','Belle tour !'],['⭐','Impressionnant !'],['🏆','LÉGENDAIRE !']];
    const t = floor===0?0:floor<5?1:floor<10?2:floor<20?3:4;
    document.getElementById('ocIcon').textContent  = titles[t][0];
    document.getElementById('ocTitle').textContent = titles[t][1];
    document.getElementById('ocSub').textContent   = floor + ' étage' + (floor>1?'s':'') + ' construits';
    document.getElementById('ocGain').textContent  = gain > 0 ? '+' + gain.toLocaleString('fr-FR') + '€' : '0€';
    document.getElementById('ocXp').textContent    = '+' + xpGain;
    document.getElementById('ocFloors').textContent = floor;
    document.getElementById('ocMult').textContent   = '×' + mult;
    // Nouveau record ?
    const newRecord = Math.max(personalRecord, floor);
    if (floor > personalRecord) personalRecord = floor;
    document.getElementById('ocRecord').textContent  = newRecord;
    document.getElementById('hdrRecord').textContent = 'RECORD : ' + newRecord;
    document.getElementById('resultOverlay').style.display = 'flex';
    if (currentUser) {
      const { data: fresh } = await sb.from('game_stats').select('money,xp,records').eq('user_id', currentUser.id).maybeSingle();
      const newMoney = (fresh?.money||0) + gain;
      totalMoney = newMoney;
      let newXp   = (fresh?.xp||0) + xpGain;
      let newLevel = currentLevel;
      while (newXp >= getXpRequired(newLevel)) { newXp -= getXpRequired(newLevel); newLevel++; }
      const records = fresh?.records || {};
      records.tower = Math.max(records.tower||0, floor);
      await sb.from('game_stats').update({
        money: newMoney, xp: newXp, level: newLevel,
        grade: getGrade(newLevel), records
      }).eq('user_id', currentUser.id);
      document.getElementById('hdrMoney').textContent = newMoney.toLocaleString('fr-FR') + '€';
    }
  }

  function showFlash(txt) {
    const el = document.createElement('div');
    el.className = 'flash'; el.textContent = txt;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 700);
  }

  async function goBack() {
    running = false; cancelAnimationFrame(animId);
    window.location.href = 'travail.html';
  }

  init().then(() => startGame());
</script>
</body>
</html>
