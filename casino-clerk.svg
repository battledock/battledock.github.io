<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#7f1d1d"/>
  
  <!-- Counter -->
  <rect x="0" y="180" width="400" height="120" fill="#4a1515"/>
  <rect x="0" y="180" width="400" height="10" fill="#fbbf24"/>
  
  <!-- Person -->
  <!-- Head -->
  <circle cx="200" cy="140" r="35" fill="#d4a574"/>
  
  <!-- Hair -->
  <ellipse cx="200" cy="120" rx="38" ry="25" fill="#2d1810"/>
  
  <!-- Eyes -->
  <circle cx="190" cy="135" r="4" fill="#1a1a1a"/>
  <circle cx="210" cy="135" r="4" fill="#1a1a1a"/>
  
  <!-- Smile -->
  <path d="M 185 145 Q 200 152 215 145" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  
  <!-- Shirt -->
  <rect x="165" y="175" width="70" height="50" fill="#1e3a8a" rx="5"/>
  
  <!-- Bow tie -->
  <polygon points="185,185 195,180 195,190" fill="#dc2626"/>
  <polygon points="215,185 205,180 205,190" fill="#dc2626"/>
  <circle cx="200" cy="185" r="3" fill="#dc2626"/>
  
  <!-- Arms -->
  <rect x="140" y="190" width="25" height="60" fill="#d4a574" rx="8"/>
  <rect x="235" y="190" width="25" height="60" fill="#d4a574" rx="8"/>
  
  <!-- Hand gesture -->
  <circle cx="152" cy="250" r="12" fill="#d4a574"/>
  <circle cx="248" cy="250" r="12" fill="#d4a574"/>
  
  <!-- Coins on counter -->
  <circle cx="280" cy="220" r="15" fill="#fbbf24"/>
  <circle cx="310" cy="225" r="15" fill="#fbbf24"/>
  <circle cx="295" cy="240" r="15" fill="#fbbf24"/>
  
  <!-- Dollar signs -->
  <text x="275" y="227" font-family="Arial" font-size="16" font-weight="bold" fill="#7f1d1d">$</text>
  <text x="305" y="232" font-family="Arial" font-size="16" font-weight="bold" fill="#7f1d1d">$</text>
  
  <!-- Speech bubble -->
  <ellipse cx="120" cy="100" rx="60" ry="35" fill="white" opacity="0.95"/>
  <polygon points="140,120 150,135 130,125" fill="white" opacity="0.95"/>
  <text x="85" y="95" font-family="Arial" font-size="14" font-weight="bold" fill="#1a1a1a">Bienvenue</text>
  <text x="75" y="110" font-family="Arial" font-size="14" font-weight="bold" fill="#1a1a1a">au Casino !</text>
</svg>
