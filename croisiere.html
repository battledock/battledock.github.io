<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Contrôle aux Croisières — Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
html,body { height:100%; overflow:hidden; }
body { font-family:'Inter',sans-serif; background:#0a0a14; display:flex; flex-direction:column; height:100dvh; }

/* ── FOND TERMINAL ── */
#bg { position:fixed; inset:0; z-index:0; background:linear-gradient(180deg,#0a0f20 0%,#0d1535 30%,#0a1020 60%,#060810 100%); }
.ceiling { position:fixed; top:0; left:0; right:0; height:40%; z-index:1; pointer-events:none; background:linear-gradient(180deg,rgba(10,15,32,0.95) 0%,transparent 100%); }
.neon-strip { position:fixed; z-index:2; pointer-events:none; height:2px; left:20%; right:20%; background:linear-gradient(90deg,transparent,rgba(100,200,255,0.6),rgba(150,220,255,0.8),rgba(100,200,255,0.6),transparent); box-shadow:0 0 8px rgba(100,200,255,0.4),0 0 20px rgba(100,200,255,0.2); }
.neon-strip.n1 { top:8%; }
.neon-strip.n2 { top:8%; left:5%; right:5%; opacity:0.3; }
.floor { position:fixed; bottom:0; left:0; right:0; z-index:1; height:55%; background:linear-gradient(180deg,#0a0f20 0%,#111827 60%,#1a1f2e 100%); }
.wall-left { position:fixed; top:0; bottom:0; left:0; z-index:3; width:22%; pointer-events:none; background:linear-gradient(90deg,rgba(5,8,20,0.95) 0%,transparent 100%); }
.wall-right { position:fixed; top:0; bottom:0; right:0; z-index:3; width:22%; pointer-events:none; background:linear-gradient(270deg,rgba(5,8,20,0.95) 0%,transparent 100%); }
.vanishing-belt { position:fixed; bottom:0; left:50%; transform:translateX(-50%); z-index:3; pointer-events:none; width:220px; height:52%; background:linear-gradient(180deg,rgba(30,30,40,0) 0%,rgba(40,40,55,0.8) 40%,rgba(50,50,65,1) 100%); clip-path:polygon(28% 0%,72% 0%,100% 100%,0% 100%); }
.vanishing-belt-lines { position:fixed; bottom:0; left:50%; transform:translateX(-50%); z-index:3; pointer-events:none; width:220px; height:52%; overflow:hidden; clip-path:polygon(28% 0%,72% 0%,100% 100%,0% 100%); }
.belt-line { position:absolute; left:0; right:0; height:1px; background:rgba(255,255,255,0.04); animation:beltScroll 1.2s linear infinite; }
@keyframes beltScroll { from{transform:translateY(-100%)} to{transform:translateY(100vh)} }
.terminal-sign { position:fixed; top:11%; left:50%; transform:translateX(-50%); z-index:4; pointer-events:none; text-align:center; }
.terminal-sign-inner { background:rgba(0,0,0,0.6); border:1px solid rgba(100,200,255,0.2); border-radius:4px; padding:4px 16px; backdrop-filter:blur(4px); }
.terminal-sign-txt { font-family:'Bebas Neue',sans-serif; font-size:10px; letter-spacing:4px; color:rgba(100,200,255,0.5); }
.persp-lines { position:fixed; inset:0; z-index:2; pointer-events:none; overflow:hidden; }
.persp-line { position:absolute; width:1px; background:linear-gradient(180deg,transparent 0%,rgba(100,150,255,0.12) 60%,rgba(100,150,255,0.04) 100%); transform-origin:bottom center; }

/* ── PAGE ── */
.page { position:relative; z-index:10; flex:1; display:flex; flex-direction:column; overflow:hidden; }

/* HEADER */
.hdr { padding:calc(env(safe-area-inset-top) + 10px) 16px 10px; border-bottom:1px solid rgba(255,255,255,0.05); background:rgba(5,8,20,0.8); backdrop-filter:blur(12px); flex-shrink:0; }
.hdr-row { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:8px; }
.hdr-title { font-family:'Bebas Neue',sans-serif; font-size:19px; letter-spacing:2.5px; color:white; line-height:1; }
.hdr-sub { font-size:8px; font-weight:700; color:rgba(100,200,255,0.4); letter-spacing:2px; margin-top:2px; }
.hdr-timer { font-family:'Bebas Neue',sans-serif; font-size:34px; color:#fbbf24; line-height:1; text-align:right; }
.hdr-timer.urgent { color:#f87171; animation:timerPulse 0.5s ease-in-out infinite; }
@keyframes timerPulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
.hdr-timer-lbl { font-size:8px; font-weight:700; color:rgba(255,255,255,0.25); letter-spacing:1px; text-align:right; }
.score-row { display:flex; gap:5px; }
.score-box { flex:1; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); border-radius:7px; padding:5px 6px; text-align:center; }
.score-val { font-family:'Bebas Neue',sans-serif; font-size:15px; color:white; line-height:1; }
.score-val.green { color:#4ade80; }
.score-val.red   { color:#f87171; }
.score-val.yellow { color:#fbbf24; }
.score-lbl { font-size:7px; font-weight:700; color:rgba(255,255,255,0.25); letter-spacing:0.5px; margin-top:1px; }

/* ── ZONE JEU ── */
.scene { flex:1; position:relative; overflow:hidden; }

/* Valise en approche perspective */
.bag-wrap {
  position:absolute;
  left:50%; bottom:0;
  transform:translateX(-50%);
  display:flex; flex-direction:column; align-items:center;
  pointer-events:none;
  transform-origin:bottom center;
}
.bag-emoji-el { font-size:80px; line-height:1; transition:none; filter:drop-shadow(0 12px 20px rgba(0,0,0,0.9)); }
.bag-wrap.suspect .bag-emoji-el { filter:drop-shadow(0 0 24px rgba(239,68,68,0.7)) drop-shadow(0 12px 20px rgba(0,0,0,0.9)); }
.bag-alert {
  position:absolute; top:0; right:-4px;
  width:22px; height:22px; border-radius:50%;
  background:#ef4444; color:white;
  font-size:13px; font-weight:900;
  display:flex; align-items:center; justify-content:center;
  border:2px solid white;
  box-shadow:0 0 12px rgba(239,68,68,0.9);
  animation:alertPulse 0.5s ease-in-out infinite;
}
@keyframes alertPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.25)} }

/* Flash feedback */
.feedback-flash { position:absolute; inset:0; pointer-events:none; z-index:20; opacity:0; transition:opacity .1s; border-radius:0; }
.feedback-flash.good { background:rgba(74,222,128,0.15); }
.feedback-flash.bad  { background:rgba(239,68,68,0.2); }
.feedback-flash.show { opacity:1; }

/* Particules */
.particle { position:fixed; pointer-events:none; font-family:'Bebas Neue',sans-serif; font-size:22px; font-weight:bold; z-index:999; animation:pflyup .9s ease-out forwards; }
.particle.xp { color:#fbbf24; font-size:16px; }
.particle.good { color:#4ade80; }
.particle.bad { color:#f87171; }
@keyframes pflyup { 0%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-80px) scale(0.7)} }

/* ── BOUTON ── */
.btn-zone { flex-shrink:0; padding:10px 16px calc(14px + env(safe-area-inset-bottom)); background:rgba(5,8,20,0.85); backdrop-filter:blur(12px); border-top:1px solid rgba(255,255,255,0.05); }
.suspect-btn {
  width:100%; height:66px;
  background:linear-gradient(135deg,#dc2626,#991b1b);
  border:none; border-radius:14px;
  font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:4px;
  color:white; cursor:pointer;
  box-shadow:0 6px 20px rgba(220,38,38,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
  display:flex; align-items:center; justify-content:center; gap:12px;
  transition:transform .08s, box-shadow .08s;
}
.suspect-btn:active { transform:scale(0.97); box-shadow:0 2px 8px rgba(220,38,38,0.4); }
.suspect-btn:disabled { background:linear-gradient(135deg,#374151,#1f2937); box-shadow:none; opacity:0.5; }

/* ── POPUP RÉSULTAT ── */
.popup-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:100; display:flex; align-items:center; justify-content:center; padding:20px; backdrop-filter:blur(4px); }
.popup { background:#0f172a; border:1px solid rgba(255,255,255,0.1); border-radius:20px; padding:28px 22px; width:100%; max-width:340px; text-align:center; animation:popIn .4s cubic-bezier(.34,1.56,.64,1); }
@keyframes popIn { 0%{transform:scale(0.8);opacity:0} 100%{transform:scale(1);opacity:1} }
.popup-emoji { font-size:48px; margin-bottom:8px; }
.popup-tag { font-family:'Bebas Neue',sans-serif; font-size:10px; letter-spacing:3px; color:#4b5563; margin-bottom:4px; }
.popup-title { font-family:'Bebas Neue',sans-serif; font-size:30px; letter-spacing:1px; color:white; margin-bottom:16px; }
.popup-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px; }
.popup-stat { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); border-radius:10px; padding:12px 8px; }
.popup-stat-v { font-family:'Bebas Neue',sans-serif; font-size:24px; color:white; line-height:1; }
.popup-stat-v.green { color:#4ade80; }
.popup-stat-v.yellow { color:#fbbf24; }
.popup-stat-v.red { color:#f87171; }
.popup-stat-l { font-size:8px; font-weight:700; color:#4b5563; letter-spacing:1px; text-transform:uppercase; margin-top:3px; }
.popup-btn { width:100%; background:#1565C0; border:none; border-radius:12px; padding:13px; color:white; font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:2px; cursor:pointer; margin-bottom:8px; }
.popup-btn-sec { width:100%; background:transparent; border:none; color:#4b5563; font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:1px; cursor:pointer; }

/* LOADER */
.loader { position:fixed; inset:0; background:#0a0a14; display:flex; align-items:center; justify-content:center; z-index:200; flex-direction:column; gap:10px; }
.loader-txt { font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:3px; color:rgba(100,200,255,0.6); }
</style>
</head>
<body>

<div id="bg"></div>
<div class="ceiling"></div>
<div class="neon-strip n1"></div>
<div class="neon-strip n2"></div>
<div class="floor"></div>
<div class="wall-left"></div>
<div class="wall-right"></div>
<div class="vanishing-belt"></div>
<div class="vanishing-belt-lines" id="beltLines"></div>
<div class="terminal-sign"><div class="terminal-sign-inner"><div class="terminal-sign-txt">TERMINAL PAQUEBOT · CONTRÔLE SÉCURITÉ</div></div></div>
<div class="persp-lines" id="perspLines"></div>

<div class="loader" id="loader"><div style="font-size:36px">🛃</div><div class="loader-txt">CHARGEMENT...</div></div>

<div class="page" id="mainPage" style="display:none">
  <div class="hdr">
    <div class="hdr-row">
      <div><div class="hdr-title">CONTRÔLE AUX CROISIÈRES</div><div class="hdr-sub">PORT DE MARSEILLE</div></div>
      <div><div class="hdr-timer" id="timerEl">1:30</div><div class="hdr-timer-lbl">TEMPS</div></div>
    </div>
    <div class="score-row">
      <div class="score-box"><div class="score-val yellow" id="scoreArgent">0€</div><div class="score-lbl">Gagné</div></div>
      <div class="score-box"><div class="score-val green" id="scoreOk">0</div><div class="score-lbl">✓ OK</div></div>
      <div class="score-box"><div class="score-val red" id="scoreMissed">0</div><div class="score-lbl">✗ Ratés</div></div>
      <div class="score-box"><div class="score-val" id="scoreCombo">×1.0</div><div class="score-lbl">Combo</div></div>
    </div>
  </div>

  <div class="scene" id="scene">
    <div class="feedback-flash" id="flashEl"></div>
  </div>

  <div class="btn-zone">
    <button class="suspect-btn" id="suspectBtn" onclick="onSuspect()">🚨 SUSPECT !</button>
  </div>
</div>

<script>
const SB_URL = 'https://drtsuhnbclhmgfjiykap.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
const sb = supabase.createClient(SB_URL, SB_KEY);

// ── Config ──
const GAME_DURATION = 90; // secondes
const BAGS_NORMAL  = ['🧳','🎒','👝','🛄','💼'];
const BAGS_SUSPECT = ['👜','🎽','🛍','🎁','📦'];
const SUSPECTS     = ['🔪','💣','🔫','🍾','💊','🧨'];

// ── État ──
let currentUser = null;
let totalMoney = 0, currentXp = 0, currentLevel = 1;
let sessionMoney = 0, sessionXp = 0;
let score = 0, missed = 0, falsePos = 0;
let combo = 1.0;
let timeLeft = GAME_DURATION;
let gameRunning = false;
let timerInterval = null;
let bagTimeout = null;
let currentBag = null; // { isSuspect, moneyReward, xpReward, el }

// ── Difficulté selon niveau ──
function getDifficulty(lvl) {
  if (lvl <= 5)  return { suspectRate:0.3, speed:4.5, moneyBase:80,  xpBase:6  };
  if (lvl <= 15) return { suspectRate:0.35,speed:3.8, moneyBase:150, xpBase:10 };
  if (lvl <= 30) return { suspectRate:0.4, speed:3.2, moneyBase:250, xpBase:15 };
  return               { suspectRate:0.45,speed:2.6, moneyBase:400, xpBase:22 };
}

// ── Utils ──
function fmt(n){ return n>=1000000?(n/1000000).toFixed(1)+'M€':n>=1000?Math.floor(n/1000)+'k€':n+'€'; }
function rand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function fmtTime(s){ return Math.floor(s/60)+':'+(s%60<10?'0':'')+s%60; }

function getXpRequired(lvl){
  if(lvl<=10) return lvl*500;
  if(lvl<=25) return lvl*1000;
  if(lvl<=50) return lvl*2000;
  return lvl*4000;
}

function spawnParticle(txt, cls, x, y){
  const p = document.createElement('div');
  p.className = 'particle ' + cls;
  p.textContent = txt;
  p.style.left = (x||window.innerWidth/2-20) + 'px';
  p.style.top  = (y||window.innerHeight*0.6) + 'px';
  document.body.appendChild(p);
  setTimeout(function(){ p.remove(); }, 900);
}

function flash(type){
  const el = document.getElementById('flashEl');
  el.className = 'feedback-flash ' + type + ' show';
  setTimeout(function(){ el.className = 'feedback-flash ' + type; }, 250);
}

function updateDisplay(){
  document.getElementById('scoreArgent').textContent = fmt(sessionMoney);
  document.getElementById('scoreOk').textContent     = score;
  document.getElementById('scoreMissed').textContent = missed;
  document.getElementById('scoreCombo').textContent  = '×' + combo.toFixed(1);
}

// ── Tapis animé ──
function buildBeltLines(){
  const wrap = document.getElementById('beltLines');
  for(var i=0;i<20;i++){
    var line = document.createElement('div');
    line.className = 'belt-line';
    line.style.top = (i*5) + '%';
    line.style.animationDelay = (i*0.06) + 's';
    wrap.appendChild(line);
  }
}

// ── Lignes de perspective ──
function buildPerspLines(){
  const wrap = document.getElementById('perspLines');
  const vw = window.innerWidth, vh = window.innerHeight;
  const vx = vw/2, vy = vh*0.44;
  for(var i=0;i<=10;i++){
    var x = (vw/10)*i;
    var angle = Math.atan2(vh-vy, x-vx)*180/Math.PI - 90;
    var length = Math.sqrt(Math.pow(vh-vy,2)+Math.pow(x-vx,2));
    var line = document.createElement('div');
    line.className = 'persp-line';
    line.style.cssText = 'left:'+x+'px;height:'+length+'px;transform:rotate('+angle+'deg);transform-origin:bottom center;bottom:0;';
    wrap.appendChild(line);
  }
}

// ── Spawner valise ──
function spawnBag(){
  if(!gameRunning) return;

  const diff = getDifficulty(currentLevel);
  const isSuspect = Math.random() < diff.suspectRate;
  const bagEmoji  = isSuspect ? rand(BAGS_SUSPECT) : rand(BAGS_NORMAL);
  const suspectObj = isSuspect ? rand(SUSPECTS) : null;
  const moneyReward = Math.round(diff.moneyBase * combo);
  const xpReward    = diff.xpBase;
  const speed       = diff.speed + (Math.random()*0.8 - 0.4);

  const scene = document.getElementById('scene');
  const wrap = document.createElement('div');
  wrap.className = 'bag-wrap' + (isSuspect ? ' suspect' : '');

  const emojiWrap = document.createElement('div');
  emojiWrap.style.position = 'relative';
  const emojiEl = document.createElement('div');
  emojiEl.className = 'bag-emoji-el';
  emojiEl.textContent = bagEmoji;
  emojiWrap.appendChild(emojiEl);

  if(isSuspect){
    const alert = document.createElement('div');
    alert.className = 'bag-alert';
    alert.textContent = '!';
    emojiWrap.appendChild(alert);
  }

  wrap.appendChild(emojiWrap);
  scene.appendChild(wrap);

  currentBag = { isSuspect, moneyReward, xpReward, el: wrap, passed: false };

  // Animation perspective : scale de 0.1 à 1.2 en <speed> secondes
  const startTime = Date.now();
  const duration  = speed * 1000;

  function animate(){
    if(!gameRunning){ wrap.remove(); return; }
    const elapsed = Date.now() - startTime;
    const progress = Math.min(elapsed / duration, 1);
    // Ease in (accélération légère)
    const eased = progress * progress * (3 - 2*progress);
    const scale = 0.08 + eased * 1.1;
    const opacity = progress < 0.1 ? progress*10 : 1;

    wrap.style.transform = 'translateX(-50%) scale('+scale+')';
    wrap.style.opacity   = opacity;

    if(progress < 1){
      requestAnimationFrame(animate);
    } else {
      // Valise passée sans être signalée
      if(!currentBag.passed){
        currentBag.passed = true;
        if(isSuspect){
          missed++;
          combo = Math.max(1, combo - 0.5);
          flash('bad');
          spawnParticle('-'+Math.round(moneyReward*0.3)+'€', 'bad');
        }
        updateDisplay();
      }
      wrap.remove();
      currentBag = null;
      // Délai avant prochaine valise
      bagTimeout = setTimeout(spawnBag, 600 + Math.random()*800);
    }
  }
  requestAnimationFrame(animate);
}

// ── Bouton SUSPECT ──
function onSuspect(){
  if(!gameRunning || !currentBag || currentBag.passed) return;

  currentBag.passed = true;
  const bag = currentBag;

  if(bag.isSuspect){
    // Bonne détection
    score++;
    combo = Math.min(combo + 0.3, 5.0);
    const earned = bag.moneyReward;
    const xpEarned = bag.xpReward;
    sessionMoney += earned; totalMoney += earned;
    sessionXp    += xpEarned; currentXp += xpEarned;
    flash('good');
    spawnParticle('+'+fmt(earned), 'good');
    spawnParticle('+'+xpEarned+' XP', 'xp', window.innerWidth/2+40, window.innerHeight*0.55);
  } else {
    // Faux positif
    falsePos++;
    combo = Math.max(1, combo - 0.3);
    const penalty = Math.round(bag.moneyReward * 0.2);
    sessionMoney = Math.max(0, sessionMoney - penalty);
    totalMoney   = Math.max(0, totalMoney - penalty);
    flash('bad');
    spawnParticle('-'+fmt(penalty), 'bad');
  }

  // Faire disparaître la valise rapidement
  if(bag.el){ bag.el.style.transition='opacity .2s'; bag.el.style.opacity='0'; setTimeout(function(){ bag.el.remove(); }, 200); }
  currentBag = null;
  updateDisplay();

  clearTimeout(bagTimeout);
  bagTimeout = setTimeout(spawnBag, 400);
}

// ── Timer ──
function startTimer(){
  timerInterval = setInterval(function(){
    timeLeft--;
    const el = document.getElementById('timerEl');
    el.textContent = fmtTime(timeLeft);
    el.className = 'hdr-timer' + (timeLeft <= 15 ? ' urgent' : '');
    if(timeLeft <= 0){
      clearInterval(timerInterval);
      endGame();
    }
  }, 1000);
}

// ── Fin de partie ──
async function endGame(){
  gameRunning = false;
  clearTimeout(bagTimeout);
  if(currentBag && currentBag.el){ currentBag.el.remove(); currentBag = null; }
  document.getElementById('suspectBtn').disabled = true;

  // Sauvegarder
  try {
    const { data: fresh } = await sb.from('game_stats').select('money,xp,level').eq('user_id',currentUser.id).maybeSingle();
    const newMoney = Math.max((fresh&&fresh.money)||0, Math.floor(totalMoney));
    const newXp    = Math.floor(currentXp);
    await sb.from('game_stats').update({ money:newMoney, xp:newXp, level:currentLevel }).eq('user_id',currentUser.id);
  } catch(e){}

  showPopup();
}

function showPopup(){
  const accuracy = score+falsePos > 0 ? Math.round(score/(score+falsePos)*100) : 0;
  const overlay = document.createElement('div');
  overlay.className = 'popup-overlay';
  overlay.innerHTML =
    '<div class="popup">' +
      '<div class="popup-emoji">' + (score>=5?'🎉':'😅') + '</div>' +
      '<div class="popup-tag">FIN DE SESSION</div>' +
      '<div class="popup-title">CONTRÔLE TERMINÉ</div>' +
      '<div class="popup-grid">' +
        '<div class="popup-stat"><div class="popup-stat-v yellow">'+fmt(sessionMoney)+'</div><div class="popup-stat-l">Gagné</div></div>' +
        '<div class="popup-stat"><div class="popup-stat-v green">'+score+'</div><div class="popup-stat-l">Détectés</div></div>' +
        '<div class="popup-stat"><div class="popup-stat-v red">'+missed+'</div><div class="popup-stat-l">Ratés</div></div>' +
        '<div class="popup-stat"><div class="popup-stat-v">'+accuracy+'%</div><div class="popup-stat-l">Précision</div></div>' +
      '</div>' +
      '<button class="popup-btn" id="popupRetry">REJOUER</button>' +
      '<button class="popup-btn-sec" id="popupBack">← Retour</button>' +
    '</div>';
  document.body.appendChild(overlay);
  document.getElementById('popupRetry').onclick = function(){ overlay.remove(); restartGame(); };
  document.getElementById('popupBack').onclick  = function(){ window.location.href='travail.html'; };
}

function restartGame(){
  sessionMoney=0; sessionXp=0; score=0; missed=0; falsePos=0;
  combo=1.0; timeLeft=GAME_DURATION;
  document.getElementById('timerEl').textContent = fmtTime(timeLeft);
  document.getElementById('timerEl').className = 'hdr-timer';
  document.getElementById('suspectBtn').disabled = false;
  updateDisplay();
  gameRunning=true;
  startTimer();
  spawnBag();
}

// ── Init ──
async function init(){
  buildBeltLines();
  buildPerspLines();
  try {
    const res = await sb.auth.getSession();
    const sess = res.data && res.data.session;
    if(!sess){ window.location.href='index.html'; return; }
    currentUser = sess.user;

    const gsRes = await sb.from('game_stats').select('money,xp,level').eq('user_id',currentUser.id).maybeSingle();
    if(gsRes.data){
      totalMoney   = gsRes.data.money || 0;
      currentXp    = gsRes.data.xp    || 0;
      currentLevel = gsRes.data.level || 1;
    }

    document.getElementById('loader').style.display = 'none';
    document.getElementById('mainPage').style.display = 'flex';

    gameRunning = true;
    startTimer();
    setTimeout(spawnBag, 800);
  } catch(e){
    alert('Erreur: ' + e.message);
  }
}

window.addEventListener('beforeunload', function(){
  if(currentUser) sb.from('game_stats').update({ money:Math.floor(totalMoney), xp:Math.floor(currentXp), level:currentLevel }).eq('user_id',currentUser.id);
});

init();
</script>
