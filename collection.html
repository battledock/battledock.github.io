var RL={C:'COMMUNE',R:'RARE',L:'LÉGENDAIRE',S:'★ SECRÈTE ★',M:'✦ MÉGA RARE ✦'};
var RCo={C:'#6b7280',R:'#3b82f6',L:'#fbbf24',S:'#ef4444',M:'#fbbf24'};
var XPR={C:0,R:1000,L:5000,S:15000,M:30000};

function fm(n){return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1000?Math.floor(n/1000)+'k':n;}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2500);}
function qty(id){return myCards[id]||0;}
function uniqueCount(){return Object.keys(myCards).filter(function(k){return myCards[k]>0;}).length;}
function updMoney(){document.getElementById('hMoney').textContent='💰 '+fm(money);}

function setMain(v){
  mainView=v;
  ['Cards','Packs','Market'].forEach(function(x,i){
    var ids=['cards','packs','market'];
    document.getElementById('mt'+x).className='main-tab '+(ids[i]===v?'on':'');
  });
  renderMain();
}

function renderMain(){
  var uc=uniqueCount();
  document.getElementById('pC').textContent=uc+'/'+CD.length;
  document.getElementById('pB').style.width=(uc/CD.length*100)+'%';
  document.getElementById('pP').textContent=Math.round(uc/CD.length*100)+'%';
  updMoney();
  if(mainView==='cards')renderCards();
  else if(mainView==='packs')renderPacks();
  else renderMarket();
}

function renderCards(){
  var cats=[['all','TOUTES'],['perso','PERSOS'],['item','OBJETS'],['lieu','LIEUX'],['nature','NATURE']];
  var h='<div class="sub-tabs">';
  cats.forEach(function(c){h+='<div class="sub-tab'+(subFilter===c[0]?' on':'')+'" onclick="subFilter=\''+c[0]+'\';renderMain()">'+c[1]+'</div>';});
  h+='</div>';
  var fl=CD.filter(function(c){return subFilter==='all'||c.cat===subFilter;});
  var order={M:0,S:1,L:2,R:3,C:4};
  fl.sort(function(a,b){return order[a.rarity]-order[b.rarity];});
  var lastR='';
  fl.forEach(function(c){
    if(c.rarity!==lastR){if(lastR)h+='</div>';lastR=c.rarity;h+='<div class="sec" style="color:'+RCo[c.rarity]+'">'+RL[c.rarity]+'</div><div class="grid">';}
    var has=qty(c.id)>0;
    h+='<div class="slot r-'+c.rarity+(has?'':' locked')+'" onclick="showDet('+c.id+')">';
    h+='<div class="slot-inner">';
    h+='<div class="slot-rt rt-'+c.rarity+'">'+RL[c.rarity].replace(/[★✦ ]/g,'').slice(0,3)+'</div>';
    if(has){
      h+='<div class="slot-emo">'+c.emoji+'</div><div class="slot-name">'+c.name+'</div>';
      if(qty(c.id)>1)h+='<div class="slot-qty">x'+qty(c.id)+'</div>';
    }else{h+='<div class="slot-emo" style="opacity:.3">❓</div><div class="slot-name" style="color:#333">???</div>';}
    h+='</div></div>';
  });
  h+='</div>';
  document.getElementById('mainContent').innerHTML=h;
}

async function loadMarket(){
  try{
    var {data:offers}=await sb.from('card_market').select('*').eq('status','active').order('created_at',{ascending:false});
    var {data:profs}=await sb.from('profiles').select('user_id,username');
    var pm={};if(profs)profs.forEach(function(p){pm[p.user_id]=p.username;});
    var el=document.getElementById('marketList');
    var myEl=document.getElementById('myOffers');
    if(!offers||!offers.length){el.innerHTML='<div style="padding:20px;text-align:center;color:#555;font-size:11px">Aucune offre. Sois le premier à vendre !</div>';myEl.innerHTML='<div style="padding:20px;text-align:center;color:#555;font-size:11px">Aucune offre en cours</div>';return;}

    var others=offers.filter(function(o){return o.seller_id!==CU.id;});
    var mine=offers.filter(function(o){return o.seller_id===CU.id;});

    if(!others.length)el.innerHTML='<div style="padding:20px;text-align:center;color:#555;font-size:11px">Aucune offre disponible</div>';
    else{
      var oh='';
      others.forEach(function(o){
        var c=CD[o.card_id];if(!c)return;
        oh+='<div class="offer"><div class="offer-card r-'+c.rarity+'">'+c.emoji+'</div>';
        oh+='<div class="offer-info"><div class="offer-name">'+c.name+'</div>';
        oh+='<div class="offer-sub">'+RL[c.rarity]+' · @'+(pm[o.seller_id]||'?')+'</div></div>';
        oh+='<div class="offer-price">'+fm(o.price)+(o.price_type==='diamonds'?'💎':'€')+'</div>';
        oh+='<button class="offer-btn" style="background:#4ade80;color:#052e16" onclick="buyCard(\''+o.id+'\')">ACHETER</button>';
        oh+='</div>';
      });
      el.innerHTML=oh;
    }

    if(!mine.length)myEl.innerHTML='<div style="padding:20px;text-align:center;color:#555;font-size:11px">Aucune offre en cours</div>';
    else{
      var mh='';
      mine.forEach(function(o){
        var c=CD[o.card_id];if(!c)return;
        mh+='<div class="offer"><div class="offer-card r-'+c.rarity+'">'+c.emoji+'</div>';
        mh+='<div class="offer-info"><div class="offer-name">'+c.name+'</div>';
        mh+='<div class="offer-sub">'+fm(o.price)+(o.price_type==='diamonds'?'💎':'€')+'</div></div>';
        mh+='<button class="offer-btn" style="background:#ef4444;color:#fff" onclick="cancelOffer(\''+o.id+'\','+o.card_id+')">ANNULER</button>';
        mh+='</div>';
      });
      myEl.innerHTML=mh;
    }
  }catch(e){
    document.getElementById('marketList').innerHTML='<div style="padding:20px;text-align:center;color:#ef4444;font-size:11px">Erreur — La table card_market n\'existe pas encore.<br>Lance le SQL dans Supabase !</div>';
  }
}

function openSellPanel(){
  var sellable=[];
  Object.keys(myCards).forEach(function(k){
    if(myCards[k]>=2)sellable.push({id:parseInt(k),qty:myCards[k]});
  });
  var h='<div style="font-family:Bangers,cursive;font-size:18px;color:#fbbf24;text-align:center;margin-bottom:10px">VENDRE UNE CARTE</div>';
  if(!sellable.length){h+='<div style="text-align:center;color:#555;font-size:11px;padding:20px">Tu dois avoir au moins 2 exemplaires pour vendre (tu gardes toujours 1)</div>';}
  else{
    sellable.forEach(function(s){
      var c=CD[s.id];
      h+='<div class="sell-row" onclick="sellCard('+s.id+')">';
      h+='<div class="offer-card r-'+c.rarity+'" style="width:36px;height:48px;font-size:18px;border-radius:5px">'+c.emoji+'</div>';
      h+='<div style="flex:1"><div style="font-size:11px;font-weight:800;color:#fff">'+c.name+'</div>';
      h+='<div style="font-size:8px;color:#555">'+RL[c.rarity]+' · x'+s.qty+' (1 en vente)</div></div>';
      h+='<div style="font-size:12px;color:#fbbf24">→</div></div>';
    });
  }
  document.getElementById('sellSlot').innerHTML=h;
  document.getElementById('sellOv').classList.add('show');
}

async function sellCard(cardId){
  var price=parseInt(prompt('Prix de vente en € ?'));
  if(!price||price<=0)return toast('Prix invalide');
  document.getElementById('sellOv').classList.remove('show');
  // Remove 1 from inventory
  myCards[cardId]--;if(myCards[cardId]<=0)delete myCards[cardId];
  await saveCards();
  // Create listing
  await sb.from('card_market').insert({seller_id:CU.id,card_id:cardId,price:price,price_type:'money',status:'active'});
  toast('📤 Carte en vente !');
  renderMarket();
}

async function buyCard(offerId){
  var {data:offer}=await sb.from('card_market').select('*').eq('id',offerId).eq('status','active').maybeSingle();
  if(!offer)return toast('Offre plus disponible');
  if(offer.seller_id===CU.id)return toast('C\'est ta propre offre !');
  if(offer.price_type==='money'&&money<offer.price)return toast('Pas assez d\'argent !');
  if(offer.price_type==='diamonds'&&diamonds<offer.price)return toast('Pas assez de diamants !');

  // Deduct buyer money
  if(offer.price_type==='money')money-=offer.price;else diamonds-=offer.price;
  // Add card to buyer
  myCards[offer.card_id]=(myCards[offer.card_id]||0)+1;
  await saveCards();

  // Credit seller
  var {data:sellerGs}=await sb.from('game_stats').select('money,diamonds').eq('user_id',offer.seller_id).maybeSingle();
  if(sellerGs){
    if(offer.price_type==='money')await sb.from('game_stats').update({money:(sellerGs.money||0)+offer.price}).eq('user_id',offer.seller_id);
    else await sb.from('game_stats').update({diamonds:(sellerGs.diamonds||0)+offer.price}).eq('user_id',offer.seller_id);
  }

  // Mark as sold
  await sb.from('card_market').update({status:'sold',buyer_id:CU.id,bought_at:new Date().toISOString()}).eq('id',offerId);

  var c=CD[offer.card_id];
  toast('✅ '+c.name+' achetée !');
  renderMain();
}

async function cancelOffer(offerId,cardId){
  // Return card
  myCards[cardId]=(myCards[cardId]||0)+1;
  await saveCards();
  await sb.from('card_market').delete().eq('id',offerId);
  toast('Offre annulée');
  renderMarket();
}

function mkArt(c){
  var bg=c.rarity==='M'?'#050510':c.rarity==='S'?'#1a0505':c.rarity==='L'?'#1a0a00':c.rarity==='R'?'#0c1929':'#1f2937';
  var s='<svg viewBox="0 0 190 155" width="100%" height="100%"><rect width="190" height="155" fill="'+bg+'"/>';
  if(c.rarity==='M'){s+='<defs><radialGradient id="mg'+c.id+'"><stop offset="0%" stop-color="rgba(251,191,36,.12)"/><stop offset="100%" stop-color="transparent"/></radialGradient></defs><circle cx="95" cy="75" r="55" fill="url(#mg'+c.id+')"/><circle cx="40" cy="30" r="1" fill="#fbbf24" opacity=".3"><animate attributeName="opacity" values=".1;.5;.1" dur="3s" repeatCount="indefinite"/></circle>';}
  else if(c.rarity==='S'){s+='<circle cx="95" cy="75" r="40" fill="none" stroke="rgba(239,68,68,.06)" stroke-width="1"/><circle cx="95" cy="75" r="25" fill="rgba(239,68,68,.03)"/>';}
  else if(c.rarity==='L'){s+='<circle cx="95" cy="75" r="45" fill="none" stroke="rgba(251,191,36,.05)" stroke-width="1"/>';}
  s+='<text x="95" y="92" text-anchor="middle" font-size="52">'+c.emoji+'</text></svg>';
  return s;
}

function showDet(id){
  var c=CD[id];if(!c||qty(id)<=0){toast('Pas encore obtenue');return;}
  var isM=c.rarity==='M',hasHolo=c.rarity!=='C';
  var h='<div class="dc r-'+c.rarity+'">';
  if(isM)h+='<div class="mega-border"></div><div class="mega-inner"></div>';
  h+='<div class="dc-rt rt-'+c.rarity+'">'+RL[c.rarity]+'</div>';
  if(hasHolo)h+='<div class="holo"><div class="holo-rain"></div><div class="holo-shim"></div></div>';
  h+='<div class="dc-art" style="position:relative;z-index:2">'+mkArt(c)+'</div>';
  h+='<div class="dc-body"><div class="dc-name'+(isM?' mega-name':'')+'">'+c.name+'</div>';
  h+='<div class="dc-type">'+c.cat.toUpperCase()+' · x'+qty(id)+'</div>';
  h+='<div class="dc-desc">'+c.desc+'</div>';
  h+='<div class="dc-flavor">'+c.flavor+'</div></div></div>';
  document.getElementById('detSlot').innerHTML=h;
  document.getElementById('detOv').classList.add('show');
}

// ═══ PACK OPENING ═══
var revQ=[],revI=0;
async function buyExclusive(exId){
  try{
    var {data:ex}=await sb.from('shop_stock').select('*').eq('id',exId).maybeSingle();
    if(!ex||ex.sold>=ex.max_qty)return toast('Plus disponible !');
    var meta=ex.metadata||{};
    if(ex.price_type==='money'&&money<ex.base_price)return toast('Pas assez !');
    if(ex.price_type==='diamonds'&&diamonds<ex.base_price)return toast('Pas assez !');
    // Increment sold atomically
    var {data:upd,error}=await sb.from('shop_stock').update({sold:ex.sold+1}).eq('id',exId).eq('sold',ex.sold).select();
    if(error||!upd||!upd.length)return toast('Trop tard !');
    if(ex.price_type==='money')money-=ex.base_price;else diamonds-=ex.base_price;
    if(meta.card_id!==undefined){myCards[meta.card_id]=(myCards[meta.card_id]||0)+1;}
    await saveCards();
    toast('⭐ Item exclusif obtenu !');
    renderPacks();
  }catch(e){toast('Erreur');}
}

function openPack(type,dynPrice){
  var today=new Date().toISOString().split('T')[0];
  var key=type==='std'?'std_'+today:'leg_'+today;
  var stock=shopData[key];
  if(stock&&stock.sold>=stock.max_qty)return toast('Stock épuisé ! Reviens demain.');
  if(type==='std'){
    if(money<dynPrice)return toast('Pas assez ! ('+fm(dynPrice)+'€)');
    money-=dynPrice;
  }else{
    if(diamonds<dynPrice)return toast('Pas assez ! ('+dynPrice+'💎)');
    diamonds-=dynPrice;
  }
  // Update stock
  if(stock){stock.sold++;sb.from('shop_stock').update({sold:stock.sold}).eq('id',key);}
  var drawn=[];
  var gR=type==='std'?'R':'L';
  var gPool=CD.filter(function(c){return c.rarity===gR;});
  drawn.push(gPool[Math.floor(Math.random()*gPool.length)]);
  for(var i=0;i<2;i++){
    var roll=Math.random(),r;
    if(roll<0.00001)r='M';else if(roll<0.001)r='S';else if(roll<0.01)r='L';else if(roll<0.1)r='R';else r='C';
    var rP=CD.filter(function(c){return c.rarity===r;});
    if(!rP.length)rP=CD.filter(function(c){return c.rarity==='C';});
    drawn.push(rP[Math.floor(Math.random()*rP.length)]);
  }
  revQ=drawn;revI=0;showRev();
}

function showRev(){
  if(revI>=revQ.length){document.getElementById('revOv').classList.remove('show');document.getElementById('parts').innerHTML='';saveCards();renderMain();return;}
  var c=revQ[revI];
  var isNew=qty(c.id)===0;
  var hasHolo=c.rarity!=='C';var isM=c.rarity==='M';
  myCards[c.id]=(myCards[c.id]||0)+1;
  var xpR=isNew?XPR[c.rarity]:0;if(xpR>0)xp+=xpR;
  if(isNew&&isM)money+=500000;
  if(!isNew)money+=500;

  var h='<div class="rc r-'+c.rarity+'" id="ac">';
  if(isM)h+='<div class="mega-border"></div><div class="mega-inner"></div>';
  if(hasHolo)h+='<div class="holo"><div class="holo-rain"></div><div class="holo-shim"></div></div>';
  h+='<div style="position:absolute;top:8px;right:8px;z-index:5;font-size:7px;font-weight:900;padding:2px 8px;border-radius:4px;background:'+(isNew?'#4ade80':'#6b7280')+';color:'+(isNew?'#052e16':'#fff')+'">'+(isNew?'NOUVELLE !':'DOUBLON x'+qty(c.id))+'</div>';
  h+='<div class="dc-art" style="position:relative;z-index:2;height:180px">'+mkArt(c)+'</div>';
  h+='<div style="padding:12px 16px;position:relative;z-index:2;text-align:center">';
  h+='<div style="display:inline-block;font-size:6px;font-weight:900;letter-spacing:3px;padding:2px 10px;border-radius:4px;background:'+RCo[c.rarity]+';color:'+(c.rarity==='L'||c.rarity==='M'?'#1a1a1a':'#fff')+'">'+RL[c.rarity]+'</div>';
  h+='<div class="dc-name'+(isM?' mega-name':'')+'" style="margin-top:6px">'+c.name+'</div>';
  h+='<div class="dc-type" style="margin-top:2px">'+c.cat.toUpperCase()+'</div>';
  h+='<div class="dc-desc" style="margin-top:8px">'+c.desc+'</div>';
  if(isNew&&xpR>0)h+='<div style="margin-top:8px;font-size:10px;font-weight:800;color:#4ade80">+'+xpR.toLocaleString()+' XP</div>';
  if(isNew&&isM)h+='<div style="font-size:12px;font-weight:800;color:#fbbf24;margin-top:2px">+500 000€ !!</div>';
  if(!isNew)h+='<div style="margin-top:6px;font-size:9px;color:#666">Doublon → +500€</div>';
  h+='</div></div>';

  document.getElementById('revSlot').innerHTML=h;
  document.getElementById('revOv').classList.add('show');
  document.getElementById('revHint').textContent=revI<revQ.length-1?'TAP ('+(revQ.length-revI-1)+' restantes)':'TAP POUR FERMER';
  if(isM){flash();spawn('#fbbf24',40,'star');setTimeout(flash,200);}
  else if(c.rarity==='S'){flash();spawn('#ef4444',30,'dot');}
  else if(c.rarity==='L'){flash();spawn('#fbbf24',20,'dot');}
  else spawn(RCo[c.rarity],10,'dot');
  setTimeout(function(){var el=document.getElementById('ac');if(el)el.classList.add('go');},80);
  if(isNew&&xpR>0)setTimeout(function(){var p=document.createElement('div');p.className='xp-pop';p.textContent='+'+xpR.toLocaleString()+' XP';document.body.appendChild(p);setTimeout(function(){p.remove();},1500);},600);
  revI++;
}
function nextRev(){showRev();}
function flash(){var f=document.getElementById('fl');f.classList.add('on');setTimeout(function(){f.classList.remove('on');},100);}
function spawn(col,n,type){var el=document.getElementById('parts');el.innerHTML='';for(var i=0;i<n;i++){var p=document.createElement('div');if(type==='star'){p.className='st';p.textContent=['✨','⭐','💫','🌟'][Math.floor(Math.random()*4)];}else{p.className='pt';p.style.background=col;p.style.width=(2+Math.random()*4)+'px';p.style.height=p.style.width;}p.style.left=Math.random()*100+'%';p.style.top=(20+Math.random()*50)+'%';p.style.animationDelay=Math.random()+'s';el.appendChild(p);}}

// ═══ SAVE ═══
async function saveCards(){
  var {data:gs}=await sb.from('game_stats').select('records').eq('user_id',CU.id).maybeSingle();
  var rec=(gs&&gs.records)||{};rec.cards=myCards;
  await sb.from('game_stats').update({records:rec,money:money,diamonds:diamonds,xp:xp}).eq('user_id',CU.id);
  updMoney();
}

(async function(){
  var r=await sb.auth.getSession();var s=r.data&&r.data.session;
  if(!s){location.href='index.html';return;}CU=s.user;
  var {data:gs}=await sb.from('game_stats').select('money,diamonds,xp,records').eq('user_id',CU.id).maybeSingle();
  if(gs){money=gs.money||0;diamonds=gs.diamonds||0;xp=gs.xp||0;
    var raw=(gs.records&&gs.records.cards)||{};
    // Migrate from array to object if needed
    if(Array.isArray(raw)){var obj={};raw.forEach(function(id){obj[id]=(obj[id]||0)+1;});myCards=obj;}
    else myCards=raw;
  }
  renderMain();
})();
</script>
