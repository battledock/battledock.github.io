<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Classement Clark — Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
body{font-family:'Inter',sans-serif;background:#0a0a0a;color:#fff;padding-bottom:80px}
.header{padding:calc(env(safe-area-inset-top,0px)+16px) 16px 16px;text-align:center}
.header-emoji{font-size:48px}
.header-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:3px;margin-top:4px;color:#fbbf24}
.header-sub{font-size:11px;color:rgba(255,255,255,.3);margin-top:4px}
.my-stats{margin:12px 16px;background:rgba(255,255,255,.05);border-radius:14px;border:1px solid rgba(255,255,255,.08);padding:14px;display:flex;justify-content:space-around;text-align:center}
.stat-val{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#fbbf24}
.stat-label{font-size:9px;color:rgba(255,255,255,.3);letter-spacing:1px;margin-top:2px}
.section{font-size:10px;font-weight:700;color:rgba(255,255,255,.2);letter-spacing:2px;padding:16px 16px 8px}
.row{display:flex;align-items:center;padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.04)}
.row.me{background:rgba(251,191,36,.08);border-radius:10px;margin:0 8px;border:1px solid rgba(251,191,36,.15)}
.rank{width:28px;font-family:'Bebas Neue',sans-serif;font-size:18px;color:rgba(255,255,255,.3);text-align:center}
.rank.gold{color:#fbbf24}.rank.silver{color:#c0c0c0}.rank.bronze{color:#cd7f32}
.player-name{flex:1;font-weight:700;font-size:13px;margin-left:10px}
.player-time{font-family:'Bebas Neue',sans-serif;font-size:16px;color:#4ade80}
.player-races{font-size:10px;color:rgba(255,255,255,.2);margin-left:8px}
.empty{text-align:center;padding:40px;color:rgba(255,255,255,.15);font-size:13px}
.bottom-bar{position:fixed;bottom:0;left:0;right:0;padding:10px 16px calc(env(safe-area-inset-bottom,0px)+10px);background:#0a0a0a;border-top:1px solid rgba(255,255,255,.05);z-index:20}
.back-btn{width:100%;padding:12px;border:none;border-radius:12px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.5);font-weight:700;font-size:13px;cursor:pointer}
.loading{text-align:center;padding:40px;color:rgba(255,255,255,.2);font-size:12px}
</style>
</head>
<body>
<div class="header">
  <div class="header-emoji">🏎️</div>
  <div class="header-title">CLASSEMENT CLARK</div>
  <div class="header-sub">Meilleurs temps de course</div>
</div>
<div class="my-stats" id="myStats" style="display:none">
  <div><div class="stat-val" id="myBest">—</div><div class="stat-label">MEILLEUR TEMPS</div></div>
  <div><div class="stat-val" id="myRaces">0</div><div class="stat-label">COURSES</div></div>
  <div><div class="stat-val" id="myWins">0</div><div class="stat-label">VICTOIRES</div></div>
</div>
<div class="section">CLASSEMENT DES MEILLEURS TEMPS</div>
<div id="list"><div class="loading">Chargement...</div></div>
<div class="bottom-bar">
  <button class="back-btn" onclick="location.href='travail.html'">← RETOUR</button>
</div>
<script>
var SB_URL='https://drtsuhnbclhmgfjiykap.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
var sb=supabase.createClient(SB_URL,SB_KEY);

(async function(){
  var s=await sb.auth.getSession();
  if(!s.data.session){location.href='index.html';return;}
  var me=s.data.session.user;

  // Get all players with clark records
  var res=await sb.from('game_stats').select('user_id,records').not('records','is',null);
  if(!res.data){document.getElementById('list').innerHTML='<div class="empty">Aucun résultat</div>';return;}

  // Get profiles for usernames
  var profiles=await sb.from('profiles').select('id,username');
  var pMap={};if(profiles.data)profiles.data.forEach(function(p){pMap[p.id]=p.username;});

  // Filter players with clark_best
  var players=[];
  res.data.forEach(function(gs){
    if(gs.records&&gs.records.clark_best){
      players.push({
        id:gs.user_id,
        name:pMap[gs.user_id]||'Joueur',
        best:gs.records.clark_best,
        races:gs.records.clark_races||0,
        wins:gs.records.clark_wins||0,
      });
    }
  });

  players.sort(function(a,b){return a.best-b.best;});

  // My stats
  var myData=players.find(function(p){return p.id===me.id;});
  if(myData){
    document.getElementById('myStats').style.display='flex';
    document.getElementById('myBest').textContent=myData.best.toFixed(1)+'s';
    document.getElementById('myRaces').textContent=myData.races;
    document.getElementById('myWins').textContent=myData.wins;
  }

  if(!players.length){document.getElementById('list').innerHTML='<div class="empty">Aucun temps enregistré</div>';return;}

  var html='';
  players.forEach(function(p,i){
    var isMe=p.id===me.id;
    var rankClass=i===0?'gold':i===1?'silver':i===2?'bronze':'';
    var medals=['🥇','🥈','🥉'];
    html+='<div class="row'+(isMe?' me':'')+'">';
    html+='<div class="rank '+rankClass+'">'+(i<3?medals[i]:(i+1))+'</div>';
    html+='<div class="player-name">'+(isMe?'<span style="color:#fbbf24">'+p.name+'</span>':p.name)+'</div>';
    html+='<div class="player-time">'+p.best.toFixed(1)+'s</div>';
    html+='<div class="player-races">'+p.races+' courses</div>';
    html+='</div>';
  });
  document.getElementById('list').innerHTML=html;
})();
</script>
</body>
</html>
