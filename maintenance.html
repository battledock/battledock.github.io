<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Battle Dock — Maintenance</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter',sans-serif}
body{background:linear-gradient(160deg,#020810,#0c2a4a,#0369a1);position:relative}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:20px 20px;pointer-events:none}

/* Particules */
.p{position:fixed;border-radius:50%;background:#fff;animation:twink var(--d) ease-in-out infinite var(--dl)}
@keyframes twink{0%,100%{opacity:.03}50%{opacity:.15}}

/* Layout */
#wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;z-index:1}

/* Logo / Titre */
#logo{text-align:center;margin-bottom:32px}
#logo-sub{font-size:9px;font-weight:800;color:rgba(255,255,255,.2);letter-spacing:6px;margin-bottom:10px}
#logo-title{font-family:'Bebas Neue',sans-serif;font-size:64px;color:#fff;letter-spacing:8px;line-height:.85;text-shadow:0 0 60px rgba(14,165,233,.25)}
#logo-version{font-family:'Bebas Neue',sans-serif;font-size:14px;color:rgba(14,165,233,.5);letter-spacing:6px;margin-top:10px}

/* Card maintenance -->
#card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:24px;width:100%;max-width:380px;backdrop-filter:blur(20px)}

/* Badge maintenance -->
#badge{display:inline-flex;align-items:center;gap:6px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.15);border-radius:100px;padding:5px 14px;margin-bottom:18px}
#badge-dot{width:6px;height:6px;border-radius:50%;background:#fbbf24;box-shadow:0 0 8px #fbbf24;animation:bdot .8s ease-in-out infinite alternate}
@keyframes bdot{from{opacity:.5;transform:scale(1)}to{opacity:1;transform:scale(1.3)}}
#badge-txt{font-family:'Bebas Neue',sans-serif;font-size:11px;color:rgba(251,191,36,.7);letter-spacing:4px}

#card-title{font-family:'Bebas Neue',sans-serif;font-size:34px;color:#fff;letter-spacing:4px;margin-bottom:4px}
#card-sub{font-size:10px;color:rgba(255,255,255,.25);margin-bottom:20px;font-weight:700;letter-spacing:1px}

/* Ouverture prévue */
#opening{background:rgba(14,165,233,.06);border:1px solid rgba(14,165,233,.15);border-radius:14px;padding:14px;margin-bottom:20px;display:flex;align-items:center;gap:12px}
#opening-ico{font-size:24px}
#opening-info{flex:1}
#opening-lbl{font-family:'Bebas Neue',sans-serif;font-size:11px;color:rgba(14,165,233,.5);letter-spacing:3px;margin-bottom:4px}
#opening-date{font-family:'Bebas Neue',sans-serif;font-size:26px;color:#fff;letter-spacing:3px;line-height:1}
#opening-sub{font-size:9px;color:rgba(255,255,255,.2);margin-top:3px;font-weight:700;letter-spacing:1px}

/* Input mot de passe */
#pwd-lbl{font-family:'Bebas Neue',sans-serif;font-size:13px;color:rgba(255,255,255,.2);letter-spacing:3px;margin-bottom:8px}
#pwd-wrap{display:flex;gap:8px;margin-bottom:8px}
#pwd{flex:1;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);border-radius:12px;padding:14px 16px;font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:8px;color:#fff;text-align:center;outline:none;transition:border-color .2s}
#pwd:focus{border-color:rgba(14,165,233,.5)}
#pwd-btn{background:rgba(14,165,233,.15);border:1px solid rgba(14,165,233,.3);border-radius:12px;padding:14px 18px;font-family:'Bebas Neue',sans-serif;font-size:14px;color:#7dd3fc;letter-spacing:1px;cursor:pointer;white-space:nowrap}
#pwd-btn:active{background:rgba(14,165,233,.25)}
#pwd-err{font-size:9px;font-weight:700;color:#ef4444;letter-spacing:1px;min-height:14px;text-align:center;transition:opacity .2s}
</style>
</head>
<body>

<div id="stars"></div>

<div id="wrap">
  <div id="logo">
    <div id="logo-sub">PORT DE MARSEILLE</div>
    <div id="logo-title">BATTLE<br>DOCK</div>
    <div id="logo-version">VERSION 1.4</div>
  </div>

  <div id="card">
    <div style="text-align:center;margin-bottom:2px">
      <div id="badge"><div id="badge-dot"></div><div id="badge-txt">EN MAINTENANCE</div></div>
    </div>
    <div style="text-align:center">
      <div id="card-title">MISE À JOUR</div>
      <div id="card-sub">Le port est temporairement fermé</div>
    </div>

    <div id="opening">
      <div id="opening-ico">🚀</div>
      <div id="opening-info">
        <div id="opening-lbl">OUVERTURE PRÉVUE</div>
        <div id="opening-date">CETTE SEMAINE</div>
        <div id="opening-sub">Version 1.4 — Nouvelles features</div>
      </div>
    </div>

    <div id="pwd-lbl">ACCÈS ÉQUIPE</div>
    <div id="pwd-wrap">
      <input id="pwd" type="password" placeholder="••••" maxlength="20"
        onkeydown="if(event.key==='Enter')check()"
        onfocus="this.style.borderColor='rgba(14,165,233,.5)'"
        onblur="this.style.borderColor='rgba(255,255,255,.1)'">
      <button id="pwd-btn" onclick="check()">ENTRER</button>
    </div>
    <div id="pwd-err"></div>
  </div>
</div>

<script>
// Étoiles
(function(){
  var c=document.getElementById('stars');
  for(var i=0;i<50;i++){
    var s=document.createElement('div');
    s.className='p';
    var sz=0.5+Math.random()*2;
    s.style.cssText='width:'+sz+'px;height:'+sz+'px;left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;--d:'+(3+Math.random()*5)+'s;--dl:'+(-Math.random()*5)+'s';
    c.appendChild(s);
  }
})();

function check(){
  var v=document.getElementById('pwd').value.trim().toLowerCase();
  var err=document.getElementById('pwd-err');
  if(v==='toto'){
    localStorage.setItem('mg_ok','toto');
    window.location.reload();
  } else {
    err.textContent='Mot de passe incorrect';
    document.getElementById('pwd').style.borderColor='rgba(239,68,68,.5)';
    setTimeout(function(){
      err.textContent='';
      document.getElementById('pwd').style.borderColor='rgba(255,255,255,.1)';
    },2000);
  }
}

// Si déjà déverrouillé
if(localStorage.getItem('mg_ok')==='toto'){
  document.getElementById('wrap').style.display='none';
  // Laisser la page normale se charger
}
</script>
</body>
</html>
