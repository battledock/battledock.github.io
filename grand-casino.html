<script>
/* =====================================================================
   L'ENTRÉE DU GRAND CASINO — une façade Belle Époque, la nuit : les deux
   tours à coupoles de cuivre, les colonnes, les lettres d'or en ampoules,
   le grand escalier au tapis rouge, la fontaine, et les projecteurs.
   Tout est dessiné en pixels, et tout bouge un peu.
   ===================================================================== */
const cv=document.getElementById('scene'), g=cv.getContext('2d');
const W=240, H=420;
function taille(){const r=Math.max(window.innerWidth/W,window.innerHeight/H);cv.width=W;cv.height=H;
  cv.style.width=Math.ceil(W*r)+'px';cv.style.height=Math.ceil(H*r)+'px';
  cv.style.left=Math.round((window.innerWidth-W*r)/2)+'px';cv.style.top=Math.round((window.innerHeight-H*r)/2-40)+'px';}
taille();addEventListener('resize',taille);
const al=(n)=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s);};
const R=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)));};
const cx=W/2;
/* LE MOMENT : jour, crépuscule ou nuit, à l'heure de Marseille (ou forcé par ?moment=) */
function momentDuJour(){
  const q=new URLSearchParams(location.search).get('moment');if(q==='jour'||q==='nuit'||q==='soir')return q;
  const h=Number(new Intl.DateTimeFormat('fr-FR',{hour:'numeric',hourCycle:'h23',timeZone:'Europe/Paris'}).format(new Date()));
  return h>=8&&h<19?'jour':(h>=19&&h<21||h>=6&&h<8?'soir':'nuit');
}
let MOMENT=momentDuJour();
/* ---- la façade, gravée une fois ---- */
const F=document.createElement('canvas');F.width=W;F.height=H;
(function graver(){
  const f=F.getContext('2d');f.imageSmoothingEnabled=false;
  const r=(x,y,w,h,c)=>{f.fillStyle=c;f.fillRect(Math.round(x),Math.round(y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)));};
  const PI={o:'#8a7a60',s:'#b8a888',p:'#d8caa6',c:'#e8dcbc',h:'#f4ecd4'};
  /* les deux tours d'angle */
  [[cx-92,1],[cx+92,-1]].forEach(([tx,s])=>{
    r(tx-20,150,40,150,PI.p);for(let y=150;y<300;y+=6)r(tx-20,y,40,1,PI.s);
    r(tx-20,150,2,150,PI.h);r(tx+18,150,2,150,PI.o);
    for(let k=0;k<3;k++){const y=172+k*40;r(tx-8,y,16,24,'#1a1628');f.fillStyle='#1a1628';f.beginPath();f.arc(tx,y,8,Math.PI,0);f.fill();
      r(tx-10,y+24,20,3,PI.c);r(tx-1,y-8,2,32,PI.s);}
    r(tx-24,146,48,6,PI.c);r(tx-24,146,48,1,PI.h);
    /* le tambour et la coupole de cuivre vert-de-gris */
    r(tx-16,128,32,18,PI.p);for(let k=0;k<4;k++)r(tx-13+k*8,132,4,10,'#1a1628');
    f.fillStyle='#4f8a7a';f.beginPath();f.ellipse(tx,128,19,26,0,Math.PI,0);f.fill();
    f.fillStyle='#6aa894';f.beginPath();f.ellipse(tx-6,122,7,15,0,Math.PI,0);f.fill();
    for(let k=-2;k<=2;k++){f.strokeStyle='#3a6a5e';f.lineWidth=1;f.beginPath();f.moveTo(tx+k*7,128);f.quadraticCurveTo(tx+k*4,110,tx,102);f.stroke();}
    r(tx-2,92,4,10,'#c9a24a');r(tx-1,84,2,8,'#f0cf7d');r(tx-3,82,6,2,'#f0cf7d');
  });
  /* le corps central : deux étages, balustrade, statues */
  r(cx-72,168,144,132,PI.p);for(let y=168;y<300;y+=6)r(cx-72,y,144,1,PI.s);
  r(cx-76,164,152,6,PI.c);r(cx-76,164,152,1,PI.h);
  for(let x=cx-74;x<cx+74;x+=5){r(x,156,3,8,PI.c);r(x,156,3,1,PI.h);}r(cx-76,154,152,3,PI.c);
  [[cx-60],[cx-24],[cx+24],[cx+60]].forEach(([sx])=>{r(sx-3,140,6,14,'#c9c2ae');r(sx-2,134,4,6,'#d8d2c0');r(sx-5,152,10,2,PI.o);});
  /* le fronton central, et l'horloge */
  f.fillStyle=PI.c;f.beginPath();f.moveTo(cx-40,154);f.lineTo(cx,116);f.lineTo(cx+40,154);f.closePath();f.fill();
  f.fillStyle=PI.p;f.beginPath();f.moveTo(cx-32,150);f.lineTo(cx,122);f.lineTo(cx+32,150);f.closePath();f.fill();
  f.fillStyle='#f2ead0';f.beginPath();f.arc(cx,140,8,0,7);f.fill();f.strokeStyle='#8a6a2a';f.lineWidth=1.5;f.beginPath();f.arc(cx,140,8,0,7);f.stroke();
  r(cx,134,1,6,'#2a2016');r(cx,140,4,1,'#2a2016');
  r(cx-2,106,4,12,'#c9a24a');f.fillStyle='#f0cf7d';f.beginPath();f.arc(cx,104,4,0,7);f.fill();
  /* l'étage : fenêtres hautes à balconnets */
  for(let k=0;k<6;k++){const x=cx-62+k*22+(k>=3?8:0);if(Math.abs(x-cx+4)<14)continue;
    r(x,178,12,26,'#1a1628');f.fillStyle='#1a1628';f.beginPath();f.arc(x+6,178,6,Math.PI,0);f.fill();
    r(x-2,204,16,3,PI.c);for(let b=0;b<16;b+=3)r(x-2+b,200,1,4,'#2a2c2e');r(x+5,172,2,36,PI.s);}
  /* le rez-de-chaussée : colonnade de six colonnes et les trois grandes portes */
  r(cx-72,218,144,4,PI.c);r(cx-72,218,144,1,PI.h);
  for(let k=0;k<6;k++){const x=cx-62+k*24.8;
    r(x,222,7,70,PI.c);r(x,222,2,70,PI.h);r(x+6,222,1,70,PI.o);
    r(x-2,222,11,4,'#e8c06a');r(x-2,288,11,4,PI.s);
    for(let y=230;y<288;y+=4)r(x+3,y,1,2,PI.s);}
  [[cx-37,16],[cx,22],[cx+37,16]].forEach(([dx,w])=>{
    r(dx-w/2,244,w,48,'#2a1810');f.fillStyle='#2a1810';f.beginPath();f.arc(dx,244,w/2,Math.PI,0);f.fill();
    r(dx-w/2+2,248,w-4,42,'#5a2a14');r(dx,248,1,42,'#2a1810');
    for(let y=252;y<288;y+=6)for(let x=dx-w/2+3;x<dx+w/2-2;x+=4)r(x,y,2,4,'#c9a24a');});
  /* le grand escalier, marche par marche, et son tapis rouge */
  for(let k=0;k<12;k++){const y=292+k*4, w=150+k*10;
    r(cx-w/2,y,w,4,k%2?'#d8caa6':'#e4d8b8');r(cx-w/2,y,w,1,'#f4ecd4');r(cx-w/2,y+3,w,1,'#a89878');
    r(cx-11-k,y,22+k*2,4,'#a01a24');r(cx-11-k,y,22+k*2,1,'#c8323a');r(cx-12-k,y,1,4,'#e8c06a');r(cx+11+k,y,1,4,'#e8c06a');}
  /* les balustrades et les candélabres qui bordent l'escalier */
  [-1,1].forEach(s=>{for(let k=0;k<12;k++){const y=292+k*4, x=cx+s*(75+k*5);r(x-2,y-6,4,6,PI.c);}
    const lx=cx+s*84, ly=288;r(lx-1,ly-26,2,26,'#2a2c2e');r(lx-7,ly-28,14,2,'#2a2c2e');});
  /* le parvis, en marbre à damier */
  for(let y=340;y<H;y+=8)for(let x=0;x<W;x+=8)r(x,y,8,8,((x+y)/8)%2?'#2a2630':'#d8d2c4');
  /* la fontaine, au milieu du parvis */
  f.fillStyle='#b8a888';f.beginPath();f.ellipse(cx,378,40,12,0,0,7);f.fill();
  f.fillStyle='#1d4f6a';f.beginPath();f.ellipse(cx,377,35,9,0,0,7);f.fill();
  r(cx-3,352,6,24,'#d8caa6');f.fillStyle='#d8caa6';f.beginPath();f.ellipse(cx,354,12,3,0,0,7);f.fill();
})();
/* ---- ce qui bouge ---- */
function ciel(t){
  if(MOMENT==='jour'){
    /* LE JOUR : un ciel bleu de Provence, un soleil franc, quelques nuages, les martinets */
    for(let y=0;y<260;y++){const k=y/260;R(0,y,W,1,'rgb('+(70+k*110|0)+','+(140+k*80|0)+','+(220+k*25|0)+')');}
    const sg=g.createRadialGradient(200,44,4,200,44,70);sg.addColorStop(0,'rgba(255,250,220,.9)');sg.addColorStop(1,'rgba(255,250,220,0)');
    g.fillStyle=sg;g.fillRect(120,0,120,130);g.fillStyle='#fffbe8';g.beginPath();g.arc(200,44,11,0,7);g.fill();
    for(let i=0;i<5;i++){const x=((i*63+t/180)%(W+80))-40, y=30+i*17;
      R(x,y,34,5,'rgba(255,255,255,.85)');R(x+6,y-4,20,4,'rgba(255,255,255,.85)');R(x+3,y+5,28,2,'rgba(210,225,240,.7)');}
    for(let i=0;i<4;i++){const x=((i*71+t/60)%(W+40))-20, y=70+Math.sin(t/400+i)*12+i*9, a=Math.sin(t/90+i)>0;
      R(x,y,1,1,'#2a2c34');R(x-2,y-(a?1:0),2,1,'#2a2c34');R(x+1,y-(a?1:0),2,1,'#2a2c34');}
    return;
  }
  if(MOMENT==='soir'){
    const bandes=[[40,38,86],[120,70,120],[220,120,120],[250,180,120]];
    for(let y=0;y<260;y++){const u=y/260*(bandes.length-1), b0=Math.floor(u), b1=Math.min(3,b0+1), k=u-b0;
      R(0,y,W,1,'rgb('+(bandes[b0][0]+(bandes[b1][0]-bandes[b0][0])*k|0)+','+(bandes[b0][1]+(bandes[b1][1]-bandes[b0][1])*k|0)+','+(bandes[b0][2]+(bandes[b1][2]-bandes[b0][2])*k|0)+')');}
    for(let i=0;i<30;i++)R(al(i)*W,al(i+90)*90,1,1,'rgba(255,240,255,.7)');
    return;
  }
  for(let y=0;y<260;y++){const k=y/260;R(0,y,W,1,'rgb('+(8+k*30|0)+','+(10+k*18|0)+','+(28+k*40|0)+')');}
  for(let i=0;i<90;i++){const x=al(i)*W, y=al(i+90)*200, b=0.4+0.6*Math.abs(Math.sin(t/900+i));R(x,y,1,1,'rgba(230,235,255,'+b.toFixed(2)+')');}
  g.fillStyle='#f4eed8';g.beginPath();g.arc(206,40,9,0,7);g.fill();g.fillStyle='rgb(14,16,40)';g.beginPath();g.arc(210,37,8.5,0,7);g.fill();
  /* les projecteurs qui balaient le ciel */
  [[cx-92,1],[cx+92,-1]].forEach(([x,s],i)=>{if(MOMENT!=='nuit')return;const a=-Math.PI/2+Math.sin(t/2200+i*1.7)*0.45*s;
    const gr=g.createLinearGradient(x,120,x+Math.cos(a)*300,120+Math.sin(a)*300);
    gr.addColorStop(0,'rgba(255,240,200,.28)');gr.addColorStop(1,'rgba(255,240,200,0)');g.fillStyle=gr;
    g.beginPath();g.moveTo(x,120);g.lineTo(x+Math.cos(a-0.07)*320,120+Math.sin(a-0.07)*320);g.lineTo(x+Math.cos(a+0.07)*320,120+Math.sin(a+0.07)*320);g.fill();});
}
function lumieres(t){
  if(MOMENT==='jour'){lumieresDeJour(t);return;}
  /* les fenêtres qui brillent, certaines qui vacillent */
  const fen=(x,y,w,h,i)=>{const b=0.75+0.25*Math.sin(t/300+i*2.1);R(x,y,w,h,'rgba(255,196,110,'+b.toFixed(2)+')');R(x+1,y+1,Math.max(1,w/3),h-2,'rgba(255,240,190,.6)');};
  [[cx-92],[cx+92]].forEach(([tx],j)=>{for(let k=0;k<3;k++)fen(tx-7,168+k*40,14,26,j*3+k);});
  for(let k=0;k<6;k++){const x=cx-62+k*22+(k>=3?8:0);if(Math.abs(x-cx+4)<14)continue;fen(x+1,175,10,28,10+k);}
  /* la salle, par les portes : des lustres, de l'or */
  [[cx-37,16],[cx,22],[cx+37,16]].forEach(([dx,w],i)=>{const o=Math.max(0,Math.sin(t/1800+i))*0.35;
    g.fillStyle='rgba(255,210,130,'+(0.12+o).toFixed(2)+')';g.fillRect(dx-w/2+2,248,w-4,42);});
  /* LES LETTRES « CASINO », en ampoules d'or, au-dessus de la colonnade */
  const L='CASINO', lx=cx-39;
  g.fillStyle='#1a1008';g.fillRect(cx-44,208,88,12);
  for(let i=0;i<L.length;i++){
    const on=(Math.floor(t/140)+i)%8!==0;
    g.font='700 11px Georgia';g.textAlign='center';
    g.fillStyle=on?'#ffe7a0':'#a07a30';g.fillText(L[i],lx+i*15.6,218.5);
    if(on){g.fillStyle='rgba(255,220,130,.25)';g.fillRect(lx+i*15.6-6,207,12,14);}
  }
  /* la guirlande d'ampoules sous la corniche, qui court */
  for(let x=cx-74,i=0;x<cx+74;x+=4,i++){const on=(i+Math.floor(t/90))%5!==0;R(x,166,1.5,1.5,on?'#fff0b8':'#6a5020');}
  /* les candélabres */
  [-1,1].forEach(s=>{const lx=cx+s*84;[-6,0,6].forEach(d=>{g.fillStyle='rgba(255,220,140,.35)';g.beginPath();g.arc(lx+d,258,5,0,7);g.fill();R(lx+d-1,257,2,3,'#fff0b8');});});
  /* la fontaine : les jets d'eau, les reflets dorés */
  for(let k=0;k<30;k++){const a=(t/600+k/30)%1, s=k%2?1:-1, x=cx+s*(4+a*22), y=352+a*a*30-a*22;
    R(x,y,1,2,'rgba(200,235,255,'+(0.8-a*0.6).toFixed(2)+')');}
  for(let k=0;k<14;k++)R(cx-30+al(k)*60+Math.sin(t/400+k)*2,372+al(k+5)*9,3,1,'rgba(255,214,140,.55)');
  /* les voituriers, en rouge et or, au pied de l'escalier */
  [[cx-34],[cx+34]].forEach(([x],i)=>{const b=Math.round(Math.sin(t/500+i*2));
    R(x-2,330+b,4,9,'#8a1a22');R(x-2,328+b,4,2,'#e0b48a');R(x-2,327+b,4,1,'#1b1b1b');R(x-2,334+b,4,1,'#e8c06a');R(x-2,339,1,3,'#1b1b1b');R(x+1,339,1,3,'#1b1b1b');});
}
function lumieresDeJour(t){
  /* LE JOUR : des vitres qui reflètent le ciel, les lettres en or massif, la fontaine qui scintille */
  const vitre=(x,y,w,h)=>{R(x,y,w,h,'#6a8aa8');R(x,y,w,Math.max(1,h*0.4),'#9cc0da');R(x+1,y+2,1,h-4,'rgba(255,255,255,.55)');};
  [[cx-92],[cx+92]].forEach(([tx])=>{for(let k=0;k<3;k++)vitre(tx-7,168+k*40,14,26);});
  for(let k=0;k<6;k++){const x=cx-62+k*22+(k>=3?8:0);if(Math.abs(x-cx+4)<14)continue;vitre(x+1,175,10,28);}
  g.fillStyle='#2a1a0a';g.fillRect(cx-44,208,88,12);
  const L='CASINO', lx=cx-39;g.font='700 11px Georgia';g.textAlign='center';
  for(let i=0;i<L.length;i++){g.fillStyle='#8a6a2a';g.fillText(L[i],lx+i*15.6+0.5,219);g.fillStyle='#f0cf7d';g.fillText(L[i],lx+i*15.6,218.5);}
  const k=(t/2400)%1;g.fillStyle='rgba(255,255,255,.55)';g.fillRect(cx-44+k*88,208,3,12);           /* un éclat de soleil qui glisse sur l'or */
  for(let k2=0;k2<30;k2++){const a=(t/600+k2/30)%1, s=k2%2?1:-1, x=cx+s*(4+a*22), y=352+a*a*30-a*22;
    R(x,y,1,2,'rgba(230,248,255,'+(0.9-a*0.6).toFixed(2)+')');}
  for(let k2=0;k2<18;k2++)R(cx-30+al(k2)*60+Math.sin(t/300+k2)*2,372+al(k2+5)*9,3,1,'rgba(255,255,255,.75)');
  /* les ombres des colonnes, portées vers la droite */
  g.fillStyle='rgba(60,40,20,.14)';for(let k2=0;k2<6;k2++){const x=cx-62+k2*24.8;g.fillRect(x+7,222,6,70);}
  /* les voituriers, et un couple élégant qui monte les marches */
  [[cx-34],[cx+34]].forEach(([x],i)=>{const b=Math.round(Math.sin(t/500+i*2));
    R(x-2,330+b,4,9,'#8a1a22');R(x-2,328+b,4,2,'#e0b48a');R(x-2,327+b,4,1,'#1b1b1b');R(x-2,334+b,4,1,'#e8c06a');R(x-2,339,1,3,'#1b1b1b');R(x+1,339,1,3,'#1b1b1b');});
  const m=(t/9000)%1, my=336-m*40, mx=cx-6;
  R(mx,my-9,4,9,'#1b1b1b');R(mx,my-11,4,2,'#e0b48a');R(mx+6,my-9,4,9,'#c0392b');R(mx+6,my-11,4,2,'#f0c8a0');R(mx+6,my-12,4,1,'#3a2016');
}
function boucle(t){
  g.imageSmoothingEnabled=false;
  ciel(t);g.drawImage(F,0,0);lumieres(t);
  /* un halo doré sur toute la façade */
  if(MOMENT==='jour'){g.fillStyle='rgba(255,245,220,.06)';g.fillRect(0,0,W,H);}
  else{const h=g.createRadialGradient(cx,240,20,cx,240,180);h.addColorStop(0,'rgba(255,200,110,'+(MOMENT==='soir'?.14:.10)+')');h.addColorStop(1,'rgba(255,200,110,0)');
    g.fillStyle=h;g.fillRect(0,0,W,H);}
  requestAnimationFrame(boucle);
}
