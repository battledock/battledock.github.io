<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Classement La Tour — Battle Dock</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { height:100dvh; overflow:hidden; }
    body { font-family:'Inter',sans-serif; background:white; display:flex; flex-direction:column; }

    .page { flex:1; display:flex; flex-direction:column; overflow:hidden; }

    /* Header */
    .hdr { padding:calc(env(safe-area-inset-top) + 44px) 22px 14px; flex-shrink:0; display:flex; align-items:center; justify-content:space-between; }
    .hdr-left { }
    .hdr-tag { font-size:9px; font-weight:700; color:#9ca3af; letter-spacing:3px; }
    .hdr-title { font-family:'Bebas Neue',sans-serif; font-size:32px; color:#0a0a0a; line-height:1; }
    .hdr-icon { font-size:36px; }

    /* Bloc 1er */
    .top1 { margin:0 16px 10px; background:linear-gradient(135deg,#F57F17,#E65100); border-radius:18px; padding:18px 20px; display:flex; align-items:center; gap:14px; flex-shrink:0; box-shadow:0 6px 24px rgba(245,127,23,0.25); }
    .top1-rank { font-family:'Bebas Neue',sans-serif; font-size:52px; color:rgba(255,255,255,0.2); line-height:1; }
    .top1-av { width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center; font-family:'Bebas Neue',sans-serif; font-size:16px; color:white; border:2px solid rgba(255,255,255,0.35); flex-shrink:0; }
    .top1-info { flex:1; min-width:0; }
    .top1-name { font-size:14px; font-weight:700; color:white; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .top1-grade { font-size:9px; color:rgba(255,255,255,0.55); font-weight:600; margin-top:2px; }
    .top1-score { font-family:'Bebas Neue',sans-serif; font-size:48px; color:white; line-height:1; }
    .top1-lbl { font-size:8px; font-weight:700; color:rgba(255,255,255,0.55); letter-spacing:1px; margin-top:-2px; text-align:right; }

    /* 2e et 3e */
    .top2-3 { display:flex; gap:10px; margin:0 16px; flex-shrink:0; }
    .mini-card { flex:1; background:#f8f9fa; border-radius:14px; padding:12px 14px; display:flex; align-items:center; gap:8px; }
    .mini-rank { font-family:'Bebas Neue',sans-serif; font-size:22px; color:#e5e7eb; }
    .mini-av { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Bebas Neue',sans-serif; font-size:13px; color:white; flex-shrink:0; }
    .mini-name { font-size:10px; font-weight:700; color:#0a0a0a; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .mini-score { font-family:'Bebas Neue',sans-serif; font-size:20px; color:#F57F17; line-height:1; }
    .mini-lbl { font-size:7px; font-weight:700; color:#9ca3af; letter-spacing:1px; }

    /* Séparateur */
    .sep { height:1px; background:#f0f0f0; margin:12px 16px; flex-shrink:0; }
    .list-tag { font-size:9px; font-weight:700; color:#d1d5db; letter-spacing:2px; padding:0 16px 6px; flex-shrink:0; }

    /* Liste */
    .list { flex:1; overflow-y:auto; padding:0 16px; -webkit-overflow-scrolling:touch; }
    .list::-webkit-scrollbar { display:none; }
    .row { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid #f5f5f5; }
    .row.me { background:#FFF8F0; margin:0 -16px; padding:9px 16px; border-radius:10px; border-bottom:none; margin-bottom:2px; }
    .row-rank { font-family:'Bebas Neue',sans-serif; font-size:15px; color:#d1d5db; min-width:18px; }
    .row.me .row-rank { color:#F57F17; }
    .row-av { width:30px; height:30px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-family:'Bebas Neue',sans-serif; font-size:12px; color:white; }
    .row-name { font-size:12px; font-weight:700; color:#0a0a0a; }
    .row.me .row-name { color:#F57F17; }
    .row-detail { font-size:9px; color:#9ca3af; margin-top:1px; }
    .row-score { font-family:'Bebas Neue',sans-serif; font-size:20px; color:#0a0a0a; }
    .row.me .row-score { color:#F57F17; }
    .row-lbl { font-size:7px; font-weight:700; color:#9ca3af; letter-spacing:1px; }

    /* Sticky me */
    .sticky-me { flex-shrink:0; padding:6px 16px 0; border-top:1px solid #f5f5f5; }

    /* Retour */
    .btn-back { width:calc(100% - 32px); margin:10px 16px calc(env(safe-area-inset-bottom, 20px) + 12px); background:#0a0a0a; border:none; border-radius:14px; padding:14px; color:white; font-family:'Bebas Neue',sans-serif; font-size:15px; letter-spacing:2px; cursor:pointer; display:block; flex-shrink:0; }

    /* Loading */
    .loading { flex:1; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:12px; }
    @keyframes wave { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(0.35)} }
    .wb { width:4px; height:20px; background:#F57F17; border-radius:2px; animation:wave 1s ease-in-out infinite; display:inline-block; margin:0 2px; }
    .loading-txt { font-family:'Bebas Neue',sans-serif; font-size:18px; color:#d1d5db; letter-spacing:2px; }
  </style>
</head>
<body>
<div class="page">

  <div class="hdr">
    <div class="hdr-left">
      <div class="hdr-tag">PORT DE MARSEILLE</div>
      <div class="hdr-title">TOP EMPILEURS</div>
    </div>
    <div class="hdr-icon">🏗️</div>
  </div>

  <div id="top1" style="display:none"></div>
  <div id="top23" class="top2-3" style="display:none"></div>
  <div class="sep" id="sep" style="display:none"></div>
  <div class="list-tag" id="listTag" style="display:none">SUITE DU CLASSEMENT</div>
  <div id="list" class="list">
    <div class="loading">
      <div><span class="wb" style="animation-delay:0s"></span><span class="wb" style="animation-delay:.15s"></span><span class="wb" style="animation-delay:.3s"></span><span class="wb" style="animation-delay:.45s"></span></div>
      <div class="loading-txt">CHARGEMENT...</div>
    </div>
  </div>
  <div id="stickyMe" class="sticky-me" style="display:none"></div>
  <button class="btn-back" onclick="window.location.href='travail.html'">← RETOUR</button>

</div>
<script>
  const SB_URL = 'https://drtsuhnbclhmgfjiykap.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
  const sb = supabase.createClient(SB_URL, SB_KEY);

  const AV_COLORS = ['#E53935','#1565C0','#2E7D32','#F57F17','#7B1FA2','#00838F','#bf360c','#4527a0','#c62828','#00695c'];
  const avColor  = uid => AV_COLORS[(uid||'').split('').reduce((a,c)=>a+c.charCodeAt(0),0) % AV_COLORS.length];
  const avLetter = name => (name||'?')[0].toUpperCase();
  const grade    = lvl => lvl<=4?'Docker Occasionnel':lvl<=14?'Docker':lvl<=29?'Docker Mensuel':lvl<=49?'Contre-Maître':'Chef de Quai';
  const esc      = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

  async function load() {
    const { data:{ session } } = await sb.auth.getSession();
    if (!session) { window.location.href='index.html'; return; }
    const meId = session.user.id;

    const [{ data: stats }, { data: profiles }] = await Promise.all([
      sb.from('game_stats').select('user_id,level,records').not('records','is',null),
      sb.from('profiles').select('user_id,username')
    ]);

    const profMap = {};
    (profiles||[]).forEach(p => profMap[p.user_id] = p.username || 'Anonyme');

    const scores = (stats||[])
      .filter(r => (r.records?.tower || r.records?.tower_floor || 0) > 0)
      .map(r => ({ uid:r.user_id, level:r.level||1, floors:r.records.tower || r.records.tower_floor || 0, name:profMap[r.user_id]||'Anonyme' }))
      .sort((a,b) => b.floors - a.floors);

    if (scores.length === 0) {
      document.getElementById('list').innerHTML = '<div style="text-align:center;padding:40px 0"><div style="font-size:40px;margin-bottom:10px">🏗️</div><div style="font-family:\'Bebas Neue\',sans-serif;font-size:18px;color:#d1d5db;letter-spacing:2px">AUCUN SCORE ENCORE</div></div>';
      return;
    }

    const myRank = scores.findIndex(r => r.uid === meId);
    const myData = myRank >= 0 ? scores[myRank] : null;

    // ── 1er ──
    const p1 = scores[0];
    if (p1) {
      const col = avColor(p1.uid);
      const isMe = p1.uid === meId;
      document.getElementById('top1').innerHTML = `
        <div class="top1">
          <div class="top1-rank">1</div>
          <div class="top1-av" style="background:${col}">${esc(avLetter(p1.name))}</div>
          <div class="top1-info">
            <div class="top1-name">${esc(p1.name)}${isMe?' 👈':''}</div>
            <div class="top1-grade">Nv.${p1.level} · ${grade(p1.level)}</div>
          </div>
          <div>
            <div class="top1-score">${p1.floors}</div>
            <div class="top1-lbl">ÉTAGES</div>
          </div>
        </div>`;
      document.getElementById('top1').style.display = 'block';
    }

    // ── 2e et 3e ──
    const p2 = scores[1], p3 = scores[2];
    let top23html = '';
    [p2, p3].forEach((p, i) => {
      if (!p) { top23html += '<div class="mini-card" style="visibility:hidden"></div>'; return; }
      const col = avColor(p.uid);
      const isMe = p.uid === meId;
      top23html += `
        <div class="mini-card">
          <div class="mini-rank">${i+2}</div>
          <div class="mini-av" style="background:${col}">${esc(avLetter(p.name))}</div>
          <div style="flex:1;min-width:0">
            <div class="mini-name">${esc(p.name)}${isMe?' 👈':''}</div>
            <div class="mini-score">${p.floors}</div>
            <div class="mini-lbl">ÉTAGES</div>
          </div>
        </div>`;
    });
    document.getElementById('top23').innerHTML = top23html;
    document.getElementById('top23').style.display = 'flex';
    document.getElementById('sep').style.display = 'block';

    // ── Liste ──
    let listHtml = '';
    scores.slice(3).forEach((p, i) => {
      const rank = i + 4;
      const isMe = p.uid === meId;
      const col  = avColor(p.uid);
      listHtml += `
        <div class="row${isMe?' me':''}">
          <div class="row-rank">${rank}</div>
          <div class="row-av" style="background:${col}">${esc(avLetter(p.name))}</div>
          <div style="flex:1;min-width:0">
            <div class="row-name">${esc(p.name)}${isMe?' 👈':''}</div>
            <div class="row-detail">Nv.${p.level} · ${grade(p.level)}</div>
          </div>
          <div style="text-align:right">
            <div class="row-score">${p.floors}</div>
            <div class="row-lbl">ÉTAGES</div>
          </div>
        </div>`;
    });

    if (scores.length > 3) {
      document.getElementById('listTag').style.display = 'block';
      document.getElementById('list').innerHTML = listHtml;
    } else {
      document.getElementById('list').innerHTML = '';
    }

    // ── Sticky si hors top visible ──
    const sticky = document.getElementById('stickyMe');
    if (myData && myRank >= 3) {
      const col = avColor(myData.uid);
      sticky.innerHTML = `
        <div class="row me" style="margin:0 0 6px">
          <div class="row-rank">${myRank+1}</div>
          <div class="row-av" style="background:${col}">${esc(avLetter(myData.name))}</div>
          <div style="flex:1;min-width:0">
            <div class="row-name">${esc(myData.name)} 👈 Mon score</div>
            <div class="row-detail">Nv.${myData.level} · ${grade(myData.level)}</div>
          </div>
          <div style="text-align:right">
            <div class="row-score">${myData.floors}</div>
            <div class="row-lbl">ÉTAGES</div>
          </div>
        </div>`;
      sticky.style.display = 'block';
    } else if (!myData) {
      sticky.innerHTML = `<div style="text-align:center;padding:8px 0;font-size:11px;color:#9ca3af">Pas encore de score · <button onclick="window.location.href='tower.html'" style="background:none;border:none;color:#F57F17;font-size:11px;cursor:pointer;font-family:inherit;font-weight:700">Jouer →</button></div>`;
      sticky.style.display = 'block';
    }
  }

  load();
</script>
</body>
</html>
