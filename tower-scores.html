<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Classement La Tour — Battle Dock</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { height:100dvh; overflow:hidden; }
    body { font-family:'Inter',sans-serif; display:flex; flex-direction:column; position:relative; }

    /* Fond aube rosée — cohérent avec tower.html */
    #bg { position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }

    .page { position:relative; z-index:5; flex:1; display:flex; flex-direction:column; overflow:hidden; }

    /* Header */
    .hdr {
      padding:calc(env(safe-area-inset-top) + 44px) 22px 16px;
      flex-shrink:0;
    }
    .hdr-title { font-family:'Bebas Neue',sans-serif; font-size:32px; color:white; letter-spacing:2px; line-height:1; }
    .hdr-sub { font-size:11px; font-weight:700; color:rgba(255,255,255,0.35); letter-spacing:2px; margin-top:3px; }

    /* Podium top 3 */
    .podium { display:flex; align-items:flex-end; justify-content:center; gap:10px; padding:16px 18px 20px; flex-shrink:0; }
    .pod { text-align:center; flex:1; max-width:110px; }
    .pod-avatar { width:48px; height:48px; border-radius:50%; margin:0 auto 6px; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:700; font-family:'Bebas Neue',sans-serif; }
    .pod-name { font-size:11px; font-weight:700; color:white; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .pod-score { font-family:'Bebas Neue',sans-serif; font-size:22px; color:white; line-height:1.1; }
    .pod-lbl { font-size:8px; font-weight:700; color:rgba(255,255,255,0.4); letter-spacing:1px; }
    .pod-base { border-radius:8px 8px 0 0; display:flex; align-items:center; justify-content:center; margin-top:8px; }
    .pod-rank { font-family:'Bebas Neue',sans-serif; font-size:28px; color:rgba(255,255,255,0.5); }
    .pod-1 .pod-base { height:64px; background:rgba(249,168,37,0.25); border:2px solid rgba(249,168,37,0.4); }
    .pod-2 .pod-base { height:48px; background:rgba(255,255,255,0.08); border:2px solid rgba(255,255,255,0.15); }
    .pod-3 .pod-base { height:36px; background:rgba(180,120,50,0.2); border:2px solid rgba(180,120,50,0.3); }
    .pod-1 .pod-rank { color:#F9A825; font-size:34px; }

    /* Séparateur */
    .divider { height:1px; background:rgba(255,255,255,0.08); margin:0 18px; flex-shrink:0; }

    /* Liste */
    .list { flex:1; overflow-y:auto; padding:8px 18px; -webkit-overflow-scrolling:touch; }
    .list::-webkit-scrollbar { display:none; }

    .row {
      display:flex; align-items:center; gap:12px;
      padding:11px 14px; border-radius:14px; margin-bottom:6px;
      background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.07);
    }
    .row.me { background:rgba(249,168,37,0.1); border-color:rgba(249,168,37,0.25); }
    .row-rank { font-family:'Bebas Neue',sans-serif; font-size:18px; color:rgba(255,255,255,0.3); min-width:28px; text-align:center; }
    .row-avatar { width:36px; height:36px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; font-family:'Bebas Neue',sans-serif; }
    .row-info { flex:1; min-width:0; }
    .row-name { font-size:13px; font-weight:700; color:white; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .row-detail { font-size:10px; color:rgba(255,255,255,0.35); margin-top:1px; }
    .row-score { text-align:right; flex-shrink:0; }
    .row-floors { font-family:'Bebas Neue',sans-serif; font-size:22px; color:#F9A825; line-height:1; }
    .row-lbl { font-size:8px; font-weight:700; color:rgba(255,255,255,0.3); letter-spacing:1px; }

    /* Mon score flottant si hors top */
    .my-row {
      position:sticky; bottom:0;
      background:rgba(20,5,10,0.9); backdrop-filter:blur(8px);
      border-top:1px solid rgba(249,168,37,0.2);
      padding:10px 18px;
    }

    /* Bouton retour */
    .btn-back {
      width:calc(100% - 36px); margin:10px 18px calc(env(safe-area-inset-bottom) + 12px);
      background:rgba(255,255,255,0.1); border:2px solid rgba(255,255,255,0.15);
      border-radius:14px; padding:13px; color:rgba(255,255,255,0.7);
      font-family:'Bebas Neue',sans-serif; font-size:15px; letter-spacing:2px;
      cursor:pointer; display:block; flex-shrink:0;
    }

    /* Loading */
    .loading { flex:1; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:12px; }
    .loading-txt { font-family:'Bebas Neue',sans-serif; font-size:18px; color:rgba(255,255,255,0.3); letter-spacing:2px; }

    /* Vague animation */
    @keyframes wave { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(0.4)} }
    .wave-bar { width:4px; height:20px; background:#F9A825; border-radius:2px; animation:wave 1s ease-in-out infinite; display:inline-block; margin:0 2px; }

    /* Médailles podium */
    .medal-1 { background:linear-gradient(135deg,#F9A825,#F57F17); }
    .medal-2 { background:linear-gradient(135deg,#b0bec5,#78909c); }
    .medal-3 { background:linear-gradient(135deg,#a1887f,#6d4c41); }
  </style>
</head>
<body>

<!-- Fond aube rosée -->
<svg id="bg" viewBox="0 0 375 720" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d0520"/><stop offset="35%" stop-color="#5c1a3a"/><stop offset="65%" stop-color="#c0306a"/><stop offset="100%" stop-color="#ff8c42"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="375" height="720" fill="url(#sky)"/>
  <ellipse cx="188" cy="560" rx="240" ry="90" fill="rgba(255,140,66,0.28)" filter="url(#glow)"/>
  <g fill="white"><circle cx="30" cy="35" r="1" opacity="0.6"/><circle cx="80" cy="18" r="0.9" opacity="0.5"/><circle cx="310" cy="22" r="1" opacity="0.5"/><circle cx="200" cy="15" r="0.8" opacity="0.5"/></g>
  <g fill="#060210"><rect x="0" y="350" width="28" height="212"/><rect x="30" y="330" width="22" height="232"/><rect x="298" y="338" width="28" height="224"/><rect x="328" y="322" width="24" height="240"/></g>
</svg>

<div class="page">
  <div class="hdr">
    <div class="hdr-title">🏗️ Classement La Tour</div>
    <div class="hdr-sub">MEILLEURS EMPILEURS DU PORT</div>
  </div>

  <div id="content" class="loading">
    <div>
      <span class="wave-bar" style="animation-delay:0s"></span>
      <span class="wave-bar" style="animation-delay:0.15s"></span>
      <span class="wave-bar" style="animation-delay:0.3s"></span>
      <span class="wave-bar" style="animation-delay:0.45s"></span>
    </div>
    <div class="loading-txt">CHARGEMENT...</div>
  </div>

  <button class="btn-back" onclick="window.location.href='travail.html'">← RETOUR</button>
</div>

<script>
  const SB_URL = 'https://drtsuhnbclhmgfjiykap.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
  const { createClient } = supabase;
  const sb = createClient(SB_URL, SB_KEY);

  const COLORS = ['#E53935','#1565C0','#2E7D32','#F57F17','#7B1FA2','#00838F','#bf360c','#4527a0'];
  function avatarColor(uid) { return COLORS[(uid||'').charCodeAt(0) % COLORS.length]; }
  function avatarLetter(name) { return (name||'?')[0].toUpperCase(); }
  function grade(lvl) {
    if (lvl <= 4)  return 'Docker Occasionnel';
    if (lvl <= 14) return 'Docker';
    if (lvl <= 29) return 'Docker Mensuel';
    if (lvl <= 49) return 'Contre-Maître';
    return 'Chef de Quai';
  }
  function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  async function load() {
    const { data:{ session } } = await sb.auth.getSession();
    if (!session) { window.location.href='index.html'; return; }
    const me = session.user;

    // Récupérer tous les scores tower
    const { data: stats, error } = await sb.from('game_stats')
      .select('user_id, level, records')
      .not('records', 'is', null);

    if (error || !stats) { document.getElementById('content').innerHTML='<div class="loading-txt">Erreur de chargement</div>'; return; }

    // Récupérer les profils (username)
    const uids = stats.map(r => r.user_id);
    const { data: profiles } = await sb.from('profiles')
      .select('user_id, username, avatar_class')
      .in('user_id', uids);
    const profMap = {};
    (profiles||[]).forEach(p => profMap[p.user_id] = p);

    // Filtrer et trier
    const scores = stats
      .filter(r => r.records?.tower > 0)
      .map(r => ({
        uid:    r.user_id,
        level:  r.level || 1,
        floors: r.records.tower,
        username: profMap[r.user_id]?.username || 'Anonyme',
        avatar:  profMap[r.user_id]?.avatar_class || null,
      }))
      .sort((a,b) => b.floors - a.floors);

    const myRank = scores.findIndex(r => r.uid === me.id);
    const myScore = myRank >= 0 ? scores[myRank] : null;

    // Rendre le contenu
    const content = document.getElementById('content');
    content.className = '';
    content.style.cssText = 'flex:1;display:flex;flex-direction:column;overflow:hidden;';

    if (scores.length === 0) {
      content.innerHTML = '<div style="flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px"><div style="font-size:40px">🏗️</div><div style="font-family:\'Bebas Neue\',sans-serif;font-size:18px;color:rgba(255,255,255,0.3);letter-spacing:2px">AUCUN SCORE ENCORE</div><div style="font-size:12px;color:rgba(255,255,255,0.2)">Sois le premier !</div></div>';
      return;
    }

    // Podium top 3
    const top3 = scores.slice(0, 3);
    const podOrder = [top3[1], top3[0], top3[2]].filter(Boolean); // 2e, 1er, 3e
    const podClass = ['pod-2','pod-1','pod-3'];
    const medals = ['medal-2','medal-1','medal-3'];
    const ranks = [2,1,3];

    let podHtml = '<div class="podium">';
    podOrder.forEach((p, i) => {
      if (!p) { podHtml += '<div class="pod"></div>'; return; }
      const rank = ranks[i];
      const isMe = p.uid === me.id;
      const col = avatarColor(p.uid);
      podHtml += `
        <div class="pod ${podClass[i]}${isMe?' me':''}">
          <div class="pod-avatar ${medals[i]}" style="color:white">${escHtml(avatarLetter(p.username))}</div>
          <div class="pod-name">${escHtml(p.username)}${isMe?' 👈':''}</div>
          <div class="pod-score">${p.floors}</div>
          <div class="pod-lbl">ÉTAGES</div>
          <div class="pod-base"><div class="pod-rank">${rank}</div></div>
        </div>`;
    });
    podHtml += '</div><div class="divider"></div>';

    // Liste (depuis rang 4)
    let listHtml = '<div class="list">';
    scores.slice(3).forEach((p, i) => {
      const rank = i + 4;
      const isMe = p.uid === me.id;
      const col = avatarColor(p.uid);
      listHtml += `
        <div class="row${isMe?' me':''}">
          <div class="row-rank">${rank}</div>
          <div class="row-avatar" style="background:${col};color:white">${escHtml(avatarLetter(p.username))}</div>
          <div class="row-info">
            <div class="row-name">${escHtml(p.username)}${isMe?' 👈':''}</div>
            <div class="row-detail">Nv.${p.level} · ${grade(p.level)}</div>
          </div>
          <div class="row-score">
            <div class="row-floors">${p.floors}</div>
            <div class="row-lbl">ÉTAGES</div>
          </div>
        </div>`;
    });
    listHtml += '</div>';

    // Mon score sticky si hors top visible
    let myHtml = '';
    if (myScore && myRank >= 3) {
      const col = avatarColor(myScore.uid);
      myHtml = `
        <div class="my-row">
          <div class="row me" style="margin:0">
            <div class="row-rank">${myRank+1}</div>
            <div class="row-avatar" style="background:${col};color:white">${escHtml(avatarLetter(myScore.username))}</div>
            <div class="row-info">
              <div class="row-name">${escHtml(myScore.username)} 👈 Moi</div>
              <div class="row-detail">Mon meilleur score</div>
            </div>
            <div class="row-score">
              <div class="row-floors">${myScore.floors}</div>
              <div class="row-lbl">ÉTAGES</div>
            </div>
          </div>
        </div>`;
    } else if (!myScore) {
      myHtml = `<div class="my-row"><div style="text-align:center;font-size:11px;color:rgba(255,255,255,0.25);padding:4px 0">Tu n'as pas encore de score · <button onclick="window.location.href='tower.html'" style="background:none;border:none;color:#F9A825;font-size:11px;cursor:pointer;font-family:inherit;font-weight:700">Jouer →</button></div></div>`;
    }

    content.innerHTML = podHtml + listHtml + myHtml;
  }

  load();
</script>
</body>
</html>
