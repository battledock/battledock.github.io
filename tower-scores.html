<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Classement La Tour — Battle Dock</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { height:100dvh; overflow:hidden; }
    body { font-family:'Inter',sans-serif; display:flex; flex-direction:column; position:relative; }

    #bg { position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }
    .page { position:relative; z-index:5; flex:1; display:flex; flex-direction:column; overflow:hidden; }

    .hdr { padding:calc(env(safe-area-inset-top) + 44px) 20px 0; flex-shrink:0; }
    .hdr-sub { font-family:'Bebas Neue',sans-serif; font-size:11px; letter-spacing:3px; color:rgba(255,255,255,0.4); }
    .hdr-title { font-family:'Bebas Neue',sans-serif; font-size:36px; color:white; line-height:1; }

    /* Podium */
    .podium { display:flex; align-items:flex-end; justify-content:center; gap:8px; padding:16px 16px 0; flex-shrink:0; }
    .pod { flex:1; text-align:center; }
    .pod-avatar { width:44px; height:44px; border-radius:50%; margin:0 auto 5px; display:flex; align-items:center; justify-content:center; font-family:'Bebas Neue',sans-serif; font-size:18px; color:white; }
    .pod-1 .pod-avatar { width:52px; height:52px; font-size:22px; border:3px solid rgba(249,168,37,0.5); box-shadow:0 0 20px rgba(249,168,37,0.4); }
    .pod-name { font-size:10px; font-weight:700; color:white; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 4px; }
    .pod-score { font-family:'Bebas Neue',sans-serif; font-size:22px; color:white; line-height:1.1; }
    .pod-1 .pod-score { font-size:28px; color:#F9A825; }
    .pod-lbl { font-size:7px; font-weight:700; color:rgba(255,255,255,0.35); letter-spacing:1px; margin-bottom:6px; }
    .pod-base { border-radius:8px 8px 0 0; display:flex; align-items:center; justify-content:center; }
    .pod-base-rank { font-family:'Bebas Neue',sans-serif; color:rgba(255,255,255,0.5); }
    .pod-2 .pod-base { height:48px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.12); }
    .pod-2 .pod-base-rank { font-size:28px; }
    .pod-1 .pod-base { height:66px; background:rgba(249,168,37,0.15); border:1px solid rgba(249,168,37,0.35); box-shadow:0 0 16px rgba(249,168,37,0.12); }
    .pod-1 .pod-base-rank { font-size:36px; color:#F9A825; }
    .pod-3 .pod-base { height:36px; background:rgba(161,136,127,0.15); border:1px solid rgba(161,136,127,0.25); }
    .pod-3 .pod-base-rank { font-size:22px; }
    .pod-crown { font-size:18px; margin-bottom:2px; }

    /* Séparateur */
    .sep { height:1px; background:rgba(255,255,255,0.08); margin:0 18px; flex-shrink:0; }

    /* Liste scrollable */
    .list { flex:1; overflow-y:auto; padding:8px 18px 0; -webkit-overflow-scrolling:touch; }
    .list::-webkit-scrollbar { display:none; }

    .row { display:flex; align-items:center; gap:12px; padding:10px 13px; border-radius:14px; margin-bottom:6px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.07); }
    .row.me { background:rgba(249,168,37,0.1); border-color:rgba(249,168,37,0.25); }
    .row-rank { font-family:'Bebas Neue',sans-serif; font-size:17px; color:rgba(255,255,255,0.3); min-width:22px; text-align:center; }
    .row-av { width:34px; height:34px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-family:'Bebas Neue',sans-serif; font-size:14px; color:white; }
    .row-name { font-size:12px; font-weight:700; color:white; }
    .row-detail { font-size:9px; color:rgba(255,255,255,0.3); margin-top:1px; }
    .row-floors { font-family:'Bebas Neue',sans-serif; font-size:22px; color:#F9A825; line-height:1; }
    .row-lbl { font-size:7px; font-weight:700; color:rgba(255,255,255,0.3); letter-spacing:1px; }

    /* Mon score sticky si hors top */
    .sticky-me { flex-shrink:0; padding:8px 18px 0; background:rgba(13,5,20,0.85); backdrop-filter:blur(10px); border-top:1px solid rgba(249,168,37,0.15); }

    .btn-back { width:calc(100% - 36px); margin:10px 18px calc(env(safe-area-inset-bottom) + 12px); background:rgba(255,255,255,0.1); border:2px solid rgba(255,255,255,0.15); border-radius:14px; padding:13px; color:rgba(255,255,255,0.7); font-family:'Bebas Neue',sans-serif; font-size:15px; letter-spacing:2px; cursor:pointer; display:block; flex-shrink:0; }

    /* Loading */
    .loading { flex:1; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:12px; }
    @keyframes wave { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(0.35)} }
    .wb { width:4px; height:20px; background:#F9A825; border-radius:2px; animation:wave 1s ease-in-out infinite; display:inline-block; margin:0 2px; }
    .loading-txt { font-family:'Bebas Neue',sans-serif; font-size:18px; color:rgba(255,255,255,0.3); letter-spacing:2px; }
  </style>
</head>
<body>

<svg id="bg" viewBox="0 0 375 720" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d0520"/><stop offset="35%" stop-color="#5c1a3a"/><stop offset="65%" stop-color="#c0306a"/><stop offset="100%" stop-color="#ff8c42"/></linearGradient>
    <filter id="gl"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="375" height="720" fill="url(#sky)"/>
  <ellipse cx="188" cy="560" rx="240" ry="90" fill="rgba(255,140,66,0.28)" filter="url(#gl)"/>
  <g fill="white"><circle cx="30" cy="35" r="1" opacity="0.6"/><circle cx="80" cy="18" r="0.9" opacity="0.5"/><circle cx="310" cy="22" r="1" opacity="0.5"/><circle cx="200" cy="15" r="0.8" opacity="0.5"/><circle cx="160" cy="40" r="0.7" opacity="0.4"/></g>
  <g fill="#060210"><rect x="0" y="350" width="28" height="212"/><rect x="30" y="330" width="22" height="232"/><rect x="298" y="338" width="28" height="224"/><rect x="328" y="322" width="24" height="240"/></g>
  <g fill="rgba(255,180,80,0.18)"><rect x="5" y="366" width="4" height="3"/><rect x="14" y="358" width="4" height="3"/><rect x="302" y="355" width="4" height="3"/><rect x="333" y="340" width="4" height="3"/></g>
</svg>

<div class="page">

  <div class="hdr">
    <div class="hdr-sub">MEILLEURS EMPILEURS DU PORT</div>
    <div class="hdr-title">🏗️ LA TOUR</div>
  </div>

  <div id="podium" class="podium" style="display:none">
    <!-- injecté en JS -->
  </div>

  <div class="sep" id="sep" style="display:none"></div>

  <div id="list" class="list">
    <div class="loading">
      <div><span class="wb" style="animation-delay:0s"></span><span class="wb" style="animation-delay:.15s"></span><span class="wb" style="animation-delay:.3s"></span><span class="wb" style="animation-delay:.45s"></span></div>
      <div class="loading-txt">CHARGEMENT...</div>
    </div>
  </div>

  <div id="stickyMe" class="sticky-me" style="display:none"></div>
  <button class="btn-back" onclick="window.location.href='travail.html'">← RETOUR</button>

</div>

<script>
  const SB_URL = 'https://drtsuhnbclhmgfjiykap.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
  const sb = supabase.createClient(SB_URL, SB_KEY);

  const AV_COLORS = ['#E53935','#1565C0','#2E7D32','#F57F17','#7B1FA2','#00838F','#bf360c','#4527a0','#c62828','#00695c'];
  const avColor  = uid => AV_COLORS[(uid||'').split('').reduce((a,c)=>a+c.charCodeAt(0),0) % AV_COLORS.length];
  const avLetter = name => (name||'?')[0].toUpperCase();
  const grade    = lvl => lvl<=4?'Docker Occasionnel':lvl<=14?'Docker':lvl<=29?'Docker Mensuel':lvl<=49?'Contre-Maître':'Chef de Quai';
  const esc      = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

  async function load() {
    const { data:{ session } } = await sb.auth.getSession();
    if (!session) { window.location.href='index.html'; return; }
    const meId = session.user.id;

    const [{ data: stats }, { data: profiles }] = await Promise.all([
      sb.from('game_stats').select('user_id,level,records').not('records','is',null),
      sb.from('profiles').select('user_id,username')
    ]);

    const profMap = {};
    (profiles||[]).forEach(p => profMap[p.user_id] = p.username || 'Anonyme');

    const scores = (stats||[])
      .filter(r => (r.records?.tower || r.records?.tower_floor || 0) > 0)
      .map(r => ({ uid:r.user_id, level:r.level||1, floors:r.records.tower || r.records.tower_floor || 0, name:profMap[r.user_id]||'Anonyme' }))
      .sort((a,b) => b.floors - a.floors);

    if (scores.length === 0) {
      document.getElementById('list').innerHTML = '<div style="flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;padding:40px 0"><div style="font-size:40px">🏗️</div><div style="font-family:\'Bebas Neue\',sans-serif;font-size:18px;color:rgba(255,255,255,0.3);letter-spacing:2px">AUCUN SCORE ENCORE</div></div>';
      return;
    }

    const myRank = scores.findIndex(r => r.uid === meId);
    const myData = myRank >= 0 ? scores[myRank] : null;

    // ── PODIUM top 3 ──
    const top3 = scores.slice(0, 3);
    // ordre affiché : 2e, 1er, 3e
    const podOrder  = [top3[1]||null, top3[0]||null, top3[2]||null];
    const podClass  = ['pod-2','pod-1','pod-3'];
    const podRanks  = [2, 1, 3];
    const medalBg   = [
      'linear-gradient(135deg,#b0bec5,#78909c)',
      'linear-gradient(135deg,#F9A825,#F57F17)',
      'linear-gradient(135deg,#a1887f,#6d4c41)'
    ];

    let podHtml = '';
    podOrder.forEach((p, i) => {
      if (!p) { podHtml += '<div class="pod"></div>'; return; }
      const isMe = p.uid === meId;
      const col  = avColor(p.uid);
      const crown = podRanks[i] === 1 ? '<div class="pod-crown">👑</div>' : '';
      podHtml += `
        <div class="pod ${podClass[i]}${isMe?' me':''}">
          ${crown}
          <div class="pod-avatar" style="background:${medalBg[i]}">${esc(avLetter(p.name))}</div>
          <div class="pod-name">${esc(p.name)}${isMe?' 👈':''}</div>
          <div class="pod-score">${p.floors}</div>
          <div class="pod-lbl">ÉTAGES</div>
          <div class="pod-base"><div class="pod-base-rank">${podRanks[i]}</div></div>
        </div>`;
    });
    document.getElementById('podium').innerHTML = podHtml;
    document.getElementById('podium').style.display = 'flex';
    document.getElementById('sep').style.display = 'block';

    // ── LISTE rang 4+ ──
    let listHtml = '';
    scores.slice(3).forEach((p, i) => {
      const rank = i + 4;
      const isMe = p.uid === meId;
      const col  = avColor(p.uid);
      listHtml += `
        <div class="row${isMe?' me':''}">
          <div class="row-rank">${rank}</div>
          <div class="row-av" style="background:${col}">${esc(avLetter(p.name))}</div>
          <div style="flex:1;min-width:0">
            <div class="row-name">${esc(p.name)}${isMe?' 👈':''}</div>
            <div class="row-detail">Nv.${p.level} · ${grade(p.level)}</div>
          </div>
          <div style="text-align:right">
            <div class="row-floors">${p.floors}</div>
            <div class="row-lbl">ÉTAGES</div>
          </div>
        </div>`;
    });
    document.getElementById('list').innerHTML = listHtml || '<div style="text-align:center;padding:20px 0;font-size:11px;color:rgba(255,255,255,0.2)">Seulement 3 joueurs pour l\'instant</div>';

    // ── MON SCORE sticky si hors top visible ──
    const stickyEl = document.getElementById('stickyMe');
    if (myData && myRank >= 3) {
      const col = avColor(myData.uid);
      stickyEl.innerHTML = `
        <div class="row me" style="margin-bottom:0">
          <div class="row-rank">${myRank+1}</div>
          <div class="row-av" style="background:${col}">${esc(avLetter(myData.name))}</div>
          <div style="flex:1;min-width:0">
            <div class="row-name">${esc(myData.name)} 👈 Moi</div>
            <div class="row-detail">Mon record</div>
          </div>
          <div style="text-align:right">
            <div class="row-floors">${myData.floors}</div>
            <div class="row-lbl">ÉTAGES</div>
          </div>
        </div>`;
      stickyEl.style.display = 'block';
    } else if (!myData) {
      stickyEl.innerHTML = `<div style="text-align:center;padding:6px 0;font-size:11px;color:rgba(255,255,255,0.25)">Pas encore de score · <button onclick="window.location.href='tower.html'" style="background:none;border:none;color:#F9A825;font-size:11px;cursor:pointer;font-family:inherit;font-weight:700">Jouer →</button></div>`;
      stickyEl.style.display = 'block';
    }
  }

  load();
</script>
</body>
</html>
