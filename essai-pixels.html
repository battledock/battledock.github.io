<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Battle Dock · les paliers de netteté</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;background:#17120d;font-family:Georgia,serif;overflow:hidden;touch-action:none;overscroll-behavior:none}
#ec{position:fixed;inset:0;display:flex;flex-direction:column}
#bar{flex:none;background:#17365a;border-bottom:2px solid #c9a24a;
  padding:calc(env(safe-area-inset-top,0px) + 9px) 10px 9px}
#bar .t{display:flex;align-items:center;gap:8px}
#bar b{flex:1;font:900 14px Georgia;color:#f0d78a}
#bar b i{display:block;font:italic 10px Georgia;color:#9fc4d8;font-weight:400}
.bt{border:1px solid #27506e;border-radius:9px;background:#0f2c3c;color:#9fc4d8;padding:9px 11px;
  font:700 9px Arial;letter-spacing:1px}
.bt.on{background:#f0d78a;border-color:#f0d78a;color:#16303c}
#chiffres{display:flex;gap:7px;margin-top:8px}
#chiffres div{flex:1;background:#0b1f2e;border:1px solid #27506e;border-radius:8px;padding:6px 7px;text-align:center}
#chiffres small{display:block;font:700 6.5px Arial;letter-spacing:1.1px;color:#7fa8c4}
#chiffres b{display:block;font:700 12px Georgia;color:#f0d78a;margin-top:1px}
#jeu{flex:1;position:relative;overflow:hidden;background:#000}
#cv{position:absolute;left:0;top:0;image-rendering:pixelated}
#joy{position:absolute;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  width:124px;height:124px;border-radius:50%;background:rgba(23,54,90,.35);border:2px solid rgba(240,215,138,.4)}
#stick{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;
  background:rgba(240,215,138,.85)}
#note{position:absolute;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);width:146px;
  background:rgba(23,18,13,.86);border-radius:9px;padding:9px 10px;color:#e8dcc0;font:italic 10.5px Georgia;line-height:1.45}
</style></head><body>
<div id="ec">
  <div id="bar"><div class="t"><b>LES PALIERS<i id="quoi">Palier fluide</i></b>
    <button class="bt on" id="b1">FLUIDE</button>
    <button class="bt" id="b2">ÉQUILIBRÉ</button>
    <button class="bt" id="b3">NET</button></div>
    <div id="chiffres">
      <div><small>PIXELS / IMAGE</small><b id="cPx">—</b></div>
      <div><small>ÉCHELLE</small><b id="cEch">—</b></div>
      <div><small>IMAGES / S</small><b id="cFps">—</b></div>
    </div></div>
  <div id="jeu"><canvas id="cv"></canvas>
    <div id="note">Marche à gauche et à droite : regarde si le décor reste stable ou s’il vibre.</div>
    <div id="joy"><div id="stick"></div></div>
  </div>
</div>
<script>
const $=(id)=>document.getElementById(id);
const cv=$('cv'), g=cv.getContext('2d');
const PALIERS={fluide:{cap:1.5,nom:'Palier fluide'},
               equilibre:{cap:2,nom:'Palier équilibré'},
               nette:{cap:3,nom:'Palier net',rond:true}};
let M='fluide', VW=0,VH=0,ECH=1, J={x:600,y:120,vx:0}, joy={x:0,actif:false};
function taille(){
  const r=$('jeu').getBoundingClientRect(), dprReel=window.devicePixelRatio||1;
  const P=PALIERS[M];
  let e=Math.max(r.width/200,r.height/420);
  e=Math.max(1.2,Math.round(e*8)/8);
  const dpr=Math.max(1,Math.min(P.cap,dprReel));
  if(P.rond){ECH=Math.max(1,Math.round(e*dpr));e=ECH/dpr;}
  else ECH=e*dpr;
  VW=Math.ceil(r.width/e)+1;VH=Math.ceil(r.height/e)+1;
  cv.width=Math.round(VW*ECH);cv.height=Math.round(VH*ECH);
  cv.style.width=(VW*e)+'px';cv.style.height=(VH*e)+'px';
  g.setTransform(ECH,0,0,ECH,0,0);g.imageSmoothingEnabled=false;
  $('cPx').textContent=Math.round(cv.width*cv.height/1000)+' k';
  $('cEch').textContent=(Math.round(ECH*100)/100)+(ECH%1===0?' ✓':'');
  $('quoi').textContent=P.nom+(P.rond?' · échelle ronde':'');}
addEventListener('resize',taille);
/* un décor en pixels, volontairement chargé en détails fins */
const al=n=>{const v=Math.sin(n*12.9898)*43758.5453;return v-Math.floor(v);};
function decor(camX){
  const R=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.max(1,w),Math.max(1,h));};
  R(0,0,VW,VH,'#cfe0e8');
  for(let y=0;y<34;y++)R(0,y,VW,1,y<18?'#bcd8e4':'#cfe0e8');
  /* les façades, avec briques fines et volets */
  for(let b=-1;b<7;b++){
    const x0=Math.round(b*78-(camX%78))-10, c1=['#b85e32','#9a7146','#7a4a34','#8a6238'][(b+8)%4];
    for(let y=34;y<104;y+=3)for(let x=x0;x<x0+74;x+=5)
      R(x,y,4,2,((x+y*3)>>2)%3?c1:'#c9743e');
    for(let f=0;f<3;f++){const fx=x0+8+f*22;
      R(fx,46,15,20,'#2a3a44');R(fx+1,47,13,18,'#c8dae0');
      for(let s=0;s<6;s++)R(fx+1,48+s*3,13,1.4,'#8aa8b8');
      R(fx-1,44,17,3,'#5a3f22');}
    R(x0,104,74,8,'#17365a');R(x0,104,74,1.5,'#e2c070');
    for(let k=0;k<74;k+=6)R(x0+k,112,6,4,(k/6)%2?'#f2ece0':'#17365a');}
  /* le quai, pavé fin */
  for(let y=120;y<VH;y+=5)for(let x=-(camX%9);x<VW;x+=9){
    const n=al(Math.round(x+camX)*0.3+y*0.2);
    R(x,y,8,4,n<.5?'#e4d7b6':'#d8caa8');}
  for(let y=124;y<VH;y+=27)R(0,y,VW,1,'rgba(120,96,56,.18)');}
function perso(px,py){
  const R=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.max(1,w),Math.max(1,h));};
  R(px-5,py-26,10,8,'#4a3220');R(px-4,py-19,8,8,'#e8c8a8');
  R(px-2,py-16,1.6,1.6,'#2a1a14');R(px+1,py-16,1.6,1.6,'#2a1a14');
  R(px-5,py-11,10,11,'#17365a');R(px-7,py-10,2,7,'#17365a');R(px+5,py-10,2,7,'#17365a');
  R(px-4,py,3,7,'#3a4358');R(px+1,py,3,7,'#3a4358');
  R(px-4,py+7,3,2,'#2f2a24');R(px+1,py+7,3,2,'#2f2a24');}
let t0=performance.now(), fps=[], camX=0;
function boucle(t){
  requestAnimationFrame(boucle);
  const dt=Math.min(0.05,(t-t0)/1000);t0=t;
  fps.push(dt);if(fps.length>60)fps.shift();
  $('cFps').textContent=Math.round(1/(fps.reduce((a,b)=>a+b,0)/fps.length));
  const cible=joy.x*120;
  J.vx+=(cible-J.vx)*(1-Math.exp(-8*dt));
  J.x+=J.vx*dt;
  camX=J.x-VW/2;
  decor(camX);
  perso(VW/2,VH*0.62);}
const jd=$('joy'), st=$('stick');
function pos(ev){const r=jd.getBoundingClientRect();
  const x=Math.max(-1,Math.min(1,(ev.clientX-r.left-r.width/2)/(r.width/2)));
  joy.x=x;st.style.transform='translateX('+(x*32)+'px)';}
jd.onpointerdown=(e)=>{e.preventDefault();joy.actif=true;jd.setPointerCapture(e.pointerId);pos(e);};
jd.onpointermove=(e)=>{if(joy.actif)pos(e);};
const lache=()=>{joy.actif=false;joy.x=0;st.style.transform='';};
jd.onpointerup=lache;jd.onpointercancel=lache;
function choisir(m,b){M=m;['b1','b2','b3'].forEach(i=>$(i).classList.remove('on'));$(b).classList.add('on');taille();}
$('b1').onclick=()=>choisir('fluide','b1');
$('b2').onclick=()=>choisir('equilibre','b2');
$('b3').onclick=()=>choisir('nette','b3');
taille();requestAnimationFrame(boucle);
</script></body></html>
