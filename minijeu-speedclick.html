<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Speed Click Challenge - Battle Dock</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    .container {
      max-width: 600px;
      width: 100%;
      padding: 20px;
    }

    .header {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      letter-spacing: 2px;
      color: #667eea;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: #6b7280;
    }

    .game-area {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      padding: 40px 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      text-align: center;
      margin-bottom: 20px;
      min-height: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .timer {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 80px;
      color: #667eea;
      margin-bottom: 20px;
      text-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }

    .timer.warning {
      color: #f59e0b;
      animation: pulse 0.5s ease-in-out infinite;
    }

    .timer.danger {
      color: #dc2626;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .counter {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 120px;
      color: #1a1a1a;
      margin-bottom: 20px;
      animation: pop 0.1s ease;
    }

    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    .click-zone {
      width: 280px;
      height: 280px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.1s;
      box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
      position: relative;
      overflow: hidden;
    }

    .click-zone:active {
      transform: scale(0.95);
    }

    .click-zone-text {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      color: white;
      letter-spacing: 2px;
      z-index: 1;
    }

    .ripple-effect {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.6);
      width: 20px;
      height: 20px;
      animation: ripple 0.6s ease-out;
      pointer-events: none;
    }

    @keyframes ripple {
      to {
        width: 300px;
        height: 300px;
        opacity: 0;
      }
    }

    .start-btn, .restart-btn {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      padding: 16px 48px;
      border-radius: 12px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
      transition: all 0.2s;
    }

    .start-btn:active, .restart-btn:active {
      transform: scale(0.95);
    }

    .results {
      display: none;
    }

    .results.show {
      display: block;
    }

    .result-score {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 100px;
      color: #667eea;
      margin-bottom: 16px;
    }

    .result-label {
      font-size: 18px;
      color: #6b7280;
      margin-bottom: 8px;
    }

    .result-reward {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 48px;
      color: #10b981;
      margin: 20px 0;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 20px 0;
    }

    .stat-card {
      background: #f9fafb;
      padding: 12px;
      border-radius: 8px;
    }

    .stat-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      color: #1a1a1a;
    }

    .stat-label {
      font-size: 12px;
      color: #6b7280;
    }

    .back-btn {
      background: white;
      color: #667eea;
      border: 2px solid #667eea;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s;
    }

    .back-btn:active {
      transform: scale(0.98);
    }

    .instruction {
      font-size: 16px;
      color: #6b7280;
      margin-bottom: 24px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- HEADER -->
    <div class="header">
      <div class="title">⚡ Speed Click Challenge</div>
      <div class="subtitle">Clique le plus vite possible en 10 secondes !</div>
    </div>

    <!-- GAME AREA -->
    <div class="game-area">
      <!-- WAITING STATE -->
      <div id="waitingState">
        <div class="instruction">Prêt à tester ta vitesse de clic ?</div>
        <button class="start-btn" onclick="startGame()">Commencer</button>
      </div>

      <!-- PLAYING STATE -->
      <div id="playingState" style="display: none;">
        <div class="timer" id="timer">10</div>
        <div class="counter" id="counter">0</div>
        <div class="click-zone" id="clickZone">
          <div class="click-zone-text">CLIQUE !</div>
        </div>
      </div>

      <!-- RESULTS STATE -->
      <div id="resultsState" class="results">
        <div class="result-label">Ton score</div>
        <div class="result-score" id="finalScore">0</div>
        <div class="result-label">Clics par seconde</div>
        <div class="stat-value" id="cps">0</div>
        
        <div class="result-reward" id="reward">+0€</div>
        
        <div class="stats">
          <div class="stat-card">
            <div class="stat-value" id="bestScore">0</div>
            <div class="stat-label">Meilleur score</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="totalPlayed">0</div>
            <div class="stat-label">Parties jouées</div>
          </div>
        </div>

        <button class="restart-btn" onclick="startGame()">Rejouer</button>
      </div>
    </div>

    <!-- BACK BUTTON -->
    <button class="back-btn" onclick="goBack()">← Retour aux mini-jeux</button>
  </div>

  <script>
    console.log('⚡ [SPEED CLICK] Initialisation');

    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const supabaseClient = createClient(supabaseUrl, supabaseKey);

    const userId = localStorage.getItem('userId');
    if (!userId) {
      window.location.href = 'index.html';
    }

    let clicks = 0;
    let timeLeft = 10;
    let gameInterval = null;
    let bestScore = localStorage.getItem('speed_click_best') || 0;
    let totalPlayed = parseInt(localStorage.getItem('speed_click_played') || 0);

    document.getElementById('bestScore').textContent = bestScore;
    document.getElementById('totalPlayed').textContent = totalPlayed;

    function startGame() {
      console.log('🎮 [SPEED CLICK] Démarrage du jeu');
      
      clicks = 0;
      timeLeft = 10;
      
      document.getElementById('waitingState').style.display = 'none';
      document.getElementById('playingState').style.display = 'block';
      document.getElementById('resultsState').classList.remove('show');
      
      updateDisplay();
      
      gameInterval = setInterval(tick, 1000);
      
      // Enable clicking
      document.getElementById('clickZone').onclick = handleClick;
    }

    function handleClick(e) {
      clicks++;
      document.getElementById('counter').textContent = clicks;
      
      // Ripple effect
      const ripple = document.createElement('div');
      ripple.className = 'ripple-effect';
      const rect = e.currentTarget.getBoundingClientRect();
      ripple.style.left = (e.clientX - rect.left - 10) + 'px';
      ripple.style.top = (e.clientY - rect.top - 10) + 'px';
      e.currentTarget.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
      
      // Re-trigger animation
      const counter = document.getElementById('counter');
      counter.style.animation = 'none';
      setTimeout(() => {
        counter.style.animation = 'pop 0.1s ease';
      }, 10);
    }

    function tick() {
      timeLeft--;
      updateDisplay();
      
      if (timeLeft <= 0) {
        endGame();
      }
    }

    function updateDisplay() {
      const timerEl = document.getElementById('timer');
      timerEl.textContent = timeLeft;
      
      if (timeLeft <= 3) {
        timerEl.classList.add('danger');
      } else if (timeLeft <= 5) {
        timerEl.classList.add('warning');
      } else {
        timerEl.classList.remove('warning', 'danger');
      }
    }

    async function endGame() {
      console.log('🏁 [SPEED CLICK] Fin du jeu, score:', clicks);
      
      clearInterval(gameInterval);
      document.getElementById('clickZone').onclick = null;
      
      // Calculate reward (10€ per click)
      const reward = clicks * 10;
      
      // Update best score
      if (clicks > bestScore) {
        bestScore = clicks;
        localStorage.setItem('speed_click_best', bestScore);
      }
      
      // Update total played
      totalPlayed++;
      localStorage.setItem('speed_click_played', totalPlayed);
      
      // Show results
      document.getElementById('playingState').style.display = 'none';
      document.getElementById('resultsState').classList.add('show');
      document.getElementById('finalScore').textContent = clicks;
      document.getElementById('cps').textContent = (clicks / 10).toFixed(1);
      document.getElementById('reward').textContent = '+' + reward + '€';
      document.getElementById('bestScore').textContent = bestScore;
      document.getElementById('totalPlayed').textContent = totalPlayed;
      
      // Save reward to Supabase
      try {
        const { data: progressArray } = await supabaseClient
          .from('game_progress')
          .select('money')
          .eq('user_id', userId);
        
        if (progressArray && progressArray[0]) {
          const newMoney = (progressArray[0].money || 0) + reward;
          
          await supabaseClient
            .from('game_progress')
            .update({ money: newMoney })
            .eq('user_id', userId);
          
          console.log('✅ [SPEED CLICK] Récompense ajoutée:', reward + '€');
        }
      } catch (err) {
        console.error('❌ [SPEED CLICK] Erreur sauvegarde:', err);
      }
    }

    function goBack() {
      window.location.href = 'jeux.html';
    }
  </script>
</body>
</html>
