<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Objectifs — Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bangers&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0d1117;font-family:'Inter',sans-serif;min-height:100dvh;padding-bottom:calc(20px + env(safe-area-inset-bottom))}

/* ── HEADER BD ── */
.hdr{
  background:#cc1a1a;
  padding:calc(14px + env(safe-area-inset-top)) 16px 14px;
  position:relative;overflow:hidden;
  border-bottom:4px solid #0f172a;
}
.hdr::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent 0 10px,rgba(0,0,0,.04) 10px 12px)}
.hdr-row{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.back{background:#0f172a;border:3px solid #0f172a;border-radius:8px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:white;font-size:14px;cursor:pointer;flex-shrink:0;box-shadow:3px 3px 0 rgba(0,0,0,.4)}
.hdr-title{font-family:'Bangers',cursive;font-size:26px;letter-spacing:3px;color:white;text-shadow:3px 3px 0 rgba(0,0,0,.4);flex:1}
.hdr-date{font-size:9px;font-weight:800;letter-spacing:2px;color:rgba(255,255,255,.6)}

/* ── BILAN ── */
.bilan{
  margin:14px;
  background:#161b22;
  border:3px solid #cc1a1a;
  border-radius:4px;
  padding:14px;
  display:flex;align-items:center;gap:14px;
  box-shadow:4px 4px 0 rgba(204,26,26,.3);
}
.bilan-arc{flex-shrink:0}
.bilan-info{flex:1}
.bilan-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;color:white;line-height:1}
.bilan-sub{font-size:11px;color:rgba(255,255,255,.4);margin-top:3px;font-weight:600}
.bilan-bar-wrap{height:6px;background:rgba(255,255,255,.08);border-radius:3px;margin-top:8px;overflow:hidden}
.bilan-bar-fill{height:100%;background:linear-gradient(90deg,#cc1a1a,#fbbf24);border-radius:3px;transition:width .5s}
.bilan-right{flex-shrink:0;text-align:right}
.bilan-count{font-family:'Bebas Neue',sans-serif;font-size:28px;color:#fbbf24;line-height:1}
.bilan-lbl{font-size:8px;font-weight:800;letter-spacing:1px;color:rgba(255,255,255,.3)}

/* ── SECTION ── */
.section-hd{
  margin:14px 14px 8px;
  display:flex;align-items:center;gap:8px;
}
.section-hd-line{flex:1;height:2px;background:repeating-linear-gradient(90deg,rgba(204,26,26,.4) 0 6px,transparent 6px 10px)}
.section-hd-txt{font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:3px;color:#cc1a1a}

/* ── OBJECTIF CARD BD ── */
.obj-card{
  margin:0 14px 10px;
  background:#161b22;
  border:3px solid #21262d;
  border-radius:4px;
  overflow:hidden;
  position:relative;
  box-shadow:3px 3px 0 rgba(0,0,0,.5);
  transition:border-color .15s;
}
.obj-card.done{border-color:#22c55e}
.obj-card.claimed{border-color:rgba(255,255,255,.1);opacity:.55}

/* Bande catégorie à gauche */
.obj-card-inner{display:flex;align-items:stretch}
.obj-band{width:5px;flex-shrink:0}
.obj-body{flex:1;padding:12px}

/* Header objectif */
.obj-hd{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.obj-icon{font-size:26px;flex-shrink:0;width:40px;height:40px;background:rgba(255,255,255,.04);border:2px solid rgba(255,255,255,.06);border-radius:4px;display:flex;align-items:center;justify-content:center}
.obj-info{flex:1}
.obj-title{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:1px;color:white;line-height:1.1}
.obj-cat{font-size:8px;font-weight:800;letter-spacing:2px;margin-top:3px}
.obj-reward{text-align:right;flex-shrink:0}
.obj-reward-val{font-family:'Bebas Neue',sans-serif;font-size:16px;color:#fbbf24;line-height:1}
.obj-reward-lbl{font-size:7px;font-weight:800;letter-spacing:1px;color:rgba(255,255,255,.3);margin-top:1px}

/* Barre de progression */
.obj-prog-wrap{margin-bottom:10px}
.obj-prog-top{display:flex;justify-content:space-between;margin-bottom:4px}
.obj-prog-lbl{font-size:9px;font-weight:700;color:rgba(255,255,255,.4);letter-spacing:.5px}
.obj-prog-val{font-size:9px;font-weight:800;color:rgba(255,255,255,.6)}
.obj-prog-bar{height:5px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden}
.obj-prog-fill{height:100%;border-radius:2px;transition:width .5s}

/* Bouton réclamer */
.obj-btn{
  width:100%;background:rgba(255,255,255,.04);border:2px solid rgba(255,255,255,.08);border-radius:3px;
  padding:10px;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:2px;color:rgba(255,255,255,.4);
  cursor:default;text-align:center;
}
.obj-btn.ready{
  background:linear-gradient(135deg,#cc1a1a,#991414);border-color:#cc1a1a;
  color:white;cursor:pointer;box-shadow:2px 2px 0 rgba(0,0,0,.4);
}
.obj-btn.ready:active{transform:scale(.98);opacity:.85}
.obj-btn.claimed-btn{background:rgba(34,197,94,.08);border-color:rgba(34,197,94,.2);color:#22c55e}

/* Badge complété */
.done-stamp{
  position:absolute;top:10px;right:10px;
  background:#22c55e;border:2px solid #166534;border-radius:3px;
  padding:2px 8px;font-family:'Bebas Neue',sans-serif;font-size:10px;
  color:white;letter-spacing:2px;transform:rotate(-2deg);
  box-shadow:2px 2px 0 rgba(0,0,0,.3);
}

/* ── RÉCOMPENSE ANNONCÉE ── */
.reward-toast{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:#0f172a;border:4px solid #cc1a1a;border-radius:4px;
  padding:24px 32px;text-align:center;z-index:300;
  box-shadow:6px 6px 0 rgba(204,26,26,.4);
  display:none;
}
.reward-toast.show{display:block}
.reward-icon{font-size:40px;margin-bottom:8px}
.reward-txt{font-family:'Bangers',cursive;font-size:28px;letter-spacing:3px;color:#fbbf24;text-shadow:2px 2px 0 rgba(0,0,0,.5)}
.reward-sub{font-size:12px;color:rgba(255,255,255,.5);margin-top:4px;font-weight:600}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:299;display:none}
.overlay.show{display:block}

/* ── LOADER ── */
.loader{position:fixed;inset:0;background:#0d1117;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;gap:12px}
.loader-icon{font-size:36px;animation:ldpulse 1.2s ease-in-out infinite}
@keyframes ldpulse{0%,100%{opacity:.3}50%{opacity:1}}
.loader-txt{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:4px;color:rgba(255,255,255,.3)}

/* ── TOAST ── */
.sml-toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#0f172a;color:white;padding:8px 16px;border-radius:20px;font-size:11px;font-weight:700;z-index:400;opacity:0;transition:opacity .2s;pointer-events:none;border:1px solid rgba(255,255,255,.1);white-space:nowrap}
.sml-toast.show{opacity:1}

/* ── SECTION DEMAIN ── */
.demain-card{margin:0 14px;background:#161b22;border:2px solid rgba(255,255,255,.06);border-radius:4px;padding:14px;opacity:.5}
.demain-title{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:2px;color:rgba(255,255,255,.4)}
.demain-sub{font-size:10px;color:rgba(255,255,255,.25);margin-top:4px;font-weight:600}
.countdown{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#cc1a1a;margin-top:6px;letter-spacing:1px}
</style>
</head>
<body>

<div class="loader" id="loader">
  <div class="loader-icon">🎯</div>
  <div class="loader-txt">OBJECTIFS DU JOUR</div>
</div>

<div id="main" style="display:none">

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-row">
    <button class="back" onclick="window.location.href='game.html'">←</button>
    <div class="hdr-title">🎯 OBJECTIFS DU JOUR</div>
    <div class="hdr-date" id="hdr-date"></div>
  </div>
</div>

<!-- BILAN -->
<div class="bilan">
  <div class="bilan-arc">
    <svg width="56" height="56" viewBox="0 0 56 56">
      <circle cx="28" cy="28" r="22" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="5"/>
      <circle cx="28" cy="28" r="22" fill="none" stroke="#cc1a1a" stroke-width="5"
        stroke-dasharray="0 138" stroke-linecap="round"
        transform="rotate(-90 28 28)" id="arc-fill" style="transition:stroke-dasharray .6s"/>
      <text x="28" y="32" text-anchor="middle" font-family="Bebas Neue,sans-serif" font-size="16" fill="white" id="arc-txt">0</text>
    </svg>
  </div>
  <div class="bilan-info">
    <div class="bilan-title" id="bilan-title">OBJECTIFS DU JOUR</div>
    <div class="bilan-sub" id="bilan-sub">Charge en cours...</div>
    <div class="bilan-bar-wrap"><div class="bilan-bar-fill" id="bilan-bar" style="width:0%"></div></div>
  </div>
  <div class="bilan-right">
    <div class="bilan-count" id="bilan-count">0/3</div>
    <div class="bilan-lbl">COMPLETES</div>
  </div>
</div>

<!-- OBJECTIFS -->
<div class="section-hd">
  <div class="section-hd-txt">MISSIONS</div>
  <div class="section-hd-line"></div>
</div>

<div id="obj-list"></div>

<!-- COMPTE A REBOURS DEMAIN -->
<div class="section-hd" style="margin-top:16px">
  <div class="section-hd-txt">PROCHAINS OBJECTIFS</div>
  <div class="section-hd-line"></div>
</div>
<div class="demain-card">
  <div class="demain-title">NOUVEAUX OBJECTIFS DANS</div>
  <div class="countdown" id="countdown">—</div>
  <div class="demain-sub">Réinitialisés chaque jour à minuit</div>
</div>

</div><!-- /main -->

<!-- OVERLAY RÉCOMPENSE -->
<div class="overlay" id="overlay" onclick="closeReward()"></div>
<div class="reward-toast" id="reward-toast">
  <div class="reward-icon" id="reward-icon">🏆</div>
  <div class="reward-txt" id="reward-txt">+5 000€</div>
  <div class="reward-sub" id="reward-sub">Objectif complété !</div>
</div>

<div class="sml-toast" id="sml-toast"></div>

<script>
var SB_URL='https://drtsuhnbclhmgfjiykap.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
var sb=supabase.createClient(SB_URL,SB_KEY);
var currentUser=null, money=0, objectives=[];

// ── CATALOGUE ──
var POOL=[
  {id:'click200',   cat:'CLICKER',  icon:'👊', title:'Clique 200 fois',              type:'clicks',   target:200,  reward:500,   rewardType:'money'},
  {id:'click500',   cat:'CLICKER',  icon:'⚡', title:'Clique 500 fois',              type:'clicks',   target:500,  reward:1500,  rewardType:'money'},
  {id:'combo5',     cat:'CLICKER',  icon:'🔥', title:'Atteins un combo x5',          type:'combo',    target:5,    reward:1000,  rewardType:'money'},
  {id:'earn10k',    cat:'CLICKER',  icon:'💰', title:'Gagne 10 000€ en cliquant',   type:'earn',     target:10000,reward:2000,  rewardType:'money'},
  {id:'casino1',    cat:'CASINO',   icon:'🎰', title:'Lance une partie de casino',   type:'casino_play',target:1,  reward:200,   rewardType:'money'},
  {id:'casino_win', cat:'CASINO',   icon:'🃏', title:'Gagne une partie de casino',   type:'casino_win',target:1,  reward:1500,  rewardType:'money'},
  {id:'casino_big', cat:'CASINO',   icon:'💎', title:'Mise plus de 5 000€ au casino',type:'casino_bet',target:5000,reward:25,   rewardType:'diamonds'},
  {id:'bank_dep',   cat:'BANQUE',   icon:'🏦', title:'Depose de l argent en banque', type:'bank_deposit',target:1, reward:300,  rewardType:'money'},
  {id:'bank_coll',  cat:'BANQUE',   icon:'💹', title:'Collecte tes interets',        type:'bank_collect',target:1, reward:500,  rewardType:'money'},
  {id:'commerce1',  cat:'COMMERCE', icon:'🏪', title:'Collecte tes revenus commerce',type:'com_collect',target:1, reward:1000, rewardType:'money'},
  {id:'invest1',    cat:'COMMERCE', icon:'📈', title:'Investis dans ton entreprise', type:'com_invest',target:1,  reward:2000, rewardType:'money'},
  {id:'xp500',      cat:'XP',       icon:'⭐', title:'Gagne 500 XP aujourd hui',    type:'xp',       target:500,  reward:1000, rewardType:'money'},
  {id:'login',      cat:'CONNEXION',icon:'📅', title:'Connecte-toi aujourd hui',     type:'login',    target:1,    reward:15,   rewardType:'diamonds'},
  {id:'lvlup',      cat:'XP',       icon:'🏆', title:'Monte de niveau',              type:'levelup',  target:1,    reward:50,   rewardType:'diamonds'},
];

var CAT_COLORS={
  'CLICKER':'#cc1a1a','CASINO':'#7c3aed','BANQUE':'#d4af37',
  'COMMERCE':'#0ea5e9','XP':'#22c55e','CONNEXION':'#f97316'
};

function fmtM(n){return n>=1000000?(n/1000000).toFixed(1)+'M€':n>=1000?Math.floor(n/1000)+'k€':Math.floor(n)+'€';}
function smlToast(msg){var t=document.getElementById('sml-toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2200);}

function todayStr(){return new Date().toISOString().split('T')[0];}

function pickObjectifs(){
  // Tirer 3 objectifs différents depuis le pool
  var shuffled=POOL.slice().sort(function(){return Math.random()-.5;});
  // Assurer diversité de catégories
  var cats={}, result=[];
  for(var i=0;i<shuffled.length&&result.length<3;i++){
    if(!cats[shuffled[i].cat]||(Object.keys(cats).length>=3&&result.length<3)){
      cats[shuffled[i].cat]=true;
      result.push(JSON.parse(JSON.stringify(shuffled[i])));
    }
  }
  return result.map(function(o){
    return {id:o.id,title:o.title,cat:o.cat,icon:o.icon,type:o.type,target:o.target,reward:o.reward,rewardType:o.rewardType,progress:o.type==='login'?1:0,completed:o.type==='login',claimed:false};
  });
}

function pct(o){return Math.min(100,Math.round((o.progress/o.target)*100));}

function renderBilan(){
  var done=objectives.filter(function(o){return o.completed||o.claimed;}).length;
  var p=Math.round(done/3*100);
  document.getElementById('bilan-count').textContent=done+'/3';
  document.getElementById('bilan-bar').style.width=p+'%';
  document.getElementById('arc-txt').textContent=done;
  var arc=document.getElementById('arc-fill');
  var filled=(done/3)*138;
  arc.setAttribute('stroke-dasharray',filled+' '+(138-filled));
  arc.setAttribute('stroke',done===3?'#22c55e':'#cc1a1a');
  if(done===3){document.getElementById('bilan-title').textContent='TOUS COMPLETES !';document.getElementById('bilan-sub').textContent='Reviens demain pour de nouveaux objectifs';}
  else{document.getElementById('bilan-title').textContent='OBJECTIFS DU JOUR';document.getElementById('bilan-sub').textContent=(3-done)+' objectif'+(3-done>1?'s':'')+' restant'+(3-done>1?'s':'');}
}

function renderObjectifs(){
  var list=document.getElementById('obj-list');
  list.innerHTML='';
  objectives.forEach(function(o,i){
    var done=o.completed||o.claimed;
    var p=pct(o);
    var color=CAT_COLORS[o.cat]||'#cc1a1a';
    var rewardTxt=o.rewardType==='diamonds'?o.reward+' 💎':fmtM(o.reward);
    var btnClass='obj-btn'+(o.claimed?' claimed-btn':done?' ready':'');
    var btnTxt=o.claimed?'✓ RECLAME':(done?'RECLAMER LA RECOMPENSE':'EN COURS...');
    var card=document.createElement('div');
    card.className='obj-card'+(o.claimed?' claimed':done?' done':'');
    card.id='obj-'+i;
    card.innerHTML='<div class="obj-card-inner">'
      +'<div class="obj-band" style="background:'+color+'"></div>'
      +'<div class="obj-body">'
      +(o.claimed?'<div class="done-stamp">RECLAME</div>':done?'<div class="done-stamp">COMPLETE</div>':'')
      +'<div class="obj-hd">'
        +'<div class="obj-icon">'+o.icon+'</div>'
        +'<div class="obj-info">'
          +'<div class="obj-title">'+o.title+'</div>'
          +'<div class="obj-cat" style="color:'+color+'">'+o.cat+'</div>'
        +'</div>'
        +'<div class="obj-reward">'
          +'<div class="obj-reward-val">'+rewardTxt+'</div>'
          +'<div class="obj-reward-lbl">RECOMPENSE</div>'
        +'</div>'
      +'</div>'
      +'<div class="obj-prog-wrap">'
        +'<div class="obj-prog-top">'
          +'<div class="obj-prog-lbl">PROGRESSION</div>'
          +'<div class="obj-prog-val">'+Math.min(o.progress,o.target)+'/'+o.target+'</div>'
        +'</div>'
        +'<div class="obj-prog-bar"><div class="obj-prog-fill" style="width:'+p+'%;background:'+color+'"></div></div>'
      +'</div>'
      +'<button class="'+btnClass+'" '+(o.claimed||!done?'disabled':'onclick="claimReward('+i+')"')+'>'+btnTxt+'</button>'
      +'</div></div>';
    list.appendChild(card);
  });
  renderBilan();
}

async function claimReward(idx){
  var o=objectives[idx];
  if(!o||o.claimed||!o.completed)return;
  // Donner récompense
  var updates={};
  if(o.rewardType==='money'){
    money+=o.reward;
    updates.money=money;
  } else {
    var {data:gs}=await sb.from('game_stats').select('diamonds').eq('user_id',currentUser.id).maybeSingle();
    updates.diamonds=((gs&&gs.diamonds)||0)+o.reward;
  }
  await sb.from('game_stats').update(updates).eq('user_id',currentUser.id);
  o.claimed=true;
  // Sauvegarder
  await saveObjectifs();
  renderObjectifs();
  showReward(o);
}

function showReward(o){
  var rewardTxt=o.rewardType==='diamonds'?'+'+o.reward+' 💎':'+'+fmtM(o.reward);
  document.getElementById('reward-icon').textContent=o.icon;
  document.getElementById('reward-txt').textContent=rewardTxt;
  document.getElementById('reward-sub').textContent=o.title+' accompli !';
  document.getElementById('overlay').classList.add('show');
  document.getElementById('reward-toast').classList.add('show');
  setTimeout(closeReward,2800);
}

function closeReward(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('reward-toast').classList.remove('show');
}

async function saveObjectifs(){
  await sb.from('daily_objectives').upsert({
    user_id:currentUser.id,
    date:todayStr(),
    objectives:objectives
  },{onConflict:'user_id,date'});
}

// Compte à rebours
function updateCountdown(){
  var now=new Date();
  var midnight=new Date(now);
  midnight.setHours(24,0,0,0);
  var diff=midnight-now;
  var h=Math.floor(diff/3600000);
  var m=Math.floor((diff%3600000)/60000);
  var s=Math.floor((diff%60000)/1000);
  var txt=h+'h '+m+'min '+s+'s';
  document.getElementById('countdown').textContent=txt;
}

async function startApp(){
  var res=await sb.auth.getSession();
  var sess=res.data&&res.data.session;
  if(!sess){window.location.href='index.html';return;}
  currentUser=sess.user;

  // Date du jour
  var now=new Date();
  var jours=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
  var mois=['Jan','Fev','Mar','Avr','Mai','Jun','Jul','Aou','Sep','Oct','Nov','Dec'];
  document.getElementById('hdr-date').textContent=jours[now.getDay()]+' '+now.getDate()+' '+mois[now.getMonth()];

  // Charger argent
  var {data:gs}=await sb.from('game_stats').select('money').eq('user_id',currentUser.id).maybeSingle();
  money=(gs&&gs.money)||0;

  // Charger ou créer objectifs du jour
  var {data:row}=await sb.from('daily_objectives').select('objectives').eq('user_id',currentUser.id).eq('date',todayStr()).maybeSingle();
  if(row&&row.objectives&&row.objectives.length>0){
    objectives=row.objectives;
  } else {
    objectives=pickObjectifs();
    await saveObjectifs();
  }

  document.getElementById('loader').style.display='none';
  document.getElementById('main').style.display='block';
  renderObjectifs();

  // Compte à rebours
  updateCountdown();
  setInterval(updateCountdown,1000);
}

document.addEventListener('DOMContentLoaded',function(){startApp();});
if(document.readyState==='complete'||document.readyState==='interactive'){startApp();}
</script>
</body>
</html>
