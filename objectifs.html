<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Objectifs du jour - Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; -webkit-font-smoothing:antialiased; }
  body { font-family:'Inter',sans-serif; background:#fff; color:#1f2937; min-height:100dvh; padding:0; overflow-x:hidden; }
  /* ===== BENTO GRID — fond blanc ===== */
  .bg { display:none; }
  .wrap { position:relative; z-index:1; max-width:540px; margin:0 auto; padding:calc(52px + env(safe-area-inset-top)) 14px 32px; }

  .page-title { font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:3px; color:#1a1a1a; margin-bottom:2px; }
  .page-sub { font-size:9px; color:rgba(0,0,0,0.3); letter-spacing:2px; margin-bottom:14px; }

  /* Grid bento */
  .bento { display:grid; grid-template-columns:1fr 1fr; gap:8px; }

  /* Arc card (colonne gauche, 3 lignes) */
  .arc-card {
    grid-column:1; grid-row:span 3;
    background:#f8f8f8; border:1px solid rgba(0,0,0,0.06);
    border-radius:14px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:16px 10px; gap:5px;
    box-shadow:0 4px 14px rgba(0,0,0,0.05);
  }
  .arc-lbl { font-family:'Bebas Neue',sans-serif; font-size:11px; letter-spacing:2px; color:rgba(0,0,0,0.3); }
  .arc-sub { font-size:8px; font-weight:700; letter-spacing:1px; color:rgba(0,0,0,0.2); text-align:center; }

  /* Mini objectifs (colonne droite) */
  .obj {
    background:#f8f8f8; border:1px solid rgba(0,0,0,0.06);
    border-radius:14px; padding:11px; display:flex; flex-direction:column; gap:5px;
    box-shadow:0 3px 10px rgba(0,0,0,0.04); cursor:pointer;
    transition:transform .12s;
  }
  .obj:active { transform:scale(0.97); }
  .obj.done { border-color:rgba(220,38,38,0.2); background:linear-gradient(135deg,#fff,#fff5f6); }
  .obj.claimed { opacity:0.55; }
  .obj-ic { font-size:20px; }
  .obj-mid { flex:1; }
  .obj-title { font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:0.5px; color:#1a1a1a; line-height:1.1; }
  .obj-hint { font-size:9px; color:#9ca3af; margin-top:2px; line-height:1.3; display:none; }
  .obj-reward { font-size:9px; color:#d97706; font-weight:700; margin-top:3px; }
  .obj-act { }
  .claim-btn {
    border:none; border-radius:8px; padding:8px 10px; width:100%;
    font-family:'Bebas Neue',sans-serif; font-size:12px; letter-spacing:0.5px;
    cursor:pointer; background:#dc2626; color:#fff;
  }
  .claim-btn:active { transform:scale(0.94); }
  .badge-st {
    font-family:'Bebas Neue',sans-serif; font-size:11px; letter-spacing:0.5px;
    padding:8px 10px; border-radius:8px; width:100%; text-align:center; display:block;
  }
  .st-todo { background:rgba(0,0,0,0.05); color:rgba(0,0,0,0.25); }
  .st-claimed { background:rgba(220,38,38,0.1); color:#dc2626; }

  /* Streak card (pleine largeur) */
  .streak-card {
    grid-column:span 2;
    background:linear-gradient(135deg,#dc2626,#9f1239);
    border-radius:14px; padding:12px 14px;
    display:flex; align-items:center; gap:10px;
    box-shadow:0 6px 20px rgba(220,38,38,0.25);
  }
  .streak-icon { font-size:22px; }
  .streak-info { flex:1; }
  .streak-val { font-family:'Bebas Neue',sans-serif; font-size:18px; color:#fff; line-height:1; }
  .streak-sub { font-size:8px; color:rgba(255,255,255,0.6); font-weight:700; letter-spacing:1px; margin-top:2px; }
  .streak-badge {
    background:rgba(255,255,255,0.15); border-radius:7px;
    padding:4px 9px; font-family:'Bebas Neue',sans-serif; font-size:11px; color:#fff;
  }

  /* Countdown card (pleine largeur) */
  .cd-card {
    grid-column:span 2;
    background:#f8f8f8; border:1px solid rgba(0,0,0,0.06);
    border-radius:14px; padding:9px 14px;
    display:flex; align-items:center; gap:8px;
  }
  .cd-icon { font-size:14px; opacity:0.35; }
  .cd-lbl { font-size:8px; color:rgba(0,0,0,0.25); font-weight:700; letter-spacing:2px; flex:1; }
  .cd-val { font-family:'Bebas Neue',sans-serif; font-size:16px; color:rgba(0,0,0,0.35); letter-spacing:2px; }

  /* Back button */
  .back-bottom {
    grid-column:span 2; margin-top:4px;
    padding:13px; border-radius:12px; cursor:pointer;
    background:#f8f8f8; border:1px solid rgba(0,0,0,0.07);
    color:rgba(0,0,0,0.35); font-family:'Bebas Neue',sans-serif;
    font-size:15px; letter-spacing:2px; width:100%;
  }
  .back-bottom:active { transform:scale(0.99); }

  /* Toast */
  .toast {
    position:fixed; top:18px; left:50%; transform:translateX(-50%) translateY(-20px); z-index:200;
    background:#fff; border:1px solid rgba(220,38,38,0.4); border-radius:13px;
    padding:12px 18px; font-size:13px; font-weight:700;
    opacity:0; transition:all .35s; max-width:90%; text-align:center;
    color:#dc2626; box-shadow:0 10px 30px rgba(0,0,0,0.12);
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.bad { border-color:rgba(220,38,38,0.6); color:#dc2626; }

  .loader { text-align:center; padding:60px; color:#c7c7d1; font-family:'Bebas Neue',sans-serif; letter-spacing:2px; }
  .note { grid-column:span 2; text-align:center; font-size:10px; color:#9ca3af; line-height:1.5; }
  .back-btn { display:none; }
  .hdr { display:none; }
  .mick { display:none; }
  .prog { display:none; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="wrap">
    <div class="page-title">OBJECTIFS</div>
    <div class="page-sub">3 DÉFIS QUOTIDIENS</div>
    <div class="bento">
      <!-- Arc progress (gauche, 3 lignes) -->
      <div class="arc-card">
        <svg id="objArcSvg" width="90" height="90" viewBox="0 0 90 90">
          <circle cx="45" cy="45" r="36" fill="none" stroke="rgba(220,38,38,0.1)" stroke-width="6"/>
          <circle id="objArcFill" cx="45" cy="45" r="36" fill="none" stroke="#dc2626" stroke-width="6"
            stroke-dasharray="0 226.2" stroke-dashoffset="56.5" stroke-linecap="round"
            transform="rotate(-90 45 45)" style="transition:stroke-dasharray .6s ease"/>
          <text id="objArcText" x="45" y="50" text-anchor="middle" font-family="Bebas Neue" font-size="18" fill="#1a1a1a">0/3</text>
        </svg>
        <div class="arc-lbl">PROGRESS</div>
        <div class="arc-sub" id="arcSub">0 FAIT · 3 RESTANTS</div>
      </div>
      <!-- Objectifs (droite) -->
      <div id="list"><div class="loader" style="grid-column:span 1;padding:20px;font-size:10px">…</div></div>
      <!-- Streak -->
      <div class="streak-card">
        <div class="streak-icon">🔥</div>
        <div class="streak-info">
          <div class="streak-val" id="streakVal">— JOURS</div>
          <div class="streak-sub">SÉRIE EN COURS</div>
        </div>
        <div class="streak-badge" id="streakBadge">RECORD : —</div>
      </div>
      <!-- Countdown -->
      <div class="cd-card">
        <div class="cd-icon">⏰</div>
        <div class="cd-lbl">RESET À MINUIT</div>
        <div class="cd-val" id="cdVal">—</div>
      </div>
      <div class="note">🔄 Nouveaux objectifs chaque jour à minuit</div>
      <button class="back-bottom" onclick="window.location.href='game.html'">← RETOUR AU JEU</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>

<script>
  const SB_URL = 'https://drtsuhnbclhmgfjiykap.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
  const sb = supabase.createClient(SB_URL, SB_KEY);

  // Pool de modèles d'objectifs (hors "connexion" qui est toujours présent)
  const POOL = [
    { id:'tower',    title:"Bats ton record d'étages (Tower)", icon:'🏗️', mode:'beat',     metric:'tower_floor',    reward:{type:'money',    amount:6000} },
    { id:'pointeau', title:'Bats ton record de score (Pointeau)', icon:'📋', mode:'beat',  metric:'pointeau_score', reward:{type:'money',    amount:6000} },
    { id:'combo',    title:'Bats ton combo max (Pointeau)',   icon:'🔥', mode:'beat',     metric:'pointeau_combo', reward:{type:'trophies', amount:1} },
    { id:'level',    title:'Gagne un niveau',                 icon:'⭐', mode:'inc',      metric:'level', amount:1, reward:{type:'diamonds', amount:3} },
    { id:'bourse',   title:'Réalise un profit à la Bourse',   icon:'📈', mode:'increase', metric:'bourse_profit',  reward:{type:'money',    amount:8000} },
  ];
  const LOGIN = { id:'login', title:'Connexion du jour', icon:'🔥', mode:'free', reward:{type:'diamonds', amount:2} };

  let currentUser=null, todayStr='', objectives=[];
  let money=0, level=1, diamonds=0, trophies=0, records={}, bourseProfit=0;

  const fmt=n=>Math.round(n).toLocaleString('fr-FR');
  const rewardText=r=> r.type==='money' ? `+${fmt(r.amount)}€` : r.type==='diamonds' ? `+${r.amount} 💎` : `+${r.amount} 🏆`;

  async function init(){
    const { data:{ session } } = await sb.auth.getSession();
    if(!session){ window.location.href='index.html'; return; }
    currentUser=session.user;
    todayStr = new Date().toISOString().split('T')[0];
    const { data:gs } = await sb.from('game_stats').select('money,level,records,bourse_profit,diamonds,trophies').eq('user_id',currentUser.id).maybeSingle();
    money=gs?.money||0; level=gs?.level||1; bourseProfit=gs?.bourse_profit||0;
    records=(gs?.records&&typeof gs.records==='object')?gs.records:{};
    diamonds=gs?.diamonds||0; trophies=gs?.trophies||0;

    const { data:row } = await sb.from('daily_objectives').select('objectives').eq('user_id',currentUser.id).eq('date',todayStr).maybeSingle();
    if(row?.objectives && Array.isArray(row.objectives) && row.objectives.length){ objectives=row.objectives; }
    else { objectives=generate(); await saveObjectives(); }
    refreshCompleted(true);
    render();
  }

  function curMetric(m){
    if(m==='level') return level;
    if(m==='bourse_profit') return bourseProfit;
    return records[m]||0;
  }
  function isMet(o){
    if(o.mode==='free') return true;
    const cur=curMetric(o.metric);
    if(o.mode==='inc') return (cur-(o.baseline||0))>=(o.amount||1);
    return cur > (o.baseline||0); // beat / increase
  }

  function generate(){
    const pool=[...POOL].sort(()=>Math.random()-0.5).slice(0,2);
    const chosen=[LOGIN, ...pool];
    return chosen.map(t=>({
      id:t.id, title:t.title, icon:t.icon, mode:t.mode, metric:t.metric||null, amount:t.amount||null,
      baseline: t.mode==='free'?0:curMetric(t.metric), reward:t.reward, completed:t.mode==='free', claimed:false
    }));
  }

  function refreshCompleted(silentSave){
    let changed=false;
    objectives.forEach(o=>{ const m=isMet(o); if(m && !o.completed){ o.completed=true; changed=true; } });
    if(changed && silentSave) saveObjectives();
  }

  function render(){
    const claimedOrDone = objectives.filter(o=>o.completed||o.claimed).length;
    const total = 3;

    // Arc SVG
    const arc = document.getElementById('objArcFill');
    const arcText = document.getElementById('objArcText');
    const arcSub = document.getElementById('arcSub');
    const circ = 226.2;
    if (arc) arc.setAttribute('stroke-dasharray', (claimedOrDone/total*circ) + ' ' + (circ - claimedOrDone/total*circ));
    if (arcText) arcText.textContent = `${claimedOrDone}/3`;
    if (arcSub) arcSub.textContent = `${claimedOrDone} FAIT · ${total-claimedOrDone} RESTANT${total-claimedOrDone>1?'S':''}`;

    // Liste bento (cards compactes)
    document.getElementById('list').innerHTML = objectives.map((o,i)=>{
      const met=isMet(o);
      let act;
      if(o.claimed) act=`<div class="badge-st st-claimed">✓ Réclamé</div>`;
      else if(met) act=`<button class="claim-btn" onclick="claim(${i})">Réclamer</button>`;
      else act=`<div class="badge-st st-todo">À faire</div>`;
      return `<div class="obj ${met?'done':''} ${o.claimed?'claimed':''}">
        <div class="obj-ic">${o.icon}</div>
        <div class="obj-mid">
          <div class="obj-title">${o.title}</div>
          <div class="obj-reward">🎁 ${rewardText(o.reward)}</div>
        </div>
        <div class="obj-act">${act}</div>
      </div>`;
    }).join('');
  }

  // Countdown jusqu'à minuit
  function updateCountdown() {
    const now = new Date();
    const midnight = new Date(now); midnight.setHours(24,0,0,0);
    const diff = midnight - now;
    const h = String(Math.floor(diff/3600000)).padStart(2,'0');
    const m = String(Math.floor((diff%3600000)/60000)).padStart(2,'0');
    const s = String(Math.floor((diff%60000)/1000)).padStart(2,'0');
    const el = document.getElementById('cdVal');
    if (el) el.textContent = `${h}:${m}:${s}`;
  }
  updateCountdown();
  setInterval(updateCountdown, 1000);

  function hint(o,met){
    if(o.mode==='free') return met?'Te voilà connecté ✓':'';
    if(o.claimed) return 'Récompense empochée';
    if(met) return 'Objectif atteint — réclame ta récompense !';
    if(o.mode==='inc' && o.metric==='level') return `Niveau ${o.baseline} → atteins le niveau ${o.baseline+1}`;
    if(o.metric==='tower_floor') return `Record actuel : ${o.baseline} étages — fais mieux aujourd'hui`;
    if(o.metric==='pointeau_score') return `Record actuel : ${o.baseline} pts — fais mieux`;
    if(o.metric==='pointeau_combo') return `Combo max : ×${o.baseline} — dépasse-le`;
    if(o.metric==='bourse_profit') return 'Encaisse un gain à la Bourse';
    return '';
  }

  async function claim(i){
    const o=objectives[i];
    if(o.claimed || !isMet(o)) return;
    o.claimed=true; o.completed=true;
    const r=o.reward;
    try {
      if(r.type==='money'){ money+=r.amount; await sb.from('game_stats').update({ money:Math.round(money) }).eq('user_id',currentUser.id); }
      else if(r.type==='diamonds'){ diamonds+=r.amount; await sb.from('game_stats').update({ diamonds }).eq('user_id',currentUser.id); }
      else if(r.type==='trophies'){ trophies+=r.amount; await sb.from('game_stats').update({ trophies }).eq('user_id',currentUser.id); }
      await saveObjectives();
    } catch(e){ console.log('claim:',e); }
    render();
    showToast(`🎁 Récompense empochée : ${rewardText(r)}`, false);
  }

  async function saveObjectives(){
    try { await sb.from('daily_objectives').upsert({ user_id:currentUser.id, date:todayStr, objectives }, { onConflict:'user_id,date' }); }
    catch(e){ console.log('save obj:',e); }
  }

  let toastT=null;
  function showToast(msg,bad){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show'+(bad?' bad':''); clearTimeout(toastT); toastT=setTimeout(()=>t.className='toast'+(bad?' bad':''),2400); }

  init();
</script>
</body>
</html>
