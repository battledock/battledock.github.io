<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Objectifs du jour - Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; -webkit-font-smoothing:antialiased; }
  body { font-family:'Inter',sans-serif; background:#04140d; color:#e6f5ec; min-height:100dvh; padding:0 14px 30px; overflow-x:hidden; }
  .bg { position:fixed; inset:0; z-index:0; pointer-events:none; background:
      radial-gradient(120% 60% at 50% -5%, rgba(34,197,94,0.18), transparent 60%),
      linear-gradient(180deg,#062315,#04140d 60%,#020d08); }
  .wrap { position:relative; z-index:1; max-width:540px; margin:0 auto; }

  .hdr { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px; padding:14px 4px;
    background:linear-gradient(180deg,#04140d,rgba(4,20,13,0.85)); backdrop-filter:blur(8px); }
  .back-btn { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:9px;
    padding:8px 12px; font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:1px; color:rgba(255,255,255,0.7); cursor:pointer; }
  .back-btn:active { transform:scale(0.95); }
  .hdr-title { flex:1; font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:2px;
    background:linear-gradient(135deg,#22c55e,#86efac,#22c55e); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }

  .mick { display:flex; align-items:center; gap:10px; margin:8px 2px 14px; }
  .mick-ava { width:46px; height:46px; border-radius:50%; background:linear-gradient(135deg,#16a34a,#22c55e); display:flex; align-items:center; justify-content:center; font-size:24px; flex-shrink:0; }
  .mick-bubble { flex:1; background:rgba(255,255,255,0.05); border:1px solid rgba(34,197,94,0.25); border-radius:12px; padding:9px 13px; font-size:13px; color:#d6f5e2; }
  .mick-bubble b{ color:#86efac; }

  .prog { background:rgba(255,255,255,0.04); border:1px solid rgba(34,197,94,0.2); border-radius:14px; padding:13px; margin-bottom:16px; }
  .prog-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .prog-lbl { font-size:11px; letter-spacing:1px; text-transform:uppercase; color:rgba(255,255,255,0.5); }
  .prog-val { font-family:'Bebas Neue',sans-serif; font-size:20px; color:#86efac; }
  .prog-track { height:9px; background:rgba(255,255,255,0.1); border-radius:5px; overflow:hidden; }
  .prog-fill { height:100%; background:linear-gradient(90deg,#16a34a,#4ade80); border-radius:5px; transition:width .4s; }

  .obj { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:16px; padding:14px; margin-bottom:12px; display:flex; gap:13px; align-items:center; }
  .obj.done { border-color:rgba(34,197,94,0.4); background:rgba(34,197,94,0.06); }
  .obj.claimed { opacity:0.7; }
  .obj-ic { width:48px; height:48px; border-radius:13px; background:rgba(34,197,94,0.12); display:flex; align-items:center; justify-content:center; font-size:26px; flex-shrink:0; }
  .obj-mid { flex:1; min-width:0; }
  .obj-title { font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:0.5px; color:#fff; }
  .obj-hint { font-size:11px; color:rgba(255,255,255,0.45); margin-top:2px; }
  .obj-reward { font-size:12px; color:#fbbf24; font-weight:700; margin-top:4px; }
  .obj-act { flex-shrink:0; }
  .claim-btn { border:none; border-radius:11px; padding:11px 14px; font-family:'Bebas Neue',sans-serif; font-size:14px; letter-spacing:0.5px; cursor:pointer;
    background:linear-gradient(135deg,#16a34a,#4ade80); color:#04230f; min-width:96px; }
  .claim-btn:active{ transform:scale(0.95); }
  .badge-st { font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:0.5px; padding:9px 12px; border-radius:11px; min-width:96px; text-align:center; }
  .st-todo { background:rgba(255,255,255,0.06); color:rgba(255,255,255,0.5); }
  .st-claimed { background:rgba(34,197,94,0.15); color:#86efac; }

  .note { text-align:center; font-size:11px; color:rgba(255,255,255,0.35); margin-top:8px; line-height:1.5; }
  .loader { text-align:center; padding:60px; color:rgba(255,255,255,0.3); font-family:'Bebas Neue',sans-serif; letter-spacing:2px; }
  .back-bottom { width:100%; margin-top:22px; padding:15px; border-radius:14px; cursor:pointer;
    background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12); color:rgba(255,255,255,0.7);
    font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:2px; }
  .toast { position:fixed; top:18px; left:50%; transform:translateX(-50%) translateY(-20px); z-index:200;
    background:rgba(6,30,18,0.97); border:1px solid rgba(34,197,94,0.5); border-radius:12px; padding:11px 18px; font-size:13px; font-weight:700;
    opacity:0; transition:all .35s; max-width:90%; text-align:center; color:#86efac; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.bad { border-color:rgba(248,113,113,0.5); color:#fca5a5; }

  /* ===== Hero rouge fluide (façon bouton) ===== */
  .hdr { position:relative; overflow:hidden; border-radius:18px; display:block;
    background:linear-gradient(135deg,#fb3b4e,#e11d48,#9f1239);
    padding:24px 18px; margin:14px 0 16px; box-shadow:0 10px 28px rgba(225,29,72,0.35); }
  .hdr-title { position:relative; z-index:3; flex:none; text-align:center; color:#fff;
    font-family:'Bebas Neue',sans-serif; font-size:27px; letter-spacing:1.5px; text-shadow:0 2px 10px rgba(0,0,0,0.45); }
  .obj-fluid { position:absolute; inset:-35%; z-index:1; pointer-events:none;
    background:
      radial-gradient(38% 48% at 28% 32%, rgba(255,255,255,0.55), transparent 62%),
      radial-gradient(46% 56% at 74% 68%, #ff3b54, transparent 60%),
      radial-gradient(52% 60% at 60% 22%, #c01233, transparent 64%),
      radial-gradient(44% 54% at 32% 78%, #ff7a7a, transparent 60%);
    filter:blur(16px) saturate(1.1); will-change:transform; animation:objFluid 9s ease-in-out infinite alternate; }
  @keyframes objFluid {
    0%   { transform:translate(-4%,-3%) rotate(0deg)  scale(1.12); }
    50%  { transform:translate(5%,3%)   rotate(9deg)  scale(1.22); }
    100% { transform:translate(-3%,4%)  rotate(-6deg) scale(1.14); }
  }
  @media (prefers-reduced-motion: reduce){ .obj-fluid{ animation:none; } }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="wrap">
    <div class="hdr">
      <div class="obj-fluid"></div>
      <div class="hdr-title">Objectifs du jour</div>
    </div>
    <div class="mick">
      <div class="mick-ava">📋</div>
      <div class="mick-bubble" id="mickSay">Mickaël : « Voici ta liste du jour. Remplis-les en jouant, reviens les <b>réclamer</b> ! »</div>
    </div>
    <div class="prog">
      <div class="prog-top"><span class="prog-lbl">Progression</span><span class="prog-val" id="progVal">0/3</span></div>
      <div class="prog-track"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
    </div>
    <div id="list"><div class="loader">Mickaël prépare ta liste…</div></div>
    <div class="note">🔄 3 nouveaux objectifs chaque jour à minuit. N'oublie pas de réclamer tes récompenses avant !</div>
    <button class="back-bottom" onclick="window.location.href='game.html'">← Retour au jeu</button>
  </div>
  <div class="toast" id="toast"></div>

<script>
  const SB_URL = 'https://drtsuhnbclhmgfjiykap.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
  const sb = supabase.createClient(SB_URL, SB_KEY);

  // Pool de modèles d'objectifs (hors "connexion" qui est toujours présent)
  const POOL = [
    { id:'tower',    title:"Bats ton record d'étages (Tower)", icon:'🏗️', mode:'beat',     metric:'tower_floor',    reward:{type:'money',    amount:6000} },
    { id:'pointeau', title:'Bats ton record de score (Pointeau)', icon:'📋', mode:'beat',  metric:'pointeau_score', reward:{type:'money',    amount:6000} },
    { id:'combo',    title:'Bats ton combo max (Pointeau)',   icon:'🔥', mode:'beat',     metric:'pointeau_combo', reward:{type:'trophies', amount:1} },
    { id:'level',    title:'Gagne un niveau',                 icon:'⭐', mode:'inc',      metric:'level', amount:1, reward:{type:'diamonds', amount:3} },
    { id:'bourse',   title:'Réalise un profit à la Bourse',   icon:'📈', mode:'increase', metric:'bourse_profit',  reward:{type:'money',    amount:8000} },
  ];
  const LOGIN = { id:'login', title:'Connexion du jour', icon:'🔥', mode:'free', reward:{type:'diamonds', amount:2} };

  let currentUser=null, todayStr='', objectives=[];
  let money=0, level=1, diamonds=0, trophies=0, records={}, bourseProfit=0;

  const fmt=n=>Math.round(n).toLocaleString('fr-FR');
  const rewardText=r=> r.type==='money' ? `+${fmt(r.amount)}€` : r.type==='diamonds' ? `+${r.amount} 💎` : `+${r.amount} 🏆`;

  async function init(){
    const { data:{ session } } = await sb.auth.getSession();
    if(!session){ window.location.href='index.html'; return; }
    currentUser=session.user;
    todayStr = new Date().toISOString().split('T')[0];
    const { data:gs } = await sb.from('game_stats').select('money,level,records,bourse_profit,diamonds,trophies').eq('user_id',currentUser.id).maybeSingle();
    money=gs?.money||0; level=gs?.level||1; bourseProfit=gs?.bourse_profit||0;
    records=(gs?.records&&typeof gs.records==='object')?gs.records:{};
    diamonds=gs?.diamonds||0; trophies=gs?.trophies||0;

    const { data:row } = await sb.from('daily_objectives').select('objectives').eq('user_id',currentUser.id).eq('date',todayStr).maybeSingle();
    if(row?.objectives && Array.isArray(row.objectives) && row.objectives.length){ objectives=row.objectives; }
    else { objectives=generate(); await saveObjectives(); }
    refreshCompleted(true);
    render();
  }

  function curMetric(m){
    if(m==='level') return level;
    if(m==='bourse_profit') return bourseProfit;
    return records[m]||0;
  }
  function isMet(o){
    if(o.mode==='free') return true;
    const cur=curMetric(o.metric);
    if(o.mode==='inc') return (cur-(o.baseline||0))>=(o.amount||1);
    return cur > (o.baseline||0); // beat / increase
  }

  function generate(){
    const pool=[...POOL].sort(()=>Math.random()-0.5).slice(0,2);
    const chosen=[LOGIN, ...pool];
    return chosen.map(t=>({
      id:t.id, title:t.title, icon:t.icon, mode:t.mode, metric:t.metric||null, amount:t.amount||null,
      baseline: t.mode==='free'?0:curMetric(t.metric), reward:t.reward, completed:t.mode==='free', claimed:false
    }));
  }

  function refreshCompleted(silentSave){
    let changed=false;
    objectives.forEach(o=>{ const m=isMet(o); if(m && !o.completed){ o.completed=true; changed=true; } });
    if(changed && silentSave) saveObjectives();
  }

  function render(){
    const claimedOrDone = objectives.filter(o=>o.completed||o.claimed).length;
    document.getElementById('progVal').textContent = `${claimedOrDone}/3`;
    document.getElementById('progFill').style.width = Math.round(claimedOrDone/3*100)+'%';
    const allDone = objectives.every(o=>o.claimed);
    document.getElementById('mickSay').innerHTML = allDone
      ? 'Mickaël : « Tout est réclamé. Beau boulot ! Reviens demain. »'
      : 'Mickaël : « Voici ta liste du jour. Remplis-les en jouant, reviens les <b>réclamer</b> ! »';

    document.getElementById('list').innerHTML = objectives.map((o,i)=>{
      const met=isMet(o);
      let act;
      if(o.claimed) act=`<div class="badge-st st-claimed">✓ Réclamé</div>`;
      else if(met) act=`<button class="claim-btn" onclick="claim(${i})">Réclamer</button>`;
      else act=`<div class="badge-st st-todo">À faire</div>`;
      return `<div class="obj ${met?'done':''} ${o.claimed?'claimed':''}">
        <div class="obj-ic">${o.icon}</div>
        <div class="obj-mid">
          <div class="obj-title">${o.title}</div>
          <div class="obj-hint">${hint(o,met)}</div>
          <div class="obj-reward">🎁 ${rewardText(o.reward)}</div>
        </div>
        <div class="obj-act">${act}</div>
      </div>`;
    }).join('');
  }

  function hint(o,met){
    if(o.mode==='free') return met?'Te voilà connecté ✓':'';
    if(o.claimed) return 'Récompense empochée';
    if(met) return 'Objectif atteint — réclame ta récompense !';
    if(o.mode==='inc' && o.metric==='level') return `Niveau ${o.baseline} → atteins le niveau ${o.baseline+1}`;
    if(o.metric==='tower_floor') return `Record actuel : ${o.baseline} étages — fais mieux aujourd'hui`;
    if(o.metric==='pointeau_score') return `Record actuel : ${o.baseline} pts — fais mieux`;
    if(o.metric==='pointeau_combo') return `Combo max : ×${o.baseline} — dépasse-le`;
    if(o.metric==='bourse_profit') return 'Encaisse un gain à la Bourse';
    return '';
  }

  async function claim(i){
    const o=objectives[i];
    if(o.claimed || !isMet(o)) return;
    o.claimed=true; o.completed=true;
    const r=o.reward;
    try {
      if(r.type==='money'){ money+=r.amount; await sb.from('game_stats').update({ money:Math.round(money) }).eq('user_id',currentUser.id); }
      else if(r.type==='diamonds'){ diamonds+=r.amount; await sb.from('game_stats').update({ diamonds }).eq('user_id',currentUser.id); }
      else if(r.type==='trophies'){ trophies+=r.amount; await sb.from('game_stats').update({ trophies }).eq('user_id',currentUser.id); }
      await saveObjectives();
    } catch(e){ console.log('claim:',e); }
    render();
    showToast(`🎁 Récompense empochée : ${rewardText(r)}`, false);
  }

  async function saveObjectives(){
    try { await sb.from('daily_objectives').upsert({ user_id:currentUser.id, date:todayStr, objectives }, { onConflict:'user_id,date' }); }
    catch(e){ console.log('save obj:',e); }
  }

  let toastT=null;
  function showToast(msg,bad){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show'+(bad?' bad':''); clearTimeout(toastT); toastT=setTimeout(()=>t.className='toast'+(bad?' bad':''),2400); }

  init();
</script>
</body>
</html>
