<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Objectifs - Battle Dock</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }

    body {
      font-family:'Inter',sans-serif;
      background:#f2f2f7;
      min-height:100vh;
      padding-bottom:40px;
    }

    /* HEADER */
    .header { background:white; border-bottom:1px solid #e5e7eb; padding:14px 16px; display:flex; align-items:center; gap:12px; box-shadow:0 1px 4px rgba(0,0,0,0.06); }
    .back-btn { background:#f3f4f6; border:none; border-radius:8px; padding:8px 12px; font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:1px; color:#6b7280; cursor:pointer; }
    .header-title { font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:2px; color:#1a1a1a; flex:1; }
    .header-reset { font-size:11px; color:#9ca3af; font-weight:600; }

    /* HERO */
    .hero {
      background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);
      margin:16px; border-radius:18px; padding:20px;
      position:relative; overflow:hidden;
      box-shadow:0 8px 30px rgba(0,0,0,0.2);
    }
    .hero-bg {
      position:absolute; inset:0; pointer-events:none;
    }
    .hero-star { position:absolute; border-radius:50%; background:white; animation:hsTwinkle ease-in-out infinite; }
    @keyframes hsTwinkle { 0%,100%{opacity:0.6} 50%{opacity:0.1} }

    .hero-title { font-family:'Bebas Neue',sans-serif; font-size:28px; letter-spacing:2px; color:white; position:relative; z-index:1; }
    .hero-sub { font-size:12px; color:rgba(255,255,255,0.5); margin-top:2px; position:relative; z-index:1; margin-bottom:16px; }

    .hero-progress { position:relative; z-index:1; }
    .hp-label { display:flex; justify-content:space-between; font-size:11px; color:rgba(255,255,255,0.5); font-weight:700; margin-bottom:6px; }
    .hp-track { height:6px; background:rgba(255,255,255,0.1); border-radius:3px; overflow:hidden; }
    .hp-fill  { height:100%; background:linear-gradient(90deg,#f59e0b,#fbbf24,#fcd34d); border-radius:3px; transition:width 0.6s ease; box-shadow:0 0 8px rgba(251,191,36,0.5); }

    .hero-rewards {
      display:flex; gap:8px; margin-top:14px; position:relative; z-index:1;
    }
    .hr-pill {
      background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.15);
      border-radius:20px; padding:4px 12px;
      font-size:11px; font-weight:700; color:rgba(255,255,255,0.8);
      display:flex; align-items:center; gap:5px;
    }

    /* COUNTDOWN */
    .countdown-bar {
      background:white; border-bottom:1px solid #e5e7eb;
      padding:8px 16px; display:flex; align-items:center; gap:8px;
      font-size:11px; color:#9ca3af; font-weight:600;
    }
    .cd-dot { width:6px; height:6px; background:#ef4444; border-radius:50%; animation:cdPulse 1s ease-in-out infinite; }
    @keyframes cdPulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .cd-time { font-family:'Bebas Neue',sans-serif; font-size:14px; color:#1a1a1a; letter-spacing:1px; }

    /* CONTAINER */
    .container { padding:16px; }

    /* OBJECTIF CARD */
    .obj-card {
      background:white; border:1px solid #e5e7eb; border-radius:16px;
      padding:16px; margin-bottom:10px;
      box-shadow:0 1px 4px rgba(0,0,0,0.05);
      transition:all 0.2s;
      position:relative; overflow:hidden;
    }
    .obj-card.completed {
      border-color:rgba(22,163,74,0.3);
      background:rgba(22,163,74,0.03);
    }
    .obj-card.claimed {
      border-color:#e5e7eb;
      opacity:0.6;
    }

    /* Barre de couleur gauche */
    .obj-card::before {
      content:''; position:absolute; left:0; top:0; bottom:0;
      width:4px; border-radius:4px 0 0 4px;
    }
    .obj-card.casino::before  { background:linear-gradient(180deg,#ef4444,#dc2626); }
    .obj-card.bourse::before  { background:linear-gradient(180deg,#16a34a,#15803d); }
    .obj-card.connexion::before { background:linear-gradient(180deg,#3b82f6,#2563eb); }
    .obj-card.argent::before  { background:linear-gradient(180deg,#f59e0b,#d97706); }

    .obj-top { display:flex; align-items:flex-start; gap:12px; margin-bottom:12px; }
    .obj-icon {
      width:44px; height:44px; border-radius:12px;
      display:flex; align-items:center; justify-content:center;
      font-size:22px; flex-shrink:0;
    }
    .obj-card.casino  .obj-icon { background:rgba(239,68,68,0.1); }
    .obj-card.bourse  .obj-icon { background:rgba(22,163,74,0.1); }
    .obj-card.connexion .obj-icon { background:rgba(59,130,246,0.1); }
    .obj-card.argent  .obj-icon { background:rgba(245,158,11,0.1); }

    .obj-info { flex:1; }
    .obj-title { font-weight:700; font-size:14px; color:#1a1a1a; margin-bottom:2px; }
    .obj-desc  { font-size:12px; color:#9ca3af; line-height:1.4; }

    .obj-reward {
      text-align:right; flex-shrink:0;
    }
    .obj-reward-val { font-family:'Bebas Neue',sans-serif; font-size:16px; color:#1a1a1a; letter-spacing:0.5px; }
    .obj-reward-lbl { font-size:9px; color:#9ca3af; text-transform:uppercase; letter-spacing:0.5px; font-weight:700; }

    /* PROGRESS BAR */
    .obj-progress { margin-bottom:12px; }
    .op-label { display:flex; justify-content:space-between; font-size:11px; color:#9ca3af; font-weight:600; margin-bottom:4px; }
    .op-label span:last-child { color:#1a1a1a; }
    .op-track { height:5px; background:#f3f4f6; border-radius:3px; overflow:hidden; }
    .op-fill  { height:100%; border-radius:3px; transition:width 0.4s ease; }
    .obj-card.casino  .op-fill { background:linear-gradient(90deg,#ef4444,#f87171); }
    .obj-card.bourse  .op-fill { background:linear-gradient(90deg,#16a34a,#4ade80); }
    .obj-card.connexion .op-fill { background:linear-gradient(90deg,#3b82f6,#60a5fa); }
    .obj-card.argent  .op-fill { background:linear-gradient(90deg,#f59e0b,#fbbf24); }

    /* BOUTON RÉCLAMER */
    .obj-btn {
      width:100%; padding:11px; border:none; border-radius:10px;
      font-family:'Bebas Neue',sans-serif; font-size:15px; letter-spacing:1px;
      cursor:pointer; transition:all 0.2s;
    }
    .obj-btn.claimable { background:#1a1a1a; color:white; }
    .obj-btn.claimable:active { transform:scale(0.98); }
    .obj-btn.progress  { background:#f3f4f6; color:#9ca3af; cursor:default; }
    .obj-btn.done      { background:rgba(22,163,74,0.1); color:#16a34a; cursor:default; }

    /* CHECK OVERLAY */
    .obj-check {
      position:absolute; top:12px; right:12px;
      width:24px; height:24px; border-radius:50%;
      background:#16a34a; color:white;
      display:flex; align-items:center; justify-content:center;
      font-size:12px; font-weight:700;
    }

    /* TOUS COMPLÉTÉS */
    .all-done {
      background:linear-gradient(135deg,rgba(22,163,74,0.1),rgba(16,185,129,0.05));
      border:1px solid rgba(22,163,74,0.3);
      border-radius:16px; padding:24px; text-align:center; margin-bottom:10px;
    }
    .all-done-icon  { font-size:48px; margin-bottom:10px; }
    .all-done-title { font-family:'Bebas Neue',sans-serif; font-size:24px; color:#16a34a; letter-spacing:1px; margin-bottom:4px; }
    .all-done-sub   { font-size:13px; color:#6b7280; }

    /* TOAST */
    .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#1a1a1a; color:white; padding:12px 20px; border-radius:20px; font-size:13px; font-weight:600; z-index:100; opacity:0; transition:opacity 0.3s; white-space:nowrap; }
    .toast.show { opacity:1; }
    .toast.success { background:#16a34a; }
    .toast.xp      { background:#6366f1; }
    .toast.money   { background:#f59e0b; }
  </style>
</head>
<body>

  <div class="header">
    <button class="back-btn" onclick="window.location.href='game.html'">← Retour</button>
    <div class="header-title">📅 Objectifs</div>
    <div class="header-reset" id="headerReset">Reset à minuit</div>
  </div>

  <div class="countdown-bar">
    <div class="cd-dot"></div>
    <span>Nouveaux objectifs dans</span>
    <div class="cd-time" id="countdownTime">--:--:--</div>
  </div>

  <div class="container">

    <!-- HERO -->
    <div class="hero" id="heroCard">
      <div class="hero-bg" id="heroBg"></div>
      <div class="hero-title">Objectifs du jour</div>
      <div class="hero-sub" id="heroDate">Chargement...</div>
      <div class="hero-progress">
        <div class="hp-label">
          <span id="heroCompleted">0/3 complétés</span>
          <span id="heroPct">0%</span>
        </div>
        <div class="hp-track"><div class="hp-fill" id="heroFill" style="width:0%"></div></div>
      </div>
      <div class="hero-rewards" id="heroRewards"></div>
    </div>

    <!-- OBJECTIFS -->
    <div id="objContainer"></div>

  </div>

  <div class="toast" id="toast"></div>

  <script>
    const SB_URL = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const sb = createClient(SB_URL, SB_KEY);

    let currentUser = null;
    let userMoney = 0, userXp = 0, userLevel = 1;
    let todayObjectives = [];

    // ===== TEMPLATES =====
    const TEMPLATES = [
      // Casino
      { type:'casino', icon:'🎰', title:'Bonne mise',      desc:'Mise au moins 500€ au casino',       target:500,  metric:'casino_bet',    reward:{ xp:300 } },
      { type:'casino', icon:'🃏', title:'Gagne au Blackjack', desc:'Remporte une partie de Blackjack', target:1,    metric:'blackjack_win', reward:{ xp:400, money:200 } },
      { type:'casino', icon:'🎡', title:'Roulettiste',     desc:'Joue 3 fois à la Roulette',          target:3,    metric:'roulette_play', reward:{ xp:250 } },
      { type:'casino', icon:'💥', title:'Survivant',       desc:'Cash out au Crash avant 2.0x',       target:1,    metric:'crash_cashout',  reward:{ xp:350, money:300 } },
      { type:'casino', icon:'🎰', title:'Jackpot hunter',  desc:'Mise 1000€ en une partie',           target:1000, metric:'casino_big_bet', reward:{ xp:500, money:500 } },
      // Bourse
      { type:'bourse', icon:'📈', title:'Investisseur',    desc:'Achète 3 actions en bourse',         target:3,    metric:'stock_buy',     reward:{ xp:300, money:100 } },
      { type:'bourse', icon:'💹', title:'Trader du jour',  desc:'Vends des actions avec un bénéfice', target:1,    metric:'stock_sell',    reward:{ xp:400, money:400 } },
      { type:'bourse', icon:'📊', title:'Portefeuille',    desc:'Possède 10 actions au total',        target:10,   metric:'stock_hold',    reward:{ xp:350 } },
      // Connexion
      { type:'connexion', icon:'🔥', title:'Régulier',     desc:'Connecte-toi aujourd\'hui',          target:1,    metric:'login',         reward:{ xp:100 } },
      { type:'connexion', icon:'⭐', title:'Actif du jour', desc:'Passe 5 minutes sur le jeu',        target:5,    metric:'playtime',      reward:{ xp:200, money:100 } },
      // Argent
      { type:'argent', icon:'💰', title:'Gros gain',       desc:'Gagne plus de 1000€ en une partie',  target:1000, metric:'big_win',       reward:{ xp:600, money:500 } },
      { type:'argent', icon:'🏦', title:'Épargnant',       desc:'Accumule 5000€ sur ton compte',      target:5000, metric:'total_money',   reward:{ xp:400 } },
    ];

    function pickObjectives() {
      // Seed basé sur la date pour que les objectifs soient les mêmes toute la journée mais changent chaque jour
      const today = new Date().toISOString().split('T')[0];
      const seed = today.split('-').reduce((acc, v) => acc + parseInt(v), 0);

      const shuffled = [...TEMPLATES].sort(() => {
        const x = Math.sin(seed + TEMPLATES.indexOf(TEMPLATES[0])) * 10000;
        return (x - Math.floor(x)) - 0.5;
      });

      // Prendre 1 de chaque type si possible
      const types = ['casino', 'bourse', 'connexion', 'argent'];
      const picked = [];
      types.forEach(t => {
        const found = shuffled.find(tm => tm.type === t && !picked.includes(tm));
        if(found && picked.length < 3) picked.push(found);
      });
      while(picked.length < 3) {
        const extra = shuffled.find(tm => !picked.includes(tm));
        if(extra) picked.push(extra);
        else break;
      }
      return picked.slice(0,3);
    }

    async function getProgress(metric) {
      const today = new Date().toISOString().split('T')[0];

      switch(metric) {
        case 'login':       return 1; // Connecté = fait
        case 'total_money': return userMoney;
        case 'playtime': {
          // 1 = déjà sur la page depuis > 5 min (check simplifié)
          return Math.floor((Date.now() - window._startTime) / 60000);
        }
        case 'casino_bet':
        case 'casino_big_bet': {
          const { data } = await sb.from('casino_wins').select('amount_bet').eq('user_id', currentUser.id).gte('created_at', today+'T00:00:00');
          const total = (data||[]).reduce((s,w) => s+(w.amount_bet||0), 0);
          return metric==='casino_big_bet' ? Math.max(...(data||[]).map(w=>w.amount_bet||0), 0) : total;
        }
        case 'blackjack_win': {
          const { data } = await sb.from('casino_wins').select('id').eq('user_id', currentUser.id).eq('game_name','Blackjack').gt('amount_won',0).gte('created_at', today+'T00:00:00');
          return (data||[]).length;
        }
        case 'roulette_play': {
          const { data } = await sb.from('casino_wins').select('id').eq('user_id', currentUser.id).eq('game_name','Roulette').gte('created_at', today+'T00:00:00');
          return (data||[]).length;
        }
        case 'crash_cashout': {
          const { data } = await sb.from('casino_wins').select('id').eq('user_id', currentUser.id).eq('game_name','Crash').gt('amount_won',0).gte('created_at', today+'T00:00:00');
          return (data||[]).length;
        }
        case 'big_win': {
          const { data } = await sb.from('casino_wins').select('amount_won').eq('user_id', currentUser.id).gte('created_at', today+'T00:00:00');
          return Math.max(...(data||[]).map(w=>w.amount_won||0), 0);
        }
        case 'stock_buy': {
          const { data } = await sb.from('stock_transactions').select('id').eq('user_id', currentUser.id).eq('type','buy').gte('created_at', today+'T00:00:00');
          return (data||[]).length;
        }
        case 'stock_sell': {
          const { data } = await sb.from('stock_transactions').select('id,price,avg_buy_price').eq('user_id', currentUser.id).eq('type','sell').gte('created_at', today+'T00:00:00');
          return (data||[]).length;
        }
        case 'stock_hold': {
          const { data } = await sb.from('stock_portfolio').select('quantity').eq('user_id', currentUser.id);
          return (data||[]).reduce((s,p) => s+(p.quantity||0), 0);
        }
        default: return 0;
      }
    }

    async function loadUserData() {
      const { data } = await sb.from('game_stats').select('money,xp,level').eq('user_id', currentUser.id).maybeSingle();
      userMoney = data?.money || 0;
      userXp    = data?.xp   || 0;
      userLevel = data?.level || 1;
    }

    async function loadObjectives() {
      const today = new Date().toISOString().split('T')[0];
      const templates = pickObjectives();

      // Charger depuis BD
      const { data: existing } = await sb.from('daily_objectives').select('*').eq('user_id', currentUser.id).eq('date', today).maybeSingle();

      let objectives;
      if(existing) {
        objectives = existing.objectives;
      } else {
        // Créer les objectifs du jour
        objectives = templates.map(t => ({
          ...t,
          progress: 0,
          completed: false,
          claimed: false
        }));
        await sb.from('daily_objectives').insert({ user_id: currentUser.id, date: today, objectives });
      }

      // Mettre à jour la progression
      for(let i=0; i<objectives.length; i++) {
        if(!objectives[i].claimed) {
          const prog = await getProgress(objectives[i].metric);
          objectives[i].progress = Math.min(prog, objectives[i].target);
          objectives[i].completed = objectives[i].progress >= objectives[i].target;
        }
      }

      // Sauvegarder progression
      await sb.from('daily_objectives').update({ objectives }).eq('user_id', currentUser.id).eq('date', today);

      todayObjectives = objectives;
      renderAll();
    }

    function renderAll() {
      const completed = todayObjectives.filter(o => o.completed || o.claimed).length;
      const claimed   = todayObjectives.filter(o => o.claimed).length;
      const pct = Math.round((completed/3)*100);

      // Hero
      const today = new Date().toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });
      document.getElementById('heroDate').textContent = today.charAt(0).toUpperCase() + today.slice(1);
      document.getElementById('heroCompleted').textContent = `${completed}/3 complétés`;
      document.getElementById('heroPct').textContent = pct + '%';
      document.getElementById('heroFill').style.width = pct + '%';

      // Récompenses totales
      let totalXp = 0, totalMoney = 0;
      todayObjectives.forEach(o => {
        if(o.reward.xp)    totalXp    += o.reward.xp;
        if(o.reward.money) totalMoney += o.reward.money;
      });
      document.getElementById('heroRewards').innerHTML = `
        <div class="hr-pill">⭐ ${totalXp.toLocaleString('fr-FR')} XP</div>
        ${totalMoney > 0 ? `<div class="hr-pill">💰 ${totalMoney.toLocaleString('fr-FR')}€</div>` : ''}
      `;

      // Container
      const container = document.getElementById('objContainer');

      if(claimed === 3) {
        container.innerHTML = `
          <div class="all-done">
            <div class="all-done-icon">🎉</div>
            <div class="all-done-title">Tout accompli !</div>
            <div class="all-done-sub">Reviens demain pour de nouveaux objectifs.</div>
          </div>`;
        return;
      }

      container.innerHTML = todayObjectives.map((obj, i) => {
        const prog = obj.progress || 0;
        const pct  = Math.min(100, Math.round((prog / obj.target) * 100));
        const isComplete = obj.completed || prog >= obj.target;
        const isClaimed  = obj.claimed;

        let btnClass = 'progress', btnText = 'En cours...';
        if(isClaimed)   { btnClass = 'done';      btnText = '✅ Récompense réclamée'; }
        else if(isComplete) { btnClass = 'claimable'; btnText = '🎁 Réclamer la récompense'; }

        const rewardStr = [
          obj.reward.xp    ? `⭐ +${obj.reward.xp} XP` : '',
          obj.reward.money ? `💰 +${obj.reward.money}€` : ''
        ].filter(Boolean).join('  ');

        return `
          <div class="obj-card ${obj.type} ${isComplete?'completed':''} ${isClaimed?'claimed':''}">
            ${isClaimed ? '<div class="obj-check">✓</div>' : ''}
            <div class="obj-top">
              <div class="obj-icon">${obj.icon}</div>
              <div class="obj-info">
                <div class="obj-title">${obj.title}</div>
                <div class="obj-desc">${obj.desc}</div>
              </div>
              <div class="obj-reward">
                ${obj.reward.xp    ? `<div class="obj-reward-val">+${obj.reward.xp}</div><div class="obj-reward-lbl">XP</div>` : ''}
                ${obj.reward.money ? `<div class="obj-reward-val" style="margin-top:4px">+${obj.reward.money}€</div><div class="obj-reward-lbl">Argent</div>` : ''}
              </div>
            </div>
            <div class="obj-progress">
              <div class="op-label">
                <span>Progression</span>
                <span>${prog.toLocaleString('fr-FR')} / ${obj.target.toLocaleString('fr-FR')}</span>
              </div>
              <div class="op-track"><div class="op-fill" style="width:${pct}%"></div></div>
            </div>
            <button class="obj-btn ${btnClass}" onclick="${isComplete && !isClaimed ? `claimReward(${i})` : ''}">${btnText}</button>
          </div>`;
      }).join('');
    }

    async function claimReward(idx) {
      const obj = todayObjectives[idx];
      if(!obj || obj.claimed || !obj.completed) return;

      // Donner récompenses
      const updates = {};
      if(obj.reward.xp)    updates.xp    = (userXp    || 0) + obj.reward.xp;
      if(obj.reward.money) updates.money  = (userMoney || 0) + obj.reward.money;

      await sb.from('game_stats').update(updates).eq('user_id', currentUser.id);
      if(obj.reward.xp)    userXp    = updates.xp;
      if(obj.reward.money) userMoney = updates.money;

      // Marquer comme réclamé
      todayObjectives[idx].claimed = true;
      const today = new Date().toISOString().split('T')[0];
      await sb.from('daily_objectives').update({ objectives: todayObjectives }).eq('user_id', currentUser.id).eq('date', today);

      renderAll();

      const msg = [
        obj.reward.xp    ? `+${obj.reward.xp} XP` : '',
        obj.reward.money ? `+${obj.reward.money}€` : ''
      ].filter(Boolean).join(' · ');
      showToast('🎁 ' + msg, 'success');
    }

    // COUNTDOWN
    function startCountdown() {
      function tick() {
        const now  = new Date();
        const next = new Date();
        next.setHours(24,0,0,0);
        const d = Math.floor((next-now)/1000);
        const h = Math.floor(d/3600), m = Math.floor((d%3600)/60), s = d%60;
        const el = document.getElementById('countdownTime');
        if(el) el.textContent = String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
        setTimeout(tick, 1000);
      }
      tick();
    }

    // ÉTOILES HERO
    function initHeroStars() {
      const bg = document.getElementById('heroBg');
      for(let i=0;i<20;i++) {
        const s = document.createElement('div');
        s.className = 'hero-star';
        const sz = 0.5 + Math.random()*2;
        s.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-duration:${2+Math.random()*4}s;animation-delay:${Math.random()*4}s;`;
        bg.appendChild(s);
      }
    }

    function showToast(msg, type='') {
      const t = document.getElementById('toast');
      t.textContent = msg; t.className = 'toast show ' + type;
      setTimeout(() => t.className = 'toast', 2800);
    }

    async function init() {
      window._startTime = Date.now();
      const { data: { session } } = await sb.auth.getSession();
      if(!session) { window.location.href='index.html'; return; }
      currentUser = session.user;
      await loadUserData();
      await loadObjectives();
      startCountdown();
      initHeroStars();
    }

    init();
  </script>
</body>
</html>
