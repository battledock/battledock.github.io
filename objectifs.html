<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Objectifs - Battle Dock</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }

    body {
      font-family:'Inter',sans-serif;
      background:#f2f2f7;
      min-height:100vh;
      padding-bottom:40px;
    }

    /* HEADER */
    .header {
      background:white; border-bottom:1px solid #e5e7eb;
      padding:14px 16px; display:flex; align-items:center; gap:12px;
      box-shadow:0 1px 4px rgba(0,0,0,0.06);
    }
    .back-btn { background:#f3f4f6; border:none; border-radius:8px; padding:8px 12px; font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:1px; color:#6b7280; cursor:pointer; }
    .header-title { font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:2px; color:#1a1a1a; flex:1; }

    /* HERO CALENDRIER */
    .hero {
      margin:16px;
      background:white;
      border:1px solid #e5e7eb;
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 2px 12px rgba(0,0,0,0.08);
      display:flex;
    }

    /* Bande gauche rouge */
    .hero-left {
      width:90px; flex-shrink:0;
      background:linear-gradient(180deg,#ef4444,#dc2626);
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      padding:16px 8px;
      position:relative; overflow:hidden;
    }
    /* Petites étoiles sur fond rouge */
    .hero-left::before {
      content:''; position:absolute; inset:0;
      background:radial-gradient(circle at 30% 20%,rgba(255,255,255,0.15),transparent 60%);
    }
    .cal-num {
      font-family:'Bebas Neue',sans-serif;
      font-size:52px; color:white; line-height:1; letter-spacing:0;
      position:relative; z-index:1;
      text-shadow:0 2px 8px rgba(0,0,0,0.2);
    }
    .cal-day {
      font-size:11px; font-weight:700; color:rgba(255,255,255,0.85);
      text-transform:uppercase; letter-spacing:2px;
      position:relative; z-index:1;
    }
    .cal-month {
      font-size:10px; color:rgba(255,255,255,0.6);
      text-transform:uppercase; letter-spacing:1px;
      margin-top:2px; position:relative; z-index:1;
    }

    /* Droite hero */
    .hero-right {
      flex:1; padding:16px;
      display:flex; flex-direction:column; justify-content:space-between;
    }
    .hero-top-row { display:flex; justify-content:space-between; align-items:flex-start; }
    .hero-title { font-family:'Bebas Neue',sans-serif; font-size:19px; letter-spacing:1.5px; color:#1a1a1a; }
    .hero-subtitle { font-size:11px; color:#9ca3af; font-weight:600; margin-top:2px; }
    .hero-badge {
      background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.2);
      border-radius:20px; padding:4px 10px;
      font-size:10px; font-weight:700; color:#ef4444;
      flex-shrink:0;
    }
    .hero-badge.done { background:rgba(22,163,74,0.1); border-color:rgba(22,163,74,0.2); color:#16a34a; }

    /* Mini objectifs dans hero */
    .hero-objs { display:flex; flex-direction:column; gap:5px; margin:10px 0; }
    .hero-obj { display:flex; align-items:center; gap:8px; }
    .hero-obj-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
    .hero-obj-dot.done { background:#16a34a; }
    .hero-obj-dot.todo { background:#e5e7eb; border:1px solid #d1d5db; }
    .hero-obj-text { font-size:12px; color:#6b7280; }
    .hero-obj-text.done { color:#16a34a; font-weight:600; text-decoration:line-through; opacity:0.7; }

    /* Barre progression */
    .hero-prog { }
    .hp-row { display:flex; justify-content:space-between; font-size:10px; color:#9ca3af; font-weight:700; margin-bottom:5px; }
    .hp-track { height:5px; background:#f3f4f6; border-radius:3px; overflow:hidden; }
    .hp-fill  { height:100%; background:linear-gradient(90deg,#ef4444,#f87171); border-radius:3px; transition:width 0.6s ease; }

    /* COUNTDOWN */
    .countdown-bar {
      background:white; border-bottom:1px solid #e5e7eb;
      padding:8px 16px; display:flex; align-items:center; gap:8px;
      font-size:11px; color:#9ca3af; font-weight:600;
    }
    .cd-dot { width:6px; height:6px; background:#ef4444; border-radius:50%; animation:cdPulse 1s ease-in-out infinite; flex-shrink:0; }
    @keyframes cdPulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .cd-time { font-family:'Bebas Neue',sans-serif; font-size:14px; color:#1a1a1a; letter-spacing:1px; }

    /* CONTAINER */
    .container { padding:0 16px 16px; }

    .section-lbl { font-size:11px; font-weight:700; color:#9ca3af; text-transform:uppercase; letter-spacing:1px; margin:16px 0 8px 4px; }

    /* OBJECTIF CARD */
    .obj-card {
      background:white; border:1px solid #e5e7eb;
      border-radius:16px; padding:16px;
      margin-bottom:10px;
      box-shadow:0 1px 4px rgba(0,0,0,0.05);
      position:relative; overflow:hidden;
    }
    .obj-card::before {
      content:''; position:absolute; left:0; top:0; bottom:0;
      width:4px; border-radius:4px 0 0 4px;
    }
    .obj-card.casino::before    { background:linear-gradient(180deg,#ef4444,#dc2626); }
    .obj-card.bourse::before    { background:linear-gradient(180deg,#16a34a,#15803d); }
    .obj-card.connexion::before { background:linear-gradient(180deg,#3b82f6,#2563eb); }
    .obj-card.argent::before    { background:linear-gradient(180deg,#f59e0b,#d97706); }
    .obj-card.completed { border-color:rgba(22,163,74,0.25); background:rgba(22,163,74,0.02); }
    .obj-card.claimed   { opacity:0.55; }

    .obj-top { display:flex; align-items:flex-start; gap:12px; margin-bottom:12px; }
    .obj-icon { width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; }
    .obj-card.casino    .obj-icon { background:rgba(239,68,68,0.1); }
    .obj-card.bourse    .obj-icon { background:rgba(22,163,74,0.1); }
    .obj-card.connexion .obj-icon { background:rgba(59,130,246,0.1); }
    .obj-card.argent    .obj-icon { background:rgba(245,158,11,0.1); }
    .obj-info { flex:1; }
    .obj-title { font-weight:700; font-size:14px; color:#1a1a1a; margin-bottom:2px; }
    .obj-desc  { font-size:12px; color:#9ca3af; line-height:1.4; }
    .obj-reward { text-align:right; flex-shrink:0; }
    .obj-reward-val { font-family:'Bebas Neue',sans-serif; font-size:16px; color:#1a1a1a; letter-spacing:0.5px; }
    .obj-reward-lbl { font-size:9px; color:#9ca3af; text-transform:uppercase; font-weight:700; }

    .obj-prog { margin-bottom:12px; }
    .op-row   { display:flex; justify-content:space-between; font-size:11px; color:#9ca3af; font-weight:600; margin-bottom:4px; }
    .op-row span:last-child { color:#1a1a1a; font-weight:700; }
    .op-track { height:5px; background:#f3f4f6; border-radius:3px; overflow:hidden; }
    .op-fill  { height:100%; border-radius:3px; transition:width 0.4s ease; }
    .obj-card.casino    .op-fill { background:linear-gradient(90deg,#ef4444,#f87171); }
    .obj-card.bourse    .op-fill { background:linear-gradient(90deg,#16a34a,#4ade80); }
    .obj-card.connexion .op-fill { background:linear-gradient(90deg,#3b82f6,#60a5fa); }
    .obj-card.argent    .op-fill { background:linear-gradient(90deg,#f59e0b,#fbbf24); }

    .obj-btn {
      width:100%; padding:11px; border:none; border-radius:10px;
      font-family:'Bebas Neue',sans-serif; font-size:15px; letter-spacing:1px;
      cursor:pointer; transition:all 0.2s;
    }
    .obj-btn.claimable { background:#1a1a1a; color:white; }
    .obj-btn.claimable:active { transform:scale(0.98); }
    .obj-btn.progress  { background:#f3f4f6; color:#9ca3af; cursor:default; }
    .obj-btn.done      { background:rgba(22,163,74,0.1); color:#16a34a; cursor:default; }

    .obj-check { position:absolute; top:12px; right:12px; width:22px; height:22px; border-radius:50%; background:#16a34a; color:white; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; }

    /* TOUT COMPLÉTÉ */
    .all-done {
      background:white; border:1px solid rgba(22,163,74,0.2);
      border-radius:16px; padding:32px 20px; text-align:center;
    }
    .all-done-icon  { font-size:52px; margin-bottom:12px; }
    .all-done-title { font-family:'Bebas Neue',sans-serif; font-size:26px; color:#16a34a; letter-spacing:1px; margin-bottom:6px; }
    .all-done-sub   { font-size:13px; color:#9ca3af; }

    /* TOAST */
    .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#1a1a1a; color:white; padding:12px 20px; border-radius:20px; font-size:13px; font-weight:600; z-index:100; opacity:0; transition:opacity 0.3s; white-space:nowrap; }
    .toast.show { opacity:1; }
    .toast.success { background:#16a34a; }
  </style>
</head>
<body>

  <div class="header">
    <button class="back-btn" onclick="window.location.href='game.html'">← Retour</button>
    <div class="header-title">📅 Objectifs</div>
  </div>

  <div class="countdown-bar">
    <div class="cd-dot"></div>
    <span>Nouveaux objectifs dans</span>
    <div class="cd-time" id="countdownTime">--:--:--</div>
  </div>

  <!-- HERO CALENDRIER -->
  <div class="hero">
    <div class="hero-left">
      <div class="cal-num"  id="calNum">--</div>
      <div class="cal-day"  id="calDay">---</div>
      <div class="cal-month" id="calMonth">---</div>
    </div>
    <div class="hero-right">
      <div class="hero-top-row">
        <div>
          <div class="hero-title">Objectifs du jour</div>
          <div class="hero-subtitle" id="heroSubtitle">Chargement...</div>
        </div>
        <div class="hero-badge" id="heroBadge">0/3</div>
      </div>
      <div class="hero-objs" id="heroObjs"></div>
      <div class="hero-prog">
        <div class="hp-row">
          <span id="hpLabel">0/3 complétés</span>
          <span id="hpPct">0%</span>
        </div>
        <div class="hp-track"><div class="hp-fill" id="hpFill" style="width:0%"></div></div>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="section-lbl">Mes objectifs</div>
    <div id="objContainer"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const SB_URL = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const sb = createClient(SB_URL, SB_KEY);

    let currentUser = null;
    let userMoney = 0, userXp = 0;
    let todayObjectives = [];
    window._startTime = Date.now();

    const DAYS   = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
    const MONTHS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];

    const TEMPLATES = [
      { type:'casino',    icon:'🎰', title:'Bonne mise',        desc:'Mise au moins 500€ au casino',        target:500,  metric:'casino_bet',    reward:{ xp:300 } },
      { type:'casino',    icon:'🃏', title:'Gagne au Blackjack',desc:'Remporte une partie de Blackjack',    target:1,    metric:'blackjack_win', reward:{ xp:400, money:200 } },
      { type:'casino',    icon:'🎡', title:'Roulettiste',       desc:'Joue 3 fois à la Roulette',           target:3,    metric:'roulette_play', reward:{ xp:250 } },
      { type:'casino',    icon:'💥', title:'Survivant',         desc:'Cash out au Crash avant 2.0x',        target:1,    metric:'crash_cashout', reward:{ xp:350, money:300 } },
      { type:'casino',    icon:'🎰', title:'Jackpot Hunter',    desc:'Mise 1000€ en une partie',            target:1000, metric:'casino_big_bet',reward:{ xp:500, money:500 } },
      { type:'bourse',    icon:'📈', title:'Investisseur',      desc:'Achète 3 actions en bourse',          target:3,    metric:'stock_buy',     reward:{ xp:300, money:100 } },
      { type:'bourse',    icon:'💹', title:'Trader du jour',    desc:'Vends des actions avec bénéfice',     target:1,    metric:'stock_sell',    reward:{ xp:400, money:400 } },
      { type:'bourse',    icon:'📊', title:'Portefeuille',      desc:'Possède 10 actions au total',         target:10,   metric:'stock_hold',    reward:{ xp:350 } },
      { type:'connexion', icon:'🔥', title:'Présent !',         desc:'Connecte-toi aujourd\'hui',           target:1,    metric:'login',         reward:{ xp:100 } },
      { type:'connexion', icon:'⭐', title:'Actif du jour',     desc:'Passe 5 minutes sur le jeu',          target:5,    metric:'playtime',      reward:{ xp:200, money:100 } },
      { type:'argent',    icon:'💰', title:'Gros gain',         desc:'Gagne plus de 1000€ en une partie',   target:1000, metric:'big_win',       reward:{ xp:600, money:500 } },
      { type:'argent',    icon:'🏦', title:'Épargnant',         desc:'Accumule 5000€ sur ton compte',       target:5000, metric:'total_money',   reward:{ xp:400 } },
    ];

    function pickObjectives() {
      const today = new Date().toISOString().split('T')[0];
      const seed  = today.split('-').reduce((a,v,i) => a + parseInt(v)*(i+1), 0);
      const rng   = (n) => { const x = Math.sin(seed+n)*10000; return x-Math.floor(x); };
      const shuffled = [...TEMPLATES].map((t,i) => ({ t, r:rng(i) })).sort((a,b) => a.r-b.r).map(x=>x.t);
      const types = ['casino','bourse','connexion','argent'];
      const picked = [];
      types.forEach(type => {
        const found = shuffled.find(t => t.type===type && !picked.includes(t));
        if(found && picked.length<3) picked.push(found);
      });
      while(picked.length<3) { const e=shuffled.find(t=>!picked.includes(t)); if(e) picked.push(e); else break; }
      return picked.slice(0,3);
    }

    async function getProgress(metric) {
      const today = new Date().toISOString().split('T')[0];
      switch(metric) {
        case 'login':        return 1;
        case 'total_money':  return userMoney;
        case 'playtime':     return Math.floor((Date.now()-window._startTime)/60000);
        case 'casino_bet':
        case 'casino_big_bet': {
          const { data } = await sb.from('casino_wins').select('amount_bet').eq('user_id',currentUser.id).gte('created_at',today+'T00:00:00');
          const total = (data||[]).reduce((s,w)=>s+(w.amount_bet||0),0);
          return metric==='casino_big_bet' ? Math.max(...(data||[]).map(w=>w.amount_bet||0),0) : total;
        }
        case 'blackjack_win': {
          const { data } = await sb.from('casino_wins').select('id').eq('user_id',currentUser.id).eq('game_name','Blackjack').gt('amount_won',0).gte('created_at',today+'T00:00:00');
          return (data||[]).length;
        }
        case 'roulette_play': {
          const { data } = await sb.from('casino_wins').select('id').eq('user_id',currentUser.id).eq('game_name','Roulette').gte('created_at',today+'T00:00:00');
          return (data||[]).length;
        }
        case 'crash_cashout': {
          const { data } = await sb.from('casino_wins').select('id').eq('user_id',currentUser.id).eq('game_name','Crash').gt('amount_won',0).gte('created_at',today+'T00:00:00');
          return (data||[]).length;
        }
        case 'big_win': {
          const { data } = await sb.from('casino_wins').select('amount_won').eq('user_id',currentUser.id).gte('created_at',today+'T00:00:00');
          return Math.max(...(data||[]).map(w=>w.amount_won||0),0);
        }
        case 'stock_buy': {
          const { data } = await sb.from('stock_transactions').select('id').eq('user_id',currentUser.id).eq('type','buy').gte('created_at',today+'T00:00:00');
          return (data||[]).length;
        }
        case 'stock_sell': {
          const { data } = await sb.from('stock_transactions').select('id').eq('user_id',currentUser.id).eq('type','sell').gte('created_at',today+'T00:00:00');
          return (data||[]).length;
        }
        case 'stock_hold': {
          const { data } = await sb.from('stock_portfolio').select('quantity').eq('user_id',currentUser.id);
          return (data||[]).reduce((s,p)=>s+(p.quantity||0),0);
        }
        default: return 0;
      }
    }

    async function loadObjectives() {
      const today = new Date().toISOString().split('T')[0];
      const templates = pickObjectives();

      const { data: existing } = await sb.from('daily_objectives').select('*').eq('user_id',currentUser.id).eq('date',today).maybeSingle();

      let objectives;
      if(existing) {
        objectives = existing.objectives;
      } else {
        objectives = templates.map(t => ({ ...t, progress:0, completed:false, claimed:false }));
        await sb.from('daily_objectives').insert({ user_id:currentUser.id, date:today, objectives });
      }

      for(let i=0;i<objectives.length;i++) {
        if(!objectives[i].claimed) {
          const prog = await getProgress(objectives[i].metric);
          objectives[i].progress  = Math.min(prog, objectives[i].target);
          objectives[i].completed = objectives[i].progress >= objectives[i].target;
        }
      }

      await sb.from('daily_objectives').update({ objectives }).eq('user_id',currentUser.id).eq('date',today);
      todayObjectives = objectives;
      renderAll();
    }

    function renderAll() {
      const completed = todayObjectives.filter(o=>o.completed||o.claimed).length;
      const pct = Math.round((completed/3)*100);

      // Hero
      document.getElementById('hpLabel').textContent = `${completed}/3 complétés`;
      document.getElementById('hpPct').textContent   = pct+'%';
      document.getElementById('hpFill').style.width  = pct+'%';

      const badge = document.getElementById('heroBadge');
      badge.textContent = `${completed}/3`;
      badge.className = completed===3 ? 'hero-badge done' : 'hero-badge';

      document.getElementById('heroSubtitle').textContent = completed===3
        ? '🎉 Tous complétés — Reviens demain !'
        : `${3-completed} objectif${3-completed>1?'s':''} restant${3-completed>1?'s':''}`;

      document.getElementById('heroObjs').innerHTML = todayObjectives.map(o => {
        const done = o.completed||o.claimed;
        return `<div class="hero-obj">
          <div class="hero-obj-dot ${done?'done':'todo'}"></div>
          <span class="hero-obj-text ${done?'done':''}">${o.icon} ${o.title}</span>
        </div>`;
      }).join('');

      // Cards
      const container = document.getElementById('objContainer');
      if(todayObjectives.filter(o=>o.claimed).length===3) {
        container.innerHTML = `<div class="all-done"><div class="all-done-icon">🎉</div><div class="all-done-title">Tout accompli !</div><div class="all-done-sub">Reviens demain pour de nouveaux objectifs.</div></div>`;
        return;
      }

      container.innerHTML = todayObjectives.map((obj,i) => {
        const prog = obj.progress||0;
        const pct  = Math.min(100,Math.round((prog/obj.target)*100));
        const isComplete = obj.completed||prog>=obj.target;
        const isClaimed  = obj.claimed;
        let btnClass='progress', btnText='En cours...';
        if(isClaimed)    { btnClass='done';      btnText='✅ Récompense réclamée'; }
        else if(isComplete) { btnClass='claimable'; btnText='🎁 Réclamer la récompense'; }

        return `<div class="obj-card ${obj.type} ${isComplete?'completed':''} ${isClaimed?'claimed':''}">
          ${isClaimed?'<div class="obj-check">✓</div>':''}
          <div class="obj-top">
            <div class="obj-icon">${obj.icon}</div>
            <div class="obj-info">
              <div class="obj-title">${obj.title}</div>
              <div class="obj-desc">${obj.desc}</div>
            </div>
            <div class="obj-reward">
              ${obj.reward.xp    ?`<div class="obj-reward-val">+${obj.reward.xp}</div><div class="obj-reward-lbl">XP</div>`:''}
              ${obj.reward.money ?`<div class="obj-reward-val" style="margin-top:4px">+${obj.reward.money}€</div><div class="obj-reward-lbl">Argent</div>`:''}
            </div>
          </div>
          <div class="obj-prog">
            <div class="op-row"><span>Progression</span><span>${prog.toLocaleString('fr-FR')} / ${obj.target.toLocaleString('fr-FR')}</span></div>
            <div class="op-track"><div class="op-fill" style="width:${pct}%"></div></div>
          </div>
          <button class="obj-btn ${btnClass}" onclick="${isComplete&&!isClaimed?`claimReward(${i})`:''}">
            ${btnText}
          </button>
        </div>`;
      }).join('');
    }

    async function claimReward(idx) {
      const obj = todayObjectives[idx];
      if(!obj||obj.claimed||!obj.completed) return;

      const updates = {};
      if(obj.reward.xp)    updates.xp    = (userXp||0)    + obj.reward.xp;
      if(obj.reward.money) updates.money  = (userMoney||0) + obj.reward.money;

      await sb.from('game_stats').update(updates).eq('user_id',currentUser.id);
      if(obj.reward.xp)    userXp    = updates.xp;
      if(obj.reward.money) userMoney = updates.money;

      todayObjectives[idx].claimed = true;
      const today = new Date().toISOString().split('T')[0];
      await sb.from('daily_objectives').update({ objectives:todayObjectives }).eq('user_id',currentUser.id).eq('date',today);

      renderAll();
      const msg = [obj.reward.xp?`+${obj.reward.xp} XP`:'', obj.reward.money?`+${obj.reward.money}€`:''].filter(Boolean).join(' · ');
      showToast('🎁 '+msg, 'success');
    }

    function startCountdown() {
      function tick() {
        const now=new Date(), next=new Date(); next.setHours(24,0,0,0);
        const d=Math.floor((next-now)/1000), h=Math.floor(d/3600), m=Math.floor((d%3600)/60), s=d%60;
        const el=document.getElementById('countdownTime');
        if(el) el.textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
        setTimeout(tick,1000);
      }
      tick();
    }

    function showToast(msg,type='') {
      const t=document.getElementById('toast');
      t.textContent=msg; t.className='toast show '+type;
      setTimeout(()=>t.className='toast',2800);
    }

    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if(!session) { window.location.href='index.html'; return; }
      currentUser = session.user;

      const { data: stats } = await sb.from('game_stats').select('money,xp').eq('user_id',currentUser.id).maybeSingle();
      userMoney = stats?.money||0;
      userXp    = stats?.xp   ||0;

      // Date dans le hero
      const today = new Date();
      document.getElementById('calNum').textContent   = today.getDate();
      document.getElementById('calDay').textContent   = DAYS[today.getDay()].slice(0,3).toUpperCase();
      document.getElementById('calMonth').textContent = MONTHS[today.getMonth()].slice(0,4).toUpperCase();

      await loadObjectives();
      startCountdown();
    }

    init();
  </script>
</body>
</html>
