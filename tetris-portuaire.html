<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Docker Mensuel - Battle Dock</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #1e293b 0%, #334155 50%, #475569 100%);
      height: 100vh;
      height: 100dvh; /* Dynamic viewport height pour mobile */
      display: flex;
      flex-direction: column;
      touch-action: manipulation;
      overflow: hidden;
      margin: 0;
      padding: 0;
      position: fixed;
      width: 100%;
      top: 0;
      left: 0;
    }

    /* HEADER */
    .header {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: white;
      font-size: 20px;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .back-btn:active {
      transform: scale(0.95);
      background: rgba(255, 255, 255, 0.2);
    }

    .timer {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      color: white;
      letter-spacing: 1px;
    }

    /* GAME AREA */
    .game-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px;
      gap: 8px;
      overflow: hidden;
      min-height: 0;
    }

    .game-board {
      background: rgba(0, 0, 0, 0.3);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 6px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      flex-shrink: 0;
      touch-action: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(10, 22px);
      grid-template-rows: repeat(16, 22px);
      gap: 1px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 4px;
      padding: 3px;
    }

    .cell {
      width: 22px;
      height: 22px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 2px;
      transition: all 0.05s;
    }

    .cell.filled {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      border-color: #60a5fa;
      box-shadow: 0 0 8px rgba(59, 130, 246, 0.4);
    }

    .cell.active {
      background: linear-gradient(135deg, #10b981, #059669);
      border-color: #34d399;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
    }

    /* STATS */
    .stats {
      display: flex;
      gap: 8px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      flex-shrink: 0;
    }

    .stat {
      text-align: center;
      flex: 1;
      min-width: 0;
    }

    .stat-label {
      font-size: 9px;
      color: rgba(255, 255, 255, 0.7);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .stat-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      color: white;
      letter-spacing: 0.5px;
      line-height: 1;
    }

    /* CONTROLS */
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      width: 100%;
      padding: 8px;
      background: rgba(0, 0, 0, 0.3);
      flex-shrink: 0;
    }

    .control-btn {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.3);
      color: white;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      letter-spacing: 1px;
      padding: 20px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .control-btn:active {
      transform: scale(0.96);
      background: rgba(255, 255, 255, 0.3);
    }

    .control-btn.drop {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, #10b981, #059669);
      border-color: #34d399;
      font-size: 18px;
      padding: 18px 12px;
    }

    /* GAME OVER */
    .game-over-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .game-over-overlay.active {
      display: flex;
    }

    .game-over-card {
      background: white;
      border-radius: 16px;
      padding: 28px 20px;
      max-width: 90%;
      width: 320px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .game-over-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      letter-spacing: 2px;
      color: #1a1a1a;
      margin-bottom: 16px;
    }

    .game-over-stats {
      margin-bottom: 24px;
    }

    .game-over-stat {
      margin-bottom: 12px;
    }

    .game-over-stat-label {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 4px;
    }

    .game-over-stat-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      color: #1a1a1a;
      letter-spacing: 1px;
    }

    .game-over-stat-value.highlight {
      color: #10b981;
      font-size: 28px;
    }

    .game-over-buttons {
      display: flex;
      gap: 10px;
    }

    .game-over-btn {
      flex: 1;
      padding: 14px;
      border-radius: 8px;
      border: none;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .game-over-btn.primary {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
    }

    .game-over-btn.secondary {
      background: #f3f4f6;
      color: #1a1a1a;
    }

    .game-over-btn:active {
      transform: scale(0.98);
    }

    /* Optimisations mobile */
    @media (max-height: 700px) {
      .grid {
        grid-template-columns: repeat(10, 20px);
        grid-template-rows: repeat(16, 20px);
      }
      
      .cell {
        width: 20px;
        height: 20px;
      }

      .control-btn {
        padding: 16px 10px;
        font-size: 15px;
      }

      .control-btn.drop {
        padding: 14px 10px;
      }

      .stat-value {
        font-size: 16px;
      }
    }

    @media (max-height: 650px) {
      .grid {
        grid-template-columns: repeat(10, 18px);
        grid-template-rows: repeat(16, 18px);
      }
      
      .cell {
        width: 18px;
        height: 18px;
      }

      .stats {
        padding: 6px 10px;
      }

      .control-btn {
        padding: 14px 8px;
        font-size: 14px;
      }

      .control-btn.drop {
        padding: 12px 8px;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <button class="back-btn" onclick="goBack()">←</button>
    <div class="timer" id="timer">50</div>
  </div>

  <div class="game-container">
    <div class="game-board">
      <div class="grid" id="grid"></div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-label">Lignes</div>
        <div class="stat-value" id="lines">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Combo</div>
        <div class="stat-value" id="combo">×1</div>
      </div>
      <div class="stat">
        <div class="stat-label">Score</div>
        <div class="stat-value" id="score">0</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="control-btn" onclick="moveLeft()">◀ Gauche</button>
    <button class="control-btn" onclick="moveRight()">Droite ▶</button>
    <button class="control-btn" onclick="rotate()">🔄 Rotation</button>
    <button class="control-btn drop" onclick="drop()">⬇ DROP</button>
  </div>

  <div class="game-over-overlay" id="gameOverOverlay">
    <div class="game-over-card">
      <div class="game-over-title">Terminé !</div>
      <div class="game-over-stats">
        <div class="game-over-stat">
          <div class="game-over-stat-label">Tu as gagné</div>
          <div class="game-over-stat-value highlight" id="finalMoney">0€</div>
        </div>
        <div class="game-over-stat">
          <div class="game-over-stat-label">XP gagnée</div>
          <div class="game-over-stat-value" id="finalXP">0</div>
        </div>
        <div class="game-over-stat">
          <div class="game-over-stat-label">Lignes complétées</div>
          <div class="game-over-stat-value" id="finalLines">0</div>
        </div>
      </div>
      <div class="game-over-buttons">
        <button class="game-over-btn secondary" onclick="goBack()">Quitter</button>
        <button class="game-over-btn primary" onclick="location.reload()">Rejouer</button>
      </div>
    </div>
  </div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const sb = createClient(supabaseUrl, supabaseKey);

    let currentUser = null;
    let gameActive = false;
    let timeLeft = 50;
    let linesCleared = 0;
    let currentCombo = 1;
    let score = 0;

    // Grid 10x16
    const COLS = 10;
    const ROWS = 16;
    let grid = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));
    
    // Pièce actuelle
    let currentPiece = null;
    let currentX = 0;
    let currentY = 0;

    // Formes des conteneurs (Tetris)
    const SHAPES = [
      [[1, 1, 1, 1]], // I
      [[1, 1], [1, 1]], // O
      [[1, 1, 1], [0, 1, 0]], // T
      [[1, 1, 1], [1, 0, 0]], // L
      [[1, 1, 1], [0, 0, 1]], // J
      [[1, 1, 0], [0, 1, 1]], // S
      [[0, 1, 1], [1, 1, 0]]  // Z
    ];

    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        window.location.href = 'index.html';
        return;
      }
      currentUser = session.user;
      
      createGrid();
      attachButtonListeners();
      startGame();
    }

    function attachButtonListeners() {
      document.getElementById('btnLeft').addEventListener('click', () => {
        if (gameActive) moveLeft();
      });

      document.getElementById('btnRight').addEventListener('click', () => {
        if (gameActive) moveRight();
      });

      document.getElementById('btnRotate').addEventListener('click', () => {
        if (gameActive) rotate();
      });

      document.getElementById('btnDrop').addEventListener('click', () => {
        if (gameActive) drop();
      });
    }

    function createGrid() {
      const gridEl = document.getElementById('grid');
      gridEl.innerHTML = '';
      
      for (let row = 0; row < ROWS; row++) {
        for (let col = 0; col < COLS; col++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.dataset.row = row;
          cell.dataset.col = col;
          gridEl.appendChild(cell);
        }
      }
    }

    function startGame() {
      gameActive = true;
      spawnPiece();
      
      // Timer
      const timerInterval = setInterval(() => {
        if (!gameActive) {
          clearInterval(timerInterval);
          return;
        }
        
        timeLeft--;
        document.getElementById('timer').textContent = timeLeft;
        
        if (timeLeft === 0) {
          clearInterval(timerInterval);
          endGame();
        }
      }, 1000);

      // Descente automatique
      const dropInterval = setInterval(() => {
        if (!gameActive) {
          clearInterval(dropInterval);
          return;
        }
        
        if (!moveDown()) {
          placePiece();
          checkLines();
          spawnPiece();
        }
      }, 800);
    }

    function spawnPiece() {
      currentPiece = SHAPES[Math.floor(Math.random() * SHAPES.length)];
      currentX = Math.floor(COLS / 2) - Math.floor(currentPiece[0].length / 2);
      currentY = 0;
      
      // Check game over
      if (!canPlace(currentX, currentY, currentPiece)) {
        endGame();
      } else {
        render();
      }
    }

    function canPlace(x, y, piece) {
      for (let row = 0; row < piece.length; row++) {
        for (let col = 0; col < piece[row].length; col++) {
          if (piece[row][col]) {
            const newX = x + col;
            const newY = y + row;
            
            if (newX < 0 || newX >= COLS || newY >= ROWS) return false;
            if (newY >= 0 && grid[newY][newX]) return false;
          }
        }
      }
      return true;
    }

    function moveLeft() {
      if (canPlace(currentX - 1, currentY, currentPiece)) {
        currentX--;
        render();
      }
    }

    function moveRight() {
      if (canPlace(currentX + 1, currentY, currentPiece)) {
        currentX++;
        render();
      }
    }

    function moveDown() {
      if (canPlace(currentX, currentY + 1, currentPiece)) {
        currentY++;
        render();
        return true;
      }
      return false;
    }

    function rotate() {
      const rotated = currentPiece[0].map((_, i) => 
        currentPiece.map(row => row[i]).reverse()
      );
      
      if (canPlace(currentX, currentY, rotated)) {
        currentPiece = rotated;
        render();
      }
    }

    function drop() {
      while (moveDown()) {}
      placePiece();
      checkLines();
      spawnPiece();
    }

    function placePiece() {
      for (let row = 0; row < currentPiece.length; row++) {
        for (let col = 0; col < currentPiece[row].length; col++) {
          if (currentPiece[row][col]) {
            const newY = currentY + row;
            const newX = currentX + col;
            if (newY >= 0) {
              grid[newY][newX] = 1;
            }
          }
        }
      }
    }

    function checkLines() {
      let linesThisCheck = 0;
      
      for (let row = ROWS - 1; row >= 0; row--) {
        if (grid[row].every(cell => cell === 1)) {
          grid.splice(row, 1);
          grid.unshift(Array(COLS).fill(0));
          linesThisCheck++;
          row++; // Revérifier cette ligne
        }
      }
      
      if (linesThisCheck > 0) {
        linesCleared += linesThisCheck;
        
        // Combo
        if (linesThisCheck > 1) {
          currentCombo = Math.min(currentCombo + 1, 5);
        } else {
          currentCombo = 1;
        }
        
        // Score
        const lineScore = linesThisCheck * 100 * currentCombo;
        score += lineScore;
        
        // Update UI
        document.getElementById('lines').textContent = linesCleared;
        document.getElementById('combo').textContent = '×' + currentCombo;
        document.getElementById('score').textContent = score;
      } else {
        currentCombo = 1;
        document.getElementById('combo').textContent = '×1';
      }
      
      render();
    }

    function render() {
      // Clear active cells
      document.querySelectorAll('.cell.active').forEach(cell => {
        cell.classList.remove('active');
      });
      
      // Render grid
      for (let row = 0; row < ROWS; row++) {
        for (let col = 0; col < COLS; col++) {
          const cell = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
          if (grid[row][col]) {
            cell.classList.add('filled');
          } else {
            cell.classList.remove('filled');
          }
        }
      }
      
      // Render current piece
      if (currentPiece) {
        for (let row = 0; row < currentPiece.length; row++) {
          for (let col = 0; col < currentPiece[row].length; col++) {
            if (currentPiece[row][col]) {
              const newY = currentY + row;
              const newX = currentX + col;
              if (newY >= 0) {
                const cell = document.querySelector(`[data-row="${newY}"][data-col="${newX}"]`);
                if (cell) cell.classList.add('active');
              }
            }
          }
        }
      }
    }

    async function endGame() {
      gameActive = false;
      
      // Calculate rewards : 3.90€ / 7.1 XP par ligne
      const moneyEarned = Math.floor(linesCleared * 3.90 * 100);
      const xpEarned = Math.floor(linesCleared * 7.1 * 100);
      
      // Update DB
      try {
        const { data: stats } = await sb
          .from('game_stats')
          .select('money, xp, level')
          .eq('user_id', currentUser.id)
          .single();

        if (stats) {
          let newXP = stats.xp + xpEarned;
          let newLevel = stats.level;

          while (newXP >= newLevel * newLevel * 50) {
            newXP -= newLevel * newLevel * 50;
            newLevel++;
          }

          await sb
            .from('game_stats')
            .update({
              money: stats.money + moneyEarned,
              xp: newXP,
              level: newLevel
            })
            .eq('user_id', currentUser.id);
        }
      } catch (error) {
        console.error('Erreur sauvegarde:', error);
      }
      
      // Show game over
      document.getElementById('finalMoney').textContent = moneyEarned.toLocaleString('fr-FR') + '€';
      document.getElementById('finalXP').textContent = xpEarned.toLocaleString('fr-FR');
      document.getElementById('finalLines').textContent = linesCleared;
      document.getElementById('gameOverOverlay').classList.add('active');
    }

    function goBack() {
      window.location.href = 'menutravailler.html';
    }

    // Touch controls isolés sur la grille
    let touchStartX = 0;
    let touchStartY = 0;
    let touchEndX = 0;
    let touchEndY = 0;
    const minSwipeDistance = 30;

    const gameBoard = document.querySelector('.game-board');

    gameBoard.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    gameBoard.addEventListener('touchend', (e) => {
      if (!gameActive) return;
      
      touchEndX = e.changedTouches[0].screenX;
      touchEndY = e.changedTouches[0].screenY;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      const diffX = touchEndX - touchStartX;
      const diffY = touchEndY - touchStartY;
      const absDiffX = Math.abs(diffX);
      const absDiffY = Math.abs(diffY);

      // Ignore petits mouvements
      if (absDiffX < minSwipeDistance && absDiffY < minSwipeDistance) {
        // Tap = rotation
        rotate();
        return;
      }

      // Swipe horizontal prioritaire
      if (absDiffX > absDiffY) {
        if (diffX > 0) {
          moveRight();
        } else {
          moveLeft();
        }
      } else {
        // Swipe vertical
        if (diffY > 0) {
          drop();
        }
      }
    }

    // Keyboard controls pour desktop
    document.addEventListener('keydown', (e) => {
      if (!gameActive) return;
      
      switch(e.key) {
        case 'ArrowLeft':
          e.preventDefault();
          moveLeft();
          break;
        case 'ArrowRight':
          e.preventDefault();
          moveRight();
          break;
        case 'ArrowDown':
          e.preventDefault();
          drop();
          break;
        case 'ArrowUp':
        case ' ':
          e.preventDefault();
          rotate();
          break;
      }
    });

    init();
  </script>
</body>
</html>
