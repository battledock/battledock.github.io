<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Docker Mensuel - Battle Dock</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #1e293b 0%, #334155 50%, #475569 100%);
      display: flex;
      flex-direction: column;
      touch-action: manipulation;
    }

    .header {
      background: rgba(0, 0, 0, 0.3);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      font-size: 24px;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .back-btn:active {
      background: rgba(255, 255, 255, 0.3);
    }

    .timer {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      color: white;
      letter-spacing: 1px;
    }

    .game-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      gap: 20px;
      overflow: hidden;
    }

    .game-board {
      background: rgba(0, 0, 0, 0.4);
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      touch-action: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(10, 26px);
      grid-template-rows: repeat(16, 26px);
      gap: 2px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 6px;
      padding: 4px;
    }

    .cell {
      width: 26px;
      height: 26px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }

    .cell.filled {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      border-color: #60a5fa;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.6);
    }

    .cell.active {
      background: linear-gradient(135deg, #10b981, #059669);
      border-color: #34d399;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.6);
    }

    .stats {
      display: flex;
      gap: 20px;
      background: rgba(0, 0, 0, 0.4);
      padding: 16px 24px;
      border-radius: 12px;
      border: 2px solid rgba(255, 255, 255, 0.3);
    }

    .stat {
      text-align: center;
    }

    .stat-label {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.8);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .stat-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      color: white;
      letter-spacing: 1px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      max-width: 400px;
      padding: 16px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px 12px 0 0;
    }

    .control-btn {
      background: rgba(255, 255, 255, 0.25);
      border: 2px solid rgba(255, 255, 255, 0.4);
      color: white;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 1px;
      padding: 28px 16px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .control-btn:active {
      background: rgba(255, 255, 255, 0.4);
      transform: scale(0.97);
    }

    .control-btn.drop {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, #10b981, #059669);
      border-color: #34d399;
      font-size: 22px;
      padding: 24px;
    }

    .game-over-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .game-over-overlay.active {
      display: flex;
    }

    .game-over-card {
      background: white;
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 90%;
      width: 340px;
      text-align: center;
    }

    .game-over-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      letter-spacing: 2px;
      color: #1a1a1a;
      margin-bottom: 20px;
    }

    .game-over-stat {
      margin-bottom: 16px;
    }

    .game-over-stat-label {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 4px;
    }

    .game-over-stat-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      color: #1a1a1a;
      letter-spacing: 1px;
    }

    .game-over-stat-value.highlight {
      color: #10b981;
      font-size: 32px;
    }

    .game-over-buttons {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .game-over-btn {
      flex: 1;
      padding: 16px;
      border-radius: 10px;
      border: none;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 1px;
    }

    .game-over-btn.primary {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
    }

    .game-over-btn.secondary {
      background: #e5e7eb;
      color: #1a1a1a;
    }

    @media (max-width: 380px) {
      .grid {
        grid-template-columns: repeat(10, 24px);
        grid-template-rows: repeat(16, 24px);
      }
      .cell {
        width: 24px;
        height: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <button class="back-btn" onclick="goBack()">←</button>
    <div class="timer" id="timer">50</div>
  </div>

  <div class="game-container">
    <div class="game-board" id="gameBoard">
      <div class="grid" id="grid"></div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-label">Lignes</div>
        <div class="stat-value" id="lines">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Combo</div>
        <div class="stat-value" id="combo">×1</div>
      </div>
      <div class="stat">
        <div class="stat-label">Score</div>
        <div class="stat-value" id="score">0</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="control-btn" id="btnLeft">◀ Gauche</button>
    <button class="control-btn" id="btnRight">Droite ▶</button>
    <button class="control-btn" id="btnRotate">🔄 Rotation</button>
    <button class="control-btn drop" id="btnDrop">⬇ DROP</button>
  </div>

  <div class="game-over-overlay" id="gameOverOverlay">
    <div class="game-over-card">
      <div class="game-over-title">Terminé !</div>
      <div class="game-over-stat">
        <div class="game-over-stat-label">Tu as gagné</div>
        <div class="game-over-stat-value highlight" id="finalMoney">0€</div>
      </div>
      <div class="game-over-stat">
        <div class="game-over-stat-label">XP gagnée</div>
        <div class="game-over-stat-value" id="finalXP">0</div>
      </div>
      <div class="game-over-stat">
        <div class="game-over-stat-label">Lignes complétées</div>
        <div class="game-over-stat-value" id="finalLines">0</div>
      </div>
      <div class="game-over-buttons">
        <button class="game-over-btn secondary" onclick="goBack()">Menu</button>
        <button class="game-over-btn primary" onclick="location.reload()">Rejouer</button>
      </div>
    </div>
  </div>

  <script>
    const sb = supabase.createClient(
      'https://iuhmtzdfkzvffbsafhjy.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1aG10emRma3p2ZmZic2FmaGp5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzcwMzE4NjAsImV4cCI6MjA1MjYwNzg2MH0.MBhkqxEpxVTVA51zWNKr_9bVYHLcPGg9EqGfvOjpU0s'
    );

    let currentUser = null;
    let gameActive = false;
    let timeLeft = 50;
    let score = 0;
    let linesCleared = 0;
    let currentCombo = 1;

    const ROWS = 16;
    const COLS = 10;
    let grid = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));
    let currentPiece = null;
    let currentX = 0;
    let currentY = 0;

    const SHAPES = [
      [[1,1,1,1]], // I
      [[1,1],[1,1]], // O
      [[1,1,1],[0,1,0]], // T
      [[1,1,1],[1,0,0]], // L
      [[1,1,1],[0,0,1]], // J
      [[1,1,0],[0,1,1]], // S
      [[0,1,1],[1,1,0]]  // Z
    ];

    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        window.location.href = 'index.html';
        return;
      }
      currentUser = session.user;
      
      createGrid();
      attachControls();
      startGame();
    }

    function createGrid() {
      const gridEl = document.getElementById('grid');
      gridEl.innerHTML = '';
      
      for (let row = 0; row < ROWS; row++) {
        for (let col = 0; col < COLS; col++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.dataset.row = row;
          cell.dataset.col = col;
          gridEl.appendChild(cell);
        }
      }
    }

    function attachControls() {
      // Boutons
      document.getElementById('btnLeft').onclick = () => {
        if (gameActive) moveLeft();
      };

      document.getElementById('btnRight').onclick = () => {
        if (gameActive) moveRight();
      };

      document.getElementById('btnRotate').onclick = () => {
        if (gameActive) rotate();
      };

      document.getElementById('btnDrop').onclick = () => {
        if (gameActive) drop();
      };

      // Touch swipe ISOLÉ sur game-board
      let touchStartX = 0;
      let touchStartY = 0;
      const gameBoard = document.getElementById('gameBoard');

      gameBoard.addEventListener('touchstart', (e) => {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }, { passive: true });

      gameBoard.addEventListener('touchend', (e) => {
        if (!gameActive) return;
        
        const touchEndX = e.changedTouches[0].clientX;
        const touchEndY = e.changedTouches[0].clientY;
        const diffX = touchEndX - touchStartX;
        const diffY = touchEndY - touchStartY;
        const absDiffX = Math.abs(diffX);
        const absDiffY = Math.abs(diffY);

        if (absDiffX < 30 && absDiffY < 30) {
          rotate();
          return;
        }

        if (absDiffX > absDiffY) {
          diffX > 0 ? moveRight() : moveLeft();
        } else {
          if (diffY > 0) drop();
        }
      }, { passive: true });

      // Keyboard
      document.addEventListener('keydown', (e) => {
        if (!gameActive) return;
        
        switch(e.key) {
          case 'ArrowLeft':
            e.preventDefault();
            moveLeft();
            break;
          case 'ArrowRight':
            e.preventDefault();
            moveRight();
            break;
          case 'ArrowDown':
            e.preventDefault();
            drop();
            break;
          case 'ArrowUp':
          case ' ':
            e.preventDefault();
            rotate();
            break;
        }
      });
    }

    function startGame() {
      gameActive = true;
      spawnPiece();
      
      const timerInterval = setInterval(() => {
        if (!gameActive) {
          clearInterval(timerInterval);
          return;
        }
        
        timeLeft--;
        document.getElementById('timer').textContent = timeLeft;
        
        if (timeLeft === 0) {
          clearInterval(timerInterval);
          endGame();
        }
      }, 1000);

      const dropInterval = setInterval(() => {
        if (!gameActive) {
          clearInterval(dropInterval);
          return;
        }
        
        if (!moveDown()) {
          placePiece();
          checkLines();
          spawnPiece();
        }
      }, 800);
    }

    function spawnPiece() {
      currentPiece = SHAPES[Math.floor(Math.random() * SHAPES.length)];
      currentX = Math.floor(COLS / 2) - Math.floor(currentPiece[0].length / 2);
      currentY = 0;
      
      if (!canPlace(currentX, currentY, currentPiece)) {
        endGame();
      } else {
        render();
      }
    }

    function canPlace(x, y, piece) {
      for (let row = 0; row < piece.length; row++) {
        for (let col = 0; col < piece[row].length; col++) {
          if (piece[row][col]) {
            const newX = x + col;
            const newY = y + row;
            
            if (newX < 0 || newX >= COLS || newY >= ROWS) return false;
            if (newY >= 0 && grid[newY][newX]) return false;
          }
        }
      }
      return true;
    }

    function moveLeft() {
      if (canPlace(currentX - 1, currentY, currentPiece)) {
        currentX--;
        render();
      }
    }

    function moveRight() {
      if (canPlace(currentX + 1, currentY, currentPiece)) {
        currentX++;
        render();
      }
    }

    function moveDown() {
      if (canPlace(currentX, currentY + 1, currentPiece)) {
        currentY++;
        render();
        return true;
      }
      return false;
    }

    function rotate() {
      const rotated = currentPiece[0].map((_, i) => 
        currentPiece.map(row => row[i]).reverse()
      );
      
      if (canPlace(currentX, currentY, rotated)) {
        currentPiece = rotated;
        render();
      }
    }

    function drop() {
      while (moveDown()) {}
      placePiece();
      checkLines();
      spawnPiece();
    }

    function placePiece() {
      for (let row = 0; row < currentPiece.length; row++) {
        for (let col = 0; col < currentPiece[row].length; col++) {
          if (currentPiece[row][col]) {
            const newY = currentY + row;
            const newX = currentX + col;
            if (newY >= 0) {
              grid[newY][newX] = 1;
            }
          }
        }
      }
    }

    function checkLines() {
      let linesThisCheck = 0;
      
      for (let row = ROWS - 1; row >= 0; row--) {
        if (grid[row].every(cell => cell === 1)) {
          grid.splice(row, 1);
          grid.unshift(Array(COLS).fill(0));
          linesThisCheck++;
          row++;
        }
      }
      
      if (linesThisCheck > 0) {
        linesCleared += linesThisCheck;
        
        if (linesThisCheck > 1) {
          currentCombo = Math.min(currentCombo + 1, 5);
        } else {
          currentCombo = 1;
        }
        
        const lineScore = linesThisCheck * 100 * currentCombo;
        score += lineScore;
        
        document.getElementById('lines').textContent = linesCleared;
        document.getElementById('combo').textContent = '×' + currentCombo;
        document.getElementById('score').textContent = score;
      } else {
        currentCombo = 1;
        document.getElementById('combo').textContent = '×1';
      }
      
      render();
    }

    function render() {
      document.querySelectorAll('.cell.active').forEach(cell => {
        cell.classList.remove('active');
      });
      
      for (let row = 0; row < ROWS; row++) {
        for (let col = 0; col < COLS; col++) {
          const cell = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
          if (grid[row][col]) {
            cell.classList.add('filled');
          } else {
            cell.classList.remove('filled');
          }
        }
      }
      
      if (currentPiece) {
        for (let row = 0; row < currentPiece.length; row++) {
          for (let col = 0; col < currentPiece[row].length; col++) {
            if (currentPiece[row][col]) {
              const newY = currentY + row;
              const newX = currentX + col;
              if (newY >= 0) {
                const cell = document.querySelector(`[data-row="${newY}"][data-col="${newX}"]`);
                if (cell) cell.classList.add('active');
              }
            }
          }
        }
      }
    }

    async function endGame() {
      gameActive = false;
      
      // Gains : 3.90€ / 7.1 XP par ligne
      const moneyEarned = Math.floor(linesCleared * 3.90 * 100);
      const xpEarned = Math.floor(linesCleared * 7.1 * 100);
      
      try {
        const { data: stats } = await sb
          .from('game_stats')
          .select('money, xp, level')
          .eq('user_id', currentUser.id)
          .single();

        if (stats) {
          let newXP = stats.xp + xpEarned;
          let newLevel = stats.level;

          // FIX: utiliser newLevel dans la boucle
          while (newXP >= newLevel * newLevel * 50) {
            newXP -= newLevel * newLevel * 50;
            newLevel++;
          }

          await sb
            .from('game_stats')
            .update({
              money: stats.money + moneyEarned,
              xp: newXP,
              level: newLevel
            })
            .eq('user_id', currentUser.id);
        }
      } catch (error) {
        console.error('Erreur sauvegarde:', error);
      }
      
      // Affichage en euros (diviser par 100)
      document.getElementById('finalMoney').textContent = (moneyEarned / 100).toFixed(2) + '€';
      document.getElementById('finalXP').textContent = (xpEarned / 100).toLocaleString('fr-FR');
      document.getElementById('finalLines').textContent = linesCleared;
      document.getElementById('gameOverOverlay').classList.add('active');
    }

    function goBack() {
      window.location.href = 'menutravailler.html';
    }

    init();
  </script>
</body>
</html>
