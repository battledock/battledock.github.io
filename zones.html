      if(l>0)h+='<div style="padding:0 14px 6px"><div class="bar-wrap"><div class="bar-fill" style="width:'+((Math.min(l,5)/5)*100)+'%;background:'+(mx?'#16a34a':z.color)+'"></div></div></div>';
      h+='<div class="btn-row">';
      if(l===0)h+='<div class="btn" style="background:'+z.color+'" onclick="buyZ(\''+z.id+'\')">ACHETER — '+fm(z.cost)+'</div>';
      else{
        if(!tp)h+='<div class="btn" style="background:#ef4444;flex:1" onclick="payTax(\''+z.id+'\')">TAXE '+fm(z.tax)+'</div>';
        if(!mx)h+='<div class="btn" style="background:#1a1a1a;flex:1" onclick="buyZ(\''+z.id+'\')">NV.'+(l+1)+' — '+fm(nc)+'</div>';
        if(l>=5&&!fu&&canFuse(z.id))h+='<div class="btn" style="background:linear-gradient(90deg,'+z.color+',#fbbf24);flex:1" onclick="fuseZ(\''+z.id+'\')">🔗 FUSIONNER</div>';
      }
      h+='</div>';
    }
    h+='</div>';
  });
  document.getElementById('tabZContent').innerHTML=h;
  document.getElementById('sOwned').textContent=to+'/6';
  document.getElementById('sRev').textContent='+'+fm(tr)+'/h';
  document.getElementById('sRes').textContent=tres;
  document.getElementById('sBonus').textContent=tb>0?tb+'x':'—';
}

function renderContracts(){
  var h='<div class="sec-title">COMBINE TES RESSOURCES</div>';
  CONTRACTS.forEach(function(ct){
    var ok=true,nh='';
    Object.keys(ct.need).forEach(function(r){
      var hv=0;ZONES.forEach(function(z){if(z.rn===r){var d=myZ[z.id];if(d)hv=d.resources||0;}});
      if(hv<ct.need[r])ok=false;
      nh+='<div class="tag '+(hv>=ct.need[r]?'green':'red')+'">'+r+' '+hv+'/'+ct.need[r]+'</div>';
    });
    h+='<div class="zone-card" style="margin:6px 12px"><div class="zone-top"><div style="font-size:26px;flex-shrink:0">'+ct.emoji+'</div><div style="flex:1"><div class="zone-name">'+ct.name+'</div><div class="tags" style="padding:4px 0 0">'+nh+'</div></div><div class="zone-right"><div style="font-family:Bebas Neue;font-size:14px;color:#16a34a">+'+fm(ct.reward)+'</div></div></div>';
    if(ok)h+='<div class="btn-row"><div class="btn" style="background:#16a34a" onclick="doCt(\''+ct.name+'\')">EXÉCUTER</div></div>';
    h+='</div>';
  });
  document.getElementById('tabCContent').innerHTML=h;
}

async function buyZ(id){
  var z=ZONES.find(function(x){return x.id===id;});if(!z||cLvl<z.ul)return toast('Zone pas débloquée');
  var d=myZ[id]||{},l=d.level||0;if(l>=5)return toast('Max !');
  var c=l===0?z.cost:gUp(z,l+1);if(money<c)return toast('Pas assez ('+fm(c)+')');
  money-=c;myZ[id]=myZ[id]||{};myZ[id].level=(l||0)+1;myZ[id].reputation=myZ[id].reputation||50;
  myZ[id].resources=(myZ[id].resources||0)+(l===0?1:0);
  if(!myZ[id].bought_at)myZ[id].bought_at=new Date().toISOString();
  if(!myZ[id].last_tax_paid)myZ[id].last_tax_paid=td();
  await save();toast(l===0?'🗺️ '+z.name+' achetée !':'⬆️ NV.'+(l+1));loadAll();
}

async function payTax(id){
  var z=ZONES.find(function(x){return x.id===id;});if(!z)return;
  if(money<z.tax)return toast('Pas assez !');
  money-=z.tax;myZ[id].last_tax_paid=td();
  myZ[id].reputation=Math.min(100,(myZ[id].reputation||50)+3);
  myZ[id].resources=(myZ[id].resources||0)+Math.ceil((myZ[id].level||1)*1.5);
  await save();toast('✅ Taxe payée ! +réputation +ressources');loadAll();
}

function canFuse(id){var z=ZONES.find(function(x){return x.id===id;});if(!z)return false;return z.adj.some(function(a){var d=myZ[a];return d&&d.level>=5&&!d.fused_with;});}

async function fuseZ(id){
  var z=ZONES.find(function(x){return x.id===id;});if(!z)return;
  var pa=z.adj.find(function(a){var d=myZ[a];return d&&d.level>=5&&!d.fused_with;});
  if(!pa)return toast('Pas de zone adjacente max');
  var pz=ZONES.find(function(x){return x.id===pa;});
  var c=Math.floor((z.cost+pz.cost)*.5);
  if(money<c)return toast('Coûte '+fm(c));
  if(!confirm('Fusionner '+z.name+' + '+pz.name+' pour '+fm(c)+' ?\nRevenus x3 sur '+z.name))return;
  money-=c;myZ[id].level=6;myZ[id].fused_with=pa;myZ[pa].fused_with=id;
  await save();toast('🔗 MÉGA-ZONE !');loadAll();
}

async function doCt(name){
  var ct=CONTRACTS.find(function(c){return c.name===name;});if(!ct)return;
  Object.keys(ct.need).forEach(function(r){ZONES.forEach(function(z){if(z.rn===r&&myZ[z.id])myZ[z.id].resources=Math.max(0,(myZ[z.id].resources||0)-ct.need[r]);});});
  money+=ct.reward;await save();toast('✅ '+ct.emoji+' +'+fm(ct.reward));loadAll();
}

async function save(){
  var {data:gs}=await sb.from('game_stats').select('commerce').eq('user_id',CU.id).maybeSingle();
  var com=(gs&&gs.commerce)||{};com.zones=myZ;
  await sb.from('game_stats').update({money:money,commerce:com}).eq('user_id',CU.id);
  document.getElementById('money').textContent='💰 '+fm(money);
}

function openD(id){
  var z=ZONES.find(function(x){return x.id===id;});if(!z)return;
  var d=myZ[id]||{},l=d.level||0,b=hb(z),rv=rivals[id]||0,rep=d.reputation||50;
  var rev=l>0?Math.floor(gRev(z,l,b,rv)*gRep(rep)):0;
  var h='<div style="text-align:center;font-size:42px;animation:float 2s ease infinite">'+z.emoji+'</div>';
  h+='<div style="font-family:Bangers;font-size:22px;text-align:center;margin-top:4px">'+z.name+'</div>';
  h+='<div style="font-size:8px;color:#999;text-align:center;letter-spacing:2px;font-weight:700">'+z.type+'</div>';
  h+='<div style="font-size:10px;color:#666;text-align:center;margin-top:4px">'+z.desc+'</div>';
  if(l>0){
    h+='<div style="display:flex;gap:6px;margin-top:12px">';
    h+='<div style="flex:1;background:#f9fafb;border-radius:8px;padding:8px;text-align:center"><div style="font-family:Bebas Neue;font-size:18px;color:#16a34a">+'+fm(rev)+'/h</div><div style="font-size:6px;color:#999;font-weight:700;letter-spacing:1px">REVENUS</div></div>';
    h+='<div style="flex:1;background:#f9fafb;border-radius:8px;padding:8px;text-align:center"><div style="font-family:Bebas Neue;font-size:18px">NV.'+l+'</div><div style="font-size:6px;color:#999;font-weight:700;letter-spacing:1px">NIVEAU</div></div>';
    h+='<div style="flex:1;background:#f9fafb;border-radius:8px;padding:8px;text-align:center"><div style="font-family:Bebas Neue;font-size:18px;color:#3b82f6">'+(d.resources||0)+'</div><div style="font-size:6px;color:#999;font-weight:700;letter-spacing:1px">'+z.rn.toUpperCase()+'</div></div>';
    h+='</div>';
    h+='<div style="margin-top:8px;font-size:9px;color:#666"><b>Réputation:</b> '+rep+'/100 (x'+gRep(rep).toFixed(2)+')</div>';
    if(rv>1)h+='<div style="font-size:9px;color:#ef4444;margin-top:2px"><b>⚔️ '+rv+' propriétaires</b> — revenus ÷'+rv+'</div>';
    if(b)h+='<div style="font-size:9px;color:#16a34a;margin-top:2px"><b>✓ Match spécialité</b> — x1.5</div>';
    h+='<div style="font-size:9px;color:#999;margin-top:2px"><b>Taxe/jour:</b> '+fm(z.tax)+' · <b>Ressource:</b> '+z.resource+'</div>';
  }else{
    h+='<div style="margin-top:10px;text-align:center"><div style="font-size:10px;color:#666">Achat: <b>'+fm(z.cost)+'</b></div><div style="font-size:9px;color:#999;margin-top:2px">Rev: +'+fm(z.rev)+'/h · '+z.resource+'</div></div>';
  }
  document.getElementById('detailC').innerHTML=h;
  document.getElementById('detailOv').style.display='flex';
}

function switchTab(t){
  document.getElementById('tabZContent').style.display=t==='z'?'block':'none';
  document.getElementById('tabCContent').style.display=t==='c'?'block':'none';
  document.getElementById('tabZ').className='tab '+(t==='z'?'on':'off');
  document.getElementById('tabC').className='tab '+(t==='c'?'on':'off');
}

function checkTax(){
  var y=new Date();y.setDate(y.getDate()-1);var yd=y.toISOString().split('T')[0];
  Object.keys(myZ).forEach(function(id){
    var d=myZ[id];if(d&&d.level>0&&d.last_tax_paid&&d.last_tax_paid<yd&&!d.fused_with){
      d.reputation=Math.max(0,(d.reputation||50)-10);
      if(d.reputation<=0){var z=ZONES.find(function(x){return x.id===id;});toast('💀 '+z.name+' confisquée !');delete myZ[id];}
    }
  });
}

async function loadAll(){
  var {data:gs}=await sb.from('game_stats').select('money,commerce').eq('user_id',CU.id).maybeSingle();
  if(!gs)return;money=gs.money||0;document.getElementById('money').textContent='💰 '+fm(money);
  myZ=(gs.commerce&&gs.commerce.zones)||{};
  var {data:co}=await sb.from('companies').select('type_id,niveau').eq('user_id',CU.id).maybeSingle();
  if(co){cLvl=co.niveau||1;cTag=TAGS[co.type_id]||'';}
  rivals={};
  try{var {data:all}=await sb.from('game_stats').select('commerce').not('commerce','is',null);
  if(all)all.forEach(function(r){var zz=(r.commerce&&r.commerce.zones)||{};Object.keys(zz).forEach(function(i){if(zz[i]&&zz[i].level>0)rivals[i]=(rivals[i]||0)+1;});});}catch(e){}
  checkTax();renderMap();renderZones();renderContracts();
}

(async function(){
  var r=await sb.auth.getSession();var s=r.data&&r.data.session;
  if(!s){location.href='index.html';return;}CU=s.user;await loadAll();
})();
</script>

</div>
