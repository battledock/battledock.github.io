<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>La Joliette - Battle Dock</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      color: #fff;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px 16px 100px;
    }

    .header {
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .back-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      color: white;
      font-size: 24px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .back-btn:active {
      transform: scale(0.95);
    }

    .header-title {
      flex: 1;
    }

    .header-title h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }

    .header-subtitle {
      font-size: 13px;
      color: rgba(255,255,255,0.7);
    }

    .port-status {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(245, 158, 11, 0.3);
    }

    .port-icon {
      font-size: 64px;
      margin-bottom: 12px;
    }

    .port-percentage {
      font-size: 56px;
      font-weight: 900;
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .port-label {
      font-size: 14px;
      font-weight: 700;
      opacity: 0.9;
    }

    .locked-message {
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 40px 20px;
      text-align: center;
      margin-bottom: 20px;
    }

    .lock-icon {
      font-size: 64px;
      margin-bottom: 20px;
      opacity: 0.5;
    }

    .lock-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    .lock-text {
      font-size: 14px;
      color: rgba(255,255,255,0.7);
      line-height: 1.6;
    }

    .zones-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .zone-card {
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      border: 2px solid transparent;
    }

    .zone-card.owned {
      background: rgba(16, 185, 129, 0.1);
      border-color: #10b981;
    }

    .zone-card.available {
      background: rgba(59, 130, 246, 0.1);
      border-color: rgba(59, 130, 246, 0.3);
    }

    .zone-card:active {
      transform: scale(0.98);
    }

    .zone-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .zone-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .zone-price {
      font-size: 14px;
      color: #f59e0b;
      font-weight: 700;
    }

    .zone-status {
      font-size: 12px;
      color: #10b981;
      font-weight: 600;
      margin-top: 4px;
    }

    .section {
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 2px;
      margin-bottom: 16px;
    }

    .benefits-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .benefit-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
    }

    .benefit-icon {
      font-size: 24px;
    }

    .benefit-text {
      flex: 1;
    }

    .benefit-label {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .benefit-value {
      font-size: 12px;
      color: rgba(255,255,255,0.7);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
    }

    .stat-icon {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 800;
      font-family: 'Bebas Neue', sans-serif;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 10px;
      color: rgba(255,255,255,0.7);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 12px 20px;
      display: flex;
      gap: 12px;
    }

    .nav-btn {
      flex: 1;
      background: rgba(255,255,255,0.1);
      border: none;
      color: white;
      padding: 14px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .nav-btn:active {
      transform: scale(0.95);
    }

    .nav-btn.primary {
      background: #3b82f6;
    }

    .nav-btn.primary:active {
      background: #2563eb;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <button class="back-btn" onclick="window.location.href='game.html'">←</button>
      <div class="header-title">
        <h1>⚓ LA JOLIETTE</h1>
        <div class="header-subtitle">Port de Marseille</div>
      </div>
    </div>

    <div id="contentArea">
      <!-- Contenu chargé dynamiquement -->
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-btn" onclick="window.location.href='game.html'">Retour</button>
  </div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const supabaseClient = createClient(supabaseUrl, supabaseKey);

    const userId = localStorage.getItem('userId');
    const username = localStorage.getItem('username');

    const zones = [
      { id: 1, name: 'Quai 1', icon: '🏗️', price: 100000 },
      { id: 2, name: 'Quai 2', icon: '🏗️', price: 150000 },
      { id: 3, name: 'Quai 3', icon: '🏗️', price: 200000 },
      { id: 4, name: 'Quai 4', icon: '🏗️', price: 250000 },
      { id: 5, name: 'Terminal Nord', icon: '🚢', price: 500000 },
      { id: 6, name: 'Terminal Sud', icon: '🚢', price: 500000 },
      { id: 7, name: 'Zone Conteneurs', icon: '📦', price: 750000 },
      { id: 8, name: 'Zone Fret', icon: '🚛', price: 750000 },
      { id: 9, name: 'Capitainerie', icon: '⚓', price: 1000000 },
      { id: 10, name: 'Phare', icon: '🗼', price: 1000000 },
      { id: 11, name: 'Hangar Principal', icon: '🏭', price: 1500000 },
      { id: 12, name: 'Port Complet', icon: '👑', price: 5000000 }
    ];

    async function loadJoliette() {
      if (!userId) {
        window.location.href = 'index.html';
        return;
      }

      const { data: progressArray } = await supabaseClient
        .from('game_progress')
        .select('*')
        .eq('user_id', userId);

      const playerData = progressArray?.[0];

      if (!playerData) {
        alert('Erreur de chargement');
        window.location.href = 'game.html';
        return;
      }

      const contentArea = document.getElementById('contentArea');

      // Si niveau < 100, afficher le message verrouillé
      if (playerData.level < 100) {
        contentArea.innerHTML = `
          <div class="locked-message">
            <div class="lock-icon">🔒</div>
            <div class="lock-title">ZONE VERROUILLÉE</div>
            <div class="lock-text">
              Atteignez le Niveau 100 (Directeur de Compagnie) pour débloquer La Joliette<br><br>
              Niveau actuel : ${playerData.level}<br>
              Niveau requis : 100
            </div>
          </div>
        `;
        return;
      }

      // Récupérer les zones possédées (à implémenter dans la BDD plus tard)
      const ownedZones = []; // Pour l'instant vide
      const controlPercentage = Math.round((ownedZones.length / zones.length) * 100);

      // Afficher le contenu débloqué
      contentArea.innerHTML = `
        <div class="port-status">
          <div class="port-icon">🚢</div>
          <div class="port-percentage">${controlPercentage}%</div>
          <div class="port-label">Contrôle du Port</div>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon">🏗️</div>
            <div class="stat-value">${ownedZones.length}/12</div>
            <div class="stat-label">Zones</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">💰</div>
            <div class="stat-value">${formatMoney(playerData.money)}</div>
            <div class="stat-label">Budget</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">📈</div>
            <div class="stat-value">0€/h</div>
            <div class="stat-label">Revenus</div>
          </div>
        </div>

        <div class="section">
          <h2 class="section-title">🏗️ Zones Disponibles</h2>
          <div class="zones-grid" id="zonesGrid"></div>
        </div>

        <div class="section">
          <h2 class="section-title">💎 Avantages du Contrôle</h2>
          <div class="benefits-list">
            <div class="benefit-item">
              <div class="benefit-icon">💰</div>
              <div class="benefit-text">
                <div class="benefit-label">Revenus Passifs</div>
                <div class="benefit-value">+100€/h par zone possédée</div>
              </div>
            </div>
            <div class="benefit-item">
              <div class="benefit-icon">⚡</div>
              <div class="benefit-text">
                <div class="benefit-label">Bonus XP</div>
                <div class="benefit-value">+50% XP sur tous les contrats</div>
              </div>
            </div>
            <div class="benefit-item">
              <div class="benefit-icon">🏆</div>
              <div class="benefit-text">
                <div class="benefit-label">Prestige</div>
                <div class="benefit-value">Affichage spécial dans le classement</div>
              </div>
            </div>
            <div class="benefit-item">
              <div class="benefit-icon">⚔️</div>
              <div class="benefit-text">
                <div class="benefit-label">Combat PvP</div>
                <div class="benefit-value">Défis contre d'autres directeurs</div>
              </div>
            </div>
          </div>
        </div>
      `;

      renderZones(ownedZones, playerData.money);
    }

    function renderZones(ownedZones, playerMoney) {
      const grid = document.getElementById('zonesGrid');
      if (!grid) return;

      grid.innerHTML = '';

      zones.forEach(zone => {
        const isOwned = ownedZones.includes(zone.id);
        const canAfford = playerMoney >= zone.price;

        const div = document.createElement('div');
        div.className = `zone-card ${isOwned ? 'owned' : (canAfford ? 'available' : '')}`;
        
        div.innerHTML = `
          <div class="zone-icon">${zone.icon}</div>
          <div class="zone-name">${zone.name}</div>
          ${isOwned ? 
            '<div class="zone-status">✓ POSSÉDÉ</div>' : 
            `<div class="zone-price">${formatMoney(zone.price)}</div>`
          }
        `;

        if (!isOwned && canAfford) {
          div.onclick = () => buyZone(zone);
        }

        grid.appendChild(div);
      });
    }

    async function buyZone(zone) {
      if (!confirm(`Acheter ${zone.name} pour ${formatMoney(zone.price)} ?`)) return;

      // À implémenter : logique d'achat
      alert('🚧 Fonctionnalité en développement\n\nL\'achat de zones sera disponible dans une prochaine version !');
    }

    function formatMoney(amount) {
      return amount.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + '€';
    }

    loadJoliette();
  </script>
</body>
</html>
