const al=n=>{const v=Math.sin(n*12.9898)*43758.5453;return v-Math.floor(v);};
function ctx(id){const c=document.getElementById(id),g=c.getContext('2d');g.imageSmoothingEnabled=false;

/* ---------- UN CONTENEUR, vu de trois quarts, en pixel fin ---------- */
function conteneur(R,g,x,y,L,h,k,seed,ouvert){
  const C=CT[k]||CT.G, prof=Math.round(h*0.42);
  /* la face de côté, nervurée */
  for(let i=0;i<L;i+=3){
    const n=al(x+i*0.7+seed);
    R(x+i,y,1.6,h,n<.5?C[1]:C[3]);
    R(x+i+1.6,y,1.4,h,C[0]);}
  /* le bandeau haut et bas */
  R(x,y,L,2.4,C[2]);R(x,y+h-3,L,3,C[3]);
  /* les coins renforcés */
  R(x,y,2.6,h,C[3]);R(x+L-2.6,y,2.6,h,C[3]);
  R(x,y,2.6,3,'#3a3f46');R(x+L-2.6,y,2.6,3,'#3a3f46');
  R(x,y+h-3,2.6,3,'#3a3f46');R(x+L-2.6,y+h-3,2.6,3,'#3a3f46');
  /* le dessus, en perspective */
  g.fillStyle=C[2];g.beginPath();g.moveTo(x,y);g.lineTo(x+prof*0.7,y-prof);g.lineTo(x+L+prof*0.7,y-prof);g.lineTo(x+L,y);g.closePath();g.fill();
  g.fillStyle='rgba(255,255,255,.10)';g.beginPath();g.moveTo(x+2,y-1);g.lineTo(x+prof*0.7+2,y-prof+1);g.lineTo(x+L-2,y-prof+1);g.lineTo(x+L-4,y-1);g.closePath();g.fill();
  for(let i=4;i<L;i+=7)R(x+i+prof*0.35,y-prof*0.5,3,1,'rgba(0,0,0,.12)');
  /* la face avant : portes ou marquage */
  if(ouvert){
    R(x+L-1,y,3,h,C[3]);
  }
  /* le marquage au pochoir */
  const nom=['MSC','CMA','MRK','EVG','ONE','HPL'][Math.floor(al(seed*3)*6)];
  g.font='700 5px Georgia';g.fillStyle='rgba(245,240,228,.72)';
  g.fillText(nom,x+5,y+h*0.42);
  g.font='700 3.2px Arial';g.fillStyle='rgba(245,240,228,.5)';
  g.fillText(String(Math.floor(al(seed*7)*900000)+100000),x+5,y+h*0.42+5);

  for(let i=0;i<5;i++){const px=x+2+al(seed+i)*(L-6);
    R(px,y+3+al(i)*4,1.4,h*0.5*al(i*3),'rgba(122,70,30,.30)');}
  for(let i=0;i<3;i++)R(x+al(seed*i+1)*L,y+h-8,3,2,'rgba(40,34,28,.3)');
}
/* ---------- LE PORTIQUE ---------- */
function portique(R,g,x,solY,ech,chariot,charge){

  /* les quatre jambes, en treillis */
  [[-1,0],[1,0]].forEach(([s])=>{
    const jx=x+s*L0*0.42;
    R(jx-3,solY-H0,6,H0,M);R(jx-3,solY-H0,2,H0,Mc);R(jx+1.4,solY-H0,1.6,H0,Mo);
    for(let yy=solY-H0+8;yy<solY-6;yy+=11){

      g.beginPath();g.moveTo(jx+3,yy);g.lineTo(jx-3,yy+9);g.stroke();}
    /* le boggie */
    R(jx-7,solY-8,14,8,A);R(jx-7,solY-8,14,2,'#5d636d');
    for(let i=0;i<3;i++){g.fillStyle='#2a2e34';g.beginPath();g.arc(jx-4+i*4,solY,2.2,0,7);g.fill();}});
  /* la poutre principale, avec son porte-à-faux vers la mer */
  const py=solY-H0;
  R(x-L0*0.72,py-9,L0*1.5,9,M);R(x-L0*0.72,py-9,L0*1.5,2.4,Mc);R(x-L0*0.72,py-2,L0*1.5,2,Mo);
  for(let i=0;i<L0*1.5;i+=9){g.strokeStyle=Mo;g.lineWidth=1;
    g.beginPath();g.moveTo(x-L0*0.72+i,py-9);g.lineTo(x-L0*0.72+i+7,py);g.stroke();}
  /* les haubans et le pylône */
  R(x-2,py-34,5,26,M);R(x-2,py-34,2,26,Mc);
  g.strokeStyle='#9aa0a8';g.lineWidth=1.2;
  g.beginPath();g.moveTo(x,py-34);g.lineTo(x-L0*0.70,py-8);g.stroke();
  g.beginPath();g.moveTo(x,py-34);g.lineTo(x+L0*0.74,py-8);g.stroke();
  /* la cabine du grutier */
  R(x-L0*0.30,py+1,17,12,A);R(x-L0*0.30+1,py+2,15,7,'#9fd0dc');R(x-L0*0.30+1,py+2,15,2,'#c8e8f0');
  R(x-L0*0.30,py+12,17,2,'#2a2e34');
  /* le chariot et le palonnier */
  const cx=x+chariot*L0*0.66;
  R(cx-9,py+1,18,6,A);R(cx-9,py+1,18,1.6,'#5d636d');
  g.strokeStyle='#9aa0a8';g.lineWidth=1;
  const ly=py+9+charge*70*ech;
  g.beginPath();g.moveTo(cx-6,py+7);g.lineTo(cx-6,ly);g.stroke();
  g.beginPath();g.moveTo(cx+6,py+7);g.lineTo(cx+6,ly);g.stroke();
  R(cx-13,ly,26,4,'#e8ba2a');R(cx-13,ly,26,1.4,'#f6d96a');
  R(cx-13,ly+4,3,3,A);R(cx+10,ly+4,3,3,A);
  /* le conteneur suspendu */
  if(charge>0.02){conteneur(R,g,cx-19,ly+7,38,13,'B',7,false);}
}
