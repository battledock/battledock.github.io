<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Événement Flash - Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&family=Caveat:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; -webkit-font-smoothing:antialiased; }
  body { font-family:'Inter',sans-serif; background:#070b18; color:#e7ecff; min-height:100dvh; padding:0 14px 30px; overflow-x:hidden; }
  .bg { position:fixed; inset:0; z-index:0; pointer-events:none; background:
      radial-gradient(120% 60% at 50% -5%, rgba(99,102,241,0.28), transparent 60%),
      radial-gradient(80% 50% at 80% 20%, rgba(250,204,21,0.10), transparent 60%),
      linear-gradient(180deg,#11183a,#0a0f24 55%,#05080f); }
  .wrap { position:relative; z-index:1; max-width:540px; margin:0 auto; }
  .hdr { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px; padding:14px 4px;
    background:linear-gradient(180deg,#0a0f24,rgba(10,15,36,0.85)); backdrop-filter:blur(8px); }
  .hdr-back { background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.14); color:#fff; width:38px; height:38px; border-radius:11px; font-size:18px; cursor:pointer; flex-shrink:0; }
  .hdr-title { flex:1; font-family:'Bebas Neue',sans-serif; font-size:23px; letter-spacing:2px;
    background:linear-gradient(135deg,#facc15,#fde68a,#818cf8); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }

  .card { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.09); border-radius:16px; padding:16px; margin-bottom:12px; }

  /* JEFF intro */
  .jeff { display:flex; gap:12px; align-items:flex-start; background:linear-gradient(160deg,rgba(249,115,22,0.12),rgba(99,102,241,0.06)); border:1px solid rgba(249,115,22,0.25); border-radius:16px; padding:14px; margin-bottom:14px; }
  .jeff-ava { width:46px; height:46px; border-radius:50%; background:linear-gradient(135deg,#f97316,#fb923c); display:flex; align-items:center; justify-content:center; font-size:24px; flex-shrink:0; }
  .jeff-txt { font-family:'Caveat',cursive; font-weight:700; font-size:18px; line-height:1.3; color:#fed7aa; }

  /* FLASH actif */
  .flash { text-align:center; padding:26px 16px; border-radius:20px; position:relative; overflow:hidden;
    background:linear-gradient(160deg,rgba(250,204,21,0.16),rgba(99,102,241,0.12)); border:1px solid rgba(250,204,21,0.4);
    box-shadow:0 0 0 1px rgba(250,204,21,0.18), 0 12px 40px rgba(99,102,241,0.2); }
  .flash-bolt { font-size:60px; filter:drop-shadow(0 0 14px rgba(250,204,21,0.7)); animation:pulse 1.4s infinite; }
  @keyframes pulse { 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.12); } }
  .flash-name { font-family:'Bebas Neue',sans-serif; font-size:30px; letter-spacing:1px; color:#fde68a; margin:6px 0 2px; }
  .flash-desc { font-size:13px; color:rgba(255,255,255,0.65); margin-bottom:16px; line-height:1.5; }
  .flash-loot { font-family:'Bebas Neue',sans-serif; font-size:15px; color:#a5b4fc; letter-spacing:1px; margin-bottom:14px; }

  .cd { text-align:center; padding:30px 16px; }
  .cd-lbl { font-size:12px; letter-spacing:1px; text-transform:uppercase; color:rgba(255,255,255,0.45); }
  .cd-time { font-family:'Bebas Neue',sans-serif; font-size:52px; letter-spacing:2px; color:#818cf8; margin:6px 0; }
  .cd-sub { font-size:13px; color:rgba(255,255,255,0.5); }

  .btn { width:100%; border:none; border-radius:14px; padding:16px; font-family:'Bebas Neue',sans-serif; font-size:19px; letter-spacing:2px; cursor:pointer;
    background:linear-gradient(135deg,#ca8a04,#facc15); color:#1a1208; }
  .btn:active{ transform:scale(0.98); } .btn:disabled{ opacity:0.4; }

  .stats-row { display:flex; gap:10px; margin-bottom:12px; }
  .stat { flex:1; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:13px; padding:12px 8px; text-align:center; }
  .stat-val { font-family:'Bebas Neue',sans-serif; font-size:24px; color:#fde68a; }
  .stat-lbl { font-size:10px; letter-spacing:0.5px; text-transform:uppercase; color:rgba(255,255,255,0.45); margin-top:2px; }
  .streak .stat-val { color:#fb923c; }

  .sect-lbl { font-size:11px; letter-spacing:1px; text-transform:uppercase; color:rgba(255,255,255,0.45); margin:18px 4px 10px; }
  .info { font-size:12.5px; color:rgba(255,255,255,0.5); line-height:1.6; }
  .loader { text-align:center; padding:60px; color:rgba(255,255,255,0.3); font-family:'Bebas Neue',sans-serif; letter-spacing:2px; }
  .back-bottom { width:100%; margin-top:18px; padding:15px; border-radius:14px; cursor:pointer;
    background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12); color:rgba(255,255,255,0.7);
    font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:2px; }
  .toast { position:fixed; top:18px; left:50%; transform:translateX(-50%) translateY(-20px); z-index:300;
    background:rgba(17,24,58,0.97); border:1px solid rgba(250,204,21,0.5); border-radius:12px; padding:11px 18px; font-size:13px; font-weight:700;
    opacity:0; transition:all .35s; max-width:90%; text-align:center; color:#fde68a; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* RUSH overlay */
  .ov { position:fixed; inset:0; z-index:250; background:linear-gradient(180deg,#11183a,#05080f); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; text-align:center; }
  .ov-title { font-family:'Bebas Neue',sans-serif; font-size:30px; letter-spacing:1px; color:#fde68a; }
  .ov-sub { font-size:13px; color:rgba(255,255,255,0.6); margin:6px 0 18px; max-width:380px; line-height:1.5; }
  .ov-money { font-family:'Bebas Neue',sans-serif; font-size:46px; color:#facc15; }
  .ov-time { font-size:14px; color:rgba(255,255,255,0.6); margin-bottom:18px; }
  .ov-btn { width:100%; max-width:420px; border:none; border-radius:18px; padding:42px 16px; font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:2px;
    background:linear-gradient(135deg,#4338ca,#818cf8); color:#fff; cursor:pointer; }
  .ov-combo { font-family:'Bebas Neue',sans-serif; font-size:20px; color:#fb923c; height:24px; margin-bottom:6px; }
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
  <div class="hdr">
    <button class="hdr-back" onclick="window.location.href='game.html'">←</button>
    <div class="hdr-title">⚡ ÉVÉNEMENT FLASH</div>
  </div>
  <div id="content"><div class="loader">CHARGEMENT…</div></div>
  <button class="back-bottom" onclick="window.location.href='game.html'">← Retour au jeu</button>
</div>
<div class="toast" id="toast"></div>

<script>
  const SB_URL = 'https://drtsuhnbclhmgfjiykap.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
  const sb = supabase.createClient(SB_URL, SB_KEY);

  const COOLDOWN_MS = 3 * 3600 * 1000; // 3h entre 2 flashs
  const FLASH_CAP = 30000; // gain max d'argent par flash
  const EVENTS = [
    { name:'Tempête de Containers', emoji:'📦', desc:"Une cargaison entière s'est renversée sur le quai. Ramasse tout avant les autres !" },
    { name:'Marée Haute', emoji:'🌊', desc:"La marée pousse des caisses à la dérive. Récupère-les tant qu'elles flottent !" },
    { name:'Rush du Cargo', emoji:'🚢', desc:"Un cargo doit repartir dans 8 secondes. Charge un max, la prime explose !" },
    { name:'Grève Éclair', emoji:'✊', desc:"Les chefs ont le dos tourné. Profite du chaos pour faire ta caisse !" },
    { name:'Inspection Surprise', emoji:'🔦', desc:"Lavagne arrive. Boucle le boulot en vitesse pour la prime de zèle !" },
  ];

  let currentUser=null, stats=null, flash={}, cdTimer=null;
  function getXpRequired(l){ if(l<=10) return l*500; if(l<=25) return l*1000; if(l<=50) return l*2000; return l*4000; }
  function todayStr(){ return new Date().toISOString().slice(0,10); }
  function pickEvent(){ const seed = Math.floor(Date.now()/COOLDOWN_MS); return EVENTS[seed % EVENTS.length]; }

  async function init(){
    const { data:{ session } } = await sb.auth.getSession();
    if(!session){ window.location.href='index.html'; return; }
    currentUser = session.user;
    const { data:gs } = await sb.from('game_stats').select('money,xp,level,diamonds,trophies,flash').eq('user_id',currentUser.id).maybeSingle();
    stats = gs || { money:0, xp:0, level:1, diamonds:0, trophies:0 };
    flash = (gs?.flash && typeof gs.flash==='object') ? gs.flash : {};
    render();
  }

  function msLeft(){
    if(!flash.lastClaim) return 0;
    return Math.max(0, COOLDOWN_MS - (Date.now() - new Date(flash.lastClaim).getTime()));
  }

  function render(){
    if(cdTimer){ clearInterval(cdTimer); cdTimer=null; }
    const left = msLeft();
    const streak = flash.streak || 0;
    const ev = pickEvent();
    let html = `
      <div class="jeff">
        <div class="jeff-ava">🧢</div>
        <div class="jeff-txt">"J'te l'avais dit ! Le port, ça suit des cycles. Quand ça flashe, faut foncer — y'a des primes que personne capte. Ouvre l'œil, ça revient toutes les 3 heures."</div>
      </div>
      <div class="stats-row">
        <div class="stat streak"><div class="stat-val">🔥 ${streak}</div><div class="stat-lbl">Série</div></div>
        <div class="stat"><div class="stat-val">${(stats.money||0).toLocaleString('fr-FR')}</div><div class="stat-lbl">Argent €</div></div>
        <div class="stat"><div class="stat-val">Nv ${stats.level||1}</div><div class="stat-lbl">Niveau</div></div>
      </div>`;

    if(left <= 0){
      const dia = 1 + (streak>=3?1:0) + (streak>=7?1:0);
      html += `
        <div class="flash">
          <div class="flash-bolt">${ev.emoji}</div>
          <div class="flash-name">${ev.name}</div>
          <div class="flash-desc">${ev.desc}</div>
          <div class="flash-loot">RÉCOMPENSE : 💰 selon ta récolte · ⭐ +5000 XP · 💎 +${dia}</div>
          <button class="btn" onclick="triggerFlash()">⚡ DÉCLENCHER L'ÉVÉNEMENT</button>
        </div>
        <div class="sect-lbl">Comment ça marche</div>
        <div class="card info">Tape le plus vite possible pendant 8 secondes. Plus tu enchaînes, plus le <b>combo</b> monte et plus la prime grossit. Reviens toutes les 3h : enchaîner les flashs fait grimper ta <b>série 🔥</b> (bonus de diamants à 3 et 7). Gain plafonné à <b>${FLASH_CAP.toLocaleString('fr-FR')} €</b> par flash.</div>`;
    } else {
      html += `
        <div class="card cd">
          <div class="cd-lbl">Prochain flash dans</div>
          <div class="cd-time" id="cdTime">--:--:--</div>
          <div class="cd-sub">${ev.emoji} Jeff prédit : « ${ev.name} »</div>
        </div>
        <div class="sect-lbl">Astuce de Jeff</div>
        <div class="card info">Les flashs tombent toutes les 3 heures. Rate-en pas trop d'affilée ou ta série 🔥 repart à zéro. Au-delà de 36h sans flash, le compteur de série se remet à 1.</div>`;
    }
    document.getElementById('content').innerHTML = html;

    if(left > 0){
      const upd = () => {
        const l = msLeft();
        if(l <= 0){ render(); return; }
        const h = Math.floor(l/3600000), m = Math.floor(l%3600000/60000), s = Math.floor(l%60000/1000);
        const el = document.getElementById('cdTime');
        if(el) el.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      };
      upd(); cdTimer = setInterval(upd, 1000);
    }
  }

  function triggerFlash(){
    const ev = pickEvent();
    const ov = document.createElement('div'); ov.className='ov';
    ov.innerHTML = `
      <div class="ov-title">${ev.emoji} ${ev.name}</div>
      <div class="ov-sub">${ev.desc}</div>
      <div class="ov-combo" id="ovCombo"></div>
      <div class="ov-money" id="ovMoney">0 €</div>
      <div class="ov-time" id="ovTime">8.0 s</div>
      <button class="ov-btn" id="ovBtn">⚡ RÉCOLTER</button>`;
    document.body.appendChild(ov);
    const moneyEl=ov.querySelector('#ovMoney'), timeEl=ov.querySelector('#ovTime'), comboEl=ov.querySelector('#ovCombo'), btn=ov.querySelector('#ovBtn');
    const base = Math.max(60, (stats.level||1)*12);
    let gained=0, combo=0, comboTimer=null, started=false, endT=0, raf=null;
    function tick(){
      const left = Math.max(0, endT - performance.now());
      timeEl.textContent = (left/1000).toFixed(1)+' s';
      if(left <= 0){ btn.disabled=true; clearTimeout(comboTimer); finishRush(ov, gained); return; }
      raf = requestAnimationFrame(tick);
    }
    btn.onpointerdown = (e) => {
      e.preventDefault();
      if(!started){ started=true; endT=performance.now()+8000; tick(); }
      combo = Math.min(combo+1, 30);
      const mult = 1 + combo*0.07; // jusqu'à ~x3
      gained = Math.min(gained + Math.round(base * mult), FLASH_CAP);
      moneyEl.textContent = gained.toLocaleString('fr-FR')+' €';
      comboEl.textContent = combo>3 ? ('COMBO x'+mult.toFixed(1)) : '';
      btn.style.transform='scale(0.97)'; setTimeout(()=>btn.style.transform='',50);
      clearTimeout(comboTimer); comboTimer=setTimeout(()=>{ combo=0; comboEl.textContent=''; }, 600);
    };
  }

  async function finishRush(ov, gained){
    const streakOld = flash.streak || 0;
    const last = flash.lastClaim ? new Date(flash.lastClaim).getTime() : 0;
    const within = last && (Date.now() - last) < 36*3600*1000;
    const streak = within ? streakOld + 1 : 1;
    const dia = 1 + (streak>=3?1:0) + (streak>=7?1:0);
    const bonusXp = 5000;
    // Créditer (relecture fraîche)
    let credited = false;
    try {
      const { data:fresh } = await sb.from('game_stats').select('money,xp,level,diamonds').eq('user_id',currentUser.id).maybeSingle();
      let nMoney=(fresh?.money||0)+gained, nXp=(fresh?.xp||0)+bonusXp, nLvl=fresh?.level||1, nDia=(fresh?.diamonds||0)+dia;
      while(nXp >= getXpRequired(nLvl)){ nXp -= getXpRequired(nLvl); nLvl++; }
      const newFlash = { lastClaim:new Date().toISOString(), streak, lastDay:todayStr() };
      await sb.from('game_stats').update({ money:nMoney, xp:nXp, level:nLvl, diamonds:nDia, flash:newFlash }).eq('user_id',currentUser.id);
      stats.money=nMoney; stats.xp=nXp; stats.level=nLvl; stats.diamonds=nDia; flash=newFlash;
      credited = true;
    } catch(e){ console.log('flash credit:', e); }

    ov.innerHTML = `
      <div class="ov-title">⚡ FLASH TERMINÉ</div>
      <div style="font-size:54px;margin:10px 0">🎉</div>
      <div class="ov-money">+${gained.toLocaleString('fr-FR')} €</div>
      <div style="font-family:'Bebas Neue',sans-serif;font-size:20px;color:#a5b4fc;letter-spacing:1px;margin-top:6px">⭐ +${bonusXp} XP · 💎 +${dia}</div>
      <div style="font-family:'Bebas Neue',sans-serif;font-size:18px;color:#fb923c;margin-top:8px">🔥 Série ${streak}</div>
      ${credited?'':'<div style="color:#f87171;font-size:12px;margin-top:8px">Erreur de sauvegarde, réessaie.</div>'}
      <button class="ov-btn" style="margin-top:22px;padding:16px;background:linear-gradient(135deg,#ca8a04,#facc15);color:#1a1208" onclick="this.closest('.ov').remove(); render();">Continuer →</button>`;
  }

  let toastT;
  function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show'; clearTimeout(toastT); toastT=setTimeout(()=>t.className='toast',2600); }

  init();
</script>
</body>
</html>
