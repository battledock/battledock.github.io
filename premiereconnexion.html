<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Battle Dock — Enregistrement</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Space+Grotesk:wght@500;700;900&family=Bungee&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  
  <style>
    :root {
      --port-dark: #0f172a;
      --port-blue: #2563eb;
      --comic-yellow: #facc15;
      --comic-red: #ef4444;
      --comic-green: #22c55e;
      --border-thick: 4px solid #000000;
      --shadow-comic: 8px 8px 0px #000000;
      --shadow-comic-sm: 4px 4px 0px #000000;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--comic-yellow); 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
    }

    .dock-container {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border: var(--border-thick);
      border-radius: 24px;
      box-shadow: var(--shadow-comic);
      overflow: hidden;
    }

    .tabs-wrapper {
      display: flex;
      background: var(--port-dark);
      border-bottom: var(--border-thick);
    }

    .tab-badge {
      flex: 1;
      background: var(--comic-red); 
      color: #ffffff; 
      font-family: 'Bangers', cursive; 
      font-size: 24px;
      padding: 14px 8px;
      text-align: center;
      letter-spacing: 1.5px;
    }

    .form-content {
      padding: 24px;
    }

    /* ZONE AVATAR : RETOUR AUX DIMENSIONS PARFAITES */
    .avatar-preview-zone {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    .suit-avatar {
      width: 100px;
      height: 115px;
      background: #ff007f; /* Teinte par défaut */
      border: var(--border-thick);
      border-radius: 10px;
      box-shadow: var(--shadow-comic-sm);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s ease;
    }

    .suit-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* TYPOGRAPHIE & CONTENEURS */
    .section-headline {
      font-family: 'Bungee', sans-serif;
      font-size: 12px;
      color: var(--port-dark);
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .input-group { 
      margin-bottom: 24px; 
      background: #f8fafc;
      border: 2px solid #000000;
      padding: 14px;
      border-radius: 16px;
    }

    /* PALETTE DE 10 COULEURS ORIGINALES */
    .color-picker-grid-10 {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    .color-btn {
      aspect-ratio: 1;
      width: 100%;
      border: 2px solid #000000;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 2px 2px 0px #000;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .color-btn.active {
      transform: scale(0.9) translate(1px, 1px);
      box-shadow: 0px 0px 0px #000;
      border-width: 3px;
    }

    .action-zone {
      margin-top: 16px;
    }
    
    .submit-lever-btn {
      width: 100%;
      padding: 16px;
      font-family: 'Bangers', cursive;
      font-size: 24px;
      color: white;
      background: var(--comic-green);
      border: var(--border-thick);
      border-radius: 14px;
      cursor: pointer;
      box-shadow: var(--shadow-comic-sm);
    }

    .submit-lever-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px #000;
    }

    .speech-bubble {
      background: white;
      border: var(--border-thick);
      border-radius: 12px;
      padding: 12px;
      font-weight: 700;
      font-size: 13px;
      color: var(--comic-red);
      margin-top: 16px;
      box-shadow: var(--shadow-comic-sm);
      display: none;
    }
  </style>
</head>
<body>

  <div class="dock-container">
    <div class="tabs-wrapper">
      <div class="tab-badge" id="playerTabMatricule">PROFIL DE LA RECRUE</div>
    </div>

    <div class="form-content">
      
      <div class="avatar-preview-zone">
        <div class="suit-avatar" id="diverSuit">
          <img id="badgeAvatarImg" src="notionists-1779298466584.png" alt="Avatar Docker">
        </div>
      </div>

      <div class="input-group">
        <div class="section-headline">🎨 Teinte de fond de l'avatar :</div>
        <div class="color-picker-grid-10">
          <button class="color-btn active" style="background: #ff007f;" title="Cyber Rose" onclick="selectSuitColor('#ff007f', this)"></button>
          <button class="color-btn" style="background: #00f0ff;" title="Bleu Éon" onclick="selectSuitColor('#00f0ff', this)"></button>
          <button class="color-btn" style="background: #ccff00;" title="Limon Acide" onclick="selectSuitColor('#ccff00', this)"></button>
          <button class="color-btn" style="background: #ff5500;" title="Magma Éruptif" onclick="selectSuitColor('#ff5500', this)"></button>
          <button class="color-btn" style="background: #bf55ec;" title="Violet Néon" onclick="selectSuitColor('#bf55ec', this)"></button>
          <button class="color-btn" style="background: #4ecdc4;" title="Menthe Polaire" onclick="selectSuitColor('#4ecdc4', this)"></button>
          <button class="color-btn" style="background: #ffbe0b;" title="Jaune Toxique" onclick="selectSuitColor('#ffbe0b', this)"></button>
          <button class="color-btn" style="background: #1a1a2e;" title="Abysse Spatial" onclick="selectSuitColor('#1a1a2e', this)"></button>
          <button class="color-btn" style="background: #ff9f1c;" title="Mandarine Vintage" onclick="selectSuitColor('#ff9f1c', this)"></button>
          <button class="color-btn" style="background: #8338ec;" title="Trou Noir" onclick="selectSuitColor('#8338ec', this)"></button>
        </div>
      </div>

      <div class="action-zone">
        <button class="submit-lever-btn" id="btnMainAction" onclick="validateAndPrintBadge()">VALIDER MON PROFIL ET EMBAUCHER 🏗️</button>
      </div>

      <div class="speech-bubble" id="errorBubble"></div>

    </div>
  </div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const supabaseClient = createClient(supabaseUrl, supabaseKey);

    const userId = localStorage.getItem('userId');
    const username = localStorage.getItem('username') || 'Recrue';
    
    let chosenColor = '#ff007f';

    if (!userId) window.location.href = 'index.html';

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById('playerTabMatricule').textContent = `RECRUE : ${username.toUpperCase()}`;
    });

    function selectSuitColor(color, btn) {
      chosenColor = color;
      document.getElementById('diverSuit').style.backgroundColor = color;
      document.querySelectorAll('.color-picker-grid-10 .color-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    async function validateAndPrintBadge() {
      const errorBubble = document.getElementById('errorBubble');
      const mainBtn = document.getElementById('btnMainAction');

      try {
        const { error } = await supabaseClient
          .from('game_progress')
          .update({ rank: `Docker Occasionnel` })
          .eq('user_id', userId);

        if (error) throw error;

        localStorage.setItem('userColor', chosenColor);
        localStorage.setItem('userFace', 'notionists-1779298466584.png');

        mainBtn.textContent = "PROFIL ENREGISTRÉ, REDIRECTION...";
        mainBtn.style.background = 'var(--port-blue)';
        
        setTimeout(() => {
          window.location.href = 'game.html';
        }, 1100);

      } catch (err) {
        errorBubble.innerHTML = `🚨 MATRICULE REJETÉ :<br>"${err.message}"`;
        errorBubble.style.display = 'block';
      }
    }
  </script>
</body>
</html>
