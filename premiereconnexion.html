<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Battle Dock — Recrutement</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Permanent+Marker&family=Space+Grotesk:wght@500;700;900&family=Bungee&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  
  <style>
    :root {
      --port-dark: #0f172a;
      --port-blue: #2563eb;
      --comic-yellow: #facc15;
      --comic-red: #ef4444;
      --comic-green: #22c55e;
      --border-thick: 4px solid #000000;
      --shadow-comic: 8px 8px 0px #000000;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 50%, #3b82f6 100%);
      min-height: 100vh;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0;
      overflow: hidden;
      margin: 0;
    }

    .header-container {
      text-align: center;
      margin-bottom: 16px;
      z-index: 10;
      width: 100%;
      padding: 0 16px;
      flex-shrink: 0;
    }

    .main-title {
      font-family: 'Bangers', cursive;
      font-size: clamp(2.5rem, 10vw, 4rem);
      color: var(--comic-yellow);
      letter-spacing: 4px;
      text-shadow: 6px 6px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000;
      line-height: 0.9;
      transform: rotate(-2deg);
      display: inline-block;
      margin-bottom: 4px;
    }

    .subtitle {
      font-family: 'Permanent Marker', cursive;
      font-size: clamp(0.8rem, 2.5vw, 0.95rem);
      color: #ffffff;
      text-shadow: 3px 3px 0px var(--port-dark);
      letter-spacing: 1px;
    }

    .container {
      width: 100%;
      max-width: 540px;
      background: #e2e8f0;
      border: var(--border-thick);
      border-radius: 20px;
      box-shadow: var(--shadow-comic);
      height: 420px;
      display: flex;
      flex-direction: column;
      margin: 0 16px;
      flex-shrink: 0;
      overflow: hidden;
    }

    .content {
      background: #f3f4f6;
      padding: 20px 20px;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .section {
      display: none;
    }

    .section.active {
      display: flex;
      flex-direction: column;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .section-title {
      font-family: 'Bangers', cursive;
      font-size: 20px;
      color: var(--port-dark);
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    .avatars-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .avatar-btn {
      width: 100%;
      aspect-ratio: 1;
      border: 4px solid #000000;
      border-radius: 12px;
      background: white;
      cursor: pointer;
      transition: all 0.15s ease;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px #000000;
    }

    .avatar-btn.selected {
      background: var(--comic-yellow);
      box-shadow: 8px 8px 0px #000000;
    }

    .input-group {
      margin-bottom: 14px;
    }

    .input-group label {
      display: block;
      font-weight: 900;
      font-size: 12px;
      color: var(--port-dark);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .input-group input, .input-group select {
      width: 100%;
      padding: 10px 12px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 14px;
      color: var(--port-dark);
      background: #ffffff;
      border: 4px solid #000000;
      border-radius: 8px;
      box-shadow: 3px 3px 0px #000000;
    }

    .game-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: white;
      border: 4px solid #000000;
      border-radius: 12px;
      padding: 16px;
      position: relative;
      overflow: hidden;
    }

    .game-title {
      font-family: 'Bungee', sans-serif;
      font-size: 16px;
      color: var(--comic-red);
      text-transform: uppercase;
      margin-bottom: 12px;
      text-align: center;
    }

    .game-canvas {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .clickable {
      position: absolute;
      cursor: pointer;
      transition: all 0.1s ease;
    }

    .clickable:hover {
      transform: scale(1.1);
    }

    .progress-bar {
      width: 100%;
      height: 20px;
      background: #cbd5e1;
      border: 2px solid #000000;
      border-radius: 10px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--comic-green), var(--comic-yellow));
      transition: width 0.3s ease;
    }

    .button {
      background: var(--comic-red);
      color: white;
      border: 4px solid #000000;
      border-radius: 10px;
      padding: 12px 24px;
      font-family: 'Bungee', sans-serif;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 6px 6px 0px #000000;
      transition: all 0.15s ease;
      width: 100%;
      margin-top: auto;
      border-bottom: none;
    }

    .button:hover {
      transform: translate(-2px, -2px);
      box-shadow: 8px 8px 0px #000000;
    }

    .button:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #000000;
    }

    .footer-stamp {
      margin-top: 12px;
      font-size: 9px;
      color: #ffffff;
      text-align: center;
      max-width: 540px;
      line-height: 1.3;
      padding: 0 16px;
      flex-shrink: 0;
    }

    .error-popup {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #e2e8f0;
      border: var(--border-thick);
      border-radius: 20px;
      padding: 32px 28px;
      max-width: 420px;
      width: 90%;
      box-shadow: var(--shadow-comic);
      z-index: 1000;
      animation: popupAppear 0.3s ease-out;
    }

    .error-popup.show {
      display: block;
    }

    @keyframes popupAppear {
      from { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    .error-popup-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 999;
    }

    .error-popup-overlay.show {
      display: block;
    }

    .error-popup-title {
      font-family: 'Bangers', cursive;
      font-size: 28px;
      color: var(--comic-red);
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .error-popup-message {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px;
      color: var(--port-dark);
      margin-bottom: 24px;
      line-height: 1.6;
      font-weight: 600;
    }

    .error-popup-btn {
      background: var(--comic-red);
      color: white;
      border: var(--border-thick);
      border-radius: 12px;
      padding: 14px 28px;
      font-family: 'Bungee', sans-serif;
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: var(--shadow-comic);
      transition: all 0.15s ease;
      width: 100%;
      border-bottom: none;
    }

    .error-popup-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 8px 8px 0px #000000;
    }

    .score-display {
      font-family: 'Bungee', sans-serif;
      font-size: 18px;
      color: var(--comic-red);
      text-align: center;
      margin-bottom: 12px;
    }

    .quote-display {
      font-family: 'Permanent Marker', cursive;
      font-size: 13px;
      color: var(--port-dark);
      text-align: center;
      line-height: 1.5;
      margin-bottom: 16px;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="header-container">
    <div class="main-title">BATTLE DOCK</div>
    <div class="subtitle">Recrutement en cours...</div>
  </div>

  <div class="container">
    <div class="content">
      <!-- SECTION 1: Présentation -->
      <div class="section active" id="secPresentation">
        <div class="section-title">Bienvenue Docker!</div>
        <p style="font-size: 13px; color: var(--port-dark); line-height: 1.5; margin-bottom: 12px;">
          Vous venez de postuler, veuillez remplir les informations et réussir notre nouvelle session de tests !
        </p>
        <button class="button" onclick="nextSection()">COMMENCER</button>
      </div>

      <!-- SECTION 2: Choix Avatar -->
      <div class="section" id="secAvatar">
        <div class="section-title">Choisir votre look</div>
        <div class="avatars-grid" id="avatarsGrid"></div>
        <button class="button" onclick="nextSection()" id="btnAvatar" disabled>SUIVANT</button>
      </div>

      <!-- SECTION 3: Infos -->
      <div class="section" id="secInfos">
        <div class="section-title">Vos infos</div>
        <div class="input-group">
          <label>⚓ Nom du bateau</label>
          <input type="text" id="shipName" placeholder="ex: La Sardine" required>
        </div>
        <div class="input-group">
          <label>🏋️ Spécialité</label>
          <select id="specialty" required>
            <option value="">-- Choisir --</option>
            <option value="manutention">Manutention</option>
            <option value="pilotage">Pilotage</option>
            <option value="chargement">Chargement</option>
            <option value="dechargement">Déchargement</option>
            <option value="surveillance">Surveillance</option>
          </select>
        </div>
        <button class="button" onclick="startGames()" id="btnInfos" disabled>COMMENCER LES TESTS</button>
      </div>

      <!-- SECTION 4: Jeux -->
      <div class="section" id="secGame">
        <div style="width: 100%; flex: 1; display: flex; flex-direction: column;">
          <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <div class="game-area" id="gameArea">
            <div class="game-title" id="gameTitle">Jeu 1/5</div>
            <div class="game-canvas" id="gameCanvas"></div>
          </div>
          <div style="font-size: 12px; color: var(--port-dark); text-align: center; margin-top: 8px;">
            Score: <span id="currentScore" style="font-weight: 900;">0</span>/100
          </div>
        </div>
      </div>

      <!-- SECTION 5: Résultats -->
      <div class="section" id="secResult">
        <div class="section-title">Recrutement Réussi!</div>
        <div class="score-display" id="finalScore"></div>
        <div class="quote-display" id="finalQuote"></div>
        <button class="button" onclick="goToGame()">ALLER AU JEU</button>
      </div>
    </div>
  </div>

  <div class="footer-stamp">Battle Dock — Recrutement des Dockers de Marseille</div>

  <div class="error-popup-overlay" id="errorOverlay"></div>
  <div class="error-popup" id="errorPopup">
    <div class="error-popup-title">ERREUR</div>
    <div class="error-popup-message" id="errorMessage"></div>
    <button class="error-popup-btn" onclick="closeErrorPopup()">OK</button>
  </div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const supabaseClient = createClient(supabaseUrl, supabaseKey);

    const userId = localStorage.getItem('userId');
    if (!userId) {
      window.location.href = 'index-5.html';
    }

    let currentSection = 0;
    let selectedAvatar = null;
    let totalScore = 0;
    let currentGameIndex = 0;
    let gameScores = [0, 0, 0, 0, 0];

    const sections = ['secPresentation', 'secAvatar', 'secInfos', 'secGame', 'secResult'];

    const dockerQuotes = [
      "T'es pas un docker, t'es une légende!",
      "Même les sardines te font peur maintenant!",
      "Le port te reconnaît déjà...",
      "Tu gères mieux que Cousteau!",
      "Les conteneurs t'obéissent!",
      "T'es trop fort pour le port!",
      "Les mouettes te saluent!",
      "Le Vieux-Port tremble sous tes pieds!",
      "T'es un vrai docker marseillais!",
      "Les cordes tremblent à ton approche!",
      "Tu dis adios aux conteneurs!",
      "Même la Méditerranée te respecte!",
      "T'es la légende du quai!",
      "Les autres dockers te demandent des conseils!",
      "Tu cartonnes trop fort!",
      "T'es un superdocker!",
      "Les conteneurs ont peur de toi!",
      "Tu gouvernes le port!",
      "T'es inarrêtable!",
      "Les cordes te chantent des hymnes!",
      "T'es un génie du chargement!",
      "Les cargos te font signe!",
      "T'es la star du port!",
      "Les dockers parlent de toi!",
      "T'es irrésistible!",
      "Même Cousteau t'admirait!",
      "T'es le roi du Vieux-Port!",
      "Les conteneurs te saluent!",
      "T'es un champion docker!",
      "Tu es l'enfant chéri du port!"
    ];

    function createAvatars() {
      const grid = document.getElementById('avatarsGrid');
      for (let i = 1; i <= 6; i++) {
        const btn = document.createElement('button');
        btn.className = 'avatar-btn';
        btn.innerHTML = createDockerSVG(i);
        btn.onclick = () => selectAvatar(i, btn);
        grid.appendChild(btn);
      }
    }

    function createDockerSVG(number) {
      const colors = ['#ef4444', '#3b82f6', '#22c55e', '#facc15', '#ec4899', '#f97316'];
      const color = colors[number - 1];
      const details = [
        { hat: '8', beard: 'yes' },
        { hat: '12', beard: 'no' },
        { hat: '10', beard: 'yes' },
        { hat: '6', beard: 'no' },
        { hat: '14', beard: 'yes' },
        { hat: '8', beard: 'no' }
      ];
      const d = details[number - 1];

      return `<svg width="100%" height="100%" viewBox="0 0 64 80" style="max-width: 100%;">
        <!-- Head -->
        <circle cx="32" cy="24" r="14" fill="${color}"/>
        <!-- Hat -->
        <rect x="${32-d.hat}" y="8" width="${d.hat*2}" height="6" fill="#1a1a1a" rx="1"/>
        <!-- Eyes -->
        <circle cx="27" cy="22" r="2" fill="#000"/>
        <circle cx="37" cy="22" r="2" fill="#000"/>
        ${d.beard === 'yes' ? '<rect x="26" y="30" width="12" height="3" fill="#1a1a1a" rx="1"/>' : ''}
        <!-- Body -->
        <rect x="24" y="40" width="16" height="20" fill="${color}"/>
        <!-- Arms -->
        <rect x="14" y="44" width="10" height="4" fill="${color}" rx="2"/>
        <rect x="40" y="44" width="10" height="4" fill="${color}" rx="2"/>
        <!-- Legs -->
        <rect x="26" y="62" width="4" height="10" fill="#1a1a1a"/>
        <rect x="34" y="62" width="4" height="10" fill="#1a1a1a"/>
      </svg>`;
    }

    function selectAvatar(num, btn) {
      document.querySelectorAll('.avatar-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedAvatar = num;
      document.getElementById('btnAvatar').disabled = false;
    }

    function showSection(index) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.getElementById(sections[index]).classList.add('active');
      currentSection = index;
    }

    function nextSection() {
      if (currentSection === 2) {
        if (!document.getElementById('shipName').value || !document.getElementById('specialty').value) {
          showError('Remplis tous les champs!');
          return;
        }
        document.getElementById('btnInfos').disabled = false;
      }
      if (currentSection < sections.length - 1) {
        showSection(currentSection + 1);
      }
    }

    function startGames() {
      showSection(3);
      currentGameIndex = 0;
      totalScore = 0;
      gameScores = [0, 0, 0, 0, 0];
      loadGame(0);
    }

    function loadGame(index) {
      currentGameIndex = index;
      const progress = ((index) / 5) * 100;
      document.getElementById('progressFill').style.width = progress + '%';
      document.getElementById('gameTitle').textContent = `Jeu ${index + 1}/5`;
      
      const gameCanvas = document.getElementById('gameCanvas');
      gameCanvas.innerHTML = '';

      if (index === 0) game1_AttrapeCoils(gameCanvas);
      else if (index === 1) game2_MemorySeq(gameCanvas);
      else if (index === 2) game3_SardineChallenge(gameCanvas);
      else if (index === 3) game4_Quiz(gameCanvas);
      else if (index === 4) game5_DanceDocker(gameCanvas);
    }

    function game1_AttrapeCoils(canvas) {
      let score = 0;
      let timeLeft = 10;
      const gameArea = document.getElementById('gameArea');
      gameArea.innerHTML += `<div style="font-size: 18px; font-weight: 900; color: var(--comic-red);">Temps: <span id="timer">10</span>s | Colis: <span id="coils">0</span></div>`;
      
      const timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').textContent = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          gameScores[0] = Math.min(20, score * 2);
          document.getElementById('currentScore').textContent = gameScores.reduce((a,b) => a+b, 0);
          setTimeout(() => loadGame(1), 1500);
        }
      }, 1000);

      const createCoil = () => {
        const coil = document.createElement('div');
        coil.style.position = 'absolute';
        coil.style.width = '40px';
        coil.style.height = '40px';
        coil.style.background = var(--comic-yellow);
        coil.style.border = '3px solid #000';
        coil.style.borderRadius = '8px';
        coil.style.cursor = 'pointer';
        coil.style.left = Math.random() * 200 + 'px';
        coil.style.top = Math.random() * 100 + 'px';
        coil.textContent = '📦';
        coil.style.fontSize = '24px';
        coil.style.display = 'flex';
        coil.style.alignItems = 'center';
        coil.style.justifyContent = 'center';
        coil.onclick = (e) => {
          e.stopPropagation();
          score++;
          document.getElementById('coils').textContent = score;
          coil.remove();
        };
        canvas.appendChild(coil);
        setTimeout(() => coil.remove(), 2000);
      };

      setInterval(() => {
        if (timeLeft > 0) createCoil();
      }, 600);
    }

    function game2_MemorySeq(canvas) {
      let sequence = [];
      let playerSeq = [];
      let round = 0;

      const colors = [var(--comic-red), var(--comic-green), var(--comic-yellow), var(--port-blue)];
      const buttons = [];

      for (let i = 0; i < 4; i++) {
        const btn = document.createElement('button');
        btn.style.width = '60px';
        btn.style.height = '60px';
        btn.style.background = colors[i];
        btn.style.border = var(--border-thick);
        btn.style.borderRadius = '10px';
        btn.style.cursor = 'pointer';
        btn.style.margin = '4px';
        btn.style.fontSize = '24px';
        btn.textContent = ['🔴', '🟢', '🟡', '🔵'][i];
        btn.onclick = () => playerClick(i);
        buttons.push(btn);
        canvas.appendChild(btn);
      }

      function playerClick(i) {
        playerSeq.push(i);
        buttons[i].style.transform = 'scale(0.9)';
        setTimeout(() => buttons[i].style.transform = '', 100);
        
        if (playerSeq[playerSeq.length - 1] !== sequence[playerSeq.length - 1]) {
          gameScores[1] = Math.min(20, round * 3);
          document.getElementById('currentScore').textContent = gameScores.reduce((a,b) => a+b, 0);
          setTimeout(() => loadGame(2), 1000);
          return;
        }

        if (playerSeq.length === sequence.length) {
          round++;
          playerSeq = [];
          setTimeout(addToSequence, 500);
        }
      }

      function addToSequence() {
        sequence.push(Math.floor(Math.random() * 4));
        playSequence();
      }

      function playSequence() {
        let i = 0;
        const interval = setInterval(() => {
          buttons[sequence[i]].style.transform = 'scale(1.2)';
          setTimeout(() => buttons[sequence[i]].style.transform = '', 400);
          i++;
          if (i >= sequence.length) clearInterval(interval);
        }, 600);
      }

      addToSequence();
    }

    function game3_SardineChallenge(canvas) {
      let clicks = 0;
      const target = Math.random() * 3 + 1; // Entre 1 et 4 secondes
      let started = false;
      let canClick = false;

      const msg = document.createElement('div');
      msg.style.fontSize = '20px';
      msg.style.textAlign = 'center';
      msg.style.color = var(--port-dark);
      msg.textContent = 'Attends le signal...';
      canvas.appendChild(msg);

      const sardine = document.createElement('button');
      sardine.textContent = '🐟';
      sardine.style.fontSize = '64px';
      sardine.style.border = 'none';
      sardine.style.background = 'transparent';
      sardine.style.cursor = 'pointer';
      sardine.style.marginTop = '20px';
      sardine.onclick = () => {
        if (!canClick) {
          gameScores[2] = 0;
          msg.textContent = 'Trop tôt! 💥';
          document.getElementById('currentScore').textContent = gameScores.reduce((a,b) => a+b, 0);
          setTimeout(() => loadGame(3), 1500);
        } else {
          gameScores[2] = 20;
          msg.textContent = 'Parfait! ⭐';
          document.getElementById('currentScore').textContent = gameScores.reduce((a,b) => a+b, 0);
          setTimeout(() => loadGame(3), 1500);
        }
      };
      canvas.appendChild(sardine);

      setTimeout(() => {
        msg.textContent = 'GO! Clique!';
        msg.style.color = var(--comic-red);
        canClick = true;
        setTimeout(() => {
          if (canClick) {
            gameScores[2] = 0;
            msg.textContent = 'Trop lent! ⏱️';
            canClick = false;
            document.getElementById('currentScore').textContent = gameScores.reduce((a,b) => a+b, 0);
            setTimeout(() => loadGame(3), 1500);
          }
        }, 2000);
      }, target * 1000);
    }

    function game4_Quiz(canvas) {
      const questions = [
        { q: 'Combien de sardines dans le Vieux-Port?', a: 'Toutes!' },
        { q: 'Qui est le vrai patron du port?', a: 'Toi maintenant!' },
        { q: 'Quel est le cri du docker?', a: 'ALLEEEEEZ!' }
      ];
      const q = questions[Math.floor(Math.random() * questions.length)];

      const question = document.createElement('div');
      question.style.fontSize = '16px';
      question.style.fontWeight = '900';
      question.style.textAlign = 'center';
      question.style.marginBottom = '16px';
      question.style.color = var(--port-dark);
      question.textContent = q.q;
      canvas.appendChild(question);

      const answer = document.createElement('div');
      answer.style.fontSize = '14px';
      answer.style.textAlign = 'center';
      answer.style.padding = '12px';
      answer.style.background = var(--comic-yellow);
      answer.style.border = var(--border-thick);
      answer.style.borderRadius = '8px';
      answer.style.marginBottom = '12px';
      answer.style.color = var(--port-dark);
      answer.textContent = '?';
      canvas.appendChild(answer);

      const showBtn = document.createElement('button');
      showBtn.className = 'button';
      showBtn.style.margin = '0';
      showBtn.textContent = 'Réponse';
      showBtn.onclick = () => {
        answer.textContent = q.a;
        gameScores[3] = 20;
        document.getElementById('currentScore').textContent = gameScores.reduce((a,b) => a+b, 0);
        setTimeout(() => loadGame(4), 1500);
      };
      canvas.appendChild(showBtn);
    }

    function game5_DanceDocker(canvas) {
      let sequence = [];
      let playerSeq = [];
      let moveIndex = 0;

      const moves = ['🤛', '🤜', '🙌', '🤷'];
      const moveNames = ['Punch Gauche', 'Punch Droit', 'Mains Haut', 'Shrug'];
      let round = 0;

      const display = document.createElement('div');
      display.style.fontSize = '48px';
      display.style.textAlign = 'center';
      display.style.marginBottom = '12px';
      canvas.appendChild(display);

      const buttons = [];
      for (let i = 0; i < 4; i++) {
        const btn = document.createElement('button');
        btn.style.width = '50px';
        btn.style.height = '50px';
        btn.style.margin = '4px';
        btn.style.fontSize = '24px';
        btn.style.border = var(--border-thick);
        btn.style.background = '#fff';
        btn.style.cursor = 'pointer';
        btn.style.borderRadius = '8px';
        btn.textContent = moves[i];
        btn.onclick = () => playerMove(i);
        buttons.push(btn);
        canvas.appendChild(btn);
      }

      function playerMove(i) {
        playerSeq.push(i);
        buttons[i].style.transform = 'scale(0.8)';
        setTimeout(() => buttons[i].style.transform = '', 100);

        if (playerSeq[playerSeq.length - 1] !== sequence[playerSeq.length - 1]) {
          gameScores[4] = Math.min(20, round * 2);
          document.getElementById('currentScore').textContent = gameScores.reduce((a,b) => a+b, 0);
          setTimeout(() => endOnboarding(), 1000);
          return;
        }

        if (playerSeq.length === sequence.length) {
          round++;
          playerSeq = [];
          setTimeout(addMove, 500);
        }
      }

      function addMove() {
        sequence.push(Math.floor(Math.random() * 4));
        playSequence();
      }

      function playSequence() {
        let i = 0;
        const interval = setInterval(() => {
          display.textContent = moves[sequence[i]];
          buttons[sequence[i]].style.background = var(--comic-yellow);
          setTimeout(() => buttons[sequence[i]].style.background = '#fff', 400);
          i++;
          if (i >= sequence.length) clearInterval(interval);
        }, 600);
      }

      addMove();
    }

    function endOnboarding() {
      totalScore = gameScores.reduce((a, b) => a + b, 0);
      const quoteIndex = Math.floor(totalScore / 3.33);
      const quote = dockerQuotes[Math.min(quoteIndex, dockerQuotes.length - 1)];

      document.getElementById('finalScore').textContent = `${totalScore}/100`;
      document.getElementById('finalQuote').textContent = `"${quote}"`;

      // Sauvegarder le quote en base
      supabaseClient.from('profiles').update({
        docker_quote: quote,
        avatar: selectedAvatar,
        ship_name: document.getElementById('shipName').value,
        specialty: document.getElementById('specialty').value
      }).eq('user_id', userId).then(() => {
        showSection(4);
      });
    }

    function goToGame() {
      window.location.href = 'game.html';
    }

    function showError(msg) {
      document.getElementById('errorMessage').textContent = msg;
      document.getElementById('errorPopup').classList.add('show');
      document.getElementById('errorOverlay').classList.add('show');
    }

    function closeErrorPopup() {
      document.getElementById('errorPopup').classList.remove('show');
      document.getElementById('errorOverlay').classList.remove('show');
    }

    document.getElementById('errorOverlay').addEventListener('click', closeErrorPopup);
    createAvatars();
  </script>
</body>
</html>
