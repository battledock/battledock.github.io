<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Battle Dock — Recrutement</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Space+Grotesk:wght@500;700;900&family=Bungee&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  
  <style>
    :root {
      --port-dark: #0f172a;
      --port-blue: #2563eb;
      --comic-yellow: #facc15;
      --comic-red: #ef4444;
      --comic-green: #22c55e;
      --border-thick: 4px solid #000000;
      --shadow-comic: 8px 8px 0px #000000;
      --shadow-comic-sm: 4px 4px 0px #000000;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--comic-yellow); 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
    }

    .dock-container {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border: var(--border-thick);
      border-radius: 24px;
      box-shadow: var(--shadow-comic);
      overflow: hidden;
      position: relative;
    }

    .tabs-wrapper {
      display: flex;
      background: var(--port-dark);
      border-bottom: var(--border-thick);
    }

    .tab-badge {
      flex: 1;
      background: var(--comic-red); 
      color: #ffffff; 
      font-family: 'Bangers', cursive; 
      font-size: 24px;
      padding: 14px 8px;
      text-align: center;
      letter-spacing: 1.5px;
    }

    .form-content {
      padding: 24px;
    }

    /* ZONE AVATAR CARRÉ RESPECTÉ */
    .avatar-preview-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
    }

    .suit-avatar {
      width: 100px;
      height: 115px;
      background: #3A4750;
      border: var(--border-thick);
      border-radius: 10px;
      box-shadow: var(--shadow-comic-sm);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .suit-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .color-tag-display {
      margin-top: 8px;
      font-family: 'Bungee', sans-serif;
      font-size: 12px;
      color: #ffffff;
      background: var(--port-dark);
      padding: 4px 12px;
      border: 2px solid #000;
      border-radius: 20px;
      text-transform: uppercase;
    }

    /* BLOCS D'ENTRÉE */
    .input-group { 
      margin-bottom: 16px; 
      background: #f8fafc;
      border: 2px solid #000000;
      padding: 16px;
      border-radius: 16px;
    }

    .step-title {
      font-family: 'Bungee', sans-serif;
      font-size: 11px;
      color: var(--port-dark);
      margin-bottom: 12px;
    }

    .btn-action-block {
      width: 100%;
      padding: 14px;
      font-family: 'Bungee', sans-serif;
      font-size: 13px;
      color: #000;
      background: #e2e8f0;
      border: 3px solid #000;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: var(--shadow-comic-sm);
    }
    .btn-action-block.done { background: #cbd5e1!important; color:#94a3b8!important; cursor:not-allowed; box-shadow:none; border-color:#cbd5e1; }

    /* INTERFACE POUCE DESIGN FORMAT XXL */
    .fingerprint-zone-xxl {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
    }

    .scan-pad-xxl {
      width: 90px;
      height: 90px;
      background: #1e293b;
      border: 4px solid #000;
      border-radius: 18px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
      user-select: none;
      box-shadow: var(--shadow-comic-sm);
    }

    .scan-laser {
      position: absolute;
      width: 100%;
      height: 6px;
      background: #00ffcc;
      top: 0;
      left: 0;
      display: none;
      box-shadow: 0 0 8px #00ffcc;
    }

    .scan-text-big {
      font-size: 12px;
      font-weight: 800;
      color: #334155;
      text-align: center;
      line-height: 1.4;
    }

    /* MINI-JEU : LE CALIBRATEUR DE CHARGE */
    .gauge-bar-bg {
      width: 100%;
      height: 20px;
      background: #e2e8f0;
      border: 2px solid #000;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
      margin-bottom: 12px;
    }

    .gauge-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--comic-red);
      transition: width 0.05s linear;
    }

    .gauge-target-zone {
      position: absolute;
      left: 65%;
      width: 20%;
      height: 100%;
      background: rgba(34, 197, 94, 0.4);
      border-left: 2px dashed #16a34a;
      border-right: 2px dashed #16a34a;
    }

    /* VALIDATION */
    .action-zone { margin-top: 16px; }
    .submit-lever-btn {
      width: 100%;
      padding: 16px;
      font-family: 'Bangers', cursive;
      font-size: 24px;
      color: white;
      background: #94a3b8;
      border: var(--border-thick);
      border-radius: 14px;
      cursor: not-allowed;
      box-shadow: var(--shadow-comic-sm);
    }
    .submit-lever-btn.unlocked { background: var(--comic-green); cursor: pointer; }

    /* TAMPON */
    .stamp-overlay {
      position: absolute;
      top: 30%;
      left: 10%;
      width: 80%;
      border: 6px dashed var(--comic-red);
      color: var(--comic-red);
      font-family: 'Bungee', sans-serif;
      font-size: 32px;
      text-align: center;
      padding: 8px;
      transform: rotate(-12deg) scale(3);
      opacity: 0;
      pointer-events: none;
      z-index: 99;
      background: rgba(255,255,255,0.95);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.5);
    }
    .stamp-overlay.stamped { opacity: 1; transform: rotate(-10deg) scale(1); }

    @keyframes laserMove {
      0% { top: 0; }
      50% { top: 100%; }
      100% { top: 0; }
    }
    @keyframes shake {
      0% { transform: translate(0); }
      25% { transform: translate(-2px, 2px); }
      50% { transform: translate(2px, -2px); }
      75% { transform: translate(-1px, -1px); }
      100% { transform: translate(0); }
    }
    .shake-effect { animation: shake 0.15s infinite; }
  </style>
</head>
<body>

  <div class="dock-container">
    <div class="stamp-overlay" id="finalStamp">DOCKER HOMOLOGUÉ</div>

    <div class="tabs-wrapper">
      <div class="tab-badge" id="playerTabMatricule">CONTRAT DE QUAI</div>
    </div>

    <div class="form-content">
      
      <div class="avatar-preview-zone">
        <div class="suit-avatar" id="diverSuit">
          <img id="badgeAvatarImg" src="notionists-1779298466584.png" alt="Avatar Docker">
        </div>
        <div class="color-tag-display" id="colorNameTag" style="display:none;">Inconnu</div>
      </div>

      <div class="input-group" id="groupColor">
        <div class="step-title">🎰 Étape 1 : Couleur d'Accréditation</div>
        <button class="btn-action-block" id="btnSpin" onclick="spinQuantumColor()">🎲 CHOISIR UNE NUANCE UNIQUE</button>
      </div>

      <div class="input-group" id="groupScan" style="opacity:0.3; pointer-events:none;">
        <div class="step-title">🖐️ Étape 2 : Scanner Biométrique</div>
        <div class="fingerprint-zone-xxl">
          <div class="scan-pad-xxl" id="scanPad" onmousedown="startScan()" onmouseup="stopScan()" ontouchstart="startScan()" ontouchend="stopScan()">
            <div class="scan-laser" id="laser"></div>
            <span>👍</span>
          </div>
          <div class="scan-text-big" id="scanStatusText">MAINTENEZ VOTRE POUCE ENFONCÉ POUR SCELLER VOTRE EMPREINTE...</div>
        </div>
      </div>

      <div class="input-group" id="groupLoad" style="opacity:0.3; pointer-events:none;">
        <div class="step-title">🏋️ Étape 3 : Calibrateur de Force de Levage</div>
        <div class="gauge-bar-bg">
          <div class="gauge-target-zone"></div>
          <div class="gauge-bar-fill" id="loadFill"></div>
        </div>
        <button class="btn-action-block" id="btnLoad" onclick="stopGauge()">🔴 STOP AU MAXIMUM !</button>
      </div>

      <div class="action-zone">
        <button class="submit-lever-btn" id="btnMainAction" onclick="validateAndPrintBadge()">DOSSIER INCOMPLET</button>
      </div>

    </div>
  </div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const supabaseClient = createClient(supabaseUrl, supabaseKey);

    const userId = localStorage.getItem('userId');
    const username = localStorage.getItem('username') || 'Recrue';
    
    const quantumColors = [
      { hex: '#FF0055', name: 'Rose Fusion' }, { hex: '#00FF99', name: 'Vert Radioactif' }, { hex: '#00E5FF', name: 'Bleu Plasma' }, { hex: '#BF55EC', name: 'Violet Néon' }, { hex: '#FF00AA', name: 'Cyber Néon' },
      { hex: '#3A4750', name: 'Acier Galvanisé' }, { hex: '#D4AF37', name: 'Or Brut' }, { hex: '#222831', name: 'Noir Carbone' }, { hex: '#FF9900', name: 'Ambre Industriel' }, { hex: '#FF5500', name: 'Magma Éruptif' }
    ];

    let chosenColor = null;
    let stepProgress = 0; 
    let scanTimeout;
    let scanPercent = 0;
    let gaugeInterval;
    let gaugeVal = 0;
    let gaugeDirection = 1;

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById('playerTabMatricule').textContent = `RECRUE : ${username.toUpperCase()}`;
    });

    // 1. COULEUR
    function spinQuantumColor() {
      if (stepProgress > 0) return;
      const btn = document.getElementById('btnSpin');
      const tag = document.getElementById('colorNameTag');
      btn.textContent = "ATTRIBUTION...";

      let duration = 0;
      let interval = setInterval(() => {
        let rand = quantumColors[Math.floor(Math.random() * quantumColors.length)];
        document.getElementById('diverSuit').style.backgroundColor = rand.hex;
        tag.textContent = rand.name;
        tag.style.display = 'inline-block';
        duration += 50;
        
        if (duration > 1200) {
          clearInterval(interval);
          chosenColor = rand.hex;
          btn.textContent = "NUANCE FIXÉE ✅";
          btn.classList.add('done');
          stepProgress = 1;
          
          document.getElementById('groupScan').style.opacity = '1';
          document.getElementById('groupScan').style.pointerEvents = 'auto';
        }
      }, 50);
    }

    // 2. ÉNORME POUCE
    function startScan() {
      if (stepProgress !== 1) return;
      document.getElementById('laser').style.display = 'block';
      document.getElementById('laser').style.animation = 'laserMove 0.4s linear infinite';
      document.getElementById('scanPad').classList.add('shake-effect');
      
      const details = ["Calcul de la rugosité...", "Nettoyage de la vitre...", "Analyse des phalanges...", "Extraction du potentiel..."];

      scanTimeout = setInterval(() => {
        scanPercent += 10;
        if(scanPercent > 100) scanPercent = 100;
        document.getElementById('scanStatusText').innerHTML = `⚙️ ANALYSE : ${scanPercent}%<br><span style="font-size:10px;color:#64748b;">${details[Math.floor(scanPercent/30) % details.length]}</span>`;
        
        if(scanPercent >= 100) {
          clearInterval(scanTimeout);
          document.getElementById('laser').style.display = 'none';
          document.getElementById('scanPad').classList.remove('shake-effect');
          document.getElementById('scanPad').style.background = 'var(--comic-green)';
          document.getElementById('scanStatusText').textContent = "✅ POUCE RECONNU. IDENTITÉ SCELLÉE DANS LE MARBRE.";
          document.getElementById('groupScan').style.pointerEvents = 'none';
          stepProgress = 2;
          
          // Lancer le jeu de la jauge directement
          initGauge();
        }
      }, 150);
    }

    function stopScan() {
      if(stepProgress === 1) {
        clearInterval(scanTimeout);
        scanPercent = 0;
        document.getElementById('laser').style.display = 'none';
        document.getElementById('scanPad').classList.remove('shake-effect');
        document.getElementById('scanStatusText').textContent = "❌ NUMÉRISATION COMPROMISE. Gardez la pression !";
      }
    }

    // 3. MINI JEU JAUGE DE FORCE
    function initGauge() {
      document.getElementById('groupLoad').style.opacity = '1';
      document.getElementById('groupLoad').style.pointerEvents = 'auto';
      
      gaugeInterval = setInterval(() => {
        gaugeVal += 4 * gaugeDirection;
        if(gaugeVal >= 100 || gaugeVal <= 0) gaugeDirection *= -1;
        document.getElementById('loadFill').style.width = `${gaugeVal}%`;
      }, 25);
    }

    function stopGauge() {
      if (stepProgress !== 2) return;
      clearInterval(gaugeInterval);
      
      const btn = document.getElementById('btnLoad');
      btn.classList.add('done');
      document.getElementById('groupLoad').style.pointerEvents = 'none';
      
      // Verdict selon le score (Zone verte entre 65% et 85%)
      if(gaugeVal >= 65 && gaugeVal <= 85) {
        btn.textContent = "🏋️ CAPACITÉ : GRUE HUMAINE (PARFAIT)";
      } else if (gaugeVal > 85) {
        btn.textContent = "💥 CAPACITÉ : FORCE HULK (DÉCHIRURE MUSCULAIRE)";
      } else {
        btn.textContent = "🪵 CAPACITÉ : BRAS EN MOUSSE (LÉGALE)";
      }

      stepProgress = 3;

      // SMASH DU TAMPON RETRO
      setTimeout(() => {
        document.getElementById('finalStamp').classList.add('stamped');
        
        const mainBtn = document.getElementById('btnMainAction');
        mainBtn.classList.add('unlocked');
        mainBtn.textContent = "COMMENCER L'AVENTURE";
      }, 400);
    }

    async function validateAndPrintBadge() {
      if (stepProgress < 3) return;
      const mainBtn = document.getElementById('btnMainAction');

      try {
        // CORRECTION ICI : Insertion de avatar_color et du bon nom d'image
        const { error: profileError } = await supabaseClient
          .from('profiles')
          .update({
            avatar_color: chosenColor,
            avatar: 'notionists-1779298466584.png'
          })
          .eq('user_id', userId);

        if (profileError) throw profileError;

        const { error: progressError } = await supabaseClient
          .from('game_progress')
          .update({ 
            rank: 'Docker Occasionnel',
            avatar_color: chosenColor 
          })
          .eq('user_id', userId);

        if (progressError) throw progressError;

        // CORRECTION ICI : Alignement des clés localStorage avec game.html et profil.html
        localStorage.setItem('avatarBgColor', chosenColor);
        localStorage.setItem('selectedAvatar', 'notionists-1779298466584.png');
        localStorage.setItem('username', username);

        mainBtn.textContent = "RECRUTEMENT ENREGISTRÉ...";
        mainBtn.style.background = 'var(--port-blue)';
        
        setTimeout(() => { window.location.href = 'game.html'; }, 1000);
      } catch (err) {
        alert("Erreur réseau capitainerie.");
      }
    }
  </script>
</body>
</html>
