<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Battle Dock — Attribution Chromatique Unique</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Space+Grotesk:wght@500;700;900&family=Bungee&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  
  <style>
    :root {
      --port-dark: #0f172a;
      --port-blue: #2563eb;
      --comic-yellow: #facc15;
      --comic-red: #ef4444;
      --comic-green: #22c55e;
      --border-thick: 4px solid #000000;
      --shadow-comic: 8px 8px 0px #000000;
      --shadow-comic-sm: 4px 4px 0px #000000;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--comic-yellow); 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
    }

    .dock-container {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border: var(--border-thick);
      border-radius: 24px;
      box-shadow: var(--shadow-comic);
      overflow: hidden;
    }

    .tabs-wrapper {
      display: flex;
      background: var(--port-dark);
      border-bottom: var(--border-thick);
    }

    .tab-badge {
      flex: 1;
      background: var(--comic-red); 
      color: #ffffff; 
      font-family: 'Bangers', cursive; 
      font-size: 24px;
      padding: 14px 8px;
      text-align: center;
      letter-spacing: 1.5px;
    }

    .form-content {
      padding: 24px;
    }

    /* ZONE AVATAR : CARRÉ D'ORIGINE PARFAIT */
    .avatar-preview-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 24px;
    }

    .suit-avatar {
      width: 100px;
      height: 115px;
      background: #3A4750; /* Couleur initiale neutre */
      border: var(--border-thick);
      border-radius: 10px;
      box-shadow: var(--shadow-comic-sm);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .suit-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      z-index: 2;
    }

    /* Affichage du nom de la couleur obtenue */
    .color-tag-display {
      margin-top: 12px;
      font-family: 'Bungee', sans-serif;
      font-size: 14px;
      color: #ffffff;
      background: var(--port-dark);
      padding: 6px 14px;
      border: 2px solid #000;
      border-radius: 20px;
      box-shadow: 2px 2px 0px #000;
      text-transform: uppercase;
      min-width: 160px;
      text-align: center;
    }

    /* SECTION MINI-JEU GÉNÉRATEUR */
    .input-group { 
      margin-bottom: 24px; 
      background: #f8fafc;
      border: 2px solid #000000;
      padding: 18px;
      border-radius: 16px;
      text-align: center;
    }

    .game-instruction {
      font-weight: 800;
      font-size: 13px;
      color: #475569;
      margin-bottom: 14px;
      line-height: 1.4;
    }

    .roulette-btn {
      width: 100%;
      padding: 12px;
      font-family: 'Bungee', sans-serif;
      font-size: 14px;
      color: #000;
      background: #e2e8f0;
      border: 3px solid #000;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: var(--shadow-comic-sm);
      transition: all 0.1s;
    }

    .roulette-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #000;
    }

    .roulette-btn.spinning {
      background: #94a3b8 !important;
      cursor: not-allowed;
      box-shadow: 0px 0px 0px #000;
      transform: translate(4px, 4px);
    }

    .roulette-btn.used {
      background: #cbd5e1 !important;
      color: #64748b !important;
      cursor: not-allowed;
      box-shadow: 0px 0px 0px #000;
      transform: none;
      border-color: #94a3b8;
    }

    /* VALIDATION */
    .action-zone {
      margin-top: 16px;
    }
    
    .submit-lever-btn {
      width: 100%;
      padding: 16px;
      font-family: 'Bangers', cursive;
      font-size: 24px;
      color: white;
      background: #94a3b8; /* Désactivé par défaut */
      border: var(--border-thick);
      border-radius: 14px;
      cursor: not-allowed;
      box-shadow: var(--shadow-comic-sm);
    }

    .submit-lever-btn.unlocked {
      background: var(--comic-green);
      cursor: pointer;
    }

    .submit-lever-btn.unlocked:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px #000;
    }

    .speech-bubble {
      background: white;
      border: var(--border-thick);
      border-radius: 12px;
      padding: 12px;
      font-weight: 700;
      font-size: 13px;
      color: var(--comic-red);
      margin-top: 16px;
      box-shadow: var(--shadow-comic-sm);
      display: none;
    }
  </style>
</head>
<body>

  <div class="dock-container">
    <div class="tabs-wrapper">
      <div class="tab-badge" id="playerTabMatricule">PROFIL DE LA RECRUE</div>
    </div>

    <div class="form-content">
      
      <div class="avatar-preview-zone">
        <div class="suit-avatar" id="diverSuit">
          <img id="badgeAvatarImg" src="notionists-1779298466584.png" alt="Avatar Docker">
        </div>
      </div>

      <div class="input-group">
        <p class="game-instruction">🎰 Ta nuance d'accréditation est déterminée par le Grand Ordinateur du Port. Clique pour lancer l'attribution unique !</p>
        <button class="roulette-btn" id="btnSpin" onclick="spinQuantumColor()">🎲 TIRER MA COULEUR</button>
        <div class="color-tag-display" id="colorNameTag" style="display:none;">Inconnu</div>
      </div>

      <div class="action-zone">
        <button class="submit-lever-btn" id="btnMainAction" onclick="validateAndPrintBadge()">EMBAUCHER AVEC CETTE COULEUR 🏗️</button>
      </div>

      <div class="speech-bubble" id="errorBubble"></div>

    </div>
  </div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const supabaseClient = createClient(supabaseUrl, supabaseKey);

    const userId = localStorage.getItem('userId');
    const username = localStorage.getItem('username') || 'Recrue';
    
    // Tableau massif de 50 teintes originales et stylées
    const quantumColors = [
      // Métaux & Industriel (10)
      { hex: '#3A4750', name: 'Acier Galvanisé' }, { hex: '#D4AF37', name: 'Or Brut' }, { hex: '#B87333', name: 'Cuivre Oxydé' }, { hex: '#848482', name: 'Plomb Argenté' }, { hex: '#A5A5A5', name: 'Alu Brossé' },
      { hex: '#E6E6E6', name: 'Platine Pur' }, { hex: '#7F7F7F', name: 'Fonte Grise' }, { hex: '#6C7A86', name: 'Titane Sombre' }, { hex: '#91A3B0', name: 'Ardoise Bleue' }, { hex: '#536878', name: 'Fer Forgé' },
      // Éons Néons & Cyber (10)
      { hex: '#FF0055', name: 'Rose Fusion' }, { hex: '#00FF99', name: 'Vert Radioactif' }, { hex: '#00E5FF', name: 'Bleu Plasma' }, { hex: '#BF55EC', name: 'Violet Néon' }, { hex: '#FF00AA', name: 'Cyber Néon' },
      { hex: '#CCFF00', name: 'Limon Acide' }, { hex: '#00FFFF', name: 'Cyan Électrique' }, { hex: '#FF6EFF', name: 'Rose Laser' }, { hex: '#9D00FF', name: 'Ultraviolet' }, { hex: '#00FF00', name: 'Vert Matrice' },
      // Abysses & Fret (10)
      { hex: '#222831', name: 'Noir Carbone' }, { hex: '#1A1A2E', name: 'Abysse Spatial' }, { hex: '#0B132B', name: 'Bleu Minuit' }, { hex: '#162447', name: 'Fond Marin' }, { hex: '#1B262C', name: 'Cargaison Noire' },
      { hex: '#2D4059', name: 'Bleu Pétrole' }, { hex: '#0F4C75', name: 'Fret Maritime' }, { hex: '#3282B8', name: 'Vague Électrique' }, { hex: '#003366', name: 'Bleu Marine' }, { hex: '#101820', name: 'Noir Absolu' },
      // Toxiques & Acides (10)
      { hex: '#99CC00', name: 'Poison Vert' }, { hex: '#FFCC00', name: 'Jaune Toxique' }, { hex: '#8338EC', name: 'Venin Violet' }, { hex: '#3A0CA3', name: 'Acide Sombre' }, { hex: '#4ECDC4', name: 'Menthe Polaire' },
      { hex: '#FFBE0b', name: 'Soufre Vif' }, { hex: '#2ECC71', name: 'Émeraude Chimique' }, { hex: '#E056FD', name: 'Brume Pourpre' }, { hex: '#20BF6B', name: 'Reptile Vert' }, { hex: '#8854D0', name: 'Chimère Violette' },
      // Terres de Feu & Vapeurs (10)
      { hex: '#FF9900', name: 'Ambre Industriel' }, { hex: '#FF5500', name: 'Magma Éruptif' }, { hex: '#FF9F1C', name: 'Mandarine Vintage' }, { hex: '#E0115F', name: 'Rubis Feu' }, { hex: '#FF4500', name: 'Rouge Alerte' },
      { hex: '#D35400', name: 'Rouille Vive' }, { hex: '#C0392B', name: 'Sang Industriel' }, { hex: '#B33771', name: 'Vapeur Rose' }, { hex: '#FC5C65', name: 'Corail Explosif' }, { hex: '#E74C3C', name: 'Asphalte Rouge' }
    ];

    let chosenColor = null;
    let isSpinning = false;
    let hasSpun = false;

    if (!userId) window.location.href = 'index.html';

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById('playerTabMatricule').textContent = `RECRUE : ${username.toUpperCase()}`;
    });

    function applyColor(colorObj) {
      chosenColor = colorObj.hex;
      const avatarBox = document.getElementById('diverSuit');
      const tag = document.getElementById('colorNameTag');
      
      avatarBox.style.backgroundColor = colorObj.hex;
      tag.textContent = colorObj.name;
      
      // Ajustement de la lisibilité du texte du tag selon la couleur de fond
      // Tableau des couleurs claires nécessitant du texte noir
      const lightColors = ['#EAEAFF', '#CCFF00', '#A5A5A5', '#E6E6E6', '#00FFFF', '#FF6EFF', '#00FF00', '#FFCC00', '#4ECDC4', '#FFBE0B'];
      if(lightColors.includes(colorObj.hex.toUpperCase())) {
        tag.style.color = '#000000';
      } else {
        tag.style.color = '#ffffff';
      }
    }

    // LE MINI-JEU GÉNÉRATEUR QUANTIQUE
    function spinQuantumColor() {
      if (isSpinning || hasSpun) return;
      isSpinning = true;

      const btn = document.getElementById('btnSpin');
      const tag = document.getElementById('colorNameTag');
      
      btn.classList.add('spinning');
      btn.textContent = "ATTRIBUTION EN COURS...";
      tag.style.display = 'none';

      let speed = 40; // Vitesse initiale de défilement (ms)
      let duration = 0;
      let currentIndex = 0;

      function cycle() {
        // Sélection aléatoire parmi les 50 couleurs
        currentIndex = Math.floor(Math.random() * quantumColors.length);
        applyColor(quantumColors[currentIndex]);

        duration += speed;
        if (duration < 1800) {
          // Pendant les 1,8 premières secondes, on boucle vite
          setTimeout(cycle, speed);
        } else if (speed < 300) {
          // Décélération progressive pour l'effet de suspense
          speed += 50;
          setTimeout(cycle, speed);
        } else {
          // Arrêt final
          isSpinning = false;
          hasSpun = true;
          
          btn.classList.remove('spinning');
          btn.classList.add('used');
          btn.textContent = "COULEUR ATTRIBUÉE (UNIQUE)";
          tag.style.display = 'inline-block';
          
          // Débloquer la validation
          unlockValidation();
        }
      }
      
      cycle();
    }

    function unlockValidation() {
      const mainBtn = document.getElementById('btnMainAction');
      mainBtn.classList.add('unlocked');
    }

    async function validateAndPrintBadge() {
      if (isSpinning || !hasSpun) return; // Empêche de valider avant le tirage ou pendant

      const errorBubble = document.getElementById('errorBubble');
      const mainBtn = document.getElementById('btnMainAction');

      try {
        const { error } = await supabaseClient
          .from('game_progress')
          .update({ rank: `Docker Occasionnel` })
          .eq('user_id', userId);

        if (error) throw error;

        localStorage.setItem('userColor', chosenColor);
        localStorage.setItem('userFace', 'notionists-1779298466584.png');

        mainBtn.textContent = "PROFIL ENREGISTRÉ, REDIRECTION...";
        mainBtn.style.background = 'var(--port-blue)';
        
        setTimeout(() => {
          window.location.href = 'game.html';
        }, 1100);

      } catch (err) {
        errorBubble.innerHTML = `🚨 MATRICULE REJETÉ :<br>"${err.message}"`;
        errorBubble.style.display = 'block';
      }
    }
  </script>
</body>
</html>
