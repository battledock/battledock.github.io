<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Battle Dock — Recrutement</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Permanent+Marker&family=Space+Grotesk:wght@500;700;900&family=Bungee&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 50%, #3b82f6 100%);
      min-height: 100vh; height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 0; overflow: hidden; margin: 0;
    }
    .header-container { text-align: center; margin-bottom: 16px; z-index: 10; width: 100%; padding: 0 16px; flex-shrink: 0; }
    .main-title {
      font-family: 'Bangers', cursive; font-size: clamp(2.5rem, 10vw, 4rem); color: #facc15;
      letter-spacing: 4px; text-shadow: 6px 6px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000;
      line-height: 0.9; transform: rotate(-2deg); display: inline-block; margin-bottom: 4px;
    }
    .subtitle { font-family: 'Permanent Marker', cursive; font-size: clamp(0.8rem, 2.5vw, 0.95rem); 
      color: #fff; text-shadow: 3px 3px 0px #0f172a; letter-spacing: 1px; }
    .container {
      width: 100%; max-width: 540px; background: #e2e8f0; border: 4px solid #000;
      border-radius: 20px; box-shadow: 8px 8px 0px #000; height: 420px;
      display: flex; flex-direction: column; margin: 0 16px; flex-shrink: 0; overflow: hidden;
    }
    .content { background: #f3f4f6; padding: 20px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
    .section { display: none; }
    .section.active { display: flex; flex-direction: column; animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .section-title { font-family: 'Bangers', cursive; font-size: 20px; color: #0f172a; margin-bottom: 16px; text-transform: uppercase; }
    .avatars-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .avatar-btn { width: 100%; aspect-ratio: 1; border: 4px solid #000; border-radius: 12px; background: white;
      cursor: pointer; transition: all 0.15s ease; padding: 0; display: flex; align-items: center; justify-content: center; }
    .avatar-btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0px #000; }
    .avatar-btn.selected { background: #facc15; box-shadow: 8px 8px 0px #000; }
    .input-group { margin-bottom: 14px; }
    .input-group label { display: block; font-weight: 900; font-size: 12px; color: #0f172a; margin-bottom: 6px; text-transform: uppercase; }
    .input-group input, .input-group select {
      width: 100%; padding: 10px 12px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 14px;
      color: #0f172a; background: #fff; border: 4px solid #000; border-radius: 8px; box-shadow: 3px 3px 0px #000;
    }
    .game-area {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: white; border: 4px solid #000; border-radius: 12px; padding: 16px; position: relative; overflow: hidden;
    }
    .game-title { font-family: 'Bungee', sans-serif; font-size: 16px; color: #ef4444; text-transform: uppercase; margin-bottom: 12px; text-align: center; }
    .game-canvas { width: 100%; height: 100%; position: relative; }
    .clickable { position: absolute; cursor: pointer; transition: all 0.1s ease; }
    .clickable:hover { transform: scale(1.1); }
    .progress-bar { width: 100%; height: 20px; background: #cbd5e1; border: 2px solid #000; border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #22c55e, #facc15); transition: width 0.3s ease; }
    .button {
      background: #ef4444; color: white; border: 4px solid #000; border-radius: 10px; padding: 12px 24px;
      font-family: 'Bungee', sans-serif; font-size: 13px; font-weight: 700; text-transform: uppercase;
      cursor: pointer; box-shadow: 6px 6px 0px #000; transition: all 0.15s ease; width: 100%; margin-top: auto; border-bottom: none;
    }
    .button:hover { transform: translate(-2px, -2px); box-shadow: 8px 8px 0px #000; }
    .button:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px #000; }
    .footer-stamp { margin-top: 12px; font-size: 9px; color: #fff; text-align: center; max-width: 540px; line-height: 1.3; padding: 0 16px; flex-shrink: 0; }
    .error-popup { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: #e2e8f0; border: 4px solid #000; border-radius: 20px; padding: 32px 28px; max-width: 420px;
      width: 90%; box-shadow: 8px 8px 0px #000; z-index: 1000; animation: popupAppear 0.3s ease-out; }
    .error-popup.show { display: block; }
    @keyframes popupAppear { from { opacity: 0; transform: translate(-50%, -50%) scale(0.8); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
    .error-popup-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.7); z-index: 999; }
    .error-popup-overlay.show { display: block; }
    .error-popup-title { font-family: 'Bangers', cursive; font-size: 28px; color: #ef4444; margin-bottom: 12px; text-transform: uppercase; }
    .error-popup-message { font-family: 'Space Grotesk', sans-serif; font-size: 15px; color: #0f172a; margin-bottom: 24px; line-height: 1.6; font-weight: 600; }
    .error-popup-btn { background: #ef4444; color: white; border: 4px solid #000; border-radius: 12px; padding: 14px 28px;
      font-family: 'Bungee', sans-serif; font-size: 15px; font-weight: 700; text-transform: uppercase; cursor: pointer;
      box-shadow: 8px 8px 0px #000; transition: all 0.15s ease; width: 100%; border-bottom: none; }
    .error-popup-btn:hover { transform: translate(-2px, -2px); box-shadow: 8px 8px 0px #000; }
    .score-display { font-family: 'Bungee', sans-serif; font-size: 18px; color: #ef4444; text-align: center; margin-bottom: 12px; }
    .quote-display { font-family: 'Permanent Marker', cursive; font-size: 13px; color: #0f172a; text-align: center; line-height: 1.5; margin-bottom: 16px; font-style: italic; }
  </style>
</head>
<body>
  <div class="header-container">
    <div class="main-title">BATTLE DOCK</div>
    <div class="subtitle">Recrutement en cours...</div>
  </div>

  <div class="container">
    <div class="content">
      <div class="section active" id="secPresentation">
        <div class="section-title">Bienvenue Docker!</div>
        <p style="font-size: 13px; color: #0f172a; line-height: 1.5; margin-bottom: 12px;">
          Vous venez de postuler, veuillez remplir les informations et réussir notre nouvelle session de tests !
        </p>
        <button class="button" onclick="nextSection()">COMMENCER</button>
      </div>

      <div class="section" id="secAvatar">
        <div class="section-title">Choisir votre look</div>
        <div class="avatars-grid" id="avatarsGrid"></div>
        <button class="button" onclick="nextSection()" id="btnAvatar" disabled>SUIVANT</button>
      </div>

      <div class="section" id="secInfos">
        <div class="section-title">Vos infos</div>
        <div class="input-group">
          <label>⚓ Nom du bateau</label>
          <input type="text" id="shipName" placeholder="ex: La Sardine" required>
        </div>
        <div class="input-group">
          <label>🏋️ Spécialité</label>
          <select id="specialty" required>
            <option value="">-- Choisir --</option>
            <option value="manutention">Manutention</option>
            <option value="pilotage">Pilotage</option>
            <option value="chargement">Chargement</option>
            <option value="dechargement">Déchargement</option>
            <option value="surveillance">Surveillance</option>
          </select>
        </div>
        <button class="button" onclick="startGames()">COMMENCER LES TESTS</button>
      </div>

      <div class="section" id="secGame">
        <div style="width: 100%; flex: 1; display: flex; flex-direction: column;">
          <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <div class="game-area" id="gameArea">
            <div class="game-title" id="gameTitle">Jeu 1/5</div>
            <div class="game-canvas" id="gameCanvas"></div>
          </div>
          <div style="font-size: 12px; color: #0f172a; text-align: center; margin-top: 8px;">
            Score: <span id="currentScore" style="font-weight: 900;">0</span>/100
          </div>
        </div>
      </div>

      <div class="section" id="secResult">
        <div class="section-title">Recrutement Réussi!</div>
        <div class="score-display" id="finalScore"></div>
        <div class="quote-display" id="finalQuote"></div>
        <button class="button" onclick="goToGame()">ALLER AU JEU</button>
      </div>
    </div>
  </div>

  <div class="footer-stamp">Battle Dock — Recrutement des Dockers de Marseille</div>

  <div class="error-popup-overlay" id="errorOverlay"></div>
  <div class="error-popup" id="errorPopup">
    <div class="error-popup-title">ERREUR</div>
    <div class="error-popup-message" id="errorMessage"></div>
    <button class="error-popup-btn" onclick="closeErrorPopup()">OK</button>
  </div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const supabaseClient = createClient(supabaseUrl, supabaseKey);

    const userId = localStorage.getItem('userId');
    if (!userId) window.location.href = 'index-5.html';

    let currentSection = 0, selectedAvatar = null, totalScore = 0, currentGameIndex = 0, gameScores = [0, 0, 0, 0, 0];
    const sections = ['secPresentation', 'secAvatar', 'secInfos', 'secGame', 'secResult'];
    const dockerQuotes = ["T'es pas un docker, t'es une légende!", "Même les sardines te font peur maintenant!", "Le port te reconnaît déjà...", "Tu gères mieux que Cousteau!", "Les conteneurs t'obéissent!", "T'es trop fort pour le port!", "Les mouettes te saluent!", "Le Vieux-Port tremble sous tes pieds!", "T'es un vrai docker marseillais!", "Les cordes tremblent à ton approche!", "Tu dis adios aux conteneurs!", "Même la Méditerranée te respecte!", "T'es la légende du quai!", "Les autres dockers te demandent des conseils!", "Tu cartonnes trop fort!", "T'es un superdocker!", "Les conteneurs ont peur de toi!", "Tu gouvernes le port!", "T'es inarrêtable!", "Les cordes te chantent des hymnes!", "T'es un génie du chargement!", "Les cargos te font signe!", "T'es la star du port!", "Les dockers parlent de toi!", "T'es irrésistible!", "Même Cousteau t'admirait!", "T'es le roi du Vieux-Port!", "Les conteneurs te saluent!", "T'es un champion docker!", "Tu es l'enfant chéri du port!"];

    function createAvatars() {
      const grid = document.getElementById('avatarsGrid');
      for (let i = 1; i <= 6; i++) {
        const btn = document.createElement('button');
        btn.className = 'avatar-btn';
        btn.innerHTML = createDockerSVG(i);
        btn.onclick = () => selectAvatar(i, btn);
        grid.appendChild(btn);
      }
    }

    function createDockerSVG(n) {
      const c = ['#ef4444', '#3b82f6', '#22c55e', '#facc15', '#ec4899', '#f97316'][n-1];
      const d = [{h:'8',b:'y'},{h:'12',b:'n'},{h:'10',b:'y'},{h:'6',b:'n'},{h:'14',b:'y'},{h:'8',b:'n'}][n-1];
      return `<svg width="100%" height="100%" viewBox="0 0 64 80"><circle cx="32" cy="24" r="14" fill="${c}"/><rect x="${32-d.h}" y="8" width="${d.h*2}" height="6" fill="#1a1a1a" rx="1"/><circle cx="27" cy="22" r="2" fill="#000"/><circle cx="37" cy="22" r="2" fill="#000"/>${d.b==='y'?'<rect x="26" y="30" width="12" height="3" fill="#1a1a1a" rx="1"/>':''}<rect x="24" y="40" width="16" height="20" fill="${c}"/><rect x="14" y="44" width="10" height="4" fill="${c}" rx="2"/><rect x="40" y="44" width="10" height="4" fill="${c}" rx="2"/><rect x="26" y="62" width="4" height="10" fill="#1a1a1a"/><rect x="34" y="62" width="4" height="10" fill="#1a1a1a"/></svg>`;
    }

    function selectAvatar(n, b) {
      document.querySelectorAll('.avatar-btn').forEach(x => x.classList.remove('selected'));
      b.classList.add('selected');
      selectedAvatar = n;
      document.getElementById('btnAvatar').disabled = false;
    }

    function showSection(i) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.getElementById(sections[i]).classList.add('active');
      currentSection = i;
    }

    function nextSection() {
      if (currentSection === 2) {
        if (!document.getElementById('shipName').value || !document.getElementById('specialty').value) {
          showError('Remplis tous les champs!');
          return;
        }
      }
      if (currentSection < sections.length - 1) showSection(currentSection + 1);
    }

    function startGames() {
      showSection(3);
      currentGameIndex = 0;
      totalScore = 0;
      gameScores = [0, 0, 0, 0, 0];
      loadGame(0);
    }

    function loadGame(i) {
      currentGameIndex = i;
      const p = (i / 5) * 100;
      document.getElementById('progressFill').style.width = p + '%';
      document.getElementById('gameTitle').textContent = `Jeu ${i + 1}/5`;
      const c = document.getElementById('gameCanvas');
      c.innerHTML = '';
      if (i === 0) game1(c); else if (i === 1) game2(c); else if (i === 2) game3(c); else if (i === 3) game4(c); else game5(c);
    }

    function game1(c) {
      let s = 0, t = 10;
      document.getElementById('gameArea').innerHTML += `<div style="font-size: 18px; font-weight: 900; color: #ef4444;">Temps: <span id="timer">10</span>s | Colis: <span id="coils">0</span></div>`;
      const ti = setInterval(() => {
        t--; document.getElementById('timer').textContent = t;
        if (t <= 0) { clearInterval(ti); gameScores[0] = Math.min(20, s * 2); document.getElementById('currentScore').textContent = gameScores.reduce((a,b)=>a+b,0); setTimeout(() => loadGame(1), 1500); }
      }, 1000);
      const cr = () => {
        const co = document.createElement('div');
        co.style.cssText = `position:absolute;width:40px;height:40px;background:#facc15;border:3px solid #000;border-radius:8px;cursor:pointer;left:${Math.random()*200}px;top:${Math.random()*100}px;font-size:24px;display:flex;align-items:center;justify-content:center;`;
        co.textContent = '📦'; co.onclick = (e) => { e.stopPropagation(); s++; document.getElementById('coils').textContent = s; co.remove(); };
        c.appendChild(co); setTimeout(() => co.remove(), 2000);
      };
      setInterval(() => { if (t > 0) cr(); }, 600);
    }

    function game2(c) {
      let seq = [], pSeq = [], r = 0;
      const col = ['#ef4444', '#22c55e', '#facc15', '#2563eb'];
      const btn = [];
      for (let i = 0; i < 4; i++) {
        const b = document.createElement('button');
        b.style.cssText = `width:60px;height:60px;background:${col[i]};border:4px solid #000;border-radius:10px;cursor:pointer;margin:4px;font-size:24px;`;
        b.textContent = ['🔴','🟢','🟡','🔵'][i];
        b.onclick = () => pc(i); btn.push(b); c.appendChild(b);
      }
      function pc(i) {
        pSeq.push(i); btn[i].style.transform = 'scale(0.9)'; setTimeout(() => btn[i].style.transform = '', 100);
        if (pSeq[pSeq.length-1] !== seq[pSeq.length-1]) { gameScores[1] = Math.min(20, r*3); document.getElementById('currentScore').textContent = gameScores.reduce((a,b)=>a+b,0); setTimeout(() => loadGame(2), 1000); return; }
        if (pSeq.length === seq.length) { r++; pSeq = []; setTimeout(() => { seq.push(Math.floor(Math.random()*4)); ps(); }, 500); }
      }
      function ps() {
        let i = 0; const iv = setInterval(() => { btn[seq[i]].style.transform = 'scale(1.2)'; setTimeout(() => btn[seq[i]].style.transform = '', 400); i++; if (i >= seq.length) clearInterval(iv); }, 600);
      }
      seq.push(Math.floor(Math.random()*4)); ps();
    }

    function game3(c) {
      let can = false;
      const msg = document.createElement('div');
      msg.style.cssText = 'font-size:20px;text-align:center;color:#0f172a;';
      msg.textContent = 'Attends le signal...'; c.appendChild(msg);
      const sar = document.createElement('button');
      sar.textContent = '🐟'; sar.style.cssText = 'font-size:64px;border:none;background:transparent;cursor:pointer;margin-top:20px;';
      sar.onclick = () => { if (!can) { gameScores[2] = 0; msg.textContent = 'Trop tôt! 💥'; document.getElementById('currentScore').textContent = gameScores.reduce((a,b)=>a+b,0); setTimeout(() => loadGame(3), 1500); } else { gameScores[2] = 20; msg.textContent = 'Parfait! ⭐'; document.getElementById('currentScore').textContent = gameScores.reduce((a,b)=>a+b,0); setTimeout(() => loadGame(3), 1500); } };
      c.appendChild(sar);
      setTimeout(() => { msg.textContent = 'GO! Clique!'; msg.style.color = '#ef4444'; can = true; setTimeout(() => { if (can) { gameScores[2] = 0; msg.textContent = 'Trop lent! ⏱️'; can = false; document.getElementById('currentScore').textContent = gameScores.reduce((a,b)=>a+b,0); setTimeout(() => loadGame(3), 1500); } }, 2000); }, Math.random()*3*1000+1000);
    }

    function game4(c) {
      const qs = [{q:'Combien de sardines dans le Vieux-Port?',a:'Toutes!'},{q:'Qui est le vrai patron du port?',a:'Toi maintenant!'},{q:'Quel est le cri du docker?',a:'ALLEEEEEZ!'}];
      const q = qs[Math.floor(Math.random()*qs.length)];
      const qDiv = document.createElement('div');
      qDiv.style.cssText = 'font-size:16px;font-weight:900;text-align:center;margin-bottom:16px;color:#0f172a;'; qDiv.textContent = q.q; c.appendChild(qDiv);
      const aDiv = document.createElement('div');
      aDiv.style.cssText = 'font-size:14px;text-align:center;padding:12px;background:#facc15;border:4px solid #000;border-radius:8px;margin-bottom:12px;color:#0f172a;'; aDiv.textContent = '?'; c.appendChild(aDiv);
      const bDiv = document.createElement('button'); bDiv.className = 'button'; bDiv.style.margin = '0'; bDiv.textContent = 'Réponse'; bDiv.onclick = () => { aDiv.textContent = q.a; gameScores[3] = 20; document.getElementById('currentScore').textContent = gameScores.reduce((a,b)=>a+b,0); setTimeout(() => loadGame(4), 1500); }; c.appendChild(bDiv);
    }

    function game5(c) {
      let seq = [], pSeq = [], r = 0;
      const mov = ['🤛','🤜','🙌','🤷'];
      const dis = document.createElement('div'); dis.style.cssText = 'font-size:48px;text-align:center;margin-bottom:12px;'; c.appendChild(dis);
      const btn = [];
      for (let i = 0; i < 4; i++) {
        const b = document.createElement('button');
        b.style.cssText = `width:50px;height:50px;margin:4px;font-size:24px;border:4px solid #000;background:#fff;cursor:pointer;border-radius:8px;`;
        b.textContent = mov[i]; b.onclick = () => pm(i); btn.push(b); c.appendChild(b);
      }
      function pm(i) {
        pSeq.push(i); btn[i].style.transform = 'scale(0.8)'; setTimeout(() => btn[i].style.transform = '', 100);
        if (pSeq[pSeq.length-1] !== seq[pSeq.length-1]) { gameScores[4] = Math.min(20, r*2); document.getElementById('currentScore').textContent = gameScores.reduce((a,b)=>a+b,0); setTimeout(() => end(), 1000); return; }
        if (pSeq.length === seq.length) { r++; pSeq = []; setTimeout(() => { seq.push(Math.floor(Math.random()*4)); play(); }, 500); }
      }
      function play() {
        let i = 0; const iv = setInterval(() => { dis.textContent = mov[seq[i]]; btn[seq[i]].style.background = '#facc15'; setTimeout(() => btn[seq[i]].style.background = '#fff', 400); i++; if (i >= seq.length) clearInterval(iv); }, 600);
      }
      seq.push(Math.floor(Math.random()*4)); play();
    }

    function end() {
      totalScore = gameScores.reduce((a,b)=>a+b,0);
      const qI = Math.floor(totalScore / 3.33);
      const q = dockerQuotes[Math.min(qI, dockerQuotes.length-1)];
      document.getElementById('finalScore').textContent = `${totalScore}/100`;
      document.getElementById('finalQuote').textContent = `"${q}"`;
      supabaseClient.from('profiles').update({docker_quote:q, avatar:selectedAvatar, ship_name:document.getElementById('shipName').value, specialty:document.getElementById('specialty').value}).eq('user_id',userId).then(() => { showSection(4); });
    }

    function goToGame() { window.location.href = 'game.html'; }
    function showError(m) { document.getElementById('errorMessage').textContent = m; document.getElementById('errorPopup').classList.add('show'); document.getElementById('errorOverlay').classList.add('show'); }
    function closeErrorPopup() { document.getElementById('errorPopup').classList.remove('show'); document.getElementById('errorOverlay').classList.remove('show'); }
    document.getElementById('errorOverlay').addEventListener('click', closeErrorPopup);
    createAvatars();
  </script>
</body>
</html>
