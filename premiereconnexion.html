<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Battle Dock — Attribution Chromatique</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Space+Grotesk:wght@500;700;900&family=Bungee&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  
  <style>
    :root {
      --port-dark: #0f172a;
      --port-blue: #2563eb;
      --comic-yellow: #facc15;
      --comic-red: #ef4444;
      --comic-green: #22c55e;
      --border-thick: 4px solid #000000;
      --shadow-comic: 8px 8px 0px #000000;
      --shadow-comic-sm: 4px 4px 0px #000000;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--comic-yellow); 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
    }

    .dock-container {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border: var(--border-thick);
      border-radius: 24px;
      box-shadow: var(--shadow-comic);
      overflow: hidden;
    }

    .tabs-wrapper {
      display: flex;
      background: var(--port-dark);
      border-bottom: var(--border-thick);
    }

    .tab-badge {
      flex: 1;
      background: var(--comic-red); 
      color: #ffffff; 
      font-family: 'Bangers', cursive; 
      font-size: 24px;
      padding: 14px 8px;
      text-align: center;
      letter-spacing: 1.5px;
    }

    .form-content {
      padding: 24px;
    }

    /* ZONE AVATAR : TAILLE CARRÉ PARFAITE */
    .avatar-preview-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 24px;
    }

    .suit-avatar {
      width: 100px;
      height: 115px;
      background: #3A4750; /* Couleur initiale neutre */
      border: var(--border-thick);
      border-radius: 10px;
      box-shadow: var(--shadow-comic-sm);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .suit-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      z-index: 2;
    }

    /* Affichage du nom de la couleur obtenue */
    .color-tag-display {
      margin-top: 12px;
      font-family: 'Bungee', sans-serif;
      font-size: 14px;
      color: #ffffff;
      background: var(--port-dark);
      padding: 6px 14px;
      border: 2px solid #000;
      border-radius: 20px;
      box-shadow: 2px 2px 0px #000;
      text-transform: uppercase;
      min-width: 160px;
      text-align: center;
    }

    /* SECTION MINI-JEU ROULETTE */
    .input-group { 
      margin-bottom: 24px; 
      background: #f8fafc;
      border: 2px solid #000000;
      padding: 18px;
      border-radius: 16px;
      text-align: center;
    }

    .game-instruction {
      font-weight: 800;
      font-size: 13px;
      color: #475569;
      margin-bottom: 14px;
      line-height: 1.4;
    }

    .roulette-btn {
      width: 100%;
      padding: 12px;
      font-family: 'Bungee', sans-serif;
      font-size: 14px;
      color: #000;
      background: #e2e8f0;
      border: 3px solid #000;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: var(--shadow-comic-sm);
      transition: all 0.1s;
    }

    .roulette-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #000;
    }

    .roulette-btn.spinning {
      background: #94a3b8 !important;
      cursor: not-allowed;
      box-shadow: 0px 0px 0px #000;
      transform: translate(4px, 4px);
    }

    /* VALIDATION */
    .action-zone {
      margin-top: 16px;
    }
    
    .submit-lever-btn {
      width: 100%;
      padding: 16px;
      font-family: 'Bangers', cursive;
      font-size: 24px;
      color: white;
      background: var(--comic-green);
      border: var(--border-thick);
      border-radius: 14px;
      cursor: pointer;
      box-shadow: var(--shadow-comic-sm);
    }

    .submit-lever-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px #000;
    }

    .speech-bubble {
      background: white;
      border: var(--border-thick);
      border-radius: 12px;
      padding: 12px;
      font-weight: 700;
      font-size: 13px;
      color: var(--comic-red);
      margin-top: 16px;
      box-shadow: var(--shadow-comic-sm);
      display: none;
    }
  </style>
</head>
<body>

  <div class="dock-container">
    <div class="tabs-wrapper">
      <div class="tab-badge" id="playerTabMatricule">PROFIL DE LA RECRUE</div>
    </div>

    <div class="form-content">
      
      <div class="avatar-preview-zone">
        <div class="suit-avatar" id="diverSuit">
          <img id="badgeAvatarImg" src="notionists-1779298466584.png" alt="Avatar Docker">
        </div>
        <div class="color-tag-display" id="colorNameTag">Inconnu</div>
      </div>

      <div class="input-group">
        <p class="game-instruction">🎰 Les régulations du port exigent une attribution de secteur aléatoire. Lance le générateur pour obtenir ta nuance d'accréditation unique !</p>
        <button class="roulette-btn" id="btnSpin" onclick="spinQuantumColor()">🎲 LANCER LE GÉNÉRATEUR</button>
      </div>

      <div class="action-zone">
        <button class="submit-lever-btn" id="btnMainAction" onclick="validateAndPrintBadge()">VALIDER MON PROFIL ET EMBAUCHER 🏗️</button>
      </div>

      <div class="speech-bubble" id="errorBubble"></div>

    </div>
  </div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const supabaseClient = createClient(supabaseUrl, supabaseKey);

    const userId = localStorage.getItem('userId');
    const username = localStorage.getItem('username') || 'Recrue';
    
    // Tableau des 10 teintes originales
    const quantumColors = [
      { hex: '#FF0055', name: 'Rose Fusion' },
      { hex: '#00FF99', name: 'Vert Radioactif' },
      { hex: '#00E5FF', name: 'Bleu Plasma' },
      { hex: '#FF9900', name: 'Ambre Industriel' },
      { hex: '#7000FF', name: 'Violet Proton' },
      { hex: '#FF00AA', name: 'Cyber Néon' },
      { hex: '#3A4750', name: 'Acier Galvanisé' },
      { hex: '#EAEAFF', name: 'Blanc Banquise' },
      { hex: '#222831', name: 'Noir Carbone' },
      { hex: '#D4AF37', name: 'Or Brut' }
    ];

    let chosenColor = '#3A4750';
    let isSpinning = false;

    if (!userId) window.location.href = 'index.html';

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById('playerTabMatricule').textContent = `RECRUE : ${username.toUpperCase()}`;
      // Assigner une couleur par défaut propre au chargement
      applyColor(quantumColors[6]);
    });

    function applyColor(colorObj) {
      chosenColor = colorObj.hex;
      const avatarBox = document.getElementById('diverSuit');
      const tag = document.getElementById('colorNameTag');
      
      avatarBox.style.backgroundColor = colorObj.hex;
      tag.textContent = colorObj.name;
      
      // Ajustement de la lisibilité du texte du tag selon la couleur de fond
      if(colorObj.hex === '#EAEAFF' || colorObj.hex === '#00FF99' || colorObj.hex === '#00E5FF' || colorObj.hex === '#ccff00') {
        tag.style.color = '#000000';
      } else {
        tag.style.color = '#ffffff';
      }
    }

    // LE MINI-JEU ROULETTE / GÉNÉRATEUR
    function spinQuantumColor() {
      if (isSpinning) return;
      isSpinning = true;

      const btn = document.getElementById('btnSpin');
      btn.classList.add('spinning');
      btn.textContent = "GÉNÉRATION EN COURS...";

      let speed = 40; // Vitesse initiale de défilement (ms)
      let duration = 0;
      let currentIndex = 0;

      function cycle() {
        currentIndex = Math.floor(Math.random() * quantumColors.length);
        applyColor(quantumColors[currentIndex]);

        duration += speed;
        if (duration < 1500) {
          // Pendant les 1,5 premières secondes, on boucle vite
          setTimeout(cycle, speed);
        } else if (speed < 250) {
          // Décélération progressive pour l'effet de suspense
          speed += 40;
          setTimeout(cycle, speed);
        } else {
          // Arrêt final
          isSpinning = false;
          btn.classList.remove('spinning');
          btn.textContent = "🎰 RELANCER LE GÉNÉRATEUR";
        }
      }
      
      cycle();
    }

    async function validateAndPrintBadge() {
      if (isSpinning) return; // Empêche de valider pendant le tirage

      const errorBubble = document.getElementById('errorBubble');
      const mainBtn = document.getElementById('btnMainAction');

      try {
        const { error } = await supabaseClient
          .from('game_progress')
          .update({ rank: `Docker Occasionnel` })
          .eq('user_id', userId);

        if (error) throw error;

        localStorage.setItem('userColor', chosenColor);
        localStorage.setItem('userFace', 'notionists-1779298466584.png');

        mainBtn.textContent = "PROFIL ENREGISTRÉ, REDIRECTION...";
        mainBtn.style.background = 'var(--port-blue)';
        
        setTimeout(() => {
          window.location.href = 'game.html';
        }, 1100);

      } catch (err) {
        errorBubble.innerHTML = `🚨 MATRICULE REJETÉ :<br>"${err.message}"`;
        errorBubble.style.display = 'block';
      }
    }
  </script>
</body>
</html>
