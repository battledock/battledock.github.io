<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Formation Pilote de Clark — Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#0a0a0a}
.scene{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:flex-end}
.bg{position:absolute;inset:0;transition:opacity .8s}
.character{position:absolute;bottom:32%;left:50%;transform:translateX(-50%);width:120px;height:180px}
.dialog{position:relative;margin:0 12px calc(env(safe-area-inset-bottom,0px)+12px);background:rgba(0,0,0,.75);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:16px 18px 14px;z-index:10;min-height:80px;cursor:pointer}
.dialog-name{font-family:'Bebas Neue',sans-serif;font-size:14px;color:#fbbf24;letter-spacing:2px;margin-bottom:4px}
.dialog-text{font-size:13px;color:rgba(255,255,255,.85);line-height:1.6}
.dialog-hint{font-size:9px;color:rgba(255,255,255,.2);text-align:right;margin-top:6px}
.choices{display:flex;gap:6px;margin-top:10px}
.choice-btn{flex:1;padding:10px;border:1px solid rgba(255,255,255,.15);border-radius:12px;background:rgba(255,255,255,.05);color:#fff;font-size:11px;font-weight:700;cursor:pointer;text-align:center}
.choice-btn:active{background:rgba(255,255,255,.15)}
.quiz-opts{margin-top:8px}.quiz-opt{display:block;width:100%;padding:10px;margin-top:5px;border:1px solid rgba(255,255,255,.1);border-radius:10px;background:rgba(255,255,255,.03);color:#fff;font-size:12px;cursor:pointer;text-align:left}
.quiz-opt:active{background:rgba(255,255,255,.1)}
.quiz-opt.correct{background:rgba(74,222,128,.2);border-color:#4ade80}
.quiz-opt.wrong{background:rgba(239,68,68,.2);border-color:#ef4444}
.badge-container{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:30;background:rgba(0,0,0,.8)}
.badge{text-align:center;animation:badgeIn .6s ease}
@keyframes badgeIn{from{transform:scale(0) rotate(-20deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.badge-icon{font-size:80px}
.badge-title{font-family:'Bebas Neue',sans-serif;font-size:28px;color:#fbbf24;letter-spacing:3px;margin-top:10px}
.badge-sub{font-size:12px;color:rgba(255,255,255,.4);margin-top:6px}
.badge-btn{margin-top:20px;padding:14px 30px;border:none;border-radius:14px;background:#fbbf24;color:#1a1a1a;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px;cursor:pointer}
.sound-hint{position:fixed;top:calc(env(safe-area-inset-top,0px)+10px);left:50%;transform:translateX(-50%);color:rgba(255,255,255,.3);font-size:11px;z-index:20;animation:fadeHint 5s forwards}
@keyframes fadeHint{0%,60%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>
<div class="sound-hint">🔊 Monte le son</div>
<div class="scene" id="scene">
  <div class="bg" id="bg"></div>
  <svg class="character" id="char" viewBox="0 0 120 180"></svg>
  <div class="dialog" id="dialog" onclick="nextStep()">
    <div class="dialog-name" id="dName">JEFF</div>
    <div class="dialog-text" id="dText"></div>
    <div class="dialog-hint">Appuie pour continuer ▶</div>
  </div>
</div>
<div class="badge-container" id="badgeScreen">
  <div class="badge">
    <div class="badge-icon">🏎️</div>
    <div class="badge-title">PILOTE DE CLARK</div>
    <div class="badge-sub">PORT DE MARSEILLE · PILOTE · CERTIFIÉ ✓</div>
    <button class="badge-btn" onclick="finish()">COMMENCER À COURIR</button>
  </div>
</div>
<audio id="music" src="formation-music.mp3" loop></audio>
<script>
var SB_URL='https://drtsuhnbclhmgfjiykap.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
var sb=supabase.createClient(SB_URL,SB_KEY);
var _me=null,step=0;

// SVG backgrounds
var BGs={
  garage:'<rect width="100%" height="100%" fill="#1a1a2a"/><rect x="0" y="60%" width="100%" height="40%" fill="#333"/><rect x="10%" y="30%" width="25%" height="35%" rx="4" fill="#444" stroke="#555" stroke-width="2"/><rect x="40%" y="35%" width="30%" height="30%" rx="4" fill="#3a3a4a" stroke="#555" stroke-width="2"/><circle cx="55%" cy="50%" r="8%" fill="#fbbf24" opacity=".3"/><rect x="75%" y="40%" width="20%" height="25%" rx="3" fill="#444"/><text x="50%" y="25%" text-anchor="middle" fill="rgba(255,255,255,.05)" font-family="Bebas Neue" font-size="40">GARAGE</text>',
  circuit:'<rect width="100%" height="100%" fill="#2a3a2a"/><ellipse cx="50%" cy="50%" rx="35%" ry="30%" fill="none" stroke="#555" stroke-width="30"/><ellipse cx="50%" cy="50%" rx="35%" ry="30%" fill="none" stroke="#4a4a4a" stroke-width="26"/><line x1="20%" y1="80%" x2="80%" y2="80%" stroke="rgba(255,255,255,.1)" stroke-width="4" stroke-dasharray="8,8"/><circle cx="30%" cy="20%" r="3%" fill="#1e6b1e"/><circle cx="70%" cy="25%" r="4%" fill="#1e6b1e"/><circle cx="20%" cy="35%" r="3.5%" fill="#145214"/>',
  nuit:'<rect width="100%" height="100%" fill="#0a0a1a"/><circle cx="80%" cy="15%" r="5%" fill="#fde68a" opacity=".2"/><circle cx="20%" cy="10%" r="1" fill="#fff" opacity=".3"/><circle cx="40%" cy="8%" r="1" fill="#fff" opacity=".2"/><circle cx="60%" cy="12%" r="1" fill="#fff" opacity=".4"/><circle cx="85%" cy="5%" r="1" fill="#fff" opacity=".3"/><rect x="0" y="70%" width="100%" height="30%" fill="#1a1a24"/><ellipse cx="50%" cy="75%" rx="30%" ry="10%" fill="none" stroke="#444" stroke-width="20"/>',
  podium:'<rect width="100%" height="100%" fill="#1a1020"/><rect x="30%" y="50%" width="15%" height="30%" fill="#c0c0c0" rx="3"/><rect x="45%" y="40%" width="15%" height="40%" fill="#fbbf24" rx="3"/><rect x="60%" y="55%" width="15%" height="25%" fill="#cd7f32" rx="3"/><text x="37.5%" y="48%" text-anchor="middle" fill="#fff" font-size="14" font-family="Bebas Neue">2</text><text x="52.5%" y="38%" text-anchor="middle" fill="#fff" font-size="14" font-family="Bebas Neue">1</text><text x="67.5%" y="53%" text-anchor="middle" fill="#fff" font-size="14" font-family="Bebas Neue">3</text>',
  badge:'<rect width="100%" height="100%" fill="#0a0a0a"/><circle cx="50%" cy="40%" r="20%" fill="rgba(251,191,36,.05)"/><circle cx="50%" cy="40%" r="12%" fill="rgba(251,191,36,.08)"/>',
};

// Jeff character SVG
function drawJeff(mood){
  var colors={body:'#fbbf24',skin:'#deb887',hair:'#333'};
  return '<circle cx="60" cy="45" r="22" fill="'+colors.skin+'"/><rect x="40" y="25" width="40" height="15" rx="5" fill="'+colors.hair+'"/><circle cx="52" cy="42" r="3" fill="#333"/><circle cx="68" cy="42" r="3" fill="#333"/>'+(mood==='happy'?'<path d="M50 52 Q60 60 70 52" fill="none" stroke="#333" stroke-width="2"/>':'<line x1="50" y1="54" x2="70" y2="54" stroke="#333" stroke-width="2"/>')+'<rect x="42" y="68" width="36" height="45" rx="6" fill="'+colors.body+'"/><rect x="42" y="68" width="36" height="8" rx="3" fill="rgba(0,0,0,.1)"/><text x="60" y="96" text-anchor="middle" fill="rgba(0,0,0,.15)" font-size="8" font-family="Bebas Neue">PILOTE</text><rect x="38" y="113" width="12" height="35" rx="4" fill="#1565C0"/><rect x="70" y="113" width="12" height="35" rx="4" fill="#1565C0"/><rect x="44" y="148" width="14" height="10" rx="3" fill="#333"/><rect x="62" y="148" width="14" height="10" rx="3" fill="#333"/>';
}

var STEPS=[
  {bg:'garage',mood:'happy',name:'JEFF',text:"Salut gamin ! Bienvenue au garage du port. Moi c'est Jeff, champion de course de clarks depuis 2008."},
  {bg:'garage',mood:'normal',name:'JEFF',text:"Tu veux devenir pilote ? C'est pas juste conduire un chariot hein. Ici on fait la COURSE. 🏎️"},
  {bg:'garage',mood:'happy',name:'JEFF',text:"Regarde ces bébés... Des Clark CX-40 modifiés, moteur gonflé, fourches aérodynamiques. Des bêtes de course."},
  {bg:'circuit',mood:'normal',name:'JEFF',text:"Le Grand Prix du Port, c'est 3 tours sur des circuits qui CHANGENT à chaque tour. Faut s'adapter en permanence."},
  {bg:'circuit',mood:'happy',name:'JEFF',text:"Tour 1 : le circuit classique du port. Tu apprends les virages, les trajectoires. Tranquille."},
  {bg:'circuit',mood:'normal',name:'JEFF',text:"Tour 2 : BOOM ! Le tracé change complètement. Virages serrés, switchbacks... Ceux qui dormaient se retrouvent dans les barrières."},
  {bg:'nuit',mood:'normal',name:'JEFF',text:"Tour 3 : le sprint final. Longues lignes droites et épingles violentes. C'est là que tout se joue."},
  {bg:'nuit',mood:'happy',name:'JEFF',text:"Tu vas courir contre Gégé, Doudou et Titouan. Gégé c'est le plus dangereux — il accélère quand il est derrière toi. 😤"},
  {bg:'circuit',mood:'normal',name:'JEFF',text:"Question rapide !",quiz:true,q:"Que se passe-t-il entre les tours ?",opts:["Rien, c'est le même circuit","Le circuit change de tracé","On change de clark"],correct:1},
  {bg:'circuit',mood:'happy',name:'JEFF',text:"Exact ! Le tracé se reconstruit à chaque tour. Faut garder les yeux ouverts.",after_quiz:true},
  {bg:'garage',mood:'normal',name:'JEFF',text:"Sur la piste tu trouveras des bonus. L'éclair ⚡ te donne un turbo. L'étoile ⭐ augmente ta vitesse max."},
  {bg:'garage',mood:'normal',name:'JEFF',text:"Et attention aux flaques d'huile 🛢️ — ça ralentit sec ! Les adversaires aussi peuvent choper les bonus, alors sois rapide."},
  {bg:'nuit',mood:'happy',name:'JEFF',text:"Question !",quiz:true,q:"Quel bonus augmente ta vitesse max définitivement ?",opts:["L'éclair ⚡","L'étoile ⭐","La flaque d'huile"],correct:1},
  {bg:'nuit',mood:'happy',name:'JEFF',text:"Bien joué ! L'étoile c'est le meilleur item. Chope-les toutes.",after_quiz:true},
  {bg:'podium',mood:'happy',name:'JEFF',text:"Le podium... 1er = 5000€ + 800 XP. Avec un meilleur tour rapide : bonus de 1500€ et 300 XP en plus !"},
  {bg:'podium',mood:'happy',name:'JEFF',text:"T'es prêt gamin. Montre-leur ce que c'est qu'un vrai pilote de clark marseillais ! 💪"},
  {bg:'badge',mood:'happy',name:'SYSTÈME',text:"Formation terminée ! Tu as obtenu le badge PILOTE DE CLARK.",badge:true},
];

var typing=false,fullText='';
function showStep(){
  if(step>=STEPS.length)return;
  var s=STEPS[step];
  if(s.after_quiz)s=STEPS[step];// just show
  document.getElementById('bg').innerHTML='<svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none">'+BGs[s.bg]+'</svg>';
  document.getElementById('char').innerHTML=drawJeff(s.mood||'normal');
  document.getElementById('dName').textContent=s.name;
  if(s.badge){document.getElementById('badgeScreen').style.display='flex';saveFormation();return;}
  if(s.quiz){
    var html=s.q+'<div class="quiz-opts">';
    s.opts.forEach(function(o,i){html+='<div class="quiz-opt" onclick="answerQuiz('+i+','+s.correct+',this)">'+o+'</div>';});
    html+='</div>';
    document.getElementById('dText').innerHTML=html;
    document.querySelector('.dialog-hint').style.display='none';
    return;
  }
  document.querySelector('.dialog-hint').style.display='';
  typeText(s.text);
}

function typeText(txt){
  fullText=txt;typing=true;var el=document.getElementById('dText');el.textContent='';var i=0;
  var iv=setInterval(function(){if(i>=txt.length||!typing){el.textContent=txt;typing=false;clearInterval(iv);return;}el.textContent+=txt[i];i++;},25);
}

function nextStep(){
  if(typing){typing=false;return;}
  step++;showStep();
}

window.answerQuiz=function(idx,correct,el){
  if(el.classList.contains('correct')||el.classList.contains('wrong'))return;
  if(idx===correct){el.classList.add('correct');setTimeout(function(){step++;showStep();},800);}
  else{el.classList.add('wrong');}
};

async function saveFormation(){
  if(!_me)return;
  var gs=await sb.from('game_stats').select('records').eq('user_id',_me.id).maybeSingle();
  if(gs.data){
    var rec=gs.data.records||{};
    if(!rec.formations)rec.formations={};
    rec.formations.clark=true;
    await sb.from('game_stats').update({records:rec}).eq('user_id',_me.id);
  }
}

function finish(){location.href='clark.html';}

(async function(){
  var s=await sb.auth.getSession();
  if(!s.data.session){location.href='index.html';return;}
  _me=s.data.session.user;
  var gs=await sb.from('game_stats').select('records').eq('user_id',_me.id).maybeSingle();
  if(gs.data&&gs.data.records&&gs.data.records.formations&&gs.data.records.formations.clark){location.href='clark.html';return;}
  document.getElementById('music').play().catch(function(){});
  showStep();
})();
</script>
</body>
</html>
