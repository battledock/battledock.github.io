<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Roue du Port - Battle Dock Casino</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * { margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent; }
    body { font-family:'Inter',sans-serif;background:linear-gradient(180deg,#450a0a,#7f1d1d,#991b1b);min-height:100vh;overflow:hidden;display:flex;flex-direction:column; }
    .container { max-width:500px;margin:0 auto;padding:6px;padding-bottom:120px;flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden; }
    .game-area { flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;overflow:hidden;min-height:0; }

    /* TABLE */
    .wheel-table { background:linear-gradient(135deg,#1e293b,#0f172a);border:4px solid #fbbf24;border-radius:14px;padding:14px;box-shadow:0 8px 32px rgba(0,0,0,0.6);width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:10px;flex-shrink:0;overflow:hidden;position:relative; }

    /* ROUE */
    .wheel-container { position:relative;display:flex;align-items:center;justify-content:center; }

    /* Indicateur en haut */
    .pointer {
      position:absolute;top:-8px;left:50%;transform:translateX(-50%);
      width:0;height:0;
      border-left:12px solid transparent;
      border-right:12px solid transparent;
      border-top:22px solid #fbbf24;
      z-index:20;
      filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    canvas#wheelCanvas { border-radius:50%;box-shadow:0 0 0 4px #fbbf24,0 0 0 8px #0f172a,0 8px 24px rgba(0,0,0,0.5); }

    @keyframes wheelSpin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

    /* RÉSULTAT */
    .result { display:none;padding:7px 12px;border-radius:10px;text-align:center;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:1px;width:100%;animation:resultPop .3s; }
    @keyframes resultPop { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
    .result.win  { background:linear-gradient(135deg,#10b981,#059669);color:white;box-shadow:0 4px 14px rgba(16,185,129,0.4); }
    .result.lose { background:linear-gradient(135deg,#dc2626,#991b1b);color:white; }
    .result.jackpot { background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#0f172a;box-shadow:0 4px 14px rgba(251,191,36,0.5); }

    .last-val { font-family:'Bebas Neue',sans-serif;font-size:13px;color:rgba(255,255,255,0.3);letter-spacing:2px;text-align:center; }

    /* CONTROLS */
    .controls { display:flex;flex-direction:column;gap:6px;width:100%;max-width:340px;flex-shrink:0; }
    .chips { display:flex;gap:6px;background:rgba(255,255,255,0.05);padding:6px;border-radius:8px;border:2px solid rgba(251,191,36,0.3); }
    .chip { flex:1;padding:7px 4px;border-radius:6px;text-align:center;cursor:pointer;transition:all .15s;font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:1px; }
    .chip.sel { background:#fbbf24;color:#0f172a; }
    .chip:not(.sel) { background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.4);border:1px solid rgba(251,191,36,0.2); }
    .spin-btn { width:100%;padding:10px;background:linear-gradient(135deg,#fbbf24,#f59e0b);border:none;border-radius:10px;color:#0f172a;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:1.5px;cursor:pointer;box-shadow:0 6px 20px rgba(251,191,36,0.5);transition:all .2s; }
    .spin-btn:active { transform:scale(0.98); }
    .spin-btn:disabled { opacity:0.4;cursor:not-allowed;box-shadow:none; }

    /* BOTTOM BAR */
    .bottom-bar { background:linear-gradient(135deg,#7f1d1d,#991b1b);border:2px solid rgba(251,191,36,0.5);border-radius:10px;padding:6px 10px;display:flex;justify-content:space-between;align-items:center;min-height:44px;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);max-width:480px;width:calc(100% - 20px);z-index:100;box-shadow:0 -4px 20px rgba(0,0,0,0.5); }
    .back-btn { background:rgba(251,191,36,0.2);border:2px solid rgba(251,191,36,0.5);color:#fbbf24;border-radius:6px;padding:4px 10px;font-weight:700;font-size:11px;cursor:pointer;white-space:nowrap; }
    .back-btn:active { transform:scale(0.95); }
    .game-title { font-family:'Bebas Neue',sans-serif;font-size:16px;color:#fbbf24;letter-spacing:1.5px; }
    .balance { background:white;color:#0f172a;padding:4px 10px;border-radius:6px;font-family:'Bebas Neue',sans-serif;font-size:14px;font-weight:700;white-space:nowrap; }
  </style>
</head>
<body>
<div class="container">
  <div class="game-area">

    <div class="wheel-table">
      <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheelCanvas" style="width:220px;height:220px"></canvas>
      </div>
      <div class="last-val" id="lastVal">Tourne la roue !</div>
    </div>

    <div class="controls">
      <div class="result" id="result"></div>
      <div class="chips">
        <div class="chip sel" id="c500"  onclick="setBet(500,'c500')">500€</div>
        <div class="chip"     id="c1000" onclick="setBet(1000,'c1000')">1K</div>
        <div class="chip"     id="c2000" onclick="setBet(2000,'c2000')">2K</div>
        <div class="chip"     id="c5000" onclick="setBet(5000,'c5000')">5K</div>
      </div>
      <button class="spin-btn" id="btnPlay" onclick="spinWheel()">TOURNER — <span id="betLabel">500€</span></button>
    </div>

  </div>

  <div class="bottom-bar">
    <button class="back-btn" onclick="window.location.href='casino.html'">← Casino</button>
    <div class="game-title">🎡 ROUE DU PORT</div>
    <div class="balance" id="balance">0€</div>
  </div>
</div>

<script>
  const supabaseUrl='https://drtsuhnbclhmgfjiykap.supabase.co';
  const supabaseKey='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
  const {createClient}=supabase;
  const sb=createClient(supabaseUrl,supabaseKey);

  const fmt=n=>Math.floor(n).toLocaleString('fr-FR');
  const $=id=>document.getElementById(id);

  let money=parseInt(localStorage.getItem("bd_money")||"0"),bet=500,currentUser=null,busy=false,currentAngle=0;

  // Segments de la roue
  // RTP 90% — house edge 10%
  const SEGMENTS=[
    {label:'×2',   emoji:'⚓', mult:2,  color:'#cc1a1a', weight:14},
    {label:'PERDU',emoji:'💀', mult:0,  color:'#1f2937', weight:22},
    {label:'×3',   emoji:'🐟', mult:3,  color:'#1565C0', weight:8},
    {label:'PERDU',emoji:'🌊', mult:0,  color:'#374151', weight:20},
    {label:'×4',   emoji:'🚢', mult:4,  color:'#047857', weight:4},
    {label:'×2',   emoji:'⚓', mult:2,  color:'#991b1b', weight:6},
    {label:'PERDU',emoji:'💀', mult:0,  color:'#1f2937', weight:25},
    {label:'×10',  emoji:'🏆', mult:10, color:'#7c3aed', weight:1},
  ];

  // Calculer les angles de chaque segment selon leur poids
  const totalWeight=SEGMENTS.reduce((a,s)=>a+s.weight,0);
  let cumulAngle=0;
  SEGMENTS.forEach(s=>{
    s.startAngle=cumulAngle;
    s.angleSize=(s.weight/totalWeight)*Math.PI*2;
    cumulAngle+=s.angleSize;
    s.endAngle=cumulAngle;
    s.midAngle=s.startAngle+s.angleSize/2;
  });

  const DPR = window.devicePixelRatio || 2;
  const CSIZE = 220;

  function initCanvas(){
    const canvas=$('wheelCanvas');
    canvas.width  = CSIZE * DPR;
    canvas.height = CSIZE * DPR;
    const ctx = canvas.getContext('2d');
    ctx.scale(DPR, DPR);
  }

  function drawWheel(rotOffset=0){
    const canvas=$('wheelCanvas');
    const ctx=canvas.getContext('2d');
    const cx=CSIZE/2, cy=CSIZE/2, r=CSIZE/2-5;
    ctx.clearRect(0,0,CSIZE,CSIZE);

    SEGMENTS.forEach(s=>{
      const start=s.startAngle+rotOffset-Math.PI/2;
      const end=s.endAngle+rotOffset-Math.PI/2;

      // Secteur
      ctx.beginPath();
      ctx.moveTo(cx,cy);
      ctx.arc(cx,cy,r,start,end);
      ctx.closePath();
      ctx.fillStyle=s.color;
      ctx.fill();
      ctx.strokeStyle='#0f172a';
      ctx.lineWidth=2;
      ctx.stroke();

      // Texte + emoji
      ctx.save();
      const mid=s.startAngle+s.angleSize/2+rotOffset-Math.PI/2;
      ctx.translate(cx+Math.cos(mid)*68,cy+Math.sin(mid)*68);
      ctx.rotate(mid+Math.PI/2);

      ctx.font='bold 12px Bebas Neue,Impact,sans-serif';
      ctx.fillStyle='white';
      ctx.textAlign='center';
      ctx.fillText(s.emoji,0,-8);
      ctx.font='bold 11px Bebas Neue,Impact,sans-serif';
      ctx.fillText(s.label,0,8);
      ctx.restore();
    });

    // Centre
    ctx.beginPath();
    ctx.arc(cx,cy,22,0,Math.PI*2);
    ctx.fillStyle='#0f172a';
    ctx.fill();
    ctx.strokeStyle='#fbbf24';
    ctx.lineWidth=3;
    ctx.stroke();

    ctx.font='bold 14px Bebas Neue,Impact,sans-serif';
    ctx.fillStyle='#fbbf24';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText('PORT',cx,cy);
  }


  function getSegmentAt(angle){
    // L'indicateur est en haut (angle 0) — on cherche quel segment est à -Math.PI/2
    const norm=((angle%(Math.PI*2))+(Math.PI*2))%(Math.PI*2);
    // Le pointeur est en haut, donc on cherche le segment dont le mid est à 0 après rotation
    return SEGMENTS.find(s=>{
      const mid=(s.midAngle+Math.PI*2)%(Math.PI*2);
      return Math.abs(mid-norm)<s.angleSize/2+0.01;
    })||SEGMENTS[0];
  }

  function setBet(val,id){
    bet=val;
    ['c500','c1000','c2000','c5000'].forEach(i=>$(i).classList.toggle('sel',i===id));
    $('betLabel').textContent=fmt(val)+'€';
  }

  function updateBal(){ $('balance').textContent=fmt(money)+'€'; }

  function spinWheel(){
    if(busy||bet<=0||money<bet) return;
    if(bet>50000) return;
    busy=true;
    money-=bet; updateBal();
    $('btnPlay').disabled=true;
    $('result').style.display='none';

    // Choisir un segment pondéré
    const rand=Math.random()*totalWeight;
    let acc=0,targetSeg=SEGMENTS[0];
    for(const s of SEGMENTS){
      acc+=s.weight;
      if(rand<acc){targetSeg=s;break;}
    }

    // Calculer l'angle final : plusieurs tours + atterrissage sur le segment cible
    // Le pointeur est en haut : le segment doit avoir son milieu à angle 0 mod 2PI après rotation
    // currentAngle est l'offset courant
    // On veut : (targetSeg.midAngle + finalAngle) mod 2PI = 0
    // donc finalAngle = -targetSeg.midAngle + epsilon_dans_segment
    const epsilon=(Math.random()-0.5)*targetSeg.angleSize*0.6;
    const targetAngle=-targetSeg.midAngle+epsilon;
    const turns=5+Math.floor(Math.random()*3);
    const totalRot=turns*Math.PI*2+((targetAngle-currentAngle)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);

    const duration=4000;
    const startAngle=currentAngle;
    const startTime=performance.now();

    function step(now){
      const t=Math.min((now-startTime)/duration,1);
      const ease=1-Math.pow(1-t,4);
      currentAngle=startAngle+totalRot*ease;
      drawWheel(currentAngle);
      if(t<1){
        requestAnimationFrame(step);
      } else {
        currentAngle=startAngle+totalRot;
        drawWheel(currentAngle);
        settle(targetSeg);
      }
    }
    requestAnimationFrame(step);
  }

  async function settle(seg){
    const el=$('result');
    if(seg.mult>0){
      const gain=Math.floor(bet*seg.mult);
      money+=gain; updateBal();
      const cls=seg.mult>=20?'jackpot':'win';
      el.textContent=`${seg.emoji} ${seg.label} ! +${fmt(gain)}€`;
      el.className='result '+cls;
    } else {
      el.textContent=`${seg.emoji} Perdu…`;
      el.className='result lose';
    }
    el.style.display='block';
    $('lastVal').textContent=`Dernier : ${seg.emoji} ${seg.label}`;
    busy=false;
    $('btnPlay').disabled=false;
    await saveMoney(money);
  }

  async function init(){
    const { data: _authData, error: _authError } = await sb.auth.getSession();
    if (_authError || !_authData.session) {
      await sb.auth.signOut().catch(() => {});
      window.location.href = 'index.html';
      return;
    }
    const session = _authData.session;
    currentUser=session.user;
    const {data}=await sb.from('game_stats').select('money').eq('user_id',currentUser.id).maybeSingle();
    money = data?.money || 0; localStorage.setItem("bd_money", money); updateBal();
    initCanvas();
    drawWheel(0);
  }

  document.addEventListener('gesturestart',e=>e.preventDefault());
  document.addEventListener('gesturechange',e=>e.preventDefault());

  async function saveMoney(amount) {
    const val = Math.floor(amount);
    localStorage.setItem('bd_money', val);
    if (!currentUser) return;
    for (let i = 0; i < 3; i++) {
      const { error } = await sb.from('game_stats').update({ money: val }).eq('user_id', currentUser.id);
      if (!error) return;
      await new Promise(r => setTimeout(r, 400));
    }
    console.warn('saveMoney: échec après 3 tentatives');
  }

  init();
</script>
</body>
</html>
