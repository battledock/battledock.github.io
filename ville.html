<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#5b9c4a">
<title>Le bourg</title>
<style>
:root{--encre:#2b2a27;--doux:#8a867e;--carte:#fffdf8;--champ:#f4f2ec;--bord:#e4e0d6;
  --vert:#4fa832;--vert-f:#3d8626;--vert-c:#67c447;--or:#f0b02e;--or-f:#c98f13;--rouge:#d9694a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#2f4a2c;color:var(--encre);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer;font-size:15px}
canvas#c{display:block;width:100%;height:100%;image-rendering:pixelated}

.haut{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;gap:8px;align-items:center;
  padding:calc(9px + env(safe-area-inset-top)) 12px 9px;pointer-events:none}
.haut>*{pointer-events:auto}
.jeton{display:flex;align-items:center;gap:7px;background:rgba(255,253,248,.95);border-radius:999px;
  padding:6px 13px 6px 7px;box-shadow:0 4px 14px rgba(20,40,20,.3);font-weight:650;font-size:14px}
.jeton .p{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:12px;color:#fff;background:linear-gradient(180deg,#ffd76b,var(--or))}
.jeton .p.b{background:linear-gradient(180deg,#8fd0ef,#5aa8c9)}
.haut .esp{flex:1}
.rond{width:38px;height:38px;border-radius:50%;background:rgba(255,253,248,.95);display:flex;
  align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(20,40,20,.3);font-size:17px}

#joy{position:fixed;left:16px;bottom:calc(18px + env(safe-area-inset-bottom));width:132px;height:132px;
  z-index:6;touch-action:none}
#action{position:fixed;right:18px;bottom:calc(40px + env(safe-area-inset-bottom));z-index:6;
  width:96px;height:96px;border-radius:50%;background:linear-gradient(180deg,#ffd76b,var(--or));
  color:#4a3208;font-weight:700;font-size:15px;box-shadow:0 7px 0 var(--or-f),0 12px 22px rgba(0,0,0,.3);
  display:none;align-items:center;justify-content:center;text-align:center;padding:10px;line-height:1.2}
#action.on{display:flex}
#action:active{transform:translateY(5px);box-shadow:0 2px 0 var(--or-f)}
.bulle{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:rgba(25,35,25,.82);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;z-index:5;
  transition:opacity .4s;white-space:nowrap}
.bulle.off{opacity:0}

#fen{position:fixed;inset:0;z-index:30;display:none;align-items:flex-end;background:rgba(15,30,15,.55)}
#fen.on{display:flex}
#fen .b{width:100%;background:var(--carte);border-radius:24px 24px 0 0;
  padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:82vh;overflow-y:auto;
  animation:monte .2s ease-out}
@keyframes monte{from{transform:translateY(26px)}}
#fen h2{font-size:19px;font-weight:650;margin-bottom:5px}
#fen p{font-size:13.5px;color:var(--doux);line-height:1.55}
.btp{border-radius:13px;padding:10px 14px;font-size:13.5px;font-weight:650;
  background:linear-gradient(180deg,#ffd76b,var(--or));color:#4a3208;box-shadow:0 4px 0 var(--or-f)}
.btp.v{background:linear-gradient(180deg,var(--vert-c),var(--vert));color:#fff;box-shadow:0 4px 0 var(--vert-f)}
.btp.large{width:100%;padding:14px;margin-top:12px;font-size:15px}
.btp:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.btp:disabled{filter:grayscale(.7);opacity:.55}
.fermer{width:100%;margin-top:12px;border-radius:15px;padding:14px;font-weight:650;
  background:var(--champ);color:var(--encre)}
.cmd{border:1px solid var(--bord);border-radius:16px;padding:12px;margin-top:10px}
.cmd .h{display:flex;align-items:center;gap:9px}
.cmd .h .q{flex:1;font-size:14px;font-weight:600}
.items{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.it{background:var(--champ);border-radius:10px;padding:6px 9px;font-size:13px}
.it.ok{background:#e7f5df;color:#2f6b22}
.it.non{background:#fdeceb;color:#a3312a}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);
  background:rgba(43,42,39,.92);color:#fff;padding:10px 16px;border-radius:999px;font-size:13.5px;
  z-index:40;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="haut">
  <div class="jeton"><span class="p">€</span><span id="j-or">0</span></div>
  <div class="jeton"><span class="p b">★</span><span id="j-niv">1</span></div>
  <div class="esp"></div>
  <button class="rond" id="heure">🕗</button>
  <button class="rond" id="retour">🌾</button>
</div>
<canvas id="joy" width="132" height="132"></canvas>
<button id="action">Entrer</button>
<div class="bulle" id="bulle">Déplace-toi avec le joystick</div>
<div id="fen"><div class="b" id="fen-b"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
const $=id=>document.getElementById(id);

/* ================= sauvegarde partagée ================= */
const CLE='bdl.ferme.v1';
const GRAINES=[{id:'ble',niv:1},{id:'carotte',niv:1},{id:'mais',niv:3},{id:'tomate',niv:5},{id:'citrouille',niv:8}];
const PRODUITS={ble:{em:'🌾',nom:'Blé',vend:26},carotte:{em:'🥕',nom:'Carotte',vend:58},
  mais:{em:'🌽',nom:'Maïs',vend:124},tomate:{em:'🍅',nom:'Tomate',vend:255},
  citrouille:{em:'🎃',nom:'Citrouille',vend:520},oeuf:{em:'🥚',nom:'Œuf',vend:34},
  lait:{em:'🥛',nom:'Lait',vend:72},pain:{em:'🥖',nom:'Pain',vend:130},
  fromage:{em:'🧀',nom:'Fromage',vend:230},conserve:{em:'🥫',nom:'Conserve',vend:480}};
const ATELIERS=[
  {id:'pain',nom:'Boulangerie',em:'🥖',entree:{ble:3},sortie:'pain',duree:90,niv:1,d:'3 blé → 1 pain'},
  {id:'fromage',nom:'Fromagerie',em:'🧀',entree:{lait:2},sortie:'fromage',duree:180,niv:3,d:'2 laits → 1 fromage'},
  {id:'conserve',nom:'Conserverie',em:'🥫',entree:{carotte:2,tomate:1},sortie:'conserve',duree:300,niv:5,d:'2 carottes + 1 tomate → 1 conserve'}];
const neuf=()=>({or:150,xp:0,niv:1,parcelles:3,ateliers:{},commandes:null,
  cases:Array.from({length:9},()=>({graine:null,fin:0})),poule:0,vache:0,
  derniere:Date.now(),stock:{},enAttente:{oeuf:0,lait:0},pret:null});
let e=neuf();
try{const b=localStorage.getItem(CLE);if(b)e=Object.assign(neuf(),JSON.parse(b));}catch(x){}
const sauver=()=>{try{localStorage.setItem(CLE,JSON.stringify(e));}catch(x){}};
const stock=k=>e.stock[k]||0, ajouter=(k,n)=>{e.stock[k]=stock(k)+n;};
const XP_NIV=n=>Math.round(40*Math.pow(1.55,n-1));
function gagnerXp(n){e.xp+=n;while(e.xp>=XP_NIV(e.niv)){e.xp-=XP_NIV(e.niv);e.niv++;toast('Niveau '+e.niv+' !');}}
const duree=s=>s<60?s+' s':(s<3600?Math.round(s/60)+' min':Math.round(s/360)/10+' h');
let tt;const toast=t=>{const z=$('toast');z.textContent=t;z.classList.add('on');
  clearTimeout(tt);tt=setTimeout(()=>z.classList.remove('on'),2200);};

/* ================= carte ================= */
const T=32, MX=44, MY=34;            // tuiles de 32 px, carte 44×34
const W_MONDE=MX*T, H_MONDE=MY*T;
// 0 herbe · 1 terre · 2 pavé · 3 eau · 4 herbe haute
const carte=[];
for(let y=0;y<MY;y++){carte.push([]);for(let x=0;x<MX;x++)carte[y].push(Math.random()<.08?4:0);}
const poser=(x1,y1,x2,y2,t)=>{for(let y=y1;y<=y2;y++)for(let x=x1;x<=x2;x++)
  if(carte[y]&&carte[y][x]!==undefined)carte[y][x]=t;};
poser(0,16,MX-1,17,1);                  // rue principale terre
poser(20,0,21,MY-1,1);                  // rue verticale
poser(17,12,25,21,2);                   // place pavée
poser(33,24,42,32,3);                   // étang
poser(31,23,32,32,1);poser(33,23,42,23,1);

const BATS=[
 {id:'pain',   x:6, y:8, l:5,h:4,nom:'Boulangerie',em:'🥖',mur:'#f0d6a4',toit:'#c9553a'},
 {id:'fromage',x:15,y:6, l:5,h:4,nom:'Fromagerie', em:'🧀',mur:'#ece5d0',toit:'#5f88b5'},
 {id:'coop',   x:26,y:7, l:6,h:4,nom:'Coopérative',em:'🏪',mur:'#f2ddbe',toit:'#d99a4a'},
 {id:'banque', x:35,y:9, l:5,h:5,nom:'Banque',     em:'🏦',mur:'#e6e6df',toit:'#7d838c'},
 {id:'conserve',x:7,y:22,l:5,h:4,nom:'Conserverie',em:'🥫',mur:'#dcc9ac',toit:'#5f8f57'},
 {id:'maison1',x:26,y:23,l:4,h:3,nom:'Chez Odile', em:'🏠',mur:'#e9cfd6',toit:'#a8607a'},
 {id:'maison2',x:14,y:27,l:4,h:3,nom:'Chez Karim', em:'🏠',mur:'#d6e2ec',toit:'#4f7d8f'}
];
const PANNEAU={x:19,y:19};              // panneau des commandes sur la place
const FONTAINE={x:21,y:15};

const solide=[];
for(let y=0;y<MY;y++){solide.push([]);for(let x=0;x<MX;x++)solide[y].push(carte[y][x]===3);}
BATS.forEach(b=>{for(let y=b.y;y<b.y+b.h;y++)for(let x=b.x;x<b.x+b.l;x++)
  if(solide[y])solide[y][x]=true;});
// portes traversables (au milieu du bas)
BATS.forEach(b=>{b.px=b.x+Math.floor(b.l/2);b.py=b.y+b.h;});
solide[FONTAINE.y][FONTAINE.x]=true;solide[FONTAINE.y][FONTAINE.x+1]=true;
solide[FONTAINE.y+1][FONTAINE.x]=true;solide[FONTAINE.y+1][FONTAINE.x+1]=true;

/* --- bordure du bourg --- */
const BORD=[];         // éléments décoratifs de la limite
const PORTAIL={x:20,y:MY-1};   // sortie vers la ferme, en bas de la rue verticale
(function limites(){
  for(let x=0;x<MX;x++){
    for(const y of [0,MY-1]){
      const sortie=(y===MY-1&&(x===PORTAIL.x||x===PORTAIL.x+1));
      solide[y][x]=!sortie;
      if(!sortie)BORD.push({x,y,t:(y===0?'haie':'cloture'),ph:Math.random()*6});
    }
  }
  for(let y=1;y<MY-1;y++){
    for(const x of [0,MX-1]){
      if(carte[y][x]===3)continue;
      solide[y][x]=true;
      BORD.push({x,y,t:x===0?'muret':'haie',ph:Math.random()*6});
    }
  }
})();

const ARBRES=[];
for(let i=0;i<70;i++){
  const x=Math.floor(Math.random()*MX),y=Math.floor(Math.random()*MY);
  if(carte[y][x]===3||carte[y][x]===1||carte[y][x]===2)continue;
  if(solide[y][x])continue;
  if(BATS.some(b=>x>=b.x-1&&x<=b.x+b.l&&y>=b.y-1&&y<=b.y+b.h+1))continue;
  solide[y][x]=true;ARBRES.push({x,y,t:Math.random()<.25?'buisson':'arbre',ph:Math.random()*6});
}
const FLEURS=[];
for(let i=0;i<60;i++){const x=Math.random()*W_MONDE,y=Math.random()*H_MONDE;
  const tx=Math.floor(x/T),ty=Math.floor(y/T);
  if(carte[ty]&&carte[ty][tx]===0&&!solide[ty][tx])FLEURS.push({x,y,c:['#e8607a','#f2c14e','#c98fe0','#fff'][i%4]});}

/* ================= joueur et pnj ================= */
const J={x:20*T+8,y:19*T,vx:0,vy:0,dir:'bas',pas:0,vit:2.4};
const NOMS=['Odile','Karim','Mme Ferrand','Lucien','Naïma','Bruno'];
const PNJ=NOMS.map((n,i)=>({nom:n,x:(10+i*5)*T,y:(17+(i%2)*3)*T,dir:'bas',pas:0,
  t:['#c9563a','#5aa8c9','#e0a86a','#7f97bd','#9a7ba8','#5f8f57'][i],
  peau:['#e8c49a','#d9a878','#b5825a','#8a5f3c','#f0d3ae','#c79268'][i],
  cheveux:['#3a2a1c','#6b4423','#1f1a16','#8a6a3a','#4a2f1c','#2b2a27'][i],
  cible:null,attente:0}));

/* ================= rendu ================= */
const cv=$('c'),g=cv.getContext('2d');
let W,H,DPR=Math.min(2,devicePixelRatio||1),camX=0,camY=0;
function taille(){W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;
  g.setTransform(DPR,0,0,DPR,0,0);g.imageSmoothingEnabled=false;}
addEventListener('resize',taille);taille();

let forcer=null;
const heureJeu=()=>forcer!==null?forcer:((Date.now()/60000)%24);
const nuit=()=>{const h=heureJeu();return h<6.5||h>=19.5;};
$('heure').onclick=()=>{forcer=nuit()?10:22;$('heure').textContent=forcer>=19?'🌙':'☀️';
  toast(forcer>=19?'La nuit tombe':'Le jour se lève');
  setTimeout(()=>{forcer=null;$('heure').textContent='🕗';},22000);};

function px(x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h);}
function melange(c1,c2,t){
  const p=x=>[parseInt(x.slice(1,3),16),parseInt(x.slice(3,5),16),parseInt(x.slice(5,7),16)];
  const a=p(c1),b=p(c2);
  return 'rgb('+a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(',')+')';
}

/* --- sol dessiné une fois dans un canevas hors écran --- */
let SOL_CV=null;
function alea(x,y,n){const v=Math.sin(x*127.1+y*311.7+n*74.7)*43758.5453;return v-Math.floor(v);}
function construireSol(){
  SOL_CV=document.createElement('canvas');
  SOL_CV.width=W_MONDE;SOL_CV.height=H_MONDE;
  const c=SOL_CV.getContext('2d');
  const P=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(x,y,w,h);};
  for(let y=0;y<MY;y++)for(let x=0;x<MX;x++){
    const t=carte[y][x], sx=x*T, sy=y*T;
    if(t===3){P(sx,sy,T,T,'#4592c4');continue;}
    if(t===1){
      P(sx,sy,T,T,'#b28c5f');
      for(let i=0;i<26;i++){const a=alea(x,y,i);
        P(sx+a*T,sy+alea(x,y,i+50)*T,2,2,a<.5?'#a8845a':'#bd9769');}
      for(let i=0;i<4;i++){const a=alea(x,y,i+9);
        P(sx+a*(T-6),sy+alea(x,y,i+70)*(T-6),4,3,'#8f7048');}
      continue;
    }
    if(t===2){
      P(sx,sy,T,T,'#a8a294');
      for(let j=0;j<2;j++)for(let i=0;i<2;i++){
        const dx=sx+i*16+((j%2)?3:0), dy=sy+j*16;
        const g2=alea(x+i,y+j,3);
        P(dx+1,dy+1,14,14,g2<.33?'#c2bcae':g2<.66?'#b9b3a4':'#aea89a');
        P(dx+1,dy+1,14,2,'#cbc5b7');
      }
      continue;
    }
    // herbe : trois tons + touffes + brins
    const base=alea(x,y,1);
    P(sx,sy,T,T,base<.34?'#6fb551':base<.68?'#68ad4b':'#75bb57');
    for(let i=0;i<40;i++){const a=alea(x,y,i+11),b=alea(x,y,i+31);
      P(sx+a*T,sy+b*T,2,2,(a+b)<1?'#5fa246':'#7cc25c');}
    for(let i=0;i<5;i++){const a=alea(x,y,i+61),b=alea(x,y,i+81);
      P(sx+a*(T-4),sy+b*(T-8),2,6,'#5c9c42');
      P(sx+a*(T-4)+2,sy+b*(T-8)+2,2,5,'#67ab4a');}
    if(t===4){
      for(let i=0;i<7;i++){const a=alea(x,y,i+101);
        P(sx+3+i*4,sy+8+a*10,3,14,'#54994a');P(sx+4+i*4,sy+6+a*10,2,12,'#63a854');}
    }
    if(alea(x,y,7)<.06)  // petite pierre
      P(sx+8+alea(x,y,8)*12,sy+10+alea(x,y,9)*10,7,5,'#9a9a8e');
  }
  // liseré de terre autour des chemins
  for(let y=0;y<MY;y++)for(let x=0;x<MX;x++){
    if(carte[y][x]!==0&&carte[y][x]!==4)continue;
    const v=[[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>
      carte[y+dy]&&(carte[y+dy][x+dx]===1||carte[y+dy][x+dx]===2));
    if(v){c.fillStyle='rgba(160,130,88,.35)';
      for(let i=0;i<16;i++){const a=alea(x,y,i+201);
        c.fillRect(x*T+a*T,y*T+alea(x,y,i+221)*T,3,3);}}
  }
}
function tuile(x,y,t){
  const sx=x*T-camX, sy=y*T-camY;
  if(sx<-T||sy<-T||sx>W||sy>H)return;
  const v=((x*7+y*13)%5);
  if(t===3){
    const on=Math.sin(Date.now()/700+x+y)*0.5+0.5;
    px(sx,sy,T,T,on>0.5?'#4f9fd0':'#4592c4');
    if((x+y)%3===0)px(sx+6,sy+8+Math.sin(Date.now()/500+x)*2,14,3,'rgba(255,255,255,.35)');
    return;
  }
  if(t===1){px(sx,sy,T,T,v<2?'#b08b5e':'#a8845a');
    px(sx+((x*5)%T),sy+((y*11)%T),4,3,'#98764e');return;}
  if(t===2){px(sx,sy,T,T,'#b9b3a4');
    px(sx,sy,T,2,'#c6c0b0');px(sx,sy+T-2,T,2,'#a8a294');
    px(sx+((x%2)?0:T/2),sy+T/2-1,T/2,2,'#a8a294');return;}
  px(sx,sy,T,T,v<2?'#6db24f':(v<4?'#67ab4a':'#72b954'));
  if(v===0)px(sx+7,sy+11,3,3,'#5c9c42');
  if(v===3)px(sx+18,sy+20,3,3,'#5c9c42');
  if(t===4){px(sx+6,sy+14,3,10,'#4f9440');px(sx+13,sy+10,3,14,'#59a247');px(sx+20,sy+15,3,9,'#4f9440');}
}

const CYCLE=[0,1,0,2];              // 4 temps : contact, passage, contact, passage
function perso(x,y,dir,pas,corps,peau,cheveux,nom,nt){
  const sx=Math.round(x-camX), sy=Math.round(y-camY);
  if(sx<-44||sy<-70||sx>W+44||sy>H+44)return;

  const bouge=pas>0;
  const f=bouge?CYCLE[Math.floor(pas)%4]:0;
  const t=Date.now();
  const souffle=bouge?0:(Math.sin(t/900)>0?0:1);      // respiration à l'arrêt
  const bob=bouge?(f===0?0:-1):-souffle;              // le corps monte au passage
  const jambe=bouge?(Math.floor(pas)%4<2?1:-1):0;     // jambe avant / arrière
  const bras=bouge?(Math.floor(pas)%4<2?-1:1):0;
  const O='#26211c';                                   // contour
  const peauO=melange(peau,'#000000',.22);
  const corpsO=melange(corps,'#000000',.28);
  const corpsC=melange(corps,'#ffffff',.18);
  const chevO=melange(cheveux,'#000000',.3);

  // ombre portée, plus fine quand on marche
  g.fillStyle='rgba(20,30,20,.24)';
  g.beginPath();g.ellipse(sx,sy+1,bouge?9:10,3.4,0,0,7);g.fill();

  const yb=sy+bob;

  /* ---- jambes ---- */
  const jA=jambe*2, jB=-jambe*2;
  // jambe arrière (plus foncée)
  px(sx-6+ (dir==='gauche'?1:0), yb-13, 5, 13, melange('#3f4a5c','#000000',.25));
  px(sx-6, yb-2+Math.max(0,jB), 6, 3, melange('#5a3f2a','#000000',.2));
  // jambe avant
  px(sx+1, yb-13, 5, 13, '#3f4a5c');
  px(sx+1, yb-2+Math.max(0,jA), 6, 3, '#5a3f2a');
  // décalage marche
  if(bouge){

  /* ---- torse ---- */

function batiment(b,nt){
  const sx=b.x*T-camX, sy=b.y*T-camY, w=b.l*T, h=b.h*T;
  if(sx+w<-20||sy+h<-60||sx>W+20||sy>H+20)return;
  // ombre
  px(sx+4,sy+h-6,w,10,'rgba(20,30,20,.2)');
  // murs
  px(sx,sy+18,w,h-18,b.mur);
  px(sx,sy+18,w,4,'rgba(255,255,255,.3)');
  px(sx,sy+h-8,w,8,'rgba(0,0,0,.12)');
  for(let i=0;i<w;i+=8)px(sx+i,sy+22,1,h-30,'rgba(0,0,0,.05)');
  // toit
  g.fillStyle=b.toit;
  g.beginPath();g.moveTo(sx-9,sy+22);g.lineTo(sx+w/2,sy-16);g.lineTo(sx+w+9,sy+22);g.closePath();g.fill();
  g.fillStyle='rgba(255,255,255,.16)';
  g.beginPath();g.moveTo(sx-9,sy+22);g.lineTo(sx+w/2,sy-16);g.lineTo(sx+w/2,sy+22);g.closePath();g.fill();
  for(let i=0;i<5;i++)px(sx-6+i*(w/4.4),sy+22-i*2,3,2,'rgba(0,0,0,.10)');
  // fenêtres
  const nf=Math.max(1,Math.floor(w/64));
  for(let i=0;i<nf;i++){
    const fx=sx+18+i*64, fy=sy+34;
    px(fx,fy,26,22,nt?'#ffdf8a':'#a9d6ef');
    px(fx,fy,26,3,'#8a6a4a');px(fx+12,fy,2,22,'#8a6a4a');
    if(nt){g.fillStyle='rgba(255,223,138,.18)';g.fillRect(fx-10,fy+22,46,40);}
  }
  // porte, qui s'entrouvre quand on est devant
  const dx=b.px*T-camX+2, dy=sy+h-30;
  const devant=proche&&proche.type==='bat'&&proche.b===b;
  px(dx,dy,28,30,'#6f4520');
  if(devant){
    px(dx+3,dy+3,8,27,'#2a1d12');
    px(dx+11,dy+3,14,27,'#a8703a');
    px(dx+22,dy+16,3,3,'#f2d47a');
    g.fillStyle='rgba(255,226,150,.35)';
    g.beginPath();g.moveTo(dx+3,dy+30);g.lineTo(dx+11,dy+30);g.lineTo(dx+18,dy+52);g.lineTo(dx-6,dy+52);g.closePath();g.fill();
  }else{
    px(dx+3,dy+3,22,27,'#a8703a');
    px(dx+20,dy+16,3,3,'#f2d47a');
  }
  px(dx-4,dy+30,36,4,'#b9b3a4');
  // enseigne
  g.font='600 12px -apple-system,Arial';g.textAlign='center';
  const cx=sx+w/2, ty=sy+2;
  const lw=g.measureText(b.nom).width+34;
  g.fillStyle='rgba(255,253,248,.95)';
  if(g.roundRect){g.beginPath();g.roundRect(cx-lw/2,ty-16,lw,20,7);g.fill();}
  else g.fillRect(cx-lw/2,ty-16,lw,20);
  g.fillStyle='#2b2a27';g.font='13px serif';g.fillText(b.em,cx-lw/2+13,ty-1);
  g.font='600 12px -apple-system,Arial';g.fillText(b.nom,cx+7,ty-2);
  const n=alerte(b);
  if(n){g.beginPath();g.arc(cx+lw/2-2,ty-18,10,0,7);g.fillStyle='#d9694a';g.fill();
    g.fillStyle='#fff';g.font='700 12px -apple-system,Arial';g.fillText(n,cx+lw/2-2,ty-14);}
}
function arbre(a,nt){
  const sx=a.x*T-camX+16, sy=a.y*T-camY+26;

  }else{
    px(sx-4,sy-16,8,16,nt?'#4a3524':'#7a5334');
    g.fillStyle=nt?'#2c5c3a':'#4e9145';
    g.beginPath();g.ellipse(sx+b,sy-34,22,19,0,0,7);g.fill();
    g.fillStyle=nt?'#356b44':'#5aa350';
    g.beginPath();g.ellipse(sx-7+b,sy-42,14,12,0,0,7);g.fill();
    g.fillStyle=nt?'#265333':'#43843d';
    g.beginPath();g.ellipse(sx+9+b,sy-28,12,10,0,0,7);g.fill();

}
function bordure(b,nt){
  const sx=b.x*T-camX, sy=b.y*T-camY;
  if(sx<-T||sy<-T*2||sx>W||sy>H)return;
  if(b.t==='haie'){
    const v=nt?'#2c5c3a':'#4a8f42', v2=nt?'#356b44':'#59a34e';
    px(sx,sy+4,T,T-6,v);
    px(sx+2,sy+2,T-4,10,v2);
    px(sx+5,sy+9,4,4,nt?'#265333':'#3f7d39');
    px(sx+19,sy+15,4,4,nt?'#265333':'#3f7d39');
    if((b.x+b.y)%4===0)px(sx+13,sy+7,4,4,nt?'#7a4a5a':'#e8607a');
  }else if(b.t==='cloture'){
    const bo=nt?'#5b4226':'#9a6f42';
    px(sx,sy+10,T,5,bo);px(sx,sy+20,T,5,bo);
    px(sx+4,sy+4,5,26,nt?'#4a3520':'#7d5934');

    const pi=nt?'#5f6670':'#a8aca6', pi2=nt?'#4a5058':'#8f948d';

    for(let i=0;i<3;i++)px(sx+((i%2)?0:6),sy+8+i*8,T-8,6,pi2);

}

function fontaine(nt){

function panneau(nt){
  const sx=PANNEAU.x*T-camX, sy=PANNEAU.y*T-camY;
  px(sx+6,sy+20,5,16,'#7a5334');px(sx+21,sy+20,5,16,'#7a5334');

  px(sx+5,sy+2,10,3,'#8a5a2e');px(sx+5,sy+9,20,3,'#8a5a2e');px(sx+5,sy+15,14,3,'#8a5a2e');
  const n=alerte({id:'commandes'});
  if(n){g.beginPath();g.arc(sx+36,sy-8,10,0,7);g.fillStyle='#d9694a';g.fill();
    g.fillStyle='#fff';g.font='700 12px -apple-system,Arial';g.textAlign='center';g.fillText(n,sx+36,sy-4);}

function alerte(b){
  if(b.id==='commandes'){assurerCommandes();
    return (e.commandes||[]).filter(c=>Object.entries(c.items).every(([k,q])=>stock(k)>=q)).length||0;}
  const a=ATELIERS.find(x=>x.id===b.id);
  if(a){const w=e.ateliers[a.id];return (w&&Date.now()>=w.fin)?1:0;}
  return 0;
}

const PAPILLONS=Array.from({length:8},()=>({x:Math.random()*W_MONDE,y:Math.random()*H_MONDE,
  ph:Math.random()*6,c:['#f2c14e','#f0a0c0','#fff','#a8d8ef'][Math.floor(Math.random()*4)]}));
const OISEAUX=Array.from({length:4},()=>({x:Math.random()*W_MONDE,y:Math.random()*260,
  v:0.6+Math.random()*0.7,ph:Math.random()*6}));
function fumee(b,nt){
  const cx=b.x*T+b.l*T-18-camX, base=b.y*T-camY-4;
  px(cx,base-16,10,18,nt?'#5b4226':'#8a6a4a');
  for(let i=0;i<3;i++){
    const t=((Date.now()/26)+i*40)%120;
    const a=(1-t/120)*0.5;
    g.globalAlpha=a;g.fillStyle='#f4f1ea';
    g.beginPath();g.arc(cx+5+Math.sin(t/18+i)*7,base-20-t*0.6,4+t*0.1,0,7);g.fill();
  }
  g.globalAlpha=1;
}
function dessiner(){
  const nt=nuit();
  camX=Math.max(0,Math.min(W_MONDE-W,J.x-W/2));
  camY=Math.max(0,Math.min(H_MONDE-H,J.y-H/2));
  if(W_MONDE<W)camX=(W_MONDE-W)/2;
  if(H_MONDE<H)camY=(H_MONDE-H)/2;

  const x0=Math.max(0,Math.floor(camX/T)-1),x1=Math.min(MX-1,Math.ceil((camX+W)/T));
  const y0=Math.max(0,Math.floor(camY/T)-1),y1=Math.min(MY-1,Math.ceil((camY+H)/T));
  g.fillStyle='#2f4a2c';g.fillRect(0,0,W,H);
  if(!SOL_CV)construireSol();
  g.drawImage(SOL_CV,camX,camY,Math.min(W,W_MONDE),Math.min(H,H_MONDE),
              0,0,Math.min(W,W_MONDE),Math.min(H,H_MONDE));
  // l'eau reste animée par-dessus
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(carte[y][x]===3)tuile(x,y,3);
  FLEURS.forEach(f=>{const sx=f.x-camX,sy=f.y-camY;
    if(sx>-8&&sy>-8&&sx<W&&sy<H){px(sx,sy,3,3,f.c);px(sx+1,sy+3,1,3,'#4f9440');}});

  const objets=[];
  BORD.forEach(b=>objets.push({y:b.y*T+30,f:()=>bordure(b,nt)}));
  objets.push({y:PORTAIL.y*T+10,f:()=>portail(nt)});
  BATS.forEach(b=>objets.push({y:(b.y+b.h)*T,f:()=>batiment(b,nt)}));
  ARBRES.forEach(a=>objets.push({y:a.y*T+30,f:()=>arbre(a,nt)}));
  objets.push({y:(FONTAINE.y+2)*T,f:()=>fontaine(nt)});
  objets.push({y:(PANNEAU.y+1)*T,f:()=>panneau(nt)});
  PNJ.forEach(p=>objets.push({y:p.y,f:()=>perso(p.x,p.y,p.dir,p.pas,p.t,p.peau,p.cheveux,
    Math.hypot(p.x-J.x,p.y-J.y)<95?p.nom:null,nt)}));
  objets.push({y:J.y,f:()=>perso(J.x,J.y,J.dir,J.pas,'#3f9c4e','#e8c49a','#5a3f2a',null,nt)});
  objets.sort((a,b)=>a.y-b.y).forEach(o=>o.f());

  // cheminées qui fument
  BATS.filter(b=>b.id.startsWith('maison')||b.id==='pain').forEach(b=>fumee(b,nt));

  // papillons de jour
  if(!nt)PAPILLONS.forEach(p=>{
    const t=Date.now()/700+p.ph;
    const sx=p.x+Math.sin(t)*26-camX, sy=p.y+Math.cos(t*1.3)*18-camY;
    if(sx<-10||sy<-10||sx>W||sy>H)return;
    const b=Math.sin(Date.now()/90+p.ph)>0?1:-1;
    px(sx,sy,3,3,p.c);px(sx+3*b,sy-2,3,3,p.c);
  });
  // oiseaux qui traversent
  OISEAUX.forEach(o=>{o.x+=o.v;if(o.x>W_MONDE)o.x=-40;
    const sx=o.x-camX*0.85,sy=o.y-camY*0.85;
    if(sx<-20||sy<-20||sx>W||sy>H)return;
    const w=Math.sin(Date.now()/110+o.ph)*4;
    g.strokeStyle='rgba(50,60,60,.55)';g.lineWidth=2;
    g.beginPath();g.moveTo(sx-6,sy);g.lineTo(sx,sy-w);g.lineTo(sx+6,sy);g.stroke();});

  if(nt){
    g.fillStyle='rgba(16,26,48,.42)';g.fillRect(0,0,W,H);
    // halo autour du joueur
    const grd=g.createRadialGradient(J.x-camX,J.y-20-camY,10,J.x-camX,J.y-20-camY,140);
    grd.addColorStop(0,'rgba(255,226,150,.22)');grd.addColorStop(1,'rgba(255,226,150,0)');
    g.fillStyle=grd;g.fillRect(J.x-camX-160,J.y-camY-180,320,320);
  }
}

  pain:     {sol:'#c49a68',mur:'#e8d6b4',compte:'#a8703a',nom:'Boulangerie',

const RX=12,RY=8;                       // pièce de 12×8 tuiles
let lieu=null;                          // null = dehors, sinon id du bâtiment
let fondu=0,fonduSens=0,fonduSuite=null;
function transition(fn){fondu=0.01;fonduSens=1;fonduSuite=fn;}

function entrer(id){transition(()=>{
  lieu=id;J.x=(RX/2)*T; J.y=(RY-1)*T-6; J.dir='haut';
});}
function sortir(){transition(()=>{
  const b=BATS.find(x=>x.id===lieu);
  lieu=null;
  if(b){J.x=b.px*T+16;J.y=(b.y+b.h)*T+22;J.dir='bas';}
});}

function solideInterieur(x,y){
  const tx=Math.floor(x/T),ty=Math.floor(y/T);
  if(tx<1||ty<2||tx>RX-2||ty>RY-1)return true;
  const m=MEUBLES[lieu];
  if(m.compte&&ty<=3&&tx>=1&&tx<=RX-2&&ty===3)return false;
  return m.obj.some(([t,ox,oy])=>tx>=ox&&tx<=ox+1&&ty>=oy+2&&ty<=oy+3);
}
function dessinerInterieur(){
  const m=MEUBLES[lieu];
  const rw=RX*T, rh=RY*T;
  camX=-(W-rw)/2; camY=-(H-rh)/2;
  g.fillStyle='#1c1712';g.fillRect(0,0,W,H);
  const ox2=-camX, oy2=-camY;
  const P=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(ox2+x,oy2+y,w,h);};
  // mur du fond
  P(0,0,rw,2*T,m.mur);
  P(0,2*T-6,rw,6,melange(m.mur,'#000000',.25));
  for(let x=0;x<rw;x+=T)P(x,0,1,2*T,'rgba(0,0,0,.05)');
  // fenêtres au mur
  [2,8].forEach(fx=>{
    P(fx*T,22,T+14,T+6,'#8a6a4a');P(fx*T+4,26,T+6,T-2,nuit()?'#2a3a52':'#a9d6ef');
    P(fx*T+4+((T+6)/2)-1,26,2,T-2,'#8a6a4a');
    if(!nuit()){g.fillStyle='rgba(255,240,190,.18)';
      g.beginPath();g.moveTo(ox2+fx*T,oy2+2*T);g.lineTo(ox2+fx*T+T+14,oy2+2*T);
      g.lineTo(ox2+fx*T+T+60,oy2+rh);g.lineTo(ox2+fx*T-40,oy2+rh);g.closePath();g.fill();}
  });
  // plancher
  for(let y=2*T;y<rh;y+=T){
    for(let x=0;x<rw;x+=T){
      const a=alea(x,y,3);
      P(x,y,T,T,a<.4?m.sol:(a<.75?melange(m.sol,'#000000',.08):melange(m.sol,'#ffffff',.07)));
      P(x,y,T,2,'rgba(0,0,0,.10)');
      P(x+((y/T)%2?0:T/2)-1,y,2,T,'rgba(0,0,0,.08)');
    }
  }
  // tapis
  P(3*T,4*T,6*T,3*T,melange(m.vendeur,'#ffffff',.55));
  P(3*T+8,4*T+8,6*T-16,3*T-16,melange(m.vendeur,'#ffffff',.72));
  // meubles
  m.obj.forEach(([t,x,y])=>{
    const px2=x*T, py2=(y+2)*T;
    if(t==='etagere'){P(px2,py2-30,2*T,42,'#8a5a2e');P(px2+3,py2-26,2*T-6,12,'#c9a97a');
      P(px2+3,py2-10,2*T-6,12,'#c9a97a');
      for(let i=0;i<4;i++)P(px2+8+i*14,py2-24,9,9,['#e8607a','#f2c14e','#8fd0ef','#a8d47f'][i]);}
    if(t==='four'){P(px2,py2-36,2*T,48,'#8a8f96');P(px2+8,py2-24,2*T-16,24,'#3a3a44');
      P(px2+14,py2-18,2*T-28,12,'#f0894c');P(px2,py2-42,2*T,8,'#6b7280');}
    if(t==='tonneau'){P(px2+6,py2-30,T-4,38,'#a8703a');P(px2+6,py2-24,T-4,5,'#7d5934');
      P(px2+6,py2-6,T-4,5,'#7d5934');}
    if(t==='caisse'){P(px2+4,py2-24,T-4,30,'#c08a52');P(px2+4,py2-24,T-4,4,'#d9a878');
      P(px2+4,py2-12,T-4,4,'#8a5a2e');}
    if(t==='coffre'){P(px2,py2-30,2*T,38,'#6b7280');P(px2,py2-30,2*T,8,'#8a8f96');
      P(px2+T-8,py2-16,16,12,'#f2c14e');}
    if(t==='plante'){P(px2+10,py2-10,18,16,'#a8703a');
      g.fillStyle='#4e9145';g.beginPath();g.ellipse(ox2+px2+19,oy2+py2-24,16,16,0,0,7);g.fill();}
    if(t==='lit'){P(px2,py2-20,2*T,52,'#8a5a2e');P(px2+4,py2-14,2*T-8,40,'#e8dcc6');
      P(px2+4,py2-14,2*T-8,14,'#c96a82');}
    if(t==='table'){P(px2,py2-14,2*T,30,'#a8703a');P(px2+4,py2-10,2*T-8,18,'#c9a97a');
      P(px2+18,py2-18,10,8,'#f2c14e');}
    if(t==='tableau'){P(px2,py2-46,2*T,34,'#6b5334');P(px2+5,py2-41,2*T-10,24,'#cfe0ea');}
  });
  // comptoir + commerçant
  if(m.compte){
    const cy=3*T+10;
    P(2*T,cy,8*T,26,m.compte);
    P(2*T,cy,8*T,6,melange(m.compte,'#ffffff',.3));
    P(2*T,cy+26,8*T,6,melange(m.compte,'#000000',.35));
    perso(ox2+6*T, oy2+cy-4, 'bas', 0, m.vendeur, '#e8c49a', '#3a2a1c', null, false);
  }
  // porte de sortie
  const dx=(RX/2)*T-16;
  P(dx,rh-14,32,14,'#8a5a2e');P(dx+3,rh-11,26,11,'#a8703a');
  g.font='600 11px -apple-system,Arial';g.textAlign='center';
  g.fillStyle='rgba(255,253,248,.9)';g.fillRect(ox2+dx-14,oy2+rh-38,60,16);
  g.fillStyle='#2b2a27';g.fillText('sortie',ox2+dx+16,oy2+rh-26);
  // le joueur
  perso(J.x,J.y,J.dir,J.pas,'#3f9c4e','#e8c49a','#5a3f2a',null,false);
  // vignette chaleureuse
  const grd=g.createRadialGradient(W/2,H/2,Math.min(W,H)*0.25,W/2,H/2,Math.max(W,H)*0.7);
  grd.addColorStop(0,'rgba(0,0,0,0)');grd.addColorStop(1,'rgba(20,14,8,.5)');
  g.fillStyle=grd;g.fillRect(0,0,W,H);
  // titre du lieu
  g.font='600 13px -apple-system,Arial';g.textAlign='center';
  g.fillStyle='rgba(255,253,248,.92)';
  const w=g.measureText(m.nom).width+28;
  g.fillRect(W/2-w/2,14+ (window.innerHeight>700?24:8),w,26);
  g.fillStyle='#2b2a27';g.fillText(m.nom,W/2,32+(window.innerHeight>700?24:8));
}

/* ================= déplacement ================= */
const touches={h:0,b:0,g:0,d:0};
const CLAV={ArrowUp:'h',ArrowDown:'b',ArrowLeft:'g',ArrowRight:'d',z:'h',s:'b',q:'g',d:'d',w:'h',a:'g'};
addEventListener('keydown',ev=>{const k=CLAV[ev.key]||CLAV[(ev.key||'').toLowerCase()];
  if(k){touches[k]=1;ev.preventDefault();}if(ev.key==='Enter')agir();});
addEventListener('keyup',ev=>{const k=CLAV[ev.key]||CLAV[(ev.key||'').toLowerCase()];if(k)touches[k]=0;});

function bloque(x,y){
  if(lieu)return solideInterieur(x,y);
  const tx=Math.floor(x/T),ty=Math.floor(y/T);
  if(tx<0||ty<0||tx>=MX||ty>=MY)return true;
  return solide[ty][tx];
}
function deplacer(o,dx,dy,vit){
  const nx=o.x+dx*vit;
  if(!bloque(nx-7,o.y-4)&&!bloque(nx+7,o.y-4)&&!bloque(nx-7,o.y-1)&&!bloque(nx+7,o.y-1))o.x=nx;
  const ny=o.y+dy*vit;
  if(!bloque(o.x-7,ny-4)&&!bloque(o.x+7,ny-4)&&!bloque(o.x-7,ny-1)&&!bloque(o.x+7,ny-1))o.y=ny;
  if(!lieu){o.x=Math.max(10,Math.min(W_MONDE-10,o.x));o.y=Math.max(24,Math.min(H_MONDE-4,o.y));}
}
function majJoueur(){
  let dx=(touches.d?1:0)-(touches.g?1:0), dy=(touches.b?1:0)-(touches.h?1:0);
  dx+=joyX;dy+=joyY;
  const n=Math.hypot(dx,dy);
  if(n>0.12){
    dx/=n||1;dy/=n||1;
    deplacer(J,dx,dy,J.vit*Math.min(1,n));
    J.pas+=0.22;
    J.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'droite':'gauche'):(dy>0?'bas':'haut');
  }else J.pas=0;
}
function majPnj(){
  PNJ.forEach(p=>{
    if(p.attente>0){p.attente--;p.pas=0;return;}
    if(!p.cible||Math.hypot(p.cible.x-p.x,p.cible.y-p.y)<6){
      if(Math.random()<.35){p.attente=40+Math.random()*120;return;}
      let tx,ty,n=0;
      do{tx=Math.floor(Math.random()*MX);ty=Math.floor(Math.random()*MY);n++;}
      while(n<30&&(solide[ty][tx]||carte[ty][tx]===3));
      p.cible={x:tx*T+16,y:ty*T+20};
    }
    const dx=p.cible.x-p.x,dy=p.cible.y-p.y,d=Math.hypot(dx,dy)||1;
    const ax=dx/d, ay=dy/d;
    const avx=p.x, avy=p.y;
    deplacer(p,ax,ay,1.1);
    if(Math.abs(p.x-avx)<0.05&&Math.abs(p.y-avy)<0.05)p.cible=null;
    p.pas+=0.16;
    p.dir=Math.abs(ax)>Math.abs(ay)?(ax>0?'droite':'gauche'):(ay>0?'bas':'haut');
  });
}

/* ---- joystick ---- */
const jc=$('joy'),jg=jc.getContext('2d');
let joyX=0,joyY=0,jid=null,jdx=0,jdy=0,jactif=false;
const R=54,JCX=66,JCY=66;
function joyPose(x,y){
  const dx=x-JCX,dy=y-JCY,d=Math.hypot(dx,dy),m=Math.min(d,R),a=Math.atan2(dy,dx);
  jdx=Math.cos(a)*m;jdy=Math.sin(a)*m;
  joyX=(jdx/R);joyY=(jdy/R);
  if(Math.hypot(joyX,joyY)<0.18){joyX=joyY=0;}
}
const jpos=t=>{const r=jc.getBoundingClientRect();
  return[(t.clientX-r.left)*jc.width/r.width,(t.clientY-r.top)*jc.height/r.height];};
jc.addEventListener('touchstart',ev=>{ev.preventDefault();const t=ev.changedTouches[0];jid=t.identifier;
  jactif=true;joyPose(...jpos(t));$('bulle').classList.add('off');},{passive:false});
jc.addEventListener('touchmove',ev=>{ev.preventDefault();
  for(const t of ev.changedTouches)if(t.identifier===jid)joyPose(...jpos(t));},{passive:false});
['touchend','touchcancel'].forEach(k=>jc.addEventListener(k,ev=>{ev.preventDefault();
  for(const t of ev.changedTouches)if(t.identifier===jid){jactif=false;jid=null;jdx=jdy=joyX=joyY=0;}},{passive:false}));
jc.addEventListener('mousedown',ev=>{jactif=true;joyPose(...jpos(ev));$('bulle').classList.add('off');});
addEventListener('mousemove',ev=>{if(jactif)joyPose(...jpos(ev));});
addEventListener('mouseup',()=>{if(jactif){jactif=false;jdx=jdy=joyX=joyY=0;}});
function dessinerJoy(){
  jg.clearRect(0,0,132,132);
  jg.fillStyle='rgba(255,253,248,.55)';jg.beginPath();jg.arc(JCX,JCY,R,0,7);jg.fill();
  jg.strokeStyle='rgba(43,42,39,.35)';jg.lineWidth=3;jg.beginPath();jg.arc(JCX,JCY,R,0,7);jg.stroke();
  jg.fillStyle=jactif?'#4fa832':'rgba(255,253,248,.95)';
  jg.beginPath();jg.arc(JCX+jdx,JCY+jdy,22,0,7);jg.fill();
  jg.strokeStyle='rgba(43,42,39,.5)';jg.lineWidth=3;jg.beginPath();jg.arc(JCX+jdx,JCY+jdy,22,0,7);jg.stroke();
}

/* ---- interaction ---- */
let proche=null;
function majProche(){
  if(lieu){
    const dx=Math.abs(J.x-(RX/2)*T), dy=(RY*T)-J.y;
    proche=(dx<40&&dy<40)?{type:'sortie'}:
      (MEUBLES[lieu].compte&&J.y<5.4*T)?{type:'compte'}:null;
    const a=$('action');
    if(proche){a.classList.add('on');
      a.textContent=proche.type==='sortie'?'Sortir':'Parler';}
    else a.classList.remove('on');
    return;
  }
  // sortie vers la ferme
  if(J.y>(MY-1.4)*T&&J.x>PORTAIL.x*T-8&&J.x<(PORTAIL.x+2)*T+8){
    sauver();location.href='jeu.html';return;
  }
  proche=null;
  BATS.forEach(b=>{
    const dx=(b.px*T+16)-J.x, dy=(b.y+b.h)*T-J.y;
    if(Math.abs(dx)<34&&dy>-10&&dy<44)proche={type:'bat',b};
  });
  if(!proche){
    const dp=Math.hypot(PANNEAU.x*T+16-J.x,PANNEAU.y*T+30-J.y);
    if(dp<44)proche={type:'panneau'};
    const df=Math.hypot(FONTAINE.x*T+32-J.x,FONTAINE.y*T+40-J.y);
    if(df<52)proche={type:'fontaine'};
  }
  const a=$('action');
  if(proche){
    a.classList.add('on');
    a.textContent=proche.type==='bat'?('Entrer\n'+proche.b.nom).replace('\n',' · ')
      :proche.type==='panneau'?'Lire le panneau':'La fontaine';
  }else a.classList.remove('on');
}
function agir(){
  if(!proche)return;
  if(proche.type==='sortie')return sortir();
  if(proche.type==='compte'){
    if(lieu==='coop')return ouvrirCoop();
    if(lieu==='banque')return ouvrirBanque();
    const at=ATELIERS.find(x=>x.id===lieu);
    if(at)return ouvrirAtelier(at);
    return;
  }
  if(proche.type==='panneau')return ouvrirCommandes();
  if(proche.type==='fontaine')return ouvrirPlace();
  const b=proche.b;
  if(b.id==='coop')return ouvrirCoop();
  if(b.id==='banque')return ouvrirBanque();
  return entrer(b.id);
}
$('action').onclick=agir;

/* ================= panneaux ================= */
function fenetre(html){
  $('fen-b').innerHTML=html+'<button class="fermer" id="f-x">Fermer</button>';
  $('fen').classList.add('on');$('f-x').onclick=()=>$('fen').classList.remove('on');
}
function ouvrirAtelier(a){
  if(a.niv>e.niv)return fenetre('<h2>'+a.em+' '+a.nom+'</h2><p>Ouvre au niveau '+a.niv+'. Tu es niveau '+e.niv+'.</p>');
  const w=e.ateliers[a.id],pret=w&&Date.now()>=w.fin,encours=w&&!pret;
  const manque=Object.entries(a.entree).some(([k,n])=>stock(k)<n);
  let h='<h2>'+a.em+' '+a.nom+'</h2>';
  if(pret)h+='<p>Ta fournée est prête.</p>';
  else if(encours)h+='<p>En cours — prêt dans '+duree(Math.ceil((w.fin-Date.now())/1000))+'.</p>';
  else h+='<p>'+a.d+' · '+duree(a.duree)+'<br>Revente : '+PRODUITS[a.sortie].vend+' €</p><div class="items">'+
    Object.entries(a.entree).map(([k,n])=>'<span class="it '+(stock(k)>=n?'ok':'non')+'">'+
      PRODUITS[k].em+' '+stock(k)+'/'+n+'</span>').join('')+'</div>';
  if(!encours)h+='<button class="btp v large" id="go"'+((!pret&&manque)?' disabled':'')+'>'+
    (pret?'Récupérer':'Lancer')+'</button>';
  fenetre(h);
  const bt=$('go');if(bt)bt.onclick=()=>{
    if(pret){ajouter(a.sortie,1);gagnerXp(6);delete e.ateliers[a.id];toast('+1 '+PRODUITS[a.sortie].nom);}
    else{Object.entries(a.entree).forEach(([k,n])=>{e.stock[k]=stock(k)-n;});
      e.ateliers[a.id]={fin:Date.now()+a.duree*1000};toast('C’est parti');}
    $('fen').classList.remove('on');sauver();maj();};
}
function nouvelleCommande(){
  const dispo=Object.keys(PRODUITS).filter(k=>{
    const gr=GRAINES.find(x=>x.id===k);
    if(gr)return gr.niv<=e.niv;
    if(k==='oeuf')return e.poule>0;
    if(k==='lait')return e.vache>0;
    const a=ATELIERS.find(x=>x.sortie===k);return a?a.niv<=e.niv:false;});
  if(!dispo.length)return null;
  const n=1+Math.min(2,Math.floor(e.niv/3)),items={};
  for(let i=0;i<n;i++){const k=dispo[Math.random()*dispo.length|0];
    items[k]=(items[k]||0)+1+Math.floor(Math.random()*3);}
  const val=Object.entries(items).reduce((s,[k,q])=>s+PRODUITS[k].vend*q,0);
  return{client:NOMS[Math.random()*NOMS.length|0],items,or:Math.round(val*1.5),
    xp:Math.max(4,Math.round(val/22))};
}
function assurerCommandes(){if(!e.commandes)e.commandes=[];
  while(e.commandes.length<3){const c=nouvelleCommande();if(!c)break;e.commandes.push(c);}}
function ouvrirCommandes(){
  assurerCommandes();
  const html=(e.commandes||[]).map((c,i)=>{
    const ok=Object.entries(c.items).every(([k,q])=>stock(k)>=q);
    return '<div class="cmd"><div class="h"><span>📋</span><span class="q">Pour '+c.client+'</span>'+
      '<span style="font-weight:650;color:#c98f13">'+c.or+' €</span></div><div class="items">'+
      Object.entries(c.items).map(([k,q])=>'<span class="it '+(stock(k)>=q?'ok':'non')+'">'+
      PRODUITS[k].em+' '+stock(k)+'/'+q+'</span>').join('')+
      '</div><button class="btp v" data-c="'+i+'" style="width:100%;margin-top:10px"'+(ok?'':' disabled')+
      '>Livrer</button></div>';}).join('')||'<p>Rien pour l’instant.</p>';
  fenetre('<h2>📋 Panneau du bourg</h2><p>Les habitants paient 50 % de plus que le marché.</p>'+html);
  $('fen-b').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.c,c=e.commandes[i];
    if(!Object.entries(c.items).every(([k,q])=>stock(k)>=q))return;
    Object.entries(c.items).forEach(([k,q])=>{e.stock[k]=stock(k)-q;});
    e.or+=c.or;gagnerXp(c.xp);e.commandes.splice(i,1);assurerCommandes();
    toast('Livré · +'+c.or+' €');sauver();maj();ouvrirCommandes();});
}
function ouvrirCoop(){
  const cles=Object.keys(e.stock).filter(k=>stock(k)>0);
  const total=cles.reduce((s,k)=>s+PRODUITS[k].vend*stock(k),0);
  fenetre('<h2>🏪 Coopérative</h2><p>Elle rachète tout, au prix du marché.</p>'+
    (cles.length?'<div class="items">'+cles.map(k=>'<span class="it">'+PRODUITS[k].em+' ×'+stock(k)+
      '</span>').join('')+'</div><button class="btp large" id="vt">Tout vendre · '+total+' €</button>'
     :'<p>Ta grange est vide.</p>'));
  const b=$('vt');if(b)b.onclick=()=>{cles.forEach(k=>{e.or+=PRODUITS[k].vend*stock(k);e.stock[k]=0;});
    toast('+'+total+' €');$('fen').classList.remove('on');sauver();maj();};
}
function ouvrirBanque(){
  if(e.pret){
    const du=e.pret.du;
    fenetre('<h2>🏦 Banque</h2><p>Tu dois encore <b>'+du+' €</b>.</p>'+
      '<button class="btp large" id="rb"'+(e.or<du?' disabled':'')+'>Rembourser '+du+' €</button>');
    const b=$('rb');if(b)b.onclick=()=>{e.or-=du;e.pret=null;toast('Dette soldée');
      $('fen').classList.remove('on');sauver();maj();};
    return;
  }
  const somme=Math.round(400*Math.pow(1.6,e.niv-1));
  fenetre('<h2>🏦 Banque</h2><p>Un prêt pour agrandir la ferme. À rembourser : '+
    Math.round(somme*1.25)+' €.</p><button class="btp large" id="pr">Emprunter '+somme+' €</button>');
  $('pr').onclick=()=>{e.or+=somme;e.pret={du:Math.round(somme*1.25)};toast('+'+somme+' €');
    $('fen').classList.remove('on');sauver();maj();};
}
function ouvrirPlace(){
  const h=heureJeu();
  fenetre('<h2>⛲ La fontaine</h2><p>Il est '+String(Math.floor(h)).padStart(2,'0')+
    ' h dans le bourg — une journée dure 24 minutes réelles.</p><p style="margin-top:10px">Niveau '+
    e.niv+' · '+e.xp+' / '+XP_NIV(e.niv)+' points d’expérience.</p>');
}

/* ================= boucle ================= */
function maj(){$('j-or').textContent=e.or.toLocaleString('fr-FR');$('j-niv').textContent=e.niv;}
$('retour').onclick=()=>{sauver();location.href='jeu.html';};
setTimeout(()=>$('bulle').classList.add('off'),7000);
maj();sauver();setInterval(()=>{sauver();maj();},4000);
(function boucle(){
  requestAnimationFrame(boucle);
  majJoueur();
  if(!lieu)majPnj();
  majProche();
  if(lieu)dessinerInterieur();else dessiner();
  if(fondu>0){
    fondu+=fonduSens*0.09;
    if(fondu>=1&&fonduSens>0){fondu=1;fonduSens=-1;if(fonduSuite){fonduSuite();fonduSuite=null;}}
    if(fondu<=0){fondu=0;fonduSens=0;}
    g.fillStyle='rgba(12,10,8,'+Math.min(1,fondu)+')';g.fillRect(0,0,W,H);
  }
  dessinerJoy();
})();
</script>
