<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Karcher — Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
:root{--st:env(safe-area-inset-top,44px);--sb:env(safe-area-inset-bottom,20px)}
html,body{min-height:100%;background:linear-gradient(160deg,#020810,#0c2a4a,#0369a1);font-family:'Inter',sans-serif;color:#fff;overflow:hidden;touch-action:none}

.hdr{position:relative;z-index:10;padding:calc(var(--st)+8px) 18px 10px;
  display:flex;align-items:center;justify-content:space-between}
.hdr-back{width:36px;height:36px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);
  border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;color:rgba(255,255,255,.6)}
.hdr-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:3px;color:#fff}
.hdr-money{display:flex;align-items:center;gap:5px;background:rgba(74,222,128,.12);
  border:1px solid rgba(74,222,128,.3);border-radius:20px;padding:6px 12px}
.hdr-money-val{font-family:'Bebas Neue',sans-serif;font-size:14px;color:#4ade80}

.prog-wrap{position:relative;z-index:10;padding:0 18px 10px}
.prog-bar{height:10px;background:rgba(0,0,0,.3);border-radius:6px;overflow:hidden;
  border:1px solid rgba(255,255,255,.08)}
.prog-fill{height:100%;background:linear-gradient(90deg,#22d3ee,#4ade80);
  border-radius:6px;transition:width .15s ease-out}
.prog-label{display:flex;justify-content:space-between;margin-top:5px;
  font-size:10px;font-weight:800;color:rgba(255,255,255,.4);letter-spacing:1px}
.prog-pct{color:#4ade80}

.game-zone{position:relative;width:100%;height:calc(100vh - 200px);overflow:hidden;
  display:flex;align-items:center;justify-content:center}
#truckCanvas{display:block;touch-action:none;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.5)}

.spray-cursor{position:fixed;width:70px;height:70px;border-radius:50%;
  pointer-events:none;z-index:50;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(180,230,255,.35) 0%,rgba(180,230,255,.1) 50%,transparent 75%);
  display:none;mix-blend-mode:screen}
.spray-cursor.active{display:block;animation:spraySway .15s ease-in-out infinite alternate}
@keyframes spraySway{from{transform:translate(-50%,-50%) scale(1)}to{transform:translate(-50%,-50%) scale(1.08)}}

.hud{position:relative;z-index:10;padding:14px 18px calc(var(--sb)+14px);
  display:flex;align-items:center;justify-content:center}
.earn-counter{font-family:'Bebas Neue',sans-serif;font-size:24px;color:#4ade80;text-align:center}
.earn-label{font-size:8px;font-weight:800;color:rgba(255,255,255,.3);letter-spacing:2px;text-align:center;margin-top:2px}

.win-ov{position:fixed;inset:0;z-index:100;background:rgba(2,8,16,.92);
  display:none;align-items:center;justify-content:center;flex-direction:column;
  backdrop-filter:blur(8px)}
.win-ov.show{display:flex}
.win-emoji{font-size:64px;animation:winBounce .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes winBounce{from{transform:scale(0) rotate(-15deg)}to{transform:scale(1) rotate(0)}}
.win-title{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:3px;
  margin-top:14px;background:linear-gradient(90deg,#fff,#a5f3fc,#fff);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.win-stats{display:flex;gap:14px;margin-top:20px}
.win-stat{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  border-radius:14px;padding:14px 18px;text-align:center}
.win-stat-val{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#4ade80}
.win-stat-lbl{font-size:8px;font-weight:800;color:rgba(255,255,255,.3);letter-spacing:1px;margin-top:3px}
.win-btn{margin-top:24px;background:linear-gradient(135deg,#22d3ee,#0369a1);
  border:none;color:#fff;border-radius:14px;padding:14px 40px;
  font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px;cursor:pointer;
  box-shadow:0 8px 24px rgba(34,211,238,.35)}

.sparkle{position:fixed;pointer-events:none;font-size:14px;z-index:60;
  animation:sparkleFloat .8s ease-out forwards}
@keyframes sparkleFloat{
  0%{opacity:1;transform:translateY(0) scale(0.5)}
  50%{opacity:1;transform:translateY(-20px) scale(1.2)}
  100%{opacity:0;transform:translateY(-40px) scale(0.6)}
}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-back">←</div>
  <div class="hdr-title">KARCHER</div>
  <div class="hdr-money">
    <span style="font-size:11px">💰</span>
    <span class="hdr-money-val" id="hdrMoney">0€</span>
  </div>
</div>

<div class="prog-wrap">
  <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
  <div class="prog-label">
    <span>PROPRETÉ</span>
    <span class="prog-pct" id="progPct">0%</span>
  </div>
</div>

<div class="game-zone" id="gameZone">
  <canvas id="truckCanvas"></canvas>
</div>

<div class="spray-cursor" id="sprayCursor"></div>

<div class="hud">
  <div>
    <div class="earn-counter" id="earnCounter">+0€</div>
    <div class="earn-label">GAGNÉ CETTE PARTIE</div>
  </div>
</div>

<div class="win-ov" id="winOv">
  <div class="win-emoji">🚚✨</div>
  <div class="win-title">CAMION NICKEL !</div>
  <div class="win-stats">
    <div class="win-stat">
      <div class="win-stat-val" id="winEarn">0€</div>
      <div class="win-stat-lbl">GAGNÉ</div>
    </div>
    <div class="win-stat">
      <div class="win-stat-val" id="winTime">0s</div>
      <div class="win-stat-lbl">TEMPS</div>
    </div>
  </div>
  <button class="win-btn" onclick="restartGame()">REJOUER ▶</button>
</div>

<script>
// ═══════════════════════════════════════════
// KARCHER — Mini-jeu de nettoyage haute pression
// Gain cible : ~275€/partie, calibré comme Grutier/Clark
// ═══════════════════════════════════════════

const canvas = document.getElementById('truckCanvas');
const ctx = canvas.getContext('2d');
const gameZone = document.getElementById('gameZone');
const sprayCursor = document.getElementById('sprayCursor');

let W, H, dirtCanvas, dirtCtx, dirtData;
let totalPixels = 0, cleanedPixels = 0;
let isSpraying = false;
let sprayX = 0, sprayY = 0;
let money = 0, sessionEarn = 0;
let startTime = Date.now();
let gameWon = false;
let frameSkip = 0;

// Le gain total visé par partie est réparti sur la surface du camion
const TARGET_EARN = 275; // €/partie, aligné sur Grutier/Clark

function resize(){
  const rect = gameZone.getBoundingClientRect();
  const size = Math.min(rect.width - 24, rect.height - 24, 420);
  W = size; H = size * 1.15;
  canvas.width = W * 2; canvas.height = H * 2;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  ctx.scale(2,2);
  initDirtLayer();
}

function initDirtLayer(){
  dirtCanvas = document.createElement('canvas');
  dirtCanvas.width = W; dirtCanvas.height = H;
  dirtCtx = dirtCanvas.getContext('2d');
  drawDirtTexture();
  dirtData = dirtCtx.getImageData(0,0,W,H);
  totalPixels = W*H;
  cleanedPixels = 0;
  updateProgress();
}

function drawDirtTexture(){
  const grad = dirtCtx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#6b5840');
  grad.addColorStop(0.5,'#5c4a35');
  grad.addColorStop(1,'#4a3a28');
  dirtCtx.fillStyle = grad;
  dirtCtx.fillRect(0,0,W,H);
  for(let i=0;i<900;i++){
    const x = Math.random()*W, y = Math.random()*H;
    const r = 2+Math.random()*5;
    dirtCtx.fillStyle = `rgba(${30+Math.random()*40},${20+Math.random()*30},${10+Math.random()*20},${0.3+Math.random()*0.4})`;
    dirtCtx.beginPath();
    dirtCtx.arc(x,y,r,0,Math.PI*2);
    dirtCtx.fill();
  }
  for(let i=0;i<14;i++){
    const x = Math.random()*W;
    const grad2 = dirtCtx.createLinearGradient(x,0,x,H);
    grad2.addColorStop(0,'rgba(40,30,20,0)');
    grad2.addColorStop(0.7,'rgba(40,30,20,.25)');
    grad2.addColorStop(1,'rgba(40,30,20,.4)');
    dirtCtx.fillStyle = grad2;
    dirtCtx.fillRect(x-8,0,16+Math.random()*10,H);
  }
}

function drawTruckBase(){
  ctx.clearRect(0,0,W,H);
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#e8edf2');
  g.addColorStop(1,'#c5ccd4');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle = '#2563eb';
  ctx.beginPath();
  ctx.roundRect(W*0.06, H*0.18, W*0.32, H*0.42, 14);
  ctx.fill();
  ctx.fillStyle = 'rgba(150,210,255,.85)';
  ctx.beginPath();
  ctx.roundRect(W*0.09, H*0.22, W*0.26, H*0.16, 8);
  ctx.fill();
  ctx.fillStyle = '#fbbf24';
  ctx.beginPath();
  ctx.roundRect(W*0.40, H*0.20, W*0.54, H*0.4, 10);
  ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.15)';
  ctx.font = `bold ${H*0.12}px Arial`;
  ctx.textAlign = 'center';
  ctx.fillText('BD', W*0.67, H*0.45);
  ctx.fillStyle = '#dc2626';
  ctx.fillRect(W*0.06, H*0.50, W*0.88, H*0.04);
  ctx.fillStyle = '#1a1a1a';
  [0.18,0.55,0.78].forEach(rx=>{
    ctx.beginPath();
    ctx.arc(W*rx, H*0.66, H*0.07, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#666';
    ctx.beginPath();
    ctx.arc(W*rx, H*0.66, H*0.035, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#1a1a1a';
  });
  ctx.fillStyle = 'rgba(0,0,0,.12)';
  ctx.fillRect(0, H*0.72, W, H*0.06);
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(0, H*0.78, W, H*0.22);
}

function compositeDirt(){
  ctx.drawImage(dirtCanvas, 0, 0, W, H);
}

function eraseDirtAt(x, y, radius){
  if(!dirtData) return 0;
  const data = dirtData.data;
  let erased = 0;
  const r2 = radius*radius;
  const minX = Math.max(0, Math.floor(x-radius));
  const maxX = Math.min(W, Math.ceil(x+radius));
  const minY = Math.max(0, Math.floor(y-radius));
  const maxY = Math.min(H, Math.ceil(y+radius));
  for(let py=minY; py<maxY; py++){
    for(let px=minX; px<maxX; px++){
      const dx = px-x, dy = py-y;
      const distSq = dx*dx+dy*dy;
      if(distSq < r2){
        const idx = (py*W+px)*4;
        const falloff = 1 - (distSq/r2);
        const currentAlpha = data[idx+3];
        if(currentAlpha > 10){
          const reduction = falloff * 60;
          const newAlpha = Math.max(0, currentAlpha - reduction);
          if(currentAlpha > 30 && newAlpha <= 30) erased++;
          data[idx+3] = newAlpha;
        }
      }
    }
  }
  dirtCtx.putImageData(dirtData, 0, 0);
  return erased;
}

function updateProgress(){
  const pct = totalPixels ? Math.min(100, Math.round((cleanedPixels/totalPixels)*100)) : 0;
  document.getElementById('progFill').style.width = pct+'%';
  document.getElementById('progPct').textContent = pct+'%';
  if(pct >= 92 && !gameWon){
    winGame();
  }
}

function gainMoney(amount){
  money += amount;
  sessionEarn += amount;
  document.getElementById('hdrMoney').textContent = Math.floor(money).toLocaleString('fr-FR')+'€';
  document.getElementById('earnCounter').textContent = '+'+Math.floor(sessionEarn).toLocaleString('fr-FR')+'€';
}

function spawnSparkle(clientX, clientY){
  if(Math.random() > 0.7) return;
  const el = document.createElement('div');
  el.className = 'sparkle';
  el.textContent = ['✨','💧','⭐'][Math.floor(Math.random()*3)];
  el.style.left = (clientX - 7) + 'px';
  el.style.top = (clientY - 7) + 'px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 800);
}

function sprayLoop(){
  if(isSpraying && !gameWon){
    const erased = eraseDirtAt(sprayX, sprayY, 32);
    if(erased > 0){
      cleanedPixels += erased * 3;
      // gain calibré pour atteindre ~TARGET_EARN sur la totalité du nettoyage
      const earn = erased * (TARGET_EARN / (totalPixels * 0.92 / 3) * 3) * 0.3346;
      gainMoney(earn);
      updateProgress();
      frameSkip++;
      if(frameSkip % 3 === 0) spawnSparkle(lastClientX, lastClientY);
    }
  }
  render();
  requestAnimationFrame(sprayLoop);
}

function render(){
  drawTruckBase();
  compositeDirt();
}

let lastClientX = 0, lastClientY = 0;

function getPos(e){
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return { x: clientX - rect.left, y: clientY - rect.top, clientX, clientY };
}

function startSpray(e){
  e.preventDefault();
  isSpraying = true;
  const pos = getPos(e);
  sprayX = pos.x; sprayY = pos.y;
  lastClientX = pos.clientX; lastClientY = pos.clientY;
  sprayCursor.classList.add('active');
  sprayCursor.style.left = pos.clientX+'px';
  sprayCursor.style.top = pos.clientY+'px';
}

function moveSpray(e){
  if(!isSpraying) return;
  e.preventDefault();
  const pos = getPos(e);
  sprayX = pos.x; sprayY = pos.y;
  lastClientX = pos.clientX; lastClientY = pos.clientY;
  sprayCursor.style.left = pos.clientX+'px';
  sprayCursor.style.top = pos.clientY+'px';
}

function endSpray(){
  isSpraying = false;
  sprayCursor.classList.remove('active');
}

canvas.addEventListener('touchstart', startSpray, {passive:false});
canvas.addEventListener('touchmove', moveSpray, {passive:false});
canvas.addEventListener('touchend', endSpray);
canvas.addEventListener('mousedown', startSpray);
canvas.addEventListener('mousemove', moveSpray);
canvas.addEventListener('mouseup', endSpray);
canvas.addEventListener('mouseleave', endSpray);

function winGame(){
  gameWon = true;
  isSpraying = false;
  const elapsed = Math.round((Date.now()-startTime)/1000);
  document.getElementById('winEarn').textContent = '+'+Math.floor(sessionEarn).toLocaleString('fr-FR')+'€';
  document.getElementById('winTime').textContent = elapsed+'s';
  setTimeout(()=>{
    document.getElementById('winOv').classList.add('show');
  }, 400);
}

function restartGame(){
  document.getElementById('winOv').classList.remove('show');
  gameWon = false;
  sessionEarn = 0;
  startTime = Date.now();
  document.getElementById('earnCounter').textContent = '+0€';
  initDirtLayer();
}

window.addEventListener('resize', resize);
resize();
sprayLoop();
</script>
</body>
</html>
