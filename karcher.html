<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Karcher — Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
:root{--st:env(safe-area-inset-top,44px);--sb:env(safe-area-inset-bottom,20px)}
html,body{min-height:100%;background:linear-gradient(160deg,#020810,#0c2a4a,#0369a1);font-family:'Inter',sans-serif;color:#fff;overflow:hidden;touch-action:none;position:relative}

/* Panneau de debug visible directement sur le téléphone */
.debug-panel{position:fixed;left:8px;right:8px;top:calc(var(--st)+50px);z-index:999;
  background:rgba(0,0,0,.85);border:1px solid rgba(34,211,238,.4);border-radius:10px;
  padding:8px 10px;font-family:monospace;font-size:9px;line-height:1.5;
  color:#22d3ee;max-height:110px;overflow:hidden;pointer-events:none}
.debug-panel div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Ambient bubbles floating in background */
.bg-bubbles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bg-bubble{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.25),rgba(255,255,255,.02));
  animation:bgFloat linear infinite}
@keyframes bgFloat{from{transform:translateY(110vh) translateX(0)}to{transform:translateY(-10vh) translateX(20px)}}

/* ── HEADER ── */
.hdr{position:relative;z-index:10;padding:calc(var(--st)+8px) 18px 8px;
  display:flex;align-items:center;justify-content:space-between}
.hdr-back{width:36px;height:36px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
  border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:15px;color:rgba(255,255,255,.7);backdrop-filter:blur(8px)}
.hdr-title{font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:4px;color:#fff;
  text-shadow:0 2px 12px rgba(34,211,238,.4)}
.hdr-money{display:flex;align-items:center;gap:5px;background:rgba(74,222,128,.12);
  border:1px solid rgba(74,222,128,.3);border-radius:20px;padding:6px 12px;backdrop-filter:blur(8px)}
.hdr-money-val{font-family:'Bebas Neue',sans-serif;font-size:14px;color:#4ade80}

/* ── EQUIPMENT BAR ── */
.equip-bar{position:relative;z-index:10;padding:2px 18px 8px;display:flex;gap:8px}
.equip-chip{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:5px 10px;cursor:pointer;backdrop-filter:blur(6px)}
.equip-chip-ico{font-size:14px}
.equip-chip-lbl{font-size:9px;font-weight:800;color:rgba(255,255,255,.6);letter-spacing:.5px}

/* ── PROGRESS BAR ── */
.prog-wrap{position:relative;z-index:10;padding:0 18px 10px}
.prog-bar{height:11px;background:rgba(0,0,0,.35);border-radius:7px;overflow:hidden;
  border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 2px 4px rgba(0,0,0,.3)}
.prog-fill{height:100%;background:linear-gradient(90deg,#22d3ee,#4ade80);
  border-radius:7px;transition:width .15s ease-out;position:relative;
  box-shadow:0 0 12px rgba(34,211,238,.6)}
.prog-fill::after{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
  width:40px;animation:progShine 1.8s ease-in-out infinite}
@keyframes progShine{0%{transform:translateX(-40px)}100%{transform:translateX(calc(100vw))}}
.prog-label{display:flex;justify-content:space-between;margin-top:6px;
  font-size:10px;font-weight:800;color:rgba(255,255,255,.4);letter-spacing:1.5px}
.prog-pct{color:#4ade80;text-shadow:0 0 8px rgba(74,222,128,.5)}

/* ── GAME ZONE ── */
.game-zone{position:relative;width:100%;height:calc(100vh - 230px);overflow:visible;
  display:flex;align-items:center;justify-content:center;z-index:2}
.truck-wrap{position:relative}
#truckCanvas{display:block;touch-action:none;border-radius:20px;
  box-shadow:0 24px 70px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08) inset;
  position:relative;z-index:2}
/* Puddle reflection under truck */
.puddle{position:absolute;left:8%;right:8%;bottom:-14px;height:24px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(34,211,238,.25),transparent 70%);
  filter:blur(4px);z-index:1;opacity:0;transition:opacity .6s}
.puddle.show{opacity:1}

/* Spray jet cone (CSS, follows finger) */
.spray-jet{position:fixed;pointer-events:none;z-index:50;display:none;
  transform-origin:top center}
.spray-jet.active{display:block}
.spray-cone{position:absolute;width:46px;height:46px;border-radius:50%;
  background:radial-gradient(circle,rgba(190,235,255,.5) 0%,rgba(190,235,255,.18) 45%,transparent 75%);
  transform:translate(-50%,-50%);animation:sprayPulse .12s ease-in-out infinite alternate;
  mix-blend-mode:screen}
@keyframes sprayPulse{from{transform:translate(-50%,-50%) scale(1)}to{transform:translate(-50%,-50%) scale(1.15)}}

/* Foam bubble particle */
.foam-bit{position:fixed;pointer-events:none;z-index:55;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.95),rgba(220,240,255,.5));
  animation:foamPop .55s ease-out forwards}
@keyframes foamPop{
  0%{opacity:1;transform:translate(0,0) scale(.4)}
  60%{opacity:1}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.1)}
}

/* Sparkle on clean reveal */
.sparkle{position:fixed;pointer-events:none;font-size:13px;z-index:56;
  animation:sparkleFloat .75s ease-out forwards}
@keyframes sparkleFloat{
  0%{opacity:1;transform:translateY(0) scale(.4) rotate(0)}
  50%{opacity:1;transform:translateY(-18px) scale(1.15) rotate(90deg)}
  100%{opacity:0;transform:translateY(-36px) scale(.6) rotate(180deg)}
}

/* Money pop-up */
.money-pop{position:fixed;pointer-events:none;z-index:57;
  font-family:'Bebas Neue',sans-serif;font-size:13px;color:#4ade80;
  text-shadow:0 1px 4px rgba(0,0,0,.5);
  animation:moneyFloat .7s ease-out forwards}
@keyframes moneyFloat{
  0%{opacity:0;transform:translateY(0) scale(.7)}
  20%{opacity:1;transform:translateY(-6px) scale(1.1)}
  100%{opacity:0;transform:translateY(-30px) scale(1)}
}

/* ── HUD ── */
.hud{position:relative;z-index:10;padding:12px 18px calc(var(--sb)+12px);
  display:flex;align-items:center;justify-content:center}
.earn-counter{font-family:'Bebas Neue',sans-serif;font-size:25px;color:#4ade80;text-align:center;
  text-shadow:0 0 16px rgba(74,222,128,.4)}
.earn-label{font-size:8px;font-weight:800;color:rgba(255,255,255,.3);letter-spacing:2px;text-align:center;margin-top:2px}

/* ── WIN OVERLAY ── */
.win-ov{position:fixed;inset:0;z-index:100;background:rgba(2,8,16,.94);
  display:none;align-items:center;justify-content:center;flex-direction:column;
  backdrop-filter:blur(10px)}
.win-ov.show{display:flex;animation:fadeInOv .3s ease}
@keyframes fadeInOv{from{opacity:0}to{opacity:1}}
.win-emoji{font-size:66px;animation:winBounce .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes winBounce{from{transform:scale(0) rotate(-15deg)}to{transform:scale(1) rotate(0)}}
.win-title{font-family:'Bebas Neue',sans-serif;font-size:35px;letter-spacing:3px;
  margin-top:14px;background:linear-gradient(90deg,#fff,#a5f3fc,#fff);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.win-stats{display:flex;gap:14px;margin-top:22px}
.win-stat{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  border-radius:15px;padding:15px 20px;text-align:center}
.win-stat-val{font-family:'Bebas Neue',sans-serif;font-size:23px;color:#4ade80}
.win-stat-lbl{font-size:8px;font-weight:800;color:rgba(255,255,255,.3);letter-spacing:1px;margin-top:3px}
.win-btn{margin-top:26px;background:linear-gradient(135deg,#22d3ee,#0369a1);
  border:none;color:#fff;border-radius:15px;padding:15px 42px;
  font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:2px;cursor:pointer;
  box-shadow:0 10px 28px rgba(34,211,238,.4)}

/* ── EQUIPMENT MODAL ── */
.equip-modal{position:fixed;inset:0;z-index:90;background:rgba(2,8,16,.85);
  display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(6px)}
.equip-modal.show{display:flex}
.equip-sheet{width:100%;max-width:480px;background:linear-gradient(180deg,#0c2a4a,#071a30);
  border-radius:24px 24px 0 0;padding:20px 18px calc(var(--sb)+20px);
  border-top:1px solid rgba(255,255,255,.1);
  animation:sheetUp .25s cubic-bezier(.16,1,.3,1)}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.equip-sheet-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;margin-bottom:4px}
.equip-sheet-sub{font-size:11px;color:rgba(255,255,255,.4);margin-bottom:16px}
.equip-opt{display:flex;align-items:center;gap:12px;padding:13px;border-radius:14px;
  background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.08);margin-bottom:8px;cursor:pointer}
.equip-opt.eq{border-color:#22d3ee;background:rgba(34,211,238,.08)}
.equip-opt-ico{font-size:24px;width:38px;text-align:center;flex-shrink:0}
.equip-opt-name{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:1px}
.equip-opt-desc{font-size:10px;color:rgba(255,255,255,.35);margin-top:1px}
.equip-opt-right{margin-left:auto;text-align:right;flex-shrink:0}
.equip-opt-price{font-family:'Bebas Neue',sans-serif;font-size:13px;color:#fbbf24}
.equip-opt-status{font-size:9px;font-weight:800;color:#22d3ee;letter-spacing:.5px}
.equip-close{width:100%;margin-top:8px;background:rgba(255,255,255,.08);border:none;color:#fff;
  border-radius:12px;padding:12px;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;cursor:pointer}
</style>
</head>
<body>

<div class="bg-bubbles" id="bgBubbles"></div>

<div class="debug-panel" id="debugPanel">
  <div>📍 prêt — touche l'écran</div>
</div>

<div class="hdr">
  <div class="hdr-back" onclick="history.back()">←</div>
  <div class="hdr-title">KARCHER</div>
  <div class="hdr-money">
    <span style="font-size:11px">💰</span>
    <span class="hdr-money-val" id="hdrMoney">0€</span>
  </div>
</div>

<div class="equip-bar">
  <div class="equip-chip" onclick="openEquipModal('gun')">
    <span class="equip-chip-ico" id="gunIcon">🚿</span>
    <span class="equip-chip-lbl" id="gunLabel">JET STANDARD</span>
  </div>
  <div class="equip-chip" onclick="openEquipModal('foam')">
    <span class="equip-chip-ico" id="foamIcon">💧</span>
    <span class="equip-chip-lbl" id="foamLabel">SANS MOUSSE</span>
  </div>
</div>

<div class="prog-wrap">
  <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
  <div class="prog-label">
    <span>PROPRETÉ</span>
    <span class="prog-pct" id="progPct">0%</span>
  </div>
</div>

<div class="game-zone" id="gameZone">
  <div class="truck-wrap">
    <canvas id="truckCanvas"></canvas>
    <div class="puddle" id="puddle"></div>
  </div>
</div>

<div class="spray-jet" id="sprayJet"><div class="spray-cone"></div></div>

<div class="hud">
  <div>
    <div class="earn-counter" id="earnCounter">+0€</div>
    <div class="earn-label">GAGNÉ CETTE PARTIE</div>
  </div>
</div>

<div class="win-ov" id="winOv">
  <div class="win-emoji">🚚✨</div>
  <div class="win-title">CAMION NICKEL !</div>
  <div class="win-stats">
    <div class="win-stat">
      <div class="win-stat-val" id="winEarn">0€</div>
      <div class="win-stat-lbl">GAGNÉ</div>
    </div>
    <div class="win-stat">
      <div class="win-stat-val" id="winTime">0s</div>
      <div class="win-stat-lbl">TEMPS</div>
    </div>
  </div>
  <button class="win-btn" onclick="restartGame()">REJOUER ▶</button>
</div>

<!-- Equipment modal -->
<div class="equip-modal" id="equipModal">
  <div class="equip-sheet">
    <div class="equip-sheet-title" id="equipModalTitle">PISTOLETS</div>
    <div class="equip-sheet-sub" id="equipModalSub">Nettoie plus vite, gagne plus</div>
    <div id="equipModalList"></div>
    <button class="equip-close" onclick="closeEquipModal()">FERMER</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
// KARCHER — Mini-jeu de nettoyage haute pression
// v2 : visuel premium + pistolets & mousse achetables
// ═══════════════════════════════════════════

// Capture absolument toute erreur JS et l'affiche directement à l'écran,
// pour ne plus jamais avoir un script qui plante silencieusement sur un
// appareil qu'on ne peut pas déboguer via la console.
window.addEventListener('error', function(ev){
  var panel = document.getElementById('debugPanel');
  if(panel){
    var line = document.createElement('div');
    line.style.color = '#ef4444';
    line.style.whiteSpace = 'normal';
    line.textContent = '❌ ERREUR: '+ev.message+' (ligne '+ev.lineno+')';
    panel.appendChild(line);
  }
  // Si dbg() existe déjà, on s'en sert (elle gère aussi l'envoi distant).
  // Sinon (erreur très précoce), on envoie directement en fallback.
  if(typeof dbg === 'function'){
    dbg('❌ ERREUR: '+ev.message+' (ligne '+ev.lineno+')');
  } else {
    try{
      fetch('https://ntfy.sh/battledock-karcher-debug-x7k2m9', {
        method:'POST',
        body: '❌ EARLY ERROR: '+ev.message+' line '+ev.lineno
      }).catch(function(){});
    }catch(e){}
  }
});

const canvas = document.getElementById('truckCanvas');
const ctx = canvas.getContext('2d');
const gameZone = document.getElementById('gameZone');
const sprayJet = document.getElementById('sprayJet');
const puddle = document.getElementById('puddle');

let W, H, dirtCanvas, dirtCtx, dirtData;
let totalPixels = 0, cleanedPixels = 0;
let isSpraying = false;
let sprayX = 0, sprayY = 0;
let money = 0, sessionEarn = 0;
let startTime = Date.now();
let gameWon = false;
let frameSkip = 0;
let lastClientX = 0, lastClientY = 0;

const TARGET_EARN = 275;

// ── ÉQUIPEMENT : PISTOLETS ──
const GUNS = [
  {id:'standard', name:'Jet Standard', icon:'🚿', radius:32, speedMult:1, price:0, desc:'Le pistolet de base, fiable'},
  {id:'pro', name:'Lance Pro', icon:'🔫', radius:42, speedMult:1.4, price:8000, desc:'Jet plus large, 40% plus rapide'},
  {id:'turbo', name:'Turbo Karcher', icon:'⚡', radius:54, speedMult:1.9, price:30000, desc:'Pression maximale, quasi instantané'},
];
// ── ÉQUIPEMENT : MOUSSE ──
const FOAMS = [
  {id:'none', name:'Sans mousse', icon:'💧', bonusMult:1, price:0, desc:'Eau seule'},
  {id:'basic', name:'Mousse Active', icon:'🫧', bonusMult:1.25, price:5000, desc:'+25% de gain par pixel'},
  {id:'premium', name:'Mousse Premium', icon:'🌈', bonusMult:1.5, price:18000, desc:'+50% de gain, effet brillant'},
];

let equippedGun = 'standard';
let equippedFoam = 'none';
let ownedGuns = ['standard'];
let ownedFoams = ['none'];

function currentGun(){ return GUNS.find(g=>g.id===equippedGun) || GUNS[0]; }
function currentFoam(){ return FOAMS.find(f=>f.id===equippedFoam) || FOAMS[0]; }

function updateEquipChips(){
  document.getElementById('gunIcon').textContent = currentGun().icon;
  document.getElementById('gunLabel').textContent = currentGun().name.toUpperCase();
  document.getElementById('foamIcon').textContent = currentFoam().icon;
  document.getElementById('foamLabel').textContent = currentFoam().name.toUpperCase();
}

function openEquipModal(type){
  const modal = document.getElementById('equipModal');
  const title = document.getElementById('equipModalTitle');
  const sub = document.getElementById('equipModalSub');
  const list = document.getElementById('equipModalList');
  const items = type === 'gun' ? GUNS : FOAMS;
  const owned = type === 'gun' ? ownedGuns : ownedFoams;
  const equipped = type === 'gun' ? equippedGun : equippedFoam;
  title.textContent = type === 'gun' ? 'PISTOLETS' : 'MOUSSE';
  sub.textContent = type === 'gun' ? 'Nettoie plus vite, gagne plus' : 'Bonus de gain par pixel nettoyé';
  list.innerHTML = items.map(it=>{
    const isOwned = owned.indexOf(it.id) !== -1;
    const isEq = equipped === it.id;
    return `<div class="equip-opt${isEq?' eq':''}" onclick="selectEquip('${type}','${it.id}',${it.price})">
      <div class="equip-opt-ico">${it.icon}</div>
      <div>
        <div class="equip-opt-name">${it.name}</div>
        <div class="equip-opt-desc">${it.desc}</div>
      </div>
      <div class="equip-opt-right">
        ${isEq ? '<div class="equip-opt-status">✅ ÉQUIPÉ</div>' : isOwned ? '<div class="equip-opt-status" style="color:rgba(255,255,255,.4)">ÉQUIPER</div>' : '<div class="equip-opt-price">'+it.price.toLocaleString('fr-FR')+'€</div>'}
      </div>
    </div>`;
  }).join('');
  modal.classList.add('show');
  modal.dataset.type = type;
}
function closeEquipModal(){ document.getElementById('equipModal').classList.remove('show'); }

function selectEquip(type, id, price){
  const owned = type==='gun' ? ownedGuns : ownedFoams;
  if(owned.indexOf(id) === -1){
    if(money < price){ flashInsufficient(); return; }
    money -= price;
    owned.push(id);
    document.getElementById('hdrMoney').textContent = Math.floor(money).toLocaleString('fr-FR')+'€';
  }
  if(type==='gun') equippedGun = id; else equippedFoam = id;
  updateEquipChips();
  openEquipModal(type); // re-render with new state
}

function flashInsufficient(){
  const el = document.getElementById('hdrMoney');
  el.style.color = '#ef4444';
  setTimeout(()=>{ el.style.color = ''; }, 350);
}

// ── BACKGROUND BUBBLES ──
function spawnBgBubbles(){
  const layer = document.getElementById('bgBubbles');
  for(let i=0;i<10;i++){
    const b = document.createElement('div');
    b.className = 'bg-bubble';
    const size = 6 + Math.random()*22;
    b.style.width = size+'px';
    b.style.height = size+'px';
    b.style.left = Math.random()*100+'%';
    b.style.animationDuration = (8+Math.random()*10)+'s';
    b.style.animationDelay = (Math.random()*10)+'s';
    layer.appendChild(b);
  }
}

// ── CANVAS SETUP ──
function resize(){
  const rect = gameZone.getBoundingClientRect();
  // Sur certains Chrome Android, la hauteur peut être anormalement petite au
  // premier calcul (barre d'adresse dynamique pas encore stabilisée). On se
  // protège avec un minimum sûr pour ne jamais produire un canvas de taille nulle.
  const availW = Math.max(rect.width, 200);
  const availH = Math.max(rect.height, 200);
  const size = Math.min(availW - 24, availH - 24, 420);
  const safeSize = Math.max(size, 180);
  W = safeSize; H = safeSize * 1.15;
  canvas.width = W * 2; canvas.height = H * 2;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  ctx.scale(2,2);
  initDirtLayer();
  dbg('resize: gameZone='+Math.round(rect.width)+'x'+Math.round(rect.height)+' → W='+Math.round(W)+' H='+Math.round(H));
}

function initDirtLayer(){
  dirtCanvas = document.createElement('canvas');
  dirtCanvas.width = W; dirtCanvas.height = H;
  dirtCtx = dirtCanvas.getContext('2d');
  drawDirtTexture();
  dirtData = dirtCtx.getImageData(0,0,W,H);
  totalPixels = W*H;
  cleanedPixels = 0;
  updateProgress();
  puddle.classList.remove('show');
}

function drawDirtTexture(){
  const grad = dirtCtx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#6b5840');
  grad.addColorStop(0.5,'#5c4a35');
  grad.addColorStop(1,'#4a3a28');
  dirtCtx.fillStyle = grad;
  dirtCtx.fillRect(0,0,W,H);
  for(let i=0;i<900;i++){
    const x = Math.random()*W, y = Math.random()*H;
    const r = 2+Math.random()*5;
    dirtCtx.fillStyle = `rgba(${30+Math.random()*40},${20+Math.random()*30},${10+Math.random()*20},${0.3+Math.random()*0.4})`;
    dirtCtx.beginPath();
    dirtCtx.arc(x,y,r,0,Math.PI*2);
    dirtCtx.fill();
  }
  for(let i=0;i<14;i++){
    const x = Math.random()*W;
    const grad2 = dirtCtx.createLinearGradient(x,0,x,H);
    grad2.addColorStop(0,'rgba(40,30,20,0)');
    grad2.addColorStop(0.7,'rgba(40,30,20,.25)');
    grad2.addColorStop(1,'rgba(40,30,20,.4)');
    dirtCtx.fillStyle = grad2;
    dirtCtx.fillRect(x-8,0,16+Math.random()*10,H);
  }
}

// ── TRUCK RENDERING (beautified) ──
function drawTruckBase(){
  ctx.clearRect(0,0,W,H);

  // Sky/background panel behind truck for nicer contrast
  const bgGrad = ctx.createLinearGradient(0,0,0,H);
  bgGrad.addColorStop(0,'#dbe9f5');
  bgGrad.addColorStop(1,'#aebfd1');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0,0,W,H);

  // Subtle floor shading
  ctx.fillStyle = 'rgba(0,0,0,.06)';
  ctx.fillRect(0, H*0.7, W, H*0.3);

  // ── Truck body ──
  // Cabine
  const cabGrad = ctx.createLinearGradient(0,H*0.16,0,H*0.6);
  cabGrad.addColorStop(0,'#3b82f6');
  cabGrad.addColorStop(1,'#1d4ed8');
  ctx.fillStyle = cabGrad;
  ctx.beginPath();
  ctx.roundRect(W*0.06, H*0.18, W*0.32, H*0.42, 14);
  ctx.fill();
  // Cabine highlight strip
  ctx.fillStyle = 'rgba(255,255,255,.18)';
  ctx.beginPath();
  ctx.roundRect(W*0.06, H*0.18, W*0.32, H*0.06, 14);
  ctx.fill();
  // Pare-brise
  const wsGrad = ctx.createLinearGradient(0,H*0.22,0,H*0.38);
  wsGrad.addColorStop(0,'rgba(200,235,255,.95)');
  wsGrad.addColorStop(1,'rgba(140,200,255,.8)');
  ctx.fillStyle = wsGrad;
  ctx.beginPath();
  ctx.roundRect(W*0.09, H*0.22, W*0.26, H*0.16, 8);
  ctx.fill();

  // Benne / remorque
  const trGrad = ctx.createLinearGradient(0,H*0.20,0,H*0.6);
  trGrad.addColorStop(0,'#fde047');
  trGrad.addColorStop(1,'#f59e0b');
  ctx.fillStyle = trGrad;
  ctx.beginPath();
  ctx.roundRect(W*0.40, H*0.20, W*0.54, H*0.4, 10);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.15)';
  ctx.beginPath();
  ctx.roundRect(W*0.40, H*0.20, W*0.54, H*0.05, 10);
  ctx.fill();

  // Logo BD
  ctx.fillStyle = 'rgba(0,0,0,.18)';
  ctx.font = `bold ${H*0.12}px Arial`;
  ctx.textAlign = 'center';
  ctx.fillText('BD', W*0.67, H*0.45);

  // Bande rouge
  ctx.fillStyle = '#dc2626';
  ctx.fillRect(W*0.06, H*0.50, W*0.88, H*0.04);
  ctx.fillStyle = 'rgba(255,255,255,.2)';
  ctx.fillRect(W*0.06, H*0.50, W*0.88, H*0.012);

  // Roues
  [0.18,0.55,0.78].forEach(rx=>{
    ctx.fillStyle = '#15171c';
    ctx.beginPath();
    ctx.arc(W*rx, H*0.66, H*0.072, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#9aa3ad';
    ctx.beginPath();
    ctx.arc(W*rx, H*0.66, H*0.036, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.beginPath();
    ctx.arc(W*rx-2, H*0.66-2, H*0.012, 0, Math.PI*2);
    ctx.fill();
  });

  // Sol / ombre
  ctx.fillStyle = 'rgba(0,0,0,.14)';
  ctx.fillRect(0, H*0.72, W, H*0.06);
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(0, H*0.78, W, H*0.22);

  // Wet shine overlay where cleaned (subtle, applied after dirt composite below via shine pass)
}

function compositeDirt(){
  ctx.drawImage(dirtCanvas, 0, 0, W, H);
}

function eraseDirtAt(x, y, radius){
  if(!dirtData) return 0;
  const data = dirtData.data;
  let erased = 0;
  const r2 = radius*radius;
  const minX = Math.max(0, Math.floor(x-radius));
  const maxX = Math.min(W, Math.ceil(x+radius));
  const minY = Math.max(0, Math.floor(y-radius));
  const maxY = Math.min(H, Math.ceil(y+radius));
  for(let py=minY; py<maxY; py++){
    for(let px=minX; px<maxX; px++){
      const dx = px-x, dy = py-y;
      const distSq = dx*dx+dy*dy;
      if(distSq < r2){
        const idx = (py*W+px)*4;
        const falloff = 1 - (distSq/r2);
        const currentAlpha = data[idx+3];
        if(currentAlpha > 10){
          const reduction = falloff * 60 * currentGun().speedMult;
          const newAlpha = Math.max(0, currentAlpha - reduction);
          if(currentAlpha > 30 && newAlpha <= 30) erased++;
          data[idx+3] = newAlpha;
        }
      }
    }
  }
  dirtCtx.putImageData(dirtData, 0, 0);
  return erased;
}

function updateProgress(){
  const pct = totalPixels ? Math.min(100, Math.round((cleanedPixels/totalPixels)*100)) : 0;
  document.getElementById('progFill').style.width = pct+'%';
  document.getElementById('progPct').textContent = pct+'%';
  if(pct > 15) puddle.classList.add('show');
  if(pct >= 92 && !gameWon){
    winGame();
  }
}

function gainMoney(amount){
  money += amount;
  sessionEarn += amount;
  document.getElementById('hdrMoney').textContent = Math.floor(money).toLocaleString('fr-FR')+'€';
  document.getElementById('earnCounter').textContent = '+'+Math.floor(sessionEarn).toLocaleString('fr-FR')+'€';
}

function spawnSparkle(clientX, clientY){
  if(Math.random() > 0.65) return;
  const el = document.createElement('div');
  el.className = 'sparkle';
  el.textContent = ['✨','💧','⭐'][Math.floor(Math.random()*3)];
  el.style.left = (clientX - 7) + 'px';
  el.style.top = (clientY - 7) + 'px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 750);
}

function spawnFoam(clientX, clientY){
  if(equippedFoam === 'none') return;
  if(Math.random() > 0.55) return;
  const el = document.createElement('div');
  el.className = 'foam-bit';
  const size = 4 + Math.random()*8;
  el.style.width = size+'px';
  el.style.height = size+'px';
  el.style.left = clientX+'px';
  el.style.top = clientY+'px';
  const dx = (Math.random()-0.5)*60;
  const dy = -20 - Math.random()*40;
  el.style.setProperty('--dx', dx+'px');
  el.style.setProperty('--dy', dy+'px');
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 600);
}

function spawnMoneyPop(clientX, clientY, amount){
  if(Math.random() > 0.85) return;
  const el = document.createElement('div');
  el.className = 'money-pop';
  el.textContent = '+'+amount.toFixed(1)+'€';
  el.style.left = clientX+'px';
  el.style.top = (clientY-20)+'px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 700);
}

function sprayLoop(){
  if(isSpraying && !gameWon){
    const radius = currentGun().radius;
    const erased = eraseDirtAt(sprayX, sprayY, radius);
    if(erased > 0){
      cleanedPixels += erased * 3;
      const baseRate = TARGET_EARN / (totalPixels * 0.92 / 3) * 3 * 0.3346;
      const earn = erased * baseRate * currentFoam().bonusMult;
      gainMoney(earn);
      updateProgress();
      frameSkip++;
      if(frameSkip % 3 === 0){
        spawnSparkle(lastClientX, lastClientY);
        spawnFoam(lastClientX, lastClientY);
      }
      if(frameSkip % 8 === 0) spawnMoneyPop(lastClientX, lastClientY, earn*8);
    }
  }
  render();
  requestAnimationFrame(sprayLoop);
}

function render(){
  drawTruckBase();
  compositeDirt();
}

function getPos(e){
  const rect = canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top, clientX: e.clientX, clientY: e.clientY };
}

// Identifiant de session unique pour distinguer les logs de chaque partie/appareil
const DEBUG_SESSION = Math.random().toString(36).slice(2,8);
const REMOTE_LOG_TOPIC = 'battledock-karcher-debug-x7k2m9';

function dbg(msg){
  const panel = document.getElementById('debugPanel');
  if(panel){
    const line = document.createElement('div');
    line.textContent = msg;
    panel.appendChild(line);
    while(panel.children.length > 6) panel.removeChild(panel.firstChild);
  }
  // Envoi en arrière-plan vers un flux distant que Claude peut relire
  // directement, sans dépendre d'un copier-coller manuel à l'écran.
  try{
    fetch('https://ntfy.sh/'+REMOTE_LOG_TOPIC, {
      method: 'POST',
      body: '['+DEBUG_SESSION+'] '+msg
    }).catch(function(){});
  }catch(e){}
}

function startSpray(e){
  dbg('▶ pointerdown type='+e.pointerType+' x='+Math.round(e.clientX)+' y='+Math.round(e.clientY));
  if(e.cancelable) e.preventDefault();
  // Capture le pointeur : garantit que tous les events suivants (move/up) sont
  // bien reçus par le canvas même si le doigt glisse légèrement à l'extérieur.
  if(canvas.setPointerCapture && e.pointerId !== undefined){
    try{ canvas.setPointerCapture(e.pointerId); }catch(err){ dbg('⚠ setPointerCapture: '+err.message); }
  }
  isSpraying = true;
  const pos = getPos(e);
  sprayX = pos.x; sprayY = pos.y;
  lastClientX = pos.clientX; lastClientY = pos.clientY;
  sprayJet.classList.add('active');
  sprayJet.style.left = pos.clientX+'px';
  sprayJet.style.top = pos.clientY+'px';
  updateJetSize();
  dbg('  canvas-relative x='+Math.round(pos.x)+' y='+Math.round(pos.y)+' / W='+Math.round(W)+' H='+Math.round(H));
}

let moveCount = 0;
function moveSpray(e){
  if(!isSpraying) return;
  if(e.cancelable) e.preventDefault();
  const pos = getPos(e);
  sprayX = pos.x; sprayY = pos.y;
  lastClientX = pos.clientX; lastClientY = pos.clientY;
  sprayJet.style.left = pos.clientX+'px';
  sprayJet.style.top = pos.clientY+'px';
  moveCount++;
  if(moveCount % 8 === 0){
    dbg('  ↔ move #'+moveCount+' clean='+Math.round((cleanedPixels/totalPixels)*100)+'%');
  }
}

function updateJetSize(){
  const cone = sprayJet.querySelector('.spray-cone');
  const scale = currentGun().radius / 32;
  cone.style.width = (46*scale)+'px';
  cone.style.height = (46*scale)+'px';
}

function endSpray(e){
  dbg('⏹ pointerup/cancel — moves reçus: '+moveCount);
  moveCount = 0;
  isSpraying = false;
  sprayJet.classList.remove('active');
}

// Pointer Events : une seule API qui gère doigt, souris et stylet de façon
// unifiée et fiable sur Android Chrome, Safari iOS et desktop, sans les
// pièges de double-déclenchement entre touch et mouse events synthétiques.
canvas.style.touchAction = 'none';
canvas.addEventListener('pointerdown', startSpray, {passive:false});
canvas.addEventListener('pointermove', moveSpray, {passive:false});
canvas.addEventListener('pointerup', endSpray);
canvas.addEventListener('pointercancel', endSpray);
canvas.addEventListener('pointerleave', endSpray);

dbg('window.PointerEvent dispo: '+(typeof PointerEvent !== 'undefined'));
dbg('canvas rect au chargement: '+JSON.stringify({w:Math.round(canvas.getBoundingClientRect().width), h:Math.round(canvas.getBoundingClientRect().height)}));

// Empêche le navigateur mobile de capter le geste comme un scroll de page
// ou un pull-to-refresh, ce qui bloquerait sinon le nettoyage au doigt.
// Pointer Events + touch-action:none gèrent nativement le blocage du scroll
// et du pull-to-refresh : plus besoin de bloquer manuellement le document.

function winGame(){
  gameWon = true;
  isSpraying = false;
  sprayJet.classList.remove('active');
  const elapsed = Math.round((Date.now()-startTime)/1000);
  document.getElementById('winEarn').textContent = '+'+Math.floor(sessionEarn).toLocaleString('fr-FR')+'€';
  document.getElementById('winTime').textContent = elapsed+'s';
  setTimeout(()=>{
    document.getElementById('winOv').classList.add('show');
  }, 400);
}

function restartGame(){
  document.getElementById('winOv').classList.remove('show');
  gameWon = false;
  sessionEarn = 0;
  startTime = Date.now();
  document.getElementById('earnCounter').textContent = '+0€';
  initDirtLayer();
}

window.addEventListener('resize', resize);
try{
  spawnBgBubbles();
  updateEquipChips();
  resize();
  sprayLoop();
  dbg('✅ init terminée, jeu prêt');
}catch(err){
  dbg('❌ CRASH INIT: '+err.message);
  var panel = document.getElementById('debugPanel');
  if(panel){
    var line = document.createElement('div');
    line.style.color = '#ef4444';
    line.style.whiteSpace = 'normal';
    line.textContent = 'Stack: '+(err.stack||'').slice(0,200);
    panel.appendChild(line);
  }
}
</script>
