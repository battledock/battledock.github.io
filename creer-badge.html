<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Battle Dock — Les Quais de la Joliette</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Permanent+Marker&family=Space+Grotesk:wght@500;700;900&family=Bungee&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  
  <style>
    :root {
      --port-dark: #0f172a;
      --port-blue: #2563eb;
      --port-light-blue: #38bdf8;
      --comic-yellow: #facc15;
      --comic-red: #ef4444;
      --comic-green: #22c55e;
      --paper-cream: #fefce8;
      --border-thick: 4px solid #000000;
      --shadow-comic: 6px 6px 0px #000000;
      --shadow-comic-sm: 4px 4px 0px #000000;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1e38 100%);
      min-height: 100vh;
      color: #fff;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* BARRE DE STATUTS TOP STYLE COMPACT MOBILE */
    .top-bar {
      width: 100%;
      max-width: 500px;
      background: var(--port-dark);
      border: var(--border-thick);
      border-radius: 12px;
      box-shadow: var(--shadow-comic-sm);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .player-avatar-mini {
      width: 48px;
      height: 48px;
      background: #fff;
      border: 2px solid #000;
      border-radius: 8px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .player-avatar-mini svg {
      width: 100%; height: 100%;
      image-rendering: pixelated;
    }

    .player-info-meta {
      flex: 1;
    }
    .player-name {
      font-family: 'Bungee', sans-serif;
      font-size: 13px;
      color: var(--comic-yellow);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player-rank {
      font-family: 'Permanent Marker', cursive;
      font-size: 11px;
      color: var(--port-light-blue);
    }

    .currency-badge {
      background: var(--comic-green);
      border: 2px solid #000;
      padding: 4px 8px;
      border-radius: 6px;
      font-family: 'Bungee', sans-serif;
      font-size: 12px;
      color: #000;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* ENCADRÉ PRINCIPAL DES INFOS ET DES JAUGES */
    .dashboard-panel {
      width: 100%;
      max-width: 500px;
      background: var(--paper-cream);
      border: var(--border-thick);
      border-radius: 16px;
      box-shadow: var(--shadow-comic);
      padding: 14px;
      color: #000;
      margin-bottom: 14px;
    }

    .stat-row {
      margin-bottom: 8px;
    }
    .stat-row:last-child { margin-bottom: 0; }

    .stat-label {
      font-family: 'Bungee', sans-serif;
      font-size: 10px;
      color: var(--port-dark);
      display: flex;
      justify-content: space-between;
      margin-bottom: 3px;
    }

    .bar-outer {
      width: 100%;
      height: 18px;
      background: #cbd5e1;
      border: 2.5px solid #000;
      border-radius: 6px;
      overflow: hidden;
    }
    .bar-inner {
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }
    .bar-energy { background: linear-gradient(90deg, #f59e0b, #ef4444); }
    .bar-xp { background: linear-gradient(90deg, #3b82f6, #06b6d4); }

    /* ZONE DES MISSIONS / ACTIONS */
    .title-section {
      font-family: 'Bangers', cursive;
      font-size: 24px;
      color: var(--port-dark);
      margin: 8px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .mission-card {
      background: #fff;
      border: 3px solid #000;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      box-shadow: var(--shadow-comic-sm);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .mission-details {
      flex: 1;
    }
    .mission-title {
      font-family: 'Bungee', sans-serif;
      font-size: 11px;
      color: var(--port-dark);
    }
    .mission-rewards {
      font-size: 11px;
      font-weight: 700;
      color: var(--comic-green);
      margin-top: 2px;
    }
    .mission-cost {
      font-size: 10px;
      font-weight: 900;
      color: var(--comic-red);
    }

    .btn-work {
      font-family: 'Bangers', cursive;
      font-size: 18px;
      padding: 8px 14px;
      background: var(--port-blue);
      color: #fff;
      border: 2.5px solid #000;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 3px 3px 0px #000;
    }
    .btn-work:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px #000;
    }

    /* DECONNEXION / FLOTTANT EN BAS */
    .btn-logout {
      font-family: 'Bungee', sans-serif;
      font-size: 10px;
      background: transparent;
      border: none;
      color: #94a3b8;
      text-decoration: underline;
      cursor: pointer;
      margin-top: 10px;
    }

    /* EFFETS D'ONOMATOPÉES VOLANTES DÉCLENCHÉES AU CLIC */
    .floating-pop {
      position: fixed;
      font-family: 'Bangers', cursive;
      font-size: 26px;
      color: var(--comic-yellow);
      text-shadow: 2px 2px 0px #000;
      -webkit-text-stroke: 0.5px #000;
      pointer-events: none;
      z-index: 100;
      animation: flyOut 0.5s forwards ease-out;
    }

    @keyframes flyOut {
      0% { opacity: 1; transform: scale(0.5) translateY(0); }
      100% { opacity: 0; transform: scale(1.3) translateY(-40px) rotate(10deg); }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="player-avatar-mini" id="miniAvatarBox">
      </div>
    <div class="player-info-meta">
      <div class="player-name" id="labelUsername">DOCKER...</div>
      <div class="player-rank" id="labelRank">Chargement...</div>
    </div>
    <div class="currency-badge">
      💵 <span id="labelMoney">0</span>€
    </div>
  </div>

  <div class="dashboard-panel">
    <div class="stat-row">
      <div class="stat-label">
        <span>Énergie de Docker</span>
        <span id="textEnergy">0 / 0</span>
      </div>
      <div class="bar-outer">
        <div class="bar-inner bar-energy" id="fillEnergy"></div>
      </div>
    </div>

    <div class="stat-row" style="margin-top: 12px;">
      <div class="stat-label">
        <span id="textLevel">Niveau 1</span>
        <span id="textXp">XP: 0 / 100</span>
      </div>
      <div class="bar-outer">
        <div class="bar-inner bar-xp" id="fillXp"></div>
      </div>
    </div>

    <h2 class="title-section" style="margin-top: 18px; border-top: 3px dashed #000; padding-top: 12px;">Missions sur le quai</h2>
    
    <div id="missionsContainer">
      </div>

    <center><button class="btn-logout" onclick="logoutSession()">Quitter le Hangar (Déconnexion)</button></center>
  </div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const supabaseClient = createClient(supabaseUrl, supabaseKey);

    // Banque de modèles d'avatars SVG identiques à creer-badge.html
    const avatarsSVG = {
      marius: { hat: '#ef4444', hair: '#7c2d12', feat: `<rect x="3" y="8" width="6" height="3" fill="#7c2d12"/><rect x="5" y="9" width="2" height="1" fill="#fbcfe8"/>` },
      raymond: { hat: '#2563eb', hair: '#4b5563', feat: `<rect x="3" y="9" width="6" height="1" fill="#4b5563"/>` },
      titou: { hat: '#1e293b', hair: '#1e293b', feat: `<rect x="5" y="9" width="2" height="3" fill="#1e293b"/>` },
      dane: { hat: '#16a34a', hair: '#000000', feat: `<rect x="3" y="8" width="6" height="3" fill="#000000"/><rect x="5" y="9" width="2" height="1" fill="#fbcfe8"/>` },
      baltha: { hat: '#f97316', hair: '#b45309', feat: `<rect x="2" y="6" width="8" height="1" fill="#000"/><rect x="3" y="7" width="2" height="1" fill="#000"/><rect x="7" y="7" width="2" height="1" fill="#000"/>` },
      gaby: { hat: '#7c3aed', hair: '#78350f', feat: `<rect x="3" y="9" width="6" height="1" fill="#78350f"/>` },
      marcel: { hat: '#db2777', hair: '#1c1917', feat: `<rect x="3" y="8" width="6" height="3" fill="#1c1917"/><rect x="5" y="9" width="2" height="1" fill="#fbcfe8"/>` },
      fredo: { hat: '#059669', hair: '#451a03', feat: `<rect x="5" y="9" width="2" height="3" fill="#451a03"/>` },
      aziz: { hat: '#eab308', hair: '#0f172a', feat: `<rect x="2" y="6" width="8" height="1" fill="#000"/><rect x="3" y="7" width="2" height="1" fill="#000"/><rect x="7" y="7" width="2" height="1" fill="#000"/>` },
      yvan: { hat: '#475569', hair: '#6b7280', feat: `<rect x="3" y="8" width="6" height="3" fill="#6b7280"/><rect x="5" y="9" width="2" height="1" fill="#fbcfe8"/>` }
    };

    // Configuration des missions disponibles
    const listeMissions = [
      { id: 'cafe', title: "☕ Servir la tournée de cafés aux syndicats", energy: 5, xp: 15, money: 10, onoma: "CAFEÏNE!" },
      { id: 'decharger', title: "📦 Décharger les palettes de thon frais", energy: 12, xp: 40, money: 35, onoma: "💥 BAM !" },
      { id: 'grue', title: "🏗️ Piloter la grue géante Panamax", energy: 25, xp: 90, money: 85, onoma: "🏗️ CLAC !" }
    ];

    let playerStats = {};
    const userId = localStorage.getItem('userId');

    // Vérification de sécurité de connexion
    if (!userId) { window.location.href = 'index.html'; }

    // Démarrage et chargement des données depuis Supabase
    async function initGameData() {
      try {
        // 1. Récupération du pseudo et de l'avatar_id
        const { data: profile, error: pErr } = await supabaseClient.from('profiles').select('username, avatar_id').eq('user_id', userId).single();
        if (pErr) throw pErr;

        document.getElementById('labelUsername').textContent = profile.username.toUpperCase();
        renderMiniAvatar(profile.avatar_id);

        // 2. Récupération de la progression de jeu
        const { data: progress, error: gErr } = await supabaseClient.from('game_progress').select('*').eq('user_id', userId).single();
        if (gErr) throw gErr;

        playerStats = progress;
        updateUserInterface();
        buildMissionsList();

      } catch (err) { alert("Erreur BDD : " + err.message); }
    }

    // Dessin vectoriel immédiat de l'avatar mini
    function renderMiniAvatar(avatarId) {
      const target = document.getElementById('miniAvatarBox');
      const cfg = avatarsSVG[avatarId] || avatarsSVG['marius']; // Backup marius au cas où
      
      target.innerHTML = `
        <svg viewBox="0 0 12 12" shape-rendering="crispEdges">
          <rect width="12" height="12" fill="#bae6fd"/>
          <rect x="3" y="5" width="6" height="6" fill="#fdba74"/>
          <rect x="4" y="6" width="1" height="1" fill="#000"/>
          <rect x="7" y="6" width="1" height="1" fill="#000"/>
          <rect x="5" y="8" width="2" height="1" fill="#f43f5e"/>
          ${cfg.feat}
          <rect x="2" y="2" width="8" height="3" fill="${cfg.hat}"/>
          <rect x="1" y="4" width="3" height="1" fill="${cfg.hat}"/>
        </svg>
      `;
    }

    // Mise à jour visuelle des labels et barres d'énergie/XP
    function updateUserInterface() {
      document.getElementById('labelRank').textContent = playerStats.rank;
      document.getElementById('labelMoney').textContent = playerStats.money;
      
      // Jauge d'énergie
      document.getElementById('textEnergy').textContent = `${playerStats.energy} / ${playerStats.energy_max}`;
      const pctEnergy = (playerStats.energy / playerStats.energy_max) * 100;
      document.getElementById('fillEnergy').style.width = pctEnergy + '%';

      // Jauge d'XP (Palier standard de 100 XP par niveau pour la démo)
      const nextLevelXpRequired = 100; 
      document.getElementById('textLevel').textContent = `NIVEAU ${playerStats.level}`;
      document.getElementById('textXp').textContent = `XP: ${playerStats.xp} / ${nextLevelXpRequired}`;
      const pctXp = (playerStats.xp / nextLevelXpRequired) * 100;
      document.getElementById('fillXp').style.width = pctXp + '%';
    }

    // Génération dynamique des boutons de missions
    function buildMissionsList() {
      const container = document.getElementById('missionsContainer');
      container.innerHTML = '';

      listeMissions.forEach(m => {
        const card = document.createElement('div');
        card.className = 'mission-card';
        card.innerHTML = `
          <div class="mission-details">
            <div class="mission-title">${m.title}</div>
            <div class="mission-rewards">💰 +${m.money}€ &nbsp;⭐ +${m.xp} XP</div>
            <div class="mission-cost">⚡ Coûte ${m.energy} Énergie</div>
          </div>
          <button class="btn-work" id="btn-${m.id}" onpointerdown="triggerMission('${m.id}', event)">Bosser</button>
        `;
        container.appendChild(card);
      });
    }

    // Logique lors du clic sur une mission (Dépense d'énergie et récompense)
    async function triggerMission(id, event) {
      const mission = listeMissions.find(m => m.id === id);
      if (!mission) return;

      if (playerStats.energy < mission.energy) {
        spawnFloatingText(event.clientX, event.clientY, "FATIGUÉ ! 💤");
        return;
      }

      // Calcul des nouvelles valeurs locales
      playerStats.energy -= mission.energy;
      playerStats.money += mission.money;
      playerStats.xp += mission.xp;

      // Logique simple de montée de niveau (Level up tous les 100 XP)
      if (playerStats.xp >= 100) {
        playerStats.xp -= 100;
        playerStats.level += 100; // Passage au palier suivant
        playerStats.energy_max += 5; // Augmentation de l'énergie max
        playerStats.energy = playerStats.energy_max; // Remplissage complet
        spawnFloatingText(event.clientX, event.clientY, "PROMOTION ! 🎉");
      } else {
        spawnFloatingText(event.clientX, event.clientY, mission.onoma);
      }

      // Rafraîchissement direct de l'UI pour un effet instantané sans latence
      updateUserInterface();

      // Envoi asynchrone des modifications vers Supabase en arrière-plan
      try {
        await supabaseClient.from('game_progress').update({
          energy: playerStats.energy,
          money: playerStats.money,
          xp: playerStats.xp,
          level: playerStats.level,
          energy_max: playerStats.energy_max
        }).eq('user_id', userId);
      } catch (err) { console.error("Erreur de sauvegarde sync : ", err); }
    }

    // Effet d'onomatopée flottante au point d'impact du doigt/souris
    function spawnFloatingText(x, y, text) {
      const pop = document.createElement('div');
      pop.className = 'floating-pop';
      pop.style.left = (x - 20) + 'px';
      pop.style.top = (y - 20) + 'px';
      pop.textContent = text;
      document.body.appendChild(pop);
      setTimeout(() => pop.remove(), 500);
    }

    // Déconnexion propre
    function logoutSession() {
      localStorage.clear();
      window.location.href = 'index.html';
    }

    // Lancement automatique
    initGameData();
  </script>
</body>
</html>
