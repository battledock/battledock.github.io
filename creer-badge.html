<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Battle Dock — Bureau des Badges</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Permanent+Marker&family=Space+Grotesk:wght@500;700;900&family=Bungee&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  
  <style>
    :root {
      --port-dark: #0f172a;
      --port-blue: #2563eb;
      --port-light-blue: #38bdf8;
      --comic-yellow: #facc15;
      --comic-red: #ef4444;
      --comic-green: #22c55e;
      --paper-cream: #fefce8;
      --border-thick: 4px solid #000000;
      --shadow-comic: 8px 8px 0px #000000;
      --shadow-comic-sm: 4px 4px 0px #000000;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: linear-gradient(135deg, #1e1b4b 0%, #311042 50%, #0f172a 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
    }

    /* EN-TÊTE DU SITE */
    .header-container {
      text-align: center;
      margin-bottom: 32px;
      width: 100%;
      max-width: 540px;
    }

    .main-title {
      font-family: 'Bangers', cursive;
      font-size: clamp(4rem, 12vw, 5.5rem);
      color: var(--comic-yellow);
      letter-spacing: 4px;
      text-shadow: 6px 6px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000;
      line-height: 0.9;
      transform: rotate(-2deg);
      display: inline-block;
      margin-bottom: 8px;
    }

    .subtitle {
      font-family: 'Permanent Marker', cursive;
      font-size: clamp(1rem, 4vw, 1.3rem);
      color: #ffffff;
      text-shadow: 3px 3px 0px var(--port-dark);
      letter-spacing: 1px;
    }

    /* CONTENEUR PRINCIPAL (Identique à l'index) */
    .dock-container {
      width: 100%;
      max-width: 540px;
      background: #e2e8f0;
      border: var(--border-thick);
      border-radius: 20px;
      box-shadow: var(--shadow-comic);
      overflow: hidden;
    }

    /* ONGLETS */
    .tabs-wrapper {
      display: flex;
      background: var(--port-dark);
      border-bottom: var(--border-thick);
    }

    .tab-badge {
      flex: 1;
      background: var(--comic-yellow);
      color: var(--port-dark);
      font-family: 'Bungee', sans-serif;
      font-size: 14px;
      padding: 16px 8px;
      text-align: center;
    }

    /* FORMULAIRE INTERNE */
    .form-content {
      background: var(--paper-cream);
      padding: 28px 24px;
    }

    .section-headline {
      font-family: 'Bangers', cursive;
      font-size: 24px;
      color: var(--port-dark);
      margin-bottom: 24px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-group { 
      margin-bottom: 20px; 
    }

    .input-group label {
      display: block;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 900;
      font-size: 14px;
      color: var(--port-dark);
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .custom-field {
      width: 100%;
      padding: 14px 16px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 16px;
      color: var(--port-dark);
      background: #ffffff;
      border: var(--border-thick);
      border-radius: 10px;
      box-shadow: var(--shadow-comic-sm);
      transition: all 0.15s ease;
    }

    .custom-field:focus {
      outline: none;
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px #000000;
    }

    /* SÉLECTEUR DE COULEURS STYLE BOUTONS INDUSTRIELS */
    .color-picker-row {
      display: flex;
      gap: 12px;
      margin-top: 4px;
    }

    .color-btn {
      width: 36px;
      height: 36px;
      border: var(--border-thick);
      border-radius: 8px;
      cursor: pointer;
      box-shadow: var(--shadow-comic-sm);
      transition: all 0.1s;
    }

    .color-btn:active, .color-btn.active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px #000000;
    }

    /* ACTION ZONE (Reprise exacte de l'index) */
    .action-zone {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 28px;
      padding-top: 24px;
      border-top: 4px dashed rgba(0,0,0,0.1);
    }

    .suit-avatar {
      position: relative;
      width: 80px;
      height: 80px;
      background: #f97316; /* Changera en JS */
      border: var(--border-thick);
      border-radius: 50%;
      box-shadow: var(--shadow-comic-sm);
      flex-shrink: 0;
      transition: background 0.2s ease;
    }
    
    .suit-visor {
      position: absolute;
      top: 20%; left: 50%;
      transform: translateX(-50%);
      width: 36px; height: 36px;
      background: var(--port-light-blue);
      border: 3px solid #000;
      border-radius: 50%;
      box-shadow: inset 3px 3px 0 #fff;
    }

    .lever-wrapper { 
      flex: 1; 
    }
    
    .submit-lever-btn {
      width: 100%;
      padding: 16px 14px;
      font-family: 'Bangers', cursive;
      font-size: 24px;
      letter-spacing: 1px;
      color: white;
      background: var(--comic-green);
      border: var(--border-thick);
      border-radius: 12px;
      cursor: pointer;
      box-shadow: var(--shadow-comic-sm);
      transition: all 0.1s ease;
      text-transform: uppercase;
    }
    
    .submit-lever-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px #000000;
    }
    
    .submit-lever-btn:active {
      transform: translate(4px, 4px);
      box-shadow: 0px 0px 0px #000000;
    }

    .speech-bubble {
      background: white;
      border: var(--border-thick);
      border-radius: 16px;
      padding: 16px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 14px;
      color: var(--comic-red);
      margin-top: 24px;
      box-shadow: var(--shadow-comic-sm);
      display: none;
      position: relative;
    }
    
    .speech-bubble::before {
      content: '';
      position: absolute;
      top: -16px; left: 32px;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-bottom: 12px solid #000000;
    }
  </style>
</head>
<body>

  <div class="header-container">
    <h1 class="main-title">BATTLE DOCK</h1>
    <p class="subtitle">Imprimerie officielle des Pass d'Accès</p>
  </div>

  <div class="dock-container">
    
    <div class="tabs-wrapper">
      <div class="tab-badge" id="playerTabMatricule">MATRICULE-XXXX</div>
    </div>

    <div class="form-content">
      
      <h2 class="section-headline" id="welcomeHeadline">Configure ton pass, fada !</h2>

      <div class="input-group">
        <label>🏗️ Ton affectation sur le port</label>
        <select class="custom-field" id="badgeRole">
          <option value="Spécialiste de la Sieste">Spécialiste de la Sieste (Option Ombrage)</option>
          <option value="Porteur de Pastis Pro">Porteur de Pastis Professionnel</option>
          <option value="Grutier Cascadeur">Grutier Cascadeur du 13</option>
          <option value="Dompteur de Mouettes">Dompteur de Mouettes de la Joliette</option>
        </select>
      </div>

      <div class="input-group">
        <label>💬 Ta devise de comptoir (affichée sur le pass)</label>
        <input type="text" class="custom-field" id="badgeMotto" placeholder="ex: Pas de conteneur avant le café" maxlength="45">
      </div>

      <div class="input-group">
        <label>🎨 Peinture réglementaire du scaphandre</label>
        <div class="color-picker-row">
          <button class="color-btn active" style="background: #f97316;" onclick="selectSuitColor('#f97316', this)"></button>
          <button class="color-btn" style="background: #ef4444;" onclick="selectSuitColor('#ef4444', this)"></button>
          <button class="color-btn" style="background: #2563eb;" onclick="selectSuitColor('#2563eb', this)"></button>
          <button class="color-btn" style="background: #a855f7;" onclick="selectSuitColor('#a855f7', this)"></button>
          <button class="color-btn" style="background: #22c55e;" onclick="selectSuitColor('#22c55e', this)"></button>
        </div>
      </div>

      <div class="action-zone">
        <div class="suit-avatar" id="diverSuit">
          <div class="suit-visor"></div>
        </div>

        <div class="lever-wrapper">
          <button class="submit-lever-btn" id="btnPrintBadge" onclick="validateAndPrintBadge()">Valider le Badge !</button>
        </div>
      </div>

      <div class="speech-bubble" id="errorBubble"></div>

    </div>
  </div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const supabaseClient = createClient(supabaseUrl, supabaseKey);

    const userId = localStorage.getItem('userId');
    const username = localStorage.getItem('username') || 'Docker';
    
    let chosenColor = '#f97316';

    // Anti-fraude si pas connecté
    if (!userId) {
      window.location.href = 'index.html';
    }

    // Initialisation au chargement
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById('playerTabMatricule').textContent = `BADGE DE : ${username.toUpperCase()}`;
      document.getElementById('welcomeHeadline').textContent = `Allez ${username}, configure ton pass !`;
    });

    function selectSuitColor(color, btn) {
      chosenColor = color;
      document.getElementById('diverSuit').style.background = color;
      
      // Gère l'effet enfoncé/actif des boutons de couleur
      document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    async function validateAndPrintBadge() {
      const selectedRole = document.getElementById('badgeRole').value;
      const mottoText = document.getElementById('badgeMotto').value.trim() || "Aïoli obligatoire !";
      const errorBubble = document.getElementById('errorBubble');

      try {
        // Enregistre le rôle choisi directement dans ton game_progress
        const { error } = await supabaseClient
          .from('game_progress')
          .update({ rank: selectedRole })
          .eq('user_id', userId);

        if (error) throw error;

        // Stockage en local pour s'en servir facilement dans game.html
        localStorage.setItem('userRole', selectedRole);
        localStorage.setItem('userMotto', mottoText);
        localStorage.setItem('userColor', chosenColor);

        // Animation de succès et redirection
        const mainBtn = document.getElementById('btnPrintBadge');
        mainBtn.textContent = "BADGE IMPRIMÉ !";
        mainBtn.style.background = 'var(--comic-blue)';
        
        setTimeout(() => {
          window.location.href = 'game.html';
        }, 1000);

      } catch (err) {
        errorBubble.innerHTML = `🤬 L'IMPRIMANTE CRRACHE DE LA FUMÉE :<br>"Oh fada, ça marche pas ! ${err.message}"`;
        errorBubble.style.display = 'block';
      }
    }
  </script>
</body>
</html>
