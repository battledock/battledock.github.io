<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réinitialiser le mot de passe - Battle Dock</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="icon">⚓</div>
        <h1>Battle Dock</h1>
        <h2>Réinitialiser le mot de passe</h2>
        <form id="reset-password-form">
            <label for="new-password">Nouveau mot de passe :</label>
            <input type="password" id="new-password" name="new-password" required>

            <label for="confirm-password">Confirmez le nouveau mot de passe :</label>
            <input type="password" id="confirm-password" name="confirm-password" required>

            <button type="submit">Réinitialiser le mot de passe</button>
        </form>
        <p>Vous vous souvenez de votre mot de passe ? <a href="connexion.html">Connectez-vous</a></p>
    </div>
    <script src="auth.js"></script>
</body>
</html>
