<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BattleDock 2 — Crée ton joueur</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ====== BASE IDENTIQUE À INDEX.HTML ====== */
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%;font-family:'Inter',sans-serif;overflow-x:hidden}
body{background:linear-gradient(180deg,#141625 0%,#1b1e33 45%,#251f3d 100%);color:#f2eef8}

.orb{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0;animation:drift 12s ease-in-out infinite;will-change:transform}
@media (max-width:480px){.orb{filter:blur(60px)}}
.o1{width:min(380px,100vw);height:min(380px,100vw);background:rgba(120,90,255,.16);top:5%;left:5%}
.o2{width:min(320px,85vw);height:min(320px,85vw);background:rgba(255,110,70,.13);bottom:5%;right:5%;animation-delay:4s}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(10px,-10px)}}

.app{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(clamp(24px,6vw,48px) + env(safe-area-inset-top)) 16px calc(clamp(24px,6vw,48px) + env(safe-area-inset-bottom));
  position:relative;z-index:1;animation:fadein .6s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}

.brand{text-align:center;margin-bottom:clamp(24px,6vw,36px)}
.b-row{display:flex;align-items:center;justify-content:center;gap:10px}
.b-t{font-family:'Oswald',sans-serif;font-size:clamp(26px,7vw,36px);font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#f2eef8}
.b-vl{width:2px;height:clamp(22px,6vw,30px);background:linear-gradient(180deg,#9d7bff,#ff9a5c);border-radius:2px}
.b-d{font-family:'Oswald',sans-serif;font-size:clamp(26px,7vw,36px);font-weight:700;letter-spacing:3px;text-transform:uppercase;
  background:linear-gradient(135deg,#9d7bff,#ff7a5c,#ffc24d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.b-sub{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px}
.b-sub span{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:4px;text-transform:uppercase}
.b-sub i{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.3)}
.bs2{background:linear-gradient(90deg,#9d7bff,#ff7a5c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.bmrs{background:linear-gradient(90deg,#ff7a5c,#ffc24d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

.auth-card{width:100%;max-width:400px;padding:clamp(22px,6vw,30px) clamp(18px,5vw,26px);
  border:1.5px solid rgba(255,255,255,.12);border-radius:20px;
  background:rgba(255,255,255,.06);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 12px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08)}

.tabs{display:flex;gap:6px;background:rgba(255,255,255,.06);border-radius:12px;padding:5px;margin-bottom:22px}
.tab{flex:1;padding:11px;border:none;border-radius:9px;cursor:pointer;background:none;
  font-family:'Oswald',sans-serif;font-size:13px;font-weight:600;letter-spacing:2px;text-transform:uppercase;
  color:#a89cb8;transition:.2s}
.tab.active{background:rgba(255,255,255,.92);color:#1b1e33;box-shadow:0 2px 10px rgba(0,0,0,.25)}

.panel{display:none}
.panel.active{display:block;animation:fadein .3s ease-out}

.field{margin-bottom:14px}
.field input{width:100%;padding:14px 16px;border:1.5px solid rgba(255,255,255,.12);border-radius:12px;
  background:rgba(255,255,255,.06);font-family:'Inter',sans-serif;font-size:16px;color:#f2eef8;outline:none;transition:.2s}
.field input:focus{border-color:#9d7bff;background:rgba(255,255,255,.1)}
.field input::placeholder{color:#8a7f9c}
.sec{font-family:'Oswald',sans-serif;font-size:10px;font-weight:600;letter-spacing:3px;text-transform:uppercase;
  color:#a89cb8;margin:20px 0 8px}
.hint{font-size:11px;color:#8a7f9c;margin-top:6px}

.btn-primary{width:100%;padding:15px;border:none;border-radius:12px;cursor:pointer;margin-top:10px;
  font-family:'Oswald',sans-serif;font-size:14px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:#fff;
  background:linear-gradient(135deg,#9d7bff,#ff7a5c);box-shadow:0 6px 24px rgba(157,123,255,.25);transition:.2s}
.btn-primary:active{transform:scale(.97)}
.btn-primary:disabled{opacity:.5;cursor:wait}

/* ====== CAROUSEL ====== */
.selp-row{display:flex;align-items:center;justify-content:center;gap:clamp(12px,4vw,18px);margin-top:4px}
.arrow{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  border:1.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);font-size:19px;color:#f2eef8;
  cursor:pointer;user-select:none;transition:.15s}
.arrow:active{transform:scale(.9);background:rgba(255,255,255,.12)}
.big-ava{width:clamp(96px,28vw,110px);height:clamp(96px,28vw,110px);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:clamp(44px,13vw,52px);
  background:linear-gradient(135deg,#9d7bff,#ff7a5c);
  box-shadow:0 0 0 5px rgba(255,255,255,.06),0 0 40px rgba(157,123,255,.4);
  animation:float 3.5s ease-in-out infinite;transition:background .3s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.big-ava.swap{animation:swap .3s ease}
@keyframes swap{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.selp-name{font-family:'Oswald',sans-serif;font-size:20px;letter-spacing:2px;text-transform:uppercase;text-align:center;margin-top:12px}
.selp-count{font-family:'Oswald',sans-serif;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:#a89cb8;text-align:center;margin-top:3px}

.colors{display:flex;justify-content:center;gap:9px;margin-top:16px;flex-wrap:wrap}
.sc{width:30px;height:30px;border-radius:50%;border:2.5px solid transparent;cursor:pointer;transition:.15s}
.sc.s{border-color:#f2eef8;transform:scale(1.15)}

/* ====== CLASSES ====== */
.classes{display:flex;flex-direction:column;gap:10px}
.classe{display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;cursor:pointer;
  border:1.5px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);transition:.15s;text-align:left}
.classe.sel{border-color:#ff9a5c;background:rgba(255,122,92,.14)}
.classe .c-ic{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.classe .c-nm{font-family:'Oswald',sans-serif;font-size:15px;letter-spacing:1px}
.classe .c-ds{font-size:11px;color:#a89cb8;margin-top:2px}
.classe .c-bonus{margin-left:auto;font-size:11px;font-weight:600;color:#5ad48e;white-space:nowrap;flex-shrink:0}

/* Récap joueur sur l'onglet port */
.recap{display:flex;align-items:center;gap:12px;margin-bottom:18px;padding:12px 14px;
  border:1.5px solid rgba(255,255,255,.1);border-radius:14px;background:rgba(255,255,255,.04)}
.recap .r-ava{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0}
.recap .r-n{font-family:'Oswald',sans-serif;font-size:15px;letter-spacing:1px;text-align:left}
.recap .r-d{font-size:11px;color:#a89cb8;font-style:italic;text-align:left;margin-top:1px}

/* ====== TOAST ====== */
.toast{position:fixed;top:calc(20px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-100px);
  background:rgba(30,32,55,.85);backdrop-filter:blur(12px);border:1.5px solid rgba(255,255,255,.12);
  color:#f2eef8;padding:14px 24px;border-radius:14px;font-size:14px;z-index:1100;transition:.4s;opacity:0;
  box-shadow:0 8px 30px rgba(0,0,0,.3)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.error{border-color:#ff7a7a;color:#ff7a7a}
.toast.success{border-color:#5ad48e;color:#5ad48e}
</style>
</head>
<body>

<div class="orb o1"></div><div class="orb o2"></div>

<div class="app">
  <div class="brand">
    <div class="b-row"><div class="b-t">BATTLE</div><div class="b-vl"></div><div class="b-d">DOCK</div></div>
    <div class="b-sub"><span class="bs2">Saison 2</span><i></i><span class="bmrs">Marseille</span></div>
  </div>

  <div class="auth-card">
    <div class="tabs">
      <button class="tab active" data-tab="joueur">Ton joueur</button>
      <button class="tab" data-tab="voie">Ta voie</button>
    </div>

    <!-- ===== PANEL JOUEUR ===== -->
    <div class="panel active" id="panel-joueur">
      <div class="selp-row">
        <div class="arrow" id="prev">‹</div>
        <div class="big-ava" id="ava">⚓</div>
        <div class="arrow" id="next">›</div>
      </div>
      <div class="selp-name" id="avaName">L'Ancre</div>
      <div class="selp-count" id="avaCount">Emblème 1 / 12</div>
      <div class="colors" id="colors"></div>

      <div class="sec">Ton pseudo</div>
      <div class="field"><input type="text" id="pseudo" maxlength="20" placeholder="Le Fada du Vieux-Port"></div>

      <div class="sec">Ta devise</div>
      <div class="field"><input type="text" id="devise" maxlength="60" placeholder="Ex : Ici c'est mon quai."></div>
      <div class="hint">Affichée sur ton profil et tes défaites (surtout tes défaites).</div>

      <button class="btn-primary" id="btnNext">Choisir ma voie →</button>
    </div>

    <!-- ===== PANEL VOIE ===== -->
    <div class="panel" id="panel-voie">
      <div class="recap">
        <div class="r-ava" id="recapAva">⚓</div>
        <div>
          <div class="r-n" id="recapName">Joueur</div>
          <div class="r-d" id="recapDevise"></div>
        </div>
      </div>
      <div class="sec" style="margin-top:0">Ta voie de docker</div>
      <div class="classes" id="classesGrid"></div>
      <button class="btn-primary" id="btnSave">Larguer les amarres</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// === SUPABASE ===
const SUPABASE_URL='https://jtijmythnvqgquizeizs.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp0aWpteXRobnZxZ3F1aXplaXpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ1NjU3NjAsImV4cCI6MjEwMDE0MTc2MH0.7Eo_DZarB7J6BCzRHh5pB7-ZKKwgIlwWkpqUV9MGbUc';

// === SESSION ===
let session=null;
try{session=JSON.parse(localStorage.getItem('bd2_session'))}catch(e){}
if(!session||!session.access_token)location.href='index.html';

// === DATA ===
const EMBLEMES=[
  {e:'⚓',n:"L'Ancre"},{e:'🦑',n:'Le Poulpe'},{e:'⛵',n:'Le Voilier'},{e:'🐟',n:'La Sardine'},
  {e:'🌊',n:'La Vague'},{e:'🏗️',n:'La Grue'},{e:'📦',n:'Le Colis'},{e:'🦀',n:'Le Crabe'},
  {e:'🐙',n:'La Pieuvre'},{e:'🔱',n:'Le Trident'},{e:'🧭',n:'La Boussole'},{e:'⚙️',n:'La Mécanique'}
];
const COLORS=[
  ['#9d7bff','#ff7a5c'],['#ff7a5c','#ffc24d'],['#4dc9ff','#9d7bff'],['#2ec4a0','#4dc9ff'],
  ['#ff5c8a','#9d7bff'],['#ffc24d','#2ec4a0'],['#ff5c5c','#ffc24d'],['#7b8cff','#2ec4a0']
];
const CLASSES=[
  {e:'⚔️',n:'Bagarreur',d:'Frappe fort, réfléchit après',b:'+15% attaque',bg:'rgba(255,92,92,.15)'},
  {e:'💰',n:'Négociant',d:'Tout se vend, même les sardines',b:'+20% revenus',bg:'rgba(255,194,77,.2)'},
  {e:'🌫️',n:'Contrebandier',d:'Passe partout, surtout où c’est interdit',b:'−25% temps',bg:'rgba(77,201,255,.18)'}
];
let idx=0, color=0, classe=0;

const $=id=>document.getElementById(id);
const grad=i=>`linear-gradient(135deg,${COLORS[i][0]},${COLORS[i][1]})`;

// === TABS ===
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>switchTab(t.dataset.tab));
});
function switchTab(name){
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===name));
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
  $('panel-'+name).classList.add('active');
  if(name==='voie')refreshRecap();
}
$('btnNext').onclick=()=>switchTab('voie');

// === CAROUSEL ===
function render(anim=false){
  const a=$('ava');
  a.textContent=EMBLEMES[idx].e;
  a.style.background=grad(color);
  if(anim){a.classList.remove('swap');void a.offsetWidth;a.classList.add('swap')}
  $('avaName').textContent=EMBLEMES[idx].n;
  $('avaCount').textContent=`Emblème ${idx+1} / ${EMBLEMES.length}`;
}
$('prev').onclick=()=>{idx=(idx-1+EMBLEMES.length)%EMBLEMES.length;render(true)};
$('next').onclick=()=>{idx=(idx+1)%EMBLEMES.length;render(true)};

// Swipe tactile
let sx=null;
$('ava').addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
$('ava').addEventListener('touchend',e=>{
  if(sx===null)return;
  const dx=e.changedTouches[0].clientX-sx;sx=null;
  if(dx>40)$('prev').click(); else if(dx<-40)$('next').click();
},{passive:true});

// Couleurs
COLORS.forEach((c,i)=>{
  const b=document.createElement('div');b.className='sc'+(i===0?' s':'');b.style.background=grad(i);
  b.onclick=()=>{color=i;document.querySelectorAll('.sc').forEach((x,j)=>x.classList.toggle('s',j===i));render()};
  $('colors').appendChild(b);
});

// Classes
CLASSES.forEach((c,i)=>{
  const b=document.createElement('div');b.className='classe'+(i===0?' sel':'');
  b.innerHTML=`<div class="c-ic" style="background:${c.bg}">${c.e}</div>
    <div><div class="c-nm">${c.n}</div><div class="c-ds">${c.d}</div></div>
    <div class="c-bonus">${c.b}</div>`;
  b.onclick=()=>{classe=i;document.querySelectorAll('.classe').forEach((x,j)=>x.classList.toggle('sel',j===i))};
  $('classesGrid').appendChild(b);
});

// Récap sur onglet port
function refreshRecap(){
  $('recapAva').textContent=EMBLEMES[idx].e;
  $('recapAva').style.background=grad(color);
  $('recapName').textContent=$('pseudo').value.trim()||'Joueur';
  const d=$('devise').value.trim();
  $('recapDevise').textContent=d?`« ${d} »`:'';
}

// Pré-remplir pseudo depuis le signup
const meta=session.user&&session.user.user_metadata;
if(meta&&meta.pseudo)$('pseudo').value=meta.pseudo;
render();

// === TOAST ===
let tt;
function showToast(m,t=''){const x=$('toast');x.textContent=m;x.className='toast show '+t;clearTimeout(tt);tt=setTimeout(()=>x.classList.remove('show'),3200)}

// === SAVE ===
$('btnSave').addEventListener('click',async()=>{
  const pseudo=$('pseudo').value.trim();
  if(pseudo.length<3){switchTab('joueur');return showToast('Pseudo : 3 caractères minimum','error')}
  const btn=$('btnSave');btn.disabled=true;
  const profile={
    id:session.user.id,
    pseudo,
    avatar_emoji:EMBLEMES[idx].e,
    avatar_color:COLORS[color].join(','),
    devise:$('devise').value.trim(),
    classe:CLASSES[classe].n
  };
  try{
    const res=await fetch(`${SUPABASE_URL}/rest/v1/profiles?on_conflict=id`,{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'apikey':SUPABASE_ANON,
        'Authorization':`Bearer ${session.access_token}`,
        'Prefer':'resolution=merge-duplicates'
      },
      body:JSON.stringify(profile)
    });
    if(!res.ok){const e=await res.json();throw new Error(e.message||'Erreur sauvegarde')}
    localStorage.setItem('bd2_profile',JSON.stringify(profile));
    showToast('Profil enregistré, cap sur le port !','success');
    setTimeout(()=>location.href='jeu.html',700);
  }catch(e){
    showToast(e.message,'error');
    btn.disabled=false;
  }
});
</script>
</body>
</html>
