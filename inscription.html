<!DOCTYPE html>
<html lang="fr">
<head>

<title>Le Rex du Quartier — Cérémonie d'ouverture</title>
<style>
:root{
  --safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px);
  --nuit:#0d0406;--velours:#5a1220;--velours2:#7c1c2e;
  --or:#e8b84b;--or-clair:#f7dd9a;--ecran:#fdf8ec;--encre:#241a12;
  --rideauW:clamp(30px,8vw,50px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:Georgia,serif;background:var(--nuit);color:var(--encre);
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;
  padding:calc(8px + var(--safeT)) 0 calc(24px + var(--safeB));
  overflow-x:hidden;
  opacity:0;animation:entre .6s forwards;
}
@keyframes entre{to{opacity:1}}
body.sort{animation:sortie .8s forwards}
@keyframes sortie{to{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}

/* rideaux + cantonnière (identiques au guichet) */
.rideau{position:fixed;top:0;bottom:0;width:var(--rideauW);z-index:4;pointer-events:none}
.rideau svg{width:100%;height:100%;display:block}
.rideau.g{left:0}.rideau.d{right:0;transform:scaleX(-1)}
.cantonniere{position:fixed;top:0;left:0;right:0;height:calc(64px + var(--safeT));z-index:10;pointer-events:none;
  filter:drop-shadow(0 6px 14px rgba(0,0,0,.7))}
.cantonniere svg{width:100%;height:100%;display:block}
.faisceau{position:fixed;left:50%;top:0;transform:translateX(-50%);z-index:1;pointer-events:none;
  width:0;height:0;border-left:36vw solid transparent;border-right:36vw solid transparent;
  border-top:58dvh solid rgba(247,221,154,.05)}

/* écran */
.salle{position:relative;z-index:5;width:min(calc(100vw - 2*var(--rideauW) - 14px),400px);margin-top:calc(58px + var(--safeT))}
.ecranCine{
  position:relative;
  background:radial-gradient(ellipse 120% 90% at 50% 0%, #fffdf6, var(--ecran) 55%, #eee3cb);
  border:10px solid #17090d;border-bottom-width:15px;border-radius:8px;
  box-shadow:0 0 60px rgba(253,248,236,.28),0 0 140px rgba(253,248,236,.10),0 22px 50px rgba(0,0,0,.8);
  padding:18px 16px 22px;overflow:hidden;
}
.ecranCine::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 22% 28%,rgba(120,90,40,.06) 0 2px,transparent 3px) 0 0/85px 65px;
  animation:proj .4s steps(2) infinite}
@keyframes proj{50%{transform:translate(1px,1px)}}
.ecranCine::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%,transparent 62%,rgba(60,35,15,.14))}

/* progression : pellicule de 7 photogrammes */
.progression{display:flex;justify-content:center;gap:5px;margin-bottom:12px}
.photog{width:22px;height:15px;border:2px solid rgba(36,26,18,.35);border-radius:3px;background:transparent;transition:.3s}
.photog.fait{background:#571520;border-color:#571520}
.photog.actu{border-color:#571520;box-shadow:0 0 0 2px rgba(87,21,32,.2)}

/* Bob + bulle */
.scene-bob{display:flex;align-items:flex-end;gap:8px}
.bob{flex:0 0 clamp(72px,20vw,92px)}
.bob svg{width:100%;height:auto;display:block}
.brasAnim{transform-origin:60px 96px;animation:coucou 3.4s ease-in-out infinite}
@keyframes coucou{0%,70%,100%{transform:rotate(0)}78%{transform:rotate(-12deg)}86%{transform:rotate(3deg)}92%{transform:rotate(-8deg)}}
.bulle{
  flex:1;position:relative;background:#fff;border:2px solid var(--encre);border-radius:12px;
  padding:9px 11px;font-size:clamp(12.5px,3.4vw,14px);line-height:1.45;
  box-shadow:3px 3px 0 rgba(36,26,18,.18);min-height:64px;transition:opacity .18s;
}
.bulle::before{content:"";position:absolute;left:-9px;bottom:18px;border:9px solid transparent;border-right-color:var(--encre);border-left:0}
.bulle::after{content:"";position:absolute;left:-6px;bottom:20px;border:7px solid transparent;border-right-color:#fff;border-left:0}
.bulle b{display:block;font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.5;margin-bottom:3px}
.bulle.fondu{opacity:0}

/* étapes */
.etape{display:none;margin-top:14px}
.etape.actif{display:block;animation:glisse .35s}
@keyframes glisse{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.etTitre{font-size:clamp(16px,4.6vw,19px);font-weight:bold;letter-spacing:.06em;text-transform:uppercase;color:#571520;text-align:center}
.etSous{text-align:center;font-family:'Courier New',monospace;font-size:9.5px;letter-spacing:.24em;color:#8a6c2a;text-transform:uppercase;margin-top:3px}

/* choix en grille */
.choix{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.choix.uneCol{grid-template-columns:1fr}
.opt{
  padding:11px 10px;background:rgba(255,255,255,.65);border:2px solid rgba(36,26,18,.3);border-radius:9px;
  font-family:inherit;font-size:13.5px;color:var(--encre);cursor:pointer;text-align:left;transition:.15s;
}
.opt .ico{font-size:19px;display:block;margin-bottom:3px}
.opt .nomO{font-weight:bold;display:block}
.opt .descO{display:block;font-size:11px;opacity:.65;margin-top:2px;line-height:1.35}
.opt.sel{border-color:#571520;background:#fff;box-shadow:0 0 0 3px rgba(87,21,32,.15);transform:translateY(-1px)}
.opt:active{transform:scale(.98)}

/* logos */
.logos{display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.logo{
  width:56px;height:56px;font-size:27px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.65);border:2px solid rgba(36,26,18,.3);border-radius:50%;cursor:pointer;transition:.15s;
}
.logo.sel{border-color:#571520;background:#fff;box-shadow:0 0 0 3px rgba(87,21,32,.18);transform:scale(1.08)}

input{
  width:100%;padding:12px;font-size:16px;font-family:'Courier New',monospace;margin-top:12px;
  background:rgba(255,255,255,.75);color:var(--encre);
  border:2px solid rgba(36,26,18,.35);border-radius:6px;outline:none;transition:.2s;
}
input::placeholder{color:rgba(36,26,18,.35);font-size:12.5px}
input:focus{border-color:#571520;box-shadow:0 0 0 3px rgba(87,21,32,.12)}

/* boutons */
.navBtns{display:flex;gap:9px;margin-top:16px}
.btn{
  padding:13px 0;font-family:inherit;font-size:13.5px;font-weight:bold;letter-spacing:.1em;text-transform:uppercase;
  border-radius:6px;cursor:pointer;transition:transform .1s,box-shadow .1s;
}
.btnSuiv{
  flex:1;background:linear-gradient(180deg,#7c1c2e,#571520);color:var(--or-clair);
  border:2px solid var(--encre);box-shadow:0 5px 0 #2a0a10;
}
.btnSuiv:active{transform:translateY(4px);box-shadow:0 1px 0 #2a0a10}
.btnSuiv:disabled{opacity:.45}
.btnRet{
  flex:0 0 84px;background:transparent;color:var(--encre);border:2px solid rgba(36,26,18,.4);
}

/* cadeau : carton */
.carton{
  width:min(60vw,200px);margin:16px auto 0;cursor:pointer;transition:transform .15s;
}
.carton:active{transform:scale(.96)}
.carton svg{width:100%;display:block}
.secoue{animation:secoue .5s infinite}
@keyframes secoue{0%,100%{transform:rotate(0)}25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
.cadeauRevele{display:none;text-align:center;margin-top:14px}
.cadeauRevele.actif{display:block;animation:popCa .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes popCa{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.cadeauRevele .grosIco{font-size:44px}
.cadeauRevele .nomCa{font-weight:bold;font-size:16px;color:#571520;margin-top:4px}
.cadeauRevele .bonusCa{font-family:'Courier New',monospace;font-size:11px;color:#8a6c2a;margin-top:3px}

/* plaque finale */
.plaqueFinale{
  margin-top:14px;background:#17090d;border:3px solid var(--or);border-radius:10px;
  padding:18px 14px;text-align:center;color:var(--or-clair);
  box-shadow:0 0 26px rgba(232,184,75,.25), inset 0 0 24px rgba(0,0,0,.6);
}
.plaqueFinale .pfLogo{font-size:34px}
.plaqueFinale h2{font-size:clamp(18px,5.4vw,23px);letter-spacing:.12em;text-transform:uppercase;margin-top:6px;color:var(--or)}
.plaqueFinale .pfLigne{font-family:'Courier New',monospace;font-size:11px;letter-spacing:.14em;margin-top:8px;color:#e8d5a8}
.plaqueFinale .pfLigne b{color:var(--or-clair)}
.plaqueFinale .pfDevise{font-style:italic;font-size:12.5px;margin-top:10px;color:#d8c088}
.btnPortes{
  width:100%;margin-top:16px;padding:17px 0;font-family:inherit;font-size:16px;font-weight:bold;
  letter-spacing:.12em;text-transform:uppercase;cursor:pointer;
  background:linear-gradient(180deg,#f6e3a6,#caa24a 55%,#8a6c2a);color:var(--encre);
  border:2px solid var(--encre);border-radius:8px;
  box-shadow:0 6px 0 #5c4720, 0 10px 24px rgba(0,0,0,.35);
  animation:pulseP 2s infinite;
}
@keyframes pulseP{50%{box-shadow:0 6px 0 #5c4720, 0 0 30px rgba(232,184,75,.5)}}
.btnPortes:active{transform:translateY(5px);box-shadow:0 1px 0 #5c4720}
</style>
</head>

/* ==== UI HELPERS ==== */
const elBulle=document.getElementById("bulle"),elTexte=document.getElementById("bulleTexte");
function parle(t){
  elBulle.classList.add("fondu");
  setTimeout(()=>{elTexte.textContent=t;elBulle.classList.remove("fondu")},180);
}
let etapeActu=0;
const NB=6;
const ORDRE=[1,2,4,5,6,7];
(function(){const p=document.getElementById("progression");
  for(let i=1;i<=NB;i++){const d=document.createElement("div");d.className="photog";d.id="ph"+i;p.appendChild(d)}})();
function majProg(){
  for(let i=1;i<=NB;i++){
    const d=document.getElementById("ph"+i);
    d.classList.toggle("fait",i<etapeActu);
    d.classList.toggle("actu",i===etapeActu);
  }
}
function montre(n){
  document.querySelectorAll(".etape").forEach(e=>e.classList.remove("actif"));
  document.getElementById(n===8?"etFinal":"et"+n).classList.add("actif");
  etapeActu = n===8 ? NB : ORDRE.indexOf(n)+1;
  majProg();
}
function retour(n){montre(n);parle(BOB["et"+n]);}

/* ==== construction des choix ==== */
function grilleChoix(contId, data, cle, btnId, rendu){
  const c=document.getElementById(contId);
  data.forEach(d=>{
    const b=document.createElement("button");
    b.className="opt";b.innerHTML=rendu(d);
    b.onclick=()=>{
      c.querySelectorAll(".opt").forEach(o=>o.classList.remove("sel"));
      b.classList.add("sel");
      etat[cle]=d;
      document.getElementById(btnId).disabled=false;
      if(cle==="nom") document.getElementById("nomLibre").value="";
    };
    c.appendChild(b);
  });
}
grilleChoix("choixNoms",NOMS,"nom","suiv1",n=>`<span class="nomO">${n}</span>`);
grilleChoix("choixQuartiers",QUARTIERS,"quartier","suiv2",
  q=>`<span class="ico">${q.ico}</span><span class="nomO">${q.nom}</span><span class="descO">${q.desc}</span>`);
grilleChoix("choixDevises",DEVISES,"devise","suiv6",d=>`<span class="nomO" style="font-weight:normal;font-style:italic">« ${d} »</span>`);

/* logos */
(function(){const c=document.getElementById("choixLogos");
  LOGOS.forEach(l=>{
    const b=document.createElement("button");b.className="logo";b.textContent=l;
    b.onclick=()=>{c.querySelectorAll(".logo").forEach(o=>o.classList.remove("sel"));
      b.classList.add("sel");etat.logo=l;document.getElementById("suiv4").disabled=false};
    c.appendChild(b);
  })})();

/* champs libres */
document.getElementById("nomLibre").addEventListener("input",e=>{
  const v=e.target.value.trim();
  if(v){document.querySelectorAll("#choixNoms .opt").forEach(o=>o.classList.remove("sel"));
    etat.nom=v;document.getElementById("suiv1").disabled=false}
  else if(!document.querySelector("#choixNoms .opt.sel")){etat.nom=null;document.getElementById("suiv1").disabled=true}
});
const inDir=document.getElementById("nomDirecteur");
inDir.value=etat.directeur;
document.getElementById("suiv5").disabled=!etat.directeur;
inDir.addEventListener("input",e=>{
  etat.directeur=e.target.value.trim();
  document.getElementById("suiv5").disabled=!etat.directeur;
});
document.getElementById("deviseLibre").addEventListener("input",e=>{
  const v=e.target.value.trim();
  if(v){document.querySelectorAll("#choixDevises .opt").forEach(o=>o.classList.remove("sel"));
    etat.devise=v;document.getElementById("suiv6").disabled=false}
  else if(!document.querySelector("#choixDevises .opt.sel")){etat.devise=null;document.getElementById("suiv6").disabled=true}
});

/* ==== navigation ==== */
function valideEtape(n){
  if(n===1){montre(2);parle(BOB.et2);}
  if(n===2){montre(4);parle(BOB.et4);}
  if(n===4){montre(5);parle(BOB.et5);}
  if(n===5){montre(6);parle(BOB.et6);}
  if(n===6){montre(7);parle(BOB.et7);}
  if(n===7){montreFinal();}
}

/* cadeau */
function ouvreCarton(){
  if(etat.cadeau) return;
  etat.cadeau = CADEAUX[Math.floor(Math.random()*CADEAUX.length)];
  const carton=document.getElementById("carton");
  carton.classList.remove("secoue");
  carton.style.opacity=".35";
  document.getElementById("cadIco").textContent=etat.cadeau.ico;
  document.getElementById("cadNom").textContent=etat.cadeau.nom;
  document.getElementById("cadBonus").textContent=etat.cadeau.bonus;
  document.getElementById("cadeauRevele").classList.add("actif");
  document.getElementById("suiv7").style.display="block";
  parle(BOB.et7ap[etat.cadeau.id]);
}

/* final */
function montreFinal(){
  const annee=new Date().getFullYear();
  document.getElementById("plaque").innerHTML=`
    <div class="pfLogo">${etat.logo}</div>
    <h2>${etat.nom}</h2>
    <div class="pfLigne">Fondé en <b>${annee}</b></div>
    <div class="pfLigne">Directeur : <b>${etat.directeur}</b></div>
    <div class="pfLigne">Quartier : <b>${etat.quartier.nom}</b></div>
    <div class="pfLigne" style="font-size:10px;opacity:.8">${etat.quartier.desc}</div>
    <div class="pfLigne">Capacité : <b>80 places</b></div>
    <div class="pfDevise">« ${etat.devise} »</div>`;
  montre(8);
  for(let i=1;i<=NB;i++) document.getElementById("ph"+i).classList.add("fait");
  parle(BOB.final);
}

/* ==== sauvegarde + départ ==== */
async function ouvrirLesPortes(){
  const btn=document.querySelector(".btnPortes");
  btn.disabled=true;btn.textContent="🎬 Bob pousse les portes…";
  const eq = EFFETS_QUARTIER[etat.quartier.id];
  const ec = EFFETS_CADEAU[etat.cadeau.id];  /* cadeau_depart en base */
  const corps={
    user_id:session.user_id,
    nom:etat.nom,
    quartier:etat.quartier.id,
    logo:etat.logo,
    directeur:etat.directeur,
    devise:etat.devise,
    cadeau_depart:etat.cadeau.id,
    capacite:80,
    jour:1,
    argent:500,
    mult_frequentation:eq.mult_frequentation,
    mult_prix:eq.mult_prix,
    mult_fidelite:eq.mult_fidelite,
    mult_films:eq.mult_films,
    loyer:eq.loyer,
    mult_snack:ec.mult_snack,
    mult_satisfaction:ec.mult_satisfaction,
    prod_avancee:ec.prod_avancee
  };
  try{
    const rep=await fetch(SB_URL+"/rest/v1/cinemas",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "apikey":SB_KEY,
        "Authorization":"Bearer "+session.access_token,
        "Prefer":"return=minimal"
      },
      body:JSON.stringify(corps)
    });
    if(!rep.ok && rep.status!==409){
      const err=await rep.json().catch(()=>({}));
      parle("« La machine dit : "+(err.message||rep.status)+". Bon. On réessaie ? » ");
      btn.disabled=false;btn.textContent="🎬 Ouvrir les portes";
      return;
    }
  }catch(e){
    parle("« Le réseau est en panne. Comme le projecteur en 1987. Réessaie. »");
    btn.disabled=false;btn.textContent="🎬 Ouvrir les portes";
    return;
  }
  localStorage.setItem("rex_cinema",JSON.stringify(corps));
  parle("« CLAC. Les enseignes s'allument. Bienvenue chez toi. »");
  setTimeout(()=>{
    document.body.classList.add("sort");
    setTimeout(()=>location.replace("jeu.html"),820);
  },1200);
}

/* ==== démarrage ==== */
montre(1);
document.getElementById("ph1").classList.add("actu");
parle(BOB.intro);
setTimeout(()=>parle(BOB.et1),4200);
</script>
