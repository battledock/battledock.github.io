<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BattleDock 2 — Ton profil</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%;font-family:'Inter',sans-serif;overflow-x:hidden}
body{background:linear-gradient(180deg,#141625 0%,#1b1e33 45%,#251f3d 100%);color:#f2eef8}

.orb{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0;animation:drift 12s ease-in-out infinite;will-change:transform}
@media (max-width:480px){.orb{filter:blur(60px)}}
.o1{width:min(380px,100vw);height:min(380px,100vw);background:rgba(120,90,255,.16);top:5%;left:5%}
.o2{width:min(320px,85vw);height:min(320px,85vw);background:rgba(255,110,70,.13);bottom:5%;right:5%;animation-delay:4s}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(10px,-10px)}}

.wrap{position:relative;z-index:1;max-width:440px;margin:0 auto;
  padding:calc(28px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));
  animation:fadein .6s ease-out}
@keyframes fadein{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

.brand{text-align:center;margin-bottom:22px}
.b-row{display:flex;align-items:center;justify-content:center;gap:10px}
.b-t{font-family:'Oswald',sans-serif;font-size:clamp(24px,6.5vw,32px);font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#f2eef8}
.b-vl{width:2px;height:clamp(20px,5.5vw,28px);background:linear-gradient(180deg,#9d7bff,#ff9a5c);border-radius:2px}
.b-d{font-family:'Oswald',sans-serif;font-size:clamp(24px,6.5vw,32px);font-weight:700;letter-spacing:3px;text-transform:uppercase;
  background:linear-gradient(135deg,#9d7bff,#ff7a5c,#ffc24d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.subtitle{text-align:center;font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:4px;text-transform:uppercase;
  color:#a89cb8;margin-top:6px}

.card{border:1.5px solid rgba(255,255,255,.12);border-radius:20px;
  background:rgba(255,255,255,.06);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 12px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08);
  padding:clamp(20px,5.5vw,28px) clamp(16px,5vw,24px)}

/* PREVIEW */
.preview{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:24px}
.pv-avatar{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:44px;box-shadow:0 8px 30px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.25);transition:.3s}
.pv-name{font-family:'Oswald',sans-serif;font-size:20px;letter-spacing:1px}
.pv-line{font-size:12px;color:#a89cb8;font-style:italic;text-align:center;min-height:16px}

.sec{font-family:'Oswald',sans-serif;font-size:11px;font-weight:600;letter-spacing:3px;text-transform:uppercase;
  color:#a89cb8;margin:20px 0 10px}
.sec:first-of-type{margin-top:0}

/* GRILLES */
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.emoji-opt{aspect-ratio:1;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;
  cursor:pointer;border:1.5px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);transition:.15s}
.emoji-opt.sel{border-color:#9d7bff;background:rgba(157,123,255,.18);transform:scale(1.08)}
.color-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.color-opt{aspect-ratio:1;border-radius:50%;cursor:pointer;border:2.5px solid transparent;transition:.15s}
.color-opt.sel{border-color:#f2eef8;transform:scale(1.12)}

/* CHAMPS */
.field input{width:100%;padding:14px 16px;border:1.5px solid rgba(255,255,255,.12);border-radius:12px;
  background:rgba(255,255,255,.06);font-family:'Inter',sans-serif;font-size:16px;color:#f2eef8;outline:none;transition:.2s}
.field input:focus{border-color:#9d7bff;background:rgba(255,255,255,.1)}
.field input::placeholder{color:#8a7f9c}
.hint{font-size:11px;color:#8a7f9c;margin-top:6px}

/* PORTS */
.ports{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.port-opt{padding:12px 10px;border-radius:12px;cursor:pointer;text-align:center;
  border:1.5px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);transition:.15s}
.port-opt .p-emo{font-size:20px}
.port-opt .p-name{font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;margin-top:4px;color:#c8bede}
.port-opt.sel{border-color:#ff9a5c;background:rgba(255,122,92,.14)}
.port-opt.sel .p-name{color:#f2eef8}

.btn-primary{width:100%;padding:16px;border:none;border-radius:12px;cursor:pointer;margin-top:24px;
  font-family:'Oswald',sans-serif;font-size:14px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:#fff;
  background:linear-gradient(135deg,#9d7bff,#ff7a5c);box-shadow:0 6px 24px rgba(157,123,255,.25);transition:.2s}
.btn-primary:active{transform:scale(.97)}
.btn-primary:disabled{opacity:.5;cursor:wait}

.toast{position:fixed;top:calc(20px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-100px);
  background:rgba(30,32,55,.85);backdrop-filter:blur(12px);border:1.5px solid rgba(255,255,255,.12);
  color:#f2eef8;padding:14px 24px;border-radius:14px;font-size:14px;z-index:1100;transition:.4s;opacity:0;
  box-shadow:0 8px 30px rgba(0,0,0,.3)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.error{border-color:#ff7a7a;color:#ff7a7a}
.toast.success{border-color:#5ad48e;color:#5ad48e}
</style>
</head>
<body>

<div class="orb o1"></div><div class="orb o2"></div>

<div class="wrap">
  <div class="brand">
    <div class="b-row"><div class="b-t">BATTLE</div><div class="b-vl"></div><div class="b-d">DOCK</div></div>
    <div class="subtitle">Crée ton docker</div>
  </div>

  <div class="card">
    <!-- PREVIEW LIVE -->
    <div class="preview">
      <div class="pv-avatar" id="pvAvatar">⚓</div>
      <div class="pv-name" id="pvName">Docker</div>
      <div class="pv-line" id="pvLine"></div>
    </div>

    <div class="sec">Ton emblème</div>
    <div class="grid" id="emojiGrid"></div>

    <div class="sec">Ta couleur</div>
    <div class="color-grid" id="colorGrid"></div>

    <div class="sec">Ton pseudo</div>
    <div class="field"><input type="text" id="pseudo" maxlength="20" placeholder="Le Fada du Vieux-Port"></div>

    <div class="sec">Ta devise</div>
    <div class="field"><input type="text" id="devise" maxlength="60" placeholder="Ex : Ici c'est mon quai."></div>
    <div class="hint">Affichée sur ton profil et tes défaites (surtout tes défaites).</div>

    <div class="sec">Ton port d'attache</div>
    <div class="ports" id="portsGrid"></div>

    <button class="btn-primary" id="btnSave">Larguer les amarres</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// === SUPABASE ===
const SUPABASE_URL='https://jtijmythnvqgquizeizs.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp0aWpteXRobnZxZ3F1aXplaXpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ1NjU3NjAsImV4cCI6MjEwMDE0MTc2MH0.7Eo_DZarB7J6BCzRHh5pB7-ZKKwgIlwWkpqUV9MGbUc';

// === SESSION ===
let session=null;
try{session=JSON.parse(localStorage.getItem('bd2_session'))}catch(e){}
if(!session||!session.access_token)location.href='index.html';

// === DATA ===
const EMOJIS=['⚓','🦑','⛵','🐟','🌊','🏗️','📦','🦀','🐙','🔱','🧭','⚙️'];
const COLORS=[
  ['#9d7bff','#ff7a5c'],['#ff7a5c','#ffc24d'],['#4dc9ff','#9d7bff'],['#2ec4a0','#4dc9ff'],
  ['#ff5c8a','#9d7bff'],['#ffc24d','#2ec4a0'],['#ff5c5c','#ffc24d'],['#7b8cff','#2ec4a0']
];
const PORTS=[
  {e:'⛵',n:'Vieux-Port'},{e:'🏘️',n:'Le Panier'},{e:'🏗️',n:'La Joliette'},
  {e:'🎣',n:"L'Estaque"},{e:'🏞️',n:'Les Calanques'},{e:'🌅',n:'Vallon des Auffes'}
];
let sel={emoji:'⚓',color:0,port:0};

// === RENDER ===
const $=id=>document.getElementById(id);
function grad(i){return `linear-gradient(135deg,${COLORS[i][0]},${COLORS[i][1]})`}
function refresh(){
  $('pvAvatar').textContent=sel.emoji;
  $('pvAvatar').style.background=grad(sel.color);
  $('pvName').textContent=$('pseudo').value.trim()||'Docker';
  const d=$('devise').value.trim();
  $('pvLine').textContent=(d?`« ${d} »  ·  `:'')+PORTS[sel.port].n;
}
EMOJIS.forEach(e=>{
  const b=document.createElement('div');b.className='emoji-opt'+(e===sel.emoji?' sel':'');b.textContent=e;
  b.onclick=()=>{sel.emoji=e;document.querySelectorAll('.emoji-opt').forEach(x=>x.classList.toggle('sel',x.textContent===e));refresh()};
  $('emojiGrid').appendChild(b);
});
COLORS.forEach((c,i)=>{
  const b=document.createElement('div');b.className='color-opt'+(i===sel.color?' sel':'');b.style.background=grad(i);
  b.onclick=()=>{sel.color=i;document.querySelectorAll('.color-opt').forEach((x,j)=>x.classList.toggle('sel',j===i));refresh()};
  $('colorGrid').appendChild(b);
});
PORTS.forEach((p,i)=>{
  const b=document.createElement('div');b.className='port-opt'+(i===sel.port?' sel':'');
  b.innerHTML=`<div class="p-emo">${p.e}</div><div class="p-name">${p.n}</div>`;
  b.onclick=()=>{sel.port=i;document.querySelectorAll('.port-opt').forEach((x,j)=>x.classList.toggle('sel',j===i));refresh()};
  $('portsGrid').appendChild(b);
});
$('pseudo').addEventListener('input',refresh);
$('devise').addEventListener('input',refresh);

// Pré-remplir pseudo depuis metadata du signup
const meta=session.user&&session.user.user_metadata;
if(meta&&meta.pseudo)$('pseudo').value=meta.pseudo;
refresh();

// === TOAST ===
let tt;
function showToast(m,t=''){const x=$('toast');x.textContent=m;x.className='toast show '+t;clearTimeout(tt);tt=setTimeout(()=>x.classList.remove('show'),3200)}

// === SAVE ===
$('btnSave').addEventListener('click',async()=>{
  const pseudo=$('pseudo').value.trim();
  if(pseudo.length<3)return showToast('Pseudo : 3 caractères minimum','error');
  const btn=$('btnSave');btn.disabled=true;
  const profile={
    id:session.user.id,
    pseudo,
    avatar_emoji:sel.emoji,
    avatar_color:COLORS[sel.color].join(','),
    devise:$('devise').value.trim(),
    port_attache:PORTS[sel.port].n
  };
  try{
    const res=await fetch(`${SUPABASE_URL}/rest/v1/profiles?on_conflict=id`,{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'apikey':SUPABASE_ANON,
        'Authorization':`Bearer ${session.access_token}`,
        'Prefer':'resolution=merge-duplicates'
      },
      body:JSON.stringify(profile)
    });
    if(!res.ok){const e=await res.json();throw new Error(e.message||'Erreur sauvegarde')}
    localStorage.setItem('bd2_profile',JSON.stringify(profile));
    showToast('Profil enregistré, cap sur le port !','success');
    setTimeout(()=>location.href='jeu.html',700);
  }catch(e){
    showToast(e.message,'error');
    btn.disabled=false;
  }
});
</script>
</body>
</html>
