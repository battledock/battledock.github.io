<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Battle Dock — LE JEU</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Permanent+Marker&family=Space+Grotesk:wght@500;700;900&family=Bungee&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  
  <style>
    :root {
      --port-dark: #0f172a;
      --port-blue: #2563eb;
      --port-light-blue: #38bdf8;
      --comic-yellow: #facc15;
      --comic-red: #ef4444;
      --comic-green: #22c55e;
      --comic-purple: #a855f7;
      --paper-cream: #fefce8;
      --border-thick: 4px solid #000000;
      --shadow-comic-sm: 4px 4px 0px #000000;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: linear-gradient(135deg, #7f1d1d 0%, #991b1b 50%, #dc2626 100%);
      transition: background 0.5s ease;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* EN-TÊTE */
    .header-container {
      text-align: center;
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 380px;
      flex-shrink: 0;
    }

    .main-title {
      font-family: 'Bangers', cursive;
      font-size: clamp(2.8rem, 11vw, 4.5rem);
      color: var(--comic-yellow);
      letter-spacing: 4px;
      text-shadow: 6px 6px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000;
      line-height: 0.9;
      transform: rotate(0deg);
      display: inline-block;
      margin-bottom: 6px;
    }

    .subtitle {
      font-family: 'Permanent Marker', cursive;
      font-size: clamp(0.8rem, 2.3vw, 0.9rem);
      color: #ffffff;
      text-shadow: 3px 3px 0px var(--port-dark);
      letter-spacing: 1px;
    }

    /* CONTENEUR PRINCIPAL */
    .dock-container {
      width: 100%;
      max-width: 380px;
      background: #e2e8f0;
      border: var(--border-thick);
      border-radius: 20px;
      position: relative;
      z-index: 5;
      overflow: hidden;
      min-height: 380px;
      height: auto;
      display: flex;
      flex-direction: column;
      margin: 20px 0;
      flex-shrink: 0;
    }

    /* ONGLETS */
    .tabs-wrapper {
      display: flex;
      background: var(--port-dark);
      border-bottom: var(--border-thick);
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      font-family: 'Bungee', sans-serif;
      font-size: 13px;
      color: #94a3b8;
      padding: 16px 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .tab-btn:first-child {
      border-right: var(--border-thick);
    }

    .tab-btn.active {
      color: #ffffff;
    }

    #tabHome.active {
      background: #3b82f6;
    }

    #tabScores.active {
      background: #ef4444;
    }

    /* CONTENU INTERNE */
    .form-content {
      background: #f3f4f6;
      padding: 20px 22px;
      position: relative;
      flex: 1;
    }

    .form-section { 
      display: none; 
    }
    
    .form-section.active { 
      display: block; 
      animation: fadeIn 0.3s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .input-group { 
      margin-bottom: 14px; 
    }
    
    .input-group:last-of-type {
      margin-bottom: 0;
    }

    .input-group label {
      display: block;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 900;
      font-size: 13px;
      color: var(--port-dark);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .custom-field {
      width: 100%;
      padding: 12px 14px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 15px;
      color: var(--port-dark);
      background: #ffffff;
      border: 4px solid #000000;
      border-radius: 10px;
      box-shadow: 4px 4px 0px #000000;
      transition: all 0.15s ease;
    }

    .custom-field:focus {
      outline: none;
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px #000000;
    }

    .submit-lever-btn {
      color: white;
      border: 4px solid #000000;
      border-radius: 12px;
      padding: 13px 26px;
      font-family: 'Bungee', sans-serif;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      cursor: pointer;
      box-shadow: 6px 6px 0px #000000;
      transition: all 0.15s ease;
      width: 100%;
      margin-top: 12px;
    }

    #login-submit {
      background: var(--comic-red);
    }

    #register-submit {
      background: var(--port-blue);
    }

    .submit-lever-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 8px 8px 0px #000000;
    }

    .submit-lever-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #000000;
    }

    /* FOOTER */
    .footer-stamp {
      margin-top: 4px;
      font-size: 9px;
      color: #ffffff;
      text-align: center;
      max-width: 380px;
      line-height: 1.3;
      flex-shrink: 0;
    }

    /* POPUP D'ERREUR */
    .error-popup {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #e2e8f0;
      border: 4px solid #000000;
      border-radius: 20px;
      padding: 28px 24px;
      max-width: 320px;
      width: 90%;
      box-shadow: 12px 12px 0px #000000;
      z-index: 1000;
      animation: popupAppear 0.3s ease-out;
    }

    .error-popup.show {
      display: block;
    }

    @keyframes popupAppear {
      from { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    .error-popup-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 999;
    }

    .error-popup-overlay.show {
      display: block;
    }

    .error-popup-title {
      font-family: 'Bangers', cursive;
      font-size: 28px;
      color: var(--comic-red);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .error-popup-message {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px;
      color: var(--port-dark);
      margin-bottom: 20px;
      line-height: 1.5;
      font-weight: 600;
    }

    .error-popup-btn {
      background: var(--comic-red);
      color: white;
      border: 4px solid #000000;
      border-radius: 12px;
      padding: 12px 24px;
      font-family: 'Bungee', sans-serif;
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      cursor: pointer;
      box-shadow: 4px 4px 0px #000000;
      transition: all 0.15s ease;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="header-container">
    <div class="main-title">BATTLE DOCK</div><br>
    <div class="subtitle">LE simulateur de docker !</div>
  </div>

  <div class="dock-container">
    <div class="tabs-wrapper">
      <button class="tab-btn active" id="tabHome" onclick="swapTab('home')">👔 CONNEXION</button>
      <button class="tab-btn" id="tabScores" onclick="swapTab('scores')">📝 INSCRIPTION</button>
    </div>

    <div class="form-content">
      <div class="form-section active" id="secHome">
        <form id="quick-login-form" style="display: flex; flex-direction: column; gap: 16px;">
          <div class="input-group">
            <label>👤 Pseudo</label>
            <input type="text" class="custom-field" id="quick-username" placeholder="Ton pseudo" required>
          </div>
          <div class="input-group">
            <label>🔑 Code Secret</label>
            <input type="password" class="custom-field" id="quick-password" placeholder="••••••••" required>
          </div>
          <button type="submit" class="submit-lever-btn" id="login-submit">SE CONNECTER</button>
        </form>
      </div>

      <div class="form-section" id="secScores">
        <form id="application-form" style="display: flex; flex-direction: column; gap: 16px;">
          <div class="input-group">
            <label>👤 Ton Pseudo</label>
            <input type="text" class="custom-field" id="app-username" placeholder="Pseudo de joueur" required>
          </div>
          <div class="input-group">
            <label>🔒 Mot de passe</label>
            <input type="password" class="custom-field" id="app-password" placeholder="Minimum 6 caractères" required>
          </div>
          <button type="submit" class="submit-lever-btn" id="register-submit">S'INSCRIRE</button>
        </form>
      </div>
    </div>
  </div>

  <div class="footer-stamp">Battle Dock est une œuvre de fiction et de divertissement.<br>Tous les éléments sont purement imaginaires.</div>

  <div class="error-popup-overlay" id="errorOverlay"></div>
  <div class="error-popup" id="errorPopup">
    <div class="error-popup-title">ALERTE DU QUAI</div>
    <div class="error-popup-message" id="errorMessage"></div>
    <button class="error-popup-btn" onclick="closeErrorPopup()">OK</button>
  </div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const supabaseClient = createClient(supabaseUrl, supabaseKey);

    if (localStorage.getItem('userId')) {
      window.location.href = 'game.html';
    }

    function translateError(msg) {
      if (!msg) return "Une erreur inconnue est survenue.";
      const lower = msg.toLowerCase();
      
      if (lower.includes("invalid login credentials") || lower.includes("invalid credentials")) {
        return "Pseudo ou Code Secret incorrect ! Vérifie tes identifiants.";
      }
      if (lower.includes("password should be at least") || lower.includes("password is too short")) {
        return "Sécurité insuffisante ! Ton mot de passe doit contenir au moins 6 caractères.";
      }
      if (lower.includes("user already exists") || lower.includes("user already registered") || lower.includes("email already in use")) {
        return "Ce nom d'opérateur est déjà pris par un autre docker !";
      }
      if (lower.includes("rate limit exceeded") || lower.includes("too many requests")) {
        return "Trop de tentatives ! Patiente quelques instants avant de réessayer.";
      }
      if (lower.includes("network error") || lower.includes("failed to fetch")) {
        return "Problème de connexion au réseau. Vérifie ta connexion internet !";
      }
      
      return msg; 
    }

    function showErrorPopup(message) {
      document.getElementById('errorMessage').textContent = translateError(message);
      document.getElementById('errorPopup').classList.add('show');
      document.getElementById('errorOverlay').classList.add('show');
    }

    function closeErrorPopup() {
      document.getElementById('errorPopup').classList.remove('show');
      document.getElementById('errorOverlay').classList.remove('show');
    }

    document.getElementById('errorOverlay').addEventListener('click', closeErrorPopup);

    document.body.style.background = 'linear-gradient(135deg, #7f1d1d 0%, #991b1b 50%, #dc2626 100%)';

    function swapTab(target) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
      
      document.getElementById('tab' + target.charAt(0).toUpperCase() + target.slice(1)).classList.add('active');
      document.getElementById('sec' + target.charAt(0).toUpperCase() + target.slice(1)).classList.add('active');
      
      if (target === 'home') {
        document.body.style.background = 'linear-gradient(135deg, #7f1d1d 0%, #991b1b 50%, #dc2626 100%)';
      } else {
        document.body.style.background = 'linear-gradient(135deg, #1e3a8a 0%, #1e40af 50%, #3b82f6 100%)';
      }
    }

    document.getElementById('quick-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('quick-username').value.trim();
      const password = document.getElementById('quick-password').value;

      if (!username || !password) {
        showErrorPopup('Remplis tous les champs !');
        return;
      }

      try {
        const { data: profile, error: pError } = await supabaseClient
          .from('profiles')
          .select('user_id')
          .eq('username', username)
          .single();

        if (pError || !profile) {
          showErrorPopup('Utilisateur introuvable !');
          return;
        }

        const email = username + '@battledock.local';
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

        if (error) {
          showErrorPopup(error.message);
          return;
        }

        localStorage.setItem('userId', data.user.id);
        localStorage.setItem('username', username);
        window.location.href = 'game.html';
      } catch (err) {
        showErrorPopup(err.message);
      }
    });

    document.getElementById('application-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('app-username').value.trim();
      const password = document.getElementById('app-password').value;

      if (!username || !password) {
        showErrorPopup('Remplis tous les champs !');
        return;
      }

      try {
        // 1. Vérification en temps réel dans la table profiles
        const { data: checkUser } = await supabaseClient
          .from('profiles')
          .select('username')
          .eq('username', username);

        if (checkUser && checkUser.length > 0) {
          showErrorPopup("user already registered");
          return;
        }

        // 2. Création de l'authentification Supabase
        const email = username + '@battledock.local';
        const { data: authData, error: authError } = await supabaseClient.auth.signUp({
          email: email,
          password: password,
          options: { data: { username: username } }
        });

        if (authError) {
          showErrorPopup(authError.message);
          return;
        }
        
        const userId = authData.user.id;

        // 3. Insertion des données utilisateur de manière synchrone
        await supabaseClient.from('profiles').insert([{ user_id: userId, username: username, email: email }]);
        await supabaseClient.from('game_progress').insert([{
          user_id: userId, level: 1, score: 0, rank: 'Docker Occasionnel', money: 100, energy: 50, energy_max: 50, xp: 0
        }]);
        await supabaseClient.from('leaderboard').insert([{ user_id: userId, score: 100 }]);

        localStorage.setItem('userId', userId);
        localStorage.setItem('username', username);
        window.location.href = 'premiereconnexion.html';
      } catch (err) {
        showErrorPopup(err.message);
      }
    });
  </script>
</body>
</html>
