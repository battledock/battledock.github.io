    .container {
      width: 100%;
      max-width: 340px;
      text-align: center;
      padding: 20px;
    }
    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 52px;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: 6px;
      word-spacing: 20px;
      filter: drop-shadow(3px 3px 0 #000);
      white-space: nowrap;
    }
    .sub {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 10px;
      letter-spacing: 6px;
      color: #ffffff;
      margin-bottom: 50px;
    }
    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 50px;
    }
    .button {
      display: inline-block;
      padding: 12px 30px;
      background: #1a1a1a;
      color: #ffffff;
      text-decoration: none;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      letter-spacing: 3px;
      border: 2px solid #1a1a1a;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .button:hover {
      background: #ffffff;
      color: #1a1a1a;
      border-color: #ffffff;
    }
    .version {
      margin-top: 0px;
      font-size: 10px;
      color: #ffffff;
      letter-spacing: 3px;
      font-family: 'Bebas Neue', sans-serif;
      background: transparent;
      padding: 0;
      display: inline-block;
    }
    .modal {
      display: none;
      position: fixed;
      z-index: 1;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(15px);
    }
    .modal-content {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      margin: auto;
      padding: 35px 30px;
      width: 90%;
      max-width: 320px;
      border-radius: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      max-height: 80vh;
      overflow-y: auto;
      border: none;
    }
    .modal-content h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #ffffff;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      letter-spacing: 3px;
    }
    .close {
      color: rgba(255, 255, 255, 0.6);
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 24px;
      font-weight: 300;
      cursor: pointer;
      transition: color 0.3s ease;
    }
    .close:hover {
      color: #ffffff;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 20px;
    }
    input {
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border-radius: 0;
      font-size: 16px;
      transition: all 0.3s ease;
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 2px;
    }
    input:focus {
      outline: none;
      border-color: rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.05);
    }
    input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }
    button[type="submit"] {
      padding: 14px;
      border: none;
      background: #ffffff;
      color: #1a1a1a;
      cursor: pointer;
      border-radius: 0;
      font-weight: bold;
      font-size: 16px;
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 3px;
      transition: all 0.3s ease;
      margin-top: 5px;
    }
    button[type="submit"]:hover {
      background: rgba(255, 255, 255, 0.9);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255, 255, 255, 0.2);
    }
    a {
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      font-size: 14px;
      transition: color 0.3s ease;
    }
    a:hover {
      color: #ffffff;
    }
    @media (max-width: 480px) {
      h1 {
        font-size: 38px;
        word-spacing: 15px;
      }
      body::before {
        background-size: cover;
        opacity: 0.4;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>BATTLE DOCK</h1>
    <div class="sub">LA Simulation de Docker</div>
    <div class="buttons">
      <button class="button" onclick="openModal('login-modal')">Connexion</button>  
      <button class="button" onclick="openModal('signup-modal')">Inscription</button>
    </div>
    <div class="version">Version 0.4.3 - by Eliasse</div>
  </div>

  <div id="signup-modal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('signup-modal')">&times;</span>
      <h2>Inscription</h2>
      <form id="signup-form">
        <input type="text" id="signup-username" placeholder="Nom d'utilisateur" required>
        <input type="password" id="signup-password" placeholder="Mot de passe" required>
        <button type="submit">S'inscrire</button>
      </form>
    </div>
  </div>

  <div id="login-modal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('login-modal')">&times;</span>
      <h2>Connexion</h2>
      <form id="login-form">
        <input type="text" id="login-username" placeholder="Nom d'utilisateur" required>
        <input type="password" id="login-password" placeholder="Mot de passe" required>
        <button type="submit">Se connecter</button>
      </form>
      <p style="text-align: center; margin-top: 15px;"><a href="#" onclick="closeModal('login-modal'); openModal('forgot-password-modal')">Mot de passe oublié ?</a></p>
    </div>
  </div>

  <div id="forgot-password-modal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('forgot-password-modal')">&times;</span>
      <h2>Mot de passe oublié</h2>
      <form id="forgot-password-form">
        <input type="text" id="forgot-password-username" placeholder="Nom d'utilisateur" required>
        <button type="submit">Réinitialiser le mot de passe</button>
      </form>
    </div>
  </div>

  <div id="reset-password-modal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('reset-password-modal')">&times;</span>
      <h2>Réinitialiser le mot de passe</h2>
      <form id="reset-password-form">
        <input type="text" id="reset-password-username" placeholder="Nom d'utilisateur" required>
        <input type="password" id="reset-password-new-password" placeholder="Nouveau mot de passe" required>
        <input type="password" id="reset-password-confirm-password" placeholder="Confirmez le mot de passe" required>
        <button type="submit">Réinitialiser le mot de passe</button>
      </form>
    </div>
  </div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const supabaseClient = createClient(supabaseUrl, supabaseKey);

    function openModal(modalId) {
      document.getElementById(modalId).style.display = "block";
      document.body.style.overflow = "hidden";
    }

    function closeModal(modalId) {
      document.getElementById(modalId).style.display = "none";
      document.body.style.overflow = "auto";
    }

    document.getElementById('signup-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const username = document.getElementById('signup-username').value;
      const password = document.getElementById('signup-password').value;

      console.log('🚀 Début inscription pour:', username);

      try {
        const { data: { user }, error } = await supabaseClient.auth.signUp({
          email: `${username}@battledock.com`,
          password: password,
        });

        if (error) {
          console.error('❌ Erreur Auth:', error);
          alert('Erreur lors de l\'inscription : ' + error.message);
          return;
        }

        console.log('✅ Auth créée, user_id:', user.id);

        // Créer le profil
        const { data: profileData, error: profileError } = await supabaseClient
          .from('profiles')
          .insert({ user_id: user.id, username: username })
          .select();

        if (profileError) {
          console.error('❌ Erreur profil:', profileError);
          alert('Erreur profil : ' + profileError.message);
          return;
        }

        console.log('✅ Profil créé:', profileData);

        // Créer game_progress avec 100€ de départ
        const { data: progressData, error: progressError } = await supabaseClient
          .from('game_progress')
          .insert({ 
            user_id: user.id,
            level: 1,
            score: 0,
            rank: 'Docker Occasionnel',
            money: 100,
            energy: 50,
            energy_max: 50,
            xp: 0
          })
          .select();

        if (progressError) {
          console.error('❌ Erreur game_progress:', progressError);
          alert('Erreur progression : ' + progressError.message);
          return;
        }

        console.log('✅ Game progress créé:', progressData);

        // Créer leaderboard avec 100€
        const { data: leaderboardData, error: leaderboardError } = await supabaseClient
          .from('leaderboard')
          .insert({ user_id: user.id, score: 100 })
          .select();

        if (leaderboardError) {
          console.error('❌ Erreur leaderboard:', leaderboardError);
          alert('Erreur classement : ' + leaderboardError.message);
          return;
        }

        console.log('✅ Leaderboard créé:', leaderboardData);
        console.log('🎉 Inscription complète !');

        closeModal('signup-modal');
        openModal('login-modal');

      } catch (err) {
        console.error('❌ Erreur globale:', err);
        alert('Erreur inattendue : ' + err.message);
      }
    });

    document.getElementById('login-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const username = document.getElementById('login-username').value;
      const password = document.getElementById('login-password').value;

      console.log('🔐 Tentative connexion:', username);

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: `${username}@battledock.com`,
          password: password,
        });

        if (error) {
          console.error('❌ Erreur connexion:', error);
          alert('Erreur lors de la connexion : ' + error.message);
          return;
        }

        console.log('✅ Connexion réussie, user_id:', data.user.id);

        localStorage.setItem('userId', data.user.id);
        localStorage.setItem('username', username);
        
        // Vérifier et créer game_progress si manquant
        const { data: progressArray } = await supabaseClient
          .from('game_progress')
          .select('*')
          .eq('user_id', data.user.id);

        if (!progressArray || progressArray.length === 0) {
          console.log('⚠️ Game progress manquant, création...');
          await supabaseClient
            .from('game_progress')
            .insert({ 
              user_id: data.user.id,
              level: 1,
              score: 0,
              rank: 'Docker Occasionnel',
              money: 100,
              energy: 50,
              energy_max: 50,
              xp: 0
            });
          console.log('✅ Game progress créé');
        }
        
        // Vérifier et créer leaderboard si manquant
        const { data: scoreArray } = await supabaseClient
          .from('leaderboard')
          .select('*')
          .eq('user_id', data.user.id);
        
        if (!scoreArray || scoreArray.length === 0) {
          console.log('⚠️ Leaderboard manquant, création...');
          await supabaseClient
            .from('leaderboard')
            .insert({ user_id: data.user.id, score: 100 });
          console.log('✅ Leaderboard créé');
        }

        console.log('🎮 Redirection vers le jeu...');
        window.location.href = 'game.html';

      } catch (err) {
        console.error('❌ Erreur globale:', err);
        alert('Erreur inattendue : ' + err.message);
      }
    });

    document.getElementById('forgot-password-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const username = document.getElementById('forgot-password-username').value;

      const { data: users, error } = await supabaseClient
        .from('profiles')
        .select('user_id')
        .eq('username', username);

      if (error || users.length === 0) {
        alert('Nom d\'utilisateur non trouvé.');
      } else {
        alert('Un e-mail de réinitialisation de mot de passe a été envoyé à votre adresse e-mail.');
        closeModal('forgot-password-modal');
        openModal('reset-password-modal');
      }
    });

    document.getElementById('reset-password-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const username = document.getElementById('reset-password-username').value;
      const newPassword = document.getElementById('reset-password-new-password').value;
      const confirmPassword = document.getElementById('reset-password-confirm-password').value;

      if (newPassword !== confirmPassword) {
        alert('Les mots de passe ne correspondent pas.');
        return;
      }

      const { data: users, error: userError } = await supabaseClient
        .from('profiles')
        .select('user_id')
        .eq('username', username);

      if (userError || users.length === 0) {
        alert('Nom d\'utilisateur non trouvé.');
      } else {
        const userId = users[0].user_id;

        const { data, error } = await supabaseClient.auth.admin.updateUserById(
          userId,
          { password: newPassword }
        );

        if (error) {
          alert('Erreur lors de la réinitialisation du mot de passe : ' + error.message);
        } else {
          alert('Mot de passe réinitialisé avec succès !');
          closeModal('reset-password-modal');
          openModal('login-modal');
        }
      }
    });
  </script>
</body>
</html>
