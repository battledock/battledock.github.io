<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Battle Dock — LE JEU</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#7f1d1d">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
input{-webkit-user-select:text;user-select:text;}

:root{
  --card:#fffdf7;
  --ink:#1a1a1a;
  --gold:#e17f00;
  --gold-light:#fbbf24;
  --border-w:3px;
  --radius:14px;
  --shadow:5px 5px 0 #1a1a1a;
}

body{
  font-family:'Inter',sans-serif;
  background:linear-gradient(135deg,#7f1d1d,#991b1b,#b91c1c);
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:16px;
}

/* ── HEADER ── */
.logo{
  text-align:center;margin-bottom:20px;
}
.logo-title{
  font-family:'Bangers',cursive;
  font-size:clamp(3rem,12vw,4.5rem);
  color:#fff;letter-spacing:4px;line-height:.9;
}
.logo-sub{
  font-size:11px;color:var(--gold-light);font-weight:700;
  letter-spacing:3px;margin-top:4px;
}

/* ── CARD ── */
.login-card{
  width:100%;max-width:400px;
  background:var(--card);
  border:var(--border-w) solid var(--ink);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
}

/* ── TABS ── */
.tabs{display:flex;border-bottom:var(--border-w) solid var(--ink);}
.tab{
  flex:1;
  background:var(--card);
  border:none;
  font-family:'Bangers',cursive;font-size:16px;
  letter-spacing:1.5px;color:#9ca3af;
  padding:14px 8px;cursor:pointer;
  transition:all .15s;
}
.tab:first-child{border-right:var(--border-w) solid var(--ink);}
.tab.active{
  background:var(--ink);color:var(--gold-light);
}

/* ── FORM ── */
.form-wrap{padding:20px;}
.form-section{display:none;}
.form-section.active{display:flex;flex-direction:column;gap:14px;animation:fadeUp .3s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.field-label{
  font-size:12px;font-weight:700;color:var(--ink);
  letter-spacing:.5px;margin-bottom:5px;display:block;
}
.field-input{
  width:100%;padding:12px 14px;
  font-family:'Inter',sans-serif;font-size:15px;color:var(--ink);
  background:#fff;
  border:2px solid #d4c9a8;border-radius:10px;
  transition:border-color .2s;
}
.field-input:focus{
  outline:none;border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(225,127,0,.1);
}
.field-input::placeholder{color:#c4b896;}

.btn-submit{
  width:100%;padding:14px;
  font-family:'Bangers',cursive;font-size:18px;letter-spacing:2px;
  color:var(--ink);
  background:linear-gradient(180deg,var(--gold-light),#f59e0b);
  border:var(--border-w) solid var(--ink);
  border-radius:10px;
  box-shadow:3px 3px 0 var(--ink);
  cursor:pointer;
  transition:transform .1s,box-shadow .1s;
  margin-top:4px;
}
.btn-submit:active{
  transform:translate(2px,2px);
  box-shadow:1px 1px 0 var(--ink);
}
.btn-submit:disabled{opacity:.5;cursor:not-allowed;}

/* ── FOOTER ── */
.footer{
  margin-top:16px;font-size:8px;color:rgba(255,255,255,.4);
  text-align:center;letter-spacing:.5px;line-height:1.4;
  max-width:400px;
}

/* ── ERROR POPUP ── */
.overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.6);z-index:999;
}
.overlay.show{display:block;}
.popup{
  display:none;position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%);
  background:var(--card);
  border:var(--border-w) solid var(--ink);
  border-radius:16px;box-shadow:6px 6px 0 var(--ink);
  padding:28px 24px;z-index:1000;
  width:85%;max-width:340px;text-align:center;
}
.popup.show{display:block;animation:popIn .3s ease;}
@keyframes popIn{from{opacity:0;transform:translate(-50%,-50%) scale(.85)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.popup-title{
  font-family:'Bangers',cursive;font-size:26px;
  color:#dc2626;letter-spacing:2px;margin-bottom:10px;
}
.popup-msg{
  font-size:13px;color:var(--ink);line-height:1.6;
  margin-bottom:20px;font-weight:500;
}
.popup-btn{
  font-family:'Bangers',cursive;font-size:16px;letter-spacing:1px;
  padding:10px 28px;
  background:var(--gold-light);color:var(--ink);
  border:var(--border-w) solid var(--ink);
  border-radius:10px;box-shadow:3px 3px 0 var(--ink);
  cursor:pointer;
}
.popup-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}
</style>
</head>
<body>

<div class="logo">
  <div class="logo-title">BATTLE DOCK</div>
  <div class="logo-sub">⚓ Le simulateur de docker</div>
</div>

<div class="login-card">
  <div class="tabs">
    <button class="tab active" id="tabLogin" onclick="swapTab('login')">CONNEXION</button>
    <button class="tab" id="tabSignup" onclick="swapTab('signup')">INSCRIPTION</button>
  </div>
  <div class="form-wrap">
    <!-- CONNEXION -->
    <form class="form-section active" id="secLogin" onsubmit="handleLogin(event)">
      <div>
        <label class="field-label">👤 Pseudo</label>
        <input type="text" class="field-input" id="loginUser" placeholder="Ton pseudo" required autocomplete="username">
      </div>
      <div>
        <label class="field-label">🔑 Mot de passe</label>
        <input type="password" class="field-input" id="loginPass" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-submit" id="loginBtn">SE CONNECTER</button>
    </form>
    <!-- INSCRIPTION -->
    <form class="form-section" id="secSignup" onsubmit="handleSignup(event)">
      <div>
        <label class="field-label">👤 Choisis un pseudo</label>
        <input type="text" class="field-input" id="signupUser" placeholder="3-20 caractères, lettres/chiffres" required autocomplete="username">
      </div>
      <div>
        <label class="field-label">🔒 Mot de passe</label>
        <input type="password" class="field-input" id="signupPass" placeholder="Minimum 6 caractères" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn-submit" id="signupBtn">S'INSCRIRE</button>
    </form>
  </div>
</div>

<div class="footer">Battle Dock est une œuvre de fiction et de divertissement.<br>Tous les éléments sont purement imaginaires.</div>

<!-- Error popup -->
<div class="overlay" id="overlay" onclick="closePopup()"></div>
<div class="popup" id="popup">
  <div class="popup-title">ERREUR</div>
  <div class="popup-msg" id="popupMsg"></div>
  <button class="popup-btn" onclick="closePopup()">OK</button>
</div>

<script>
const supabaseUrl='https://drtsuhnbclhmgfjiykap.supabase.co';
const supabaseKey='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
const sb=supabase.createClient(supabaseUrl,supabaseKey);

// Si déjà connecté → game.html
sb.auth.getSession().then(({data:{session}})=>{
  if(session) location.href='game.html';
});

// ── Tabs ──
function swapTab(t){
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.form-section').forEach(s=>s.classList.remove('active'));
  if(t==='login'){
    document.getElementById('tabLogin').classList.add('active');
    document.getElementById('secLogin').classList.add('active');
  } else {
    document.getElementById('tabSignup').classList.add('active');
    document.getElementById('secSignup').classList.add('active');
  }
}

// ── Popup ──
function showPopup(msg){
  document.getElementById('popupMsg').textContent=msg;
  document.getElementById('popup').classList.add('show');
  document.getElementById('overlay').classList.add('show');
}
function closePopup(){
  document.getElementById('popup').classList.remove('show');
  document.getElementById('overlay').classList.remove('show');
}

// ── Validation pseudo ──
function validatePseudo(pseudo){
  if(pseudo.length<3) return 'Pseudo trop court (min 3 caractères)';
  if(pseudo.length>20) return 'Pseudo trop long (max 20 caractères)';
  if(!/^[a-zA-Z0-9._-]+$/.test(pseudo)) return 'Pseudo invalide (lettres, chiffres, . - _ uniquement)';
  return null;
}

// ── Connexion ──
async function handleLogin(e){
  e.preventDefault();
  const user=document.getElementById('loginUser').value.trim();
  const pass=document.getElementById('loginPass').value;
  if(!user||!pass){showPopup('Remplis tous les champs !');return;}

  const btn=document.getElementById('loginBtn');
  btn.textContent='CONNEXION...';btn.disabled=true;

  try{
    const email=user.toLowerCase()+'@battledock.local';
    const{error}=await sb.auth.signInWithPassword({email,password:pass});
    if(error){
      showPopup('Pseudo ou mot de passe incorrect !');
      btn.textContent='SE CONNECTER';btn.disabled=false;
      return;
    }
    location.href='game.html';
  }catch(err){
    showPopup('Erreur : '+err.message);
    btn.textContent='SE CONNECTER';btn.disabled=false;
  }
}

// ── Inscription ──
async function handleSignup(e){
  e.preventDefault();
  const user=document.getElementById('signupUser').value.trim();
  const pass=document.getElementById('signupPass').value;

  if(!user||!pass){showPopup('Remplis tous les champs !');return;}
  const pseudoErr=validatePseudo(user);
  if(pseudoErr){showPopup(pseudoErr);return;}
  if(pass.length<6){showPopup('Minimum 6 caractères pour le mot de passe !');return;}

  const btn=document.getElementById('signupBtn');
  btn.textContent='INSCRIPTION...';btn.disabled=true;

  try{
    // Vérifier si pseudo pris (case-insensitive)
    const userLower=user.toLowerCase();
    const{data:allProfiles}=await sb.from('profiles').select('username');
    const taken=allProfiles&&allProfiles.some(p=>p.username.toLowerCase()===userLower);
    if(taken){
      showPopup('Ce pseudo est déjà pris !');
      btn.textContent="S'INSCRIRE";btn.disabled=false;
      return;
    }

    // Créer le compte auth
    const email=userLower+'@battledock.local';
    const{data:authData,error:authErr}=await sb.auth.signUp({
      email,password:pass,
      options:{data:{username:user}}
    });
    if(authErr) throw authErr;
    if(!authData||!authData.user){
      throw new Error('Inscription échouée — réessaye.');
    }

    const uid=authData.user.id;
    await new Promise(r=>setTimeout(r,500));

    // Créer profiles
    const{error:profErr}=await sb.from('profiles').upsert({
      user_id:uid,
      username:user,
      avatar_url:'avatar-default.png',
      background_color:'bleu_mer',
      skin_container:'red',
      unlocked_covers:['rouge_navy','bleu_mer'],
      trophies:0
    },{onConflict:'user_id'});
    if(profErr) throw profErr;

    // Créer game_stats
    const{error:statsErr}=await sb.from('game_stats').upsert({
      user_id:uid,
      money:1000,
      level:1,
      xp:0,
      diamonds:20,
      grade:'Docker Occasionnel',
      last_level_rewarded:1,
      last_levelup_shown:1,
      streak_days:0,
      trophies:0
    },{onConflict:'user_id'});
    if(statsErr) throw statsErr;

    btn.textContent='✅ BIENVENUE !';
    setTimeout(()=>{location.href='game.html';},800);

  }catch(err){
    showPopup('Erreur : '+err.message);
    btn.textContent="S'INSCRIRE";btn.disabled=false;
  }
}

// PWA
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
