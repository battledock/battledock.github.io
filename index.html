<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Battle Dock — LE JEU</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Permanent+Marker&family=Space+Grotesk:wght@500;700;900&family=Bungee&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  
  <style>
    :root {
      --port-dark: #0f172a;
      --port-blue: #2563eb;
      --port-light-blue: #38bdf8;
      --comic-yellow: #facc15;
      --comic-red: #ef4444;
      --comic-green: #22c55e;
      --border-thick: 4px solid #000000;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: linear-gradient(135deg, #7f1d1d 0%, #991b1b 50%, #dc2626 100%);
      transition: background 0.5s ease;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
    }

    .header-container {
      text-align: center;
      width: 100%;
      max-width: 380px;
    }

    .main-title {
      font-family: 'Bangers', cursive;
      font-size: clamp(2.8rem, 11vw, 4.5rem);
      color: var(--comic-yellow);
      letter-spacing: 4px;
      text-shadow: 6px 6px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000;
      line-height: 0.9;
      margin-bottom: 6px;
      display: inline-block;
    }

    .subtitle {
      font-family: 'Permanent Marker', cursive;
      font-size: clamp(0.8rem, 2.3vw, 0.9rem);
      color: #ffffff;
      text-shadow: 3px 3px 0px var(--port-dark);
    }

    .dock-container {
      width: 100%;
      max-width: 380px;
      background: #e2e8f0;
      border: var(--border-thick);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      margin: 20px 0;
    }

    .tabs-wrapper {
      display: flex;
      background: var(--port-dark);
      border-bottom: var(--border-thick);
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      font-family: 'Bungee', sans-serif;
      font-size: 13px;
      color: #94a3b8;
      padding: 16px 8px;
      cursor: pointer;
      text-align: center;
    }

    .tab-btn:first-child { border-right: var(--border-thick); }
    .tab-btn.active { color: #ffffff; }
    #tabHome.active { background: #3b82f6; }
    #tabScores.active { background: #ef4444; }

    .form-content {
      background: #f3f4f6;
      padding: 20px 22px;
    }

    .form-section { display: none; }
    .form-section.active { display: block; }

    .input-group { margin-bottom: 14px; }
    .input-group label {
      display: block;
      font-weight: 900;
      font-size: 13px;
      color: var(--port-dark);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .custom-field {
      width: 100%;
      padding: 12px 14px;
      font-weight: 700;
      font-size: 15px;
      color: var(--port-dark);
      background: #ffffff;
      border: 4px solid #000000;
      border-radius: 10px;
      box-shadow: 4px 4px 0px #000000;
    }

    .submit-lever-btn {
      color: white;
      border: 4px solid #000000;
      border-radius: 12px;
      padding: 13px 26px;
      font-family: 'Bungee', sans-serif;
      font-size: 14px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 4px 4px 0px #000000;
      width: 100%;
      margin-top: 12px;
    }

    #login-submit { background: var(--comic-red); }
    #register-submit { background: var(--port-blue); }

    .footer-stamp {
      font-size: 9px;
      color: #ffffff;
      text-align: center;
      max-width: 380px;
    }

    .error-popup {
      display: none;
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: #e2e8f0;
      border: 4px solid #000000;
      border-radius: 20px;
      padding: 24px;
      max-width: 320px; width: 90%;
      box-shadow: 8px 8px 0px #000000;
      z-index: 1000;
    }
    .error-popup.show { display: block; }
    .error-popup-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 999;
    }
    .error-popup-overlay.show { display: block; }
    .error-popup-title {
      font-family: 'Bangers', cursive;
      font-size: 26px; color: var(--comic-red);
      margin-bottom: 8px;
    }
    .error-popup-message {
      font-size: 14px; color: var(--port-dark);
      margin-bottom: 16px; font-weight: 600;
    }
    .error-popup-btn {
      background: var(--comic-red); color: white;
      border: 3px solid #000; border-radius: 10px;
      padding: 10px; font-family: 'Bungee', sans-serif;
      width: 100%; cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header-container">
    <div class="main-title">BATTLE DOCK</div><br>
    <div class="subtitle">LE simulateur de docker !</div>
  </div>

  <div class="dock-container">
    <div class="tabs-wrapper">
      <button class="tab-btn active" id="tabHome" onclick="swapTab('home')">CONNEXION</button>
      <button class="tab-btn" id="tabScores" onclick="swapTab('scores')">INSCRIPTION</button>
    </div>

    <div class="form-content">
      <div class="form-section active" id="secHome">
        <form id="login-form">
          <div class="input-group">
            <label>👤 Pseudo</label>
            <input type="text" class="custom-field" id="login-username" required>
          </div>
          <div class="input-group">
            <label>🔑 Code Secret</label>
            <input type="password" class="custom-field" id="login-password" required>
          </div>
          <button type="submit" class="submit-lever-btn" id="login-submit">SE CONNECTER</button>
        </form>
      </div>

      <div class="form-section" id="secScores">
        <form id="register-form">
          <div class="input-group">
            <label>👤 Ton Pseudo</label>
            <input type="text" class="custom-field" id="reg-username" required>
          </div>
          <div class="input-group">
            <label>🔒 Mot de passe</label>
            <input type="password" class="custom-field" id="reg-password" required>
          </div>
          <button type="submit" class="submit-lever-btn" id="register-submit">S'INSCRIRE ET JOUER</button>
        </form>
      </div>
    </div>
  </div>

  <div class="footer-stamp">Battle Dock — Œuvre de divertissement fictive.</div>

  <div class="error-popup-overlay" id="errorOverlay"></div>
  <div class="error-popup" id="errorPopup">
    <div class="error-popup-title">ALERTE DU QUAI</div>
    <div class="error-popup-message" id="errorMessage"></div>
    <button class="error-popup-btn" onclick="closeErrorPopup()">OK</button>
  </div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    if (localStorage.getItem('userId')) { window.location.href = 'game.html'; }

    function showErrorPopup(msg) {
      document.getElementById('errorMessage').textContent = msg;
      document.getElementById('errorPopup').classList.add('show');
      document.getElementById('errorOverlay').classList.add('show');
    }

    function closeErrorPopup() {
      document.getElementById('errorPopup').classList.remove('show');
      document.getElementById('errorOverlay').classList.remove('show');
    }

    document.getElementById('errorOverlay').addEventListener('click', closeErrorPopup);

    function swapTab(target) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
      document.getElementById('tab' + target.charAt(0).toUpperCase() + target.slice(1)).classList.add('active');
      document.getElementById('sec' + target.charAt(0).toUpperCase() + target.slice(1)).classList.add('active');
      document.body.style.background = target === 'home' ? 'linear-gradient(135deg, #7f1d1d 0%, #991b1b 50%, #dc2626 100%)' : 'linear-gradient(135deg, #1e3a8a 0%, #1e40af 50%, #3b82f6 100%)';
    }

    // LISTE DES COULEURS ÉLECTRIQUES ALÉATOIRES POUR LE FOND DU BADGE
    const quantumColors = ['#FF0055', '#00FF99', '#00E5FF', '#BF55EC', '#FF00AA', '#3A4750', '#D4AF37', '#222831', '#FF9900', '#FF5500'];
    const defaultAvatar = 'notionists-1779298466584.png'; // Ton avatar de base

    // INSCRIPTION ULTRA COMPACTE (INCLUS AVATAR + COULEUR DE FOND ALÉATOIRE)
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('reg-username').value.trim();
      const password = document.getElementById('reg-password').value;

      try {
        const { data: exist } = await supabaseClient.from('users').select('username').eq('username', username);
        if (exist && exist.length > 0) {
          showErrorPopup("Ce pseudo de docker est déjà réservé !");
          return;
        }

        // Choix d'une couleur au hasard
        const randomColor = quantumColors[Math.floor(Math.random() * quantumColors.length)];

        // Insertion dans la table principale
        const { data: newUser, error: uErr } = await supabaseClient
          .from('users')
          .insert([{ username, password, avatar: defaultAvatar, bg_color: randomColor }])
          .select();

        if (uErr) { showErrorPopup("Erreur SQL inscription : " + uErr.message); return; }

        const uId = newUser[0].id;

        // Création des progressions
        await supabaseClient.from('game_progress').insert([{ user_id: uId, level: 1, score: 0, rank: 'Docker Occasionnel', money: 100, energy: 50, energy_max: 50, xp: 0 }]);
        await supabaseClient.from('leaderboard').insert([{ user_id: uId, score: 100 }]);

        // Sauvegarde de la session courante en local
        localStorage.setItem('userId', uId);
        localStorage.setItem('username', username);
        localStorage.setItem('userAvatar', defaultAvatar);
        localStorage.setItem('userBg', randomColor);

        // Direction immédiate vers le jeu !
        window.location.href = 'game.html';
      } catch (err) {
        showErrorPopup(err.message);
      }
    });

    // CONNEXION DIRECTE
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;

      try {
        const { data: user, error } = await supabaseClient
          .from('users')
          .select('*')
          .eq('username', username)
          .eq('password', password);

        if (error || !user || user.length === 0) {
          showErrorPopup("Pseudo ou Code Secret incorrect !");
          return;
        }

        // Récupération et écriture locale des données enregistrées en base
        localStorage.setItem('userId', user[0].id);
        localStorage.setItem('username', user[0].username);
        localStorage.setItem('userAvatar', user[0].avatar);
        localStorage.setItem('userBg', user[0].bg_color);

        window.location.href = 'game.html';
      } catch (err) {
        showErrorPopup(err.message);
      }
    });
  </script>
</body>
</html>
