<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Battle Dock — Recrutement des Quais</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers=family=Boogaloo&family=Permanent+Marker&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    :root {
      --bg-comic: #111827;
      --border-thick: 4px solid #000;
      --border-thin: 2px solid #000;
      --panel-bg: #fffbf0; /* Même papier jauni rétro que creer-badge */
      --accent-yellow: #fde047;
      --accent-red: #ef4444;
      --accent-blue: #3b82f6;
      --text: #000;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background-color: var(--bg-comic);
      background-image: radial-gradient(#374151 1px, transparent 1px);
      background-size: 16px 16px;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    /* Boîtier style Planche de BD */
    .comic-box {
      width: 100%;
      max-width: 450px;
      background: #000;
      padding: 10px;
      border-radius: 16px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Titre Explosion style Comics */
    .comic-title-panel {
      background: var(--accent-yellow);
      border: var(--border-thick);
      padding: 16px 10px;
      text-align: center;
      transform: rotate(-2deg);
      box-shadow: 5px 5px 0 rgba(0,0,0,0.2);
      position: relative;
    }

    .comic-title-panel h1 {
      font-family: 'Bangers', cursive;
      font-size: 36px;
      letter-spacing: 3px;
      line-height: 1;
      text-transform: uppercase;
      -webkit-text-stroke: 1px #000;
    }

    .comic-title-panel p {
      font-family: 'Permanent Marker', cursive;
      font-size: 14px;
      color: var(--accent-red);
      margin-top: 6px;
    }

    /* Bulle de dialogue d'état (Connexion / Inscription) */
    .state-badge {
      position: absolute;
      top: -14px;
      left: 20px;
      background: var(--accent-red);
      color: white;
      padding: 2px 16px;
      font-family: 'Bangers', cursive;
      font-size: 16px;
      border: var(--border-thin);
      border-radius: 20px;
      letter-spacing: 1px;
      box-shadow: 3px 3px 0 #000;
      z-index: 10;
    }

    /* Case du formulaire principal */
    .comic-panel {
      background: var(--panel-bg);
      border: var(--border-thick);
      padding: 30px 20px 20px 20px;
      position: relative;
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    .comic-panel.active {
      display: flex;
    }

    /* Groupes d'inputs */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-family: 'Boogaloo', cursive;
      font-size: 18px;
      letter-spacing: 0.5px;
    }

    .comic-input {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      border: var(--border-thin);
      border-radius: 8px;
      background: #fff;
      box-shadow: inset 2px 2px 5px rgba(0,0,0,0.05);
      outline: none;
    }

    .comic-input:focus {
      border-color: var(--accent-blue);
      background: #f0fdfa;
    }

    /* Message d'erreur BD */
    .error-bubble {
      display: none;
      background: #fee2e2;
      border: var(--border-thin);
      color: var(--accent-red);
      padding: 10px;
      border-radius: 8px;
      font-family: 'Boogaloo', cursive;
      font-size: 15px;
      text-align: center;
      animation: shake 0.3s;
    }

    /* Gros boutons d'action */
    .comic-btn {
      width: 100%;
      padding: 14px;
      background: var(--accent-blue);
      color: white;
      border: var(--border-thick);
      font-family: 'Bangers', cursive;
      font-size: 20px;
      letter-spacing: 1.5px;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 5px 0 #000;
      transition: all 0.1s ease;
      margin-top: 5px;
    }

    .comic-btn:active {
      transform: translateY(5px);
      box-shadow: none;
    }

    .comic-btn.btn-register {
      background: #10b981; /* Vert dynamique */
    }

    /* Zone de bascule en bas de case */
    .switch-zone {
      text-align: center;
      font-family: 'Boogaloo', cursive;
      font-size: 16px;
      color: #4b5563;
      margin-top: 4px;
    }

    .switch-link {
      color: var(--accent-blue);
      text-decoration: underline;
      cursor: pointer;
      font-weight: bold;
    }

    .switch-link:hover {
      color: #1d4ed8;
    }

    /* Animation Secousse pour les erreurs */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
  </style>
</head>
<body>

  <div class="comic-box">
    
    <div class="comic-title-panel">
      <h1>BATTLE DOCK</h1>
      <p>Hissez vos couleurs sur les quais !</p>
    </div>

    <div class="comic-panel active" id="loginForm">
      <div class="state-badge">IDENTIFICATION</div>
      
      <div class="error-bubble" id="loginError"></div>

      <div class="form-group">
        <label>E-mail Matricule :</label>
        <input type="email" id="loginEmail" class="comic-input" placeholder="ex: docker@marseille.fr">
      </div>

      <div class="form-group">
        <label>Clé Secrète (Mot de passe) :</label>
        <input type="password" id="loginPassword" class="comic-input" placeholder="••••••••">
      </div>

      <button class="comic-btn" onclick="login()">SE CONNECTER !</button>

      <div class="switch-zone">
        Pas encore inscrit sur le registre ? 
        <span class="switch-link" onclick="toggleForm('signup')">Créer un dossier</span>
      </div>
    </div>

    <div class="comic-panel" id="signupForm">
      <div class="state-badge">ENRÔLEMENT</div>
      
      <div class="error-bubble" id="signupError"></div>

      <div class="form-group">
        <label>Surnom sur les quais (Username) :</label>
        <input type="text" id="signupUsername" class="comic-input" placeholder="ex: Gégé_Les_Gros_Bras" maxlength="20">
      </div>

      <div class="form-group">
        <label>E-mail de contact :</label>
        <input type="email" id="signupEmail" class="comic-input" placeholder="nom@exemple.com">
      </div>

      <div class="form-group">
        <label>Créer un mot de passe :</label>
        <input type="password" id="signupPassword" class="comic-input" placeholder="Minimum 6 caractères">
      </div>

      <button class="comic-btn btn-register" onclick="signup()">S'INSCRIRE AU PORT →</button>

      <div class="switch-zone">
        Déjà inscrit au syndicat ? 
        <span class="switch-link" onclick="toggleForm('login')">Se connecter</span>
      </div>
    </div>

  </div>

  <script>
    // Configuration Supabase
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const supabaseClient = createClient(supabaseUrl, supabaseKey);

    // Navigation entre formulaires
    function toggleForm(formType) {
      hideErrors();
      if (formType === 'signup') {
        document.getElementById('loginForm').classList.remove('active');
        document.getElementById('signupForm').classList.add('active');
      } else {
        document.getElementById('signupForm').classList.remove('active');
        document.getElementById('loginForm').classList.add('active');
      }
    }

    function showError(formId, message) {
      const errDiv = document.getElementById(formId);
      errDiv.textContent = message;
      errDiv.style.display = 'block';
    }

    function hideErrors() {
      document.getElementById('loginError').style.display = 'none';
      document.getElementById('signupError').style.display = 'none';
    }

    // --- LOGIQUE CONNEXION ---
    async function login() {
      hideErrors();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!email || !password) {
        showError('loginError', '⚠️ Remplis toutes les cases, feignant !');
        return;
      }

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;

        // Récupérer le pseudo stocké
        const { data: profile } = await supabaseClient
          .from('profiles')
          .select('username')
          .eq('user_id', data.user.id)
          .single();

        localStorage.setItem('userId', data.user.id);
        if (profile) localStorage.setItem('username', profile.username);

        window.location.href = 'creer-badge.html';
      } catch (err) {
        console.error(err);
        showError('loginError', '❌ Accès refusé : ' + err.message);
      }
    }

    // --- LOGIQUE INSCRIPTION ---
    async function signup() {
      hideErrors();
      const username = document.getElementById('signupUsername').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const password = document.getElementById('signupPassword').value;

      if (!username || !email || !password) {
        showError('signupError', '⚠️ Le registre exige toutes les informations !');
        return;
      }

      if (password.length < 6) {
        showError('signupError', '⚠️ Le mot de passe doit faire au moins 6 caractères !');
        return;
      }

      try {
        // 1. Auth Supabase
        const { data: authData, error: authError } = await supabaseClient.auth.signUp({ email, password });
        if (authError) throw authError;

        const userId = authData.user.id;

        // 2. Profil joueur
        await supabaseClient.from('profiles').insert([{
          user_id: userId,
          username: username,
          email: email
        }]);

        // 3. Progression initiale
        await supabaseClient.from('game_progress').insert([{
          user_id: userId,
          level: 1,
          score: 0,
          rank: 'Docker Occasionnel',
          money: 100,
          energy: 50,
          energy_max: 50,
          xp: 0
        }]);

        // 4. Leaderboard d'accueil
        await supabaseClient.from('leaderboard').insert([{
          user_id: userId,
          score: 100
        }]);

        localStorage.setItem('userId', userId);
        localStorage.setItem('username', username);
        
        // Direction la visite médicale BD !
        window.location.href = 'creer-badge.html';
      } catch (err) {
        console.error(err);
        showError('signupError', '❌ Erreur d\'enrôlement : ' + err.message);
      }
    }

    // Touche Entrée pour valider rapidement
    document.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        if (document.getElementById('loginForm').classList.contains('active')) {
          login();
        } else {
          signup();
        }
      }
    });

    // Auto-redirection si déjà connecté
    const checkUser = localStorage.getItem('userId');
    if (checkUser) {
      window.location.href = 'creer-badge.html';
    }
  </script>
</body>
</html>
