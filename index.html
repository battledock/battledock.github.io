<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BattleDock 2</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:'Inter',sans-serif;overflow-x:hidden}
body{background:linear-gradient(168deg,#221a3e 0%,#4a2a6e 26%,#a4436e 52%,#e8734e 74%,#ffb45c 100%);
  background-attachment:fixed}
.soir{position:fixed;inset:0;z-index:0;pointer-events:none}
.soir .nu{position:absolute;height:9px;border-radius:99px;background:rgba(60,30,80,.35);filter:blur(2px);
  animation:nu-d 60s linear infinite}
@keyframes nu-d{from{transform:translateX(-140px)}to{transform:translateX(120vw)}}
.soir .et{position:absolute;width:2.4px;height:2.4px;border-radius:50%;background:#fff;
  animation:scin 3.4s ease-in-out infinite}
@keyframes scin{50%{opacity:.15}}

/* === INTRO — la cinématique === */
.intro{position:fixed;inset:0;height:100dvh;z-index:1000;cursor:pointer;overflow:hidden;
  transition:opacity 1s ease}
.intro.hide{opacity:0;pointer-events:none}
.ciel-nuit{position:absolute;inset:0;
  background:linear-gradient(180deg,#0a0820 0%,#161234 55%,#241a44 100%)}
.ciel-soir{position:absolute;inset:0;opacity:0;transition:opacity 3.2s ease;
  background:linear-gradient(168deg,#221a3e 0%,#4a2a6e 26%,#a4436e 52%,#e8734e 74%,#ffb45c 100%)}
.j .ciel-soir{opacity:1}
.etoiles-c{position:absolute;inset:0;transition:opacity 3s ease}
.j .etoiles-c{opacity:.35}
.etoiles-c i{position:absolute;width:2.2px;height:2.2px;border-radius:50%;background:#fff;
  animation:scin 3.2s ease-in-out infinite}
.mer-c{position:absolute;left:0;right:0;bottom:0;height:14%;
  background:linear-gradient(180deg,rgba(20,12,40,.55),rgba(10,8,26,.8))}
.horizon-c{position:absolute;left:0;right:0;bottom:14%;height:1.5px;
  background:linear-gradient(90deg,transparent,rgba(255,220,160,.6),transparent);
  opacity:0;transition:opacity 1.8s .8s ease}
.j .horizon-c{opacity:1}
.bateau-c{position:absolute;bottom:13.2%;left:-16%;opacity:0}
.j .bateau-c{animation:traverse 7s 1.1s cubic-bezier(.3,0,.6,1) forwards}
@keyframes traverse{0%{left:-16%;opacity:0}8%{opacity:1}92%{opacity:1}100%{left:106%;opacity:0}}
.bateau-c svg{display:block;animation:tangue-c 3s ease-in-out infinite}
@keyframes tangue-c{50%{transform:rotate(-2deg) translateY(-2px)}}
.bateau-c path{fill:#0d0a20}
.bateau-c path[fill='none'],.bateau-c .sillage-c{fill:none}
.mouette-c{position:absolute;opacity:0;transition:opacity 1.5s 2.6s}
.j .mouette-c{opacity:.7;animation:vol-c 8s 2.6s ease-in-out infinite}
@keyframes vol-c{50%{transform:translate(30px,-12px)}}
.mouette-c path{stroke:#1a1030;stroke-width:2;fill:none;stroke-linecap:round}
.hero-c{position:absolute;left:0;right:0;top:32%;text-align:center;color:#fff;pointer-events:none}
.hc1{font-family:'Oswald',sans-serif;font-weight:300;font-size:clamp(30px,9vw,44px);line-height:1;
  text-transform:uppercase;
  letter-spacing:clamp(26px,9vw,44px);text-indent:clamp(26px,9vw,44px);opacity:0;filter:blur(6px);
  transition:letter-spacing 1.6s cubic-bezier(.2,.7,.3,1),text-indent 1.6s cubic-bezier(.2,.7,.3,1),opacity 1.2s,filter 1.2s}
.l1ok .hc1{letter-spacing:clamp(8px,3.4vw,16px);text-indent:clamp(8px,3.4vw,16px);opacity:1;filter:blur(0)}
.hc2{display:flex;align-items:baseline;justify-content:center;gap:clamp(8px,2.6vw,14px);margin-top:4px;
  opacity:0;transform:scale(1.5);filter:blur(8px);
  transition:transform 1.1s cubic-bezier(.2,1.2,.3,1),opacity .9s,filter .9s}
.l2ok .hc2{opacity:1;transform:scale(1);filter:blur(0)}
.hc2 .dk{font-family:'Oswald',sans-serif;font-weight:700;font-size:clamp(58px,17.5vw,86px);line-height:1;
  letter-spacing:clamp(3px,1.2vw,7px);
  background:linear-gradient(135deg,#ffd9a8,#ffb45c);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hc2 .dx{font-family:'Oswald',sans-serif;font-weight:300;font-size:clamp(58px,17.5vw,86px);line-height:1}
.hdev{margin-top:14px;font-family:'Oswald',sans-serif;font-weight:500;font-size:9.5px;
  letter-spacing:clamp(3px,1.4vw,5.5px);text-transform:uppercase;color:rgba(255,255,255,.6);
  opacity:0;transform:translateY(8px);transition:.9s ease}
.devok .hdev{opacity:1;transform:none}
.invite{position:absolute;left:0;right:0;bottom:calc(7% + env(safe-area-inset-bottom));text-align:center;
  font-family:'Oswald',sans-serif;font-weight:500;font-size:10.5px;letter-spacing:4px;text-transform:uppercase;
  color:rgba(255,255,255,.75);opacity:0;transition:opacity 1s}
.invok .invite{opacity:1;animation:pulse-i 2.2s 1s ease-in-out infinite}
@keyframes pulse-i{50%{opacity:.3}}

/* === APP / AUTH === */
.app{min-height:100dvh;display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(clamp(24px,6vw,48px) + env(safe-area-inset-top)) 24px calc(clamp(24px,6vw,48px) + env(safe-area-inset-bottom));position:relative;z-index:1}
.app.visible{display:flex;animation:fadein .6s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.brand{text-align:center;margin-bottom:clamp(26px,6vh,44px)}
.b-l1{font-family:'Oswald',sans-serif;font-weight:300;font-size:clamp(30px,9vw,44px);
  letter-spacing:clamp(8px,3.4vw,16px);line-height:1;text-indent:clamp(8px,3.4vw,16px);
  text-transform:uppercase;color:#fff}
.b-l2{display:flex;align-items:baseline;justify-content:center;gap:clamp(8px,2.6vw,14px);margin-top:4px}
.b-d{font-family:'Oswald',sans-serif;font-weight:700;font-size:clamp(58px,17.5vw,86px);
  letter-spacing:clamp(3px,1.2vw,7px);line-height:1;text-transform:uppercase;
  background:linear-gradient(135deg,#ffd9a8,#ffb45c);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.b-deux{font-family:'Oswald',sans-serif;font-weight:300;font-size:clamp(58px,17.5vw,86px);line-height:1;color:#fff}
.b-devise{margin-top:12px;font-family:'Oswald',sans-serif;font-weight:500;font-size:9.5px;
  letter-spacing:clamp(3px,1.4vw,5.5px);text-transform:uppercase;color:rgba(255,255,255,.55)}

.auth-card{width:100%;max-width:360px}
.tabs{display:flex;gap:26px;justify-content:center;margin-bottom:26px;
  border-bottom:1px solid rgba(255,255,255,.22)}
.tab{border:none;background:none;cursor:pointer;padding:0 2px 12px;
  font-family:'Oswald',sans-serif;font-size:12px;font-weight:600;letter-spacing:3px;text-transform:uppercase;
  color:rgba(255,255,255,.5);border-bottom:1.5px solid transparent;margin-bottom:-1px;transition:.2s}
.tab.active{color:#fff;border-bottom-color:#fff}
.form{display:none}
.form.active{display:block}
.field{margin-bottom:4px}
.field input{width:100%;padding:14px 2px;border:none;border-bottom:1.5px solid rgba(255,255,255,.24);
  background:none;font-family:'Inter',sans-serif;font-size:16px;color:#fff;outline:none;transition:.25s;
  border-radius:0}
.field input:focus{border-bottom-color:#fff}
.field input::placeholder{color:rgba(255,255,255,.45);font-weight:400}
.error-msg{font-size:12px;color:#ffc0a8;margin-top:5px;min-height:0}
.remember{display:flex;align-items:center;gap:9px;margin:16px 2px 6px;font-size:13px;color:rgba(255,255,255,.65);cursor:pointer;user-select:none}
.remember input{display:none}
.rbox{width:17px;height:17px;border:1.5px solid rgba(255,255,255,.4);border-radius:0;flex-shrink:0;position:relative;transition:.2s}
.remember input:checked+.rbox{background:#fff;border-color:#fff}
.remember input:checked+.rbox::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#221a3e;font-size:11px;font-weight:700}
.btn-primary{display:block;margin:30px auto 0;border:none;cursor:pointer;position:relative;
  overflow:visible;width:auto;
  font-family:'Oswald',sans-serif;font-size:12.5px;font-weight:600;letter-spacing:5px;text-transform:uppercase;
  color:#221a3e;background:#fff;padding:16px 46px;
  box-shadow:0 10px 30px rgba(0,0,0,.3);transition:.15s}
.btn-primary.tap{animation:pousse .35s ease-out}
.btn-primary:disabled{opacity:.5;cursor:wait}

/* === TOAST === */
.toast{position:fixed;top:calc(20px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-100px);
  background:#fff;border:1px solid rgba(27,30,51,.16);
  color:#1b1e33;padding:14px 24px;font-size:13.5px;z-index:1100;transition:.4s;opacity:0;
  box-shadow:0 10px 34px rgba(27,30,51,.12)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.error{border-color:#d05a4a;color:#d05a4a}
.toast.success{border-color:#4aa876;color:#3c8a60}
</style>
</head>
<body>


<div class="soir">
  <span class="nu" style="top:16%;width:130px"></span>
  <span class="nu" style="top:26%;width:90px;animation-delay:-26s"></span>
  <span class="et" style="top:7%;left:18%"></span>
  <span class="et" style="top:11%;left:74%;animation-delay:-1.4s"></span>
  <span class="et" style="top:4%;left:52%;animation-delay:-2.2s"></span>
</div>

<!-- INTRO -->
<div class="intro" id="intro">
  <div class="ciel-nuit"></div>
  <div class="ciel-soir"></div>
  <div class="etoiles-c" id="etoilesC"></div>
  <div class="horizon-c"></div>
  <div class="mer-c"></div>
  <div class="bateau-c"><svg width="112" viewBox="0 0 150 84">
    <defs>
      <linearGradient id="contre" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="rgba(255,200,120,.85)"/>
        <stop offset=".4" stop-color="rgba(255,200,120,0)"/>
      </linearGradient>
    </defs>
    <path class="sillage-c" d="M8 62 q-8 2 -16 1 M14 66 q-10 3 -20 2" stroke="rgba(255,220,160,.35)"
      stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M18 56 Q42 51 74 52 Q108 53 128 49 L142 45 L131 56 Q129 66 118 67 L34 67 Q22 66 18 56 Z"/>
    <path d="M18 56 Q42 51 74 52 Q108 53 128 49" fill="none" stroke="url(#contre)" stroke-width="2.4"/>
    <rect x="72" y="4" width="3.4" height="49" fill="#0d0a20"/>
    <path d="M74 6 L134 46 M74 6 L30 54" stroke="rgba(13,10,32,.9)" stroke-width="1.4" fill="none"/>
    <path d="M79 8 Q112 18 122 44 Q98 40 79 46 Z"/>
    <path d="M79 8 Q112 18 122 44" fill="none" stroke="url(#contre)" stroke-width="2"/>
    <path d="M68 12 Q44 28 36 50 Q56 44 68 46 Z"/>
    <path d="M74 4 q9 -3 15 1 q-7 3 -15 2 z"/>
    <path d="M34 72 Q75 76 118 71" stroke="rgba(13,10,32,.5)" stroke-width="3" fill="none"
      stroke-linecap="round" opacity=".6"/>
  </svg></div>
  <span class="mouette-c" style="top:22%;left:16%"><svg width="26" viewBox="0 0 26 12">
    <path d="M2 8 q5 -6 11 0 M9 10 q4.5 -5 10 0"/></svg></span>
  <span class="mouette-c" style="top:15%;right:22%;transition-delay:3.1s"><svg width="19" viewBox="0 0 26 12">
    <path d="M4 8 q5 -6 11 0"/></svg></span>
  <div class="hero-c">
    <div class="hc1">BATTLE</div>
    <div class="hc2"><span class="dk">DOCK</span><span class="dx">2</span></div>
    <div class="hdev">L'aventure commence au quai</div>
  </div>
  <div class="invite">— toucher pour embarquer —</div>
</div>

<!-- APP -->
<div class="app" id="mainApp">
  <div class="brand">
    <div class="b-l1">BATTLE</div>
    <div class="b-l2"><div class="b-d">DOCK</div><div class="b-deux">2</div></div>
    <div class="b-devise">Le Vieux-Port t'attend</div>
  </div>

  <div class="auth-card" id="authCard">
    <div class="tabs">
      <button class="tab active" data-tab="login">Connexion</button>
      <button class="tab" data-tab="signup">Inscription</button>
    </div>
    <form class="form active" id="form-login" autocomplete="on">
      <div class="field"><input type="email" id="login-email" placeholder="Email" autocomplete="email" required><div class="error-msg"></div></div>
      <div class="field"><input type="password" id="login-password" placeholder="Mot de passe" autocomplete="current-password" required><div class="error-msg"></div></div>
      <label class="remember"><input type="checkbox" id="remember"><span class="rbox"></span>Se souvenir de moi</label>
      <button type="submit" class="btn-primary"><span style="position:relative;z-index:3">Embarquer</span></button>
    </form>
    <form class="form" id="form-signup" autocomplete="on">
      <div class="field"><input type="text" id="signup-pseudo" placeholder="Pseudo" autocomplete="username" required minlength="3" maxlength="20"><div class="error-msg"></div></div>
      <div class="field"><input type="email" id="signup-email" placeholder="Email" autocomplete="email" required><div class="error-msg"></div></div>
      <div class="field"><input type="password" id="signup-password" placeholder="Mot de passe" autocomplete="new-password" required minlength="6"><div class="error-msg"></div></div>
      <div class="field"><input type="password" id="signup-confirm" placeholder="Confirmer" autocomplete="new-password" required><div class="error-msg"></div></div>
      <button type="submit" class="btn-primary"><span style="position:relative;z-index:3">S'inscrire</span></button>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ── l'éclat : confettis aux couleurs du logo ── */
(function(){
  const cols=['#9d7bff','#ff7a5c','#ffc24d','#5ab4d8'];
  document.querySelectorAll('.btn-primary').forEach(b=>{
    for(let i=0;i<14;i++){
      const p=document.createElement('span');
      p.className='part';
      const a=(i/14)*Math.PI*2, r=42+Math.random()*30;
      p.style.setProperty('--dx',(Math.cos(a)*r).toFixed(0)+'px');
      p.style.setProperty('--dy',(Math.sin(a)*r*0.8).toFixed(0)+'px');
      p.style.background=cols[i%4];
      p.style.animationDelay=(Math.random()*0.08).toFixed(2)+'s';
      b.appendChild(p);
    }
    b.addEventListener('click',()=>{
      b.classList.remove('tap');
      void b.offsetWidth;
      b.classList.add('tap');
      if(navigator.vibrate)navigator.vibrate(10);
    });
  });
})();
// === INTRO ===
/* ── la cinématique d'ouverture ── */
(function(){
  const cine=document.getElementById('intro');
  let e='';
  for(let i=0;i<34;i++)
    e+=`<i style="left:${(Math.random()*100).toFixed(1)}%;top:${(Math.random()*62).toFixed(1)}%;animation-delay:-${(Math.random()*3.2).toFixed(1)}s;opacity:${(0.3+Math.random()*0.6).toFixed(2)}"></i>`;
  document.getElementById('etoilesC').innerHTML=e;
  setTimeout(()=>cine.classList.add('j'),650);
  setTimeout(()=>cine.classList.add('l1ok'),2500);
  setTimeout(()=>cine.classList.add('l2ok'),3450);
  setTimeout(()=>cine.classList.add('devok'),4300);
  setTimeout(()=>cine.classList.add('invok'),4900);
  cine.addEventListener('click',()=>{
    if(cine.classList.contains('hide'))return;
    if(navigator.vibrate)navigator.vibrate(10);
    cine.classList.add('hide');
    setTimeout(()=>{cine.style.display='none';document.getElementById('mainApp').classList.add('visible')},1000);
  });
})();

// === TABS ===
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.form').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('form-'+t.dataset.tab).classList.add('active');
  });
});

// === TOAST ===
let toastTimer;
function showToast(msg,type=''){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast show '+type;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),3200);
}

// === SUPABASE ===
const SUPABASE_URL='https://jtijmythnvqgquizeizs.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp0aWpteXRobnZxZ3F1aXplaXpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ1NjU3NjAsImV4cCI6MjEwMDE0MTc2MH0.7Eo_DZarB7J6BCzRHh5pB7-ZKKwgIlwWkpqUV9MGbUc';
const sb={
  headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON,'Authorization':`Bearer ${SUPABASE_ANON}`},
  async signUp(e,p,ps){return(await fetch(`${SUPABASE_URL}/auth/v1/signup`,{method:'POST',headers:this.headers,body:JSON.stringify({email:e,password:p,data:{pseudo:ps}})})).json()},
  async signIn(e,p){return(await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`,{method:'POST',headers:this.headers,body:JSON.stringify({email:e,password:p})})).json()}
};

// === SE SOUVENIR : préremplissage ===
try{
  const cr=JSON.parse(localStorage.getItem('bd2_creds'));
  if(cr){
    document.getElementById('login-email').value=cr.e||'';
    document.getElementById('remember').checked=true;
  }
}catch(e){}

// === LOGIN ===
document.getElementById('form-login').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const btn=ev.target.querySelector('.btn-primary');btn.disabled=true;
  const email=document.getElementById('login-email').value.trim();
  const pass=document.getElementById('login-password').value;
  const r=await sb.signIn(email,pass);
  btn.disabled=false;
  if(document.getElementById('remember').checked){
    localStorage.setItem('bd2_creds',JSON.stringify({e:email}));
  }else{
    localStorage.removeItem('bd2_creds');
  }
  if(r.access_token){
    localStorage.setItem('bd2_session',JSON.stringify(r));
    showToast('Connexion réussie !','success');
    setTimeout(()=>location.href='jeu.html',700);
  }else{
    showToast(r.error_description||r.msg||'Identifiants incorrects','error');
  }
});

// === SIGNUP ===
document.getElementById('form-signup').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const p=document.getElementById('signup-password').value;
  const c=document.getElementById('signup-confirm').value;
  if(p!==c)return showToast('Les mots de passe ne correspondent pas','error');
  const btn=ev.target.querySelector('.btn-primary');btn.disabled=true;
  const r=await sb.signUp(
    document.getElementById('signup-email').value.trim(),p,
    document.getElementById('signup-pseudo').value.trim()
  );
  btn.disabled=false;
  if(r.id||r.user){
    if(r.access_token)localStorage.setItem('bd2_session',JSON.stringify(r));
    showToast('Compte créé !','success');
    setTimeout(()=>location.href='inscription.html',700);
  }else{
    showToast(r.error_description||r.msg||'Erreur à l\'inscription','error');
  }
});

// === SESSION : vérif Supabase avant redirection (anti-boucle) ===
(async()=>{
  try{
    const s=JSON.parse(localStorage.getItem('bd2_session'));
    if(!s||!s.access_token)return;
    let r=await fetch(`${SUPABASE_URL}/auth/v1/user`,{
      headers:{'apikey':SUPABASE_ANON,'Authorization':`Bearer ${s.access_token}`}
    });
    if(r.ok){location.href='jeu.html';return}
    if(s.refresh_token){
      r=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`,{
        method:'POST',headers:sb.headers,
        body:JSON.stringify({refresh_token:s.refresh_token})
      });
      const d=await r.json();
      if(d.access_token){
        localStorage.setItem('bd2_session',JSON.stringify(d));
        location.href='jeu.html';return
      }
    }
    localStorage.removeItem('bd2_session'); // session morte → on reste sur l'index
  }catch(e){localStorage.removeItem('bd2_session')}
})();
</script>
</body>
</html>
