<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Battle Dock — LE JEU</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Permanent+Marker&family=Space+Grotesk:wght@500;700;900&family=Bungee&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  
  <style>
    :root {
      --port-dark: #0f172a;
      --port-blue: #2563eb;
      --port-light-blue: #38bdf8;
      --comic-yellow: #facc15;
      --comic-red: #ef4444;
      --comic-green: #22c55e;
      --comic-purple: #a855f7;
      --paper-cream: #fefce8;
      --border-thick: 4px solid #000000;
      --shadow-comic: 8px 8px 0px #000000;
      --shadow-comic-sm: 4px 4px 0px #000000;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: linear-gradient(135deg, #020617 0%, #0f172a 50%, #1e1b4b 100%);
      transition: background 0.5s ease;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* EN-TÊTE */
    .header-container {
      text-align: center;
      margin-bottom: 32px;
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 540px;
    }

    .main-title {
      font-family: 'Bangers', cursive;
      font-size: clamp(3.5rem, 12vw, 5.5rem);
      color: var(--comic-yellow);
      letter-spacing: 4px;
      text-shadow: 6px 6px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000;
      line-height: 0.9;
      transform: rotate(-2deg);
      display: inline-block;
      margin-bottom: 8px;
    }

    .subtitle {
      font-family: 'Permanent Marker', cursive;
      font-size: clamp(1rem, 4vw, 1.3rem);
      color: #ffffff;
      text-shadow: 3px 3px 0px var(--port-dark);
      letter-spacing: 1px;
    }

    /* CONTENEUR PRINCIPAL */
    .dock-container {
      width: 100%;
      max-width: 540px;
      background: #e2e8f0;
      border: var(--border-thick);
      border-radius: 20px;
      box-shadow: var(--shadow-comic);
      position: relative;
      z-index: 5;
      overflow: hidden;
    }

    /* ONGLETS */
    .tabs-wrapper {
      display: flex;
      background: var(--port-dark);
      border-bottom: var(--border-thick);
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      font-family: 'Bungee', sans-serif;
      font-size: 14px;
      color: #94a3b8;
      padding: 16px 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .tab-btn:first-child {
      border-right: var(--border-thick);
    }

    .tab-btn.active {
      color: #ffffff;
    }

    #tabHome.active {
      background: #3b82f6;
      color: #ffffff;
    }

    #tabScores.active {
      background: #3b82f6;
      color: #ffffff;
    }

    /* CONTENU */
    .form-content {
      background: #f3f4f6;
      padding: 28px 24px;
      position: relative;
      min-height: 320px;
      overflow-y: auto;
    }

    .form-section { 
      display: none; 
    }
    
    .form-section.active { 
      display: block; 
      animation: fadeIn 0.3s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .section-headline {
      font-family: 'Bangers', cursive;
      font-size: 24px;
      color: var(--port-dark);
      margin-bottom: 24px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-group { 
      margin-bottom: 20px; 
    }
    
    .input-group:last-of-type {
      margin-bottom: 0;
    }

    .input-group label {
      display: block;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 900;
      font-size: 14px;
      color: var(--port-dark);
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .custom-field {
      width: 100%;
      padding: 14px 16px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 16px;
      color: var(--port-dark);
      background: #ffffff;
      border: 4px solid #000000;
      border-radius: 10px;
      box-shadow: 4px 4px 0px #000000;
      transition: all 0.15s ease;
    }

    .custom-field:focus {
      outline: none;
      background: #ffffff;
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px #000000;
    }

    .submit-lever-btn {
      background: var(--comic-red);
      color: white;
      border: 4px solid #000000;
      border-radius: 12px;
      padding: 16px 32px;
      font-family: 'Bungee', sans-serif;
      font-size: 16px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 8px 8px 0px #000000;
      transition: all 0.15s ease;
      border-bottom: none;
    }

    .submit-lever-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 10px 10px 0px #000000;
    }

    .submit-lever-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #000000;
    }

    .submit-lever-btn.success {
      background: var(--comic-green);
    }

    /* FOOTER */
    .footer-stamp {
      margin-top: 32px;
      font-size: 11px;
      color: #94a3b8;
      text-align: center;
      max-width: 540px;
      line-height: 1.4;
    }

    /* RESPONSIF */
    @media (max-width: 540px) {
      .dock-container {
        border-radius: 12px;
      }

      .main-title {
        font-size: 3.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="header-container">
    <div class="main-title">BATTLE DOCK</div>
    <div class="subtitle">LE simulateur de docker !</div>
  </div>

  <div class="dock-container">
    <div class="tabs-wrapper">
      <button class="tab-btn active" id="tabHome" onclick="swapTab('home')">👔 EMBAUCHE</button>
      <button class="tab-btn" id="tabScores" onclick="swapTab('scores')">📝 POSTULER</button>
    </div>

    <div class="form-content">
      <div class="form-section active" id="secHome">
        <form id="quick-login-form" style="display: flex; flex-direction: column; gap: 20px;">
          <div class="input-group">
            <label>👤 Pseudo</label>
            <input type="text" class="custom-field" id="quick-username" placeholder="Ton pseudo" required>
          </div>
          <div class="input-group">
            <label>🔑 Code Secret</label>
            <input type="password" class="custom-field" id="quick-password" placeholder="••••••••" required>
          </div>
          <button type="submit" class="submit-lever-btn" style="background: var(--comic-red); margin-top: 10px; border-bottom: none;">SE CONNECTER</button>
        </form>
      </div>

      <div class="form-section" id="secScores">
        <form id="application-form" style="display: flex; flex-direction: column; gap: 20px;">
          <div class="input-group">
            <label>👤 Ton Pseudo</label>
            <input type="text" class="custom-field" id="app-username" placeholder="Pseudo de joueur" required>
          </div>
          <div class="input-group">
            <label>📬 Email</label>
            <input type="email" class="custom-field" id="app-email" placeholder="ton@email.com" required>
          </div>
          <div class="input-group">
            <label>💬 Message</label>
            <textarea class="custom-field" id="app-message" placeholder="Explique pourquoi tu veux rejoindre..." style="resize: vertical; min-height: 100px; font-family: 'Space Grotesk', sans-serif;" required></textarea>
          </div>
          <button type="submit" class="submit-lever-btn" style="margin-top: 10px; background: var(--comic-red);">ENVOYER CANDIDATURE</button>
        </form>
      </div>
    </div>
  </div>

  <div class="footer-stamp">Battle Dock est une œuvre de fiction et de divertissement.<br>Tous les éléments sont purement imaginaires.</div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const supabaseClient = createClient(supabaseUrl, supabaseKey);

    if (localStorage.getItem('userId')) {
      window.location.href = 'game.html';
    }

    function swapTab(target) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
      
      document.getElementById('tab' + target.charAt(0).toUpperCase() + target.slice(1)).classList.add('active');
      document.getElementById('sec' + target.charAt(0).toUpperCase() + target.slice(1)).classList.add('active');
    }

    document.getElementById('quick-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('quick-username').value.trim();
      const password = document.getElementById('quick-password').value;

      if (!username || !password) {
        alert('Remplis tous les champs !');
        return;
      }

      try {
        const { data: profile, error: pError } = await supabaseClient
          .from('profiles')
          .select('user_id')
          .eq('username', username)
          .single();

        if (pError || !profile) {
          alert('Utilisateur introuvable !');
          return;
        }

        const email = username + '@battledock.local';
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

        if (error) {
          alert('Code erroné !');
          return;
        }

        localStorage.setItem('userId', data.user.id);
        localStorage.setItem('username', username);
        window.location.href = 'game.html';
      } catch (err) {
        alert('Erreur : ' + err.message);
      }
    });

    document.getElementById('application-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('app-username').value.trim();
      const email = document.getElementById('app-email').value.trim();
      const message = document.getElementById('app-message').value.trim();

      if (!username || !email || !message) {
        alert('Remplis tous les champs !');
        return;
      }

      try {
        const { data, error } = await supabaseClient
          .from('applications')
          .insert([{
            username: username,
            email: email,
            message: message,
            created_at: new Date().toISOString()
          }]);

        if (error) throw error;

        alert('Candidature envoyée ! Merci de ton intérêt !');
        document.getElementById('application-form').reset();
      } catch (err) {
        alert('Erreur : ' + err.message);
      }
    });
  </script>
</body>
</html>
