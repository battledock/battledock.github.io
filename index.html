<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Battle Dock — Accueil</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Space+Grotesk:wght@700;900&family=Bungee&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  
  <style>
    :root {
      --port-dark: #0f172a;
      --port-blue: #2563eb;
      --comic-yellow: #facc15;
      --comic-red: #ef4444;
      --comic-green: #22c55e;
      --border-thick: 4px solid #000000;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .dock-container {
      width: 100%;
      max-width: 380px;
      background: #e2e8f0;
      border: var(--border-thick);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 8px 8px 0px #000;
    }

    .tabs-wrapper { display: flex; background: var(--port-dark); border-bottom: var(--border-thick); }
    .tab-btn {
      flex: 1; background: transparent; border: none;
      font-family: 'Bungee', sans-serif; font-size: 13px;
      color: #94a3b8; padding: 16px 8px; cursor: pointer; text-align: center;
    }
    .tab-btn:first-child { border-right: var(--border-thick); }
    .tab-btn.active { color: #ffffff; }
    #tabHome.active { background: var(--port-blue); }
    #tabScores.active { background: var(--comic-red); }

    .form-content { background: #f3f4f6; padding: 20px 22px; }
    .form-section { display: none; }
    .form-section.active { display: block; }

    .input-group { margin-bottom: 14px; }
    .input-group label { display: block; font-weight: 900; font-size: 13px; color: var(--port-dark); margin-bottom: 6px; text-transform: uppercase; }
    
    .custom-field {
      width: 100%; padding: 12px 14px; font-weight: 700; font-size: 15px; color: var(--port-dark);
      background: #ffffff; border: 4px solid #000000; border-radius: 10px;
    }

    /* Selecteur de couleur cosmétique pour l'inscription */
    .color-picker-wrapper {
      display: flex; gap: 10px; margin-top: 8px; justify-content:建设;
    }
    .color-option {
      width: 35px; height: 35px; border: 3px solid #000; border-radius: 50%; cursor: pointer; transition: transform 0.1s;
    }
    .color-option.selected { transform: scale(1.2); border-color: var(--comic-yellow); }

    .submit-lever-btn {
      color: white; border: 4px solid #000000; border-radius: 12px; padding: 13px;
      font-family: 'Bungee', sans-serif; font-size: 14px; text-transform: uppercase;
      cursor: pointer; width: 100%; margin-top: 12px; box-shadow: 4px 4px 0px #000;
    }
    #login-submit { background: var(--port-blue); }
    #register-submit { background: var(--comic-green); }
    .submit-lever-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px #000; }

    /* POPUP ALERT */
    .error-popup {
      display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: #e2e8f0; border: 4px solid #000; border-radius: 20px; padding: 24px;
      max-width: 320px; width: 90%; box-shadow: 6px 6px 0px #000; z-index: 1000;
    }
    .error-popup.show { display: block; }
    .error-popup-title { font-family: 'Bungee', sans-serif; font-size: 18px; color: var(--comic-red); margin-bottom: 8px; }
    .error-popup-btn { background: var(--port-dark); color: white; border: 2px solid #000; padding: 8px; width: 100%; cursor: pointer; font-family: 'Bungee', sans-serif; margin-top: 10px; border-radius: 8px; }
    .error-popup-overlay { display: none; position: fixed; top: 0; left: 0; bottom: 0; right: 0; background: rgba(0,0,0,0.6); z-index: 999; }
    .error-popup-overlay.show { display: block; }
  </style>
</head>
<body>

  <div class="dock-container">
    <div class="tabs-wrapper">
      <button class="tab-btn active" id="tabHome" onclick="swapTab('home')">Connexion</button>
      <button class="tab-btn" id="tabScores" onclick="swapTab('scores')">Inscription</button>
    </div>

    <div class="form-content">
      <div class="form-section active" id="secHome">
        <form id="login-form">
          <div class="input-group">
            <label>👤 Pseudo</label>
            <input type="text" class="custom-field" id="login-username" required>
          </div>
          <div class="input-group">
            <label>🔑 Code Secret</label>
            <input type="password" class="custom-field" id="login-password" required>
          </div>
          <button type="submit" class="submit-lever-btn" id="login-submit">SE CONNECTER</button>
        </form>
      </div>

      <div class="form-section" id="secScores">
        <form id="register-form">
          <div class="input-group">
            <label>👤 Choisis un Pseudo</label>
            <input type="text" class="custom-field" id="reg-username" required>
          </div>
          <div class="input-group">
            <label>🔒 Code de sécurité</label>
            <input type="password" class="custom-field" id="reg-password" required>
          </div>
          <div class="input-group">
            <label>🎨 Couleur d'ambiance du Badge</label>
            <div class="color-picker-wrapper">
              <div class="color-option selected" style="background: linear-gradient(135deg, #0f172a, #1e1b4b);" data-color="linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%)"></div>
              <div class="color-option" style="background: linear-gradient(135deg, #1e3a8a, #1e40af);" data-color="linear-gradient(135deg, #1e3a8a 0%, #1e40af 50%, #3b82f6 100%)"></div>
              <div class="color-option" style="background: linear-gradient(135deg, #581c87, #701a75);" data-color="linear-gradient(135deg, #581c87 0%, #701a75 100%)"></div>
              <div class="color-option" style="background: linear-gradient(135deg, #064e3b, #065f46);" data-color="linear-gradient(135deg, #064e3b 0%, #022c22 100%)"></div>
            </div>
          </div>
          <button type="submit" class="submit-lever-btn" id="register-submit">CRÉER MON COMPTE</button>
        </form>
      </div>
    </div>
  </div>

  <div class="error-popup-overlay" id="overlay"></div>
  <div class="error-popup" id="popup">
    <div class="error-popup-title">Système Dock</div>
    <div class="error-popup-message" id="popMsg"></div>
    <button class="error-popup-btn" onclick="closePop()">Fermer</button>
  </div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    let selectedColor = "linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%)";

    // Gestion du sélecteur de couleur
    document.querySelectorAll('.color-option').forEach(opt => {
      opt.addEventListener('click', () => {
        document.querySelectorAll('.color-option').forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
        selectedColor = opt.getAttribute('data-color');
      });
    });

    function showPop(msg) {
      document.getElementById('popMsg').textContent = msg;
      document.getElementById('popup').classList.add('show');
      document.getElementById('overlay').classList.add('show');
    }
    function closePop() {
      document.getElementById('popup').classList.remove('show');
      document.getElementById('overlay').classList.remove('show');
    }

    function swapTab(target) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
      document.getElementById('tab' + target.charAt(0).toUpperCase() + target.slice(1)).classList.add('active');
      document.getElementById('sec' + target.charAt(0).toUpperCase() + target.slice(1)).classList.add('active');
    }

    // LISTE D'AVATARS OK POUR UN OUVRIER DE L'ESPACE
    const avatars = ['👨‍🔧', '👩‍🔧', '🤖', '👽', '🧑‍🚀', '🦺'];

    // S'INSCRIRE DIRECTEMENT DANS LE SQL
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('reg-username').value.trim();
      const password = document.getElementById('reg-password').value;

      try {
        // Est-ce que le pseudo existe déjà ?
        const { data: exist } = await supabaseClient.from('users').select('username').eq('username', username);
        if (exist && exist.length > 0) {
          showPop("Ce pseudo de docker est déjà réservé !");
          return;
        }

        const randomAvatar = avatars[Math.floor(Math.random() * avatars.length)];

        // Insertion utilisateur
        const { data: newUser, error: uErr } = await supabaseClient
          .from('users')
          .insert([{ username, password, avatar: randomAvatar, bg_color: selectedColor }])
          .select();

        if (uErr) { showPop("Erreur SQL inscription : " + uErr.message); return; }

        const uId = newUser[0].id;

        // Création de sa progression
        await supabaseClient.from('game_progress').insert([{ user_id: uId, level: 1, score: 0, rank: 'Docker Occasionnel', money: 100, energy: 50, energy_max: 50, xp: 0 }]);
        await supabaseClient.from('leaderboard').insert([{ user_id: uId, score: 100 }]);

        // Sauvegarde de session locale complète
        localStorage.setItem('userId', uId);
        localStorage.setItem('username', username);
        localStorage.setItem('userAvatar', randomAvatar);
        localStorage.setItem('userBg', selectedColor);

        window.location.href = 'premiereconnexion.html';
      } catch (err) {
        showPop(err.message);
      }
    });

    // SE CONNECTER EN VÉRIFIANT LE SQL
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;

      try {
        const { data: user, error } = await supabaseClient
          .from('users')
          .select('*')
          .eq('username', username)
          .eq('password', password);

        if (error || !user || user.length === 0) {
          showPop("Pseudo ou Code Secret incorrect !");
          return;
        }

        // Sauvegarde complète des données utilisateur trouvées en SQL
        localStorage.setItem('userId', user[0].id);
        localStorage.setItem('username', user[0].username);
        localStorage.setItem('userAvatar', user[0].avatar);
        localStorage.setItem('userBg', user[0].bg_color);

        window.location.href = 'game.html';
      } catch (err) {
        showPop(err.message);
      }
    });
  </script>
</body>
</html>
