<!-- ===== la mise à jour : le jeu ne reste jamais bloqué sur une vieille version ===== -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<script>
/* Ajouté au signet, un navigateur garde la page en mémoire et ne va plus
   jamais la rechercher. On lui demande donc, à chaque ouverture, quelle est
   la version publiée : si elle a changé, on recharge une seule fois avec une
   adresse neuve — c'est la seule façon de percer le cache d'un raccourci. */
(function(){
  var MA_VERSION='2026-09-20-1310';
  var cle='bdl.version.vue';
  function verifier(){
    fetch('version.json?t='+Date.now(),{cache:'no-store'})
      .then(function(r){return r.json();})
      .then(function(d){
        if(!d||!d.v||d.v===MA_VERSION)return;
        /* on ne recharge qu'une fois par version, sinon on bouclerait */
        var deja=null;
        try{deja=sessionStorage.getItem(cle);}catch(e){}
        if(deja===d.v)return;
        try{sessionStorage.setItem(cle,d.v);}catch(e){}
        var u=location.pathname.split('?')[0]+'?v='+encodeURIComponent(d.v);
        location.replace(u);
      })
      .catch(function(){});
  }
  verifier();
  /* et quand on revient sur l'onglet après un moment */
  var vu=Date.now();
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState!=='visible')return;
    if(Date.now()-vu<60000)return;
    vu=Date.now();verifier();
  });
})();
</script>

/* ================= connexion ================= */
let mode='co';
const afficher=(t,k)=>{const m=$('msg');m.textContent=t;m.className='msg on '+(k||'');};
const cacher=()=>{$('msg').className='msg';};
function basculer(m){
  mode=m;cacher();
  $('t-co').classList.toggle('on',m==='co');
  $('t-in').classList.toggle('on',m==='in');
  $('bloc-nom').style.display=m==='in'?'block':'none';
  $('oubli').style.display=m==='co'?'block':'none';
  $('valTexte').textContent=m==='co'?'Se connecter':'S’inscrire';
  $('mdp').autocomplete=m==='co'?'current-password':'new-password';
}
$('t-co').onclick=()=>basculer('co');
$('t-in').onclick=()=>basculer('in');
$('oeil').onclick=()=>{const c=$('mdp');c.type=c.type==='password'?'text':'password';};

$('valider').onclick=async()=>{
  const email=$('email').value.trim(), mdp=$('mdp').value, nom=$('pseudo').value.trim()||'Sans nom';
  if(!email||!mdp)return afficher('Il manque l’adresse ou le mot de passe.','err');
  if(mode==='in'&&mdp.length<8)return afficher('Le mot de passe doit faire au moins 8 caractères.','err');
  const b=$('valider');b.disabled=true;const av=b.textContent;b.textContent='Un instant…';cacher();
  try{
    if(mode==='co'){
      const {error}=await sb.auth.signInWithPassword({email,password:mdp});
      if(error)throw error;location.href='jeu.html';
    }else{
      const {data,error}=await sb.auth.signUp({email,password:mdp,options:{data:{nom}}});
      if(error)throw error;
      try{localStorage.setItem('bdl.nom',nom);}catch(x){}
      if(data.session){location.href='jeu.html';return;}
      afficher('Compte créé. Confirme ton adresse par e-mail, puis reviens.','ok');
      basculer('co');
    }
  }catch(err){
    const t=(err&&err.message)||'';
    afficher(/Invalid login/i.test(t)?'Adresse ou mot de passe incorrect.':
      /already registered/i.test(t)?'Cette adresse a déjà un survivant.':
      'Ça n’a pas marché : '+t,'err');
  }finally{b.disabled=false;b.textContent=av;}
};
$('oubli').onclick=async()=>{
  const email=$('email').value.trim();
  if(!email)return afficher('Écris ton adresse, je t’envoie un lien.','err');
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin});
  afficher(error?('Échec : '+error.message):'Lien de réinitialisation envoyé.',error?'err':'ok');
};
$('invite').onclick=()=>{try{localStorage.setItem('bdl.invite','1');}catch(x){}location.href='jeu.html';};
document.addEventListener('keydown',ev=>{if(ev.key==='Enter')$('valider').click();});
sb.auth.getSession().then(({data})=>{if(data&&data.session)location.href='jeu.html';});

<script>
/* ================= LE PRÉ, ET CE QUI Y VIT =================
   Le fond est gravé une fois ; le vent, les papillons et la grenouille se
   jouent sur un second calque. */
const $=(i)=>document.getElementById(i);
const cv=$('pre');
let dir=0,PIX=0;
const alea=(n)=>{const v=Math.sin(n*12.9898)*43758.5453;return v-Math.floor(v);};
const lisse=(x,y)=>{const x0=Math.floor(x),y0=Math.floor(y),fx=x-x0,fy=y-y0;
  const h=(a,b)=>alea(a*127.1+b*311.7), m=(a,b,t)=>a+(b-a)*(t*t*(3-2*t));
  return m(m(h(x0,y0),h(x0+1,y0),fx),m(h(x0,y0+1),h(x0+1,y0+1),fx),fy);};

/* les huit fleurs du jeu */
const FL=[['#d9584f','#f7d98a','#a83c39',1],['#e8cf4e','#fdf3bd','#bfa32c',0],
          ['#6285c9','#f7e6a8','#44629e',1],['#f2efe4','#e8cf4e','#c9c2b0',0],
          ['#9a6fc0','#f7e6a8','#6f4e91',0],['#e8934e','#fdf3bd','#bf6f2c',1],
          ['#e0a8c8','#f7e6a8','#b07a9c',0],['#c9dd8a','#f7e6a8','#9ab063',0]];
const DECORS=[
 {nom:'1 · Le pré au couchant',
  base:['#8a9450','#96a05a','#9caa60','#a8b46e','#7d8748'],
  halo:'rgba(255,214,122,.34)', lueur:'#fbe8b0',
  mot:'La prairie de l’écran de chargement, en plus grand : huit espèces de '+
      'fleurs en massifs, des touffes d’herbe, des papillons posés, et la '+
      'lumière rase qui dore les pétales.'},
 {nom:'2 · La rive',
  base:['#8a9450','#96a05a','#9caa60','#a8b46e','#7d8748'],
  riviere:true, halo:'rgba(255,214,122,.18)', lueur:'#fbe8b0',
  mot:'Le même pré, mais la rivière le traverse en bas avec ses roseaux et ses '+
      'galets. On voit tout de suite les deux rives du jeu.'},
 {nom:'3 · La nuit',
  base:['#2f3a2a','#36422f','#3b4834','#44523c','#28321f'],
  nuit:true, halo:'rgba(120,160,255,.10)', lueur:'#9fb8e8',
  mot:'Le même pré, mais de nuit : les verts tirent au bleu, les fleurs '+
      'pâlissent, et des lucioles flottent. Le titre ressort beaucoup plus.'}
];
function graver(){
  const D=DECORS[0];
  const ZO=3;
  const W=Math.ceil(window.innerWidth/ZO), H=Math.ceil(window.innerHeight/ZO);
  cv.width=W;cv.height=H;
  const g=cv.getContext('2d');g.imageSmoothingEnabled=false;
  let n=0;
  const R=(x,y,w,h2,c)=>{g.fillStyle=c;g.fillRect(x|0,y|0,Math.max(1,w|0),Math.max(1,h2|0));n++;};
  const B=D.base;
  R(0,0,W,H,B[1]);
  for(let y=0;y<H;y+=2)for(let x=((y/2)%2?0:2);x<W;x+=4)R(x,y,2,2,B[2]);
  for(let y=0;y<H;y+=3)for(let x=0;x<W;x+=3){
    const v=lisse(x/34,y/34);
    if(v>0.62)R(x,y,3,3,B[3]); else if(v<0.36)R(x,y,3,3,B[0]);
  }
  /* les plaques de terre sèche */
  for(let i=0;i<5;i++){
    const cx=alea(i*3.1)*W, cy=alea(i*5.7)*H, r=12+alea(i*7.3)*16;
    for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++){
      if(x*x+y*y>r*r*(0.7+alea(x*0.3+y*0.7)*0.3))continue;
      R(cx+x,cy+y,1,1,D.nuit?'#4a4634':'#a8946a');
    }
  }
  for(let i=0;i<2600;i++)R(alea(i*1.7)*W,alea(i*2.9)*H,1,2,B[(i%2)?4:0]);
  for(let i=0;i<420;i++){
    const tx=alea(i*3.7)*W, ty=alea(i*4.3)*H;
    R(tx,ty,2,3,B[4]);R(tx+2,ty+1,2,2,B[0]);R(tx-2,ty+1,2,2,B[3]);
  }
  /* la rivière, pour la deuxième */
  if(D.riviere){
    const y0=Math.round(H*0.74), RIV=22;
    for(let x=0;x<W;x++){
      const cy=y0+Math.round(Math.sin(x/40)*6+Math.sin(x/17)*3);
      for(let d=-RIV-6;d<=RIV+6;d++){
        const a=Math.abs(d), y=cy+d;
        if(y<0||y>=H)continue;
        if(a<=RIV)R(x,y,1,1,a>RIV-3?'#55a0bd':(a>RIV-7?'#4189a8':(a>RIV-12?'#357291':'#2a5f7d')));
        else{const v=alea(x*0.7+y*1.3);
          R(x,y,1,1,v<.14?'#96805c':(v<.5?'#b9a37a':'#a8926a'));
          if(v<0.04)R(x,y,2,2,'#8b939a');}
      }
      if(alea(x*0.37)<0.07)R(x,cy+Math.round((alea(x*2.9)-.5)*RIV),4+Math.round(alea(x)*6),1,'#7fc4dd');
    }
    for(let i=0;i<22;i++){
      const x=Math.round(alea(i*5.1)*W);
      const cy=y0+Math.round(Math.sin(x/40)*6+Math.sin(x/17)*3);
      const y=cy-(RIV+1);
      for(let b=0;b<5;b++){
        const h2=10+Math.round(alea(i*3+b)*8);
        R(x+b*2-4,y-h2,2,h2,b%2?'#5e8a47':'#48703a');
      }
    }
  }
  /* LES FLEURS, en massifs */
  const MA=26;
  for(let my=0;my<H/MA+1;my++)for(let mx=0;mx<W/MA+1;mx++){
    if(lisse(mx/2.2,my/2.2)<0.46)continue;
    const e=FL[Math.floor(alea(mx*7.1+my*3.3)*FL.length)];
    const nb=2+Math.floor(alea(mx*5.7+my*9.1)*4);
    for(let k=0;k<nb;k++){
      const fx=Math.round(mx*MA+alea(mx*11+my*13+k*3)*MA);
      const fy=Math.round(my*MA+alea(mx*17+my*19+k*5)*MA);
      if(fx<2||fy<4||fx>W-3||fy>H-3)continue;
      const pale=(c)=>D.nuit?c.replace(/^#/,'#'):c;
      R(fx,fy+2,1,3,D.nuit?'#3f5230':'#5f7a3c');
      R(fx-1,fy-1,3,3,pale(e[0]));R(fx,fy-2,1,1,pale(e[0]));R(fx,fy+1,1,1,pale(e[0]));
      R(fx-2,fy,1,1,e[2]);R(fx+2,fy,1,1,e[2]);
      if(e[3]){R(fx-1,fy-2,1,1,pale(e[0]));R(fx+1,fy+1,1,1,pale(e[0]));}
      R(fx,fy,1,1,e[1]);
      R(fx-1,fy-1,1,1,D.lueur);
    }
  }
  /* papillons le jour, lucioles la nuit */
  for(let i=0;i<9;i++){
    const px=Math.round(alea(i*13.1)*W), py=Math.round(alea(i*17.7)*H*0.7);
    if(D.nuit){R(px,py,2,2,'#e8f2a0');R(px-1,py-1,4,4,'rgba(232,242,160,.18)');}
    else{const c=['#f2efe4','#e8cf4e','#e0a8c8'][i%3];
      R(px,py,2,2,c);R(px+3,py,2,2,c);R(px+2,py,1,2,'#4a3220');}
  }
  /* le halo de lumière */
  const grd=g.createRadialGradient(W*0.74,H*0.12,10,W*0.74,H*0.12,H*0.95);
  grd.addColorStop(0,D.halo);grd.addColorStop(0.5,'rgba(255,186,96,.08)');
  grd.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=grd;g.fillRect(0,0,W,H);
  if(D.nuit){g.fillStyle='rgba(20,30,60,.22)';g.fillRect(0,0,W,H);}
  PIX=n;
  /* le calque de ce qui bouge, à la même échelle */
  vc.width=W;vc.height=H;
  const gv=vc.getContext('2d');gv.imageSmoothingEnabled=false;
  preparerVie();
}

/* ================= CE QUI BOUGE PAR-DESSUS =================
   Le pré est gravé une fois. L'animation se joue sur un second calque,
   transparent, qu'on efface à chaque image : quelques dizaines de traits,
   pas plus. Trois façons de donner vie à l'écran. */
const vc=$('vie'), vg=vc.getContext('2d');
let anim=0, ZOV=3, VW2=0, VH2=0;
const PAPS=[],GENS=[],GOUTTES=[],FEUILLES=[];
function preparerVie(){
  VW2=vc.width;VH2=vc.height;
  PAPS.length=0;GENS.length=0;GOUTTES.length=0;FEUILLES.length=0;
  for(let i=0;i<9;i++)PAPS.push({x:alea(i*3.1)*VW2,y:alea(i*5.7)*VH2*0.8,
    a:alea(i*7.3)*6.28,v:9+alea(i*2.2)*10,t:alea(i)*6.28,
    c:['#f2efe4','#e8cf4e','#e0a8c8','#9fe0ec'][i%4]});
  for(let i=0;i<5;i++)GENS.push({x:-40-i*90,y:VH2*(0.52+alea(i*5.1)*0.22),
    v:11+alea(i*3.3)*7,pas:alea(i)*6.28,
    c:['#4f7d5c','#c8434f','#4a8ac2','#e8cf4e','#b98bd9'][i%5],
    auto:i===2});
  for(let i=0;i<70;i++)GOUTTES.push({x:alea(i*1.7)*VW2,y:alea(i*2.9)*VH2,
    v:70+alea(i*3.7)*60,l:3+Math.round(alea(i*5.1)*4)});
  for(let i=0;i<14;i++)FEUILLES.push({x:alea(i*4.3)*VW2,y:alea(i*6.7)*VH2,
    a:alea(i*8.9)*6.28,v:14+alea(i*2.1)*12,t:alea(i*3)*6.28,
    c:['#4a944a','#3d7d3f','#c9dd8a'][i%3]});
}
function dessinerVie(t,dt){
  const g=vg;
  g.setTransform(1,0,0,1,0,0);
  g.clearRect(0,0,VW2,VH2);
  const R=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x|0,y|0,w,h);};
  dessinerCompagnon(g,t,dt);
  /* --- LE VENT : les feuilles volent, les papillons traversent --- */
  FEUILLES.forEach(f=>{
    f.t+=dt*2.2;
    f.x+=(f.v+Math.sin(f.t)*8)*dt;
    f.y+=Math.sin(f.t*1.7)*16*dt;
    if(f.x>VW2+10){f.x=-10;f.y=alea(f.t)*VH2;}
    R(f.x,f.y,2,2,f.c);
    R(f.x+(Math.sin(f.t)>0?1:-1),f.y+1,1,1,f.c);
  });
  PAPS.forEach(p=>{
    p.t+=dt*7;
    p.a+=Math.sin(p.t*0.6)*dt*1.4;
    p.x+=Math.cos(p.a)*p.v*dt;p.y+=Math.sin(p.a)*p.v*0.6*dt;
    if(p.x<-8)p.x=VW2+8;if(p.x>VW2+8)p.x=-8;
    if(p.y<4)p.y=VH2*0.8;if(p.y>VH2*0.85)p.y=6;
    const o=Math.sin(p.t)>0?1:0;             /* les ailes battent */
    R(p.x,p.y,2,2,p.c);R(p.x+3,p.y-o,2,2,p.c);R(p.x+2,p.y,1,2,'#4a3220');
  });
}

/* ---- le petit compagnon : un seul, discret, qui traverse l'écran ----
   Il ne sert à rien. C'est exactement pour ça qu'il est là. */
let rigolo=2;   /* la grenouille */
const COMP={escargot:{x:-20,y:0,v:4,t:0,trace:[]},
            chat:{x:-30,y:0,etat:'marche',t:0,v:16,pas:0},
            grenouille:{x:-20,y:0,t:0,saut:0}};
function dessinerCompagnon(g,t,dt){
  const R=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x|0,y|0,w,h);};
  if(rigolo===0){
    /* L'ESCARGOT : il traverse tout en bas, très lentement, et laisse une
       trace brillante qui s'efface derrière lui. */
    const e=COMP.escargot;
    if(!e.y)e.y=VH2*0.80;
    e.x+=e.v*dt;e.t+=dt;
    if(e.x>VW2+20){e.x=-20;e.trace.length=0;}
    e.trace.push({x:e.x,y:e.y,v:1});
    if(e.trace.length>150)e.trace.shift();
    e.trace.forEach(p=>{p.v-=dt*0.18;
      if(p.v>0)R(p.x,p.y+3,2,1,'rgba(232,242,228,'+(p.v*0.45).toFixed(2)+')');});
    const b=Math.sin(e.t*4)>0?1:0;
    R(e.x-4,e.y+2,10,2,'#b9a37a');
    R(e.x-2,e.y-4,8,7,'#8a6238');
    R(e.x-2,e.y-4,8,2,'#a5764a');
    R(e.x,e.y-2,4,3,'#6b4a28');
    R(e.x-6,e.y-2+b,4,4,'#c9b183');
    R(e.x-7,e.y-6+b,1,3,'#c9b183');R(e.x-4,e.y-6+b,1,3,'#c9b183');
    R(e.x-7,e.y-7+b,1,1,'#3d2a17');R(e.x-4,e.y-7+b,1,1,'#3d2a17');
  }else if(rigolo===1){
    /* LE CHAT : il marche, repère un papillon, s'aplatit et bondit. Il rate. */
    const c=COMP.chat, p=PAPS[0];
    if(!c.y)c.y=VH2*0.72;
    c.t+=dt;
    if(c.etat==='marche'){
      c.x+=c.v*dt;c.pas+=dt*6;
      if(p&&Math.abs(p.x-c.x)<60&&p.y<c.y&&p.y>c.y-44&&c.t>2){c.etat='guet';c.t=0;}
      if(c.x>VW2+30){c.x=-30;c.y=VH2*(0.62+alea(c.t)*0.18);}
    }else if(c.etat==='guet'){
      if(c.t>0.9){c.etat='bond';c.t=0;}
    }else{
      c.x+=70*dt;
      if(c.t>0.5){c.etat='marche';c.t=0;}
    }
    const guet=c.etat==='guet', bond=c.etat==='bond';
    const h=bond?Math.sin(Math.min(1,c.t/0.5)*3.1416)*14:0;
    const y=c.y-h, b2=c.etat==='marche'?Math.round(Math.sin(c.pas)):0;
    R(c.x-7,c.y+2,16,2,'rgba(0,0,0,.22)');
    R(c.x-6,y-(guet?4:6),13,guet?5:7,'#4a4238');
    R(c.x-6,y-(guet?4:6),13,2,'#5b5246');
    R(c.x+5,y-(guet?8:11),6,6,'#4a4238');
    R(c.x+5,y-(guet?10:13),2,3,'#4a4238');R(c.x+9,y-(guet?10:13),2,3,'#4a4238');
    R(c.x+8,y-(guet?7:10),1,1,'#e8cf4e');R(c.x+10,y-(guet?7:10),1,1,'#e8cf4e');
    R(c.x-9,y-(guet?3:5),4,2,'#4a4238');
    R(c.x-10,y-(guet?6:8),2,4,'#4a4238');
    if(!guet&&!bond){R(c.x-3,y+1+b2,2,3,'#3a332b');R(c.x+3,y+1-b2,2,3,'#3a332b');}
  }else{
    /* LA GRENOUILLE : elle traverse par bonds, avec une pause entre chaque. */
    const f=COMP.grenouille;
    if(!f.y)f.y=VH2*0.84;
    f.t+=dt;
    if(f.saut>0){f.saut-=dt;f.x+=34*dt;}
    else if(f.t>1.4){f.saut=0.45;f.t=0;}
    if(f.x>VW2+20){f.x=-20;f.y=VH2*(0.76+alea(f.t)*0.1);}
    const h=f.saut>0?Math.sin((0.45-f.saut)/0.45*3.1416)*13:0;
    const y=f.y-h, plie=f.saut>0?0:1;
    R(f.x-5,f.y+2,12,2,'rgba(0,0,0,.2)');
    R(f.x-4,y-5+plie,11,6,'#4a944a');
    R(f.x-4,y-5+plie,11,2,'#5aa855');
    R(f.x+5,y-8+plie,5,5,'#4a944a');
    R(f.x+6,y-9+plie,1,1,'#f2efe4');R(f.x+8,y-9+plie,1,1,'#f2efe4');
    R(f.x+6,y-10+plie,1,1,'#3d2a17');R(f.x+8,y-10+plie,1,1,'#3d2a17');
    if(f.saut>0){R(f.x-7,y-1,4,2,'#3d7d3f');R(f.x-8,y+1,3,2,'#3d7d3f');}
    else{R(f.x-5,y,3,3,'#3d7d3f');R(f.x+4,y,3,3,'#3d7d3f');}
  }
}

let t0=performance.now();
function boucle(t){
  const dt=Math.min(.05,(t-t0)/1000);t0=t;
  dessinerVie(t/1000,dt);
  requestAnimationFrame(boucle);
}



addEventListener('resize',()=>{graver();});
graver();requestAnimationFrame(boucle);

</script>
<script>
/* ================= LA MUSIQUE DE L'ACCUEIL =================
   Une boucle de 52 secondes, prise dans la bibliothèque audio de YouTube.
   Les navigateurs interdisent le son avant un geste : elle démarre donc au
   premier contact avec la page, et le choix est retenu d'une fois sur
   l'autre. Elle ne joue que sur cet écran — entrer dans le jeu la coupe. */
(function(){
  const air=$('air'), note=$('note');
  if(!air||!note)return;
  let veut=localStorage.getItem('bdl.musique')!=='non';   /* oui par défaut */
  const montrer=()=>note.classList.toggle('on',veut&&!air.paused);
  const lancer=()=>{
    if(!veut)return;
    air.volume=0;
    const p=air.play();
    if(p&&p.catch)p.catch(()=>{});
    /* elle monte doucement au lieu d'entrer en trombe */
    let v=0;
    const monte=setInterval(()=>{
      v=Math.min(0.5,v+0.02);air.volume=v;
      if(v>=0.5)clearInterval(monte);
    },70);
    montrer();
  };
  /* le premier contact, quel qu'il soit, débloque le son */
  ['pointerdown','touchstart','keydown'].forEach(ev=>
    addEventListener(ev,function un(){lancer();
      ['pointerdown','touchstart','keydown'].forEach(e2=>removeEventListener(e2,un));
    },{once:false,passive:true}));
  note.onclick=(ev)=>{
    ev.stopPropagation();
    veut=!veut;
    localStorage.setItem('bdl.musique',veut?'oui':'non');
    if(veut)lancer(); else {air.pause();}
    montrer();
  };
  air.addEventListener('playing',montrer);
  air.addEventListener('pause',montrer);
  /* en quittant l'accueil, on baisse le son au lieu de le couper net */
  addEventListener('pagehide',()=>{try{air.pause();}catch(x){}});
  montrer();
})();
</script>
