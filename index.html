<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b110d">
<title>Survivre</title>
<style>
:root{--braise:#e2621f;--braise-c:#f0822f;--os:#f7f1e4;--doux:#8a9a86;--pale:#a89a86}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:#070c0a;color:var(--os);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button,input{font-family:inherit;font-size:15px;border:0;background:none;color:inherit}

#scene{position:fixed;inset:0;z-index:0}
#scene svg{display:block;width:100%;height:100%}

.titre{position:fixed;left:0;right:0;top:max(6vh,46px);z-index:2;text-align:center;
  animation:venir .8s cubic-bezier(.2,.8,.3,1)}
@keyframes venir{from{opacity:0;transform:translateY(-12px)}}
.kicker{font:600 10px system-ui;letter-spacing:6.5px;color:#c89a5e}
.titre h1{font:400 44px/1.02 Georgia,"Times New Roman",serif;margin-top:14px;
  text-shadow:0 0 38px rgba(255,150,60,.28),0 5px 24px rgba(0,0,0,.8)}
.titre .filet{width:44px;height:1px;background:rgba(247,241,228,.4);margin:16px auto}

.panneau{position:fixed;left:14px;right:14px;bottom:max(16px,env(safe-area-inset-bottom));z-index:3;
  background:rgba(11,17,13,.76);backdrop-filter:blur(16px);border:1px solid rgba(255,200,140,.22);
  border-radius:22px;padding:16px;max-height:82dvh;overflow-y:auto;overscroll-behavior:contain;
  box-shadow:0 -8px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,220,180,.14);
  animation:monter .8s .1s cubic-bezier(.2,.8,.3,1) backwards}
@keyframes monter{from{opacity:0;transform:translateY(24px)}}
.onglets{display:flex;gap:22px;justify-content:center;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:14px}
.onglets button{padding:0 0 9px;font:600 13px system-ui;color:var(--doux);
  border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s}
.onglets button.on{color:#f5efe2;border-bottom-color:var(--braise)}
label{display:block;font:400 11px system-ui;color:var(--doux);margin:0 0 5px 3px}
.champ{display:flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.16);border-radius:13px;
  padding:0 12px;margin-bottom:9px;background:rgba(255,255,255,.03);
  transition:border-color .16s,box-shadow .16s}
.champ:focus-within{border-color:rgba(240,130,47,.6);box-shadow:0 0 0 3px rgba(226,98,31,.16)}
.champ input{flex:1;min-width:0;padding:13px 0;outline:none;color:var(--os)}
.champ input::placeholder{color:var(--doux)}
.oeil{padding:6px;display:flex;color:var(--doux)}
.oubli{display:block;width:100%;text-align:right;font:400 11.5px system-ui;color:var(--doux);margin-top:2px}
.valider{width:100%;margin-top:14px;border-radius:15px;padding:15px;text-align:center;
  background:linear-gradient(180deg,var(--braise-c),#c2531a);font:600 15px system-ui;color:#fff6ea;
  box-shadow:0 10px 26px rgba(226,98,31,.42),inset 0 1px 0 rgba(255,220,180,.5)}
.valider:active{transform:translateY(2px)}
.valider:disabled{opacity:.6}
.sans{display:block;width:100%;text-align:center;font:600 12px system-ui;color:var(--doux);margin-top:12px;padding:6px}
.msg{font:400 12.5px/1.5 system-ui;border-radius:11px;padding:10px 12px;margin-top:12px;display:none}
.msg.on{display:block}
.msg.err{background:rgba(200,70,60,.18);color:#f0b0a4;border:1px solid rgba(200,70,60,.3)}
.msg.ok{background:rgba(120,190,110,.16);color:#bfe6b2;border:1px solid rgba(120,190,110,.3)}

@keyframes brz{0%{transform:translate(0,0) scale(1);opacity:.95}
  100%{transform:translate(var(--dx,10px),-140px) scale(.25);opacity:0}}
@keyframes fA{0%,100%{transform:scaleY(1) scaleX(1) translateX(0)}
  35%{transform:scaleY(1.14) scaleX(.93) translateX(-1px)}
  70%{transform:scaleY(.95) scaleX(1.05) translateX(1px)}}
@keyframes fB{0%,100%{transform:scaleY(.96) scaleX(1.04)}50%{transform:scaleY(1.12) scaleX(.94)}}
@keyframes halo3{0%,100%{opacity:.5;transform:scale(1)}45%{opacity:.85;transform:scale(1.06)}}
@keyframes fum3{0%{transform:translate(0,0) scale(.6);opacity:.22}
  100%{transform:translate(-24px,-160px) scale(2.8);opacity:0}}
@keyframes sc3{0%,100%{opacity:.25}50%{opacity:.9}}
@keyframes bal3{0%,100%{transform:rotate(-.5deg)}50%{transform:rotate(.5deg)}}
.etoile{animation:sc3 4s ease-in-out infinite}
.bois-loin{animation:bal3 9s ease-in-out infinite;transform-origin:200px 300px}
.bois-pres{animation:bal3 11s ease-in-out infinite;transform-origin:200px 360px}
.halo{animation:halo3 3.2s ease-in-out infinite}
.fumee circle{animation:fum3 7.5s ease-out infinite}
.fumee circle.f2{animation-delay:-3.7s}
.flamA{animation:fA .9s ease-in-out infinite;transform-origin:200px 510px}
.flamB{animation:fB 1.3s ease-in-out infinite;transform-origin:200px 510px}
.braise{animation:brz 4s linear infinite}

@media (max-height:700px){
  .titre{top:max(4vh,26px)}
  .titre h1{font-size:36px}
  .titre .filet{margin:12px auto}
}
</style>
</head>
<body>
<div id="scene"></div>

<div class="titre">
  <div class="kicker">JOUR 1 · TU ES SEUL</div>
  <h1>Tenir<br>jusqu'à l'aube</h1>
  <div class="filet"></div>
</div>

<div class="panneau">
  <div class="onglets">
    <button id="t-co" class="on">Reprendre</button>
    <button id="t-in">Nouvelle vie</button>
  </div>

  <div id="bloc-nom" style="display:none">
    <label for="pseudo">Ton nom de survivant</label>
    <div class="champ">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a89a86" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3 4 20h16z"/><path d="M9 20l3-7 3 7"/></svg>
      <input id="pseudo" maxlength="18" autocomplete="nickname" placeholder="Sans nom">
    </div>
  </div>

  <label for="email">Adresse e-mail</label>
  <div class="champ">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a89a86" stroke-width="1.9" stroke-linecap="round">
      <circle cx="12" cy="8" r="4"/><path d="M4.5 20c1.6-4 4.4-6 7.5-6s5.9 2 7.5 6"/></svg>
    <input id="email" type="email" autocomplete="email" placeholder="toi@exemple.fr">
  </div>

  <label for="mdp">Mot de passe</label>
  <div class="champ">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a89a86" stroke-width="1.9" stroke-linejoin="round">
      <rect x="4" y="10.5" width="16" height="10" rx="2.5"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>
    <input id="mdp" type="password" autocomplete="current-password" placeholder="••••••••">
    <button class="oeil" id="oeil" aria-label="Afficher">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
        <path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.6"/></svg>
    </button>
  </div>

  <button class="oubli" id="oubli">Mot de passe oublié ?</button>
  <div class="msg" id="msg"></div>
  <button class="valider" id="valider">Retourner là-bas</button>
  <button class="sans" id="invite">entrer sans compte</button>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient('https://zpfkekiavlfphialvphi.supabase.co',
                      'sb_publishable__dfR2lEOwKjhhtavvJEvGw_KVACZnHP');
const $=id=>document.getElementById(id);

/* ================= le bivouac ================= */

    [268,40,1.4,-2.6],[372,58,1.5,-3],[60,132,1,-2.2],[184,150,1.2,-.4],[322,150,1.1,-1.4]]
    .map(([x,y,r,d])=>`<circle class="etoile" cx="${x}" cy="${y}" r="${r}" style="animation-delay:${d}s"/>`).join('');
  const loin=[[6,.44],[34,.36],[62,.5],[92,.38],[120,.46],[150,.34],[176,.48],
              [208,.4],[238,.52],[270,.36],[298,.46],[330,.4],[362,.5],[392,.38]]
    .map(([x,s],i)=>`<g transform="translate(${x} ${300+(i%2?4:0)}) scale(${s})"><use href="#sapinClair"/></g>`).join('');
  const pres=[[-6,352,.86,'sapin'],[40,358,1.06,'sapin'],[96,352,.74,'nu'],[132,360,.94,'sapin'],

  const braises=[[190,452,2.4,-26,3.4,0],[208,460,1.9,20,4.2,-1.2],[200,444,1.6,8,3.8,-2.2],

      style="--dx:${dx}px;animation-duration:${d}s;animation-delay:${de}s"/>`).join('');
  return `<svg viewBox="0 0 400 620" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">

    <linearGradient id="s3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#28351f"/><stop offset="1" stop-color="#121a11"/></linearGradient>

    <filter id="fl3"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="g3"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".1"/></feComponentTransfer></filter>
    <radialGradient id="v3" cx=".5" cy=".55" r=".78">
      <stop offset=".45" stop-color="rgba(0,0,0,0)"/><stop offset="1" stop-color="rgba(0,0,0,.62)"/></radialGradient>
    <g id="sapin">
      <path d="M0 0 v-86" stroke="#0a120e" stroke-width="5"/>
      <path d="M0 -84 l-7 10 l4 0 l-11 12 l6 0 l-15 14 l8 0 l-19 16 l10 0 l-23 18 l52 0 l0 -70z" fill="#0b1510"/>
      <path d="M0 -84 l7 10 l-4 0 l11 12 l-6 0 l15 14 l-8 0 l19 16 l-10 0 l23 18 l-52 0 l0 -70z" fill="#08110c"/></g>
    <g id="sapinClair">
      <path d="M0 0 v-86" stroke="#132019" stroke-width="5"/>
      <path d="M0 -84 l-7 10 l4 0 l-11 12 l6 0 l-15 14 l8 0 l-19 16 l10 0 l-23 18 l52 0 l0 -70z" fill="#16241b"/>
      <path d="M0 -84 l7 10 l-4 0 l11 12 l-6 0 l15 14 l-8 0 l19 16 l-10 0 l23 18 l-52 0 l0 -70z" fill="#111d15"/></g>
    <g id="nu">
      <path d="M0 0 v-58" stroke="#0a120e" stroke-width="5" stroke-linecap="round"/>
      <g stroke="#0a120e" stroke-width="3.4" fill="none" stroke-linecap="round">
        <path d="M0 -40 q-14-6 -20-22"/><path d="M-14 -49 q-4-8 -12-11"/>
        <path d="M0 -46 q14-8 19-24"/><path d="M13 -57 q6-7 14-8"/>
        <path d="M0 -56 q-6-12 -3-24"/><path d="M0 -58 q7-10 15-13"/></g></g>
  </defs>

  <rect width="400" height="620" fill="url(#c3)"/>
  <ellipse cx="230" cy="118" rx="230" ry="50" fill="#41567c" opacity=".13" filter="url(#fl3)" transform="rotate(-18 230 118)"/>
  <g fill="#eaf2ff">${etoiles}</g>
  <circle cx="322" cy="84" r="44" fill="#dfe9e4" opacity=".15" filter="url(#fl3)"/>
  <circle cx="322" cy="84" r="20" fill="url(#l3)"/>
  <g fill="#b9c7bd" opacity=".5"><circle cx="316" cy="78" r="4"/><circle cx="328" cy="90" r="3"/></g>

  <g class="bois-loin" opacity=".5">${loin}</g>
  <ellipse cx="200" cy="304" rx="250" ry="20" fill="#9fc0b6" opacity=".14" filter="url(#fl3)"/>
  <g class="bois-pres">${pres}</g>

  <path d="M-10 366 Q110 350 250 368 Q330 378 410 360 L410 620 L-10 620Z" fill="url(#s3)"/>
  <g stroke="#3d5531" stroke-width="1.7" stroke-linecap="round" opacity=".45">
    <path d="M40 424v-9"/><path d="M84 456v-9"/><path d="M330 440v-9"/><path d="M368 474v-9"/>
    <path d="M22 504v-10"/><path d="M356 532v-10"/><path d="M256 412v-8"/><path d="M144 404v-8"/></g>
  <g fill="#1d2a1a" opacity=".8">
    <ellipse cx="66" cy="398" rx="20" ry="6"/><ellipse cx="316" cy="392" rx="16" ry="5"/></g>

  <ellipse class="halo" cx="200" cy="504" rx="218" ry="152" fill="url(#h3)"/>

  <g><ellipse cx="84" cy="474" rx="52" ry="10" fill="rgba(0,0,0,.45)"/>
    <path d="M40 472 L84 410 L128 472 Z" fill="#39492f"/>
    <path d="M84 410 L128 472 L112 472 L84 426Z" fill="#2a3724"/>
    <path d="M76 472 L84 426 L92 472Z" fill="#131b13"/>
    <path d="M40 472 l-11 8M128 472 l11 8" stroke="#2a3724" stroke-width="3" stroke-linecap="round"/></g>
  <g><ellipse cx="312" cy="500" rx="46" ry="9" fill="rgba(0,0,0,.45)"/>
    <rect x="268" y="472" width="88" height="24" rx="12" fill="#48381f"/>
    <ellipse cx="356" cy="484" rx="9" ry="12" fill="#6b5334"/>
    <ellipse cx="356" cy="484" rx="5" ry="7" fill="#7d6440"/>
    <rect x="268" y="472" width="88" height="7" rx="4" fill="#5c4a2c" opacity=".8"/></g>

  <ellipse cx="200" cy="518" rx="76" ry="24" fill="#0d140e"/>
  <g fill="#4a4f4c">
    <ellipse cx="146" cy="518" rx="15" ry="10"/><ellipse cx="180" cy="530" rx="16" ry="10"/>
    <ellipse cx="220" cy="530" rx="16" ry="10"/><ellipse cx="254" cy="518" rx="15" ry="10"/>
    <ellipse cx="164" cy="506" rx="13" ry="8"/><ellipse cx="238" cy="506" rx="13" ry="8"/></g>
  <g fill="#69716d" opacity=".7">
    <ellipse cx="144" cy="514" rx="9" ry="5"/><ellipse cx="178" cy="526" rx="9" ry="5"/>

    <path d="M200 426 q34 42 24 62 q-8 16 -24 16 q-16 0 -24-16 q-10-20 24-62z" fill="#d94f18" opacity=".95"/></g>
  <g class="flamB">

  <g fill="#ffbe63">${braises}</g>

  <g><ellipse cx="128" cy="558" rx="26" ry="8" fill="rgba(0,0,0,.5)"/>
    <path d="M106 554 q0-30 22-30 q22 0 22 30z" fill="#463623"/>
    <rect x="108" y="538" width="40" height="9" rx="4" fill="#5a4830"/>

$('scene').innerHTML=SCENE();

/* ================= connexion ================= */
let mode='co';
const afficher=(t,k)=>{const m=$('msg');m.textContent=t;m.className='msg on '+(k||'');};
const cacher=()=>{$('msg').className='msg';};
function basculer(m){
  mode=m;cacher();
  $('t-co').classList.toggle('on',m==='co');
  $('t-in').classList.toggle('on',m==='in');
  $('bloc-nom').style.display=m==='in'?'block':'none';
  $('oubli').style.display=m==='co'?'block':'none';
  $('valider').textContent=m==='co'?'Retourner là-bas':'Commencer à survivre';
  $('mdp').autocomplete=m==='co'?'current-password':'new-password';
}
$('t-co').onclick=()=>basculer('co');
$('t-in').onclick=()=>basculer('in');
$('oeil').onclick=()=>{const c=$('mdp');c.type=c.type==='password'?'text':'password';};

$('valider').onclick=async()=>{
  const email=$('email').value.trim(), mdp=$('mdp').value, nom=$('pseudo').value.trim()||'Sans nom';
  if(!email||!mdp)return afficher('Il manque l’adresse ou le mot de passe.','err');
  if(mode==='in'&&mdp.length<8)return afficher('Le mot de passe doit faire au moins 8 caractères.','err');
  const b=$('valider');b.disabled=true;const av=b.textContent;b.textContent='Un instant…';cacher();
  try{
    if(mode==='co'){
      const {error}=await sb.auth.signInWithPassword({email,password:mdp});
      if(error)throw error;location.href='jeu.html';
    }else{
      const {data,error}=await sb.auth.signUp({email,password:mdp,options:{data:{nom}}});
      if(error)throw error;
      try{localStorage.setItem('bdl.nom',nom);}catch(x){}
      if(data.session){location.href='jeu.html';return;}
      afficher('Compte créé. Confirme ton adresse par e-mail, puis reviens.','ok');
      basculer('co');
    }
  }catch(err){
    const t=(err&&err.message)||'';
    afficher(/Invalid login/i.test(t)?'Adresse ou mot de passe incorrect.':
      /already registered/i.test(t)?'Cette adresse a déjà un survivant.':
      'Ça n’a pas marché : '+t,'err');
  }finally{b.disabled=false;b.textContent=av;}
};
$('oubli').onclick=async()=>{
  const email=$('email').value.trim();
  if(!email)return afficher('Écris ton adresse, je t’envoie un lien.','err');
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin});
  afficher(error?('Échec : '+error.message):'Lien de réinitialisation envoyé.',error?'err':'ok');
};
$('invite').onclick=()=>{try{localStorage.setItem('bdl.invite','1');}catch(x){}location.href='jeu.html';};
document.addEventListener('keydown',ev=>{if(ev.key==='Enter')$('valider').click();});
sb.auth.getSession().then(({data})=>{if(data&&data.session)location.href='jeu.html';});
</script>
</body>
</html>
