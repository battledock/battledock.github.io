<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Battle Dock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:'Nunito',sans-serif;color:#12243e}
.app{height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:#c8d8ea}
.bg-rotate{position:absolute;inset:-50%;z-index:0;background:conic-gradient(from 0deg at 50% 50%,rgba(59,130,246,.2),rgba(20,160,200,.15),rgba(100,140,240,.18),rgba(20,112,168,.2),rgba(59,130,246,.15),rgba(20,160,200,.2),rgba(59,130,246,.2));filter:blur(60px);animation:rotate 20s linear infinite}
@keyframes rotate{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.app::after{content:'';position:absolute;bottom:0;left:0;right:0;height:45%;background:linear-gradient(180deg,transparent,rgba(235,242,250,.85) 50%,#e8eff8);z-index:1;pointer-events:none}
.content{position:relative;z-index:2;height:100%;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;padding:14px 18px;padding-top:calc(14px + env(safe-area-inset-top));flex-shrink:0}
.topbar-logo{font-family:'Oswald',sans-serif;font-size:1rem;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:rgba(18,36,62,.35)}
.topbar-logo span{color:#1470a8}
.topbar-spacer{flex:1}
.topbar-count{background:rgba(20,112,168,.12);border-radius:100px;padding:6px 14px;font-size:.55rem;font-weight:900;color:#1470a8}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 22px}
.mid h1{font-family:'Oswald',sans-serif;font-size:clamp(1.8rem,8vw,2.6rem);font-weight:700;line-height:.95;letter-spacing:1px;text-transform:uppercase;color:#12243e}
.mid h1 .wh{color:#fff;text-shadow:0 2px 12px rgba(18,36,62,.2)}
.mid h1 .bl{color:#1470a8}
.mid p{font-size:.75rem;font-weight:700;color:rgba(18,36,62,.35);margin-top:8px;line-height:1.5}
.feed{display:flex;flex-direction:column;gap:5px;margin-top:16px;max-height:130px;overflow:hidden;mask-image:linear-gradient(180deg,#000 65%,transparent);-webkit-mask-image:linear-gradient(180deg,#000 65%,transparent)}
.fi{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:12px;padding:9px 12px}
.fi .e{font-size:.9rem;flex-shrink:0}
.fi .t{font-size:.65rem;font-weight:700;color:rgba(18,36,62,.4);flex:1;line-height:1.3}
.fi .t strong{color:#12243e;font-weight:900}
.fi .tm{font-size:.45rem;font-weight:800;color:rgba(18,36,62,.2);flex-shrink:0}
.sheet{flex-shrink:0;background:#fff;border-radius:24px 24px 0 0;padding:22px 20px;padding-bottom:calc(18px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(18,36,62,.06)}
.tabs{display:flex;gap:0;border-bottom:2px solid #edf0f4;margin-bottom:16px}
.tab{flex:1;padding:11px 0;text-align:center;font-size:.75rem;font-weight:900;border:none;background:none;cursor:pointer;font-family:inherit;color:#b8c4d0;border-bottom:2.5px solid transparent;margin-bottom:-2px;transition:.2s;-webkit-tap-highlight-color:transparent}
.tab.active{color:#1470a8;border-bottom-color:#1470a8}
.fields{display:flex;gap:8px;margin-bottom:8px}
.fields.col{flex-direction:column;gap:8px}
.field input{width:100%;padding:14px 16px;background:#f4f6fa;border:2px solid #edf0f4;border-radius:10px;font-family:inherit;font-size:.86rem;font-weight:700;color:#12243e;outline:none;-webkit-appearance:none;transition:border-color .2s}
.field input:focus{border-color:#1470a8}
.field input::placeholder{color:#b8c4d0}
.sheet-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.remember{display:flex;align-items:center;gap:4px;font-size:.58rem;font-weight:700;color:#b8c4d0;cursor:pointer}
.remember input{accent-color:#1470a8;width:14px;height:14px}
.forgot{font-size:.6rem;font-weight:900;color:#1470a8;text-decoration:none}
.btn{width:100%;padding:15px;background:linear-gradient(135deg,#1470a8,#1060a0);color:#fff;font-family:inherit;font-size:.88rem;font-weight:900;border:none;border-radius:10px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .1s,opacity .1s;box-shadow:0 4px 16px rgba(20,112,168,.2)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;transform:none}
.error{text-align:center;font-size:.65rem;font-weight:800;color:#dc3545;margin-top:8px;min-height:1em}
.ver{text-align:center;margin-top:12px;font-size:.48rem;font-weight:700;color:#c8d0d8;letter-spacing:1px}
</style>
</head>
<body>
<div class="app">
  <div class="bg-rotate"></div>
  <div class="content">
    <div class="topbar">
      <div class="topbar-logo">BATTLE <span>DOCK</span></div>
      <div class="topbar-spacer"></div>
      <div class="topbar-count" id="count">— joueurs inscrits</div>
    </div>
    <div class="mid">
      <h1><span class="wh">MARSEILLE</span><br>CHERCHE SON<br><span class="bl">PROCHAIN MAIRE</span></h1>
      <p>111 quartiers. Des alliances. Des trahisons.<br>Un seul accèdera à l'Hôtel de Ville.</p>
      <div class="feed" id="feed"></div>
    </div>
    <div class="sheet">
      <div class="tabs">
        <button class="tab active" id="tabLogin" onclick="sw('c')">Connexion</button>
        <button class="tab" id="tabSignup" onclick="sw('i')">Inscription</button>
      </div>
      <form id="c" onsubmit="login(event)">
        <div class="fields"><div class="field"><input type="text" id="loginPseudo" placeholder="Pseudo" required></div><div class="field"><input type="password" id="loginPwd" placeholder="Mot de passe" required></div></div>
        <div class="sheet-row"><label class="remember"><input type="checkbox" checked> Se souvenir</label><a class="forgot" href="#">Oublié ?</a></div>
        <button class="btn" type="submit" id="btnLogin">Se connecter</button>
        <div class="error" id="errLogin"></div>
      </form>
      <form id="i" style="display:none" onsubmit="signup(event)">
        <div class="fields col"><div class="field"><input type="text" id="signupPseudo" placeholder="Pseudo" required></div><div class="field"><input type="email" id="signupEmail" placeholder="Email" required></div><div class="field"><input type="password" id="signupPwd" placeholder="Mot de passe (min. 6)" required minlength="6"></div></div>
        <button class="btn" type="submit" id="btnSignup" style="margin-top:10px">Créer mon compte</button>
        <div class="error" id="errSignup"></div>
      </form>
      <div class="ver">version 1.0</div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL='https://snqynahqxqjmdigbmiag.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNucXluYWhxeHFqbWRpZ2JtaWFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxNzQyMTksImV4cCI6MjA5OTc1MDIxOX0.eLMtvtEtvrfSSSi7-SCgo_wGMLWbhWpLSLM49QwpqY8';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);

// Déjà connecté ?
sb.auth.getSession().then(({data:{session}})=>{
  if(!session)return;
  sb.from('players').select('onboarding_done').eq('id',session.user.id).maybeSingle().then(({data})=>{
    if(data&&data.onboarding_done) window.location.href='jeu.html';
    else window.location.href='profil.html';
  });
});

// Compteur
(async()=>{const{data}=await sb.rpc('get_player_count');if(data!==null)document.getElementById('count').textContent=data+' joueurs inscrits'})();

// Inscription
async function signup(e){
  e.preventDefault();
  const pseudo=document.getElementById('signupPseudo').value.trim();
  const email=document.getElementById('signupEmail').value.trim();
  const pwd=document.getElementById('signupPwd').value;
  const err=document.getElementById('errSignup');
  const btn=document.getElementById('btnSignup');
  err.textContent='';
  if(!pseudo||!email||!pwd){err.textContent='Remplis tous les champs';return}
  if(pwd.length<6){err.textContent='6 caractères minimum';return}

  const{data:existing}=await sb.from('players').select('id').eq('pseudo',pseudo).maybeSingle();
  if(existing){err.textContent='Ce pseudo est déjà pris';return}

  btn.disabled=true;btn.textContent='Création...';
  const{data:authData,error:authErr}=await sb.auth.signUp({email,password:pwd});
  if(authErr){err.textContent=authErr.message;btn.disabled=false;btn.textContent='Créer mon compte';return}

  const{error:insertErr}=await sb.from('players').insert({id:authData.user.id,pseudo,email});
  if(insertErr){err.textContent=insertErr.message;btn.disabled=false;btn.textContent='Créer mon compte';return}

  window.location.href='profil.html';
}

// Connexion
async function login(e){
  e.preventDefault();
  const pseudo=document.getElementById('loginPseudo').value.trim();
  const pwd=document.getElementById('loginPwd').value;
  const err=document.getElementById('errLogin');
  const btn=document.getElementById('btnLogin');
  err.textContent='';
  if(!pseudo||!pwd){err.textContent='Remplis tous les champs';return}

  btn.disabled=true;btn.textContent='Connexion...';
  const{data:player}=await sb.from('players').select('email,onboarding_done').eq('pseudo',pseudo).maybeSingle();
  if(!player){err.textContent='Pseudo inconnu';btn.disabled=false;btn.textContent='Se connecter';return}

  const{error:authErr}=await sb.auth.signInWithPassword({email:player.email,password:pwd});
  if(authErr){err.textContent='Mot de passe incorrect';btn.disabled=false;btn.textContent='Se connecter';return}

  window.location.href=player.onboarding_done?'jeu.html':'profil.html';
}

// Tabs
function sw(f){
  document.getElementById('tabLogin').classList.toggle('active',f==='c');
  document.getElementById('tabSignup').classList.toggle('active',f==='i');
  document.getElementById('c').style.display=f==='c'?'block':'none';
  document.getElementById('i').style.display=f==='i'?'block':'none';
}

// Feed
const msgs=[{e:'⚔️',t:'<strong>Tom</strong> attaque Le Panier',tm:'maintenant'},{e:'😈',t:'<strong>Paco13</strong> a trahi son allié',tm:'2 min'},{e:'🗳️',t:'Élection dans <strong>2 jours et 1h04</strong>',tm:'5 min'},{e:'🔥',t:'Rébellion à <strong>La Belle de Mai</strong>',tm:'8 min'}];
const feed=document.getElementById('feed');
msgs.forEach(m=>{const d=document.createElement('div');d.className='fi';d.innerHTML=`<span class="e">${m.e}</span><span class="t">${m.t}</span><span class="tm">${m.tm}</span>`;feed.appendChild(d)});
</script>
</body>
</html>
