    .container {
      width: 100%;
      max-width: 340px;
      text-align: center;
      padding: 20px;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 20px;
      display: block;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 52px;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: 6px;
      word-spacing: 20px;
      filter: drop-shadow(3px 3px 0 #000);
      white-space: nowrap;
    }
    .sub {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 10px;
      letter-spacing: 6px;
      color: #ffffff;
      margin-bottom: 50px;
    }
    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 50px;
    }
    .button {
      display: inline-block;
      padding: 12px 30px;
      background: #1a1a1a;
      color: #ffffff;
      text-decoration: none;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      letter-spacing: 3px;
      border: 2px solid #1a1a1a;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .button:hover {
      background: #ffffff;
      color: #1a1a1a;
      border-color: #ffffff;
    }
    .line {
      width: 100px;
      height: 2px;
      background: #ffffff;
      margin: 24px auto;
    }
    .dots {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 24px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff6b6b;
      animation: pulse 1.4s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: .2s; background: #ffd93d; }
    .dot:nth-child(3) { animation-delay: .4s; background: #6bcf7f; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.3); opacity: 1; }
    }
    .version {
      margin-top: 0px;
      font-size: 10px;
      color: #ffffff;
      letter-spacing: 3px;
      font-family: 'Bebas Neue', sans-serif;
      background: transparent;
      padding: 0;
      display: inline-block;
    }
    .modal {
      display: none;
      position: fixed;
      z-index: 1;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(15px);
    }
    .modal-content {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      margin: auto;
      padding: 35px 30px;
      width: 90%;
      max-width: 320px;
      border-radius: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      max-height: 80vh;
      overflow-y: auto;
      border: none;
    }
    .modal-content h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #ffffff;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      letter-spacing: 3px;
    }
    .close {
      color: rgba(255, 255, 255, 0.6);
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 24px;
      font-weight: 300;
      cursor: pointer;
      transition: color 0.3s ease;
    }
    .close:hover {
      color: #ffffff;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 20px;
    }
    input {
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border-radius: 0;
      font-size: 16px;
      transition: all 0.3s ease;
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 2px;
    }
    input:focus {
      outline: none;
      border-color: rgba(255, 255, 255, 0.4);

    const { createClient } = supabase;

    function openModal(modalId) {

      const { data: { user }, error } = await supabaseClient.auth.signUp({

        password: password,
      });

      if (error) {
        alert('Erreur lors de l\'inscription : ' + error.message);
      } else {

          .from('profiles')
          .insert({ user_id: user.id, username: username });

        if (profileError) {

      });

        alert('Erreur lors de la connexion : ' + error.message);
      } else {

        localStorage.setItem('username', username);
        alert('Connexion réussie !');

      const username = document.getElementById('forgot-password-username').value;

      const { data: users, error } = await supabaseClient
        .from('profiles')
        .select('user_id')
        .eq('username', username);

      if (error || users.length === 0) {
        alert('Nom d\'utilisateur non trouvé.');
      } else {
        alert('Un e-mail de réinitialisation de mot de passe a été envoyé à votre adresse e-mail.');
        closeModal('forgot-password-modal');
        openModal('reset-password-modal');

    });

    document.getElementById('reset-password-form').addEventListener('submit', async (event) => {

      const username = document.getElementById('reset-password-username').value;
      const newPassword = document.getElementById('reset-password-new-password').value;
      const confirmPassword = document.getElementById('reset-password-confirm-password').value;

        .select('user_id')
