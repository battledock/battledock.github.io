const afficher=(t,k)=>{const m=$('msg');m.textContent=t;m.className='msg on '+(k||'');};
const cacher=()=>{$('msg').className='msg';};
function basculer(m){
mode=m;cacher();
$('t-co').classList.toggle('on',m==='co');
$('t-in').classList.toggle('on',m==='in');
$('bloc-nom').style.display=m==='in'?'block':'none';
$('oubli').style.display=m==='co'?'block':'none';
$('valTexte').textContent=m==='co'?'Embarquer':'Rejoindre le port';
$('mdp').autocomplete=m==='co'?'current-password':'new-password';
}
$('t-co').onclick=()=>basculer('co');
$('t-in').onclick=()=>basculer('in');
$('oeil').onclick=()=>{const c=$('mdp');c.type=c.type==='password'?'text':'password';};
$('valider').onclick=async()=>{
const email=$('email').value.trim(), mdp=$('mdp').value, nom=$('pseudo').value.trim()||'Sans nom';
if(!email||!mdp)return afficher('Il manque l’adresse ou le mot de passe.','err');
if(mode==='in'&&mdp.length<8)return afficher('Le mot de passe doit faire au moins 8 caractères.','err');
const b=$('valider');b.disabled=true;const av=b.textContent;b.textContent='Un instant…';cacher();
try{
if(mode==='co'){
const {error}=await sb.auth.signInWithPassword({email,password:mdp});
if(error)throw error;allerAuJeu();
}else{
const {data,error}=await sb.auth.signUp({email,password:mdp,options:{data:{nom}}});
if(error)throw error;
try{localStorage.setItem('bdl.nom',nom);}catch(x){}
if(data.session){allerAuJeu();return;}
afficher('Compte créé. Confirme ton adresse par e-mail, puis reviens.','ok');
basculer('co');
}
}catch(err){
const t=(err&&err.message)||'';
afficher(/Invalid login/i.test(t)?'Adresse ou mot de passe incorrect.':
/already registered/i.test(t)?'Cette adresse a déjà un survivant.':
'Ça n’a pas marché : '+t,'err');
}finally{b.disabled=false;b.textContent=av;}
};
$('oubli').onclick=async()=>{
const email=$('email').value.trim();
if(!email)return afficher('Écris ton adresse, je t’envoie un lien.','err');
const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin});
afficher(error?('Échec : '+error.message):'Lien de réinitialisation envoyé.',error?'err':'ok');
};
document.addEventListener('keydown',ev=>{if(ev.key==='Enter')$('valider').click();});
/* LA RECONNEXION DEMANDEE PAR UNE SALLE. Le casino ou l'arcade envoyaient ici
   un joueur dont la session ne passait plus ; mais l'accueil voyait encore
   une session dans le téléphone et le renvoyait aussitôt sur le port. Le
   joueur tournait en rond : « ça me remet sur le port ». Avec ?reco=1, on
   efface la session locale, on montre le formulaire, et après la connexion
   on le ramène dans la salle d'où il venait. */
const Q=new URLSearchParams(location.search);
const RECO=Q.get('reco')==='1';
const RETOUR=(()=>{const r=Q.get('retour')||'';return /^[a-z_]+\.html$/.test(r)?r:'';})();
if(RETOUR){window.allerAuJeu=function(){location.href=RETOUR+'?v='+encodeURIComponent(window.__VJEU||Date.now());};}
if(RECO){try{sb.auth.signOut({scope:'local'});}catch(x){}
  try{afficher('Reconnecte-toi : même adresse, même mot de passe. Tu reviens ensuite où tu étais.','ok');}catch(x){}}
else sb.auth.getSession().then(({data})=>{if(data&&data.session)allerAuJeu();});</script>
<script>const $=(i)=>document.getElementById(i);
/* ================= LE PORT AU LEVER DU JOUR =================
   Le décor de l'accueil est dessiné à la grille, comme les écrans de
   chargement du jeu : un « pixel » vaut U points, et U grandit avec
   l'écran, si bien que l'image reste franche du téléphone à la tablette,
   debout comme couchée. #pre porte la scène, #vie les mouettes et les
   reflets, qui seuls bougent. */
function al(n){var v=Math.sin(n*12.9898)*43758.5453;return v-Math.floor(v);}
function Pix(g,U){return function(x,y,w,h,c){if(w<=0||h<=0)return;g.fillStyle=c;
  g.fillRect(Math.round(x)*U,Math.round(y)*U,Math.max(1,Math.round(w))*U,Math.max(1,Math.round(h))*U);};}
function disque(P,cx,cy,r,c){for(var y=-r;y<=r;y++){var w=Math.round(Math.sqrt(Math.max(0,r*r-y*y)));if(w>0)P(cx-w,cy+y,w*2,1,c);}}
function ciel(P,Wu,hz,B){
  for(var i=0;i<B.length;i++){var y0=Math.round(hz*i/B.length),y1=Math.round(hz*(i+1)/B.length);
    P(0,y0,Wu,y1-y0,B[i]);
    if(i)for(var x=0;x<Wu;x++)if(al(x*3.1+i*7)<0.42)P(x,y0,1,1,B[i-1]);}}
function soleil(P,cx,cy,r){
  for(var k=3;k>=1;k--)disque(P,cx,cy,r+k*Math.max(1,Math.round(r*0.5)),'rgba(255,214,140,'+[0.10,0.18,0.30][k-1]+')');
  disque(P,cx,cy,r,'#ffe49a');disque(P,cx,cy,r-Math.max(1,Math.round(r*0.3)),'#fff6d8');}
function nuage(P,x,y,s,c){[[0,1,4,1],[1,0,3,1],[-1,2,7,1],[0,3,5,1]].forEach(function(f){P(x+f[0]*s,y+f[1]*s,f[2]*s,f[3]*s,c);});}
function mouettes(P,Wu,Hu,s){
  for(var b=0;b<5;b++){var x=Math.round(Wu*(0.14+b*0.14)),y=Math.round(Hu*(0.10+al(b*3)*0.10));
    P(x-2*s,y,s,s,'#fbf6ec');P(x-s,y-s,s,s,'#fbf6ec');P(x,y,s,s,'#fbf6ec');P(x+s,y-s,s,s,'#fbf6ec');P(x+2*s,y,s,s,'#fbf6ec');}}
function mer(P,Wu,hz,bas,s){
  var B=['#4e7fa8','#44749c','#3b6890','#325c84','#2a5178'];
  for(var i=0;i<B.length;i++){var y0=hz+Math.round((bas-hz)*i/B.length),y1=hz+Math.round((bas-hz)*(i+1)/B.length);
    P(0,y0,Wu,y1-y0,B[i]);}
  P(0,hz,Wu,Math.max(1,s),'#9ec8e0');
  for(var k=0;k<90;k++){var t=al(k*7.3),x=Math.round(al(k*2.1)*Wu),
      y=hz+Math.round(Math.pow(t,1.5)*(bas-hz)),L=Math.max(1,Math.round(1+t*4*s));
    P(x,y,L,Math.max(1,Math.round(s*0.7)),t<0.5?'rgba(220,240,250,.45)':'rgba(255,255,255,.28)');}}
function colline(P,Wu,hz,s){
  /* deux plans : la crête lointaine, puis la colline de la Garde */
  var pas=Math.max(2,Math.round(Wu/30));
  for(var x=0;x<Wu;x+=pas){var h=Math.round(Math.abs(Math.sin((x/Wu)*3.4+2.1))*s*3)+s;
    P(x,hz-h,pas,h+2,'#7c7f86');P(x,hz-h,pas,1,'#93959c');}
  for(var x=0;x<Wu;x+=pas){var h=Math.round(Math.pow(Math.max(0,Math.sin((x/Wu)*2.2+0.55)),1.6)*s*7)+s;
    P(x,hz-h,pas,h+2,'#5f6e4c');P(x,hz-h,pas,Math.max(1,Math.round(s*0.6)),'#7a8a5e');
    if(al(x*1.7)<0.22)P(x,hz-h+Math.round(s*0.8),pas,Math.max(1,Math.round(s*0.5)),'#4e5c3e');}}
function ndg(P,x,sol,s){
  /* Notre-Dame de la Garde : le soubassement, la nef, le clocher, la Bonne Mère */
  P(x-7*s,sol-4*s,14*s,4*s,'#6e7064');P(x-7*s,sol-4*s,14*s,s,'#8d8f80');
  P(x-5*s,sol-8*s,10*s,4*s,'#e8e2d2');P(x-5*s,sol-8*s,5*s,4*s,'#f6f1e2');
  for(var k=0;k<4;k++)P(x-4*s+k*2*s,sol-7*s,s,2*s,'#6b6f66');
  P(x-6*s,sol-9*s,12*s,s,'#b85e3a');
  P(x+2*s,sol-12*s,3*s,4*s,'#e8e2d2');P(x+2*s,sol-12*s,s,4*s,'#f6f1e2');   /* la coupole */
  P(x-2*s,sol-20*s,4*s,11*s,'#e8e2d2');P(x-2*s,sol-20*s,2*s,11*s,'#f6f1e2');
  for(var k=0;k<3;k++)P(x-s,sol-18*s+k*3*s,2*s,2*s,'#6b6f66');
  P(x-3*s,sol-21*s,6*s,s,'#b85e3a');
  P(x-s,sol-24*s,2*s,3*s,'#f0cf6a');P(x-2*s,sol-25*s,4*s,s,'#f6dc8c');
  P(x-s,sol-26*s,2*s,s,'#fff0b0');}
function quai(P,Wu,y,Hu,s){
  P(0,y,Wu,Hu-y,'#8a8276');
  for(var r=0;r<Math.ceil((Hu-y)/(2*s));r++){var yy=y+r*2*s;
    for(var x=(r%2?-s:0);x<Wu;x+=4*s){P(x,yy,4*s-1,2*s-1,r%2?'#938b7e':'#89806f');
      P(x,yy,4*s-1,Math.max(1,Math.round(s*0.5)),r%2?'#a79e8e':'#9a9183');}}
  P(0,y,Wu,Math.max(1,s),'#b3a996');P(0,y-Math.max(1,s),Wu,Math.max(1,s),'#5e5950');}
function bitte(P,x,sol,s){P(x-s,sol-3*s,2*s,3*s,'#3b3f44');P(x-2*s,sol-4*s,4*s,2*s,'#4a4f55');P(x-2*s,sol-4*s,4*s,s,'#646a71');}
function bateau(P,x,flot,s,coul){
  P(x-9*s,flot-3*s,18*s,3*s,coul||'#b8442e');P(x-9*s,flot-3*s,18*s,s,'#d6604a');
  P(x-8*s,flot,16*s,s,'#2a2f34');
  P(x-4*s,flot-7*s,8*s,4*s,'#f2ebdb');P(x-4*s,flot-7*s,8*s,s,'#fbf6ea');
  P(x-3*s,flot-6*s,2*s,2*s,'#3a7ab4');P(x+s,flot-6*s,2*s,2*s,'#3a7ab4');
  P(x+5*s,flot-13*s,s,10*s,'#8a5a30');P(x+5*s,flot-14*s,s,s,'#e8c860');
  P(x-9*s,flot-4*s,18*s,s,'#1f2428');}
function grue(P,x,sol,s){
  P(x-3*s,sol-2*s,6*s,2*s,'#4a4f55');
  P(x-s,sol-16*s,2*s,14*s,'#d8a030');P(x-s,sol-16*s,s,14*s,'#f0bc50');
  P(x-8*s,sol-17*s,16*s,s,'#d8a030');P(x-8*s,sol-18*s,3*s,s,'#b8841c');
  P(x+6*s,sol-17*s,s,5*s,'#8a6a2a');P(x+5*s,sol-12*s,3*s,2*s,'#4a4f55');
  for(var k=0;k<6;k++)P(x-7*s+k*2*s,sol-16*s,s,s,'#b8841c');}
function phare(P,x,sol,s){
  P(x-2*s,sol-12*s,4*s,12*s,'#f2ebdb');
  for(var k=0;k<3;k++)P(x-2*s,sol-11*s+k*4*s,4*s,2*s,'#c8402e');
  P(x-3*s,sol-14*s,6*s,2*s,'#3b3f44');P(x-2*s,sol-16*s,4*s,2*s,'#ffe49a');P(x-3*s,sol-17*s,6*s,s,'#3b3f44');}
function cargo(P,x,flot,s){
  P(x-14*s,flot-4*s,28*s,4*s,'#2f4a6a');P(x-14*s,flot-4*s,28*s,s,'#3d5e82');
  P(x+6*s,flot-10*s,6*s,6*s,'#e8e2d4');P(x+7*s,flot-12*s,2*s,2*s,'#c8402e');
  for(var k=0;k<6;k++)P(x-12*s+k*3*s,flot-7*s,3*s-s*0.4,3*s,['#c8402e','#d8a030','#3a7ab4','#4f9434'][k%4]);}
function caisses(P,x,sol,s){
  P(x-5*s,sol-4*s,5*s,4*s,'#a5764a');P(x-5*s,sol-4*s,5*s,s,'#bb8a58');
  P(x-5*s,sol-2*s,5*s,Math.max(1,Math.round(s*0.6)),'#8a5a30');
  P(x,sol-5*s,5*s,5*s,'#96683c');P(x,sol-5*s,5*s,s,'#ac7c4c');
  P(x,sol-3*s,5*s,Math.max(1,Math.round(s*0.6)),'#7a4e28');
  P(x-3*s,sol-7*s,4*s,3*s,'#b85e3a');P(x-3*s,sol-7*s,4*s,s,'#d07a4e');}
function tonneau(P,x,sol,s){
  P(x-2*s,sol-5*s,4*s,5*s,'#8a5a30');P(x-2*s,sol-5*s,s,5*s,'#a5764a');
  P(x-2*s,sol-4*s,4*s,Math.max(1,Math.round(s*0.7)),'#5e5950');
  P(x-2*s,sol-2*s,4*s,Math.max(1,Math.round(s*0.7)),'#5e5950');
  P(x-2*s,sol-5*s,4*s,Math.max(1,Math.round(s*0.6)),'#b3a996');}
function jetee(P,x,y,s){
  P(x-6*s,y,12*s,4*s,'#8a8276');P(x-6*s,y,12*s,Math.max(1,s),'#b3a996');
  for(var k=0;k<4;k++)P(x-6*s+k*3*s,y+s,3*s-1,3*s,k%2?'#938b7e':'#89806f');}
function scenePort(g,W,H,part){
  var U=Math.max(2,Math.round(Math.min(W,H)/170)),Wu=Math.ceil(W/U),Hu=Math.ceil(H/U),P=Pix(g,U);
  var bas=Math.round(Hu*(part||1));            /* jusqu'où descend l'image */
  var hz=Math.round(bas*0.46);
  /* LA TAILLE SUIT LE PLUS PETIT CÔTÉ : réglée sur la seule hauteur, la
     scène se retrouvait énorme sur une tablette en portrait. */
  var s=Math.max(1,Math.round(Math.min(Wu,bas)/48));
  ciel(P,Wu,hz,['#2d3f74','#48548f','#7b61a0','#b06c95','#d8826e','#f0a05e','#ffc078','#ffd9a0']);
  soleil(P,Math.round(Wu*0.74),hz-Math.round(bas*0.07),Math.max(3,Math.round(bas*0.055)));
  nuage(P,Math.round(Wu*0.12),Math.round(bas*0.10),Math.max(1,Math.round(s*0.9)),'rgba(255,238,220,.65)');
  nuage(P,Math.round(Wu*0.56),Math.round(bas*0.06),Math.max(1,Math.round(s*0.6)),'rgba(255,238,220,.5)');
  mouettes(P,Wu,bas,Math.max(1,Math.round(s*0.35)));
  colline(P,Wu,hz,s);
  ndg(P,Math.round(Wu*0.30),hz-Math.round(s*4.2),Math.max(1,Math.round(s*0.52)));
  var qy=hz+Math.round((bas-hz)*0.62);
  mer(P,Wu,hz,qy,Math.max(1,Math.round(s*0.6)));
  cargo(P,Math.round(Wu*0.72),hz+Math.round((qy-hz)*0.24),Math.max(1,Math.round(s*0.40)));
  jetee(P,Math.round(Wu*0.09),hz+Math.round(s*0.5),Math.max(1,Math.round(s*0.5)));
  phare(P,Math.round(Wu*0.09),hz+Math.round(s*0.5),Math.max(1,Math.round(s*0.5)));
  bateau(P,Math.round(Wu*0.17),qy-Math.round(s*0.5),Math.max(1,Math.round(s*0.8)),'#b8442e');
  bateau(P,Math.round(Wu*0.88),qy-Math.round(s*1.4),Math.max(1,Math.round(s*0.6)),'#2f6a8a');
  quai(P,Wu,qy,bas,Math.max(1,Math.round(s*0.8)));
  grue(P,Math.round(Wu*0.62),qy+Math.round(s*1.2),Math.max(1,Math.round(s*0.7)));
  bitte(P,Math.round(Wu*0.12),qy+Math.round(s*3),Math.max(1,Math.round(s*0.7)));
  bitte(P,Math.round(Wu*0.50),qy+Math.round(s*3),Math.max(1,Math.round(s*0.7)));
  bitte(P,Math.round(Wu*0.88),qy+Math.round(s*3),Math.max(1,Math.round(s*0.7)));
  caisses(P,Math.round(Wu*0.24),qy+Math.round(s*2.2),Math.max(1,Math.round(s*0.55)));
  tonneau(P,Math.round(Wu*0.33),qy+Math.round(s*2.4),Math.max(1,Math.round(s*0.5)));
  tonneau(P,Math.round(Wu*0.36),qy+Math.round(s*2.8),Math.max(1,Math.round(s*0.5)));
  caisses(P,Math.round(Wu*0.76),qy+Math.round(s*2.6),Math.max(1,Math.round(s*0.5)));
  var lg=g.createLinearGradient(0,0,0,bas*U);
  lg.addColorStop(0,'rgba(10,14,40,.26)');lg.addColorStop(.5,'rgba(0,0,0,0)');lg.addColorStop(1,'rgba(20,16,6,.30)');
  g.fillStyle=lg;g.fillRect(0,0,W,bas*U);}

const cvP=$('pre'), cvV=$('vie');
let UV=4, HZV=0, QYV=0, WV=0, HV=0;
function graver(){
 const dpr=Math.min(2,window.devicePixelRatio||1),W=innerWidth,H=innerHeight;
 WV=W;HV=H;
 cvP.width=Math.round(W*dpr);cvP.height=Math.round(H*dpr);
 const g=cvP.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.imageSmoothingEnabled=false;
 scenePort(g,W,H,1);
 UV=Math.max(2,Math.round(Math.min(W,H)/170));
 const Hu=Math.ceil(H/UV);HZV=Math.round(Hu*0.46);QYV=HZV+Math.round((Hu-HZV)*0.62);
 cvV.width=Math.round(W*dpr);cvV.height=Math.round(H*dpr);
 cvV.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
}
const MOU=[];for(let i=0;i<5;i++)MOU.push({x:al(i*5.1),y:0.10+al(i*3.3)*0.12,v:0.012+al(i)*0.016,b:al(i*7)*6});
function dessinerVie(t){
 const g=cvV.getContext('2d');g.clearRect(0,0,WV,HV);g.imageSmoothingEnabled=false;
 const U=UV,P=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.round(x)*U,Math.round(y)*U,Math.max(1,Math.round(w))*U,Math.max(1,Math.round(h))*U);};
 const Wu=Math.ceil(WV/U),Hu=Math.ceil(HV/U),s=Math.max(1,Math.round(Hu/120));
 for(const m of MOU){m.x+=m.v*0.004;if(m.x>1.15)m.x=-0.15;
  const x=Math.round(m.x*Wu), y=Math.round((m.y+Math.sin(t*0.6+m.b)*0.012)*Hu),
        h=Math.sin(t*2.2+m.b)>0?s:0;
  P(x-2*s,y,s,s,'#fbf6ec');P(x-s,y-s-h,s,s,'#fbf6ec');P(x,y,s,s,'#fbf6ec');
  P(x+s,y-s-h,s,s,'#fbf6ec');P(x+2*s,y,s,s,'#fbf6ec');}
 for(let k=0;k<26;k++){
  const u=al(k*3.7), v=al(k*9.1), br=Math.sin(t*1.4+k*1.7);
  if(br<0.3)continue;
  const y=HZV+Math.round(Math.pow(v,1.5)*(QYV-HZV));
  const x=Math.round((u+Math.sin(t*0.3+k)*0.004)*Wu);
  P(x,y,Math.max(1,Math.round(1+v*3*s)),Math.max(1,s),'rgba(255,244,214,'+(0.10+br*0.22).toFixed(2)+')');}
}
let t0=0;
function boucle(t){if(!t0)t0=t;dessinerVie((t-t0)/1000);requestAnimationFrame(boucle);}
let rT=0;addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(graver,120);});
graver();requestAnimationFrame(boucle);</script>
