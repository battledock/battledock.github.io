<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Battle Dock — Guérite de Sécurité</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Boogaloo&family=Permanent+Marker&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    :root {
      --bg-dark: #1e293b;
      --guerite-bg: #e2e8f0;
      --border-thick: 5px solid #000;
      --accent-red: #dc2626;
      --accent-yellow: #f59e0b;
      --accent-green: #16a34a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background-color: #0f172a;
      /* Effet Mur de Briques / Tôle de hangar en pur CSS */
      background-image: 
        linear-gradient(315deg, #111726 25%, transparent 25%), 
        linear-gradient(45deg, #111726 25%, transparent 25%), 
        linear-gradient(225deg, #111726 25%, transparent 25%), 
        linear-gradient(135deg, #111726 25%, transparent 25%);
      background-size: 40px 40px;
      background-position: 0 0, 20px 0, 20px 20px, 0 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* La Guérite du Gardien */
    .guerite-window {
      position: relative;
      width: 100%;
      max-width: 480px;
      background: var(--guerite-bg);
      border: var(--border-thick);
      border-radius: 24px;
      padding: 30px 24px 24px 24px;
      box-shadow: 
        0px 20px 0px #000,
        20px 30px 0px var(--accent-yellow);
    }

    /* Haut-parleur d'interphone en haut */
    .intercom-speaker {
      background: #000;
      color: #fff;
      font-family: 'Bangers', cursive;
      font-size: 18px;
      padding: 8px;
      text-align: center;
      border-radius: 12px;
      margin-bottom: 25px;
      letter-spacing: 1px;
      box-shadow: inset 0 0 10px rgba(255,255,255,0.3);
      border: 2px solid #475569;
    }
    .intercom-speaker span {
      color: var(--accent-yellow);
      animation: blink 1s infinite;
    }

    /* Onglets Micros Rétro */
    .radio-tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .mic-btn {
      flex: 1;
      background: #475569;
      color: #cbd5e1;
      border: var(--border-thick);
      border-radius: 14px;
      padding: 12px 8px;
      font-family: 'Bangers', cursive;
      font-size: 16px;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 5px 0 #000;
      transition: all 0.1s ease;
    }

    .mic-btn.active {
      background: var(--accent-yellow);
      color: #000;
      transform: translateY(3px);
      box-shadow: 0 2px 0 #000;
    }

    /* Sections de Formulaires */
    .form-section {
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    .form-section.active {
      display: flex;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-family: 'Boogaloo', cursive;
      font-size: 22px;
      color: #000;
    }

    /* Inputs style BD Gras */
    .typewriter-input {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      border: var(--border-thick);
      border-radius: 12px;
      background: #fff;
      color: #000;
      outline: none;
      box-shadow: 4px 4px 0px #000;
    }

    .typewriter-input:focus {
      background: #fef08a; /* Devient jaune flash au focus */
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px #000;
    }

    /* Gros Bouton Rouge Alarme/Explosif */
    .stamp-btn {
      width: 100%;
      padding: 16px;
      background: var(--accent-red);
      color: white;
      border: var(--border-thick);
      font-family: 'Bangers', cursive;
      font-size: 26px;
      letter-spacing: 2px;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 8px 0 #000;
      transition: all 0.05s ease;
      margin-top: 10px;
      text-shadow: 2px 2px 0 #000;
    }

    .stamp-btn:active {
      transform: translateY(8px);
      box-shadow: none;
    }

    /* Bulle de Dialogue d'engueulade du gardien (Erreur) */
    .admin-error {
      display: none;
      position: relative;
      background: #fff;
      border: var(--border-thick);
      color: #000;
      padding: 15px;
      border-radius: 16px;
      font-family: 'Permanent Marker', cursive;
      font-size: 14px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 5px 5px 0px rgba(0,0,0,0.1);
      animation: punchIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Petite flèche pour faire une vraie bulle de BD */
    .admin-error::after {
      content: '';
      position: absolute;
      bottom: -15px;
      left: 30px;
      border-width: 15px 15px 0;
      border-style: solid;
      border-color: #fff transparent;
      display: block;
      width: 0;
    }
    .admin-error::before {
      content: '';
      position: absolute;
      bottom: -21px;
      left: 28px;
      border-width: 17px 17px 0;
      border-style: solid;
      border-color: #000 transparent;
      display: block;
      width: 0;
    }

    /* Animations fun */
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    @keyframes punchIn {
      0% { transform: scale(0) rotate(-10deg); }
      100% { transform: scale(1) rotate(0deg); }
    }
  </style>
</head>
<body>

  <div class="guerite-window">
    
    <div class="intercom-speaker">
      🎤 INTERPHONE : <span>[ EN LIGNE ]</span> « Pas de bras, pas de chocolat. »
    </div>

    <div class="radio-tabs">
      <button class="mic-btn active" id="tabLogin" onclick="switchTab('login')">🔓 Ouvre la porte !</button>
      <button class="mic-btn" id="tabSignup" onclick="switchTab('signup')">📝 Je cherche du taf</button>
    </div>

    <div class="admin-error" id="errorBox">HÉ HO ! Tu essaies de saboter le matériel ?!</div>

    <div class="form-section active" id="loginSection">
      <div class="form-group">
        <label>Ton Matricule (Email) :</label>
        <input type="email" id="loginEmail" class="typewriter-input" placeholder="ex: jojo.les.gros.bras@port.fr">
      </div>

      <div class="form-group">
        <label>Code Secret Anti-Espion (Password) :</label>
        <input type="password" id="loginPassword" class="typewriter-input" placeholder="••••••••">
      </div>

      <button class="stamp-btn" onclick="login()">🚨 ENFONCER LE BOUTON D'ACCÈS 🚨</button>
    </div>

    <div class="form-section" id="signupSection">
      <div class="form-group">
        <label>Ton Blase sur les quais (Username) :</label>
        <input type="text" id="signupUsername" class="typewriter-input" placeholder="ex: Gégé_Le_Flambeur" maxlength="20">
      </div>

      <div class="form-group">
        <label>Courrier postal du bled (Email) :</label>
        <input type="email" id="signupEmail" class="typewriter-input" placeholder="docker.anonyme@marseille.com">
      </div>

      <div class="form-group">
        <label>Créer une clé de coffre-fort (Password) :</label>
        <input type="password" id="signupPassword" class="typewriter-input" placeholder="6 caractères ou rien !">
      </div>

      <button class="stamp-btn" style="background: var(--accent-green);" onclick="signup()">
        🪵 CRÉER MON BADGE EN BOIS
      </button>
    </div>

  </div>

  <script>
    // Configuration Supabase d'origine préservée à 100%
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const supabaseClient = createClient(supabaseUrl, supabaseKey);

    function switchTab(type) {
      document.getElementById('errorBox').style.display = 'none';
      if (type === 'login') {
        document.getElementById('tabLogin').classList.add('active');
        document.getElementById('tabSignup').classList.remove('active');
        document.getElementById('loginSection').classList.add('active');
        document.getElementById('signupSection').classList.remove('active');
      } else {
        document.getElementById('tabSignup').classList.add('active');
        document.getElementById('tabLogin').classList.remove('active');
        document.getElementById('signupSection').classList.add('active');
        document.getElementById('loginSection').classList.remove('active');
      }
    }

    function showError(msg) {
      const box = document.getElementById('errorBox');
      box.innerHTML = `🤬 LE GARDIEN HURLE :<br>"${msg}"`;
      box.style.display = 'block';
    }

    async function login() {
      document.getElementById('errorBox').style.display = 'none';
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!email || !password) {
        showError('Espèce de mouette ! Remplis toutes les cases !');
        return;
      }

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;

        const { data: profile } = await supabaseClient
          .from('profiles')
          .select('username')
          .eq('user_id', data.user.id)
          .single();

        localStorage.setItem('userId', data.user.id);
        if (profile) localStorage.setItem('username', profile.username);

        window.location.href = 'creer-badge.html';
      } catch (err) {
        console.error('Erreur:', err);
        showError('Accès refusé ! Barre-toi avant que je lâche les chiens !');
      }
    }

    async function signup() {
      document.getElementById('errorBox').style.display = 'none';
      const username = document.getElementById('signupUsername').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const password = document.getElementById('signupPassword').value;

      if (!username || !email || !password) {
        showError('Tu te crois malin ? Remplis tout le papier d\'engagement !');
        return;
      }

      if (password.length < 6) {
        showError('Ton mot de passe est trop mou ! 6 caractères minimum !');
        return;
      }

      try {
        const { data: authData, error: authError } = await supabaseClient.auth.signUp({ email, password });
        if (authError) throw authError;

        const userId = authData.user.id;

        // Créer profil
        await supabaseClient.from('profiles').insert([{
          user_id: userId,
          username: username,
          email: email
        }]);

        // Créer game_progress
        await supabaseClient.from('game_progress').insert([{
          user_id: userId,
          level: 1,
          score: 0,
          rank: 'Docker Occasionnel',
          money: 100,
          energy: 50,
          energy_max: 50,
          xp: 0
        }]);

        // Créer leaderboard
        await supabaseClient.from('leaderboard').insert([{
          user_id: userId,
          score: 100
        }]);

        localStorage.setItem('userId', userId);
        localStorage.setItem('username', username);
        window.location.href = 'creer-badge.html';
      } catch (err) {
        console.error('Erreur:', err);
        showError('Erreur d\'embauche : ' + err.message);
      }
    }

    // Touche Entrée
    document.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        const loginActive = document.getElementById('loginSection').classList.contains('active');
        if (loginActive) {
          login();
        } else {
          signup();
        }
      }
    });

    // Auto-redirect
    const userId = localStorage.getItem('userId');
    if (userId) {
      window.location.href = 'creer-badge.html';
    }
  </script>
</body>
</html>
