<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e9e3d6">
<title>Battle Dock · Ferme</title>
<style>
:root{
  --papier:#e9e3d6; --carte:#fffdf7; --encre:#2f3830; --doux:#8a9083; --pale:#a8a08e;
  --filet:#e2ddcd; --vert:#2f6b1f; --vert-p:#eef4e9; --or:#b5822a;
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%;overflow-x:hidden}
body{min-height:100vh;min-height:100svh;min-height:100dvh;overflow-x:hidden;
  display:flex;align-items:center;justify-content:center;
  padding:max(12px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom));
  background:var(--papier);color:var(--encre);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button,input{font-family:inherit;font-size:15px}

.carte-postale{width:100%;max-width:420px;background:var(--carte);border-radius:20px;
  padding:12px 12px 0;display:flex;flex-direction:column;max-height:calc(100dvh - 24px);
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 3px 8px rgba(70,56,32,.10),0 26px 60px rgba(70,56,32,.28);
  animation:monte .5s cubic-bezier(.2,.8,.3,1)}
@keyframes monte{from{transform:translateY(18px) scale(.99);opacity:0}}

.vue{position:relative;border-radius:13px;overflow:hidden;flex:0 0 auto;height:33vh;max-height:230px;min-height:130px;
  box-shadow:0 1px 3px rgba(70,56,32,.26)}
.vue svg{display:block;width:100%;height:100%}
.vue::after{content:"";position:absolute;inset:0;border-radius:13px;pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(70,56,32,.16)}

.mot{padding:18px 8px 16px;flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain}
.kicker{font:600 10px system-ui;letter-spacing:5.5px;color:var(--pale);text-align:center}
h1{font:400 30px/1.1 Georgia,"Times New Roman",serif;text-align:center;margin-top:9px;letter-spacing:-.3px}
.filet{width:34px;height:1px;background:#cfc4ac;margin:14px auto 16px}

.onglets{display:flex;gap:24px;justify-content:center;border-bottom:1px solid var(--filet);margin-bottom:16px}
.onglets button{border:0;background:none;padding:0 0 9px;font-size:13.5px;font-weight:600;color:var(--pale);
  border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;transition:color .15s}
.onglets button.on{color:var(--encre);border-bottom-color:var(--vert)}

label{display:block;font-size:11.5px;color:var(--doux);margin:0 0 5px 3px}
.champ{display:flex;align-items:center;gap:11px;border:1px solid var(--filet);border-radius:13px;
  padding:0 12px;margin-bottom:11px;background:#fffefa;transition:border-color .16s,box-shadow .16s}
.champ:focus-within{border-color:var(--vert);box-shadow:0 0 0 3px rgba(47,107,31,.09)}
.champ input{flex:1;min-width:0;border:0;outline:none;background:none;padding:13px 0;color:var(--encre)}
.champ input::placeholder{color:var(--pale)}
.oeil{border:0;background:none;padding:6px;display:flex;color:var(--pale);cursor:pointer}
.lien{display:block;width:100%;text-align:right;border:0;background:none;font-size:11.5px;color:var(--doux);
  cursor:pointer;margin:-3px 0 2px}

.entrer{width:100%;border:0;border-radius:15px;padding:15px;margin-top:12px;background:var(--vert);
  color:#fdfbf4;font-size:15.5px;font-weight:600;cursor:pointer;
  box-shadow:0 6px 18px rgba(47,107,31,.26);transition:transform .07s,filter .16s}
.entrer:active{transform:translateY(2px)}
.entrer:disabled{filter:grayscale(.4);opacity:.6}
.sep{display:flex;align-items:center;gap:11px;margin:16px 0 12px}
.sep i{flex:1;height:1px;background:var(--filet)}
.sep span{font-size:11px;color:var(--pale);font-style:normal;letter-spacing:1px}
.invite{width:100%;border:1px solid var(--filet);background:none;border-radius:13px;padding:12px;
  font-size:13.5px;font-weight:600;color:var(--encre);cursor:pointer}
.invite:active{background:#f6f3ea}
.bas{text-align:center;font-size:12.5px;color:var(--doux);margin-top:14px;padding-bottom:4px}
.bas b{color:var(--vert);font-weight:600;cursor:pointer}
.msg{font-size:12.5px;line-height:1.5;border-radius:11px;padding:10px 12px;margin-bottom:12px;display:none}
.msg.on{display:block}
.msg.err{background:#fbeceb;color:#93312a}
.msg.ok{background:var(--vert-p);color:var(--vert)}

/* animations de l'illustration */
@keyframes derive{from{transform:translateX(-60px)}to{transform:translateX(460px)}}
.nuage{animation:derive linear infinite}
.nuage.n1{animation-duration:120s}
.nuage.n2{animation-duration:170s;animation-delay:-60s}
.nuage.n3{animation-duration:210s;animation-delay:-120s}
@keyframes monteFumee{0%{transform:translate(0,0) scale(.7);opacity:.55}
  100%{transform:translate(-7px,-26px) scale(1.9);opacity:0}}
.fumee circle{animation:monteFumee 5s ease-out infinite}
.fumee circle.f2{animation-delay:2.5s}
@keyframes balance{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}}
.epi{animation:balance 4.4s ease-in-out infinite}

@media (max-height:700px){
  .vue{height:26vh;min-height:112px}
  .mot{padding:14px 6px 12px}
  h1{font-size:25px}
  .filet{margin:11px auto 13px}
  .champ{margin-bottom:9px}
  .champ input{padding:11px 0}
  .entrer{padding:13px;margin-top:9px}
  .sep{margin:12px 0 9px}
}
@media (max-height:590px){
  .vue{display:none}
  .sep,.invite{display:none}
}
</style>
</head>
<body>

    <label for="email">Adresse e-mail</label>

    <label for="mdp">Mot de passe</label>

    <button class="lien" id="oubli">Mot de passe oublié ?</button>
    <button class="entrer" id="valider">Entrer</button>

    <div class="sep"><i></i><span>OU</span><i></i></div>
    <button class="invite" id="invite">Jouer sans compte</button>
    <div class="bas" id="bascule">Première visite ? <b>Créer une ferme</b></div>
  </div>
</div>

function ILLUSTRATION(){
  const R=(a,b,s)=>{const v=Math.sin(s*127.1+a*311.7+b*74.7)*43758.5;return v-Math.floor(v);};

  /* --- rangs de culture en perspective : chaque bande se resserre vers l'horizon --- */

    const t=i/25;

  }
  /* --- épis du premier plan, dessinés un par un --- */
  let epis='';
  for(let i=0;i<46;i++){
    const x=-10+i*9.2+R(i,1,3)*6;
    const h=26+R(i,2,7)*26;
    const base=302;
    const pen=(R(i,3,11)-0.5)*10;
    const vert=`hsl(${72+R(i,4,13)*18} ${30+R(i,5,17)*18}% ${28+R(i,6,19)*14}%)`;
    epis+=`<g class="epi" style="animation-delay:${(-R(i,7,23)*4).toFixed(2)}s;transform-origin:${x}px ${base}px">
      <path d="M${x} ${base} Q${x+pen*.4} ${base-h*.6} ${x+pen} ${base-h}" stroke="${vert}" stroke-width="1.9" fill="none" stroke-linecap="round"/>
      <ellipse cx="${(x+pen).toFixed(1)}" cy="${(base-h-4).toFixed(1)}" rx="2.6" ry="5.4" fill="hsl(${44+R(i,8,29)*10} ${52+R(i,9,31)*14}% ${54+R(i,10,37)*10}%)" transform="rotate(${(pen*1.4).toFixed(1)} ${(x+pen).toFixed(1)} ${(base-h-4).toFixed(1)})"/>
      </g>`;
  }
  /* --- feuillage : amas de cercles pour un houppier crédible --- */
  const houppier=(cx,cy,s,c1,c2,c3)=>{
    let g='';
    const amas=[[0,-s*.55,s*.62],[-s*.5,-s*.2,s*.46],[s*.5,-s*.25,s*.44],[-s*.2,-s*.75,s*.4],[s*.25,-s*.7,s*.38],[0,-s*.15,s*.55]];

  /* --- piquets de clôture le long du chemin --- */

    if(i<10)cloture+=`<path d="M${x} ${y-h*0.72} L${18+((i+1)/10)*370} ${236+Math.pow((i+1)/10,1.6)*44-(9+((i+1)/10)*13)*0.72}" stroke="#7d6a4a" stroke-width="${0.8+t*1.2}" opacity="${0.35+t*0.35}"/>`;

  return `

    <stop offset="0" stop-color="#a9c98a"/><stop offset="1" stop-color="#8fb672"/></linearGradient>
  <linearGradient id="pre2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8cb46c"/><stop offset="1" stop-color="#6f9c56"/></linearGradient>
  <linearGradient id="champ" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d8c07e"/><stop offset="1" stop-color="#c2a760"/></linearGradient>

    <stop offset="0" stop-color="#d0714f"/><stop offset="1" stop-color="#a94f36"/></linearGradient>

    <feColorMatrix type="saturate" values="0"/>

  <radialGradient id="vign" cx=".5" cy=".45" r=".78">
    <stop offset=".55" stop-color="rgba(0,0,0,0)"/><stop offset="1" stop-color="rgba(60,45,25,.22)"/></radialGradient>
 </defs>

 <rect width="400" height="300" fill="url(#ciel)"/>

 <!-- nuages en bandes, deux vitesses -->
 <g class="nuage n1" opacity=".92" fill="#fdfaf3">

 <g class="nuage n3" opacity=".55" fill="#fdfaf3">

 <!-- rideau d'arbres à l'horizon -->
 <g opacity=".9">
   ${[18,52,86,118,150,182,214,246,278,310,342,376].map((x,i)=>{

     return `<g>${houppier(x,172,s,'#6e8f63','#5f8156','#527247')}<rect x="${x-1.4}" y="168" width="2.8" height="9" fill="#5a4a34"/></g>`;

 <g>${rangs}</g>

 <g>

 <path d="M182 206 Q176 250 128 300 L268 300 Q216 250 210 206 Z" fill="#d9c49a"/>

 <g opacity=".5">${[0,1,2,3,4,5].map(i=>{const t=i/5,y=214+t*t*80;

$('vue').innerHTML=ILLUSTRATION();

let mode='co';
const afficher=(t,type)=>{const m=$('msg');m.textContent=t;m.className='msg on '+(type||'');};
const cacher=()=>{$('msg').className='msg';};
function basculer(m){
  mode=m;cacher();
  $('t-co').classList.toggle('on',m==='co');
  $('t-in').classList.toggle('on',m==='in');
  $('bloc-ferme').style.display=m==='in'?'block':'none';
  $('oubli').style.display=m==='co'?'block':'none';
  $('valider').textContent=m==='co'?'Entrer':'Créer ma ferme';
  $('mdp').autocomplete=m==='co'?'current-password':'new-password';
  $('bascule').innerHTML=m==='co'?'Première visite ? <b>Créer une ferme</b>'
                                 :'Déjà un compte ? <b>Se connecter</b>';
}
$('t-co').onclick=()=>basculer('co');
$('t-in').onclick=()=>basculer('in');
$('bascule').onclick=()=>basculer(mode==='co'?'in':'co');
$('oeil').onclick=()=>{const c=$('mdp');c.type=c.type==='password'?'text':'password';};

$('valider').onclick=async()=>{
  const email=$('email').value.trim(), mdp=$('mdp').value, ferme=$('pseudo').value.trim();
  if(!email||!mdp)return afficher('Il manque l’adresse ou le mot de passe.','err');
  if(mode==='in'&&ferme.length<3)return afficher('Donne un nom d’au moins 3 lettres à ta ferme.','err');
  if(mode==='in'&&mdp.length<8)return afficher('Le mot de passe doit faire au moins 8 caractères.','err');
  const b=$('valider');b.disabled=true;b.textContent='Un instant…';cacher();
  try{
    if(mode==='co'){
      const {error}=await sb.auth.signInWithPassword({email,password:mdp});
      if(error)throw error;location.href='jeu.html';
    }else{
      const {data,error}=await sb.auth.signUp({email,password:mdp,options:{data:{ferme}}});
      if(error)throw error;
      if(data.session){location.href='jeu.html';return;}
      afficher('Ferme créée. Confirme ton adresse par e-mail, puis connecte-toi.','ok');
      basculer('co');
    }
  }catch(err){
    const t=(err&&err.message)||'';
    afficher(/Invalid login/i.test(t)?'Adresse ou mot de passe incorrect.':
      /already registered/i.test(t)?'Cette adresse a déjà une ferme.':
      'Ça n’a pas marché : '+t,'err');
  }finally{b.disabled=false;b.textContent=mode==='co'?'Entrer':'Créer ma ferme';}
};
$('oubli').onclick=async()=>{
  const email=$('email').value.trim();
  if(!email)return afficher('Écris ton adresse, je t’envoie un lien.','err');
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin});
  afficher(error?('Échec : '+error.message):'Lien de réinitialisation envoyé.',error?'err':'ok');
};
$('invite').onclick=()=>{try{localStorage.setItem('bdl.invite','1');}catch(x){}location.href='jeu.html';};
document.addEventListener('keydown',ev=>{if(ev.key==='Enter')$('valider').click();});
sb.auth.getSession().then(({data})=>{if(data.session)location.href='jeu.html';});
</script>
