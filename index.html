<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BattleDock 2</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:'Inter',sans-serif;overflow-x:hidden}
body{background:linear-gradient(180deg,#141625 0%,#1b1e33 45%,#251f3d 100%)}

/* === ORBES === */
.orb{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;animation:drift 12s ease-in-out infinite;z-index:0;will-change:transform}
@media (max-width:480px){.orb{filter:blur(60px)}}
.o1{width:min(380px,100vw);height:min(380px,100vw);background:rgba(120,90,255,.16);top:5%;left:5%}
.o2{width:min(320px,85vw);height:min(320px,85vw);background:rgba(255,110,70,.13);bottom:5%;right:5%;animation-delay:4s}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(10px,-10px)}}

/* === INTRO === */
.intro{position:fixed;inset:0;height:100dvh;z-index:1000;display:flex;align-items:center;justify-content:center;transition:opacity .8s ease-out}
.intro.hide{opacity:0;pointer-events:none}
.intro-content{text-align:center;position:relative;z-index:1;padding:0 clamp(16px,4vw,24px);width:100%}
.frame{display:inline-block;max-width:calc(100vw - 32px);padding:clamp(18px,5vw,32px) clamp(20px,6vw,48px);
  border:1.5px solid rgba(255,255,255,.12);border-radius:clamp(16px,4vw,24px);
  background:rgba(255,255,255,.06);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 12px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08);
  opacity:0;animation:up .8s .3s ease-out forwards}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.frame .row{display:flex;align-items:center;justify-content:center;gap:clamp(10px,3vw,18px)}
.frame .title{font-family:'Oswald',sans-serif;font-size:clamp(36px,11vw,72px);font-weight:700;
  letter-spacing:clamp(2px,.8vw,5px);text-transform:uppercase;line-height:1;color:#f2eef8}
.frame .v-line{width:2px;height:clamp(32px,9vw,60px);background:linear-gradient(180deg,#9d7bff,#ff9a5c);border-radius:2px;flex-shrink:0}
.frame .dock{font-family:'Oswald',sans-serif;font-size:clamp(36px,11vw,72px);font-weight:700;
  letter-spacing:clamp(2px,.8vw,5px);text-transform:uppercase;line-height:1;
  background:linear-gradient(135deg,#9d7bff,#ff7a5c,#ffc24d);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.frame-sub{display:flex;align-items:center;justify-content:center;gap:clamp(6px,2vw,12px);
  margin-top:clamp(10px,3vw,16px);padding-top:clamp(10px,3vw,16px);border-top:1px solid rgba(255,255,255,.08)}
.frame-sub span{font-family:'Oswald',sans-serif;font-size:clamp(10px,2.8vw,12px);letter-spacing:clamp(3px,1vw,6px);text-transform:uppercase}
.s2{background:linear-gradient(90deg,#9d7bff,#ff7a5c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sep{color:rgba(255,255,255,.3);font-size:8px}
.mrs{background:linear-gradient(90deg,#ff7a5c,#ffc24d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.intro-cta{margin-top:clamp(24px,6vw,40px);opacity:0;animation:up .8s .8s ease-out forwards}
.intro-cta button{padding:16px 64px;border:none;border-radius:16px;cursor:pointer;
  font-family:'Oswald',sans-serif;font-size:16px;font-weight:600;letter-spacing:4px;text-transform:uppercase;color:#fff;
  background:linear-gradient(135deg,#9d7bff,#ff7a5c);
  box-shadow:0 8px 30px rgba(157,123,255,.3);transition:.2s}
.intro-cta button:active{transform:scale(.96)}

/* === APP / AUTH === */
.app{min-height:100dvh;display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(clamp(24px,6vw,48px) + env(safe-area-inset-top)) 16px calc(clamp(24px,6vw,48px) + env(safe-area-inset-bottom));position:relative;z-index:1}
.app.visible{display:flex;animation:fadein .6s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.brand{text-align:center;margin-bottom:clamp(24px,6vw,36px)}
.b-row{display:flex;align-items:center;justify-content:center;gap:10px}
.b-t{font-family:'Oswald',sans-serif;font-size:clamp(26px,7vw,36px);font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#f2eef8}
.b-vl{width:2px;height:clamp(22px,6vw,30px);background:linear-gradient(180deg,#9d7bff,#ff9a5c);border-radius:2px}
.b-d{font-family:'Oswald',sans-serif;font-size:clamp(26px,7vw,36px);font-weight:700;letter-spacing:3px;text-transform:uppercase;
  background:linear-gradient(135deg,#9d7bff,#ff7a5c,#ffc24d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.b-sub{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px}
.b-sub span{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:4px;text-transform:uppercase}
.b-sub i{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.3)}
.bs2{background:linear-gradient(90deg,#9d7bff,#ff7a5c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.bmrs{background:linear-gradient(90deg,#ff7a5c,#ffc24d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

.auth-card{width:100%;max-width:400px;padding:clamp(22px,6vw,30px) clamp(18px,5vw,26px);
  border:1.5px solid rgba(255,255,255,.12);border-radius:20px;
  background:rgba(255,255,255,.06);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 12px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08)}
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.06);border-radius:12px;padding:5px;margin-bottom:22px}
.tab{flex:1;padding:11px;border:none;border-radius:9px;cursor:pointer;background:none;
  font-family:'Oswald',sans-serif;font-size:13px;font-weight:600;letter-spacing:2px;text-transform:uppercase;
  color:#a89cb8;transition:.2s}
.tab.active{background:rgba(255,255,255,.92);color:#1b1e33;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.form{display:none}
.form.active{display:block}
.field{margin-bottom:14px}
.field input{width:100%;padding:14px 16px;border:1.5px solid rgba(255,255,255,.12);border-radius:12px;
  background:rgba(255,255,255,.06);font-family:'Inter',sans-serif;font-size:16px;color:#f2eef8;outline:none;transition:.2s}
.field input:focus{border-color:#9d7bff;background:rgba(255,255,255,.1)}
.field input::placeholder{color:#8a7f9c}
.error-msg{font-size:12px;color:#ff7a7a;margin-top:5px;min-height:0}
.remember{display:flex;align-items:center;gap:9px;margin:2px 2px 10px;font-size:13px;color:#a89cb8;cursor:pointer;user-select:none}
.remember input{display:none}
.rbox{width:18px;height:18px;border:1.5px solid rgba(255,255,255,.25);border-radius:5px;flex-shrink:0;position:relative;transition:.2s}
.remember input:checked+.rbox{background:linear-gradient(135deg,#9d7bff,#ff7a5c);border-color:transparent}
.remember input:checked+.rbox::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700}
.btn-primary{width:100%;padding:15px;border:none;border-radius:12px;cursor:pointer;margin-top:6px;
  font-family:'Oswald',sans-serif;font-size:14px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:#fff;
  background:linear-gradient(135deg,#9d7bff,#ff7a5c);box-shadow:0 6px 24px rgba(157,123,255,.25);transition:.2s}
.btn-primary:active{transform:scale(.97)}
.btn-primary:disabled{opacity:.5;cursor:wait}

/* === TOAST === */
.toast{position:fixed;top:calc(20px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-100px);
  background:rgba(30,32,55,.85);backdrop-filter:blur(12px);border:1.5px solid rgba(255,255,255,.12);
  color:#f2eef8;padding:14px 24px;border-radius:14px;font-size:14px;z-index:1100;transition:.4s;opacity:0;
  box-shadow:0 8px 30px rgba(0,0,0,.06)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.error{border-color:#ff7a7a;color:#ff7a7a}
.toast.success{border-color:#5ad48e;color:#5ad48e}

/* ── espace temporaire Aurelia ── */
.aur-lien{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(14px + env(safe-area-inset-bottom));z-index:1050;
  border:none;background:none;cursor:pointer;
  font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:3px;text-transform:uppercase;
  color:rgba(255,255,255,.35);padding:8px 14px;transition:.2s}
.aur-lien:hover,.aur-lien:active{color:rgba(255,255,255,.7)}
.aur-fond{position:fixed;inset:0;z-index:1150;display:flex;align-items:center;justify-content:center;
  background:rgba(8,6,18,.75);backdrop-filter:blur(8px);
  opacity:0;pointer-events:none;transition:.25s}
.aur-fond.on{opacity:1;pointer-events:auto}
.aur-boite{width:min(320px,calc(100% - 48px));border-radius:20px;padding:24px 20px;
  background:linear-gradient(160deg,#181228,#100c1e);
  border:1px solid rgba(157,123,255,.35);
  box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 40px rgba(157,123,255,.12);
  transform:translateY(14px) scale(.97);transition:.25s;text-align:center}
.aur-fond.on .aur-boite{transform:none}
.aur-t{font-family:'Oswald',sans-serif;font-size:15px;font-weight:600;letter-spacing:4px;
  text-transform:uppercase;
  background:linear-gradient(90deg,#9d7bff,#ff9a5c);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.aur-st{font-size:11px;color:rgba(255,255,255,.45);margin:6px 0 16px}
.aur-boite input{width:100%;padding:13px 14px;border-radius:11px;text-align:center;
  background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.14);
  color:#fff;font-size:14px;letter-spacing:2px;outline:none;transition:.2s}
.aur-boite input:focus{border-color:#9d7bff;box-shadow:0 0 0 3px rgba(157,123,255,.18)}
.aur-boite input.err{border-color:#ff5c5c;animation:aur-shake .35s}
@keyframes aur-shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.aur-go{width:100%;margin-top:12px;padding:13px;border:none;border-radius:11px;cursor:pointer;
  font-family:'Oswald',sans-serif;font-size:13px;font-weight:600;letter-spacing:3px;text-transform:uppercase;
  color:#fff;background:linear-gradient(135deg,#9d7bff,#ff7a5c)}
.aur-go:active{transform:scale(.97)}
.aur-x{margin-top:10px;border:none;background:none;cursor:pointer;
  font-size:11px;color:rgba(255,255,255,.35)}
</style>
</head>
<body>

<div class="orb o1"></div><div class="orb o2"></div>

<!-- INTRO -->
<div class="intro" id="intro">
  <div class="intro-content">
    <div class="frame">
      <div class="row"><div class="title">BATTLE</div><div class="v-line"></div><div class="dock">DOCK</div></div>
      <div class="frame-sub"><span class="s2">Saison 2</span><span class="sep">◆</span><span class="mrs">Marseille</span></div>
    </div>
    <div class="intro-cta"><button id="introEnter">Jouer</button></div>
  </div>
</div>

<!-- APP -->
<div class="app" id="mainApp">
  <div class="brand">
    <div class="b-row"><div class="b-t">BATTLE</div><div class="b-vl"></div><div class="b-d">DOCK</div></div>
    <div class="b-sub"><span class="bs2">Saison 2</span><i></i><span class="bmrs">Marseille</span></div>
  </div>

  <div class="auth-card" id="authCard">
    <div class="tabs">
      <button class="tab active" data-tab="login">Connexion</button>
      <button class="tab" data-tab="signup">Inscription</button>
    </div>
    <form class="form active" id="form-login" autocomplete="on">
      <div class="field"><input type="email" id="login-email" placeholder="Email" autocomplete="email" required><div class="error-msg"></div></div>
      <div class="field"><input type="password" id="login-password" placeholder="Mot de passe" autocomplete="current-password" required><div class="error-msg"></div></div>
      <label class="remember"><input type="checkbox" id="remember"><span class="rbox"></span>Se souvenir de moi</label>
      <button type="submit" class="btn-primary">Embarquer</button>
    </form>
    <form class="form" id="form-signup" autocomplete="on">
      <div class="field"><input type="text" id="signup-pseudo" placeholder="Pseudo" autocomplete="username" required minlength="3" maxlength="20"><div class="error-msg"></div></div>
      <div class="field"><input type="email" id="signup-email" placeholder="Email" autocomplete="email" required><div class="error-msg"></div></div>
      <div class="field"><input type="password" id="signup-password" placeholder="Mot de passe" autocomplete="new-password" required minlength="6"><div class="error-msg"></div></div>
      <div class="field"><input type="password" id="signup-confirm" placeholder="Confirmer" autocomplete="new-password" required><div class="error-msg"></div></div>
      <button type="submit" class="btn-primary">S'inscrire</button>
    </form>
  </div>
</div>


<!-- espace temporaire Aurelia -->
<button class="aur-lien" id="aurLien">✦ espace privé</button>
<div class="aur-fond" id="aurFond">
  <div class="aur-boite">
    <div class="aur-t">Espace Aurelia</div>
    <div class="aur-st">Entre le mot de passe pour continuer</div>
    <input type="password" id="aurMdp" placeholder="••••••••" autocomplete="off">
    <button class="aur-go" id="aurGo">Entrer</button>
    <button class="aur-x" id="aurX">Annuler</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// === INTRO ===
document.getElementById('introEnter').addEventListener('click',()=>{
  const i=document.getElementById('intro');
  i.classList.add('hide');
  setTimeout(()=>{i.style.display='none';document.getElementById('mainApp').classList.add('visible')},800);
});

// === TABS ===
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.form').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('form-'+t.dataset.tab).classList.add('active');
  });
});

// === TOAST ===
let toastTimer;
function showToast(msg,type=''){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast show '+type;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),3200);
}

// === SUPABASE ===
const SUPABASE_URL='https://jtijmythnvqgquizeizs.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp0aWpteXRobnZxZ3F1aXplaXpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ1NjU3NjAsImV4cCI6MjEwMDE0MTc2MH0.7Eo_DZarB7J6BCzRHh5pB7-ZKKwgIlwWkpqUV9MGbUc';
const sb={
  headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON,'Authorization':`Bearer ${SUPABASE_ANON}`},
  async signUp(e,p,ps){return(await fetch(`${SUPABASE_URL}/auth/v1/signup`,{method:'POST',headers:this.headers,body:JSON.stringify({email:e,password:p,data:{pseudo:ps}})})).json()},
  async signIn(e,p){return(await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`,{method:'POST',headers:this.headers,body:JSON.stringify({email:e,password:p})})).json()}
};

// === SE SOUVENIR : préremplissage ===
try{
  const cr=JSON.parse(localStorage.getItem('bd2_creds'));
  if(cr){
    document.getElementById('login-email').value=cr.e||'';
    document.getElementById('login-password').value=cr.p||'';
    document.getElementById('remember').checked=true;
  }
}catch(e){}

// === LOGIN ===
document.getElementById('form-login').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const btn=ev.target.querySelector('.btn-primary');btn.disabled=true;
  const email=document.getElementById('login-email').value.trim();
  const pass=document.getElementById('login-password').value;
  const r=await sb.signIn(email,pass);
  btn.disabled=false;
  if(document.getElementById('remember').checked){
    localStorage.setItem('bd2_creds',JSON.stringify({e:email,p:pass}));
  }else{
    localStorage.removeItem('bd2_creds');
  }
  if(r.access_token){
    localStorage.setItem('bd2_session',JSON.stringify(r));
    showToast('Connexion réussie !','success');
    setTimeout(()=>location.href='jeu.html',700);
  }else{
    showToast(r.error_description||r.msg||'Identifiants incorrects','error');
  }
});

// === SIGNUP ===
document.getElementById('form-signup').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const p=document.getElementById('signup-password').value;
  const c=document.getElementById('signup-confirm').value;
  if(p!==c)return showToast('Les mots de passe ne correspondent pas','error');
  const btn=ev.target.querySelector('.btn-primary');btn.disabled=true;
  const r=await sb.signUp(
    document.getElementById('signup-email').value.trim(),p,
    document.getElementById('signup-pseudo').value.trim()
  );
  btn.disabled=false;
  if(r.id||r.user){
    if(r.access_token)localStorage.setItem('bd2_session',JSON.stringify(r));
    showToast('Compte créé !','success');
    setTimeout(()=>location.href='inscription.html',700);
  }else{
    showToast(r.error_description||r.msg||'Erreur à l\'inscription','error');
  }
});


// === espace temporaire Aurelia ===
(function(){
  const fond=document.getElementById('aurFond');
  const mdp=document.getElementById('aurMdp');
  document.getElementById('aurLien').onclick=()=>{
    fond.classList.add('on');
    setTimeout(()=>mdp.focus(),260);
  };
  document.getElementById('aurX').onclick=()=>{fond.classList.remove('on');mdp.value=''};
  fond.addEventListener('click',e=>{if(e.target===fond){fond.classList.remove('on');mdp.value=''}});
  function tente(){
    if(mdp.value.trim().toLowerCase()==='aurelia'){
      location.href='aurelia.html';
    }else{
      mdp.classList.remove('err');void mdp.offsetWidth;mdp.classList.add('err');
      mdp.value='';mdp.focus();
    }
  }
  document.getElementById('aurGo').onclick=tente;
  mdp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();tente()}});
})();

// === SESSION : vérif Supabase avant redirection (anti-boucle) ===
(async()=>{
  try{
    const s=JSON.parse(localStorage.getItem('bd2_session'));
    if(!s||!s.access_token)return;
    let r=await fetch(`${SUPABASE_URL}/auth/v1/user`,{
      headers:{'apikey':SUPABASE_ANON,'Authorization':`Bearer ${s.access_token}`}
    });
    if(r.ok){location.href='jeu.html';return}
    if(s.refresh_token){
      r=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`,{
        method:'POST',headers:sb.headers,
        body:JSON.stringify({refresh_token:s.refresh_token})
      });
      const d=await r.json();
      if(d.access_token){
        localStorage.setItem('bd2_session',JSON.stringify(d));
        location.href='jeu.html';return
      }
    }
    localStorage.removeItem('bd2_session'); // session morte → on reste sur l'index
  }catch(e){localStorage.removeItem('bd2_session')}
})();
</script>
</body>
</html>
