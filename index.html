<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battle Dock — LE JEU</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Pirata+One&family=Special+Elite&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #0a0e14;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: 'Special Elite', monospace;
  overflow: hidden;
}

.wrap {
  width: 340px;
  text-align: center;
  padding: 0 20px;
}

.icon {
  font-size: 64px;
  margin-bottom: 20px;
  display: block;
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

h1 {
  font-family: 'Pirata One', serif;
  font-size: 42px;
  color: #f4b13c;
  text-shadow: 3px 3px 0 #000, 0 0 40px rgba(244, 177, 60, .3);
  margin-bottom: 8px;
  letter-spacing: 2px;
}

.sub {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 16px;
  letter-spacing: 4px;
  color: #3a5a7a;
  margin-bottom: 32px;
}

.buttons {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-bottom: 20px;
}

.button {
  display: inline-block;
  padding: 8px 16px;
  background: #f4b13c;
  color: #0a0e14;
  text-decoration: none;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 14px;
  letter-spacing: 2px;
  border: none;
  cursor: pointer;
}

.button:hover {
  background: #d69b35;
}

.dots {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin-top: 24px;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #1e3a5a;
  animation: pulse 1.4s ease-in-out infinite;
}

.dot:nth-child(2) { animation-delay: .2s; }
.dot:nth-child(3) { animation-delay: .4s; }

@keyframes pulse {
  0%, 100% { background: #1e3a5a; transform: scale(1); }
  50% { background: #f4b13c; transform: scale(1.3); }
}

.version {
  margin-top: 20px;
  font-size: 10px;
  color: #1e3a5a;
  letter-spacing: 3px;
}
</style>
</head>
<body>
<div class="wrap">
  <span class="icon">⚓</span>
  <h1>BATTLE DOCK</h1>
  <div class="sub">LA Simulation de Docker</div>
  <div class="buttons">
    <a href="#" class="button">Inscription</a>
    <a href="#" class="button">Connexion</a>
  </div>
  <div class="dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
  <div class="version">Version 1.0.1</div>
</div>
</body>
</html>
