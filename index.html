<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14213f">
<title>Battle Dock Ferme</title>
<style>
:root{
  --nuit1:#3c5b86; --nuit2:#24406b; --nuit3:#14213f;
  --vert:#2f6b1f; --vert-clair:#63a84a; --vert-fonce:#255816;
  --carte:#fffdf9; --encre:#1e2735; --doux:#93a1b5; --pale:#a5adba; --filet:#dfe2e8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{min-height:100vh;display:flex;align-items:flex-end;justify-content:center;
  padding:24px 16px calc(22px + env(safe-area-inset-bottom));
  color:var(--encre);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:
    radial-gradient(55% 40% at 85% 88%, rgba(140,200,230,.20), transparent 70%),
    radial-gradient(120% 90% at 25% 0%, var(--nuit1) 0%, var(--nuit2) 45%, var(--nuit3) 100%);
  background-attachment:fixed;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input{font-family:inherit;font-size:15px}

.carte{width:100%;max-width:400px;background:var(--carte);border-radius:26px;
  padding:26px 20px 22px;box-shadow:0 2px 4px rgba(6,14,32,.12),0 20px 50px rgba(6,14,32,.5)}

.marque{text-align:center;margin-bottom:22px}
.marque svg{display:block;margin:0 auto 11px}
.marque h1{font:400 27px/1 Georgia,"Times New Roman",serif;letter-spacing:-.4px}
.marque .sous{font:600 10px system-ui;letter-spacing:6px;color:var(--doux);margin-top:8px}

.onglets{display:flex;gap:22px;border-bottom:1px solid #e2e4ea;margin-bottom:18px}
.onglets button{border:0;background:none;padding:0 0 9px;font-size:13.5px;font-weight:600;
  color:var(--pale);border-bottom:2.5px solid transparent;margin-bottom:-1px;cursor:pointer}
.onglets button.on{color:var(--encre);border-bottom-color:var(--nuit2)}

label{display:block;font-size:12px;color:var(--doux);margin:0 0 6px 2px}
.champ{position:relative;display:flex;align-items:center;gap:12px;border:1.5px solid var(--filet);
  border-radius:14px;padding:0 13px;margin-bottom:12px;transition:border-color .16s,box-shadow .16s;
  background:var(--carte)}
.champ:focus-within{border-color:var(--nuit2);box-shadow:0 0 0 3px rgba(36,64,107,.10)}
.champ svg{flex:0 0 auto}
.champ input{flex:1;min-width:0;border:0;outline:none;background:none;padding:14px 0;color:var(--encre)}
.champ input::placeholder{color:var(--pale)}
.oeil{border:0;background:none;padding:6px;cursor:pointer;display:flex;color:var(--pale)}

.lien{display:block;width:100%;text-align:right;border:0;background:none;font-size:12px;
  color:var(--doux);cursor:pointer;margin:-2px 0 4px}

.entrer{width:100%;border:0;border-radius:16px;padding:16px;margin-top:12px;
  background:var(--nuit2);color:#f7fafc;font-size:15.5px;font-weight:600;cursor:pointer;
  box-shadow:0 6px 18px rgba(36,64,107,.35);transition:transform .06s,filter .16s}
.entrer:active{transform:translateY(2px)}
.entrer:disabled{filter:grayscale(.4);opacity:.65}

.sep{display:flex;align-items:center;gap:12px;margin:18px 0 14px}
.sep i{flex:1;height:1px;background:#e2e4ea}
.sep span{font-size:11.5px;color:var(--pale);font-style:normal}
.invite{width:100%;border:1.5px solid var(--filet);background:none;border-radius:14px;padding:13px;
  font-size:14px;font-weight:600;color:var(--encre);cursor:pointer}
.invite:active{background:#f6f7fa}

.bas{text-align:center;font-size:13px;color:var(--doux);margin-top:16px}
.bas b{color:var(--nuit2);font-weight:600;cursor:pointer}

.msg{font-size:13px;line-height:1.5;border-radius:12px;padding:11px 13px;margin-bottom:14px;display:none}
.msg.on{display:block}
.msg.err{background:#fdecec;color:#9a2d26}
.msg.ok{background:#eaf4e6;color:#2c6b22}
</style>
</head>
<body>
<div class="carte">
  <div class="marque">
    <svg width="44" height="44" viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="20" r="19" fill="none" stroke="#2f6b1f" stroke-width="2"/>
      <path d="M20 30 L20 15" stroke="#2f6b1f" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M20 18 C14 18 12 13 12 10 C17 10 20 13 20 18Z" fill="#2f6b1f"/>
      <path d="M20 21 C26 21 28 16 28 13 C23 13 20 16 20 21Z" fill="#63a84a"/>
    </svg>
    <h1>Battle Dock</h1>
    <div class="sous">FERME</div>
  </div>

  <div class="onglets">
    <button id="t-co" class="on">Connexion</button>
    <button id="t-in">Inscription</button>
  </div>

  <div class="msg" id="msg"></div>

  <div id="bloc-pseudo" style="display:none">
    <label for="pseudo">Nom de la ferme</label>
    <div class="champ">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#93a1b5" stroke-width="1.9" stroke-linecap="round">
        <path d="M3 20V11l9-6 9 6v9"/><path d="M9 20v-6h6v6"/></svg>
      <input id="pseudo" maxlength="24" autocomplete="nickname" placeholder="chez toi">
    </div>
  </div>

  <label for="email">Adresse e-mail</label>
  <div class="champ">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#93a1b5" stroke-width="1.9" stroke-linecap="round">
      <circle cx="12" cy="8" r="4"/><path d="M4.5 20c1.6-4 4.4-6 7.5-6s5.9 2 7.5 6"/></svg>
    <input id="email" type="email" autocomplete="email" placeholder="toi@exemple.fr">
  </div>

  <label for="mdp">Mot de passe</label>
  <div class="champ">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#93a1b5" stroke-width="1.9" stroke-linecap="round">
      <rect x="4" y="10.5" width="16" height="10" rx="2.5"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>
    <input id="mdp" type="password" autocomplete="current-password" placeholder="••••••••">
    <button class="oeil" id="oeil" aria-label="Afficher le mot de passe">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
        <path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.6"/></svg>
    </button>
  </div>

  <button class="lien" id="oubli">Mot de passe oublié ?</button>
  <button class="entrer" id="valider">Entrer</button>

  <div class="sep"><i></i><span>ou</span><i></i></div>
  <button class="invite" id="invite">Jouer sans compte</button>

  <div class="bas" id="bascule">Première visite ? <b>Créer une ferme</b></div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient('https://zpfkekiavlfphialvphi.supabase.co',
                      'sb_publishable__dfR2lEOwKjhhtavvJEvGw_KVACZnHP');
const $=id=>document.getElementById(id);
let mode='co';

const afficher=(t,type)=>{const m=$('msg');m.textContent=t;m.className='msg on '+(type||'');};
const cacher=()=>{$('msg').className='msg';};

function basculer(m){
  mode=m;cacher();
  $('t-co').classList.toggle('on',m==='co');
  $('t-in').classList.toggle('on',m==='in');
  $('bloc-pseudo').style.display=m==='in'?'block':'none';
  $('oubli').style.display=m==='co'?'block':'none';
  $('valider').textContent=m==='co'?'Entrer':'Créer ma ferme';
  $('mdp').autocomplete=m==='co'?'current-password':'new-password';
  $('bascule').innerHTML=m==='co'?'Première visite ? <b>Créer une ferme</b>'
                                 :'Déjà un compte ? <b>Se connecter</b>';
}
$('t-co').onclick=()=>basculer('co');
$('t-in').onclick=()=>basculer('in');
$('bascule').onclick=()=>basculer(mode==='co'?'in':'co');
$('oeil').onclick=()=>{const c=$('mdp');c.type=c.type==='password'?'text':'password';};

$('valider').onclick=async()=>{
  const email=$('email').value.trim(), mdp=$('mdp').value, pseudo=$('pseudo').value.trim();
  if(!email||!mdp)return afficher('Il manque l’adresse ou le mot de passe.','err');
  if(mode==='in'&&pseudo.length<3)return afficher('Donne un nom d’au moins 3 lettres à ta ferme.','err');
  if(mode==='in'&&mdp.length<8)return afficher('Le mot de passe doit faire au moins 8 caractères.','err');
  const b=$('valider');b.disabled=true;b.textContent='Un instant…';cacher();
  try{
    if(mode==='co'){
      const {error}=await sb.auth.signInWithPassword({email,password:mdp});
      if(error)throw error;
      location.href='jeu.html';
    }else{
      const {error}=await sb.auth.signUp({email,password:mdp,options:{data:{ferme:pseudo}}});
      if(error)throw error;
      afficher('Ferme créée. Confirme ton adresse par e-mail, puis connecte-toi.','ok');
      basculer('co');
    }
  }catch(e){
    const t=(e&&e.message)||'';
    afficher(/Invalid login/i.test(t)?'Adresse ou mot de passe incorrect.':
      /already registered/i.test(t)?'Cette adresse a déjà une ferme.':
      'Ça n’a pas marché : '+t,'err');
  }finally{b.disabled=false;b.textContent=mode==='co'?'Entrer':'Créer ma ferme';}
};
$('oubli').onclick=async()=>{
  const email=$('email').value.trim();
  if(!email)return afficher('Écris ton adresse, je t’envoie un lien.','err');
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin});
  afficher(error?('Échec : '+error.message):'Lien de réinitialisation envoyé.',error?'err':'ok');
};
$('invite').onclick=()=>{try{localStorage.setItem('bdl.invite','1');}catch(x){}location.href='jeu.html';};
document.addEventListener('keydown',e=>{if(e.key==='Enter')$('valider').click();});
sb.auth.getSession().then(({data})=>{if(data.session)location.href='jeu.html';});
</script>
</body>
</html>
