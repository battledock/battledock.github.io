<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7ba35c">
<title>Battle Dock · La Ferme</title>
<style>
:root{
  --carte:#fffdf7; --encre:#2c3a26; --doux:#8a9083; --pale:#a8a08e; --filet:#e6e0d2;
  --vert:#2f6b1f; --vert-f:#255816; --vert-p:#eef4e9;
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%;overflow:hidden}
body{height:100vh;height:100svh;height:100dvh;overflow:hidden;background:#7ba35c;color:var(--encre);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none;
  touch-action:manipulation}
button,input{font-family:inherit;font-size:15px}

#scene{position:fixed;inset:0;z-index:0}
#scene svg{display:block;width:100%;height:100%}

.plaque{position:fixed;left:26px;right:26px;top:max(16vh,92px);z-index:2;text-align:center;
  background:rgba(253,251,244,.94);border-radius:4px;padding:22px 18px;
  box-shadow:0 18px 40px rgba(30,40,20,.42);animation:pose .6s cubic-bezier(.2,.8,.3,1)}
@keyframes pose{from{transform:translateY(-14px) rotate(-.6deg);opacity:0}}
.plaque .marque{font:600 10px system-ui;letter-spacing:7px;color:var(--pale)}
.plaque h1{font:400 40px/1 Georgia,"Times New Roman",serif;margin-top:11px;letter-spacing:-.4px}

.actions{position:fixed;left:20px;right:20px;bottom:max(22px,env(safe-area-inset-bottom));z-index:2;
  animation:remonte .6s .1s cubic-bezier(.2,.8,.3,1) backwards}
@keyframes remonte{from{transform:translateY(20px);opacity:0}}
.gros{width:100%;border:0;border-radius:16px;padding:16px;font-size:15.5px;font-weight:600;cursor:pointer;
  transition:transform .07s}
.gros:active{transform:translateY(2px)}
.gros.vert{background:var(--vert);color:#fdfbf4;box-shadow:0 12px 28px rgba(20,40,12,.45)}
.gros.clair{background:rgba(253,251,244,.94);color:var(--encre);margin-top:10px;
  box-shadow:0 10px 24px rgba(30,40,20,.3)}
.sans{display:block;width:100%;border:0;background:none;margin-top:13px;padding:6px;
  font-size:12.5px;font-weight:600;color:#f0f4e8;text-shadow:0 1px 3px rgba(20,30,15,.55);cursor:pointer}

#voile{position:fixed;inset:0;z-index:5;background:rgba(22,32,18,.5);opacity:0;pointer-events:none;
  transition:opacity .28s}
#voile.on{opacity:1;pointer-events:auto}
#feuille{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--carte);
  border-radius:24px 24px 0 0;padding:14px 18px calc(22px + env(safe-area-inset-bottom));
  box-shadow:0 -16px 40px rgba(20,30,15,.42);transform:translateY(102%);
  transition:transform .34s cubic-bezier(.2,.85,.3,1);max-height:92dvh;overflow-y:auto;
  overscroll-behavior:contain}
#feuille.on{transform:none}
.poignee{width:42px;height:4px;border-radius:2px;background:#e0dac9;margin:0 auto 16px}
#feuille h2{font:400 22px Georgia,serif;text-align:center}
#feuille .sous{font:400 12.5px system-ui;color:var(--doux);text-align:center;margin-top:6px}

label{display:block;font-size:11.5px;color:var(--doux);margin:14px 0 5px 3px}
.champ{display:flex;align-items:center;gap:10px;border:1px solid var(--filet);border-radius:13px;
  padding:0 12px;background:#fffefa;transition:border-color .16s,box-shadow .16s}
.champ:focus-within{border-color:var(--vert);box-shadow:0 0 0 3px rgba(47,107,31,.1)}
.champ input{flex:1;min-width:0;border:0;outline:none;background:none;padding:13px 0;color:var(--encre)}
.champ input::placeholder{color:var(--pale)}
.oeil{border:0;background:none;padding:6px;display:flex;color:var(--pale);cursor:pointer}
.oubli{display:block;width:100%;text-align:right;border:0;background:none;font-size:11.5px;
  color:var(--doux);margin-top:9px;cursor:pointer}
.valider{width:100%;border:0;border-radius:15px;padding:15px;margin-top:14px;background:var(--vert);
  color:#fdfbf4;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 6px 18px rgba(47,107,31,.26)}
.valider:active{transform:translateY(2px)}
.valider:disabled{opacity:.6}
.bascule{text-align:center;font-size:12.5px;color:var(--doux);margin-top:13px}
.bascule b{color:var(--vert);font-weight:600;cursor:pointer}
.msg{font-size:12.5px;line-height:1.5;border-radius:11px;padding:10px 12px;margin-top:12px;display:none}
.msg.on{display:block}
.msg.err{background:#fbeceb;color:#93312a}
.msg.ok{background:var(--vert-p);color:var(--vert)}

@keyframes ombreNuage{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,12px)}}
.ombre-nuage{animation:ombreNuage 26s ease-in-out infinite}

@media (max-height:660px){
  .plaque{top:max(10vh,62px);padding:16px 14px}
  .plaque h1{font-size:32px}
}
</style>
</head>
<body>
<div id="scene"></div>

<div class="plaque">
  <div class="marque">BATTLE DOCK</div>
  <h1>La Ferme</h1>
</div>

<div class="actions">
  <button class="gros vert" id="b-entrer">Entrer dans ma ferme</button>
  <button class="gros clair" id="b-creer">Créer une ferme</button>
  <button class="sans" id="b-invite">jouer sans compte</button>
</div>

<div id="voile"></div>
<div id="feuille"><div class="poignee"></div><div id="feuille-b"></div></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient('https://zpfkekiavlfphialvphi.supabase.co',
                      'sb_publishable__dfR2lEOwKjhhtavvJEvGw_KVACZnHP');
const $=id=>document.getElementById(id);

/* ================= la vue du ciel ================= */
function SCENE(){
  const A=(a,b,s)=>{const v=Math.sin(a*127.1+b*311.7+s*74.7)*43758.5;return v-Math.floor(v);};
  const H=860;                        // hauteur de référence
  /* bandes de parcelles : deux colonnes, cinq rangées, bords irréguliers */
  const yG=[-10,132,286,438,590,742,H+20];   // limites côté gauche
  const yD=[-10,108,258,412,566,720,H+20];   // limites côté droit
  const xM=[186,152,168,186,204,214,222];    // ligne de séparation centrale
  const teintes=[['#c9ad63','p1'],['#8fae5e','p2'],['#a3843f','p3'],['#d8c07e','p1'],
                 ['#8aa85a','p2'],['#6f9a4e','p3'],['#c2a05a','p1'],['#9cb867','p2'],
                 ['#7f9c52','p3'],['#b59a56','p1']];
  let parcelles='';
  for(let r=0;r<6;r++){
    const [cg,pg]=teintes[(r*2)%teintes.length];
    const [cd,pd]=teintes[(r*2+1)%teintes.length];
    parcelles+=`<path d="M-14 ${yG[r]} L${xM[r]} ${yG[r]-((yG[r]-yD[r])*0)} L${xM[r+1]} ${yG[r+1]} L-14 ${yG[r+1]}Z" fill="${cg}"/>
      <path d="M-14 ${yG[r]} L${xM[r]} ${yG[r]} L${xM[r+1]} ${yG[r+1]} L-14 ${yG[r+1]}Z" fill="url(#${pg})"/>
      <path d="M${xM[r]} ${yG[r]} L414 ${yD[r]} L414 ${yD[r+1]} L${xM[r+1]} ${yG[r+1]}Z" fill="${cd}"/>
      <path d="M${xM[r]} ${yG[r]} L414 ${yD[r]} L414 ${yD[r+1]} L${xM[r+1]} ${yG[r+1]}Z" fill="url(#${pd})"/>`;
  }
  /* haies : les limites en vert foncé, plus un semis de buissons dessus */
  let haies='';
  for(let r=1;r<6;r++){
    haies+=`<path d="M-14 ${yG[r]} L${xM[r]} ${yG[r]} L414 ${yD[r]}" stroke="#4f6b3a" stroke-width="5" fill="none" opacity=".85"/>`;
    for(let i=0;i<9;i++){
      const t=i/8, x=-14+t*428;
      const yy=(x<xM[r]) ? yG[r] : yG[r]+(x-xM[r])/(414-xM[r])*(yD[r]-yG[r]);
      haies+=`<circle cx="${x.toFixed(0)}" cy="${(yy+A(i,r,3)*4-2).toFixed(0)}" r="${(3.4+A(i,r,7)*2.6).toFixed(1)}" fill="#456035" opacity=".9"/>`;
    }
  }
  haies+=`<path d="M186 -14 L152 132 L168 286 L186 438 L204 590 L214 742 L222 ${H+20}" stroke="#4f6b3a" stroke-width="5" fill="none" opacity=".85"/>`;
  /* chemin de terre en diagonale, avec ornières */
  const chemin=`
    <path d="M-18 118 Q120 214 214 372 Q308 528 424 640 L424 690 Q292 572 190 402 Q96 244 -18 152Z" fill="#d9c9a2"/>
    <path d="M-18 132 Q118 224 210 378 Q302 530 424 652" stroke="#c8b489" stroke-width="3.4" fill="none" opacity=".75"/>
    <path d="M-18 146 Q116 236 204 386 Q296 536 424 664" stroke="#cbb78d" stroke-width="2.4" fill="none" opacity=".55"/>`;
  /* bosquets dispersés */
  let bois='';
  const amas=[[62,352],[96,372],[336,470],[358,492],[78,652],[318,196],[300,686]];
  amas.forEach(([x,y],i)=>{
    bois+=`<g><ellipse cx="${x+3}" cy="${y+9}" rx="17" ry="7" fill="rgba(30,45,20,.2)"/>
      <circle cx="${x}" cy="${y}" r="${11+A(i,1,5)*4}" fill="#4f7a44"/>
      <circle cx="${x+12}" cy="${y+8}" r="${8+A(i,2,9)*3}" fill="#598a4c"/>
      <circle cx="${x-10}" cy="${y+7}" r="${7+A(i,3,11)*3}" fill="#446b3c"/></g>`;
  });
  /* la ferme, vue de dessus */
  const ferme=`
   <g>
     <ellipse cx="272" cy="176" rx="46" ry="12" fill="rgba(35,50,22,.2)"/>
     <g transform="rotate(-7 272 152)">
       <rect x="240" y="126" width="64" height="46" rx="3" fill="#b64f34"/>
       <rect x="240" y="126" width="64" height="10" rx="3" fill="#d2694a"/>
       <rect x="268" y="126" width="8" height="46" fill="#9c422b" opacity=".7"/>
       <rect x="246" y="176" width="52" height="7" rx="2" fill="#c9bda0"/>
     </g>
     <g transform="rotate(-7 322 186)">
       <rect x="306" y="170" width="34" height="28" rx="3" fill="#9a7f5e"/>
       <rect x="306" y="170" width="34" height="7" rx="3" fill="#b39a72"/>
     </g>
     <circle cx="236" cy="196" r="10" fill="#6f8f50"/>
     <ellipse cx="300" cy="210" rx="18" ry="13" fill="#7fa055"/>
     <rect x="316" y="140" width="16" height="16" rx="8" fill="#d9d3c4"/>
   </g>`;
  /* troupeau */
  let betes='';
  [[196,650],[210,664],[184,668],[228,646]].forEach(([x,y],i)=>{
    betes+=`<g><ellipse cx="${x+2}" cy="${y+4}" rx="7" ry="3" fill="rgba(30,45,20,.22)"/>
      <ellipse cx="${x}" cy="${y}" rx="6.5" ry="4" fill="#f4f1e6"/>
      <ellipse cx="${x-3}" cy="${y-1}" rx="2.6" ry="1.8" fill="#4a4a52"/></g>`;
  });

  return `
<svg viewBox="0 0 400 860" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <pattern id="p1" width="7" height="7" patternTransform="rotate(24)" patternUnits="userSpaceOnUse">
    <rect width="7" height="3.2" fill="rgba(0,0,0,.075)"/></pattern>
  <pattern id="p2" width="6" height="6" patternTransform="rotate(-38)" patternUnits="userSpaceOnUse">
    <rect width="6" height="2.6" fill="rgba(0,0,0,.085)"/></pattern>
  <pattern id="p3" width="9" height="9" patternTransform="rotate(70)" patternUnits="userSpaceOnUse">
    <rect width="9" height="3.6" fill="rgba(0,0,0,.065)"/></pattern>
  <radialGradient id="lum" cx=".28" cy=".16" r=".95">
    <stop offset="0" stop-color="rgba(255,246,206,.34)"/><stop offset="1" stop-color="rgba(255,246,206,0)"/></radialGradient>
  <radialGradient id="vign" cx=".5" cy=".45" r=".82">
    <stop offset=".48" stop-color="rgba(0,0,0,0)"/><stop offset="1" stop-color="rgba(28,40,18,.42)"/></radialGradient>
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope=".12"/></feComponentTransfer></filter>
 </defs>
 <rect width="400" height="860" fill="#7ba35c"/>
 ${parcelles}
 ${haies}
 ${chemin}
 ${bois}
 ${ferme}
 ${betes}
 <g class="ombre-nuage" opacity=".15">
   <ellipse cx="150" cy="330" rx="130" ry="66" fill="#1e2a16"/>
   <ellipse cx="250" cy="292" rx="86" ry="44" fill="#1e2a16"/>
   <ellipse cx="96" cy="386" rx="70" ry="36" fill="#1e2a16"/></g>
 <rect width="400" height="860" fill="url(#lum)"/>
 <rect width="400" height="860" fill="url(#vign)"/>
 <rect width="400" height="860" filter="url(#grain)" opacity=".5" style="mix-blend-mode:multiply"/>
</svg>`;
}
$('scene').innerHTML=SCENE();

/* ================= la feuille ================= */
let mode='co';
const champEmail=`<label for="email">Adresse e-mail</label>
  <div class="champ">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#a8a08e" stroke-width="1.9" stroke-linecap="round">
      <circle cx="12" cy="8" r="4"/><path d="M4.5 20c1.6-4 4.4-6 7.5-6s5.9 2 7.5 6"/></svg>
    <input id="email" type="email" autocomplete="email" placeholder="toi@exemple.fr"></div>`;
const champMdp=(neuf)=>`<label for="mdp">Mot de passe</label>
  <div class="champ">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#a8a08e" stroke-width="1.9" stroke-linecap="round">
      <rect x="4" y="10.5" width="16" height="10" rx="2.5"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>
    <input id="mdp" type="password" autocomplete="${neuf?'new-password':'current-password'}" placeholder="••••••••">
    <button class="oeil" id="oeil" aria-label="Afficher">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
        <path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.6"/></svg>
    </button></div>`;

function ouvrir(m){
  mode=m;
  $('feuille-b').innerHTML = m==='co'
   ? `<h2>Content de te revoir</h2><div class="sous">Entre pour reprendre ta ferme</div>
      ${champEmail}${champMdp(false)}
      <button class="oubli" id="oubli">Mot de passe oublié ?</button>
      <div class="msg" id="msg"></div>
      <button class="valider" id="valider">Entrer</button>
      <div class="bascule">Pas encore de ferme ? <b id="vers-in">En créer une</b></div>`
   : `<h2>Une nouvelle ferme</h2><div class="sous">Choisis son nom, il s’affichera partout</div>
      <label for="ferme">Nom de la ferme</label>
      <div class="champ">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#a8a08e" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 20V11l9-6 9 6v9"/><path d="M9 20v-6h6v6"/></svg>
        <input id="ferme" maxlength="24" placeholder="Les Trois Chênes"></div>
      ${champEmail}${champMdp(true)}
      <div class="msg" id="msg"></div>
      <button class="valider" id="valider">Créer ma ferme</button>
      <div class="bascule">Déjà une ferme ? <b id="vers-co">Se connecter</b></div>`;
  $('voile').classList.add('on');$('feuille').classList.add('on');
  brancher();
  setTimeout(()=>{const c=$(m==='co'?'email':'ferme');if(c)c.focus();},340);
}
function fermer(){$('voile').classList.remove('on');$('feuille').classList.remove('on');}
$('voile').onclick=fermer;
$('b-entrer').onclick=()=>ouvrir('co');
$('b-creer').onclick=()=>ouvrir('in');
$('b-invite').onclick=()=>{try{localStorage.setItem('bdl.invite','1');}catch(x){}location.href='jeu.html';};

const afficher=(t,type)=>{const m=$('msg');if(!m)return;m.textContent=t;m.className='msg on '+(type||'');};
const cacher=()=>{const m=$('msg');if(m)m.className='msg';};

function brancher(){
  const oe=$('oeil');
  if(oe)oe.onclick=()=>{const c=$('mdp');c.type=c.type==='password'?'text':'password';};
  const vi=$('vers-in');if(vi)vi.onclick=()=>ouvrir('in');
  const vc=$('vers-co');if(vc)vc.onclick=()=>ouvrir('co');
  const ou=$('oubli');
  if(ou)ou.onclick=async()=>{
    const email=($('email').value||'').trim();
    if(!email)return afficher('Écris ton adresse, je t’envoie un lien.','err');
    const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin});
    afficher(error?('Échec : '+error.message):'Lien de réinitialisation envoyé.',error?'err':'ok');
  };
  $('valider').onclick=valider;
  [$('email'),$('mdp'),$('ferme')].forEach(c=>{if(c)c.addEventListener('keydown',ev=>{
    if(ev.key==='Enter')valider();});});
}

async function valider(){
  const email=($('email').value||'').trim(), mdp=$('mdp').value;
  const ferme=$('ferme')?$('ferme').value.trim():'';
  if(!email||!mdp)return afficher('Il manque l’adresse ou le mot de passe.','err');
  if(mode==='in'&&ferme.length<3)return afficher('Donne un nom d’au moins 3 lettres à ta ferme.','err');
  if(mode==='in'&&mdp.length<8)return afficher('Le mot de passe doit faire au moins 8 caractères.','err');
  const b=$('valider');b.disabled=true;const av=b.textContent;b.textContent='Un instant…';cacher();
  try{
    if(mode==='co'){
      const {error}=await sb.auth.signInWithPassword({email,password:mdp});
      if(error)throw error;location.href='jeu.html';
    }else{
      const {data,error}=await sb.auth.signUp({email,password:mdp,options:{data:{ferme}}});
      if(error)throw error;
      if(data.session){location.href='jeu.html';return;}
      afficher('Ferme créée. Confirme ton adresse par e-mail, puis connecte-toi.','ok');
    }
  }catch(err){
    const t=(err&&err.message)||'';
    afficher(/Invalid login/i.test(t)?'Adresse ou mot de passe incorrect.':
      /already registered/i.test(t)?'Cette adresse a déjà une ferme.':
      'Ça n’a pas marché : '+t,'err');
  }finally{b.disabled=false;b.textContent=av;}
}

sb.auth.getSession().then(({data})=>{if(data&&data.session)location.href='jeu.html';});
</script>
</body>
</html>
