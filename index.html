<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Le Rex du Quartier — La Séance</title>
<style>
:root{
  --safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px);
  --nuit:#0d0406;--velours:#5a1220;--velours2:#7c1c2e;--velours3:#3a0b14;
  --or:#e8b84b;--or-clair:#f7dd9a;--ecran:#fdf8ec;--encre:#241a12;
  --rideauW:clamp(34px,9vw,56px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:Georgia,serif;background:var(--nuit);color:var(--encre);
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;
  padding:calc(8px + var(--safeT)) 0 calc(24px + var(--safeB));
  overflow-x:hidden;position:relative;
}

/* ================== RIDEAUX ================== */
/* cantonnière (haut) */
.cantonniere{
  position:fixed;top:0;left:0;right:0;height:calc(74px + var(--safeT));z-index:10;pointer-events:none;
  filter:drop-shadow(0 6px 14px rgba(0,0,0,.7));
}
.cantonniere svg{width:100%;height:100%;display:block}
/* rideaux latéraux drapés */
.rideau{
  position:fixed;top:0;bottom:0;width:var(--rideauW);z-index:4;pointer-events:none;
}
.rideau svg{width:100%;height:100%;display:block}
.rideau.g{left:0}
.rideau.d{right:0;transform:scaleX(-1)}

/* ================== PROJECTEUR ================== */
.faisceau{
  position:fixed;left:50%;top:0;transform:translateX(-50%);z-index:1;pointer-events:none;
  width:0;height:0;
  border-left:36vw solid transparent;border-right:36vw solid transparent;
  border-top:58dvh solid rgba(247,221,154,.055);
}
.poussiere{position:fixed;inset:0;z-index:1;pointer-events:none}
.grain{
  position:absolute;width:2.5px;height:2.5px;border-radius:50%;
  background:rgba(247,221,154,.5);
  animation:flotte linear infinite;
}
@keyframes flotte{
  0%{transform:translateY(-8px) translateX(0);opacity:0}
  15%{opacity:.7}
  85%{opacity:.5}
  100%{transform:translateY(56dvh) translateX(14px);opacity:0}
}

/* ================== L'ÉCRAN ================== */
.salle{position:relative;z-index:5;width:min(calc(100vw - 2*var(--rideauW) - 14px),400px);margin-top:calc(66px + var(--safeT))}
.ecranCine{
  position:relative;
  background:
    radial-gradient(ellipse 120% 90% at 50% 0%, #fffdf6, var(--ecran) 55%, #eee3cb);
  border:10px solid #17090d;
  border-bottom-width:15px;
  border-radius:8px;
  box-shadow:
    0 0 60px rgba(253,248,236,.28),
    0 0 140px rgba(253,248,236,.10),
    0 22px 50px rgba(0,0,0,.8),
    inset 0 0 40px rgba(120,90,40,.08);
  padding:20px 18px 24px;
  overflow:hidden;
}
/* grain de projection */
.ecranCine::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(circle at 22% 28%,rgba(120,90,40,.06) 0 2px,transparent 3px) 0 0/85px 65px,
    radial-gradient(circle at 70% 60%,rgba(120,90,40,.05) 0 2px,transparent 3px) 0 0/105px 85px;
  animation:proj .4s steps(2) infinite;
}
@keyframes proj{50%{transform:translate(1px,1px)}}
/* vignettage doux de projection */
.ecranCine::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%,transparent 62%,rgba(60,35,15,.14));
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.titreEcran{
  text-align:center;font-size:clamp(23px,6.6vw,30px);font-weight:bold;
  letter-spacing:.12em;text-transform:uppercase;color:#571520;
  text-shadow:1px 1px 0 rgba(255,255,255,.6);
}
.filet{display:flex;align-items:center;gap:10px;margin:6px 0 2px}
.filet::before,.filet::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,#b8933a,transparent)}
.filet span{font-size:9px;letter-spacing:.32em;text-transform:uppercase;color:#8a6c2a;white-space:nowrap}

/* Bob au coin de l'écran, comme dans le film */
.scene-bob{display:flex;align-items:flex-end;gap:8px;margin-top:12px}
.bob{flex:0 0 clamp(80px,22vw,100px)}
.bob svg{width:100%;height:auto;display:block}
.brasAnim{transform-origin:60px 96px;animation:coucou 3.4s ease-in-out infinite}
@keyframes coucou{0%,70%,100%{transform:rotate(0)}78%{transform:rotate(-12deg)}86%{transform:rotate(3deg)}92%{transform:rotate(-8deg)}}
.bulle{
  flex:1;position:relative;background:#fff;border:2px solid var(--encre);
  border-radius:12px;padding:9px 11px;
  font-size:clamp(12.5px,3.4vw,14px);line-height:1.45;
  box-shadow:3px 3px 0 rgba(36,26,18,.18);
  min-height:60px;transition:opacity .18s;
}
.bulle::before{
  content:"";position:absolute;left:-9px;bottom:18px;
  border:9px solid transparent;border-right-color:var(--encre);border-left:0;
}
.bulle::after{
  content:"";position:absolute;left:-6px;bottom:20px;
  border:7px solid transparent;border-right-color:#fff;border-left:0;
}
.bulle b{display:block;font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.5;margin-bottom:3px}
.bulle.fondu{opacity:0}

/* formulaire projeté */
.onglets{display:flex;gap:8px;margin-top:14px}
.onglet{
  flex:1;padding:10px 0;font-family:inherit;font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  background:transparent;color:var(--encre);border:2px solid var(--encre);border-radius:6px;
  opacity:.4;cursor:pointer;transition:.2s;
}
.onglet.actif{opacity:1;background:var(--encre);color:var(--or-clair)}
label{display:block;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;margin:12px 0 4px;color:#6e5638}
input{
  width:100%;padding:12px;font-size:16px;font-family:'Courier New',monospace;
  background:rgba(255,255,255,.75);color:var(--encre);
  border:2px solid rgba(36,26,18,.35);border-radius:6px;outline:none;transition:.2s;
}
input::placeholder{color:rgba(36,26,18,.35);font-size:12.5px}
input:focus{border-color:#571520;box-shadow:0 0 0 3px rgba(87,21,32,.12)}
#champPseudo{display:none}
.mode-inscription #champPseudo{display:block}
.cta{
  width:100%;margin-top:18px;padding:14px 0;font-family:inherit;font-size:14px;font-weight:bold;
  letter-spacing:.14em;text-transform:uppercase;cursor:pointer;
  background:linear-gradient(180deg,#7c1c2e,#571520);color:var(--or-clair);
  border:2px solid var(--encre);border-radius:6px;
  box-shadow:0 5px 0 #2a0a10, 0 8px 16px rgba(0,0,0,.25);
  transition:transform .1s, box-shadow .1s;
}
.cta:active{transform:translateY(4px);box-shadow:0 1px 0 #2a0a10}
.cta:disabled{opacity:.55}

/* mention pied d'écran */
.pied{
  text-align:center;margin-top:14px;
  font-family:'Courier New',monospace;font-size:9.5px;letter-spacing:.22em;
  color:#8a6c2a;text-transform:uppercase;
}

/* ================== FAUTEUILS ================== */
.fauteuils{position:relative;z-index:6;width:min(calc(100vw - 2*var(--rideauW) - 6px),420px);margin-top:16px}
.fauteuils svg{width:100%;display:block}
</style>
</head>

<script>
/* ==== CONFIG SUPABASE (à remplir) ==== */
const SB_URL = "https://zpfkekiavlfphialvphi.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpwZmtla2lhdmxmcGhpYWx2cGhpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3Mjc4MzIsImV4cCI6MjEwMTMwMzgzMn0.ORa4y_AMjuWbxboKm3o6Jn7ryYjkOm4mSgLa2Schv98";

let modeActuel = "connexion";
const elBulle = document.getElementById("bulle");
const elTexte = document.getElementById("bulleTexte");
const elTitre = document.getElementById("bulleTitre");

const TITRES = {
  base:"Bob — projeté en avant-programme (il a exigé le rôle)",
  fier:"Bob — ovationné par la salle vide (il s'applaudit lui-même)",
  mefiant:"Bob — il te fixe depuis l'écran (c'est troublant, il assume)"
};

const REPLIQUES = {
  accueil:[
    "Éteins ton téléphone ! …Ah non, c'est toi le téléphone. Bon, remplis la fiche alors.",
    "Bienvenue dans MA salle. Choisis un fauteuil. Pas le 12. Le 12 sait ce qu'il a fait.",
    "T'arrives pile pour l'avant-programme : moi. Quarante secondes de gloire, profite."
  ],
  connexion:"Un habitué ! J'ai gardé ta place au chaud. Enfin, le chauffage est en panne, mais l'intention y est.",
  inscription:"Un NOUVEAU gérant ! La salle t'appartiendra. Le balcon aussi. Enfin, quand il sera réparé. Un jour.",
  emailFocus:"Ton email. Promis, je m'en sers que pour les urgences. Genre quand je perds la bobine. Littéralement.",
  mdpFocus:"Ton secret. Le mien ? Le « son mono d'époque », c'est juste que l'enceinte droite est morte.",
  pseudoFocus:"Réfléchis : ce nom sera projeté en ouverture. En très grand. Mes fautes de frappe aussi.",
  verif:"Je vérifie dans le grand cahier… il est dans la cabine… attends, je remonte l'escalier…",
  impression:"J'imprime ton billet depuis la cabine ! Si tu entends un bruit de mobylette, tout va bien.",
  refuse:"Coupez ! C'est pas les bons identifiants. On la refait, et cette fois avec conviction.",
  dejaLa:"Mais je te CONNAIS toi ! Passe par « J'ai ma carte », petit comédien.",
  courtMdp:"6 caractères minimum. Mon code de coffre est plus long. C'est 000000, mais y'a de l'intention.",
  vide:"Faut remplir la fiche ! Une séance sans billet, c'est du cinéma en plein air. Et il pleut.",
  confirme:"Billet réservé ! Va confirmer ton email. Je lance pas le film sans toi. J'ai que toi.",
  bienvenue:"Billet validé ! Silence dans la salle… noir… PROJECTION !",
  reseau:"Le réseau est en panne. Comme le projecteur en 1987. On s'en est remis. Enfin, presque."
};

function parle(t, titre){
  elBulle.classList.add("fondu");
  setTimeout(()=>{
    elTexte.textContent = t;
    if(titre) elTitre.textContent = titre;
    elBulle.classList.remove("fondu");
  },180);
}
parle(REPLIQUES.accueil[Math.floor(Math.random()*REPLIQUES.accueil.length)]);

function mode(m){
  modeActuel = m;
  document.getElementById("carte").classList.toggle("mode-inscription", m==="inscription");
  document.getElementById("ongletConnexion").classList.toggle("actif", m==="connexion");
  document.getElementById("ongletInscription").classList.toggle("actif", m==="inscription");
  document.getElementById("btnEntrer").textContent = m==="connexion" ? "Lancer la séance" : "Ouvrir mon cinéma";
  document.getElementById("mdp").autocomplete = m==="connexion" ? "current-password" : "new-password";
  document.getElementById("pied").textContent = m==="inscription"
    ? "— Grande ouverture · Le quartier compte sur toi —"
    : "— Salle unique · Son mono d'époque · Interdit aux pigeons —";
  parle(REPLIQUES[m], m==="inscription" ? TITRES.fier : TITRES.base);
}

document.getElementById("email").addEventListener("focus",()=>parle(REPLIQUES.emailFocus));
document.getElementById("mdp").addEventListener("focus",()=>parle(REPLIQUES.mdpFocus, TITRES.mefiant));
document.getElementById("pseudo").addEventListener("focus",()=>parle(REPLIQUES.pseudoFocus));

async function valider(){
  const email = document.getElementById("email").value.trim();
  const mdp = document.getElementById("mdp").value;
  const pseudo = document.getElementById("pseudo").value.trim();
  const btn = document.getElementById("btnEntrer");

  if(!email || !mdp) return parle(REPLIQUES.vide);
  if(modeActuel==="inscription" && !pseudo) return parle(REPLIQUES.pseudoFocus);
  if(mdp.length < 6) return parle(REPLIQUES.courtMdp);

  btn.disabled = true;
  parle(modeActuel==="connexion" ? REPLIQUES.verif : REPLIQUES.impression);

  const endpoint = modeActuel==="connexion"
    ? SB_URL + "/auth/v1/token?grant_type=password"
    : SB_URL + "/auth/v1/signup";
  const corps = modeActuel==="connexion"
    ? {email, password: mdp}
    : {email, password: mdp, data:{pseudo}};

  try{
    const rep = await fetch(endpoint,{
      method:"POST",
      headers:{"Content-Type":"application/json","apikey":SB_KEY},
      body:JSON.stringify(corps)
    });
    const data = await rep.json();

    if(!rep.ok){
      const err = (data.error_description || data.msg || "").toLowerCase();
      if(err.includes("invalid login")) parle(REPLIQUES.refuse, TITRES.mefiant);
      else if(err.includes("already registered")) parle(REPLIQUES.dejaLa);
      else parle("La machine dit : « " + (data.error_description || data.msg || rep.status) + " ». J'y comprends rien non plus, elle est belge.");
      btn.disabled = false;
      return;
    }

    if(data.access_token){
      localStorage.setItem("rex_session", JSON.stringify({
        access_token: data.access_token,
        refresh_token: data.refresh_token,
        user_id: data.user?.id,
        pseudo: data.user?.user_metadata?.pseudo || pseudo || ""
      }));
      parle(REPLIQUES.bienvenue, TITRES.fier);
      /* fondu au noir façon début de séance */
      setTimeout(()=>{
        document.body.style.transition = "opacity .8s";
        document.body.style.opacity = "0";
        setTimeout(()=>{ location.href = "jeu.html"; }, 820);
      }, 900);
    }else{
      parle(REPLIQUES.confirme, TITRES.fier);
      btn.disabled = false;
    }
  }catch(e){
    parle(REPLIQUES.reseau);
    btn.disabled = false;
  }
}

/* poussière dans le faisceau */
(function(){
  const c = document.getElementById("poussiere");
  for(let i=0;i<16;i++){
    const g = document.createElement("div");
    g.className = "grain";
    g.style.left = (34 + Math.random()*32) + "vw";
    g.style.top = "0";
    g.style.animationDuration = (6 + Math.random()*7) + "s";
    g.style.animationDelay = (Math.random()*8) + "s";
    g.style.opacity = .3 + Math.random()*.4;
    c.appendChild(g);
  }
})();
