<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentification - Battle Dock</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <style>
        /* Styles CSS */
        body {
            background-color: #0a0e14;
            color: #fff;
        }
        .icon {
            font-size: 48px;
            margin-bottom: 20px;
        }
        h1 {
            font-family: 'Pirata One', serif;
            font-size: 32px;
            color: #f4b13c;
            text-shadow: 2px 2px 0 #000;
            margin-bottom: 20px;
        }
        label, input, button, p {
            font-family: 'Special Elite', monospace;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        form {
            display: flex;
            flex-direction: column;
            width: 300px;
        }
        input, button {
            background-color: #1e2e40;
            color: #fff;
            border: none;
            padding: 10px;
            margin: 5px 0;
        }
        button {
            background-color: #f4b13c;
            color: #0a0e14;
            cursor: pointer;
        }
        input:hover, input:focus {
            outline: none;
            box-shadow: 0 0 5px #f4b13c;
        }
        button:hover {
            background-color: #d69b35;
        }
        h2 {
            font-family: 'Pirata One', serif;
            font-size: 24px;
            color: #f4b13c;
            text-shadow: 1px 1px 0 #000;
            margin-bottom: 20px;
        }
        a {
            color: #f4b13c;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Authentification - Battle Dock</h1>
        
        <!-- Formulaire d'inscription -->
        <h2>Inscription</h2>
        <form id="signup-form">
            <label for="signup-username">Nom d'utilisateur :</label>
            <input type="text" id="signup-username" name="username" required>
            <label for="signup-password">Mot de passe :</label>
            <input type="password" id="signup-password" name="password" required>
            <button type="submit">S'inscrire</button>
        </form>
        
        <!-- Formulaire de connexion -->
        <h2>Connexion</h2>
        <form id="login-form">
            <label for="login-username">Nom d'utilisateur :</label>
            <input type="text" id="login-username" name="username" required>
            <label for="login-password">Mot de passe :</label>
            <input type="password" id="login-password" name="password" required>
            <button type="submit">Se connecter</button>
        </form>
        
        <!-- Formulaire de mot de passe oublié -->
        <h2>Mot de passe oublié</h2>
        <form id="forgot-password-form">
            <label for="forgot-password-username">Nom d'utilisateur :</label>
            <input type="text" id="forgot-password-username" name="username" required>
            <button type="submit">Réinitialiser le mot de passe</button>
        </form>
        
        <!-- Formulaire de réinitialisation de mot de passe -->
        <h2>Réinitialiser le mot de passe</h2>
        <form id="reset-password-form">
            <label for="reset-password-username">Nom d'utilisateur :</label>
            <input type="text" id="reset-password-username" name="username" required>
            <label for="reset-password-new-password">Nouveau mot de passe :</label>
            <input type="password" id="reset-password-new-password" name="new-password" required>
            <label for="reset-password-confirm-password">Confirmez le nouveau mot de passe :</label>
            <input type="password" id="reset-password-confirm-password" name="confirm-password" required>
            <button type="submit">Réinitialiser le mot de passe</button>
        </form>
    </div>

    <script>
        // Initialisation du client Supabase
        const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
        const { createClient } = supabase;
        const supabaseClient = createClient(supabaseUrl, supabaseKey);

        // Inscription
        document.getElementById('signup-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const username = document.getElementById('signup-username').value;
            const password = document.getElementById('signup-password').value;
            
            try {
                const { data, error } = await supabaseClient
                    .from('users')
                    .insert({ username: username, password: password });
                
                if (error) {
                    console.error("Erreur lors de l'inscription :", error);
                    alert("Erreur lors de l'inscription : " + error.message);
                } else {
                    console.log("Inscription réussie :", data);
                    alert('Inscription réussie !');
                    // Rediriger vers la page de connexion ou effectuer d'autres actions
                }
            } catch (error) {
                console.error("Erreur lors de l'inscription :", error);
                alert("Erreur lors de l'inscription : " + error.message);
            }
        });

        // Connexion
        document.getElementById('login-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            
            try {
                const { data, error } = await supabaseClient
                    .from('users')
                    .select('*')
                    .eq('username', username)
                    .eq('password', password)
                    .single();
                
                if (error) {
                    console.error("Erreur lors de la connexion :", error);
                    alert('Erreur lors de la connexion : ' + error.message);
                } else {
                    console.log("Connexion réussie :", data);
                    alert('Connexion réussie !');
                    // Rediriger vers la page d'accueil ou effectuer d'autres actions
                }
            } catch (error) {
                console.error("Erreur lors de la connexion :", error);
                alert("Erreur lors de la connexion : " + error.message);
            }
        });

        // Mot de passe oublié
        document.getElementById('forgot-password-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const username = document.getElementById('forgot-password-username').value;
            
            try {
                const { data: users, error: userError } = await supabaseClient
                    .from('users')
                    .select('id')
                    .eq('username', username);
                
                if (userError || users.length === 0) {
                    console.error("Erreur lors de la recherche de l'utilisateur :", userError);
                    alert("Nom d'utilisateur non trouvé.");
                } else {
                    const userId = users[0].id;
                    // Envoyer un e-mail de réinitialisation de mot de passe à l'utilisateur
                    // Vous pouvez utiliser un service d'e-mail tiers ou une API de messagerie pour envoyer l'e-mail
                    alert("Un e-mail de réinitialisation de mot de passe a été envoyé à votre adresse e-mail.");
                }
            } catch (error) {
                console.error("Erreur lors de la réinitialisation du mot de passe :", error);
                alert("Erreur lors de la réinitialisation du mot de passe : " + error.message);
            }
        });

        // Réinitialisation du mot de passe
        document.getElementById('reset-password-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const username = document.getElementById('reset-password-username').value;
            const newPassword = document.getElementById('reset-password-new-password').value;
            const confirmPassword = document.getElementById('reset-password-confirm-password').value;
            
            if (newPassword !== confirmPassword) {
                alert("Les mots de passe ne correspondent pas.");
                return;
            }
            
            try {
                const { data: users, error: userError } = await supabaseClient
                    .from('users')
                    .select('id')
                    .eq('username', username);
                
                if (userError || users.length === 0) {
                    console.error("Erreur lors de la recherche de l'utilisateur :", userError);
                    alert("Nom d'utilisateur non trouvé.");
                } else {
                    const userId = users[0].id;
                    
                    const { data: updateData, error: updateError } = await supabaseClient.auth.admin.updateUserById(
                        userId,
                        { password: newPassword }
                    );
                    
                    if (updateError) {
                        console.error("Erreur lors de la réinitialisation du mot de passe :", updateError);
                        alert("Erreur lors de la réinitialisation du mot de passe : " + updateError.message);
                    } else {
                        console.log("Mot de passe réinitialisé avec succès :", updateData);
                        alert("Mot de passe réinitialisé avec succès !");
                        // Rediriger vers la page de connexion ou effectuer d'autres actions
                    }
                }
            } catch (error) {
                console.error("Erreur lors de la réinitialisation du mot de passe :", error);
                alert("Erreur lors de la réinitialisation du mot de passe : " + error.message);
            }
        });
    </script>
</body>
</html>
