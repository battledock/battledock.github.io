<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Battle Dock — Le Poste de Contrôle</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Boogaloo&family=Permanent+Marker&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    :root {
      --bg-dark: #0f172a;
      --guerite-border: #000;
      --guerite-bg: #e2e8f0;
      --accent-yellow: #fde047;
      --accent-red: #ef4444;
      --accent-green: #10b981;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background-color: var(--bg-dark);
      /* Motif de tôle froissée / hangar */
      background-image: radial-gradient(#1e293b 2px, transparent 2px);
      background-size: 20px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      overflow-x: hidden;
    }

    /* --- LE GARDIEN DU PORT (Dessiné en pur CSS) --- */
    .guardian-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: -15px;
      z-index: 2;
      position: relative;
    }

    .guardian-cap {
      width: 90px;
      height: 24px;
      background: #1e3a8a;
      border: 4px solid #000;
      border-radius: 20px 20px 0 0;
      position: relative;
    }
    .guardian-cap::after {
      content: 'POLICE DU PORT';
      position: absolute;
      font-family: 'Bangers', cursive;
      font-size: 10px;
      color: var(--accent-yellow);
      top: 1px;
      width: 100%;
      text-align: center;
    }

    .guardian-head {
      width: 110px;
      height: 90px;
      background: #ffedd5;
      border: 4px solid #000;
      border-radius: 0 0 40px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 8px 0 0 rgba(0,0,0,0.2);
    }

    /* Grosse barbe de vieux loup de mer */
    .guardian-beard {
      position: absolute;
      bottom: -10px;
      width: 120px;
      height: 35px;
      background: #64748b;
      border: 4px solid #000;
      border-radius: 0 0 50px 50px;
      z-index: 1;
    }

    .guardian-eyes {
      font-size: 22px;
      margin-top: -10px;
      letter-spacing: 10px;
      z-index: 2;
      animation: blink-eyes 3s infinite;
    }

    /* --- LA GUÉRITE (FENÊTRE DE SÉCURITÉ) --- */
    .paper-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      background: var(--guerite-bg);
      border: 5px solid #000;
      border-radius: 24px;
      padding: 20px 16px 16px 16px;
      box-shadow: 
        0px 15px 0px #000,
        0px 25px 50px rgba(0,0,0,0.5);
    }

    /* Projecteur lumineux sur la vitre */
    .paper-container::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top, rgba(253, 224, 71, 0.15) 0%, transparent 75%);
      border-radius: 18px;
      pointer-events: none;
    }

    .form-header {
      text-align: center;
      margin-bottom: 16px;
      background: #000;
      color: #fff;
      padding: 10px;
      border-radius: 12px;
      border: 2px solid #475569;
    }

    .form-header h1 {
      font-family: 'Bangers', cursive;
      font-size: 28px;
      letter-spacing: 1px;
      color: var(--accent-yellow);
    }

    .form-header p {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* Onglets / Boutons Radio Interphone */
    .form-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tab-btn {
      flex: 1;
      background: #334155;
      color: #cbd5e1;
      border: 4px solid #000;
      border-radius: 14px;
      padding: 12px 6px;
      font-family: 'Bangers', cursive;
      font-size: 16px;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 4px 0 #000;
      transition: all 0.05s ease;
    }

    .tab-btn.active {
      background: var(--accent-yellow);
      color: #000;
      transform: translateY(4px);
      box-shadow: none;
    }

    /* Formulaires */
    .form-section {
      display: none;
      flex-direction: column;
      gap: 14px;
    }

    .form-section.active {
      display: flex;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label {
      font-family: 'Boogaloo', cursive;
      font-size: 20px;
      color: #000;
      padding-left: 2px;
    }

    /* Inputs gros boutons spécial Mobile (pas de zoom forcé) */
    .typewriter-input {
      width: 100%;
      padding: 14px;
      font-size: 16px; /* Idéal pour éviter le zoom automatique iOS */
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      border: 4px solid #000;
      border-radius: 12px;
      background: #fff;
      color: #000;
      outline: none;
      box-shadow: 4px 4px 0px #000;
    }

    .typewriter-input:focus {
      background: #fffde7;
      border-color: #000;
    }

    /* Bulle de Dialogue du Gardien (Erreurs) */
    .admin-error {
      display: none;
      position: relative;
      background: #fff;
      border: 4px solid #000;
      color: #000;
      padding: 12px;
      border-radius: 16px;
      font-family: 'Permanent Marker', cursive;
      font-size: 13px;
      text-align: center;
      margin-bottom: 16px;
      box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
    }
    /* Flèche de la bulle pointant vers le haut (vers le gardien) */
    .admin-error::before {
      content: '';
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 0 12px 14px 12px;
      border-style: solid;
      border-color: transparent transparent #000 transparent;
    }
    .admin-error::after {
      content: '';
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 0 10px 11px 10px;
      border-style: solid;
      border-color: transparent transparent #fff transparent;
    }

    /* Gros Bouton Poussoir d'Alarme Mobile */
    .stamp-btn {
      width: 100%;
      padding: 16px;
      background: var(--accent-red);
      color: white;
      border: 4px solid #000;
      font-family: 'Bangers', cursive;
      font-size: 24px;
      letter-spacing: 1px;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 6px 0 #000;
      transition: all 0.05s ease;
      margin-top: 6px;
      text-shadow: 2px 2px 0 #000;
    }

    .stamp-btn:active {
      transform: translateY(6px);
      box-shadow: none;
    }

    /* Animations */
    @keyframes blink-eyes {
      0%, 90%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.1); }
    }

    .shake-head {
      animation: angry 0.4s ease-in-out;
    }
    @keyframes angry {
      0%, 100% { transform: translateX(0) rotate(0); }
      20% { transform: translateX(-8px) rotate(-5deg); }
      60% { transform: translateX(8px) rotate(5deg); }
    }
  </style>
</head>
<body>

  <div class="guardian-container" id="guardianFace">
    <div class="guardian-cap"></div>
    <div class="guardian-head">
      <div class="guardian-eyes">👀</div>
      <div class="guardian-beard"></div>
    </div>
  </div>

  <div class="paper-container">
    
    <div class="form-header">
      <h1>POSTE DE SÉCURITÉ</h1>
      <p>Hangar de Recrutement — Battle Dock</p>
    </div>

    <div class="form-tabs">
      <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">🔓 J'ai mon Pass</button>
      <button class="tab-btn" id="tabSignup" onclick="switchTab('signup')">📝 Nouveau Dossier</button>
    </div>

    <div class="admin-error" id="errorBox">HÉ ! Circulez y'a rien à voir !</div>

    <div class="form-section active" id="loginSection">
      <div class="form-group">
        <label>Matricule de liaison (Email) :</label>
        <input type="email" id="loginEmail" class="typewriter-input" placeholder="jojo@port.fr" autocomplete="email">
      </div>

      <div class="form-group">
        <label>Clé d'accès secrète (Password) :</label>
        <input type="password" id="loginPassword" class="typewriter-input" placeholder="••••••••">
      </div>

      <button class="stamp-btn" onclick="login()">🚨 ENFONCER POUR ENTRER 🚨</button>
    </div>

    <div class="form-section" id="signupSection">
      <div class="form-group">
        <label>Blase sur les Quais (Username) :</label>
        <input type="text" id="signupUsername" class="typewriter-input" placeholder="Gégé_Les_Gros_Bras" maxlength="20">
      </div>

      <div class="form-group">
        <label>Courrier électronique (Email) :</label>
        <input type="email" id="signupEmail" class="typewriter-input" placeholder="nom@exemple.com">
      </div>

      <div class="form-group">
        <label>Créer un code blindé (Password) :</label>
        <input type="password" id="signupPassword" class="typewriter-input" placeholder="6 caractères min.">
      </div>

      <button class="stamp-btn" style="background: var(--accent-green);" onclick="signup()">
        🪵 TAMPONNER MON ENGAGEMENT
      </button>
    </div>

  </div>

  <script>
    // Configuration Supabase d'origine préservée à 100%
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const supabaseClient = createClient(supabaseUrl, supabaseKey);

    function triggerGuardianAngry() {
      const face = document.getElementById('guardianFace');
      face.classList.remove('shake-head');
      void face.offsetWidth; // Force le reset de l'animation mobile
      face.classList.add('shake-head');
    }

    function switchTab(type) {
      document.getElementById('errorBox').style.display = 'none';
      if (type === 'login') {
        document.getElementById('tabLogin').classList.add('active');
        document.getElementById('tabSignup').classList.remove('active');
        document.getElementById('loginSection').classList.add('active');
        document.getElementById('signupSection').classList.remove('active');
      } else {
        document.getElementById('tabSignup').classList.add('active');
        document.getElementById('tabLogin').classList.remove('active');
        document.getElementById('signupSection').classList.add('active');
        document.getElementById('loginSection').classList.remove('active');
      }
    }

    function showError(msg) {
      triggerGuardianAngry();
      const box = document.getElementById('errorBox');
      box.innerHTML = `⚓ "${msg.toUpperCase()}"`;
      box.style.display = 'block';
    }

    async function login() {
      document.getElementById('errorBox').style.display = 'none';
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!email || !password) {
        showError('Espèce de mouette ! Remplis les cases !');
        return;
      }

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;

        const { data: profile } = await supabaseClient
          .from('profiles')
          .select('username')
          .eq('user_id', data.user.id)
          .single();

        localStorage.setItem('userId', data.user.id);
        if (profile) localStorage.setItem('username', profile.username);

        window.location.href = 'creer-badge.html';
      } catch (err) {
        console.error('Erreur:', err);
        showError('Faux pass ! Reste dehors ou je lâche les chiens !');
      }
    }

    async function signup() {
      document.getElementById('errorBox').style.display = 'none';
      const username = document.getElementById('signupUsername').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const password = document.getElementById('signupPassword').value;

      if (!username || !email || !password) {
        showError('Dossier vide ! Remplis tout l\'engagement !');
        return;
      }

      if (password.length < 6) {
        showError('Ton code est trop mou ! 6 caractères min !');
        return;
      }

      try {
        const { data: authData, error: authError } = await supabaseClient.auth.signUp({ email, password });
        if (authError) throw authError;

        const userId = authData.user.id;

        await supabaseClient.from('profiles').insert([{
          user_id: userId,
          username: username,
          email: email
        }]);

        await supabaseClient.from('game_progress').insert([{
          user_id: userId,
          level: 1,
          score: 0,
          rank: 'Docker Occasionnel',
          money: 100,
          energy: 50,
          energy_max: 50,
          xp: 0
        }]);

        await supabaseClient.from('leaderboard').insert([{
          user_id: userId,
          score: 100
        }]);

        localStorage.setItem('userId', userId);
        localStorage.setItem('username', username);
        window.location.href = 'creer-badge.html';
      } catch (err) {
        console.error('Erreur:', err);
        showError('Dossier refusé par le port : ' + err.message);
      }
    }

    document.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        const loginActive = document.getElementById('loginSection').classList.contains('active');
        if (loginActive) {
          login();
        } else {
          signup();
        }
      }
    });

    const userId = localStorage.getItem('userId');
    if (userId) {
      window.location.href = 'creer-badge.html';
    }
  </script>
</body>
</html>
