<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f4f1ea">
<title>Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700;800;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:'Inter',sans-serif;background:#f4f1ea;color:#16140f;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));
  position:relative}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.5;
  background-image:radial-gradient(rgba(0,0,0,.045) 1px,transparent 1px);background-size:14px 14px}

.wrap{position:relative;z-index:2;width:100%;max-width:400px;
  animation:rise .7s cubic-bezier(.2,.8,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* ── LOGO ── */
.brand{text-align:center;margin-bottom:26px}
.logo{width:60px;height:60px;margin:0 auto 16px;border-radius:16px;background:#16140f;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 30px rgba(22,20,15,.22)}
.logo svg{width:30px;height:30px}
.name{font-family:'Playfair Display',serif;font-weight:900;font-size:34px;letter-spacing:-1px;line-height:1}
.name em{font-style:italic;color:#c0392b}
.tag{font-size:9px;font-weight:900;letter-spacing:3px;color:#a09888;margin-top:8px}

/* ── ONGLETS ── */
.tabs{display:flex;background:#eae5da;border-radius:12px;padding:3px;margin-bottom:20px}
.tab{flex:1;border:none;background:transparent;border-radius:9px;padding:11px;cursor:pointer;
  font-family:Inter;font-size:11.5px;font-weight:800;letter-spacing:.8px;color:#8a8278;transition:all .25s}
.tab.on{background:#fff;color:#16140f;box-shadow:0 2px 8px rgba(22,20,15,.08)}

/* ── CARTE ── */
.card{background:#fff;border-radius:20px;padding:24px 22px;
  box-shadow:0 4px 28px rgba(22,20,15,.08),0 1px 3px rgba(22,20,15,.04)}
.pane{display:none}
.pane.on{display:block;animation:fade .35s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ── CHAMPS ── */
.fld{margin-bottom:15px}
.lbl{display:block;font-size:9.5px;font-weight:900;letter-spacing:1.6px;color:#a09888;margin-bottom:7px}
.inp{width:100%;background:#faf8f3;border:1.5px solid #e8e2d6;border-radius:12px;padding:13px 14px;
  font-family:Inter;font-size:15px;font-weight:600;color:#16140f;outline:none;transition:border-color .2s,box-shadow .2s}
.inp:focus{border-color:#16140f;box-shadow:0 0 0 3px rgba(22,20,15,.05)}
.inp::placeholder{color:#c4bdb0;font-weight:500}
.inp.bad{border-color:#c0392b;box-shadow:0 0 0 3px rgba(192,57,43,.06)}
.inp.good{border-color:#16a34a}
.hint{font-size:10.5px;color:#a09888;margin-top:6px;line-height:1.4;min-height:14px}
.hint.err{color:#c0392b;font-weight:600}
.hint.ok{color:#16a34a;font-weight:600}

/* jauge force du mot de passe */
.pwbar{height:3px;background:#eae5da;border-radius:2px;margin-top:7px;overflow:hidden}
.pwfill{height:100%;width:0;border-radius:2px;transition:width .3s,background .3s}

/* ── BOUTONS ── */
.btn{width:100%;border:none;border-radius:12px;padding:15px;font-family:Inter;
  font-size:12px;font-weight:900;letter-spacing:1.4px;cursor:pointer;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-p{background:#16140f;color:#fff;box-shadow:0 8px 22px rgba(22,20,15,.2);margin-top:4px}
.btn-l{background:transparent;color:#8a8278;font-size:11px;font-weight:700;letter-spacing:.4px;
  padding:12px;margin-top:6px;text-decoration:underline;text-underline-offset:3px}

/* ── MESSAGE ── */
.msg{border-radius:12px;padding:12px 14px;font-size:12px;line-height:1.5;margin-bottom:16px;
  display:none;font-weight:500}
.msg.on{display:block;animation:fade .3s}
.msg.err{background:#fdf0ef;border:1px solid #f2ccc8;color:#c0392b}
.msg.ok{background:#eefaf1;border:1px solid #c3ebd0;color:#1a7d3f}
.msg.info{background:#f0f4fd;border:1px solid #cdd9f5;color:#2c5aa8}

/* ── LOADER ── */
.spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}

.foot{text-align:center;margin-top:20px;font-size:9px;letter-spacing:2px;color:#c4bdb0;font-weight:700}
</style>
</head>
<body>
<div class="wrap">

  <div class="brand">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#ffcf3f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="4" r="2"/><line x1="12" y1="6" x2="12" y2="22"/>
        <line x1="7" y1="10" x2="17" y2="10"/><path d="M4 14a8 8 0 0 0 16 0"/>
      </svg>
    </div>
    <div class="name">Battle <em>Dock</em></div>
    <div class="tag">MANUTENTION PORTUAIRE</div>
  </div>

  <div class="tabs">
    <button class="tab on" id="tCo" onclick="tab('co')">CONNEXION</button>
    <button class="tab" id="tIn" onclick="tab('in')">INSCRIPTION</button>
  </div>

  <div class="card">
    <div class="msg" id="msg"></div>

    <!-- ══ CONNEXION ══ -->
    <div class="pane on" id="pCo">
      <div class="fld">
        <label class="lbl">EMAIL</label>
        <input class="inp" id="coMail" type="email" inputmode="email" autocomplete="email" placeholder="toi@exemple.fr">
      </div>
      <div class="fld">
        <label class="lbl">MOT DE PASSE</label>
        <input class="inp" id="coPw" type="password" autocomplete="current-password" placeholder="••••••••">
      </div>
      <button class="btn btn-p" id="bCo" onclick="connexion()">SE CONNECTER</button>
      <button class="btn btn-l" onclick="oubli()">Mot de passe oublié ?</button>
    </div>

    <!-- ══ INSCRIPTION ══ -->
    <div class="pane" id="pIn">
      <div class="fld">
        <label class="lbl">NOM DE TON ENTREPRISE</label>
        <input class="inp" id="inPseudo" type="text" maxlength="16" autocomplete="username" placeholder="Ex : Transports Marius">
        <div class="hint" id="hPseudo">3 à 16 caractères. C'est ton nom au classement.</div>
      </div>
      <div class="fld">
        <label class="lbl">EMAIL</label>
        <input class="inp" id="inMail" type="email" inputmode="email" autocomplete="email" placeholder="toi@exemple.fr">
        <div class="hint" id="hMail"></div>
      </div>
      <div class="fld">
        <label class="lbl">MOT DE PASSE</label>
        <input class="inp" id="inPw" type="password" autocomplete="new-password" placeholder="8 caractères minimum">
        <div class="pwbar"><div class="pwfill" id="pwFill"></div></div>
        <div class="hint" id="hPw">8 caractères minimum.</div>
      </div>
      <button class="btn btn-p" id="bIn" onclick="inscription()">CRÉER MON ENTREPRISE</button>
    </div>
  </div>

  <div class="foot">⚓ PORT DE MARSEILLE</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ═══════════════════════════════════════════════════
   ⚠️  À REMPLACER PAR TES IDENTIFIANTS SUPABASE
   Supabase → ton projet → Settings → API
   ═══════════════════════════════════════════════════ */
const SB_URL = 'https://xvphypcpikodtrqctqkd.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2cGh5cGNwaWtvZHRycWN0cWtkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3OTM5ODgsImV4cCI6MjA5OTM2OTk4OH0.Q7G2Tm05R4Ei08s7TudT-C5xychQImoYK-RLEdjoYGA';

var sb = null;
try { sb = supabase.createClient(SB_URL, SB_KEY); }
catch(e){ console.warn('Supabase non initialisé', e); }

function $(i){ return document.getElementById(i); }
function vib(m){ if(navigator.vibrate) navigator.vibrate(m); }

/* ── UI ── */
function tab(t){
  var co = (t==='co');
  $('tCo').classList.toggle('on', co);
  $('tIn').classList.toggle('on', !co);
  $('pCo').classList.toggle('on', co);
  $('pIn').classList.toggle('on', !co);
  hideMsg();
  vib(12);
}
function showMsg(txt, type){
  var m = $('msg');
  m.textContent = txt;
  m.className = 'msg on ' + (type||'err');
}
function hideMsg(){ $('msg').classList.remove('on'); }
function loading(btn, on, label){
  var b = $(btn);
  b.disabled = on;
  b.innerHTML = on ? '<span class="spin"></span>PATIENTE…' : label;
}

/* ── Traduction des erreurs Supabase en français clair ── */
function humanErr(e){
  var m = (e && (e.message || e.error_description) || '').toLowerCase();
  if(m.includes('invalid login credentials')) return 'Email ou mot de passe incorrect.';
  if(m.includes('email not confirmed'))       return 'Ton email n\'est pas encore confirmé. Vérifie ta boîte mail.';
  if(m.includes('user already registered') ||
     m.includes('already been registered'))   return 'Un compte existe déjà avec cet email.';
  if(m.includes('password should be at least'))return 'Mot de passe trop court (8 caractères minimum).';
  if(m.includes('unable to validate email') ||
     m.includes('invalid email'))              return 'Cet email n\'est pas valide.';
  if(m.includes('duplicate key') && m.includes('pseudo')) return 'Ce nom d\'entreprise est déjà pris.';
  if(m.includes('rate limit') || m.includes('too many'))  return 'Trop de tentatives. Réessaie dans quelques minutes.';
  if(m.includes('failed to fetch') || m.includes('network')) return 'Connexion impossible. Vérifie ta connexion internet.';
  return 'Une erreur est survenue. Réessaie.';
}

/* ── Validations ── */
function mailOk(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim()); }
function pwScore(v){
  var s = 0;
  if(v.length >= 8)  s++;
  if(v.length >= 12) s++;
  if(/[a-z]/.test(v) && /[A-Z]/.test(v)) s++;
  if(/\d/.test(v))   s++;
  if(/[^a-zA-Z0-9]/.test(v)) s++;
  return Math.min(s, 4);
}

/* ── Champ pseudo : vérif de disponibilité en direct ── */
var pseudoT = null, pseudoOk = false;
$('inPseudo').addEventListener('input', function(){
  var v = this.value.trim();
  var h = $('hPseudo');
  pseudoOk = false;
  this.classList.remove('good','bad');
  clearTimeout(pseudoT);

  if(v.length === 0){ h.className='hint'; h.textContent='3 à 16 caractères. C\'est ton nom au classement.'; return; }
  if(v.length < 3){  h.className='hint err'; h.textContent='Trop court (3 caractères minimum).'; this.classList.add('bad'); return; }

  h.className='hint'; h.textContent='Vérification…';
  var self = this;
  pseudoT = setTimeout(async function(){
    if(!sb) return;
    try{
      const { data, error } = await sb.rpc('pseudo_libre', { p: v });
      if(error) throw error;
      if(data === true){
        pseudoOk = true;
        h.className='hint ok'; h.textContent='✓ Ce nom est libre.';
        self.classList.add('good');
      } else {
        h.className='hint err'; h.textContent='Ce nom est déjà pris.';
        self.classList.add('bad');
      }
    }catch(e){
      h.className='hint'; h.textContent='';
    }
  }, 450);
});

/* ── Champ email (inscription) ── */
$('inMail').addEventListener('input', function(){
  var v = this.value.trim(), h = $('hMail');
  this.classList.remove('good','bad');
  if(!v){ h.className='hint'; h.textContent=''; return; }
  if(mailOk(v)){ h.className='hint'; h.textContent=''; this.classList.add('good'); }
  else { h.className='hint err'; h.textContent='Email invalide.'; }
});

/* ── Champ mot de passe (jauge) ── */
$('inPw').addEventListener('input', function(){
  var v = this.value, s = pwScore(v), f = $('pwFill'), h = $('hPw');
  var W = ['0%','25%','50%','75%','100%'][s];
  var C = ['#eae5da','#c0392b','#e67e22','#eab308','#16a34a'][s];
  var T = ['8 caractères minimum.','Trop faible.','Moyen.','Bien.','Excellent.'][s];
  f.style.width = W; f.style.background = C;
  h.className = 'hint' + (v.length && v.length < 8 ? ' err' : (s>=3 ? ' ok' : ''));
  h.textContent = v.length && v.length < 8 ? 'Trop court (8 caractères minimum).' : T;
});

/* ══════════ INSCRIPTION ══════════ */
async function inscription(){
  hideMsg();
  var pseudo = $('inPseudo').value.trim();
  var mail   = $('inMail').value.trim();
  var pw     = $('inPw').value;

  if(pseudo.length < 3)  return showMsg('Choisis un nom d\'entreprise (3 caractères minimum).');
  if(!pseudoOk)          return showMsg('Ce nom d\'entreprise n\'est pas disponible.');
  if(!mailOk(mail))      return showMsg('Ton email n\'est pas valide.');
  if(pw.length < 8)      return showMsg('Ton mot de passe doit faire 8 caractères minimum.');
  if(!sb)                return showMsg('Connexion au serveur impossible.');
  if(!navigator.onLine)  return showMsg('Tu es hors-ligne.');

  loading('bIn', true);
  try{
    const { data, error } = await sb.auth.signUp({
      email: mail,
      password: pw,
      options: { data: { pseudo: pseudo } }   // → récupéré par le trigger SQL
    });
    if(error) throw error;

    // Si la confirmation par email est activée, il n'y a pas encore de session
    if(data.session){
      vib([30,20,60]);
      showMsg('✅ Bienvenue ! Ton entreprise est créée.', 'ok');
      setTimeout(function(){ location.href = 'jeu.html'; }, 900);
    } else {
      vib(30);
      showMsg('📬 Compte créé ! Vérifie ta boîte mail pour confirmer ton adresse, puis connecte-toi.', 'info');
      setTimeout(function(){ tab('co'); $('coMail').value = mail; }, 2500);
    }
  }catch(e){
    console.warn(e);
    showMsg(humanErr(e));
    vib([60,40,60]);
  }
  loading('bIn', false, 'CRÉER MON ENTREPRISE');
}

/* ══════════ CONNEXION ══════════ */
async function connexion(){
  hideMsg();
  var mail = $('coMail').value.trim();
  var pw   = $('coPw').value;

  if(!mailOk(mail))     return showMsg('Ton email n\'est pas valide.');
  if(!pw)               return showMsg('Entre ton mot de passe.');
  if(!sb)               return showMsg('Connexion au serveur impossible.');
  if(!navigator.onLine) return showMsg('Tu es hors-ligne.');

  loading('bCo', true);
  try{
    const { error } = await sb.auth.signInWithPassword({ email: mail, password: pw });
    if(error) throw error;
    vib([30,20,60]);
    location.href = 'jeu.html';
  }catch(e){
    console.warn(e);
    showMsg(humanErr(e));
    vib([60,40,60]);
  }
  loading('bCo', false, 'SE CONNECTER');
}

/* ══════════ MOT DE PASSE OUBLIÉ ══════════ */
async function oubli(){
  hideMsg();
  var mail = $('coMail').value.trim();
  if(!mailOk(mail)) return showMsg('Entre d\'abord ton email ci-dessus, puis reclique.');
  if(!sb)           return showMsg('Connexion au serveur impossible.');

  try{
    const { error } = await sb.auth.resetPasswordForEmail(mail, {
      redirectTo: location.origin + '/nouveau-mdp.html'
    });
    if(error) throw error;
    showMsg('📬 Si un compte existe avec cet email, tu vas recevoir un lien de réinitialisation.', 'info');
    vib(30);
  }catch(e){
    console.warn(e);
    showMsg(humanErr(e));
  }
}

/* ══════════ DÉJÀ CONNECTÉ ? ══════════ */
(async function(){
  if(!sb) return;
  try{
    const { data:{ session } } = await sb.auth.getSession();
    if(session) location.href = 'jeu.html';
  }catch(e){}
})();

/* Entrée = valider */
$('coPw').addEventListener('keydown', function(e){ if(e.key==='Enter') connexion(); });
$('inPw').addEventListener('keydown', function(e){ if(e.key==='Enter') inscription(); });
</script>
</body>
</html>
