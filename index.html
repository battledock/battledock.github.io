<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Battle Dock — LE JEU</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Permanent+Marker&family=Space+Grotesk:wght@500;700;900&family=Bungee&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  
  <style>
    :root {
      --port-dark: #0f172a;
      --port-blue: #2563eb;
      --port-light-blue: #38bdf8;
      --comic-yellow: #facc15;
      --comic-red: #ef4444;
      --comic-green: #22c55e;
      --comic-purple: #a855f7;
      --paper-cream: #fefce8;
      --border-thick: 4px solid #000000;
      --shadow-comic: 8px 8px 0px #000000;
      --shadow-comic-sm: 4px 4px 0px #000000;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: linear-gradient(135deg, #7f1d1d 0%, #991b1b 50%, #dc2626 100%);
      transition: background 0.5s ease;
      min-height: 100vh;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0;
      overflow: hidden;
      position: relative;
      margin: 0;
    }

    .header-container {
      text-align: center;
      margin-bottom: 16px;
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 480px;
      padding: 0 16px;
      flex-shrink: 0;
    }

    .main-title {
      font-family: 'Bangers', cursive;
      font-size: clamp(3.5rem, 12vw, 5rem);
      color: var(--comic-yellow);
      letter-spacing: 4px;
      text-shadow: 6px 6px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000;
      line-height: 0.9;
      transform: rotate(0deg);
      display: inline-block;
      margin-bottom: 4px;
    }

    .subtitle {
      font-family: 'Permanent Marker', cursive;
      font-size: clamp(0.8rem, 2.5vw, 0.95rem);
      color: #ffffff;
      text-shadow: 3px 3px 0px var(--port-dark);
      letter-spacing: 1px;
    }

    .dock-container {
      width: 100%;
      max-width: 480px;
      background: #e2e8f0;
      border: var(--border-thick);
      border-radius: 20px;
      box-shadow: none;
      position: relative;
      z-index: 5;
      overflow: hidden;
      height: 420px;
      display: flex;
      flex-direction: column;
      margin: 0 16px;
      flex-shrink: 0;
    }

    .tabs-wrapper {
      display: flex;
      background: var(--port-dark);
      border-bottom: var(--border-thick);
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      font-family: 'Bungee', sans-serif;
      font-size: 14px;
      color: #94a3b8;
      padding: 16px 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .tab-btn:first-child {
      border-right: var(--border-thick);
    }

    .tab-btn.active {
      color: #ffffff;
    }

    #tabHome.active {
      background: #3b82f6;
      color: #ffffff;
    }

    #tabScores.active {
      background: #ef4444;
      color: #ffffff;
    }

    .form-content {
      background: #f3f4f6;
      padding: 24px 22px;
      position: relative;
      flex: 1;
      overflow-y: auto;
    }

    .form-section { 
      display: none; 
    }
    
    .form-section.active { 
      display: block; 
      animation: fadeIn 0.3s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .input-group { 
      margin-bottom: 16px; 
    }
    
    .input-group:last-of-type {
      margin-bottom: 0;
    }

    .input-group label {
      display: block;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 900;
      font-size: 13px;
      color: var(--port-dark);
      margin-bottom: 7px;
      text-transform: uppercase;
    }

    .custom-field {
      width: 100%;
      padding: 13px 15px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 15px;
      color: var(--port-dark);
      background: #ffffff;
      border: 4px solid #000000;
      border-radius: 10px;
      box-shadow: 4px 4px 0px #000000;
      transition: all 0.15s ease;
    }

    .custom-field:focus {
      outline: none;
      background: #ffffff;
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px #000000;
    }

    .submit-lever-btn {
      background: var(--comic-red);
      color: white;
      border: 4px solid #000000;
      border-radius: 12px;
      padding: 13px 26px;
      font-family: 'Bungee', sans-serif;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      cursor: pointer;
      box-shadow: 8px 8px 0px #000000;
      transition: all 0.15s ease;
      border-bottom: none;
      width: 100%;
      margin-top: 10px;
    }

    .submit-lever-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 10px 10px 0px #000000;
    }

    .submit-lever-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #000000;
    }

    .footer-stamp {
      margin-top: 16px;
      font-size: 9px;
      color: #ffffff;
      text-align: center;
      max-width: 480px;
      line-height: 1.3;
      padding: 0 16px;
      flex-shrink: 0;
    }

    .error-popup {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #e2e8f0;
      border: 4px solid #000000;
      border-radius: 20px;
      padding: 32px 28px;
      box-shadow: var(--shadow-comic);
      z-index: 1000;
      max-width: 90%;
      width: 400px;
    }

    .error-popup.show {
      display: block;
      animation: popupShow 0.3s ease-out forwards;
    }

    @keyframes popupShow {
      from {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.8);
      }
      to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    .error-popup-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 999;
    }

    .error-popup-overlay.show {
      display: block;
    }

    .error-popup-title {
      font-family: 'Bangers', cursive;
      font-size: 28px;
      color: var(--comic-red);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .error-popup-message {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px;
      color: var(--port-dark);
      margin-bottom: 24px;
      line-height: 1.6;
      font-weight: 600;
    }

    .error-popup-btn {
      background: var(--comic-red);
      color: white;
      border: 4px solid #000000;
      border-radius: 12px;
      padding: 14px 28px;
      font-family: 'Bungee', sans-serif;
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      cursor: pointer;
      box-shadow: 6px 6px 0px #000000;
      transition: all 0.15s ease;
      width: 100%;
      border-bottom: none;
    }

    .error-popup-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 8px 8px 0px #000000;
    }

    .error-popup-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #000000;
    }

    @media (max-width: 540px) {
      .dock-container {
        border-radius: 12px;
      }

      .main-title {
        font-size: 3.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="header-container">
    <div class="main-title">BATTLE DOCK</div>
    <div class="subtitle">LE simulateur de docker !</div>
  </div>

  <div class="dock-container">
    <div class="tabs-wrapper">
      <button class="tab-btn active" id="tabHome" onclick="swapTab('home')">👔 CONNEXION</button>
      <button class="tab-btn" id="tabScores" onclick="swapTab('scores')">📝 INSCRIPTION</button>
    </div>

    <div class="form-content">
      <div class="form-section active" id="secHome">
        <form id="quick-login-form" style="display: flex; flex-direction: column; gap: 20px;">
          <div class="input-group">
            <label>👤 Pseudo</label>
            <input type="text" class="custom-field" id="quick-username" placeholder="Ton pseudo" required>
          </div>
          <div class="input-group">
            <label>🔑 Mot de passe</label>
            <input type="password" class="custom-field" id="quick-password" placeholder="••••••••" required>
          </div>
          <button type="submit" class="submit-lever-btn">SE CONNECTER</button>
        </form>
      </div>

      <div class="form-section" id="secScores">
        <form id="application-form" style="display: flex; flex-direction: column; gap: 20px;">
          <div class="input-group">
            <label>👤 Ton Pseudo</label>
            <input type="text" class="custom-field" id="app-username" placeholder="Pseudo de joueur" required>
          </div>
          <div class="input-group">
            <label>🔒 Mot de passe</label>
            <input type="password" class="custom-field" id="app-password" placeholder="Minimum 6 caractères" required>
          </div>
          <button type="submit" class="submit-lever-btn">S'INSCRIRE</button>
        </form>
      </div>
    </div>
  </div>

  <div class="footer-stamp">Battle Dock est une œuvre de fiction et de divertissement.<br>Tous les éléments sont purement imaginaires.</div>

  <div class="error-popup-overlay" id="errorOverlay"></div>
  <div class="error-popup" id="errorPopup">
    <div class="error-popup-title">ERREUR</div>
    <div class="error-popup-message" id="errorMessage"></div>
    <button class="error-popup-btn" onclick="closeErrorPopup()">OK</button>
  </div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const sb = createClient(supabaseUrl, supabaseKey);

    sb.auth.getSession().then(({ data: { session } }) => {
      if (session) window.location.href = 'game.html';
    });

    function showErrorPopup(message) {
      document.getElementById('errorMessage').textContent = message;
      document.getElementById('errorPopup').classList.add('show');
      document.getElementById('errorOverlay').classList.add('show');
    }

    function closeErrorPopup() {
      document.getElementById('errorPopup').classList.remove('show');
      document.getElementById('errorOverlay').classList.remove('show');
    }

    document.getElementById('errorOverlay').addEventListener('click', closeErrorPopup);

    function swapTab(target) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
      document.getElementById('tab' + target.charAt(0).toUpperCase() + target.slice(1)).classList.add('active');
      document.getElementById('sec' + target.charAt(0).toUpperCase() + target.slice(1)).classList.add('active');
      document.body.style.background = target === 'home'
        ? 'linear-gradient(135deg, #7f1d1d 0%, #991b1b 50%, #dc2626 100%)'
        : 'linear-gradient(135deg, #1e3a8a 0%, #1e40af 50%, #3b82f6 100%)';
    }

    document.getElementById('quick-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('quick-username').value.trim();
      const password = document.getElementById('quick-password').value;
      if (!username || !password) { showErrorPopup('Remplis tous les champs !'); return; }

      const btn = e.target.querySelector('button');
      btn.textContent = 'CONNEXION...'; btn.disabled = true;

      try {
        const { data: profile, error: pErr } = await sb
          .from('profiles').select('user_id').eq('username', username).single();

        if (pErr || !profile) { 
          showErrorPopup('Pseudo introuvable !'); 
          btn.textContent='SE CONNECTER'; 
          btn.disabled=false; 
          return; 
        }

        const email = username + '@battledock.local';
        const { data, error } = await sb.auth.signInWithPassword({ email, password });

        if (error) { 
          showErrorPopup('Mot de passe incorrect !'); 
          btn.textContent='SE CONNECTER'; 
          btn.disabled=false; 
          return; 
        }

        window.location.href = 'game.html';
      } catch (err) {
        showErrorPopup('Erreur : ' + err.message);
        btn.textContent='SE CONNECTER'; 
        btn.disabled=false;
      }
    });

    document.getElementById('application-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('app-username').value.trim();
      const password = document.getElementById('app-password').value;

      if (!username || !password) { showErrorPopup('Remplis tous les champs !'); return; }
      if (password.length < 6) { showErrorPopup('Minimum 6 caractères !'); return; }
      if (username.length < 3) { showErrorPopup('Pseudo trop court (min 3 caractères) !'); return; }

      const btn = e.target.querySelector('button');
      btn.textContent = 'INSCRIPTION...'; btn.disabled = true;

      try {
        const { data: existing } = await sb
          .from('profiles').select('username').eq('username', username).single();
        if (existing) { 
          showErrorPopup('Ce pseudo est déjà pris !'); 
          btn.textContent="S'INSCRIRE"; 
          btn.disabled=false; 
          return; 
        }

        const email = username + '@battledock.local';

        const { data: authData, error: authErr } = await sb.auth.signUp({
          email, 
          password,
          options: { data: { username } }
        });
        if (authErr) throw authErr;

        const userId = authData.user.id;

        await sb.from('profiles').insert({ 
          user_id: userId, 
          username,
          avatar_url: 'avatar-default.png'
        });

        btn.textContent = '✅ BIENVENUE !';
        setTimeout(() => { window.location.href = 'game.html'; }, 800);

      } catch (err) {
        showErrorPopup('Erreur : ' + err.message);
        btn.textContent = "S'INSCRIRE"; 
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
