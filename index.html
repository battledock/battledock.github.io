<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battle Dock — LE JEU</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Pirata+One&family=Special+Elite&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <style>
    /* Vos styles CSS */
    body {
      background: #0a0e14;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Special Elite', monospace;
      overflow: hidden;
    }
    .container {
      width: 340px;
      text-align: center;
      padding: 20px;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 20px;
      display: block;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    h1 {
      font-family: 'Pirata One', serif;
      font-size: 42px;
      color: #f4b13c;
      text-shadow: 3px 3px 0 #000, 0 0 40px rgba(244, 177, 60, .3);
      margin-bottom: 8px;
      letter-spacing: 2px;
    }
    .sub {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      letter-spacing: 4px;
      color: #3a5a7a;
      margin-bottom: 32px;
    }
    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
    }
    .button {
      display: inline-block;
      padding: 8px 16px;
      background: #f4b13c;
      color: #0a0e14;
      text-decoration: none;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 14px;
      letter-spacing: 2px;
      border: none;
      cursor: pointer;
    }
    .button:hover {
      background: #d69b35;
    }
    .dots {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 24px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #1e3a5a;
      animation: pulse 1.4s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: .2s; }
    .dot:nth-child(3) { animation-delay: .4s; }
    @keyframes pulse {
      0%, 100% { background: #1e3a5a; transform: scale(1); }
      50% { background: #f4b13c; transform: scale(1.3); }
    }
    .version {
      margin-top: 20px;
      font-size: 10px;
      color: #1e3a5a;
      letter-spacing: 3px;
    }
    .modal {
      display: none;
      position: fixed;
      z-index: 1;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.8);
    }
    .modal-content {
      background-color: #0a0e14;
      margin: 15% auto;
      padding: 20px;
      width: 80%;
      max-width: 400px;
      border-radius: 5px;
      position: relative;
    }
    .close {
      color: #fff;
      position: absolute;
      top: 10px;
      right: 20px;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
    }
    input {
      padding: 10px;
      border: none;
      background-color: #1e2e40;
      color: #fff;
    }
    button[type="submit"] {
      padding: 10px;
      border: none;
      background-color: #f4b13c;
      color: #0a0e14;
      cursor: pointer;
    }
    #signup-modal h2, #login-modal h2 {
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="icon">⚓</span>
    <h1>BATTLE DOCK</h1>
    <div class="sub">LA Simulation de Docker</div>
    <div class="buttons">
      <button class="button" onclick="openModal('signup-modal')">Inscription</button>
      <button class="button" onclick="openModal('login-modal')">Connexion</button>
    </div>
    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <div class="version">Version 1.0.1</div>
  </div>

  <div id="signup-modal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('signup-modal')">&times;</span>
      <h2>Inscription</h2>
      <form id="signup-form">
        <input type="text" id="signup-username" placeholder="Nom d'utilisateur" required>
        <input type="password" id="signup-password" placeholder="Mot de passe" required>
        <button type="submit">S'inscrire</button>
      </form>
    </div>
  </div>

  <div id="login-modal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('login-modal')">&times;</span>
      <h2>Connexion</h2>
      <form id="login-form">
        <input type="text" id="login-username" placeholder="Nom d'utilisateur" required>
        <input type="password" id="login-password" placeholder="Mot de passe" required>
        <button type="submit">Se connecter</button>
      </form>
      <p><a href="#" onclick="openModal('forgot-password-modal')">Mot de passe oublié ?</a></p>
    </div>
  </div>

  <div id="forgot-password-modal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('forgot-password-modal')">&times;</span>
      <h2>Mot de passe oublié</h2>
      <form id="forgot-password-form">
        <input type="text" id="forgot-password-username" placeholder="Nom d'utilisateur" required>
        <button type="submit">Réinitialiser le mot de passe</button>
      </form>
    </div>
  </div>

  <div id="reset-password-modal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('reset-password-modal')">&times;</span>
      <h2>Réinitialiser le mot de passe</h2>
      <form id="reset-password-form">
        <input type="text" id="reset-password-username" placeholder="Nom d'utilisateur" required>
        <input type="password" id="reset-password-new-password" placeholder="Nouveau mot de passe" required>
        <input type="password" id="reset-password-confirm-password" placeholder="Confirmez le mot de passe" required>
        <button type="submit">Réinitialiser le mot de passe</button>
      </form>
    </div>
  </div>

  <script>
    // Initialisation du client Supabase
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const supabaseClient = createClient(supabaseUrl, supabaseKey);

    // Fonctions pour ouvrir et fermer les modales
    function openModal(modalId) {
      document.getElementById(modalId).style.display = "block";
    }

    function closeModal(modalId) {
      document.getElementById(modalId).style.display = "none";
    }

    // Inscription
    document.getElementById('signup-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const username = document.getElementById('signup-username').value;
      const password = document.getElementById('signup-password').value;

      const { data: { user }, error } = await supabaseClient.auth.signUp({
        email: `${username}@battledock.com`,
        password: password,
      });

      if (error) {
        alert('Erreur lors de l\'inscription : ' + error.message);
      } else {
        const { data, error: insertError } = await supabaseClient
          .from('users')
          .insert({ username, id: user.id });

        if (insertError) {
          alert('Erreur lors de l\'enregistrement du nom d\'utilisateur : ' + insertError.message);
        } else {
          alert('Inscription réussie !');
          closeModal('signup-modal');
          openModal('login-modal');
        }
      }
    });

    // Connexion
    document.getElementById('login-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const username = document.getElementById('login-username').value;
      const password = document.getElementById('login-password').value;

      const { data, error } = await supabaseClient
        .from('users')
        .select('*')
        .eq('username', username)
        .eq('password', password)
        .single();

      if (error) {
        alert('Erreur lors de la connexion : ' + error.message);
      } else {
        alert('Connexion réussie !');
        closeModal('login-modal');
        // Rediriger vers la page d'accueil ou effectuer d'autres actions
      }
    });

    // Mot de passe oublié
    document.getElementById('forgot-password-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const username = document.getElementById('forgot-password-username').value;

      // Rechercher l'utilisateur dans la base de données
      const { data: users, error } = await supabaseClient
        .from('users')
        .select('id')
        .eq('username', username);

      if (error || users.length === 0) {
        alert('Nom d\'utilisateur non trouvé.');
      } else {
        const userId = users[0].id;
        // Envoyer un e-mail de réinitialisation de mot de passe à l'utilisateur
        // Vous pouvez utiliser un service d'e-mail tiers ou une API de messagerie pour envoyer l'e-mail
        alert('Un e-mail de réinitialisation de mot de passe a été envoyé à votre adresse e-mail.');
        closeModal('forgot-password-modal');
        openModal('reset-password-modal');
      }
    });

    // Réinitialisation du mot de passe
    document.getElementById('reset-password-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const username = document.getElementById('reset-password-username').value;
      const newPassword = document.getElementById('reset-password-new-password').value;
      const confirmPassword = document.getElementById('reset-password-confirm-password').value;

      if (newPassword !== confirmPassword) {
        alert('Les mots de passe ne correspondent pas.');
        return;
      }

      // Rechercher l'utilisateur dans la base de données
      const { data: users, error: userError } = await supabaseClient
        .from('users')
        .select('id')
        .eq('username', username);

      if (userError || users.length === 0) {
        alert('Nom d\'utilisateur non trouvé.');
      } else {
        const userId = users[0].id;

        // Mettre à jour le mot de passe de l'utilisateur
        const { data, error } = await supabaseClient
          .from('users')
          .update({ password: newPassword })
          .eq('id', userId);

        if (error) {
          alert('Erreur lors de la réinitialisation du mot de passe : ' + error.message);
        } else {
          alert('Mot de passe réinitialisé avec succès !');
          closeModal('reset-password-modal');
          openModal('login-modal');
        }
      }
    });
  </script>
</body>
</html>
