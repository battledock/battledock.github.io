<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pile ou Face - Battle Dock Casino</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(180deg, #450a0a, #7f1d1d, #991b1b);
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 6px;
      padding-bottom: 120px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    .game-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 10px;
      overflow: hidden;
      min-height: 0;
    }

    /* TABLE — même style .machine */
    .pf-table {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 4px solid #fbbf24;
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    /* PIÈCE */
    .coin {
      width: clamp(110px, 32vw, 140px);
      height: clamp(110px, 32vw, 140px);
      border-radius: 50%;
      background: white;
      border: 4px solid #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(52px, 15vw, 68px);
      box-shadow: 4px 4px 0 rgba(0,0,0,0.3), inset 0 0 0 8px #f5f5f5;
    }
    @keyframes flip { 0%{transform:rotateY(0deg)} 50%{transform:rotateY(90deg)} 100%{transform:rotateY(0deg)} }
    .coin.flipping { animation: flip .15s linear infinite; }

    /* CHOIX PILE / FACE */
    .choices {
      display: flex;
      gap: 8px;
      width: 100%;
    }
    .choice {
      flex: 1;
      padding: 11px 8px;
      border: 2.5px solid rgba(0,0,0,0.4);
      border-radius: 10px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      color: white;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0,0,0,0.3);
      transition: all .15s;
    }
    .choice:active { transform: scale(0.97); }
    .choice.sel { background: #fbbf24; color: #0f172a; border-color: #0f172a; }
    .choice:not(.sel) { background: rgba(255,255,255,0.07); border-color: rgba(251,191,36,0.25); }

    /* RÉSULTAT */
    .result {
      display: none;
      padding: 7px 12px;
      border-radius: 10px;
      text-align: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 14px;
      letter-spacing: 1px;
      width: 100%;
      animation: resultPop .3s;
    }
    @keyframes resultPop { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
    .result.win { background: linear-gradient(135deg,#10b981,#059669); color: white; box-shadow: 0 4px 14px rgba(16,185,129,0.4); }
    .result.lose { background: linear-gradient(135deg,#dc2626,#991b1b); color: white; }

    /* CONTROLS */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      max-width: 340px;
      flex-shrink: 0;
    }

    /* CHIPS */
    .chips {
      display: flex;
      gap: 6px;
      background: rgba(255,255,255,0.05);
      padding: 6px;
      border-radius: 8px;
      border: 2px solid rgba(251,191,36,0.3);
    }
    .chip {
      flex: 1;
      padding: 7px 4px;
      border-radius: 6px;
      text-align: center;
      cursor: pointer;
      transition: all .15s;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 12px;
      letter-spacing: 1px;
    }
    .chip.sel { background: #fbbf24; color: #0f172a; }
    .chip:not(.sel) { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.4); border: 1px solid rgba(251,191,36,0.2); }

    .spin-btn {
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      border: none;
      border-radius: 10px;
      color: #0f172a;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      letter-spacing: 1.5px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(251,191,36,0.5);
      transition: all 0.2s;
    }
    .spin-btn:active { transform: scale(0.98); }
    .spin-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* BOTTOM BAR */
    .bottom-bar {
      background: linear-gradient(135deg, #7f1d1d, #991b1b);
      border: 2px solid rgba(251,191,36,0.5);
      border-radius: 10px;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      min-height: 44px;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 480px;
      width: calc(100% - 20px);
      z-index: 100;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
    }
    .back-btn {
      background: rgba(251,191,36,0.2);
      border: 2px solid rgba(251,191,36,0.5);
      color: #fbbf24;
      border-radius: 6px;
      padding: 4px 10px;
      font-weight: 700;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
    }
    .back-btn:active { transform: scale(0.95); }
    .game-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      color: #fbbf24;
      letter-spacing: 1.5px;
    }
    .balance {
      background: white;
      color: #0f172a;
      padding: 4px 10px;
      border-radius: 6px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="game-area">

      <!-- TABLE -->
      <div class="pf-table">
        <!-- PIÈCE -->
        <div class="coin" id="coin">⚓</div>

        <!-- CHOIX -->
        <div class="choices">
          <div class="choice sel" id="ch-pile" onclick="setChoix('pile')">⚓ PILE</div>
          <div class="choice" id="ch-face" onclick="setChoix('face')">🐟 FACE</div>
        </div>
      </div>

      <!-- CONTROLS -->
      <div class="controls">
        <div class="result" id="result"></div>

        <div class="chips">
          <div class="chip sel" id="c1000" onclick="setBet(1000,'c1000')">1K</div>
          <div class="chip" id="c5000" onclick="setBet(5000,'c5000')">5K</div>
          <div class="chip" id="c10000" onclick="setBet(10000,'c10000')">10K</div>
          <div class="chip" id="c50000" onclick="setBet(50000,'c50000')">50K</div>
        </div>

        <button class="spin-btn" id="btnPlay" onclick="play()">LANCER — <span id="betLabel">1 000€</span></button>
      </div>

    </div>

    <!-- BOTTOM BAR -->
    <div class="bottom-bar">
      <button class="back-btn" onclick="window.location.href='casino.html'">← Casino</button>
      <div class="game-title">🪙 PILE OU FACE</div>
      <div class="balance" id="balance">0€</div>
    </div>
  </div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const sb = createClient(supabaseUrl, supabaseKey);

    let money = 0, bet = 1000, choix = 'pile', busy = false, currentUser = null;
    const fmt = n => Math.floor(n).toLocaleString('fr-FR');

    function setChoix(c) {
      choix = c;
      document.getElementById('ch-pile').classList.toggle('sel', c === 'pile');
      document.getElementById('ch-face').classList.toggle('sel', c === 'face');
    }

    function setBet(val, id) {
      bet = val;
      ['c1000','c5000','c10000','c50000'].forEach(i => document.getElementById(i).classList.toggle('sel', i === id));
      document.getElementById('betLabel').textContent = fmt(val) + '€';
    }

    function updateBal() {
      document.getElementById('balance').textContent = fmt(money) + '€';
    }

    function showResult(msg, cls) {
      const el = document.getElementById('result');
      el.textContent = msg;
      el.className = 'result ' + cls;
      el.style.display = 'block';
    }

    function play() {
      if (bet<=0||busy || money < bet) { showResult('Pas assez d\'argent !', 'lose'); return; }
      busy = true;
      money -= bet;
      updateBal();
      document.getElementById('result').style.display = 'none';
      document.getElementById('btnPlay').disabled = true;

      const coin = document.getElementById('coin');
      coin.classList.add('flipping');

      const result = Math.random() < 0.5 ? 'pile' : 'face';
      let n = 0;
      const spinInt = setInterval(() => { coin.textContent = n++ % 2 === 0 ? '⚓' : '🐟'; }, 100);

      setTimeout(() => {
        clearInterval(spinInt);
        coin.classList.remove('flipping');
        coin.textContent = result === 'pile' ? '⚓' : '🐟';
        settle(result);
      }, 1200);
    }

    async function settle(result) {
      const win = result === choix;
      let msg = '', cls = 'lose';
      if (win) {
        const gain = Math.floor(bet * 1.9);
        money += gain;
        msg = (result === 'pile' ? '⚓ PILE !' : '🐟 FACE !') + ' +' + fmt(gain - bet) + '€';
        cls = 'win';
      } else {
        msg = (result === 'pile' ? '⚓ PILE' : '🐟 FACE') + ' — Raté !';
      }
      updateBal();
      showResult(msg, cls);
      document.getElementById('btnPlay').disabled = false;
      busy = false;
      if (currentUser) await sb.from('game_stats').update({ money: Math.floor(money) }).eq('user_id', currentUser.id);
    }

    async function init() {
      const { data: _authData, error: _authError } = await sb.auth.getSession();
      if (_authError || !_authData.session) {
        await sb.auth.signOut().catch(() => {});
        window.location.href = 'index.html';
        return;
      }
      const session = _authData.session;
        currentUser = s2.user;
      } else {
        currentUser = session.user;
      }
      const { data } = await sb.from('game_stats').select('money').eq('user_id', currentUser.id).maybeSingle();
      money = data?.money || 0;
      updateBal();
    }

    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('gesturechange', e => e.preventDefault());
    init();
  </script>
</body>
</html>
