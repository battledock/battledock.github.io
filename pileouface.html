<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Pile ou Face — Battle Dock Casino</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{height:100%;height:100dvh;overflow:hidden;font-family:'Inter',sans-serif}
body{
  background:radial-gradient(ellipse at top,#78350f,#451a03 60%,#1c0701);
  display:flex;flex-direction:column;
}

/* ══ HEADER ══ */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,44px) + 10px) 16px 10px;flex-shrink:0}
.btn-back{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:7px 14px;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;color:#fff;cursor:pointer}
.hdr-title{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#fbbf24;letter-spacing:3px}
.hdr-bal{background:rgba(0,0,0,.3);border:1px solid rgba(251,191,36,.3);border-radius:20px;padding:7px 14px;font-family:'Bebas Neue',sans-serif;font-size:15px;color:#fbbf24}

/* ══ JEU ══ */
.game{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 16px;gap:16px;min-height:0}

/* Pièce */
.coin-wrap{
  width:min(200px,55vw);height:min(200px,55vw);
  cursor:pointer;position:relative;
  display:flex;align-items:center;justify-content:center;
}
.coin{
  width:100%;height:100%;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fde68a,#fbbf24 40%,#d97706 70%,#92400e);
  border:6px solid #92400e;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(60px,18vw,90px);
  box-shadow:
    0 8px 32px rgba(0,0,0,.5),
    inset 0 -4px 8px rgba(0,0,0,.3),
    inset 0 4px 8px rgba(255,255,255,.2);
  transition:transform .1s;
}
.coin.flipping{animation:coinFlip 1.2s ease-in-out forwards}
@keyframes coinFlip{
  0%{transform:rotateY(0) scale(1)}
  25%{transform:rotateY(90deg) scale(.9)}
  50%{transform:rotateY(180deg) scale(1.05)}
  75%{transform:rotateY(270deg) scale(.9)}
  100%{transform:rotateY(360deg) scale(1)}
}
.coin-shadow{
  position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);
  width:70%;height:16px;
  background:rgba(0,0,0,.3);border-radius:50%;
  filter:blur(6px);
}

/* Choix */
.choices{display:flex;gap:10px;width:100%;max-width:400px}
.choice{
  flex:1;padding:16px 8px;border-radius:18px;
  font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;
  color:rgba(255,255,255,.45);text-align:center;cursor:pointer;
  background:rgba(255,255,255,.06);border:2.5px solid rgba(255,255,255,.1);
  transition:all .15s;
}
.choice:active{transform:scale(.96)}
.choice.sel{
  color:#fff;background:rgba(251,191,36,.15);
  border-color:#fbbf24;
  box-shadow:0 0 20px rgba(251,191,36,.2);
}
.choice-sub{font-size:9px;color:rgba(255,255,255,.4);font-family:'Inter',sans-serif;margin-top:3px;font-weight:700;letter-spacing:.5px}
.choice.sel .choice-sub{color:rgba(251,191,36,.7)}

/* Résultat */
.result{
  display:none;padding:13px 16px;border-radius:16px;
  text-align:center;font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;
  width:100%;max-width:400px;
  animation:resultPop .3s cubic-bezier(.34,1.56,.64,1);
}
@keyframes resultPop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
.result.win{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;box-shadow:0 4px 16px rgba(22,163,74,.4)}
.result.lose{background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.7)}

/* Chips */
.chips{display:flex;gap:6px;width:100%;max-width:400px}
.chip{flex:1;padding:10px 4px;border-radius:20px;text-align:center;cursor:pointer;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;border:1.5px solid rgba(255,255,255,.1);color:rgba(255,255,255,.4);background:rgba(255,255,255,.06);transition:all .15s}
.chip.sel{background:rgba(251,191,36,.2);border-color:#fbbf24;color:#fbbf24}
.chip:active{transform:scale(.96)}

/* Bouton */
.spin-btn{width:100%;max-width:400px;padding:17px;border:none;border-radius:16px;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a0000;font-family:'Bebas Neue',sans-serif;font-size:21px;letter-spacing:3px;cursor:pointer;box-shadow:0 6px 24px rgba(251,191,36,.35);transition:all .15s;font-weight:900}
.spin-btn:active{transform:scale(.98);opacity:.9}
.spin-btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
</style>
</head>
<body>

<div class="hdr">
  <button class="btn-back" onclick="location.href='casino.html'">← CASINO</button>
  <div class="hdr-title">🪙 PILE OU FACE</div>
  <div class="hdr-bal" id="balance">0€</div>
</div>

<div class="game">

  <!-- PIÈCE -->
  <div class="coin-wrap" onclick="play()">
    <div class="coin" id="coin">⚓</div>
    <div class="coin-shadow"></div>
  </div>

  <!-- CHOIX -->
  <div class="choices">
    <div class="choice sel" id="ch-pile" onclick="setChoix('pile')">
      ⚓ PILE
      <div class="choice-sub">Ancre · ×1.9</div>
    </div>
    <div class="choice" id="ch-face" onclick="setChoix('face')">
      🐟 FACE
      <div class="choice-sub">Poisson · ×1.9</div>
    </div>
  </div>

  <!-- RÉSULTAT -->
  <div class="result" id="result"></div>

  <!-- CHIPS -->
  <div class="chips">
    <div class="chip sel" id="c1000" onclick="setBet(1000,'c1000')">1K</div>
    <div class="chip" id="c5000" onclick="setBet(5000,'c5000')">5K</div>
    <div class="chip" id="c10000" onclick="setBet(10000,'c10000')">10K</div>
    <div class="chip" id="c50000" onclick="setBet(50000,'c50000')">50K</div>
  </div>

  <!-- BOUTON -->
  <button class="spin-btn" id="btnPlay" onclick="play()">LANCER — <span id="betLabel">1 000€</span></button>

</div>

<script>

    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const sb = createClient(supabaseUrl, supabaseKey);

    let money = parseInt(localStorage.getItem("bd_money")||"0"), bet = 1000, choix = 'pile', busy = false, currentUser = null;
    const fmt = n => Math.floor(n).toLocaleString('fr-FR');

    function setChoix(c) {
      choix = c;
      document.getElementById('ch-pile').classList.toggle('sel', c === 'pile');
      document.getElementById('ch-face').classList.toggle('sel', c === 'face');
    }

    function setBet(val, id) {
      bet = val;
      ['c1000','c5000','c10000','c50000'].forEach(i => document.getElementById(i).classList.toggle('sel', i === id));
      document.getElementById('betLabel').textContent = fmt(val) + '€';
    }

    function updateBal() {
      var fmtB=function(n){return n>=1000000?(n/1000000).toFixed(1)+'M€':n>=1000?Math.floor(n/1000)+'k€':Math.floor(n).toLocaleString('fr-FR')+'€';}; document.getElementById('balance').textContent = fmtB(money);
    }

    function showResult(msg, cls) {
      const el = document.getElementById('result');
      el.textContent = msg;
      el.className = 'result ' + cls;
      el.style.display = 'block';
    }

    function play() {
      if (bet<=0||busy || money < bet) { showResult('Pas assez d\'argent !', 'lose'); return; }
      busy = true;
      money -= bet;
      updateBal();
      document.getElementById('result').style.display = 'none';
      document.getElementById('btnPlay').disabled = true;

      const coin = document.getElementById('coin');
      coin.classList.add('flipping');

      const result = Math.random() < 0.5 ? 'pile' : 'face';
      let n = 0;
      const spinInt = setInterval(() => { coin.textContent = n++ % 2 === 0 ? '⚓' : '🐟'; }, 100);

      setTimeout(() => {
        clearInterval(spinInt);
        coin.classList.remove('flipping');
        coin.textContent = result === 'pile' ? '⚓' : '🐟';
        settle(result);
      }, 1200);
    }

    async function settle(result) {
      const win = result === choix;
      let msg = '', cls = 'lose';
      if (win) {
        const gain = Math.floor(bet * 1.9);
        money += gain;
        msg = (result === 'pile' ? '⚓ PILE !' : '🐟 FACE !') + ' +' + fmt(gain - bet) + '€';
        cls = 'win';
      } else {
        msg = (result === 'pile' ? '⚓ PILE' : '🐟 FACE') + ' — Raté !';
      }
      updateBal();
      showResult(msg, cls);
      document.getElementById('btnPlay').disabled = false;
      busy = false;
      await saveMoney(money);
    }

    async function init() {
      const { data: _authData, error: _authError } = await sb.auth.getSession();
      if (_authError || !_authData.session) {
        await sb.auth.signOut().catch(() => {});
        window.location.href = 'index.html';
        return;
      }
      const session = _authData.session;
      currentUser = session.user;
      const { data } = await sb.from('game_stats').select('money').eq('user_id', currentUser.id).maybeSingle();
      money = data?.money || 0; localStorage.setItem("bd_money", money);
      updateBal();
    }

    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('gesturechange', e => e.preventDefault());
  
  async function saveMoney(amount) {
    const val = Math.floor(amount);
    localStorage.setItem('bd_money', val);
    if (!currentUser) return;
    for (let i = 0; i < 3; i++) {
      const { error } = await sb.from('game_stats').update({ money: val }).eq('user_id', currentUser.id);
      if (!error) return;
      await new Promise(r => setTimeout(r, 400));
    }
    console.warn('saveMoney: échec après 3 tentatives');
  }

  init();
  
</script>
</body>
</html>
