<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pile ou Face — Battle Dock</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
    html { height:100%; } body { height:100dvh; overflow:hidden; }
    body { font-family:'Inter',sans-serif; background:#cc1a1a; display:flex; flex-direction:column; }
    .page { flex:1; display:flex; flex-direction:column; max-width:480px; width:100%; margin:0 auto; }

    .hdr { display:flex; align-items:center; gap:10px; padding:calc(env(safe-area-inset-top)+36px) 14px 10px; flex-shrink:0; }
    .btn-back { background:rgba(0,0,0,0.2); border:2px solid rgba(255,255,255,0.2); color:white; border-radius:10px; padding:8px 12px; font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:1px; cursor:pointer; }
    .hdr-title { flex:1; text-align:center; font-family:'Bebas Neue',sans-serif; font-size:20px; color:white; letter-spacing:2px; }
    .hdr-bal { background:#FDD835; border:2.5px solid #0a0a0a; border-radius:10px; padding:7px 14px; box-shadow:2px 2px 0 rgba(0,0,0,0.2); }
    .hdr-bal-v { font-family:'Bebas Neue',sans-serif; font-size:17px; color:#0a0a0a; }

    .content { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding:0 14px; }

    /* Pièce */
    .coin { width:clamp(130px,38vw,165px); height:clamp(130px,38vw,165px); border-radius:50%; background:white; border:4px solid #0a0a0a; display:flex; align-items:center; justify-content:center; font-size:clamp(60px,16vw,82px); box-shadow:6px 6px 0 rgba(0,0,0,0.25), inset 0 0 0 8px #f0f0f0; transition:transform .1s; }
    @keyframes flip { 0%{transform:rotateY(0deg)} 50%{transform:rotateY(90deg)} 100%{transform:rotateY(0deg)} }
    .coin.flipping { animation:flip .15s linear infinite; }

    /* Choix */
    .choices { display:flex; gap:10px; width:100%; }
    .choice { flex:1; padding:clamp(13px,4vw,19px) 10px; border:3px solid #0a0a0a; border-radius:16px; font-family:'Bebas Neue',sans-serif; font-size:clamp(16px,5vw,21px); color:white; text-align:center; cursor:pointer; box-shadow:4px 4px 0 rgba(0,0,0,0.2); transition:all .15s; }
    .choice:active { transform:translate(2px,2px); box-shadow:2px 2px 0 rgba(0,0,0,0.2); }
    .choice.sel { background:white; color:#cc1a1a; }
    .choice:not(.sel) { background:rgba(0,0,0,0.2); border-color:rgba(255,255,255,0.3); }

    /* Chips */
    .chips { display:flex; gap:6px; width:100%; }
    .chip { flex:1; padding:10px; border-radius:10px; text-align:center; cursor:pointer; transition:all .15s; }
    .chip.sel { background:#FDD835; border:2.5px solid #0a0a0a; box-shadow:2px 2px 0 rgba(0,0,0,0.2); }
    .chip.sel .cv { color:#0a0a0a; }
    .chip:not(.sel) { background:rgba(0,0,0,0.15); border:2px solid rgba(255,255,255,0.2); }
    .chip:not(.sel) .cv { color:rgba(255,255,255,0.5); }
    .cv { font-family:'Bebas Neue',sans-serif; font-size:14px; }

    .result { font-family:'Bebas Neue',sans-serif; font-size:22px; color:white; text-align:center; min-height:30px; }

    .btn-play { width:100%; padding:16px; border:3px solid #0a0a0a; border-radius:14px; background:white; color:#cc1a1a; font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:3px; cursor:pointer; box-shadow:4px 4px 0 rgba(0,0,0,0.2); }
    .btn-play:active { transform:translate(2px,2px); box-shadow:2px 2px 0 rgba(0,0,0,0.2); }
    .btn-play:disabled { opacity:0.5; }

    .btn-retour { width:calc(100% - 28px); margin:8px 14px calc(env(safe-area-inset-bottom)+14px); background:rgba(0,0,0,0.15); border:2px solid rgba(255,255,255,0.15); border-radius:12px; padding:12px; color:rgba(255,255,255,0.45); font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:2px; text-align:center; cursor:pointer; flex-shrink:0; }
  </style>
</head>
<body>
<div class="page">

  <div class="hdr">
    <button class="btn-back" onclick="window.location.href='casino.html'">← Salle</button>
    <div class="hdr-title">PILE OU FACE</div>
    <div class="hdr-bal"><div class="hdr-bal-v" id="balDisplay">—</div></div>
  </div>

  <div class="content">
    <div class="coin" id="coin">⚓</div>

    <div class="choices">
      <div class="choice sel" id="ch-pile" onclick="setChoix('pile')">⚓ PILE</div>
      <div class="choice" id="ch-face" onclick="setChoix('face')">🐟 FACE</div>
    </div>

    <div class="chips">
      <div class="chip sel" id="c1000" onclick="setBet(1000,'c1000')"><div class="cv">1K</div></div>
      <div class="chip" id="c5000" onclick="setBet(5000,'c5000')"><div class="cv">5K</div></div>
      <div class="chip" id="c10000" onclick="setBet(10000,'c10000')"><div class="cv">10K</div></div>
      <div class="chip" id="c50000" onclick="setBet(50000,'c50000')"><div class="cv">50K</div></div>
    </div>

    <div class="result" id="result"></div>
    <button class="btn-play" id="btnPlay" onclick="play()">LANCER — 1 000€</button>
  </div>

  <div class="btn-retour" onclick="window.location.href='casino.html'">← RETOUR AU CASINO</div>

</div>
<script>
  const SB_URL = 'https://drtsuhnbclhmgfjiykap.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
  const sb = supabase.createClient(SB_URL, SB_KEY);

  let money = 0, bet = 1000, choix = 'pile', busy = false, currentUser = null;
  const fmt = n => Math.floor(n).toLocaleString('fr-FR');

  function setChoix(c) {
    choix = c;
    document.getElementById('ch-pile').classList.toggle('sel', c==='pile');
    document.getElementById('ch-face').classList.toggle('sel', c==='face');
  }

  function setBet(val, id) {
    bet = val;
    ['c1000','c5000','c10000','c50000'].forEach(i=>document.getElementById(i).classList.toggle('sel',i===id));
    document.getElementById('btnPlay').textContent = 'LANCER — ' + fmt(val) + '€';
  }

  function updateBal() { document.getElementById('balDisplay').textContent = fmt(money)+'€'; }

  async function init() {
    const { data:{ session } } = await sb.auth.getSession();
    if(!session){ window.location.href='index.html'; return; }
    currentUser = session.user;
    const { data } = await sb.from('game_stats').select('money').eq('user_id',currentUser.id).maybeSingle();
    money = data?.money || 0;
    updateBal();
  }

  function play() {
    if(busy || money<bet){ document.getElementById('result').textContent='Pas assez d\'argent !'; return; }
    busy = true;
    money -= bet;
    updateBal();
    document.getElementById('result').textContent = '';
    document.getElementById('btnPlay').disabled = true;

    const coin = document.getElementById('coin');
    coin.classList.add('flipping');

    const result = Math.random() < 0.5 ? 'pile' : 'face';
    let n = 0;
    const spinInt = setInterval(()=>{ coin.textContent = n++%2===0 ? '⚓' : '🐟'; }, 100);

    setTimeout(()=>{
      clearInterval(spinInt);
      coin.classList.remove('flipping');
      coin.textContent = result==='pile' ? '⚓' : '🐟';
      settle(result);
    }, 1200);
  }

  async function settle(result) {
    const win = result === choix;
    let msg = '';
    if(win) {
      const gain = Math.floor(bet * 1.9);
      money += gain;
      msg = (result==='pile'?'⚓ PILE !':'🐟 FACE !') + ' +'+fmt(gain)+'€';
    } else {
      msg = (result==='pile'?'⚓ PILE':'🐟 FACE') + '… Raté !';
    }
    updateBal();
    document.getElementById('result').textContent = msg;
    document.getElementById('btnPlay').disabled = false;
    busy = false;
    if(currentUser) await sb.from('game_stats').update({ money: Math.floor(money) }).eq('user_id',currentUser.id);
  }

  init();
</script>
</body>
</html>
