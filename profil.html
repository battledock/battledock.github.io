<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Battle Dock - Profil</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f8f9fa;
      min-height: 100vh;
      color: #1a1a1a;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }

    .identity-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .avatar-circle {
      width: 80px;
      height: 80px;
      background: #f3f4f6;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      image-rendering: pixelated;
      border: 3px solid #e5e7eb;
      font-size: 48px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .avatar-circle:active {
      transform: scale(0.95);
    }

    .identity-info {
      flex: 1;
      min-width: 0;
    }

    .username {
      font-size: 22px;
      font-weight: 800;
      color: #1a1a1a;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .role {
      font-size: 14px;
      color: #6b7280;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .dock-pass {
      display: inline-block;
      padding: 4px 10px;
      background: #10b981;
      color: white;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .dock-pass.legendary {
      background: #f59e0b;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 20px 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      text-align: center;
    }

    .stat-icon {
      font-size: 28px;
      margin-bottom: 8px;
      display: block;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 800;
      color: #1a1a1a;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 11px;
      color: #6b7280;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-card.money .stat-value {
      color: #10b981;
      font-size: 20px;
    }

    .xp-section {
      background: #ffffff;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .xp-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .xp-label {
      font-size: 12px;
      color: #6b7280;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .xp-text {
      font-size: 13px;
      font-weight: 700;
      color: #1a1a1a;
    }

    .xp-bar-container {
      width: 100%;
      height: 8px;
      background: #f3f4f6;
      border-radius: 4px;
      overflow: hidden;
    }

    .xp-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #1a1a1a, #4b5563);
      border-radius: 4px;
      transition: width 0.5s;
    }

    .section {
      background: #ffffff;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .section-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 16px;
      color: #1a1a1a;
    }

    .avatars-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .avatar-item {
      aspect-ratio: 1;
      background: #f9fafb;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      border: 3px solid transparent;
      position: relative;
      font-size: 40px;
      image-rendering: pixelated;
    }

    .avatar-item.selected {
      border-color: #10b981;
      background: #d1fae5;
    }

    .avatar-item.locked {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .avatar-item:not(.locked):active {
      transform: scale(0.95);
    }

    .avatar-lock {
      position: absolute;
      top: 4px;
      right: 4px;
      font-size: 16px;
    }

    .avatar-level {
      font-size: 9px;
      font-weight: 700;
      color: #6b7280;
      margin-top: 2px;
    }

    .collector-card {
      background: linear-gradient(135deg, #FFD700, #FFA500);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 4px 12px rgba(255, 165, 0, 0.3);
      text-align: center;
    }

    .collector-title {
      font-size: 14px;
      font-weight: 800;
      color: #1a1a1a;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .collector-avatar {
      font-size: 64px;
      margin: 12px 0;
      image-rendering: pixelated;
    }

    .collector-price {
      font-size: 24px;
      font-weight: 900;
      color: #1a1a1a;
      margin-bottom: 12px;
    }

    .collector-btn {
      background: #1a1a1a;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .collector-btn:active {
      transform: scale(0.95);
    }

    .collector-btn.owned {
      background: #10b981;
    }

    .collector-btn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .actions {
      display: grid;
      gap: 12px;
      margin-bottom: 16px;
    }

    .action-btn {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .action-btn:active {
      transform: scale(0.98);
      background: #f9fafb;
    }

    .action-btn.primary {
      background: #3b82f6;
      border-color: #3b82f6;
      color: #ffffff;
    }

    .action-btn.primary:active {
      background: #2563eb;
    }

    .action-btn.success {
      background: #10b981;
      border-color: #10b981;
      color: #ffffff;
    }

    .action-btn.success:active {
      background: #059669;
    }

    .bottom-actions {
      display: flex;
      gap: 12px;
    }

    .bottom-btn {
      flex: 1;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      color: #1a1a1a;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .bottom-btn:active {
      transform: scale(0.95);
    }

    .bottom-btn.danger {
      background: #ef4444;
      border-color: #ef4444;
      color: #ffffff;
    }

    .bottom-btn.danger:active {
      background: #dc2626;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      border-radius: 16px;
      padding: 24px;
      max-width: 500px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 800;
      color: #1a1a1a;
    }

    .modal-close {
      font-size: 24px;
      cursor: pointer;
      color: #6b7280;
      background: none;
      border: none;
      padding: 4px;
    }

    .modal-close:active {
      transform: scale(0.9);
    }

    .save-btn {
      width: 100%;
      background: #10b981;
      color: white;
      border: none;
      padding: 16px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 16px;
      transition: all 0.2s;
    }

    .save-btn:active {
      transform: scale(0.98);
      background: #059669;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="identity-card">
      <div class="avatar-circle" id="avatarCircle" onclick="openAvatarModal()">🚢</div>
      <div class="identity-info">
        <div class="username" id="username">Docker</div>
        <div class="role" id="role">Docker Occasionnel</div>
        <div class="dock-pass" id="dockPass">NIV 1</div>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-icon">⚓</span>
        <div class="stat-value" id="level">1</div>
        <div class="stat-label">Niveau</div>
      </div>

      <div class="stat-card money">
        <span class="stat-icon">💰</span>
        <div class="stat-value" id="money">100€</div>
        <div class="stat-label">Argent</div>
      </div>

      <div class="stat-card">
        <span class="stat-icon">🏆</span>
        <div class="stat-value" id="rankPosition">#-</div>
        <div class="stat-label">Classement</div>
      </div>
    </div>

    <div class="xp-section">
      <div class="xp-header">
        <span class="xp-label">Expérience</span>
        <span class="xp-text" id="xpText">0 / 1000 XP</span>
      </div>
      <div class="xp-bar-container">
        <div class="xp-bar-fill" id="xpBar" style="width: 0%;"></div>
      </div>
    </div>

    <div class="actions">
      <button class="action-btn success" onclick="shareGame()">
        <span>🚀</span>
        <span>Partager le jeu</span>
      </button>
    </div>

    <div class="bottom-actions">
      <button class="bottom-btn" onclick="window.location.href='game.html'">Retour</button>
      <button class="bottom-btn danger" onclick="logout()">Déconnexion</button>
    </div>
  </div>

  <!-- Modal Avatar -->
  <div class="modal" id="avatarModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">🎨 Choisir mon Avatar</div>
        <button class="modal-close" onclick="closeAvatarModal()">×</button>
      </div>

      <div class="section">
        <div class="section-title">Avatars disponibles</div>
        <div class="avatars-grid" id="avatarsGrid"></div>
      </div>

      <div class="collector-card" id="collectorCard">
        <div class="collector-title">⭐ AVATAR COLLECTOR EXCLUSIF ⭐</div>
        <div class="collector-avatar">👑</div>
        <div class="collector-price">1 000 000 €</div>
        <button class="collector-btn" id="collectorBtn">ACHETER</button>
      </div>

      <button class="save-btn" onclick="saveAvatar()">Sauvegarder mon Avatar</button>
    </div>
  </div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const supabaseClient = createClient(supabaseUrl, supabaseKey);

    const userId = localStorage.getItem('userId');
    const username = localStorage.getItem('username');

    let playerData = null;
    let selectedAvatar = '🚢';
    let collectorOwned = false;

    const avatars = [
      { icon: '🚢', label: 'Bateau', level: 0 },
      { icon: '⚓', label: 'Ancre', level: 0 },
      { icon: '🐟', label: 'Poisson', level: 0 },
      { icon: '🦈', label: 'Requin', level: 0 },
      { icon: '🐙', label: 'Pieuvre', level: 0 },
      { icon: '🏴‍☠️', label: 'Pirate', level: 5 },
      { icon: '🌊', label: 'Vague', level: 10 },
      { icon: '🏖️', label: 'Plage', level: 15 },
      { icon: '🐚', label: 'Coquillage', level: 20 },
      { icon: '🦞', label: 'Homard', level: 25 },
      { icon: '🚤', label: 'Yacht', level: 30 },
      { icon: '⛵', label: 'Voilier', level: 50 },
      { icon: '🛥️', label: 'Bateau Luxe', level: 70 },
      { icon: '🚁', label: 'Hélicoptère', level: 90 },
      { icon: '🛳️', label: 'Cargo Géant', level: 100 }
    ];

    function getRank(level) {
      if (level < 15) return 'Docker Occasionnel';
      if (level < 30) return 'Docker';
      if (level < 50) return 'Docker Mensuel';
      if (level < 80) return 'Contre-Maître';
      if (level < 100) return 'Chef de Quai';
      return 'Directeur de Compagnie';
    }

    function getRequiredXpForLevel(level) {
      if (level <= 1) return 0;
      return Math.round(1000 * Math.pow(1.1, level - 2));
    }

    function formatMoney(amount) {
      return amount.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + '€';
    }

    function openAvatarModal() {
      document.getElementById('avatarModal').classList.add('active');
      renderAvatars();
      updateCollectorButton();
    }

    function closeAvatarModal() {
      document.getElementById('avatarModal').classList.remove('active');
    }

    function renderAvatars() {
      const grid = document.getElementById('avatarsGrid');
      grid.innerHTML = '';

      avatars.forEach(avatar => {
        const isUnlocked = playerData.level >= avatar.level;
        const isSelected = selectedAvatar === avatar.icon;

        const div = document.createElement('div');
        div.className = 'avatar-item';
        if (isSelected) div.classList.add('selected');
        if (!isUnlocked) div.classList.add('locked');

        div.innerHTML = avatar.icon;

        if (!isUnlocked) {
          const lock = document.createElement('div');
          lock.className = 'avatar-lock';
          lock.textContent = '🔒';
          div.appendChild(lock);

          const levelLabel = document.createElement('div');
          levelLabel.className = 'avatar-level';
          levelLabel.textContent = `Niv. ${avatar.level}`;
          div.appendChild(levelLabel);
        }

        if (isUnlocked) {
          div.onclick = () => selectAvatar(avatar.icon);
        }

        grid.appendChild(div);
      });
    }

    function selectAvatar(icon) {
      selectedAvatar = icon;
      document.getElementById('avatarCircle').textContent = icon;
      renderAvatars();
    }

    function updateCollectorButton() {
      const btn = document.getElementById('collectorBtn');
      
      if (collectorOwned) {
        btn.textContent = 'POSSÉDÉ ✓';
        btn.classList.add('owned');
        btn.disabled = true;
        btn.onclick = null;
      } else if (playerData.money >= 1000000) {
        btn.textContent = 'ACHETER';
        btn.disabled = false;
        btn.classList.remove('owned');
        btn.onclick = buyCollector;
      } else {
        btn.textContent = `Besoin de ${formatMoney(1000000 - playerData.money)}`;
        btn.disabled = true;
        btn.classList.remove('owned');
        btn.onclick = null;
      }
    }

    async function buyCollector() {
      if (playerData.money < 1000000) {
        alert('Budget insuffisant !');
        return;
      }

      if (!confirm('Acheter l\'avatar Collector pour 1 000 000€ ?')) return;

      const { error } = await supabaseClient
        .from('game_progress')
        .update({ money: playerData.money - 1000000 })
        .eq('user_id', userId);

      if (error) {
        console.error('❌ Erreur:', error);
        alert('Erreur lors de l\'achat');
        return;
      }

      playerData.money -= 1000000;
      collectorOwned = true;
      selectedAvatar = '👑';

      document.getElementById('avatarCircle').textContent = '👑';
      document.getElementById('money').textContent = formatMoney(playerData.money);
      updateCollectorButton();
      alert('🎉 Avatar Collector débloqué !');
    }

    async function saveAvatar() {
      const { error } = await supabaseClient
        .from('profiles')
        .update({ avatar_url: selectedAvatar })
        .eq('user_id', userId);

      if (error) {
        console.error('❌ Erreur:', error);
        alert('Erreur lors de la sauvegarde');
        return;
      }

      alert('✅ Avatar sauvegardé !');
      closeAvatarModal();
    }

    async function loadProfile() {
      if (!userId || !username) {
        alert('Session expirée');
        window.location.href = 'index.html';
        return;
      }

      try {
        const { data: profileData, error: profileError } = await supabaseClient
          .from('profiles')
          .select('*')
          .eq('user_id', userId)
          .single();

        const { data: progressArray, error: progressError } = await supabaseClient
          .from('game_progress')
          .select('*')
          .eq('user_id', userId);

        if (profileError || progressError) {
          console.error('Erreur chargement:', profileError || progressError);
          return;
        }

        playerData = progressArray?.[0];

        if (profileData && playerData) {
          selectedAvatar = profileData.avatar_url || '🚢';
          collectorOwned = selectedAvatar === '👑';

          document.getElementById('avatarCircle').textContent = selectedAvatar;
          document.getElementById('username').textContent = profileData.username;
          document.getElementById('role').textContent = playerData.rank || 'Docker Occasionnel';
          
          const level = playerData.level || 1;
          const passClass = level >= 50 ? 'legendary' : '';
          document.getElementById('dockPass').className = `dock-pass ${passClass}`;
          document.getElementById('dockPass').textContent = `NIV ${level}`;

          document.getElementById('level').textContent = level;
          
          const currentXP = playerData.xp || 0;
          const nextLevelXP = getRequiredXpForLevel(level + 1);
          const xpPercent = (currentXP / nextLevelXP) * 100;
          document.getElementById('xpBar').style.width = `${xpPercent}%`;
          document.getElementById('xpText').textContent = `${currentXP.toLocaleString('fr-FR')} / ${nextLevelXP.toLocaleString('fr-FR')} XP`;

          document.getElementById('money').textContent = formatMoney(playerData.money || 100);

          const { data: allPlayers } = await supabaseClient
            .from('game_progress')
            .select('user_id, money')
            .order('money', { ascending: false });

          if (allPlayers) {
            const userRankIndex = allPlayers.findIndex(p => p.user_id === userId);
            const userRank = userRankIndex !== -1 ? userRankIndex + 1 : '-';
            document.getElementById('rankPosition').textContent = `#${userRank}`;
          }
        }
      } catch (error) {
        console.error('Erreur:', error);
      }
    }

    function logout() {
      if (confirm('Êtes-vous sûr de vouloir vous déconnecter ?')) {
        localStorage.clear();
        window.location.href = 'index.html';
      }
    }

    async function shareGame() {
      const gameUrl = 'https://battledock.github.io';
      const shareText = '🚢 Rejoins-moi sur Battle Dock ! Le jeu de docker marseillais 🏆';

      if (navigator.share) {
        try {
          await navigator.share({
            title: 'Battle Dock',
            text: shareText,
            url: gameUrl
          });
        } catch (err) {
          if (err.name !== 'AbortError') {
            copyToClipboard(gameUrl);
          }
        }
      } else {
        copyToClipboard(gameUrl);
      }
    }

    function copyToClipboard(text) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => {
          alert('✅ Lien copié !\n\n' + text + '\n\nPartage-le avec tes amis !');
        }).catch(() => {
          fallbackCopy(text);
        });
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        alert('✅ Lien copié !\n\n' + text + '\n\nPartage-le avec tes amis !');
      } catch (err) {
        alert('📋 Copie ce lien :\n\n' + text);
      }
      document.body.removeChild(textarea);
    }

    loadProfile();
  </script>
</body>
</html>
