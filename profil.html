<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Profil — Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Bebas+Neue&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
body{font-family:'Inter',sans-serif;background:#f5f5f5;min-height:100dvh}

/* ── HEADER identique game.html ── */
.hdr{position:fixed;top:0;left:0;right:0;z-index:100;background:linear-gradient(135deg,#cc1a1a,#0f172a)}
.hdr-inner{padding:calc(16px + env(safe-area-inset-top,44px)) 18px 14px;position:relative;overflow:hidden}
.hdr-inner::before{content:'⚓';position:absolute;right:-10px;top:-10px;font-size:130px;opacity:.04;line-height:1;pointer-events:none}
.hdr-row{display:flex;align-items:center;gap:14px;position:relative;z-index:2}
.hdr-av{width:72px;height:72px;border-radius:50%;overflow:hidden;background:rgba(0,0,0,.2);flex-shrink:0}
.hdr-av img{width:100%;height:100%;object-fit:contain}
.hdr-nm{font-family:'Bebas Neue',sans-serif;font-size:28px;color:#fff;letter-spacing:2px;line-height:1}
.hdr-xp-row{display:flex;align-items:center;gap:4px;padding-bottom:4px}
.hdr-xp-b{width:48px;height:4px;background:rgba(0,0,0,.3);border-radius:2px;overflow:hidden}
.hdr-xp-f{height:100%;width:0%;background:rgba(255,255,255,.32);border-radius:2px;transition:width .6s}
.hdr-xp-p{font-size:6.5px;color:rgba(255,255,255,.25);font-weight:700}
.hdr-gr{font-size:7.5px;color:rgba(255,255,255,.45);font-weight:700;letter-spacing:1.5px;margin-top:4px}
.hdr-lv{font-size:7.5px;color:rgba(255,255,255,.3);font-weight:600;margin-top:2px}
.hdr-mo{font-family:'Bebas Neue',sans-serif;font-size:17px;color:rgba(255,255,255,.6);flex-shrink:0;text-align:right}

/* ── SKELETON header ── */
.sk{background:linear-gradient(90deg,rgba(255,255,255,.08) 25%,rgba(255,255,255,.15) 50%,rgba(255,255,255,.08) 75%);background-size:200%;animation:skShimmer 1.4s ease-in-out infinite;border-radius:6px}
@keyframes skShimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}

/* ── SECTIONS ── */
.spacer{height:calc(118px + env(safe-area-inset-top,44px))}
.sec{background:#fff;margin:8px 0 0}
.sec-title{font-size:7.5px;font-weight:800;color:#9ca3af;letter-spacing:2.5px;padding:14px 16px 8px}

/* BIO */
.bio-wrap{padding:0 16px 14px;cursor:pointer}
.bio-text{font-size:15px;color:#1a1a1a;font-style:italic;line-height:1.6;font-weight:500}
.bio-placeholder{font-size:14px;color:#d1d5db;font-style:italic}
.bio-edit-hint{font-size:9px;color:#d1d5db;margin-top:6px}
/* AV SELECTION */
.av-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 16px 16px}
.av-item{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;position:relative}
.av-wrap{width:64px;height:64px;border-radius:50%;overflow:hidden;background:#f5f5f5;border:2.5px solid #e5e7eb;display:flex;align-items:center;justify-content:center;transition:border-color .2s}
.av-wrap.sel{border-color:#cc1a1a;box-shadow:0 0 0 3px rgba(204,26,26,.12)}
.av-wrap.lck{filter:grayscale(1);opacity:.3;pointer-events:none}
.av-wrap img{width:100%;height:100%;object-fit:contain}
.av-lbl{font-size:7px;font-weight:800;color:#9ca3af;letter-spacing:.5px;text-align:center}
.av-lbl.sel{color:#cc1a1a}
.av-lock{position:absolute;top:0;right:6px;background:#1a1a1a;border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center;font-size:8px}
.av-chk{position:absolute;top:0;right:6px;background:#cc1a1a;border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;z-index:2}
/* TITRES */
.titres-list{padding:0 16px 16px;display:flex;flex-direction:column;gap:8px}
.tr-item{display:flex;align-items:center;gap:12px;padding:10px 12px;background:#f8f8f8;border-radius:12px;border:1.5px solid transparent;cursor:pointer}
.tr-item.active{background:#fefce8;border-color:#fbbf24}
.tr-item.locked{opacity:.4;pointer-events:none}
.tr-ico{font-size:20px;flex-shrink:0}
.tr-info{flex:1;min-width:0}
.tr-nm{font-size:12px;font-weight:800;color:#1a1a1a}
.tr-nm.active{color:#92400e}
.tr-cond{font-size:8px;color:#9ca3af;margin-top:1px}
.tr-badge{font-size:7px;font-weight:800;padding:2px 8px;border-radius:20px;flex-shrink:0}
.tr-badge.owned{background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0}
.tr-badge.lck{background:#f5f5f5;color:#9ca3af;border:1px solid #e5e7eb}
.tr-badge.act{background:#fef9c3;color:#854d0e;border:1px solid #fde047}
.tr-prix{font-size:9px;font-weight:800;color:#6366f1;flex-shrink:0}
/* CARTE DOCKER */
.carte-wrap{padding:0 16px 16px}
.carte{background:linear-gradient(135deg,#0f172a,#1e293b);border-radius:16px;padding:18px;position:relative;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.carte::before{content:'⚓';position:absolute;right:-8px;bottom:-18px;font-size:110px;opacity:.04;color:#fff;line-height:1;pointer-events:none}
.c-stripe{position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#cc1a1a,#ef4444)}
.c-hdr{display:flex;align-items:center;margin-bottom:14px}
.c-hdr-txt .c-logo{font-size:9px;font-weight:900;color:rgba(255,255,255,.5);letter-spacing:2px}
.c-hdr-txt .c-org{font-size:6px;font-weight:800;color:rgba(255,255,255,.2);letter-spacing:2px;margin-top:1px}
.c-type{margin-left:auto;font-size:7px;font-weight:900;color:rgba(255,255,255,.35);letter-spacing:2px;background:rgba(255,255,255,.06);padding:3px 8px;border-radius:4px;border:1px solid rgba(255,255,255,.08)}
.c-body{display:flex;gap:14px;margin-bottom:14px}
.c-photo{width:64px;height:64px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);overflow:hidden;flex-shrink:0}
.c-photo img{width:100%;height:100%;object-fit:contain}
.c-infos .c-nom{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#fff;letter-spacing:2px;line-height:1}
.c-infos .c-titre{font-size:8px;font-weight:800;color:#fbbf24;letter-spacing:1.5px;margin-top:3px}
.c-infos .c-grade{font-size:8px;font-weight:700;color:rgba(255,255,255,.35);letter-spacing:1px;margin-top:3px}
.c-infos .c-mat{font-size:11px;font-weight:800;color:rgba(255,255,255,.55);font-family:monospace;margin-top:4px;letter-spacing:2px}
.c-sep{height:1px;background:rgba(255,255,255,.07);margin:0 0 12px}
.c-dets{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.c-det{background:rgba(255,255,255,.04);border-radius:8px;padding:8px}
.c-det-lbl{font-size:6px;font-weight:800;color:rgba(255,255,255,.2);letter-spacing:2px;margin-bottom:3px}
.c-det-val{font-size:10px;font-weight:800;color:rgba(255,255,255,.65)}
.c-stamp{position:absolute;bottom:18px;right:16px;width:48px;height:48px;border-radius:50%;border:2px solid rgba(74,222,128,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-15deg)}
.c-stamp-txt{font-size:5.5px;font-weight:900;color:rgba(74,222,128,.45);letter-spacing:1px;text-align:center;line-height:1.4}
.c-bars{display:flex;gap:1px;height:16px;margin:10px auto 0;justify-content:center}
.c-bars span{background:rgba(255,255,255,.25);border-radius:1px;display:block}
.c-barcode-id{font-size:6px;font-weight:700;color:rgba(255,255,255,.15);letter-spacing:3px;font-family:monospace;text-align:center;margin-top:3px}


/* BADGES */
.badges-scroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 16px 14px}
.badges-scroll::-webkit-scrollbar{display:none}
.bdg{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.bdg-ico{width:52px;height:52px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px}
.bdg-ico.on{background:#fefce8;border:1.5px solid #fbbf24}
.bdg-ico.off{background:#f5f5f5;border:1.5px solid #f0f0f0;filter:grayscale(1);opacity:.2}
.bdg-lbl{font-size:6.5px;font-weight:800;color:#d1d5db;letter-spacing:.5px;text-align:center}
.bdg-lbl.on{color:#d97706}

/* INFOS */
.info-row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid #f5f5f5}
.info-row:last-child{border:none}
.info-ico{font-size:18px;flex-shrink:0;width:26px;text-align:center}
.info-label{font-size:13px;font-weight:600;color:#1a1a1a;flex:1}
.info-val{font-family:'Bebas Neue',sans-serif;font-size:15px;color:#1a1a1a;text-align:right;flex-shrink:0}
.info-sub{font-size:9px;color:#9ca3af;margin-top:1px}

/* BOUTON DÉCO */
.btn-logout{width:100%;padding:13px;background:transparent;border:none;font-size:11px;font-weight:700;color:#9ca3af;cursor:pointer;display:block;margin:4px 0}

/* OVERLAY BIO */
.ov{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.5);display:none;align-items:flex-end}
.ov.show{display:flex}
.ov-sheet{background:#fff;border-radius:18px 18px 0 0;width:100%;padding:20px 16px calc(env(safe-area-inset-bottom,20px)+16px)}
.ov-title{font-family:'Bebas Neue',sans-serif;font-size:18px;color:#1a1a1a;letter-spacing:2px;text-align:center;margin-bottom:14px}
.ov-input{width:100%;padding:12px;background:#f5f5f5;border:1.5px solid #f0f0f0;border-radius:10px;font-size:14px;font-style:italic;color:#1a1a1a;resize:none;height:80px;-webkit-user-select:text;user-select:text;font-family:'Inter',sans-serif}
.ov-input:focus{outline:none;border-color:#cc1a1a}
.ov-btn{width:100%;margin-top:10px;padding:13px;background:#1a1a1a;border:none;border-radius:12px;font-family:'Bebas Neue',sans-serif;font-size:15px;color:#fff;letter-spacing:2px;cursor:pointer}
.ov-cancel{width:100%;margin-top:6px;padding:10px;background:transparent;border:none;font-size:11px;font-weight:700;color:#9ca3af;cursor:pointer}

/* TOAST */
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,20px)+80px);left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:12px;font-size:12px;font-weight:700;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

/* NAV */
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #f0f0f0;padding:5px 5px max(8px,env(safe-area-inset-bottom));display:flex;gap:2px;z-index:100}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:0;padding:4px 2px;border-radius:12px;border:none;background:transparent;cursor:pointer}
.nb.on{background:#1a1a1a}
.nb-w{width:40px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.ni{font-size:18px;line-height:1}
.nl{font-family:'Bangers',sans-serif;font-size:8.5px;color:#ccc;letter-spacing:.3px}
.nb.on .nl{color:#fbbf24}
</style>
</head>
<body>

<!-- ══ HEADER ══ -->
<div class="hdr">
  <div class="hdr-inner">
    <!-- Skeleton -->
    <div id="hdrSk" style="display:flex;align-items:center;gap:14px;position:relative;z-index:2">
      <div class="sk" style="width:72px;height:72px;border-radius:50%;flex-shrink:0"></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:8px">
        <div class="sk" style="height:22px;width:65%;border-radius:5px"></div>
        <div class="sk" style="height:10px;width:45%;border-radius:4px"></div>
        <div class="sk" style="height:10px;width:30%;border-radius:4px"></div>
      </div>
    </div>
    <!-- Identité -->
    <div id="hdrId" style="display:none">
      <div class="hdr-row">
        <div class="hdr-av"><img id="avatarImg" src="avatar-default.png" alt=""></div>
        <div style="flex:1">
          <div style="display:flex;align-items:baseline;gap:8px">
            <div class="hdr-nm" id="usernameEl">—</div>
            <div class="hdr-xp-row">
              <div class="hdr-xp-b"><div class="hdr-xp-f" id="xpFill"></div></div>
              <span class="hdr-xp-p" id="xpPct">—</span>
            </div>
          </div>
          <div class="hdr-gr" id="gradeEl">—</div>
          <div class="hdr-lv">NV.<span id="levelEl">—</span> → <span id="nextLvlEl">—</span></div>
        </div>
        <div class="hdr-mo" id="moneyEl">—</div>
      </div>
    </div>
  </div>
</div>

<div class="spacer"></div>



<div class="toast" id="toast"></div>

<script>
var SB_URL='https://drtsuhnbclhmgfjiykap.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
var sb=supabase.createClient(SB_URL,SB_KEY);
var currentUser=null;

var COVER_CSS={
  'rouge_navy':'linear-gradient(135deg,#cc1a1a,#0f172a)',
  'bleu_mer':'linear-gradient(160deg,#0c4a6e,#0369a1,#0ea5e9)',
};


var AVATARS=[
  {src:'avatar-default.png',lbl:'NV.1',min:1},
  {src:'avatar-level-5.png',lbl:'NV.5',min:5},
  {src:'avatar-level-10.png',lbl:'NV.10',min:10},
  {src:'avatar-level-13.png',lbl:'NV.13',min:13},
  {src:'avatar-level-15.png',lbl:'NV.15',min:15},
  {src:'avatar-level-17.png',lbl:'NV.17',min:17},
  {src:'avatar-level-20.png',lbl:'NV.20',min:20},
  {src:'avatar-level-30.png',lbl:'NV.30',min:30},
  {src:'avatar-level-50.png',lbl:'NV.50',min:50}
];
var TITRES=[
  {id:'docker',  ico:'\u2693', nom:'Docker du Port',      cond:'Compte cree',           req:'free',    min:1,  prix:0},
  {id:'chef',    ico:'\uD83D\uDEA2',nom:'Chef de Quai',  cond:'Atteindre niveau 5',    req:'level',   min:5,  prix:0},
  {id:'loup',    ico:'\uD83D\uDC33',nom:'Vieux Loup',    cond:'30 jours connexion',    req:'streak',  min:1,  prix:0},
  {id:'baron',   ico:'\uD83D\uDCB0',nom:'Baron du Port', cond:'1 000 000 en poche',    req:'money',   min:1,  prix:0},
  {id:'roi',     ico:'\uD83D\uDC51',nom:'Roi des Docks', cond:'Titre premium',          req:'diamond', min:1,  prix:500},
  {id:'magnat',  ico:'\uD83C\uDFC6',nom:'Magnat Portuaire',cond:'Niveau 20',            req:'level',   min:20, prix:0},
  {id:'legende', ico:'\u2B50',  nom:'Legende de Marseille',cond:'Niveau 50',             req:'level',   min:50, prix:0}
];
var _selAv=null,_curLvl=1,_actTitre='docker';

function renderAvatarGrid(lvl,curSrc){
  _curLvl=lvl;
  var g=document.getElementById('avatarGrid');
  if(!g)return;
  g.innerHTML=AVATARS.map(function(av,i){
    var ok=lvl>=av.min,sel=curSrc===av.src||(i===0&&!curSrc);
    if(sel)_selAv=av.src;
    var html='<div class="av-item"'+(ok?' onclick="selAv('+i+')"':'')+'>'
    +'<div class="av-wrap'+(sel?' sel':'')+(ok?'':' lck')+'">';
    html+='<img src="'+av.src+'" alt="">';
    html+='</div>';
    if(sel)html+='<div class="av-chk">v</div>';
    if(!ok)html+='<div class="av-lock">L</div>';
    html+='<div class="av-lbl'+(sel?' sel':'')+'">'+(ok?av.lbl:'?')+'</div>';
    html+='</div>';
    return html;
  }).join('');
}
async function selAv(i){
  var av=AVATARS[i];if(_curLvl<av.min)return;
  _selAv=av.src;
  await sb.from('profiles').update({avatar_src:av.src}).eq('user_id',currentUser.id);
  document.getElementById('avatarImg').src=av.src;
  document.getElementById('carteAv').src=av.src;
  renderAvatarGrid(_curLvl,av.src);
  toast('Avatar mis a jour');
}

function isTitreOk(t,stats){
  if(t.req==='free')return true;
  if(t.req==='level')return (stats.level||1)>=t.min;
  if(t.req==='money')return (stats.money||0)>=1000000;
  if(t.req==='streak')return (stats.streak_days||0)>=30;
  return false;
}
function renderTitres(stats,profile){
  _actTitre=profile.active_titre||'docker';
  var owned=profile.owned_titres||['docker'];
  var list=document.getElementById('titresList');
  if(!list)return;
  list.innerHTML=TITRES.map(function(t){
    var ok=isTitreOk(t,stats),own=owned.indexOf(t.id)>=0,act=t.id===_actTitre;
    var buy=t.req==='diamond'&&!own,lck=!ok&&!own;
    var badge='';
    if(act)badge='<span class="tr-badge act">ACTIF</span>';
    else if(own)badge='<span class="tr-badge owned">POSSEDE</span>';
    else if(buy)badge='<span class="tr-prix">'+t.prix+' Diam.</span>';
    else badge='<span class="tr-badge lck">'+(t.min>1?'NV.'+t.min:'-')+'</span>';
    var cls='tr-item'+(act?' active':'')+(lck?' locked':'');
    var click='';
    if(own&&!act)click=' data-tid="'+t.id+'" onclick="activerTitreClic(this)"';
    else if(buy)click=' data-tid="'+t.id+'" data-prix="'+t.prix+'" onclick="acheterTitreClic(this)"';
    return '<div class="'+cls+'"'+click+'>'
      +'<div class="tr-ico">'+t.ico+'</div>'
      +'<div class="tr-info"><div class="tr-nm'+(act?' active':'')+'">'+t.nom+'</div>'
      +'<div class="tr-cond">'+t.cond+'</div></div>'
      +badge+'</div>';
  }).join('');
}
function activerTitreClic(el){activerTitre(el.getAttribute('data-tid'));}
function acheterTitreClic(el){acheterTitre(el.getAttribute('data-tid'),parseInt(el.getAttribute('data-prix')));}

async function activerTitre(id){
  _actTitre=id;
  var t=TITRES.find(function(x){return x.id===id;});
  await sb.from('profiles').update({active_titre:id}).eq('user_id',currentUser.id);
  if(document.getElementById('carteTitre'))document.getElementById('carteTitre').textContent=t.ico+' '+t.nom;
  var pr2=await sb.from('profiles').select('active_titre,owned_titres').eq('user_id',currentUser.id).maybeSingle();
  var gs2=await sb.from('game_stats').select('level,money,streak_days,diamonds').eq('user_id',currentUser.id).maybeSingle();
  renderTitres(gs2.data||{},pr2.data||{});
  toast('Titre active : '+t.nom);
}
async function acheterTitre(id,prix){
  var gs=await sb.from('game_stats').select('diamonds').eq('user_id',currentUser.id).maybeSingle();
  var dia=(gs.data&&gs.data.diamonds)||0;
  if(dia<prix){toast('Pas assez de 💎');return;}
  var pr=await sb.from('profiles').select('owned_titres').eq('user_id',currentUser.id).maybeSingle();
  var owned=(pr.data&&pr.data.owned_titres)||['docker'];
  if(owned.indexOf(id)<0)owned.push(id);
  await sb.from('profiles').update({owned_titres:owned}).eq('user_id',currentUser.id);
  await sb.from('game_stats').update({diamonds:dia-prix}).eq('user_id',currentUser.id);
  var gs2=await sb.from('game_stats').select('level,money,streak_days,diamonds').eq('user_id',currentUser.id).maybeSingle();
  renderTitres(gs2.data||{},{owned_titres:owned,active_titre:_actTitre});
  toast('Titre achete');
}

function renderCarte(profile,stats,lvl,xp){
  var uid=currentUser.id||'';
  var num=0;
  try{num=parseInt(uid.replace(/-/g,'').substring(0,6),16)%100000;}catch(e){}
  var mat='#DKR-'+String(num).padStart(5,'0');
  var act=TITRES.find(function(t){return t.id===(profile.active_titre||'docker');})||TITRES[0];
  if(document.getElementById('carteNom'))document.getElementById('carteNom').textContent=(profile.username||'-').toUpperCase();
  if(document.getElementById('carteTitre'))document.getElementById('carteTitre').textContent=act.ico+' '+act.nom;
  if(document.getElementById('carteGrade'))document.getElementById('carteGrade').textContent=getGrade(lvl).toUpperCase()+' - NIVEAU '+lvl;
  if(document.getElementById('carteMat'))document.getElementById('carteMat').textContent=mat;
  if(document.getElementById('carteAv'))document.getElementById('carteAv').src=profile.avatar_src||avatarForLevel(lvl);
  if(document.getElementById('carteXP'))document.getElementById('carteXP').textContent=(xp||0).toLocaleString('fr-FR')+' XP';
  if(document.getElementById('carteBarcode'))document.getElementById('carteBarcode').textContent='DKR-2025-'+String(num).padStart(5,'0')+'-MRS';
  if(profile.created_at&&document.getElementById('carteDate')){
    var d=new Date(profile.created_at);
    document.getElementById('carteDate').textContent=d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'});
  }
  if(document.getElementById('carteStamp'))document.getElementById('carteStamp').style.display=lvl>=10?'flex':'none';
}

function getGrade(l){if(l<=4)return'Docker Occasionnel';if(l<=14)return'Docker Confirmé';if(l<=29)return'Docker Mensuel';if(l<=49)return'Contre-Maître';if(l<=79)return'Chef de Quai';return'Magnat du Port';}
function getXpRequired(l){return l<=10?l*500:l<=25?l*1000:l*2000;}
function avatarForLevel(lvl){if(lvl>=50)return'avatar-level-50.png';if(lvl>=30)return'avatar-level-30.png';if(lvl>=20)return'avatar-level-20.png';if(lvl>=17)return'avatar-level-17.png';if(lvl>=15)return'avatar-level-15.png';if(lvl>=13)return'avatar-level-13.png';if(lvl>=10)return'avatar-level-10.png';if(lvl>=5)return'avatar-level-5.png';return'avatar-default.png';}

function fmtMoney(n){if(n>=1000000)return(n/1000000).toFixed(1).replace('.0','')+'M€';if(n>=1000)return Math.floor(n/1000)+'k€';return n+'€';}

function fmtPlaytime(mins){
  if(!mins||mins<1)return'—';
  var h=Math.floor(mins/60),m=mins%60;
  if(h===0)return m+'min';
  return h+'h'+String(m).padStart(2,'0');
}

function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2800);
}
async function saveBio(){
  var val=document.getElementById('bioInput').value.trim();
  if(!val)return;
  await sb.from('profiles').update({bio:val}).eq('user_id',currentUser.id);
  var el=document.getElementById('bioEl');
  el.textContent=val;
  el.className='bio-text';
  document.getElementById('bioOv').classList.remove('show');
  toast('✅ Bio enregistrée');
}

async function logout(){await sb.auth.signOut();location.href='index.html';}

(async function(){
  var r=await sb.auth.getSession();
  var s=r.data&&r.data.session;
  if(!s){location.href='index.html';return;}
  currentUser=s.user;

  var pr=await sb.from('profiles').select('username,bio,background_color,playtime_minutes,created_at,avatar_src,active_titre,owned_titres').eq('user_id',s.user.id).maybeSingle();
  var gr=await sb.from('game_stats').select('money,diamonds,trophies,xp,level,streak_days,casino_wins,best_rank,records').eq('user_id',s.user.id).maybeSingle();

  var profile=pr.data||{};
  var stats=gr.data||{};

  var lvl=stats.level||1;
  var xp=stats.xp||0;
  var needed=getXpRequired(lvl);
  var pct=Math.min(100,Math.round(xp/needed*100));
  var money=stats.money||0;

  // Header
  document.getElementById('avatarImg').src=avatarForLevel(lvl);
  document.getElementById('usernameEl').textContent=profile.username||'—';
  document.getElementById('gradeEl').textContent=getGrade(lvl);
  document.getElementById('levelEl').textContent=lvl;
  document.getElementById('nextLvlEl').textContent=lvl+1;
  document.getElementById('xpFill').style.width=pct+'%';
  document.getElementById('xpPct').textContent=pct+'%';
  document.getElementById('moneyEl').textContent=fmtMoney(money);

  // Cover
  var cover=COVER_CSS[profile.background_color||'rouge_navy']||COVER_CSS['rouge_navy'];
  document.querySelector('.hdr').style.background=cover;

  // Bio
  if(profile.bio){
    var bioEl=document.getElementById('bioEl');
    bioEl.textContent=profile.bio;
    bioEl.className='bio-text';
  }



  // Avatar + Titres + Carte
  var avSrc=profile.avatar_src||avatarForLevel(lvl);
  document.getElementById('avatarImg').src=avSrc;
  renderAvatarGrid(lvl,avSrc);
  renderTitres(stats,profile);
  renderCarte(profile,stats,lvl,xp);
  // Show header
  document.getElementById('hdrSk').style.display='none';
  document.getElementById('hdrId').style.display='block';

  // last_seen
  sb.from('profiles').update({last_seen:new Date().toISOString()}).eq('user_id',s.user.id).then(function(){});
})();
</script>
