<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mon Profil — Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#f8f8f8;font-family:'Inter',sans-serif;min-height:100dvh;padding-bottom:40px}

/* COVER */
.cover{height:130px;background:linear-gradient(135deg,#cc1a1a,#0f172a);position:relative}
.cover-edit{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;background:rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.2);border-radius:20px;padding:5px 12px;color:white;font-size:11px;font-weight:700;cursor:pointer;letter-spacing:1px}
.cover-back{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;width:36px;height:36px;border-radius:10px;background:rgba(0,0,0,0.25);border:none;color:white;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* AVATAR */
.av-wrap{position:absolute;bottom:-34px;left:50%;transform:translateX(-50%);width:68px;height:68px;border-radius:50%;border:4px solid #f8f8f8;overflow:hidden;background:#dbeafe;box-shadow:0 4px 16px rgba(0,0,0,0.15)}
.av-wrap img{width:100%;height:100%;object-fit:cover}

/* BODY */
.body{padding:42px 16px 20px;text-align:center}
.username-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:2px}
.username{font-weight:900;font-size:22px;color:#0f172a;line-height:1;text-transform:uppercase}
.rank-badge{background:#fbbf24;border-radius:5px;font-family:'Bebas Neue',sans-serif;font-size:12px;color:#0f172a;padding:2px 8px}
.grade{font-size:11px;color:#9ca3af;font-weight:600;margin-bottom:16px}

/* LISTE INFOS */
.info-list{display:flex;flex-direction:column;gap:0;margin-bottom:12px;border-radius:12px;overflow:hidden;border:1.5px solid #e5e7eb}
.info-row{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;background:white;border-bottom:1px solid #f3f4f6}
.info-row:last-child{border-bottom:none}
.info-label{font-size:11px;color:#9ca3af;font-weight:700;letter-spacing:0.3px}
.info-value{font-family:'Bebas Neue',sans-serif;font-size:15px;color:#0f172a;letter-spacing:1px}

/* BIO */
.bio-wrap{background:white;border-radius:12px;padding:12px 14px;margin-bottom:12px;border:1.5px solid #e5e7eb;text-align:left;cursor:pointer}
.bio-label{font-size:8px;font-weight:700;color:#9ca3af;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px}
.bio-text{font-size:13px;color:#374151;line-height:1.5}
.bio-placeholder{font-size:13px;color:#d1d5db;font-style:italic}
.bio-edit-icon{float:right;color:#d1d5db;font-size:13px;margin-top:1px}

/* OVERLAYS */
.edit-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:none;align-items:flex-end}
.edit-overlay.show{display:flex}
.edit-sheet{background:white;border-radius:20px 20px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom));width:100%;max-width:500px;margin:0 auto}
.edit-title{font-family:'Bebas Neue',sans-serif;font-size:18px;color:#0f172a;letter-spacing:2px;margin-bottom:14px}
.edit-input{width:100%;padding:12px 14px;border:2px solid #e5e7eb;border-radius:10px;font-size:15px;font-weight:700;color:#0f172a;outline:none;font-family:'Inter',sans-serif;resize:none}
.edit-input:focus{border-color:#cc1a1a}
.edit-btns{display:flex;gap:8px;margin-top:12px}
.btn-save{flex:2;padding:13px;border:none;border-radius:10px;background:#cc1a1a;color:white;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:1px;cursor:pointer}
.btn-cancel{flex:1;padding:13px;border:1.5px solid #e5e7eb;border-radius:10px;background:white;color:#9ca3af;font-weight:700;font-size:13px;cursor:pointer}

/* DÉCONNEXION */
.logout-btn{display:block;width:100%;padding:14px;border:1.5px solid #fee2e2;border-radius:12px;background:white;color:#dc2626;font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:1.5px;cursor:pointer;text-align:center}
.logout-btn:active{background:#fee2e2}

/* TOAST */
.toast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#0f172a;color:white;padding:9px 18px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:1px;z-index:300;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

/* ERREUR */
.error-wrap{padding:24px 16px;text-align:center;color:#9ca3af;font-size:13px}
.error-wrap button{margin-top:12px;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:1px;padding:10px 20px;border:none;border-radius:8px;background:#1a1a1a;color:#fbbf24;cursor:pointer}
</style>
</head>
<body>

<!-- COVER -->
<div class="cover" id="coverEl">
  <button class="cover-back" onclick="window.location.href='game.html'">←</button>
  <button class="cover-edit" onclick="openCoverPicker()">🎨 FOND</button>
  <div class="av-wrap">
    <img id="avatarImg" src="avatar-default.png" alt="avatar">
  </div>
</div>

<!-- BODY -->
<div class="body">
  <div class="username-row">
    <div class="username" id="usernameEl">...</div>
    <div class="rank-badge" id="rankEl">#—</div>
  </div>
  <div class="grade" id="gradeEl">—</div>

  <!-- INFOS -->
  <div class="info-list">
    <div class="info-row">
      <div class="info-label">📅 Docker depuis</div>
      <div class="info-value" id="infoSince">—</div>
    </div>
    <div class="info-row">
      <div class="info-label">⏱ Temps joué</div>
      <div class="info-value" id="infoPlaytime">—</div>
    </div>
    <div class="info-row">
      <div class="info-label">🔥 Streak</div>
      <div class="info-value" id="infoStreak">—</div>
    </div>
  </div>

  <!-- BIO -->
  <div class="bio-wrap" onclick="openEditBio()">
    <div class="bio-label">Bio <span class="bio-edit-icon">✏️</span></div>
    <div id="bioEl" class="bio-placeholder">Ajoute une bio...</div>
  </div>

  <!-- DÉCONNEXION -->
  <button class="logout-btn" onclick="logout()">🚪 SE DÉCONNECTER</button>
</div>

<!-- COVER PICKER -->
<div class="edit-overlay" id="coverOverlay" onclick="closeCoverPicker(event)">
  <div class="edit-sheet">
    <div class="edit-title">CHOISIR UN FOND</div>
    <div id="coverOptions" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px"></div>
    <button class="btn-cancel" style="width:100%;padding:12px" onclick="document.getElementById('coverOverlay').classList.remove('show')">Annuler</button>
  </div>
</div>

<!-- BIO OVERLAY -->
<div class="edit-overlay" id="editOverlay" onclick="closeEdit(event)">
  <div class="edit-sheet">
    <div class="edit-title">MODIFIER LA BIO</div>
    <textarea class="edit-input" id="editInput" maxlength="120" placeholder="Ta bio..." style="height:80px"></textarea>
    <div class="edit-btns">
      <button class="btn-save" onclick="saveBio()">SAUVEGARDER</button>
      <button class="btn-cancel" onclick="document.getElementById('editOverlay').classList.remove('show')">Annuler</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SB_URL = 'https://drtsuhnbclhmgfjiykap.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
const sb = supabase.createClient(SB_URL, SB_KEY);

let currentUser = null;
let currentCover = 'rouge_navy';
let COVERS = [];

// ── Utilitaires ───────────────────────────────────────────────

function getXpRequired(level) {
  if (level <= 10) return level * 500;
  if (level <= 25) return level * 1000;
  if (level <= 50) return level * 2000;
  return level * 4000;
}

function getGrade(level) {
  if (level <= 4)  return 'Docker Occasionnel';
  if (level <= 14) return 'Docker';
  if (level <= 29) return 'Docker Mensuel';
  if (level <= 49) return 'Contre-Maître';
  if (level <= 79) return 'Chef de Quai';
  return 'Magnat du Port';
}

function avatarForLevel(lvl) {
  if (lvl >= 50) return 'avatar-level-50.png';
  if (lvl >= 30) return 'avatar-level-30.png';
  if (lvl >= 20) return 'avatar-level-20.png';
  if (lvl >= 17) return 'avatar-level-17.png';
  if (lvl >= 15) return 'avatar-level-15.png';
  if (lvl >= 13) return 'avatar-level-13.png';
  if (lvl >= 10) return 'avatar-level-10.png';
  if (lvl >= 5)  return 'avatar-level-5.png';
  if (lvl >= 4)  return 'avatar-level-4.png';
  if (lvl >= 3)  return 'avatar-level-3.png';
  if (lvl >= 2)  return 'avatar-level-2.png';
  return 'avatar-default.png';
}

function formatDate(isoStr) {
  const d = new Date(isoStr);
  const dd = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const yyyy = d.getFullYear();
  return dd + '/' + mm + '/' + yyyy;
}

function formatPlaytime(minutes) {
  if (!minutes || minutes <= 0) return '0MIN';
  const h = Math.floor(minutes / 60);
  const m = minutes % 60;
  if (h === 0) return m + 'MIN';
  if (m === 0) return h + 'H';
  return h + 'H' + String(m).padStart(2, '0') + 'MIN';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ── Covers ────────────────────────────────────────────────────

const COVER_CSS = {
  'rouge_navy':     'linear-gradient(135deg,#cc1a1a,#0f172a)',
  'bleu_mer':       'linear-gradient(160deg,#0c4a6e,#0369a1,#0ea5e9)',
  'noir':           'linear-gradient(135deg,#18181b,#3f3f46)',
  'night':          'linear-gradient(135deg,#0f172a,#334155)',
  'ciment':         'linear-gradient(135deg,#78716c,#a8a29e,#e7e5e4)',
  'carbone':        'linear-gradient(135deg,#1c1917,#292524,#44403c)',
  'gold':           'linear-gradient(135deg,#b45309,#f59e0b)',
  'emerald':        'linear-gradient(135deg,#047857,#10b981)',
  'purple':         'linear-gradient(135deg,#6d28d9,#a855f7)',
  'coral':          'linear-gradient(135deg,#be123c,#fb7185)',
  'or_navy':        'linear-gradient(135deg,#78350f,#fbbf24,#0f172a)',
  'abysses':        'linear-gradient(135deg,#0f2027,#203a43,#2c5364)',
  'turquoise':      'linear-gradient(135deg,#134e4a,#0d9488,#5eead4)',
  'indigo':         'linear-gradient(160deg,#1e1b4b,#4338ca,#818cf8)',
  'marseille_nuit': 'linear-gradient(135deg,#0f172a,#1e3a5f,#0ea5e9)',
  'feu_docker':     'linear-gradient(160deg,#7f1d1d,#dc2626,#fbbf24)',
  'port_tropical':  'linear-gradient(135deg,#064e3b,#065f46,#d97706)',
  'sang_requin':    'linear-gradient(135deg,#450a0a,#991b1b,#cc1a1a)',
  'sunset':         'linear-gradient(135deg,#f59e0b,#ef4444,#7c3aed)',
  'neon_rouge':     'linear-gradient(160deg,#1a1a2e,#16213e,#e94560)',
  'arc_en_ciel':    'conic-gradient(from 180deg at 50% 50%,#cc1a1a,#fbbf24,#10b981,#0ea5e9,#a855f7,#cc1a1a)',
};

function getCoverCss(id) { return COVER_CSS[id] || COVER_CSS['rouge_navy']; }
function applyCover(id) { document.getElementById('coverEl').style.background = getCoverCss(id); }

function openCoverPicker() {
  const container = document.getElementById('coverOptions');
  container.innerHTML = '';
  COVERS.forEach(c => {
    const el = document.createElement('div');
    el.style.cssText = 'height:56px;border-radius:10px;cursor:pointer;border:3px solid '
      + (currentCover === c.id ? '#fbbf24' : 'transparent')
      + ';background:' + getCoverCss(c.id)
      + ';display:flex;align-items:flex-end;padding:5px 8px;transition:all .15s';
    el.innerHTML = '<span style="font-size:8px;font-weight:700;color:rgba(255,255,255,0.7);letter-spacing:1px">' + c.label + '</span>';
    el.onclick = () => selectCover(c);
    container.appendChild(el);
  });
  document.getElementById('coverOverlay').classList.add('show');
}

async function selectCover(c) {
  currentCover = c.id;
  applyCover(c.id);
  document.getElementById('coverOverlay').classList.remove('show');
  try {
    await sb.from('profiles').update({ background_color: c.id }).eq('user_id', currentUser.id);
    showToast('✓ Fond mis à jour');
  } catch(e) {
    showToast('❌ Erreur de sauvegarde');
  }
}

function closeCoverPicker(e) {
  if (e.target === document.getElementById('coverOverlay'))
    document.getElementById('coverOverlay').classList.remove('show');
}

// ── Bio ───────────────────────────────────────────────────────

function openEditBio() {
  const bioEl = document.getElementById('bioEl');
  const inp = document.getElementById('editInput');
  inp.value = bioEl.classList.contains('bio-text') ? bioEl.textContent : '';
  document.getElementById('editOverlay').classList.add('show');
  setTimeout(() => inp.focus(), 100);
}

function closeEdit(e) {
  if (e.target === document.getElementById('editOverlay'))
    document.getElementById('editOverlay').classList.remove('show');
}

async function saveBio() {
  const val = document.getElementById('editInput').value.trim();
  try {
    const { error } = await sb.from('profiles').update({ bio: val }).eq('user_id', currentUser.id);
    if (error) throw error;
    const bioEl = document.getElementById('bioEl');
    if (val) { bioEl.textContent = val; bioEl.className = 'bio-text'; }
    else      { bioEl.textContent = 'Ajoute une bio...'; bioEl.className = 'bio-placeholder'; }
    document.getElementById('editOverlay').classList.remove('show');
    showToast('✓ Bio mise à jour');
  } catch(e) {
    showToast('❌ Erreur de sauvegarde');
  }
}

// ── Déconnexion ───────────────────────────────────────────────

async function logout() {
  try {
    await sb.auth.signOut();
    window.location.href = 'index.html';
  } catch(e) {
    showToast('❌ Erreur de déconnexion');
  }
}

// ── Init ──────────────────────────────────────────────────────

async function init() {
  try {
    const { data, error } = await sb.auth.getSession();
    if (error || !data.session) {
      await sb.auth.signOut().catch(() => {});
      window.location.href = 'index.html';
      return;
    }
    currentUser = data.session.user;

    const [gRes, pRes] = await Promise.all([
      sb.from('game_stats').select('level,xp,playtime_minutes,streak_days').eq('user_id', currentUser.id).maybeSingle(),
      sb.from('profiles').select('username,avatar_url,background_color,bio,unlocked_covers,created_at').eq('user_id', currentUser.id).maybeSingle()
    ]);

    const g = gRes.data, p = pRes.data;
    if (!g || !p) { showError(); return; }

    // ── Recalcul niveau + sauvegarde si changement ──
    let lvl = g.level || 1;
    let xp  = g.xp || 0;
    const startLvl = lvl;
    while (xp >= getXpRequired(lvl)) { xp -= getXpRequired(lvl); lvl++; }
    if (lvl !== startLvl) {
      await sb.from('game_stats').update({ level: lvl, xp }).eq('user_id', currentUser.id);
    }

    // ── Avatar + sync ──
    const SPECIAL = ['avatar-millionaire.png', 'avatar-completionist.png'];
    const autoAvatar = avatarForLevel(lvl);
    const avatarSrc = SPECIAL.includes(p.avatar_url) ? p.avatar_url : autoAvatar;
    document.getElementById('avatarImg').src = avatarSrc;
    if (!SPECIAL.includes(p.avatar_url) && p.avatar_url !== autoAvatar) {
      await sb.from('profiles').update({ avatar_url: autoAvatar }).eq('user_id', currentUser.id);
    }

    // ── Cover ──
    currentCover = p.background_color || 'rouge_navy';
    applyCover(currentCover);
    let ownedIds = ['rouge_navy', 'bleu_mer'];
    if (p.unlocked_covers) {
      try {
        const raw = typeof p.unlocked_covers === 'string' ? JSON.parse(p.unlocked_covers) : p.unlocked_covers;
        if (Array.isArray(raw)) ownedIds = raw;
      } catch(e) {}
    }
    if (!ownedIds.includes(currentCover)) ownedIds.push(currentCover);
    COVERS = ownedIds.map(id => ({ id, label: id.replace(/_/g, ' ') }));

    // ── Nom + grade ──
    document.getElementById('usernameEl').textContent = (p.username || 'Docker').toUpperCase();
    document.getElementById('gradeEl').textContent    = getGrade(lvl);

    // ── Rang ──
    const { data: allStats } = await sb.from('game_stats').select('user_id,level,money').order('level', { ascending: false });
    if (allStats) {
      const sorted = [...allStats].sort((a, b) =>
        ((b.level||0)*100 + Math.floor((b.money||0)/10000)) -
        ((a.level||0)*100 + Math.floor((a.money||0)/10000))
      );
      const idx = sorted.findIndex(x => x.user_id === currentUser.id);
      if (idx >= 0) document.getElementById('rankEl').textContent = '#' + (idx + 1);
    }

    // ── Infos liste ──
    document.getElementById('infoSince').textContent    = formatDate(p.created_at);
    document.getElementById('infoPlaytime').textContent = formatPlaytime(g.playtime_minutes);
    document.getElementById('infoStreak').textContent   = (g.streak_days || 0) + ' JOUR' + ((g.streak_days || 0) > 1 ? 'S' : '');

    // ── Bio ──
    const bioEl = document.getElementById('bioEl');
    if (p.bio) { bioEl.textContent = p.bio; bioEl.className = 'bio-text'; }

  } catch(e) {
    console.error('profil init error:', e);
    showError();
  }
}

function showError() {
  document.querySelector('.body').innerHTML = `
    <div class="error-wrap">
      <div style="font-size:32px;margin-bottom:8px">⚠️</div>
      <div style="font-weight:700;color:#1a1a1a;margin-bottom:4px">Erreur de connexion</div>
      <div>Vérifie ta connexion internet</div>
      <button onclick="location.reload()">Réessayer</button>
    </div>`;
}

init();
</script>
</body>
</html>
