<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mon Profil — Battle Dock</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>

    <style>
        :root {
            --bg-white: #ffffff;
            --surface-light: #f8fafc;
            --border-color: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-green: #bef264;
            --border-radius-xl: 20px;
            --border-radius-lg: 16px;
            --border-radius-md: 12px;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-tap-highlight-color: transparent;
        }
        
        body { 
            background-color: #ffffff; 
            color: var(--text-main);
            font-family: 'Urbanist', sans-serif;
            padding-top: 60px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        
        .app-viewport {
            width: 100%;
            max-width: 480px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* BOUTON RETOUR FIXE */
        .btn-back { 
            position: fixed; 
            top: 0; 
            left: 0; 
            right: 0;
            background: #ffffff; 
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main); 
            padding: 14px 16px; 
            cursor: pointer; 
            font-family: 'Inter', sans-serif; 
            font-size: 14px; 
            font-weight: 700;
            text-align: left;
            z-index: 100;
            border-top: none;
            border-left: none;
            border-right: none;
        }

        /* EN-TÊTE PROFIL */
        .profile-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 12px;
            padding: 20px 0 10px 0;
        }

        .avatar-container {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: var(--border-radius-xl);
            background-color: #f1f5f9;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 18px;
        }

        .profile-hero h1 {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -0.5px;
        }

        .rank-badge {
            background: var(--text-main);
            color: #ffffff;
            font-size: 11px;
            font-weight: 800;
            padding: 4px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* FORMULAIRE / ÉDITION */
        .settings-box {
            background-color: var(--surface-light);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-lg);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .settings-box h3 {
            font-size: 16px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .input-group input {
            width: 100%;
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-md);
            padding: 14px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            color: var(--text-main);
            font-weight: 500;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: var(--text-main);
        }

        /* ACTIONS BUTTONS */
        .btn-save {
            background-color: var(--text-main);
            color: var(--accent-green);
            border: none;
            border-radius: var(--border-radius-md);
            padding: 16px;
            font-family: 'Urbanist', sans-serif;
            font-size: 16px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            margin-top: 10px;
            width: 100%;
        }

        .btn-save:active {
            transform: scale(0.98);
            background-color: #1e293b;
        }

        .btn-logout {
            background: none;
            border: 1px solid #ef4444;
            color: #ef4444;
            border-radius: var(--border-radius-md);
            padding: 14px;
            font-family: 'Urbanist', sans-serif;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
            text-align: center;
            margin-top: auto;
        }

        .btn-logout:active {
            background-color: #fef2f2;
        }

        .status-message {
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

    <button class="btn-back" onclick="window.location.href='game.html'">← RETOUR AU DASHBOARD</button>

    <div class="app-viewport">
        
        <div class="profile-hero">
            <div class="avatar-container">
                <img src="notionists-1779298466584.png" alt="Avatar">
            </div>
            <h1 id="heroUsername">Chargement...</h1>
            <div class="rank-badge" id="heroLevel">Niveau --</div>
        </div>

        <div class="settings-box">
            <h3>Paramètres d'identification</h3>
            
            <div class="input-group">
                <label for="usernameInput">Nom d'opérateur (Pseudo)</label>
                <input type="text" id="usernameInput" placeholder="Entrez votre pseudo">
            </div>

            <div class="input-group">
                <label>Identifiant Réseau (ID unique fixe)</label>
                <input type="text" id="userIdDisplay" readonly style="background-color: #f1f5f9; color: var(--text-muted); cursor: not-allowed;">
            </div>

            <button class="btn-save" onclick="updateProfile()">Enregistrer les modifications</button>
            <div class="status-message" id="statusMsg"></div>
        </div>

        <button class="btn-logout" onclick="logout()">Déconnexion du Terminal</button>

    </div>

    <script>
        const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
        const { createClient } = supabase;
        const supabaseClient = createClient(supabaseUrl, supabaseKey);

        const userId = localStorage.getItem('userId');
        if (!userId) window.location.href = 'index.html';

        // Afficher l'ID directement
        document.getElementById('userIdDisplay').value = userId;

        loadProfileData();

        async function loadProfileData() {
            try {
                // 1. Récupération du pseudo
                let currentUsername = "Opérateur Provisoire";
                
                const { data: profile } = await supabaseClient
                    .from('profiles')
                    .select('username')
                    .eq('user_id', userId)
                    .single();

                if (profile && profile.username) {
                    currentUsername = profile.username;
                } else {
                    const { data: altProgress } = await supabaseClient
                        .from('game_progress')
                        .select('username')
                        .eq('user_id', userId)
                        .single();
                    if (altProgress && altProgress.username) currentUsername = altProgress.username;
                }

                document.getElementById('heroUsername').textContent = currentUsername;
                document.getElementById('usernameInput').value = currentUsername;

                // 2. Récupération du Niveau réel via l'XP
                const { data: progress } = await supabaseClient
                    .from('game_progress')
                    .select('xp')
                    .eq('user_id', userId)
                    .single();

                if (progress) {
                    const level = Math.floor((progress.xp || 0) / 50) + 1;
                    document.getElementById('heroLevel').textContent = `Niveau ${level}`;
                }
            } catch (e) {
                console.error("Erreur de chargement du profil :", e);
            }
        }

        async function updateProfile() {
            const newUsername = document.getElementById('usernameInput').value.trim();
            const statusMsg = document.getElementById('statusMsg');
            
            if (!newUsername) {
                showStatus("Le nom ne peut pas être vide.", "#ef4444");
                return;
            }

            try {
                // Essai de mise à jour sur les deux tables par sécurité
                await supabaseClient.from('profiles').update({ username: newUsername }).eq('user_id', userId);
                await supabaseClient.from('game_progress').update({ username: newUsername }).eq('user_id', userId);
                
                // Sauvegarde en local pour le secours immédiat
                localStorage.setItem('username', newUsername);
                document.getElementById('heroUsername').textContent = newUsername;
                
                showStatus("Profil mis à jour avec succès !", "#10b981");
            } catch (e) {
                console.error(e);
                showStatus("Erreur lors de la sauvegarde.", "#ef4444");
            }
        }

        function showStatus(text, color) {
            const statusMsg = document.getElementById('statusMsg');
            statusMsg.textContent = text;
            statusMsg.style.color = color;
            statusMsg.style.display = 'block';
            setTimeout(() => { statusMsg.style.display = 'none'; }, 3000);
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
