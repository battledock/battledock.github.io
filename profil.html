<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mon Profil — Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#f8f8f8;font-family:'Inter',sans-serif;min-height:100dvh;padding-bottom:40px}

/* COVER */
.cover{height:130px;background:linear-gradient(135deg,#cc1a1a,#0f172a);position:relative}
.cover-edit{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;background:rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.2);border-radius:20px;padding:5px 12px;color:white;font-size:11px;font-weight:700;cursor:pointer;letter-spacing:1px}
.cover-back{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;width:36px;height:36px;border-radius:10px;background:rgba(0,0,0,0.25);border:none;color:white;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}


/* AVATAR */
.av-wrap{position:absolute;bottom:-36px;left:50%;transform:translateX(-50%);width:72px;height:72px;border-radius:50%;border:4px solid white;overflow:hidden;background:#dbeafe;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,0.15)}
.av-wrap img{width:100%;height:100%;object-fit:cover}

/* BODY */
.body{padding:44px 16px 0;text-align:center}
.username-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:4px}
.username{font-weight:900;font-size:22px;color:#0f172a;line-height:1;text-transform:uppercase}
.rank-badge{background:#fbbf24;border-radius:5px;font-family:'Bebas Neue',sans-serif;font-size:12px;color:#0f172a;padding:2px 8px}
.grade{font-size:11px;color:#9ca3af;margin-bottom:4px}
.online{font-size:10px;color:#15803d;font-weight:700;margin-bottom:12px}

/* BIO */
.bio-wrap{background:white;border-radius:12px;padding:12px 14px;margin-bottom:12px;border:1.5px solid #e5e7eb;text-align:left;cursor:pointer}
.bio-label{font-size:8px;font-weight:700;color:#9ca3af;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px}
.bio-text{font-size:13px;color:#374151;line-height:1.5}
.bio-placeholder{font-size:13px;color:#d1d5db;font-style:italic}
.bio-edit-icon{float:right;color:#9ca3af;font-size:14px;margin-top:2px}

/* XP */
.xp-card{background:white;border-radius:12px;padding:12px 14px;margin-bottom:12px;border:1.5px solid #e5e7eb}
.xp-header{display:flex;justify-content:space-between;font-size:10px;font-weight:700;color:#9ca3af;margin-bottom:6px}
.xp-bar{background:#f3f4f6;border-radius:10px;height:7px;overflow:hidden}
.xp-fill{height:100%;border-radius:10px;background:linear-gradient(90deg,#cc1a1a,#fbbf24);transition:width .5s ease}
.xp-next{font-size:9px;color:#9ca3af;margin-top:4px;text-align:right}

/* STATS GRID */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat-card{background:white;border-radius:12px;padding:14px;border:1.5px solid #e5e7eb;text-align:center}
.stat-v{font-family:'Bebas Neue',sans-serif;font-size:28px;line-height:1;color:#0f172a}
.stat-l{font-size:9px;color:#9ca3af;margin-top:3px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}

/* TITLE */
.section-title{font-size:9px;font-weight:700;color:#9ca3af;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;text-align:left}

/* PSEUDO EDITOR */
.edit-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:flex-end;display:none}
.edit-overlay.show{display:flex}
.edit-sheet{background:white;border-radius:20px 20px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom));width:100%;max-width:500px;margin:0 auto}
.edit-title{font-family:'Bebas Neue',sans-serif;font-size:18px;color:#0f172a;letter-spacing:2px;margin-bottom:14px}
.edit-input{width:100%;padding:12px 14px;border:2px solid #e5e7eb;border-radius:10px;font-size:15px;font-weight:700;color:#0f172a;outline:none;font-family:'Inter',sans-serif}
.edit-input:focus{border-color:#cc1a1a}
.edit-input.textarea{height:80px;resize:none}
.edit-btns{display:flex;gap:8px;margin-top:12px}
.btn-save{flex:2;padding:13px;border:none;border-radius:10px;background:#cc1a1a;color:white;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:1px;cursor:pointer}
.btn-cancel{flex:1;padding:13px;border:1.5px solid #e5e7eb;border-radius:10px;background:white;color:#9ca3af;font-weight:700;font-size:13px;cursor:pointer}

/* TOAST */
.toast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#0f172a;color:white;padding:9px 18px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:1px;z-index:300;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>

<!-- COVER -->
<div class="cover">
  <button class="cover-back" onclick="window.location.href='game.html'">←</button>
  <button class="cover-edit" onclick="openCoverPicker()">🎨 FOND</button>
  <div class="av-wrap" id="avWrap" onclick="openAvatarPicker()" style="cursor:pointer">
    <img id="avatarImg" src="avatar-default.png" alt="avatar">
    <div style="position:absolute;inset:0;background:rgba(0,0,0,0.35);border-radius:50%;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s" id="avOverlay"><span style="font-size:20px">✏️</span></div>
  </div>
</div>

<!-- BODY -->
<div class="body">
  <div class="username-row">
    <div class="username" id="usernameEl">...</div>
    <div class="rank-badge" id="rankEl">#—</div>
  </div>
  <div class="grade" id="gradeEl">—</div>
  <div class="online" id="onlineEl">🟢 En ligne</div>

  <!-- BIO -->
  <div class="bio-wrap" onclick="openEditBio()">
    <div class="bio-label">Bio <span class="bio-edit-icon">✏️</span></div>
    <div id="bioEl" class="bio-placeholder">Ajoute une bio...</div>
  </div>

  <!-- XP -->
  <div class="xp-card">
    <div class="xp-header">
      <span id="xpLabel">0 XP</span>
      <span id="xpNext">→ Niv. 2</span>
    </div>
    <div class="xp-bar"><div class="xp-fill" id="xpFill" style="width:0%"></div></div>
  </div>

  <!-- STATS -->
  <div class="section-title">Mes statistiques</div>
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-v" id="statLevel">—</div><div class="stat-l">Niveau</div></div>
    <div class="stat-card"><div class="stat-v" id="statMoney">—</div><div class="stat-l">Argent</div></div>
    <div class="stat-card"><div class="stat-v" id="statTrophies" style="color:#d97706">—</div><div class="stat-l">🏆 Trophées</div></div>
    <div class="stat-card"><div class="stat-v" id="statDiamonds" style="color:#7c3aed">—</div><div class="stat-l">💎 Diamants</div></div>
    <div class="stat-card"><div class="stat-v" id="statPower">—</div><div class="stat-l">⚡ Puissance</div></div>
    <div class="stat-card"><div class="stat-v" id="statStreak">—</div><div class="stat-l">🔥 Jours streak</div></div>
  </div>
</div>



<!-- AVATAR PICKER -->
<div class="edit-overlay" id="avatarOverlay" onclick="if(event.target===this)this.classList.remove('show')">
  <div class="edit-sheet" id="avatarSheet">
    <div class="edit-title">CHOISIR UN AVATAR</div>
    <div style="font-size:10px;color:#9ca3af;margin-bottom:12px">Débloqués selon ton niveau</div>
    <div id="avatarOptions" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px"></div>
    <button class="btn-cancel" style="width:100%;padding:12px" onclick="document.getElementById('avatarOverlay').classList.remove('show')">Fermer</button>
  </div>
</div>

<!-- COVER PICKER -->
<div class="edit-overlay" id="coverOverlay" onclick="closeCoverPicker(event)">
  <div class="edit-sheet" id="coverSheet">
    <div class="edit-title">CHOISIR UN FOND</div>
    <div id="coverOptions" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px"></div>
    <button onclick="window.location.href='boutique.html'" style="width:100%;padding:11px;border:1.5px solid #e5e7eb;border-radius:10px;background:white;color:#cc1a1a;font-weight:700;font-size:13px;cursor:pointer;margin-bottom:8px">🛍️ Plus de covers en boutique</button>
    <button class="btn-cancel" style="width:100%;padding:12px" onclick="document.getElementById('coverOverlay').classList.remove('show')">Annuler</button>
  </div>
</div>

<!-- EDIT OVERLAY (pseudo) -->
<div class="edit-overlay" id="editOverlay" onclick="closeEdit(event)">
  <div class="edit-sheet" id="editSheet">
    <div class="edit-title" id="editTitle">MODIFIER LE PSEUDO</div>
    <input type="text" class="edit-input" id="editInput" maxlength="20" placeholder="Ton pseudo...">
    <div class="edit-btns">
      <button class="btn-save" id="editSave">SAUVEGARDER</button>
      <button class="btn-cancel" onclick="document.getElementById('editOverlay').classList.remove('show')">Annuler</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SB_URL = 'https://drtsuhnbclhmgfjiykap.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
const sb = supabase.createClient(SB_URL, SB_KEY);

let currentUser = null, editMode = null;

function fmt(n){ return n>=1000000?(n/1000000).toFixed(1)+'M€':n>=1000?Math.floor(n/1000)+'k€':n+'€'; }
function avatarForLevel(lvl){
  if(lvl>=50) return 'avatar-level-50.png';
  if(lvl>=30) return 'avatar-level-30.png';
  if(lvl>=20) return 'avatar-level-20.png';
  if(lvl>=17) return 'avatar-level-17.png';
  if(lvl>=15) return 'avatar-level-15.png';
  if(lvl>=13) return 'avatar-level-13.png';
  if(lvl>=10) return 'avatar-level-10.png';
  if(lvl>=5)  return 'avatar-level-5.png';
  if(lvl>=4)  return 'avatar-level-4.png';
  if(lvl>=3)  return 'avatar-level-3.png';
  if(lvl>=2)  return 'avatar-level-2.png';
  return 'avatar-default.png';
}
function xpForLevel(l){ if(l<=10) return l*500; if(l<=25) return l*1000; if(l<=50) return l*2000; return l*4000; }
function powerScore(p){ return (p.level||1)*100 + Math.floor((p.money||0)/10000); }

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2000);
}


// Avatars débloqués selon le niveau
var ALL_AVATARS = [
  {file:'avatar-default.png',   label:'Docker',    minLevel:1},
  {file:'avatar-level-2.png',   label:'Niveau 2',  minLevel:2},
  {file:'avatar-level-3.png',   label:'Niveau 3',  minLevel:3},
  {file:'avatar-level-4.png',   label:'Niveau 4',  minLevel:4},
  {file:'avatar-level-5.png',   label:'Niveau 5',  minLevel:5},
  {file:'avatar-level-10.png',  label:'Niveau 10', minLevel:10},
  {file:'avatar-level-13.png',  label:'Niveau 13', minLevel:13},
  {file:'avatar-level-15.png',  label:'Niveau 15', minLevel:15},
  {file:'avatar-level-17.png',  label:'Niveau 17', minLevel:17},
  {file:'avatar-level-20.png',  label:'Niveau 20', minLevel:20},
  {file:'avatar-level-30.png',  label:'Niveau 30', minLevel:30},
  {file:'avatar-level-50.png',  label:'Niveau 50', minLevel:50},
];

var currentAvatarFile = 'avatar-default.png';
var currentLevel = 1;

function getUnlockedAvatars(level){
  return ALL_AVATARS.filter(function(a){ return a.minLevel <= level; });
}

function openAvatarPicker(){
  var unlocked = getUnlockedAvatars(currentLevel);
  var container = document.getElementById('avatarOptions');
  container.innerHTML = '';
  unlocked.forEach(function(av){
    var div = document.createElement('div');
    var isActive = currentAvatarFile === av.file;
    div.style.cssText = 'text-align:center;cursor:pointer';
    div.innerHTML = '<div style="width:56px;height:56px;border-radius:50%;border:3px solid '+(isActive?'#cc1a1a':'#e5e7eb')+';overflow:hidden;margin:0 auto 4px">'
      +'<img src="'+av.file+'" style="width:100%;height:100%;object-fit:cover">'
      +'</div>'
      +'<div style="font-size:8px;color:#9ca3af;font-weight:700">'+av.label+'</div>';
    div.onclick = function(){ selectAvatar(av.file); };
    container.appendChild(div);
  });
  document.getElementById('avatarOverlay').classList.add('show');
}

async function selectAvatar(file){
  currentAvatarFile = file;
  document.getElementById('avatarImg').src = file;
  document.getElementById('avatarOverlay').classList.remove('show');
  var {error} = await sb.from('profiles').update({avatar_url: file}).eq('user_id', currentUser.id);
  if(error){ showToast('❌ Erreur'); return; }
  showToast('✓ Avatar mis à jour');
}

async function init(){
  // auth géré par getSession
  const {data,error}=await sb.auth.getSession();
  if(error||!data.session){ await sb.auth.signOut().catch(function(){}); window.location.href='index.html'; return; }
  currentUser=data.session.user;

  const [gRes,pRes]=await Promise.all([
    sb.from('game_stats').select('*').eq('user_id',currentUser.id).maybeSingle(),
    sb.from('profiles').select('*').eq('user_id',currentUser.id).maybeSingle()
  ]);
  const g=gRes.data, p=pRes.data;
  if(!g||!p) return;

  // Cover + covers débloquées
  if(p.background_color){ currentCover=p.background_color; applyCover(p.background_color); }
  var rawCovers=p.unlocked_covers;
  var ownedIds=['rouge_navy','bleu_mer'];
  if(rawCovers){
    try{ ownedIds=typeof rawCovers==='string'?JSON.parse(rawCovers):rawCovers; }catch(e){}
  }
  if(ownedIds.indexOf(currentCover)===-1) ownedIds.push(currentCover);
  COVERS=ownedIds.map(function(id){ return {id:id, label:id.replace(/_/g,' ')}; });
  // Avatar depuis le niveau (comme game.html)
  var lvlAvatar = avatarForLevel(g.level||1);
  var specialAvatar = ['avatar-millionaire.png','avatar-completionist.png'];
  var savedAvatar = p.avatar_url;
  var validFiles = getUnlockedAvatars(g.level||1).map(function(a){return a.file;});
  if(savedAvatar && (specialAvatar.indexOf(savedAvatar)!==-1 || validFiles.indexOf(savedAvatar)!==-1)){
    currentAvatarFile = savedAvatar;
    document.getElementById('avatarImg').src = savedAvatar;
  } else {
    currentAvatarFile = lvlAvatar;
    document.getElementById('avatarImg').src = lvlAvatar;
  }

  // Nom + grade + rang
  currentLevel = g.level || 1;
  document.getElementById('usernameEl').textContent=(p.username||'Docker').toUpperCase();
  document.getElementById('gradeEl').textContent=g.grade||'Docker Occasionnel';

  // Bio
  const bioEl=document.getElementById('bioEl');
  if(p.bio){ bioEl.textContent=p.bio; bioEl.className='bio-text'; }

  // Rang depuis classement
  const {data:allStats}=await sb.from('game_stats').select('user_id,level,money').order('level',{ascending:false});
  if(allStats){
    var sorted=[].concat(allStats).sort(function(a,b){ return ((b.level||0)*100+Math.floor((b.money||0)/10000))-((a.level||0)*100+Math.floor((a.money||0)/10000)); });
    var idx=sorted.findIndex(function(x){ return x.user_id===currentUser.id; });
    if(idx>=0) document.getElementById('rankEl').textContent='#'+(idx+1);
  }

  // XP
  const xpNeeded=xpForLevel(g.level||1);
  const xpPct=Math.min(100,Math.round(((g.xp||0)/xpNeeded)*100));
  document.getElementById('xpFill').style.width=xpPct+'%';
  document.getElementById('xpLabel').textContent=(g.xp||0)+' XP';
  document.getElementById('xpNext').textContent='→ Niv. '+((g.level||1)+1);

  // Stats
  document.getElementById('statLevel').textContent=g.level||1;
  document.getElementById('statMoney').textContent=fmt(g.money||0);
  document.getElementById('statTrophies').textContent=g.trophies||0;
  document.getElementById('statDiamonds').textContent=g.diamonds||0;
  document.getElementById('statPower').textContent=powerScore(g);
  document.getElementById('statStreak').textContent=(g.streak_days||0)+'j';
}

// Covers disponibles (à enrichir plus tard)
const COVER_CSS = {
  'rouge_navy':     'linear-gradient(135deg,#cc1a1a,#0f172a)',
  'bleu_mer':       'linear-gradient(160deg,#0c4a6e,#0369a1,#0ea5e9)',
  'noir':           'linear-gradient(135deg,#18181b,#3f3f46)',
  'night':          'linear-gradient(135deg,#0f172a,#334155)',
  'ciment':         'linear-gradient(135deg,#78716c,#a8a29e,#e7e5e4)',
  'carbone':        'linear-gradient(135deg,#1c1917,#292524,#44403c)',
  'gold':           'linear-gradient(135deg,#b45309,#f59e0b)',
  'emerald':        'linear-gradient(135deg,#047857,#10b981)',
  'purple':         'linear-gradient(135deg,#6d28d9,#a855f7)',
  'coral':          'linear-gradient(135deg,#be123c,#fb7185)',
  'or_navy':        'linear-gradient(135deg,#78350f,#fbbf24,#0f172a)',
  'abysses':        'linear-gradient(135deg,#0f2027,#203a43,#2c5364)',
  'turquoise':      'linear-gradient(135deg,#134e4a,#0d9488,#5eead4)',
  'indigo':         'linear-gradient(160deg,#1e1b4b,#4338ca,#818cf8)',
  'marseille_nuit': 'linear-gradient(135deg,#0f172a,#1e3a5f,#0ea5e9)',
  'feu_docker':     'linear-gradient(160deg,#7f1d1d,#dc2626,#fbbf24)',
  'port_tropical':  'linear-gradient(135deg,#064e3b,#065f46,#d97706)',
  'sang_requin':    'linear-gradient(135deg,#450a0a,#991b1b,#cc1a1a)',
  'sunset':         'linear-gradient(135deg,#f59e0b,#ef4444,#7c3aed)',
  'neon_rouge':     'linear-gradient(160deg,#1a1a2e,#16213e,#e94560)',
  'arc_en_ciel':    'conic-gradient(from 180deg at 50% 50%,#cc1a1a,#fbbf24,#10b981,#0ea5e9,#a855f7,#cc1a1a)',
};
function getCoverCss(id){ return COVER_CSS[id] || COVER_CSS['rouge_navy']; }

// Covers chargées dynamiquement depuis unlocked_covers
let COVERS = [];
let currentCover = 'rouge_navy';

function applyCover(id){
  document.querySelector('.cover').style.background = getCoverCss(id);
}

function openCoverPicker(){
  const container = document.getElementById('coverOptions');
  container.innerHTML = '';
  COVERS.forEach(function(c) {
    const el = document.createElement('div');
    el.style.cssText = 'height:60px;border-radius:10px;cursor:pointer;border:3px solid '+(currentCover===c.id?'#fbbf24':'transparent')+';background:'+getCoverCss(c.id)+';display:flex;align-items:flex-end;padding:6px 8px;transition:all .15s';
    el.innerHTML = '<span style="font-size:9px;font-weight:700;color:rgba(255,255,255,0.7);letter-spacing:1px">'+c.label+'</span>';
    el.onclick = function(){ selectCover(c); };
    container.appendChild(el);
  });
  document.getElementById('coverOverlay').classList.add('show');
}

async function selectCover(c){
  currentCover = c.id;
  applyCover(c.id);
  await sb.from('profiles').update({background_color: c.id}).eq('user_id', currentUser.id).then(function(){}).catch(function(){});
  document.getElementById('coverOverlay').classList.remove('show');
  showToast('✓ Fond mis à jour');
}

function closeCoverPicker(e){
  if(e.target===document.getElementById('coverOverlay'))
    document.getElementById('coverOverlay').classList.remove('show');
}

function openEditBio(){
  editMode='bio';
  document.getElementById('editTitle').textContent='MODIFIER LA BIO';
  const inp=document.getElementById('editInput');
  inp.className='edit-input textarea';
  inp.maxLength=120;
  const bioEl=document.getElementById('bioEl');
  inp.value=bioEl.classList.contains('bio-text')?bioEl.textContent:'';
  document.getElementById('editSave').onclick=saveBio;
  document.getElementById('editOverlay').classList.add('show');
  setTimeout(function(){ inp.focus(); }, 100);
}

function closeEdit(e){
  if(e.target===document.getElementById('editOverlay'))
    document.getElementById('editOverlay').classList.remove('show');
}


async function saveBio(){
  const val=document.getElementById('editInput').value.trim();
  const {error}=await sb.from('profiles').update({bio:val}).eq('user_id',currentUser.id);
  if(error){showToast('❌ Erreur');return;}
  const bioEl=document.getElementById('bioEl');
  if(val){ bioEl.textContent=val; bioEl.className='bio-text'; }
  else { bioEl.textContent='Ajoute une bio...'; bioEl.className='bio-placeholder'; }
  document.getElementById('editOverlay').classList.remove('show');
  showToast('✓ Bio mise à jour');
}


init();
</script>
</body>
</html>
