<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Battle Dock — Fiche Opérateur</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Space+Grotesk:wght@500;700;900&family=Bungee&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>

  <style>
    :root {
      --port-dark: #0f172a;
      --port-blue: #2563eb;
      --comic-yellow: #facc15;
      --comic-red: #ef4444;
      --comic-green: #22c55e;
      --border-thick: 4px solid #000000;
      --shadow-comic: 8px 8px 0px #000000;
      --shadow-comic-sm: 4px 4px 0px #000000;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      -webkit-tap-highlight-color: transparent; 
    }

    body { 
      font-family: 'Space Grotesk', sans-serif; 
      background: var(--comic-yellow); 
      padding: 70px 16px 24px 16px; 
      display: flex; 
      justify-content: center; 
      min-height: 100vh; 
    }
    
    .app-viewport { 
      width: 100%; 
      max-width: 440px; 
      background: #ffffff;
      border: var(--border-thick);
      border-radius: 24px;
      box-shadow: var(--shadow-comic);
      padding: 24px; 
      display: flex; 
      flex-direction: column; 
      gap: 20px; 
    }

    .btn-back { 
      position: fixed; 
      top: 0; 
      left: 0; 
      right: 0; 
      background: #ffffff; 
      border-bottom: var(--border-thick); 
      color: var(--port-dark); 
      padding: 14px 16px; 
      cursor: pointer; 
      font-family: 'Bungee', sans-serif; 
      font-size: 11px; 
      text-align: left; 
      z-index: 100; 
    }

    /* NOUVEAU DISPOSITIF : BADGE INDUSTRIAL */
    .badge-id-card {
      border: var(--border-thick);
      border-radius: 16px;
      padding: 16px;
      background: #f8fafc;
      box-shadow: var(--shadow-comic-sm);
      display: flex;
      gap: 16px;
      align-items: center;
      position: relative;
    }

    .badge-id-card::before {
      content: "CAPITAINERIE DU PORT";
      position: absolute;
      top: -10px;
      right: 12px;
      background: var(--comic-red);
      color: white;
      font-family: 'Bungee', sans-serif;
      font-size: 8px;
      padding: 2px 6px;
      border: 2px solid #000;
      border-radius: 4px;
    }

    .avatar-container { 
      width: 90px; 
      height: 105px; 
      background: #3A4750; 
      border: var(--border-thick); 
      border-radius: 10px; 
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .avatar-container img { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
    }

    .badge-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .badge-details h1 { 
      font-family: 'Bangers', cursive;
      font-size: 32px; 
      letter-spacing: 1px;
      color: var(--port-dark);
      line-height: 0.9;
    }

    .matricule-text {
      font-family: 'Bungee', sans-serif;
      font-size: 11px;
      color: var(--port-blue);
    }

    .rank-badge { 
      background: var(--port-dark); 
      color: #ffffff; 
      font-family: 'Bungee', sans-serif;
      font-size: 9px; 
      padding: 2px 8px; 
      border-radius: 4px; 
      text-transform: uppercase; 
      width: fit-content;
      margin-top: 4px;
    }

    /* BOÎTE SÉLECTION CORRIGÉE */
    .avatar-selection-box { 
      background-color: #ffffff; 
      border: 2px solid #000; 
      border-radius: 16px; 
      padding: 16px; 
      box-shadow: var(--shadow-comic-sm);
    }

    .avatar-selection-box h3 { 
      font-family: 'Bungee', sans-serif;
      font-size: 11px; 
      color: var(--port-dark); 
      margin-bottom: 12px; 
    }

    .avatar-grid { 
      display: grid; 
      grid-template-columns: repeat(4, 1fr); 
      gap: 12px; 
    }

    .avatar-option { 
      aspect-ratio: 1; 
      border-radius: 10px; 
      background: #f1f5f9; 
      border: 2px solid #000; 
      cursor: pointer; 
      position: relative; 
      overflow: hidden; 
      transition: transform 0.1s;
    }

    .avatar-option img { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
    }

    .avatar-option.selected { 
      border-color: var(--port-dark); 
      background-color: var(--comic-yellow); 
      transform: scale(1.05);
      box-shadow: 0 0 0 2px var(--port-dark);
    }

    .avatar-option.locked { 
      cursor: not-allowed; 
    }

    .avatar-option.locked::after { 
      content: "🔒"; 
      position: absolute; 
      inset: 0; 
      background: rgba(15, 23, 42, 0.7); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 14px; 
    }

    /* NOUVELLE FONCTIONNALITÉ : STATS DU DOCKER */
    .stats-panel {
      border: 2px solid #000;
      border-radius: 16px;
      padding: 16px;
      background: #f8fafc;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      box-shadow: var(--shadow-comic-sm);
    }

    .mini-stat h4 {
      font-family: 'Bungee', sans-serif;
      font-size: 9px;
      color: #64748b;
    }

    .mini-stat p {
      font-family: 'Bangers', cursive;
      font-size: 24px;
      color: #000;
    }

    /* NOUVELLE FONCTIONNALITÉ : BADGES DE MÉRITE */
    .badges-section {
      border: 2px solid #000;
      border-radius: 16px;
      padding: 16px;
      background: #ffffff;
      box-shadow: var(--shadow-comic-sm);
    }

    .badges-section h3 {
      font-family: 'Bungee', sans-serif;
      font-size: 11px;
      margin-bottom: 10px;
    }

    .badges-row {
      display: flex;
      gap: 12px;
    }

    .merit-badge {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      border: 2px solid #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      background: #e2e8f0;
      filter: grayscale(1);
      position: relative;
      opacity: 0.4;
    }

    .merit-badge.unlocked {
      filter: grayscale(0);
      opacity: 1;
      background: var(--comic-yellow);
    }

    .merit-badge.unlocked:nth-child(2) { background: var(--comic-green); }
    .merit-badge.unlocked:nth-child(3) { background: var(--comic-red); color: white; }

    /* UTILITAIRES */
    .btn-utility { 
      background-color: #f1f5f9; 
      color: #000; 
      border: 2px solid #000; 
      border-radius: 8px; 
      padding: 10px; 
      font-family: 'Bungee', sans-serif;
      font-size: 10px; 
      cursor: pointer; 
      width: 100%; 
    }

    .btn-logout { 
      background: none; 
      border: 2px solid var(--comic-red); 
      color: var(--comic-red); 
      border-radius: 10px; 
      padding: 12px; 
      font-family: 'Bungee', sans-serif;
      font-size: 11px; 
      cursor: pointer; 
      width: 100%; 
      text-align: center; 
      margin-top: 10px;
    }

    .status-message { 
      font-family: 'Bungee', sans-serif; 
      font-size: 10px; 
      text-align: center; 
      display: none; 
    }
  </style>
</head>
<body>

  <button class="btn-back" onclick="window.location.href='game.html'">← RETOUR AU QUAI</button>

  <div class="app-viewport">
    
    <div class="badge-id-card">
      <div class="avatar-container" id="profileAvatarFrame">
        <img id="currentAvatarDisplay" src="notionists-1779298466584.png" alt="Avatar">
      </div>
      <div class="badge-details">
        <h1 id="heroUsername">RECRUE</h1>
        <div class="matricule-text" id="matriculeDisplay">MATRICULE : EN COURS...</div>
        <div class="rank-badge" id="heroLevel">NIVEAU --</div>
      </div>
    </div>

    <button class="btn-utility" onclick="generateMatricule()">⚙️ GÉNÉRER UN CODE MATRICULE UNIQUE</button>

    <div class="avatar-selection-box">
      <h3>SÉLECTIONNER UNE APPARENCE</h3>
      <div class="avatar-grid">
        <div class="avatar-option" id="av1" onclick="selectAvatar('notionists-1779298466584.png', 'av1', 1)">
          <img src="notionists-1779298466584.png" alt="Avatar Base">
        </div>
        <div class="avatar-option locked" id="av2" onclick="selectAvatar('notionists-1779469032385.png', 'av2', 2)">
          <img src="notionists-1779469032385.png" alt="Avatar Pro">
        </div>
      </div>
    </div>

    <div class="stats-panel">
      <div class="mini-stat">
        <h4>📦 CARGOS VIDÉS</h4>
        <p id="statCrates">0</p>
      </div>
      <div class="mini-stat">
        <h4>📈 EFFICACITÉ</h4>
        <p id="statEff">100%</p>
      </div>
    </div>

    <div class="badges-section">
      <h3>DISTINCTIONS OBTENUES</h3>
      <div class="badges-row">
        <div class="merit-badge" id="badgeMerit1" title="Niveau 1 atteint">⚓</div>
        <div class="merit-badge" id="badgeMerit2" title="Niveau 3 atteint">💪</div>
        <div class="merit-badge" id="badgeMerit3" title="Niveau 5 atteint">👑</div>
      </div>
    </div>

    <div class="status-message" id="statusMsg"></div>

    <button class="btn-logout" onclick="logout()">RÉSILIATION DU CONTRAT (DÉCONNEXION)</button>
  </div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const supabaseClient = createClient(supabaseUrl, supabaseKey);

    const userId = localStorage.getItem('userId');
    if (!userId) window.location.href = 'index.html';

    let currentLevel = 1;

    // Chargement instantané mémoire cache locale (LocalStorage)
    const savedAvatar = localStorage.getItem('selectedAvatar') || 'notionists-1779298466584.png';
    document.getElementById('currentAvatarDisplay').src = savedAvatar;

    const cachedColor = localStorage.getItem('avatarBgColor');
    if (cachedColor) document.getElementById('profileAvatarFrame').style.backgroundColor = cachedColor;

    const cachedName = localStorage.getItem('username');
    if (cachedName) document.getElementById('heroUsername').textContent = cachedName.toUpperCase();

    const cachedMatricule = localStorage.getItem('userMatricule') || 'DK-9042-PX';
    document.getElementById('matriculeDisplay').textContent = `MATRICULE : ${cachedMatricule}`;

    // Lancement de la synchronisation Supabase
    loadProfileData();

    async function loadProfileData() {
      try {
        // 1. Charger Infos de base et apparence depuis Profiles
        const { data: profile } = await supabaseClient
          .from('profiles')
          .select('username, avatar_color, avatar')
          .eq('user_id', userId)
          .single();
          
        if (profile) {
          if (profile.username) {
            document.getElementById('heroUsername').textContent = profile.username.toUpperCase();
            localStorage.setItem('username', profile.username);
          }
          if (profile.avatar_color) {
            document.getElementById('profileAvatarFrame').style.backgroundColor = profile.avatar_color;
            localStorage.setItem('avatarBgColor', profile.avatar_color);
          }
          if (profile.avatar) {
            document.getElementById('currentAvatarDisplay').src = profile.avatar;
            localStorage.setItem('selectedAvatar', profile.avatar);
          }
        }

        // 2. Charger XP et progression
        const { data: progress } = await supabaseClient
          .from('game_progress')
          .select('xp')
          .eq('user_id', userId)
          .single();

        if (progress) {
          const xp = progress.xp || 0;
          currentLevel = Math.floor(xp / 50) + 1;
          document.getElementById('heroLevel').textContent = `NIVEAU ${currentLevel}`;
          
          // Fonctionnalités bonus basées sur les stats
          document.getElementById('statCrates').textContent = Math.floor(xp / 8);
          document.getElementById('statEff').textContent = Math.min(100, 70 + currentLevel * 5) + "%";

          // Gestion dynamique des verrous d'avatar selon niveau
          if (currentLevel >= 2) {
            document.getElementById('av2').classList.remove('locked');
          }

          // Gestion dynamique des badges de mérite
          if (currentLevel >= 1) document.getElementById('badgeMerit1').classList.add('unlocked');
          if (currentLevel >= 3) document.getElementById('badgeMerit2').classList.add('unlocked');
          if (currentLevel >= 5) document.getElementById('badgeMerit3').classList.add('unlocked');
        }
        
        // CORRECTION UNIQUE : Cocher visuellement la bonne vignette active
        const activeAvatar = localStorage.getItem('selectedAvatar') || 'notionists-1779298466584.png';
        document.querySelectorAll('.avatar-option').forEach(el => el.classList.remove('selected'));
        if (activeAvatar.includes('notionists-1779469032385.png')) {
          document.getElementById('av2').classList.add('selected');
        } else {
          document.getElementById('av1').classList.add('selected');
        }

      } catch (e) { 
        console.error("Erreur de rafraîchissement profil :", e); 
      }
    }

    // CORRECTION DU SOUCI DE SÉLECTION : Écrit directement et proprement dans Supabase
    async function selectAvatar(imgSrc, elementId, requiredLevel) {
      if (currentLevel < requiredLevel) {
        showStatus(`BLOQUÉ : ACCÈS REQUIS NIVEAU ${requiredLevel} !`, "var(--comic-red)");
        return;
      }

      try {
        // Envoi immédiat à Supabase
        const { error } = await supabaseClient
          .from('profiles')
          .update({ avatar: imgSrc })
          .eq('user_id', userId);

        if (error) throw error;

        // Si succès, mise à jour de l'interface et du cache local
        localStorage.setItem('selectedAvatar', imgSrc);
        document.getElementById('currentAvatarDisplay').src = imgSrc;
        
        document.querySelectorAll('.avatar-option').forEach(el => el.classList.remove('selected'));
        document.getElementById(elementId).classList.add('selected');
        
        showStatus("APPARENCE ENREGISTRÉE AU PORT ✅", "var(--comic-green)");
      } catch (err) {
        showStatus("ERREUR DE SAUVEGARDE DE L'APPARENCE.", "var(--comic-red)");
      }
    }

    function generateMatricule() {
      const rand = Math.floor(1000 + Math.random() * 9000);
      const letters = ["PX", "DX", "ZK", "HQ", "LT"];
      const selectedLetters = letters[Math.floor(Math.random() * letters.length)];
      const code = `DK-${rand}-${selectedLetters}`;
      
      localStorage.setItem('userMatricule', code);
      document.getElementById('matriculeDisplay').textContent = `MATRICULE : ${code}`;
      showStatus("NOUVEAU MATRICULE SCELLÉ !", "var(--port-blue)");
    }

    function showStatus(text, color) {
      const msg = document.getElementById('statusMsg');
      msg.textContent = text; 
      msg.style.color = color; 
      msg.style.display = 'block';
      setTimeout(() => { msg.style.display = 'none'; }, 2500);
    }

    function logout() { 
      localStorage.clear(); 
      window.location.href = 'index.html'; 
    }
  </script>
</body>
</html>
