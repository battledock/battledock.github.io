<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',sans-serif;background:#0a1020;color:#fff}

.scene-wrap{display:flex;flex-direction:column;height:100%;height:100dvh;overflow:hidden}
.scene-bg{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;transition:opacity .5s}
.scene-bg svg{width:100%;height:100%;display:block}
.char-zone{flex:1;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;position:relative;z-index:1;padding-bottom:10px;transition:opacity .3s}
.char-svg{width:160px;height:240px;flex-shrink:0}
.char-enter{animation:charEnter .5s cubic-bezier(.34,1.3,.64,1) forwards}
@keyframes charEnter{from{opacity:0;transform:translateY(40px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.char-dance{animation:dance .6s ease infinite}
@keyframes dance{0%{transform:translateY(0) rotate(0)}15%{transform:translateY(-15px) rotate(-5deg)}30%{transform:translateY(0) rotate(5deg)}45%{transform:translateY(-10px) rotate(-3deg) scaleX(-1)}60%{transform:translateY(0) rotate(3deg) scaleX(-1)}75%{transform:translateY(-12px) rotate(-4deg)}100%{transform:translateY(0) rotate(0)}}

.dialogue-box{
  position:relative;z-index:10;flex-shrink:0;
  background:rgba(8,12,20,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid rgba(255,255,255,.07);
  padding:14px 16px calc(env(safe-area-inset-bottom,0px)+14px);
  display:flex;flex-direction:column;gap:8px;
  min-height:200px;
}
.char-name{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:2px;color:#818cf8}
.dialogue-text{font-size:14.5px;color:rgba(255,255,255,.88);line-height:1.65;min-height:50px}
.dialogue-text.narratif{font-size:13px;color:rgba(255,255,255,.45);font-style:italic}

.btn-next{
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:12px;
  padding:13px;width:100%;font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:2px;
  color:rgba(255,255,255,.6);cursor:pointer;text-align:center;transition:all .15s;
}
.btn-next:active{background:rgba(255,255,255,.14);transform:scale(.97)}
.btn-next.gold{background:rgba(129,140,248,.15);border-color:rgba(129,140,248,.3);color:#818cf8}

.choices{display:flex;flex-direction:column;gap:6px}
.choice-btn{
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;
  padding:12px 14px;font-size:13px;color:rgba(255,255,255,.8);cursor:pointer;text-align:left;
  display:flex;align-items:center;gap:10px;transition:all .12s;
}
.choice-btn:active{background:rgba(129,140,248,.15);transform:scale(.98)}
.choice-btn.selected{background:rgba(129,140,248,.2);border-color:rgba(129,140,248,.4)}
.choice-icon{font-size:16px;flex-shrink:0}

.survey-q{font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:2px;color:rgba(129,140,248,.5);margin-bottom:4px}
.survey-textarea{width:100%;height:80px;background:rgba(255,255,255,.06);border:1.5px solid rgba(129,140,248,.2);border-radius:12px;padding:10px 12px;color:#fff;font-family:'Inter',sans-serif;font-size:12px;resize:none;outline:none;-webkit-user-select:text;user-select:text}
.survey-textarea::placeholder{color:rgba(255,255,255,.2)}
.survey-textarea:focus{border-color:rgba(129,140,248,.4)}

.badge-wrap{
  background:rgba(129,140,248,.07);border:1px solid rgba(129,140,248,.2);border-radius:14px;
  padding:16px;text-align:center;animation:popIn .5s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popIn{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.badge-icon{font-size:42px;margin-bottom:6px}
.badge-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;color:#818cf8}
.badge-desc{font-size:11px;color:rgba(255,255,255,.35);margin-top:4px;line-height:1.5}
.badge-stamp{
  display:inline-flex;flex-direction:column;align-items:center;gap:3px;
  width:130px;height:85px;justify-content:center;
  background:rgba(255,255,255,.05);border:2.5px solid rgba(129,140,248,.4);border-radius:10px;
  animation:stampIn .4s cubic-bezier(.34,1.56,.64,1);margin-bottom:10px;transform:rotate(-3deg);
}
@keyframes stampIn{from{transform:scale(0) rotate(-30deg);opacity:0}to{transform:scale(1) rotate(-3deg);opacity:1}}
.badge-stamp-label{font-size:8px;color:rgba(129,140,248,.5);font-weight:700;letter-spacing:2px}
.badge-stamp-num{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;color:#818cf8}
.badge-stamp-sub{font-size:7px;color:rgba(255,255,255,.25);letter-spacing:1px}

.progress-dots{display:flex;justify-content:center;gap:5px;margin-bottom:6px}
.dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.12);transition:all .3s}
.dot.active{background:#818cf8;width:20px;border-radius:3px}
.dot.done{background:rgba(129,140,248,.35)}

.confetti{position:fixed;top:-10px;z-index:15;pointer-events:none;font-size:20px;animation:confettiFall linear forwards}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}

.stars{display:flex;gap:6px;justify-content:center;margin:8px 0}
.star{font-size:32px;cursor:pointer;transition:transform .15s;opacity:.3}
.star:active{transform:scale(1.3)}
.star.on{opacity:1;animation:starPop .3s ease}
@keyframes starPop{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);border:1px solid rgba(255,255,255,.1);color:white;padding:10px 18px;border-radius:20px;font-size:13px;font-weight:600;z-index:100;opacity:0;transition:opacity .3s;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>

<rect x="24" y="-120" width="14" height="44" rx="5" fill="#8B6B4A" transform="rotate(10,24,-120)"/>
<rect x="26" y="-82" width="18" height="12" rx="3" fill="#f5f5f5" transform="rotate(10,35,-76)"/>
<text x="0" y="-100" text-anchor="middle" font-size="7" font-weight="900" fill="rgba(255,255,255,.5)" font-family="Inter" letter-spacing="1">DOUDOU</text>
</g>
</svg>`;

// ════════════════════════════════════
// STORY + SURVEY STEPS
// ════════════════════════════════════
const STEPS=[
  {char:'DOUDOU',text:"Wesh ! C'est Doudou. Le syndicat m'a dit 'va faire un sondage'. J'ai dit 'c'est quoi un sondage ?'. Ils m'ont filé un clipboard. Alors on y va.",bg:'office'},

  {char:null,text:"Doudou s'installe au bureau du syndicat. Il renverse son café, ramasse les papiers, et sort un stylo mâchouillé de sa poche.",narratif:true,bg:'office'},

  {char:'DOUDOU',text:"Bon. Première question. Comment t'as débarqué sur le port ? Raconte-moi ta life.",bg:'port',
   survey:'decouverte',
   choices:[
     {icon:'👥',text:"Mon pote m'a dit 'viens c'est bien'",value:'ami'},
     {icon:'📱',text:"J'ai scrollé et j'ai cliqué sans réfléchir",value:'reseaux'},
     {icon:'🎲',text:"Le destin m'a guidé jusqu'ici",value:'hasard'},
     {icon:'🤷',text:"Franchement ? J'ai oublié",value:'oubli'}
   ]},

  {char:'DOUDOU',text:"OK je note... *écrit en tirant la langue*... Bon, on continue.",bg:'office'},

  {char:'DOUDOU',text:"Quand t'es sur le port, tu fais quoi EN PREMIER ? Dis-moi la vérité.",bg:'port',
   survey:'activite_pref',
   choices:[
     {icon:'👆',text:"Je clique comme un malade sur le container",value:'clicker'},
     {icon:'🏗️',text:"Direct la grue, c'est mon terrain",value:'grue'},
     {icon:'🎰',text:"Casino. Toujours le casino.",value:'casino'},
     {icon:'📊',text:"Je check le classement pour voir si je suis premier",value:'classement'}
   ]},

  {char:'DOUDOU',text:"Intéressant... *prend des notes sur sa main parce que le clipboard est tombé par terre*",bg:'office'},

  {char:'DOUDOU',text:"Si tu pouvais ajouter UN truc au port, n'importe quoi, ce serait quoi ?",bg:'sunset',
   survey:'souhait',
   choices:[
     {icon:'⚔️',text:"Pouvoir défier les autres en 1v1",value:'pvp'},
     {icon:'🏠',text:"Mon propre appart' au port avec déco",value:'housing'},
     {icon:'🎮',text:"Plus de mini-jeux délirants",value:'jeux'},
     {icon:'🐟',text:"Aller pêcher sur le Vieux-Port",value:'peche'}
   ]},

  {char:null,text:"Doudou relit ses notes. Il plisse les yeux. Il tourne la feuille dans tous les sens. Il avait écrit à l'envers.",narratif:true,bg:'office'},

  {char:'DOUDOU',text:"Tu joues combien de temps quand tu viens ? Et me mens pas hein.",bg:'port',
   survey:'temps',
   choices:[
     {icon:'⚡',text:"2 minutes aux toilettes",value:'rapide'},
     {icon:'☕',text:"Le temps d'un café, 10-15 min",value:'moyen'},
     {icon:'🍿',text:"30 min tranquille",value:'long'},
     {icon:'💀',text:"Je perds la notion du temps",value:'addict'}
   ]},

  {char:'DOUDOU',text:"Avant-dernière ! Si tu pouvais demander N'IMPORTE QUOI aux devs du port, tu dirais quoi ? Vas-y, lâche-toi.",bg:'sunset',
   survey:'souhait_libre',freetext:true,placeholder:"Écris ton idée ici..."},

  {char:'DOUDOU',text:"Dernière question mon reuf. Sur 5 étoiles, tu mets combien au port ? Sois honnête, j'le dirai pas à Gégé.",bg:'stars',
   survey:'note',stars:true},

  {char:'DOUDOU',text:"C'est bon j'ai tout ! Merci l'ami. Grâce à toi le port va devenir encore mieux. T'es officiellement Sondeur du Port !",bg:'stars',badge:true},
];

let step=0,twInterval=null;

function renderDots(){
  var h='';for(var i=0;i<STEPS.length;i++){
    h+='<div class="dot '+(i<step?'done':i===step?'active':'')+'"></div>';
  }
  document.getElementById('progressDots').innerHTML=h;
}

function showStep(s){
  renderDots();
  document.getElementById('sceneBg').innerHTML=BGS[s.bg]||BG_OFFICE;
  var cz=document.getElementById('charZone');
  if(s.narratif){cz.style.opacity='0';}
  else{cz.style.opacity='1';cz.innerHTML='<div class="char-svg char-enter">'+CHAR_DOUDOU+'</div>';}

  var nameEl=document.getElementById('charName');
  var textEl=document.getElementById('dialogueText');
  var actEl=document.getElementById('actionsZone');

  if(s.char){nameEl.textContent=s.char;nameEl.style.display='block';textEl.className='dialogue-text';}
  else{nameEl.style.display='none';textEl.className='dialogue-text narratif';}

  textEl.textContent='';actEl.innerHTML='';
  if(twInterval)clearInterval(twInterval);
  var full=s.text,ci=0;
  twInterval=setInterval(function(){
    textEl.textContent+=full[ci];ci++;
    if(ci>=full.length){clearInterval(twInterval);twInterval=null;showActions(s);}
  },22);
}

function showActions(s){
  var actEl=document.getElementById('actionsZone');

  if(s.badge){
    spawnConfetti();setTimeout(spawnConfetti,1500);
    var cz=document.getElementById('charZone');
    cz.style.opacity='1';cz.innerHTML='<div class="char-svg char-dance">'+CHAR_DOUDOU+'</div>';
    actEl.innerHTML=`
      <div class="badge-wrap" style="margin-bottom:8px">
        <div class="badge-stamp">
          <div class="badge-stamp-label">PORT DE MARSEILLE</div>
          <div class="badge-stamp-num">SONDEUR</div>
          <div class="badge-stamp-sub">CERTIFIÉ ✓</div>
        </div>
        <div class="badge-icon">📋</div>
        <div class="badge-title">FORMATION SONDAGE OBTENUE</div>
        <div class="badge-desc">+15 000€ · +1 000 XP<br>Ton avis compte !</div>
      </div>
      <button class="btn-next gold" onclick="finish()">RETOUR AU PORT →</button>`;
  }else if(s.stars){
    actEl.innerHTML=`
      <div class="survey-q">QUESTION 7/7</div>
      <div class="stars" id="starsZone">`+
      [1,2,3,4,5].map(n=>'<div class="star" onclick="pickStar('+n+')">⭐</div>').join('')+
      `</div><button class="btn-next" id="starBtn" onclick="submitStar()" style="opacity:.3;pointer-events:none">VALIDER</button>`;
  }else if(s.freetext){
    var qNum=Object.keys(surveyData).length+1;
    actEl.innerHTML='<div class="survey-q">QUESTION '+qNum+'/7</div><textarea class="survey-textarea" id="freetextInput" placeholder="'+(s.placeholder||'Écris ici...')+'"></textarea><button class="btn-next" onclick="submitFreetext(\''+s.survey+'\')" style="margin-top:8px">ENVOYER →</button>';
    setTimeout(function(){document.getElementById('freetextInput').focus();},300);
  }else if(s.choices){
    var qNum=Object.keys(surveyData).length+1;
    var h='<div class="survey-q">QUESTION '+qNum+'/7</div><div class="choices">';
    s.choices.forEach(function(c){
      h+='<div class="choice-btn" onclick="pickSurvey(\''+s.survey+'\',\''+c.value+'\',this)"><span class="choice-icon">'+c.icon+'</span>'+c.text+'</div>';
    });
    h+='</div>';actEl.innerHTML=h;
  }else{
    actEl.innerHTML='<button class="btn-next" onclick="nextStep()">SUITE →</button>';
  }
}

var _starVal=0;
window.pickStar=function(n){
  _starVal=n;
  var stars=document.querySelectorAll('.star');
  stars.forEach(function(s,i){s.className=i<n?'star on':'star';});
  var btn=document.getElementById('starBtn');
  btn.style.opacity='1';btn.style.pointerEvents='auto';
};
window.submitStar=function(){
  if(!_starVal)return;
  surveyData.note=_starVal;
  nextStep();
};

window.submitFreetext=function(key){
  var val=(document.getElementById('freetextInput').value||'').trim();
  if(!val){showToast('Écris quelque chose !');return;}
  surveyData[key]=val;
  nextStep();
};

window.pickSurvey=function(key,value,el){
  surveyData[key]=value;
  // Visual feedback
  el.classList.add('selected');
  var siblings=el.parentElement.children;
  for(var i=0;i<siblings.length;i++){if(siblings[i]!==el)siblings[i].style.opacity='.3';siblings[i].style.pointerEvents='none';}
  setTimeout(nextStep,600);
};

function nextStep(){step++;if(step>=STEPS.length)return;showStep(STEPS[step]);}

async function finish(){
  try{
    var gs=await sb.from('game_stats').select('money,xp,records').eq('user_id',currentUser.id).maybeSingle();
    if(gs.data){
      var rec=gs.data.records||{};
      rec.formations=rec.formations||{};
      rec.formations.sondage=true;
      rec.survey=surveyData;
      await sb.from('game_stats').update({
        money:(gs.data.money||0)+15000,
        xp:(gs.data.xp||0)+1000,
        records:rec
      }).eq('user_id',currentUser.id);
    }
  }catch(e){}
  window.location.href='game.html';
}

function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800);}

async function init(){
  try{
    var s=await sb.auth.getSession();
    if(!s.data||!s.data.session){location.href='index.html';return;}
    currentUser=s.data.session.user;
    var gs=await sb.from('game_stats').select('records').eq('user_id',currentUser.id).maybeSingle();
    if(gs.data){
      var f=(gs.data.records&&gs.data.records.formations)||{};
      if(f.sondage){location.href='game.html';return;}
    }
  }catch(e){}
  showStep(STEPS[0]);
}
init();
</script>
