<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Commerce — Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bangers&family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
html,body{height:100%;height:100dvh;background:#f5f0e8;font-family:'Inter',sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.ico{font-size:80px;margin-bottom:16px;animation:shake 3s ease-in-out infinite}
@keyframes shake{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(-8deg)}96%{transform:rotate(8deg)}}
.title{font-family:'Bebas Neue',sans-serif;font-size:36px;color:#1a1a1a;letter-spacing:3px;line-height:1;margin-bottom:8px}
.badge{display:inline-block;background:#cc1a1a;border:3px solid #1a1a1a;border-radius:4px;box-shadow:3px 3px 0 #1a1a1a;padding:5px 14px;font-family:'Bangers',cursive;font-size:16px;color:#fbbf24;letter-spacing:2px;margin-bottom:16px}
.sub{font-size:13px;color:#888;line-height:1.6;max-width:260px;margin-bottom:28px}
.back-btn{background:#1a1a1a;border:3px solid #1a1a1a;border-radius:8px;box-shadow:4px 4px 0 rgba(0,0,0,.3);padding:14px 32px;font-family:'Bebas Neue',sans-serif;font-size:18px;color:#fbbf24;letter-spacing:2px;cursor:pointer;text-decoration:none;display:inline-block}
/* Trame -->
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,rgba(0,0,0,.05) 1px,transparent 1px);background-size:6px 6px;pointer-events:none}
/* Bandes haut/bas */
body::after{content:'';position:fixed;top:0;left:0;right:0;height:8px;background:repeating-linear-gradient(90deg,#cc1a1a 0,#cc1a1a 20px,#fbbf24 20px,#fbbf24 40px)}
.band-bot{position:fixed;bottom:0;left:0;right:0;height:8px;background:repeating-linear-gradient(90deg,#cc1a1a 0,#cc1a1a 20px,#fbbf24 20px,#fbbf24 40px)}
</style>
</head>
<body>
<div class="band-bot"></div>
<div class="ico">🔧</div>
<div class="title">COMMERCE<br>EN MAINTENANCE</div>
<div class="badge">🚧 TRAVAUX EN COURS 🚧</div>
<div class="sub">Le patron rénove tout.<br>Revenez plus tard,<br>ça va être beau !</div>
<a class="back-btn" href="game.html">⬅ RETOUR AU PORT</a>
</body>
</html>
