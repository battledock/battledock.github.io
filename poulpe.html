<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Poulpe Mystère — Battle Dock Casino</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{height:100%;height:100dvh;overflow:hidden;font-family:'Inter',sans-serif}
body{background:radial-gradient(ellipse at top,#0c1a3a,#060e1f 60%,#020509);display:flex;flex-direction:column}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,44px)+12px) 16px 12px;flex-shrink:0;background:rgba(0,0,0,.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.btn-back{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:7px 14px;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;color:#fff;cursor:pointer}
.hdr-title{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#fbbf24;letter-spacing:3px}
.hdr-bal{background:rgba(0,0,0,.3);border:1px solid rgba(251,191,36,.3);border-radius:20px;padding:7px 14px;font-family:'Bebas Neue',sans-serif;font-size:15px;color:#fbbf24}
.game{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 16px;gap:14px;min-height:0}
.chips{display:flex;gap:6px;width:100%;max-width:420px}
.chip{flex:1;padding:10px 4px;border-radius:20px;text-align:center;cursor:pointer;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;border:1.5px solid rgba(255,255,255,.1);color:rgba(255,255,255,.4);background:rgba(255,255,255,.06);transition:all .15s}
.chip.sel{background:rgba(251,191,36,.2);border-color:#fbbf24;color:#fbbf24}
.chip:active{transform:scale(.96)}
.spin-btn{width:100%;max-width:420px;padding:16px;border:none;border-radius:16px;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a0000;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px;cursor:pointer;box-shadow:0 6px 24px rgba(251,191,36,.35);transition:all .15s;font-weight:900}
.spin-btn:active{transform:scale(.98);opacity:.9}
.spin-btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.result{display:none;padding:13px 16px;border-radius:16px;text-align:center;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;width:100%;max-width:420px;animation:pop .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
.result.win{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;box-shadow:0 4px 16px rgba(22,163,74,.4)}
.result.lose{background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.6)}
.result.jackpot{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a0000;box-shadow:0 4px 16px rgba(251,191,36,.5)}

.poulpe-table{background:linear-gradient(135deg,#0a1628,#0f1f3d);border:3px solid rgba(96,165,250,.3);border-radius:24px;width:100%;max-width:420px;padding:18px 14px;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.poulpe-ico{font-size:64px;text-align:center;margin-bottom:8px;filter:drop-shadow(0 0 16px rgba(96,165,250,.4));transition:all .3s}
.poulpe-ico.scary{animation:poulpeShake .3s ease}
@keyframes poulpeShake{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
.tents{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.tent{aspect-ratio:1;border-radius:14px;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;transition:all .15s}
.tent:active{transform:scale(.93)}
.tent.disabled{pointer-events:none;opacity:.4}
.tent.win{background:rgba(74,222,128,.15);border-color:#4ade80;animation:pop .3s cubic-bezier(.34,1.56,.64,1)}
.tent.lose{background:rgba(220,38,38,.15);border-color:#dc2626}
.poulpe-sub{font-size:9px;font-weight:800;color:rgba(255,255,255,.25);letter-spacing:2px;text-align:center}
</style>
</head>
<body>
<div class="hdr">
  <button class="btn-back" onclick="location.href='casino.html'">← CASINO</button>
  <div class="hdr-title">🐙 POULPE MYSTÈRE</div>
  <div class="hdr-bal" id="balance">0€</div>
</div>
<div class="game">
  <div class="poulpe-table">
    <div class="poulpe-ico" id="poulpeEl">🐙</div>
    <div class="tents" id="tentsGrid">
      <div class="tent" id="t0" onclick="pick(0)">🎣</div>
      <div class="tent" id="t1" onclick="pick(1)">🎣</div>
      <div class="tent" id="t2" onclick="pick(2)">🎣</div>
      <div class="tent" id="t3" onclick="pick(3)">🎣</div>
      <div class="tent" id="t4" onclick="pick(4)">🎣</div>
      <div class="tent" id="t5" onclick="pick(5)">🎣</div>
      <div class="tent" id="t6" onclick="pick(6)">🎣</div>
      <div class="tent" id="t7" onclick="pick(7)">🎣</div>
    </div>
    <div class="poulpe-sub">Choisissez une case · 1/8 de gagner × 3.5</div>
  </div>
  <div class="result" id="result"></div>
  <div class="chips">
    <div class="chip sel" id="c1000" onclick="setBet(1000,'c1000')">1K</div>
    <div class="chip" id="c5000" onclick="setBet(5000,'c5000')">5K</div>
    <div class="chip" id="c10000" onclick="setBet(10000,'c10000')">10K</div>
    <div class="chip" id="c50000" onclick="setBet(50000,'c50000')">50K</div>
  </div>
<button class="spin-btn" id="btnPlay" onclick="play()">NOUVELLE PARTIE — <span id="betLabel">1 000€</span></button>
</div>
<script>

  const supabaseUrl='https://drtsuhnbclhmgfjiykap.supabase.co';
  const supabaseKey='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
  const {createClient}=supabase;
  const sb=createClient(supabaseUrl,supabaseKey);

  const fmt=n=>Math.floor(n).toLocaleString('fr-FR');
  const $=id=>document.getElementById(id);

  let money=parseInt(localStorage.getItem("bd_money")||"0"),bet=1000,currentUser=null,busy=false;

  // 8 tentacules : contenu caché
  // 2 bonnes (×3, ×5), 1 jackpot (×10), 5 mauvaises (💀)
  // RTP = (2/8)*3*bet + (1/8)*5*bet + (1/8)*10*bet = (6+5+10)/8 = 21/8 = 2.625×
  // → 2.625/1 = 262% → trop élevé ?
  // Non : on perd la mise sur les 5 mauvaises
  // E[gain] = (2/8)*3 + (1/8)*5 + (1/8)*10 + (4/8)*0 = (6+5+10)/8 = 2.625
  // RTP = 2.625*100 = 262%... 
  // Il faut revoir : 1 bonne (×3), 1 bonne (×5), 6 mauvaises
  // E = (1/8)*3 + (1/8)*5 = 8/8 = 1.0 = 100% → parfait
  // Pour house edge : 1 ×3, 1 ×4, 6 mauvaises → E = (3+4)/8 = 0.875 = 87.5% RTP
  // Ou : 1 ×2, 1 ×4, 1 ×8, 5 mauvaises → E = (2+4+8)/8 = 1.75 = 175% trop haut
  // Simpler: 2 ×2, 1 ×3, 5 mauvaises → E = (4+3)/8 = 0.875 = 87.5% RTP ✓

  // 1 tentacule gagnante (×3.5), 7 perdantes — RTP = 3.5/8 = 43.75%
  const PRIZES = [
    {emoji:'🐠', label:'×7',    mult:7},
    {emoji:'💀', label:'PERDU', mult:0},
    {emoji:'💀', label:'PERDU', mult:0},
    {emoji:'💀', label:'PERDU', mult:0},
    {emoji:'💀', label:'PERDU', mult:0},
    {emoji:'💀', label:'PERDU', mult:0},
    {emoji:'💀', label:'PERDU', mult:0},
    {emoji:'💀', label:'PERDU', mult:0},
  ];

  function shuffle(arr){ return [...arr].sort(()=>Math.random()-0.5); }

  function setBet(val,id){
    bet=val;
    ['c1000','c5000','c10000','c25000'].forEach(i=>$(i).classList.toggle('sel',i===id));
    $('betLabel').textContent=fmt(val)+'€';
  }

  function updateBal(){ $('balance').textContent=fmt(money)+'€'; }

  function buildGrid(prizes){
    const grid=$('tentGrid');
    grid.innerHTML='';
    prizes.forEach((p,i)=>{
      const el=document.createElement('div');
      el.className='tent';
      el.textContent='🌊';
      el.onclick=()=>pick(i,prizes);
      grid.appendChild(el);
    });
  }

  async function newGame(){
    if(busy||bet<=0||money<bet) return;
    busy=true;
    money-=bet; updateBal();
    $('btnPlay').disabled=true;
    $('result').style.display='none';
    $('poulpeEl').textContent='🐙';
    $('subLabel').textContent='CHOISIS UNE TENTACULE';

    const shuffled=shuffle(PRIZES);
    buildGrid(shuffled);
    busy=false;
  }

  async function play(){ newGame(); }
async function pick(idx,prizes){
    if(busy) return;
    busy=true;

    // Désactiver toutes
    document.querySelectorAll('.tent').forEach(t=>t.classList.add('disabled'));

    const tentEl=document.querySelectorAll('.tent')[idx];
    tentEl.classList.add('picked');

    // Résultat tiré au moment du clic (pas au shuffle) — anti-pattern
    // RTP ~43% : 1 chance sur 8 de gagner × 3.5
    const rand=Math.random();
    const won = rand < (1/8);
    const mult = won ? 3.5 : 0;

    const el=$('result');
    if(won){
      const gain=Math.floor(bet*mult);
      money+=gain; updateBal();
      tentEl.textContent='🐠';
      tentEl.classList.add('win');
      $('poulpeEl').textContent='🐙';
      el.textContent=`🐠 ×3.5 ! +${fmt(gain)}€`;
      el.className='result win';
    } else {
      tentEl.textContent='💀';
      tentEl.classList.add('lose');
      $('poulpeEl').textContent='😱';
      el.textContent=`💀 LE POULPE T'A EU !`;
      el.className='result lose';
    }
    el.style.display='block';
    $('subLabel').textContent='';

    await saveMoney(money);

    setTimeout(()=>{
      $('btnPlay').disabled=false;
      busy=false;
    },1500);
  }

  async function init(){
    const { data: _authData, error: _authError } = await sb.auth.getSession();
    if (_authError || !_authData.session) {
      await sb.auth.signOut().catch(() => {});
      window.location.href = 'index.html';
      return;
    }
    const session = _authData.session;
    currentUser=session.user;
    const {data}=await sb.from('game_stats').select('money').eq('user_id',currentUser.id).maybeSingle();
    money = data?.money || 0; localStorage.setItem("bd_money", money); updateBal();

    // Afficher grille vide au départ
    const grid=$('tentGrid');
    for(let i=0;i<8;i++){
      const el=document.createElement('div');
      el.className='tent disabled';
      el.textContent='🌊';
      grid.appendChild(el);
    }
  }

  document.addEventListener('gesturestart',e=>e.preventDefault());
  document.addEventListener('gesturechange',e=>e.preventDefault());

  async function saveMoney(amount) {
    const val = Math.floor(amount);
    localStorage.setItem('bd_money', val);
    if (!currentUser) return;
    for (let i = 0; i < 3; i++) {
      const { error } = await sb.from('game_stats').update({ money: val }).eq('user_id', currentUser.id);
      if (!error) return;
      await new Promise(r => setTimeout(r, 400));
    }
    console.warn('saveMoney: échec après 3 tentatives');
  }

  init();

</script>
</body>
</html>
