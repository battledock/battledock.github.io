<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#72a154">
<title>Survivre</title>
<style>
:root{--carte:#fffdf8;--encre:#1f2620;--doux:#8a9083;--pale:#a8ab9e;--filet:#e4e2d6;--vert:#3f7d4a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#2b3a26}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
#cv{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:block;
  image-rendering:pixelated;image-rendering:crisp-edges}
body{overflow:hidden}
#joy{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
#hublot{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top));z-index:4;
  width:108px;height:108px;border-radius:50%;padding:5px;
  background:conic-gradient(#e8c06a,#8a6a2a,#f0cf7d,#7d5f26,#e8c06a,#8a6a2a,#f0cf7d);
  box-shadow:0 6px 18px rgba(0,0,0,.45)}
#hublot .verre{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;
  box-shadow:inset 0 0 0 2px #4a3420;background:#6f9e52}
#hublot canvas{image-rendering:pixelated;width:100%;height:100%;display:block}
#hublot .reflet{position:absolute;inset:0;border-radius:50%;pointer-events:none;background:
  linear-gradient(150deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,.05) 34%,transparent 52%)}
#hublot .creux{position:absolute;inset:0;border-radius:50%;pointer-events:none;
  box-shadow:inset 0 -8px 18px rgba(20,40,15,.4)}
#hublot .attache{position:absolute;left:50%;top:-4px;transform:translateX(-50%);width:14px;height:9px;
  border-radius:3px;background:#c9a24a;box-shadow:0 1px 3px rgba(0,0,0,.45)}

#action{position:fixed;right:14px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:5;
  display:none;flex-direction:column;align-items:center;gap:2px;
  padding:12px 16px;border-radius:16px;border:1px solid #4f3520;
  background:linear-gradient(180deg,#a5764a,#7d5934);
  box-shadow:inset 0 1px 0 rgba(255,225,180,.32),0 3px 0 #3d2a17;
  font:600 12.5px system-ui;color:#2b1d12;letter-spacing:.4px}
#action.on{display:flex}
#action:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,225,180,.2),0 0 0 #3d2a17}
#action small{font:600 8.5px system-ui;letter-spacing:1.2px;color:#5f4223}

#barre{position:fixed;left:0;right:0;bottom:0;z-index:4;display:grid;
  grid-template-columns:repeat(4,1fr);gap:8px;
  padding:10px 9px calc(13px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,#8a6238,#5f4223);border-top:3px solid #3d2a17}
#barre::before{content:"";position:absolute;inset:0;pointer-events:none;background:
  repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 1px,transparent 1px 11px),
  repeating-linear-gradient(0deg,rgba(255,225,180,.06) 0 1px,transparent 1px 7px)}
.latte{position:relative;padding:8px 0 6px;border-radius:4px;
  background:linear-gradient(180deg,#a5764a,#7d5934);border:1px solid #4f3520;
  box-shadow:inset 0 1px 0 rgba(255,225,180,.32),0 2px 0 #3d2a17;
  display:flex;flex-direction:column;align-items:center;gap:1px;transition:transform .08s,box-shadow .08s}
.latte:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,225,180,.2),0 0 0 #3d2a17}
.latte svg{image-rendering:pixelated}
.latte .b{font:600 8.5px system-ui;letter-spacing:.9px;color:#3d2a17}
.clou{position:absolute;top:3px;width:3px;height:3px;border-radius:50%;background:#3d2a17}
.clou.g{left:3px}.clou.d{right:3px}
.pastille{position:absolute;right:-5px;top:-6px;min-width:18px;height:18px;border-radius:9px;
  background:#c94a4a;color:#fff;font:700 9.5px system-ui;display:none;align-items:center;
  justify-content:center;padding:0 4px;border:1px solid #7d2b2b;font-style:normal}
.pastille.on{display:flex}



#porte{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
  background:#0c140c;padding:22px}
#porte.parti{display:none}
.pCarte{width:100%;max-width:320px;background:var(--carte);border-radius:20px;
  padding:22px 20px;box-shadow:0 14px 34px rgba(20,40,15,.3);text-align:center}
.pCarte h1{font:400 30px Georgia,serif;color:var(--encre)}
.pCarte p{font:400 12.5px/1.6 system-ui;color:var(--doux);margin:8px 0 16px}
.pCarte button{width:100%;margin-top:11px;border-radius:13px;padding:14px;
  background:var(--vert);color:#fdfbf4;font:600 14.5px system-ui}
.pCarte button:disabled{opacity:.45}

#pan{position:fixed;inset:0;z-index:20;display:none}

/* ---- la page du sac : une toile ouverte ---- */
#sacPage{position:fixed;inset:0;z-index:22;display:none}
#page2{position:fixed;inset:0;z-index:22;display:none}
#page2.on{display:block}
.ligne{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:12px;
  background:linear-gradient(180deg,#3d2c1e,#31241a);border:1px solid #5c452e;margin-bottom:8px}
.ligne .rang{width:26px;text-align:center;font:400 17px Georgia,serif;color:#c9a24a}
.ligne .rang.or{color:#f0cf7d}.ligne .rang.arg{color:#d8dde2}.ligne .rang.bro{color:#c98a5e}
.ligne .vig{width:34px;height:46px;border-radius:8px;background:#4a7d3f;overflow:hidden;flex:0 0 auto;
  display:flex;align-items:flex-end;justify-content:center}
.ligne .vig canvas{image-rendering:pixelated;display:block}
.ligne .tx{flex:1;min-width:0}
.ligne .tx b{display:block;font:600 12.5px system-ui;color:#f2e6cc;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.ligne .tx span{display:block;font:400 10px system-ui;color:#a89070;margin-top:2px}
.ligne .pts{font:400 16px Georgia,serif;color:#e8c06a}
.ligne.toi{border-color:#c9a24a;box-shadow:0 0 0 2px rgba(201,162,74,.3)}
.recette{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:12px;
  background:linear-gradient(180deg,#3d2c1e,#31241a);border:1px solid #5c452e;margin-bottom:8px}
.recette .tx{flex:1;min-width:0}
.recette .tx b{display:block;font:600 12.5px system-ui;color:#f2e6cc}
.recette .tx span{display:block;font:400 10px/1.4 system-ui;color:#a89070;margin-top:2px}
.cout{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.cout i{font:600 9.5px system-ui;font-style:normal;padding:3px 7px;border-radius:7px;
  background:rgba(0,0,0,.35);color:#a89070;border:1px solid #4f3d29}
.cout i.ok{color:#a9c96a;border-color:#5c7a34}
.recette button{padding:9px 12px;border-radius:10px;background:#241a12;border:1px solid #6b5136;
  font:600 10.5px system-ui;color:#c9a24a}
.recette button:disabled{opacity:.45}
.vide2{text-align:center;font:400 11.5px/1.6 system-ui;color:#a89070;padding:26px 12px}

/* ---- page claire : le classement ---- */
.clair{background:#f7f7f3}
.clair .rabat{background:#fff;border-bottom:1px solid #edece6;box-shadow:none}
.clair .rabat::after{display:none}
.clair .sacX{background:#f2f2ee;border:0;color:#63635c}
.clair .sacT{color:#14170f}
.clair .sacS{color:#a8a89e}
.clair .boucle{display:none}
.clair::before{display:none}
.fiche2{display:flex;gap:12px;padding:11px 12px;border-radius:16px;background:#fff;
  box-shadow:0 2px 8px rgba(30,35,25,.09);position:relative;overflow:hidden;margin-bottom:9px}
.fiche2 .lis{position:absolute;left:0;top:0;bottom:0;width:5px}
.fiche2 .vig{width:48px;height:62px;border-radius:10px;background:#8ec96f;margin-left:4px;
  display:flex;align-items:flex-end;justify-content:center;overflow:hidden;flex:0 0 auto;
  box-shadow:inset 0 1px 3px rgba(20,50,15,.2)}
.fiche2 .vig canvas{image-rendering:pixelated;display:block}
.fiche2 .tx{flex:1;min-width:0}
.fiche2 .nom{font:400 16px Georgia,serif;color:#1b1f19}
.fiche2 .rg{font:600 8.5px system-ui;letter-spacing:1.4px}
.fiche2 .ets{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.fiche2 .et{font:600 9px system-ui;font-style:normal;padding:3px 8px;border-radius:8px;
  background:#f4f3ee;color:#8a8a82;border:1px solid #e7e5dd}
.fiche2 .et.vert{background:#f1f8ef;color:#3f8a4e;border-color:#cde6c8}
.fiche2 .pts{display:block;font:400 21px Georgia,serif;color:#63635c;line-height:1;text-align:right}
.fiche2 .ptsL{display:block;font:600 8px system-ui;letter-spacing:1px;color:#a8a89e;margin-top:3px;text-align:right}
.fiche2.toi{border:2px solid #3f7d4a;box-shadow:0 3px 10px rgba(63,125,74,.18)}
.fiche2.toi .pts{color:#3f7d4a}
.vide3{text-align:center;font:400 11.5px/1.6 system-ui;color:#8a8a82;padding:30px 14px}
#sacPage.on{display:block}
.sacFond{position:absolute;inset:0;background:#33291f;display:flex;flex-direction:column;
  animation:sm .24s cubic-bezier(.2,.85,.3,1)}
@keyframes sm{from{opacity:0;transform:scale(1.02)}}
.sacFond::before{content:"";position:absolute;inset:0;pointer-events:none;background:
  repeating-linear-gradient(38deg,rgba(255,220,170,.035) 0 2px,transparent 2px 7px),
  repeating-linear-gradient(-38deg,rgba(0,0,0,.06) 0 2px,transparent 2px 7px),
  radial-gradient(120% 70% at 50% -10%,rgba(255,214,150,.12),transparent)}
.rabat{position:relative;background:linear-gradient(180deg,#4a3626,#3d2c1e);
  padding:calc(12px + env(safe-area-inset-top)) 14px 13px;border-bottom:2px solid #241a12;
  box-shadow:0 4px 12px rgba(0,0,0,.35);display:flex;align-items:center;gap:11px}
.rabat::after{content:"";position:absolute;left:8px;right:8px;bottom:5px;height:1px;
  background:repeating-linear-gradient(90deg,rgba(214,176,120,.4) 0 5px,transparent 5px 10px)}
.sacX{width:34px;height:34px;border-radius:50%;background:#241a12;border:1px solid #6b5136;
  color:#d6b078;font:600 13px system-ui;display:flex;align-items:center;justify-content:center}
.sacT{font:400 20px Georgia,serif;color:#f2e6cc}
.sacS{font:600 8.5px system-ui;letter-spacing:1.8px;color:#a89070;margin-top:2px}
.sacCh{margin-left:auto;text-align:right}
.sacCh b{display:block;font:400 17px Georgia,serif;color:#e8c06a}
.sacCh i{display:block;font:600 8px system-ui;color:#a89070;font-style:normal}
.boucle{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);width:28px;height:16px;
  border-radius:4px;background:#c9a24a;box-shadow:0 2px 5px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,240,200,.4)}
.lanière{position:relative;margin:16px 14px 10px;height:9px;border-radius:5px;background:#241a12;
  border:1px solid #5c452e;box-shadow:inset 0 2px 4px rgba(0,0,0,.6);overflow:hidden}
.lanière i{display:block;height:100%;background:linear-gradient(180deg,#a9c96a,#6f9440)}
.sacCorps{position:relative;flex:1;padding:4px 14px 0;overflow-y:auto}
.sacTit{font:600 8.5px system-ui;letter-spacing:2px;color:#a89070;margin:10px 0 9px}
.grille{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.kase{position:relative;aspect-ratio:1;border-radius:12px;
  background:linear-gradient(180deg,#241a12,#2f2318);border:1px solid #5c452e;
  box-shadow:inset 0 3px 7px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}
.kase.on{border-color:#6b5136;box-shadow:inset 0 3px 7px rgba(0,0,0,.6),0 0 0 2px rgba(201,162,74,.55)}
.kase.vide{background:rgba(0,0,0,.3);border:1px dashed #4f3d29}
.kase em{position:absolute;right:5px;bottom:3px;font:700 10px ui-monospace,monospace;color:#f2e6cc;font-style:normal}
.kase svg{image-rendering:pixelated}
.fiche{position:relative;margin:12px;padding:11px 12px;border-radius:14px;
  background:linear-gradient(180deg,#4a3626,#3a2a1c);border:1px solid #6b5136;
  box-shadow:0 4px 12px rgba(0,0,0,.4);display:flex;align-items:center;gap:11px}
.fiche .ic{width:42px;height:42px;border-radius:10px;background:#241a12;border:1px solid #6b5136;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.fiche .tx{flex:1;min-width:0}
.fiche .tx b{display:block;font:600 13px system-ui;color:#f2e6cc}
.fiche .tx span{display:block;font:400 10.5px/1.4 system-ui;color:#a89070;margin-top:2px}
.fiche button{padding:9px 12px;border-radius:10px;background:#241a12;border:1px solid #6b5136;
  font:600 10.5px system-ui;color:#c9a24a}
#pan.on{display:block}
.feuille{position:absolute;inset:0;background:linear-gradient(180deg,#96d177,#6f9e52);
  animation:m .26s cubic-bezier(.2,.85,.3,1)}
@keyframes m{from{opacity:0;transform:scale(1.04)}}

/* la scène : le personnage en grand, dans la moitié haute */
.scene{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top));height:48%;
  display:flex;align-items:center;justify-content:center}
.scene canvas{image-rendering:pixelated;display:block}
.deVous{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;
  padding:9px 13px;border-radius:12px;background:rgba(255,253,248,.92);
  font:600 11px system-ui;color:#2f5a38;box-shadow:0 4px 12px rgba(20,40,15,.25)}
.fermerX{position:absolute;top:calc(12px + env(safe-area-inset-top));left:14px;
  width:34px;height:34px;border-radius:50%;background:rgba(255,253,248,.92);
  color:#5f6b58;font:600 13px system-ui;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(20,40,15,.25)}

/* la feuille qui remonte par-dessus */
.tiroir{position:absolute;left:0;right:0;bottom:0;top:46%;background:var(--carte);
  animation:mt .3s cubic-bezier(.2,.85,.3,1);
  border-radius:22px 22px 0 0;box-shadow:0 -8px 24px rgba(20,40,15,.28);
  display:flex;flex-direction:column;overflow:hidden}
@keyframes mt{from{transform:translateY(22px);opacity:.4}}
.poignee{width:36px;height:4px;border-radius:3px;background:#ddd9c9;margin:9px auto 5px}
.ongs{display:flex;gap:5px;overflow-x:auto;padding:2px 12px 10px;
  border-bottom:1px solid var(--filet);scrollbar-width:none}
.ongs::-webkit-scrollbar{display:none}
.ong{flex:0 0 auto;padding:7px 12px;border-radius:10px;background:#f0ede2;
  font:600 11px system-ui;color:var(--doux);white-space:nowrap}
.ong.on{background:var(--encre);color:#fdfbf4}
.corps{flex:1;overflow-y:auto;padding:11px 12px 12px}
.sec{font:600 8.5px system-ui;letter-spacing:1.5px;color:var(--pale);margin:13px 2px 7px}
.sec:first-child{margin-top:0}
.ch{display:flex;flex-wrap:wrap;gap:6px}
.pa{width:30px;height:30px;border-radius:9px;border:2px solid transparent;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 1px 2px rgba(60,60,40,.18)}
.pa.on{border-color:var(--vert);box-shadow:0 0 0 3px rgba(63,125,74,.2)}
.pa.vide{background:#f0ede2;color:var(--pale);font:600 13px system-ui}
.mo{padding:7px 11px;border-radius:10px;background:#f0ede2;font:600 11px system-ui;color:var(--doux)}
.mo.on{background:var(--vert);color:#fdfbf4}
.bas{display:flex;gap:7px;padding:9px 12px calc(11px + env(safe-area-inset-bottom));
  border-top:1px solid var(--filet);background:var(--carte)}
.ok{flex:1;border-radius:14px;padding:14px;background:var(--vert);color:#fdfbf4;font:600 14.5px system-ui}
.annul{border-radius:14px;padding:14px 16px;background:#f0ede2;color:var(--doux);font:600 13px system-ui}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<canvas id="joy" width="132" height="132"></canvas>
<div id="hublot">
  <div class="verre"><canvas id="mini" width="216" height="216"></canvas>
    <span class="reflet"></span><span class="creux"></span></div>
  <span class="attache"></span>
</div>
<button id="action"></button>
<div id="barre">
  <button class="latte" id="b-sac">
    <svg viewBox="0 0 20 18" width="30">
      <rect x="6" y="0" width="8" height="2" fill="#4a3220"/>
      <rect x="5" y="2" width="2" height="3" fill="#4a3220"/><rect x="13" y="2" width="2" height="3" fill="#4a3220"/>
      <rect x="2" y="5" width="16" height="12" fill="#6b4a28"/>
      <rect x="2" y="5" width="16" height="2" fill="#8a6238"/>
      <rect x="2" y="5" width="2" height="12" fill="#8a6238"/>
      <rect x="16" y="7" width="2" height="10" fill="#4f3520"/>
      <rect x="2" y="9" width="16" height="2" fill="#4f3520"/>
      <rect x="8" y="9" width="4" height="4" fill="#c9a24a"/><rect x="8" y="9" width="4" height="1" fill="#e8c06a"/>
    </svg><span class="b">SAC</span>
    <i class="clou g"></i><i class="clou d"></i><em class="pastille" id="sac-nb">0</em></button>

  <button class="latte" id="b-look">
    <svg viewBox="0 0 20 18" width="30">
      <rect x="6" y="1" width="8" height="2" fill="#4a3220"/>
      <rect x="5" y="3" width="10" height="6" fill="#c99a6a"/><rect x="5" y="3" width="10" height="1" fill="#4a3220"/>
      <rect x="7" y="5" width="2" height="2" fill="#3d2a17"/><rect x="11" y="5" width="2" height="2" fill="#3d2a17"/>
      <rect x="8" y="9" width="4" height="2" fill="#a87a52"/>
      <rect x="3" y="11" width="14" height="7" fill="#5f7d52"/><rect x="3" y="11" width="14" height="2" fill="#7a9a66"/>
      <rect x="1" y="12" width="2" height="5" fill="#4a6341"/><rect x="17" y="12" width="2" height="5" fill="#4a6341"/>
    </svg><span class="b">ALLURE</span>
    <i class="clou g"></i><i class="clou d"></i></button>

  <button class="latte" id="b-batir">
    <svg viewBox="0 0 20 18" width="30">
      <rect x="12" y="1" width="6" height="4" fill="#7b8288"/><rect x="12" y="1" width="6" height="1" fill="#a2a9b0"/>
      <rect x="10" y="3" width="3" height="3" fill="#5f666c"/>
      <rect x="3" y="6" width="8" height="3" fill="#8a6238"/><rect x="3" y="6" width="8" height="1" fill="#a5764a"/>
      <rect x="1" y="10" width="18" height="3" fill="#8a6238"/><rect x="1" y="10" width="18" height="1" fill="#a5764a"/>
      <rect x="1" y="14" width="18" height="3" fill="#6b4a28"/><rect x="1" y="14" width="18" height="1" fill="#8a6238"/>
    </svg><span class="b">BÂTIR</span>
    <i class="clou g"></i><i class="clou d"></i></button>

  <button class="latte" id="b-class">
    <svg viewBox="0 0 20 18" width="30">
      <rect x="3" y="3" width="14" height="12" fill="#4a3420"/><rect x="4" y="4" width="12" height="10" fill="#c9b48a"/>
      <rect x="6" y="6" width="8" height="1" fill="#6b5334"/><rect x="6" y="9" width="8" height="1" fill="#6b5334"/>
      <rect x="6" y="12" width="5" height="1" fill="#6b5334"/>
    </svg><span class="b">CLASSEMENT</span>
    <i class="clou g"></i><i class="clou d"></i></button>
</div>

<button class="rond" id="b-look-vieux" style="display:none">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
    <circle cx="12" cy="8" r="4"/><path d="M4.5 20c1.6-4 4.4-6 7.5-6s5.9 2 7.5 6"/></svg></button>

<div id="pan"><div class="feuille" id="feuille"></div></div>
<div id="sacPage"><div class="sacFond" id="sacFond"></div></div>
<div id="page2"><div class="sacFond" id="page2Fond"></div></div>

<div id="porte">
  <div class="pCarte" id="pCarte" style="display:none">
    <h1>Survivre</h1>
    <p>Connecte-toi pour retrouver ton survivant.</p>
    <button id="p-ok">Se connecter</button>
  </div>
</div>

<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
const $=id=>document.getElementById(id);
/* ================= le personnage, en pixels =================
   Proportions : 40 pixels de haut, quatre têtes.
   Repère : x au milieu des pieds, y au sol.                     */
const PALETTES={
 peau:['#f6ddc0','#f0d0ae','#e8c49a','#d8a878','#c08a58','#a2683c','#7d4e2a','#5a3720'],
 cheveux:['#1c140d','#2b1d12','#4a3220','#6b4726','#8a5f30','#b58a4a','#d9c48a','#f2e6c8',
          '#8a8f96','#c9c9c9','#a8402c','#c2604a','#6b3f8f','#2f6b8f','#3f7d4a','#b53f6b'],
 yeux:['#26241f','#3f5f6b','#4a6b3f','#6b4a3f','#5a4a6b','#7d6a3f','#2f6b8f','#8f4a3f'],
 veste:['#4f7d5c','#5a6b8f','#8a5a4a','#6b5f8f','#7d6a3f','#3f5f6b','#8f6a3f','#54606b',
        '#a8524a','#3f7d4a','#c2a04a','#2f3a4a','#7a4f6b','#4a7d7d','#9c5f2f','#5f5f5f'],
 pantalon:['#3a4358','#4a4038','#2f3a2f','#5a4a3a','#3a3a44','#6b5f4a','#2b3340','#7d6a4a'],
 chaussures:['#4a3524','#2f2a24','#5a4a3a','#6b4a28','#3f4a53','#7d5934'],
 sac:['aucun','#7d5934','#4a5c6b','#6b4a4a','#4f6b4a','#8a6a44','#54606b']
};
const COIFFES=['courts','très courts','dégradé','bol','carré','mi-longs','longs','très longs',
               'queue','couettes','chignon','chignon haut','tresse','tresses','ondulés','bouclés',
               'afro','dreads','banane','crête','crâne','hirsute'];
const BARBES=['aucune','naissante','fine','courte','pleine','longue','bouc','moustache',
              'collier','favoris','impériale','fourchue'];
const CHAPEAUX=['aucun','casquette','bandana','bonnet','capuche','chapeau','beret','cagoule'];
const YEUX_F=['normaux','plisses','ronds','fatigues','doux','severes'];
const SILHOUETTES=['fine','svelte','moyenne','athlétique','forte'];
const HAUTS=['veste','t-shirt','chemise','pull','débardeur','manteau','gilet','tunique'];
const BAS=['pantalon','short','jupe','treillis','longue jupe','bermuda'];
const SOULIERS=['bottes','baskets','sandales','bottillons'];
const SOURCILS=['fins','epais','arques','fronces'];
const NEZ=['petit','droit','large','retrousse'];
const BOUCHES=['neutre','sourire','severe','entrouverte','lèvres','pincée'];
const MARQUES=['aucune','taches','cicatrice','grain','fard','peinture'];
const BOUCLES=['aucune','anneau','perle','plume'];
const DEF_AP={peau:2,cheveux:2,coiffe:0,barbe:0,yeux:0,formeYeux:0,veste:0,pantalon:0,
              chaussures:0,chapeau:0,sac:1,
              sourcils:0,nez:1,bouche:0,marque:0,boucle:0,
              corps:0,haut:0,bas:0,souliers:0};
const teint=(c,k)=>{
  const n=parseInt(c.slice(1),16);
  const f=v=>Math.max(0,Math.min(255,v+k));
  return '#'+((1<<24)+(f((n>>16)&255)<<16)+(f((n>>8)&255)<<8)+f(n&255)).toString(16).slice(1);
};

function sprite(g,x,y,ap0,dir,pas,bouge){
  const p=Object.assign({},DEF_AP,ap0||{});
  const P=PALETTES;
  const peau=P.peau[p.peau]||P.peau[2], peauO=teint(peau,-24), peauC=teint(peau,14), peauT=teint(peau,-52);
  const chev=P.cheveux[p.cheveux]||P.cheveux[2], chevC=teint(chev,22), chevO=teint(chev,-22);
  const veste=P.veste[p.veste]||P.veste[0], vesteC=teint(veste,20), vesteO=teint(veste,-26), vesteT=teint(veste,-48);
  const pant=P.pantalon[p.pantalon]||P.pantalon[0], pantO=teint(pant,-18), pantC=teint(pant,12);
  const chau=P.chaussures[p.chaussures]||P.chaussures[0], chauC=teint(chau,20);
  const oeil=P.yeux[p.yeux]||P.yeux[0];
  const coiffe=COIFFES[p.coiffe]||'courts', barbe=BARBES[p.barbe]||'aucune';
  const chapeau=CHAPEAUX[p.chapeau]||'aucun', sacC=P.sac[p.sac]||'aucun';
  const fy=YEUX_F[p.formeYeux]||'normaux';
  const sourcil=SOURCILS[p.sourcils]||'fins';
  const nez=NEZ[p.nez]||'droit';
  const bouche=BOUCHES[p.bouche]||'neutre';
  const marque=MARQUES[p.marque]||'aucune';
  const boucle=BOUCLES[p.boucle]||'aucune';
  const silhouette=SILHOUETTES[p.corps]||'masculine';
  const hautT=HAUTS[p.haut]||'veste';
  const basT=BAS[p.bas]||'pantalon';
  const soulier=SOULIERS[p.souliers]||'bottes';
  /* la silhouette : largeur d'épaules, taille, hanches */
  const SIL={'fine'      :{ep:6,ta:5,ha:6,tete:5,menton:1},
             'svelte'    :{ep:7,ta:5,ha:7,tete:5,menton:1},
             'moyenne'   :{ep:8,ta:7,ha:7,tete:6,menton:2},
             'athlétique':{ep:9,ta:7,ha:7,tete:6,menton:2},
             'forte'     :{ep:9,ta:9,ha:9,tete:6,menton:3}}[silhouette]||{ep:8,ta:7,ha:7,tete:6,menton:2};
  const EP=SIL.ep, TA=SIL.ta, HA=SIL.ha;   /* demi-largeurs */
  const N='#1b1712';
  const R=(a,b,w,h,c)=>{g.fillStyle=c;g.fillRect(x+a,y+b,w,h);};

  /* marche souple, huit temps */
  const F=bouge?(Math.floor(pas)%8):-1;
  const AN={corps:[0,0,-1,0,0,0,-1,0],
            jg:[2,1,-1,-2,-2,-1,1,2], jd:[-2,-1,1,2,2,1,-1,-2],
            pg:[0,0,1,0,0,0,0,0],     pd:[0,0,0,0,0,0,1,0],
            bg:[-2,-1,1,2,2,1,-1,-2], bd:[2,1,-1,-2,-2,-1,1,2],
            reb:[0,0,1,0,0,0,1,0]};
  const souffle=bouge?0:((Date.now()/1400|0)%3===0?1:0);
  const Y=bouge?AN.corps[F]:souffle;
  const jgP=bouge?AN.jg[F]:0, jdP=bouge?AN.jd[F]:0;
  const jgL=bouge?AN.pg[F]:0, jdL=bouge?AN.pd[F]:0;
  const bgP=bouge?AN.bg[F]:0, bdP=bouge?AN.bd[F]:0;
  const reb=bouge?AN.reb[F]:0;
  const prof=dir==='haut', cote=dir==='gauche'||dir==='droite';
  const MANCHE_AR={'veste':11,'chemise':11,'pull':11,'manteau':11,'tunique':9,
                   'gilet':0,'t-shirt':4,'débardeur':0}[HAUTS[p.haut]||'veste'];
  const s=dir==='droite'?1:-1;

  /* ---- mesures du corps (quatre têtes) ----
     pieds 0 · jambes 13 · torse 15 · tête 11, sommet à -40 */
  const JH=13, TH=15, HT=11;
  const yT=-JH-TH;                 /* haut du torse  = -28 */
  const yTete=yT-HT-2;             /* la tête est décollée du torse : le cou apparaît */

  /* ---- le geste de frappe, en trois temps ----
     1 → 0,58 : l'élan, la pioche part en arrière
     0,58 → 0,42 : l'abattage, très rapide
     0,42 → 0   : la reprise, le corps se redresse                */
  const fr=(typeof GESTE!=='undefined'&&GESTE.t>0)?GESTE.t:0;
  const typeGeste=(typeof GESTE!=='undefined'&&GESTE.type)||'pioche';
  let phase=0, arc=0, penche=0, tasse=0;
  if(fr>0&&typeGeste==='cueille'){
    /* la cueillette : on se penche, le bras part vers le buisson, on se relève */
    if(fr>0.55){const t=(1-fr)/0.45;penche=doux(t)*2.6;tasse=doux(t)*1.6;arc=1.1*doux(t);phase=1;}
    else if(fr>0.3){const t=(0.55-fr)/0.25;penche=2.6;tasse=1.6;arc=1.1+t*0.5;phase=2;}
    else{const t=1-fr/0.3;penche=2.6*(1-sortRap(t));tasse=1.6*(1-sortRap(t));arc=1.6*(1-sortRap(t));phase=3;}
  }else if(fr>0&&typeGeste==='hache'){
    /* la hache : élan haut, balayage large, reprise lente */
    if(fr>0.62){const t=(1-fr)/0.38;arc=-1.9*doux(t);penche=-doux(t)*2;tasse=doux(t)*1.4;phase=1;}
    else if(fr>0.42){const t=(0.62-fr)/0.2;arc=-1.9+entreRap(t)*3.3;penche=-2+t*5.2;tasse=1.4-t*2.8;phase=2;}
    else{const t=1-fr/0.42;arc=1.4*(1-sortRap(t));penche=3.2*(1-sortRap(t));tasse=-1.4*(1-sortRap(t));phase=3;}
  }else if(fr>0){
    if(fr>0.58){const t=(1-fr)/0.42;arc=-1.45*doux(t);penche=-doux(t)*1.6;tasse=doux(t)*1.2;phase=1;}
    else if(fr>0.42){const t=(0.58-fr)/0.16;arc=-1.45+entreRap(t)*2.75;penche=-1.6+t*4.4;tasse=1.2-t*2.4;phase=2;}
    else{const t=1-fr/0.42;arc=1.3*(1-sortRap(t));penche=2.8*(1-sortRap(t));tasse=-1.2*(1-sortRap(t));phase=3;}
  }

  R(-6,1,12,2,'rgba(40,60,28,.42)');

  /* sac */
  if(sacC!=='aucun'&&prof){                     /* de dos : le sac, bien posé entre les épaules */
    const w2=Math.min(10,EP*2-4);
    R(-(w2>>1),yT+2-reb,w2,13,teint(sacC,-8));
    R(-(w2>>1),yT+2-reb,w2,2,teint(sacC,16));
    R(-(w2>>1),yT+12-reb,w2,2,teint(sacC,-26));
    R(-2,yT+6-reb,4,4,teint(sacC,10));          /* la poche */
    R(-2,yT+6-reb,4,1,teint(sacC,-30));
  }else if(sacC!=='aucun'&&cote){               /* de profil : il dépasse dans le dos */
    const sx=s>0?-(EP+1):EP-2;
    R(sx,yT+2-reb,4,12,teint(sacC,-16));
    R(sx,yT+2-reb,4,2,teint(sacC,10));
    R(sx,yT+12-reb,4,1,teint(sacC,-30));
  }

  /* ---- jambes ---- */
  /* la chaussure, dessinée selon son type */
  const pied=(px2,py,col)=>{
    if(soulier==='bottes'){
      R(px2,py-2,5,2,teint(col,-16));              /* la tige monte sur la cheville */
      R(px2,py,5,3,col);
      R(px2,py,5,1,teint(col,20));
      R(px2,py+2,5,1,teint(col,-26));             /* la semelle */
    }else if(soulier==='bottillons'){
      R(px2,py-1,5,1,teint(col,-16));
      R(px2,py,5,3,col);
      R(px2,py,5,1,teint(col,18));
      R(px2,py+2,5,1,teint(col,-30));
    }else if(soulier==='baskets'){
      R(px2,py,5,2,col);
      R(px2,py,5,1,teint(col,22));
      R(px2+1,py,2,1,'#f2efe4');                   /* le lacet */
      R(px2,py+2,5,1,'#e8e4d8');                   /* la semelle claire */
    }else{                                          /* sandales : le pied reste visible */
      R(px2+1,py,3,2,peauO);
      R(px2,py+1,5,1,col);
      R(px2+1,py,3,1,col);
      R(px2,py+2,5,1,teint(col,-22));
    }
  };

  /* jusqu'où le tissu descend, selon le bas porté */
  const TISSU={'pantalon':JH,'short':6,'jupe':5,'treillis':JH,'longue jupe':10,'bermuda':8}[basT];
  const jambeProfil=(dec,plie,col,botte)=>{
    const h=JH-plie;
    R(-2+dec,-JH,4,h,peau);                    /* la jambe nue */
    if(TISSU>0)R(-2+dec,-JH,4,Math.min(h,TISSU),col);
    if(TISSU>=h)R(-2+dec,-4,4,4,teint(col,-12));
    if(basT==='treillis'){R(-2+dec,-JH+5,4,1,teint(col,-22));R(-1+dec,-JH+6,2,2,teint(col,14));}
    pied(-3+dec,-JH+h,botte);
  };
  const jambeFace=(cx,phase,col,botte)=>{
    const avance=phase>0;
    const h=avance?JH:JH-2;
    const ec=Math.abs(phase)>1?(avance?-1:1):0;
    R(cx+ec,-JH,4,h,avance?teint(peau,4):teint(peau,-14));   /* la jambe */
    if(TISSU>0){
      R(cx+ec,-JH,4,Math.min(h,TISSU),avance?teint(col,8):teint(col,-10));
      R(cx+ec,-JH,4,1,pantC);
    }
    if(basT==='treillis'){R(cx+ec,-JH+5,4,1,teint(col,-22));R(cx+1+ec,-JH+6,2,2,teint(col,14));}
    pied(cx-1+ec,-JH+h,avance?botte:teint(botte,-14));
  };
  if(cote){
    jambeProfil(jdP*0.9-1,jdL,pantO,teint(chau,-14));
    jambeProfil(jgP*0.9-1,jgL,pant,chau);
  }else{
    if(jgP>=jdP){jambeFace(1,jdP,pantO,teint(chau,-14));jambeFace(-5,jgP,pant,chau);}
    else{jambeFace(-5,jgP,pant,chau);jambeFace(1,jdP,pantO,teint(chau,-14));}
  }

  /* jupe : un trapèze par-dessus le haut des jambes */
  if(basT==='jupe'||basT==='longue jupe'){
    const hj=basT==='jupe'?6:9;
    for(let i=0;i<hj;i++){
      const w2=HA-1+Math.round(i*(basT==='jupe'?0.7:0.55));
      R(-w2,-JH+i,w2*2,1,i<2?pantC:pant);
    }
    R(-(HA+3),-JH+hj-1,(HA+3)*2,1,pantO);
  }

  /* hanches : elles ferment la jonction entre le torse et les jambes */
  R(-(HA+1),-JH-2,(HA+1)*2,3,N);
  R(-HA,-JH-1,HA*2,2,pantO);
  R(-HA,-JH-1,HA*2,1,pant);

  /* ---- bras arrière (profil) ---- */
  if(cote){
    const ar=bgP;
    const bx=(s>0?-6:3)-ar*s;
    R(bx,yT+2,3,11,peauT);
    if(MANCHE_AR>0)R(bx,yT+2,3,MANCHE_AR,vesteT);
    R(bx,yT+13,3,3,peauT);
  }

  /* ---- torse : la coupe du vêtement suit la silhouette ---- */
  const colH=veste, colHC=vesteC, colHO=vesteO, colHT=vesteT;
  const pen=fr>0?Math.round(penche*(dir==='gauche'?-1:1)):0;   /* il se penche dans l'effort */
  const tas=fr>0?Math.max(0,Math.round(tasse)):0;              /* et se tasse */
  R(-EP+pen,yT-1+tas,EP*2,TH+1-tas,N);           /* contour aux épaules */
  R(-EP+1,yT,EP*2-2,3,colH);                     /* les épaules */
  R(-EP+1,yT,EP*2-2,2,colHC);
  for(let i=3;i<TH-1;i++){                       /* le buste, resserré à la taille */
    const w2=Math.round(EP-1-(EP-TA)*Math.min(1,(i-2)/(TH-5)));
    R(-w2,yT+i,w2*2,1,colH);
    R(-w2,yT+i,2,1,colHT);
    R(w2-2,yT+i,2,1,colHO);
  }
  R(-TA,yT+TH-4,TA*2,2,colHO);                   /* ceinture */
  R(-1,yT+TH-4,2,2,'#c9a24a');
  /* les détails propres à chaque haut */
  if(hautT==='veste'&&!prof){R(-1,yT,2,TH-5,colHO);R(-4,yT,3,2,colHC);R(1,yT,3,2,colHC);}
  if(hautT==='chemise'&&!prof){
    R(-1,yT,2,TH-5,colHT);
    R(-4,yT,4,3,colHC);R(0,yT,4,3,colHC);        /* col ouvert */
    for(let i=0;i<3;i++)R(0,yT+4+i*3,1,1,'#f2efe4');
  }
  if(hautT==='pull'&&!prof){
    R(-3,yT-2,6,3,colHC);R(-3,yT-2,6,1,colH);    /* col montant */
    for(let i=4;i<TH-4;i+=3)R(-EP+2,yT+i,EP*2-4,1,teint(colH,-12));
  }
  if(hautT==='t-shirt'&&!prof){R(-3,yT,6,2,peau);R(-3,yT,6,1,peauC);}
  if(hautT==='débardeur'){
    R(-4,yT,8,3,peau);R(-4,yT,8,1,peauC);        /* décolleté */
    R(-EP+1,yT,2,4,colH);R(EP-3,yT,2,4,colHO);   /* bretelles */
  }
  if(hautT==='gilet'&&!prof){
    R(-2,yT,4,TH-5,peau);R(-2,yT,4,1,peauC);
    R(-2,yT+TH-6,4,2,colHO);
  }
  if(hautT==='manteau'){
    R(-TA,yT+TH-2,TA*2,6,colH);                  /* les pans descendent */
    R(-TA,yT+TH-2,TA*2,1,colHC);
    R(-TA,yT+TH+3,TA*2,1,colHT);
    if(!prof)R(-1,yT+TH-2,2,6,colHT);
  }
  if(hautT==='tunique'){
    R(-TA,yT+TH-2,TA*2,4,colH);
    R(-TA,yT+TH-2,TA*2,1,colHC);
    R(-TA,yT+TH+1,TA*2,1,colHT);
    if(!prof){R(-4,yT,8,2,colHC);R(-1,yT,2,4,colHO);}
  }
  R(-EP+1,yT+TH-2,EP*2-2,1,colHT);

  /* de face : on ne voit du sac que les deux sangles sur la poitrine */
  if(sacC!=='aucun'&&dir==='bas'){
    R(-EP+2,yT+2,2,8,teint(sacC,-6));
    R(EP-4,yT+2,2,8,teint(sacC,-18));
    R(-EP+2,yT+6,EP*2-6,1,teint(sacC,-24));
  }

  /* ---- bras : la manche s'arrête selon le vêtement ---- */
  const MANCHE={'veste':11,'chemise':11,'pull':11,'manteau':11,'tunique':9,
                'gilet':0,'t-shirt':4,'débardeur':0}[hautT];
  const brasCol=(dev)=>dev?veste:vesteT;
  const bras=(bx,by,dev)=>{
    R(bx,by,3,11,dev?teint(peau,2):peauO);       /* le bras nu */
    if(MANCHE>0){
      R(bx,by,3,MANCHE,brasCol(dev));
      R(bx,by,3,2,dev?vesteC:vesteO);
      if(MANCHE<11)R(bx,by+MANCHE-1,3,1,teint(brasCol(dev),-20));
    }
    R(bx,by+11,3,3,dev?peau:peauO);              /* la main */
  };
  if(cote){
    bras((s>0?1:-4)+bdP*s,yT+1,true);
  }else{
    bras(-(EP+2),yT+1,bgP>0);
    bras(EP-1,yT+1,bdP>0);
  }
  /* la pioche, et le bras qui la porte */
  if(fr>0&&typeof dessinerPioche==='function'){
    const sens=dir==='gauche'?-1:1;
    const epx=sens>0?EP-1:-(EP+2);
    const ey=yT+1-Math.round(tasse*3);            /* l'épaule monte à l'élan, plonge au coup */
    R(epx,ey,3,9,veste);
    R(epx,ey,3,2,vesteC);
    R(epx,ey+9,3,3,peau);
    if(typeGeste!=='cueille'){
      g.save();
      g.translate(x+epx+1.5,y+ey+2);
      g.rotate(sens*arc);
      if(typeGeste==='hache')dessinerHache(g,0,0,1);else dessinerPioche(g,0,0,1);
      if(phase===2){                              /* traînée pendant l'abattage */
        g.globalAlpha=.3;g.fillStyle='#f2f5f8';
        g.fillRect(-1,-15,2,13);g.globalAlpha=1;
      }
      g.restore();
    }else{
      /* la main nue s'avance vers le buisson */
      const av=Math.round(arc*3);
      R(epx+(sens>0?av:-av),ey+7,3,3,peau);
    }
  }

  /* ---- tête ---- */
  const YT=yTete+(fr>0?Math.round(tasse*1.2):0);  /* la tête plonge avec le buste */
  R(-3,yT-3+Y,6,4-Y,N);                        /* le cou s'étire quand le corps descend */
  R(-2,yT-2+Y,4,3-Y,peau);
  R(-2,yT-2+Y,4,1,peauT);                      /* ombre du menton */
  R(-2,yT-2+Y,2,3-Y,peauO);

  const LT=SIL.tete;                            /* demi-largeur de la tête */
  for(let i=0;i<HT;i++){
    let w2=LT;
    if(i>=HT-SIL.menton)w2=LT-1;                /* le menton se resserre */
    if(i===0)w2=LT-1;                           /* le sommet du crâne s'arrondit */
    R(-w2-1,YT+i,(w2+1)*2,1,N);
    R(-w2,YT+i,w2*2,1,peau);
    R(-w2,YT+i,Math.min(3,w2),1,peauO);
  }
  R(-LT,YT,LT*2,1,peauC);                       /* front éclairé */
  if(!prof){R(-LT-2,YT+5,2,3,peauO);R(LT,YT+5,2,3,peau);}   /* oreilles */
  if(prof){R(-LT,YT+1,LT*2,HT-1,teint(peau,-12));           /* nuque */
           R(-LT,YT+HT-3,LT*2,2,teint(peau,-30));}
  /* ---- la barbe ----
     Elle épouse la mâchoire : plus large en haut des joues, resserrée sous le menton.
     Trois valeurs, comme les cheveux, et une version propre au profil. */
  if(barbe!=='aucune'&&!prof){
    const LB=SIL.tete;                          /* demi-largeur du visage */
    const bas=YT+HT-1;                          /* le bas du menton */
    const B=chev, BC=chevC, BO=chevO, BT=teint(chev,-40);
    const joue=(y0,h2,ep)=>{                    /* les côtés, le long de la mâchoire */
      for(let i=0;i<h2;i++){
        const w2=LB-(i>=h2-2?1:0);
        R(-w2,y0+i,ep,1,B);
        R(w2-ep,y0+i,ep,1,BO);
      }
    };
    const menton=(y0,h2,larg)=>{                /* la masse sous la bouche */
      for(let i=0;i<h2;i++){
        const w2=Math.max(1,larg-(i>=h2-2?1:0)-(i>=h2-1?1:0));
        R(-w2,y0+i,w2*2,1,i<1?BC:(i>h2-2?BT:B));
      }
    };
    if(cote){
      /* de profil : la barbe suit le bord avant du visage */
      const av=s>0?1:-4;
      if(barbe==='naissante'){g.globalAlpha=.5;R(av-1,YT+7,5,4,BO);g.globalAlpha=1;}
      else if(barbe==='fine'){R(av-1,YT+7,5,3,BO);R(av,YT+10,3,1,BT);}
      else if(barbe==='courte'){R(av-2,YT+6,6,5,B);R(av-1,YT+10,4,1,BO);}
      else if(barbe==='pleine'){R(av-3,YT+5,7,7,B);R(av-3,YT+5,2,7,BO);R(av-2,YT+11,5,2,BT);}
      else if(barbe==='longue'){R(av-3,YT+5,7,7,B);R(av-2,YT+11,5,6,B);R(av-2,YT+15,5,2,BT);}
      else if(barbe==='bouc'){R(av-1,YT+8,4,5,B);R(av-1,YT+11,4,2,BO);}
      else if(barbe==='moustache'){R(av-1,YT+7,4,1,B);R(av+2,YT+7,1,1,BO);}
      else if(barbe==='collier'){R(av-4,YT+4,2,8,B);R(av-3,YT+10,6,2,B);}
      else if(barbe==='favoris'){R(av-4,YT+3,2,6,B);}
      else if(barbe==='impériale'){R(av-1,YT+7,4,1,B);R(av,YT+9,3,3,B);}
      else if(barbe==='fourchue'){R(av-3,YT+5,7,7,B);R(av-2,YT+11,2,5,B);R(av+1,YT+11,2,4,BO);}
    }else{
      if(barbe==='naissante'){                  /* juste une ombre sur la mâchoire */
        g.globalAlpha=.42;
        joue(YT+6,5,2);menton(YT+9,3,3);
        g.globalAlpha=1;
      }
      else if(barbe==='fine'){
        joue(YT+7,4,1);
        R(-3,YT+10,6,1,BO);R(-2,YT+11,4,1,BT);
      }
      else if(barbe==='courte'){
        joue(YT+6,5,2);
        menton(YT+9,3,4);
        R(-3,YT+8,6,1,BC);                      /* le sillon sous la lèvre */
      }
      else if(barbe==='pleine'){
        joue(YT+4,7,2);
        menton(YT+8,5,LB-1);
        R(-LB+1,YT+4,LB*2-2,1,BC);              /* le haut des joues, éclairé */
        R(-2,YT+8,4,1,teint(peau,-30));         /* la bouche reste lisible */
      }
      else if(barbe==='longue'){
        joue(YT+4,7,2);
        menton(YT+8,5,LB-1);
        for(let i=0;i<6;i++){                   /* elle descend sur la poitrine */
          const w2=Math.max(1,4-Math.floor(i/2));
          R(-w2,YT+HT+i-1,w2*2,1,i<4?B:BT);
        }
        R(-LB+1,YT+4,LB*2-2,1,BC);
        R(-2,YT+8,4,1,teint(peau,-30));
      }
      else if(barbe==='bouc'){
        R(-2,YT+10,4,3,B);R(-2,YT+10,2,3,BC);R(-1,YT+12,2,1,BT);
        R(-3,YT+7,6,1,B);                       /* avec sa moustache */
      }
      else if(barbe==='moustache'){
        R(-3,YT+7,6,1,B);R(-4,YT+7,1,1,BO);R(3,YT+7,1,1,BO);
        R(-3,YT+8,2,1,BO);R(1,YT+8,2,1,BO);
      }
      else if(barbe==='collier'){               /* le tour du visage, joues rasées */
        R(-LB,YT+4,1,7,B);R(LB-1,YT+4,1,7,BO);
        menton(YT+10,2,4);
        R(-3,YT+7,6,1,B);
      }
      else if(barbe==='favoris'){               /* seulement devant les oreilles */
        R(-LB,YT+3,2,5,B);R(LB-2,YT+3,2,5,BO);
        R(-LB,YT+7,2,1,BT);R(LB-2,YT+7,2,1,BT);
      }
      else if(barbe==='impériale'){             /* moustache et touffe sous la lèvre */
        R(-4,YT+7,8,1,B);R(-5,YT+6,1,1,BO);R(4,YT+6,1,1,BO);
        R(-1,YT+10,3,3,B);R(-1,YT+10,1,3,BC);
      }
      else if(barbe==='fourchue'){
        joue(YT+4,7,2);
        menton(YT+8,4,LB-1);
        R(-4,YT+HT-1,3,5,B);R(1,YT+HT-1,3,4,BO);   /* les deux pointes */
        R(-4,YT+HT+3,3,1,BT);R(1,YT+HT+2,3,1,BT);
        R(-LB+1,YT+4,LB*2-2,1,BC);
      }
    }
  }

  /* ---- les cheveux ----
     Une même coupe se décline en trois vues :
       de face  : calotte + frange + pans qui pendent de chaque côté du visage
       de dos   : la masse couvre tout le crâne, les longueurs tombent dans le dos
       de profil: calotte + un seul pan, derrière la tête                        */
  const C=chev, CC=chevC, CO=chevO, CT=teint(chev,-42);
  const tr=bouge?(cote?-s:0):0;

  /* description de chaque coupe :
     vol  volume au-dessus du crâne · fr  frange · pan longueur des pans latéraux
     dos  longueur dans le dos      · ras côtés rasés                            */
  const D={
   'courts'      :{vol:2,fr:'courte',pan:3, dos:12},
   'très courts' :{vol:1,fr:'rase',  pan:2, dos:12},
   'dégradé'     :{vol:3,fr:'cote',  pan:1, dos:12,ras:1},
   'bol'         :{vol:2,fr:'droite',pan:5, dos:14},
   'carré'       :{vol:2,fr:'droite',pan:9, dos:17},
   'mi-longs'    :{vol:2,fr:'cote',  pan:8, dos:18},
   'longs'       :{vol:2,fr:'cote',  pan:14,dos:24,large:14},
   'très longs'  :{vol:2,fr:'cote',  pan:20,dos:30,large:14},
   'queue'       :{vol:2,fr:'courte',pan:2, dos:12,queue:14},
   'couettes'    :{vol:2,fr:'droite',pan:2, dos:12,couettes:9},
   'chignon'     :{vol:2,fr:'courte',pan:2, dos:12,chignon:1},
   'chignon haut':{vol:1,fr:'courte',pan:1, dos:12,chignon:2},
   'tresse'      :{vol:2,fr:'cote',  pan:3, dos:12,tresse:1},
   'tresses'     :{vol:2,fr:'droite',pan:2, dos:12,tresses:1},
   'ondulés'     :{vol:2,fr:'cote',  pan:12,dos:21,onde:1,large:14},
   'bouclés'     :{vol:4,fr:'boucle',pan:5, dos:16,boucle:1,large:16},
   'afro'        :{vol:6,fr:'rase',  pan:5, dos:16,afro:1,large:18},
   'dreads'      :{vol:2,fr:'rase',  pan:9, dos:20,dreads:1,large:14},
   'banane'      :{vol:5,fr:'arriere',pan:2,dos:12},
   'crête'       :{vol:0,fr:'rase',  pan:0, dos:0, crete:1},
   'crâne'       :{vol:0,fr:'rase',  pan:0, dos:0, rase:1},
   'hirsute'     :{vol:3,fr:'meche', pan:4, dos:14,hirsute:1}
  }[coiffe]||{vol:2,fr:'courte',pan:3,dos:3};

  if(D.rase){
    R(-6,YT-1,12,2,CO);
    if(prof)R(-6,YT-1,12,6,CO);
  }else{
    /* le dessus du crâne, commun aux trois vues */
    if(!D.crete){
      R(-6,YT-1-D.vol,12,2+D.vol,C);
      R(-6,YT-D.vol,4,1,CC);                    /* la lumière tombe à gauche */
      R(4,YT-1-D.vol,2,2+D.vol,CO);
    }
    if(prof){
      /* ---- de dos ---- */
      const y0=YT-1-D.vol;                      /* le sommet du crâne */
      const hd=Math.max(HT+2+D.vol,D.dos);      /* jamais moins que le crâne entier */
      const lg=D.large||12;                     /* largeur de la masse */
      const g0=-(lg>>1);
      /* une masse aux angles adoucis, pas un bloc */
      R(g0+1,y0,lg-2,hd,C);                     /* corps */
      R(g0,y0+1,lg,hd-2,C);                     /* flancs, un pixel plus bas */
      R(g0+1,y0+1,4,3,CC);                      /* la lumière en haut à gauche */
      R(g0+lg-4,y0+1,3,hd-2,CO);                /* le côté à l'ombre */
      R(g0+2,y0+hd-2,lg-4,2,CT);                /* les pointes */
      if(D.queue){R(-3,YT+2,6,3,C);                 /* l'attache */
        R(-2,YT+4,4,D.queue,C);R(-2,YT+4,2,D.queue,CC);R(-2,YT+D.queue+1,4,3,CT);}
      if(D.couettes){R(-9,YT+1,3,D.couettes,C);R(6,YT+1,3,D.couettes,CO);
        R(-9,YT+D.couettes-1,3,2,CT);R(6,YT+D.couettes-1,3,2,CT);}
      if(D.tresse)for(let i=0;i<6;i++)R(-2,YT+2+i*3,4,3,i%2?CO:C);
      if(D.tresses)for(let i=0;i<5;i++){R(-8,YT+1+i*3,3,3,i%2?CO:C);R(5,YT+1+i*3,3,3,i%2?C:CO);}
      if(D.chignon===1)R(-3,YT-5-D.vol-reb,6,5,C);
      if(D.chignon===2){R(-2,YT-8-reb,5,6,C);R(-2,YT-8-reb,2,2,CC);}
      if(D.crete){R(-6,YT-1,12,5,CO);R(-2,YT-9-reb,4,9,C);R(-2,YT-9-reb,2,9,CC);}
    }else if(cote){
      /* ---- de profil : un seul pan, derrière la tête ---- */
      const der=s>0?-8:6;                        /* le côté opposé au regard */
      if(D.pan>1){
        R(der+tr,YT+1,3,D.pan,C);
        if(D.pan>6)R(der+tr,YT+D.pan-2,3,3,CT);
      }
      if(D.fr==='droite')R(s>0?-6:0,YT+1,6,2,CO);
      if(D.fr==='cote')R(s>0?-2:-4,YT+1,6,2,CO);
      if(D.fr==='courte')R(s>0?-1:-5,YT+1,6,1,CO);
      if(D.fr==='arriere')R(s>0?-5:0,YT-2-D.vol,6,2,CC);
      if(!D.ras&&D.pan>=2)R(s>0?-6:2,YT+1,4,3,C);   /* la tempe visible */
      if(D.queue){R(der+tr,YT+1,3,D.queue,C);R(der+tr,YT+D.queue-2,3,3,CT);}
      if(D.couettes)R(der+tr,YT+2,3,D.couettes,C);
      if(D.tresse)for(let i=0;i<5;i++)R(der+tr,YT+2+i*3,3,3,i%2?CO:C);
      if(D.tresses)for(let i=0;i<4;i++)R(der+tr,YT+2+i*3,3,3,i%2?CO:C);
      if(D.chignon===1)R(der+2,YT-4-reb,5,5,C);
      if(D.chignon===2)R(-1,YT-8-reb,5,6,C);
      if(D.crete){R(-6,YT-1,12,4,CO);R(-2,YT-9-reb,4,9,C);}
      if(D.afro){R(der-1,YT-6,5,10,C);R(-6,YT-7,12,7,C);R(-6,YT-6,4,3,CC);}
      if(D.dreads)for(let i=0;i<4;i++)R(der+tr,YT+1+i*3,3,7,i%2?CO:C);
      if(D.boucle){R(der,YT-4,4,7,C);R(-6,YT-5,12,5,C);R(-6,YT-4,4,2,CC);}
    }else{
      /* ---- de face ---- */
      if(D.fr==='droite')R(-6,YT+1,12,2,CO);     /* frange qui barre le front */
      if(D.fr==='cote'){R(-6,YT+1,7,2,CO);R(1,YT+1,5,1,CO);}
      if(D.fr==='courte')R(-6,YT+1,12,1,CO);
      if(D.fr==='meche'){R(-6,YT+1,5,2,CO);R(2,YT+1,4,1,CO);}
      if(D.fr==='boucle'){R(-6,YT+1,4,2,C);R(-1,YT+1,3,2,CO);R(3,YT+1,3,2,C);}
      if(!D.ras&&D.pan>=2){                       /* les tempes, seulement si la coupe les a */
        const ht=Math.max(3,Math.min(5,D.pan));
        R(-6,YT+1,2,ht,C);
        R(4,YT+1,2,ht,CO);
      }
      if(D.pan>4){                                /* les pans qui pendent */
        R(-7+tr,YT+1,2,D.pan,C);
        R(5+tr,YT+1,2,D.pan,CO);
        R(-7+tr,YT+D.pan-2,2,3,CT);
        R(5+tr,YT+D.pan-2,2,3,CT);
      }
      if(D.onde){R(-8+tr,YT+4,2,5,C);R(6+tr,YT+4,2,5,CO);}
      if(D.queue){R(5+tr,YT+1,2,3,C);R(6+tr,YT+2,1,3,CO);}  /* elle dépasse à peine */
      if(D.couettes){
        R(-8+tr,YT,3,D.couettes,C);      R(5+tr,YT,3,D.couettes,CO);
        R(-8+tr,YT,3,1,CC);
        R(-8+tr,YT+D.couettes,2,2,CT);   R(6+tr,YT+D.couettes,2,2,CT);}
      if(D.tresse){R(5+tr,YT+1,3,4,CO);}
      if(D.tresses)for(let i=0;i<4;i++){R(-8+tr,YT+1+i*3,3,3,i%2?CO:C);R(5+tr,YT+1+i*3,3,3,i%2?C:CO);}
      if(D.chignon===1){R(-3,YT-3-D.vol-reb,5,3,C);R(-3,YT-3-D.vol-reb,2,1,CC);R(1,YT-3-D.vol-reb,1,3,CO);}
      if(D.chignon===2){R(-2,YT-8-reb,5,6,C);R(-2,YT-8-reb,2,2,CC);R(-3,YT-3,7,2,C);}
      if(D.afro){R(-9,YT-6,18,8,C);R(-9,YT-5,6,3,CC);R(5,YT-6,4,8,CO);
        R(-9,YT+1,3,5,C);R(6,YT+1,3,5,CO);}
      if(D.boucle){R(-7,YT-4,14,5,C);R(-7,YT-3,4,2,CC);R(4,YT-4,3,5,CO);
        R(-8,YT+1,3,4,C);R(5,YT+1,3,4,CO);R(-5,YT-6,4,2,CC);R(1,YT-6,4,2,C);}
      if(D.dreads){                              /* elles encadrent le visage, sans le couvrir */
        for(let i=0;i<3;i++){
          R(-8+tr,YT+1+i*4,3,5,i%2?CO:C);
          R(5+tr,YT+1+i*4,3,5,i%2?C:CO);
        }
        R(-6,YT+1,12,2,CO);                       /* la racine sur le front */
        R(-8+tr,YT+11,3,2,CT);R(5+tr,YT+11,3,2,CT);
      }
      if(D.crete){R(-6,YT-1,12,2,CO);R(-2,YT-9-reb,4,9,C);R(-2,YT-9-reb,2,9,CC);}
      if(D.hirsute){R(-8,YT-3,3,3,C);R(5,YT-4,3,3,CO);R(-3,YT-4-reb,3,3,C);R(2,YT-5-reb,2,3,CC);}
      if(D.fr==='arriere'){
        R(-5,YT-2-D.vol,10,2,C);
        R(-4,YT-4-D.vol,8,2,C);
        R(-2,YT-5-D.vol,6,1,CC);
        R(3,YT-4-D.vol,2,4,CO);}
    }
  }

  /* ---- ce qu'on porte sur la tête : ajusté à la largeur du crâne ---- */
  const LTc=SIL.tete;                              /* demi-largeur de la tête */
  if(chapeau==='casquette'){
    R(-LTc-1,YT-4,(LTc+1)*2,4,'#3f5f6b');          /* la calotte épouse le crâne */
    R(-LTc-1,YT-4,(LTc+1)*2,1,'#547a88');
    R(-LTc,YT-1,LTc*2,1,'#33505a');
    const vx=cote?(s>0?1:-LTc*2-1):-LTc-1;         /* la visière part vers l'avant */
    R(vx,YT,LTc*2+1,2,'#33505a');
    R(vx,YT,LTc*2+1,1,'#456a76');
  }
  else if(chapeau==='bandana'){
    R(-LTc-1,YT-2,(LTc+1)*2,3,'#a8524a');
    R(-LTc-1,YT-2,(LTc+1)*2,1,'#c46a5e');
    R(-LTc+1,YT-1,3,1,'#8f4038');                  /* le nœud */
    R(LTc-1+tr,YT,3,5,'#8f4038');                  /* les pans qui pendent */
    R(LTc-1+tr,YT+4,3,1,'#71322c');
  }
  else if(chapeau==='bonnet'){
    R(-LTc-1,YT-6,(LTc+1)*2,6,'#8a4a3a');
    R(-LTc-1,YT-6,(LTc+1)*2,1,'#a85c48');
    R(-LTc-1,YT-1,(LTc+1)*2,2,'#a85c48');          /* le revers */
    R(-LTc-1,YT+1,(LTc+1)*2,1,'#71392c');
    R(-2,YT-9-reb,4,3,'#c07260');                  /* le pompon */
    R(-2,YT-9-reb,2,1,'#d9897a');
  }
  else if(chapeau==='capuche'){
    R(-LTc-2,YT-5,(LTc+2)*2,HT+3,'#54606b');       /* le tissu enveloppe la tête */
    R(-LTc-2,YT-5,(LTc+2)*2,2,'#68757f');
    R(-LTc-2,YT+3,2,HT-5,'#465059');
    R(LTc,YT+3,2,HT-5,'#465059');
    R(-LTc,YT+1,LTc*2,HT-2,peau);                  /* le visage reste dégagé */
    R(-LTc,YT+1,3,HT-2,peauO);
    R(-LTc,YT+1,LTc*2,1,teint(peau,-30));          /* l'ombre de la capuche */
  }
  else if(chapeau==='chapeau'){
    R(-LTc-4,YT-1,(LTc+4)*2,2,'#5a4a2c');          /* le bord large */
    R(-LTc-4,YT-1,(LTc+4)*2,1,'#7a663c');
    R(-LTc,YT-6,LTc*2,5,'#8f7a49');                /* la calotte */
    R(-LTc,YT-6,LTc*2,1,'#a08a56');
    R(-LTc,YT-3,LTc*2,2,'#5a4a2c');                /* le ruban */
  }
  else if(chapeau==='beret'){
    R(-LTc-1,YT-4,(LTc+1)*2-1,4,'#2f4a5c');
    R(-LTc-1,YT-4,LTc,2,'#3f6076');
    R(LTc-2,YT-6-reb,2,2,'#2f4a5c');               /* la queue sur le dessus */
  }
  else if(chapeau==='cagoule'){
    R(-LTc-1,YT-2,(LTc+1)*2,HT+2,'#3a3a44');
    R(-LTc-1,YT-2,(LTc+1)*2,2,'#4a4a56');
    if(!prof){R(-4,YT+4,3,3,peau);R(1,YT+4,3,3,peau);}   /* les deux fentes */
    R(-LTc-1,YT+HT-2,(LTc+1)*2,1,'#2b2b33');
  }

  /* ---- le visage ----
     Il tient dans dix pixels de large : chaque pixel compte. */
  const blanc='#f6f3ec', ombreOeil=teint(peau,-38);
  if(dir==='bas'&&chapeau==='cagoule'){
    R(-4,YT+5,3,2,oeil);R(2,YT+5,3,2,oeil);      /* on ne voit que les yeux */
  }else if(dir==='bas'){
    const clin=(Date.now()+x*53)%4600<130;
    /* sourcils */
    if(sourcil==='fins'){R(-4,YT+3,3,1,chevO);R(2,YT+3,3,1,chevO);}
    if(sourcil==='epais'){R(-4,YT+2,3,2,chevO);R(2,YT+2,3,2,chevO);}
    if(sourcil==='arques'){R(-4,YT+3,2,1,chevO);R(-2,YT+2,1,1,chevO);
                           R(3,YT+3,2,1,chevO);R(2,YT+2,1,1,chevO);}
    if(sourcil==='fronces'){R(-4,YT+3,3,1,chevO);R(2,YT+3,3,1,chevO);
                            R(-1,YT+3,2,1,chevO);}
    /* creux des orbites */
    R(-4,YT+4,3,1,ombreOeil);R(2,YT+4,3,1,ombreOeil);
    /* yeux */
    if(clin){R(-4,YT+6,3,1,chevO);R(2,YT+6,3,1,chevO);}
    else{
      const dessine=(gx,h,ty)=>{
        R(gx,YT+ty,3,h,blanc);
        R(gx+1,YT+ty,1,h,oeil);                 /* iris */
        R(gx+1,YT+ty,1,1,teint(oeil,40));       /* reflet */
      };
      if(fy==='ronds'){dessine(-4,3,4);dessine(2,3,4);}
      else if(fy==='plisses'){R(-4,YT+5,3,1,oeil);R(2,YT+5,3,1,oeil);}
      else if(fy==='fatigues'){dessine(-4,2,5);dessine(2,2,5);
        R(-4,YT+7,3,1,peauT);R(2,YT+7,3,1,peauT);}
      else if(fy==='doux'){dessine(-4,2,5);dessine(2,2,5);
        R(-4,YT+4,3,1,peau);R(2,YT+4,3,1,peau);}
      else if(fy==='severes'){dessine(-4,2,5);dessine(2,2,5);
        R(-4,YT+4,3,1,chevO);R(2,YT+4,3,1,chevO);}
      else{dessine(-4,2,5);dessine(2,2,5);}
    }
    /* nez */
    if(nez==='petit'){R(0,YT+7,1,1,peauT);}
    if(nez==='droit'){R(0,YT+6,1,2,ombreOeil);R(0,YT+8,1,1,peauT);}
    if(nez==='large'){R(-1,YT+7,3,1,ombreOeil);R(-1,YT+8,3,1,peauT);}
    if(nez==='retrousse'){R(0,YT+6,1,2,ombreOeil);R(-1,YT+8,2,1,peauT);}
    /* cils : c'est le regard qui les porte, pas la carrure */
    if((fy==='doux'||fy==='ronds')&&!clin){R(-5,YT+4,1,1,chevO);R(4,YT+4,1,1,chevO);}
    /* bouche */
    const lev=(bouche==='lèvres');
    if(bouche==='neutre')R(-2,YT+9,4,1,teint(peau,-64));
    if(lev){R(-2,YT+9,4,1,'#b06a68');R(-2,YT+10,4,1,teint(peau,-24));R(-1,YT+8,2,1,'#c47f7c');}
    if(bouche==='sourire'){R(-2,YT+9,4,1,SIL.levres?'#b06a68':teint(peau,-64));
      R(-3,YT+8,1,1,peauO);R(2,YT+8,1,1,peauO);R(-1,YT+10,2,1,teint(peau,-30));}
    if(bouche==='severe'){R(-3,YT+9,6,1,teint(peau,-70));}
    if(bouche==='entrouverte'){R(-2,YT+9,4,1,teint(peau,-70));R(-1,YT+10,2,1,'#8a4a4a');}
    if(bouche==='pincée'){R(-1,YT+9,3,1,teint(peau,-70));R(-2,YT+9,1,1,peauT);R(2,YT+9,1,1,peauT);}
    /* marques */
    if(marque==='taches'){R(-4,YT+7,1,1,peauT);R(-2,YT+8,1,1,peauT);R(3,YT+7,1,1,peauT);R(2,YT+6,1,1,peauT);}
    if(marque==='cicatrice'){R(3,YT+2,1,5,teint(peau,-46));R(2,YT+3,1,1,teint(peau,-46));}
    if(marque==='grain'){R(-3,YT+8,1,1,teint(peau,-70));}
    if(marque==='fard'){R(-4,YT+8,3,1,'#c9707a');R(2,YT+8,3,1,'#c9707a');}
    if(marque==='peinture'){R(-4,YT+4,3,3,'#a8524a');R(2,YT+4,3,3,'#a8524a');
      R(-4,YT+4,3,1,'#c46a5e');R(2,YT+4,3,1,'#c46a5e');}
    /* boucles d'oreille */
    const oy=YT+7, ox=SIL.tete+1;
    if(boucle==='anneau'){R(-ox,oy,1,2,'#c9a24a');R(ox-1,oy,1,2,'#c9a24a');}
    if(boucle==='perle'){R(-ox,oy,1,1,'#f2efe4');R(ox-1,oy,1,1,'#f2efe4');}
    if(boucle==='plume'){R(ox-1,oy,1,4,'#4a7d7d');R(ox-1,oy+3,1,1,'#7fbdbd');}
  }else if(cote){
    const dx=s>0?2:-4;
    if(sourcil==='epais')R(dx,YT+2,2,2,chevO);else R(dx,YT+3,2,1,chevO);
    R(dx,YT+4,2,1,ombreOeil);
    R(dx,YT+5,2,2,blanc);
    R(dx+(s>0?1:0),YT+5,1,2,oeil);
    R(s>0?5:-6,YT+6,1,2,peauT);                 /* le nez dépasse du profil */
    R(s>0?4:-5,YT+9,2,1,teint(peau,-64));       /* bouche */
    if(boucle!=='aucune')R(s>0?-4:3,YT+7,1,2,boucle==='perle'?'#f2efe4':'#c9a24a');
    if(marque==='fard')R(dx-1,YT+8,3,1,'#c9707a');
  }
}

/* ================= le décor, en pixels de jeu =================
   Repère de chaque élément : x au milieu du pied, y au sol.
   Tailles réelles, à l'échelle du personnage (42 px de haut).   */
const VERTS={
 fonce:'#25542a', moyen:'#2f6b34', clair:'#3d7d3f', vif:'#4a944a', lumiere:'#5aa855',
 tronc:'#6b4a28', troncC:'#8a6238', troncO:'#4f3520',
 pierre:'#7b8288', pierreC:'#8b939a', pierreH:'#a2a9b0', pierreO:'#5f666c', pierreE:'#b7bec4',
 ombre:'rgba(40,60,28,.34)'
};

/* --- l'arbre : 1,2 à 1,9 fois la taille du personnage --- */
function dessinerArbre(g,x,y,gr){
  const V=VERTS, R=(a,b,w,h,c)=>{g.fillStyle=c;g.fillRect(x+a,y+b,w,h);};
  const s=gr||0;
  const H=[60,78,94][s];
  const LT=[3,4,4][s];                          /* demi-largeur du tronc */
  const LF=[15,18,21][s];                       /* demi-largeur du houppier */
  const ht=Math.round(H*0.42);                  /* hauteur du tronc */
  const bas=-Math.round(H*0.34);                /* le feuillage descend jusque-là :
                                                   il recouvre le haut du tronc */
  g.fillStyle=V.ombre;
  g.beginPath();g.ellipse(x+2,y-1,LF*0.75,3.5,0,0,7);g.fill();

  /* tronc, du sol jusque dans le feuillage */
  R(-LT,-ht-4,LT*2,ht+4,V.tronc);
  R(-LT,-ht-4,1,ht+4,V.troncC);
  R(LT-1,-ht+3,1,ht-3,V.troncO);
  R(-LT-2,-5,2,5,V.tronc);R(LT,-4,2,4,V.tronc);
  R(-LT-1,-2,LT*2+2,2,V.troncO);
  R(-LT-4,-ht+6,4,2,V.tronc);R(LT,-ht+11,4,2,V.tronc);

  /* houppier : chaque masse repose sur la précédente, sans interstice */
  const m=(dy,hh,larg,col)=>R(-larg,dy,larg*2,hh,col);
  const h1=Math.round(H*0.16), h2=Math.round(H*0.16), h3=Math.round(H*0.12), h4=Math.round(H*0.08);
  const y1=bas-h1;                               /* masse basse, la plus sombre */
  const y2=y1-h2+2;                              /* elles se chevauchent de 2 px */
  const y3=y2-h3+2;
  const y4=y3-h4+2;
  m(y1,h1+4,LF,V.fonce);                         /* elle mord sur le tronc */
  m(y2,h2+3,LF,V.moyen);
  R(-LF-2,y2+2,2,h2,V.moyen);R(LF,y2+2,2,h2,V.fonce);
  m(y3,h3+3,LF-3,V.clair);
  m(y4,h4+3,LF-8,V.vif);
  m(y4-3,5,Math.max(3,LF-13),V.lumiere);
  R(-LF+2,y2+3,4,2,V.vif);R(LF-7,y1+1,4,2,V.vif);
  R(-2,y4-4,4,2,'#6fbb66');
}

/* --- le rocher : à hauteur de hanche (22 à 30 px) --- */
function dessinerRocher(g,x,y,gr){
  const V=VERTS, R=(a,b,w,h,c)=>{g.fillStyle=c;g.fillRect(x+a,y+b,w,h);};
  const s=gr||0;
  const H=[22,26,30][s], L=[11,13,15][s];
  g.fillStyle=V.ombre;
  g.beginPath();g.ellipse(x+1,y-1,L*0.9,3,0,0,7);g.fill();
  R(-L,-Math.round(H*0.55),L*2,Math.round(H*0.55),V.pierre);
  R(-L+3,-Math.round(H*0.8),L*2-6,Math.round(H*0.28),V.pierreC);
  R(-L+6,-H,L*2-12,Math.round(H*0.24),V.pierreH);
  R(-L,-Math.round(H*0.22),L*2,Math.round(H*0.22),V.pierreO);
  R(L-5,-Math.round(H*0.72),4,Math.round(H*0.6),'#666d73');
  R(-L+5,-Math.round(H*0.66),3,2,V.pierreE);
  R(-L-5,-Math.round(H*0.3),5,Math.round(H*0.3),V.pierre);   /* éclat au pied */
  R(-L-5,-Math.round(H*0.12),5,Math.round(H*0.12),V.pierreO);
}

/* --- le buisson : à hauteur de taille (24 à 30 px) --- */
function dessinerBuisson(g,x,y,gr,vide){
  const V=VERTS, R=(a,b,w,h,c)=>{g.fillStyle=c;g.fillRect(x+a,y+b,w,h);};
  const s=gr||0;
  const H=[24,30][s]||24, L=[12,15][s]||12;
  g.fillStyle=V.ombre;
  g.beginPath();g.ellipse(x+1,y-1,L*0.85,3,0,0,7);g.fill();
  R(-L,-Math.round(H*0.6),L*2,Math.round(H*0.6),V.clair);
  R(-L+3,-Math.round(H*0.84),L*2-6,Math.round(H*0.3),V.vif);
  R(-L+7,-H,L*2-14,Math.round(H*0.22),V.lumiere);
  R(-L,-Math.round(H*0.22),L*2,Math.round(H*0.22),V.moyen);
  R(-L-2,-Math.round(H*0.5),2,Math.round(H*0.32),V.clair);
  R(L,-Math.round(H*0.5),2,Math.round(H*0.32),V.moyen);
  if(!vide){
    R(-L+4,-Math.round(H*0.66),3,3,'#c94a4a');
    R(L-7,-Math.round(H*0.34),3,3,'#c94a4a');
    R(-1,-Math.round(H*0.86),3,3,'#e2604a');
  }
}

/* --- le massif de fleurs : à la cheville (14 px) --- */
function dessinerFleurs(g,x,y,gr){
  const R=(a,b,w,h,c)=>{g.fillStyle=c;g.fillRect(x+a,y+b,w,h);};
  const tons=['#e8d76a','#f0f4f2','#e8607a','#c98fe0'];
  const clairs=['#fff8c8','#ffffff','#ffd3dc','#e6c4f2'];
  g.fillStyle='rgba(125,179,93,.5)';
  g.beginPath();g.ellipse(x,y-1,15,5,0,0,7);g.fill();
  for(let i=0;i<7;i++){
    const dx=-13+i*4+((i*7)%3), dy=-(5+((i*5)%7));
    R(dx,dy,1,-dy,'#5e8a47');
    R(dx-1,dy-3,3,3,tons[i%4]);
    R(dx,dy-3,1,1,clairs[i%4]);
  }
  R(-10,-1,3,1,'#6faa55');R(6,-2,3,1,'#6faa55');
}

/* --- le coffre : il contient la première pioche --- */
function dessinerCoffre(g,x,y,ouvert,ouverture){
  const R=(a,b,w,h,c)=>{g.fillStyle=c;g.fillRect(x+a,y+b,w,h);};
  const k=ouverture===undefined?(ouvert?1:0):ouverture;
  g.fillStyle=VERTS.ombre;g.beginPath();g.ellipse(x+1,y-1,12,3.5,0,0,7);g.fill();
  R(-11,-14,22,14,'#3a2a1c');                 /* caisse */
  R(-10,-13,20,12,'#8a6238');
  R(-10,-13,20,2,'#a5764a');
  R(-10,-4,20,3,'#6b4a28');
  R(-10,-9,20,2,'#5f4223');                   /* cerclage */
  R(-2,-9,4,6,'#c9a24a');                     /* serrure */
  R(-2,-9,4,1,'#e8c06a');
  /* le couvercle bascule : il s'écrase puis se relève en arrière */
  const h=Math.round(7-4*k);                  /* il se raccourcit en pivotant */
  const dy=Math.round(-13-8*k);
  if(k>0.15)R(-8,-13,16,4,'#241a12');         /* l'intérieur apparaît */
  if(k>0.45){
    g.globalAlpha=Math.min(.5,(k-0.45)*1.6);  /* une lueur sort du coffre */
    g.fillStyle='#f0cf7d';
    g.fillRect(x-7,y-15,14,4);
    g.globalAlpha=1;
  }
  R(-11,dy-1,22,h+2,'#3a2a1c');
  R(-10,dy,20,h,k>0.5?'#7d5934':'#96703f');
  R(-10,dy,20,2,k>0.5?'#96703f':'#a5764a');
  R(-10,dy+h-1,20,1,'#5f4223');
}

/* --- la pioche, posée ou en main --- */
function dessinerPioche(g,x,y,ech){
  const k=ech||1;
  const R=(a,b,w,h,c)=>{g.fillStyle=c;g.fillRect(x+a*k,y+b*k,w*k,h*k);};
  R(-1,-12,2,12,'#8a6238');                   /* manche */
  R(-1,-12,1,12,'#a5764a');
  R(-6,-14,12,2,'#7b8288');                   /* fer */
  R(-6,-14,12,1,'#a2a9b0');
  R(-7,-13,2,2,'#5f666c');R(5,-13,2,2,'#5f666c');
}

/* --- la hache --- */
function dessinerHache(g,x,y,ech){
  const k=ech||1;
  const R=(a,b,w,h,c)=>{g.fillStyle=c;g.fillRect(x+a*k,y+b*k,w*k,h*k);};
  R(-1,-13,2,13,'#8a6238');                   /* manche */
  R(-1,-13,1,13,'#a5764a');
  R(0,-14,5,6,'#7b8288');                     /* fer */
  R(0,-14,5,1,'#a2a9b0');
  R(4,-13,2,4,'#c0c7cd');                     /* tranchant */
  R(-2,-14,2,6,'#5f666c');                    /* talon */
}

/* --- entailles sur un tronc frappé --- */
function entailles(g,x,y,part,ht){
  const R=(a,b,w,h,c)=>{g.fillStyle=c;g.fillRect(x+a,y+b,w,h);};
  const base=-Math.round(ht*0.30);
  if(part>0){R(-4,base,5,2,'#5b3f21');R(-4,base+2,3,1,'#7d5934');}
  if(part>1){R(-4,base-3,6,2,'#4a3218');R(1,base+1,3,2,'#5b3f21');}
  if(part>2){R(-5,base-6,7,3,'#3d2a14');R(-5,base+3,7,1,'#4a3218');}
  if(part>3){R(-5,base-9,8,3,'#33240f');}
}

/* --- les fêlures qui apparaissent sur un rocher frappé --- */
function felures(g,x,y,part){
  const R=(a,b,w,h)=>{g.fillStyle='#4a5057';g.fillRect(x+a,y+b,w,h);};
  if(part>0){R(-2,-14,1,5);R(-1,-10,1,3);}
  if(part>1){R(3,-17,1,4);R(2,-13,1,4);R(-6,-9,3,1);}
  if(part>2){R(-5,-16,1,6);R(5,-11,2,1);R(0,-20,1,4);}
}

/* --- une souche, quand on aura la récolte --- */
function dessinerSouche(g,x,y,gr,neuf){
  const V=VERTS, R=(a,b,w,h,c)=>{g.fillStyle=c;g.fillRect(x+a,y+b,w,h);};
  g.fillStyle=V.ombre;g.beginPath();g.ellipse(x+1,y-1,6,2,0,0,7);g.fill();
  R(-4,-5,9,5,V.tronc);R(-4,-5,9,2,V.troncC);R(-2,-4,5,1,'#a5764a');R(-4,-2,9,2,V.troncO);
}

/* ================= le monde ================= */
const MONDE=1024;                 // en pixels de jeu
const ZOOM=3;                     // chaque pixel du jeu fait 3 pixels d'écran
let SOL=null;

const alea=s=>{const v=Math.sin(s*127.1)*43758.5453;return v-Math.floor(v);};
function construireSol(){
  const c=document.createElement('canvas');c.width=MONDE;c.height=MONDE;
  const g=c.getContext('2d');
  /* fond : le grain fin, tuile de 8 */
  for(let y=0;y<MONDE;y+=8)for(let x=0;x<MONDE;x+=8){
    g.fillStyle='#72a154';g.fillRect(x,y,8,8);
    g.fillStyle='#85b664';g.fillRect(x+1,y+2,1,2);
    g.fillStyle='#5e8a47';g.fillRect(x+5,y+5,1,2);
  }
  /* plaques claires et sombres, posées en blocs */
  const plaque=(cx,cy,col,n)=>{
    for(let i=0;i<n;i++){
      const w=8+Math.floor(alea(cx+i*3)*5)*8, h=8+Math.floor(alea(cy+i*7)*3)*8;
      const x=cx+Math.floor((alea(i*11)-.5)*7)*8, y=cy+Math.floor((alea(i*13)-.5)*5)*8;
      g.fillStyle=col;g.fillRect(x,y,w,h);
    }
  };
  for(let i=0;i<70;i++)plaque(Math.floor(alea(i*1.7)*MONDE/8)*8,Math.floor(alea(i*2.3)*MONDE/8)*8,'#7db35d',4);
  for(let i=0;i<55;i++)plaque(Math.floor(alea(i*3.1)*MONDE/8)*8,Math.floor(alea(i*4.7)*MONDE/8)*8,'#63914b',3);
  for(let i=0;i<22;i++)plaque(Math.floor(alea(i*5.9)*MONDE/8)*8,Math.floor(alea(i*6.1)*MONDE/8)*8,'#a8895c',2);
  /* brins semés par-dessus */
  for(let i=0;i<7000;i++){
    const x=Math.floor(alea(i*1.3)*MONDE), y=Math.floor(alea(i*2.9)*MONDE);
    const v=alea(i*3.7);
    g.fillStyle=v<.4?'#8cc069':(v<.75?'#5e8a47':'#96cb72');
    g.fillRect(x,y,1,2);
  }
  /* fleurs */
  const fl=['#e8d76a','#f0f4f2','#e8607a','#c98fe0'];
  for(let i=0;i<180;i++){
    const x=Math.floor(alea(i*7.7)*MONDE), y=Math.floor(alea(i*8.3)*MONDE);
    g.fillStyle='#5e8a47';g.fillRect(x,y,1,2);
    g.fillStyle=fl[i%4];g.fillRect(x,y-1,2,1);
    g.fillStyle='#ffffff';g.fillRect(x,y-1,1,1);
  }
  return c;
}

/* ================= ce qui pousse sur la carte ================= */
const BORD=56;                                  /* la lisière, infranchissable */
let DECOR=[];                                   /* {t,x,y,gr,cx,cy,cw,ch} */

const TAILLES={
 arbre:  [{w:10,h:7},{w:12,h:8},{w:12,h:8}],   /* seulement le pied du tronc */
 rocher: [{w:22,h:9},{w:26,h:10},{w:30,h:11}],
 buisson:[{w:24,h:9},{w:30,h:10},{w:24,h:9}],
 fleurs: null,                                   /* on marche dedans */
 coffre: [{w:22,h:10}],
 gravats:null,
 souche: null
};

function semerDecor(){
  DECOR=[];
  const A=alea;
  const libre=(x,y,r)=>DECOR.every(o=>Math.hypot(o.x-x,o.y-y)>r);
  const dedans=(x,y)=>x>BORD+24&&x<MONDE-BORD-24&&y>BORD+60&&y<MONDE-BORD-14;
  const depart=(x,y)=>Math.hypot(x-MONDE/2,y-MONDE/2)<90;   /* clairière d'arrivée */

  /* trois bosquets d'arbres, pour donner des repères */
  const bosquets=[[240,260],[790,330],[360,780],[820,790]];
  bosquets.forEach((b,k)=>{
    for(let i=0;i<14;i++){
      const x=Math.round(b[0]+(A(k*9+i)-.5)*230);
      const y=Math.round(b[1]+(A(k*13+i)-.5)*200);
      if(!dedans(x,y)||depart(x,y)||!libre(x,y,46))continue;
      DECOR.push({t:'arbre',x,y,gr:Math.floor(A(k+i*3)*3)});
    }
  });
  /* des arbres isolés, partout ailleurs */
  for(let i=0;i<40;i++){
    const x=Math.round(BORD+20+A(i*1.7)*(MONDE-2*BORD-40));
    const y=Math.round(BORD+40+A(i*2.9)*(MONDE-2*BORD-60));
    if(!dedans(x,y)||depart(x,y)||!libre(x,y,54))continue;
    DECOR.push({t:'arbre',x,y,gr:Math.floor(A(i*5)*3)});
  }
  /* rochers, souvent groupés par deux ou trois */
  for(let i=0;i<26;i++){
    const x=Math.round(BORD+20+A(i*3.3)*(MONDE-2*BORD-40));
    const y=Math.round(BORD+40+A(i*4.1)*(MONDE-2*BORD-60));
    if(!dedans(x,y)||depart(x,y)||!libre(x,y,38))continue;
    DECOR.push({t:'rocher',x,y,gr:Math.floor(A(i*7)*3)});
    if(A(i*11)>.5){
      const x2=x+18+Math.round(A(i*13)*10), y2=y+Math.round((A(i*17)-.5)*14);
      if(dedans(x2,y2)&&!depart(x2,y2)&&libre(x2,y2,20))DECOR.push({t:'rocher',x:x2,y:y2,gr:0});
    }
  }
  /* buissons */
  for(let i=0;i<55;i++){
    const x=Math.round(BORD+18+A(i*5.7)*(MONDE-2*BORD-36));
    const y=Math.round(BORD+34+A(i*6.3)*(MONDE-2*BORD-50));
    if(!dedans(x,y)||depart(x,y)||!libre(x,y,34))continue;
    DECOR.push({t:'buisson',x,y,gr:Math.floor(A(i*9)*2)});
  }
  /* massifs de fleurs : on peut marcher dessus */
  for(let i=0;i<40;i++){
    const x=Math.round(BORD+16+A(i*7.1)*(MONDE-2*BORD-32));
    const y=Math.round(BORD+30+A(i*8.9)*(MONDE-2*BORD-44));
    if(!dedans(x,y)||!libre(x,y,22))continue;
    DECOR.push({t:'fleurs',x,y,gr:0});
  }

  /* les rochers déjà cassés ne repoussent pas */
  const casses=new Set(e.casses||[]);
  DECOR=DECOR.filter(o=>!(o.t==='rocher'&&casses.has(o.x+','+o.y)));
  DECOR=DECOR.filter(o=>{
    if(o.t!=='arbre'||!casses.has('a'+o.x+','+o.y))return true;
    DECOR.push({t:'souche',x:o.x,y:o.y,gr:0});return false;});

  /* on garde la liste triée : ce qui est en bas se dessine par-dessus */
  DECOR.sort((a,b)=>a.y-b.y);
}

/* ---- la lisière : une forêt dense qu'on ne traverse pas ---- */
let LISIERE=null;
function construireLisiere(){
  const c=document.createElement('canvas');
  c.width=MONDE;c.height=MONDE;
  const g=c.getContext('2d');
  const A=alea;
  const bande=(x0,y0,x1,y1)=>{
    for(let i=0;i<520;i++){
      const x=Math.round(x0+A(i*1.3)*(x1-x0));
      const y=Math.round(y0+A(i*2.7)*(y1-y0));
      const t=A(i*3.9);
      /* des couronnes d'arbres serrées, trois valeurs */
      g.fillStyle=t<.34?'#25542a':(t<.68?'#2f6b34':'#1e4522');
      g.fillRect(x-13,y-10,26,20);
      g.fillStyle=t<.5?'#3d7d3f':'#2f6b34';
      g.fillRect(x-9,y-16,18,7);
      g.fillStyle='#4a944a';
      g.fillRect(x-5,y-19,10,4);
      g.fillStyle='#1a3d1e';
      g.fillRect(x-13,y+6,26,4);
    }
  };
  bande(-6,-6,MONDE+6,BORD+8);                  /* haut */
  bande(-6,MONDE-BORD-8,MONDE+6,MONDE+6);       /* bas */
  bande(-6,-6,BORD+8,MONDE+6);                  /* gauche */
  bande(MONDE-BORD-8,-6,MONDE+6,MONDE+6);       /* droite */
  return c;
}

/* ---- si on se retrouve coincé, on cherche la place libre la plus proche ---- */
function degager(x,y){
  if(!bloque(x,y))return [x,y];
  for(let r=6;r<=260;r+=6){
    for(let a=0;a<16;a++){
      const t=a/16*6.283;
      const nx=Math.round(x+Math.cos(t)*r), ny=Math.round(y+Math.sin(t)*r);
      if(!bloque(nx,ny))return [nx,ny];
    }
  }
  return [MONDE/2,MONDE/2];                    /* au pire, la clairière du centre */
}

/* ---- ce qui bloque le passage ---- */
function bloque(x,y){
  if(x<BORD+8||x>MONDE-BORD-8||y<BORD+14||y>MONDE-BORD-4)return true;
  for(const o of DECOR){
    const t=TAILLES[o.t];if(!t)continue;
    const d=t[o.gr||0];
    if(Math.abs(o.x-x)<d.w/2+3&&Math.abs(o.y-y)<d.h/2+2)return true;
  }
  return false;
}

/* ---- dessin, avec la profondeur ---- */
function dessinerDecor(g,camX,camY,VW2,VH2,joueurY,dessinerJoueur){
  let posé=false;
  for(const o of DECOR){
    if(!posé&&o.y>joueurY){dessinerJoueur();posé=true;}    /* le joueur passe devant */
    const x=o.x-camX, y=o.y-camY;
    if(x<-30||y<-50||x>VW2+30||y>VH2+30)continue;
    if(o.t==='arbre'){
      if(o.tombe){
        const t=Math.min(1,(Date.now()-o.tombe)/1000);
        const a=(o.sens||1)*(Math.PI/2)*entreRap(t);     /* il part lentement puis s'abat */
        g.save();g.translate(x,y);g.rotate(a);
        dessinerArbre(g,0,0,o.gr);
        g.restore();
      }else{
        let dx=0;
        if(o.frappe){
          const e2=(Date.now()-o.frappe)/420;
          if(e2<1)dx=Math.exp(-e2*5)*Math.cos(e2*30)*2.4;  /* il vibre sur sa base */
        }
        g.save();g.translate(x,y);
        if(dx)g.transform(1,0,dx*0.03,1,0,0);              /* le tronc se cintre */
        dessinerArbre(g,0,0,o.gr);
        g.restore();
        if(o.coups)entailles(g,x,y,o.coups,[50,64,79][o.gr||0]);
      }
    }
    else if(o.t==='rocher'){
      let dx=0,dy=0,ecrase=0;
      if(o.frappe){
        const e2=(Date.now()-o.frappe)/320;               /* 0 → 1 après le coup */
        if(e2<1){
          const amorti=Math.exp(-e2*6)*Math.cos(e2*26);   /* il vibre puis se calme */
          dx=Math.round(amorti*3);
          dy=Math.round(Math.abs(amorti)*2);
          ecrase=amorti*0.12;
        }
      }
      g.save();
      g.translate(x+dx,y+dy);
      if(ecrase)g.scale(1+ecrase,1-ecrase);              /* il s'écrase à l'impact */
      dessinerRocher(g,0,0,o.gr);
      if(o.coups)felures(g,0,0,o.coups);
      g.restore();
      /* un éclair blanc au moment du coup */
      if(o.frappe&&Date.now()-o.frappe<70){
        g.globalAlpha=.5;g.fillStyle='#fff';
        g.fillRect(x-12,y-22,24,20);g.globalAlpha=1;
      }
    }
    else if(o.t==='buisson'){
      let ec=0;
      if(o.frappe){
        const e2=(Date.now()-o.frappe)/520;
        if(e2<1)ec=Math.exp(-e2*4)*Math.sin(e2*24)*0.14;   /* il tressaute */
      }
      g.save();g.translate(x,y);
      if(ec)g.scale(1+ec,1-ec);
      dessinerBuisson(g,0,0,o.gr,o.cueilli&&Date.now()-o.cueilli<240000);
      g.restore();
    }
    else if(o.t==='fleurs')dessinerFleurs(g,x,y,o.gr);
    else if(o.t==='coffre'){
      let k=e.coffreOuvert?1:0;
      if(e.coffreQuand){const t=Math.min(1,(Date.now()-e.coffreQuand)/500);k=rebond(t)*0.94;}
      dessinerCoffre(g,x,y,!!e.coffreOuvert,k);
    }
    else if(o.t==='souche'){
      let k=1;
      if(o.neuf){const t=Math.min(1,(Date.now()-o.neuf)/400);k=rebond(t);}
      g.save();g.translate(x,y);g.scale(1,k);dessinerSouche(g,0,0);g.restore();
    }
    else if(o.t==='gravats'){
      let k=1;
      if(o.neuf){const t=Math.min(1,(Date.now()-o.neuf)/420);k=rebond(t);}
      g.save();g.translate(x,y);g.scale(1,k);
      g.fillStyle=VERTS.ombre;g.beginPath();g.ellipse(1,-1,9,3,0,0,7);g.fill();
      g.fillStyle='#7b8288';g.fillRect(-7,-4,6,4);g.fillRect(1,-5,6,5);
      g.fillStyle='#8b939a';g.fillRect(-7,-4,6,1);g.fillRect(1,-5,6,1);
      g.fillStyle='#5f666c';g.fillRect(-7,-1,14,1);
      g.restore();
    }
  }
  if(!posé)dessinerJoueur();
}

/* ================= rendu ================= */
const cv=$('cv'), ctx=cv.getContext('2d');
let VW=0,VH=0;
let ECH=ZOOM;
function taille(){
  /* on mesure la fenêtre, pas le canevas : sa taille dépend justement de ce calcul.
     L'échelle reste un nombre entier de pixels physiques pour que l'image ne tremble pas,
     et la vue est arrondie au pixel de jeu supérieur pour couvrir tout l'écran. */
  const dpr=Math.max(1,Math.floor(window.devicePixelRatio||1));
  ECH=dpr*ZOOM;
  const w=window.innerWidth, h=window.innerHeight;
  VW=Math.ceil(w/ZOOM)+1;VH=Math.ceil(h/ZOOM)+1;
  cv.width=VW*ECH;cv.height=VH*ECH;
  /* on affiche la toile à sa taille réelle en points, sans déborder de l'écran */
  cv.style.width=(VW*ZOOM)+'px';cv.style.height=(VH*ZOOM)+'px';
  cv.style.marginLeft=Math.round((w-VW*ZOOM)/2)+'px';
  cv.style.marginTop=Math.round((h-VH*ZOOM)/2)+'px';
  ctx.setTransform(ECH,0,0,ECH,0,0);
  ctx.imageSmoothingEnabled=false;
}
addEventListener('resize',taille);

function preparerMonde(){
  if(SOL)return;
  SOL=construireSol();semerDecor();LISIERE=construireLisiere();
  const [dx,dy]=degager(joueur.x,joueur.y);   /* on ne démarre jamais dans un tronc */
  joueur.x=dx;joueur.y=dy;e.x=dx;e.y=dy;
  poserCoffre();
}
/* le coffre se place à quelques pas de l'endroit où tu te trouves,
   pour que tu tombes dessus dès la première partie */
function poserCoffre(){
  if(e.coffreOuvert)return;                   /* déjà fouillé : plus besoin */
  if(!e.coffre){
    let p=null;
    for(const [dx,dy] of [[46,26],[-46,26],[46,-26],[-46,-26],[0,52],[0,-52],[62,0],[-62,0]]){
      const x=Math.round(joueur.x+dx), y=Math.round(joueur.y+dy);
      if(x>BORD+30&&x<MONDE-BORD-30&&y>BORD+40&&y<MONDE-BORD-20&&!bloque(x,y)){p=[x,y];break;}
    }
    if(!p)p=[Math.round(joueur.x),Math.round(joueur.y+46)];
    e.coffre=p;sauver();
  }
  DECOR=DECOR.filter(o=>Math.hypot(o.x-e.coffre[0],o.y-e.coffre[1])>40||o.t==='fleurs');
  DECOR.push({t:'coffre',x:e.coffre[0],y:e.coffre[1],gr:0});
  DECOR.sort((a,b)=>a.y-b.y);
}
function dessiner(){
  preparerMonde();
  /* La caméra avance en sous-pixels.
     Un pixel du jeu vaut ECH pixels d'écran : on peut donc glisser par pas de 1/ECH,
     ce qui donne un défilement continu au lieu de sauts d'un pixel entier. */
  const camXf=Math.max(0,Math.min(MONDE-VW,joueur.x-VW/2));
  const camYf=Math.max(0,Math.min(MONDE-VH,joueur.y-VH/2));
  const camX=Math.floor(camXf), camY=Math.floor(camYf);
  const fx=Math.round((camXf-camX)*ECH)/ECH;      /* la part fractionnaire, calée sur l'écran */
  const fy=Math.round((camYf-camY)*ECH)/ECH;

  const sx=SECOUSSE>0.01?Math.round((Math.random()-.5)*SECOUSSE*4)*ECH:0;
  const sy=SECOUSSE>0.01?Math.round((Math.random()-.5)*SECOUSSE*4)*ECH:0;
  ctx.setTransform(ECH,0,0,ECH,Math.round(-fx*ECH)+sx,Math.round(-fy*ECH)+sy);
  ctx.imageSmoothingEnabled=false;

  ctx.fillStyle='#2b3a26';ctx.fillRect(0,0,VW+2,VH+2);
  const lw=Math.min(VW+2,MONDE-camX), lh=Math.min(VH+2,MONDE-camY);
  ctx.drawImage(SOL,camX,camY,lw,lh,0,0,lw,lh);

  const px=Math.round((joueur.x-camX)*ECH)/ECH;
  const py=Math.round((joueur.y-camY)*ECH)/ECH;
  /* le décor et le joueur sont mêlés : ce qui est plus bas passe devant */
  dessinerDecor(ctx,camX,camY,VW,VH,joueur.y,
    ()=>sprite(ctx,px,py,e.ap,joueur.dir,joueur.pas,!!joueur.marche));
  dessinerParts(ctx,camX,camY);
  dessinerTextes(ctx,camX,camY);
  /* tant que le coffre n'est pas ouvert, une flèche indique où il est */
  if(!e.coffreOuvert&&e.coffre){
    const cx=e.coffre[0]-camX, cy=e.coffre[1]-camY;
    const dehors=cx<6||cy<10||cx>VW-6||cy>VH-6;
    if(dehors){
      const ax=Math.max(10,Math.min(VW-10,cx)), ay=Math.max(16,Math.min(VH-14,cy));
      const a=Math.atan2(cy-VH/2,cx-VW/2);
      ctx.save();ctx.translate(ax,ay);ctx.rotate(a);
      ctx.fillStyle='#c9a24a';
      ctx.fillRect(-5,-2,7,4);
      ctx.beginPath();ctx.moveTo(2,-5);ctx.lineTo(8,0);ctx.lineTo(2,5);ctx.fill();
      ctx.restore();
    }else{
      const h=Math.round(Math.sin(Date.now()/300)*2);
      ctx.fillStyle='#c9a24a';
      ctx.beginPath();
      ctx.moveTo(cx-4,cy-30+h);ctx.lineTo(cx+4,cy-30+h);ctx.lineTo(cx,cy-24+h);ctx.fill();
    }
  }

  if(LISIERE)ctx.drawImage(LISIERE,camX,camY,lw,lh,0,0,lw,lh);
}

/* ================= déplacement ================= */
const VITESSE=55;                 /* pixels de jeu par seconde, à fond */
let vx=0, vy=0;                   /* vitesse actuelle, pour l'inertie */
let bloqueBord=false;

function majJoueur(dt){
  const n=Math.hypot(joyX,joyY);
  const pousse=Math.min(1,n);
  /* 1. on accélère et on freine au lieu de sauter d'un état à l'autre */
  const cibleX=n>0.16?(joyX/n)*VITESSE*pousse:0;
  const cibleY=n>0.16?(joyY/n)*VITESSE*pousse:0;
  const k=Math.min(1,dt*(n>0.16?11:16));       /* le freinage est plus vif que la relance */
  vx+=(cibleX-vx)*k;
  vy+=(cibleY-vy)*k;

  if(SOL&&bloque(joueur.x,joueur.y)){          /* jamais coincé pour de bon */
    const [dx,dy]=degager(joueur.x,joueur.y);
    joueur.x=dx;joueur.y=dy;
  }
  const v=Math.hypot(vx,vy);
  if(v>1.2){
    /* on essaie chaque axe séparément : on glisse le long des obstacles */
    const nx=joueur.x+vx*dt, ny=joueur.y+vy*dt;
    let ax=joueur.x, ay=joueur.y;
    if(!bloque(nx,joueur.y))ax=nx;
    if(!bloque(ax,ny))ay=ny;
    bloqueBord=(ax===joueur.x&&Math.abs(vx)>2)||(ay===joueur.y&&Math.abs(vy)>2);
    joueur.x=ax;joueur.y=ay;
    /* 2. la cadence suit la vitesse réelle */
    if(!bloqueBord)joueur.pas+=v*dt*0.5;
    /* 3. une zone morte : il ne se retourne que si la direction change nettement */
    const versX=Math.abs(vx)>Math.abs(vy)*1.35;
    const versY=Math.abs(vy)>Math.abs(vx)*1.35;
    if(versX)joueur.dir=vx>0?'droite':'gauche';
    else if(versY)joueur.dir=vy>0?'bas':'haut';
  }else{
    vx=vy=0;bloqueBord=false;
    /* 4. il revient à la pose debout, pieds joints */
    joueur.pas=0;
  }
  joueur.marche=v>4&&!bloqueBord;
  e.x=Math.round(joueur.x);e.y=Math.round(joueur.y);
}

/* ================= le joystick, flottant =================
   Il n'a pas de place fixe : il apparaît là où le pouce se pose,
   dans toute la moitié gauche de l'écran, et s'efface quand on lâche. */
const jc=$('joy'), jg=jc.getContext('2d');
let JDPR=1;
function tailleJoy(){
  JDPR=Math.max(1,Math.min(3,window.devicePixelRatio||1));
  jc.width=Math.round(window.innerWidth*JDPR);
  jc.height=Math.round(window.innerHeight*JDPR);
  jg.setTransform(JDPR,0,0,JDPR,0,0);
}
addEventListener('resize',tailleJoy);
tailleJoy();

const RAYON=52, POUCE=22;
let J={actif:false,id:null,ox:0,oy:0,x:0,y:0,vie:0};

const pointDe=t=>[t.clientX,t.clientY];
function prendre(x,y){
  const limite=window.innerHeight-96;          /* la barre du bas */
  if(y>limite)y=limite;
  J.actif=true;J.ox=x;J.oy=y;J.x=x;J.y=y;J.vie=1;
  joyX=joyY=0;
  try{navigator.vibrate&&navigator.vibrate(8);}catch(x2){}   /* un petit clic sous le doigt */
}
function tirer(x,y){
  const dx=x-J.ox, dy=y-J.oy, d=Math.hypot(dx,dy);
  const a=Math.atan2(dy,dx);
  const m=Math.min(d,RAYON);
  J.x=J.ox+Math.cos(a)*m;J.y=J.oy+Math.sin(a)*m;
  /* si le pouce s'éloigne trop, le manche se déplace avec lui */
  if(d>RAYON){J.ox=x-Math.cos(a)*RAYON;J.oy=y-Math.sin(a)*RAYON;}
  const n=Math.min(1,d/RAYON);
  joyX=d<1?0:Math.cos(a)*n;joyY=d<1?0:Math.sin(a)*n;
  if(Math.hypot(joyX,joyY)<.16)joyX=joyY=0;
}
function lacher(){J.actif=false;J.id=null;joyX=joyY=0;}

/* on n'accepte le doigt que dans la moitié gauche : la droite reste libre */
const pageOuverte=()=>$('pan').classList.contains('on')||$('sacPage').classList.contains('on')
                    ||$('page2').classList.contains('on')||!$('porte').classList.contains('parti');
/* le joystick se prend n'importe où sur la carte, des deux côtés.
   On ne l'ignore que si le doigt touche un bouton de l'interface. */
const surUnBouton=(cible)=>!!(cible&&cible.closest&&cible.closest('#barre,button,#action,#hublot,#pan,#sacPage,#page2,#porte'));
const zoneMarche=(x,y,cible)=>!pageOuverte()&&!surUnBouton(cible);

/* on écoute la page entière, mais on ne prend le doigt que dans la zone de marche :
   ailleurs, le toucher passe normalement aux boutons */
document.addEventListener('touchstart',ev=>{
  for(const t of ev.changedTouches){
    if(J.actif)continue;
    const [x,y]=pointDe(t);
    if(!zoneMarche(x,y,ev.target))continue;
    ev.preventDefault();
    J.id=t.identifier;prendre(x,y);
  }
},{passive:false});
document.addEventListener('touchmove',ev=>{
  for(const t of ev.changedTouches)if(t.identifier===J.id){
    ev.preventDefault();
    const [x,y]=pointDe(t);tirer(x,y);
  }
},{passive:false});
['touchend','touchcancel'].forEach(k=>document.addEventListener(k,ev=>{
  for(const t of ev.changedTouches)if(t.identifier===J.id){ev.preventDefault();lacher();}
},{passive:false}));

function dessinerJoy(dt){
  /* il s'efface doucement quand on lâche */
  if(!J.actif&&J.vie>0)J.vie=Math.max(0,J.vie-dt*5);
  jg.clearRect(0,0,window.innerWidth,window.innerHeight);
  if(J.vie<=0)return;
  jg.save();
  jg.globalAlpha=J.vie;
  /* la couronne */
  jg.beginPath();jg.arc(J.ox,J.oy,RAYON,0,7);
  const f=jg.createRadialGradient(J.ox,J.oy-14,6,J.ox,J.oy,RAYON);
  f.addColorStop(0,'rgba(240,246,238,.26)');f.addColorStop(1,'rgba(200,212,198,.12)');
  jg.fillStyle=f;jg.fill();
  jg.lineWidth=2.5;jg.strokeStyle='rgba(240,246,238,.38)';jg.stroke();
  /* le sens, en léger */
  const d=Math.hypot(J.x-J.ox,J.y-J.oy);
  if(d>6){
    const a=Math.atan2(J.y-J.oy,J.x-J.ox);
    jg.beginPath();
    jg.arc(J.ox,J.oy,RAYON-2,a-0.5,a+0.5);
    jg.lineWidth=4;jg.strokeStyle='rgba(169,232,138,.5)';jg.stroke();
  }
  /* le manche */
  jg.beginPath();jg.arc(J.x,J.y+3,POUCE,0,7);jg.fillStyle='rgba(10,18,12,.22)';jg.fill();
  const k=jg.createRadialGradient(J.x-5,J.y-8,3,J.x,J.y,POUCE+1);
  if(d>6){k.addColorStop(0,'#a9e88a');k.addColorStop(1,'#3f7d4a');}
  else{k.addColorStop(0,'#f4f7f0');k.addColorStop(1,'#c9d2c2');}
  jg.beginPath();jg.arc(J.x,J.y,POUCE,0,7);jg.fillStyle=k;jg.fill();
  jg.lineWidth=2.5;jg.strokeStyle=d>6?'#2c6b32':'rgba(40,50,40,.4)';jg.stroke();
  jg.restore();
}

function dessinerApercu(){
  const c=$('vg-c');if(!c)return;
  const g=c.getContext('2d');
  g.imageSmoothingEnabled=false;
  const Z=4, L=Math.round(c.width/Z), H2=Math.round(c.height/Z);
  g.setTransform(Z,0,0,Z,0,0);
  g.clearRect(0,0,L,H2);
  sprite(g,L>>1,H2-4,LOOK.ap,'bas',0,false);   /* immobile, de face */
}
