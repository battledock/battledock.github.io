<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>Mon cinéma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css?v=b1e4da88">
  <style>
    /* Style minimal du voile : il doit couvrir l'écran avant même
       que base.css soit arrivé, sinon on aperçoit la page nue. */
    body{margin:0;background:#0a0406}
    .contenu,.entete,.navBas{opacity:0}
    #voileChargement{position:fixed;inset:0;z-index:500;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:20px;
      background:radial-gradient(ellipse at 50% 42%,#2a1018,#0a0406 72%)}
  </style>
</head>
<body>

<div class="voileChargement" id="voileChargement" role="status" aria-live="polite">
  <svg class="vcBobine" viewBox="0 0 74 74" aria-hidden="true">
    <g class="roue">
      <circle cx="37" cy="37" r="32" fill="none" stroke="#caa24a" stroke-width="3"/>
      <circle cx="37" cy="37" r="7" fill="#caa24a"/>
      <g fill="#caa24a" opacity=".85">
        <circle cx="37" cy="16" r="5.4"/><circle cx="55" cy="47" r="5.4"/><circle cx="19" cy="47" r="5.4"/>
      </g>
    </g>
    <circle class="pellicule" cx="37" cy="37" r="32" fill="none"
      stroke="#f7dd9a" stroke-width="1.6" opacity=".6"/>
  </svg>
  <div class="vcNom">Séance</div>
  <div class="vcTexte">On allume le projecteur…</div>
  <div class="vcPiste"><i></i></div>
</div>

<main class="contenu accueilClair">

  <!-- 1. le cinéma, dehors et dedans -->
  <div class="carteCine">
    <div class="vueCine" id="vueCine"></div>
    <div class="vueEtat" id="vueEtat"></div>
    <div class="vueStyle" id="vueStyle"></div>
    <nav class="vueOnglets" id="vueOnglets" role="tablist">
      <span class="vueCurseur" id="vueCurseur" aria-hidden="true"></span>
      <button role="tab" class="on" data-v="facade" aria-selected="true">Dehors</button>
      <button role="tab" data-v="hall" aria-selected="false">Le hall</button>
      <button role="tab" data-v="salle" aria-selected="false">La salle</button>
    </nav>
  </div>

  <!-- 2. l'action du moment, posée sous le cinéma -->
  <button class="actionGrande" id="actionPrincipale"></button>

  <!-- 3. ce qui sort mercredi -->
  <div id="bandeauSorties"></div>

  <!-- 4. Bob, une phrase -->
  <div class="bobLigne">
    <span class="bobRond"><svg viewBox="30 40 60 60" aria-label="Bob">
      <circle cx="60" cy="70" r="26" fill="#f0c9a0"/>
      <path d="M40 78 Q50 86 60 79 Q70 86 80 78 Q72 92 60 84 Q48 92 40 78" fill="#4a3527"/>
      <path d="M44 60 Q51 55 57 59 M63 59 Q69 55 76 60" stroke="#4a3527" stroke-width="4"
        fill="none" stroke-linecap="round"/>
      <circle cx="51" cy="66" r="2.6" fill="#1c1210"/><circle cx="69" cy="66" r="2.6" fill="#1c1210"/>
      <path d="M34 56 Q60 34 86 56 L86 50 Q60 28 34 50 Z" fill="#571520"/>
      <rect x="52" y="44" width="16" height="7" rx="2" fill="#e8b84b"/>
    </svg></span>
    <p id="bulleTexteAccueil">…</p>
  </div>

  <!-- 4. trois chiffres, sans phrase -->
  <div class="chiffres" id="chiffres"></div>

  <!-- 5. les raccourcis -->
  <div class="raccourcis" id="raccourcis"></div>

  <div id="bandeauEvenement"></div>
</main>

<script type="module" src="js/pages/jeu.js?v=b1e4da88"></script>
</body>
</html>
