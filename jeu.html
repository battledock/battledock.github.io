<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Battle Dock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:'Nunito',sans-serif;background:#fefcf8;color:#2a1a0a}
.app{height:100dvh;display:flex;flex-direction:column}

/* Resources strip */
.res-strip{display:flex;gap:5px;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top));background:#fff;border-bottom:1px solid rgba(0,0,0,.03);flex-shrink:0}
.res-item{flex:1;display:flex;align-items:center;gap:4px;border-radius:10px;padding:5px 8px;font-family:'Oswald',sans-serif;font-size:.75rem;font-weight:600}
.res-item .ri{font-size:.8rem}
.res-gold{background:linear-gradient(135deg,#fff8e8,#fff0d0);border:1px solid rgba(220,180,60,.12);color:#a08020}
.res-energy{background:linear-gradient(135deg,#f0f8ff,#e0f0ff);border:1px solid rgba(60,130,220,.08);color:#3070b0}
.res-rep{background:linear-gradient(135deg,#f0fff4,#e0ffe8);border:1px solid rgba(34,197,94,.08);color:#1a8048}

/* Switcher */
.switcher{display:flex;gap:6px;padding:8px 14px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex-shrink:0;background:#fff;border-bottom:1px solid rgba(0,0,0,.02)}
.switcher::-webkit-scrollbar{display:none}
.sw-q{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:10px;cursor:pointer;-webkit-tap-highlight-color:transparent;border:2px solid rgba(0,0,0,.03);transition:.2s}
.sw-q.on{border-color:#c07840;background:rgba(192,120,64,.04)}
.sw-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sw-name{font-size:.55rem;font-weight:900;color:#2a1a0a}
.sw-notif{min-width:14px;height:14px;border-radius:50%;background:#e04040;color:#fff;font-size:.32rem;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 3px}

/* Scroll */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:70px}
.scroll::-webkit-scrollbar{display:none}

/* Quartier header */
.q-head{display:flex;align-items:center;gap:12px;padding:14px 16px;margin:8px 14px;background:#fff;border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.02)}
.q-color{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0}
.q-info{flex:1}
.q-name{font-family:'Oswald',sans-serif;font-size:1rem;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.q-type{font-size:.45rem;font-weight:800;color:rgba(42,26,10,.2)}
.q-bons{display:flex;gap:3px;margin-top:3px}
.q-bon{font-size:.35rem;font-weight:900;padding:2px 7px;border-radius:100px;background:rgba(192,120,64,.06);color:#a06830}

/* Stats */
.stats{display:flex;gap:5px;padding:0 14px;margin-bottom:10px}
.stat{flex:1;background:#fff;border-radius:12px;padding:8px 4px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.02)}
.stat-e{font-size:.75rem}
.stat-v{font-family:'Oswald',sans-serif;font-size:.78rem;font-weight:600;margin-top:1px}
.stat-l{font-size:.3rem;font-weight:900;color:rgba(42,26,10,.12);letter-spacing:.5px;text-transform:uppercase}
.stat-bar{width:80%;height:3px;margin:4px auto 0;background:rgba(0,0,0,.03);border-radius:2px;overflow:hidden}
.stat-fill{height:100%;border-radius:2px;transition:width .5s}

/* Section label */
.sec-l{font-size:.45rem;font-weight:900;color:rgba(42,26,10,.08);letter-spacing:2px;text-transform:uppercase;padding:8px 18px 4px}

/* COLLECT - big gold card */
.collect-card{margin:0 14px 8px;background:linear-gradient(135deg,#ffe8c0,#ffd890);border-radius:16px;padding:16px;text-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .1s;box-shadow:0 4px 14px rgba(220,180,60,.12);position:relative;overflow:hidden}
.collect-card:active{transform:scale(.98)}
.collect-card.empty{opacity:.4;pointer-events:none}
.cc-emoji{font-size:1.8rem}
.cc-val{font-family:'Oswald',sans-serif;font-size:1.2rem;font-weight:700;color:#8a6820;margin-top:2px}
.cc-sub{font-size:.42rem;font-weight:800;color:rgba(138,104,32,.25);margin-top:2px}
.cc-shimmer{position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);animation:shimmer 3s infinite}
@keyframes shimmer{0%{left:-100%}100%{left:200%}}

/* EVENT */
.event{margin:0 14px 8px;background:linear-gradient(135deg,#fff5f0,#fff);border:2px solid rgba(224,64,64,.06);border-radius:16px;padding:14px;position:relative}
.ev-timer{position:absolute;top:10px;right:12px;font-size:.42rem;font-weight:900;color:#e04040;background:rgba(224,64,64,.06);padding:3px 10px;border-radius:100px}
.ev-emoji{font-size:1.6rem;margin-bottom:4px}
.ev-title{font-family:'Oswald',sans-serif;font-size:.9rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:3px}
.ev-desc{font-size:.52rem;font-weight:700;color:rgba(42,26,10,.22);line-height:1.4;margin-bottom:12px}
.ev-btns{display:flex;gap:6px}
.ev-btn{flex:1;padding:11px;border-radius:12px;text-align:center;font-family:inherit;font-weight:900;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .1s}
.ev-btn:active{transform:scale(.96)}
.ev-btn.yes{background:linear-gradient(135deg,#22c55e,#1a9a48);color:#fff;font-size:.55rem;box-shadow:0 3px 10px rgba(34,197,94,.12)}
.ev-btn .cost{display:block;font-size:.4rem;opacity:.6;margin-top:2px}
.ev-btn.no{background:rgba(42,26,10,.03);color:rgba(42,26,10,.18);font-size:.5rem}
.no-items{text-align:center;padding:12px;font-size:.5rem;font-weight:700;color:rgba(42,26,10,.08)}

/* DEMAND */
.dem{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:10px 12px;margin:0 14px 6px;box-shadow:0 1px 4px rgba(0,0,0,.02)}
.dem-emoji{font-size:1.3rem;flex-shrink:0}
.dem-info{flex:1}
.dem-title{font-size:.6rem;font-weight:900}
.dem-sub{font-size:.38rem;font-weight:700;color:rgba(42,26,10,.15);margin-top:1px}
.dem-timer{font-size:.35rem;font-weight:900;color:#e04040;margin-top:3px}
.dem-urg{display:flex;gap:2px;margin-top:3px}
.dem-dot{width:16px;height:3px;border-radius:2px}
.dem-btn{padding:7px 12px;border-radius:10px;font-family:inherit;font-size:.5rem;font-weight:900;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent;color:#fff;background:#c07840;box-shadow:0 2px 6px rgba(192,120,64,.1)}
.dem-btn:active{transform:scale(.95)}

/* TAX */
.tax{margin:0 14px 8px;background:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.02)}
.tax-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.tax-emoji{font-size:1.2rem}
.tax-info{flex:1}
.tax-title{font-size:.62rem;font-weight:900}
.tax-sub{font-size:.38rem;font-weight:700;color:rgba(42,26,10,.15);margin-top:1px}
.tax-pct{font-family:'Oswald',sans-serif;font-size:1.3rem;font-weight:700;color:#c07840}
.tax-slider{-webkit-appearance:none;width:100%;height:8px;border-radius:4px;background:linear-gradient(90deg,#ece4d8,#c07840);outline:none}
.tax-slider::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid #c07840;box-shadow:0 2px 8px rgba(0,0,0,.1);cursor:pointer}
.tax-res{display:flex;gap:6px;margin-top:8px}
.tax-r{flex:1;text-align:center;padding:6px;border-radius:8px;font-size:.5rem;font-weight:900}
.tax-r.pos{background:rgba(34,197,94,.05);color:#1a8048}
.tax-r.neg{background:rgba(224,64,64,.04);color:#c03030}

/* BUILDINGS */
.builds-scroll{display:flex;gap:8px;padding:0 14px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin-bottom:8px}
.builds-scroll::-webkit-scrollbar{display:none}
.bld{flex-shrink:0;width:105px;background:#fff;border-radius:14px;padding:10px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.02);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .1s}
.bld:active{transform:scale(.96)}
.bld.building{border:2px solid rgba(48,112,176,.12);position:relative}
.bld-emoji{font-size:1.4rem;margin-bottom:3px}
.bld-name{font-size:.55rem;font-weight:900}
.bld-dots{display:flex;gap:3px;justify-content:center;margin:5px 0}
.bld-d{width:7px;height:7px;border-radius:2px;background:#ece4d8}
.bld-d.on{background:#c07840}
.bld-up{font-size:.42rem;font-weight:900;color:#fff;padding:4px 10px;border-radius:6px;display:inline-block}
.bld-up.upgrade{background:#c07840}
.bld-up.build-new{background:#3070b0}
.bld-up.max{background:rgba(42,26,10,.05);color:rgba(42,26,10,.12)}
.bld-up.in-progress{background:rgba(48,112,176,.08);color:#3070b0}
.bld-timer{font-size:.35rem;font-weight:900;color:#3070b0;margin-top:3px}

/* Nav */
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid rgba(0,0,0,.03);display:flex;padding:6px 0;padding-bottom:calc(6px + env(safe-area-inset-bottom));z-index:10}
.nav-i{flex:1;text-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.nav-ic{font-size:.95rem}
.nav-lb{font-size:.3rem;font-weight:900;color:rgba(42,26,10,.1);margin-top:1px}
.nav-i.on .nav-lb{color:#c07840}

/* Toast */
.toast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-80px);background:#2a1a0a;color:#fff;border-radius:12px;padding:10px 20px;font-size:.6rem;font-weight:900;box-shadow:0 4px 20px rgba(0,0,0,.12);z-index:20;transition:transform .3s;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}

/* Loading */
.loading{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px}
.loading-text{font-size:.65rem;font-weight:700;color:rgba(42,26,10,.15)}

/* Login notifications */
.login-alerts{margin:0 14px 8px}
.login-alert{display:flex;align-items:center;gap:8px;background:rgba(48,112,176,.04);border:1px solid rgba(48,112,176,.06);border-radius:12px;padding:8px 12px;margin-bottom:4px;font-size:.5rem;font-weight:800;color:#3070b0}
.login-alert.warn{background:rgba(224,64,64,.04);border-color:rgba(224,64,64,.06);color:#c03030}
.login-alert.good{background:rgba(34,197,94,.04);border-color:rgba(34,197,94,.06);color:#1a8048}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="loading"><div class="loading-text">Chargement...</div></div>
</div>
<div class="toast" id="toast"></div>
<div class="nav">
  <div class="nav-i on"><div class="nav-ic">🏘️</div><div class="nav-lb">Quartier</div></div>
  <div class="nav-i"><div class="nav-ic">🗺️</div><div class="nav-lb">Carte</div></div>
  <div class="nav-i"><div class="nav-ic">⚔️</div><div class="nav-lb">Attaque</div></div>
  <div class="nav-i"><div class="nav-ic">🏆</div><div class="nav-lb">Rang</div></div>
  <div class="nav-i"><div class="nav-ic">👤</div><div class="nav-lb">Profil</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL='https://snqynahqxqjmdigbmiag.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNucXluYWhxeHFqbWRpZ2JtaWFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxNzQyMTksImV4cCI6MjA5OTc1MDIxOX0.eLMtvtEtvrfSSSi7-SCgo_wGMLWbhWpLSLM49QwpqY8';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);

const buildingMeta={
  logements:{e:'🏠',n:'Logements'},theatre:{e:'🎭',n:'Théâtre'},musee:{e:'🏛️',n:'Musée'},caserne:{e:'🛡️',n:'Caserne'},
  concert:{e:'🎤',n:'Concert'},galerie:{e:'🖼️',n:'Galerie'},bar:{e:'🍻',n:'Bar'},streetart:{e:'🎨',n:'Street Art'},
  marche:{e:'🛒',n:'Marché'},hammam:{e:'🛁',n:'Hammam'},port:{e:'⚓',n:'Port'},plage:{e:'🏖️',n:'Plage'},
  guet:{e:'🔭',n:'Tour de guet'},poissons:{e:'🐟',n:'Poissonnerie'},entrepot:{e:'📦',n:'Entrepôt'},bureaux:{e:'🏢',n:'Bureaux'},
  dock:{e:'🚢',n:'Dock'},scene:{e:'🎪',n:'Scène'},skatepark:{e:'🛹',n:'Skatepark'},gare:{e:'🚂',n:'Gare'},
  hotel:{e:'🏨',n:'Hôtel'},surf:{e:'🏄',n:'Surf'},restaurant:{e:'🍽️',n:'Restaurant'},ecole:{e:'🏫',n:'École'},
  parc:{e:'🌳',n:'Parc'},voilier:{e:'⛵',n:'Club nautique'}
};
const buildCosts=[0,150,280,450,700,1000];
const statColors={satisfaction:'#22c55e',securite:'#f0a040',infra:'#8b5cf6',population:'#3b82f6'};

let player=null,quartiers=[],activeQ=null,events=[],demands=[],loginAlerts=[];

(async()=>{
  const{data:{session}}=await sb.auth.getSession();
  if(!session){window.location.href='index.html';return}

  const{data:p}=await sb.from('players').select('*').eq('id',session.user.id).maybeSingle();
  if(!p||!p.onboarding_done){window.location.href='profil.html';return}
  player=p;

  // Process expired stuff
  const{data:alerts}=await sb.rpc('process_login',{p_player_id:player.id});
  if(alerts&&alerts.length) loginAlerts=alerts;

  // Refresh player data after processing
  const{data:p2}=await sb.from('players').select('*').eq('id',player.id).maybeSingle();
  if(p2) player=p2;

  const{data:qs}=await sb.from('player_quartiers').select('*').eq('player_id',player.id);
  quartiers=qs||[];

  if(!quartiers.length){
    document.getElementById('app').innerHTML='<div class="loading"><div style="font-size:1.5rem">⚠️</div><div class="loading-text">Aucun quartier trouvé</div><button onclick="location.href=\'profil.html\'" style="margin-top:8px;padding:10px 20px;background:#c07840;color:#fff;border:none;border-radius:8px;font-family:inherit;font-size:.7rem;font-weight:900;cursor:pointer">Réessayer</button></div>';
    return;
  }

  activeQ=quartiers[0];
  await loadQuartierData();
  render();
})();

async function loadQuartierData(){
  const{data:ev}=await sb.from('quartier_events').select('*').eq('quartier_id',activeQ.id).eq('resolved',false).order('created_at',{ascending:false});
  events=ev||[];
  const{data:dm}=await sb.from('quartier_demands').select('*').eq('quartier_id',activeQ.id).eq('resolved',false).order('urgency',{ascending:false});
  demands=dm||[];
}

function timeLeft(dt){
  const diff=new Date(dt)-Date.now();
  if(diff<=0)return'Expiré';
  const h=Math.floor(diff/3600000);const m=Math.floor((diff%3600000)/60000);
  return h>0?h+'h'+String(m).padStart(2,'0'):m+'min';
}

function render(){
  const app=document.getElementById('app');
  let h='';

  // Resources
  h+=`<div class="res-strip">
    <div class="res-item res-gold"><span class="ri">💰</span><span>${player.or_total}</span></div>
    <div class="res-item res-energy"><span class="ri">⚡</span><span>${player.energie}/${player.energie_max}</span></div>
    <div class="res-item res-rep"><span class="ri">⭐</span><span>${player.reputation}%</span></div>
  </div>`;

  // Switcher
  if(quartiers.length>1){
    h+=`<div class="switcher">`;
    quartiers.forEach(q=>{
      h+=`<div class="sw-q ${q.id===activeQ.id?'on':''}" onclick="switchQ('${q.id}')">
        <div class="sw-dot" style="background:${q.color_bg}"></div>
        <div class="sw-name">${q.nom}</div>
      </div>`;
    });
    h+=`</div>`;
  }

  h+=`<div class="scroll">`;

  // Login alerts
  if(loginAlerts.length){
    h+=`<div class="login-alerts">`;
    loginAlerts.forEach(a=>{
      if(a.type==='energy') h+=`<div class="login-alert good">⚡ +${a.gained} énergie récupérée</div>`;
      if(a.type==='event_expired') h+=`<div class="login-alert warn">⏰ "${a.title}" a expiré</div>`;
      if(a.type==='demand_expired') h+=`<div class="login-alert warn">📢 "${a.title}" ignorée (${a.effect}%)</div>`;
      if(a.type==='build_done') h+=`<div class="login-alert good">🏗️ ${a.building} terminé à ${a.quartier} !</div>`;
    });
    h+=`</div>`;
  }

  // Quartier header
  h+=`<div class="q-head">
    <div class="q-color" style="background:${activeQ.color_bg}">🏘️</div>
    <div class="q-info">
      <div class="q-name">${activeQ.nom}</div>
      <div class="q-type">${activeQ.type_quartier} · ${activeQ.population} habitants</div>
      <div class="q-bons">${activeQ.bonus_1?`<div class="q-bon">${activeQ.bonus_1}</div>`:''}${activeQ.bonus_2?`<div class="q-bon">${activeQ.bonus_2}</div>`:''}</div>
    </div>
  </div>`;

  // Stats
  h+=`<div class="stats">
    <div class="stat"><div class="stat-e">😊</div><div class="stat-v" style="color:#22c55e">${activeQ.satisfaction}%</div><div class="stat-l">Satisf.</div><div class="stat-bar"><div class="stat-fill" style="width:${activeQ.satisfaction}%;background:#22c55e"></div></div></div>
    <div class="stat"><div class="stat-e">🛡️</div><div class="stat-v" style="color:#f0a040">${activeQ.securite}%</div><div class="stat-l">Sécu.</div><div class="stat-bar"><div class="stat-fill" style="width:${activeQ.securite}%;background:#f0a040"></div></div></div>
    <div class="stat"><div class="stat-e">🏗️</div><div class="stat-v" style="color:#8b5cf6">${activeQ.infra}%</div><div class="stat-l">Infra</div><div class="stat-bar"><div class="stat-fill" style="width:${activeQ.infra}%;background:#8b5cf6"></div></div></div>
  </div>`;

  // Collect
  const hoursSince=((Date.now()-new Date(activeQ.last_collect).getTime())/3600000);
  const goldAvail=Math.max(0,Math.floor(activeQ.population*activeQ.tax_rate/100*hoursSince*0.1));
  h+=`<div class="sec-l">💰 Revenus</div>`;
  h+=`<div class="collect-card ${goldAvail<1?'empty':''}" onclick="collectGold()">
    <div class="cc-shimmer"></div><div class="cc-emoji">💰</div>
    <div class="cc-val">${goldAvail>0?'+'+goldAvail+' or à collecter':'Rien à collecter'}</div>
    <div class="cc-sub">${goldAvail>0?'Appuie pour récupérer':'Reviens plus tard'}</div>
  </div>`;

  // Events
  if(events.length){
    h+=`<div class="sec-l">⚠️ Événements</div>`;
    events.forEach(ev=>{
      h+=`<div class="event">
        <div class="ev-timer">⏱ ${timeLeft(ev.expires_at)}</div>
        <div class="ev-emoji">${ev.emoji}</div>
        <div class="ev-title">${ev.title}</div>
        <div class="ev-desc">${ev.description}</div>
        <div class="ev-btns">
          <div class="ev-btn yes" onclick="resolveEvent('${ev.id}','a')">${ev.choice_a_label}<span class="cost">${ev.choice_a_cost>0?'-'+ev.choice_a_cost+' or':'Gratuit'}</span></div>
          <div class="ev-btn no" onclick="resolveEvent('${ev.id}','b')">${ev.choice_b_label}</div>
        </div>
      </div>`;
    });
  }

  // Demands
  if(demands.length){
    h+=`<div class="sec-l">📢 Demandes</div>`;
    demands.forEach(d=>{
      const urgColors=['#22c55e','#f0a040','#e04040'];
      const uc=urgColors[Math.min(d.urgency-1,2)];
      h+=`<div class="dem">
        <div class="dem-emoji">${d.emoji}</div>
        <div class="dem-info">
          <div class="dem-title">${d.title}</div>
          <div class="dem-sub">Ignorer = ${d.ignore_value}% ${d.ignore_field}</div>
          <div class="dem-timer">⏱ ${timeLeft(d.expires_at)}</div>
          <div class="dem-urg">${[1,2,3,4,5].map(i=>`<div class="dem-dot" style="background:${i<=d.urgency?uc:'#ece4d8'}"></div>`).join('')}</div>
        </div>
        <div class="dem-btn" onclick="resolveDemand('${d.id}',true)">${d.cost} 💰</div>
      </div>`;
    });
  }

  if(!events.length&&!demands.length) h+=`<div class="no-items">Aucun événement ni demande pour le moment 🎉</div>`;

  // Tax
  h+=`<div class="sec-l">💸 Imposition</div>
  <div class="tax">
    <div class="tax-head"><div class="tax-emoji">💸</div><div class="tax-info"><div class="tax-title">Taux d'imposition</div><div class="tax-sub">Plus tu taxes, plus tu gagnes — mais tes habitants râlent</div></div><div class="tax-pct" id="taxVal">${activeQ.tax_rate}%</div></div>
    <input type="range" class="tax-slider" min="0" max="40" value="${activeQ.tax_rate}" oninput="updateTaxUI(this.value)" onchange="saveTax(this.value)">
    <div class="tax-res" id="taxRes"></div>
  </div>`;

  // Buildings
  const blds=activeQ.buildings||{};
  h+=`<div class="sec-l">🏗️ Bâtiments</div><div class="builds-scroll">`;
  Object.keys(blds).forEach(bid=>{
    const lvl=blds[bid]||0;
    const meta=buildingMeta[bid]||{e:'🏠',n:bid};
    const cost=buildCosts[Math.min(lvl,5)];
    const isBuilding=activeQ.building_in_progress===bid&&activeQ.building_finish_at&&new Date(activeQ.building_finish_at)>new Date();
    let btnClass,btnText,timer='';
    if(isBuilding){btnClass='in-progress';btnText='🔨 En cours';timer=`<div class="bld-timer">⏱ ${timeLeft(activeQ.building_finish_at)}</div>`}
    else if(lvl>=5){btnClass='max';btnText='MAX'}
    else if(lvl===0){btnClass='build-new';btnText='+ '+cost+' 💰'}
    else{btnClass='upgrade';btnText='↑ '+cost+' 💰'}
    h+=`<div class="bld ${isBuilding?'building':''}" onclick="${isBuilding?'':`upgradeBld('${bid}',${cost})`}">
      <div class="bld-emoji">${meta.e}</div><div class="bld-name">${meta.n}</div>
      <div class="bld-dots">${[1,2,3,4,5].map(i=>`<div class="bld-d ${i<=lvl?'on':''}"></div>`).join('')}</div>
      <div class="bld-up ${btnClass}">${btnText}</div>${timer}
    </div>`;
  });
  h+=`</div>`;

  h+=`</div>`; // scroll
  app.innerHTML=h;
  updateTaxUI(activeQ.tax_rate);

  // Clear login alerts after first render
  loginAlerts=[];
}

function updateTaxUI(v){
  const el=document.getElementById('taxVal');if(el)el.textContent=v+'%';
  const income=Math.round(v*(activeQ.population/1000)*0.5);
  const satisf=Math.round(v*0.2);
  const r=document.getElementById('taxRes');
  if(r)r.innerHTML=`<div class="tax-r pos">💰 +${income} or/h</div><div class="tax-r ${satisf>5?'neg':'pos'}">😊 ${satisf>0?'-'+satisf:'0'}% satisf.</div>`;
}

let taxTimeout;
function saveTax(v){
  clearTimeout(taxTimeout);
  taxTimeout=setTimeout(async()=>{
    await sb.rpc('set_tax_rate',{p_quartier_id:activeQ.id,p_rate:parseInt(v)});
    activeQ.tax_rate=parseInt(v);
    toast('Taux mis à jour');
  },500);
}

async function collectGold(){
  const{data}=await sb.rpc('collect_gold',{p_quartier_id:activeQ.id});
  if(data&&data.gold){
    player.or_total=data.total;activeQ.last_collect=new Date().toISOString();
    toast(`+${data.gold} or collecté !`);render();
  }else if(data&&data.error==='too_soon'){toast('Trop tôt pour collecter')}
}

async function upgradeBld(bid,cost){
  if(player.or_total<cost){toast('Pas assez d\'or');return}
  const{data}=await sb.rpc('upgrade_building',{p_quartier_id:activeQ.id,p_building:bid,p_cost:cost});
  if(data&&data.error==='already_building'){toast('Construction en cours !');return}
  if(data&&data.error==='not_enough_gold'){toast('Pas assez d\'or');return}
  if(data&&data.error==='max_level'){toast('Niveau max');return}
  if(data&&data.finish_at){
    activeQ.building_in_progress=bid;
    activeQ.building_finish_at=data.finish_at;
    player.or_total=data.remaining_gold;
    toast(`${buildingMeta[bid]?.n||bid} en construction ! (${data.minutes}min)`);render();
  }
}

async function resolveEvent(id,choice){
  const{data}=await sb.rpc('resolve_event',{p_event_id:id,p_choice:choice});
  if(data&&data.ok){await refresh();toast('Choix appliqué');render()}
  else if(data&&data.error==='not_enough_gold'){toast('Pas assez d\'or')}
}

async function resolveDemand(id,accept){
  const{data}=await sb.rpc('resolve_demand',{p_demand_id:id,p_accept:accept});
  if(data&&data.ok){await refresh();toast(accept?'Demande acceptée':'Demande ignorée');render()}
  else if(data&&data.error==='not_enough_gold'){toast('Pas assez d\'or')}
}

async function refresh(){
  const{data:q}=await sb.from('player_quartiers').select('*').eq('id',activeQ.id).maybeSingle();
  if(q){activeQ=q;const idx=quartiers.findIndex(x=>x.id===q.id);if(idx>=0)quartiers[idx]=q}
  const{data:p}=await sb.from('players').select('*').eq('id',player.id).maybeSingle();
  if(p)player=p;
  await loadQuartierData();
}

async function switchQ(qid){
  activeQ=quartiers.find(q=>q.id===qid);
  await loadQuartierData();render();
}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
</script>
</body>
</html>
