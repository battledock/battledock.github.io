<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#24406b">
<title>Ta ferme</title>
<style>
:root{
  --nuit:#24406b; --nuit-f:#14213f;
  --vert:#2f6b1f; --vert-c:#63a84a; --vert-p:#eaf4e6;
  --or:#b5822a; --or-p:#f7efdd;
  --carte:#fffdf9; --fond:#f4f2ec; --encre:#1e2735; --doux:#93a1b5; --pale:#a5adba; --filet:#e4e2d8;
  --terre:#b98d55; --terre-f:#9a7342;
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{min-height:100vh;min-height:100dvh;background:var(--fond);color:var(--encre);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font-family:inherit;font-size:15px;border:0;background:none;color:inherit;cursor:pointer}
.app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}

/* ---------- barre du haut ---------- */
.haut{flex:0 0 auto;background:linear-gradient(180deg,#2b4a78,var(--nuit));color:#f7fafc;
  padding:calc(10px + env(safe-area-inset-top)) 14px 12px}
.haut .ligne{display:flex;align-items:center;gap:10px}
.haut h1{font:400 17px/1 Georgia,serif;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pastille{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border-radius:999px;
  padding:5px 11px;font-size:13px;font-weight:600}
.pastille svg{flex:0 0 auto}
.xp{display:flex;align-items:center;gap:9px;margin-top:9px}
.xp .barre{flex:1;height:6px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden}
.xp .barre i{display:block;height:100%;background:linear-gradient(90deg,var(--vert-c),#8ed36a)}
.xp .niv{font-size:11px;color:#b7c4d6;font-weight:600;letter-spacing:.4px}

/* ---------- contenu ---------- */
.corps{flex:1;min-height:0;overflow-y:auto;padding:14px 14px 96px}
.titre{font:600 12px system-ui;letter-spacing:1.6px;color:var(--doux);margin:2px 0 10px}

/* la ferme */
.ferme{background:linear-gradient(180deg,#dfeef5,#eef3e6 46%,#e8eddb);border:1px solid var(--filet);
  border-radius:20px;padding:14px;margin-bottom:16px}
.parcelles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.parc{position:relative;aspect-ratio:1/.88;border-radius:14px;overflow:hidden;border:1px solid #a98a5f;
  background:repeating-linear-gradient(96deg,var(--terre) 0 7px,var(--terre-f) 7px 14px);
  box-shadow:inset 0 -8px 14px rgba(90,60,25,.18);display:flex;align-items:flex-end;justify-content:center}
.parc.libre{background:repeating-linear-gradient(96deg,#c8a271 0 7px,#b8955f 7px 14px)}
.parc.verrou{background:#e9e6dc;border:1px dashed #b9b3a4;box-shadow:none;align-items:center}
.parc svg{display:block;margin-bottom:6px}
.parc .jauge{position:absolute;left:8px;right:8px;bottom:6px;height:5px;border-radius:3px;
  background:rgba(40,28,12,.35);overflow:hidden}
.parc .jauge i{display:block;height:100%;background:linear-gradient(90deg,#9fd07a,var(--vert-c))}
.parc .pret{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;
  background:var(--vert-c);box-shadow:0 0 0 3px rgba(99,168,74,.28)}
.parc .txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font:600 11.5px system-ui;color:#6b5a3c}
.parc .prix{font:600 11.5px system-ui;color:#8a867e}

/* animaux */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.bat{background:var(--carte);border:1px solid var(--filet);border-radius:14px;padding:10px;
  display:flex;align-items:center;gap:9px;text-align:left}
.bat .ic{width:34px;height:34px;border-radius:10px;background:var(--or-p);display:flex;
  align-items:center;justify-content:center;flex:0 0 auto}
.bat .n{font-size:12.5px;font-weight:600}
.bat .d{font-size:11px;color:var(--doux);margin-top:2px}
.bat .jauge{height:5px;border-radius:3px;background:#eae7dd;margin-top:5px;overflow:hidden}
.bat .jauge i{display:block;height:100%;background:linear-gradient(90deg,#e6c877,var(--or))}

/* carnet */
.ligne{display:flex;align-items:center;gap:12px;background:var(--carte);border:1px solid var(--filet);
  border-left:4px solid var(--filet);border-radius:14px;padding:12px;margin-bottom:9px;text-align:left;width:100%}
.ligne.pret{border-left-color:var(--vert-c)}
.ligne.pousse{border-left-color:var(--or)}
.ligne .ic{width:44px;height:44px;border-radius:12px;background:#f4f1e8;display:flex;
  align-items:center;justify-content:center;flex:0 0 auto}
.ligne .t{flex:1;min-width:0}
.ligne .n{font-size:13.5px;font-weight:600}
.ligne .d{font-size:12px;color:var(--doux);margin-top:2px}
.ligne .jauge{height:6px;border-radius:4px;background:#eae7dd;margin-top:6px;overflow:hidden}
.ligne .jauge i{display:block;height:100%;background:linear-gradient(90deg,#e6c877,var(--or))}
.agir{border-radius:12px;padding:10px 14px;font-size:13px;font-weight:600;flex:0 0 auto;
  background:var(--vert);color:#fdfbf4}
.agir.sec{background:var(--vert-p);color:var(--vert)}
.agir:active{transform:translateY(1px)}
.agir:disabled{opacity:.45}

/* listes marché / boutique */
.item{display:flex;align-items:center;gap:12px;background:var(--carte);border:1px solid var(--filet);
  border-radius:14px;padding:12px;margin-bottom:9px}
.item .t{flex:1;min-width:0}
.prixb{border-radius:12px;padding:10px 14px;font-size:13px;font-weight:600;background:var(--or-p);color:var(--or)}
.prixb.plein{background:var(--nuit);color:#f7fafc}
.prixb:disabled{opacity:.45}
.vide{font-size:13px;color:var(--doux);text-align:center;padding:26px 10px;line-height:1.6}

/* commandes */
.cmd{background:var(--carte);border:1px solid var(--filet);border-radius:16px;padding:13px;margin-bottom:10px}
.cmd .h{display:flex;align-items:baseline;gap:8px}
.cmd .h .q{flex:1;font-size:13.5px;font-weight:600}
.cmd .h .g{font-size:13px;font-weight:600;color:var(--or)}
.jetons{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.jeton{display:flex;align-items:center;gap:5px;border:1px solid var(--filet);border-radius:9px;
  padding:5px 8px;font-size:12px;font-weight:600;color:var(--doux)}
.jeton.ok{background:var(--vert-p);border-color:#cbe5c0;color:var(--vert)}

/* barre du bas */
.bas{position:fixed;left:0;right:0;bottom:0;background:var(--carte);border-top:1px solid var(--filet);
  display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:5}
.bas button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;font-weight:600;color:var(--pale);padding:4px 0;position:relative}
.bas button.on{color:var(--nuit)}
.bas .point{position:absolute;top:1px;right:calc(50% - 16px);width:7px;height:7px;border-radius:50%;
  background:#d9694a}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));
  background:rgba(30,39,53,.94);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;
  z-index:20;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,-6px)}

/* ---------- bienvenue ---------- */
#accueil{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  padding:16px;background:#e9e3d6;animation:fondu .35s ease-out}
#accueil.on{display:flex}
@keyframes fondu{from{opacity:0}}
@keyframes monteC{from{transform:translateY(20px) scale(.985);opacity:0}}
.carte-postale{width:100%;max-width:420px;background:#fffdf7;border-radius:20px;padding:13px 13px 0;
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 3px 8px rgba(70,56,32,.10),0 26px 60px rgba(70,56,32,.30);
  animation:monteC .45s cubic-bezier(.2,.8,.3,1);display:flex;flex-direction:column;
  max-height:calc(100dvh - 32px)}
.vue{position:relative;border-radius:13px;overflow:hidden;flex:1 1 auto;min-height:150px;
  box-shadow:0 1px 3px rgba(70,56,32,.28)}
.vue svg{display:block;width:100%;height:100%}
.vue::after{content:"";position:absolute;inset:0;border-radius:13px;pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(70,56,32,.18)}
.mot{padding:20px 8px 18px;text-align:center;flex:0 0 auto}
.mot .kicker{font:600 10px system-ui;letter-spacing:5.5px;color:#a89c84}
.mot h2{font:400 30px/1.12 Georgia,"Times New Roman",serif;color:#2f3830;margin-top:9px;letter-spacing:-.3px}
.mot .filet{width:34px;height:1px;background:#cfc4ac;margin:14px auto}
.mot p{font:400 13.5px/1.55 system-ui;color:#8a9083}
.cta{width:100%;margin-top:18px;border-radius:15px;padding:16px;background:var(--vert);color:#fdfbf4;
  font-size:15.5px;font-weight:600;box-shadow:0 6px 18px rgba(47,107,31,.28);transition:transform .07s}
.cta:active{transform:translateY(2px)}
.cta.nuit{background:var(--nuit);box-shadow:0 6px 18px rgba(36,64,107,.3)}
.saut{width:100%;margin-top:10px;padding:11px;font-size:12.5px;font-weight:600;color:#a89c84}

/* animations de l'illustration */
@keyframes derive{from{transform:translateX(-60px)}to{transform:translateX(460px)}}
.nuage{animation:derive linear infinite}
.nuage.n1{animation-duration:120s}
.nuage.n2{animation-duration:170s;animation-delay:-60s}
.nuage.n3{animation-duration:210s;animation-delay:-120s}
@keyframes vol{0%{transform:translate(0,0)}50%{transform:translate(70px,-14px)}100%{transform:translate(150px,4px)}}
.oiseaux{animation:vol 26s linear infinite}
@keyframes monteFumee{0%{transform:translate(0,0) scale(.7);opacity:.55}
  100%{transform:translate(-7px,-26px) scale(1.9);opacity:0}}
.fumee circle{animation:monteFumee 5s ease-out infinite}
.fumee circle.f2{animation-delay:2.5s}
@keyframes balance{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}}
.epi{animation:balance 4.4s ease-in-out infinite}

#tuto{position:fixed;inset:0;z-index:55;display:none;pointer-events:none}
#tuto.on{display:block}
#tuto .trou{position:absolute;border-radius:16px;box-shadow:0 0 0 9999px rgba(15,25,45,.72);
  transition:all .28s cubic-bezier(.3,.8,.4,1);border:2px solid var(--vert-c)}
#tuto .bulle{position:absolute;left:12px;right:12px;background:#1e2735;color:#fdfbf4;border-radius:18px;
  padding:15px 16px;box-shadow:0 14px 34px rgba(0,0,0,.45);pointer-events:auto;
  transition:top .28s cubic-bezier(.3,.8,.4,1)}
#tuto .fleche{position:absolute;width:15px;height:15px;background:#1e2735;transform:rotate(45deg)}
#tuto .etiq{font:600 10.5px system-ui;letter-spacing:1.6px;color:#8ea9c9}
#tuto h3{font:600 15px system-ui;margin-top:5px}
#tuto p{font:400 13px/1.6 system-ui;color:#b7c4d6;margin-top:5px}
#tuto .pied{display:flex;align-items:center;gap:10px;margin-top:13px}
#tuto .pastilles{display:flex;gap:5px;flex:1}
#tuto .pastilles i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.28)}
#tuto .pastilles i.on{background:var(--vert-c);width:16px;border-radius:3px}
#tuto .suite{background:var(--vert);color:#fdfbf4;border-radius:12px;padding:10px 16px;
  font-size:13px;font-weight:600}
#tuto .suite.attente{background:rgba(255,255,255,.12);color:#b7c4d6}
#tuto .passer{font-size:12px;font-weight:600;color:#8ea9c9;padding:8px}

#fen{position:fixed;inset:0;z-index:30;display:none;align-items:flex-end;background:rgba(20,33,63,.45)}
#fen.on{display:flex}
#fen .b{width:100%;background:var(--carte);border-radius:24px 24px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom));max-height:82vh;overflow-y:auto}
#fen h2{font:400 20px Georgia,serif;margin-bottom:4px}
#fen p{font-size:13px;color:var(--doux);line-height:1.55}
.fermer{width:100%;margin-top:12px;border-radius:14px;padding:13px;font-weight:600;
  background:#f2f0ea;color:var(--encre)}
</style>
</head>
<body>
<div class="app">
  <div class="haut">
    <div class="ligne">
      <h1 id="nom-ferme">Ta ferme</h1>
      <div class="pastille">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#f0d089" stroke-width="2">
          <circle cx="12" cy="12" r="8"/><path d="M12 8v8M9.5 10h5M9.5 14h5" stroke-linecap="round"/></svg>
        <span id="or">0</span>
      </div>
    </div>
    <div class="xp">
      <div class="niv">NIV <span id="niv">1</span></div>
      <div class="barre"><i id="xp-barre" style="width:0%"></i></div>
      <div class="niv" id="xp-txt">0/40</div>
    </div>
  </div>

  <div class="corps" id="corps"></div>

  <div class="bas" id="nav">
    <button data-v="ferme" class="on">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 20V11l9-6 9 6v9"/><path d="M9 20v-6h6v6"/></svg>Ferme</button>
    <button data-v="marche">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 8h16l-1.5 11.5H5.5z"/><path d="M8.5 8V6a3.5 3.5 0 0 1 7 0v2"/></svg>Marché</button>
    <button data-v="boutique">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l1.6-4h14.8L21 9"/><path d="M4.5 9v10.5h15V9"/><path d="M3 9c0 1.6 1.3 2.8 3 2.8S9 10.6 9 9c0 1.6 1.3 2.8 3 2.8S15 10.6 15 9c0 1.6 1.3 2.8 3 2.8S21 10.6 21 9"/></svg>Boutique</button>
    <button data-v="commandes">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="3.5" width="14" height="17" rx="2.5"/><path d="M9 8.5h6M9 12.5h6M9 16.5h3"/></svg>Commandes
      <span class="point" id="pt-cmd" style="display:none"></span></button>
  </div>
</div>

<div id="accueil"><div class="carte-a" id="accueil-b"></div></div>
<div id="tuto"><div class="trou" id="trou"></div><div class="bulle" id="bulle"></div></div>

<div id="fen"><div class="b" id="fen-b"></div></div>
<div class="toast" id="toast"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient('https://zpfkekiavlfphialvphi.supabase.co',
                      'sb_publishable__dfR2lEOwKjhhtavvJEvGw_KVACZnHP');
const $=id=>document.getElementById(id);

/* ================= dessins ================= */
const D={
  ble:(t)=>`<svg width="34" height="${20+t*14}" viewBox="0 0 34 48"><g stroke="#8a9a3c" stroke-width="2.4" fill="none" stroke-linecap="round">

      <g fill="${t>1?'#d9b45a':'#a8b45c'}"><ellipse cx="11" cy="${30-t*12}" rx="5" ry="8"/>
      <ellipse cx="23" cy="${33-t*12}" rx="4.4" ry="7"/></g>
      <g fill="${t>1?'#c39a3f':'#93a04e'}"><path d="M11 ${22-t*12}v16" stroke="#8a7434" stroke-width="1.2"/></g></svg>`,
  carotte:(t)=>`<svg width="34" height="${18+t*12}" viewBox="0 0 34 44">
      <g stroke="#5aa350" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M17 42V${28-t*10}"/><path d="M17 ${32-t*10}L9 ${24-t*10}"/><path d="M17 ${32-t*10}L25 ${24-t*10}"/></g>

  tomate:(t)=>`<svg width="34" height="${20+t*14}" viewBox="0 0 34 48">
      <path d="M17 46V${26-t*10}" stroke="#4e8f42" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M17 ${34-t*10}l-8-6M17 ${28-t*10}l8-5" stroke="#4e8f42" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      ${t>1?'<circle cx="10" cy="34" r="5.5" fill="#cf4433"/><circle cx="24" cy="30" r="5" fill="#cf4433"/>':

  mais:(t)=>`<svg width="34" height="${22+t*16}" viewBox="0 0 34 52">

      <path d="M17 ${36-t*8}c-9 0-11-6-11-9 5 0 11 3 11 9z" fill="#7fb44c"/>
      <path d="M17 ${30-t*8}c9 0 11-6 11-9-5 0-11 3-11 9z" fill="#6ba03c"/>
      ${t>1?'<ellipse cx="21" cy="34" rx="4.5" ry="8" fill="#e2b93f"/>':''}</svg>`,
  citrouille:(t)=>`<svg width="36" height="${20+t*14}" viewBox="0 0 36 48">
      <path d="M18 44c-6 0-9-4-9-8" stroke="#4e8f42" stroke-width="3" fill="none" stroke-linecap="round"/>
      ${t>1?`<g><ellipse cx="18" cy="36" rx="13" ry="10" fill="#e08a3c"/>

        :'<ellipse cx="18" cy="40" rx="6" ry="4" fill="#8fbb5c"/>'}</svg>`,
  oeuf:()=>`<svg width="20" height="24" viewBox="0 0 20 24"><ellipse cx="10" cy="14" rx="8" ry="10" fill="#f0e2c8"/>
      <ellipse cx="7" cy="10" rx="3" ry="4" fill="#fbf4e6"/></svg>`,
  lait:()=>`<svg width="20" height="24" viewBox="0 0 20 24"><path d="M6 2h8v4l3 5v11H3V11l3-5z" fill="#e8eef2" stroke="#b9c6d0" stroke-width="1.4"/>
      <path d="M3 14h14v4H3z" fill="#c9d8e2"/></svg>`,
  pain:()=>`<svg width="24" height="20" viewBox="0 0 24 20"><ellipse cx="12" cy="11" rx="11" ry="7" fill="#d9a95a"/>
      <path d="M6 8l3 5M11 7l3 5M16 8l3 5" stroke="#b5843c" stroke-width="1.6" stroke-linecap="round"/></svg>`,
  poule:()=>`<svg width="22" height="22" viewBox="0 0 24 24"><ellipse cx="12" cy="15" rx="8" ry="6.5" fill="#f2e6d0"/>
      <circle cx="17" cy="9" r="4" fill="#f2e6d0"/><path d="M17 5.5c0-2 2-2 2 0" stroke="#cf4433" stroke-width="2" fill="none"/>
      <path d="M20 9h3l-3 2z" fill="#e2a33c"/><circle cx="18" cy="8.6" r="1" fill="#3a3a3a"/></svg>`,
  vache:()=>`<svg width="24" height="22" viewBox="0 0 26 24"><ellipse cx="13" cy="14" rx="10" ry="7" fill="#f2f0ea"/>
      <ellipse cx="8" cy="12" rx="3.4" ry="2.6" fill="#4a4a52"/><ellipse cx="17" cy="16" rx="3" ry="2.2" fill="#4a4a52"/>
      <circle cx="20" cy="9" r="4.2" fill="#f2f0ea"/><circle cx="21" cy="8.4" r="1" fill="#3a3a3a"/>
      <path d="M17 6l-2-2M23 6l2-2" stroke="#c9bda8" stroke-width="2" stroke-linecap="round"/></svg>`,
  parcelle:()=>`<svg width="26" height="20" viewBox="0 0 26 20"><rect width="26" height="20" rx="4" fill="#b98d55"/>
      <path d="M4 3v14M10 3v14M16 3v14M22 3v14" stroke="#9a7342" stroke-width="2"/></svg>`
};
const ICONE={ble:D.ble,carotte:D.carotte,tomate:D.tomate,mais:D.mais,citrouille:D.citrouille,
  oeuf:D.oeuf,lait:D.lait,pain:D.pain};

/* ================= données ================= */
const CULTURES=[
  {id:'ble',nom:'Blé',cout:12,duree:45,vend:26,xp:2,niv:1},
  {id:'carotte',nom:'Carotte',cout:24,duree:110,vend:58,xp:4,niv:1},
  {id:'mais',nom:'Maïs',cout:48,duree:240,vend:124,xp:7,niv:3},
  {id:'tomate',nom:'Tomate',cout:96,duree:480,vend:255,xp:12,niv:5},
  {id:'citrouille',nom:'Citrouille',cout:190,duree:900,vend:520,xp:20,niv:8}
];
const PRODUITS={};CULTURES.forEach(c=>PRODUITS[c.id]={nom:c.nom,vend:c.vend});
PRODUITS.oeuf={nom:'Œuf',vend:34};PRODUITS.lait={nom:'Lait',vend:72};
const CLIENTS=['Mme Ferrand','le café du coin','la cantine','Odile','le marché couvert','l’épicerie','Karim'];

const CLE='bdl.ferme.v2';
const neuf=()=>({ferme:'Ta ferme',or:150,xp:0,niv:1,parcelles:4,tuto:0,accueilVu:false,
  cases:Array.from({length:9},()=>({c:null,fin:0})),
  poule:0,vache:0,attente:{oeuf:0,lait:0},derniere:Date.now(),stock:{},commandes:null});
let e=neuf();
try{const b=localStorage.getItem(CLE);if(b)e=Object.assign(neuf(),JSON.parse(b));}catch(x){}
const sauver=()=>{try{localStorage.setItem(CLE,JSON.stringify(e));}catch(x){}};

const stock=k=>e.stock[k]||0, ajouter=(k,n)=>{e.stock[k]=stock(k)+n;};
const XP_NIV=n=>Math.round(40*Math.pow(1.55,n-1));
const coutParcelle=()=>Math.round(120*Math.pow(1.75,e.parcelles-4));
const coutPoule=()=>Math.round(320*Math.pow(1.8,e.poule));
const coutVache=()=>Math.round(900*Math.pow(1.85,e.vache));
const euros=n=>Math.round(n).toLocaleString('fr-FR')+' €';
const duree=s=>s<60?s+' s':(s<3600?Math.round(s/60)+' min':(Math.round(s/360)/10)+' h');
function gagnerXp(n){e.xp+=n;while(e.xp>=XP_NIV(e.niv)){e.xp-=XP_NIV(e.niv);e.niv++;
  toast('Niveau '+e.niv+' atteint');}}
let tt;const toast=t=>{const z=$('toast');z.textContent=t;z.classList.add('on');
  clearTimeout(tt);tt=setTimeout(()=>z.classList.remove('on'),2100);};

const TAUX_POULE=1/90, TAUX_VACHE=1/240;
function auto(){
  const now=Date.now(), s=(now-e.derniere)/1000;
  if(s<=0)return;e.derniere=now;
  e.attente.oeuf=Math.min(e.poule*12,(e.attente.oeuf||0)+e.poule*TAUX_POULE*s);
  e.attente.lait=Math.min(e.vache*8,(e.attente.lait||0)+e.vache*TAUX_VACHE*s);
}

/* ================= commandes ================= */
function nouvelleCommande(){
  const dispo=Object.keys(PRODUITS).filter(k=>{
    const c=CULTURES.find(x=>x.id===k);
    if(c)return c.niv<=e.niv;
    if(k==='oeuf')return e.poule>0;
    if(k==='lait')return e.vache>0;
    return false;});
  if(!dispo.length)return null;
  const n=1+Math.min(2,Math.floor(e.niv/3)),items={};
  for(let i=0;i<n;i++){const k=dispo[Math.random()*dispo.length|0];
    items[k]=(items[k]||0)+1+Math.floor(Math.random()*3);}
  const val=Object.entries(items).reduce((s,[k,q])=>s+PRODUITS[k].vend*q,0);
  return{client:CLIENTS[Math.random()*CLIENTS.length|0],items,
    or:Math.round(val*1.5),xp:Math.max(4,Math.round(val/22))};
}
function assurerCommandes(){if(!e.commandes)e.commandes=[];
  while(e.commandes.length<3){const c=nouvelleCommande();if(!c)break;e.commandes.push(c);}}
const livrable=c=>Object.entries(c.items).every(([k,q])=>stock(k)>=q);

/* ================= vues ================= */
let vue='ferme';
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{
  vue=b.dataset.v;
  document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x===b));
  $('corps').scrollTop=0;rendre();});

function etatParcelle(i){
  const c=e.cases[i];
  if(i>=e.parcelles)return{type:'verrou'};
  if(!c.c)return{type:'libre'};
  const cu=CULTURES.find(x=>x.id===c.c);
  const reste=c.fin-Date.now(), tot=cu.duree*1000;
  if(reste<=0)return{type:'pret',cu};
  return{type:'pousse',cu,reste:Math.ceil(reste/1000),p:1-reste/tot};
}

  let h='<div class="ferme"><div class="parcelles">';
  for(let i=0;i<9;i++){
    const s=etatParcelle(i);
    if(s.type==='verrou'){
      h+=`<button class="parc verrou" data-p="${i}"><span class="prix">${euros(coutParcelle())}</span></button>`;
    }else if(s.type==='libre'){
      h+=`<button class="parc libre" data-p="${i}"><span class="txt">Semer</span></button>`;
    }else{
      const t=s.type==='pret'?2:(s.p>.5?1:0);
      h+=`<button class="parc" data-p="${i}">${ICONE[s.cu.id](t)}
        ${s.type==='pret'?'<span class="pret"></span>'
          :`<span class="jauge"><i style="width:${Math.round(s.p*100)}%"></i></span>`}</button>`;
    }
  }
  h+='</div><div class="duo">';
  const oe=Math.floor(e.attente.oeuf||0), la=Math.floor(e.attente.lait||0);
  h+=`<button class="bat" data-b="poule"><span class="ic">${D.poule()}</span>
      <span class="t"><span class="n">Poulailler</span>
      <span class="d">${e.poule?(oe?oe+(oe>1?' œufs prêts':' œuf prêt'):'les poules pondent'):'à construire'}</span>
      ${e.poule?`<span class="jauge"><i style="width:${Math.min(100,(e.attente.oeuf/(e.poule*12))*100)}%"></i></span>`:''}
      </span></button>`;
  h+=`<button class="bat" data-b="vache"><span class="ic">${D.vache()}</span>
      <span class="t"><span class="n">Étable</span>
      <span class="d">${e.vache?(la?la+' lait prêt':'la traite avance'):'à construire'}</span>
      ${e.vache?`<span class="jauge"><i style="width:${Math.min(100,(e.attente.lait/(e.vache*8))*100)}%"></i></span>`:''}
      </span></button>`;
  h+='</div></div>';

  // carnet
  h+='<div class="titre">LE CARNET</div>';
  let lignes='';
  for(let i=0;i<e.parcelles;i++){
    const s=etatParcelle(i);
    if(s.type==='libre'){
      lignes+=`<button class="ligne" data-p="${i}"><span class="ic">${D.parcelle()}</span>
        <span class="t"><span class="n">Parcelle ${i+1}</span><span class="d">libre</span></span>
        <span class="agir sec">Semer</span></button>`;
    }else if(s.type==='pret'){
      lignes+=`<button class="ligne pret" data-p="${i}"><span class="ic">${ICONE[s.cu.id](2)}</span>
        <span class="t"><span class="n">${s.cu.nom}</span><span class="d">prêt à récolter</span></span>
        <span class="agir">Récolter</span></button>`;
    }else{
      lignes+=`<div class="ligne pousse"><span class="ic">${ICONE[s.cu.id](s.p>.5?1:0)}</span>
        <span class="t"><span class="n">${s.cu.nom}</span><span class="d">encore ${duree(s.reste)}</span>
        <span class="jauge"><i style="width:${Math.round(s.p*100)}%"></i></span></span></div>`;
    }
  }
  if(e.poule&&oe)lignes+=`<button class="ligne pret" data-b="poule"><span class="ic">${D.poule()}</span>
    <span class="t"><span class="n">Poulailler</span><span class="d">${oe} à ramasser</span></span>
    <span class="agir">Ramasser</span></button>`;
  if(e.vache&&la)lignes+=`<button class="ligne pret" data-b="vache"><span class="ic">${D.vache()}</span>
    <span class="t"><span class="n">Étable</span><span class="d">${la} à traire</span></span>
    <span class="agir">Traire</span></button>`;
  h+=lignes||'<div class="vide">Rien à faire pour l’instant.<br>Sème quelque chose.</div>';
  return h;
}

function vueMarche(){
  const cles=Object.keys(e.stock).filter(k=>stock(k)>0);
  if(!cles.length)return '<div class="titre">MARCHÉ</div><div class="vide">Ta grange est vide.<br>Récolte d’abord.</div>';
  const total=cles.reduce((s,k)=>s+PRODUITS[k].vend*stock(k),0);
  let h='<div class="titre">MARCHÉ</div>';
  cles.forEach(k=>{
    h+=`<div class="item"><span class="ic" style="width:44px;height:44px;border-radius:12px;background:#f4f1e8;display:flex;align-items:center;justify-content:center">${(ICONE[k]||D.pain)(2)}</span>
      <span class="t"><span class="n" style="font-size:13.5px;font-weight:600">${PRODUITS[k].nom}</span>
      <span class="d" style="display:block;font-size:12px;color:var(--doux);margin-top:2px">${stock(k)} en grange · ${euros(PRODUITS[k].vend)} pièce</span></span>
      <button class="prixb" data-v="${k}">${euros(PRODUITS[k].vend*stock(k))}</button></div>`;
  });
  h+=`<button class="prixb plein" data-v="tout" style="width:100%;padding:15px;margin-top:6px">Tout vendre · ${euros(total)}</button>`;
  return h;
}

  let h='<div class="titre">BOUTIQUE</div>';
  const l=(ic,n,d,prix,id,bloque,note)=>`<div class="item">
    <span style="width:44px;height:44px;border-radius:12px;background:#f4f1e8;display:flex;align-items:center;justify-content:center">${ic}</span>
    <span class="t"><span style="font-size:13.5px;font-weight:600">${n}</span>
    <span style="display:block;font-size:12px;color:var(--doux);margin-top:2px">${bloque?note:d}</span></span>
    <button class="prixb" data-a="${id}" ${(bloque||e.or<prix)?'disabled':''}>${bloque?'—':euros(prix)}</button></div>`;

  h+=l(D.vache(),'Étable',`${e.vache} construite${e.vache>1?'s':''} · lait en continu`,coutVache(),'vache',e.niv<4,'niveau 4 requis');

      <span class="t"><span style="font-size:13.5px;font-weight:600">${c.nom}</span>
      <span style="display:block;font-size:12px;color:var(--doux);margin-top:2px">${ok?duree(c.duree)+' · achat '+euros(c.cout)+' · vente '+euros(c.vend):'niveau '+c.niv+' requis'}</span></span></div>`;

function vueCommandes(){
  assurerCommandes();
  let h='<div class="titre">COMMANDES</div>';
  if(!e.commandes.length)return h+'<div class="vide">Personne ne commande encore.<br>Reviens quand tu produiras.</div>';
  e.commandes.forEach((c,i)=>{
    h+=`<div class="cmd"><div class="h"><span class="q">Pour ${c.client}</span><span class="g">${euros(c.or)}</span></div>
      <div class="jetons">${Object.entries(c.items).map(([k,q])=>
        `<span class="jeton ${stock(k)>=q?'ok':''}">${PRODUITS[k].nom} ${Math.min(stock(k),q)}/${q}</span>`).join('')}</div>
      <button class="agir" data-c="${i}" style="width:100%;margin-top:11px;padding:12px" ${livrable(c)?'':'disabled'}>Livrer</button></div>`;

/* ================= actions ================= */
function semer(i){
  let dispo=CULTURES.filter(c=>c.niv<=e.niv);
  if(e.tuto===1)dispo=dispo.filter(c=>c.id==='ble');
  $('fen-b').innerHTML='<h2>Que semer ?</h2><p>Choisis ta culture pour cette parcelle.</p>'+
    dispo.map(c=>`<div class="item"><span style="width:44px;height:44px;border-radius:12px;background:#f4f1e8;display:flex;align-items:center;justify-content:center">${ICONE[c.id](2)}</span>
      <span class="t"><span style="font-size:13.5px;font-weight:600">${c.nom}</span>
      <span style="display:block;font-size:12px;color:var(--doux);margin-top:2px">${duree(c.duree)} · rapporte ${euros(c.vend)}</span></span>
      <button class="prixb" data-g="${c.id}" ${e.or<c.cout?'disabled':''}>${euros(c.cout)}</button></div>`).join('')+
    '<button class="fermer" id="f-x">Annuler</button>';
  $('fen').classList.add('on');
  $('f-x').onclick=()=>$('fen').classList.remove('on');
  $('fen-b').querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{
    const c=CULTURES.find(x=>x.id===b.dataset.g);
    if(e.or<c.cout)return;
    e.or-=c.cout;e.cases[i]={c:c.id,fin:Date.now()+c.duree*1000};
    $('fen').classList.remove('on');sauver();rendre();});
}
function toucherParcelle(i){
  const s=etatParcelle(i);
  if(s.type==='verrou'){
    const c=coutParcelle();
    if(e.or<c)return toast('Il te manque '+euros(c-e.or)+' pour défricher');
    e.or-=c;e.parcelles++;toast('Parcelle défrichée');sauver();rendre();return;
  }
  if(s.type==='libre')return semer(i);
  if(s.type==='pousse')return toast('Prêt dans '+duree(s.reste));
  ajouter(s.cu.id,1);gagnerXp(s.cu.xp);e.cases[i]={c:null,fin:0};
  toast('+1 '+s.cu.nom);sauver();rendre();
}
function toucherBat(id){
  if(id==='poule'){
    if(!e.poule)return toast('Construis un poulailler en boutique');
    const n=Math.floor(e.attente.oeuf||0);
    if(n<1)return toast('Les poules travaillent');
    e.attente.oeuf-=n;ajouter('oeuf',n);gagnerXp(n);toast('+'+n+(n>1?' œufs':' œuf'));
  }else{
    if(!e.vache)return toast('Construis une étable en boutique');
    const n=Math.floor(e.attente.lait||0);
    if(n<1)return toast('La traite avance');
    e.attente.lait-=n;ajouter('lait',n);gagnerXp(n*2);toast('+'+n+' lait');
  }
  sauver();rendre();
}

function brancher(){
  const z=$('corps');
  z.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>toucherParcelle(+b.dataset.p));
  z.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>toucherBat(b.dataset.b));
  z.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.v;
    if(k==='tout'){
      let t=0;Object.keys(e.stock).forEach(x=>{t+=PRODUITS[x].vend*stock(x);e.stock[x]=0;});
      if(t){toast('+'+euros(t));e.venduUneFois=true;}e.or+=t;
    }else{const n=stock(k);e.or+=PRODUITS[k].vend*n;e.stock[k]=0;e.venduUneFois=true;
      toast('+'+euros(PRODUITS[k].vend*n));}
    sauver();rendre();});
  z.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.a;
    if(a==='parcelle'){const c=coutParcelle();if(e.or<c||e.parcelles>=9)return;
      e.or-=c;e.parcelles++;toast('Parcelle défrichée');}
    if(a==='poule'){const c=coutPoule();if(e.or<c||e.niv<2)return;e.or-=c;e.poule++;toast('Poulailler construit');}
    if(a==='vache'){const c=coutVache();if(e.or<c||e.niv<4)return;e.or-=c;e.vache++;toast('Étable construite');}
    sauver();rendre();});
  z.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{
    const c=e.commandes[+b.dataset.c];if(!livrable(c))return;
    Object.entries(c.items).forEach(([k,q])=>{e.stock[k]=stock(k)-q;});
    e.or+=c.or;gagnerXp(c.xp);e.commandes.splice(+b.dataset.c,1);assurerCommandes();
    toast('Livré · +'+euros(c.or));sauver();rendre();});
}

function ILLUSTRATION(){
  const R=(a,b,s)=>{const v=Math.sin(s*127.1+a*311.7+b*74.7)*43758.5;return v-Math.floor(v);};

  /* --- rangs de culture en perspective : chaque bande se resserre vers l'horizon --- */
  let rangs='';
  for(let i=0;i<26;i++){
    const t=i/25;
    const y=176+Math.pow(t,1.7)*104;              // espacement qui s'ouvre vers le bas
    const ep=0.6+t*2.6;
    const dec=Math.sin(t*3.1)*6;
    rangs+=`<path d="M${-20+dec} ${y} Q200 ${y-7+dec*.6} ${420+dec} ${y-3}" stroke="rgba(108,142,74,${0.16+t*0.30})" stroke-width="${ep}" fill="none"/>`;
  }
  /* --- épis du premier plan, dessinés un par un --- */
  let epis='';
  for(let i=0;i<46;i++){
    const x=-10+i*9.2+R(i,1,3)*6;
    const h=26+R(i,2,7)*26;
    const base=302;
    const pen=(R(i,3,11)-0.5)*10;
    const vert=`hsl(${72+R(i,4,13)*18} ${30+R(i,5,17)*18}% ${28+R(i,6,19)*14}%)`;
    epis+=`<g class="epi" style="animation-delay:${(-R(i,7,23)*4).toFixed(2)}s;transform-origin:${x}px ${base}px">
      <path d="M${x} ${base} Q${x+pen*.4} ${base-h*.6} ${x+pen} ${base-h}" stroke="${vert}" stroke-width="1.9" fill="none" stroke-linecap="round"/>
      <ellipse cx="${(x+pen).toFixed(1)}" cy="${(base-h-4).toFixed(1)}" rx="2.6" ry="5.4" fill="hsl(${44+R(i,8,29)*10} ${52+R(i,9,31)*14}% ${54+R(i,10,37)*10}%)" transform="rotate(${(pen*1.4).toFixed(1)} ${(x+pen).toFixed(1)} ${(base-h-4).toFixed(1)})"/>
      </g>`;
  }
  /* --- feuillage : amas de cercles pour un houppier crédible --- */
  const houppier=(cx,cy,s,c1,c2,c3)=>{
    let g='';
    const amas=[[0,-s*.55,s*.62],[-s*.5,-s*.2,s*.46],[s*.5,-s*.25,s*.44],[-s*.2,-s*.75,s*.4],[s*.25,-s*.7,s*.38],[0,-s*.15,s*.55]];
    amas.forEach(([dx,dy,r],i)=>{g+=`<circle cx="${cx+dx}" cy="${cy+dy}" r="${r}" fill="${i<2?c1:(i<4?c2:c3)}"/>`;});
    return g;
  };
  /* --- piquets de clôture le long du chemin --- */
  let cloture='';
  for(let i=0;i<11;i++){
    const t=i/10;
    const x=18+t*370, y=236+Math.pow(t,1.6)*44, h=9+t*13;
    cloture+=`<rect x="${x}" y="${y-h}" width="${1.6+t*2.2}" height="${h}" rx="1" fill="#7d6a4a" opacity="${0.5+t*0.4}"/>`;
    if(i<10)cloture+=`<path d="M${x} ${y-h*0.72} L${18+((i+1)/10)*370} ${236+Math.pow((i+1)/10,1.6)*44-(9+((i+1)/10)*13)*0.72}" stroke="#7d6a4a" stroke-width="${0.8+t*1.2}" opacity="${0.35+t*0.35}"/>`;
  }

  return `
<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8fb8d4"/><stop offset=".38" stop-color="#c9dce4"/>
    <stop offset=".68" stop-color="#f3e0c0"/><stop offset="1" stop-color="#f7d9a8"/></linearGradient>
  <radialGradient id="halo" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#fff6d8" stop-opacity=".95"/>
    <stop offset=".45" stop-color="#ffe6a8" stop-opacity=".45"/>
    <stop offset="1" stop-color="#ffdf9a" stop-opacity="0"/></radialGradient>
  <linearGradient id="pre1" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#a9c98a"/><stop offset="1" stop-color="#8fb672"/></linearGradient>
  <linearGradient id="pre2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8cb46c"/><stop offset="1" stop-color="#6f9c56"/></linearGradient>
  <linearGradient id="champ" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d8c07e"/><stop offset="1" stop-color="#c2a760"/></linearGradient>
  <linearGradient id="toit" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#d0714f"/><stop offset="1" stop-color="#a94f36"/></linearGradient>

  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/>

function ouvrirAccueil(){
  $('accueil-b').outerHTML=`<div class="carte-postale" id="accueil-b">
      <div class="vue">${ILLUSTRATION()}</div>
      <div class="mot">
        <div class="kicker">BIENVENUE À</div>
        <h2>${e.ferme}</h2>
        <div class="filet"></div>
        <p>Quatre parcelles. À toi de jouer.</p>
        <button class="cta" id="a-go">Semer mon premier blé</button>
        <button class="saut" id="a-skip">passer</button>
      </div>
    </div>`;
  $('accueil').classList.add('on');
  $('a-go').onclick=()=>{e.accueilVu=true;e.tuto=1;sauver();
    $('accueil').classList.remove('on');rendre();
    const p=document.querySelector('.parc');if(p)p.click();};
  $('a-skip').onclick=()=>{e.accueilVu=true;e.tuto=-1;sauver();
    $('accueil').classList.remove('on');rendre();};
}

/* ================= tutoriel ================= */
const ETAPES=[
  null,
  {cible:()=>document.querySelector('.parcelles'),
   etiq:'ÉTAPE 1 SUR 5',titre:'Tes quatre parcelles',
   texte:'Chaque carré de terre accueille une culture. Touches-en un pour choisir ce que tu sèmes — commence par du blé, c’est le plus rapide.',
   attente:'Sème quelque chose',
   fait:()=>e.cases.some(c=>c.c)},
  {cible:()=>{const i=e.cases.findIndex(c=>c.c);
     return (i>=0&&document.querySelectorAll('.parc')[i])||document.querySelector('.parcelles');},
   etiq:'ÉTAPE 2 SUR 5',titre:'Ça pousse tout seul',
   texte:'La jauge se remplit même si tu fermes le jeu. Quand la plante est mûre, un point vert apparaît sur la parcelle.',
   bouton:'Compris'},
  {cible:()=>{const i=e.cases.findIndex(c=>c.c);
     return (i>=0&&document.querySelectorAll('.parc')[i])||document.querySelector('.parcelles');},
   etiq:'ÉTAPE 3 SUR 5',titre:'La récolte',
   texte:'Touche la parcelle mûre pour rentrer ta production. Elle part en grange, et tu gagnes de l’expérience.',
   attente:'Récolte ta première culture',
   fait:()=>Object.values(e.stock).some(v=>v>0)},
  {cible:()=>document.querySelector('#nav button[data-v="marche"]'),
   etiq:'ÉTAPE 4 SUR 5',titre:'Le marché',
   texte:'C’est ici que la grange se transforme en argent. Ouvre le marché et vends ta récolte.',
   attente:'Vends au marché',
   fait:()=>e.venduUneFois},
  {cible:()=>document.querySelector('#nav button[data-v="commandes"]'),
   etiq:'ÉTAPE 5 SUR 5',titre:'Les commandes',
   texte:'Les habitants réclament des produits précis et paient 50 % de plus que le marché. Une pastille rouge s’allume quand tu peux livrer.',
   bouton:'Terminer'}
];

function majTuto(){
  const t=$('tuto');
  if(!e.tuto||e.tuto<0||e.tuto>=ETAPES.length){t.classList.remove('on');return;}
  const et=ETAPES[e.tuto];
  const cible=et.cible();
  if(!cible){t.classList.remove('on');return;}
  t.classList.add('on');
  const r=cible.getBoundingClientRect();
  const m=8;
  const trou=$('trou');
  trou.style.left=(r.left-m)+'px';trou.style.top=(r.top-m)+'px';
  trou.style.width=(r.width+m*2)+'px';trou.style.height=(r.height+m*2)+'px';

  const dessous=r.top<innerHeight*0.55;
  const b=$('bulle');
  const pastilles=ETAPES.slice(1).map((_,i)=>`<i class="${i+1===e.tuto?'on':''}"></i>`).join('');
  const pret=et.fait?et.fait():true;
  b.innerHTML=`<div class="fleche"></div>
    <div class="etiq">${et.etiq}</div><h3>${et.titre}</h3><p>${et.texte}</p>
    <div class="pied"><div class="pastilles">${pastilles}</div>
      ${et.bouton?`<button class="suite" id="t-next">${et.bouton}</button>`
        :`<span class="suite ${pret?'':'attente'}" id="t-next">${pret?'Continuer':et.attente}</span>`}
      <button class="passer" id="t-skip">Passer</button></div>`;
  if(dessous){b.style.top=Math.round(r.bottom+18)+'px';b.style.bottom='auto';}
  else{b.style.bottom=Math.round(innerHeight-r.top+18)+'px';b.style.top='auto';}
  const f=b.querySelector('.fleche');
  const rb=b.getBoundingClientRect();
  const cx=Math.min(Math.max(r.left+r.width/2-rb.left-7,20),rb.width-34);
  f.style.left=Math.round(cx)+'px';
  if(dessous){f.style.top='-7px';f.style.bottom='auto';}
  else{f.style.bottom='-7px';f.style.top='auto';}
  const n=$('t-next');
  if(n&&(et.bouton||pret))n.onclick=()=>{avancerTuto();};
  const sk=$('t-skip');if(sk)sk.onclick=()=>{e.tuto=-1;sauver();majTuto();};
}
function avancerTuto(){
  e.tuto++;
  if(e.tuto>=ETAPES.length){
    e.tuto=-1;e.or+=100;sauver();rendre();
    document.getElementById('accueil-b').outerHTML=`<div class="carte-postale" id="accueil-b">
      <div class="mot" style="padding:26px 12px 20px">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#2f6b1f" stroke-width="1.7"
          style="display:block;margin:0 auto 14px"><circle cx="12" cy="12" r="10"/>
          <path d="M8 12.5l2.6 2.6L16 9.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div class="kicker">TA FERME TOURNE</div>
        <h2 style="font-size:34px">+100 €</h2>
        <div class="filet"></div>
        <p>Le reste t’appartient.</p>
        <button class="cta vert" id="a-fin" style="background:var(--vert)">Continuer</button>
      </div></div>`;
    $('accueil').classList.add('on');
    $('a-fin').onclick=()=>{$('accueil').classList.remove('on');rendre();};
    return;
  }
  // l'étape 2 accélère la première pousse pour ne pas faire attendre
  if(e.tuto===2){
    const i=e.cases.findIndex(c=>c.c);
    if(i>=0&&e.cases[i].fin>Date.now()+9000)e.cases[i].fin=Date.now()+9000;
  }
  if(e.tuto===4&&vue!=='marche'){/* laisse le joueur ouvrir le marché */}
  sauver();rendre();
}
addEventListener('resize',()=>majTuto());

/* ================= rendu ================= */
function rendre(){
  auto();
  $('or').textContent=e.or.toLocaleString('fr-FR');
  $('niv').textContent=e.niv;
  $('xp-barre').style.width=Math.round(e.xp/XP_NIV(e.niv)*100)+'%';
  $('xp-txt').textContent=e.xp+'/'+XP_NIV(e.niv);
  $('nom-ferme').textContent=e.ferme;
  assurerCommandes();
  const pretes=(e.commandes||[]).filter(livrable).length;
  $('pt-cmd').style.display=pretes?'block':'none';
  $('corps').innerHTML=vue==='ferme'?vueFerme():vue==='marche'?vueMarche():
                       vue==='boutique'?vueBoutique():vueCommandes();
  brancher();
  // le tutoriel avance dès que la condition est remplie
  if(e.tuto>0&&ETAPES[e.tuto]&&ETAPES[e.tuto].fait&&ETAPES[e.tuto].fait()){
    if(!ETAPES[e.tuto]._vu){ETAPES[e.tuto]._vu=true;setTimeout(avancerTuto,420);}
  }
  requestAnimationFrame(majTuto);
}
rendre();
if(!e.accueilVu)ouvrirAccueil();
setInterval(()=>{auto();if(vue==='ferme')rendre();sauver();},1000);

sb.auth.getUser().then(({data})=>{
  const f=data&&data.user&&data.user.user_metadata&&data.user.user_metadata.ferme;
  if(f&&e.ferme!=='...'&&e.ferme!==f){e.ferme=f;sauver();$('nom-ferme').textContent=f;}
}).catch(()=>{});
