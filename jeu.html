<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f2a24">
<title>Survivre</title>
<style>
:root{--fond:#f1efe7;--carte:#fffdf8;--encre:#1f2620;--doux:#8a9083;--pale:#a8ab9e;
  --filet:#e4e2d6;--vert:#3f7d4a;--vert-c:#63a84a;--or:#b5822a;--rouge:#b8503c;--nuit:#1f2a24}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--fond);color:var(--encre);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font-family:inherit;font-size:15px;border:0;background:none;color:inherit;cursor:pointer}
.app{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
.corps{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;padding:0 14px 100px}
.titre{font:600 11px system-ui;letter-spacing:2px;color:var(--doux);margin:18px 2px 9px}
.carte{background:var(--carte);border:1px solid var(--filet);border-radius:16px;padding:14px}
.p{font:400 13px/1.6 system-ui;color:var(--doux)}
.p b{color:var(--encre);font-weight:600}
.note{font:400 12px/1.55 system-ui;color:var(--doux);margin:10px 3px}
.vide{font:400 13px/1.6 system-ui;color:var(--doux);text-align:center;padding:26px 10px}

.scene{position:relative;margin:0 -14px;height:26dvh;min-height:150px;max-height:220px;overflow:hidden}
.scene .ciel{position:absolute;inset:0;width:100%;height:100%}
.bandeau{position:absolute;left:14px;right:14px;bottom:12px;display:flex;align-items:flex-end;gap:10px}
.jour{font:600 10px system-ui;letter-spacing:2.6px;color:#fdfbf2;text-shadow:0 1px 4px rgba(15,25,15,.6);flex:1}
.meteo{font:400 15px Georgia,serif;color:#fdfbf2;text-shadow:0 2px 6px rgba(15,25,15,.6)}

.jauges{display:grid;gap:11px}
.jauge-l{display:flex;align-items:center;gap:10px}
.jauge-l .ic{flex:0 0 auto;display:flex}
.jauge-l .b{flex:1;height:8px;border-radius:5px;background:#eae7dc;overflow:hidden}
.jauge-l .b i{display:block;height:100%;border-radius:5px;transition:width .4s}
.jauge-l .v{font:600 12px system-ui;color:var(--doux);width:26px;text-align:right}

.deux{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.gros{background:var(--carte);border:1px solid var(--filet);border-radius:14px;padding:13px;
  font:600 14px system-ui;display:flex;flex-direction:column;align-items:center;gap:3px}
.gros span{font:400 11.5px system-ui;color:var(--doux)}
.gros:disabled{opacity:.45}
.gros:active{transform:translateY(1px)}

.sac{display:flex;flex-wrap:wrap;gap:9px}
.res{display:flex;align-items:center;gap:6px;background:#f5f2e9;border-radius:11px;padding:7px 10px;
  font:400 12px system-ui;color:var(--doux)}
.res b{font:600 13px system-ui;color:var(--encre)}

.ligne{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--carte);
  border:1px solid var(--filet);border-left:4px solid var(--filet);border-radius:14px;padding:12px;margin-bottom:8px}
.ligne.pret{border-left-color:var(--vert-c)}
.ligne .ic{width:42px;height:42px;border-radius:12px;background:#f5f2e9;display:flex;align-items:center;
  justify-content:center;flex:0 0 auto}
.ligne .t{flex:1;min-width:0}
.ligne .n{font:600 13.5px system-ui}
.ligne .d{font:400 12px system-ui;color:var(--doux);margin-top:2px}
.gains{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.g{font:600 10.5px system-ui;color:var(--doux);background:#f0ede2;border-radius:7px;padding:3px 7px}
.g.ok{background:#e8f2e2;color:var(--vert)}
.agir{border-radius:11px;padding:10px 13px;font:600 12.5px system-ui;flex:0 0 auto;
  background:var(--vert);color:#fdfbf4}
.agir.off{background:#f0ede2;color:var(--pale)}
.agir:disabled{opacity:.45}

.entree{display:flex;gap:11px;padding:11px 3px;border-bottom:1px solid var(--filet)}
.entree .q{font:600 10.5px system-ui;color:var(--pale);width:82px;flex:0 0 auto;padding-top:2px}
.entree .x{font:400 13px/1.5 system-ui;flex:1}

.bas{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--carte);border-top:1px solid var(--filet);
  display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
.bas button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  font:600 10.5px system-ui;color:var(--pale);padding:4px 0}
.bas button.on{color:var(--nuit)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));
  background:rgba(31,38,32,.94);color:#fff;padding:10px 16px;border-radius:999px;font:600 13px system-ui;
  z-index:40;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translate(-50%,-6px)}

#carte{position:fixed;left:0;right:0;top:0;bottom:0;z-index:5;display:none;background:#141c16}
#carte.on{display:block}
#carte canvas.jeu{position:absolute;inset:0;width:100%;height:100%;display:block}
#carte .hud{position:absolute;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));
  display:flex;gap:8px;align-items:flex-start;pointer-events:none}
#carte .mini{background:rgba(20,28,22,.62);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);
  border-radius:14px;padding:8px 11px;display:grid;gap:6px;min-width:120px}
#carte .mj{display:flex;align-items:center;gap:7px}
#carte .mj .b{width:52px;height:5px;border-radius:3px;background:rgba(255,255,255,.16);overflow:hidden}
#carte .mj .b i{display:block;height:100%;border-radius:3px}
#carte .mj span{font:600 10px system-ui;color:#dfe7dc}
#carte .info{margin-left:auto;background:rgba(20,28,22,.62);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:8px 12px;text-align:right}
#carte .info .j{font:600 9.5px system-ui;letter-spacing:1.8px;color:#9fb59c}
#carte .info .m{font:400 14px Georgia,serif;color:#f2efe4;margin-top:2px}
#carte .retour{position:absolute;right:12px;bottom:calc(20px + env(safe-area-inset-bottom));
  width:52px;height:52px;border-radius:50%;background:rgba(20,28,22,.7);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.14);color:#e8efe4;display:flex;align-items:center;justify-content:center}
#joy{position:absolute;left:14px;bottom:calc(16px + env(safe-area-inset-bottom));width:132px;height:132px;
  touch-action:none}
#action{position:absolute;right:12px;bottom:calc(88px + env(safe-area-inset-bottom));min-width:104px;
  border-radius:16px;padding:13px 16px;background:#63a84a;color:#0f1a10;font:600 13.5px system-ui;
  box-shadow:0 8px 20px rgba(0,0,0,.4);display:none;text-align:center}
#action.on{display:block}
#action b{display:block;font:600 11px system-ui;opacity:.75;margin-top:2px}

#depart{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:18px;
  background:#141c16}
#depart.on{display:flex}
.dep{width:100%;max-width:420px;text-align:center;color:#f2efe4}
.dep .k{font:600 10px system-ui;letter-spacing:6px;color:#7f9a80}
.dep h1{font:400 30px/1.2 Georgia,serif;margin-top:12px}
.dep p{font:400 14px/1.65 system-ui;color:#a9b6a6;margin-top:12px}
.dep .lieu{margin-top:22px;border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:18px;
  background:rgba(255,255,255,.05)}
.dep .lieu .n{font:400 24px Georgia,serif}
.dep .cta{width:100%;margin-top:20px;border-radius:15px;padding:16px;background:var(--vert-c);color:#0f1a10;
  font:600 15.5px system-ui}
.dep .relance{width:100%;margin-top:10px;padding:12px;font:600 12.5px system-ui;color:#7f9a80}
</style>
</head>
<body>
<div class="app">
  <div class="corps" id="corps"></div>
  <div class="bas" id="nav">
    <button data-v="camp" class="on">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
        <path d="M12 4 4 20h16z"/><path d="M9 20l3-7 3 7"/></svg>Camp</button>
    <button data-v="explorer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>Explorer</button>
    <button data-v="atelier">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.5 5.5a4 4 0 0 0 5 5L21 12l-9 9-4-4 9-9z"/><path d="M7 17l-3 3"/></svg>Atelier</button>
    <button data-v="journal">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
        <path d="M5 4h11l3 3v13H5z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>Journal</button>
  </div>
</div>

<div id="carte">
  <canvas id="cv" class="jeu"></canvas>
  <div class="hud">
    <div class="mini" id="mini"></div>
    <div class="info"><div class="j" id="c-jour">JOUR 1</div><div class="m" id="c-meteo">Ciel clair</div></div>
  </div>
  <canvas id="joy" width="132" height="132"></canvas>
  <button id="action"></button>
  <button class="retour" id="c-retour">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 4 4 20h16z"/><path d="M9 20l3-7 3 7"/></svg></button>
</div>

<div id="depart"><div class="dep" id="depart-b"></div></div>
<div class="toast" id="toast"></div>

<script type="module">
const $=id=>document.getElementById(id);
const duree=s=>s<60?Math.round(s)+' s':(s<3600?Math.round(s/60)+' min':(Math.round(s/360)/10)+' h');
/* ================= les quatre origines ================= */
const BIOMES=[
 {id:'ile',nom:'L’île',intro:'La mer t’a recraché sur une plage blanche.',
  ciel:['#8fd0ef','#bfe4f2','#f2e2bd'],sol:['#e2d3a8','#c9b98a'],accent:'#2f8fa8',
  froid:.5, zones:[
   {id:'plage',nom:'La plage',d:'sable, bois flotté, coquillages',ressources:{bois:2,fibre:1},duree:40},
   {id:'cocotiers',nom:'Les cocotiers',d:'noix de coco et palmes',ressources:{nourriture:2,fibre:2},duree:70},
   {id:'source',nom:'La source',d:'eau douce entre les rochers',ressources:{eau:3},duree:60},
   {id:'recif',nom:'Le récif',d:'poissons et crustacés',ressources:{nourriture:3},duree:110},
   {id:'jungle',nom:'La jungle',d:'bois dur, lianes, fruits',ressources:{bois:3,fibre:2,nourriture:1},duree:150},
   {id:'epave',nom:'L’épave',d:'métal, toile, outils rouillés',ressources:{metal:2,tissu:2},duree:220}]},
 {id:'foret',nom:'La forêt',intro:'L’avion s’est ouvert au-dessus des sapins.',
  ciel:['#a8c4d8','#c9dbe2','#e6e2c8'],sol:['#8fae72','#6f9256'],accent:'#3f7d4a',
  froid:1, zones:[
   {id:'clairiere',nom:'La clairière',d:'branches et herbes sèches',ressources:{bois:2,fibre:2},duree:45},
   {id:'ruisseau',nom:'Le ruisseau',d:'eau claire, truites',ressources:{eau:3,nourriture:1},duree:70},
   {id:'sousbois',nom:'Le sous-bois',d:'baies, champignons',ressources:{nourriture:2,fibre:1},duree:90},
   {id:'pins',nom:'La pinède',d:'troncs, résine',ressources:{bois:4},duree:130},
   {id:'carlingue',nom:'La carlingue',d:'tôle, sangles, trousse',ressources:{metal:2,tissu:3},duree:210},
   {id:'grotte',nom:'La grotte',d:'silex, abri de secours',ressources:{metal:1,pierre:3},duree:170}]},
 {id:'ville',nom:'La ville',intro:'Les rues sont vides depuis longtemps.',
  ciel:['#9aa3ac','#c2c6c2','#ddd6c2'],sol:['#b7b3a6','#9a968b'],accent:'#8a5a4a',
  froid:.8, zones:[
   {id:'rue',nom:'La rue',d:'débris, ferraille',ressources:{metal:2,pierre:1},duree:50},
   {id:'epicerie',nom:'L’épicerie',d:'conserves oubliées',ressources:{nourriture:3},duree:120},
   {id:'chateau',nom:'Le château d’eau',d:'une réserve encore pleine',ressources:{eau:4},duree:100},
   {id:'immeuble',nom:'L’immeuble',d:'tissus, meubles à casser',ressources:{tissu:3,bois:2},duree:140},
   {id:'atelier',nom:'L’atelier',d:'outils et pièces',ressources:{metal:4},duree:200},
   {id:'jardins',nom:'Les jardins ouvriers',d:'légumes redevenus sauvages',ressources:{nourriture:2,fibre:2},duree:160}]},
 {id:'banquise',nom:'Le grand froid',intro:'Le vent souffle depuis trois jours.',
  ciel:['#cfe4f2','#e6f0f7','#f2f6fa'],sol:['#e8eef4','#cfdae4'],accent:'#4a7d9c',
  froid:2, zones:[
   {id:'congere',nom:'La congère',d:'neige à faire fondre',ressources:{eau:3},duree:55},
   {id:'crevasse',nom:'La crevasse',d:'glace et pierres',ressources:{pierre:3},duree:95},
   {id:'trou',nom:'Le trou de pêche',d:'poisson sous la glace',ressources:{nourriture:3},duree:140},
   {id:'bois',nom:'Le bois mort',d:'quelques troncs échoués',ressources:{bois:3},duree:120},
   {id:'campement',nom:'Le campement',d:'toile, peaux, restes',ressources:{tissu:3,nourriture:1},duree:180},
   {id:'balise',nom:'La balise',d:'métal, batteries',ressources:{metal:3},duree:230}]}
];
const RESSOURCES={
 bois:{nom:'Bois'},fibre:{nom:'Fibre'},pierre:{nom:'Pierre'},metal:{nom:'Métal'},
 tissu:{nom:'Tissu'},eau:{nom:'Eau'},nourriture:{nom:'Vivres'}};

/* ================= artisanat ================= */
const RECETTES=[
 {id:'feu',nom:'Feu de camp',d:'réchauffe et éloigne les bêtes',cout:{bois:6,fibre:2},niv:1,type:'abri',effet:'chaleur'},
 {id:'gourde',nom:'Gourde',d:'garde 3 rations d’eau',cout:{tissu:2,fibre:2},niv:1,type:'objet'},
 {id:'lance',nom:'Lance',d:'de quoi te défendre la nuit',cout:{bois:4,pierre:2,fibre:2},niv:2,type:'arme',force:2},
 {id:'abri',nom:'Abri',d:'te protège du vent et des rôdeurs',cout:{bois:10,fibre:6},niv:2,type:'abri',effet:'abri'},
 {id:'filtre',nom:'Filtre à eau',d:'l’eau ne rend plus malade',cout:{tissu:3,pierre:2,metal:1},niv:3,type:'objet'},
 {id:'hache',nom:'Hache',d:'+1 bois à chaque récolte',cout:{metal:2,bois:3},niv:3,type:'outil'},
 {id:'manteau',nom:'Manteau',d:'la chaleur descend deux fois moins vite',cout:{tissu:5,fibre:3},niv:4,type:'habit'},
 {id:'palissade',nom:'Palissade',d:'les rôdeurs passent rarement',cout:{bois:16,pierre:8},niv:5,type:'abri',effet:'abri'},
 {id:'radio',nom:'Radio',d:'permet de retrouver les autres survivants',cout:{metal:6,tissu:2,pierre:2},niv:6,type:'radio'}
];

/* ================= météo ================= */
const METEOS=[
 {id:'clair',nom:'Ciel clair',d:'rien à signaler',poids:5,soif:1.2,chaleur:1},
 {id:'pluie',nom:'Pluie',d:'l’eau se récupère seule',poids:3,soif:.6,chaleur:1.4,eau:1},
 {id:'vent',nom:'Grand vent',d:'la chaleur file',poids:3,soif:1.1,chaleur:1.8},
 {id:'tempete',nom:'Tempête',d:'sortir devient dangereux',poids:1,soif:1.3,chaleur:2.4,danger:1.6},
 {id:'canicule',nom:'Chaleur écrasante',d:'la soif double',poids:2,soif:2.2,chaleur:.5}
];

/* ================= sauvegarde ================= */
const CLE='bdl.survie.v1';
const neuf=()=>({
  biome:null, nom:'Survivant', jour:1, debut:Date.now(), derniere:Date.now(),
  faim:100, soif:100, chaleur:100, sante:100, xp:0, niv:1,
  sacs:{}, objets:{}, zones:{}, meteo:'clair', meteoFin:0,
  journal:[], nuitsPassees:0, mortes:0, vu:false});
let e=neuf();
try{const b=localStorage.getItem(CLE);if(b)e=Object.assign(neuf(),JSON.parse(b));}catch(x){}
const sauver=()=>{try{localStorage.setItem(CLE,JSON.stringify(e));}catch(x){}};
const sac=k=>e.sacs[k]||0;
const ajouter=(k,n)=>{e.sacs[k]=sac(k)+n;};
const a=(id)=>!!e.objets[id];
const biome=()=>BIOMES.find(b=>b.id===e.biome)||BIOMES[0];
let tt;const toast=t=>{const z=$('toast');z.textContent=t;z.classList.add('on');
  clearTimeout(tt);tt=setTimeout(()=>z.classList.remove('on'),2200);};
const noter=(t)=>{e.journal.unshift({t,q:Date.now()});if(e.journal.length>40)e.journal.pop();};

/* ================= temps, jour et nuit ================= */
const JOUR_MS=60*60*1000;                  // une heure réelle vaut une journée
const heure=()=>((Date.now()-e.debut)%JOUR_MS)/JOUR_MS*24;
const nuit=()=>{const h=heure();return h<6||h>=20;};
const jourNo=()=>1+Math.floor((Date.now()-e.debut)/JOUR_MS);
const meteo=()=>METEOS.find(m=>m.id===e.meteo)||METEOS[0];

function tirerMeteo(){
  const total=METEOS.reduce((s,m)=>s+m.poids,0);
  let r=Math.random()*total;
  for(const m of METEOS){r-=m.poids;if(r<=0)return m;}
  return METEOS[0];
}

/* ================= usure des jauges ================= */
/* une jauge pleine tient huit heures pour la faim, six pour la soif, cinq pour le froid.
   Hors ligne, l'usure ne compte qu'à moitié : on ne punit pas d'avoir une vie. */
const USURE={faim:100/(8*3600), soif:100/(6*3600), chaleur:100/(5*3600)};
function ecouler(){
  const now=Date.now();
  let dt=(now-e.derniere)/1000;
  if(dt<=0)return;
  if(dt>36000)dt=36000;                    // on plafonne à dix heures d'absence
  const absence=dt>180;                    // au-delà de trois minutes, on était parti
  if(absence)dt*=0.5;
  e.derniere=now;

  if(now>e.meteoFin){const m=tirerMeteo();e.meteo=m.id;
    e.meteoFin=now+(4+Math.random()*6)*60000;}
  const m=meteo(), b=biome();

  e.faim=Math.max(0,e.faim-USURE.faim*dt);
  e.soif=Math.max(0,e.soif-USURE.soif*dt*(m.soif||1));
  const protege=(a('abri')?.45:1)*(a('manteau')?.5:1)*(a('feu')?.7:1);
  e.chaleur=Math.max(0,e.chaleur-USURE.chaleur*dt*(m.chaleur||1)*b.froid*protege);
  if(m.eau&&Math.random()<dt/600)ajouter('eau',1);

  /* la santé se dégrade quand une jauge tombe à zéro, remonte quand tout va bien */
  let mal=0;
  if(e.faim<=0)mal+=1.2;
  if(e.soif<=0)mal+=1.8;
  if(e.chaleur<=0)mal+=1.5;
  if(mal)e.sante=Math.max(0,e.sante-mal*dt/240);
  else if(e.faim>40&&e.soif>40&&e.chaleur>40)e.sante=Math.min(100,e.sante+dt/90);

  /* les nuits passées comptent : les rôdeurs frappent une fois par nuit */
  const nuitsTotal=Math.floor((now-e.debut)/JOUR_MS);
  let aTraiter=nuitsTotal-e.nuitsPassees;
  if(aTraiter>0){
    const sautees=Math.max(0,aTraiter-3);      // on ne rejoue jamais plus de trois nuits
    if(sautees){e.nuitsPassees+=sautees;
      noter(sautees+' nuits sont passées sans incident notable.');}
    for(let k=0;k<Math.min(3,aTraiter);k++){e.nuitsPassees++;passerNuit();}
  }
  if(e.sante<=0)mourir();
}
function passerNuit(){
  const b=biome(), m=meteo();
  const defense=(a('palissade')?3:0)+(a('abri')?2:0)+(a('feu')?1:0)+(a('lance')?2:0);
  const menace=(1.2+Math.min(e.nuitsPassees,12)*0.2)*(m.danger||1);
  if(defense>=menace){
    noter('Nuit '+e.nuitsPassees+' : rien n’a franchi ton campement.');
    gagnerXp(6);
  }else{
    const degats=Math.min(28,Math.round((menace-defense)*8));
    e.sante=Math.max(0,e.sante-degats);
    const qui=b.id==='ville'?'Des rôdeurs':'Des bêtes';
    noter('Nuit '+e.nuitsPassees+' : '+qui.toLowerCase()+' ont tourné autour. −'+degats+' de santé.');
    if(Object.keys(e.sacs).length&&Math.random()<.5){
      const k=Object.keys(e.sacs).filter(x=>sac(x)>0)[0];
      if(k){const perte=Math.max(1,Math.round(sac(k)/3));e.sacs[k]=sac(k)-perte;
        noter('Ils ont emporté '+perte+' '+RESSOURCES[k].nom.toLowerCase()+'.');}
    }
  }
}
function mourir(){
  e.mortes++;
  noter('Tu t’es effondré. Quelqu’un t’a traîné jusqu’à l’abri.');
  e.sante=45;e.faim=40;e.soif=40;e.chaleur=50;
  const perdu=Math.round(e.xp/2);e.xp=Math.max(0,e.xp-perdu);
  Object.keys(e.sacs).forEach(k=>{e.sacs[k]=Math.floor(sac(k)/2);});
  toast('Tu as failli y rester');
}

/* ================= niveaux ================= */
const XP_NIV=n=>Math.round(60*Math.pow(1.3,n-1));
function gagnerXp(n){
  e.xp+=n;
  while(e.xp>=XP_NIV(e.niv)){
    e.xp-=XP_NIV(e.niv);e.niv++;
    noter('Tu tiens le coup : niveau '+e.niv+'.');
    const nouvelles=RECETTES.filter(r=>r.niv===e.niv).map(r=>r.nom);
    if(nouvelles.length)toast('Niveau '+e.niv+' · '+nouvelles.join(', '));
    else toast('Niveau '+e.niv);
  }
}

/* ================= récolte ================= */
const pretZone=z=>{const t=e.zones[z.id]||0;return Date.now()>=t;};
const resteZone=z=>Math.max(0,Math.ceil(((e.zones[z.id]||0)-Date.now())/1000));
function fouiller(z){
  if(!pretZone(z))return toast('Épuisé pour ' + duree(resteZone(z)));
  if(e.chaleur<=0||e.soif<=0)return toast('Tu es trop faible pour partir');
  const m=meteo();
  if(m.id==='tempete'&&Math.random()<.35){
    e.sante=Math.max(0,e.sante-6);
    noter('La tempête t’a rabattu vers l’abri. −6 de santé.');
    toast('La tempête t’en empêche');sauver();rendre(true);return;
  }
  let recolte=[];
  Object.entries(z.ressources).forEach(([k,n])=>{
    let q=n+(Math.random()<.35?1:0);
    if(k==='bois'&&a('hache'))q+=1;
    ajouter(k,q);recolte.push(q+' '+RESSOURCES[k].nom.toLowerCase());
  });
  e.faim=Math.max(0,e.faim-4);
  e.soif=Math.max(0,e.soif-5);
  e.zones[z.id]=Date.now()+z.duree*1000;
  gagnerXp(Math.max(2,Math.round(z.duree/25)));
  noter('Tu as fouillé '+z.nom.toLowerCase()+' : '+recolte.join(', ')+'.');
  toast(recolte.join(' · '));
  sauver();rendre(true);
}
function boire(){
  if(sac('eau')<1)return toast('Pas d’eau');
  e.sacs.eau=sac('eau')-1;
  const sale=!a('filtre')&&Math.random()<.18;
  e.soif=Math.min(100,e.soif+34);
  if(sale){e.sante=Math.max(0,e.sante-8);noter('L’eau était trouble. −8 de santé.');toast('Elle avait un goût étrange');}
  else toast('+34 de soif');
  gagnerXp(1);sauver();rendre(true);
}
function manger(){
  if(sac('nourriture')<1)return toast('Rien à manger');
  e.sacs.nourriture=sac('nourriture')-1;
  e.faim=Math.min(100,e.faim+32);
  toast('+32 de faim');gagnerXp(1);sauver();rendre(true);
}
function fabriquer(r){
  if(r.niv>e.niv)return toast('Niveau '+r.niv+' requis');
  if(a(r.id)&&r.type!=='objet')return toast('Déjà en place');
  const manque=Object.entries(r.cout).filter(([k,n])=>sac(k)<n);
  if(manque.length)return toast('Il manque '+manque.map(([k,n])=>(n-sac(k))+' '+RESSOURCES[k].nom.toLowerCase()).join(', '));
  Object.entries(r.cout).forEach(([k,n])=>{e.sacs[k]=sac(k)-n;});
  e.objets[r.id]=true;
  gagnerXp(12);
  noter('Tu as fabriqué : '+r.nom.toLowerCase()+'.');
  toast(r.nom+' prêt');
  sauver();rendre(true);
}

/* ================= la carte à parcourir ================= */
const MONDE=1500;
function alea(s){let x=Math.sin(s*127.1)*43758.5453;return x-Math.floor(x);}
function construireMonde(){
  const b=biome(), objets=[];
  const g=b.id.length*97+b.zones.length*13;
  /* les six lieux du biome deviennent des bâtiments ou des gisements posés sur la carte */
  b.zones.forEach((z,i)=>{
    const ang=(i/b.zones.length)*6.283+alea(g+i)*0.6;
    const d=280+alea(g+i*7)*380;
    const x=MONDE/2+Math.cos(ang)*d, y=MONDE/2+Math.sin(ang)*d;
    const bati=['epave','carlingue','immeuble','atelier','epicerie','campement','balise','grotte','chateau'].includes(z.id);
    objets.push({id:z.id,type:bati?'batiment':'gisement',nom:z.nom,x,y,
      w:bati?96:64,h:bati?76:56,solide:true,zone:z});
  });
  /* décor : arbres, rochers, buissons */
  for(let i=0;i<150;i++){
    const x=40+alea(g+i*3.1)*(MONDE-80), y=40+alea(g+i*5.7)*(MONDE-80);
    if(objets.some(o=>Math.abs(o.x-x)<130&&Math.abs(o.y-y)<130))continue;
    const t=alea(g+i*11);
    objets.push({type:t<.55?'arbre':(t<.8?'rocher':'buisson'),x,y,
      w:t<.55?34:(t<.8?30:26),h:t<.55?40:26,solide:t<.8});
  }
  /* caisses de butin dispersées */
  for(let i=0;i<14;i++){
    const x=90+alea(g+i*17)*(MONDE-180), y=90+alea(g+i*23)*(MONDE-180);
    objets.push({id:'caisse'+i,type:'caisse',nom:'Caisse abandonnée',x,y,w:34,h:28,solide:true,
      butin:true});
  }
  return objets;
}

function dessinerCarte(cv,g){
  const b=biome(), n=nuit();
  const W=cv.width/ (window.devicePixelRatio>1?Math.min(2,window.devicePixelRatio):1), H=cv.height/(window.devicePixelRatio>1?Math.min(2,window.devicePixelRatio):1);
  const camX=Math.max(0,Math.min(MONDE-W,joueur.x-W/2));
  const camY=Math.max(0,Math.min(MONDE-H,joueur.y-H/2));
  const px=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.round(x-camX),Math.round(y-camY),w,h);};

  /* sol */
  g.fillStyle=b.sol[1];g.fillRect(0,0,W,H);
  const pas=48;
  for(let y=Math.floor(camY/pas)*pas;y<camY+H+pas;y+=pas)
    for(let x=Math.floor(camX/pas)*pas;x<camX+W+pas;x+=pas){
      const v=alea(x*0.07+y*0.13);
      px(x,y,pas,pas,v<.5?b.sol[0]:b.sol[1]);
      if(v<.18)px(x+10,y+14,5,5,b.accent+'33');
    }
  /* objets triés par profondeur */
  const vis=OBJETS.filter(o=>o.x>camX-140&&o.x<camX+W+140&&o.y>camY-160&&o.y<camY+H+160);
  vis.sort((p,q)=>p.y-q.y);
  vis.forEach(o=>{

    }else if(o.type==='rocher'){
      g.fillStyle='#8a8f96';g.beginPath();g.ellipse(x,y,15,11,0,0,7);g.fill();
      g.fillStyle='#a0a6ac';g.beginPath();g.ellipse(x-4,y-3,9,6,0,0,7);g.fill();
    }else if(o.type==='buisson'){
      g.fillStyle='#4f8a44';g.beginPath();g.ellipse(x,y,13,9,0,0,7);g.fill();
      g.fillStyle='#5da052';g.beginPath();g.ellipse(x-4,y-3,8,6,0,0,7);g.fill();
    }else if(o.type==='caisse'){
      const vide=!pretObjet(o);
      g.fillStyle=vide?'#8d8579':'#c08a52';g.fillRect(x-17,y-14,34,28);
      g.fillStyle=vide?'#7d7669':'#a8703a';g.fillRect(x-17,y-4,34,5);
      g.fillStyle='rgba(255,255,255,.2)';g.fillRect(x-17,y-14,34,3);
    }else if(o.type==='gisement'){
      g.fillStyle=b.accent;g.globalAlpha=.25;
      g.beginPath();g.ellipse(x,y,o.w/2,o.h/2,0,0,7);g.fill();g.globalAlpha=1;
      g.fillStyle='#8a8f96';
      [[-14,-6],[8,-10],[0,6],[16,4]].forEach(([dx,dy])=>{
        g.beginPath();g.ellipse(x+dx,y+dy,11,8,0,0,7);g.fill();});
      g.fillStyle='#a8b0b8';g.beginPath();g.ellipse(x-16,y-9,6,4,0,0,7);g.fill();
    }else{ /* bâtiment */
      const h=o.h;
      g.fillStyle='#c9bda4';g.fillRect(x-o.w/2,y-h/2,o.w,h);
      g.fillStyle='#b5a88c';g.fillRect(x-o.w/2,y+h/2-10,o.w,10);
      g.fillStyle='#8a6a4a';g.fillRect(x-o.w/2,y-h/2,o.w,8);
      g.fillStyle=n?'#f0d089':'#5d6d78';
      g.fillRect(x-o.w/2+12,y-h/2+18,18,14);g.fillRect(x+o.w/2-30,y-h/2+18,18,14);
      g.fillStyle='#6b4522';g.fillRect(x-10,y+h/2-24,20,24);
      g.fillStyle='#f2d47a';g.fillRect(x+4,y+h/2-13,3,3);
    }
    if((o.type==='caisse'||o.type==='gisement'||o.type==='batiment')&&pretObjet(o)){
      g.fillStyle='#8ed36a';g.beginPath();g.arc(x+o.w/2-4,y-o.h/2-6,5,0,7);g.fill();
      g.strokeStyle='rgba(142,211,106,.5)';g.lineWidth=2;
      g.beginPath();g.arc(x+o.w/2-4,y-o.h/2-6,8+Math.sin(Date.now()/400)*2,0,7);g.stroke();
    }
  });
  /* le joueur */
  const jx=joueur.x-camX, jy=joueur.y-camY;
  const b2=Math.floor(joueur.pas)%4, off=(b2===1?-1:b2===3?1:0);
  g.fillStyle='rgba(30,40,25,.25)';g.beginPath();g.ellipse(jx,jy+10,10,4,0,0,7);g.fill();
  g.fillStyle='#3f4a5c';g.fillRect(jx-6,jy-2,5,12);g.fillRect(jx+1,jy-2,5,12);
  g.fillStyle='#26211c';g.fillRect(jx-9,jy-20,18,19);
  g.fillStyle='#4f7d5c';g.fillRect(jx-8,jy-19,16,17);
  g.fillStyle='#4f7d5c';g.fillRect(jx-12,jy-18+off,4,11);g.fillRect(jx+8,jy-18-off,4,11);
  g.fillStyle='#26211c';g.fillRect(jx-8,jy-33,16,15);
  g.fillStyle='#e8c49a';g.fillRect(jx-7,jy-32,14,13);
  g.fillStyle='#3a2a1c';g.fillRect(jx-8,jy-35,16,6);
  if(joueur.dir==='bas'){g.fillStyle='#2b2a27';g.fillRect(jx-4,jy-26,2,2);g.fillRect(jx+2,jy-26,2,2);}
  /* voile de nuit */
  if(n){
    g.fillStyle='rgba(14,22,34,.5)';g.fillRect(0,0,W,H);
    const gr=g.createRadialGradient(jx,jy-10,10,jx,jy-10,120);
    gr.addColorStop(0,'rgba(255,226,150,.22)');gr.addColorStop(1,'rgba(255,226,150,0)');
    g.fillStyle=gr;g.fillRect(jx-130,jy-140,260,260);
  }
}
const pretObjet=o=>{
  if(o.type==='arbre'||o.type==='rocher'||o.type==='buisson')return false;
  return Date.now()>=(e.zones[o.id]||0);
};
function bloque(x,y){
  if(x<20||y<20||x>MONDE-20||y>MONDE-20)return true;
  return OBJETS.some(o=>o.solide&&
    Math.abs(o.x-x)<o.w/2+8 && Math.abs(o.y-y)<o.h/2+7);
}
function majJoueur(dt){
  let ix=joyX, iy=joyY;
  const n=Math.hypot(ix,iy);
  if(n>0.15){
    const v=115*Math.min(1,n)*dt;
    const nx=joueur.x+ (ix/n)*v, ny=joueur.y+(iy/n)*v;
    if(!bloque(nx,joueur.y))joueur.x=nx;
    if(!bloque(joueur.x,ny))joueur.y=ny;
    joueur.pas+=v*0.09;
    joueur.dir=Math.abs(ix)>Math.abs(iy)?(ix>0?'droite':'gauche'):(iy>0?'bas':'haut');
  }else joueur.pas=0;
  procheObjet=null;let meilleur=70;
  OBJETS.forEach(o=>{
    if(o.type==='arbre'||o.type==='rocher'||o.type==='buisson')return;
    const d=Math.hypot(o.x-joueur.x,o.y-joueur.y);
    if(d<meilleur){meilleur=d;procheObjet=o;}
  });
  e.pos={x:Math.round(joueur.x),y:Math.round(joueur.y)};
}
function fouillerObjet(o){
  if(!pretObjet(o))return toast('Déjà vidé · revient dans '+duree(Math.ceil(((e.zones[o.id]||0)-Date.now())/1000)));
  if(o.zone)return fouiller(o.zone);
  /* caisse : butin selon le biome */
  const table=BUTINS[e.biome]||BUTINS.foret;
  const nb=1+Math.floor(Math.random()*2);
  const pris=[];
  for(let i=0;i<nb;i++){
    const [k,q]=table[Math.floor(Math.random()*table.length)];
    const qq=q+(Math.random()<.3?1:0);
    ajouter(k,qq);pris.push(qq+' '+RESSOURCES[k].nom.toLowerCase());
  }
  e.zones[o.id]=Date.now()+(6+Math.random()*8)*60000;
  e.faim=Math.max(0,e.faim-2);e.soif=Math.max(0,e.soif-2);
  gagnerXp(4);
  noter('Caisse fouillée : '+pris.join(', ')+'.');
  toast(pris.join(' · '));
  sauver();
}

/* ================= l'écran de carte ================= */
const cv=$('cv'), ctx=cv.getContext('2d');
const jc=$('joy'), jg=jc.getContext('2d');
let DPR=Math.min(2,window.devicePixelRatio||1), enCarte=false, dernierT=0;

function tailleCarte(){
  const r=cv.getBoundingClientRect();
  cv.width=Math.round(r.width*DPR);cv.height=Math.round(r.height*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.imageSmoothingEnabled=false;
}
addEventListener('resize',()=>{if(enCarte)tailleCarte();});
(function joyNet(){const d=Math.min(3,window.devicePixelRatio||1);
  jc.width=132*d;jc.height=132*d;jg.setTransform(d,0,0,d,0,0);})();

const R=54,JCX=66,JCY=66;
let jdx=0,jdy=0,jactif=false,jid=null;
const jpos=t=>{const r=jc.getBoundingClientRect();
  return[(t.clientX-r.left)*132/r.width,(t.clientY-r.top)*132/r.height];};
function joyPose(x,y){
  const dx=x-JCX,dy=y-JCY,d=Math.hypot(dx,dy);
  const m=Math.min(d,R-20),ang=Math.atan2(dy,dx);
  jdx=d<0.01?0:Math.cos(ang)*m;jdy=d<0.01?0:Math.sin(ang)*m;
  const n=Math.min(1,d/(R-20));
  joyX=d<0.01?0:Math.cos(ang)*n;joyY=d<0.01?0:Math.sin(ang)*n;
  if(Math.hypot(joyX,joyY)<0.15){joyX=joyY=0;}
}
jc.addEventListener('touchstart',ev=>{ev.preventDefault();const t=ev.changedTouches[0];
  jid=t.identifier;jactif=true;joyPose(...jpos(t));},{passive:false});
jc.addEventListener('touchmove',ev=>{ev.preventDefault();
  for(const t of ev.changedTouches)if(t.identifier===jid)joyPose(...jpos(t));},{passive:false});
['touchend','touchcancel'].forEach(k=>jc.addEventListener(k,ev=>{ev.preventDefault();
  for(const t of ev.changedTouches)if(t.identifier===jid){jactif=false;jid=null;jdx=jdy=joyX=joyY=0;}},{passive:false}));
jc.addEventListener('mousedown',ev=>{jactif=true;joyPose(...jpos(ev));});
addEventListener('mousemove',ev=>{if(jactif)joyPose(...jpos(ev));});
addEventListener('mouseup',()=>{if(jactif){jactif=false;jdx=jdy=joyX=joyY=0;}});
addEventListener('keydown',ev=>{const k={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],
  z:[0,-1],s:[0,1],q:[-1,0],d:[1,0]}[ev.key];if(k){joyX=k[0];joyY=k[1];}
  if(ev.key==='Enter'&&procheObjet)fouillerObjet(procheObjet);});
addEventListener('keyup',()=>{joyX=joyY=0;});

function dessinerJoy(){
  jg.clearRect(0,0,132,132);
  jg.beginPath();jg.arc(JCX,JCY,R,0,7);
  const f=jg.createRadialGradient(JCX,JCY-16,6,JCX,JCY,R);
  f.addColorStop(0,'rgba(240,246,238,.34)');f.addColorStop(1,'rgba(200,212,198,.2)');
  jg.fillStyle=f;jg.fill();
  jg.lineWidth=2.5;jg.strokeStyle='rgba(240,246,238,.45)';jg.stroke();
  const kx=JCX+jdx,ky=JCY+jdy;
  jg.beginPath();jg.arc(kx,ky+3,20,0,7);jg.fillStyle='rgba(10,18,12,.35)';jg.fill();
  const k=jg.createRadialGradient(kx-5,ky-8,3,kx,ky,21);
  if(jactif){k.addColorStop(0,'#a9e88a');k.addColorStop(1,'#3f7d4a');}
  else{k.addColorStop(0,'#f4f7f0');k.addColorStop(1,'#c9d2c2');}
  jg.beginPath();jg.arc(kx,ky,20,0,7);jg.fillStyle=k;jg.fill();
  jg.lineWidth=2.5;jg.strokeStyle=jactif?'#2c6b32':'rgba(40,50,40,.5)';jg.stroke();
}

function majHud(){
  const m=meteo();
  $('c-jour').textContent='JOUR '+jourNo()+' · '+String(Math.floor(heure())).padStart(2,'0')+' h';
  $('c-meteo').textContent=(nuit()?'Nuit · ':'')+m.nom;
  $('mini').innerHTML=[['faim',e.faim,'#c98f3a'],['soif',e.soif,'#5fb3d6'],
    ['chaleur',e.chaleur,'#e0765a'],['sante',e.sante,'#7ecf72']]
    .map(([k,v,c])=>`<div class="mj"><span style="color:${c}">${ICO[k]}</span>
      <span class="b"><i style="width:${Math.round(v)}%;background:${c}"></i></span></div>`).join('');
  const a2=$('action');
  if(procheObjet){
    a2.classList.add('on');
    const pret=pretObjet(procheObjet);
    a2.innerHTML=(pret?'Fouiller':'Vidé')+`<b>${procheObjet.nom||'Caisse'}</b>`;
    a2.style.background=pret?'#63a84a':'rgba(20,28,22,.7)';
    a2.style.color=pret?'#0f1a10':'#c9d2c2';
  }else a2.classList.remove('on');
}
$('action').onclick=()=>{if(procheObjet)fouillerObjet(procheObjet);};
$('c-retour').onclick=()=>fermerCarte();

function ouvrirCarte(){
  if(!OBJETS)OBJETS=construireMonde();
  if(e.pos){joueur.x=e.pos.x;joueur.y=e.pos.y;}
  enCarte=true;$('carte').classList.add('on');
  document.querySelector('.app').style.display='none';
  tailleCarte();dernierT=performance.now();
  const boucle=(t)=>{
    if(!enCarte)return;
    boucleCarte=requestAnimationFrame(boucle);
    const dt=Math.min(.05,(t-dernierT)/1000);dernierT=t;
    ecouler();majJoueur(dt);dessinerCarte(cv,ctx);dessinerJoy();majHud();
  };
  boucleCarte=requestAnimationFrame(boucle);
}
function fermerCarte(){
  enCarte=false;if(boucleCarte)cancelAnimationFrame(boucleCarte);
  $('carte').classList.remove('on');
  document.querySelector('.app').style.display='';
  sauver();
  vue='camp';
  document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x.dataset.v==='camp'));
  rendre(true);
}
setInterval(()=>{if(enCarte)sauver();},4000);


/* ================= le départ ================= */
function tirerBiome(){
  const b=BIOMES[Math.floor(Math.random()*BIOMES.length)];
  $('depart-b').innerHTML=`
    <div class="k">TU T’ES RÉVEILLÉ</div>
    <h1>Quelque part</h1>
    <p>Chaque survivant échoue dans un endroit différent. Un jour, avec une radio, vous vous retrouverez.</p>
    <div class="lieu"><div class="n">${b.nom}</div>
      <p style="margin-top:8px">${b.intro}</p></div>
    <button class="cta" id="d-ok">Commencer ici</button>
    <button class="relance" id="d-re">tirer un autre endroit</button>`;
  $('depart').classList.add('on');
  $('d-ok').onclick=()=>{
    e.biome=b.id;e.debut=Date.now();e.derniere=Date.now();e.vu=true;
    noter('Tu ouvres les yeux. '+b.intro);
    sauver();$('depart').classList.remove('on');rendre(true);
  };
  $('d-re').onclick=tirerBiome;
}

/* ================= navigation ================= */
let vue='camp';
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{
  if(b.dataset.v==='explorer'){ouvrirCarte();return;}
  vue=b.dataset.v;
  document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x===b));
  $('corps').scrollTop=0;rendre(true);});

function brancher(){
  const z=$('corps');
  z.querySelectorAll('[data-zone]').forEach(b=>b.onclick=()=>{
    const zn=biome().zones.find(x=>x.id===b.dataset.zone);if(zn)fouiller(zn);});
  z.querySelectorAll('[data-fab]').forEach(b=>b.onclick=()=>{
    const r=RECETTES.find(x=>x.id===b.dataset.fab);if(r)fabriquer(r);});
  z.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{
    if(b.dataset.act==='boire')boire();else manger();});
}
function signature(){
  let g=vue+'|'+Math.round(e.faim)+'|'+Math.round(e.soif)+'|'+Math.round(e.chaleur)+'|'+Math.round(e.sante);
  g+='|'+e.niv+'|'+e.meteo+'|'+(nuit()?'n':'j')+'|'+jourNo()+'|'+Math.floor(heure()*6);
  Object.keys(RESSOURCES).forEach(k=>g+='|'+sac(k));
  g+='|'+Object.keys(e.objets).join(',');
  biome().zones.forEach(z=>g+='|'+(pretZone(z)?1:Math.ceil(resteZone(z)/5)));
  g+='|'+e.journal.length;
  return g;
}
let sig='';
function rendre(force){
  ecouler();
  if(!e.biome){$('depart').classList.contains('on')||tirerBiome();return;}
  const s=signature();
  if(!force&&s===sig)return;
  sig=s;
  const y=$('corps').scrollTop;
  $('corps').innerHTML=vue==='camp'?vueCamp():vue==='explorer'?vueExplorer():
                       vue==='atelier'?vueAtelier():vueJournal();
  brancher();
  $('corps').scrollTop=y;
}
rendre(true);
setInterval(()=>{ecouler();rendre();sauver();},1000);
</script>
