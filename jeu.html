<!DOCTYPE html><html lang="fr"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D2438">
<title>BattleDock 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Nunito:wght@600;700;800;900&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/bd2.css">
<link rel="stylesheet" href="css/ports.css">
<link rel="stylesheet" href="css/traversee.css">
<style>
.hub{position:fixed;inset:0;overflow:hidden;background:linear-gradient(180deg,#c8dce8 0%,#7ea8c2 52%,#4a7e9c 100%)}
.hub-ciel{position:absolute;left:0;right:0;top:0;height:55%;transition:background 30s}
.hub-ciel.aube{background:linear-gradient(180deg,#fae4c4,#c89060)}
.hub-ciel.jour{background:linear-gradient(180deg,#c8dce8,#5e94b0)}
.hub-ciel.soir{background:linear-gradient(180deg,#e8a880,#a04838)}
.hub-ciel.nuit{background:linear-gradient(180deg,#0a1828,#1e4468)}
.hub-mer{position:absolute;left:0;right:0;top:55%;bottom:0;background:linear-gradient(180deg,#5e90ae,#2a5e7c)}
.hub-fondu{position:absolute;left:0;right:0;top:50%;height:12%;background:linear-gradient(180deg,transparent,rgba(94,144,174,.5),transparent);pointer-events:none;z-index:1}
.hub-vg{position:absolute;left:-10%;right:-10%;height:2px;background:rgba(255,255,255,.12);animation:hubVg 9s ease-in-out infinite}
@keyframes hubVg{0%,100%{transform:translateX(-14px)}50%{transform:translateX(14px)}}
.hub-bat{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);z-index:5;width:180px;animation:hubBat 5s ease-in-out infinite}
.hub-bat svg{width:100%;height:auto;display:block;filter:drop-shadow(0 8px 20px rgba(0,0,0,.25))}
@keyframes hubBat{0%,100%{transform:translate(-50%,-50%) translateY(0)}50%{transform:translate(-50%,-50%) translateY(-6px)}}
.hub-hdr{position:absolute;left:0;right:0;top:0;z-index:20;padding:calc(12px + env(safe-area-inset-top)) 16px 10px;background:linear-gradient(180deg,rgba(13,36,56,.4),transparent);display:flex;align-items:center;gap:10px}
.hub-hdr-nom{font-family:var(--f-titre);font-weight:900;font-size:18px;color:#fff;flex:1;text-shadow:0 2px 10px rgba(0,0,0,.3)}
.hub-hdr-pill{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.12);backdrop-filter:blur(10px);color:#fff;font-weight:800;font-size:12px}
.hub-bas{position:absolute;left:0;right:0;bottom:0;z-index:20;padding:0 0 env(safe-area-inset-bottom);background:linear-gradient(180deg,transparent 0%,rgba(13,36,56,.45) 18%,rgba(13,36,56,.8) 100%)}
.hub-dest{text-align:center;padding:14px 16px 6px}
.hub-dest b{font-family:var(--f-titre);font-weight:900;font-size:12px;color:rgba(255,255,255,.4);letter-spacing:3px}
.hub-dest span{font-family:var(--f-main);font-size:14px;color:rgba(255,255,255,.35);display:block;margin-top:2px}
.hub-dests{display:flex;gap:10px;padding:8px 14px 12px;overflow-x:auto;scrollbar-width:none}
.hub-dests::-webkit-scrollbar{display:none}
.hub-dc{flex:0 0 auto;width:120px;border-radius:var(--r-md);overflow:hidden;background:rgba(255,255,255,.1);backdrop-filter:blur(12px);cursor:pointer;transition:transform var(--dur-micro);border:1.5px solid rgba(255,255,255,.1)}
.hub-dc:active{transform:scale(.95)}
.hub-dc.on{border-color:var(--gold)}
.hub-dc img{width:100%;height:68px;object-fit:cover;display:block}
.hub-dc .di{padding:8px 10px}
.hub-dc .di b{font-size:11px;font-weight:900;color:#fff;display:block}
.hub-dc .di s{text-decoration:none;font-size:9px;color:rgba(255,255,255,.45);font-weight:700;display:block;margin-top:2px}
.hub-dc.lock{opacity:.4;pointer-events:none}
.hub-go{display:block;margin:0 14px 12px;padding:16px;border-radius:var(--r-md);border:none;width:calc(100% - 28px);cursor:pointer;font-family:var(--f-corps);font-weight:900;font-size:14px;color:var(--ink);background:linear-gradient(180deg,var(--gold-light),var(--gold));box-shadow:0 5px 18px rgba(255,210,60,.35),0 2px 0 var(--gold-dark);transition:transform var(--dur-micro)}
.hub-go:active{transform:translateY(2px)}
.hub-go:disabled{background:rgba(255,255,255,.1);color:rgba(255,255,255,.35);box-shadow:none}

</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
<symbol id="ic-trade" viewBox="0 0 24 24"><path d="M7 16V4m0 0L3 8m4-4l4 4M17 8v12m0 0l4-4m-4 4l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
<symbol id="ic-hammer" viewBox="0 0 24 24"><path d="M14 6l-1-1-4 4 1 1M10 10l-7 7 4 4 7-7M13 5l5-3 4 4-3 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
<symbol id="ic-cargo" viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 8V5a4 4 0 018 0v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
<symbol id="ic-map" viewBox="0 0 24 24"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><line x1="9" y1="3" x2="9" y2="18" stroke="currentColor" stroke-width="2"/><line x1="15" y1="6" x2="15" y2="21" stroke="currentColor" stroke-width="2"/></symbol>
<symbol id="ic-star" viewBox="0 0 24 24"><polygon points="12,2 15,9 22,9.5 17,14.5 18.5,22 12,18 5.5,22 7,14.5 2,9.5 9,9" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
<symbol id="ic-anchor" viewBox="0 0 24 24"><circle cx="12" cy="5" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 8v13M5 18a7 7 0 0014 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="9" y1="12" x2="15" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
<symbol id="ic-horizon" viewBox="0 0 24 24"><circle cx="12" cy="10" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M2 18h20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
<symbol id="ic-swords" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M15 5h4v4M5 15v4h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="ic-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="12,2 14,10 12,12 10,10" fill="currentColor" opacity=".6"/></symbol>
<symbol id="ic-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
<symbol id="ic-ship" viewBox="0 0 24 24"><path d="M3 17l2 4h14l2-4M5 17l7-12 7 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="12" y1="5" x2="12" y2="17" stroke="currentColor" stroke-width="2"/></symbol>
<symbol id="ic-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
<symbol id="ic-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M14.5 9A3.5 3.5 0 0010 9c0 2 4 3 4 5a3.5 3.5 0 01-4.5 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
<symbol id="ic-scroll" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><line x1="9" y1="8" x2="15" y2="8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="9" y1="12" x2="15" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="9" y1="16" x2="12" y2="16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
</svg>
<div id="splashPort"><div style="text-align:center"><span style="font-family:'Fraunces',serif;font-weight:900;font-size:46px;color:#fff;letter-spacing:-1.6px;line-height:.88;text-shadow:0 2px 18px rgba(40,80,120,.2)">BattleDock 2</span><span style="font-family:'Fraunces',serif;font-weight:400;font-size:13px;letter-spacing:6px;color:rgba(255,255,255,.4);display:block;margin-top:13px">MÉDITERRANÉE</span></div><div style="width:120px;height:2px;background:rgba(255,255,255,.18);margin-top:46px;overflow:hidden;border-radius:1px"><div style="height:100%;width:0;background:rgba(255,255,255,.6);animation:spBarF 3.2s cubic-bezier(.3,.85,.5,1) forwards"></div></div><div style="margin-top:18px;font-size:10px;font-weight:700;color:rgba(255,255,255,.3)">Chargement…</div><div style="position:absolute;bottom:5%;left:0;right:0;text-align:center;font-size:7px;font-weight:800;letter-spacing:1.5px;color:rgba(255,255,255,.18)">Version 2.1</div></div>
<div class="hub" id="hub" style="display:none"><div class="hub-ciel jour" id="hubCiel"></div><div class="hub-mer"></div><div class="hub-fondu"></div><div class="hub-mer" style="z-index:2"><div class="hub-vg" style="top:8%"></div><div class="hub-vg" style="top:22%;animation-delay:-3s;opacity:.08"></div><div class="hub-vg" style="top:42%;animation-delay:-6s;opacity:.06"></div></div><div class="hub-bat" id="hubBat"></div><div class="hub-hdr"><div class="hub-hdr-nom" id="hubNom">Capitaine</div><div class="hub-hdr-pill" id="hubSous">0</div><div class="hub-hdr-pill" id="hubNiv">Niv. 1</div></div><div class="hub-bas"><div class="hub-dest"><b>DESTINATIONS</b><span id="hubPort"></span></div><div class="hub-dests" id="hubDests"></div><button class="hub-go" id="hubGo" disabled>Choisis une destination</button></div></div>
<div class="vtrav" id="vtrav">
  <div class="tr-ec h1" id="trEc">
    <div class="tr-ciel"></div>
    <div class="tr-halo"></div>
    <div class="tr-astre"></div>
    <div class="tr-etoiles" id="trEt"></div>
    <div class="tr-nuages" id="trNu"></div>
    <div class="tr-oi" style="top:13%">
      <svg width="34" height="12" viewBox="0 0 34 12">
        <path d="M2 8 Q7 2 12 8" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M18 5 Q24 0 30 5" fill="none" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
      </svg></div>
    <div class="tr-fondu"></div>
    <div class="tr-cote"><div class="tr-dest" id="trDest"></div></div>
    <div class="tr-mer">
      <div class="tr-horiz"></div>
      <div class="tr-chemin" id="trChm"></div>
      <div id="trVagues"></div>
    </div>
    <div class="tr-sill"><i></i><i style="animation-delay:-1.7s"></i></div>
    <div class="tr-bat" id="trBat"></div>
    <div class="tr-hd"><div class="tr-hd-in">
      <!-- pas de ✕ pendant la traversée -->
      <div class="tr-rt"><b id="trDestNom">—</b><span id="trRouteTxt">—</span></div>
      <div class="tr-mto"><span class="e" id="trMtoE">🌬</span><s id="trMtoT">BON VENT</s></div>
    </div></div>
    <div class="tr-tps"><b id="trTpsV">—</b><s>AVANT LA TERRE</s></div>
    <div class="tr-pd">
      <div class="tr-jg"><span class="tr-jg-t" id="trPct">0 %</span>
        <i id="trJgI" style="width:0"></i><u id="trJgU" style="left:0"></u></div>
      <div class="tr-nav" id="trNav">
        <button data-p="horizon"><svg class="ico" style="filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))"><use href="#ic-horizon"/></svg>Horizon</button>
        <button data-p="actions"><svg class="ico" style="filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))"><use href="#ic-swords"/></svg>Actions<span class="tp-badge" style="display:none">0</span></button>
        <button data-p="cale"><svg class="ico" style="filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))"><use href="#ic-cargo"/></svg>Cale</button>
        <button data-p="route"><svg class="ico" style="filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))"><use href="#ic-compass"/></svg>Route</button>
        <button data-p="navire"><svg class="ico" style="filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))"><use href="#ic-gear"/></svg>Navire</button>
      </div>
      <button class="tr-acc" id="trAcc"><svg class="ico ico-sm" style="margin-right:4px"><use href="#ic-anchor"/></svg>Terminer</button>
    </div>
  </div>
</div>


<!-- ══ PANNEAUX DE LA TRAVERSÉE ══ -->
<div class="tr-pan" id="tpHorizon"><div class="tp-h"><b>🌊 Horizon</b><button class="tp-x" data-tpclose>✕</button></div><div class="tp-c" id="tpHorizC"></div></div>
<div class="tr-pan" id="tpActions"><div class="tp-h"><b>⚔️ Actions</b><button class="tp-x" data-tpclose>✕</button></div><div class="tp-c" id="tpActionsC"></div></div>
<div class="tr-pan" id="tpCale"><div class="tp-h"><b>📦 Cale</b><button class="tp-x" data-tpclose>✕</button></div><div class="tp-c" id="tpCaleC"></div></div>
<div class="tr-pan" id="tpRoute"><div class="tp-h"><b>🧭 Route</b><button class="tp-x" data-tpclose>✕</button></div><div class="tp-c" id="tpRouteC"></div></div>
<div class="tr-pan" id="tpNavire"><div class="tp-h"><b>⚙️ Navire</b><button class="tp-x" data-tpclose>✕</button></div><div class="tp-c" id="tpNavireC"></div></div>

<div class="retour" id="retour"><div class="ret-carte" id="retCarte"></div></div>
<div id="toastC" style="position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:9999;pointer-events:none;width:92%;max-width:400px"></div>
<script src="js/config-ports.js"></script>
<script src="js/commun.js"></script>
<script src="js/bateau.js"></script>
<script src="js/traversee.js"></script>
<script>
'use strict';
let destChoisie=null;

function majHub(){
  if(!PROFIL)return;
  document.getElementById('hubNom').textContent=escapeHtml(PROFIL.pseudo)||'Capitaine';
  document.getElementById('hubSous').textContent='\u{1FA99} '+(PROFIL.sous||0);
  document.getElementById('hubNiv').textContent='Niv. '+niveauDe(PROFIL.xp||0);
  const pa=PORTS[PROFIL.port]||PORTS.marseille;
  document.getElementById('hubPort').textContent='Depuis '+pa.nom;
  const ciels=['aube','jour','soir','nuit'];
  const ciel=document.getElementById('hubCiel');
  ciels.forEach(c=>ciel.classList.remove(c));
  ciel.classList.add(ciels[trHeure()]);
  renduBateau('hubBat');
  const dests=document.getElementById('hubDests');
  let h='';
  Object.entries(PORTS).forEach(([id,p])=>{
    if(id===PROFIL.port)return;
    const niv=niveauDe(PROFIL.xp||0);
    const lock=niv<(p.niv||1);
    const duree=p.duree?formatDuree(p.duree*1000):'?';
    h+='<div class="hub-dc'+(lock?' lock':'')+'" data-dest="'+id+'">';
    h+='<img src="assets/panoramas/'+id+'.jpg" alt="'+escapeHtml(p.nom)+'" loading="lazy">';
    h+='<div class="di"><b>'+escapeHtml(p.nom)+'</b><s>'+(lock?'Niv. '+(p.niv||1)+' requis':duree)+'</s></div></div>';
  });
  dests.innerHTML=h;
  dests.querySelectorAll('.hub-dc:not(.lock)').forEach(c=>{
    c.onclick=()=>{
      dests.querySelectorAll('.hub-dc').forEach(x=>x.classList.remove('on'));
      c.classList.add('on');
      destChoisie=c.dataset.dest;
      const go=document.getElementById('hubGo');
      go.disabled=false;
      go.textContent='\uD83C\uDF0A Cap sur '+PORTS[destChoisie].nom;
    };
  });
}
document.getElementById('hubGo').onclick=async()=>{
  if(!destChoisie)return;
  const go=document.getElementById('hubGo');
  go.disabled=true;go.textContent='D\u00E9part...';
  try{
    const r=await rpc('bd2_larguer',{p_dest:destChoisie,p_route:'normale'});
    if(r&&r.erreur){toast('\u26A0\uFE0F '+r.erreur);go.disabled=false;go.textContent='R\u00E9essayer';return}
    await chargeProfil();
    trOuvre();
  }catch(e){toast('\u26A0\uFE0F Erreur r\u00E9seau');go.disabled=false;go.textContent='R\u00E9essayer'}
};
(async()=>{
  try{
    await chargeProfil();
    const sp=document.getElementById('splashPort');
    if(sp){sp.classList.add('off');setTimeout(()=>sp.remove(),700)}
    document.getElementById('hub').style.display='';
    if(voyageEnCours())trOuvre();
    else majHub();
  }catch(e){console.error(e);window.location.href='index.html'}
})();
</script>
</body></html>
