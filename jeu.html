<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>Mon cinéma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
</head>
<body>

<main class="contenu">
  <!-- 1. façade vivante -->
  <div class="facadeWrap" id="facade"></div>

  <!-- statut du cinéma -->
  <div class="statutCine" id="statutCine"></div>

  <!-- 2. Bob et son conseil -->
  <div class="blocBob">
    <div class="bob"><svg viewBox="0 0 120 150" aria-label="Bob">
      <path d="M32 112 Q18 122 22 138" stroke="#8a2f3c" stroke-width="12" fill="none" stroke-linecap="round"/>
      <ellipse cx="60" cy="118" rx="34" ry="30" fill="#8a2f3c"/>
      <path d="M44 104 L60 140 L76 104 Z" fill="#e8b84b"/>
      <g class="brasAnim">
        <path d="M88 108 Q104 96 100 78" stroke="#8a2f3c" stroke-width="12" fill="none" stroke-linecap="round"/>
        <circle cx="100" cy="74" r="7" fill="#f0c9a0"/>
      </g>
      <circle cx="60" cy="70" r="26" fill="#f0c9a0"/>
      <path d="M40 78 Q50 86 60 79 Q70 86 80 78 Q72 92 60 84 Q48 92 40 78" fill="#4a3527"/>
      <path d="M44 60 Q51 55 57 59 M63 59 Q69 55 76 60" stroke="#4a3527" stroke-width="4" fill="none" stroke-linecap="round"/>
      <circle cx="51" cy="66" r="2.6" fill="#1c1210"/><circle cx="69" cy="66" r="2.6" fill="#1c1210"/>
      <path d="M34 56 Q60 34 86 56 L86 50 Q60 28 34 50 Z" fill="#571520"/>
      <rect x="52" y="44" width="16" height="7" rx="2" fill="#e8b84b"/>
    </svg></div>
    <div class="bulle" id="bulleAccueil">
      <b>Bob — homme à tout faire officiel</b>
      <span id="bulleTexteAccueil">…</span>
    </div>
  </div>

  <div class="bandeauMeteo" id="bandeauMeteo"></div>
  <div id="bandeauEvenement"></div>

  <!-- 3. le héros : une seule chose importante à la fois -->
  <section class="carteHero" id="carteHero">
    <div class="heroSurtitre" id="heroSurtitre"></div>
    <div class="heroTitre" id="heroTitre"></div>
    <div class="heroPhrase" id="heroPhrase"></div>
    <div class="heroChiffres" id="heroChiffres"></div>
    <button class="actionPrincipale heroAction" id="actionPrincipale"></button>
  </section>

  <!-- 4. le panneau lumineux des séances, intégré au décor -->
  <div class="panneauSeances" id="panneauSeances">
    <div class="psAmpoules" id="psAmpoules"></div>
    <div id="listeSeances"></div>
  </div>

  <!-- 5. détail chiffré, accessible mais discret -->
  <details class="replie">
    <summary>Le détail de la journée</summary>
    <div class="replieCorps"><div id="resumeJour"></div></div>
  </details>

  <!-- 6. événements du quartier -->
  <section class="carteEcran">
    <h2>Dans le quartier</h2>
    <div id="listeEvenements"></div>
  </section>

  <div class="deviseBas" id="deviseBas"></div>
</main>

<script type="module" src="js/pages/jeu.js"></script>
</body>
</html>
