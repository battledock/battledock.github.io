<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#72a154">
<title>Survivre</title>
<style>
:root{--carte:#fffdf8;--encre:#1f2620;--doux:#8a9083;--pale:#a8ab9e;--filet:#e4e2d6;--vert:#3f7d4a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#2b3a26}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
#joy{position:fixed;left:14px;bottom:calc(16px + env(safe-area-inset-bottom));width:132px;height:132px;
  touch-action:none;z-index:3}
.rond{position:fixed;right:14px;z-index:3;width:54px;height:54px;border-radius:16px;
  background:rgba(20,28,20,.62);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.16);
  color:#eaf2e4;display:flex;align-items:center;justify-content:center}
#b-look{bottom:calc(16px + env(safe-area-inset-bottom))}

#pan{position:fixed;inset:0;z-index:20;display:none;background:rgba(16,24,16,.72);
  align-items:flex-end}
#pan.on{display:flex}
.feuille{width:100%;background:var(--carte);border-radius:22px 22px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom));
  max-height:88dvh;overflow-y:auto;animation:m .28s cubic-bezier(.2,.85,.3,1)}
@keyframes m{from{transform:translateY(26px)}}
.tete{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.vign{width:96px;height:132px;border-radius:14px;flex:0 0 auto;background:#72a154;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  box-shadow:inset 0 2px 8px rgba(20,40,15,.28)}
.vign canvas{image-rendering:pixelated;width:96px;height:132px}
.tete h2{font:400 20px Georgia,serif}
.tete p{font:400 12px/1.5 system-ui;color:var(--doux);margin-top:4px}
.hasard{margin-top:10px;width:100%;border-radius:12px;padding:10px;background:#f0ede2;
  font:600 12.5px system-ui;color:var(--encre)}
.sec{font:600 9.5px system-ui;letter-spacing:1.8px;color:var(--doux);margin:14px 2px 7px}
.ch{display:flex;flex-wrap:wrap;gap:7px}
.pa{width:34px;height:34px;border-radius:10px;border:2px solid transparent;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 1px 2px rgba(60,60,40,.2)}
.pa.on{border-color:var(--vert);box-shadow:0 0 0 3px rgba(63,125,74,.2)}
.pa.vide{background:#f0ede2;color:var(--pale);font:600 14px system-ui}
.mo{padding:8px 12px;border-radius:11px;background:#f0ede2;font:600 12px system-ui;color:var(--doux)}
.mo.on{background:var(--vert);color:#fdfbf4}
.ok{width:100%;margin-top:16px;border-radius:14px;padding:14px;background:var(--vert);
  color:#fdfbf4;font:600 14.5px system-ui}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<canvas id="joy" width="132" height="132"></canvas>
<button class="rond" id="b-look">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
    <circle cx="12" cy="8" r="4"/><path d="M4.5 20c1.6-4 4.4-6 7.5-6s5.9 2 7.5 6"/></svg></button>

<div id="pan"><div class="feuille" id="pan-b"></div></div>

<script type="module">
const $=id=>document.getElementById(id);
/* ================= le personnage, en pixels ================= */
const PALETTES={
 peau:['#f6ddc0','#f0d0ae','#e8c49a','#d8a878','#c08a58','#a2683c','#7d4e2a','#5a3720'],
 cheveux:['#1c140d','#2b1d12','#4a3220','#6b4726','#8a5f30','#b58a4a','#d9c48a','#f2e6c8',
          '#8a8f96','#c9c9c9','#a8402c','#c2604a','#6b3f8f','#2f6b8f','#3f7d4a','#b53f6b'],
 yeux:['#26241f','#3f5f6b','#4a6b3f','#6b4a3f','#5a4a6b','#7d6a3f','#2f6b8f','#8f4a3f'],
 veste:['#4f7d5c','#5a6b8f','#8a5a4a','#6b5f8f','#7d6a3f','#3f5f6b','#8f6a3f','#54606b',
        '#a8524a','#3f7d4a','#c2a04a','#2f3a4a','#7a4f6b','#4a7d7d','#9c5f2f','#5f5f5f'],
 pantalon:['#3a4358','#4a4038','#2f3a2f','#5a4a3a','#3a3a44','#6b5f4a','#2b3340','#7d6a4a'],
 chaussures:['#4a3524','#2f2a24','#5a4a3a','#6b4a28','#3f4a53','#7d5934'],
 sac:['aucun','#7d5934','#4a5c6b','#6b4a4a','#4f6b4a','#8a6a44','#54606b']
};
const COIFFES=['courts','longs','mi-longs','queue','chignon','crete','crane','frange',
               'tresses','ondules','afro','hirsute'];
const BARBES=['aucune','fine','courte','pleine','bouc','moustache','collier'];
const CHAPEAUX=['aucun','casquette','bandana','bonnet','capuche','chapeau','beret','cagoule'];
const YEUX_F=['normaux','plisses','ronds','fatigues'];

const DEF_AP={peau:2,cheveux:2,coiffe:0,barbe:0,yeux:0,formeYeux:0,veste:0,pantalon:0,
              chaussures:0,chapeau:0,sac:1};
const teint=(c,k)=>{
  const n=parseInt(c.slice(1),16);
  const f=v=>Math.max(0,Math.min(255,v+k));
  return '#'+((1<<24)+(f((n>>16)&255)<<16)+(f((n>>8)&255)<<8)+f(n&255)).toString(16).slice(1);
};

/* dessine le sprite dans un contexte, en pixels de jeu.
   Repère : x = milieu des pieds, y = sol. Corps 16 de large, 32 de haut. */
function sprite(g,x,y,ap0,dir,pas,bouge){
  const p=Object.assign({},DEF_AP,ap0||{});
  const P=PALETTES;
  const peau=P.peau[p.peau]||P.peau[2], peauO=teint(peau,-24), peauC=teint(peau,14), peauT=teint(peau,-52);
  const chev=P.cheveux[p.cheveux]||P.cheveux[2], chevC=teint(chev,22), chevO=teint(chev,-22);
  const veste=P.veste[p.veste]||P.veste[0], vesteC=teint(veste,20), vesteO=teint(veste,-26), vesteT=teint(veste,-48);
  const pant=P.pantalon[p.pantalon]||P.pantalon[0], pantO=teint(pant,-18);
  const chau=P.chaussures[p.chaussures]||P.chaussures[0], chauC=teint(chau,20);
  const oeil=P.yeux[p.yeux]||P.yeux[0];
  const coiffe=COIFFES[p.coiffe]||'courts', barbe=BARBES[p.barbe]||'aucune';
  const chapeau=CHAPEAUX[p.chapeau]||'aucun', sacC=P.sac[p.sac]||'aucun';
  const fy=YEUX_F[p.formeYeux]||'normaux';
  const N='#1b1712';
  const R=(a,b,w,h,c)=>{g.fillStyle=c;g.fillRect(x+a,y+b,w,h);};

  /* ---- marche souple : huit temps, mouvement discret ---- */
  const F=bouge?(Math.floor(pas)%8):-1;
  const AN={
    corps:[0,0,-1,0,0,0,-1,0],          /* à peine un pas glissé */
    jg:[2,1,-1,-2,-2,-1,1,2],
    jd:[-2,-1,1,2,2,1,-1,-2],
    pg:[0,0,1,0,0,0,0,0],
    pd:[0,0,0,0,0,0,1,0],
    bg:[-2,-1,1,2,2,1,-1,-2],
    bd:[2,1,-1,-2,-2,-1,1,2],
    tete:[0,0,0,0,0,0,0,0],             /* la tête reste stable */
    reb:[0,0,1,0,0,0,1,0]
  };
  const souffle=bouge?0:((Date.now()/1400|0)%3===0?1:0);
  const Y=bouge?AN.corps[F]:souffle;
  const jgP=bouge?AN.jg[F]:0, jdP=bouge?AN.jd[F]:0;
  const jgL=bouge?AN.pg[F]:0, jdL=bouge?AN.pd[F]:0;
  const bgP=bouge?AN.bg[F]:0, bdP=bouge?AN.bd[F]:0;
  const teteY=0;
  const reb=bouge?AN.reb[F]:0;
  const contact=bouge&&(F===0||F===4);
  const prof=dir==='haut', cote=dir==='gauche'||dir==='droite';
  const s=dir==='droite'?1:-1;

  /* ombre : elle se resserre quand les jambes se croisent */
  R(-7,1,14,2,'rgba(40,60,28,.42)');

  /* sac à dos, il rebondit */
  if(sacC!=='aucun'&&!prof){
    const sx=cote?(s>0?-9:4):-8;
    R(sx,Y-15-reb,5,9,teint(sacC,-16));
    R(sx,Y-15-reb,5,2,teint(sacC,14));
    R(sx+1,Y-9-reb,3,1,teint(sacC,-30));
  }

  /* jambes : cuisse décalée en avant ou en arrière, genou plié au passage */
  const jambe=(dec,plie,col,colB,botte)=>{
    const h=7-plie;
    R(-2+dec,Y-7,4,h,col);
    R(-2+dec,Y-7,4,1,teint(col,10));
    R(-3+dec,Y-7+h,5,3,botte);
    R(-3+dec,Y-7+h,5,1,teint(botte,18));
  };
  if(cote){                                  /* de profil : une jambe devant, une derrière */
    jambe(jdP*s*0.9-1,jdL,pantO,pantO,teint(chau,-14));
    jambe(jgP*s*0.9-1,jgL,pant,pant,chau);
  }else{
    jambe(-3+(jgP*0.35|0),jgL,pant,pant,chau);
    jambe(2+(jdP*0.35|0),jdL,pantO,pantO,teint(chau,-14));
  }

  /* torse, légèrement penché en avant quand on marche */
  const pen=0;                              /* pas d'inclinaison : c'est une marche calme */
  R(-8+pen,Y-19,16,13,N);
  R(-7+pen,Y-18,14,11,veste);
  R(-7+pen,Y-18,14,2,vesteC);
  R(-7+pen,Y-18,3,11,vesteT);
  R(-7+pen,Y-10,14,2,vesteO);
  R(-1+pen,Y-9,2,2,'#c9a24a');
  if(!prof){R(-1+pen,Y-18,2,8,vesteO);R(-5+pen,Y-18,3,2,vesteC);R(2+pen,Y-18,3,2,vesteC);}

  /* bras : de profil ils balancent vers l'avant et l'arrière ;
     de face ils restent le long du corps, comme dans la vraie marche vue de haut */
  if(cote){
    const av=Math.round(bdP*0.7), ar=Math.round(bgP*0.7);
    R((s>0?-3:0)-ar*s,Y-18,3,9,vesteT);          /* bras arrière */
    R((s>0?-3:0)-ar*s,Y-9,3,3,peauO);
    R((s>0?4:-7)+av*s,Y-18,3,9,veste);           /* bras avant */
    R((s>0?4:-7)+av*s,Y-9,3,3,peau);
  }else{
    const ec=Math.abs(bdP)>2?1:0;                /* ils s'écartent d'un pixel au plus */
    R(-11-ec,Y-18,3,9,vesteT);
    R(-11-ec,Y-9,3,3,peauO);
    R(8+ec,Y-18,3,9,veste);
    R(8+ec,Y-9,3,3,peau);
  }

  /* tête, avec son léger retard */
  const YT=Y+teteY;
  R(-7,YT-31,14,12,N);
  R(-6,YT-30,12,10,peau);
  R(-6,YT-30,3,10,peauO);
  R(-6,YT-30,12,1,peauC);
  if(!prof){R(-8,YT-26,2,3,peauO);R(6,YT-26,2,3,peau);}
  /* barbe */
  if(!prof){
    if(barbe==='pleine'){R(-5,YT-24,10,6,chev);R(-3,YT-19,6,2,chevO);}
    else if(barbe==='courte')R(-5,YT-22,10,4,chev);
    else if(barbe==='fine')R(-5,YT-22,10,2,chevO);
    else if(barbe==='bouc')R(-2,YT-22,4,4,chev);
    else if(barbe==='moustache')R(-3,YT-23,6,1,chev);
    else if(barbe==='collier'){R(-6,YT-26,2,7,chev);R(4,YT-26,2,7,chev);R(-5,YT-21,10,2,chev);}
  }
  /* cheveux : les longueurs traînent d'un pixel dans le sens opposé à la marche */
  const tr=bouge?(cote?-s:0):0;
  const masse=()=>{
    R(-7,YT-33,14,4,chev);R(-7,YT-32,4,1,chevC);
    R(-7,YT-30,2,4,chev);R(5,YT-30,2,4,chevO);
  };
  if(coiffe==='crane')R(-7,YT-33,14,2,chevO);
  else if(coiffe==='crete'){R(-7,YT-31,14,2,chevO);R(-2,YT-37-reb,4,6,chev);R(-2,YT-37-reb,2,6,chevC);}
  else if(coiffe==='afro'){R(-9,YT-37,18,8,chev);R(-9,YT-36,5,3,chevC);
    R(-9,YT-31,3,5,chev);R(6,YT-31,3,5,chevO);}
  else if(coiffe==='hirsute'){masse();R(-9,YT-34,3,3,chev);R(6,YT-35,3,3,chev);
    R(-3,YT-36-reb,3,3,chev);R(2,YT-37-reb,2,3,chevC);}
  else{
    masse();
    if(coiffe==='longs'){R(-9+tr,YT-31,2,14,chev);R(7+tr,YT-31,2,14,chevO);}
    if(coiffe==='mi-longs'){R(-9+tr,YT-31,2,9,chev);R(7+tr,YT-31,2,9,chevO);}
    if(coiffe==='queue'){R(7+tr,YT-30,3,11,chev);R(7+tr,YT-21,3,2,chevO);}
    if(coiffe==='chignon'){R(-3,YT-38-reb,6,5,chev);R(-3,YT-38-reb,3,2,chevC);}
    if(coiffe==='frange')R(-7,YT-29,14,2,chevO);
    if(coiffe==='tresses'){R(-9+tr,YT-31,3,5,chev);R(-9+tr,YT-25,3,5,chev);
      R(6+tr,YT-31,3,5,chevO);R(6+tr,YT-25,3,5,chevO);}
    if(coiffe==='ondules'){R(-9+tr,YT-31,2,6,chev);R(7+tr,YT-31,2,6,chevO);
      R(-10+tr,YT-26,2,4,chev);R(8+tr,YT-26,2,4,chevO);}
  }
  /* chapeau */
  if(chapeau==='casquette'){R(-8,YT-36,16,4,'#3f5f6b');R(-8,YT-36,16,1,'#547a88');
    R(cote?(s>0?0:-14):-8,YT-32,14,2,'#33505a');}
  else if(chapeau==='bandana'){R(-8,YT-34,16,3,'#a8524a');R(-8,YT-34,16,1,'#c46a5e');
    R(6+tr,YT-31,3,5,'#8f4038');}
  else if(chapeau==='bonnet'){R(-8,YT-38,16,6,'#8a4a3a');R(-8,YT-38,16,1,'#a85c48');
    R(-8,YT-33,16,2,'#a85c48');R(-2,YT-41-reb,4,3,'#c07260');}
  else if(chapeau==='capuche'){R(-9,YT-37,18,10,'#54606b');R(-9,YT-37,18,2,'#68757f');
    R(-9,YT-28,2,7,'#465059');R(7,YT-28,2,7,'#465059');
    R(-6,YT-30,12,10,peau);R(-6,YT-30,3,10,peauO);}
  else if(chapeau==='chapeau'){R(-11,YT-33,22,2,'#5a4a2c');R(-7,YT-38,14,5,'#8f7a49');
    R(-7,YT-35,14,2,'#5a4a2c');}
  else if(chapeau==='beret'){R(-8,YT-36,15,4,'#2f4a5c');R(-8,YT-36,7,2,'#3f6076');
    R(5,YT-38-reb,2,2,'#2f4a5c');}
  else if(chapeau==='cagoule'){R(-8,YT-34,16,14,'#3a3a44');R(-8,YT-34,16,2,'#4a4a56');
    R(-5,YT-26,4,3,peau);R(1,YT-26,4,3,peau);}

  /* visage */
  const Yv=Y+teteY;
  if(dir==='bas'){
    const clin=(Date.now()+x*53)%4600<130;
    if(chapeau!=='cagoule'){
      R(-5,Yv-27,3,1,chevO);R(2,Yv-27,3,1,chevO);
      if(clin){R(-5,Yv-25,3,1,oeil);R(2,Yv-25,3,1,oeil);}
      else{
        if(fy==='ronds'){R(-5,Yv-26,3,3,'#f4f1ea');R(2,Yv-26,3,3,'#f4f1ea');
          R(-4,Yv-26,2,3,oeil);R(3,Yv-26,2,3,oeil);}
        else if(fy==='plisses'){R(-5,Yv-25,3,1,oeil);R(2,Yv-25,3,1,oeil);}
        else if(fy==='fatigues'){R(-5,Yv-25,3,2,'#f4f1ea');R(2,Yv-25,3,2,'#f4f1ea');
          R(-4,Yv-25,2,2,oeil);R(3,Yv-25,2,2,oeil);R(-5,Yv-23,3,1,peauT);R(2,Yv-23,3,1,peauT);}
        else{R(-5,Yv-26,3,2,'#f4f1ea');R(2,Yv-26,3,2,'#f4f1ea');
          R(-4,Yv-26,2,2,oeil);R(3,Yv-26,2,2,oeil);}
      }
      R(0,Yv-23,1,1,peauT);
      R(-2,Yv-21,4,1,peauT);
    }else{R(-5,Yv-26,3,2,oeil);R(2,Yv-26,3,2,oeil);}
  }else if(cote){
    const dx=s>0?2:-4;
    R(dx,Yv-27,2,1,chevO);
    R(dx,Yv-26,2,2,'#f4f1ea');R(dx+(s>0?1:0),Yv-26,1,2,oeil);
    R(s>0?6:-7,Yv-24,1,1,peauT);
  }
}

/* ================= le monde ================= */
const MONDE=1024;                 // en pixels de jeu
const ZOOM=3;                     // chaque pixel du jeu fait 3 pixels d'écran
let SOL=null;

const alea=s=>{const v=Math.sin(s*127.1)*43758.5453;return v-Math.floor(v);};
function construireSol(){
  const c=document.createElement('canvas');c.width=MONDE;c.height=MONDE;
  const g=c.getContext('2d');
  /* fond : le grain fin, tuile de 8 */
  for(let y=0;y<MONDE;y+=8)for(let x=0;x<MONDE;x+=8){
    g.fillStyle='#72a154';g.fillRect(x,y,8,8);
    g.fillStyle='#85b664';g.fillRect(x+1,y+2,1,2);
    g.fillStyle='#5e8a47';g.fillRect(x+5,y+5,1,2);
  }
  /* plaques claires et sombres, posées en blocs */
  const plaque=(cx,cy,col,n)=>{
    for(let i=0;i<n;i++){
      const w=8+Math.floor(alea(cx+i*3)*5)*8, h=8+Math.floor(alea(cy+i*7)*3)*8;
      const x=cx+Math.floor((alea(i*11)-.5)*7)*8, y=cy+Math.floor((alea(i*13)-.5)*5)*8;
      g.fillStyle=col;g.fillRect(x,y,w,h);
    }
  };
  for(let i=0;i<70;i++)plaque(Math.floor(alea(i*1.7)*MONDE/8)*8,Math.floor(alea(i*2.3)*MONDE/8)*8,'#7db35d',4);
  for(let i=0;i<55;i++)plaque(Math.floor(alea(i*3.1)*MONDE/8)*8,Math.floor(alea(i*4.7)*MONDE/8)*8,'#63914b',3);
  for(let i=0;i<22;i++)plaque(Math.floor(alea(i*5.9)*MONDE/8)*8,Math.floor(alea(i*6.1)*MONDE/8)*8,'#a8895c',2);
  /* brins semés par-dessus */
  for(let i=0;i<7000;i++){
    const x=Math.floor(alea(i*1.3)*MONDE), y=Math.floor(alea(i*2.9)*MONDE);
    const v=alea(i*3.7);
    g.fillStyle=v<.4?'#8cc069':(v<.75?'#5e8a47':'#96cb72');
    g.fillRect(x,y,1,2);
  }
  /* fleurs */
  const fl=['#e8d76a','#f0f4f2','#e8607a','#c98fe0'];
  for(let i=0;i<180;i++){
    const x=Math.floor(alea(i*7.7)*MONDE), y=Math.floor(alea(i*8.3)*MONDE);
    g.fillStyle='#5e8a47';g.fillRect(x,y,1,2);
    g.fillStyle=fl[i%4];g.fillRect(x,y-1,2,1);
    g.fillStyle='#ffffff';g.fillRect(x,y-1,1,1);
  }
  return c;
}

/* ================= état ================= */
const CLE='bdl.pix.v1';
let e={x:MONDE/2,y:MONDE/2,ap:Object.assign({},DEF_AP)};
try{const b=localStorage.getItem(CLE);if(b)e=Object.assign(e,JSON.parse(b));}catch(x){}
const sauver=()=>{try{localStorage.setItem(CLE,JSON.stringify(e));}catch(x){}};

let joueur={x:e.x,y:e.y,dir:'bas',pas:0};
let joyX=0,joyY=0;

/* ================= rendu ================= */
const cv=$('cv'), ctx=cv.getContext('2d');
let VW=0,VH=0;
function taille(){
  const dpr=Math.min(2,window.devicePixelRatio||1);
  const w=cv.clientWidth, h=cv.clientHeight;
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  ctx.setTransform(dpr*ZOOM,0,0,dpr*ZOOM,0,0);
  ctx.imageSmoothingEnabled=false;
  VW=w/ZOOM;VH=h/ZOOM;                       // vue en pixels de jeu
}
addEventListener('resize',taille);

function dessiner(){
  if(!SOL)SOL=construireSol();
  const camX=Math.round(Math.max(0,Math.min(MONDE-VW,joueur.x-VW/2)));
  const camY=Math.round(Math.max(0,Math.min(MONDE-VH,joueur.y-VH/2)));
  ctx.fillStyle='#2b3a26';ctx.fillRect(0,0,VW,VH);
  ctx.drawImage(SOL,camX,camY,Math.min(VW,MONDE),Math.min(VH,MONDE),
                0,0,Math.min(VW,MONDE),Math.min(VH,MONDE));
  sprite(ctx,Math.round(joueur.x-camX),Math.round(joueur.y-camY),e.ap,joueur.dir,joueur.pas,!!(joyX||joyY));
}

/* ================= déplacement ================= */
function majJoueur(dt){
  const n=Math.hypot(joyX,joyY);
  if(n>0.15){
    const v=46*Math.min(1,n)*dt;              // en pixels de jeu par seconde
    const nx=joueur.x+(joyX/n)*v, ny=joueur.y+(joyY/n)*v;
    joueur.x=Math.max(10,Math.min(MONDE-10,nx));
    joueur.y=Math.max(16,Math.min(MONDE-6,ny));
    joueur.pas+=v*0.5;                        // cadence calme
    joueur.dir=Math.abs(joyX)>Math.abs(joyY)?(joyX>0?'droite':'gauche'):(joyY>0?'bas':'haut');
  }else joueur.pas=0;
  e.x=Math.round(joueur.x);e.y=Math.round(joueur.y);
}

/* ================= joystick ================= */
const jc=$('joy'), jg=jc.getContext('2d');
(function(){const d=Math.min(3,window.devicePixelRatio||1);
  jc.width=132*d;jc.height=132*d;jg.setTransform(d,0,0,d,0,0);})();
const R=54,JCX=66,JCY=66;
let jdx=0,jdy=0,jactif=false,jid=null;
const jpos=t=>{const r=jc.getBoundingClientRect();
  return[(t.clientX-r.left)*132/r.width,(t.clientY-r.top)*132/r.height];};
function joyPose(x,y){
  const dx=x-JCX,dy=y-JCY,d=Math.hypot(dx,dy);
  const m=Math.min(d,R-20),ang=Math.atan2(dy,dx);
  jdx=d<.01?0:Math.cos(ang)*m;jdy=d<.01?0:Math.sin(ang)*m;
  const nn=Math.min(1,d/(R-20));
  joyX=d<.01?0:Math.cos(ang)*nn;joyY=d<.01?0:Math.sin(ang)*nn;
  if(Math.hypot(joyX,joyY)<.15)joyX=joyY=0;
}
jc.addEventListener('touchstart',ev=>{ev.preventDefault();const t=ev.changedTouches[0];
  jid=t.identifier;jactif=true;joyPose(...jpos(t));},{passive:false});
jc.addEventListener('touchmove',ev=>{ev.preventDefault();
  for(const t of ev.changedTouches)if(t.identifier===jid)joyPose(...jpos(t));},{passive:false});
['touchend','touchcancel'].forEach(k=>jc.addEventListener(k,ev=>{ev.preventDefault();
  for(const t of ev.changedTouches)if(t.identifier===jid){jactif=false;jid=null;jdx=jdy=joyX=joyY=0;}},{passive:false}));
jc.addEventListener('mousedown',ev=>{jactif=true;joyPose(...jpos(ev));});
addEventListener('mousemove',ev=>{if(jactif)joyPose(...jpos(ev));});
addEventListener('mouseup',()=>{if(jactif){jactif=false;jdx=jdy=joyX=joyY=0;}});
addEventListener('keydown',ev=>{const k={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],
  z:[0,-1],s:[0,1],q:[-1,0],d:[1,0]}[ev.key];if(k){joyX=k[0];joyY=k[1];}});
addEventListener('keyup',()=>{joyX=joyY=0;});
function dessinerJoy(){
  jg.clearRect(0,0,132,132);
  jg.beginPath();jg.arc(JCX,JCY,R,0,7);
  const f=jg.createRadialGradient(JCX,JCY-16,6,JCX,JCY,R);
  f.addColorStop(0,'rgba(240,246,238,.3)');f.addColorStop(1,'rgba(200,212,198,.16)');
  jg.fillStyle=f;jg.fill();
  jg.lineWidth=2.5;jg.strokeStyle='rgba(240,246,238,.4)';jg.stroke();
  const kx=JCX+jdx,ky=JCY+jdy;
  jg.beginPath();jg.arc(kx,ky+3,20,0,7);jg.fillStyle='rgba(10,18,12,.3)';jg.fill();
  const k=jg.createRadialGradient(kx-5,ky-8,3,kx,ky,21);
  if(jactif){k.addColorStop(0,'#a9e88a');k.addColorStop(1,'#3f7d4a');}
  else{k.addColorStop(0,'#f4f7f0');k.addColorStop(1,'#c9d2c2');}
  jg.beginPath();jg.arc(kx,ky,20,0,7);jg.fillStyle=k;jg.fill();
  jg.lineWidth=2.5;jg.strokeStyle=jactif?'#2c6b32':'rgba(40,50,40,.45)';jg.stroke();
}

/* ================= la personnalisation ================= */
const GROUPES=[
 {c:'peau',      t:'Teint',     l:()=>PALETTES.peau,      k:'couleur'},
 {c:'cheveux',   t:'Cheveux',   l:()=>PALETTES.cheveux,   k:'couleur'},
 {c:'coiffe',    t:'Coiffure',  l:()=>COIFFES,            k:'mot'},
 {c:'barbe',     t:'Barbe',     l:()=>BARBES,             k:'mot'},
 {c:'chapeau',   t:'Sur la tête',l:()=>CHAPEAUX,          k:'mot'},
 {c:'yeux',      t:'Yeux',      l:()=>PALETTES.yeux,      k:'couleur'},
 {c:'formeYeux', t:'Regard',    l:()=>YEUX_F,             k:'mot'},
 {c:'veste',     t:'Veste',     l:()=>PALETTES.veste,     k:'couleur'},
 {c:'pantalon',  t:'Pantalon',  l:()=>PALETTES.pantalon,  k:'couleur'},
 {c:'chaussures',t:'Chaussures',l:()=>PALETTES.chaussures,k:'couleur'},
 {c:'sac',       t:'Sac à dos', l:()=>PALETTES.sac,       k:'sac'}
];
function apercu(ap){
  const c=document.createElement('canvas');
  c.width=96;c.height=132;
  const g=c.getContext('2d');
  g.imageSmoothingEnabled=false;
  g.setTransform(3,0,0,3,0,0);
  g.fillStyle='#72a154';g.fillRect(0,0,32,44);
  for(let i=0;i<70;i++){
    const x=Math.floor(alea(i*3.3)*32), y=Math.floor(alea(i*5.1)*44);
    g.fillStyle=alea(i)<.5?'#7db35d':'#63914b';g.fillRect(x,y,1,2);
  }
  sprite(g,16,40,ap,'bas',0,false);
  return c;
}
function ouvrirLook(){
  const ap=Object.assign({},DEF_AP,e.ap||{});
  const dessine=()=>{
    let h=`<div class="tete">
      <span class="vign" id="vg"></span>
      <span><h2>Ton allure</h2>
        <p>Onze réglages, plus de quatorze milliards de combinaisons.</p>
        <button class="hasard" id="hasard">Au hasard</button></span></div>`;
    GROUPES.forEach(gr=>{
      const liste=gr.l();
      h+=`<div class="sec">${gr.t.toUpperCase()}</div><div class="ch">`+
        liste.map((v,i)=>{
          const on=ap[gr.c]===i?' on':'';
          if(gr.k==='couleur')return `<button class="pa${on}" data-c="${gr.c}" data-i="${i}" style="background:${v}"></button>`;
          if(gr.k==='sac')return v==='aucun'
            ? `<button class="pa vide${on}" data-c="${gr.c}" data-i="${i}">∅</button>`
            : `<button class="pa${on}" data-c="${gr.c}" data-i="${i}" style="background:${v}"></button>`;
          return `<button class="mo${on}" data-c="${gr.c}" data-i="${i}">${v}</button>`;
        }).join('')+'</div>';
    });
    h+='<button class="ok" id="ok">Garder cette allure</button>';
    $('pan-b').innerHTML=h;
    $('vg').appendChild(apercu(ap));
    $('pan-b').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{
      ap[b.dataset.c]=+b.dataset.i;dessine();});
    $('hasard').onclick=()=>{
      GROUPES.forEach(gr=>{ap[gr.c]=Math.floor(Math.random()*gr.l().length);});dessine();};
    $('ok').onclick=()=>{e.ap=ap;sauver();$('pan').classList.remove('on');};
  };
  dessine();
  $('pan').classList.add('on');
}
$('b-look').onclick=ouvrirLook;
$('pan').onclick=(ev)=>{if(ev.target===$('pan'))$('pan').classList.remove('on');};

/* ================= boucle ================= */
taille();
let t0=performance.now();
(function boucle(t){
  requestAnimationFrame(boucle);
  const dt=Math.min(.05,(t-t0)/1000);t0=t;
  majJoueur(dt);dessiner();dessinerJoy();
})(t0);
setInterval(sauver,4000);
</script>
