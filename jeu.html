<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Le Port — BattleDock 2</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* ═══ LE PORT — l'arrivée de la traversée. Même monde, même heure : l'aube devient jour ═══ */
:root{--enc:#0d2438;--or:#ffd23c;--corail:#ff6a4e}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100dvh;overflow:hidden;font-family:'Nunito',sans-serif;color:#fff;-webkit-user-select:none;user-select:none}
body{transition:background 2.4s ease}
body[data-h="0"]{background:linear-gradient(180deg,#57b6e8 0%,#a3dcf2 46%,#ffe9c4 60%)}
body[data-h="1"]{background:linear-gradient(180deg,#3d3184 0%,#b0568e 30%,#f58a4a 52%,#ffcd74 60%)}
body[data-h="2"]{background:linear-gradient(180deg,#070d24 0%,#101a44 46%,#1c2a5e 60%)}
body[data-h="3"]{background:linear-gradient(180deg,#8faede 0%,#e0c2da 40%,#ffdcc2 56%,#ffeccc 60%)}

/* astre qui traverse le ciel selon l'heure */
.astre{transition:all 2.4s cubic-bezier(.5,.9,.4,1)}
body[data-h="1"] .astre{left:56%;top:34%;background:radial-gradient(circle at 36% 32%,#ffd2a0,#ff9a4c 62%,#f2702c);
  box-shadow:0 0 90px 36px rgba(255,138,60,.55)}
body[data-h="2"] .astre{left:74%;top:8%;width:64px;height:64px;
  background:radial-gradient(circle at 40% 36%,#f8faff,#d8e0f4);box-shadow:0 0 40px 12px rgba(220,230,255,.35);
  -webkit-mask:radial-gradient(circle at 72% 34%,transparent 21px,#000 22px);mask:radial-gradient(circle at 72% 34%,transparent 21px,#000 22px)}
body[data-h="3"] .astre{left:20%;top:28%;background:radial-gradient(circle at 36% 32%,#ffeadb,#ffcaa2);
  box-shadow:0 0 60px 22px rgba(255,202,162,.5)}

/* mer selon l'heure */
body[data-h="1"] .mer{background:linear-gradient(180deg,#7a3c86,#2a1e58)}
body[data-h="2"] .mer{background:linear-gradient(180deg,#0e1838,#050a1e)}
body[data-h="3"] .mer{background:linear-gradient(180deg,#4a7ca6,#274f72)}
body[data-h="2"] .houle{opacity:.14}
body[data-h="2"] .caustiques{opacity:.08}
body[data-h="2"] .scint{opacity:.25}

/* ciel de nuit : étoiles + filantes */
.ciel-nuit{position:absolute;inset:0;opacity:0;transition:opacity 2.4s;pointer-events:none}
body[data-h="2"] .ciel-nuit{opacity:1}
.et{position:absolute;border-radius:50%;background:#fff;animation:scin 2.8s ease-in-out infinite}
@keyframes scin{50%{opacity:.15}}
.fil{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:0}
body[data-h="2"] .fil{animation:file 8s ease-in 2s infinite}
.fil:nth-child(2){animation-delay:5s}
@keyframes file{0%,91%{opacity:0;transform:translate(0,0)}92%{opacity:1}100%{opacity:0;transform:translate(-160px,100px)}}
.fil::after{content:'';position:absolute;right:0;width:70px;height:1.5px;
  background:linear-gradient(90deg,transparent,#fff);transform:rotate(-32deg);transform-origin:right}

/* la ville s'allume la nuit */
body[data-h="2"] .toit,body[data-h="2"] .toit2{fill:rgba(12,20,52,.9)}
body[data-h="1"] .toit{fill:rgba(90,60,120,.4)}
body[data-h="1"] .toit2{fill:rgba(70,44,100,.5)}
.fenetres{opacity:0;transition:opacity 2.4s}
body[data-h="1"] .fenetres{opacity:.6}
body[data-h="2"] .fenetres{opacity:1}
.fen{fill:#ffd88a;animation:vacille 4s ease-in-out infinite}
.fen:nth-child(3n){animation-delay:-1.4s;fill:#ffc46a}
.fen:nth-child(4n){animation-delay:-2.7s}
@keyframes vacille{50%{opacity:.55}}
/* la Bonne Mère est éclairée dès le couchant */
body[data-h="1"] .bm,body[data-h="2"] .bm{filter:drop-shadow(0 0 8px rgba(255,210,60,.9))}

/* nuages colorés par l'heure */
body[data-h="1"] .nuage{background:#ffcfae}
body[data-h="2"] .nuage{opacity:.08}
body[data-h="3"] .nuage{background:#ffe9e2}
/* les mouettes se couchent */
body[data-h="2"] .mouettes{opacity:0}
/* plancton nocturne */
.plancton{position:absolute;border-radius:50%;background:#5cf0d8;box-shadow:0 0 8px #5cf0d8;opacity:0;
  transition:opacity 2.4s;animation:flotte 4s ease-in-out infinite}
body[data-h="2"] .plancton{opacity:.75}
@keyframes flotte{50%{transform:translateY(-8px);opacity:.25}}
/* fanaux des bateaux la nuit */
.fanal{opacity:0;transition:opacity 2.4s}
body[data-h="1"] .fanal,body[data-h="2"] .fanal{opacity:1}


/* ── monde ── */
.monde{position:fixed;inset:0;overflow:hidden}
.astre{position:absolute;top:10%;left:14%;width:88px;height:88px;border-radius:50%;
  background:radial-gradient(circle at 36% 32%,#fff6c8,#ffde68 60%,#ffc84a);
  box-shadow:0 0 70px 28px rgba(255,222,104,.6)}
.halo{position:absolute;inset:-30%;border-radius:50%;animation:respire 5s ease-in-out infinite;
  background:radial-gradient(circle,rgba(255,255,255,.18),transparent 60%)}
@keyframes respire{50%{transform:scale(1.12)}}
.nuage{position:absolute;background:#fff;border-radius:999px;animation:derive linear infinite}
.nuage::before,.nuage::after{content:'';position:absolute;background:inherit;border-radius:50%}
@keyframes derive{to{transform:translateX(120vw)}}
.n1{width:110px;height:30px;top:7%;left:-130px;opacity:.9;animation-duration:55s}
.n1::before{width:44px;height:44px;top:-20px;left:20px}.n1::after{width:30px;height:30px;top:-12px;left:58px}
.n2{width:74px;height:22px;top:18%;left:-90px;opacity:.7;animation-duration:80s;animation-delay:-38s}
.n2::before{width:30px;height:30px;top:-14px;left:14px}.n2::after{width:20px;height:20px;top:-9px;left:40px}
.mouettes{position:absolute;top:0;left:0;width:100%;height:34%;pointer-events:none;opacity:.55}
.mv{animation:vole 42s linear infinite}
.mv:nth-child(2){animation-duration:56s;animation-delay:-22s}
.mv:nth-child(3){animation-duration:34s;animation-delay:-9s}
.aile{animation:bat 1.1s ease-in-out infinite;transform-origin:center}
.mv:nth-child(2) .aile{animation-duration:1.5s}
.mv:nth-child(3) .aile{animation-duration:.9s}
@keyframes bat{50%{transform:scaleY(.35)}}
@keyframes vole{from{transform:translateX(-60px)}to{transform:translateX(calc(100vw + 60px))}}

/* ville derrière le port : Bonne Mère + toits */
.ville{position:absolute;bottom:41%;left:0;right:0;height:200px}
/* S2 : la colline domine, la ville n'est qu'un liseré */
.colline{fill:#7a7098;transition:fill 2.4s}
.colline2{fill:#635a86;transition:fill 2.4s}
.liseré{fill:#4c4470;transition:fill 2.4s}
body[data-h="1"] .colline{fill:#9c6690}body[data-h="1"] .colline2{fill:#7e4a76}body[data-h="1"] .liseré{fill:#5e3458}
body[data-h="2"] .colline{fill:#161e46}body[data-h="2"] .colline2{fill:#101838}body[data-h="2"] .liseré{fill:#0a1028}
body[data-h="3"] .colline{fill:#b09cb8}body[data-h="3"] .colline2{fill:#94809e}body[data-h="3"] .liseré{fill:#7a6884}
.arbre{fill:#5a6f78;opacity:.5;transition:fill 2.4s}
body[data-h="2"] .arbre{fill:#0e1630;opacity:.8}
.ville svg{width:100%;height:100%}
.toit{fill:rgba(70,64,130,.28)}
.toit2{fill:rgba(70,64,130,.4)}
.bm{fill:rgba(255,210,60,.85)}

/* mer + quais */
.mer{position:absolute;bottom:0;left:0;right:0;height:41%;overflow:hidden;
  background:linear-gradient(180deg,#2a9ec4,#10618a)}
.houle{position:absolute;left:0;width:200%;height:60px;animation:roule linear infinite}
.houle svg{width:100%;height:100%;display:block}
.ho1{top:-10px;animation-duration:9s;opacity:.5}
.ho2{top:24px;animation-duration:15s;animation-direction:reverse;opacity:.32}
@keyframes roule{to{transform:translateX(-50%)}}
.caustiques{position:absolute;inset:0;opacity:.5;pointer-events:none;filter:blur(6px);
  background:
    radial-gradient(ellipse 220px 26px at 24% 30%,rgba(255,255,255,.3),transparent 70%),
    radial-gradient(ellipse 170px 20px at 68% 55%,rgba(255,255,255,.22),transparent 70%),
    radial-gradient(ellipse 260px 30px at 45% 80%,rgba(255,255,255,.16),transparent 70%);
  animation:caus 9s ease-in-out infinite}
@keyframes caus{50%{transform:translateX(24px);opacity:.75}}
.scint{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;pointer-events:none;
  animation:scint-a ease-in-out infinite}
@keyframes scint-a{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:.9;transform:scale(1.2)}}

/* quai d'en face + voisins (D1) */
.quai-face{position:absolute;bottom:38%;left:-8px;width:52%;max-width:270px;z-index:1;opacity:.9}
.quai-face svg{width:100%;overflow:visible;filter:drop-shadow(0 5px 8px rgba(5,20,40,.28))}
.voisins{position:absolute;bottom:35%;left:0;right:0;height:60px;z-index:1}
.voisin{position:absolute;width:74px;animation:tangue 6s ease-in-out infinite;transform-origin:center bottom}
.voisin:nth-child(2){animation-duration:7.4s;animation-delay:-2s}
.voisin:nth-child(3){animation-duration:5.2s;animation-delay:-4s}
@keyframes tangue{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg) translateY(-3px)}}
.voisin svg{width:100%;overflow:visible;filter:drop-shadow(0 4px 7px rgba(5,20,40,.3))}
.navette{position:absolute;bottom:31%;left:-90px;width:88px;z-index:2;
  animation:traverse 34s linear infinite}
@keyframes traverse{0%{transform:translateX(0)}100%{transform:translateX(calc(100vw + 120px))}}
.navette svg{width:100%;overflow:visible;filter:drop-shadow(0 5px 8px rgba(5,20,40,.35))}
.navette .sil{animation:tangue 3.4s ease-in-out infinite;transform-origin:center bottom;display:block}

/* Q5 : ponton flottant — il bouge avec la houle */
.quai{position:absolute;bottom:17%;right:-10px;width:56%;max-width:300px;z-index:2;
  animation:ponton 6.5s ease-in-out infinite;transform-origin:right center}
@keyframes ponton{0%,100%{transform:rotate(-.7deg) translateY(0)}50%{transform:rotate(.7deg) translateY(-5px)}}
.quai svg{width:100%;overflow:visible;filter:drop-shadow(0 8px 12px rgba(5,20,40,.35))}
.p-lame{fill:#d8c096;transition:fill 2.4s}
.p-lame2{fill:#c2a87e;transition:fill 2.4s}
.p-cot{fill:#a88a62;transition:fill 2.4s}
body[data-h="1"] .p-lame{fill:#dfa87e}body[data-h="1"] .p-lame2{fill:#c68e64}body[data-h="1"] .p-cot{fill:#a06e4e}
body[data-h="2"] .p-lame{fill:#202a54}body[data-h="2"] .p-lame2{fill:#182044}body[data-h="2"] .p-cot{fill:#101632}
body[data-h="3"] .p-lame{fill:#e2d2c8}body[data-h="3"] .p-lame2{fill:#cabaB2}body[data-h="3"] .p-cot{fill:#ac9a94}
.p-flot{fill:#5a6470;transition:fill 2.4s}
body[data-h="2"] .p-flot{fill:#0c1226}
.p-taquet{fill:#8a929c;transition:fill 2.4s}
body[data-h="2"] .p-taquet{fill:#0e1428}
.p-borne{fill:#e8e4dc;stroke:#5a6470;stroke-width:1.5;transition:fill 2.4s}
body[data-h="2"] .p-borne{fill:#1a2246}
.p-remous{fill:none;stroke:rgba(255,255,255,.45);stroke-width:1.8;
  animation:remous 4.5s ease-in-out infinite}
.p-remous:nth-of-type(2){animation-delay:-2.2s}
@keyframes remous{0%,100%{opacity:.2;transform:scaleX(.9)}50%{opacity:.65;transform:scaleX(1.12)}}
.p-cord{stroke:#e8d8b8;stroke-width:2.4;fill:none;stroke-linecap:round;transition:stroke 2.4s}
body[data-h="2"] .p-cord{stroke:#7a8298}

/* Q5a : matière du bois — veines, usure, nuances lame par lame */
.p-veine{stroke:rgba(120,92,58,.3);stroke-width:.8;fill:none;transition:stroke 2.4s}
body[data-h="2"] .p-veine{stroke:rgba(0,0,0,.35)}
.p-noeud{fill:rgba(120,92,58,.32);transition:fill 2.4s}
body[data-h="2"] .p-noeud{fill:rgba(0,0,0,.4)}
.p-clair{fill:rgba(255,248,230,.28)}
.p-fonce{fill:rgba(90,66,40,.16)}
body[data-h="2"] .p-clair{fill:rgba(120,140,200,.1)}
body[data-h="2"] .p-fonce{fill:rgba(0,0,0,.3)}
/* usure : bois délavé par le sel */
.p-sel{fill:rgba(255,255,255,.22)}
body[data-h="2"] .p-sel{fill:rgba(150,170,220,.08)}
/* ligne humide en bordure */
.p-humide{fill:rgba(60,50,40,.22)}
body[data-h="2"] .p-humide{fill:rgba(0,0,0,.35)}

/* Q5b : l'eau travaille le ponton — reflets, mouillé, algues, caustiques */
/* reflet du ponton sur l'eau, sous lui */
.p-reflet{opacity:.28;transform:scaleY(-.45);transform-origin:top;filter:blur(1.6px);
  transition:opacity 2.4s}
body[data-h="2"] .p-reflet{opacity:.14}
.p-reflet-ond{animation:ond 5.5s ease-in-out infinite;transform-origin:center}
@keyframes ond{0%,100%{transform:skewX(0) scaleX(1)}50%{transform:skewX(2.5deg) scaleX(1.04)}}

/* caustiques projetées sous le ponton */
.p-caus{fill:none;stroke:rgba(255,255,255,.4);stroke-width:1.4;stroke-linecap:round;
  animation:caus-p 6s ease-in-out infinite}
.p-caus:nth-of-type(2){animation-delay:-2s;opacity:.7}
.p-caus:nth-of-type(3){animation-delay:-4s;opacity:.5}
@keyframes caus-p{0%,100%{opacity:.2;transform:translateX(-3px) scaleX(.95)}
  50%{opacity:.7;transform:translateX(4px) scaleX(1.06)}}
body[data-h="2"] .p-caus{stroke:rgba(140,200,255,.2)}

/* algues et coquillages sur les flotteurs */
.p-algue{fill:#4a7a5c;opacity:.55;transition:fill 2.4s}
body[data-h="2"] .p-algue{fill:#0e2a30;opacity:.8}
.p-coq{fill:rgba(240,235,220,.5)}
body[data-h="2"] .p-coq{fill:rgba(120,140,180,.25)}

/* trace mouillée là où on marche */
.p-mouille{fill:rgba(60,80,100,.16);animation:seche 9s ease-in-out infinite}
.p-mouille:nth-of-type(2){animation-delay:-4.5s}
@keyframes seche{0%,100%{opacity:.15}45%{opacity:.5}}
body[data-h="2"] .p-mouille{fill:rgba(0,0,0,.3)}

/* éclat du soleil sur le bois humide */
.p-eclat{fill:rgba(255,255,255,.3);opacity:0;transition:opacity 2.4s;
  animation:brille 7s ease-in-out infinite}
body[data-h="0"] .p-eclat,body[data-h="3"] .p-eclat{opacity:1}
@keyframes brille{0%,100%{opacity:.25}50%{opacity:.7}}

/* Q5c : finitions — quincaillerie, ombre portée, profondeur */
/* ombre du ponton projetée sur l'eau */
.p-ombre{fill:rgba(6,30,56,.3);filter:blur(3px);transition:opacity 2.4s}
body[data-h="2"] .p-ombre{opacity:.5}
body[data-h="1"] .p-ombre{fill:rgba(60,20,40,.32)}

/* vis et ferrures */
.p-vis{fill:rgba(90,74,54,.5);transition:fill 2.4s}
body[data-h="2"] .p-vis{fill:rgba(0,0,0,.5)}
.p-ferrure{fill:#8a929c;transition:fill 2.4s}
body[data-h="2"] .p-ferrure{fill:#141a34}
.p-rouille{fill:rgba(170,90,50,.35);transition:opacity 2.4s}
body[data-h="2"] .p-rouille{opacity:.4}

/* chaîne d'ancrage qui plonge */
.p-chaine{stroke:#6a7280;stroke-width:2.2;fill:none;stroke-linecap:round;
  stroke-dasharray:3 2.5;opacity:.6;transition:stroke 2.4s}
body[data-h="2"] .p-chaine{stroke:#141a34}

/* pare-battages suspendus au bord */
.p-pare{fill:#e8e0d0;stroke:#8a929c;stroke-width:1.2;transition:fill 2.4s}
body[data-h="2"] .p-pare{fill:#1c2448}
.p-pare-g{animation:pend 5.2s ease-in-out infinite;transform-origin:top center}
.p-pare-g:nth-of-type(2){animation-duration:6.4s;animation-delay:-2s}
@keyframes pend{50%{transform:rotate(3.5deg)}}

/* liseré lumineux sur l'arête, côté soleil */
.p-arete{fill:rgba(255,255,255,.4);transition:opacity 2.4s}
body[data-h="2"] .p-arete{opacity:.12}
body[data-h="1"] .p-arete{fill:rgba(255,200,140,.5)}

/* petite plaque numérotée */
.p-plaque{fill:#c8ccd4;stroke:#6a7280;stroke-width:.9;transition:fill 2.4s}
body[data-h="2"] .p-plaque{fill:#1e2650}
.p-plaque-t{font-family:'Nunito';font-weight:900;font-size:5px;fill:#4a5260;transition:fill 2.4s}
body[data-h="2"] .p-plaque-t{fill:#6a7498}

/* le bateau amarré */
.scene-bateau{position:absolute;bottom:19%;left:7%;width:min(60vw,278px);pointer-events:none;z-index:3}
.bateau{animation:amarre 5s ease-in-out infinite;transform-origin:center bottom}
@keyframes amarre{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg) translateY(-4px)}}
.bateau svg{width:100%;overflow:visible;filter:drop-shadow(0 10px 14px rgba(5,20,40,.45))}
.nom-bateau{position:absolute;top:-24px;left:50%;transform:translateX(-50%);white-space:nowrap;
  font-family:'Fraunces';font-weight:900;font-size:13px;color:var(--enc);
  background:rgba(255,255,255,.85);padding:3px 12px;border-radius:999px;
  box-shadow:0 4px 12px rgba(5,20,40,.25)}

/* ── HEADER : réplique du header v1 (profile-card-btn) ── */
.cap-bar{position:fixed;top:0;left:0;right:0;z-index:20;display:block;padding:0;pointer-events:none}
.cap-bar>*{pointer-events:auto}

/* le bandeau blanc pleine largeur, comme .topbar/.profile-header */
.cap-verre{width:100%;max-width:none;display:block;position:relative;overflow:hidden;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;cursor:pointer;
  background:rgba(251,249,246,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:none;border-radius:0;box-shadow:none}
/* veines marbre de la v1 */
.cap-verre::before{content:'';position:absolute;inset:0;pointer-events:none;
  background-image:
    linear-gradient(128deg,transparent 30%,rgba(190,185,180,.15) 40%,transparent 50%),
    linear-gradient(42deg,transparent 45%,rgba(190,185,180,.08) 55%,transparent 65%)}
/* shimmer doré de la v1 */
.cap-verre::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.6) 50%,transparent 65%);
  animation:headerShimmer 6s linear infinite}
@keyframes headerShimmer{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}
/* bordure inférieure dorée de la v1 */
.topbar-line{position:absolute;bottom:0;left:0;right:0;height:1px;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(180,175,170,.4),rgba(212,175,55,.3),rgba(180,175,170,.4),transparent)}

/* .pcb-row */
.hd-row{display:flex;align-items:center;gap:11px;max-width:600px;margin:0 auto;
  position:relative;z-index:1}

/* .pcb-avatar : 54px, rond, bordure claire */
.cap-pastille{width:42px;height:42px;border-radius:50%;flex-shrink:0;position:relative;overflow:hidden;
  font-size:0;background:linear-gradient(180deg,#8fd4ef 0%,#8fd4ef 54%,#2a9ec4 54%,#10618a 100%);
  border:2px solid #e5e7eb;box-shadow:0 1px 8px rgba(0,0,0,.08),0 0 0 3px rgba(212,175,55,.08)}
.cap-pastille svg{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);width:38px;overflow:visible}
.cap-pastille::after{content:'';position:absolute;left:0;right:0;top:54%;height:2px;background:rgba(255,255,255,.55)}

/* .pcb-info */
.cap-id{flex:1;min-width:0}
.cap-nom{font-family:'Fraunces',sans-serif;font-weight:900;font-size:16px;letter-spacing:.3px;
  color:#1a1a1a;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap-sub{font-size:9.5px;color:#b8962e;font-weight:700;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* l'argent en gros à droite, à la place du niveau */
.hd-niv{text-align:right;flex-shrink:0}
.cap-sous{display:flex;align-items:center;justify-content:flex-end;gap:5px}
.cap-sous-v{font-family:'Fraunces',sans-serif;font-weight:900;font-size:21px;color:#1a1a1a;line-height:1;
  transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.cap-sous-v.pop{transform:scale(1.22)}
.cap-sous-l{font-size:14px;line-height:1}
.hd-niv-l{font-size:7.5px;color:#9ca3af;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-top:2px}

/* .pcb-xp-wrap */

  font-size:8.5px;color:#9ca3af;margin-bottom:4px;font-weight:700}

/* barre XP continue */
.hd-xp-t{height:6px;background:#efeae0;border-radius:99px;overflow:hidden;position:relative;
  box-shadow:inset 0 1px 2px rgba(15,23,42,.08)}
.hd-xp-f{height:100%;width:0%;border-radius:99px;position:relative;overflow:hidden;
  background:linear-gradient(90deg,#b8962e,#d4af37,#f5d060);
  transition:width .6s cubic-bezier(.3,1,.4,1);
  box-shadow:0 0 7px rgba(212,175,55,.45)}
/* reflet qui glisse dans la portion remplie */
.hd-xp-f::after{content:'';position:absolute;top:0;left:-40%;width:35%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);
  animation:xpShine 2.8s ease-in-out infinite}
@keyframes xpShine{0%{left:-40%}60%,100%{left:110%}}

/* fiche capitaine : la déconnexion y vit, comme profil.html en v1 */
.fiche-fond{position:fixed;inset:0;z-index:40;background:rgba(6,14,30,.5);backdrop-filter:blur(4px);
  opacity:0;pointer-events:none;transition:.35s}
body.fiche .fiche-fond{opacity:1;pointer-events:auto}
.fiche{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);z-index:41;

.voile-fond{position:fixed;inset:0;z-index:9;background:rgba(6,14,30,.5);backdrop-filter:blur(3px);

.pont{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;flex-direction:column;align-items:center;

.pont>*{pointer-events:auto}

/* bouton d'action principal, flottant au-dessus du dock */
.eclair{width:100%;max-width:436px;display:flex;align-items:center;gap:12px;margin-bottom:10px;
  padding:15px 17px;border:none;border-radius:19px;cursor:pointer;position:relative;overflow:hidden;text-align:left;

.w:active{transform:scale(.9);background:rgba(255,255,255,.09)}
.w-emo{font-size:22px;line-height:1;display:block;margin-bottom:5px}

.w-s{display:none}

.w-quai .w-emo{filter:drop-shadow(0 0 6px rgba(255,210,60,.5))}

/* météo : pilule flottante au-dessus */
.meteo-flot{margin-bottom:9px;font-size:9.5px;font-weight:900;letter-spacing:2px;text-transform:uppercase;

  transition:.35s}
body.ouvert .meteo-flot{opacity:0;transform:translateY(8px)}

/* ── VUE SECTION (overlay) ── */
.vue{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:flex-end;
  opacity:0;pointer-events:none;transition:.35s}
.vue.on{opacity:1;pointer-events:auto}
.vue-fond{position:absolute;inset:0;background:rgba(6,14,30,.45);backdrop-filter:blur(3px)}

  background:rgba(10,26,44,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1.5px solid rgba(255,255,255,.2);box-shadow:0 18px 50px rgba(3,12,24,.6);
  transform:translateY(30px);transition:.35s cubic-bezier(.3,1.15,.4,1)}
.vue.on .vue-carte{transform:none}
.vue-carte h2{font-family:'Fraunces';font-weight:900;font-size:24px;margin-bottom:4px}
.vue-carte .desc{font-size:13px;font-weight:700;color:rgba(255,255,255,.65);line-height:1.55;margin-bottom:14px}
.vue-carte .soon{display:inline-block;font-size:9px;font-weight:900;letter-spacing:2px;text-transform:uppercase;

  background:rgba(255,106,78,.18);color:#ffb09e;border:1px solid rgba(255,106,78,.35)}
.b{width:100%;padding:14px;border:none;border-radius:15px;cursor:pointer;
  font-family:'Nunito';font-weight:900;font-size:14.5px;transition:.12s}
.b:active{transform:scale(.96)}
.b-n{background:var(--or);color:var(--enc)}
.b-r{background:rgba(255,255,255,.1);color:rgba(255,255,255,.7);border:2px solid rgba(255,255,255,.18)}

/* toast */
.toast{position:fixed;top:calc(70px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-20px);
  z-index:50;background:rgba(10,26,44,.85);backdrop-filter:blur(12px);border:1.5px solid rgba(255,255,255,.2);
  padding:12px 22px;border-radius:14px;font-size:13px;font-weight:800;opacity:0;transition:.35s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}

<script>
'use strict';
const $=s=>document.querySelector(s);

/* ── SUPABASE ── */
const SUPABASE_URL='https://jtijmythnvqgquizeizs.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp0aWpteXRobnZxZ3F1aXplaXpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ1NjU3NjAsImV4cCI6MjEwMDE0MTc2MH0.7Eo_DZarB7J6BCzRHh5pB7-ZKKwgIlwWkpqUV9MGbUc';
let SESSION=null,PROFIL=null;

async function garde(){
  try{
    const s=JSON.parse(localStorage.getItem('bd2_session'));
    if(!s||!s.access_token)throw 0;
    let r=await fetch(`${SUPABASE_URL}/auth/v1/user`,{headers:{'apikey':SUPABASE_ANON,'Authorization':`Bearer ${s.access_token}`}});
    if(r.ok){s.user=await r.json();SESSION=s;return}
    if(s.refresh_token){
      r=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`,{
        method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON},
        body:JSON.stringify({refresh_token:s.refresh_token})
      });
      const d=await r.json();
      if(d.access_token){localStorage.setItem('bd2_session',JSON.stringify(d));SESSION=d;return}
    }
    throw 0;
  }catch(e){
    localStorage.removeItem('bd2_session');
    location.href='index.html';
    throw new Error('no-session');
  }
}

async function chargeProfil(){
  const uid=SESSION.user?.id||SESSION.user?.user?.id;
  const r=await fetch(`${SUPABASE_URL}/rest/v1/profils?id=eq.${uid}&select=*`,{
    headers:{'apikey':SUPABASE_ANON,'Authorization':`Bearer ${SESSION.access_token}`}
  });
  const rows=r.ok?await r.json():[];
  if(!rows.length){location.href='inscription.html';throw new Error('no-profil')}
  PROFIL=rows[0];
}

/* ── bateau (même dessin que la traversée) ── */
const dk=(hex,f=.75)=>{const n=parseInt(hex.slice(1),16);
  return `rgb(${Math.round((n>>16)*f)},${Math.round(((n>>8)&255)*f)},${Math.round((n&255)*f)})`};
function dessineBateau(couleur,forme){
  const C=couleur;
  const coque=forme==='pointu'
    ?`M42 104 L258 104 Q248 138 212 138 L88 138 Q52 138 42 104 Z M42 104 Q30 98 26 84 L50 94 Z`
    :`M58 106 L242 106 Q252 106 248 118 L240 138 L60 138 L52 118 Q48 106 58 106 Z`;
  $('#svgB').innerHTML=`
    <path d="${coque}" fill="${C}" stroke="var(--enc)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M42 104 h216 v9 h-216 z" fill="${dk(C)}"/>
    <path d="M42 104 h216 v4 h-216 z" fill="rgba(255,255,255,.3)"/>
    <rect x="112" y="66" width="76" height="40" rx="7" fill="#fdf7ec" stroke="var(--enc)" stroke-width="3"/>
    <rect x="112" y="66" width="76" height="10" rx="5" fill="#e0d5c0"/>
    <rect x="124" y="80" width="18" height="14" rx="3" fill="#7ec8f0" stroke="var(--enc)" stroke-width="2"/>
    <rect x="156" y="80" width="18" height="14" rx="3" fill="#7ec8f0" stroke="var(--enc)" stroke-width="2"/>
    <rect x="147" y="24" width="5" height="44" rx="2.5" fill="#8a6242" stroke="var(--enc)" stroke-width="1.5"/>
    <path d="M152 28 h40 l-9 9 l9 9 h-40 z" fill="${dk(C,.9)}" stroke="var(--enc)" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M30 142 q34 6 68 2 M170 145 q42 4 78 -3" stroke="rgba(255,255,255,.7)" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
}

/* ── heure réelle de Marseille : le port vit à ton heure ── */
const HEURES=['Plein jour','Couchant','Pleine nuit','Aube'];
function heureDuPort(){
  const h=+new Intl.DateTimeFormat('fr-FR',{hour:'numeric',hour12:false,timeZone:'Europe/Paris'}).format(new Date());
  if(h>=8&&h<18)return 0;
  if(h>=18&&h<21)return 1;
  if(h>=21||h<5)return 2;
  return 3;
}
function majHeure(){
  const h=heureDuPort();
  document.body.dataset.h=h;
  const m=$('#meteo');
  if(m)m.textContent=`${HEURES[h]} · mer belle`;
}
majHeure();setInterval(majHeure,60000);

/* étoiles */
for(let i=0;i<46;i++){
  const e=document.createElement('div');e.className='et';
  const sz=Math.random()<.2?3:2;
  e.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*46}%;animation-delay:${Math.random()*2.8}s`;
  $('#cielNuit').appendChild(e);
}
/* plancton */
for(let i=0;i<10;i++){
  const pl=document.createElement('div');pl.className='plancton';
  const sz=3+Math.random()*4;
  pl.style.cssText=`width:${sz}px;height:${sz}px;left:${5+Math.random()*90}%;top:${20+Math.random()*70}%;animation-delay:${Math.random()*4}s`;

}

/* ── décor : scintillements ── */
for(let i=0;i<14;i++){
  const s=document.createElement('div');s.className='scint';

    animation-duration:${2+Math.random()*2.5}s;animation-delay:${Math.random()*3}s`;
  $('#merEl').appendChild(s);
}

/* ── compteur de sous (animation quand ça bouge) ── */
function majSous(n){
  const el=$('#sous');
  el.textContent=Number(n).toLocaleString('fr-FR');
  el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');
  setTimeout(()=>el.classList.remove('pop'),320);
}

/* ── fiche capitaine ── */
setTimeout(()=>{
  const ferme=()=>document.body.classList.remove('fiche');
  if(ard)ard.onclick=()=>{document.body.classList.add('fiche');if(navigator.vibrate)navigator.vibrate(8)};
  const x=$('#ficheX'),f=$('#ficheFond');
  if(x)x.onclick=ferme;
  if(f)f.onclick=ferme;
  document.querySelectorAll('.fl').forEach(b=>b.addEventListener('click',ferme));
},0);

/* ── grades (comme les paliers de la v1) ── */
/* progression sur 100 niveaux : XP cumulée pour atteindre le niveau n */
const NIV_MAX=100;
function seuilNiveau(n){return n<=1?0:Math.round(60*Math.pow(n-1,1.85))}
function niveauDe(xp){
  let n=1;
  while(n<NIV_MAX&&xp>=seuilNiveau(n+1))n++;
  return n;
}
/* grades débloqués aux niveaux 1, 5, 15, 30, 50 et 100 */
const GRADES=[[1,'Occasionnel'],[5,'Docker'],[15,"Chef d'équipe"],[30,'Contremaître'],[50,'Chef de quai'],[100,'Patron']];
function gradeDe(xp){
  const n=niveauDe(xp);
  let g=GRADES[0][1];
  for(const [seuil,nom] of GRADES)if(n>=seuil)g=nom;
  return g;
}

/* ── fiche capitaine ── */
setTimeout(()=>{
  const c=$('#carteProfil');
  const ferme=()=>document.body.classList.remove('fiche');
  if(c)c.onclick=()=>{document.body.classList.add('fiche');if(navigator.vibrate)navigator.vibrate(8)};
  const x=$('#ficheX'),f=$('#ficheFond');
  if(x)x.onclick=ferme;
  if(f)f.onclick=ferme;
  document.querySelectorAll('.fl').forEach(b=>b.addEventListener('click',ferme));
},0);

/* ── toast ── */
let toastTimer;
function toast(msg){
  const t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600);
}

/* ── vues sections (stubs v1) ── */
const VUES={
  mer:{t:'🌊 Sortir en mer',d:'Largue les amarres pour une sortie de pêche ou une cargaison. Ce que tu ramènes se vend à la Criée — mais accoster chez un autre capitaine te coûtera sa taxe.'},
  criee:{t:'🐟 La Criée',d:'Le marché du port. Les prix bougent selon ce que les autres capitaines débarquent : vends au bon moment, ou regarde ta pêche perdre sa valeur.'},
  chantier:{t:'🔨 Chantier naval',d:'Coque, cale, moteur. Un bateau mieux gréé va plus loin, porte plus, et paie moins de taxes en accostant vite.'},
  quai:{t:'⚓ Mon Quai',d:'Ton bout de Marseille. Améliore-le pour attirer les bateaux des autres joueurs — chaque accostage chez toi te rapporte une taxe. Le cœur de la baston.'},
  classement:{t:'🏆 Classement',d:'Les capitaines les plus riches, les quais les plus rentables, les légendes du Vieux-Port.'}
};
const panneau={
  ouvre(){document.body.classList.add('ouvert')},
  ferme(){document.body.classList.remove('ouvert')},
  bascule(){document.body.classList.toggle('ouvert');if(navigator.vibrate)navigator.vibrate(9)}
};
$('#voileFond').onclick=panneau.ferme;

/* poignée : tap OU glissement vertical */
(()=>{
  const p=$('#poignee');
  let y0=null,bouge=false;
  const debut=y=>{y0=y;bouge=false};
  const suit=y=>{
    if(y0===null)return;
    const d=y-y0;
    if(Math.abs(d)>8)bouge=true;
    if(d<-26){panneau.ouvre();y0=null}
    else if(d>26){panneau.ferme();y0=null}
  };
  const fin=()=>{y0=null};
  p.addEventListener('touchstart',e=>debut(e.touches[0].clientY),{passive:true});
  p.addEventListener('touchmove',e=>suit(e.touches[0].clientY),{passive:true});
  p.addEventListener('touchend',fin);
  p.addEventListener('click',e=>{
    if(bouge||e.target.closest('[data-vue]'))return;
    panneau.bascule();
  });
})();

document.querySelectorAll('[data-vue]').forEach(w=>{
  w.addEventListener('click',()=>{
    panneau.ferme();
    const v=VUES[w.dataset.vue];
    $('#vueTitre').textContent=v.t;
    $('#vueDesc').textContent=v.d;
    $('#vue').classList.add('on');
    if(navigator.vibrate)navigator.vibrate(9);
  });
});
const fermeVue=()=>$('#vue').classList.remove('on');
$('#vueFermer').onclick=fermeVue;
$('#vueFond').onclick=fermeVue;

/* ── déconnexion ── */
$('#btnOut').onclick=async()=>{
  try{
    await fetch(`${SUPABASE_URL}/auth/v1/logout`,{
      method:'POST',headers:{'apikey':SUPABASE_ANON,'Authorization':`Bearer ${SESSION.access_token}`}
    });
  }catch(e){}
  localStorage.removeItem('bd2_session');
  location.href='index.html';
};

/* ── init ── */
(async()=>{
  await garde();
  await chargeProfil();
  $('#capNom').textContent=PROFIL.pseudo;
  $('#nomBateau').textContent=`« ${PROFIL.nom_bateau} »`;
  $('#capSub').textContent=PROFIL.forme==='pointu'?'Patron de Pointu':'Patron de Barquette';
  const XP=PROFIL.xp??0, NIV=niveauDe(XP), GRADE=gradeDe(XP);
  const BAS=seuilNiveau(NIV), HAUT=seuilNiveau(NIV+1);
  const dans=XP-BAS, requis=HAUT-BAS;
  $('#capSub').textContent=GRADE;
  $('#niv').textContent=NIV;
  if(NIV>=NIV_MAX){
    $('#xpCounter').textContent='Niveau maximum';
    $('#versNiv').style.display='none';
    setTimeout(()=>{$('#xpFill').style.width='100%'},350);
  }else{
    $('#nextLevel').textContent=NIV+1;
    $('#xpCounter').textContent=`${dans.toLocaleString('fr-FR')} / ${requis.toLocaleString('fr-FR')} XP`;
    setTimeout(()=>{$('#xpFill').style.width=Math.min(100,dans/requis*100)+'%'},350);
  }
  $('#avatarRond').style.borderColor=PROFIL.couleur;
  $('#ficheNom').textContent=PROFIL.pseudo;
  $('#ficheSub').textContent=`« ${PROFIL.nom_bateau} » · ${GRADE}`;
  majSous(PROFIL.sous??100);
  dessineBateau(PROFIL.couleur,PROFIL.forme);
  $('#svgMini').innerHTML=$('#svgB').innerHTML;
  $('#svgFiche').innerHTML=$('#svgB').innerHTML;
})().catch(()=>{});
</script>
