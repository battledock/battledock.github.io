<!DOCTYPE html>
<html lang="fr">
<head>
<!-- ===== la mise à jour : le jeu ne reste jamais bloqué sur une vieille version ===== -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<script>
/* Ajouté au signet, un navigateur garde la page en mémoire et ne va plus
   jamais la rechercher. On lui demande donc, à chaque ouverture, quelle est
   la version publiée : si elle a changé, on recharge une seule fois avec une
   adresse neuve — c'est la seule façon de percer le cache d'un raccourci. */
(function(){
  var MA_VERSION='2026-09-14-1400';
  var cle='bdl.version.vue';
  function verifier(){
    fetch('version.json?t='+Date.now(),{cache:'no-store'})
      .then(function(r){return r.json();})
      .then(function(d){
        if(!d||!d.v||d.v===MA_VERSION)return;
        /* on ne recharge qu'une fois par version, sinon on bouclerait */
        var deja=null;
        try{deja=sessionStorage.getItem(cle);}catch(e){}
        if(deja===d.v)return;
        try{sessionStorage.setItem(cle,d.v);}catch(e){}
        var u=location.pathname.split('?')[0]+'?v='+encodeURIComponent(d.v);
        location.replace(u);
      })
      .catch(function(){});
  }
  verifier();
  /* et quand on revient sur l'onglet après un moment */
  var vu=Date.now();
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState!=='visible')return;
    if(Date.now()-vu<60000)return;
    vu=Date.now();verifier();
  });
})();
</script>

<title>Battle Dock</title>
<style>
:root{--carte:#fffdf8;--encre:#1f2620;--doux:#8a9083;--pale:#a8ab9e;--filet:#e4e2d6;--vert:#3f7d4a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#2b3a26}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
#cv{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:block;
  image-rendering:pixelated;image-rendering:crisp-edges}
body{overflow:hidden}

/* ---- le bandeau du haut : deux coins, rien au milieu ----
   L'encre claire : blanc cassé, chiffres en lettres de livre, intitulés en
   italiques. Aucun fond : la lisibilité vient de l'ombre portée. C'est du
   HTML, donc zéro trait par image. */
@keyframes lueurHaut{0%{color:#fff;text-shadow:0 0 12px rgba(255,255,255,.95)}
                     100%{text-shadow:0 2px 10px rgba(0,0,0,.9)}}
#haut{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top));z-index:4;
  padding:14px 18px;display:flex;align-items:flex-start;pointer-events:none}
#haut .col{display:flex;flex-direction:column;gap:2px}
#haut .col.d{align-items:flex-end;text-align:right}
#haut .sep{flex:1}
#haut .gd{font:400 19px Georgia,serif;color:#fdfbf4;letter-spacing:.8px;
  text-shadow:0 2px 10px rgba(0,0,0,.9)}
#haut .gd.flash{animation:lueurHaut 1.1s ease-out}
#haut .pt{font:400 8.5px Georgia,serif;font-style:italic;color:rgba(253,251,244,.78);
  letter-spacing:.6px;text-shadow:0 1px 6px rgba(0,0,0,.9)}
#haut .fil{width:26px;height:1px;margin:4px 0 3px;
  background:linear-gradient(90deg,rgba(255,255,255,.85),rgba(255,255,255,0))}
#haut .col.d .fil{background:linear-gradient(270deg,rgba(255,255,255,.85),rgba(255,255,255,0))}
#haut .pet{font:400 8.5px Georgia,serif;font-style:italic;color:rgba(253,251,244,.62);
  text-shadow:0 1px 6px rgba(0,0,0,.9)}

/* ---- la page du comptoir ---- */
.listeVente{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.ligneVente{display:flex;align-items:center;gap:10px;width:100%;
  padding:11px 13px;border-radius:12px;border:1px solid #cbb98f;
  background:#f6eed8;text-align:left}
.ligneVente:active{background:#efe3c4}
.lvNom{flex:1;font:400 14px Georgia,serif;color:#4a3a22}
.lvNb{font:600 11px ui-monospace,monospace;color:#8a7c5e}
.lvPrix{font:600 13px Georgia,serif;color:#6b6a1e}
.toutVendre{width:100%;padding:13px;border-radius:13px;border:0;
  background:linear-gradient(180deg,#7d8c58,#5f6f42);color:#f6ecd2;
  font:400 16px Georgia,serif;letter-spacing:1px}
.toutVendre small{display:block;font:600 11px ui-monospace,monospace;
  color:rgba(246,236,210,.8);margin-top:3px}
#joy{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
#hublot{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top));z-index:4;
  width:120px;height:120px;border-radius:50%;padding:5px;
  background:conic-gradient(#e8c06a,#8a6a2a,#f0cf7d,#7d5f26,#e8c06a,#8a6a2a,#f0cf7d);
  box-shadow:0 6px 18px rgba(0,0,0,.45)}
#hublot .verre{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;
  box-shadow:inset 0 0 0 2px #4a3420;background:#6f9e52}
#hublot canvas{image-rendering:pixelated;width:100%;height:100%;display:block}
#hublot .reflet{position:absolute;inset:0;border-radius:50%;pointer-events:none;background:
  linear-gradient(150deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,.05) 34%,transparent 52%)}
#hublot .creux{position:absolute;inset:0;border-radius:50%;pointer-events:none;
  box-shadow:inset 0 -8px 18px rgba(20,40,15,.4)}
#hublot .attache{position:absolute;left:50%;top:-4px;transform:translateX(-50%);width:14px;height:9px;
  border-radius:3px;background:#c9a24a;box-shadow:0 1px 3px rgba(0,0,0,.45)}

/* ---- le chat : fil, réponses, bandeau ---- */
#fil{position:fixed;left:10px;right:76px;top:calc(10px + env(safe-area-inset-top));z-index:6;
  display:flex;flex-direction:column;gap:4px;pointer-events:none}
.msgF{display:flex;gap:6px;align-items:baseline;padding:5px 9px;border-radius:9px;
  background:rgba(18,26,16,.46);align-self:flex-start;max-width:100%;
  animation:entreF .28s ease both}
@keyframes entreF{from{opacity:0;transform:translateY(-6px)}}
.msgF b{font:700 9.5px system-ui;flex:0 0 auto}
.msgF span{font:400 11.5px system-ui;color:#f4f1e6;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.msgF.moi{background:rgba(40,90,60,.5)}
.msgF i{font:600 8px system-ui;color:#a8b39c;margin-left:auto;flex:0 0 auto;font-style:normal}
#repond{position:fixed;left:10px;top:0;z-index:7;display:none;gap:5px;flex-wrap:wrap;
  animation:entreF .25s ease both}
#repond.on{display:flex}
#repond button{padding:7px 13px;border-radius:14px;border:1px solid rgba(255,255,255,.5);
  background:rgba(255,255,255,.93);font:600 11px system-ui;color:#2b1d12;
  box-shadow:0 2px 6px rgba(0,0,0,.25)}
#repond button:active{transform:translateY(1px)}
#bandeau{position:fixed;left:0;right:0;bottom:0;z-index:14;display:none;transition:bottom .12s;
  pointer-events:none;
  background:linear-gradient(180deg,rgba(20,26,16,0),rgba(20,26,16,.72) 22%,rgba(20,26,16,.93));
  padding:26px 10px calc(10px + env(safe-area-inset-bottom))}
#bandeau.on{display:block}
.suggest{display:flex;gap:5px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.suggest::-webkit-scrollbar{display:none}
.suggest,.ligne,#suggest button,.ligne *{pointer-events:auto}
.suggest button{flex:0 0 auto;padding:7px 13px;border-radius:14px;border:1px solid #8a6a3a;
  background:rgba(253,250,240,.94);font:600 11px system-ui;color:#3d2a17;white-space:nowrap}
.ligne{display:flex;gap:7px}
.ligne input{flex:1;background:#fdfaf0;border:1px solid #8a6a3a;border-radius:11px;
  padding:11px 13px;font:400 13px system-ui;color:#2b2418;outline:none;min-width:0}
.ligne #envoyer{padding:0 17px;border-radius:11px;border:1px solid #6b5334;
  background:linear-gradient(180deg,#a5764a,#7d5934);color:#f2e6cc;font:700 12px system-ui;
  transition:background .15s,border-color .15s,color .15s}
.ligne #envoyer.pret{border-color:#2e4020;color:#e7f3dd;
  background:linear-gradient(180deg,#6f9153,#4a6636)}
#micro{width:54px;flex:0 0 auto;border-radius:11px;border:1px solid #2e4020;
  background:linear-gradient(180deg,#6f9153,#4a6636);color:#e7f3dd;
  display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 1px 0 rgba(220,255,200,.3)}
#micro:active{transform:translateY(1px)}
#micro.ecoute{background:#c94a4a;border-color:#8f2f2f;color:#fff;
  animation:battreM 1.1s ease-in-out infinite}
#micro.absent{opacity:.4}
@keyframes battreM{50%{box-shadow:0 0 0 7px rgba(201,74,74,.25)}}
.champ{position:relative;flex:1;min-width:0;display:flex}
.compteB{position:absolute;right:11px;top:50%;transform:translateY(-50%);
  font:600 9px system-ui;color:#b6ab8e;font-style:normal;pointer-events:none}
.ligne input{padding-right:32px}
/* clavier ouvert : la barre du bas s'efface */
body.clavier #barre{opacity:0;pointer-events:none;transition:opacity .15s}
body.clavier #bandeau{padding-bottom:9px}
.onde{position:fixed;left:0;right:0;bottom:calc(116px + env(safe-area-inset-bottom));z-index:15;
  display:none;justify-content:center;gap:3px;align-items:flex-end;height:34px;pointer-events:none}
.onde.on{display:flex}
.onde i{width:4px;border-radius:2px;background:#f2efe4;animation:vagueM .9s ease-in-out infinite}
.onde i:nth-child(2){animation-delay:.1s}.onde i:nth-child(3){animation-delay:.2s}
.onde i:nth-child(4){animation-delay:.3s}.onde i:nth-child(5){animation-delay:.15s}
.onde i:nth-child(6){animation-delay:.25s}.onde i:nth-child(7){animation-delay:.05s}
@keyframes vagueM{0%,100%{height:8px}50%{height:28px}}
.phrases{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.phrases button{padding:14px 8px;border-radius:12px;border:1px solid #5c452e;
  background:linear-gradient(180deg,#3d2c1e,#2b1f14);color:#f2e6cc;font:600 12.5px system-ui}
.phrases button:active{transform:translateY(2px)}
.libre{display:flex;gap:8px}
.libre input{flex:1;min-width:0;padding:13px 12px;border-radius:12px;border:1px solid #5c452e;
  background:#241a12;color:#f2e6cc;font:400 13px system-ui}
.libre input::placeholder{color:#8d7d64}

/* ---- la page Bâtir ---- */
.terrainCarte{border:1px solid #5c452e;border-radius:14px;padding:12px 13px;margin-bottom:14px;
  background:linear-gradient(180deg,#3d2c1e,#31241a)}
.tRang{display:flex;align-items:baseline;justify-content:space-between}
.tNom{font:700 9px system-ui;letter-spacing:1.6px;color:#f0cf7d}
.tPos{font:600 9.5px ui-monospace,monospace;color:#8d7d64}
.tPetit{font:400 10.5px system-ui;color:#c6b38a}
.tEtat{font:700 9px system-ui;letter-spacing:.8px}

.tEtat.loin{color:#e0b07a}
.tJauge{height:5px;border-radius:3px;background:#241a12;margin:9px 0 7px;overflow:hidden}
.tJauge i{display:block;height:100%;background:linear-gradient(90deg,#8a6238,#f0cf7d)}
.familles{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px}
.familles button{flex:0 0 auto;padding:8px 13px;border-radius:11px;border:1px solid #5c452e;

.familles button.on{background:#f0cf7d;border-color:#f0cf7d;color:#2b1d12}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plan{padding:0 0 9px;border-radius:13px;border:1px solid #5c452e;overflow:hidden;
  background:linear-gradient(180deg,#3d2c1e,#31241a);display:flex;flex-direction:column;

.plan.gris{opacity:.5}
.plan .vue{width:100%;height:70px;overflow:hidden;border-bottom:1px solid #5c452e}
.plan canvas{image-rendering:pixelated;display:block}
.plan .nom{font:600 12px system-ui;color:#f2e6cc}

.rappel{font:400 10.5px/1.5 system-ui;color:#8d7d64;margin-top:14px;text-align:center}
.attente{display:flex;flex-direction:column;align-items:center;gap:10px;padding:30px 0;
  font:400 12px system-ui;color:#8d7d64}
.attente i{width:22px;height:22px;border-radius:50%;border:2px solid #5c452e;
  border-top-color:#f0cf7d;animation:tourne 0.9s linear infinite}
@keyframes tourne{to{transform:rotate(360deg)}}

/* ---- le classement : une page de manuscrit ---- */
.sacFond.manuscrit{background:#f7f1df;position:relative;overflow:hidden;padding:0}
.sacFond.manuscrit::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;z-index:1;
  background:
   radial-gradient(circle at 16% 20%,rgba(196,178,138,.18),transparent 26%),
   radial-gradient(circle at 84% 44%,rgba(196,178,138,.14),transparent 24%),
   radial-gradient(circle at 34% 80%,rgba(196,178,138,.16),transparent 26%);
  animation:grainP 13s ease-in-out infinite alternate}
.sacFond.manuscrit::after{content:'';position:absolute;inset:-40% -60%;pointer-events:none;z-index:1;
  background:linear-gradient(102deg,transparent 43%,rgba(255,255,255,.5) 50%,transparent 57%);
  animation:lueurP 9s ease-in-out infinite}
@keyframes grainP{to{transform:translate3d(0,-7px,0) scale(1.03)}}
@keyframes lueurP{0%,100%{transform:translateX(-40%)}50%{transform:translateX(40%)}}
.enlum{display:block;width:100%;position:relative;z-index:2}
.manX{position:absolute;left:12px;top:12px;z-index:4;background:#f3ecd9;border:1px solid #ddd1b2;
  color:#8a7c5e}
.manCorps{position:relative;z-index:2;padding:2px 16px 20px}
.attenteM{font:italic 400 12.5px/1.6 Georgia,serif;color:#9a8a63;text-align:center;padding:26px 10px}

.lgn{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid #eadfc2;
  animation:poseP .5s ease both}
.lgn:first-child{border-top:0}
@keyframes poseP{from{opacity:0;transform:translateY(9px)}}
.lgn.premier{padding:16px 0 13px;border-top:0;border-bottom:1px solid #eadfc2;gap:13px}
.lgn.toi{padding:13px 10px;margin-top:4px;border-top:0;border-radius:10px;
  background:linear-gradient(90deg,rgba(62,95,158,.09),transparent);
  box-shadow:inset 3px 0 0 #3e5f9e}
.porte{position:relative;flex:0 0 auto}
.porte.grande{width:58px;height:70px}
.porte.moyenne{width:46px;height:56px}
.porte.petite{width:38px;height:46px}
.cour{position:absolute;top:-11px;left:50%;transform:translateX(-50%);width:40px;
  image-rendering:pixelated;z-index:2}
.cadre{position:absolute;inset:0;border-radius:5px;overflow:hidden;
  background:linear-gradient(180deg,#a8d084,#7fae5c);border:1px solid #d8c69a;
  display:flex;align-items:flex-end;justify-content:center}
.cadre canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
.cadre.or{border:2px solid #d9a63f;box-shadow:0 0 0 2px rgba(217,166,63,.22)}
.cadre.azur{border:2px solid #3e5f9e}
.txt{flex:1;min-width:0}
.nomM{font:400 16px Georgia,serif;color:#2b2418;display:block}
.nomM.gros{font-size:21px}
.nomM.moyen{font-size:16px}
.vous{font:italic 400 9px Georgia,serif;color:#3e5f9e}
.ditM{display:block;font:italic 400 9.5px Georgia,serif;color:#9a8a63;margin-top:3px}
.enLigneM{display:inline-flex;align-items:center;gap:4px;font:700 8px system-ui;color:#2f7050;
  font-style:normal}
.enLigneM em{width:5px;height:5px;border-radius:50%;background:#4f9e72;display:block;
  animation:pulseP 1.8s ease-in-out infinite}
@keyframes pulseP{50%{transform:scale(1.55);opacity:.45}}
.jge{display:block;height:5px;border-radius:3px;background:#ece0c0;overflow:hidden;margin-top:8px}

  animation:remplirP 1.1s cubic-bezier(.2,.8,.3,1) both}

.jge i.azur{background:linear-gradient(90deg,#27407a,#6d8fd0)}
@keyframes remplirP{from{transform:scaleX(0)}}
.ecartM{display:block;font:italic 400 9px Georgia,serif;color:#3e5f9e;margin-top:5px}
.scr{text-align:right;flex:0 0 auto}
.ptsM{display:block;font:400 19px Georgia,serif;color:#6b6045;line-height:1}
.ptsM.or{font-size:27px;color:#a8791f}
.ptsM.azur{font-size:23px;color:#27407a}
.ptsL{font:italic 400 8px Georgia,serif;color:#b3a274}

  background:linear-gradient(180deg,#8a6238,#6b4a28);border:1px solid #5c452e;

  font:600 13px system-ui;color:#f6ecd2;letter-spacing:.4px}

/* ---- le sac, en clair ---- */

.sacFond.clairS::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.45;
  background:
   radial-gradient(circle at 18% 14%,rgba(196,178,138,.16),transparent 26%),
   radial-gradient(circle at 82% 40%,rgba(196,178,138,.13),transparent 24%),
   radial-gradient(circle at 40% 78%,rgba(196,178,138,.15),transparent 26%)}
.rabatC{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:12px;
  padding:14px 14px 13px;background:#f3ebd6;border-bottom:1px solid #e0d3b2}
.xC{width:32px;height:32px;border-radius:50%;flex:0 0 auto;background:#eadfc2;
  border:1px solid #d4c39e;color:#8a7c5e;font:600 13px system-ui;

/* ---- le compteur : à n'afficher que pour mesurer ---- */
#perf{position:fixed;left:14px;top:calc(58px + env(safe-area-inset-top));z-index:9;
  display:none;padding:8px 11px;border-radius:10px;

  font:600 10px ui-monospace,monospace;color:#9fd67a;line-height:1.55;
  white-space:pre}
#perf.on{display:block}
#perf b{color:#f6ecd2;font-weight:700}
#perf u{color:#e8a06a;text-decoration:none}
/* ---- le bouton d'action : une plaque d'ivoire, comme le bandeau du haut ----
   Même ivoire, même serif, même intitulé en petites capitales. Le filet gravé
   en haut rappelle la plaque, et les coups restants remplissent un trait de
   deux points en bas. */
#action{position:fixed;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:5;
  min-width:152px;padding:11px 20px 13px;border:0;border-radius:3px;text-align:right;
  background:linear-gradient(180deg,rgba(253,251,244,.95),rgba(238,232,214,.95));
  box-shadow:0 6px 18px rgba(0,0,0,.4);
  opacity:0;transform:translateY(8px);pointer-events:none;
  transition:opacity .18s ease,transform .18s ease}
#action::before{content:'';position:absolute;left:9px;right:9px;top:6px;height:1px;
  background:rgba(90,72,44,.22)}
#action{font:400 18px Georgia,serif;color:#33291b;letter-spacing:.6px}
#action small{display:block;font:600 7px system-ui;letter-spacing:2.4px;
  color:rgba(51,41,27,.58);margin-top:3px}
#action .jaugeAction{position:absolute;left:0;right:0;bottom:0;height:2px;
  background:rgba(90,72,44,.18);border-radius:0 0 3px 3px;overflow:hidden}
#action .jaugeAction u{display:block;height:100%;background:#8a6a2a}
#action.on{opacity:1;transform:none;pointer-events:auto}
#action:active{transform:translateY(1px)}
#action:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,225,180,.2),0 0 0 #3d2a17}
#action small{font:600 8.5px system-ui;letter-spacing:1.2px;color:#5f4223}

#barre{position:fixed;left:0;right:0;bottom:0;z-index:4;display:grid;
  grid-template-columns:repeat(5,1fr);gap:6px;
  padding:10px 9px calc(13px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,#8a6238,#5f4223);border-top:3px solid #3d2a17}
#barre::before{content:"";position:absolute;inset:0;pointer-events:none;background:
  repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 1px,transparent 1px 11px),
  repeating-linear-gradient(0deg,rgba(255,225,180,.06) 0 1px,transparent 1px 7px)}
.latte{position:relative;padding:8px 0 6px;border-radius:4px;
  background:linear-gradient(180deg,#a5764a,#7d5934);border:1px solid #4f3520;
  box-shadow:inset 0 1px 0 rgba(255,225,180,.32),0 2px 0 #3d2a17;
  display:flex;flex-direction:column;align-items:center;gap:1px;transition:transform .08s,box-shadow .08s}
.latte:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,225,180,.2),0 0 0 #3d2a17}
.latte svg{image-rendering:pixelated}
/* la latte de parchemin : celle qui ouvre le registre */
.latte.parch{background:linear-gradient(180deg,#fbf5e4,#eee3c8);border-color:#8a6a3a;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 2px 0 #3d2a17}
.latte.parch:active{box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 0 0 #3d2a17}

.latte.parch svg{image-rendering:auto}     /* les cercles doivent rester ronds */
.latte.vert{background:linear-gradient(180deg,#6f9153,#4a6636);border-color:#2e4020;
  box-shadow:inset 0 1px 0 rgba(220,255,200,.28),0 2px 0 #25361a}
.latte.vert .b{color:#e7f3dd}
.latte.vert .clou{background:#25361a}

.clou{position:absolute;top:3px;width:3px;height:3px;border-radius:50%;background:#3d2a17}
.clou.g{left:3px}.clou.d{right:3px}
.pastille{position:absolute;right:-5px;top:-6px;min-width:18px;height:18px;border-radius:9px;
  background:#c94a4a;color:#fff;font:700 9.5px system-ui;display:none;align-items:center;
  justify-content:center;padding:0 4px;border:1px solid #7d2b2b;font-style:normal}

/* ---- le voile du lancement : il couvre tout jusqu'à ce que le monde soit prêt ----
   La prairie est maintenant GRAVÉE sur un canevas, avec le même sol et les

<script>
/* ---- la prairie du voile, gravée une fois au couchant ----
   Le même sol et les mêmes huit fleurs que le jeu, plus une lumière rase
   qui dore tout. On la grave sur un canevas dès l'ouverture : 20 000 traits
   en une dizaine de millisecondes, puis plus rien à faire. */
(function(){
  function alea2(n){var v=Math.sin(n*12.9898)*43758.5453;return v-Math.floor(v);}
  function lisse2(x,y){
    var x0=Math.floor(x),y0=Math.floor(y),fx=x-x0,fy=y-y0;
    function h(a,b){return alea2(a*127.1+b*311.7);}
    function m(a,b,t){return a+(b-a)*(t*t*(3-2*t));}
    return m(m(h(x0,y0),h(x0+1,y0),fx),m(h(x0,y0+1),h(x0+1,y0+1),fx),fy);
  }
  var FL=[['#d9584f','#f7d98a','#a83c39',1],['#e8cf4e','#fdf3bd','#bfa32c',0],
          ['#6285c9','#f7e6a8','#44629e',1],['#f2efe4','#e8cf4e','#c9c2b0',0],
          ['#9a6fc0','#f7e6a8','#6f4e91',0],['#e8934e','#fdf3bd','#bf6f2c',1],
          ['#e0a8c8','#f7e6a8','#b07a9c',0],['#c9dd8a','#f7e6a8','#9ab063',0]];
  var BASE=['#8a9450','#96a05a','#9caa60','#a8b46e','#7d8748'];
  function graver(){
    var cv=document.getElementById('vPre');if(!cv)return;
    var ZO=3;                                   /* un point de jeu = 3 points d'écran */
    var W=Math.ceil(window.innerWidth/ZO), H=Math.ceil(window.innerHeight/ZO);
    cv.width=W;cv.height=H;
    var g=cv.getContext('2d');g.imageSmoothingEnabled=false;
    function R(x,y,w,h,c){g.fillStyle=c;g.fillRect(x|0,y|0,w<1?1:w|0,h<1?1:h|0);}
    R(0,0,W,H,BASE[1]);
    for(var y=0;y<H;y+=2)for(var x=((y/2)%2?0:2);x<W;x+=4)R(x,y,2,2,BASE[2]);
    for(y=0;y<H;y+=3)for(x=0;x<W;x+=3){
      var v=lisse2(x/34,y/34);
      if(v>0.62)R(x,y,3,3,BASE[3]); else if(v<0.36)R(x,y,3,3,BASE[0]);
    }
    for(var i=0;i<5;i++){                        /* les plaques de terre sèche */
      var cx=alea2(i*3.1)*W, cy=alea2(i*5.7)*H, r=12+alea2(i*7.3)*16;
      for(y=-r;y<=r;y++)for(x=-r;x<=r;x++){
        if(x*x+y*y>r*r*(0.7+alea2(x*0.3+y*0.7)*0.3))continue;
        R(cx+x,cy+y,1,1,'#a8946a');
      }
    }
    for(i=0;i<2600;i++)R(alea2(i*1.7)*W,alea2(i*2.9)*H,1,2,BASE[(i%2)?4:0]);
    for(i=0;i<420;i++){                          /* les touffes */
      var tx=alea2(i*3.7)*W, ty=alea2(i*4.3)*H;
      R(tx,ty,2,3,BASE[4]);R(tx+2,ty+1,2,2,BASE[0]);R(tx-2,ty+1,2,2,BASE[3]);
    }
    var MA=26;                                   /* LES FLEURS, en massifs */
    for(var my=0;my<H/MA+1;my++)for(var mx=0;mx<W/MA+1;mx++){
      if(lisse2(mx/2.2,my/2.2)<0.46)continue;
      var e=FL[Math.floor(alea2(mx*7.1+my*3.3)*FL.length)];
      var nb=2+Math.floor(alea2(mx*5.7+my*9.1)*4);
      for(var k=0;k<nb;k++){
        var fx=Math.round(mx*MA+alea2(mx*11+my*13+k*3)*MA);
        var fy=Math.round(my*MA+alea2(mx*17+my*19+k*5)*MA);
        if(fx<2||fy<4||fx>W-3||fy>H-3)continue;
        R(fx,fy+2,1,3,'#5f7a3c');
        R(fx-1,fy-1,3,3,e[0]);R(fx,fy-2,1,1,e[0]);R(fx,fy+1,1,1,e[0]);
        R(fx-2,fy,1,1,e[2]);R(fx+2,fy,1,1,e[2]);
        if(e[3]){R(fx-1,fy-2,1,1,e[0]);R(fx+1,fy+1,1,1,e[0]);}
        R(fx,fy,1,1,e[1]);
        R(fx-1,fy-1,1,1,'#fbe8b0');              /* la lumière rase */
      }
    }
    for(i=0;i<7;i++){                            /* les papillons posés */
      var px=Math.round(alea2(i*13.1)*W), py=Math.round(alea2(i*17.7)*H*0.7);
      var c=['#f2efe4','#e8cf4e','#e0a8c8'][i%3];
      R(px,py,2,2,c);R(px+3,py,2,2,c);R(px+2,py,1,2,'#4a3220');
    }
    var grd=g.createRadialGradient(W*0.72,H*0.18,10,W*0.72,H*0.18,H*0.9);
    grd.addColorStop(0,'rgba(255,214,122,.34)');
    grd.addColorStop(0.5,'rgba(255,186,96,.12)');
    grd.addColorStop(1,'rgba(180,110,40,0)');
    g.fillStyle=grd;g.fillRect(0,0,W,H);
  }
  try{graver();}catch(x){}
  /* si l'écran tourne pendant le chargement */
  window.addEventListener('resize',function(){
    var v=document.getElementById('voile');
    if(v&&!v.classList.contains('parti')){try{graver();}catch(x){}}
  });
})();
</script>

 veste:['#4f7d5c','#5a6b8f','#8a5a4a','#6b5f8f','#7d6a3f','#3f5f6b','#8f6a3f','#54606b',

  const basT=BAS[p.bas]||'pantalon';
  const soulier=SOULIERS[p.souliers]||'bottes';
  /* la silhouette : largeur d'épaules, taille, hanches */
  const SIL={'fine'      :{ep:6,ta:5,ha:6,tete:5,menton:1},
             'svelte'    :{ep:7,ta:5,ha:7,tete:5,menton:1},
             'moyenne'   :{ep:8,ta:7,ha:7,tete:6,menton:2},
             'athlétique':{ep:9,ta:7,ha:7,tete:6,menton:2},
             'forte'     :{ep:9,ta:9,ha:9,tete:6,menton:3}}[silhouette]||{ep:8,ta:7,ha:7,tete:6,menton:2};
  const EP=SIL.ep, TA=SIL.ta, HA=SIL.ha;   /* demi-largeurs */
  const N='#1b1712';
  const R=(a,b,w,h,c)=>{g.fillStyle=c;g.fillRect(x+a,y+b,w,h);};

  /* marche souple, huit temps */
  const F=bouge?(Math.floor(pas)%8):-1;
  const AN={corps:[0,0,-1,0,0,0,-1,0],
            jg:[2,1,-1,-2,-2,-1,1,2], jd:[-2,-1,1,2,2,1,-1,-2],
            pg:[0,0,1,0,0,0,0,0],     pd:[0,0,0,0,0,0,1,0],
            bg:[-2,-1,1,2,2,1,-1,-2], bd:[2,1,-1,-2,-2,-1,1,2],
            reb:[0,0,1,0,0,0,1,0]};
  const souffle=bouge?0:((Date.now()/1400|0)%3===0?1:0);
  const Y=bouge?AN.corps[F]:souffle;
  const jgP=bouge?AN.jg[F]:0, jdP=bouge?AN.jd[F]:0;
  const jgL=bouge?AN.pg[F]:0, jdL=bouge?AN.pd[F]:0;
  const bgP=bouge?AN.bg[F]:0, bdP=bouge?AN.bd[F]:0;
  const reb=bouge?AN.reb[F]:0;
  const prof=dir==='haut', cote=dir==='gauche'||dir==='droite';
  const MANCHE_AR={'veste':11,'chemise':11,'pull':11,'manteau':11,'tunique':9,
                   'gilet':0,'t-shirt':4,'débardeur':0}[HAUTS[p.haut]||'veste'];
  const s=dir==='droite'?1:-1;

  /* ---- mesures du corps (quatre têtes) ----
     pieds 0 · jambes 13 · torse 15 · tête 11, sommet à -40 */
  const JH=13, TH=15, HT=11;
  const yT=-JH-TH;                 /* haut du torse  = -28 */
  const yTete=yT-HT-2;             /* la tête est décollée du torse : le cou apparaît */

  /* ---- le geste de frappe, en trois temps ----
     1 → 0,58 : l'élan, la pioche part en arrière
     0,58 → 0,42 : l'abattage, très rapide
     0,42 → 0   : la reprise, le corps se redresse                */
  const fr=(typeof GESTE!=='undefined'&&GESTE.t>0)?GESTE.t:0;
  const typeGeste=(typeof GESTE!=='undefined'&&GESTE.type)||'pioche';
  let phase=0, arc=0, penche=0, tasse=0;
  if(fr>0&&typeGeste==='cueille'){
    /* la cueillette : on se penche, le bras part vers le buisson, on se relève */
    if(fr>0.55){const t=(1-fr)/0.45;penche=doux(t)*2.6;tasse=doux(t)*1.6;arc=1.1*doux(t);phase=1;}
    else if(fr>0.3){const t=(0.55-fr)/0.25;penche=2.6;tasse=1.6;arc=1.1+t*0.5;phase=2;}
    else{const t=1-fr/0.3;penche=2.6*(1-sortRap(t));tasse=1.6*(1-sortRap(t));arc=1.6*(1-sortRap(t));phase=3;}
  }else if(fr>0&&typeGeste==='hache'){
    /* la hache : élan haut, balayage large, reprise lente */
    if(fr>0.62){const t=(1-fr)/0.38;arc=-1.9*doux(t);penche=-doux(t)*2;tasse=doux(t)*1.4;phase=1;}
    else if(fr>0.42){const t=(0.62-fr)/0.2;arc=-1.9+entreRap(t)*3.3;penche=-2+t*5.2;tasse=1.4-t*2.8;phase=2;}
    else{const t=1-fr/0.42;arc=1.4*(1-sortRap(t));penche=3.2*(1-sortRap(t));tasse=-1.4*(1-sortRap(t));phase=3;}
  }else if(fr>0){
    if(fr>0.58){const t=(1-fr)/0.42;arc=-1.45*doux(t);penche=-doux(t)*1.6;tasse=doux(t)*1.2;phase=1;}
    else if(fr>0.42){const t=(0.58-fr)/0.16;arc=-1.45+entreRap(t)*2.75;penche=-1.6+t*4.4;tasse=1.2-t*2.4;phase=2;}
    else{const t=1-fr/0.42;arc=1.3*(1-sortRap(t));penche=2.8*(1-sortRap(t));tasse=-1.2*(1-sortRap(t));phase=3;}
  }

  R(-6,1,12,2,'rgba(40,60,28,.42)');

  /* sac */
  if(sacC!=='aucun'&&prof){                     /* de dos : le sac, bien posé entre les épaules */
    const w2=Math.min(10,EP*2-4);
    R(-(w2>>1),yT+2-reb,w2,13,teint(sacC,-8));
    R(-(w2>>1),yT+2-reb,w2,2,teint(sacC,16));
    R(-(w2>>1),yT+12-reb,w2,2,teint(sacC,-26));
    R(-2,yT+6-reb,4,4,teint(sacC,10));          /* la poche */
    R(-2,yT+6-reb,4,1,teint(sacC,-30));
  }else if(sacC!=='aucun'&&cote){               /* de profil : il dépasse dans le dos */
    const sx=s>0?-(EP+1):EP-2;
    R(sx,yT+2-reb,4,12,teint(sacC,-16));
    R(sx,yT+2-reb,4,2,teint(sacC,10));
    R(sx,yT+12-reb,4,1,teint(sacC,-30));
  }

  /* ---- jambes ---- */
  /* la chaussure, dessinée selon son type */
  const pied=(px2,py,col)=>{
    if(soulier==='bottes'){
      R(px2,py-2,5,2,teint(col,-16));              /* la tige monte sur la cheville */
      R(px2,py,5,3,col);
      R(px2,py,5,1,teint(col,20));
      R(px2,py+2,5,1,teint(col,-26));             /* la semelle */
    }else if(soulier==='bottillons'){
      R(px2,py-1,5,1,teint(col,-16));
      R(px2,py,5,3,col);
      R(px2,py,5,1,teint(col,18));
      R(px2,py+2,5,1,teint(col,-30));
    }else if(soulier==='baskets'){
      R(px2,py,5,2,col);
      R(px2,py,5,1,teint(col,22));
      R(px2+1,py,2,1,'#f2efe4');                   /* le lacet */
      R(px2,py+2,5,1,'#e8e4d8');                   /* la semelle claire */
    }else{                                          /* sandales : le pied reste visible */
      R(px2+1,py,3,2,peauO);
      R(px2,py+1,5,1,col);
      R(px2+1,py,3,1,col);
      R(px2,py+2,5,1,teint(col,-22));
    }
  };

  /* jusqu'où le tissu descend, selon le bas porté */
  const TISSU={'pantalon':JH,'short':6,'jupe':5,'treillis':JH,'longue jupe':10,'bermuda':8}[basT];
  const jambeProfil=(dec,plie,col,botte)=>{
    const h=JH-plie;
    R(-2+dec,-JH,4,h,peau);                    /* la jambe nue */
    if(TISSU>0)R(-2+dec,-JH,4,Math.min(h,TISSU),col);
    if(TISSU>=h)R(-2+dec,-4,4,4,teint(col,-12));
    if(basT==='treillis'){R(-2+dec,-JH+5,4,1,teint(col,-22));R(-1+dec,-JH+6,2,2,teint(col,14));}
    pied(-3+dec,-JH+h,botte);
  };
  const jambeFace=(cx,phase,col,botte)=>{
    const avance=phase>0;
    const h=avance?JH:JH-2;
    const ec=Math.abs(phase)>1?(avance?-1:1):0;
    R(cx+ec,-JH,4,h,avance?teint(peau,4):teint(peau,-14));   /* la jambe */
    if(TISSU>0){
      R(cx+ec,-JH,4,Math.min(h,TISSU),avance?teint(col,8):teint(col,-10));
      R(cx+ec,-JH,4,1,pantC);
    }
    if(basT==='treillis'){R(cx+ec,-JH+5,4,1,teint(col,-22));R(cx+1+ec,-JH+6,2,2,teint(col,14));}
    pied(cx-1+ec,-JH+h,avance?botte:teint(botte,-14));
  };
  if(cote){
    jambeProfil(jdP*0.9-1,jdL,pantO,teint(chau,-14));
    jambeProfil(jgP*0.9-1,jgL,pant,chau);
  }else{
    if(jgP>=jdP){jambeFace(1,jdP,pantO,teint(chau,-14));jambeFace(-5,jgP,pant,chau);}
    else{jambeFace(-5,jgP,pant,chau);jambeFace(1,jdP,pantO,teint(chau,-14));}
  }

  /* jupe : un trapèze par-dessus le haut des jambes */
  if(basT==='jupe'||basT==='longue jupe'){
    const hj=basT==='jupe'?6:9;
    for(let i=0;i<hj;i++){
      const w2=HA-1+Math.round(i*(basT==='jupe'?0.7:0.55));
      R(-w2,-JH+i,w2*2,1,i<2?pantC:pant);
    }
    R(-(HA+3),-JH+hj-1,(HA+3)*2,1,pantO);
  }

  /* hanches : elles ferment la jonction entre le torse et les jambes */
  R(-(HA+1),-JH-2,(HA+1)*2,3,N);
  R(-HA,-JH-1,HA*2,2,pantO);
  R(-HA,-JH-1,HA*2,1,pant);

  /* ---- bras arrière (profil) ---- */
  if(cote){
    const ar=bgP;
    const bx=(s>0?-6:3)-ar*s;
    R(bx,yT+2,3,11,peauT);
    if(MANCHE_AR>0)R(bx,yT+2,3,MANCHE_AR,vesteT);
    R(bx,yT+13,3,3,peauT);
  }

  /* ---- torse : la coupe du vêtement suit la silhouette ---- */
  const colH=veste, colHC=vesteC, colHO=vesteO, colHT=vesteT;
  const pen=fr>0?Math.round(penche*(dir==='gauche'?-1:1)):0;   /* il se penche dans l'effort */
  const tas=fr>0?Math.max(0,Math.round(tasse)):0;              /* et se tasse */
  R(-EP+pen,yT-1+tas,EP*2,TH+1-tas,N);           /* contour aux épaules */
  R(-EP+1,yT,EP*2-2,3,colH);                     /* les épaules */
  R(-EP+1,yT,EP*2-2,2,colHC);
  for(let i=3;i<TH-1;i++){                       /* le buste, resserré à la taille */
    const w2=Math.round(EP-1-(EP-TA)*Math.min(1,(i-2)/(TH-5)));
    R(-w2,yT+i,w2*2,1,colH);
    R(-w2,yT+i,2,1,colHT);
    R(w2-2,yT+i,2,1,colHO);
  }
  R(-TA,yT+TH-4,TA*2,2,colHO);                   /* ceinture */
  R(-1,yT+TH-4,2,2,'#c9a24a');
  /* les détails propres à chaque haut */
  if(hautT==='veste'&&!prof){R(-1,yT,2,TH-5,colHO);R(-4,yT,3,2,colHC);R(1,yT,3,2,colHC);}
  if(hautT==='chemise'&&!prof){
    R(-1,yT,2,TH-5,colHT);
    R(-4,yT,4,3,colHC);R(0,yT,4,3,colHC);        /* col ouvert */
    for(let i=0;i<3;i++)R(0,yT+4+i*3,1,1,'#f2efe4');
  }
  if(hautT==='pull'&&!prof){
    R(-3,yT-2,6,3,colHC);R(-3,yT-2,6,1,colH);    /* col montant */
    for(let i=4;i<TH-4;i+=3)R(-EP+2,yT+i,EP*2-4,1,teint(colH,-12));
  }
  if(hautT==='t-shirt'&&!prof){R(-3,yT,6,2,peau);R(-3,yT,6,1,peauC);}
  if(hautT==='débardeur'){
    R(-4,yT,8,3,peau);R(-4,yT,8,1,peauC);        /* décolleté */
    R(-EP+1,yT,2,4,colH);R(EP-3,yT,2,4,colHO);   /* bretelles */
  }
  if(hautT==='gilet'&&!prof){
    R(-2,yT,4,TH-5,peau);R(-2,yT,4,1,peauC);
    R(-2,yT+TH-6,4,2,colHO);
  }
  if(hautT==='manteau'){
    R(-TA,yT+TH-2,TA*2,6,colH);                  /* les pans descendent */
    R(-TA,yT+TH-2,TA*2,1,colHC);
    R(-TA,yT+TH+3,TA*2,1,colHT);
    if(!prof)R(-1,yT+TH-2,2,6,colHT);
  }
  if(hautT==='tunique'){
    R(-TA,yT+TH-2,TA*2,4,colH);
    R(-TA,yT+TH-2,TA*2,1,colHC);
    R(-TA,yT+TH+1,TA*2,1,colHT);
    if(!prof){R(-4,yT,8,2,colHC);R(-1,yT,2,4,colHO);}
  }
  R(-EP+1,yT+TH-2,EP*2-2,1,colHT);

  /* de face : on ne voit du sac que les deux sangles sur la poitrine */
  if(sacC!=='aucun'&&dir==='bas'){
    R(-EP+2,yT+2,2,8,teint(sacC,-6));
    R(EP-4,yT+2,2,8,teint(sacC,-18));
    R(-EP+2,yT+6,EP*2-6,1,teint(sacC,-24));
  }

  /* ---- bras : la manche s'arrête selon le vêtement ---- */
  const MANCHE={'veste':11,'chemise':11,'pull':11,'manteau':11,'tunique':9,
                'gilet':0,'t-shirt':4,'débardeur':0}[hautT];
  const brasCol=(dev)=>dev?veste:vesteT;
  const bras=(bx,by,dev)=>{
    R(bx,by,3,11,dev?teint(peau,2):peauO);       /* le bras nu */
    if(MANCHE>0){
      R(bx,by,3,MANCHE,brasCol(dev));
      R(bx,by,3,2,dev?vesteC:vesteO);
      if(MANCHE<11)R(bx,by+MANCHE-1,3,1,teint(brasCol(dev),-20));
    }
    R(bx,by+11,3,3,dev?peau:peauO);              /* la main */
  };
  if(cote){
    bras((s>0?1:-4)+bdP*s,yT+1,true);
  }else{
    bras(-(EP+2),yT+1,bgP>0);
    bras(EP-1,yT+1,bdP>0);
  }
  /* ---- l'outil et les bras, selon l'angle sous lequel on regarde ----
     De profil : grand arc de côté, un seul bras visible.
     De face   : l'outil s'abat vers nous, les deux mains le tiennent, il se raccourcit.
     De dos    : il part en arrière au-dessus des épaules, on voit le dos des mains. */
  if(fr>0){
    const outil=(gg,ech)=>{
      if(typeGeste==='hache')dessinerHache(gg,0,0,ech||1);
      else dessinerPioche(gg,0,0,ech||1);
    };
    if(cote){
      const sens=dir==='gauche'?-1:1;
      const epx=sens>0?EP-1:-(EP+2);
      const ey=yT+1-Math.round(tasse*3);
      R(epx,ey,3,9,veste);R(epx,ey,3,2,vesteC);R(epx,ey+9,3,3,peau);
      if(typeGeste!=='cueille'){
        g.save();
        g.translate(x+epx+1.5,y+ey+2);
        g.rotate(sens*arc);
        outil(g,1);
        if(phase===2){g.globalAlpha=.3;g.fillStyle='#f2f5f8';g.fillRect(-1,-15,2,13);g.globalAlpha=1;}
        g.restore();
      }else{
        const av=Math.round(arc*3);
        R(epx+(sens>0?av:-av),ey+7,3,3,peau);
      }
    }else if(dir==='bas'){
      /* de face : l'outil passe au-dessus de la tête puis descend vers nous.
         On l'écrase verticalement pour simuler le raccourci. */
      const t=(arc+1.9)/3.6;                       /* 0 en arrière, 1 en avant */
      const haut=yT-14+Math.round((1-t)*-8);
      const ey=yT+1-Math.round(tasse*3);
      if(typeGeste!=='cueille'){
        g.save();
        g.translate(x,y+haut+t*24);
        g.scale(1.15,0.45+t*0.75);                 /* il grandit en venant vers nous */
        g.rotate(Math.PI*(1-t)*0.12);
        outil(g,1.2);
        if(phase===2){g.globalAlpha=.26;g.fillStyle='#f2f5f8';
          g.fillRect(-8,-4,16,4);g.globalAlpha=1;}
        g.restore();
      }
      /* les deux bras tiennent l'outil, ils se rapprochent devant le corps */
      const ecart=Math.round(3+ (1-t)*3);
      R(-EP-2+ecart,ey,3,9,vesteT);R(-EP-2+ecart,ey+9,3,3,peauO);
      R(EP-1-ecart,ey,3,9,veste);  R(EP-1-ecart,ey+9,3,3,peau);
      if(typeGeste==='cueille'){                   /* la main s'avance vers le bas */
        R(-2,ey+10+Math.round(arc*3),4,3,peau);
      }
    }else{
      /* de dos : l'outil part derrière les épaules, on ne voit que sa tête dépasser */
      const t=(arc+1.9)/3.6;
      const ey=yT+1-Math.round(tasse*3);
      if(typeGeste!=='cueille'){
        g.save();
        g.translate(x,y+yT-10-(1-t)*10);
        g.scale(1.1,0.5+(1-t)*0.6);
        outil(g,1.1);
        g.restore();
      }
      const ecart=Math.round(3+(1-t)*3);
      R(-EP-2+ecart,ey,3,9,vesteT);R(-EP-2+ecart,ey+9,3,3,peauO);
      R(EP-1-ecart,ey,3,9,veste);  R(EP-1-ecart,ey+9,3,3,peau);
    }
  }

  /* ---- tête ---- */
  const YT=yTete+(fr>0?Math.round(tasse*1.2):0);  /* la tête plonge avec le buste */
  R(-3,yT-3+Y,6,4-Y,N);                        /* le cou s'étire quand le corps descend */
  R(-2,yT-2+Y,4,3-Y,peau);
  R(-2,yT-2+Y,4,1,peauT);                      /* ombre du menton */
  R(-2,yT-2+Y,2,3-Y,peauO);

  const LT=SIL.tete;                            /* demi-largeur de la tête */
  for(let i=0;i<HT;i++){
    let w2=LT;
    if(i>=HT-SIL.menton)w2=LT-1;                /* le menton se resserre */
    if(i===0)w2=LT-1;                           /* le sommet du crâne s'arrondit */
    R(-w2-1,YT+i,(w2+1)*2,1,N);
    R(-w2,YT+i,w2*2,1,peau);
    R(-w2,YT+i,Math.min(3,w2),1,peauO);
  }
  R(-LT,YT,LT*2,1,peauC);                       /* front éclairé */
  if(!prof){R(-LT-2,YT+5,2,3,peauO);R(LT,YT+5,2,3,peau);}   /* oreilles */
  if(prof){R(-LT,YT+1,LT*2,HT-1,teint(peau,-12));           /* nuque */
           R(-LT,YT+HT-3,LT*2,2,teint(peau,-30));}
  /* ---- la barbe ----
     Elle épouse la mâchoire : plus large en haut des joues, resserrée sous le menton.
     Trois valeurs, comme les cheveux, et une version propre au profil. */
  if(barbe!=='aucune'&&!prof){
    const LB=SIL.tete;                          /* demi-largeur du visage */
    const bas=YT+HT-1;                          /* le bas du menton */
    const B=chev, BC=chevC, BO=chevO, BT=teint(chev,-40);
    const joue=(y0,h2,ep)=>{                    /* les côtés, le long de la mâchoire */
      for(let i=0;i<h2;i++){
        const w2=LB-(i>=h2-2?1:0);
        R(-w2,y0+i,ep,1,B);
        R(w2-ep,y0+i,ep,1,BO);
      }
    };
    const menton=(y0,h2,larg)=>{                /* la masse sous la bouche */
      for(let i=0;i<h2;i++){
        const w2=Math.max(1,larg-(i>=h2-2?1:0)-(i>=h2-1?1:0));
        R(-w2,y0+i,w2*2,1,i<1?BC:(i>h2-2?BT:B));
      }
    };
    if(cote){
      /* de profil : la barbe suit le bord avant du visage */
      const av=s>0?1:-4;
      if(barbe==='naissante'){g.globalAlpha=.5;R(av-1,YT+7,5,4,BO);g.globalAlpha=1;}
      else if(barbe==='fine'){R(av-1,YT+7,5,3,BO);R(av,YT+10,3,1,BT);}
      else if(barbe==='courte'){R(av-2,YT+6,6,5,B);R(av-1,YT+10,4,1,BO);}
      else if(barbe==='pleine'){R(av-3,YT+5,7,7,B);R(av-3,YT+5,2,7,BO);R(av-2,YT+11,5,2,BT);}
      else if(barbe==='longue'){R(av-3,YT+5,7,7,B);R(av-2,YT+11,5,6,B);R(av-2,YT+15,5,2,BT);}
      else if(barbe==='bouc'){R(av-1,YT+8,4,5,B);R(av-1,YT+11,4,2,BO);}
      else if(barbe==='moustache'){R(av-1,YT+7,4,1,B);R(av+2,YT+7,1,1,BO);}
      else if(barbe==='collier'){R(av-4,YT+4,2,8,B);R(av-3,YT+10,6,2,B);}
      else if(barbe==='favoris'){R(av-4,YT+3,2,6,B);}
      else if(barbe==='impériale'){R(av-1,YT+7,4,1,B);R(av,YT+9,3,3,B);}
      else if(barbe==='fourchue'){R(av-3,YT+5,7,7,B);R(av-2,YT+11,2,5,B);R(av+1,YT+11,2,4,BO);}
    }else{
      if(barbe==='naissante'){                  /* juste une ombre sur la mâchoire */
        g.globalAlpha=.42;
        joue(YT+6,5,2);menton(YT+9,3,3);
        g.globalAlpha=1;
      }
      else if(barbe==='fine'){
        joue(YT+7,4,1);
        R(-3,YT+10,6,1,BO);R(-2,YT+11,4,1,BT);
      }
      else if(barbe==='courte'){
        joue(YT+6,5,2);
        menton(YT+9,3,4);
        R(-3,YT+8,6,1,BC);                      /* le sillon sous la lèvre */
      }
      else if(barbe==='pleine'){
        joue(YT+4,7,2);
        menton(YT+8,5,LB-1);
        R(-LB+1,YT+4,LB*2-2,1,BC);              /* le haut des joues, éclairé */
        R(-2,YT+8,4,1,teint(peau,-30));         /* la bouche reste lisible */
      }
      else if(barbe==='longue'){
        joue(YT+4,7,2);
        menton(YT+8,5,LB-1);
        for(let i=0;i<6;i++){                   /* elle descend sur la poitrine */
          const w2=Math.max(1,4-Math.floor(i/2));
          R(-w2,YT+HT+i-1,w2*2,1,i<4?B:BT);
        }
        R(-LB+1,YT+4,LB*2-2,1,BC);
        R(-2,YT+8,4,1,teint(peau,-30));
      }
      else if(barbe==='bouc'){
        R(-2,YT+10,4,3,B);R(-2,YT+10,2,3,BC);R(-1,YT+12,2,1,BT);
        R(-3,YT+7,6,1,B);                       /* avec sa moustache */
      }
      else if(barbe==='moustache'){
        R(-3,YT+7,6,1,B);R(-4,YT+7,1,1,BO);R(3,YT+7,1,1,BO);
        R(-3,YT+8,2,1,BO);R(1,YT+8,2,1,BO);
      }
      else if(barbe==='collier'){               /* le tour du visage, joues rasées */
        R(-LB,YT+4,1,7,B);R(LB-1,YT+4,1,7,BO);
        menton(YT+10,2,4);
        R(-3,YT+7,6,1,B);
      }
      else if(barbe==='favoris'){               /* seulement devant les oreilles */
        R(-LB,YT+3,2,5,B);R(LB-2,YT+3,2,5,BO);
        R(-LB,YT+7,2,1,BT);R(LB-2,YT+7,2,1,BT);
      }
      else if(barbe==='impériale'){             /* moustache et touffe sous la lèvre */
        R(-4,YT+7,8,1,B);R(-5,YT+6,1,1,BO);R(4,YT+6,1,1,BO);
        R(-1,YT+10,3,3,B);R(-1,YT+10,1,3,BC);
      }
      else if(barbe==='fourchue'){
        joue(YT+4,7,2);
        menton(YT+8,4,LB-1);
        R(-4,YT+HT-1,3,5,B);R(1,YT+HT-1,3,4,BO);   /* les deux pointes */
        R(-4,YT+HT+3,3,1,BT);R(1,YT+HT+2,3,1,BT);
        R(-LB+1,YT+4,LB*2-2,1,BC);
      }
    }
  }

  /* ---- les cheveux ----
     Une même coupe se décline en trois vues :
       de face  : calotte + frange + pans qui pendent de chaque côté du visage
       de dos   : la masse couvre tout le crâne, les longueurs tombent dans le dos
       de profil: calotte + un seul pan, derrière la tête                        */
  const C=chev, CC=chevC, CO=chevO, CT=teint(chev,-42);
  const tr=bouge?(cote?-s:0):0;

  /* description de chaque coupe :
     vol  volume au-dessus du crâne · fr  frange · pan longueur des pans latéraux
     dos  longueur dans le dos      · ras côtés rasés                            */
  const D={
   'courts'      :{vol:2,fr:'courte',pan:3, dos:12},
   'très courts' :{vol:1,fr:'rase',  pan:2, dos:12},
   'dégradé'     :{vol:3,fr:'cote',  pan:1, dos:12,ras:1},
   'bol'         :{vol:2,fr:'droite',pan:5, dos:14},
   'carré'       :{vol:2,fr:'droite',pan:9, dos:17},
   'mi-longs'    :{vol:2,fr:'cote',  pan:8, dos:18},
   'longs'       :{vol:2,fr:'cote',  pan:14,dos:24,large:14},
   'très longs'  :{vol:2,fr:'cote',  pan:20,dos:30,large:14},
   'queue'       :{vol:2,fr:'courte',pan:2, dos:12,queue:14},
   'couettes'    :{vol:2,fr:'droite',pan:2, dos:12,couettes:9},
   'chignon'     :{vol:2,fr:'courte',pan:2, dos:12,chignon:1},
   'chignon haut':{vol:1,fr:'courte',pan:1, dos:12,chignon:2},
   'tresse'      :{vol:2,fr:'cote',  pan:3, dos:12,tresse:1},
   'tresses'     :{vol:2,fr:'droite',pan:2, dos:12,tresses:1},
   'ondulés'     :{vol:2,fr:'cote',  pan:12,dos:21,onde:1,large:14},
   'bouclés'     :{vol:4,fr:'boucle',pan:5, dos:16,boucle:1,large:16},
   'afro'        :{vol:6,fr:'rase',  pan:5, dos:16,afro:1,large:18},
   'dreads'      :{vol:2,fr:'rase',  pan:9, dos:20,dreads:1,large:14},
   'banane'      :{vol:5,fr:'arriere',pan:2,dos:12},
   'crête'       :{vol:0,fr:'rase',  pan:0, dos:0, crete:1},
   'crâne'       :{vol:0,fr:'rase',  pan:0, dos:0, rase:1},
   'hirsute'     :{vol:3,fr:'meche', pan:4, dos:14,hirsute:1}
  }[coiffe]||{vol:2,fr:'courte',pan:3,dos:3};

  if(D.rase){
    R(-6,YT-1,12,2,CO);
    if(prof)R(-6,YT-1,12,6,CO);
  }else{
    /* le dessus du crâne, commun aux trois vues */
    if(!D.crete){
      R(-6,YT-1-D.vol,12,2+D.vol,C);
      R(-6,YT-D.vol,4,1,CC);                    /* la lumière tombe à gauche */
      R(4,YT-1-D.vol,2,2+D.vol,CO);
    }
    if(prof){
      /* ---- de dos ---- */
      const y0=YT-1-D.vol;                      /* le sommet du crâne */
      const hd=Math.max(HT+2+D.vol,D.dos);      /* jamais moins que le crâne entier */
      const lg=D.large||12;                     /* largeur de la masse */
      const g0=-(lg>>1);
      /* une masse aux angles adoucis, pas un bloc */
      R(g0+1,y0,lg-2,hd,C);                     /* corps */
      R(g0,y0+1,lg,hd-2,C);                     /* flancs, un pixel plus bas */
      R(g0+1,y0+1,4,3,CC);                      /* la lumière en haut à gauche */
      R(g0+lg-4,y0+1,3,hd-2,CO);                /* le côté à l'ombre */
      R(g0+2,y0+hd-2,lg-4,2,CT);                /* les pointes */
      if(D.queue){R(-3,YT+2,6,3,C);                 /* l'attache */
        R(-2,YT+4,4,D.queue,C);R(-2,YT+4,2,D.queue,CC);R(-2,YT+D.queue+1,4,3,CT);}
      if(D.couettes){R(-9,YT+1,3,D.couettes,C);R(6,YT+1,3,D.couettes,CO);
        R(-9,YT+D.couettes-1,3,2,CT);R(6,YT+D.couettes-1,3,2,CT);}
      if(D.tresse)for(let i=0;i<6;i++)R(-2,YT+2+i*3,4,3,i%2?CO:C);
      if(D.tresses)for(let i=0;i<5;i++){R(-8,YT+1+i*3,3,3,i%2?CO:C);R(5,YT+1+i*3,3,3,i%2?C:CO);}
      if(D.chignon===1)R(-3,YT-5-D.vol-reb,6,5,C);
      if(D.chignon===2){R(-2,YT-8-reb,5,6,C);R(-2,YT-8-reb,2,2,CC);}
      if(D.crete){R(-6,YT-1,12,5,CO);R(-2,YT-9-reb,4,9,C);R(-2,YT-9-reb,2,9,CC);}
    }else if(cote){
      /* ---- de profil : un seul pan, derrière la tête ---- */
      const der=s>0?-8:6;                        /* le côté opposé au regard */
      if(D.pan>1){
        R(der+tr,YT+1,3,D.pan,C);
        if(D.pan>6)R(der+tr,YT+D.pan-2,3,3,CT);
      }
      if(D.fr==='droite')R(s>0?-6:0,YT+1,6,2,CO);
      if(D.fr==='cote')R(s>0?-2:-4,YT+1,6,2,CO);
      if(D.fr==='courte')R(s>0?-1:-5,YT+1,6,1,CO);
      if(D.fr==='arriere')R(s>0?-5:0,YT-2-D.vol,6,2,CC);
      if(!D.ras&&D.pan>=2)R(s>0?-6:2,YT+1,4,3,C);   /* la tempe visible */
      if(D.queue){R(der+tr,YT+1,3,D.queue,C);R(der+tr,YT+D.queue-2,3,3,CT);}
      if(D.couettes)R(der+tr,YT+2,3,D.couettes,C);
      if(D.tresse)for(let i=0;i<5;i++)R(der+tr,YT+2+i*3,3,3,i%2?CO:C);
      if(D.tresses)for(let i=0;i<4;i++)R(der+tr,YT+2+i*3,3,3,i%2?CO:C);
      if(D.chignon===1)R(der+2,YT-4-reb,5,5,C);
      if(D.chignon===2)R(-1,YT-8-reb,5,6,C);
      if(D.crete){R(-6,YT-1,12,4,CO);R(-2,YT-9-reb,4,9,C);}
      if(D.afro){R(der-1,YT-6,5,10,C);R(-6,YT-7,12,7,C);R(-6,YT-6,4,3,CC);}
      if(D.dreads)for(let i=0;i<4;i++)R(der+tr,YT+1+i*3,3,7,i%2?CO:C);
      if(D.boucle){R(der,YT-4,4,7,C);R(-6,YT-5,12,5,C);R(-6,YT-4,4,2,CC);}
    }else{
      /* ---- de face ---- */
      if(D.fr==='droite')R(-6,YT+1,12,2,CO);     /* frange qui barre le front */
      if(D.fr==='cote'){R(-6,YT+1,7,2,CO);R(1,YT+1,5,1,CO);}
      if(D.fr==='courte')R(-6,YT+1,12,1,CO);
      if(D.fr==='meche'){R(-6,YT+1,5,2,CO);R(2,YT+1,4,1,CO);}
      if(D.fr==='boucle'){R(-6,YT+1,4,2,C);R(-1,YT+1,3,2,CO);R(3,YT+1,3,2,C);}
      if(!D.ras&&D.pan>=2){                       /* les tempes, seulement si la coupe les a */
        const ht=Math.max(3,Math.min(5,D.pan));
        R(-6,YT+1,2,ht,C);
        R(4,YT+1,2,ht,CO);
      }
      if(D.pan>4){                                /* les pans qui pendent */
        R(-7+tr,YT+1,2,D.pan,C);
        R(5+tr,YT+1,2,D.pan,CO);
        R(-7+tr,YT+D.pan-2,2,3,CT);
        R(5+tr,YT+D.pan-2,2,3,CT);
      }
      if(D.onde){R(-8+tr,YT+4,2,5,C);R(6+tr,YT+4,2,5,CO);}
      if(D.queue){R(5+tr,YT+1,2,3,C);R(6+tr,YT+2,1,3,CO);}  /* elle dépasse à peine */
      if(D.couettes){
        R(-8+tr,YT,3,D.couettes,C);      R(5+tr,YT,3,D.couettes,CO);
        R(-8+tr,YT,3,1,CC);
        R(-8+tr,YT+D.couettes,2,2,CT);   R(6+tr,YT+D.couettes,2,2,CT);}
      if(D.tresse){R(5+tr,YT+1,3,4,CO);}
      if(D.tresses)for(let i=0;i<4;i++){R(-8+tr,YT+1+i*3,3,3,i%2?CO:C);R(5+tr,YT+1+i*3,3,3,i%2?C:CO);}
      if(D.chignon===1){R(-3,YT-3-D.vol-reb,5,3,C);R(-3,YT-3-D.vol-reb,2,1,CC);R(1,YT-3-D.vol-reb,1,3,CO);}
      if(D.chignon===2){R(-2,YT-8-reb,5,6,C);R(-2,YT-8-reb,2,2,CC);R(-3,YT-3,7,2,C);}
      if(D.afro){R(-9,YT-6,18,8,C);R(-9,YT-5,6,3,CC);R(5,YT-6,4,8,CO);
        R(-9,YT+1,3,5,C);R(6,YT+1,3,5,CO);}
      if(D.boucle){R(-7,YT-4,14,5,C);R(-7,YT-3,4,2,CC);R(4,YT-4,3,5,CO);
        R(-8,YT+1,3,4,C);R(5,YT+1,3,4,CO);R(-5,YT-6,4,2,CC);R(1,YT-6,4,2,C);}
      if(D.dreads){                              /* elles encadrent le visage, sans le couvrir */
        for(let i=0;i<3;i++){
          R(-8+tr,YT+1+i*4,3,5,i%2?CO:C);
          R(5+tr,YT+1+i*4,3,5,i%2?C:CO);
        }
        R(-6,YT+1,12,2,CO);                       /* la racine sur le front */
        R(-8+tr,YT+11,3,2,CT);R(5+tr,YT+11,3,2,CT);
      }
      if(D.crete){R(-6,YT-1,12,2,CO);R(-2,YT-9-reb,4,9,C);R(-2,YT-9-reb,2,9,CC);}
      if(D.hirsute){R(-8,YT-3,3,3,C);R(5,YT-4,3,3,CO);R(-3,YT-4-reb,3,3,C);R(2,YT-5-reb,2,3,CC);}
      if(D.fr==='arriere'){
        R(-5,YT-2-D.vol,10,2,C);
        R(-4,YT-4-D.vol,8,2,C);
        R(-2,YT-5-D.vol,6,1,CC);
        R(3,YT-4-D.vol,2,4,CO);}
    }
  }

  /* ---- ce qu'on porte sur la tête : ajusté à la largeur du crâne ---- */
  const LTc=SIL.tete;                              /* demi-largeur de la tête */
  if(chapeau==='casquette'){
    R(-LTc-1,YT-4,(LTc+1)*2,4,'#3f5f6b');          /* la calotte épouse le crâne */
    R(-LTc-1,YT-4,(LTc+1)*2,1,'#547a88');
    R(-LTc,YT-1,LTc*2,1,'#33505a');
    const vx=cote?(s>0?1:-LTc*2-1):-LTc-1;         /* la visière part vers l'avant */
    R(vx,YT,LTc*2+1,2,'#33505a');
    R(vx,YT,LTc*2+1,1,'#456a76');
  }
  else if(chapeau==='bandana'){
    R(-LTc-1,YT-2,(LTc+1)*2,3,'#a8524a');
    R(-LTc-1,YT-2,(LTc+1)*2,1,'#c46a5e');
    R(-LTc+1,YT-1,3,1,'#8f4038');                  /* le nœud */
    R(LTc-1+tr,YT,3,5,'#8f4038');                  /* les pans qui pendent */
    R(LTc-1+tr,YT+4,3,1,'#71322c');
  }
  else if(chapeau==='bonnet'){
    R(-LTc-1,YT-6,(LTc+1)*2,6,'#8a4a3a');
    R(-LTc-1,YT-6,(LTc+1)*2,1,'#a85c48');
    R(-LTc-1,YT-1,(LTc+1)*2,2,'#a85c48');          /* le revers */
    R(-LTc-1,YT+1,(LTc+1)*2,1,'#71392c');
    R(-2,YT-9-reb,4,3,'#c07260');                  /* le pompon */
    R(-2,YT-9-reb,2,1,'#d9897a');
  }
  else if(chapeau==='capuche'){
    R(-LTc-2,YT-5,(LTc+2)*2,HT+3,'#54606b');       /* le tissu enveloppe la tête */
    R(-LTc-2,YT-5,(LTc+2)*2,2,'#68757f');
    R(-LTc-2,YT+3,2,HT-5,'#465059');
    R(LTc,YT+3,2,HT-5,'#465059');
    R(-LTc,YT+1,LTc*2,HT-2,peau);                  /* le visage reste dégagé */
    R(-LTc,YT+1,3,HT-2,peauO);
    R(-LTc,YT+1,LTc*2,1,teint(peau,-30));          /* l'ombre de la capuche */
  }
  else if(chapeau==='chapeau'){
    R(-LTc-4,YT-1,(LTc+4)*2,2,'#5a4a2c');          /* le bord large */
    R(-LTc-4,YT-1,(LTc+4)*2,1,'#7a663c');
    R(-LTc,YT-6,LTc*2,5,'#8f7a49');                /* la calotte */
    R(-LTc,YT-6,LTc*2,1,'#a08a56');
    R(-LTc,YT-3,LTc*2,2,'#5a4a2c');                /* le ruban */
  }
  else if(chapeau==='beret'){
    R(-LTc-1,YT-4,(LTc+1)*2-1,4,'#2f4a5c');
    R(-LTc-1,YT-4,LTc,2,'#3f6076');
    R(LTc-2,YT-6-reb,2,2,'#2f4a5c');               /* la queue sur le dessus */
  }
  else if(chapeau==='cagoule'){
    R(-LTc-1,YT-2,(LTc+1)*2,HT+2,'#3a3a44');
    R(-LTc-1,YT-2,(LTc+1)*2,2,'#4a4a56');
    if(!prof){R(-4,YT+4,3,3,peau);R(1,YT+4,3,3,peau);}   /* les deux fentes */
    R(-LTc-1,YT+HT-2,(LTc+1)*2,1,'#2b2b33');
  }

  /* ---- le visage ----
     Il tient dans dix pixels de large : chaque pixel compte. */
  const blanc='#f6f3ec', ombreOeil=teint(peau,-38);
  if(dir==='bas'&&chapeau==='cagoule'){
    R(-4,YT+5,3,2,oeil);R(2,YT+5,3,2,oeil);      /* on ne voit que les yeux */
  }else if(dir==='bas'){
    const clin=(Date.now()+x*53)%4600<130;
    /* sourcils */
    if(sourcil==='fins'){R(-4,YT+3,3,1,chevO);R(2,YT+3,3,1,chevO);}
    if(sourcil==='epais'){R(-4,YT+2,3,2,chevO);R(2,YT+2,3,2,chevO);}
    if(sourcil==='arques'){R(-4,YT+3,2,1,chevO);R(-2,YT+2,1,1,chevO);
                           R(3,YT+3,2,1,chevO);R(2,YT+2,1,1,chevO);}
    if(sourcil==='fronces'){R(-4,YT+3,3,1,chevO);R(2,YT+3,3,1,chevO);
                            R(-1,YT+3,2,1,chevO);}
    /* creux des orbites */
    R(-4,YT+4,3,1,ombreOeil);R(2,YT+4,3,1,ombreOeil);
    /* yeux */
    if(clin){R(-4,YT+6,3,1,chevO);R(2,YT+6,3,1,chevO);}
    else{
      const dessine=(gx,h,ty)=>{
        R(gx,YT+ty,3,h,blanc);
        R(gx+1,YT+ty,1,h,oeil);                 /* iris */
        R(gx+1,YT+ty,1,1,teint(oeil,40));       /* reflet */
      };
      if(fy==='ronds'){dessine(-4,3,4);dessine(2,3,4);}
      else if(fy==='plisses'){R(-4,YT+5,3,1,oeil);R(2,YT+5,3,1,oeil);}
      else if(fy==='fatigues'){dessine(-4,2,5);dessine(2,2,5);
        R(-4,YT+7,3,1,peauT);R(2,YT+7,3,1,peauT);}
      else if(fy==='doux'){dessine(-4,2,5);dessine(2,2,5);
        R(-4,YT+4,3,1,peau);R(2,YT+4,3,1,peau);}
      else if(fy==='severes'){dessine(-4,2,5);dessine(2,2,5);
        R(-4,YT+4,3,1,chevO);R(2,YT+4,3,1,chevO);}
      else{dessine(-4,2,5);dessine(2,2,5);}
    }
    /* nez */
    if(nez==='petit'){R(0,YT+7,1,1,peauT);}
    if(nez==='droit'){R(0,YT+6,1,2,ombreOeil);R(0,YT+8,1,1,peauT);}
    if(nez==='large'){R(-1,YT+7,3,1,ombreOeil);R(-1,YT+8,3,1,peauT);}
    if(nez==='retrousse'){R(0,YT+6,1,2,ombreOeil);R(-1,YT+8,2,1,peauT);}
    /* cils : c'est le regard qui les porte, pas la carrure */
    if((fy==='doux'||fy==='ronds')&&!clin){R(-5,YT+4,1,1,chevO);R(4,YT+4,1,1,chevO);}
    /* bouche */
    const lev=(bouche==='lèvres');
    if(bouche==='neutre')R(-2,YT+9,4,1,teint(peau,-64));
    if(lev){R(-2,YT+9,4,1,'#b06a68');R(-2,YT+10,4,1,teint(peau,-24));R(-1,YT+8,2,1,'#c47f7c');}
    if(bouche==='sourire'){R(-2,YT+9,4,1,SIL.levres?'#b06a68':teint(peau,-64));
      R(-3,YT+8,1,1,peauO);R(2,YT+8,1,1,peauO);R(-1,YT+10,2,1,teint(peau,-30));}
    if(bouche==='severe'){R(-3,YT+9,6,1,teint(peau,-70));}
    if(bouche==='entrouverte'){R(-2,YT+9,4,1,teint(peau,-70));R(-1,YT+10,2,1,'#8a4a4a');}
    if(bouche==='pincée'){R(-1,YT+9,3,1,teint(peau,-70));R(-2,YT+9,1,1,peauT);R(2,YT+9,1,1,peauT);}
    /* marques */
    if(marque==='taches'){R(-4,YT+7,1,1,peauT);R(-2,YT+8,1,1,peauT);R(3,YT+7,1,1,peauT);R(2,YT+6,1,1,peauT);}
    if(marque==='cicatrice'){R(3,YT+2,1,5,teint(peau,-46));R(2,YT+3,1,1,teint(peau,-46));}
    if(marque==='grain'){R(-3,YT+8,1,1,teint(peau,-70));}
    if(marque==='fard'){R(-4,YT+8,3,1,'#c9707a');R(2,YT+8,3,1,'#c9707a');}
    if(marque==='peinture'){R(-4,YT+4,3,3,'#a8524a');R(2,YT+4,3,3,'#a8524a');
      R(-4,YT+4,3,1,'#c46a5e');R(2,YT+4,3,1,'#c46a5e');}
    /* boucles d'oreille */
    const oy=YT+7, ox=SIL.tete+1;
    if(boucle==='anneau'){R(-ox,oy,1,2,'#c9a24a');R(ox-1,oy,1,2,'#c9a24a');}
    if(boucle==='perle'){R(-ox,oy,1,1,'#f2efe4');R(ox-1,oy,1,1,'#f2efe4');}
    if(boucle==='plume'){R(ox-1,oy,1,4,'#4a7d7d');R(ox-1,oy+3,1,1,'#7fbdbd');}
  }else if(cote){
    const dx=s>0?2:-4;
    if(sourcil==='epais')R(dx,YT+2,2,2,chevO);else R(dx,YT+3,2,1,chevO);
    R(dx,YT+4,2,1,ombreOeil);
    R(dx,YT+5,2,2,blanc);
    R(dx+(s>0?1:0),YT+5,1,2,oeil);
    R(s>0?5:-6,YT+6,1,2,peauT);                 /* le nez dépasse du profil */
    R(s>0?4:-5,YT+9,2,1,teint(peau,-64));       /* bouche */
    if(boucle!=='aucune')R(s>0?-4:3,YT+7,1,2,boucle==='perle'?'#f2efe4':'#c9a24a');
    if(marque==='fard')R(dx-1,YT+8,3,1,'#c9707a');
  }
}

/* ================= le décor, en pixels de jeu =================
   Repère de chaque élément : x au milieu du pied, y au sol.
   Tailles réelles, à l'échelle du personnage (42 px de haut).   */
const VERTS={
 fonce:'#25542a', moyen:'#2f6b34', clair:'#3d7d3f', vif:'#4a944a', lumiere:'#5aa855',
 tronc:'#6b4a28', troncC:'#8a6238', troncO:'#4f3520',
 pierre:'#7b8288', pierreC:'#8b939a', pierreH:'#a2a9b0', pierreO:'#5f666c', pierreE:'#b7bec4',
 ombre:'rgba(40,60,28,.34)'
};

/* --- l'arbre : 1,2 à 1,9 fois la taille du personnage --- */
/* ================= LES CINQ ESSENCES =================
   Chêne, bouleau, saule, pommier, cyprès. Chacune est gravée UNE FOIS en
   trois âges et en deux morceaux — le pied et le houppier — pour que le
   feuillage se balance au vent sans rien redessiner. */
const ESSENCES=[
{id:'chene',nom:'chêne', h:94,larg:46,
 feuille:['#3d7d3f','#4a944a','#2f6b34','#5aa855'],ecorce:['#6b4a28','#8a6238','#4f3520']},
{id:'bouleau',nom:'bouleau', h:96,larg:34,
 feuille:['#6fa84a','#82bd5a','#5a8f3a','#9ad46a'],ecorce:['#d8d4c6','#f0ece0','#8a8578']},
{id:'saule',nom:'saule', h:82,larg:52,
 feuille:['#6f9e52','#82b062','#5a8442','#9ac47a'],ecorce:['#6b5a3a','#8a7650','#4f422a']},
{id:'pommier',nom:'pommier', h:80,larg:42,
 feuille:['#4f8a40','#5f9c4e','#3d7334','#78b163'],ecorce:['#6b4a2a','#8a6238','#4f3520'],
 fruits:true}
];
/* l'essence d'un arbre vient de sa place : un même arbre garde toujours la
   sienne, et les essences poussent en bosquets plutôt qu'en mélange */
function essenceDe(x,y){
  const n=(Math.sin(x*0.021+y*0.017)*0.5+0.5)*0.72+alea((x*7+y*13)%997)*0.28;
  return Math.max(0,Math.min(ESSENCES.length-1,Math.floor(n*ESSENCES.length)));
}
let ARBRES_GRAVES=null;
function toileArbre(w,h,f){
  const c=document.createElement('canvas');
  const D=Math.max(1,Math.min(3,Math.floor(window.devicePixelRatio||1)));
  c.width=w*D;c.height=h*D;
  const g=c.getContext('2d');
  g.setTransform(D,0,0,D,0,0);g.imageSmoothingEnabled=false;
  f({g,P:(x,y,col)=>{if(x<0||y<0||x>=w||y>=h)return;g.fillStyle=col;g.fillRect(x|0,y|0,1,1);},
     R:(x,y,w2,h2,col)=>{g.fillStyle=col;g.fillRect(x|0,y|0,w2|0,h2|0);}});
  return c;
}

/* Où s'arrête vraiment le feuillage ? On lit le calque une fois et on
   descend jusqu'à la dernière ligne peinte. C'est ce point-là qu'on vient
   poser sur le haut du tronc : le houppier mord sur l'écorce, plus de trou. */
function basDuFeuillage(c,w,h){
  try{
    const g=c.getContext('2d'), D=c.height/h;
    const d=g.getImageData(0,0,c.width,c.height).data;
    for(let y=c.height-1;y>=0;y--){
      for(let x=0;x<c.width;x++) if(d[(y*c.width+x)*4+3]>8) return (y+1)/D;
    }
  }catch(e){}
  return h*0.86;   /* si la lecture est refusée, on retombe sur une valeur sûre */
}
/* ---- la gravure, en aplats francs ----
   Pas un pixel semé au hasard : des masses rectangulaires franches, empilées,
   qui se chevauchent de deux pixels pour qu'aucun trou n'apparaisse. Quatre
   tons par arbre, du plus sombre en bas au plus clair en haut — c'est le
   langage des arbres du jeu, et c'est lui qu'on garde. */
function graverArbres(){
  ARBRES_GRAVES={};
  ESSENCES.forEach(E=>{
    ARBRES_GRAVES[E.id]=[0,1,2].map(age=>{
      const k=[0.64,0.82,1][age];
      const h=Math.round(E.h*k), larg=Math.round(E.larg*k);
      const W=larg+10, HT=h+12;
      const F=E.feuille, EC=E.ecorce;

      /* --- le pied : l'ombre et le tronc --- */
      const ep=Math.max(3,Math.round(larg*(0.14)));
      const pied=toileArbre(W,28,({R,g})=>{
        g.fillStyle='rgba(40,56,30,.28)';
        g.beginPath();g.ellipse(W/2+1,22,larg*0.36,larg*0.12,0,0,7);g.fill();
        const x0=Math.round(W/2-ep/2);
        R(x0,0,ep,22,EC[0]);
        R(x0,0,1,22,EC[1]);                 /* la lumière à gauche */
        R(x0+ep-1,2,1,20,EC[2]);            /* l'ombre à droite */
        R(x0-1,20,ep+2,2,EC[2]);            /* le pied qui s'évase */
        if(E.id==='bouleau'){               /* les stries du bouleau, franches */
          R(x0,4,ep-1,2,EC[2]);R(x0+1,11,ep-2,2,EC[2]);R(x0,17,ep-1,1,EC[2]);
        }
      });

      /* --- le houppier, en masses empilées --- */
      const tete=toileArbre(W,HT,({R,P,g})=>{
        const cx=Math.round(W/2);
        /* une masse : un rectangle, avec ses coins mangés pour l'arrondir */
        const masse=(dy,hh,lg,col,coins)=>{
          R(cx-lg,dy,lg*2,hh,col);
          const c=coins===undefined?2:coins;
          if(c>0){
            /* on ronge les quatre coins d'un cran : ça suffit à faire rond */
            R(cx-lg,dy,c,1,'rgba(0,0,0,0)');
            g.clearRect(cx-lg,dy,c,1);g.clearRect(cx+lg-c,dy,c,1);
            g.clearRect(cx-lg,dy+hh-1,c,1);g.clearRect(cx+lg-c,dy+hh-1,c,1);
          }
        };
        if(!F){
          /* l'arbre mort : le tronc monte, des branches en équerre */
          R(cx-2,HT*0.12,4,HT*0.88,EC[0]);
          R(cx-2,HT*0.12,1,HT*0.88,EC[1]);
          const br=(y,dx,lg,ht2)=>{
            R(cx+(dx<0?dx-lg:2),y,lg,2,EC[0]);
            R(cx+(dx<0?dx-lg:lg),y-ht2,2,ht2+2,EC[1]);
          };
          br(Math.round(HT*0.5),-3,Math.round(larg*0.36),Math.round(HT*0.2));
          br(Math.round(HT*0.62),3,Math.round(larg*0.32),Math.round(HT*0.16));
          br(Math.round(HT*0.3),-3,Math.round(larg*0.24),Math.round(HT*0.14));
          return;
        }
        if(E.id==='pin'){
          /* des étages francs, chacun plus étroit que celui du dessous */
          const n=5;
          for(let i=0;i<n;i++){
            const t=i/(n-1);
            const hh=Math.round(HT/n)+3;
            const dy=Math.round(HT*0.9-((i+1)*HT*0.86/n));
            const lg=Math.max(2,Math.round(larg/2*(1-t*0.62)));
            masse(dy,hh,lg,i===0?F[2]:(i<n-2?F[0]:(i===n-2?F[1]:F[3])),1);
          }
          R(cx-1,Math.round(HT*0.06),2,3,F[3]);
        }else if(E.id==='saule'){
          masse(Math.round(HT*0.18),Math.round(HT*0.2),Math.round(larg*0.42),F[1],3);
          masse(Math.round(HT*0.3),Math.round(HT*0.22),Math.round(larg*0.5),F[0],3);
          masse(Math.round(HT*0.44),Math.round(HT*0.16),Math.round(larg*0.46),F[2],3);
          /* les rideaux : des bandes franches de deux pixels */
          for(let i=0;i<7;i++){
            const x=Math.round(cx-larg*0.44+i*(larg*0.147));
            const bas2=Math.round(HT*0.58+((i*37)%5)*HT*0.07);
            R(x,Math.round(HT*0.52),2,bas2-Math.round(HT*0.52),i%2?F[0]:F[2]);
            R(x,bas2,2,2,F[1]);
          }
        }else if(E.id==='olivier'){
          /* trois masses séparées, claires */
          masse(Math.round(HT*0.34),Math.round(HT*0.22),Math.round(larg*0.3),F[0],2);
          masse(Math.round(HT*0.26),Math.round(HT*0.2),Math.round(larg*0.24),F[1],2);
          R(cx-Math.round(larg*0.3),Math.round(HT*0.4),4,Math.round(HT*0.16),F[2]);
          R(cx+Math.round(larg*0.2),Math.round(HT*0.36),Math.round(larg*0.24),
            Math.round(HT*0.18),F[0]);
          R(cx-Math.round(larg*0.1),Math.round(HT*0.18),Math.round(larg*0.26),
            Math.round(HT*0.14),F[3]);
        }else{
          /* le chêne, le bouleau, le pommier : quatre masses empilées,
             de la plus sombre et la plus large en bas à la plus claire en haut */
          const h1=Math.round(HT*0.2), h2=Math.round(HT*0.2),
                h3=Math.round(HT*0.16), h4=Math.round(HT*0.12);
          const y1=Math.round(HT*0.68)-h1;
          masse(y1,h1+4,Math.round(larg*0.5),F[2],2);
          masse(y1-h2+2,h2+3,Math.round(larg*0.5),F[0],2);
          masse(y1-h2-h3+4,h3+3,Math.round(larg*0.42),F[1],2);
          masse(y1-h2-h3-h4+6,h4+3,Math.round(larg*0.3),F[3],1);
          /* deux éclats de lumière, posés francs */
          R(cx-Math.round(larg*0.4),y1-h2+5,Math.round(larg*0.2),3,F[1]);
          R(cx+Math.round(larg*0.14),y1+2,Math.round(larg*0.18),3,F[1]);
          /* les côtés qui débordent, pour casser la symétrie */
          R(cx-Math.round(larg*0.56),y1-h2+4,3,h2-2,F[0]);
          R(cx+Math.round(larg*0.5),y1-2,3,h1,F[2]);
        }
        /* les pommes : deux pixels sur deux, francs */
        if(E.fruits){
          const pos=[[-0.3,0.42],[0.24,0.36],[-0.12,0.26],[0.34,0.5],[-0.42,0.5],[0.06,0.5]];
          pos.slice(0,4+age).forEach(([fx,fy])=>{
            const x=Math.round(cx+fx*larg), y=Math.round(HT*fy);
            R(x,y,3,3,'#c14a3e');R(x,y,2,1,'#d9584f');R(x+2,y+2,1,1,'#8f332c');
          });
        }
      });
      const bas=basDuFeuillage(tete,W,HT);
      return {pied,tete,W,HT,h,bas};
    });
  });
}


/* On ne dessine plus l'arbre : on recopie son calque. Le pied ne bouge
   jamais, le houppier se décale au vent — deux recopies par arbre. */
function dessinerArbre(g,x,y,gr,essence){
  if(!ARBRES_GRAVES)graverArbres();
  const E=ESSENCES[Math.min(ESSENCES.length-1,Math.max(0,essence|0))]||ESSENCES[0];
  const ages=ARBRES_GRAVES[E.id];
  const A=ages[Math.min(ages.length-1,Math.max(0,gr|0))];
  g.drawImage(A.pied,Math.round(x-A.W/2),Math.round(y-22),A.W,28);
  const souffle=penche(x,y,0.9);
  /* le bas du feuillage vient se poser six points au-dessus du sol, donc
     six points dans le tronc : les deux morceaux se recouvrent toujours */
  g.drawImage(A.tete,Math.round(x-A.W/2+souffle),Math.round(y-6-A.bas),A.W,A.HT);
}


/* --- les pierres, l'argile et les roseaux, gravés une fois ---
   Même méthode que les buissons : une réunion de boules, remplie colonne
   par colonne. Contour rond, masse en aplat, aucun pixel isolé. */
const P_PIERRE={pierre:'#7b8288',clair:'#8b939a',haut:'#a2a9b0',ombre:'#5f666c',eclat:'#b7bec4'};
const P_ARG={fonce:'#7d3826',bas:'#9c4a32',moyen:'#a85039',clair:'#bb5e42',
             haut:'#c76b4c',luisant:'#e0977a'};
const P_ROS={tige:'#5e8a47',tigeC:'#7db35d',tigeO:'#48703a',epi:'#8a6238',epiC:'#a5764a'};
const TAILLES_PIERRE=[{id:0,h:22,l:11},{id:1,h:26,l:13},{id:2,h:30,l:15}];
const T_ROSEAUX=[{n:4,h:20,epis:0},{n:6,h:28,epis:3},{n:8,h:36,epis:5}];

/* le contour : pour chaque colonne, la boule la plus haute qui la traverse */
function hautDeLobes(lobes,W){
  const h=new Array(W).fill(null);
  for(let x=0;x<W;x++){
    let y=null;
    lobes.forEach(([cx,cy,r])=>{
      const dx=x+0.5-cx;if(Math.abs(dx)>=r)return;
      const t=cy-Math.sqrt(r*r-dx*dx);
      if(y===null||t<y)y=t;
    });
    h[x]=y===null?null:Math.round(y);
  }
  return h;
}
let SOL_GRAVE=null;
function graverSolides(){
  SOL_GRAVE={pierres:[],argile:null,roseaux:[]};

  TAILLES_PIERRE.forEach(S=>{
    const HT=S.h,L=S.l,W=L*2+10,HC=HT+8;
    SOL_GRAVE.pierres.push({c:toilePetit(W,HC,({R,ombre})=>{
      const cx=W/2,sol=HC-4,r=L*0.62;
      ombre(cx+1,sol,L*0.95,3);
      const haut=hautDeLobes([[cx-L*0.42,sol-r*0.72,r],[cx+L*0.46,sol-r*0.64,r*0.92],
                              [cx-L*0.06,sol-HT*0.58,r*1.04]],W);
      for(let x=0;x<W;x++){
        const y=haut[x];if(y===null)continue;
        const h=sol-y;if(h<=0)continue;
        R(x,y,1,h,P_PIERRE.pierre);
        R(x,y,1,Math.max(2,Math.round(h*0.36)),P_PIERRE.clair);
        if(x<W*0.5)R(x,y,1,2,P_PIERRE.haut);
        R(x,sol-3,1,3,P_PIERRE.ombre);
      }
      const x0=Math.round(cx-L*0.2);                    /* la cassure */
      for(let i=0;i<Math.round(HT*0.34);i++)R(x0+Math.round(i*0.5),sol-6-i,2,1,P_PIERRE.eclat);
      R(cx-L-4,sol-5,5,3,P_PIERRE.pierre);              /* l'éclat au pied */
      R(cx-L-4,sol-5,5,1,P_PIERRE.clair);
    }),W,HC});
  });

  const W=38,HC=24;
  const argile=(pleine)=>toilePetit(W,HC,({R,ombre})=>{
    const cx=W/2,sol=HC-4;
    ombre(cx+1,sol,15,4.5);
    const haut=hautDeLobes(pleine
      ? [[cx-8,sol-5,7],[cx+7,sol-5.5,7.4],[cx-1,sol-11,7.8]]
      : [[cx-7,sol-3.5,5.4],[cx+6,sol-3,5]],W);
    for(let x=0;x<W;x++){
      const y=haut[x];if(y===null)continue;
      const h=sol-y;if(h<=0)continue;
      R(x,y,1,h,P_ARG.moyen);
      R(x,y,1,Math.max(2,Math.round(h*0.4)),P_ARG.clair);
      if(x<W*0.5)R(x,y,1,2,P_ARG.haut);
      R(x,sol-3,1,3,P_ARG.bas);R(x,sol-1,1,1,P_ARG.fonce);
    }
    if(pleine){R(cx-6,sol-14,4,1,P_ARG.luisant);R(cx+3,sol-7,4,1,P_ARG.luisant);
               R(cx-11,sol-6,3,1,P_ARG.luisant);}
    else{R(cx-8,sol-6,3,1,P_ARG.luisant);R(cx-2,sol-4,5,2,P_ARG.fonce);}
  });
  SOL_GRAVE.argile={pleine:argile(true),prise:argile(false),W,HC};

  T_ROSEAUX.forEach((E,v)=>{
    const HT=E.h,W2=30,HC2=HT+12;
    const pied=toilePetit(W2,10,({R,ombre})=>{ombre(W2/2+1,6,12,3);
      R(W2/2-7,2,14,2,P_ROS.tigeO);});
    const tete=toilePetit(W2,HC2,({R})=>{
      const cx=W2/2,sol=HC2-2;
      for(let i=0;i<E.n;i++){
        const dx=Math.round((i-(E.n-1)/2)*(22/E.n));
        const h=Math.round(HT*(0.74+alea(i*3.1+v)*0.3));
        R(cx+dx,sol-h,2,h,P_ROS.tige);
        R(cx+dx,sol-h,1,Math.round(h*0.6),P_ROS.tigeC);
        R(cx+dx,sol-4,2,4,P_ROS.tigeO);
      }
      for(let i=0;i<E.epis;i++){
        const dx=Math.round((i-(E.epis-1)/2)*6);
        const h=Math.round(HT*(0.86+alea(i*7.3+v)*0.22));
        R(cx+dx-1,sol-h-6,4,7,P_ROS.epi);
        R(cx+dx-1,sol-h-6,4,2,P_ROS.epiC);
        R(cx+dx,sol-h-7,2,1,P_ROS.epiC);
      }
    });
    SOL_GRAVE.roseaux.push({pied,tete,W:W2,HC:HC2});
  });
}
const borne=(L,i)=>L[Math.min(L.length-1,Math.max(0,i|0))];

function dessinerRocher(g,x,y,gr){
  if(!SOL_GRAVE)graverSolides();
  const A=borne(SOL_GRAVE.pierres,gr);
  g.drawImage(A.c,Math.round(x-A.W/2),Math.round(y-A.HC+4),A.W,A.HC);
}
function dessinerArgile(g,x,y,gr,vide){
  if(!SOL_GRAVE)graverSolides();
  const A=SOL_GRAVE.argile;
  g.drawImage(vide?A.prise:A.pleine,Math.round(x-A.W/2),Math.round(y-A.HC+4),A.W,A.HC);
}
function dessinerRoseaux(g,x,y,gr,mx,my){
  if(!SOL_GRAVE)graverSolides();
  const A=borne(SOL_GRAVE.roseaux,gr);
  g.drawImage(A.pied,Math.round(x-A.W/2),Math.round(y-7),A.W,10);
  /* les tiges sont gravées droites : c'est la recopie qui les incline */
  const so=penche(mx||x,my||y,1.3)+Math.sin(Date.now()/900+(mx||x)*0.05)*1.2;
  g.drawImage(A.tete,Math.round(x-A.W/2+so),Math.round(y-A.HC+4),A.W,A.HC);
}

/* --- le buisson : à hauteur de taille, gravé une fois --- */
/* Trois variétés — mûrier, framboisier, myrtille — bâties en nuage : une
   réunion de boules. Pour chaque colonne on cherche la boule la plus haute
   qui la traverse, et on remplit la colonne d'un seul trait. Contour rond,
   masse en aplat, aucun pixel isolé. Chaque variété est gravée dans ses
   deux états, plein et cueilli : la cueillette ne recalcule rien. */
const VAR_BUISSON=[
 {id:'mure',      V:['#2f6b34','#3d7d3f','#4a944a','#5aa855','#6fbb66'],
  baie:['#2e2438','#5a4a68'],nb:5,h:26,l:13},
 {id:'framboise', V:['#3a7a3a','#4a8a44','#59a052','#68b25f','#7cc470'],
  baie:['#b8344a','#d4506a'],nb:6,h:30,l:11},
 {id:'myrtille',  V:['#2a5c30','#36703c','#427f46','#4e9152','#5ea45f'],
  baie:['#3a4a8a','#6478bc'],nb:7,h:20,l:15}
];
let BUISSONS_GRAVES=null;
function graverBuissons(){
  BUISSONS_GRAVES={};
  const A=(n)=>alea(n);
  VAR_BUISSON.forEach(B=>{
    BUISSONS_GRAVES[B.id]=[0,1].map(gr=>{
      const k=gr?1:0.8;
      const HT=Math.round(B.h*k), L=Math.round(B.l*k), W=L*2+8, HC=HT+8;
      const corps=(R,ombre,baies)=>{
        const cx=W/2, sol=HC-4, r=L*0.52;
        ombre(cx+1,sol,L*0.9,3);
        const lobes=[[cx-L*0.52,sol-r*0.9,r],[cx+L*0.5,sol-r*0.82,r*0.96],
                     [cx-L*0.16,sol-HT*0.56,r*1.06],[cx+L*0.3,sol-HT*0.72,r*0.8]];
        for(let x=0;x<W;x++){
          let y=null;
          lobes.forEach(([lx,ly,lr])=>{
            const dx=x+0.5-lx;
            if(Math.abs(dx)>=lr)return;
            const t=ly-Math.sqrt(lr*lr-dx*dx);
            if(y===null||t<y)y=t;
          });
          if(y===null)continue;
          y=Math.round(y);
          const h=sol-y;if(h<=0)continue;
          R(x,y,1,h,B.V[1]);                                 /* la masse */
          R(x,y,1,Math.max(2,Math.round(h*0.34)),B.V[2]);    /* le haut, plus clair */
          if(x<W*0.56)R(x,y,1,2,B.V[3]);                     /* la lumière à gauche */
          R(x,sol-3,1,3,B.V[0]);                             /* l'ombre au pied */
        }
        if(baies)for(let i=0;i<B.nb;i++){
          const [lx,ly,lr]=lobes[i%lobes.length];
          const bx=Math.round(lx+(A(i*5.3+B.nb)-0.5)*lr*1.1);
          const by=Math.round(ly+(A(i*9.1+B.nb)-0.2)*lr*0.9);
          R(bx,by,3,3,B.baie[0]);R(bx,by,2,1,B.baie[1]);
        }
      };
      return {
        plein:  toilePetit(W,HC,({R,ombre})=>corps(R,ombre,true)),
        cueilli:toilePetit(W,HC,({R,ombre})=>corps(R,ombre,false)),
        W,HC};
    });
  });
}
/* la variété vient de la place : un buisson garde toujours la sienne */
const varieteBuisson=(x,y)=>VAR_BUISSON[Math.min(VAR_BUISSON.length-1,
  Math.floor(alea((x*17+y*11)%997)*VAR_BUISSON.length))];

function dessinerBuisson(g,x,y,gr,vide,mx,my){
  if(!BUISSONS_GRAVES)graverBuissons();
  const B=varieteBuisson(mx||x,my||y)||VAR_BUISSON[0];
  const tailles=BUISSONS_GRAVES[B.id];
  const A=tailles[Math.min(tailles.length-1,Math.max(0,gr|0))];
  const so=Math.round(penche(mx||x,my||y,0.5));
  g.drawImage(vide?A.cueilli:A.plein,
    Math.round(x-A.W/2+so),Math.round(y-A.HC+4),A.W,A.HC);
}

/* --- le massif de fleurs : à la cheville (14 px) --- */
function dessinerFleurs(g,x,y,gr){
  const R=(a,b,w,h,c)=>{g.fillStyle=c;g.fillRect(x+a,y+b,w,h);};
  const tons=['#e8d76a','#f0f4f2','#e8607a','#c98fe0'];
  const clairs=['#fff8c8','#ffffff','#ffd3dc','#e6c4f2'];
  g.fillStyle='rgba(125,179,93,.5)';
  g.beginPath();g.ellipse(x,y-1,15,5,0,0,7);g.fill();
  for(let i=0;i<7;i++){
    const dx=-13+i*4+((i*7)%3), dy=-(5+((i*5)%7));
    R(dx,dy,1,-dy,'#5e8a47');
    R(dx-1,dy-3,3,3,tons[i%4]);
    R(dx,dy-3,1,1,clairs[i%4]);
  }
  R(-10,-1,3,1,'#6faa55');R(6,-2,3,1,'#6faa55');
}

/* ================= l'entrée de la mine =================
   Une carrière taillée dans la roche : le front de taille, l'étai de bois,
   les rails qui sortent du noir, le wagonnet et la lanterne du contremaître. */
function dessinerMine(g,x,y){
  const t=Date.now()/1000;
  const R2=(a,b,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.round(x+a),Math.round(y+b),w,h);};

  /* l'ombre au sol, large : c'est une falaise */
  g.fillStyle=VERTS.ombre;
  g.beginPath();g.ellipse(x+2,y-2,74,15,0,0,7);g.fill();

  /* ---- la falaise : trois plans de roche, du plus lointain au plus proche ---- */
  const roche=(dy,h,c1,c2,larg)=>{
    g.fillStyle=c1;
    g.beginPath();
    g.moveTo(x-larg,y+dy);
    g.lineTo(x-larg+8,y+dy-h*0.74);
    g.lineTo(x-larg*0.42,y+dy-h);
    g.lineTo(x+larg*0.30,y+dy-h*0.92);
    g.lineTo(x+larg-10,y+dy-h*0.58);
    g.lineTo(x+larg,y+dy);
    g.closePath();g.fill();
    /* les strates */
    g.fillStyle=c2;
    for(let i=1;i<4;i++){
      const yy=y+dy-h*(i/4.6);
      g.fillRect(x-larg+6*i,yy,larg*2-12*i,2);
    }
  };
  roche(-6,104,'#5b5148','#4c433b',88);        /* le fond */
  roche(-2, 86,'#6b6055','#5b5148',76);        /* le milieu */
  roche( 2, 62,'#7b6f62','#6b6055',64);        /* devant */

  /* les éboulis au pied */
  for(let i=0;i<22;i++){
    const a=-70+alea(i*3.1)*140, b=-4+alea(i*7.7)*8;
    const s2=3+((alea(i*5)*4)|0);
    R2(a,b,s2,s2*0.8,alea(i*11)<.5?'#8b8378':'#79716a');
  }

  /* ---- la galerie : un trou vraiment noir ---- */
  g.fillStyle='#0d0a08';
  g.beginPath();
  g.moveTo(x-26,y+2);
  g.lineTo(x-26,y-40);
  g.quadraticCurveTo(x,y-58,x+26,y-40);
  g.lineTo(x+26,y+2);
  g.closePath();g.fill();
  /* la profondeur : un dégradé qui avale la lumière */
  const d=g.createRadialGradient(x,y-14,4,x,y-14,34);
  d.addColorStop(0,'rgba(0,0,0,1)');
  d.addColorStop(1,'rgba(28,22,16,0)');
  g.fillStyle=d;
  g.beginPath();g.ellipse(x,y-16,26,26,0,0,7);g.fill();

  /* ---- l'encadrement de bois : deux montants et un linteau ---- */
  R2(-34,-46,9,48,'#6b4a28');R2(-34,-46,3,48,'#8a6238');
  R2(25,-46,9,48,'#5b3f21');R2(25,-46,3,48,'#7d5934');
  R2(-38,-52,76,8,'#7d5934');R2(-38,-52,76,3,'#96703f');
  /* les clous */
  g.fillStyle='#3d2a17';
  [[-32,-49],[28,-49],[-32,-8],[28,-8]].forEach(([a,b])=>g.fillRect(x+a,y+b,3,3));
  /* l'étai en diagonale, qui soutient le linteau */
  g.strokeStyle='#6b4a28';g.lineWidth=5;
  g.beginPath();
  g.moveTo(x-32,y-44);g.lineTo(x-20,y-50);
  g.moveTo(x+32,y-44);g.lineTo(x+20,y-50);
  g.stroke();

  /* ---- les rails qui sortent de la galerie ---- */
  g.fillStyle='#5b4a38';
  for(let i=0;i<5;i++){
    const b=2+i*7;
    g.fillRect(x-14-i*2,y+b,28+i*4,3);        /* les traverses */
  }
  g.fillStyle='#8b939a';
  g.beginPath();g.moveTo(x-9,y+2);g.lineTo(x-19,y+36);g.lineTo(x-15,y+36);g.lineTo(x-6,y+2);
  g.closePath();g.fill();
  g.beginPath();g.moveTo(x+6,y+2);g.lineTo(x+15,y+36);g.lineTo(x+19,y+36);g.lineTo(x+9,y+2);
  g.closePath();g.fill();

  /* ---- le wagonnet, garé sur le côté ---- */
  const wx=-56, wy=6;
  R2(wx-13,wy-14,26,12,'#6b5a4a');
  R2(wx-13,wy-14,26,3,'#84705c');
  R2(wx-13,wy-6,26,3,'#4f4238');
  g.fillStyle='#3a3430';
  g.beginPath();g.arc(x+wx-8,y+wy,4,0,7);g.fill();
  g.beginPath();g.arc(x+wx+8,y+wy,4,0,7);g.fill();
  g.fillStyle='#6b6055';
  g.beginPath();g.arc(x+wx-8,y+wy,1.6,0,7);g.fill();
  g.beginPath();g.arc(x+wx+8,y+wy,1.6,0,7);g.fill();
  /* du minerai qui dépasse */
  R2(wx-8,wy-18,5,5,'#b06a3a');
  R2(wx-1,wy-19,5,5,'#8b939a');
  R2(wx+5,wy-18,4,4,'#3a373c');

  /* ---- la lanterne accrochée au linteau, qui se balance ---- */
  const bal=Math.sin(t*1.1)*0.07;
  g.save();
  g.translate(x+30,y-50);
  g.rotate(bal);
  R2(0,0,0,0,'#000');
  g.fillStyle='#4f3520';g.fillRect(-1,0,2,9);
  g.fillStyle='#c9a24a';g.fillRect(-6,9,12,12);
  const cl=((t*2.4)%1)<.7;
  g.fillStyle=cl?'#ffe9a8':'#e8a94a';g.fillRect(-4,11,8,8);
  g.fillStyle='#9a7225';g.fillRect(-7,8,14,2);
  g.restore();
  /* son halo */
  g.save();g.globalAlpha=.12+Math.sin(t*2.4)*0.03;
  g.fillStyle='#ffd27a';
  g.beginPath();g.arc(x+30,y-38,30,0,7);g.fill();g.restore();

  /* ---- l'écriteau planté devant ---- */
  const px=48, py=6;
  R2(px,py-16,3,16,'#6b4a28');
  R2(px-14,py-30,31,15,'#3d2a17');
  R2(px-13,py-29,29,13,'#c9b48a');
  g.fillStyle='#4a3420';g.font='700 7px system-ui';g.textAlign='center';
  g.fillText('LA MINE',x+px+1,y+py-20);
  g.textAlign='left';
  /* une pioche croisée dessous */
  g.strokeStyle='#8a6238';g.lineWidth=2;
  g.beginPath();
  g.moveTo(x+px-9,y+py-15);g.lineTo(x+px+11,y+py-9);
  g.stroke();
  g.fillStyle='#a2a9b0';
  g.fillRect(x+px+9,y+py-12,5,3);

  /* ---- la poussière qui sort de la galerie ---- */
  for(let i=0;i<3;i++){
    const p=((t*0.26+i*0.33)%1);
    g.globalAlpha=(1-p)*0.22;
    g.fillStyle='#b9a88f';
    g.fillRect(x-6+Math.sin(p*6+i)*9, y-14-p*30, 4, 3);
  }
  g.globalAlpha=1;
}
