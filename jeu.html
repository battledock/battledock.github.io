/* ================= la mini-carte, dans son hublot ================= */
const RAYON_VUE=190;
let mctx=null, dernierMini=0;
function dessinerMini(){
  const c=$('mini');if(!c||!c.getContext)return;
  if(!mctx){mctx=c.getContext('2d');mctx.imageSmoothingEnabled=false;}
  const g=mctx, T=c.width;
  const k=T/(RAYON_VUE*2);
  const px=(x)=>Math.round((x-joueur.x)*k+T/2);
  const py=(y)=>Math.round((y-joueur.y)*k+T/2);

  g.fillStyle='#7db35d';g.fillRect(0,0,T,T);
  for(let i=0;i<90;i++){
    const a=alea(i*3.1)*T, b=alea(i*5.7)*T;
    g.fillStyle=i%2?'#8ec96f':'#6f9e52';
    g.fillRect(a|0,b|0,6,4);
  }
  g.fillStyle='#3d6b34';
  const b0=py(BORD), b1=py(MONDE-BORD), g0=px(BORD), g1=px(MONDE-BORD);
  if(b0>0)g.fillRect(0,0,T,b0);
  if(b1<T)g.fillRect(0,b1,T,T-b1);
  if(g0>0)g.fillRect(0,0,g0,T);
  if(g1<T)g.fillRect(g1,0,T-g1,T);

  for(const o of DECOR){
    if(Math.abs(o.x-joueur.x)>RAYON_VUE||Math.abs(o.y-joueur.y)>RAYON_VUE)continue;
    const x=px(o.x), y=py(o.y);
    if(o.t==='arbre'){g.fillStyle='#4a7d3f';
      g.beginPath();g.arc(x,y-2,[7,8,10][o.gr||0],0,7);g.fill();}
    else if(o.t==='rocher'){g.fillStyle='#9aa2a8';g.fillRect(x-4,y-4,8,7);}
    else if(o.t==='buisson'){
      const vide=o.cueilli&&Date.now()-o.cueilli<240000;
      g.fillStyle=vide?'#5e9e4a':'#d9576b';
      g.beginPath();g.arc(x,y-2,4,0,7);g.fill();}
    else if(o.t==='souche'||o.t==='gravats'){g.fillStyle='#8a7a62';g.fillRect(x-3,y-2,6,4);}
    else if(o.t==='coffre'){g.fillStyle='#f0cf7d';g.fillRect(x-5,y-5,10,8);
      g.strokeStyle='#8a6a2a';g.lineWidth=1.5;g.strokeRect(x-5,y-5,10,8);}
  }
  g.strokeStyle='rgba(255,255,255,.32)';g.lineWidth=2;
  g.beginPath();
  g.moveTo(T/2,4);g.lineTo(T/2,16);g.moveTo(T/2,T-16);g.lineTo(T/2,T-4);
  g.moveTo(4,T/2);g.lineTo(16,T/2);g.moveTo(T-16,T/2);g.lineTo(T-4,T/2);
  g.stroke();

  g.fillStyle='rgba(255,255,255,.14)';
  g.beginPath();g.arc(T/2,T/2,20,0,7);g.fill();
  g.fillStyle='#c8434f';
  g.beginPath();g.arc(T/2,T/2,9,0,7);g.fill();
  g.strokeStyle='#fff';g.lineWidth=3;g.stroke();
  const d={bas:[0,1],haut:[0,-1],gauche:[-1,0],droite:[1,0]}[joueur.dir]||[0,1];
  g.fillStyle='#fff';
  g.beginPath();
  g.moveTo(T/2+d[0]*22,T/2+d[1]*22);
  g.lineTo(T/2+d[0]*11-d[1]*8,T/2+d[1]*11+d[0]*8);
  g.lineTo(T/2+d[0]*11+d[1]*8,T/2+d[1]*11-d[0]*8);
  g.fill();
}

/* ================= petites fonctions d'aisance ================= */
const doux    =t=>t*t*(3-2*t);                 /* départ et arrivée adoucis */
const sortRap =t=>1-Math.pow(1-t,3);           /* part vite, finit lentement */
const entreRap=t=>t*t*t;                       /* part lentement, finit vite */
const rebond  =t=>{const n=7.5625,d=2.75;
  if(t<1/d)return n*t*t;
  if(t<2/d){t-=1.5/d;return n*t*t+.75;}
  if(t<2.5/d){t-=2.25/d;return n*t*t+.9375;}
  t-=2.625/d;return n*t*t+.984375;};

/* ================= frapper, ramasser ================= */
let SECOUSSE=0, ARRET=0;                        /* secousse de l'image, et micro-arrêt à l'impact */
function secouer(f){SECOUSSE=Math.max(SECOUSSE,f);}

let TEXTES=[];                                  /* les gains qui montent */
function texteVolant(x,y,txt,col){TEXTES.push({x,y,txt,col:col||'#f2e6cc',vie:1});}
function majTextes(dt){
  for(let i=TEXTES.length-1;i>=0;i--){
    TEXTES[i].y-=26*dt;TEXTES[i].vie-=dt*0.9;
    if(TEXTES[i].vie<=0)TEXTES.splice(i,1);
  }
}
function dessinerTextes(g,camX,camY){
  TEXTES.forEach(t=>{
    g.globalAlpha=Math.min(1,t.vie*1.6);
    g.font='700 9px ui-monospace,monospace';g.textAlign='center';
    g.fillStyle='rgba(10,16,10,.55)';g.fillText(t.txt,t.x-camX+1,t.y-camY+1);
    g.fillStyle=t.col;g.fillText(t.txt,t.x-camX,t.y-camY);
  });
  g.globalAlpha=1;g.textAlign='left';
}

/* les objets qui filent vers le sac, en arc */
let VOLS=[];
function volVersSac(xEcran,yEcran,icone){VOLS.push({x:xEcran,y:yEcran,t:0,ic:icone});}
function majVols(dt){
  for(let i=VOLS.length-1;i>=0;i--){VOLS[i].t+=dt*1.8;if(VOLS[i].t>=1)VOLS.splice(i,1);}
}
function dessinerVols(g,W,H){
  const cible={x:W*0.12,y:H-52};                /* la latte du sac */
  VOLS.forEach(v=>{
    const t=doux(Math.min(1,v.t));
    const x=v.x+(cible.x-v.x)*t;
    const y=v.y+(cible.y-v.y)*t-Math.sin(t*Math.PI)*30;   /* la cloche */
    const k=1-t*0.5;
    g.save();g.translate(x,y);g.scale(k,k);g.rotate(t*4);
    g.fillStyle='#8b939a';g.fillRect(-3,-3,6,6);
    g.fillStyle='#b7bec4';g.fillRect(-3,-3,6,2);
    g.restore();
  });
}
let GESTE={t:0,cible:null};
let PARTS=[];                                   /* éclats de pierre */
const TEINTES_PIERRE=['#a2a9b0','#8b939a','#7b8288','#5f666c'];
function eclats(x,y,n,col,force){
  const f=force||1;
  for(let i=0;i<n;i++){
    const a=Math.random()*6.283, v=(30+Math.random()*90)*f;
    PARTS.push({x,y,vx:Math.cos(a)*v,vy:-Math.abs(Math.sin(a))*v-20*f,
      vie:.7+Math.random()*.6,taille:1+Math.floor(Math.random()*3),
      rot:Math.random()*6.28,vrot:(Math.random()-.5)*14,
      c:col||TEINTES_PIERRE[Math.floor(Math.random()*4)],rebondi:false});
  }
}
function majParts(dt){
  for(let i=PARTS.length-1;i>=0;i--){
    const p=PARTS[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=220*dt;
    p.rot+=p.vrot*dt;
    p.vie-=dt*1.1;
    if(p.vy>0&&!p.rebondi&&p.vy>40&&Math.random()<dt*7){   /* un rebond au sol */
      p.vy*=-0.35;p.vx*=0.6;p.rebondi=true;
    }
    if(p.vie<=0)PARTS.splice(i,1);
  }
}
function dessinerParts(g,camX,camY){
  PARTS.forEach(p=>{
    g.globalAlpha=Math.min(1,Math.max(0,p.vie)*1.5);
    const t=p.taille;
    g.save();
    g.translate(Math.round(p.x-camX),Math.round(p.y-camY));
    g.rotate(p.rot);
    g.fillStyle=p.c;g.fillRect(-t/2,-t/2,t,t);
    g.restore();
  });
  g.globalAlpha=1;
}
/* ce qui est à portée de main */
function cible(){
  let d0=48,res=null;
  for(const o of DECOR){
    if(o.t!=='rocher'&&o.t!=='coffre'&&o.t!=='arbre'&&o.t!=='buisson')continue;
    if(o.t==='buisson'&&o.cueilli&&Date.now()-o.cueilli<240000)continue;   /* repousse en 4 min */
    if(o.tombe)continue;
    const d=Math.hypot(o.x-joueur.x,o.y-joueur.y-6);
    if(d<d0){d0=d;res=o;}
  }
  return res;
}

function agir(){

  if(o.t==='coffre'){

    secouer(0.35);

  GESTE={t:1,cible:o,impact:false,

  joueur.dir=Math.abs(o.x-joueur.x)>Math.abs(o.y-joueur.y)?(o.x>joueur.x?'droite':'gauche')
            :(o.y>joueur.y?'bas':'haut');
  try{navigator.vibrate&&navigator.vibrate(10);}catch(x){}
}
function majGeste(dt){
  if(GESTE.t<=0)return;
  const avant=GESTE.t;
  GESTE.t=Math.max(0,GESTE.t-dt*2.3);
  /* l'impact tombe aux deux tiers du geste, après l'élan */
  if(avant>0.42&&GESTE.t<=0.42){
    const o=GESTE.cible;
    if(o&&DECOR.includes(o)&&o.t==='buisson')return cueillir(o);
    if(o&&DECOR.includes(o)&&o.t==='arbre')  return couper(o);
    if(o&&DECOR.includes(o)){
      o.coups=(o.coups||0)+1;o.frappe=Date.now();o.recul=1;
      eclats(o.x,o.y-12,9,null,1);
      poussiere(o.x,o.y,6);
      secouer(0.6);ARRET=0.055;                      /* l'image se fige un instant */
      try{navigator.vibrate&&navigator.vibrate(16);}catch(x){}
      if(o.coups>=3){
        eclats(o.x,o.y-10,24,null,1.6);
        poussiere(o.x,o.y,14);
        secouer(1.3);ARRET=0.085;
        try{navigator.vibrate&&navigator.vibrate([12,30,26]);}catch(x){}
        const q=2+Math.floor(Math.random()*2);
        const pris=ajouter('pierre',q);
        e.recolte=(e.recolte||0)+pris;
        e.score=(e.score||0)+5;
        e.casses.push(o.x+','+o.y);
        DECOR.splice(DECOR.indexOf(o),1);
        DECOR.push({t:'gravats',x:o.x,y:o.y,gr:0,neuf:Date.now()});
        texteVolant(o.x,o.y-22,'+'+pris+' pierre','#cfd6db');
        texteVolant(o.x,o.y-34,'+5 pts','#a9c96a');
        for(let i=0;i<pris;i++)setTimeout(()=>volVersSac(VW*ECH/2,VH*ECH/2,'pierre'),i*90);
        sauver();monterEnLigne(true);
      }else{
        texteVolant(o.x,o.y-20,(3-o.coups)+' coup'+(o.coups<2?'s':''),'#c9cfd4');
      }
    }
  }
  if(GESTE.t<=0){GESTE.cible=null;majAction();}
}
/* ---- cueillir un buisson : rien ne casse, ça remue et ça donne ---- */
function cueillir(o){
  o.cueilli=Date.now();o.frappe=Date.now();o.secoue=1;
  /* les baies sautent du buisson */
  for(let i=0;i<9;i++){
    const a=-1.2-Math.random()*0.7;
    PARTS.push({x:o.x+(Math.random()-.5)*16,y:o.y-14,
      vx:Math.cos(a)*(20+Math.random()*45)*(Math.random()<.5?-1:1),
      vy:Math.sin(a)*(40+Math.random()*40),
      vie:.8+Math.random()*.4,taille:2,rot:Math.random()*6,vrot:(Math.random()-.5)*10,
      c:Math.random()<.75?'#c94a4a':'#e2604a',rebondi:false});
  }
  for(let i=0;i<6;i++){                       /* et quelques feuilles */
    PARTS.push({x:o.x+(Math.random()-.5)*20,y:o.y-16,
      vx:(Math.random()-.5)*30,vy:-10-Math.random()*20,
      vie:1.1,taille:2,rot:Math.random()*6,vrot:(Math.random()-.5)*8,
      c:Math.random()<.5?'#4a944a':'#3d7d3f',rebondi:false});
  }
  secouer(0.22);
  const q=2+Math.floor(Math.random()*2);
  const pris=ajouter('baies',q);
  e.recolte=(e.recolte||0)+pris;e.score=(e.score||0)+2;
  texteVolant(o.x,o.y-26,'+'+pris+' baies','#e8919a');
  texteVolant(o.x,o.y-38,'+2 pts','#a9c96a');
  for(let i=0;i<pris;i++)setTimeout(()=>volVersSac(VW*ECH/2,VH*ECH/2,'baies'),i*90);
  try{navigator.vibrate&&navigator.vibrate(10);}catch(x){}
  sauver();monterEnLigne(true);
}

/* ---- couper un arbre : cinq coups, puis il tombe ---- */
function couper(o){
  o.coups=(o.coups||0)+1;o.frappe=Date.now();
  /* copeaux de bois */
  for(let i=0;i<10;i++){
    const a=Math.random()*6.283;
    PARTS.push({x:o.x,y:o.y-Math.round(([50,64,79][o.gr||0])*0.3),
      vx:Math.cos(a)*(40+Math.random()*70),vy:-Math.abs(Math.sin(a))*70-20,
      vie:.7+Math.random()*.5,taille:1+Math.floor(Math.random()*3),
      rot:Math.random()*6,vrot:(Math.random()-.5)*16,
      c:['#a5764a','#8a6238','#6b4a28','#5b3f21'][i%4],rebondi:false});
  }
  /* des feuilles se détachent du houppier */
  const H=[50,64,79][o.gr||0];
  for(let i=0;i<7;i++){
    PARTS.push({x:o.x+(Math.random()-.5)*30,y:o.y-H*0.72,
      vx:(Math.random()-.5)*26,vy:6+Math.random()*10,
      vie:1.6,taille:2,rot:Math.random()*6,vrot:(Math.random()-.5)*6,
      c:['#4a944a','#3d7d3f','#2f6b34'][i%3],rebondi:true});
  }
  secouer(0.5);ARRET=0.05;
  try{navigator.vibrate&&navigator.vibrate(16);}catch(x){}
  if(o.coups>=5){
    /* il bascule du côté opposé au joueur */
    o.tombe=Date.now();
    o.sens=(o.x>=joueur.x)?1:-1;
    secouer(0.8);
    texteVolant(o.x,o.y-H*0.5,'timber !','#e8dcc0');
    setTimeout(()=>{
      const i=DECOR.indexOf(o);
      if(i>=0){
        DECOR.splice(i,1);
        DECOR.push({t:'souche',x:o.x,y:o.y,gr:0,neuf:Date.now()});
        DECOR.sort((a,b)=>a.y-b.y);
      }
      eclats(o.x,o.y-6,16,'#8a6238',1.4);
      poussiere(o.x,o.y,18);
      secouer(1.4);
      try{navigator.vibrate&&navigator.vibrate([14,40,30]);}catch(x){}
      const q=3+Math.floor(Math.random()*3);
      const pris=ajouter('bois',q);
      const fib=ajouter('fibre',1);
      e.recolte=(e.recolte||0)+pris+fib;e.score=(e.score||0)+8;
      e.casses.push('a'+o.x+','+o.y);
      texteVolant(o.x,o.y-24,'+'+pris+' bois','#d9b98a');
      texteVolant(o.x,o.y-36,'+8 pts','#a9c96a');
      for(let i2=0;i2<pris;i2++)setTimeout(()=>volVersSac(VW*ECH/2,VH*ECH/2,'bois'),i2*80);
      sauver();monterEnLigne(true);
    },1000);
  }else{
    texteVolant(o.x,o.y-H*0.35,(5-o.coups)+' coup'+(o.coups<4?'s':''),'#d9c9a8');
  }
}

/* la poussière soulevée au pied d'un rocher */
function poussiere(x,y,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*3.14-3.14;
    PARTS.push({x:x+(Math.random()-.5)*14,y,vx:Math.cos(a)*40,vy:-Math.random()*22,
      vie:.5+Math.random()*.5,taille:2+Math.floor(Math.random()*2),rot:0,vrot:0,
      c:'rgba(190,178,150,.7)',rebondi:true});
  }
}

const CHARGE_MAX=60;
if(!e.sac)e.sac={};
if(!e.outils)e.outils={};
if(!e.casses)e.casses=[];
const combien=k=>e.sac[k]||0;
const charge=()=>Object.entries(e.sac).reduce((a,[k,n])=>a+n*((OBJETS[k]||{poids:1}).poids),0);
const nbObjets=()=>Object.values(e.sac).filter(n=>n>0).length;
function ajouter(k,n){
  const place=CHARGE_MAX-charge();
  const q=Math.max(0,Math.min(n,Math.floor(place/(OBJETS[k].poids||1))));
  if(q>0){e.sac[k]=combien(k)+q;sauver();majPastille();}
  return q;
}
function majPastille(){
  const p=$('sac-nb');if(!p)return;
  const n=nbObjets();
  p.textContent=n;p.classList.toggle('on',n>0);
}
let choisi=null;
function ouvrirSac(){
  const cles=Object.keys(OBJETS);
  if(!choisi)choisi=cles.find(k=>combien(k)>0)||null;
  const kase=(k)=>{
    const n=combien(k);
    if(!n)return '';
    return '<button class="kase'+(k===choisi?' on':'')+'" data-obj="'+k+'">'+
      '<svg viewBox="0 0 16 16" width="32">'+ICONES[k]+'</svg><em>'+n+'</em></button>';
  };
  const pleines=cles.map(kase).filter(Boolean);
  const vides=Array.from({length:Math.max(0,8-pleines.length)},()=>'<span class="kase vide"></span>');
  const o=choisi&&combien(choisi)?OBJETS[choisi]:null;
  $('sacFond').innerHTML=
   '<div class="rabat"><button class="sacX" id="sac-x">✕</button>'+
     '<span><span class="sacT">Ton sac</span>'+
     '<span class="sacS">SAC DE TOILE · '+nbObjets()+' OBJET'+(nbObjets()>1?'S':'')+'</span></span>'+
     '<span class="sacCh"><b>'+charge()+'</b><i>/ '+CHARGE_MAX+'</i></span>'+
     '<span class="boucle"></span></div>'+
   '<div class="lanière"><i style="width:'+Math.round(charge()/CHARGE_MAX*100)+'%"></i></div>'+
   '<div class="sacCorps">'+
     '<div class="sacTit">RESSOURCES</div>'+
     '<div class="grille">'+pleines.join('')+vides.join('')+'</div>'+
     '<div class="sacTit">OUTILS</div>'+
     '<div class="grille">'+
       (e.outils.pioche?'<span class="kase on"><svg viewBox="0 0 16 16" width="32">'+ICONES.pioche+'</svg></span>':'')+
       Array.from({length:e.outils.pioche?3:4},()=>'<span class="kase vide"></span>').join('')+'</div>'+
   '</div>'+
   (o?'<div class="fiche"><span class="ic"><svg viewBox="0 0 16 16" width="28">'+ICONES[choisi]+'</svg></span>'+
      '<span class="tx"><b>'+o.nom+'</b><span>'+o.d+'</span></span>'+
      '<button id="sac-jeter">Jeter</button></div>':'');
  $('sac-x').onclick=()=>$('sacPage').classList.remove('on');
  $('sacFond').querySelectorAll('[data-obj]').forEach(b=>b.onclick=()=>{choisi=b.dataset.obj;ouvrirSac();});
  const j=$('sac-jeter');
  if(j)j.onclick=()=>{
    e.sac[choisi]=Math.max(0,combien(choisi)-1);
    if(!combien(choisi))choisi=null;
    sauver();majPastille();ouvrirSac();
  };
  $('sacPage').classList.add('on');
}

/* ================= le classement ================= */
let CLASSEMENT=null, classementEnCours=false;
async function chargerClassement(){
  try{
    const r=await fetch(URL_SB+'/rest/v1/joueurs?select=id,pseudo,apparence,score,recolte,maj'+
      '&order=score.desc,maj.desc&limit=30',{headers:sbEntetes});
    const d=await r.json();
    CLASSEMENT=(Array.isArray(d)?d:[]).filter(j=>
      j.pseudo&&j.pseudo!=='sans nom'&&/^[0-9a-f]{8}-/.test(j.id));   /* seulement les comptes */
  }catch(x){CLASSEMENT=[];}
}
function vignette(ap){
  const c=document.createElement('canvas');
  c.width=48;c.height=62;
  const g=c.getContext('2d');
  g.imageSmoothingEnabled=false;
  g.setTransform(1,0,0,1,0,0);
  for(let y=0;y<62;y+=8)for(let x=0;x<48;x+=8){
    g.fillStyle='#8ec96f';g.fillRect(x,y,8,8);
    g.fillStyle='#9ed47c';g.fillRect(x+1,y+2,1,2);
    g.fillStyle='#7db35d';g.fillRect(x+5,y+5,1,2);
  }
  g.save();g.translate(24,60);g.scale(1.15,1.15);
  sprite(g,0,0,Object.assign({},DEF_AP,ap||{}),'bas',0,false);
  g.restore();
  return c;
}
async function ouvrirClassement(){
  if(classementEnCours)return;
  classementEnCours=true;

  classementEnCours=false;

    return ouvrirPage('Classement','LES SURVIVANTS',
      '<div class="vide3">Personne n’est encore enregistré.<br>Reviens quand d’autres auront joué.</div>',true);

  const liserés=['linear-gradient(180deg,#f0c75a,#c2952f)',
                 'linear-gradient(180deg,#d4d9de,#a8b0b7)',

    const moi=j.id===e.id;

    const enLigne=vu!==null&&vu<3;

    const ets='<i class="et'+(enLigne?' vert':'')+'">'+quand+'</i>'+

      '<span class="lis" style="background:'+(liserés[i]||'#e7e5dd')+'"></span>'+
      '<span class="vig" data-ap="'+i+'"></span>'+

        '<span class="nom">'+(j.pseudo||'sans nom')+(moi?' · toi':'')+'</span>'+
        '<span class="rg" style="color:'+(couleursRang[i]||'#a8a89e')+'">'+(rangs[i]||(i+1)+'ᵉ')+'</span></span>'+

/* ================= l'entrée : le compte, et rien d'autre ================= */
const sb=createClient(URL_SB,CLE_SB);

async function ouvrirPorte(){
  let session=null;
  try{const {data}=await sb.auth.getSession();session=data&&data.session;}catch(x){}

  if(!session||!session.user){                 /* pas de compte : on renvoie à l'inscription */
    $('pCarte').style.display='';
    $('p-ok').onclick=()=>{location.href='index.html';};
    return;
  }
  e.id=session.user.id;
  const m=session.user.user_metadata||{};
  let nom=m.nom||m.pseudo||'';
  if(!nom){try{nom=localStorage.getItem('bdl.nom')||'';}catch(x){}}
  if(!nom){
    try{
      const r=await fetch(URL_SB+'/rest/v1/survivants?id=eq.'+encodeURIComponent(e.id)+'&select=pseudo',
        {headers:sbEntetes});
      const d2=await r.json();
      if(Array.isArray(d2)&&d2[0]&&d2[0].pseudo)nom=d2[0].pseudo;
    }catch(x){}
  }
  e.pseudo=nom||'Survivant';
  sauver();
  await descendreDeLigne();
  joueur.x=e.x;joueur.y=e.y;
  await monterEnLigne(true);

function entrer(){
  majPastille();
  $('porte').classList.add('parti');
  preparerMonde();
  taille();garderAllume();
  fondu=1;                                   /* le jeu apparaît en fondu */
}
ouvrirPorte();

/* ================= l'écran ne s'éteint pas en pleine partie ================= */
let veilleur=null;
async function garderAllume(){
  try{
    if('wakeLock' in navigator&&!veilleur){
      veilleur=await navigator.wakeLock.request('screen');
      veilleur.addEventListener('release',()=>{veilleur=null;});
    }
  }catch(x){}
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible')garderAllume();
  else{sauver();monterEnLigne(true);}       /* on enregistre en quittant */
});
addEventListener('pagehide',()=>{sauver();monterEnLigne(true);});
addEventListener('beforeunload',()=>{sauver();});

/* ================= boucle ================= */
let fondu=0;
taille();
let t0=performance.now();
(function boucle(t){
  requestAnimationFrame(boucle);
  const dt=Math.min(.05,(t-t0)/1000);t0=t;
  /* micro-arrêt à l'impact : tout se fige un instant, ça donne du poids */
  if(ARRET>0){ARRET-=dt;}
  else{
    majJoueur(dt);majGeste(dt);
  }
  majParts(dt);majTextes(dt);majVols(dt);majAction();
  if(SECOUSSE>0.01)SECOUSSE*=Math.pow(0.0009,dt);else SECOUSSE=0;
  dessiner();
  ctx.setTransform(1,0,0,1,0,0);
  dessinerVols(ctx,cv.width,cv.height);
  if(fondu>0){                                /* voile noir qui s'efface au départ */
    fondu=Math.max(0,fondu-dt*1.6);
    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle='rgba(12,20,12,'+fondu.toFixed(3)+')';
    ctx.fillRect(0,0,cv.width,cv.height);
  }
  dessinerJoy(dt);
  if(t-dernierMini>90){dernierMini=t;dessinerMini();}   /* la mini-carte, dix fois par seconde */
})(t0);
setInterval(()=>{sauver();monterEnLigne();},4000);
</script>
