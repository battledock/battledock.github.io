<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f4f1ea">
<title>Battle Dock — Le Port</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700;800;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{
  /* iOS : ne JAMAIS mettre overflow-x sur html, ça casse le scroll vertical */
  -webkit-text-size-adjust:100%;
}
body{
  overflow-x:hidden;              /* pas de scroll horizontal */
  overflow-y:auto;                /* scroll vertical explicite */
  -webkit-overflow-scrolling:touch;/* scroll fluide sur iOS */
  overscroll-behavior-y:contain;   /* pas de pull-to-refresh, mais le scroll marche */
  width:100%;
}
body{font-family:'Inter',sans-serif;background:#f4f1ea;color:#16140f;min-height:100vh;
  padding:0 0 calc(110px + env(safe-area-inset-bottom,0px));position:relative}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.4;
  background-image:radial-gradient(rgba(0,0,0,.045) 1px,transparent 1px);background-size:14px 14px}
.app{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:0 14px;width:100%;padding-bottom:20px}

/* ═══ BARRE DU HAUT ═══ */
.top{position:sticky;top:0;z-index:20;background:rgba(244,241,234,.92);backdrop-filter:blur(12px);
  padding:calc(12px + env(safe-area-inset-top,0px)) 0 12px;margin-bottom:14px;
  border-bottom:1px solid rgba(22,20,15,.06);width:100%}
.top-in{max-width:460px;margin:0 auto;padding:0 14px;display:flex;align-items:center;gap:9px}
.ent{flex:1;min-width:0}
.ent-n{font-family:'Playfair Display',serif;font-weight:900;font-size:16px;line-height:1.1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ent-l{font-size:9px;font-weight:800;letter-spacing:1px;color:#a09888;margin-top:2px}
.pill{display:flex;align-items:center;gap:5px;background:#16140f;color:#fff;border-radius:100px;
  padding:8px 13px;font-family:'Space Mono',monospace;font-size:12.5px;font-weight:700;flex-shrink:0;
  box-shadow:0 4px 14px rgba(22,20,15,.16)}
.pill.gold{background:#fff;color:#16140f;border:1.5px solid #e8e2d6;box-shadow:0 2px 8px rgba(22,20,15,.06)}
.pill .v{transition:transform .18s}
.pill .v.bump{transform:scale(1.25)}

/* ═══ LE PORT (visuel) ═══ */
.port{position:relative;border-radius:20px;overflow:hidden;margin-bottom:14px;
  box-shadow:0 8px 30px rgba(22,20,15,.1);background:#bcd6e8}
.port svg{width:100%;display:block}

/* ═══ SECTION ═══ */
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:20px 4px 10px}
.sec-t{font-size:9.5px;font-weight:900;letter-spacing:2px;color:#a09888}
.sec-n{font-size:10px;font-weight:900;color:#c0392b}

/* ═══ NAVIRES ═══ */
.ship{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;position:relative;overflow:hidden;
  box-shadow:0 2px 14px rgba(22,20,15,.06)}
.ship.ready{box-shadow:0 4px 20px rgba(22,163,74,.16);border:1.5px solid #86efac}
.ship.rot{border:1.5px solid #fca5a5;background:#fffafa}
.sh-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sh-ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0}
.sh-i{flex:1;min-width:0}
.sh-n{font-size:13.5px;font-weight:800;letter-spacing:-.1px}
.sh-d{font-size:10.5px;color:#8a8278;margin-top:2px}
.sh-v{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;color:#16140f;flex-shrink:0}
.sh-v small{display:block;font-size:8px;color:#a09888;letter-spacing:.5px;text-align:right;margin-top:1px}

/* barre de progression */
.pg{height:7px;background:#f0ece2;border-radius:4px;overflow:hidden;position:relative}
.pg-f{height:100%;border-radius:4px;transition:width .5s linear;position:relative}
.pg-f::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
  animation:sweep 1.8s linear infinite}
@keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.pg-t{display:flex;justify-content:space-between;margin-top:6px;font-size:10px;font-weight:600}
.pg-t .l{color:#8a8278}
.pg-t .r{font-family:'Space Mono',monospace;color:#16140f;font-weight:700}

/* fraîcheur (périssable) */
.fr{margin-top:8px;display:flex;align-items:center;gap:7px}
.fr-b{flex:1;height:4px;background:#f0ece2;border-radius:3px;overflow:hidden}
.fr-f{height:100%;border-radius:3px;transition:width .5s linear,background .5s}
.fr-t{font-size:9px;font-weight:800;letter-spacing:.3px;min-width:74px;text-align:right}

/* bouton collecter */
.coll{width:100%;margin-top:11px;background:#16a34a;border:none;border-radius:12px;padding:13px;
  font-family:Inter;font-size:12px;font-weight:900;letter-spacing:1.2px;color:#fff;cursor:pointer;
  box-shadow:0 6px 18px rgba(22,163,74,.28);transition:transform .14s;
  animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 6px 18px rgba(22,163,74,.28)}50%{box-shadow:0 6px 26px rgba(22,163,74,.45)}}
.coll:active{transform:scale(.97)}

/* ═══ QUAI VIDE ═══ */
.empty{background:#fff;border-radius:16px;padding:26px 18px;text-align:center;
  box-shadow:0 2px 14px rgba(22,20,15,.05)}
.empty-e{font-size:30px;margin-bottom:8px;opacity:.35}
.empty-t{font-family:'Playfair Display',serif;font-weight:900;font-size:15px;margin-bottom:4px}
.empty-d{font-size:11.5px;color:#a09888;line-height:1.5}

/* ═══ ÉQUIPE ═══ */
.crew{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;max-width:100%}
.crew::-webkit-scrollbar{display:none}
.dk{background:#fff;border-radius:14px;padding:11px 9px;min-width:88px;text-align:center;flex-shrink:0;
  box-shadow:0 2px 12px rgba(22,20,15,.06);position:relative}
.dk.busy::after{content:"";position:absolute;top:8px;right:8px;width:6px;height:6px;border-radius:50%;
  background:#f59e0b;box-shadow:0 0 6px #f59e0b;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.dk-av{width:44px;height:44px;margin:0 auto 7px;border-radius:50%;overflow:hidden;background:#f4f1ea}
.dk-av svg{width:100%;height:100%;display:block}
.dk-n{font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dk-t{font-size:8.5px;color:#a09888;margin-top:2px;font-weight:600}
.dk-add{background:#eae5da;border:1.5px dashed #cfc8ba;box-shadow:none;display:flex;
  flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:#a09888}
.dk-add .p{font-size:22px;line-height:1;margin-bottom:4px}
.dk-add .l{font-size:9px;font-weight:800;letter-spacing:.5px}

/* ═══ NAV BAS ═══ */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.94);
  backdrop-filter:blur(14px);border-top:1px solid rgba(22,20,15,.07);
  padding:9px 0 calc(9px + env(safe-area-inset-bottom,0px))}
.nav-in{max-width:460px;margin:0 auto;display:flex}
.nv{flex:1;background:none;border:none;padding:7px 4px;cursor:pointer;display:flex;
  flex-direction:column;align-items:center;gap:4px;color:#b8b0a4;transition:color .2s}
.nv.on{color:#16140f}
.nv svg{width:21px;height:21px}
.nv span{font-size:8.5px;font-weight:900;letter-spacing:.6px}

/* ═══ TOAST ═══ */
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,14px);z-index:60;
  background:#16140f;color:#fff;border-radius:100px;padding:12px 22px;
  font-size:12.5px;font-weight:700;box-shadow:0 10px 30px rgba(22,20,15,.3);
  opacity:0;transition:all .35s cubic-bezier(.2,.9,.3,1.2);pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast .g{color:#4ade80}

/* particule de gain */
.fly{position:fixed;z-index:70;font-family:'Space Mono',monospace;font-weight:700;font-size:16px;
  color:#16a34a;pointer-events:none;transition:all .9s cubic-bezier(.2,.8,.3,1)}
</style>

<style>
.xpb{max-width:460px;margin:8px auto 0;padding:0 14px}
.xpb-t{display:flex;justify-content:space-between;font-size:8.5px;font-weight:800;color:#b8b0a4;margin-bottom:3px}
.xpb-b{height:3px;background:#eae5da;border-radius:2px;overflow:hidden}
.xpb-f{height:100%;background:linear-gradient(90deg,#f59e0b,#c0392b);border-radius:2px;transition:width .5s}
.bloc{background:#fef2f2;border:1.5px solid #fca5a5;border-radius:14px;padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.bloc-e{font-size:20px;flex-shrink:0}
.bloc-t{flex:1;font-size:12px;font-weight:700;color:#b91c1c;line-height:1.4}
.bloc-c{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;color:#b91c1c;flex-shrink:0}
.ship.louche{border:1.5px solid #d4d4d8;background:#fafafa}
.tag-l{display:inline-block;background:#27272a;color:#fff;font-size:8px;font-weight:900;letter-spacing:.8px;border-radius:4px;padding:2px 6px;margin-left:5px;vertical-align:1px}
.coll{width:100%;margin-top:11px;border:none;border-radius:12px;padding:13px;font-family:Inter;font-size:12px;font-weight:900;letter-spacing:1.2px;color:#fff;cursor:pointer;transition:transform .14s}
.coll:active{transform:scale(.97)}
.coll:disabled{opacity:.6;cursor:wait}
.coll.go{background:#16a34a;box-shadow:0 6px 18px rgba(22,163,74,.28);animation:breathe 2.4s ease-in-out infinite}
.coll.risk{background:#27272a;box-shadow:0 6px 18px rgba(39,39,42,.3)}
.coll.bad{background:#94a3b8;box-shadow:none;animation:none}
.jr{background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 2px 14px rgba(22,20,15,.05)}
.jr-i{display:flex;gap:9px;padding:7px 0;border-bottom:1px solid #f4f1ea;font-size:11.5px;line-height:1.45}
.jr-i:last-child{border-bottom:none}
.jr-x{flex:1;color:#5a5248}
.jr-g{font-family:'Space Mono',monospace;font-weight:700;flex-shrink:0}
.jr-g.p{color:#16a34a}
.jr-g.m{color:#c0392b}
.page{display:none}
.page.on{display:block;animation:fadein .3s}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.buy{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:11px;box-shadow:0 2px 14px rgba(22,20,15,.06)}
.buy-av{width:46px;height:46px;border-radius:50%;overflow:hidden;background:#f4f1ea;flex-shrink:0}
.buy-av svg{width:100%;height:100%}
.buy-i{flex:1;min-width:0}
.buy-n{font-size:13.5px;font-weight:800}
.buy-t{font-size:10.5px;color:#8a8278;margin-top:2px}
.buy-s{font-size:9.5px;color:#16a34a;font-weight:800;margin-top:3px}
.buy-b{background:#16140f;border:none;border-radius:11px;padding:11px 15px;color:#fff;font-family:'Space Mono',monospace;font-size:11.5px;font-weight:700;cursor:pointer;flex-shrink:0;transition:transform .14s}
.buy-b:active{transform:scale(.94)}
.buy-b:disabled{background:#cfc8ba;cursor:not-allowed}
.lb{background:#fff;border-radius:16px;padding:6px 14px;box-shadow:0 2px 14px rgba(22,20,15,.06)}
.lb-r{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #f4f1ea}
.lb-r:last-child{border-bottom:none}
.lb-r.moi{background:#fdf6e3;margin:0 -14px;padding:11px 14px;border-radius:8px}
.lb-p{font-family:'Playfair Display',serif;font-weight:900;font-size:15px;width:26px;flex-shrink:0;color:#a09888}
.lb-p.top{color:#c0392b}
.lb-n{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-l{font-size:9px;color:#a09888;font-weight:700;margin-top:1px}
.lb-v{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;flex-shrink:0}
.toast.err{background:#b91c1c}
.skel{height:96px;border-radius:16px;margin-bottom:10px;background:linear-gradient(90deg,#eeeae0 25%,#f6f3ec 50%,#eeeae0 75%);background-size:200% 100%;animation:shim 1.3s infinite}
@keyframes shim{0%{background-position:-200% 0}100%{background-position:200% 0}}
.out{background:#fff;border-radius:16px;padding:22px;text-align:center;box-shadow:0 2px 14px rgba(22,20,15,.05)}
.out-t{font-family:'Playfair Display',serif;font-weight:900;font-size:16px;margin-bottom:6px}
.out-d{font-size:12px;color:#8a8278;line-height:1.5}

/* ═══ CONTRATS ═══ */
.ct{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;position:relative;overflow:hidden;
  box-shadow:0 2px 14px rgba(22,20,15,.06)}
.ct.d1{border-left:3px solid #94a3b8}
.ct.d2{border-left:3px solid #f59e0b}
.ct.d3{border-left:3px solid #c0392b}
.ct-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.ct-ic{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  font-size:19px;flex-shrink:0}
.ct-i{flex:1;min-width:0}
.ct-cl{font-size:13px;font-weight:800;line-height:1.2}
.ct-ob{font-size:11px;color:#8a8278;margin-top:3px}
.ct-st{display:flex;gap:2px;flex-shrink:0}
.ct-st i{font-style:normal;font-size:10px;color:#f59e0b}
.ct-money{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.ct-m{flex:1;min-width:74px;background:#faf8f3;border-radius:10px;padding:8px 10px}
.ct-m-l{font-size:8px;font-weight:900;letter-spacing:.8px;color:#a09888}
.ct-m-v{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;margin-top:2px}
.ct-m-v.p{color:#16a34a}
.ct-m-v.m{color:#c0392b}
.ct-pg{height:7px;background:#f0ece2;border-radius:4px;overflow:hidden;margin-bottom:6px}
.ct-pg-f{height:100%;border-radius:4px;transition:width .5s}
.ct-t{display:flex;justify-content:space-between;font-size:10px;font-weight:600;margin-bottom:2px}
.ct-t .l{color:#8a8278}
.ct-t .r{font-family:'Space Mono',monospace;font-weight:700}
.ct-t .r.urg{color:#c0392b}
.ct-b{width:100%;margin-top:10px;background:#16140f;border:none;border-radius:11px;padding:12px;
  font-family:Inter;font-size:11.5px;font-weight:900;letter-spacing:1.2px;color:#fff;cursor:pointer;
  transition:transform .14s}
.ct-b:active{transform:scale(.97)}
.ct-b:disabled{background:#cfc8ba;cursor:not-allowed}
.rep{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:12px;
  box-shadow:0 2px 12px rgba(22,20,15,.05)}
.rep-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.rep-l{font-size:9px;font-weight:900;letter-spacing:1.5px;color:#a09888}
.rep-v{font-family:'Space Mono',monospace;font-size:13px;font-weight:700}
.rep-b{height:5px;background:#f0ece2;border-radius:3px;overflow:hidden}
.rep-f{height:100%;border-radius:3px;transition:width .5s,background .5s}
.rep-d{font-size:10px;color:#a09888;margin-top:6px;line-height:1.4}

/* ═══ ÉVÉNEMENTS ═══ */
.ev{background:#fff;border-radius:16px;padding:15px;margin-bottom:11px;position:relative;overflow:hidden;
  box-shadow:0 4px 20px rgba(22,20,15,.1);animation:evIn .5s cubic-bezier(.2,.9,.3,1.2)}
@keyframes evIn{from{opacity:0;transform:scale(.94) translateY(-8px)}to{opacity:1;transform:scale(1) translateY(0)}}
.ev.bad{border:1.5px solid #fca5a5;background:#fffafa}
.ev.good{border:1.5px solid #86efac;background:#fafffb}
.ev.warn{border:1.5px solid #fcd34d;background:#fffdf7}
.ev-h{display:flex;align-items:flex-start;gap:11px;margin-bottom:11px}
.ev-e{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:22px;flex-shrink:0;background:#f4f1ea}
.ev-i{flex:1;min-width:0}
.ev-t{font-family:'Playfair Display',serif;font-weight:900;font-size:15px;line-height:1.2}
.ev-x{font-size:11.5px;color:#8a8278;margin-top:4px;line-height:1.5}
.ev-c{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;color:#c0392b;flex-shrink:0}
.ev-b{display:flex;gap:8px;margin-top:4px}
.ev-btn{flex:1;border:none;border-radius:11px;padding:12px 10px;font-family:Inter;font-size:11px;
  font-weight:900;letter-spacing:.8px;cursor:pointer;transition:transform .14s}
.ev-btn:active{transform:scale(.96)}
.ev-btn:disabled{opacity:.45;cursor:not-allowed}
.ev-btn.ok{background:#16140f;color:#fff}
.ev-btn.go{background:#16a34a;color:#fff;box-shadow:0 5px 16px rgba(22,163,74,.25)}
.ev-btn.no{background:#f4f1ea;color:#8a8278;flex:0 0 88px}
/* bandeau d'effet en cours */
.eff{display:flex;align-items:center;gap:9px;background:#fff8f0;border:1.5px solid #fcd9a8;
  border-radius:12px;padding:9px 12px;margin-bottom:9px}
.eff.red{background:#fef2f2;border-color:#fca5a5}
.eff-e{font-size:16px;flex-shrink:0}
.eff-t{flex:1;font-size:11px;font-weight:700;color:#92400e;line-height:1.35}
.eff.red .eff-t{color:#b91c1c}
.eff-v{font-family:'Space Mono',monospace;font-size:11.5px;font-weight:700;color:#92400e;flex-shrink:0}
.eff.red .eff-v{color:#b91c1c}

/* ═══ NAVIRES DISPUTÉS ═══ */
.dsp{position:relative;background:linear-gradient(160deg,#1a1712,#0f0d0a);color:#fff;border-radius:18px;
  padding:16px;margin-bottom:11px;overflow:hidden;
  box-shadow:0 10px 34px rgba(22,20,15,.3);animation:dspIn .5s cubic-bezier(.2,.9,.3,1.2)}
@keyframes dspIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.dsp::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 80% 0%,rgba(255,157,46,.16),transparent 60%)}
.dsp-tag{position:absolute;top:0;right:0;background:#c0392b;color:#fff;font-size:8px;font-weight:900;
  letter-spacing:1px;padding:4px 10px;border-radius:0 18px 0 10px}
.dsp-h{position:relative;z-index:2;display:flex;align-items:flex-start;gap:11px;margin-bottom:12px}
.dsp-e{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  font-size:23px;flex-shrink:0;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}
.dsp-i{flex:1;min-width:0}
.dsp-cl{font-family:'Playfair Display',serif;font-weight:900;font-size:15px;line-height:1.2}
.dsp-ob{font-size:11px;color:rgba(255,255,255,.5);margin-top:3px}
.dsp-money{position:relative;z-index:2;display:flex;gap:8px;margin-bottom:12px}
.dsp-m{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
  border-radius:11px;padding:9px 11px}
.dsp-m-l{font-size:8px;font-weight:900;letter-spacing:.8px;color:rgba(255,255,255,.4)}
.dsp-m-v{font-family:'Space Mono',monospace;font-size:14px;font-weight:700;margin-top:2px;color:#4ade80}
.dsp-m-v.t{color:#ffcf3f}
.dsp-b{position:relative;z-index:2;width:100%;background:linear-gradient(135deg,#ff6b00,#ff2d7c);
  border:none;border-radius:12px;padding:14px;font-family:Inter;font-size:12px;font-weight:900;
  letter-spacing:1.3px;color:#fff;cursor:pointer;transition:transform .14s;
  box-shadow:0 8px 24px rgba(255,45,124,.32);animation:dspPulse 2s ease-in-out infinite}
@keyframes dspPulse{0%,100%{box-shadow:0 8px 24px rgba(255,45,124,.32)}50%{box-shadow:0 8px 34px rgba(255,45,124,.55)}}
.dsp-b:active{transform:scale(.97)}
.dsp-b:disabled{background:#3a3630;box-shadow:none;animation:none;color:rgba(255,255,255,.35);cursor:not-allowed}

/* historique */

.hst-r{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #f4f1ea}
.hst-r:last-child{border-bottom:none}
.hst-r.moi{background:#fdf6e3;margin:0 -14px;padding:11px 14px;border-radius:8px}
.hst-e{font-size:18px;flex-shrink:0}
.hst-i{flex:1;min-width:0}
.hst-w{font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hst-d{font-size:9.5px;color:#a09888;margin-top:1px}
.hst-v{font-family:'Space Mono',monospace;font-size:11.5px;font-weight:700;color:#16a34a;flex-shrink:0}

/* pastille sur l'onglet */
.nv{position:relative}
.nv .dot{position:absolute;top:3px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;
  background:#c0392b;box-shadow:0 0 0 2px #fff;animation:dotP 1.4s ease-in-out infinite}
@keyframes dotP{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.25);opacity:.75}}

/* ═══ DOCKERS VIVANTS ═══ */
.dk{min-width:104px;padding:12px 10px}
.dk-av{position:relative}
.dk-nv{position:absolute;bottom:-2px;right:-2px;width:17px;height:17px;border-radius:50%;
  background:#16140f;color:#ffcf3f;font-size:9px;font-weight:900;display:flex;
  align-items:center;justify-content:center;border:2px solid #fff}
.dk-hm{font-size:14px;margin-top:5px;line-height:1}
.dk-fb{height:4px;background:#f0ece2;border-radius:3px;overflow:hidden;margin-top:7px}
.dk-ff{height:100%;border-radius:3px;transition:width .5s,background .5s}
.dk-fl{font-size:8px;font-weight:800;color:#a09888;margin-top:4px;letter-spacing:.3px}
.dk-vt{font-family:'Space Mono',monospace;font-size:9px;font-weight:700;color:#16a34a;margin-top:3px}
.dk-vt.low{color:#c0392b}
.dk.tired{background:#fffaf5}
.dk.dead{background:#fff5f5;border:1px solid #fca5a5}

/* bandeau fatigue de l'équipe */
.eqb{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:12px 14px;
  margin-bottom:10px;box-shadow:0 2px 12px rgba(22,20,15,.05)}
.eqb-i{flex:1;min-width:0}
.eqb-l{font-size:9px;font-weight:900;letter-spacing:1.2px;color:#a09888;margin-bottom:5px}
.eqb-b{height:5px;background:#f0ece2;border-radius:3px;overflow:hidden}
.eqb-f{height:100%;border-radius:3px;transition:width .5s,background .5s}
.eqb-d{font-size:10px;color:#8a8278;margin-top:5px;line-height:1.4}
.eqb-btn{background:#16140f;border:none;border-radius:11px;padding:11px 15px;color:#fff;
  font-family:Inter;font-size:10.5px;font-weight:900;letter-spacing:.6px;cursor:pointer;
  flex-shrink:0;transition:transform .14s;white-space:nowrap}
.eqb-btn:active{transform:scale(.94)}
.eqb-btn:disabled{background:#cfc8ba;cursor:not-allowed}
.eqb-btn small{display:block;font-family:'Space Mono',monospace;font-size:9px;opacity:.7;margin-top:2px}

/* la phrase du docker */
.dk-say{position:relative;background:#16140f;color:#fff;border-radius:12px;padding:10px 13px;
  margin-bottom:10px;font-size:11.5px;line-height:1.45;font-style:italic}
.dk-say b{font-style:normal;color:#ffcf3f;font-weight:800}

/* ═══ PROGRESSION ═══ */
.buy.lock{opacity:.55;background:#faf8f3}
.buy.lock .buy-av{filter:grayscale(1) opacity(.6)}
.buy-lk{background:#eae5da;border:none;border-radius:11px;padding:11px 14px;color:#8a8278;

.cap{display:flex;align-items:center;gap:10px;background:#16140f;color:#fff;border-radius:14px;
  padding:12px 14px;margin-bottom:11px}
.cap-i{flex:1}
.cap-l{font-size:9px;font-weight:900;letter-spacing:1.2px;color:rgba(255,255,255,.45)}
.cap-v{font-family:'Space Mono',monospace;font-size:15px;font-weight:700;margin-top:2px}
.cap-b{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:10px;
  padding:10px 14px;color:#fff;font-family:'Space Mono',monospace;font-size:11px;font-weight:700;
  cursor:pointer;flex-shrink:0;transition:transform .14s}
.cap-b:active{transform:scale(.94)}
.cap-b:disabled{opacity:.35;cursor:not-allowed}
/* formation */
.frm{display:flex;gap:2px;margin-top:6px;justify-content:center}
.frm i{width:5px;height:5px;border-radius:1px;background:#e8e2d6;font-style:normal}

.dk-frm:disabled{opacity:.4;cursor:not-allowed}

.bt{position:relative;background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;

/* ── SONS (générés en JS, aucun fichier) ── */
var AC = null;
var sonOn = true;
try{ sonOn = localStorage.getItem('bd_son') !== '0'; }catch(e){}

function audio(){
  if(!AC){
    try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ return null; }
  }
  if(AC.state === 'suspended') AC.resume();
  return AC;
}

/* une note : fréquence, durée, forme, volume */
function note(f, d, type, vol, glide){
  if(!sonOn) return;
  var a = audio(); if(!a) return;
  try{
    var o = a.createOscillator();
    var g = a.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, a.currentTime);
    if(glide) o.frequency.exponentialRampToValueAtTime(glide, a.currentTime + d);
    g.gain.setValueAtTime(0, a.currentTime);
    g.gain.linearRampToValueAtTime(vol || 0.14, a.currentTime + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + d);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime + d + 0.02);
  }catch(e){}
}

var SFX = {
  clic:    function(){ note(680, .05, 'triangle', .06); },
  encaisse:function(){                       /* pièces */
    note(880, .08, 'triangle', .11);

    setTimeout(function(){ note(1560, .13, 'triangle', .09); }, 115);
  },
  gros:    function(){                       /* gros gain */
    [660, 880, 1100, 1320].forEach(function(f,i){
      setTimeout(function(){ note(f, .16, 'triangle', .10); }, i*70);
    });
  },
  niveau:  function(){                       /* montée de niveau */
    [523, 659, 784, 1047, 1319].forEach(function(f,i){
      setTimeout(function(){ note(f, .34, 'triangle', .13); }, i*95);
    });
  },
  erreur:  function(){ note(200, .18, 'sawtooth', .07, 130); },
  alerte:  function(){                       /* navire disputé / douane */
    note(520, .11, 'square', .06);
    setTimeout(function(){ note(400, .16, 'square', .06); }, 130);
  },
  build:   function(){                       /* construction */
    note(300, .1, 'square', .07);
    setTimeout(function(){ note(450, .12, 'square', .07); }, 90);
    setTimeout(function(){ note(600, .18, 'triangle', .09); }, 190);
  },

/* ── LES PIÈCES QUI VOLENT ── */
function pieces(x, y, n, gros){
  var cible = document.querySelector('.pill');
  if(!cible) return;
  var r = cible.getBoundingClientRect();
  var cx = r.left + r.width/2, cy = r.top + r.height/2;

  for(var i = 0; i < n; i++){
    (function(i){
      var e = document.createElement('div');
      e.className = 'coin';
      e.textContent = gros ? '💰' : '🪙';
      var ox = x + (Math.random()*50 - 25);
      var oy = y + (Math.random()*24 - 12);
      e.style.left = ox + 'px';
      e.style.top  = oy + 'px';
      e.style.opacity = '0';
      document.body.appendChild(e);

      setTimeout(function(){
        e.style.transition = 'transform .68s cubic-bezier(.35,.05,.25,1), opacity .68s';
        e.style.opacity = '1';
        e.style.transform = 'translate(' + (cx - ox) + 'px,' + (cy - oy) + 'px) scale(.5)';
        setTimeout(function(){
          e.style.opacity = '0';
          setTimeout(function(){ e.remove(); }, 200);
        }, 560);
      }, i * 55);
    })(i);
  }

  /* le porte-monnaie encaisse */
  setTimeout(function(){
    cible.classList.remove('cash'); void cible.offsetWidth; cible.classList.add('cash');
  }, n * 55 + 480);
}

/* ── LE COMPTEUR QUI DÉFILE ── */
function defile(id, de, vers, duree){
  var e = $(id); if(!e) return;
  if(de === vers){ e.textContent = fmt(vers); return; }
  var t0 = performance.now();
  duree = duree || 700;
  (function pas(t){
    var p = Math.min(1, (t - t0) / duree);
    var q = 1 - Math.pow(1 - p, 3);   /* ralentit à la fin */
    e.textContent = fmt(de + (vers - de) * q);
    if(p < 1) requestAnimationFrame(pas);
  })(t0);
}

/* ── L'ONDULATION AU CLIC ── */
function ripple(btn, ev){
  if(!btn || !ev) return;
  var r = btn.getBoundingClientRect();
  var d = Math.max(r.width, r.height);
  var e = document.createElement('span');
  e.className = 'ripple';
  e.style.width = e.style.height = d + 'px';
  e.style.left = (ev.clientX - r.left - d/2) + 'px';

/* ── LES CONFETTIS ── */
function confettis(n){
  var C = ['#ffcf3f','#ff6b00','#ff2d7c','#4ade80','#0ea5e9','#fff'];
  for(var i = 0; i < n; i++){
    (function(){
      var e = document.createElement('div');
      e.className = 'conf';
      e.style.background = C[Math.floor(Math.random()*C.length)];
      e.style.left = (Math.random() * window.innerWidth) + 'px';
      e.style.top  = '-16px';
      e.style.opacity = '1';
      document.body.appendChild(e);

      var dx = (Math.random() * 220 - 110);
      var dy = window.innerHeight + 60;
      var rot = Math.random() * 900 - 450;
      var dur = 1700 + Math.random() * 1400;

      setTimeout(function(){
        e.style.transition = 'transform ' + dur + 'ms linear, opacity ' + dur + 'ms';
        e.style.transform = 'translate(' + dx + 'px,' + dy + 'px) rotate(' + rot + 'deg)';
        e.style.opacity = '0';
        setTimeout(function(){ e.remove(); }, dur + 100);
      }, Math.random() * 350);
    })();
  }
}

/* ═════════ TICK LÉGER ═════════
   Met à jour les compteurs SANS reconstruire le HTML.
   (reconstruire toutes les secondes faisait clignoter la page) */
function tick(){
  if(!D) return;
  var nav=(D.navires)||[];
  var besoinRedraw=false;

  nav.forEach(function(nv){
    var rest=restant(nv.fini_le), ok=rest<=0;
    var chr=$('chr'+nv.id);

    if(chr){
      /* déchargement en cours */
      if(ok){ besoinRedraw=true; return; }   /* il vient de finir → il faut redessiner */
      chr.textContent=mmss(rest);
      var tot=(nv.duree_totale||60)*1000;
      var pgf=$('pgf'+nv.id);
      if(pgf) pgf.style.width=Math.min(100,Math.max(0,100*(1-rest/tot)))+'%';
      return;
    }

    /* déjà déchargé : le périssable pourrit */
    if(ok && nv.peri_sec>0){
      var f=fraicheur(nv), val=valeurLive(nv);
      var frf=$('frf'+nv.id), frt=$('frt'+nv.id), vl=$('val'+nv.id), bt=$('btn'+nv.id);
      var fc=f>.6?'#16a34a':(f>.3?'#f59e0b':'#dc2626');
      if(frf){ frf.style.width=(f*100)+'%'; frf.style.background=fc; }
      if(frt){ frt.style.color=fc; frt.textContent=(f<=0?'PERDU':Math.round(f*100)+'% FRAIS'); }
      if(vl){ vl.innerHTML=fmt(val)+' &euro;<small>VALEUR</small>'; vl.style.color=(f<=0?'#c0392b':'#16140f'); }
      if(bt && !busy){
        if(f<=0 && bt.className.indexOf('bad')<0){ besoinRedraw=true; }        /* vient de pourrir */
        else if(f>0) bt.innerHTML='COLLECTER '+fmt(val)+' &euro;';
      }
    }
  });

  /* les chronos des effets en cours */
  var j=D.joueur;
  if(j){
    document.querySelectorAll('.eff-v').forEach(function(e){
      var t=e.getAttribute('data-t');
      if(t) e.textContent=mmss(restant(t));
    });
  }

  /* les chronos des contrats */
  ((D.contrats_encours)||[]).forEach(function(k){
    var e=$('ctc'+k.id);
    if(e){
      var rest=restant(k.expire_le);
      e.textContent=mmss(rest);
      e.className='r'+(rest<3600000?' urg':'');
    }
  });

  /* les chronos des événements */
  ((D.evenements)||[]).forEach(function(ev){
    if(!ev.expire_le) return;
    var e=$('evc'+ev.id);
    if(e) e.textContent=mmss(restant(ev.expire_le));
  });

  /* les chronos des navires disputés */
  if(DSP && $('pgLb').classList.contains('on')){
    ((DSP.ouverts)||[]).forEach(function(d){
      var e=$('dspc'+d.id);
      if(e) e.textContent=mmss(restant(d.expire_le));
    });
  }

  /* un navire a fini / une cargaison a pourri → là on redessine (rarement) */
  if(besoinRedraw && !busy){
    rendNavires();
    rendEquipe();
  }
}

  var argAvant = (D && D.joueur) ? D.joueur.argent : 0;
  var nivAvant = (D && D.joueur) ? D.joueur.niveau : 1;

  document.querySelectorAll('.coll').forEach(function(b){ b.disabled=true; });
  try{
    const {data,error}=await sb.rpc('collecter',{p_navire:id});
    if(error) throw error;
    var g=data.gain||0;

    if(data.douane){
      vib([90,50,90,50,140]);
      SFX.alerte();
      toast(data.message,true);
    }
    else if(g>0){
      vib([25,15,45]);
      var gros = g >= 2000;
      if(gros) SFX.gros(); else SFX.encaisse();

      if(ev){
        var f=document.createElement('div');
        f.className='fly'; f.textContent='+'+fmt(g)+' \u20AC';
        f.style.left=(ev.clientX-30)+'px'; f.style.top=(ev.clientY-14)+'px';
        document.body.appendChild(f);
        requestAnimationFrame(function(){ f.style.transform='translateY(-70px)'; f.style.opacity='0'; });
        setTimeout(function(){ f.remove(); },950);

        pieces(ev.clientX, ev.clientY, gros ? 7 : 4, gros);
      }
      toast('<span class="g">+'+fmt(g)+' &euro;</span> encaisses');
    } else {
      vib(40);
      SFX.perdu();
      toast(data.message||'Cargaison perdue.');
    }

    /* un contrat vient-il d'etre rempli ? */
    try{
      var r = data.contrats && data.contrats.reussis;
      if(r && r.length){
        setTimeout(function(){
          vib([50,30,50,30,90]);
          SFX.gros();
          confettis(20);
          toast('&#127942; Contrat rempli &mdash; <span class="g">+'+fmt(r[0].recompense)+' &euro;</span>');
        }, 1400);
      }
    }catch(e){}

    await charger();

    /* le compteur qui defile */
    if(D && D.joueur) defile('argV', argAvant, D.joueur.argent, 800);

    /* MONTEE DE NIVEAU */
    if(D && D.joueur && D.joueur.niveau > nivAvant){
      setTimeout(function(){ montreLvUp(D.joueur.niveau); }, 900);
    }
  }catch(e){
    console.warn(e);
    SFX.erreur();
    toast(msgErr(e),true);
    busy=false; rendNavires(); return;
  }
  busy=false;
}
async function embaucher(code){
  if(busy) return;
  busy=true;
  try{
    const {data,error}=await sb.rpc('embaucher',{p_code:code});
    if(error) throw error;
    vib([30,20,60]);
    toast('&#129309; '+data.nom+' rejoint l\'equipe !');
    await charger(); bump('argV');
  }catch(e){ console.warn(e); toast(msgErr(e),true); vib([50,30,50]); }
  busy=false;
}
async function agrandir(){
  if(busy) return;
  busy=true;
  try{
    const {data,error}=await sb.rpc('agrandir_quai');
    if(error) throw error;
    vib([30,20,60]);
    toast('&#127959;&#65039; Quai agrandi - '+data.places+' places');
    await charger(); bump('argV');
  }catch(e){ console.warn(e); toast(msgErr(e),true); }
  busy=false;
}
function msgErr(e){
  var m=((e&&e.message)||'').toLowerCase();
  if(m.indexOf('pas assez')>=0) return 'Pas assez d\'argent.';
  if(m.indexOf('dechargement en cours')>=0||m.indexOf('déchargement en cours')>=0) return 'Le dechargement n\'est pas fini.';
  if(m.indexOf('deja dans ton')>=0||m.indexOf('déjà dans ton')>=0) return 'Il travaille deja pour toi.';
  if(m.indexOf('maximum')>=0) return 'Ton quai est deja au maximum.';
  if(m.indexOf('trop de contrats')>=0) return 'Tu as deja 3 contrats en cours.';
  if(m.indexOf('trop tard')>=0) return 'Trop tard, le navire est reparti.';
  if(m.indexOf('quai plein')>=0) return 'Ton quai est plein.';
  if(m.indexOf('deja pris')>=0||m.indexOf('déjà pris')>=0) return 'Quelqu\'un l\'a pris avant toi.';
  if(m.indexOf('niveau insuffisant')>=0) return 'Ton niveau est trop bas.';
  if(m.indexOf('ils sont frais')>=0) return 'Ton equipe est deja en forme.';
  if(m.indexOf('aucun docker')>=0) return 'Tu n\'as personne a payer.';
  if(m.indexOf('equipe pleine')>=0||m.indexOf('équipe pleine')>=0) return 'Ton equipe est pleine. Agrandis-la.';
  if(m.indexOf('niveau')>=0 && m.indexOf('requis')>=0) return 'Ton niveau est trop bas pour lui.';
  if(m.indexOf('formation terminee')>=0||m.indexOf('formation terminée')>=0) return 'Il est deja au maximum.';
  if(m.indexOf('travaille pas pour toi')>=0) return 'Il ne fait pas partie de ton equipe.';
  if(m.indexOf('deja au maximum')>=0||m.indexOf('déjà au maximum')>=0) return 'Ce batiment est deja au maximum.';
  if(m.indexOf('batiment inconnu')>=0||m.indexOf('bâtiment inconnu')>=0) return 'Batiment inconnu.';
  if(m.indexOf('port ferm')>=0) return 'Ton port est ferme par la douane.';
  if(m.indexOf('evenement introuvable')>=0||m.indexOf('événement introuvable')>=0) return 'Cet evenement n\'existe plus.';
  if(m.indexOf('contrat expir')>=0) return 'Cette offre a expire.';
  if(m.indexOf('contrat introuvable')>=0) return 'Cette offre n\'existe plus.';
  if(m.indexOf('introuvable')>=0) return 'Ce navire n\'est plus la.';
  if(m.indexOf('non connect')>=0){ location.href='index.html'; return 'Reconnecte-toi.'; }
  if(m.indexOf('failed to fetch')>=0||m.indexOf('network')>=0) return 'Connexion perdue.';
  return 'Une erreur est survenue.';
}

async function charger(){
  try{
    const {data,error}=await sb.rpc('mon_port');
    if(error) throw error;
    D=data;
    (D.navires||[]).forEach(function(nv){
      var f=fraicheur(nv);
      nv.__vp = f>0 ? Math.round(nv.valeur/f) : nv.valeur;   // valeur pleine (avant pourriture)
    });
    rendTop(); dessinePort(); rendBloc(); rendNavires(); rendEquipe(); rendJournal(); rendUp(); rendBatiments(); rendRep(); rendContrats(); rendEffets(); rendEvents(); majPastille();
  }catch(e){ console.warn(e); toast(msgErr(e),true); }
}

function nav(i){
  [0,1,2,3].forEach(function(j){ var b=$('nv'+j); if(b) b.classList.toggle('on', i===j); });
  $('pgPort').classList.toggle('on', i===0);
  $('pgCt').classList.toggle('on',   i===1);
  $('pgUp').classList.toggle('on',   i===2);
  $('pgLb').classList.toggle('on',   i===3);
  if(i===3){ rendLb(); chargerDisputes(); }
  window.scrollTo({top:0,behavior:'smooth'});
  vib(12);
}

(async function(){
  if(!sb){ toast('Connexion impossible.',true); return; }
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(!session){ location.href='index.html'; return; }
  }catch(e){ location.href='index.html'; return; }
  await charger();
  /* tick leger : met a jour les compteurs sans reconstruire (plus de clignotement) */
  setInterval(function(){ if(D && !busy) tick(); }, 1000);

  /* les navires disputes vont vite : on rafraichit souvent quand l'onglet est ouvert */
  setInterval(function(){
    if(!busy && $('pgLb') && $('pgLb').classList.contains('on')) chargerDisputes();
  }, 12000);
  setInterval(function(){ if(!busy) charger(); }, 45000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden && !busy) charger(); });
})();
</script>
