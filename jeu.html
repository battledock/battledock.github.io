<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Battle Dock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:'Nunito',sans-serif;color:#3a2010}
.app{height:100dvh;display:flex;flex-direction:column;transition:background .4s}

/* Topbar */
.topbar{display:flex;align-items:center;gap:8px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));flex-shrink:0}
.tb-av{width:30px;height:30px;border-radius:9px;overflow:hidden;border:2px solid rgba(0,0,0,.06)}
.tb-av img{width:100%;height:100%;object-fit:cover;display:block}
.tb-spacer{flex:1}
.tb-pills{display:flex;gap:4px}
.tb-pill{font-size:.48rem;font-weight:900;padding:4px 10px;border-radius:8px}

/* Mini card switcher */
.switcher{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex-shrink:0}
.switcher::-webkit-scrollbar{display:none}
.mini-q{flex-shrink:0;width:130px;border-radius:14px;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s;border:2.5px solid transparent;position:relative}
.mini-q:active{transform:scale(.96)}
.mini-q.on{border-color:currentColor;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.mini-q .mq-header{height:40px;display:flex;align-items:flex-end;padding:5px 8px}
.mini-q .mq-badge{font-size:.32rem;font-weight:900;color:#fff;background:rgba(0,0,0,.25);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border-radius:100px;padding:2px 7px;letter-spacing:1px;text-transform:uppercase}
.mini-q .mq-body{background:#fff;padding:7px 10px}
.mini-q .mq-name{font-size:.58rem;font-weight:900}
.mini-q .mq-stats{display:flex;gap:6px;margin-top:2px}
.mini-q .mq-s{font-size:.35rem;font-weight:800;opacity:.3}
.mini-q .mq-s strong{opacity:.6}
.mini-q .mq-notif{position:absolute;top:4px;right:4px;min-width:16px;height:16px;border-radius:50%;background:#e04040;color:#fff;font-size:.35rem;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* Scroll content */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:70px}
.scroll::-webkit-scrollbar{display:none}

/* Hero */
.hero{padding:0 20px 14px}
.hero-badge{display:inline-block;font-size:.42rem;font-weight:900;letter-spacing:2px;text-transform:uppercase;padding:5px 14px;border-radius:100px;color:#fff;margin-bottom:8px}
.hero-name{font-family:'Oswald',sans-serif;font-size:2rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;line-height:.85;margin-bottom:6px}
.hero-desc{font-size:.55rem;font-weight:700;opacity:.25;line-height:1.4}
.hero-bonuses{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.hero-bon{font-size:.42rem;font-weight:900;padding:4px 10px;border-radius:8px}

/* Section */
.sec{padding:0 20px;margin-bottom:14px}
.sec-title{font-size:.48rem;font-weight:900;opacity:.12;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}

/* Stats */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.stat{text-align:center;padding:8px 4px;border-radius:10px}
.stat-emoji{font-size:.8rem}
.stat-val{font-family:'Oswald',sans-serif;font-size:.85rem;font-weight:600;margin-top:1px}
.stat-label{font-size:.3rem;font-weight:900;opacity:.15;letter-spacing:1px;text-transform:uppercase;margin-top:1px}
.stat-bar{width:80%;height:3px;margin:4px auto 0;border-radius:2px;overflow:hidden}
.stat-fill{height:100%;border-radius:2px;transition:width .5s}

/* Event */
.event-card{background:#fff;border:2px solid rgba(0,0,0,.04);border-radius:16px;padding:14px;position:relative;overflow:hidden}
.event-urgent{position:absolute;top:0;right:0;font-size:.36rem;font-weight:900;background:#e04040;color:#fff;padding:3px 10px;border-radius:0 0 0 8px;letter-spacing:1px;text-transform:uppercase}
.event-emoji{font-size:1.3rem;margin-bottom:6px}
.event-title{font-size:.72rem;font-weight:900;margin-bottom:3px}
.event-desc{font-size:.52rem;font-weight:700;opacity:.3;line-height:1.4;margin-bottom:10px}
.event-choices{display:flex;flex-direction:column;gap:5px}
.event-choice{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;cursor:pointer;-webkit-tap-highlight-color:transparent;border:1.5px solid;transition:background .15s}
.event-choice:active{transform:scale(.98)}
.event-choice.a{background:rgba(34,197,94,.04);border-color:rgba(34,197,94,.1)}
.event-choice.b{background:rgba(220,60,60,.03);border-color:rgba(220,60,60,.05)}
.choice-icon{font-size:.9rem;flex-shrink:0}
.choice-label{font-size:.58rem;font-weight:900;flex:1}
.choice-effects{font-size:.38rem;font-weight:700;opacity:.3}
.choice-cost{font-size:.45rem;font-weight:900;flex-shrink:0}
.event-timer{text-align:center;font-size:.4rem;font-weight:800;opacity:.12;margin-top:6px}
.no-events{text-align:center;padding:16px;font-size:.55rem;font-weight:700;opacity:.15}

/* Tax */
.tax-card{background:#fff;border-radius:14px;padding:12px 14px;border:1px solid rgba(0,0,0,.03)}
.tax-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.tax-title{font-size:.65rem;font-weight:900}
.tax-val{font-family:'Oswald',sans-serif;font-size:.9rem;font-weight:600}
.tax-slider{-webkit-appearance:none;width:100%;height:5px;border-radius:3px;outline:none;margin-bottom:8px}
.tax-slider::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.12);cursor:pointer}
.tax-effects{display:flex;gap:6px}
.tax-effect{flex:1;text-align:center;font-size:.42rem;font-weight:800;line-height:1.3;padding:5px;border-radius:6px}
.tax-effect.good{background:rgba(34,197,94,.05);color:#1a8a48}
.tax-effect.bad{background:rgba(220,60,60,.04);color:#b03030}

/* Demands */
.demand{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:9px 10px;margin-bottom:5px;border:1px solid rgba(0,0,0,.03)}
.demand-emoji{font-size:1rem;flex-shrink:0}
.demand-info{flex:1}
.demand-title{font-size:.58rem;font-weight:900}
.demand-sub{font-size:.4rem;font-weight:700;opacity:.2;margin-top:1px}
.demand-urg{display:flex;gap:2px;margin-top:3px}
.demand-dot{width:14px;height:2.5px;border-radius:1px}
.demand-btn{font-size:.4rem;font-weight:900;padding:5px 10px;border-radius:6px;flex-shrink:0;cursor:pointer;border:none;font-family:inherit;-webkit-tap-highlight-color:transparent}
.demand-btn:active{transform:scale(.95)}
.no-demands{text-align:center;padding:12px;font-size:.55rem;font-weight:700;opacity:.15}

/* Buildings */
.bld{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:12px;margin-bottom:5px;cursor:pointer;-webkit-tap-highlight-color:transparent;border:1px solid rgba(0,0,0,.03);transition:transform .1s}
.bld:active{transform:scale(.98)}
.bld-iw{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
.bld-center{flex:1}
.bld-name{font-size:.6rem;font-weight:900}
.bld-effect{font-size:.38rem;font-weight:700;opacity:.18;margin-top:1px}
.bld-right{text-align:right;flex-shrink:0}
.bld-dots{display:flex;gap:2px;justify-content:flex-end;margin-bottom:3px}
.bld-d{width:5px;height:5px;border-radius:1.5px}
.bld-cost{font-size:.4rem;font-weight:900;border-radius:5px;padding:3px 7px}

/* Neighbors */
.neighbors{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:4px}
.neighbors::-webkit-scrollbar{display:none}
.nb{flex-shrink:0;width:110px;background:#fff;border-radius:12px;padding:8px;text-align:center;border:1px solid rgba(0,0,0,.03)}
.nb-color{width:100%;height:3px;border-radius:2px;margin-bottom:6px}
.nb-name{font-size:.55rem;font-weight:900}
.nb-owner{font-size:.38rem;font-weight:800;opacity:.15;margin-top:1px}
.nb-alert{font-size:.38rem;font-weight:900;margin-top:4px;padding:2px 7px;border-radius:5px;display:inline-block}
.nb-alert.danger{background:rgba(220,60,60,.05);color:#c03030}
.nb-alert.ok{background:rgba(34,197,94,.05);color:#1a8a48}

/* Collect */
.collect-area{padding:0 20px 14px}
.collect-btn{width:100%;padding:14px;font-family:inherit;font-size:.82rem;font-weight:900;border:none;border-radius:12px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .1s;position:relative;overflow:hidden;color:#fff}
.collect-btn:active{transform:scale(.98)}
.collect-btn:disabled{opacity:.4}
.collect-btn .shimmer{position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);animation:shimmer 3s infinite}
@keyframes shimmer{0%{left:-100%}100%{left:200%}}
.collect-sub{text-align:center;font-size:.4rem;font-weight:800;opacity:.1;margin-top:5px}

/* Bottom nav */
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid rgba(0,0,0,.04);display:flex;padding:6px 0;padding-bottom:calc(6px + env(safe-area-inset-bottom));z-index:10}
.nav-item{flex:1;text-align:center;padding:4px 0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.nav-icon{font-size:.9rem}
.nav-label{font-size:.32rem;font-weight:900;letter-spacing:.5px;opacity:.2;margin-top:1px}
.nav-item.on .nav-label{opacity:1}

/* Toast */
.toast{position:fixed;top:calc(20px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-100px);background:#fff;border-radius:12px;padding:10px 18px;font-size:.65rem;font-weight:900;box-shadow:0 4px 20px rgba(0,0,0,.08);z-index:20;transition:transform .3s;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}

/* Loading */
.loading{height:100%;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;opacity:.2}

/* Quartier color themes applied dynamically */
</style>
</head>
<body>
<div class="app" id="app">
  <div class="loading" id="loadingScreen">Chargement...</div>
</div>
<div class="toast" id="toast"></div>

<div class="bottom-bar">
  <div class="nav-item on"><div class="nav-icon">🏘️</div><div class="nav-label">Quartier</div></div>
  <div class="nav-item"><div class="nav-icon">🗺️</div><div class="nav-label">Carte</div></div>
  <div class="nav-item"><div class="nav-icon">⚔️</div><div class="nav-label">Attaque</div></div>
  <div class="nav-item"><div class="nav-icon">🏆</div><div class="nav-label">Classement</div></div>
  <div class="nav-item"><div class="nav-icon">👤</div><div class="nav-label">Profil</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL='https://snqynahqxqjmdigbmiag.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNucXluYWhxeHFqbWRpZ2JtaWFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxNzQyMTksImV4cCI6MjA5OTc1MDIxOX0.eLMtvtEtvrfSSSi7-SCgo_wGMLWbhWpLSLM49QwpqY8';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);

// Quartier theme colors
const themes={
  'Historique':{bg:'#faf4ee',text:'#3a2010',accent:'#c07840',accentLight:'rgba(192,120,64,',statBg:'rgba(192,120,64,.04)',btnBg:'linear-gradient(135deg,#c07840,#a06020)'},
  'Culturel':{bg:'#f4eefa',text:'#1e1030',accent:'#8050c0',accentLight:'rgba(128,80,192,',statBg:'rgba(128,80,192,.04)',btnBg:'linear-gradient(135deg,#8050c0,#603898)'},
  'Populaire':{bg:'#faf0ec',text:'#3a1810',accent:'#b05838',accentLight:'rgba(176,88,56,',statBg:'rgba(176,88,56,.04)',btnBg:'linear-gradient(135deg,#b05838,#903020)'},
  'Bord de mer':{bg:'#eef6fa',text:'#0e2830',accent:'#2898b0',accentLight:'rgba(40,152,176,',statBg:'rgba(40,152,176,.04)',btnBg:'linear-gradient(135deg,#2898b0,#186880)'},
  'Commercial':{bg:'#f0f2f6',text:'#1a2030',accent:'#606890',accentLight:'rgba(96,104,144,',statBg:'rgba(96,104,144,.04)',btnBg:'linear-gradient(135deg,#606890,#484e70)'},
  'Festif':{bg:'#f4eefa',text:'#1e1030',accent:'#8050c0',accentLight:'rgba(128,80,192,',statBg:'rgba(128,80,192,.04)',btnBg:'linear-gradient(135deg,#8050c0,#603898)'},
  'Central':{bg:'#f0f4ee',text:'#1a2818',accent:'#688850',accentLight:'rgba(104,136,80,',statBg:'rgba(104,136,80,.04)',btnBg:'linear-gradient(135deg,#688850,#506838)'},
  'Balnéaire':{bg:'#eef6fa',text:'#0e2830',accent:'#2898b0',accentLight:'rgba(40,152,176,',statBg:'rgba(40,152,176,.04)',btnBg:'linear-gradient(135deg,#2898b0,#186880)'},
  'Résidentiel':{bg:'#f6f2ee',text:'#2a2010',accent:'#a88040',accentLight:'rgba(168,128,64,',statBg:'rgba(168,128,64,.04)',btnBg:'linear-gradient(135deg,#a88040,#886828)'},
  'Maritime':{bg:'#eef2fa',text:'#102038',accent:'#3868a0',accentLight:'rgba(56,104,160,',statBg:'rgba(56,104,160,.04)',btnBg:'linear-gradient(135deg,#3868a0,#285080)'},
};

const buildingMeta={
  logements:{e:'🏠',ef:'+population · +satisfaction'},theatre:{e:'🎭',ef:'+culture · +réputation'},musee:{e:'🏛️',ef:'+tourisme · +culture'},caserne:{e:'🛡️',ef:'+sécurité · +défense'},
  concert:{e:'🎤',ef:'+satisfaction · +réputation'},galerie:{e:'🖼️',ef:'+culture · +tourisme'},bar:{e:'🍻',ef:'+or passif · +satisfaction'},streetart:{e:'🎨',ef:'+créativité · +propagande'},
  marche:{e:'🛒',ef:'+or passif · +population'},hammam:{e:'🛁',ef:'+satisfaction · +culture'},port:{e:'⚓',ef:'+revenus · +population'},plage:{e:'🏖️',ef:'+satisfaction · +tourisme'},
  guet:{e:'🔭',ef:'+défense · +sécurité'},poissons:{e:'🐟',ef:'+or passif · +satisfaction'},entrepot:{e:'📦',ef:'+commerce · +or'},bureaux:{e:'🏢',ef:'+infra · +or'},
  dock:{e:'🚢',ef:'+commerce · +infra'},scene:{e:'🎪',ef:'+satisfaction · +culture'},skatepark:{e:'🛹',ef:'+satisfaction'},gare:{e:'🚂',ef:'+mobilité · +population'},
  hotel:{e:'🏨',ef:'+tourisme · +or'},surf:{e:'🏄',ef:'+satisfaction · +tourisme'},restaurant:{e:'🍽️',ef:'+or · +satisfaction'},ecole:{e:'🏫',ef:'+population · +infra'},
  parc:{e:'🌳',ef:'+satisfaction · +population'},voilier:{e:'⛵',ef:'+tourisme · +satisfaction'},
};

const buildCosts=[0,150,280,450,700,1000]; // cost per level

let player=null, quartiers=[], activeQ=null, events=[], demands=[];

// Init
(async()=>{
  const{data:{session}}=await sb.auth.getSession();
  if(!session){window.location.href='index.html';return}

  const{data:p}=await sb.from('players').select('*').eq('id',session.user.id).maybeSingle();
  if(!p||!p.onboarding_done){window.location.href='profil.html';return}
  player=p;

  const{data:qs}=await sb.from('player_quartiers').select('*').eq('player_id',player.id);
  quartiers=qs||[];

  if(!quartiers.length){
    document.getElementById('app').innerHTML='<div class="loading" style="flex-direction:column;gap:12px;text-align:center;padding:20px"><div style="font-size:1.5rem">⚠️</div><div style="font-size:.7rem;font-weight:900;opacity:.4">Aucun quartier trouvé</div><div style="font-size:.55rem;opacity:.2">Erreur lors de la création du quartier.</div><button onclick="location.href=\'profil.html\'" style="margin-top:12px;padding:12px 24px;background:#1470a8;color:#fff;border:none;border-radius:10px;font-family:inherit;font-size:.75rem;font-weight:900;cursor:pointer">Réessayer</button></div>';
    return;
  }

  activeQ=quartiers[0];
  await loadQuartierData();
  render();
})();

async function loadQuartierData(){
  const{data:ev}=await sb.from('quartier_events').select('*').eq('quartier_id',activeQ.id).eq('resolved',false);
  events=ev||[];
  const{data:dm}=await sb.from('quartier_demands').select('*').eq('quartier_id',activeQ.id).eq('resolved',false);
  demands=dm||[];
}

function render(){
  const t=themes[activeQ.type_quartier]||themes['Historique'];
  const app=document.getElementById('app');
  app.style.background=t.bg;
  app.style.color=t.text;

  const notifCount=events.length+demands.length;

  let html=`
  <div class="topbar">
    <div class="tb-av"><img src="${player.avatar}" alt=""></div>
    <div class="tb-spacer"></div>
    <div class="tb-pills">
      <div class="tb-pill" style="background:${t.accentLight}.06);color:${t.accent}">💰 <strong>${player.or_total}</strong></div>
      <div class="tb-pill" style="background:rgba(0,0,0,.03);color:${t.text}80">⚡ <strong>${player.energie}</strong>/${player.energie_max}</div>
    </div>
  </div>`;

  // Switcher (if multiple quartiers)
  if(quartiers.length>1){
    html+=`<div class="switcher">`;
    quartiers.forEach(q=>{
      const isOn=q.id===activeQ.id;
      html+=`<div class="mini-q ${isOn?'on':''}" style="${isOn?'border-color:'+t.accent:''}" onclick="switchQ('${q.id}')">
        <div class="mq-header" style="background:${q.color_bg}"><div class="mq-badge">${q.type_quartier}</div></div>
        <div class="mq-body"><div class="mq-name">${q.nom}</div><div class="mq-stats"><div class="mq-s">👥 <strong>${q.population}</strong></div><div class="mq-s">😊 <strong>${q.satisfaction}%</strong></div></div></div>
      </div>`;
    });
    html+=`</div>`;
  }

  html+=`<div class="scroll">`;

  // Hero
  html+=`<div class="hero">
    <div class="hero-badge" style="background:${t.accent}">${activeQ.type_quartier}</div>
    <div class="hero-name">${activeQ.nom}</div>
    <div class="hero-bonuses">${activeQ.bonus_1?`<div class="hero-bon" style="background:${t.accentLight}.06);color:${t.accent}">${activeQ.bonus_1}</div>`:''}${activeQ.bonus_2?`<div class="hero-bon" style="background:${t.accentLight}.06);color:${t.accent}">${activeQ.bonus_2}</div>`:''}</div>
  </div>`;

  // Stats
  html+=`<div class="sec"><div class="stats-grid">
    ${statHTML('👥',activeQ.population>999?(activeQ.population/1000).toFixed(1)+'k':activeQ.population,'Pop.',activeQ.population/20,t)}
    ${statHTML('😊',activeQ.satisfaction+'%','Satisf.',activeQ.satisfaction,t)}
    ${statHTML('🛡️',activeQ.securite+'%','Sécu.',activeQ.securite,t)}
    ${statHTML('🏗️',activeQ.infra+'%','Infra',activeQ.infra,t)}
  </div></div>`;

  // Event
  html+=`<div class="sec"><div class="sec-title">⚠️ Événements</div>`;
  if(events.length){
    events.forEach(ev=>{
      html+=`<div class="event-card" style="margin-bottom:8px">
        <div class="event-urgent">Urgent</div>
        <div class="event-emoji">${ev.emoji}</div>
        <div class="event-title">${ev.title}</div>
        <div class="event-desc">${ev.description}</div>
        <div class="event-choices">
          <div class="event-choice a" onclick="resolveEvent('${ev.id}','a')"><div class="choice-icon">✅</div><div class="choice-label" style="color:#1a8a48">${ev.choice_a_label}</div><div class="choice-cost" style="color:${t.accent}">${ev.choice_a_cost>0?ev.choice_a_cost+' 💰':'Gratuit'}</div></div>
          <div class="event-choice b" onclick="resolveEvent('${ev.id}','b')"><div class="choice-icon">❌</div><div class="choice-label" style="color:#b03030">${ev.choice_b_label}</div><div class="choice-cost" style="opacity:.3">${ev.choice_b_cost>0?ev.choice_b_cost+' 💰':'Gratuit'}</div></div>
        </div>
      </div>`;
    });
  } else {
    html+=`<div class="no-events">Aucun événement pour le moment 🎉</div>`;
  }
  html+=`</div>`;

  // Tax
  html+=`<div class="sec"><div class="sec-title">💸 Imposition</div>
    <div class="tax-card">
      <div class="tax-top"><div class="tax-title">Taux d'imposition</div><div class="tax-val" style="color:${t.accent}" id="taxVal">${activeQ.tax_rate}%</div></div>
      <input type="range" class="tax-slider" min="0" max="40" value="${activeQ.tax_rate}" oninput="updateTaxUI(this.value)" onchange="saveTax(this.value)" style="background:linear-gradient(90deg,#e8e0d8,${t.accent})">
      <div class="tax-effects" id="taxEffects"></div>
    </div>
  </div>`;

  // Demands
  html+=`<div class="sec"><div class="sec-title">📢 Demandes</div>`;
  if(demands.length){
    demands.forEach(d=>{
      const urgColors=['#22c55e','#f0a040','#e04040'];
      html+=`<div class="demand">
        <div class="demand-emoji">${d.emoji}</div>
        <div class="demand-info"><div class="demand-title">${d.title}</div><div class="demand-sub">Ignorer = ${d.ignore_value}% ${d.ignore_field}</div>
          <div class="demand-urg">${[1,2,3,4,5].map(i=>`<div class="demand-dot" style="background:${i<=d.urgency?urgColors[Math.min(d.urgency-1,2)]:'rgba(0,0,0,.04)'}"></div>`).join('')}</div>
        </div>
        <button class="demand-btn" style="background:${t.accentLight}.06);color:${t.accent}" onclick="resolveDemand('${d.id}',true)">${d.cost} 💰</button>
      </div>`;
    });
  } else {
    html+=`<div class="no-demands">La population est satisfaite 😌</div>`;
  }
  html+=`</div>`;

  // Buildings
  const blds=activeQ.buildings||{};
  html+=`<div class="sec"><div class="sec-title">🏗️ Bâtiments</div>`;
  Object.keys(blds).forEach(bid=>{
    const lvl=blds[bid]||0;
    const meta=buildingMeta[bid]||{e:'🏠',ef:''};
    const cost=buildCosts[Math.min(lvl,5)];
    const label=lvl===0?`+ ${cost} 💰`:`↑ ${cost} 💰`;
    html+=`<div class="bld" onclick="upgradeBld('${bid}',${cost})" style="background:${t.accentLight}.02)">
      <div class="bld-iw" style="background:${t.accentLight}.04)">${meta.e}</div>
      <div class="bld-center"><div class="bld-name">${bid}</div><div class="bld-effect">${meta.ef}</div></div>
      <div class="bld-right">
        <div class="bld-dots">${[1,2,3,4,5].map(i=>`<div class="bld-d" style="background:${i<=lvl?t.accent:t.accentLight+'.08)'}"></div>`).join('')}</div>
        ${lvl<5?`<div class="bld-cost" style="background:${t.accentLight}.05);color:${t.accent}">${label}</div>`:`<div class="bld-cost" style="opacity:.2">MAX</div>`}
      </div>
    </div>`;
  });
  html+=`</div>`;

  // Collect
  const hoursSince=((Date.now()-new Date(activeQ.last_collect).getTime())/3600000);
  const goldAvail=Math.max(0,Math.floor(activeQ.population*activeQ.tax_rate/100*hoursSince*0.1));
  html+=`<div class="collect-area">
    <button class="collect-btn" style="background:${t.btnBg};box-shadow:0 4px 16px ${t.accentLight}.15)" onclick="collectGold()" ${goldAvail<1?'disabled':''}>
      <span class="shimmer"></span>💰 Collecter ${goldAvail} or
    </button>
    <div class="collect-sub">Revenus basés sur population × taux d'imposition × temps</div>
  </div>`;

  html+=`</div>`; // scroll
  app.innerHTML=html;
  updateTaxUI(activeQ.tax_rate);
}

function statHTML(emoji,val,label,pct,t){
  return `<div class="stat" style="background:${t.statBg}"><div class="stat-emoji">${emoji}</div><div class="stat-val" style="color:${t.accent}">${val}</div><div class="stat-label">${label}</div><div class="stat-bar" style="background:${t.accentLight}.06)"><div class="stat-fill" style="width:${Math.min(100,pct)}%;background:${t.accent}"></div></div></div>`;
}

function updateTaxUI(v){
  const el=document.getElementById('taxVal');if(el)el.textContent=v+'%';
  const income=Math.round(v*(activeQ.population/1000)*0.5);
  const satisf=Math.round(v*0.2);
  const ef=document.getElementById('taxEffects');
  if(ef)ef.innerHTML=`<div class="tax-effect good">💰 +${income} or/h</div><div class="tax-effect ${satisf>5?'bad':'good'}">😊 ${satisf>0?'-'+satisf:'0'}% satisf.</div>`;
}

let taxTimeout;
function saveTax(v){
  clearTimeout(taxTimeout);
  taxTimeout=setTimeout(async()=>{
    await sb.rpc('set_tax_rate',{p_quartier_id:activeQ.id,p_rate:parseInt(v)});
    activeQ.tax_rate=parseInt(v);
    toast('Taux mis à jour');
  },500);
}

async function collectGold(){
  const{data}=await sb.rpc('collect_gold',{p_quartier_id:activeQ.id});
  if(data&&data.gold){
    player.or_total=data.total;
    activeQ.last_collect=new Date().toISOString();
    toast(`+${data.gold} or collecté !`);
    render();
  }else if(data&&data.error==='too_soon'){
    toast('Trop tôt pour collecter');
  }
}

async function upgradeBld(bid,cost){
  if(player.or_total<cost){toast('Pas assez d\'or');return}
  const{data}=await sb.rpc('upgrade_building',{p_quartier_id:activeQ.id,p_building:bid,p_cost:cost});
  if(data&&data.new_level!==undefined){
    activeQ.buildings[bid]=data.new_level;
    player.or_total=data.remaining_gold;
    toast(`${bid} amélioré niv. ${data.new_level} !`);
    render();
  }else if(data&&data.error==='not_enough_gold'){toast('Pas assez d\'or');}
  else if(data&&data.error==='max_level'){toast('Niveau max atteint');}
}

async function resolveEvent(id,choice){
  const{data}=await sb.rpc('resolve_event',{p_event_id:id,p_choice:choice});
  if(data&&data.ok){
    const{data:q}=await sb.from('player_quartiers').select('*').eq('id',activeQ.id).maybeSingle();
    if(q)activeQ=q;
    const{data:p}=await sb.from('players').select('or_total').eq('id',player.id).maybeSingle();
    if(p)player.or_total=p.or_total;
    await loadQuartierData();
    toast('Choix appliqué');render();
  }else if(data&&data.error==='not_enough_gold'){toast('Pas assez d\'or');}
}

async function resolveDemand(id,accept){
  const{data}=await sb.rpc('resolve_demand',{p_demand_id:id,p_accept:accept});
  if(data&&data.ok){
    const{data:q}=await sb.from('player_quartiers').select('*').eq('id',activeQ.id).maybeSingle();
    if(q)activeQ=q;
    const{data:p}=await sb.from('players').select('or_total').eq('id',player.id).maybeSingle();
    if(p)player.or_total=p.or_total;
    await loadQuartierData();
    toast(accept?'Demande acceptée':'Demande ignorée');render();
  }else if(data&&data.error==='not_enough_gold'){toast('Pas assez d\'or');}
}

async function switchQ(qid){
  activeQ=quartiers.find(q=>q.id===qid);
  await loadQuartierData();
  render();
  window.scrollTo(0,0);
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}
</script>
</body>
</html>
