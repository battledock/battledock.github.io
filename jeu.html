<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Le Port — BattleDock 2</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* ═══ LE PORT — l'arrivée de la traversée. Même monde, même heure : l'aube devient jour ═══ */
:root{--enc:#0d2438;--or:#ffd23c;--corail:#ff6a4e}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100dvh;overflow:hidden;font-family:'Nunito',sans-serif;color:#fff;-webkit-user-select:none;user-select:none}
body{background:linear-gradient(180deg,#57b6e8 0%,#a3dcf2 46%,#ffe9c4 60%);transition:background 1.6s ease}

/* ── monde ── */
.monde{position:fixed;inset:0;overflow:hidden}
.astre{position:absolute;top:10%;left:14%;width:88px;height:88px;border-radius:50%;
  background:radial-gradient(circle at 36% 32%,#fff6c8,#ffde68 60%,#ffc84a);
  box-shadow:0 0 70px 28px rgba(255,222,104,.6)}
.halo{position:absolute;inset:-30%;border-radius:50%;animation:respire 5s ease-in-out infinite;
  background:radial-gradient(circle,rgba(255,255,255,.18),transparent 60%)}
@keyframes respire{50%{transform:scale(1.12)}}
.nuage{position:absolute;background:#fff;border-radius:999px;animation:derive linear infinite}
.nuage::before,.nuage::after{content:'';position:absolute;background:inherit;border-radius:50%}
@keyframes derive{to{transform:translateX(120vw)}}
.n1{width:110px;height:30px;top:7%;left:-130px;opacity:.9;animation-duration:55s}
.n1::before{width:44px;height:44px;top:-20px;left:20px}.n1::after{width:30px;height:30px;top:-12px;left:58px}
.n2{width:74px;height:22px;top:18%;left:-90px;opacity:.7;animation-duration:80s;animation-delay:-38s}
.n2::before{width:30px;height:30px;top:-14px;left:14px}.n2::after{width:20px;height:20px;top:-9px;left:40px}
.mouettes{position:absolute;top:0;left:0;width:100%;height:34%;pointer-events:none;opacity:.55}
.mv{animation:vole 42s linear infinite}
.mv:nth-child(2){animation-duration:56s;animation-delay:-22s}
.mv:nth-child(3){animation-duration:34s;animation-delay:-9s}
.aile{animation:bat 1.1s ease-in-out infinite;transform-origin:center}
.mv:nth-child(2) .aile{animation-duration:1.5s}
.mv:nth-child(3) .aile{animation-duration:.9s}
@keyframes bat{50%{transform:scaleY(.35)}}
@keyframes vole{from{transform:translateX(-60px)}to{transform:translateX(calc(100vw + 60px))}}

/* ville derrière le port : Bonne Mère + toits */
.ville{position:absolute;bottom:41%;left:0;right:0;height:150px}
.ville svg{width:100%;height:100%}
.toit{fill:rgba(70,64,130,.28)}
.toit2{fill:rgba(70,64,130,.4)}
.bm{fill:rgba(255,210,60,.85)}

/* mer + quais */
.mer{position:absolute;bottom:0;left:0;right:0;height:41%;overflow:hidden;
  background:linear-gradient(180deg,#2a9ec4,#10618a)}
.houle{position:absolute;left:0;width:200%;height:60px;animation:roule linear infinite}
.houle svg{width:100%;height:100%;display:block}
.ho1{top:-10px;animation-duration:9s;opacity:.5}
.ho2{top:24px;animation-duration:15s;animation-direction:reverse;opacity:.32}
@keyframes roule{to{transform:translateX(-50%)}}
.caustiques{position:absolute;inset:0;opacity:.5;pointer-events:none;filter:blur(6px);
  background:
    radial-gradient(ellipse 220px 26px at 24% 30%,rgba(255,255,255,.3),transparent 70%),
    radial-gradient(ellipse 170px 20px at 68% 55%,rgba(255,255,255,.22),transparent 70%),
    radial-gradient(ellipse 260px 30px at 45% 80%,rgba(255,255,255,.16),transparent 70%);
  animation:caus 9s ease-in-out infinite}
@keyframes caus{50%{transform:translateX(24px);opacity:.75}}
.scint{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;pointer-events:none;
  animation:scint-a ease-in-out infinite}
@keyframes scint-a{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:.9;transform:scale(1.2)}}

/* le quai en bois du joueur */
.quai{position:absolute;bottom:21%;right:-12px;width:46%;max-width:245px;z-index:2}
.quai svg{width:100%;overflow:visible;filter:drop-shadow(0 8px 10px rgba(5,20,40,.35))}

/* le bateau amarré */
.scene-bateau{position:absolute;bottom:19%;left:7%;width:min(60vw,278px);pointer-events:none;z-index:3}
.bateau{animation:amarre 5s ease-in-out infinite;transform-origin:center bottom}
@keyframes amarre{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg) translateY(-4px)}}
.bateau svg{width:100%;overflow:visible;filter:drop-shadow(0 10px 14px rgba(5,20,40,.45))}
.nom-bateau{position:absolute;top:-24px;left:50%;transform:translateX(-50%);white-space:nowrap;
  font-family:'Fraunces';font-weight:900;font-size:13px;color:var(--enc);
  background:rgba(255,255,255,.85);padding:3px 12px;border-radius:999px;
  box-shadow:0 4px 12px rgba(5,20,40,.25)}

/* ── HEADER : le fanion (posé sur le ciel, sans carte) ── */
.cap-bar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:center;
  padding:calc(14px + env(safe-area-inset-top)) 16px 0;pointer-events:none}
.cap-bar>*{pointer-events:auto}
.cap-verre{width:100%;max-width:460px;display:flex;align-items:flex-start;gap:12px;
  background:none;border:none;box-shadow:none;padding:0}

/* fanion : triangle de couleur + hampe */
.cap-pastille{width:34px;height:44px;flex-shrink:0;position:relative;font-size:0;background:none;border:none}
.cap-pastille::before{content:'';position:absolute;left:2px;top:0;bottom:0;width:3px;border-radius:2px;
  background:linear-gradient(180deg,#e8d8b8,#8a6242);box-shadow:0 2px 5px rgba(3,12,24,.4)}
.cap-pastille .fan{position:absolute;left:5px;top:2px;width:28px;height:22px;
  clip-path:polygon(0 0,100% 0,100% 100%,0 78%);
  filter:drop-shadow(0 3px 6px rgba(3,12,24,.45));
  animation:claque 3.6s ease-in-out infinite;transform-origin:left center}
@keyframes claque{0%,100%{transform:skewY(0) scaleX(1)}50%{transform:skewY(-3deg) scaleX(.94)}}

.cap-id{flex:1;min-width:0;padding-top:1px}
.cap-nom{font-family:'Fraunces';font-weight:900;font-size:20px;line-height:1.05;color:var(--enc);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 1px 0 rgba(255,255,255,.55),0 2px 10px rgba(255,255,255,.5),0 4px 18px rgba(255,255,255,.3)}
.cap-sub{font-size:10.5px;font-weight:900;letter-spacing:1.6px;text-transform:uppercase;margin-top:3px;
  color:rgba(13,36,56,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 1px 6px rgba(255,255,255,.45)}

/* bourse flottante */
.cap-sous{flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-width:66px;padding:8px 12px;border-radius:16px;
  background:rgba(255,253,247,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:2px solid rgba(255,210,60,.65);
  box-shadow:0 6px 18px rgba(3,12,24,.22)}
.cap-sous-v{font-family:'Fraunces';font-weight:900;font-size:18px;line-height:1;color:#c47f00;
  transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.cap-sous-v.pop{transform:scale(1.28)}
.cap-sous-l{font-size:8px;font-weight:900;letter-spacing:2px;text-transform:uppercase;
  color:rgba(13,36,56,.42);margin-top:3px}
.cap-out{width:30px;height:30px;border-radius:50%;border:none;cursor:pointer;flex-shrink:0;margin-top:6px;
  background:rgba(255,253,247,.6);color:rgba(13,36,56,.5);font-size:12px;
  box-shadow:0 3px 10px rgba(3,12,24,.18)}
.cap-out:active{transform:scale(.9)}

/* ── PONT C : panneau escamotable (poignée d'écoutille) ── */
.voile-fond{position:fixed;inset:0;z-index:9;background:rgba(6,14,30,.45);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:.4s}
body.ouvert .voile-fond{opacity:1;pointer-events:auto}

.pont{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;
  padding:0 12px calc(12px + env(safe-area-inset-bottom));
  transform:translateY(calc(100% - 104px - env(safe-area-inset-bottom)));
  transition:transform .5s cubic-bezier(.3,1.05,.4,1);touch-action:none}
body.ouvert .pont{transform:translateY(0)}

.verre{width:100%;max-width:460px;border-radius:26px;padding:0 14px 14px;
  background:rgba(10,26,44,.6);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1.5px solid rgba(255,255,255,.18);box-shadow:0 18px 50px rgba(3,12,24,.5)}

/* poignée : toujours visible, résume l'état du port */
.poignee{padding:11px 4px 12px;cursor:grab;user-select:none}
.poignee:active{cursor:grabbing}
.barrette{width:44px;height:4.5px;border-radius:99px;background:rgba(255,255,255,.35);margin:0 auto 11px;
  transition:.3s}
body.ouvert .barrette{width:30px;background:rgba(255,255,255,.5)}
.resume{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 6px}
.resume-g{display:flex;align-items:center;gap:9px;min-width:0}
.resume-pt{width:9px;height:9px;border-radius:50%;background:#4ade80;box-shadow:0 0 9px #4ade80;flex-shrink:0;
  animation:pulse-pt 1.8s ease-in-out infinite}
@keyframes pulse-pt{50%{opacity:.45;transform:scale(1.25)}}
.resume-txt{min-width:0}
.resume-t{font-family:'Fraunces';font-weight:900;font-size:14.5px;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.resume-s{font-size:9.5px;font-weight:900;letter-spacing:1.6px;text-transform:uppercase;
  color:rgba(255,255,255,.5);margin-top:2px}
.resume-fl{font-size:15px;color:rgba(255,255,255,.55);transition:.4s;flex-shrink:0}
body.ouvert .resume-fl{transform:rotate(180deg)}

/* raccourci direct : sortir en mer, accessible panneau fermé */
.eclair{display:block;width:100%;margin-top:11px;padding:13px;border:none;border-radius:16px;cursor:pointer;
  font-family:'Fraunces';font-weight:900;font-size:15px;color:#fff;text-align:left;position:relative;
  background:linear-gradient(135deg,rgba(42,158,196,.75),rgba(16,97,138,.7));
  border:2px solid rgba(126,200,240,.4);transition:.15s}
.eclair:active{transform:scale(.97)}
.eclair .go{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:20px;
  animation:pousse-go 2s ease-in-out infinite}
@keyframes pousse-go{50%{transform:translateY(-50%) translateX(5px)}}

.grille{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding-top:13px;margin-top:12px;
  border-top:1px solid rgba(255,255,255,.12)}
.w{border-radius:18px;padding:14px 13px;cursor:pointer;position:relative;overflow:hidden;
  background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.16);
  transition:.2s cubic-bezier(.3,1.4,.5,1)}
.w:active{transform:scale(.94)}
.w-emo{font-size:25px;line-height:1;margin-bottom:7px;display:block}
.w-t{font-family:'Fraunces';font-weight:900;font-size:14.5px;line-height:1.1}
.w-s{font-size:10.5px;font-weight:800;color:rgba(255,255,255,.55);margin-top:3px;line-height:1.35}
.w-tag{position:absolute;top:10px;right:10px;font-size:7.5px;font-weight:900;letter-spacing:1.5px;
  padding:3px 8px;border-radius:999px;background:rgba(255,210,60,.18);color:var(--or);
  border:1px solid rgba(255,210,60,.35)}
.w-quai{background:linear-gradient(135deg,rgba(255,210,60,.16),rgba(255,106,78,.14));
  border-color:rgba(255,210,60,.35)}
.w-classement{grid-column:span 2}

/* ── VUE SECTION (overlay) ── */
.vue{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:flex-end;
  opacity:0;pointer-events:none;transition:.35s}
.vue.on{opacity:1;pointer-events:auto}
.vue-fond{position:absolute;inset:0;background:rgba(6,14,30,.45);backdrop-filter:blur(3px)}
.vue-carte{position:relative;margin:0 12px calc(12px + env(safe-area-inset-bottom));align-self:center;
  width:calc(100% - 24px);max-width:460px;border-radius:26px;padding:20px 18px;
  background:rgba(10,26,44,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1.5px solid rgba(255,255,255,.2);box-shadow:0 18px 50px rgba(3,12,24,.6);
  transform:translateY(30px);transition:.35s cubic-bezier(.3,1.15,.4,1)}
.vue.on .vue-carte{transform:none}
.vue-carte h2{font-family:'Fraunces';font-weight:900;font-size:24px;margin-bottom:4px}
.vue-carte .desc{font-size:13px;font-weight:700;color:rgba(255,255,255,.65);line-height:1.55;margin-bottom:14px}
.vue-carte .soon{display:inline-block;font-size:9px;font-weight:900;letter-spacing:2px;text-transform:uppercase;
  padding:5px 12px;border-radius:999px;margin-bottom:12px;
  background:rgba(255,106,78,.18);color:#ffb09e;border:1px solid rgba(255,106,78,.35)}
.b{width:100%;padding:14px;border:none;border-radius:15px;cursor:pointer;
  font-family:'Nunito';font-weight:900;font-size:14.5px;transition:.12s}
.b:active{transform:scale(.96)}
.b-n{background:var(--or);color:var(--enc)}
.b-r{background:rgba(255,255,255,.1);color:rgba(255,255,255,.7);border:2px solid rgba(255,255,255,.18)}

/* toast */
.toast{position:fixed;top:calc(70px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-20px);
  z-index:50;background:rgba(10,26,44,.85);backdrop-filter:blur(12px);border:1.5px solid rgba(255,255,255,.2);
  padding:12px 22px;border-radius:14px;font-size:13px;font-weight:800;opacity:0;transition:.35s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* chargement */
.voile{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#57b6e8,#a3dcf2);transition:opacity .6s;flex-direction:column;gap:14px}
.voile.off{opacity:0;pointer-events:none}
.voile .mo{font-size:52px;animation:amarre 2.4s ease-in-out infinite}
.voile p{font-family:'Fraunces';font-weight:900;font-size:15px;color:var(--enc)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>

<div class="voile" id="voile"><div class="mo">⛵</div><p>Le port s'éveille…</p></div>

<div class="monde">
  <div class="astre"><div class="halo"></div></div>
  <div class="nuage n1"></div><div class="nuage n2"></div>
  <div class="mouettes">
    <svg class="mv" style="position:absolute;top:16%;left:0" width="26" height="12" viewBox="0 0 26 12">
      <path class="aile" d="M1 8 Q7 0 13 7 Q19 0 25 8" fill="none" stroke="#0d2438" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    <svg class="mv" style="position:absolute;top:27%;left:0" width="18" height="9" viewBox="0 0 26 12">
      <path class="aile" d="M1 8 Q7 0 13 7 Q19 0 25 8" fill="none" stroke="#0d2438" stroke-width="2.2" stroke-linecap="round"/>
    </svg>
    <svg class="mv" style="position:absolute;top:9%;left:0" width="14" height="7" viewBox="0 0 26 12">
      <path class="aile" d="M1 8 Q7 0 13 7 Q19 0 25 8" fill="none" stroke="#0d2438" stroke-width="2.6" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="ville">
    <svg viewBox="0 0 1200 150" preserveAspectRatio="none">
      <path class="toit" d="M0 150 V96 L40 78 L80 96 L80 70 L130 52 L180 70 V150 Z"/>
      <path class="toit2" d="M200 150 V88 L250 64 L300 88 L300 100 L360 100 V150 Z"/>
      <path class="toit" d="M380 150 V80 L430 58 L480 80 V150 Z"/>
      <!-- Notre-Dame de la Garde -->
      <g>
        <rect x="560" y="52" width="60" height="98" class="toit2"/>
        <rect x="578" y="14" width="24" height="46" class="toit2"/>
        <circle cx="590" cy="8" r="6" class="bm"/>
        <rect x="588" y="0" width="4" height="8" class="bm"/>
      </g>
      <path class="toit" d="M680 150 V90 L730 66 L780 90 V150 Z"/>
      <path class="toit2" d="M800 150 V100 L850 76 L910 100 L910 84 L970 60 L1030 84 V150 Z"/>
      <path class="toit" d="M1050 150 V92 L1110 70 L1200 92 V150 Z"/>
    </svg>
  </div>

  <div class="mer" id="merEl">
    <div class="houle ho1"><svg viewBox="0 0 800 60" preserveAspectRatio="none"><path d="M0 30 Q50 8 100 30 T200 30 T300 30 T400 30 T500 30 T600 30 T700 30 T800 30 V60 H0 Z" fill="rgba(255,255,255,.5)"/></svg></div>
    <div class="houle ho2"><svg viewBox="0 0 800 60" preserveAspectRatio="none"><path d="M0 32 Q60 12 120 32 T240 32 T360 32 T480 32 T600 32 T720 32 T840 32 V60 H0 Z" fill="rgba(255,255,255,.5)"/></svg></div>
    <div class="caustiques"></div>
  </div>

  <div class="quai">
    <svg viewBox="0 0 230 90">
      <rect x="0" y="24" width="230" height="14" rx="3" fill="#8a6242" stroke="#0d2438" stroke-width="3"/>
      <rect x="18" y="38" width="10" height="52" fill="#6e4c32" stroke="#0d2438" stroke-width="2.5"/>
      <rect x="105" y="38" width="10" height="52" fill="#6e4c32" stroke="#0d2438" stroke-width="2.5"/>
      <rect x="196" y="38" width="10" height="52" fill="#6e4c32" stroke="#0d2438" stroke-width="2.5"/>
      <ellipse cx="60" cy="20" rx="9" ry="7" fill="#3a4a5c" stroke="#0d2438" stroke-width="2.5"/>
      <rect x="140" y="4" width="26" height="20" rx="3" fill="#e8d8b8" stroke="#0d2438" stroke-width="2.5"/>
      <rect x="140" y="4" width="26" height="6" rx="3" fill="#c9b48e"/>
    </svg>
  </div>

  <div class="scene-bateau">
    <div class="nom-bateau" id="nomBateau">…</div>
    <div class="bateau"><svg id="svgB" viewBox="0 0 300 160"></svg></div>
  </div>
</div>

<!-- HEADER -->
<div class="cap-bar">
  <div class="cap-verre">
    <div class="cap-pastille"><div class="fan" id="fanion"></div></div>
    <div class="cap-id">
      <div class="cap-nom" id="capNom">…</div>
      <div class="cap-sub" id="capSub">Capitaine du Vieux-Port</div>
    </div>
    <div class="cap-sous">
      <div class="cap-sous-v" id="sous">0</div>
      <div class="cap-sous-l">Sous</div>
    </div>
    <button class="cap-out" id="btnOut" title="Quitter le port">✕</button>
  </div>
</div>

<!-- HUB C -->
<div class="voile-fond" id="voileFond"></div>
<div class="pont" id="pont">
  <div class="verre">
    <div class="poignee" id="poignee">
      <div class="barrette"></div>
      <div class="resume">
        <div class="resume-g">
          <div class="resume-pt"></div>
          <div class="resume-txt">
            <div class="resume-t" id="meteo">Mer belle · mistral léger</div>
            <div class="resume-s">Le Vieux-Port</div>
          </div>
        </div>
        <div class="resume-fl">⌃</div>
      </div>
      <button class="eclair" data-vue="mer">🌊 Sortir en mer<span class="go">→</span></button>
    </div>
    <div class="grille">
      <div class="w" data-vue="criee">
        <span class="w-emo">🐟</span>
        <div class="w-t">La Criée</div>
        <div class="w-s">Vendre au meilleur prix</div>
      </div>
      <div class="w w-quai" data-vue="quai">
        <span class="w-tag">À toi</span>
        <span class="w-emo">⚓</span>
        <div class="w-t">Mon Quai</div>
        <div class="w-s">Taxer les accostages</div>
      </div>
      <div class="w" data-vue="chantier">
        <span class="w-emo">🔨</span>
        <div class="w-t">Chantier naval</div>
        <div class="w-s">Améliorer ton bateau</div>
      </div>
      <div class="w w-classement" data-vue="classement">
        <span class="w-emo">🏆</span>
        <div class="w-t">Classement</div>
        <div class="w-s">Les légendes du port</div>
      </div>
    </div>
  </div>
</div>

<!-- VUE SECTION -->
<div class="vue" id="vue">
  <div class="vue-fond" id="vueFond"></div>
  <div class="vue-carte">
    <span class="soon">En construction</span>
    <h2 id="vueTitre"></h2>
    <p class="desc" id="vueDesc"></p>
    <button class="b b-r" id="vueFermer">Retour au port</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';
const $=s=>document.querySelector(s);

/* ── SUPABASE ── */
const SUPABASE_URL='https://jtijmythnvqgquizeizs.supabase.co';

let SESSION=null,PROFIL=null;

async function garde(){
  try{
    const s=JSON.parse(localStorage.getItem('bd2_session'));
    if(!s||!s.access_token)throw 0;
    let r=await fetch(`${SUPABASE_URL}/auth/v1/user`,{headers:{'apikey':SUPABASE_ANON,'Authorization':`Bearer ${s.access_token}`}});
    if(r.ok){s.user=await r.json();SESSION=s;return}
    if(s.refresh_token){
      r=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`,{
        method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON},
        body:JSON.stringify({refresh_token:s.refresh_token})
      });
      const d=await r.json();
      if(d.access_token){localStorage.setItem('bd2_session',JSON.stringify(d));SESSION=d;return}
    }
    throw 0;
  }catch(e){
    localStorage.removeItem('bd2_session');
    location.href='index.html';
    throw new Error('no-session');
  }
}

async function chargeProfil(){
  const uid=SESSION.user?.id||SESSION.user?.user?.id;
  const r=await fetch(`${SUPABASE_URL}/rest/v1/profils?id=eq.${uid}&select=*`,{
    headers:{'apikey':SUPABASE_ANON,'Authorization':`Bearer ${SESSION.access_token}`}
  });
  const rows=r.ok?await r.json():[];
  if(!rows.length){location.href='inscription.html';throw new Error('no-profil')}
  PROFIL=rows[0];
}

/* ── compteur de sous (animation quand ça bouge) ── */
function majSous(n){
  const el=$('#sous');
  el.textContent=Number(n).toLocaleString('fr-FR');
  el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');
  setTimeout(()=>el.classList.remove('pop'),320);
}

/* ── toast ── */
let toastTimer;
function toast(msg){
  const t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600);
}

const panneau={
  ouvre(){document.body.classList.add('ouvert')},
  ferme(){document.body.classList.remove('ouvert')},
  bascule(){document.body.classList.toggle('ouvert');if(navigator.vibrate)navigator.vibrate(9)}
};
$('#voileFond').onclick=panneau.ferme;

/* poignée : tap OU glissement vertical */
(()=>{
  const p=$('#poignee');
  let y0=null,bouge=false;
  const debut=y=>{y0=y;bouge=false};
  const suit=y=>{
    if(y0===null)return;
    const d=y-y0;
    if(Math.abs(d)>8)bouge=true;
    if(d<-26){panneau.ouvre();y0=null}
    else if(d>26){panneau.ferme();y0=null}
  };
  const fin=()=>{y0=null};
  p.addEventListener('touchstart',e=>debut(e.touches[0].clientY),{passive:true});
  p.addEventListener('touchmove',e=>suit(e.touches[0].clientY),{passive:true});
  p.addEventListener('touchend',fin);
  p.addEventListener('click',e=>{
    if(bouge||e.target.closest('[data-vue]'))return;
    panneau.bascule();
  });
})();

document.querySelectorAll('[data-vue]').forEach(w=>{
  w.addEventListener('click',()=>{
    panneau.ferme();
    const v=VUES[w.dataset.vue];
    $('#vueTitre').textContent=v.t;
    $('#vueDesc').textContent=v.d;
    $('#vue').classList.add('on');
    if(navigator.vibrate)navigator.vibrate(9);
  });
});
const fermeVue=()=>$('#vue').classList.remove('on');
$('#vueFermer').onclick=fermeVue;
$('#vueFond').onclick=fermeVue;
