/* ---- présence en direct : un canal temps réel, plus la base pour le classement ---- */
let canal=null, dernierBase=0, dernierBrd=0;
const AUTRES_MAP=new Map();

function ouvrirCanal(){
  if(canal||!sb)return;
  try{
    canal=sb.channel('monde',{config:{broadcast:{self:false},presence:{key:idJoueur()}}});
    canal.on('broadcast',{event:'pos'},({payload:p})=>{
      if(!p||p.id===idJoueur())return;
      if(p.biome!==e.biome)return;                 // chacun son terrain
      const a=AUTRES_MAP.get(p.id)||{x:p.x,y:p.y,vx:p.x,vy:p.y,pas:0,dir:'bas'};
      a.x=p.x;a.y=p.y;                       // cible
      a.pseudo=p.pseudo;a.niv=p.niv;a.biome=p.biome;a.apparence=p.apparence;
      a.compagnon=p.compagnon;a.vu=Date.now();
      AUTRES_MAP.set(p.id,a);
    });
    ['emote','dire','don'].forEach(ev=>
      canal.on('broadcast',{event:ev},({payload:p})=>recevoirSocial(ev,p)));
    canal.on('broadcast',{event:'res'},({payload:p})=>{
      if(!p||p.par===idJoueur()||p.biome!==e.biome)return;
      e.zones[p.id]=Math.max(e.zones[p.id]||0,p.jusqua);   // l'arbre tombe pour tout le monde
      const o=(OBJETS||[]).find(x=>x.id===p.id);
      if(o){o.coups=0;o.secousse=Date.now();}
    });
    canal.on('presence',{event:'leave'},({leftPresences})=>{
      (leftPresences||[]).forEach(pr=>{if(pr.id)AUTRES_MAP.delete(pr.id);});
    });
    canal.subscribe(st=>{
      if(st==='SUBSCRIBED')canal.track({id:idJoueur(),pseudo:e.nom||'Sans nom'});
    });
  }catch(x){canal=null;}
}
/* on diffuse la position six fois par seconde, c'est léger : rien n'est stocké */
function diffuser(){
  if(!canal)return ouvrirCanal();
  const now=Date.now();
  if(now-dernierBrd<160)return;
  dernierBrd=now;
  try{
    canal.send({type:'broadcast',event:'pos',payload:{
      id:idJoueur(),pseudo:e.nom||'Sans nom',niv:e.niv,biome:e.biome,
      x:Math.round(joueur.x),y:Math.round(joueur.y),dir:joueur.dir,
      bouge:joueur.pas>0,apparence:e.apparence||{},
      compagnon:e.compagnon?e.compagnon.nom:null}});
  }catch(x){}
}
/* la base ne sert plus qu'au classement et aux absents : une écriture toutes les dix secondes */
async function envoyerPosition(force){
  diffuser();
  if(!sb)return;
  const now=Date.now();
  if(!force&&now-dernierBase<10000)return;
  dernierBase=now;
  try{
    await sb.from('survivants').upsert({
      id:idJoueur(),pseudo:e.nom||'Sans nom',biome:e.biome,niv:e.niv,
      x:Math.round(joueur.x),y:Math.round(joueur.y),dir:joueur.dir,
      compagnon:e.compagnon?e.compagnon.nom:null,
      apparence:e.apparence||{},traits:e.traits||[],
      jours:jourNo(),score:score(),mortes:e.mortes||0,
      maj:new Date().toISOString()});
  }catch(x){}
}
/* interpolation : entre deux messages, les autres continuent de marcher */
function majAutres(dt){
  const now=Date.now();
  AUTRES=[];
  AUTRES_MAP.forEach((a,id)=>{
    if(now-(a.vu||0)>12000){AUTRES_MAP.delete(id);return;}
    const dx=a.x-a.vx, dy=a.y-a.vy, d=Math.hypot(dx,dy);
    if(d>1.5){
      const v=Math.min(d, Math.max(130,d*4)*dt);
      a.vx+=dx/d*v;a.vy+=dy/d*v;
      a.pas=(a.pas||0)+v*0.085;
      a.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'droite':'gauche'):(dy>0?'bas':'haut');
      a.bouge=true;
    }else{a.vx=a.x;a.vy=a.y;a.pas=0;a.bouge=false;}
    AUTRES.push(a);
  });
}

function dessinerClairiere(g,camX,camY){
  const cx=CARREFOUR.x-camX, cy=CARREFOUR.y-camY, R=CARREFOUR.r;
  g.fillStyle='#b9a882';g.beginPath();g.ellipse(cx,cy,R*0.92,R*0.72,0,0,7);g.fill();

    g.beginPath();g.ellipse(cx+Math.cos(a2)*R*0.92,cy+Math.sin(a2)*R*0.72,9,6,0,0,7);g.fill();

}

async function sauverEnLigne(force){
  if(!sb||nuageOccupe)return;
  const now=Date.now();
  if(!force&&now-dernierNuage<20000)return;
  dernierNuage=now;nuageOccupe=true;
  try{
    await sb.from('sauvegardes').upsert({id:idJoueur(),etat:etatAEnvoyer(),
      maj:new Date().toISOString()});
  }catch(x){}
  nuageOccupe=false;
}
async function chargerEnLigne(){
  if(!sb)return false;
  try{
    const {data}=await sb.from('sauvegardes').select('etat,maj').eq('id',idJoueur()).maybeSingle();
    if(!data||!data.etat)return false;
    const distant=data.etat, tD=distant.derniere||0, tL=e.derniere||0;
    if(tD>tL+2000){                      /* la partie en ligne est plus récente */
      Object.assign(e,distant);
      sauver();
      toast('Partie retrouvée en ligne');
      return true;
    }
  }catch(x){}
  return false;
}

/* ================= l'écran de carte ================= */
const cv=$('cv'), ctx=cv.getContext('2d');
const jc=$('joy'), jg=jc.getContext('2d');
let DPR=Math.min(2,window.devicePixelRatio||1), enCarte=false, dernierT=0;

function tailleCarte(){
  const r=cv.getBoundingClientRect();
  cv.width=Math.round(r.width*DPR);cv.height=Math.round(r.height*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.imageSmoothingEnabled=false;
}
addEventListener('resize',()=>{if(enCarte)tailleCarte();});
(function joyNet(){const d=Math.min(3,window.devicePixelRatio||1);
  jc.width=132*d;jc.height=132*d;jg.setTransform(d,0,0,d,0,0);})();

const R=54,JCX=66,JCY=66;
let jdx=0,jdy=0,jactif=false,jid=null;
const jpos=t=>{const r=jc.getBoundingClientRect();
  return[(t.clientX-r.left)*132/r.width,(t.clientY-r.top)*132/r.height];};
function joyPose(x,y){
  const dx=x-JCX,dy=y-JCY,d=Math.hypot(dx,dy);
  const m=Math.min(d,R-20),ang=Math.atan2(dy,dx);
  jdx=d<0.01?0:Math.cos(ang)*m;jdy=d<0.01?0:Math.sin(ang)*m;
  const n=Math.min(1,d/(R-20));
  joyX=d<0.01?0:Math.cos(ang)*n;joyY=d<0.01?0:Math.sin(ang)*n;
  if(Math.hypot(joyX,joyY)<0.15){joyX=joyY=0;}
}
jc.addEventListener('touchstart',ev=>{ev.preventDefault();const t=ev.changedTouches[0];
  jid=t.identifier;jactif=true;joyPose(...jpos(t));},{passive:false});
jc.addEventListener('touchmove',ev=>{ev.preventDefault();
  for(const t of ev.changedTouches)if(t.identifier===jid)joyPose(...jpos(t));},{passive:false});
['touchend','touchcancel'].forEach(k=>jc.addEventListener(k,ev=>{ev.preventDefault();
  for(const t of ev.changedTouches)if(t.identifier===jid){jactif=false;jid=null;jdx=jdy=joyX=joyY=0;}},{passive:false}));
jc.addEventListener('mousedown',ev=>{jactif=true;joyPose(...jpos(ev));});
addEventListener('mousemove',ev=>{if(jactif)joyPose(...jpos(ev));});
addEventListener('mouseup',()=>{if(jactif){jactif=false;jdx=jdy=joyX=joyY=0;}});
addEventListener('keydown',ev=>{const k={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],
  z:[0,-1],s:[0,1],q:[-1,0],d:[1,0]}[ev.key];if(k){joyX=k[0];joyY=k[1];}
  if(ev.key==='Enter'&&procheObjet)fouillerObjet(procheObjet);});
addEventListener('keyup',()=>{joyX=joyY=0;});

function dessinerJoy(){
  jg.clearRect(0,0,132,132);
  jg.beginPath();jg.arc(JCX,JCY,R,0,7);
  const f=jg.createRadialGradient(JCX,JCY-16,6,JCX,JCY,R);
  f.addColorStop(0,'rgba(240,246,238,.34)');f.addColorStop(1,'rgba(200,212,198,.2)');
  jg.fillStyle=f;jg.fill();
  jg.lineWidth=2.5;jg.strokeStyle='rgba(240,246,238,.45)';jg.stroke();
  const kx=JCX+jdx,ky=JCY+jdy;
  jg.beginPath();jg.arc(kx,ky+3,20,0,7);jg.fillStyle='rgba(10,18,12,.35)';jg.fill();
  const k=jg.createRadialGradient(kx-5,ky-8,3,kx,ky,21);
  if(jactif){k.addColorStop(0,'#a9e88a');k.addColorStop(1,'#3f7d4a');}
  else{k.addColorStop(0,'#f4f7f0');k.addColorStop(1,'#c9d2c2');}
  jg.beginPath();jg.arc(kx,ky,20,0,7);jg.fillStyle=k;jg.fill();
  jg.lineWidth=2.5;jg.strokeStyle=jactif?'#2c6b32':'rgba(40,50,40,.5)';jg.stroke();
}

function majHud(){
  const jauge=(nom,val,c)=>`<div class="jg"><div class="t"><b>${nom}</b><i>${Math.round(val)}</i></div>
    <div class="b"><i style="width:${Math.max(0,Math.min(100,val))}%;background:${c}"></i></div></div>`;
  const barres=()=>jauge('VIE',e.sante,'#e2504f')+jauge('FAIM',e.faim,'#d99a3e')+
                    jauge('SOIF',e.soif,'#2f9bb5')+jauge('CHALEUR',e.chaleur,'#8a5fd6');

  if(INT){                                   /* à l'intérieur : fouiller ou sortir */
    $('c-batir').classList.remove('on');
    const a2=$('action');
    a2.classList.add('on');
    if(INT.surPorte){a2.innerHTML='Sortir<b>'+INT.nom+'</b>';
      a2.style.background='#c9a24a';a2.style.color='#2a1d08';}
    else if(INT.cible){const v=INT.cible.fouille;
      a2.innerHTML=(v?'Fouiller':'Vide')+'<b>'+({caisse:'Caisse',etagere:'Étagère',tonneau:'Tonneau',
        table:'Table',canape:'Canapé',plan:'Plan de travail',etabli:'Établi',couchage:'Couchage',
        feu:'Foyer',pierre2:'Pierre',tuyau:'Tuyau',lampe:'Lampe',chaise:'Chaise',enclume:'Enclume'}[INT.cible.t]||'Meuble')+'</b>';
      a2.style.background=v?'#63a84a':'rgba(20,28,22,.7)';a2.style.color=v?'#0f1a10':'#c9d2c2';}
    else a2.classList.remove('on');
    $('c-joueur').classList.remove('on');
    $('c-jour').textContent='Jour '+jourNo()+' · '+String(Math.floor(heureJour())).padStart(2,'0')+' h';
    $('c-gens').textContent=INT.nom;
    $('mini').innerHTML=barres();
    $('c-boire').innerHTML='<b>'+sac('eau')+'</b>';
    $('c-manger').innerHTML='<b>'+sac('nourriture')+'</b>';
    return;
  }

  $('c-jour').textContent='Jour '+jourNo()+' · '+String(Math.floor(heureJour())).padStart(2,'0')+' h';
  $('c-gens').textContent=AUTRES.length?AUTRES.length+' en ligne':'';
  $('mini').innerHTML=barres();
  $('c-boire').innerHTML='<b>'+sac('eau')+'</b>';
  $('c-manger').innerHTML='<b>'+sac('nourriture')+'</b>';
  $('c-boire').style.opacity=sac('eau')?1:.4;
  $('c-manger').style.opacity=sac('nourriture')?1:.4;
  const bj=$('c-joueur');
  if(procheJoueur){
    bj.classList.add('on');
    const d=Math.round(Math.hypot(procheJoueur.vx-joueur.x,procheJoueur.vy-joueur.y));
    bj.innerHTML='Interagir<b>'+(procheJoueur.pseudo||'?')+' · '+d+' m</b>';
  }else bj.classList.remove('on');

  const a2=$('action');
  const bb=$('c-batir');
  if(modePose){
    bb.classList.add('on');bb.innerHTML='Annuler';
    bb.style.background='rgba(20,28,22,.75)';bb.style.color='#dfe9dc';
    a2.classList.add('on');
    a2.innerHTML=(modePose.ok?'Poser ici':'Impossible')+'<b>'+modePose.def.nom+'</b>';
    a2.style.background=modePose.ok?'#63a84a':'#a8443c';a2.style.color='#0f1a10';
    return;
  }
  bb.classList.add('on');bb.innerHTML='Bâtir';
  bb.style.background='#8a6a44';bb.style.color='#fdf3e2';
  const host=hostileProche();
  if(host){
    a2.classList.add('on');
    a2.innerHTML='Frapper<b>'+espece().nom+'</b>';
    a2.style.background='#c2413a';a2.style.color='#fff2ee';
    return;
  }
  const cst=construireProche();
  if(cst&&!procheObjet){
    const d=CONSTRUCTIBLES.find(z=>z.id===cst.t)||{nom:'Ouvrage'};
    const verbes={feu:'Se réchauffer',abri:'Se reposer',coffre:'Ouvrir',
                  sechoir:'Faire sécher',tonneau:'Puiser',palissade:'Regarder'};
    a2.classList.add('on');
    a2.innerHTML=(verbes[cst.t]||'Utiliser')+'<b>'+d.nom+'</b>';
    a2.style.background='#c9a24a';a2.style.color='#2a1d08';
    return;
  }
  if(procheBete&&!procheObjet){
    a2.classList.add('on');
    const c=(procheBete.apprivoise||0);
    a2.innerHTML='Nourrir<b>'+procheBete.n+' · '+c+'/'+APPRIVOISER+'</b>';
    a2.style.background=sac('nourriture')?'#d9a441':'rgba(20,28,22,.7)';
    a2.style.color=sac('nourriture')?'#2a1c08':'#c9d2c2';
  }else if(procheObjet){
    a2.classList.add('on');
    const pret=pretObjet(procheObjet);
    if(procheObjet.type==='lieuC'){
      const verbes={marche:'Échanger',puits:'Puiser',forge:'Entrer',abri:'Entrer',
                    feu:'Se réchauffer',panneau:'Lire'};
      a2.innerHTML=verbes[procheObjet.sous]+'<b>'+procheObjet.nom+'</b>';
      a2.style.background='#c9a24a';a2.style.color='#2a1d08';
    }else if(estDecor(procheObjet)){
      const t=TRAVAIL[procheObjet.type];
      const total=Math.max(1,(t.outil&&a(t.outil))?Math.ceil(t.coups/2):t.coups);
      const noms={arbre:'Arbre',rocher:'Rocher',buisson:'Buisson',herbe:'Herbes'};
      a2.innerHTML=(pret?t.verbe:'Repousse')+
        '<b>'+noms[procheObjet.type]+(pret?' · '+(procheObjet.coups||0)+'/'+total:'')+'</b>';
      a2.style.background=pret?'#b5763a':'rgba(20,28,22,.7)';
      a2.style.color=pret?'#2a1a08':'#c9d2c2';
    }else if(procheObjet.type==='batiment'&&BATIS[procheObjet.id]){
      a2.innerHTML='Entrer<b>'+procheObjet.nom+'</b>';
      a2.style.background='#c9a24a';a2.style.color='#2a1d08';
    }else{
      a2.innerHTML=(pret?'Fouiller':'Vidé')+'<b>'+(procheObjet.nom||'Caisse')+'</b>';
      a2.style.background=pret?'#63a84a':'rgba(20,28,22,.7)';
      a2.style.color=pret?'#0f1a10':'#c9d2c2';
    }
  }else a2.classList.remove('on');
}
$('c-batir').onclick=()=>{if(modePose)poser();else ouvrirConstruction();};
$('c-batir').oncontextmenu=(ev)=>{ev.preventDefault();annulerPose();};
$('action').onclick=()=>{
  if(modePose)return poser();
  const h=hostileProche();
  if(h)return frapper(h);
  const c=construireProche();
  if(c&&!procheObjet)return utiliserConstruction(c);
  if(INT){
    if(INT.surPorte)fondre(sortirBati);
    else if(INT.cible)fouillerMeuble(INT.cible);
    return;
  }
  if(procheObjet&&procheObjet.type==='lieuC')return utiliserLieu(procheObjet);
  if(procheObjet&&procheObjet.type==='batiment'&&BATIS[procheObjet.id]){
    const o=procheObjet;return fondre(()=>entrerBati(o));}
  if(procheObjet)fouillerObjet(procheObjet);
  else if(procheBete)nourrir(procheBete);};
$('c-joueur').onclick=()=>{if(procheJoueur)ouvrirEmotes(procheJoueur);};
$('c-boire').onclick=()=>boire();
$('c-manger').onclick=()=>manger();
$('c-retour').onclick=()=>{if(INT)return sortirBati();fermerCarte();};

function ouvrirCarte(){
  if(!OBJETS){OBJETS=construireMonde();peuplerBetes();}
  ouvrirCanal();chargerRessources();chargerEnLigne();
  if(e.pos){joueur.x=e.pos.x;joueur.y=e.pos.y;}
  if(bloque(joueur.x,joueur.y)){          // position héritée invalide : on repart du centre
    joueur.x=MONDE/2;joueur.y=MONDE/2;
  }
  CAM.x=joueur.x;CAM.y=joueur.y;
  if(!VOLANTS.length)peuplerVolants();
  enCarte=true;$('carte').classList.add('on');
  document.querySelector('.app').style.display='none';
  tailleCarte();dernierT=performance.now();
  const boucle=(t)=>{
    if(!enCarte)return;
    boucleCarte=requestAnimationFrame(boucle);
    const dt=Math.min(.05,(t-dernierT)/1000);dernierT=t;
    ecouler();veillerQuetes();majParticules(dt);majBulles(dt);majFondu(dt);
    const rc=cv.getBoundingClientRect();
    majMeteo(dt,rc.width,rc.height);majTraces(dt);majCouchees(dt);majVolants(dt);
    const r=cv.getBoundingClientRect();
    if(INT){
      majInterieur(dt);dessinerInterieur(r.width,r.height,ctx);
    }else{
      majJoueur(dt);majBetes(dt);majHostiles(dt);majCompagnon(dt);majAutres(dt);
      chercherJoueur();majPose();envoyerPosition();sauverEnLigne();
      majCamera(dt,rc.width,rc.height);
      dessinerCarte(r.width,r.height,ctx);
    }
    dessinerJoy();majHud();
  };
  boucleCarte=requestAnimationFrame(boucle);
}
function fermerCarte(){
  enCarte=false;if(boucleCarte)cancelAnimationFrame(boucleCarte);
  $('carte').classList.remove('on');
  document.querySelector('.app').style.display='';
  sauver();
  vue='atelier';
  document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x.dataset.v==='atelier'));
  rendre(true);
}
setInterval(()=>{if(enCarte)sauver();},4000);

    <div class="k">TU T’ES RÉVEILLÉ</div>
    <h1>Quelque part</h1>

    <button class="cta" id="d-ok">Commencer ici</button>
    <button class="relance" id="d-re">tirer un autre endroit</button>`;
  $('depart').classList.add('on');
  $('d-ok').onclick=()=>{
    e.biome=b.id;e.debut=Date.now();e.derniere=Date.now();e.vu=true;

/* ================= navigation ================= */
let vue='atelier';
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{
  if(b.dataset.v==='explorer'){ouvrirCarte();return;}
  if(b.dataset.v==='classement')CLASSEMENT=null;
  vue=b.dataset.v;

function brancher(){
  const z=$('corps');
  z.querySelectorAll('[data-zone]').forEach(b=>b.onclick=()=>{
    const zn=biome().zones.find(x=>x.id===b.dataset.zone);if(zn)fouiller(zn);});
  z.querySelectorAll('[data-fab]').forEach(b=>b.onclick=()=>{
    const r=RECETTES.find(x=>x.id===b.dataset.fab);if(r)fabriquer(r);});
  z.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{
    if(b.dataset.act==='boire')boire();else manger();});
  z.querySelectorAll('[data-trait]').forEach(b=>b.onclick=()=>choisirTrait(b.dataset.trait));
  const mo=$('f-modifier');if(mo)mo.onclick=ouvrirApparence;
}
function signature(){
  if(vue==='classement')return 'cl|'+(CLASSEMENT?CLASSEMENT.length:'-')+'|'+e.niv;
  let g=vue+'|'+(e.traits||[]).join(',')+'|'+JSON.stringify(e.apparence||{})+'|'+Math.round(e.faim)+'|'+Math.round(e.soif)+'|'+Math.round(e.chaleur)+'|'+Math.round(e.sante);
  g+='|'+e.niv+'|'+e.meteo+'|'+(nuit()?'n':'j')+'|'+jourNo()+'|'+Math.floor(heure()*6);
  Object.keys(RESSOURCES).forEach(k=>g+='|'+sac(k));
  g+='|'+Object.keys(e.objets).join(',');
  biome().zones.forEach(z=>g+='|'+(pretZone(z)?1:Math.ceil(resteZone(z)/5)));
  g+='|'+e.journal.length;
  return g;
}
let sig='';
function rendre(force){
  ecouler();
  if(!e.biome){$('depart').classList.contains('on')||tirerBiome();return;}
  const s=signature();
  if(!force&&s===sig)return;
  sig=s;
  const y=$('corps').scrollTop;
  $('corps').innerHTML=vue==='atelier'?vueAtelier():vue==='fiche'?vueFiche():
                       vue==='classement'?vueClassement():vueJournal();
  brancher();
  $('corps').scrollTop=y;
}
rendre(true);
if(e.biome)setTimeout(()=>ouvrirCarte(),60);      // on arrive directement sur la carte
setInterval(()=>{ecouler();rendre();sauver();},1000);
