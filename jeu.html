/* Les bâtiments sont plantés aux mêmes coordonnées pour tout le monde :
   c'est la même carte, donc le même casino au même endroit. */
/* Chaque lieu occupe sa part de la carte, au lieu de s'entasser au centre.
   La forge est au bord de l'eau, la mine adossée au coin sud-est pour que
   sa falaise ait un fond, le casino au nord-est loin du travail. */
/* La rive est est rangée en PLACE : le camp au milieu, les cinq autres tout
   autour à peu près à égale distance, et des routes en étoile. Le comptoir
   reste en haut, centré, comme un fronton. */
const CAMP_FIXE  =[780,300];                    /* le campement, au centre */
const COFFRE_FIXE=[890,392];                    /* au sud-est de la place */
const FORGE_FIXE =[662,318];                    /* à l'ouest, vers la rivière */
const COMPTOIR_FIXE=[782,134];                  /* le long entrepôt, en haut, centré */
const CASINO_FIXE  =[912,246];                  /* au nord-est, dégagé de l'entrepôt */
const MINE_FIXE  =[770,494];                    /* plein sud, au bout de la place */
/* La carte a rétréci : un joueur enregistré au-delà des nouvelles limites
   serait coincé hors du monde. On le ramène au camp. */
const dansLaCarte=(v,max)=>typeof v==='number'&&v>BORD&&v<max-BORD;
/* Le monde s'est élargi vers l'ouest : une partie enregistrée avant garde
   des x de l'ancien repère. On les décale d'autant, une fois. */
let joueur={x:dansLaCarte(e.x,MONDE_L)?(e.x<400?e.x+400:e.x):CAMP_FIXE[0],
            y:dansLaCarte(e.y,MONDE_H)?e.y:CAMP_FIXE[1]+30,dir:'bas',pas:0,marche:false};
let joyX=0,joyY=0;

/* ================= rendu ================= */
const cv=$('cv'), ctx=cv.getContext('2d');
let VW=0,VH=0;
let ECH=ZOOM;
let ECH_CSS=ZOOM;                 /* combien de points d'écran pour un point de jeu */
function taille(){
  const w=window.innerWidth, h=window.innerHeight;
  /* L'échelle est celle qui cadre la vue de référence. On prend la plus
     contraignante des deux : ainsi on ne voit JAMAIS plus que la vue prévue,
     ni en largeur ni en hauteur. */
  let e=Math.max(w/VUE_L,h/VUE_H);
  /* on arrondit au huitième de point : le pixel reste régulier à l'œil,
     et l'écart de cadrage entre deux téléphones reste sous 2 % */
  e=Math.max(1.2,Math.round(e*8)/8);
  ECH_CSS=e;
  const dpr=Math.max(1,Math.min(3,window.devicePixelRatio||1));
  ECH=e*dpr;
  VW=Math.ceil(w/e)+1;VH=Math.ceil(h/e)+1;
  cv.width=Math.round(VW*ECH);cv.height=Math.round(VH*ECH);
  cv.style.width=(VW*e)+'px';cv.style.height=(VH*e)+'px';
  cv.style.marginLeft=Math.round((w-VW*e)/2)+'px';
  cv.style.marginTop=Math.round((h-VH*e)/2)+'px';
  ctx.setTransform(ECH,0,0,ECH,0,0);
  ctx.imageSmoothingEnabled=false;
}
/* Le clavier qui s'ouvre change la hauteur de la fenêtre. Redessiner tout le
   terrain à ce moment-là l'écrase et coûte cher pour rien : on ne refait la
   toile que si la largeur change vraiment (rotation, changement d'écran). */
let largeurVue=window.innerWidth;
addEventListener('resize',()=>{
  if(window.innerWidth===largeurVue&&bandeauOuvert())return;   /* c'est le clavier */
  largeurVue=window.innerWidth;
  videCache();taille();
});

/* Le bandeau se cale juste au-dessus du clavier, et la barre du bas s'efface
   pendant qu'on écrit : elle ne sert à rien, clavier ouvert. */
function suivreLeClavier(){
  const vv=window.visualViewport;
  const b=$('bandeau');
  if(!b)return;
  if(!bandeauOuvert()){b.style.bottom='0px';document.body.classList.remove('clavier');return;}
  const sous=vv?Math.max(0,window.innerHeight-vv.height-vv.offsetTop):0;
  b.style.bottom=sous+'px';
  document.body.classList.toggle('clavier',sous>90);
}
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',suivreLeClavier);
  window.visualViewport.addEventListener('scroll',suivreLeClavier);
}

function preparerMonde(){
  if(SOL)return;
  LISIERE=construireLisiere();SOL=construireSol();semerDecor();
  const [dx,dy]=degager(joueur.x,joueur.y);   /* on ne démarre jamais dans un tronc */
  joueur.x=dx;joueur.y=dy;e.x=dx;e.y=dy;
  poserCoffre();
}
/* le coffre se place à quelques pas de l'endroit où tu te trouves,
   pour que tu tombes dessus dès la première partie */
function poserCoffre(){
  e.coffre=COFFRE_FIXE;                       /* le même coffre, au même endroit */
  if(e.coffreOuvert)return;                   /* déjà vidé : il n'y en a plus */
  /* le coffre reste sur la carte même une fois vidé : couvercle ouvert */
  DECOR=DECOR.filter(o=>BATI(o.t)||Math.hypot(o.x-e.coffre[0],o.y-e.coffre[1])>40||o.t==='fleurs');invaliderGrille();
  poserDansLeDecor({t:'coffre',x:e.coffre[0],y:e.coffre[1],gr:0});
  DECOR.sort((a,b)=>a.y-b.y);invaliderGrille();
}
function dessiner(){
  preparerMonde();
  /* La caméra avance en sous-pixels.
     Un pixel du jeu vaut ECH pixels d'écran : on peut donc glisser par pas de 1/ECH,
     ce qui donne un défilement continu au lieu de sauts d'un pixel entier. */
  const camXf=Math.max(0,Math.min(MONDE_L-VW,joueur.x-VW/2));
  const camYf=Math.max(0,Math.min(MONDE_H-VH,joueur.y-VH/2));
  const camX=Math.floor(camXf), camY=Math.floor(camYf);
  const fx=Math.round((camXf-camX)*ECH)/ECH;      /* la part fractionnaire, calée sur l'écran */
  const fy=Math.round((camYf-camY)*ECH)/ECH;

  const sx=SECOUSSE>0.01?Math.round((Math.random()-.5)*SECOUSSE*4)*ECH:0;
  const sy=SECOUSSE>0.01?Math.round((Math.random()-.5)*SECOUSSE*4)*ECH:0;
  ctx.setTransform(ECH,0,0,ECH,Math.round(-fx*ECH)+sx,Math.round(-fy*ECH)+sy);
  ctx.imageSmoothingEnabled=false;

  ctx.fillStyle='#2b3a26';ctx.fillRect(0,0,VW+2,VH+2);
  const lw=Math.min(VW+2,MONDE_L-camX), lh=Math.min(VH+2,MONDE_H-camY);
  ctx.drawImage(SOL,camX,camY,lw,lh,0,0,lw,lh);

  const px=Math.round((joueur.x-camX)*ECH)/ECH;
  const py=Math.round((joueur.y-camY)*ECH)/ECH;
  /* le décor et le joueur sont mêlés : ce qui est plus bas passe devant */

  flechesVersLesAutres(camX,camY);
  if(QUALITE>=0.5)dessinerNuages(ctx,camX,camY);   /* l'ombre des nuages */
  if(QUALITE>=1)dessinerPapillons(ctx,camX,camY);
  ambiance(ctx);                          /* une lueur douce vers le centre */
  nettoyerBulles();
  /* les acteurs : moi et les autres, chacun à sa profondeur */
  const acteurs=[{y:joueur.y,
    f:()=>personne(ctx,px,py,e.ap,joueur.dir,joueur.pas,!!joueur.marche)}];
  for(const [,a] of AUTRES){
    const ax=a.x-camX, ay=a.y-camY;
    if(ax<-40||ay<-70||ax>VW+40||ay>VH+40)continue;
    acteurs.push({y:a.y,f:()=>dessinerUnAutre(ctx,a,camX,camY)});
  }
  /* la forêt et la palissade nord, ouest et est passent DERRIÈRE le joueur :
     il marche devant elles, sa tête ne disparaît plus dedans */
  if(LISIERE)ctx.drawImage(LISIERE,camX,camY,lw,lh,0,0,lw,lh);
  dessinerDecor(ctx,camX,camY,VW,VH,acteurs);
  /* les bulles par-dessus tout : un mot ne doit jamais passer sous un caillou */
  dessinerBulles(ctx,camX,camY,px,py);
  dessinerParts(ctx,camX,camY);
  dessinerTextes(ctx,camX,camY);
  /* tant que le coffre n'est pas ouvert, une flèche indique où il est */
  if(!e.coffreOuvert&&e.coffre){
    const cx=e.coffre[0]-camX, cy=e.coffre[1]-camY;
    const dehors=cx<6||cy<10||cx>VW-6||cy>VH-6;
    if(dehors){
      const ax=Math.max(10,Math.min(VW-10,cx)), ay=Math.max(16,Math.min(VH-14,cy));
      const a=Math.atan2(cy-VH/2,cx-VW/2);
      ctx.save();ctx.translate(ax,ay);ctx.rotate(a);
      ctx.fillStyle='#c9a24a';
      ctx.fillRect(-5,-2,7,4);
      ctx.beginPath();ctx.moveTo(2,-5);ctx.lineTo(8,0);ctx.lineTo(2,5);ctx.fill();
      ctx.restore();
    }else{
      const h=Math.round(Math.sin(Date.now()/300)*2);
      ctx.fillStyle='#c9a24a';
      ctx.beginPath();
      ctx.moveTo(cx-4,cy-30+h);ctx.lineTo(cx+4,cy-30+h);ctx.lineTo(cx,cy-24+h);ctx.fill();
    }
  }

  if(LISIERE_SUD)ctx.drawImage(LISIERE_SUD,camX,camY,lw,lh,0,0,lw,lh);
}


/* ================= LE PERSONNAGE, GRAVÉ =================
   AVANT : 114 traits redessinés à chaque image, par personne. À sept, plus
   de 800 traits rien que pour les joueurs.
   MAINTENANT : les poses sont gravées à la demande — quatre directions, une
   pose immobile et six images de marche — puis recopiées. Une recopie par
   personne au lieu de 114 traits.
   Pendant un geste (pioche, hache, cueillette) on redessine comme avant :
   ce sont des mouvements continus, pas des poses, et ça ne dure qu'un instant. */
const PASM=6;                         /* six images pour un cycle de marche */
const CASE_L=64, CASE_H=80;           /* la boîte d'une pose */
const POSES=new Map();                /* une planche par apparence rencontrée */
const clePose=(ap)=>{
  let c='';for(const k in ap)c+=ap[k]+',';
  return c;
};
function planche(ap){
  const cle=clePose(ap);
  let P=POSES.get(cle);
  if(!P){
    if(POSES.size>9)POSES.clear();     /* on ne garde pas les partis */
    P={cle,dirs:{}};POSES.set(cle,P);
  }
  return P;
}
function poseDe(ap,dir,i){
  const P=planche(ap);
  let L=P.dirs[dir];
  if(!L){L=P.dirs[dir]=[];}
  if(L[i])return L[i];
  /* on ne grave que la pose qu'on demande : rien n'est gravé pour rien */
  const c=document.createElement('canvas');
  const D=Math.max(1,Math.min(3,Math.floor(window.devicePixelRatio||1)));
  c.width=CASE_L*D;c.height=CASE_H*D;
  const g=c.getContext('2d');
  g.setTransform(D,0,0,D,0,0);g.imageSmoothingEnabled=false;
  const sauve=GESTE;GESTE={t:0};
  sprite(g,CASE_L/2,CASE_H-10,ap,dir,i?(i-1)*(6.2832/PASM):0,i>0);
  GESTE=sauve;
  L[i]=c;
  return c;
}
/* le personnage à l'écran : une recopie si aucun geste, sinon l'ancien dessin */
function personne(g,x,y,ap,dir,pas,marche){
  if(GESTE&&GESTE.t>0){sprite(g,x,y,ap,dir,pas,marche);return;}
  const i=marche?1+(Math.floor(pas/(6.2832/PASM))%PASM):0;
  const c=poseDe(ap,dir||'bas',i);
  g.drawImage(c,Math.round(x-CASE_L/2),Math.round(y-CASE_H+10),CASE_L,CASE_H);
}

/* ================= déplacement ================= */
const VITESSE=112;                 /* pixels de jeu par seconde, à fond */
let vx=0, vy=0;                   /* vitesse actuelle, pour l'inertie */
let bloqueBord=false;

function majJoueur(dt){
  const n=Math.hypot(joyX,joyY);
  const pousse=Math.min(1,n);
  /* 1. on accélère et on freine au lieu de sauter d'un état à l'autre */
  const cibleX=n>0.16?(joyX/n)*VITESSE*pousse:0;
  const cibleY=n>0.16?(joyY/n)*VITESSE*pousse:0;
  const k=Math.min(1,dt*(n>0.16?11:16));       /* le freinage est plus vif que la relance */
  vx+=(cibleX-vx)*k;
  vy+=(cibleY-vy)*k;

  if(SOL&&bloque(joueur.x,joueur.y)){          /* jamais coincé pour de bon */
    const [dx,dy]=degager(joueur.x,joueur.y);
    joueur.x=dx;joueur.y=dy;
  }
  const v=Math.hypot(vx,vy);
  if(v>1.2){
    /* on essaie chaque axe séparément : on glisse le long des obstacles */
    const nx=joueur.x+vx*dt, ny=joueur.y+vy*dt;
    let ax=joueur.x, ay=joueur.y;
    if(!bloque(nx,joueur.y))ax=nx;
    if(!bloque(ax,ny))ay=ny;
    bloqueBord=(ax===joueur.x&&Math.abs(vx)>2)||(ay===joueur.y&&Math.abs(vy)>2);
    joueur.x=ax;joueur.y=ay;
    /* 2. la cadence suit la vitesse réelle */
    if(!bloqueBord)joueur.pas+=v*dt*0.30;
    /* 3. une zone morte : il ne se retourne que si la direction change nettement */
    const versX=Math.abs(vx)>Math.abs(vy)*1.35;
    const versY=Math.abs(vy)>Math.abs(vx)*1.35;
    if(versX)joueur.dir=vx>0?'droite':'gauche';
    else if(versY)joueur.dir=vy>0?'bas':'haut';
  }else{
    vx=vy=0;bloqueBord=false;
    /* 4. il revient à la pose debout, pieds joints */
    joueur.pas=0;
  }
  joueur.marche=v>4&&!bloqueBord;
  /* en traversant un buisson, il froisse et lâche quelques feuilles */
  if(joueur.marche&&SOL){
    for(const o of DECOR){
      if(o.t!=='buisson')continue;
      if(Math.abs(o.x-joueur.x)>14||Math.abs(o.y-joueur.y)>10)continue;
      if(!o.froisse||Date.now()-o.froisse>420){
        o.froisse=Date.now();o.frappe=Date.now();
        for(let i=0;i<3;i++)PARTS.push({x:o.x+(Math.random()-.5)*16,y:o.y-12,
          vx:(Math.random()-.5)*26,vy:-12-Math.random()*16,vie:.9,taille:2,
          rot:Math.random()*6,vrot:(Math.random()-.5)*8,
          c:Math.random()<.5?'#4a944a':'#3d7d3f',rebondi:false});
      }
    }
  }
  e.x=Math.round(joueur.x);e.y=Math.round(joueur.y);
}

/* ================= le joystick, flottant =================
   Il n'a pas de place fixe : il apparaît là où le pouce se pose,
   dans toute la moitié gauche de l'écran, et s'efface quand on lâche. */
const jc=$('joy'), jg=jc.getContext('2d');
let JDPR=1;
function tailleJoy(){
  JDPR=Math.max(1,Math.min(3,window.devicePixelRatio||1));
  jc.width=Math.round(window.innerWidth*JDPR);
  jc.height=Math.round(window.innerHeight*JDPR);
  jg.setTransform(JDPR,0,0,JDPR,0,0);
}
addEventListener('resize',tailleJoy);
tailleJoy();

const RAYON=52, POUCE=22;
let J={actif:false,id:null,ox:0,oy:0,x:0,y:0,vie:0};

const pointDe=t=>[t.clientX,t.clientY];
function prendre(x,y){
  const limite=window.innerHeight-96;          /* la barre du bas */
  if(y>limite)y=limite;
  J.actif=true;J.ox=x;J.oy=y;J.x=x;J.y=y;J.vie=1;
  joyX=joyY=0;
  try{navigator.vibrate&&navigator.vibrate(8);}catch(x2){}   /* un petit clic sous le doigt */
}
function tirer(x,y){
  const dx=x-J.ox, dy=y-J.oy, d=Math.hypot(dx,dy);
  const a=Math.atan2(dy,dx);
  const m=Math.min(d,RAYON);
  J.x=J.ox+Math.cos(a)*m;J.y=J.oy+Math.sin(a)*m;
  /* si le pouce s'éloigne trop, le manche se déplace avec lui */
  if(d>RAYON){J.ox=x-Math.cos(a)*RAYON;J.oy=y-Math.sin(a)*RAYON;}
  const n=Math.min(1,d/RAYON);
  joyX=d<1?0:Math.cos(a)*n;joyY=d<1?0:Math.sin(a)*n;
  if(Math.hypot(joyX,joyY)<.16)joyX=joyY=0;
}
function lacher(){J.actif=false;J.id=null;joyX=joyY=0;}

/* on n'accepte le doigt que dans la moitié gauche : la droite reste libre */
const pageOuverte=()=>$('pan').classList.contains('on')||$('sacPage').classList.contains('on')
                    ||$('page2').classList.contains('on')||!$('porte').classList.contains('parti');
/* le joystick se prend n'importe où sur la carte, des deux côtés.
   On ne l'ignore que si le doigt touche un bouton de l'interface. */
const surUnBouton=(cible)=>!!(cible&&cible.closest&&cible.closest('#barre,button,#action,#hublot,#pan,#sacPage,#page2,#porte,#bandeau,#repond'));
const zoneMarche=(x,y,cible)=>!pageOuverte()&&!surUnBouton(cible);

/* on écoute la page entière, mais on ne prend le doigt que dans la zone de marche :
   ailleurs, le toucher passe normalement aux boutons */
document.addEventListener('touchstart',ev=>{
  for(const t of ev.changedTouches){
    if(J.actif)continue;
    const [x,y]=pointDe(t);
    if(!zoneMarche(x,y,ev.target))continue;
    ev.preventDefault();
    J.id=t.identifier;prendre(x,y);
  }
},{passive:false});
document.addEventListener('touchmove',ev=>{
  for(const t of ev.changedTouches)if(t.identifier===J.id){
    ev.preventDefault();
    const [x,y]=pointDe(t);tirer(x,y);
  }
},{passive:false});
['touchend','touchcancel'].forEach(k=>document.addEventListener(k,ev=>{
  for(const t of ev.changedTouches)if(t.identifier===J.id){ev.preventDefault();lacher();}
},{passive:false}));

document.addEventListener('mousedown',ev=>{
  if(zoneMarche(ev.clientX,ev.clientY,ev.target))prendre(ev.clientX,ev.clientY);});
addEventListener('mousemove',ev=>{if(J.actif)tirer(ev.clientX,ev.clientY);});
addEventListener('mouseup',()=>{if(J.actif)lacher();});

addEventListener('keydown',ev=>{const k={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],
  z:[0,-1],s:[0,1],q:[-1,0],d:[1,0]}[ev.key];if(k){joyX=k[0];joyY=k[1];}});
addEventListener('keyup',()=>{joyX=joyY=0;});

function dessinerJoy(dt){
  /* il s'efface doucement quand on lâche */
  if(!J.actif&&J.vie>0)J.vie=Math.max(0,J.vie-dt*5);
  jg.clearRect(0,0,window.innerWidth,window.innerHeight);
  if(J.vie<=0)return;
  jg.save();
  jg.globalAlpha=J.vie;
  /* la couronne */
  jg.beginPath();jg.arc(J.ox,J.oy,RAYON,0,7);
  const f=jg.createRadialGradient(J.ox,J.oy-14,6,J.ox,J.oy,RAYON);
  f.addColorStop(0,'rgba(240,246,238,.26)');f.addColorStop(1,'rgba(200,212,198,.12)');
  jg.fillStyle=f;jg.fill();
  jg.lineWidth=2.5;jg.strokeStyle='rgba(240,246,238,.38)';jg.stroke();
  /* le sens, en léger */
  const d=Math.hypot(J.x-J.ox,J.y-J.oy);
  if(d>6){
    const a=Math.atan2(J.y-J.oy,J.x-J.ox);
    jg.beginPath();
    jg.arc(J.ox,J.oy,RAYON-2,a-0.5,a+0.5);
    jg.lineWidth=4;jg.strokeStyle='rgba(169,232,138,.5)';jg.stroke();
  }
  /* le manche */
  jg.beginPath();jg.arc(J.x,J.y+3,POUCE,0,7);jg.fillStyle='rgba(10,18,12,.22)';jg.fill();
  const k=jg.createRadialGradient(J.x-5,J.y-8,3,J.x,J.y,POUCE+1);
  if(d>6){k.addColorStop(0,'#a9e88a');k.addColorStop(1,'#3f7d4a');}
  else{k.addColorStop(0,'#f4f7f0');k.addColorStop(1,'#c9d2c2');}
  jg.beginPath();jg.arc(J.x,J.y,POUCE,0,7);jg.fillStyle=k;jg.fill();
  jg.lineWidth=2.5;jg.strokeStyle=d>6?'#2c6b32':'rgba(40,50,40,.4)';jg.stroke();
  jg.restore();
}

/* ================= la mini-carte, dans son hublot =================
   AVANT : tout était redessiné dix fois par seconde — le fond, la rivière,
   les bords, et chacun des objets à portée. Près d'un bosquet, ça montait
   à 296 traits par passage, pour une image qui ne change presque jamais.
   MAINTENANT : le monde entier est gravé UNE FOIS à l'échelle du hublot.
   Chaque passage se réduit à une découpe du calque et aux seules choses qui
   bougent : toi, les autres, la boussole. */
const RAYON_VUE=230;
let mctx=null, dernierMini=0;
let MINI=null, MINI_K=1, miniSale=true;
function salirMini(){miniSale=true;}          /* à appeler quand le décor change */

function graverMini(T){
  MINI_K=T/(RAYON_VUE*2);
  const k=MINI_K, D=Math.ceil(MONDE_L*k), DH=Math.ceil(MONDE_H*k);
  const c=document.createElement('canvas');
  c.width=D;c.height=DH;
  const g=c.getContext('2d');
  g.imageSmoothingEnabled=false;
  const px=(x)=>Math.round(x*k), py=(y)=>Math.round(y*k);
  /* l'herbe, avec ses nuances */
  g.fillStyle='#7db35d';g.fillRect(0,0,D,DH);
  for(let i=0;i<90;i++){
    g.fillStyle=i%2?'#8ec96f':'#6f9e52';
    g.fillRect((alea(i*3.1)*D)|0,(alea(i*5.7)*DH)|0,6,4);
  }
  /* les chemins de terre, comme au sol */
  if(ROUTES&&ROUTES.length){
    g.fillStyle='#b9a37a';
    ROUTES.forEach(r=>r.forEach(([x,y])=>g.fillRect(px(x)-2,py(y)-2,5,5)));
  }
  /* la rivière et les ponts */
  for(let yy=0;yy<MONDE_H;yy+=2){
    g.fillStyle=surPont(yy)?'#8a6238':'#3a83a4';
    g.fillRect(px(rivX(yy)-RIV_LARGE),py(yy),Math.round(RIV_LARGE*2*k)+1,Math.ceil(2*k)+1);
  }
  /* la forêt du pourtour */
  g.fillStyle='#3d6b34';
  const b=Math.round(BARRIERE*k);
  g.fillRect(0,0,D,b);g.fillRect(0,DH-b,D,b);
  g.fillRect(0,0,b,DH);g.fillRect(D-b,0,b,DH);
  /* et tout le décor qui ne bouge pas */
  for(const o of DECOR){
    const x=px(o.x), y=py(o.y);
    if(o.t==='arbre'){g.fillStyle='#4a7d3f';
      g.beginPath();g.arc(x,y-2,[7,8,10][o.gr||0],0,7);g.fill();}
    else if(o.t==='rocher'){g.fillStyle='#9aa2a8';g.fillRect(x-4,y-4,8,7);}
    else if(o.t==='buisson'){g.fillStyle='#d9576b';
      g.beginPath();g.arc(x,y-2,4,0,7);g.fill();}
    else if(o.t==='roseaux'){g.fillStyle='#5e8a47';g.fillRect(x-3,y-3,6,6);}
    else if(o.t==='argile'){g.fillStyle='#a85039';g.fillRect(x-3,y-2,6,5);}
    else if(o.t==='souche'||o.t==='gravats'){g.fillStyle='#8a7a62';g.fillRect(x-3,y-2,6,4);}
    else if(o.t==='casino'){
      g.fillStyle='#c9a24a';g.fillRect(x-11,y-9,22,11);
      g.fillStyle='#f0cf7d';g.fillRect(x-11,y-9,22,3);
      g.fillStyle='#3d2a17';g.fillRect(x-2,y-4,4,6);}
    else if(o.t==='forge'){
      g.fillStyle='#8a6238';g.fillRect(x-10,y-8,20,10);
      g.fillStyle='#c17a3c';g.fillRect(x-10,y-8,20,3);}
    else if(o.t==='mine'){
      g.fillStyle='#5b5148';g.fillRect(x-6,y-5,12,9);
      g.fillStyle='#0d0a08';g.fillRect(x-3,y-3,6,7);
      g.fillStyle='#c9a24a';g.fillRect(x-6,y-7,12,2);}
    else if(o.t==='coffre'){g.fillStyle='#f0cf7d';g.fillRect(x-5,y-5,10,8);
      g.strokeStyle='#8a6a2a';g.lineWidth=1.5;g.strokeRect(x-5,y-5,10,8);}
  }
  /* --- les lieux, marqués par-dessus tout ---
     C'est ce qui manquait le plus : sans eux, on lit le terrain mais on ne
     sait pas où aller. Chacun a sa couleur, une ombre portée et un liseré. */
  const REPERES=[[CAMP_FIXE,'#e8dcc0'],[FORGE_FIXE,'#c17a3c'],[CASINO_FIXE,'#c9a24a'],
                 [MINE_FIXE,'#8b939a'],[COFFRE_FIXE,'#f0cf7d']];
  REPERES.forEach(([L,col])=>{
    const x=px(L[0]), y=py(L[1]);
    g.fillStyle='rgba(0,0,0,.35)';g.fillRect(x-6,y-6,12,12);
    g.fillStyle=col;g.fillRect(x-5,y-5,10,10);
    g.fillStyle='rgba(255,255,255,.45)';g.fillRect(x-5,y-5,10,3);
  });
  MINI=c;miniSale=false;
}
function dessinerMini(){
  const c=$('mini');if(!c||!c.getContext)return;
  if(!mctx){mctx=c.getContext('2d');mctx.imageSmoothingEnabled=false;}
  const g=mctx, T=c.width;
  if(!MINI||miniSale||Math.abs(MINI_K-T/(RAYON_VUE*2))>0.001)graverMini(T);
  const k=MINI_K;
  /* la découpe du calque, centrée sur toi : UNE recopie */
  const sx=joueur.x*k-T/2, sy=joueur.y*k-T/2;
  g.fillStyle='#3d6b34';g.fillRect(0,0,T,T);        /* au-delà du monde */
  const dx=Math.max(0,-sx), dy=Math.max(0,-sy);
  const sx2=Math.max(0,sx), sy2=Math.max(0,sy);
  const w=Math.min(T-dx,MINI.width-sx2), h=Math.min(T-dy,MINI.height-sy2);
  if(w>0&&h>0)g.drawImage(MINI,sx2,sy2,w,h,dx,dy,w,h);
  const px=(x)=>Math.round((x-joueur.x)*k+T/2);
  const py=(y)=>Math.round((y-joueur.y)*k+T/2);
  /* les buissons cueillis : les seuls objets dont l'état change */
  for(const o of DECOR){
    if(o.t!=='buisson'||!o.cueilli||Date.now()-o.cueilli>240000)continue;
    if(Math.abs(o.x-joueur.x)>RAYON_VUE||Math.abs(o.y-joueur.y)>RAYON_VUE)continue;
    g.fillStyle='#5e9e4a';
    g.beginPath();g.arc(px(o.x),py(o.y)-2,4,0,7);g.fill();
  }
  /* la boussole */
  g.strokeStyle='rgba(255,255,255,.32)';g.lineWidth=2;
  g.beginPath();
  g.moveTo(T/2,4);g.lineTo(T/2,16);g.moveTo(T/2,T-16);g.lineTo(T/2,T-4);
  g.moveTo(4,T/2);g.lineTo(16,T/2);g.moveTo(T-16,T/2);g.lineTo(T-4,T/2);
  g.stroke();
  /* les autres survivants : à portée on les pose, au loin on les colle au bord */
  for(const [,a] of AUTRES){
    const ex=a.x-joueur.x, ey=a.y-joueur.y, d=Math.hypot(ex,ey);
    let ax,ay,loin=false;
    if(d<RAYON_VUE-14){ax=px(a.x);ay=py(a.y);}
    else{loin=true;const k2=(T/2-14)/d;ax=T/2+ex*k2;ay=T/2+ey*k2;}
    g.fillStyle='rgba(127,216,232,.25)';g.beginPath();g.arc(ax,ay,11,0,7);g.fill();
    g.fillStyle='#7fd8e8';g.beginPath();g.arc(ax,ay,5.5,0,7);g.fill();
    g.strokeStyle='#fff';g.lineWidth=2;g.stroke();
    if(loin){
      const a2=Math.atan2(ey,ex);
      g.save();g.translate(ax,ay);g.rotate(a2);
      g.fillStyle='#7fd8e8';
      g.beginPath();g.moveTo(9,0);g.lineTo(3,-5);g.lineTo(3,5);g.closePath();g.fill();
      g.restore();
    }
  }
  /* toi, au centre */
  g.fillStyle='rgba(255,255,255,.14)';
  g.beginPath();g.arc(T/2,T/2,20,0,7);g.fill();
  g.fillStyle='#c8434f';
  g.beginPath();g.arc(T/2,T/2,9,0,7);g.fill();
  g.strokeStyle='#fff';g.lineWidth=3;g.stroke();
  const d2={bas:[0,1],haut:[0,-1],gauche:[-1,0],droite:[1,0]}[joueur.dir]||[0,1];
  g.fillStyle='#fff';
  g.beginPath();
  g.moveTo(T/2+d2[0]*22,T/2+d2[1]*22);
  g.lineTo(T/2+d2[0]*11-d2[1]*8,T/2+d2[1]*11+d2[0]*8);
  g.lineTo(T/2+d2[0]*11+d2[1]*8,T/2+d2[1]*11-d2[0]*8);
  g.fill();
}

/* ================= petites fonctions d'aisance ================= */
const doux    =t=>t*t*(3-2*t);                 /* départ et arrivée adoucis */
const sortRap =t=>1-Math.pow(1-t,3);           /* part vite, finit lentement */
const entreRap=t=>t*t*t;                       /* part lentement, finit vite */
const rebond  =t=>{const n=7.5625,d=2.75;
  if(t<1/d)return n*t*t;
  if(t<2/d){t-=1.5/d;return n*t*t+.75;}
  if(t<2.5/d){t-=2.25/d;return n*t*t+.9375;}
  t-=2.625/d;return n*t*t+.984375;};

/* ================= la fluidité =================
   Trois choses : on ne recalcule pas ce qui ne change pas,
   on ne dessine pas ce qu'on ne voit pas, et si le téléphone
   peine, on allège tout seul. */
let QUALITE=1;                 /* 1 = tout, 0.5 = allégé, 0 = l'essentiel */
let msMoyen=16, imagesLentes=0, imagesRapides=0;

/* ================= LE COMPTEUR D'IMAGES =================
   Mon banc d'essai mesure du javascript ; ton téléphone a un vrai canevas et
   un vrai GPU. Tant qu'on n'a pas le chiffre sur ton écran, on devine.
   Trois touches rapides sur le bandeau du haut l'allument ou l'éteignent. */
const PERF={on:false,pose:false,n:0,depuis:0,pire:0,traits:0,derniers:[],objets:0};
/* Le compteur reste dans le jeu, éteint. Trois touches rapides en haut de
   l'écran le rallument quand on veut mesurer quelque chose. */
function brancherPerf(){
  if(!PERF.on||ctx.__vraiFill)return;
  ctx.__vraiFill=ctx.fillRect.bind(ctx);
  ctx.__vraiCopie=ctx.drawImage.bind(ctx);
  ctx.fillRect=function(a,b,c,d){PERF.traits++;return ctx.__vraiFill(a,b,c,d);};
  ctx.drawImage=function(){PERF.traits++;return ctx.__vraiCopie.apply(ctx,arguments);};
}
function basculerPerf(){
  PERF.on=!PERF.on;
  $('perf').classList.toggle('on',PERF.on);
  if(PERF.on){
    PERF.depuis=performance.now();PERF.n=0;PERF.pire=0;PERF.derniers=[];
    /* on ne compte les traits QUE quand le compteur est allumé :
       le comptage lui-même coûterait sinon plus cher que ce qu'il mesure */
    if(!ctx.__vraiFill){
      ctx.__vraiFill=ctx.fillRect.bind(ctx);
      ctx.__vraiCopie=ctx.drawImage.bind(ctx);
      ctx.fillRect=function(a,b,c,d){PERF.traits++;return ctx.__vraiFill(a,b,c,d);};
      ctx.drawImage=function(){PERF.traits++;return ctx.__vraiCopie.apply(ctx,arguments);};
    }
  }else if(ctx.__vraiFill){
    ctx.fillRect=ctx.__vraiFill;ctx.drawImage=ctx.__vraiCopie;
    ctx.__vraiFill=null;ctx.__vraiCopie=null;
  }
  try{navigator.vibrate&&navigator.vibrate(14);}catch(x){}
}
function majPerf(ms){
  if(!PERF.on)return;
  if(!PERF.pose){PERF.pose=true;$('perf').classList.add('on');}
  PERF.n++;
  PERF.derniers.push(ms);
  if(PERF.derniers.length>120)PERF.derniers.shift();
  if(ms>PERF.pire)PERF.pire=ms;
  const t=performance.now();
  if(t-PERF.depuis<500)return;
  const fps=Math.round(PERF.n*1000/(t-PERF.depuis));
  const tri=PERF.derniers.slice().sort((a,b)=>a-b);
  const median=tri[tri.length>>1]||0;
  const p95=tri[Math.floor(tri.length*0.95)]||0;
  $('perf').innerHTML=
    '<b>'+fps+'</b> images/s\n'+
    'milieu  '+median.toFixed(1)+' ms\n'+
    'lentes  <u>'+p95.toFixed(1)+' ms</u>\n'+
    'pire    '+PERF.pire.toFixed(1)+' ms\n'+
    'traits  '+PERF.traits+'\n'+
    'objets  '+PERF.objets+'\n'+
    'qualité '+QUALITE;
  PERF.depuis=t;PERF.n=0;PERF.pire=0;
}
/* trois touches rapides sur le bandeau du haut */
(function(){
  let n=0,quand=0;
  const touche=(y)=>{
    if(y>220)return;                    /* le haut de l'écran, largement */
    const t=Date.now();
    n=(t-quand<700)?n+1:1;quand=t;
    if(n>=3){n=0;basculerPerf();}
  };
  /* Le joystick appelle preventDefault sur touchstart : les événements
     pointer ne naissent donc jamais. On écoute le toucher directement.
     ATTENTION : sur téléphone, un toucher peut aussi produire un mousedown
     de compatibilité — sans garde, chaque touche comptait DEUX fois et le
     compteur s'allumait puis s'éteignait aussitôt. */
  const pan=$('perf');
  if(pan)pan.addEventListener('touchstart',(ev)=>{
    ev.stopPropagation();basculerPerf();
  },{passive:true});
  let dernierToucher=0;
  addEventListener('touchstart',(ev)=>{
    dernierToucher=Date.now();
    const t=ev.touches&&ev.touches[0];if(t)touche(t.clientY);
  },{capture:true,passive:true});
  addEventListener('mousedown',(ev)=>{
    if(Date.now()-dernierToucher<900)return;      /* c'est l'écho du toucher */
    touche(ev.clientY);
  },true);
})();

function mesurer(ms){
  msMoyen=msMoyen*0.9+ms*0.1;
  if(msMoyen>26){
    imagesLentes++;imagesRapides=0;
    if(imagesLentes>40&&QUALITE>0){QUALITE=QUALITE===1?0.5:0;imagesLentes=0;}
  }else if(msMoyen<15){
    imagesRapides++;imagesLentes=0;
    if(imagesRapides>240&&QUALITE<1){QUALITE=QUALITE===0?0.5:1;imagesRapides=0;}
  }
}

/* les dégradés coûtent cher : on les fabrique une fois */
const CACHE={};
function degradeAmbiance(g){
  const cle='amb'+VW+'x'+VH;
  if(!CACHE[cle]){
    const d=g.createRadialGradient(VW/2,VH*0.42,VH*0.2,VW/2,VH*0.5,VH*0.78);
    d.addColorStop(0,'rgba(255,248,214,.07)');
    d.addColorStop(1,'rgba(10,24,8,.26)');
    CACHE[cle]=d;
  }
  return CACHE[cle];
}
function degradeNuage(g,rx,a){
  const cle='n'+Math.round(rx)+'_'+a.toFixed(2);
  if(!CACHE[cle]){
    /* un dégradé centré en 0 : on le déplace ensuite avec la caméra */
    const d=g.createRadialGradient(0,0,rx*0.2,0,0,rx);
    d.addColorStop(0,'rgba(24,44,18,'+a+')');
    d.addColorStop(1,'rgba(24,44,18,0)');
    CACHE[cle]=d;
  }
  return CACHE[cle];
}
function videCache(){for(const k in CACHE)delete CACHE[k];}

/* on borne le nombre de particules : au-delà, les plus vieilles s'effacent */
const MAX_PARTS=240;
function bornerParts(){
  if(PARTS.length>MAX_PARTS)PARTS.splice(0,PARTS.length-MAX_PARTS);
}

/* ================= le vent, la lumière et la vie =================
   Rien de tout cela ne change le jeu : ça le rend seulement vivant. */
let VENT=0, VENT_RAF=0;
function majVent(dt){
  const t=Date.now()/1000;
  /* deux souffles superposés : un lent, une risée plus vive */
  VENT=Math.sin(t*0.45)*1.6+Math.sin(t*1.31+1.2)*0.7;
  VENT_RAF=Math.max(0,Math.sin(t*0.21-0.6))*Math.sin(t*2.7)*1.1;
}
/* de combien penche ce qui est planté ici */
const penche=(x,y,force)=>
  (VENT+VENT_RAF)*force*(0.7+alea((x*7+y*13)%997)*0.6);

/* ---- les nuages : on ne voit que leur ombre glisser sur le sol ---- */
const NUAGES=[];
function semerNuages(){
  for(let i=0;i<7;i++)NUAGES.push({
    x:alea(i*11.3)*MONDE_L, y:alea(i*17.7)*MONDE_H,
    rx:70+alea(i*5.1)*90, ry:44+alea(i*7.9)*56,
    v:5+alea(i*3.3)*7, a:0.07+alea(i*13.1)*0.06});
}
function majNuages(dt){
  NUAGES.forEach(n=>{
    n.x+=n.v*dt;n.y+=n.v*dt*0.26;
    if(n.x-n.rx>MONDE_L+120){n.x=-160;n.y=alea(n.ry*7)*MONDE_H;}
    if(n.y-n.ry>MONDE_H+120)n.y=-160;
  });
}
function dessinerNuages(g,camX,camY){
  g.save();
  NUAGES.forEach(n=>{
    const x=n.x-camX, y=n.y-camY;
    if(x+n.rx<-40||y+n.ry<-40||x-n.rx>VW+40||y-n.ry>VH+40)return;
    g.save();g.translate(x,y);
    g.fillStyle=degradeNuage(g,n.rx,n.a);
    g.beginPath();g.ellipse(0,0,n.rx,n.ry,0,0,7);g.fill();
    g.restore();
  });
  g.restore();
}

/* ---- les papillons, autour des massifs de fleurs ---- */
const PAPILLONS=[];
function semerPapillons(){
  const fleurs=DECOR.filter(o=>o.t==='fleurs');
  for(let i=0;i<10&&fleurs.length;i++){
    const f=fleurs[Math.floor(alea(i*23.1)*fleurs.length)];
    PAPILLONS.push({x:f.x,y:f.y,bx:f.x,by:f.y,
      p:alea(i*3.7)*6.28, v:0.6+alea(i*9.1)*0.5,
      r:14+alea(i*5.3)*22, c:alea(i*7.1)<0.5?'#f6e7a0':'#e8b8e0'});
  }
}
function majPapillons(dt){
  const t=Date.now()/1000;
  PAPILLONS.forEach((p,i)=>{
    p.p+=dt*p.v;
    p.x=p.bx+Math.cos(p.p)*p.r+Math.sin(t*2.1+i)*4;
    p.y=p.by+Math.sin(p.p*1.3)*p.r*0.5+Math.cos(t*1.7+i)*3;
  });
}
function dessinerPapillons(g,camX,camY){
  const t=Date.now()/1000;
  PAPILLONS.forEach((p,i)=>{
    const x=Math.round(p.x-camX), y=Math.round(p.y-camY-14);
    if(x<-8||y<-8||x>VW+8||y>VH+8)return;
    const bat=Math.sin(t*11+i)>0;                /* les ailes battent */
    g.fillStyle=p.c;
    if(bat){g.fillRect(x-2,y,2,2);g.fillRect(x+1,y,2,2);}
    else{g.fillRect(x-2,y+1,2,1);g.fillRect(x+1,y+1,2,1);}
    g.fillStyle='rgba(60,50,30,.7)';g.fillRect(x,y,1,2);
  });
}

/* ---- la poussière sous les pas ---- */
let pasPrec=0;

/* ---- les reflets qui glissent sur la rivière ---- */
function refletsRiviere(g,camX,camY){
  const t=Date.now()/1000;
  g.save();g.globalAlpha=.18;g.fillStyle='#dff4ff';
  for(let i=0;i<26;i++){
    const yy=((i*79+t*13)%MONDE_H);
    if(yy<camY-20||yy>camY+VH+20)continue;
    const cx=rivX(yy);
    if(surPont(yy))continue;
    const dx=Math.sin(t*1.7+i)*RIV_LARGE*0.5;
    g.fillRect(Math.round(cx+dx-camX),Math.round(yy-camY),Math.round(3+alea(i)*5),1);
  }
  g.restore();
}

/* ---- une lueur douce vers le centre de l'écran ---- */
function ambiance(g){

/* ================= la sauvegarde en ligne =================
   Tout ce qui compte — le sac, les jetons, les outils, le score —
   part sur le serveur. On peut changer de téléphone, vider son
   navigateur : la partie est retrouvée. */
const A_GARDER=['sac','jetons','euros','outils','sacMax','score','recolte','casses','epee',
                'four','habitCasino','ap','pseudo','x','y','coffreOuvert'];
let derniereSauv=0, sauvEnVol=false, sauvSale=false;

function etatAGarder(){
  const o={};
  A_GARDER.forEach(k=>{if(e[k]!==undefined)o[k]=e[k];});
  o.quand=Date.now();
  return o;
}
/* on marque la partie comme « à envoyer » ; l'envoi part peu après */
function aSauver(){sauvSale=true;}

async function envoyerSauvegarde(force){
  if(!e.id||sauvEnVol)return;
  const now=Date.now();
  if(!force&&(!sauvSale||now-derniereSauv<12000))return;
  sauvEnVol=true;derniereSauv=now;sauvSale=false;
  try{
    await fetch(URL_SB+'/rest/v1/sauvegardes',{method:'POST',
      headers:Object.assign({},sbEntetes,{Prefer:'resolution=merge-duplicates,return=minimal'}),
      body:JSON.stringify([{id:e.id,etat:etatAGarder(),maj:new Date().toISOString()}])});
  }catch(x){sauvSale=true;}
  sauvEnVol=false;
}

/* au démarrage : on compare ce qu'il y a sur le serveur et sur le téléphone */
async function recupererSauvegarde(){
  if(!e.id)return;
  try{
    const r=await fetch(URL_SB+'/rest/v1/sauvegardes?id=eq.'+encodeURIComponent(e.id)+
      '&select=etat,maj',{headers:sbEntetes});
    const d=await r.json();
    if(!Array.isArray(d)||!d[0]||!d[0].etat)return;
    const dist=d[0].etat;
    const local=(()=>{try{return JSON.parse(localStorage.getItem(CLE)||'{}');}catch(x){return {};}})();
    const qLocal=local.quand||0, qDist=dist.quand||0;
    /* Règle : on ne remplace jamais une partie locale plus avancée.
       Le score et la récolte ne baissent jamais : ils mesurent l'avancement. */
    const avanceL=(local.score||0)+(local.recolte||0);
    const avanceD=(dist.score||0)+(dist.recolte||0);
    const prendre=avanceD>avanceL||(qDist>qLocal&&avanceD>=avanceL);
    if(prendre){
      A_GARDER.forEach(k=>{if(dist[k]!==undefined)e[k]=dist[k];});
      if(e.ap)e.ap=Object.assign({},DEF_AP,e.ap);
      if(!e.sac)e.sac={};
      if(!e.outils)e.outils={};
      if(!e.casses)e.casses=[];
      joueur.x=e.x||joueur.x;joueur.y=e.y||joueur.y;
      sauver();
    }
  }catch(x){}
}

/* ================= le village : une rue et ses maisons =================
   La chaussée et les bords sont dessinés par le jeu, pas stockés.
   Seules les maisons des joueurs viennent du serveur. */

/* la chaussée, peinte une fois dans le sol */

/* ================= le monde partagé =================
   Ce que l'un casse ou cueille disparaît chez tous les autres.
   Le direct passe par le canal, la base garde la trace pour ceux
   qui arrivent après. */
const CUEILLI=new Map();                        /* clé → heure de la cueillette */
const REPOUSSE={cueillette:210000, buisson:240000, resine:180000};

/* On note ce qui a été cassé — une seule fois chacun.
   Sans ça, la liste grossissait à chaque récolte et partait
   en entier sur le serveur à chaque sauvegarde. */
function noterCasse(cle){
  if(!e.casses)e.casses=[];
  if(e.casses.indexOf(cle)<0)e.casses.push(cle);
  if(e.casses.length>900)e.casses.splice(0,e.casses.length-900);
}
function cleDe(o){
  if(o.cle)return o.cle;                        /* la clé de la carte du serveur */
  const p={rocher:'r',arbre:'a',fer:'m',cuivre:'m',charbon:'m',
           buisson:'b',resine:'s'}[o.t]||'c';
  return p+o.x+','+o.y;
}

/* ================= la carte vient du serveur =================
   Les arbres, les filons et les buissons ne sont plus tirés au sort
   sur le téléphone : c'est la base qui dit ce qu'il y a, et où. */
let CARTE_RECUE=false;
async function chargerLaCarte(){
  try{
    const r=await fetch(URL_SB+'/rest/v1/carte?select=cle,genre,x,y,gr&limit=500',
      {headers:sbEntetes});
    const d=await r.json();
    if(!Array.isArray(d)||!d.length)return false;
    /* on garde ce qui n'est pas une ressource : ponts, bâtiments, coffre */
    /* le panneau vient de la carte du serveur : on retire celui qu'on avait posé
       en attendant, sinon il y en aurait deux. */
    const garder=['pont','casino','mine','forge','coffre','comptoir','panneau','souche','gravats'];
    DECOR=DECOR.filter(o=>garder.includes(o.t));invaliderGrille();
    d.forEach(m=>{
      if(m.genre==='panneau'||m.genre==='comptoir')return;   /* retirés du jeu */
      DECOR.push({t:m.genre,x:m.x,y:m.y,gr:m.gr||0,cle:m.cle});
    });
    DECOR.sort((a,b)=>a.y-b.y);invaliderGrille();
    CARTE_RECUE=true;
    appliquerLeMonde();
    const [dx,dy]=degager(joueur.x,joueur.y);
    joueur.x=dx;joueur.y=dy;
    return true;
  }catch(x){return false;}
}
/* une ligne de la table monde, appliquée tout de suite */
function appliquerLigneMonde(m){
  if(!m||!m.cle)return;
  if(m.par===e.id)return;                        /* c'est nous, c'est déjà fait */
  const t=m.quand?new Date(m.quand).getTime():Date.now();
  const duree=REPOUSSE[m.genre];
  if(duree){
    if(Date.now()-t>duree)return;                /* ça a déjà repoussé */
    CUEILLI.set(m.cle,t);
  }else noterCasse(m.cle);
  appliquerLeMonde();
}

async function chargerLeMonde(){
  try{
    const r=await fetch(URL_SB+'/rest/v1/monde?select=cle,genre,quand&limit=2000',
      {headers:sbEntetes});
    const d=await r.json();
    if(!Array.isArray(d))return;
    const maintenant=Date.now();
    d.forEach(m=>{
      const t=new Date(m.quand).getTime();
      const duree=REPOUSSE[m.genre];
      if(duree&&maintenant-t>duree)return;       /* ça a déjà repoussé */
      if(duree)CUEILLI.set(m.cle,t);
      else noterCasse(m.cle);
    });
    appliquerLeMonde();
  }catch(x){}
}
/* on enlève de la carte ce qui n'y est plus */
function appliquerLeMonde(){
  const casses=new Set(e.casses||[]);
  let change=false;
  for(let i=DECOR.length-1;i>=0;i--){
    const o=DECOR[i];
    const c=cleDe(o);
    if(['rocher','fer','cuivre','charbon'].includes(o.t)&&casses.has(c)){
      DECOR.splice(i,1);invaliderGrille();
      poserDansLeDecor({t:'gravats',x:o.x,y:o.y,gr:0});change=true;
    }else if(o.t==='arbre'&&casses.has(c)){
      DECOR.splice(i,1);invaliderGrille();
      poserDansLeDecor({t:'souche',x:o.x,y:o.y,gr:0});change=true;
    }else if(CUEILLI.has(c)&&!o.cueilli){
      o.cueilli=CUEILLI.get(c);change=true;
    }
  }
  if(change)DECOR.sort((a,b)=>a.y-b.y);invaliderGrille();
}

/* Quand on récolte, c'est le serveur qui tranche : il vérifie que la

function signalerLeMonde(o,genre,quoi){

          body:JSON.stringify([{cle,genre,quand:new Date().toISOString(),par:e.id}])});

/* ================= les autres survivants, en temps réel =================
   On passe par un canal ouvert en permanence (websocket) : la position
   part 10 fois par seconde et arrive chez les autres en quelques
   dizaines de millisecondes. La base ne sert plus qu'à retrouver
   ceux qui étaient déjà là quand on arrive. */
let CANAL=null, dernierBip=0;
function ouvrirCanal(){
  if(CANAL||!e.id||!SB_PRET||!sb)return;
  CANAL=sb.channel('terrain',{config:{broadcast:{self:false}}});
  CANAL.on('broadcast',{event:'pos'},({payload:p})=>{
    if(!p||p.id===e.id)return;
    const a=AUTRES.get(p.id)||{x:p.x,y:p.y,pas:0,marche:false,gesteT:0};
    /* On mesure sa vitesse entre deux messages : ça permet de
       deviner où il est vraiment, malgré le temps de transport. */
    const now=Date.now();
    if(a.cx!==undefined&&a.recu){
      const ecoule=Math.max(0.03,Math.min(0.5,(now-a.recu)/1000));
      const nvx=(p.x-a.cx)/ecoule, nvy=(p.y-a.cy)/ecoule;
      /* on lisse, pour ne pas s'emballer sur un paquet en retard */
      a.vx=(a.vx||0)*0.45+nvx*0.55;
      a.vy=(a.vy||0)*0.45+nvy*0.55;
      if(Math.hypot(a.vx,a.vy)>150){const k=150/Math.hypot(a.vx,a.vy);a.vx*=k;a.vy*=k;}
    }
    a.recu=now;
    a.id=p.id;a.cx=p.x;a.cy=p.y;a.dirEnvoyee=p.d;
    a.ap=p.ap||a.ap||{};
    a.pseudo=p.n||a.pseudo||'survivant';
    if(p.g&&p.g!==a.geste)a.gesteT=1;
    a.geste=p.g;a.vu=Date.now();
    AUTRES.set(p.id,a);
  });
  CANAL.on('broadcast',{event:'sortie'},({payload:p})=>{
    if(p&&p.id)AUTRES.delete(p.id);
  });
  CANAL.on('broadcast',{event:'dit'},({payload:p})=>{
    if(!p||p.id===e.id)return;
    const dit=String(p.txt||'').slice(0,48);
    BULLES.set(p.id,{txt:dit,jusqua:Date.now()+6000,ne:Date.now()});
    auFil(String(p.n||'un survivant').slice(0,18),dit,false,'#7fd8e8');
  });
  CANAL.on('broadcast',{event:'monde'},({payload:p})=>{
    if(!p||!p.cle)return;
    if(REPOUSSE[p.genre])CUEILLI.set(p.cle,p.quand||Date.now());
    else noterCasse(p.cle);
    appliquerLeMonde();
  });
  /* Realtime : on écoute la table elle-même. Un joueur qui casse un
     rocher depuis n'importe où le fait disparaître ici dans la seconde,
     même s'il n'est pas sur le même canal. */
  CANAL.on('postgres_changes',
    {event:'INSERT',schema:'public',table:'monde'},
    ({new:m})=>appliquerLigneMonde(m));
  CANAL.on('postgres_changes',
    {event:'UPDATE',schema:'public',table:'monde'},
    ({new:m})=>appliquerLigneMonde(m));
  CANAL.on('postgres_changes',
    {event:'DELETE',schema:'public',table:'monde'},
    ({old:m})=>{ if(m&&m.cle){CUEILLI.delete(m.cle);
      e.casses=(e.casses||[]).filter(c=>c!==m.cle);
      preparerMonde();appliquerLeMonde();} });
  CANAL.subscribe(st=>{if(st==='SUBSCRIBED'){bipPosition(true);chargerLeMonde();}});
}
function bipPosition(force){
  if(!CANAL||!e.id)return;
  const now=Date.now();
  if(!force&&now-dernierBip<100)return;           /* 10 fois par seconde */
  dernierBip=now;
  CANAL.send({type:'broadcast',event:'pos',payload:{
    id:e.id,n:e.pseudo||'survivant',ap:e.ap,
    x:Math.round(joueur.x),y:Math.round(joueur.y),d:joueur.dir,
    g:(GESTE.t>0?(GESTE.type||'pioche'):null)}});
}

let AUTRES=new Map();
let derniereEcoute=0, envoiRapide=0;

async function ecouterLesAutres(){
  if(!e.id)return;
  try{
    /* on prend les 40 dernières lignes, et on juge la fraîcheur les unes
       par rapport aux autres : l'horloge du téléphone peut être décalée. */
    const r=await fetch(URL_SB+'/rest/v1/joueurs'+
      '?select=id,pseudo,apparence,x,y,dir,geste,lieu,maj&order=maj.desc&limit=40',
      {headers:sbEntetes});
    const d=await r.json();
    if(!Array.isArray(d)||!d.length)return;
    const tMax=Math.max(...d.map(j=>new Date(j.maj).getTime()));
    const FRAIS=60000;                              /* une minute de tolérance */
    const vus=new Set();
    d.forEach(j=>{
      if(j.id===e.id)return;
      if(tMax-new Date(j.maj).getTime()>FRAIS)return;   /* trop vieux : il est parti */
      if(j.lieu==='casino')return;                      /* il est à l'intérieur */
      vus.add(j.id);
      const a=AUTRES.get(j.id)||{x:j.x,y:j.y,pas:0,marche:false,gesteT:0};
      a.id=j.id;a.cx=j.x;a.cy=j.y;
      a.ap=j.apparence||{};
      a.pseudo=j.pseudo||'survivant';
      if(j.geste&&j.geste!==a.geste)a.gesteT=1;
      a.geste=j.geste;
      a.vu=Date.now();
      AUTRES.set(j.id,a);
    });
    for(const [id,a] of AUTRES)if(!vus.has(id)&&Date.now()-a.vu>12000)AUTRES.delete(id);
  }catch(x){}
}

function majAutres(dt){
  const now=Date.now();
  for(const [,a] of AUTRES){
    if(a.cx===undefined)continue;
    /* Le message a mis du temps à venir : pendant ce temps l'autre a
       continué de marcher. On avance donc sa cible d'autant. */
    let bx=a.cx, by=a.cy;
    if(a.vx||a.vy){
      const age=Math.min(0.30,Math.max(0,(now-(a.recu||now))/1000)+0.09);
      bx+=a.vx*age;by+=a.vy*age;
    }
    const dx=bx-a.x, dy=by-a.y, d=Math.hypot(dx,dy);
    if(d>1){
      const v=Math.min(d,Math.max(95,d*9)*dt);   /* il glisse vite vers sa vraie place */
      a.x+=dx/d*v;a.y+=dy/d*v;
      a.pas+=v*0.34;a.marche=true;
      a.dir=a.dirEnvoyee||a.dir||'bas';
      if(!a.dirEnvoyee&&d>3){
        if(Math.abs(dx)>Math.abs(dy)*1.2)a.dir=dx>0?'droite':'gauche';
        else a.dir=dy>0?'bas':'haut';
      }
    }else{a.marche=false;a.pas=0;}
    if(now-(a.recu||0)>400){a.vx=0;a.vy=0;}   /* plus de nouvelles : on ne devine plus */
    if(a.gesteT>0)a.gesteT=Math.max(0,a.gesteT-dt*2.3);
  }
}

/* une flèche au bord de l'écran, avec le pseudo et la distance */
function flechesVersLesAutres(camX,camY){
  for(const [,a] of AUTRES){
    const x=a.x-camX, y=a.y-camY;
    if(x>-30&&y>-60&&x<VW+30&&y<VH+30)continue;   /* il est déjà à l'écran */
    const cx=VW/2, cy=VH/2;
    const dx=a.x-joueur.x, dy=a.y-joueur.y, d=Math.hypot(dx,dy);
    if(!d)continue;
    const marge=26;
    const k=Math.min((VW/2-marge)/Math.abs(dx||1e-6),(VH/2-marge)/Math.abs(dy||1e-6));
    const fx=cx+dx*k, fy=cy+dy*k, ang=Math.atan2(dy,dx);
    ctx.save();
    ctx.globalAlpha=.9;
    ctx.translate(fx,fy);
    ctx.rotate(ang);
    ctx.fillStyle='rgba(12,20,12,.55)';
    ctx.beginPath();ctx.moveTo(9,0);ctx.lineTo(-5,-7);ctx.lineTo(-5,7);ctx.closePath();ctx.fill();
    ctx.fillStyle='#7fd8e8';
    ctx.beginPath();ctx.moveTo(7,0);ctx.lineTo(-4,-5.5);ctx.lineTo(-4,5.5);ctx.closePath();ctx.fill();
    ctx.restore();
    ctx.font='700 7px ui-monospace,monospace';ctx.textAlign='center';
    const t=a.pseudo+' · '+Math.round(d)+' m';
    ctx.fillStyle='rgba(12,20,12,.6)';ctx.fillText(t,fx+1,fy-11);
    ctx.fillStyle='#dff6fa';ctx.fillText(t,fx,fy-12);
    ctx.textAlign='left';
  }
}

let GESTE={t:0,cible:null};
let PARTS=[];                                   /* éclats de pierre */
const TEINTES_PIERRE=['#a2a9b0','#8b939a','#7b8288','#5f666c'];
function eclats(x,y,n,col,force){
  const f=force||1;
  for(let i=0;i<n;i++){
    const a=Math.random()*6.283, v=(30+Math.random()*90)*f;
    PARTS.push({x,y,vx:Math.cos(a)*v,vy:-Math.abs(Math.sin(a))*v-20*f,
      vie:.7+Math.random()*.6,taille:1+Math.floor(Math.random()*3),
      rot:Math.random()*6.28,vrot:(Math.random()-.5)*14,
      c:col||TEINTES_PIERRE[Math.floor(Math.random()*4)],rebondi:false});
  }
}
function majParts(dt){
  for(let i=PARTS.length-1;i>=0;i--){
    const p=PARTS[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=220*dt;
    p.rot+=p.vrot*dt;
    p.vie-=dt*1.1;
    if(p.vy>0&&!p.rebondi&&p.vy>40&&Math.random()<dt*7){   /* un rebond au sol */
      p.vy*=-0.35;p.vx*=0.6;p.rebondi=true;
    }
    if(p.vie<=0)PARTS.splice(i,1);
  }
}

/* ce qui est à portée de main */
function cible(){
  let d0=48,res=null;
  /* les bâtiments sont larges : on élargit la fouille pour eux */
  const autour=autourDe(joueur.x,joueur.y);
  for(const o of DECOR)if((o.t==='casino'||o.t==='forge'||o.t==='comptoir')&&autour.indexOf(o)<0)autour.push(o);
  for(const o of autour){
    const cueillable=['argile','roseaux','champignons','herbes','plumes'].includes(o.t);
    const minerai=['fer','cuivre','charbon'].includes(o.t);
    const batiment=['casino','mine','forge','comptoir'].includes(o.t);
    if(o.t!=='rocher'&&o.t!=='coffre'&&o.t!=='arbre'&&o.t!=='buisson'
       &&!batiment&&!o.bati&&!cueillable&&!minerai)continue;
    if(cueillable&&o.cueilli&&Date.now()-o.cueilli<210000)continue;
    if(o.t==='buisson'&&o.cueilli&&Date.now()-o.cueilli<240000)continue;   /* repousse en 4 min */
    if(o.tombe)continue;
    /* pour un bâtiment large, on mesure la distance au MUR, pas au centre :
       sinon les portes des extrémités restent hors de portée */
    const demi=o.t==='comptoir'?118:0;
    const ecart=Math.max(0,Math.abs(o.x-joueur.x)-demi);
    const d=Math.hypot(ecart,joueur.y-o.y+6);
    const portee=(o.t==='casino'||o.t==='mine'||o.t==='forge'||o.t==='comptoir')?66:48;  /* on les voit de plus loin */
    /* un bâtiment passe avant un brin d'herbe : on ne rate pas sa porte */
    const prio=(o.t==='casino'||o.t==='mine'||o.t==='forge'||o.t==='comptoir')?0.45:1;
    const dd=d*prio;
    if(d<portee&&dd<d0){d0=dd;res=o;continue;}
  }
  return res;
}

    }else if(e.four){b.innerHTML='Retirer<small>C’EST PRÊT</small>';}
    else b.innerHTML='Allumer<small>LE FOUR</small>';
  }else if(o.t==='etabli'){
    b.innerHTML='Forger<small>L’ÉTABLI</small>';
  }else if(o.bati){
    b.innerHTML='';b.classList.remove('on');return;
  }else if(o.t==='mine'){
    b.innerHTML='Descendre<small>LA MINE</small>';
  }else if(o.t==='comptoir'){

      ({argile:'ARGILE',roseaux:'ROSEAUX',champignons:'CHAMPIGNONS',
        herbes:'HERBES',plumes:'PLUMES'})[o.t]+'</small>';
  }

}
function agir(){
  /* En fermant une fiche, le navigateur envoie parfois le clic au bouton
     qui se trouve dessous : on l'ignore pendant un demi-seconde. */
  if(pageOuverte()||Date.now()-fermeA<500)return;
  const o=cible();if(!o||GESTE.t>0)return;
  if(o.t==='coffre'){
    if(e.coffreOuvert)return;
    e.coffreOuvert=true;e.outils.pioche=true;e.outils.hache=true;e.coffreQuand=Date.now();
    sauver();majPastille();majAction();
    eclats(o.x,o.y-14,14,'#f0cf7d',1.2);
    secouer(0.35);
    texteVolant(o.x,o.y-30,'pioche !','#f0cf7d');
    setTimeout(()=>{                            /* il s'efface dans l'herbe */
      eclats(o.x,o.y-6,10,'#8a6238',0.9);
      texteVolant(o.x,o.y-20,'le coffre se referme','#c6b38a');
    },2600);
    try{navigator.vibrate&&navigator.vibrate([10,40,20]);}catch(x){}
    ouvrirPage('Le coffre','TU L’AS OUVERT',
      '<div class="recette"><span class="ic" style="width:42px;height:42px;border-radius:10px;background:#241a12;'+
      'border:1px solid #6b5136;display:flex;align-items:center;justify-content:center;flex:0 0 auto">'+
      '<svg viewBox="0 0 16 16" width="26">'+ICONES.pioche+'</svg></span>'+
      '<span class="tx"><b>Pioche</b><span>Pour les rochers. Trois coups suffisent.</span></span></div>'+
      '<div class="recette"><span class="ic" style="width:42px;height:42px;border-radius:10px;background:#241a12;'+
      'border:1px solid #6b5136;display:flex;align-items:center;justify-content:center;flex:0 0 auto">'+
      '<svg viewBox="0 0 16 16" width="26">'+ICONES.hache+'</svg></span>'+
      '<span class="tx"><b>Hache</b><span>Pour les arbres. Cinq coups, et il tombe.</span></span></div>'+
      '<div class="vide2">Les buissons se cueillent à la main.</div>',false);
    return;
  }
  if(o.t==='comptoir'){ouvrirLeComptoir();return;}
  if(o.t==='forge'){location.href='forge.html';return;}
  if(o.t==='mine'){
    sauver();envoyerSauvegarde(true);
    try{direOuJeSuis&&direOuJeSuis('mine');}catch(x){}
    location.href='mine.html';return;
  }
  if(o.t==='casino'){
    sauver();monterEnLigne(true);
    location.href='casino.html';                 /* on entre dans la salle */
    return;
  }
  if((o.t==='rocher'||['fer','cuivre','charbon'].includes(o.t))&&!e.outils.pioche)return;
  if(o.t==='arbre'&&!e.outils.hache)return;
  /* un arbre dont la résine a coulé : on la recueille, et il reste debout */
  if(o.t==='arbre'&&resinePrete(o))return recolterResine(o);
  /* le geste dépend de ce qu'on vise */
  if(sacPlein()&&o.t!=='coffre'&&o.t!=='casino'&&o.t!=='forge'){
    prevenirSacPlein(o);return;                  /* inutile de taper : rien ne rentrerait */
  }
  const aLaMain=['buisson','argile','roseaux','champignons','herbes','plumes'].includes(o.t);
  GESTE={t:1,cible:o,impact:false,
         type:aLaMain?'cueille':(o.t==='arbre'?'hache':'pioche')};
  joueur.dir=Math.abs(o.x-joueur.x)>Math.abs(o.y-joueur.y)?(o.x>joueur.x?'droite':'gauche')
            :(o.y>joueur.y?'bas':'haut');
  try{navigator.vibrate&&navigator.vibrate(10);}catch(x){}
}
function majGeste(dt){
  if(GESTE.t<=0)return;
  const avant=GESTE.t;
  GESTE.t=Math.max(0,GESTE.t-dt*2.3);
  /* l'impact tombe aux deux tiers du geste, après l'élan */
  if(avant>0.42&&GESTE.t<=0.42){
    const o=GESTE.cible;
    if(o&&DECOR.includes(o)&&o.t==='buisson')return cueillir(o);
    if(o&&DECOR.includes(o)&&RECOLTES[o.t])return ramasser(o);
    if(o&&DECOR.includes(o)&&MINERAIS[o.t])return miner(o);
    if(o&&DECOR.includes(o)&&o.t==='arbre')  return couper(o);
    if(o&&DECOR.includes(o)){
      o.coups=(o.coups||0)+1;o.frappe=Date.now();o.recul=1;
      eclats(o.x,o.y-12,9,null,1);
      poussiere(o.x,o.y,6);
      secouer(0.6);ARRET=0.055;                      /* l'image se fige un instant */
      try{navigator.vibrate&&navigator.vibrate(16);}catch(x){}
      if(o.coups>=3){
        eclats(o.x,o.y-10,24,null,1.6);
        poussiere(o.x,o.y,14);
        secouer(1.3);ARRET=0.085;
        try{navigator.vibrate&&navigator.vibrate([12,30,26]);}catch(x){}
        const q=2+Math.floor(Math.random()*2);
        const pris=ajouter('pierre',q);
        e.recolte=(e.recolte||0)+pris;
        e.score=(e.score||0)+5;
        noterCasse(o.x+','+o.y);signalerLeMonde(o,'rocher',o.t);
        DECOR.splice(DECOR.indexOf(o),1);invaliderGrille();
        DECOR.push({t:'gravats',x:o.x,y:o.y,gr:0,neuf:Date.now()});
        texteVolant(o.x,o.y-22,'+'+pris+' pierre','#cfd6db');
        texteVolant(o.x,o.y-34,'+5 pts','#a9c96a');
        for(let i=0;i<pris;i++)setTimeout(()=>volVersSac(VW*ECH/2,VH*ECH/2,'pierre'),i*90);
        sauver();monterEnLigne(true);
      }else{
        texteVolant(o.x,o.y-20,(3-o.coups)+' coup'+(o.coups<2?'s':''),'#c9cfd4');
      }
    }
  }
  if(GESTE.t<=0){GESTE.cible=null;majAction();}
}
/* ---- extraire un minerai : quatre coups, et il rend son métal ---- */
const RENDU={fer:{q:[1,2],pts:14},cuivre:{q:[2,3],pts:9},charbon:{q:[2,4],pts:8}};
function miner(o){
  const M=MINERAIS[o.t], R=RENDU[o.t];
  o.coups=(o.coups||0)+1;o.frappe=Date.now();o.recul=1;
  for(let i=0;i<10;i++){
    const a=Math.random()*6.283, v=(40+Math.random()*90);
    PARTS.push({x:o.x,y:o.y-12,vx:Math.cos(a)*v,vy:-Math.abs(Math.sin(a))*v-20,
      vie:.7+Math.random()*.5,taille:1+Math.floor(Math.random()*3),
      rot:Math.random()*6.28,vrot:(Math.random()-.5)*14,
      c:M.debris[i%4],rebondi:false});
  }
  poussiere(o.x,o.y,6);
  secouer(0.65);ARRET=0.06;
  try{navigator.vibrate&&navigator.vibrate(18);}catch(x){}
  const DUR={fer:7,cuivre:6,charbon:5};
  const aFaire=Math.max(2,DUR[o.t]-(e.outils.piocheFer?3:0));
  if(o.coups>=aFaire){
    for(let i=0;i<20;i++){
      const a=Math.random()*6.283, v=(60+Math.random()*120);
      PARTS.push({x:o.x,y:o.y-10,vx:Math.cos(a)*v,vy:-Math.abs(Math.sin(a))*v-30,
        vie:1+Math.random()*.6,taille:2+Math.floor(Math.random()*2),
        rot:Math.random()*6.28,vrot:(Math.random()-.5)*16,
        c:i%3?M.veine:M.eclat,rebondi:false});
    }
    poussiere(o.x,o.y,16);
    secouer(1.4);ARRET=0.09;
    try{navigator.vibrate&&navigator.vibrate([12,30,26]);}catch(x){}
    const q=R.q[0]+Math.floor(Math.random()*(R.q[1]-R.q[0]+1));
    const pris=ajouter(o.t,q);
    const cailloux=ajouter('pierre',1);
    e.recolte=(e.recolte||0)+pris+cailloux;
    e.score=(e.score||0)+R.pts;
    noterCasse('m'+o.x+','+o.y);signalerLeMonde(o,'minerai',o.t);
    DECOR.splice(DECOR.indexOf(o),1);invaliderGrille();
    DECOR.push({t:'gravats',x:o.x,y:o.y,gr:0,neuf:Date.now()});
    DECOR.sort((a,b)=>a.y-b.y);invaliderGrille();
    const nom={fer:'fer',cuivre:'cuivre',charbon:'charbon'}[o.t];
    texteVolant(o.x,o.y-26,'+'+pris+' '+nom,M.eclat);
    texteVolant(o.x,o.y-38,'+'+R.pts+' pts','#a9c96a');
    for(let i=0;i<pris;i++)setTimeout(()=>volVersSac(VW*ECH/2,VH*ECH/2,o.t),i*80);
    sauver();monterEnLigne(true);
  }else{
    const reste=aFaire-o.coups;
    texteVolant(o.x,o.y-20,reste+' coup'+(reste>1?'s':''),'#c9cfd4');
  }
}

/* ---- la résine : on entaille l'arbre au lieu de l'abattre ---- */
/* La résine coule trois minutes après la première entaille.
   L'arbre n'a pas besoin d'être abattu : il reste debout et
   on peut revenir le saigner. */
const resinePrete=(o)=>o.t==='arbre'&&e.outils.hache&&
  o.saigne&&Date.now()-o.saigne>=180000;

function recolterResine(o){
  signalerLeMonde(o,'resine','resine');
  o.saigne=Date.now();o.frappe=Date.now();
  o.coups=0;                                   /* l'entaille cicatrise */
  for(let i=0;i<9;i++){
    const a=-1.1-Math.random()*0.8;
    PARTS.push({x:o.x+(Math.random()-.5)*10,y:o.y-[50,64,79][o.gr||0]*0.3,
      vx:Math.cos(a)*(20+Math.random()*40)*(Math.random()<.5?-1:1),
      vy:Math.sin(a)*(30+Math.random()*30),
      vie:.9,taille:2,rot:0,vrot:0,
      c:i%2?'#e8a94a':'#f7cf7d',rebondi:false});
  }
  secouer(0.3);
  const q=1+Math.floor(Math.random()*2);
  const pris=ajouter('resine',q);
  e.recolte=(e.recolte||0)+pris;e.score=(e.score||0)+7;
  texteVolant(o.x,o.y-30,'+'+pris+' résine','#f7cf7d');
  texteVolant(o.x,o.y-42,'+7 pts','#a9c96a');
  for(let i=0;i<pris;i++)setTimeout(()=>volVersSac(VW*ECH/2,VH*ECH/2,'resine'),i*80);
  try{navigator.vibrate&&navigator.vibrate([10,26,16]);}catch(x){}
  sauver();monterEnLigne(true);
}

/* ---- ramasser une ressource posée au sol ---- */
const RECOLTES={
 argile:      {nom:'argile',      q:[2,3], pts:2, col:['#bb5e42','#9c4a32'], vole:false},
 roseaux:     {nom:'roseaux',     q:[2,4], pts:2, col:['#5e8a47','#8a6238'], vole:true},
 champignons: {nom:'champignons', q:[1,3], pts:3, col:['#a83a3a','#e8dcc0'], vole:false},
 herbes:      {nom:'herbes',      q:[2,3], pts:2, col:['#4a944a','#c98fe0'], vole:true, aussi:['fibre',1]},
 plumes:      {nom:'plumes',      q:[1,2], pts:3, col:['#f2efe4','#c9c2b0'], vole:true}
};
function ramasser(o){
  const R=RECOLTES[o.t];
  o.cueilli=Date.now();o.frappe=Date.now();
  signalerLeMonde(o,'cueillette',o.t);
  for(let i=0;i<8;i++){
    const a=-1.2-Math.random()*0.7;
    PARTS.push({x:o.x+(Math.random()-.5)*16,y:o.y-10,
      vx:Math.cos(a)*(18+Math.random()*40)*(Math.random()<.5?-1:1),
      vy:Math.sin(a)*(34+Math.random()*36),
      vie:.8+Math.random()*.5,taille:2,rot:Math.random()*6,
      vrot:(Math.random()-.5)*(R.vole?9:4),
      c:Math.random()<.6?R.col[0]:R.col[1],rebondi:!R.vole});
  }
  secouer(0.18);
  const q=R.q[0]+Math.floor(Math.random()*(R.q[1]-R.q[0]+1));
  const pris=ajouter(o.t,q);
  e.recolte=(e.recolte||0)+pris;e.score=(e.score||0)+R.pts;
  texteVolant(o.x,o.y-24,'+'+pris+' '+R.nom,'#e8dcc0');
  if(R.aussi){                                 /* certaines plantes donnent deux choses */
    const [k,n]=R.aussi;
    const p2=ajouter(k,n);
    if(p2){
      e.recolte+=p2;
      texteVolant(o.x,o.y-48,'+'+p2+' '+OBJETS[k].nom.toLowerCase(),'#c2c983');
      setTimeout(()=>volVersSac(VW*ECH/2,VH*ECH/2,k),140);
    }
  }
  texteVolant(o.x,o.y-36,'+'+R.pts+' pts','#a9c96a');
  for(let i=0;i<pris;i++)setTimeout(()=>volVersSac(VW*ECH/2,VH*ECH/2,o.t),i*80);
  try{navigator.vibrate&&navigator.vibrate(9);}catch(x){}
  sauver();monterEnLigne(true);
}

/* ---- cueillir un buisson : rien ne casse, ça remue et ça donne ---- */
function cueillir(o){
  signalerLeMonde(o,'buisson','buisson');
  const fibreBuisson=Math.random()<0.5?1:0;    /* une chance sur deux d'arracher de la fibre */
  o.cueilli=Date.now();o.frappe=Date.now();o.secoue=1;
  /* les baies sautent du buisson */
  for(let i=0;i<9;i++){
    const a=-1.2-Math.random()*0.7;
    PARTS.push({x:o.x+(Math.random()-.5)*16,y:o.y-14,
      vx:Math.cos(a)*(20+Math.random()*45)*(Math.random()<.5?-1:1),
      vy:Math.sin(a)*(40+Math.random()*40),
      vie:.8+Math.random()*.4,taille:2,rot:Math.random()*6,vrot:(Math.random()-.5)*10,
      c:Math.random()<.75?'#c94a4a':'#e2604a',rebondi:false});
  }
  for(let i=0;i<6;i++){                       /* et quelques feuilles */
    PARTS.push({x:o.x+(Math.random()-.5)*20,y:o.y-16,
      vx:(Math.random()-.5)*30,vy:-10-Math.random()*20,
      vie:1.1,taille:2,rot:Math.random()*6,vrot:(Math.random()-.5)*8,
      c:Math.random()<.5?'#4a944a':'#3d7d3f',rebondi:false});
  }
  secouer(0.22);
  const q=2+Math.floor(Math.random()*2);
  const pris=ajouter('baies',q);
  e.recolte=(e.recolte||0)+pris;e.score=(e.score||0)+2;
  texteVolant(o.x,o.y-26,'+'+pris+' baies','#e8919a');
  /* en tirant sur les branches, on arrache souvent de la fibre */
  const fib=fibreBuisson?ajouter('fibre',1):0;
  if(fib){
    e.recolte+=fib;
    texteVolant(o.x,o.y-38,'+1 fibre','#c2c983');
    texteVolant(o.x,o.y-50,'+2 pts','#a9c96a');
    setTimeout(()=>volVersSac(VW*ECH/2,VH*ECH/2,'fibre'),160);
  }else texteVolant(o.x,o.y-38,'+2 pts','#a9c96a');
  for(let i=0;i<pris;i++)setTimeout(()=>volVersSac(VW*ECH/2,VH*ECH/2,'baies'),i*90);
  try{navigator.vibrate&&navigator.vibrate(10);}catch(x){}
  sauver();monterEnLigne(true);
}

/* ---- couper un arbre : cinq coups, puis il tombe ---- */
function couper(o){
  o.coups=(o.coups||0)+1;o.frappe=Date.now();
  /* copeaux de bois */
  for(let i=0;i<10;i++){
    const a=Math.random()*6.283;
    PARTS.push({x:o.x,y:o.y-Math.round(([50,64,79][o.gr||0])*0.3),
      vx:Math.cos(a)*(40+Math.random()*70),vy:-Math.abs(Math.sin(a))*70-20,
      vie:.7+Math.random()*.5,taille:1+Math.floor(Math.random()*3),
      rot:Math.random()*6,vrot:(Math.random()-.5)*16,
      c:['#a5764a','#8a6238','#6b4a28','#5b3f21'][i%4],rebondi:false});
  }
  /* des feuilles se détachent du houppier */
  const H=[50,64,79][o.gr||0];
  for(let i=0;i<7;i++){
    PARTS.push({x:o.x+(Math.random()-.5)*30,y:o.y-H*0.72,
      vx:(Math.random()-.5)*26,vy:6+Math.random()*10,
      vie:1.6,taille:2,rot:Math.random()*6,vrot:(Math.random()-.5)*6,
      c:['#4a944a','#3d7d3f','#2f6b34'][i%3],rebondi:true});
  }
  secouer(0.5);ARRET=0.05;
  try{navigator.vibrate&&navigator.vibrate(16);}catch(x){}
  if(o.coups>=(e.outils.hacheFer?3:5)){
    /* il ne bascule pas : il cède, et le bois vole en morceaux */
    secouer(1.2);ARRET=0.07;
    try{navigator.vibrate&&navigator.vibrate([14,40,26]);}catch(x){}
    /* de gros éclats de tronc qui retombent au sol */
    for(let i=0;i<16;i++){
      const a=Math.random()*6.283;
      PARTS.push({x:o.x+(Math.random()-.5)*10,y:o.y-10-Math.random()*H*0.5,
        vx:Math.cos(a)*(40+Math.random()*90),vy:-40-Math.random()*70,
        vie:1+Math.random()*.6,taille:2+Math.floor(Math.random()*3),
        rot:Math.random()*6,vrot:(Math.random()-.5)*16,
        c:['#a5764a','#8a6238','#6b4a28','#5b3f21'][i%4],rebondi:false});
    }
    /* le feuillage se disperse */
    for(let i=0;i<18;i++){
      PARTS.push({x:o.x+(Math.random()-.5)*36,y:o.y-H*0.7+(Math.random()-.5)*20,
        vx:(Math.random()-.5)*70,vy:-10+Math.random()*40,
        vie:1.3,taille:2,rot:Math.random()*6,vrot:(Math.random()-.5)*8,
        c:['#4a944a','#3d7d3f','#2f6b34'][i%3],rebondi:true});
    }
    poussiere(o.x,o.y,14);
    /* la souche prend la place tout de suite */
    const i=DECOR.indexOf(o);
    if(i>=0){
      DECOR.splice(i,1);invaliderGrille();
      DECOR.push({t:'souche',x:o.x,y:o.y,gr:0,neuf:Date.now()});
      DECOR.sort((a,b)=>a.y-b.y);invaliderGrille();
    }
    const q=3+Math.floor(Math.random()*3);
    const pris=ajouter('bois',q);
    const fib=ajouter('fibre',1);
    e.recolte=(e.recolte||0)+pris+fib;e.score=(e.score||0)+8;
    noterCasse('a'+o.x+','+o.y);signalerLeMonde(o,'arbre','arbre');
    texteVolant(o.x,o.y-26,'+'+pris+' bois','#d9b98a');
    texteVolant(o.x,o.y-38,'+8 pts','#a9c96a');
    for(let i2=0;i2<pris;i2++)setTimeout(()=>volVersSac(VW*ECH/2,VH*ECH/2,'bois'),i2*80);
    sauver();monterEnLigne(true);
  }else{
    texteVolant(o.x,o.y-H*0.35,(5-o.coups)+' coup'+(o.coups<4?'s':''),'#d9c9a8');
    /* au premier coup, la sève affleure : l'arbre devient saignable */
    if(o.coups===1&&!o.saigne){
      o.saigne=Date.now();                       /* elle mettra trois minutes à couler */
      texteVolant(o.x,o.y-H*0.5,'la sève perle · reviens dans 3 min','#f7cf7d');
    }
  }
}

/* la poussière soulevée au pied d'un rocher */
function poussiere(x,y,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*3.14-3.14;
    PARTS.push({x:x+(Math.random()-.5)*14,y,vx:Math.cos(a)*40,vy:-Math.random()*22,
      vie:.5+Math.random()*.5,taille:2+Math.floor(Math.random()*2),rot:0,vrot:0,
      c:'rgba(190,178,150,.7)',rebondi:true});
  }
}

const CHARGE_MAX=60;
const chargeMax=()=>e.sacMax||CHARGE_MAX;
if(!e.sac)e.sac={};
if(!e.outils)e.outils={};
/* les parties ouvertes avant l'arrivée de la hache la reçoivent quand même */
if(e.coffreOuvert&&e.outils.pioche&&!e.outils.hache)e.outils.hache=true;
if(!e.casses)e.casses=[];
const combien=k=>e.sac[k]||0;
const charge=()=>Object.entries(e.sac).reduce((a,[k,n])=>a+n*((OBJETS[k]||{poids:1}).poids),0);
const nbObjets=()=>Object.values(e.sac).filter(n=>n>0).length;
const sacPlein=()=>charge()>=chargeMax();
function prevenirSacPlein(o){
  texteVolant(o?o.x:joueur.x,(o?o.y:joueur.y)-28,'Sac plein','#e08a8a');
  texteVolant(o?o.x:joueur.x,(o?o.y:joueur.y)-40,'change-le au casino','#d8c9a8');
  try{navigator.vibrate&&navigator.vibrate([8,50,8]);}catch(x){}
}
function ajouter(k,n){
  if(!OBJETS[k]||!(n>0))return 0;            /* un objet inconnu ne casse rien */
  const place=chargeMax()-charge();
  const q=Math.max(0,Math.min(n,Math.floor(place/(OBJETS[k].poids||1))));
  if(q>0){e.sac[k]=combien(k)+q;sauver();majPastille();}
  return q;
}
function majPastille(){
  const p=$('sac-nb');if(!p)return;
  const n=nbObjets();
  p.textContent=n;p.classList.toggle('on',n>0);
}

/* ================= LE COMPTOIR : on y vend sa récolte =================
   Les prix viennent du serveur (la fonction `cours`), en centimes. On vend
   une pile entière d'un coup : le serveur retire du sac et crédite l'argent,
   c'est lui qui fait foi. */
const PRIX_COMPTOIR={lingotFer:52,lingotCuivre:34,gemme:120,or:70,argent:36,
  fer:14,cuivre:8,charbon:9,brique:11,resine:10,pierre:5,champignons:4,plumes:4,
  bois:3,herbes:3,fibre:2,baies:2,argile:2,roseaux:2};

function ouvrirLeComptoir(){
  const lignes=Object.entries(e.sac||{})
    .filter(([k,n])=>n>0&&PRIX_COMPTOIR[k])
    .sort((a,b)=>PRIX_COMPTOIR[b[0]]*b[1]-PRIX_COMPTOIR[a[0]]*a[1]);
  const total=lignes.reduce((t,[k,n])=>t+PRIX_COMPTOIR[k]*n,0);
  const sou=(c)=>(c/100).toFixed(2).replace('.',',')+' €';
  let corps;
  if(!lignes.length){
    corps='<div class="vide2">Ton sac est vide.<br>Traverse le gué : tout pousse '+
          'sur l’autre rive.</div>';
  }else{
    corps='<div class="listeVente">'+lignes.map(([k,n])=>
      '<button class="ligneVente" data-vendre="'+k+'">'+
        '<span class="lvNom">'+(OBJETS[k]?OBJETS[k].nom:k)+'</span>'+
        '<span class="lvNb">×'+n+'</span>'+
        '<span class="lvPrix">'+sou(PRIX_COMPTOIR[k]*n)+'</span>'+
      '</button>').join('')+'</div>'+
      '<button class="toutVendre" id="toutVendre">Tout vendre'+
      '<small>'+sou(total)+'</small></button>';
  }
  ouvrirPage('Le comptoir','ON ACHÈTE TA RÉCOLTE',corps,false);
  document.querySelectorAll('[data-vendre]').forEach(b=>
    b.onclick=()=>vendreAuComptoir([b.dataset.vendre]));
  const tv=$('toutVendre');
  if(tv)tv.onclick=()=>vendreAuComptoir(lignes.map(([k])=>k));
}
async function vendreAuComptoir(types){
  let gagne=0;
  for(const k of types){
    const n=(e.sac||{})[k]||0;
    if(!n||!PRIX_COMPTOIR[k])continue;
    const d=await appelRPC('echanger',{p_joueur:e.id,p_type:k,p_nb:n});
    if(!d||d.erreur)continue;
    gagne+=d.gain||0;
    if(typeof d.euros==='number')e.euros=d.euros;
    await appelRPC('retirer_du_sac',{p_joueur:e.id,p_cout:{[k]:n}}).then(r=>adopterSac(r));
  }
  if(gagne){
    sauver();majHaut();majPastille();
    const c=cible();
    if(c)texteVolant(c.x,c.y-54,'+'+(gagne/100).toFixed(2).replace('.',',')+' €','#ffd77a');
    try{navigator.vibrate&&navigator.vibrate([10,30,16]);}catch(x){}
  }
  ouvrirLeComptoir();
}

function ouvrirFour(){
  /* une fournée est en cours ou terminée */
  if(e.four){
    const reste=e.four.fin-Date.now();
    if(reste>0){
      const f=FONTES.find(x=>x.id===e.four.recette);
      const total=f.duree*1000, fait=Math.max(0,total-reste);
      return ouvrirPage('Le four','EN CHAUFFE',
        '<div class="chauffe"><div class="barre"><i style="width:'+
          Math.round(fait/total*100)+'%"></i></div>'+
        '<div class="reste">'+(reste>60000?Math.ceil(reste/60000)+' min restantes'
                                          :Math.ceil(reste/1000)+' s restantes')+'</div></div>'+
        '<div class="vide2">Il continue de chauffer même si tu t’éloignes<br>ou que tu fermes le jeu.</div>',
        false);
    }
    /* c'est prêt */
    const f=FONTES.find(x=>x.id===e.four.recette);
    Object.entries(f.rend).forEach(([k,n])=>ajouter(k,n));
    Object.entries(f.rend).forEach(([k,n])=>
      appelRPC('livrer',{p_joueur:e.id,p_type:k,p_nb:n}).then(d=>adopterSac(d)));
    const quoi=Object.entries(f.rend).map(([k,n])=>n+' '+OBJETS[k].nom.toLowerCase()).join(', ');
    e.score=(e.score||0)+12;
    e.four=null;sauver();majPastille();monterEnLigne(true);
    const c=cible();
    if(c&&c.t==='four'){
      texteVolant(c.x,c.y-34,'+'+quoi,'#ffc65a');
      eclats(c.x,c.y-14,14,'#ff9d45',1.2);
      secouer(0.4);
    }

/* la bulle au-dessus de la tête */
/* ---- la bulle au-dessus de la tête : elle se découpe en lignes,
       apparaît en grandissant et s'efface en douceur ---- */
const BULLE_LIGNE=17;                            /* caractères par ligne */
function couperEnLignes(txt){
  const mots=String(txt).split(/\s+/);
  const lignes=[];let l='';
  mots.forEach(m=>{
    if(m.length>BULLE_LIGNE){                    /* un mot trop long se coupe */
      if(l){lignes.push(l);l='';}
      for(let i=0;i<m.length;i+=BULLE_LIGNE)lignes.push(m.slice(i,i+BULLE_LIGNE));
      return;
    }
    if((l+' '+m).trim().length<=BULLE_LIGNE)l=(l?l+' ':'')+m;
    else{lignes.push(l);l=m;}
  });
  if(l)lignes.push(l);
  return lignes.slice(0,3);                      /* trois lignes au maximum */
}
function dessinerBulle(g,x,y,txt,mienne,ne){
  const lignes=couperEnLignes(txt);
  g.font='700 8px ui-monospace,monospace';
  let larg=0;
  lignes.forEach(t=>{larg=Math.max(larg,g.measureText(t).width);});
  const l=Math.round(larg+16), h=10+lignes.length*10;
  /* elle grandit en apparaissant, et rétrécit en partant */
  const age=Date.now()-(ne||0);
  const k=age<220?doux(Math.min(1,age/220)):1;
  const ech=0.6+k*0.4;
  const bx=Math.round(x-l/2), by=Math.round(y-52-h);

  g.save();
  g.translate(x,by+h+6);g.scale(ech,ech);g.translate(-x,-(by+h+6));
  g.globalAlpha=k;
  /* l'ombre portée */
  g.fillStyle='rgba(12,22,10,.28)';
  g.beginPath();g.roundRect(bx+1,by+2,l,h,6);g.fill();
  /* le fond */
  g.fillStyle=mienne?'#f6dc9a':'#f7f4ec';
  g.beginPath();g.roundRect(bx,by,l,h,6);g.fill();
  /* la pointe, vers la tête */
  g.beginPath();
  g.moveTo(x-5,by+h-1);g.lineTo(x,by+h+6);g.lineTo(x+5,by+h-1);g.closePath();g.fill();
  /* le liseré */
  g.strokeStyle=mienne?'rgba(120,86,20,.5)':'rgba(20,26,18,.28)';
  g.lineWidth=1;
  g.beginPath();g.roundRect(bx,by,l,h,6);g.stroke();
  /* le texte, ligne par ligne */
  g.fillStyle='#1c2418';g.textAlign='center';
  lignes.forEach((t,i)=>g.fillText(t,x,by+14+i*10));
  g.textAlign='left';
  g.restore();
}
function nettoyerBulles(){
  const t=Date.now();
  for(const [k,b] of BULLES)if(t>b.jusqua)BULLES.delete(k);
}

/* le petit clavier de phrases toutes faites */
/* ================= le chat =================
   Trois choses, et rien de plus :
   — un fil permanent en haut, pour ne rien rater
   — des réponses toutes prêtes sous le message reçu
   — un bandeau pour écrire ou dicter, sans quitter le terrain */
const SUGGEST=['Salut !','J’arrive','Attends-moi','Oui','Non','Merci !','Où es-tu ?',
  'On va au casino ?','À la rivière','Tu mines quoi ?','Bien joué','À plus'];
const REPONSES=[
  {si:/\?$|où|quand|tu viens|veux|va au/i, quoi:['Oui','Non','J’arrive']},
  {si:/salut|bonjour|coucou/i,             quoi:['Salut !','Ça va ?']},
  {si:/merci/i,                            quoi:['De rien','Avec plaisir']},
  {si:/attends|arrive|viens/i,             quoi:['Ok','Je t’attends']},
  {si:/bien jou|bravo/i,                   quoi:['Merci !','Toi aussi']},
  {si:/./,                                 quoi:['Ok','J’arrive','Salut !']}
];
const FIL=[];                                   /* tout ce qui s'est dit */
let nonLus=0;

function auFil(qui,txt,moi,teinte){
  FIL.push({qui,txt,moi,teinte:teinte||'#f0cf7d',quand:Date.now()});
  if(FIL.length>40)FIL.shift();
  if(!moi){nonLus++;proposerReponses(txt);}
  majFil();
}
function majFil(){
  const f=$('fil');if(!f)return;
  const derniers=FIL.slice(-3);
  if(!derniers.length){f.innerHTML='';return;}
  f.innerHTML=derniers.map((m,i)=>{
    const age=Math.round((Date.now()-m.quand)/1000);
    const quand=age<10?'à l’instant':age<60?'il y a '+age+' s':
      age<3600?'il y a '+Math.round(age/60)+' min':'il y a '+Math.round(age/3600)+' h';
    const opac=[0.4,0.68,1][i+(3-derniers.length)]||1;
    return '<div class="msgF'+(m.moi?' moi':'')+'" style="opacity:'+opac+'">'+
      '<b style="color:'+(m.moi?'#9fdfb8':m.teinte)+'">'+(m.moi?'toi':echapperT(m.qui))+'</b>'+
      '<span>'+echapperT(m.txt)+'</span><i>'+quand+'</i></div>';
  }).join('');
  const r=$('repond');
  if(r&&r.classList.contains('on')){
    const b=f.getBoundingClientRect();
    r.style.top=(b.bottom+6)+'px';
  }
}
function proposerReponses(txt){
  const r=$('repond');if(!r)return;
  const t=(REPONSES.find(x=>x.si.test(txt))||REPONSES[REPONSES.length-1]).quoi;
  r.innerHTML=t.map(q=>'<button data-r="'+echapperT(q)+'">'+q+'</button>').join('')+
    '<button data-r="">…</button>';
  r.classList.add('on');
  const b=$('fil').getBoundingClientRect();
  r.style.top=(b.bottom+6)+'px';
  r.querySelectorAll('[data-r]').forEach(b2=>b2.onclick=()=>{
    const q=b2.dataset.r;
    r.classList.remove('on');
    if(q)direQuelqueChose(q); else ouvrirBandeau();
  });
  clearTimeout(proposerReponses.t);
  proposerReponses.t=setTimeout(()=>r.classList.remove('on'),10000);
}
const echapperT=(t)=>String(t||'').replace(/[<>&"]/g,c=>
  ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

/* ---- le bandeau ---- */
function ouvrirBandeau(){
  const b=$('bandeau');if(!b)return;
  b.classList.add('on');
  $('suggest').innerHTML=SUGGEST.map(p=>'<button>'+p+'</button>').join('');
  $('suggest').querySelectorAll('button').forEach(x=>x.onclick=()=>{
    direQuelqueChose(x.textContent);fermerBandeau();});
  nonLus=0;
  /* On n'ouvre PAS le clavier : il mange la moitié de l'écran pour rien.
     Le micro et les phrases toutes prêtes suffisent la plupart du temps.
     Le clavier n'apparaît que si on touche le champ. */
  envoiAuto=true;
  setTimeout(suivreLeClavier,60);
}
function fermerBandeau(){
  const b=$('bandeau');if(!b)return;
  arreterDictee();
  b.classList.remove('on');
  b.style.bottom='0px';
  document.body.classList.remove('clavier');
  const i=$('saisie');
  if(i){if(i.blur)i.blur();i.value='';}

}
const bandeauOuvert=()=>{const b=$('bandeau');return b&&b.classList.contains('on');};

/* ---- la dictée : on parle, le téléphone écrit ---- */
const Reconnaissance=window.SpeechRecognition||window.webkitSpeechRecognition||null;
let ecoute=null, envoiAuto=true;
function dicter(){
  const m=$('micro');
  if(!Reconnaissance){
    if(m)m.classList.add('absent');
    const i=$('saisie');if(i)i.placeholder='ton clavier a un micro';
    return;
  }
  if(ecoute){arreterDictee();return;}
  const r=new Reconnaissance();
  r.lang='fr-FR';r.interimResults=true;r.continuous=false;r.maxAlternatives=1;
  let final='';
  r.onstart=()=>{
    ecoute=r;
    if(m)m.classList.add('ecoute');
    const o=$('onde');if(o)o.classList.add('on');
    try{navigator.vibrate&&navigator.vibrate(12);}catch(x){}
  };
  r.onresult=(ev)=>{
    let interim='';
    for(let i=ev.resultIndex;i<ev.results.length;i++){
      const t=ev.results[i][0].transcript;
      if(ev.results[i].isFinal)final+=t; else interim+=t;
    }
    const i2=$('saisie');
    if(i2){i2.value=(final+interim).trim().slice(0,48);
      const re=$('resteC');if(re)re.textContent=48-i2.value.length;}
  };
  r.onerror=(ev)=>{
    arreterDictee();
    const i3=$('saisie');
    if(i3)i3.placeholder=ev.error==='not-allowed'?'micro refusé — autorise-le':
      (ev.error==='no-speech'?'je n’ai rien entendu':'la dictée a échoué');
  };
  r.onend=()=>{
    arreterDictee();
    const i4=$('saisie');
    const txt=i4?i4.value.trim():'';
    if(txt&&envoiAuto){direQuelqueChose(txt);fermerBandeau();}
  };
  try{r.start();}catch(x){arreterDictee();}
}
function arreterDictee(){
  if(ecoute){try{ecoute.stop();}catch(x){}ecoute=null;}
  const m=$('micro');if(m)m.classList.remove('ecoute');
  const o=$('onde');if(o)o.classList.remove('on');
}

/* ================= le voile du lancement =================
   Il couvre l'écran dès la première ligne du fichier et ne se lève que
   lorsque le monde est vraiment prêt : le compte, la sauvegarde, le sac,
   la carte, et la première image dessinée. Avant, on regardait un écran
   noir en se demandant si le jeu avait planté. */
const ETAPES=[
  ['On allume le feu…',         0.10],
  ['On retrouve ton compte',    0.28],
  ['On déplie ta partie',       0.46],
  ['On compte ce qu’il y a dans ton sac', 0.62],
  ['On réveille le monde',      0.80],
  ['Te voilà',                  1.00]
];
let etapeVue=-1, voileNe=Date.now();
function etape(i){
  if(i<=etapeVue)return;
  etapeVue=i;
  const [mot,part]=ETAPES[Math.min(ETAPES.length-1,i)];
  const j=document.getElementById('vJauge'), m=document.getElementById('vMot');
  if(j)j.style.width=Math.round(part*100)+'%';
  if(m)m.textContent=mot;
}
function leverLeVoile(){
  const v=document.getElementById('voile');
  if(!v||v.classList.contains('parti'))return;
  etape(ETAPES.length-1);
  /* on laisse le voile au moins une seconde : un éclair est pire que rien */
  const reste=Math.max(0,1000-(Date.now()-voileNe));
  setTimeout(()=>{
    v.classList.add('parti');
    setTimeout(()=>{if(v.parentNode)v.parentNode.removeChild(v);},600);
  },reste);
}
/* si quoi que ce soit coince, on n'enferme jamais le joueur derrière le voile */
setTimeout(leverLeVoile,12000);

/* ================= boucle ================= */
let fondu=0;
taille();
let t0=performance.now();
(function boucle(t){
  requestAnimationFrame(boucle);
  const dt=Math.min(.05,(t-t0)/1000);mesurer(t-t0);majPerf(t-t0);
  if(PERF.on)PERF.traits=0;
  t0=t;
  /* micro-arrêt à l'impact : tout se fige un instant, ça donne du poids */
  if(ARRET>0){ARRET-=dt;}
  else{
    majJoueur(dt);majGeste(dt);
  }
  majVent(dt);
  if(QUALITE>=0.5)majNuages(dt);
  if(QUALITE>=1)majPapillons(dt);
  poussiereDePas();bornerParts();
  majParts(dt);majTextes(dt);majVols(dt);majAction();majAutres(dt);
  brancherPerf();
  if(t-dernierMini>200){dernierMini=t;majHaut();}   /* le bandeau du haut */
  if(t-dernierSolde>20000){dernierSolde=t;lireLeSolde();}   /* le solde, toutes les 20 s */
  const bp=$('b-parler');
  if(bp){
    const proche=[...AUTRES.values()].some(a=>Math.hypot(a.x-joueur.x,a.y-joueur.y)<120);
    bp.classList.toggle('qqn',proche);
    const nb=$('parler-nb');
    if(nb){nb.textContent=nonLus;nb.classList.toggle('on',nonLus>0);}
  }
  if(FIL.length&&Date.now()-(majFil.quand||0)>5000){majFil.quand=Date.now();majFil();}
  const maintenant=Date.now();
  if(maintenant-derniereEcoute>8000){derniereEcoute=maintenant;ecouterLesAutres();}
  envoyerSauvegarde();                            /* la partie, sur le serveur */
  ouvrirCanal();
  bipPosition();                                  /* le direct, 10 fois par seconde */
  if(maintenant-envoiRapide>6000){                /* la base, juste pour la mémoire */
    envoiRapide=maintenant;monterEnLigne(true);
  }
  if(SECOUSSE>0.01)SECOUSSE*=Math.pow(0.0009,dt);else SECOUSSE=0;
  dessiner();
  ctx.setTransform(1,0,0,1,0,0);
  dessinerVols(ctx,cv.width,cv.height);
  if(fondu>0){                                /* voile noir qui s'efface au départ */
    fondu=Math.max(0,fondu-dt*1.6);
    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle='rgba(12,20,12,'+fondu.toFixed(3)+')';
    ctx.fillRect(0,0,cv.width,cv.height);
  }
  dessinerJoy(dt);
})(t0);
setInterval(()=>{sauver();monterEnLigne(true);},4000);   /* on signale sa présence même immobile */
