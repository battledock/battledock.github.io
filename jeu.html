<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#24406b">
<title>Ta ferme</title>
<style>
:root{
  --nuit:#24406b; --nuit2:#2b4a78; --nuit-f:#14213f;
  --vert:#2f6b1f; --vert-c:#63a84a; --vert-p:#eef4e9;
  --or:#b5822a; --or-p:#f7efdd;
  --carte:#fffdf9; --fond:#f2f0e8; --encre:#1e2735; --doux:#93a1b5; --pale:#a5adba;
  --filet:#e4e2d8; --papier:#e9e3d6;
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%;overflow-x:hidden}
body{min-height:100vh;min-height:100dvh;overflow-x:hidden;background:var(--fond);color:var(--encre);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font-family:inherit;font-size:15px;border:0;background:none;color:inherit;cursor:pointer}
.app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
body.fige{overflow:hidden;position:fixed;inset:0;width:100%}

/* ---------- bandeau ---------- */
.haut{flex:0 0 auto;position:sticky;top:0;z-index:6;overflow:hidden;
  padding:calc(15px + env(safe-area-inset-top)) 15px 24px;
  box-shadow:0 2px 16px rgba(120,85,40,.18)}
.haut .ciel{position:absolute;inset:0;width:100%;height:100%}
.haut .dedans{position:relative}
.haut .kicker{font:600 8.5px system-ui;letter-spacing:3.4px;color:#a9814a}
.haut .ligne1{display:flex;align-items:baseline;gap:10px;margin-top:4px}
.haut h1{flex:1;min-width:0;font:400 23px/1.1 Georgia,serif;color:#42311e;
  text-shadow:0 1px 0 rgba(255,255,255,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.haut .caisse{font:400 19px Georgia,serif;color:#a1741f;white-space:nowrap}
.haut .filet{height:1px;margin:12px 0 10px;
  background:linear-gradient(90deg,rgba(180,140,70,0),rgba(180,140,70,.65),rgba(180,140,70,0))}
.haut .rang{display:flex;align-items:center;gap:10px}
.haut .niv{font:600 9.5px system-ui;letter-spacing:1.6px;color:#8a6a3c;white-space:nowrap}
.haut .barre{flex:1;height:5px;border-radius:3px;background:rgba(120,85,35,.22);overflow:hidden}
.haut .barre i{display:block;height:100%;border-radius:3px;
  background:linear-gradient(90deg,var(--vert),#8ed36a);transition:width .5s}
.haut .xpt{font:600 9.5px system-ui;color:#a08a64;white-space:nowrap}

/* ---------- corps ---------- */
.corps{flex:1;min-height:0;padding:14px 14px 98px}
.titre{font:600 11px system-ui;letter-spacing:2px;color:var(--doux);margin:18px 2px 9px}
.titre:first-child{margin-top:2px}

/* ---------- le domaine vu de haut ---------- */
.scene{position:relative;width:100%;aspect-ratio:400/560;border-radius:20px;overflow:hidden;
  border:1px solid #cdd6c0;box-shadow:0 2px 0 rgba(120,140,100,.22),0 12px 30px rgba(60,80,50,.16);
  margin-bottom:4px}
.scene .decor{position:absolute;inset:0;width:100%;height:100%}
.lot{position:absolute;border-radius:11px;overflow:hidden;padding:0;
  border:1px solid rgba(70,60,30,.4);box-shadow:0 2px 0 rgba(50,45,20,.3),0 4px 10px rgba(40,50,25,.22),
  inset 0 -6px 12px rgba(80,55,20,.18);background:#b98d55}
.lot:active{transform:translateY(1px)}
.lot.herbe{background:#8fb26a;border-color:rgba(70,90,50,.4);
  box-shadow:0 2px 0 rgba(50,70,40,.28),0 4px 10px rgba(40,50,25,.2)}
.lot.herbe .fond{position:absolute;inset:0;width:100%;height:100%}
.lot.vide{background:rgba(255,253,247,.28);border-style:dashed;box-shadow:none}
.lot.verrou{background:rgba(236,238,226,.86);border-style:dashed;box-shadow:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font:600 10.5px system-ui;color:#5b6b4c}
.lot .txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font:600 10.5px system-ui;color:#4f4327;background:rgba(255,253,247,.24);text-align:center;padding:0 6px}
.lot.herbe .txt{color:#3f5432;background:rgba(255,253,247,.3)}
.lot .jauge{position:absolute;left:6px;right:6px;bottom:5px;height:4px;border-radius:3px;
  background:rgba(30,25,10,.45);overflow:hidden}
.lot .jauge i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#a9e07a,var(--vert-c))}
.lot .pastille{position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;background:#8ed36a;
  box-shadow:0 0 0 3px rgba(142,211,106,.3),0 1px 3px rgba(0,0,0,.35);animation:respire 2s ease-in-out infinite}
@keyframes respire{50%{transform:scale(1.25)}}
.lot .compte{position:absolute;top:4px;left:5px;background:rgba(30,39,53,.75);color:#fdfbf4;
  border-radius:7px;padding:1px 5px;font:600 9.5px system-ui}
.lot .nom{position:absolute;left:0;right:0;bottom:0;padding:11px 4px 3px;text-align:center;
  font:600 9.5px system-ui;color:#fdfbf4;background:linear-gradient(180deg,transparent,rgba(25,35,20,.6))}
.reste-enclos{position:absolute;left:0;right:0;bottom:4px;text-align:center;
  font:600 10px system-ui;color:rgba(255,253,247,.85);text-shadow:0 1px 3px rgba(20,35,15,.6)}

/* ---------- carnet ---------- */
.ligne{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--carte);
  border:1px solid var(--filet);border-left:4px solid var(--filet);border-radius:14px;padding:11px;margin-bottom:8px}
.ligne.pret{border-left-color:var(--vert-c)}
.ligne.pousse{border-left-color:var(--or)}
.ligne .ic{width:46px;height:46px;border-radius:12px;background:#f4f1e8;display:flex;
  align-items:center;justify-content:center;flex:0 0 auto;overflow:hidden}
.ligne .t{flex:1;min-width:0}
.ligne .n{font:600 13.5px system-ui}
.ligne .d{font:400 12px system-ui;color:var(--doux);margin-top:2px}
.ligne .jauge{height:5px;border-radius:3px;background:#eae7dd;margin-top:6px;overflow:hidden}
.ligne .jauge i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#e6c877,var(--or))}
.agir{border-radius:11px;padding:10px 14px;font:600 13px system-ui;flex:0 0 auto;
  background:var(--vert);color:#fdfbf4;box-shadow:0 3px 10px rgba(47,107,31,.24)}
.agir.sec{background:var(--vert-p);color:var(--vert);box-shadow:none}
.agir:active{transform:translateY(1px)}
.vide{font:400 13px/1.6 system-ui;color:var(--doux);text-align:center;padding:26px 10px}

/* ---------- listes ---------- */
.item{display:flex;align-items:center;gap:12px;background:var(--carte);border:1px solid var(--filet);
  border-radius:14px;padding:11px;margin-bottom:8px}
.item .ic{width:46px;height:46px;border-radius:12px;background:#f4f1e8;display:flex;align-items:center;
  justify-content:center;flex:0 0 auto;overflow:hidden}
.item .t{flex:1;min-width:0}
.item .n{font:600 13.5px system-ui}
.item .d{font:400 12px/1.45 system-ui;color:var(--doux);margin-top:2px}
.prixb{border-radius:11px;padding:10px 13px;font:600 13px system-ui;flex:0 0 auto;
  background:var(--or-p);color:var(--or)}
.prixb.plein{background:var(--nuit);color:#f7fafc;width:100%;padding:15px;text-align:center;font-size:14.5px}
.prixb:disabled{opacity:.42}
.note{font:400 12px/1.5 system-ui;color:var(--doux);margin:6px 3px 2px}
.rayons{display:flex;gap:7px;margin-bottom:4px}
.rayons button{flex:1;border-radius:12px;padding:10px 4px;font:600 13px system-ui;
  background:#e7e5da;color:var(--doux)}
.rayons button.on{background:var(--nuit);color:#f7fafc}
.paliers{display:flex;gap:4px;margin-top:7px}
.paliers i{width:19px;height:5px;border-radius:3px;background:#e6e2d6}
.paliers i.on{background:var(--vert-c)}

/* ---------- commandes ---------- */
.cmd{background:var(--carte);border:1px solid var(--filet);border-radius:16px;padding:13px;margin-bottom:9px}
.cmd .h{display:flex;align-items:baseline;gap:8px}
.cmd .h .q{flex:1;font:600 13.5px system-ui}
.cmd .h .g{font:600 13px system-ui;color:var(--or)}
.jetons{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.jeton{display:flex;align-items:center;gap:6px;border:1px solid var(--filet);border-radius:9px;
  padding:5px 8px;font:600 11.5px system-ui;color:var(--doux)}
.jeton.ok{background:var(--vert-p);border-color:#cbe5c0;color:var(--vert)}
.jeton svg{flex:0 0 auto}

/* ---------- barre du bas ---------- */
.bas{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--carte);
  border-top:1px solid var(--filet);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
.bas button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;
  font:600 10.5px system-ui;color:var(--pale);padding:4px 0}
.bas button.on{color:var(--nuit)}
.bas .pt{position:absolute;top:0;right:calc(50% - 17px);width:7px;height:7px;border-radius:50%;background:#d9694a}

/* ---------- fenêtres ---------- */
#fen{position:fixed;inset:0;z-index:30;display:none;align-items:flex-end;background:rgba(20,33,63,.5)}
#fen.on{display:flex}
#fen .b{width:100%;background:var(--carte);border-radius:24px 24px 0 0;
  padding:20px 16px calc(18px + env(safe-area-inset-bottom));max-height:84dvh;overflow-y:auto;
  animation:monteF .3s cubic-bezier(.2,.85,.3,1)}
@keyframes monteF{from{transform:translateY(26px)}}
#fen h2{font:400 21px Georgia,serif;margin-bottom:4px}
#fen p{font:400 13px/1.55 system-ui;color:var(--doux)}
.fermer{width:100%;margin-top:14px;border-radius:14px;padding:14px;font:600 14.5px system-ui;
  background:#f1efe8;color:var(--encre)}
.palier{text-align:center;padding:4px 2px}
.palier .rond{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;
  background:linear-gradient(180deg,#8ed36a,var(--vert));color:#fdfbf4;display:flex;align-items:center;
  justify-content:center;font:600 25px system-ui;box-shadow:0 10px 24px rgba(47,107,31,.34)}
.palier .prime{font:600 27px system-ui;color:var(--or);margin:14px 0 12px}
.ouvre{display:flex;align-items:center;gap:10px;border-top:1px solid var(--filet);padding:11px 2px;text-align:left}
.ouvre .q{font:600 10.5px system-ui;letter-spacing:1.2px;color:var(--doux);text-transform:uppercase}
.ouvre .v{flex:1;text-align:right;font:400 14px Georgia,serif}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));
  background:rgba(30,39,53,.94);color:#fff;padding:10px 16px;border-radius:999px;font:600 13px system-ui;
  z-index:40;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,-6px)}

/* ---------- accueil et tutoriel ---------- */
#accueil{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  padding:16px;background:var(--papier);overflow:hidden;touch-action:none;animation:fondu .35s}
#accueil.on{display:flex}
@keyframes fondu{from{opacity:0}}
.postale{width:100%;max-width:420px;background:var(--carte);border-radius:20px;padding:13px 13px 0;
  display:flex;flex-direction:column;max-height:calc(100dvh - 32px);
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 3px 8px rgba(70,56,32,.1),0 26px 60px rgba(70,56,32,.3);
  animation:monteC .45s cubic-bezier(.2,.8,.3,1)}
@keyframes monteC{from{transform:translateY(20px) scale(.985);opacity:0}}
.vue{position:relative;border-radius:13px;overflow:hidden;flex:1 1 auto;min-height:140px;
  box-shadow:0 1px 3px rgba(70,56,32,.28)}
.vue svg{display:block;width:100%;height:100%}
.mot{padding:20px 8px 18px;text-align:center;flex:0 0 auto}
.mot .kicker{font:600 10px system-ui;letter-spacing:5.5px;color:#a89c84}
.mot h2{font:400 29px/1.12 Georgia,serif;color:#2f3830;margin-top:9px}
.mot .filet{width:34px;height:1px;background:#cfc4ac;margin:14px auto}
.mot p{font:400 13.5px/1.55 system-ui;color:#8a9083}
.cta{width:100%;margin-top:18px;border-radius:15px;padding:16px;background:var(--vert);color:#fdfbf4;
  font:600 15.5px system-ui;box-shadow:0 6px 18px rgba(47,107,31,.28)}
.saut{width:100%;margin-top:10px;padding:11px;font:600 12.5px system-ui;color:#a89c84}

#tuto{position:fixed;inset:0;z-index:55;display:none;pointer-events:none;overflow:hidden;touch-action:none}
#tuto.on{display:block}
#tuto .trou{position:absolute;border-radius:14px;box-shadow:0 0 0 9999px rgba(15,25,45,.74);
  border:2px solid var(--vert-c);transition:all .3s cubic-bezier(.3,.8,.4,1)}
#tuto .bulle{position:absolute;left:12px;right:12px;background:#1e2735;color:#fdfbf4;border-radius:20px;
  padding:16px;box-shadow:0 16px 36px rgba(0,0,0,.5);pointer-events:auto;transition:top .3s,bottom .3s}
#tuto .fleche{position:absolute;width:15px;height:15px;background:#1e2735;transform:rotate(45deg)}
#tuto .rang{display:flex;align-items:center;gap:10px}
#tuto .pts{display:flex;gap:5px;flex:1}
#tuto .pts i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.25)}
#tuto .pts i.on{width:18px;border-radius:3px;background:var(--vert-c)}
#tuto h3{font:600 19px system-ui;margin-top:10px}
#tuto .gains{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
#tuto .gain{background:rgba(142,222,99,.16);color:#a9e88a;border-radius:10px;padding:6px 10px;font:600 12.5px system-ui}
#tuto .gain.gris{background:rgba(255,255,255,.1);color:#b7c4d6}
#tuto .passer{font:600 12px system-ui;color:#7f92ab;padding:6px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <pattern id="terre" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
    <circle cx="2" cy="3" r="0.9" fill="#8a6a42"/><circle cx="6.5" cy="7" r="0.7" fill="#a2794a"/>
    <circle cx="7" cy="2" r="0.6" fill="#96703f"/></pattern>
  <pattern id="herbe" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-14)">
    <path d="M2 8v-3M5 9v-4M8 7v-3" stroke="#7ba35c" stroke-width="1.1" stroke-linecap="round"/></pattern>
</defs></svg>

<div class="app">
  <div class="haut">
    <svg class="ciel" viewBox="0 0 400 150" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="aurore" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f8dfc0"/><stop offset=".4" stop-color="#f4cfa4"/>
          <stop offset="1" stop-color="#e9be8e"/></linearGradient>
        <filter id="flouH"><feGaussianBlur stdDeviation="5"/></filter>
      </defs>
      <rect width="400" height="150" fill="url(#aurore)"/>

      <circle cx="66" cy="44" r="16" fill="#fff8de"/>
      <path d="M0 104 Q100 88 200 102 Q300 116 400 98 L400 150 L0 150Z" fill="#bcd2a0" opacity=".9"/>
      <path d="M0 124 Q120 110 240 124 Q320 133 400 120 L400 150 L0 150Z" fill="#9cbd7c"/>
      <g fill="#7ea45f"><ellipse cx="330" cy="118" rx="10" ry="7"/><ellipse cx="346" cy="124" rx="7" ry="5"/></g>
      <ellipse cx="120" cy="116" rx="130" ry="9" fill="#fdf6e8" opacity=".55" filter="url(#flouH)"/>
      <ellipse cx="300" cy="132" rx="120" ry="7" fill="#fdf6e8" opacity=".4" filter="url(#flouH)"/>
    </svg>
    <div class="dedans">
      <div class="kicker">BIENVENUE À</div>
      <div class="ligne1">
        <h1 id="nom-ferme">Ta ferme</h1>
        <div class="caisse"><span id="or">0</span> €</div>
      </div>
      <div class="filet"></div>
      <div class="rang">
        <div class="niv">NIVEAU <span id="niv">1</span></div>
        <div class="barre"><i id="xp-b" style="width:0%"></i></div>
        <div class="xpt" id="xp-t">0/55</div>
      </div>
    </div>
  </div>

  <div class="corps" id="corps"></div>

  <div class="bas" id="nav">
    <button data-v="ferme" class="on">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 20V11l9-6 9 6v9"/><path d="M9 20v-6h6v6"/></svg>Ferme</button>
    <button data-v="marche">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 8h16l-1.5 11.5H5.5z"/><path d="M8.5 8V6a3.5 3.5 0 0 1 7 0v2"/></svg>Marché</button>
    <button data-v="boutique">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l1.6-4h14.8L21 9"/><path d="M4.5 9v10.5h15V9"/>
        <path d="M3 9c0 1.5 1.3 2.7 3 2.7S9 10.5 9 9c0 1.5 1.3 2.7 3 2.7S15 10.5 15 9c0 1.5 1.3 2.7 3 2.7S21 10.5 21 9"/></svg>Boutique</button>
    <button data-v="commandes">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="3.5" width="14" height="17" rx="2.5"/><path d="M9 8.5h6M9 12.5h6M9 16.5h3"/></svg>Commandes
      <span class="pt" id="pt-cmd" style="display:none"></span></button>
  </div>
</div>

<div id="accueil"><div class="postale" id="accueil-b"></div></div>
<div id="tuto"><div class="trou" id="trou"></div><div class="bulle" id="bulle"></div></div>
<div id="fen"><div class="b" id="fen-b"></div></div>
<div class="toast" id="toast"></div>

/* ---- dessin d'un plant, quatre stades : 0 semis · 1 jeune · 2 formé · 3 mûr ---- */
const PLANT={
 radis:(t)=>t===0?`<path d="M0 0v-3" stroke="#5f8f4a" stroke-width="1.4"/>`:
   `<g><path d="M0 0v-${3+t*2}" stroke="#4e8f42" stroke-width="1.4"/>

function ILLUSTRATION(){
  const R=(a,b,s)=>{const v=Math.sin(s*127.1+a*311.7+b*74.7)*43758.5;return v-Math.floor(v);};

  /* --- rangs de culture en perspective : chaque bande se resserre vers l'horizon --- */
  let rangs='';
  for(let i=0;i<26;i++){
    const t=i/25;
    const y=176+Math.pow(t,1.7)*104;              // espacement qui s'ouvre vers le bas
    const ep=0.6+t*2.6;
    const dec=Math.sin(t*3.1)*6;
    rangs+=`<path d="M${-20+dec} ${y} Q200 ${y-7+dec*.6} ${420+dec} ${y-3}" stroke="rgba(108,142,74,${0.16+t*0.30})" stroke-width="${ep}" fill="none"/>`;
  }
  /* --- épis du premier plan, dessinés un par un --- */
  let epis='';
  for(let i=0;i<46;i++){
    const x=-10+i*9.2+R(i,1,3)*6;
    const h=26+R(i,2,7)*26;
    const base=302;
    const pen=(R(i,3,11)-0.5)*10;
    const vert=`hsl(${72+R(i,4,13)*18} ${30+R(i,5,17)*18}% ${28+R(i,6,19)*14}%)`;
    epis+=`<g class="epi" style="animation-delay:${(-R(i,7,23)*4).toFixed(2)}s;transform-origin:${x}px ${base}px">
      <path d="M${x} ${base} Q${x+pen*.4} ${base-h*.6} ${x+pen} ${base-h}" stroke="${vert}" stroke-width="1.9" fill="none" stroke-linecap="round"/>
      <ellipse cx="${(x+pen).toFixed(1)}" cy="${(base-h-4).toFixed(1)}" rx="2.6" ry="5.4" fill="hsl(${44+R(i,8,29)*10} ${52+R(i,9,31)*14}% ${54+R(i,10,37)*10}%)" transform="rotate(${(pen*1.4).toFixed(1)} ${(x+pen).toFixed(1)} ${(base-h-4).toFixed(1)})"/>
      </g>`;
  }
  /* --- feuillage : amas de cercles pour un houppier crédible --- */
  const houppier=(cx,cy,s,c1,c2,c3)=>{
    let g='';
    const amas=[[0,-s*.55,s*.62],[-s*.5,-s*.2,s*.46],[s*.5,-s*.25,s*.44],[-s*.2,-s*.75,s*.4],[s*.25,-s*.7,s*.38],[0,-s*.15,s*.55]];
    amas.forEach(([dx,dy,r],i)=>{g+=`<circle cx="${cx+dx}" cy="${cy+dy}" r="${r}" fill="${i<2?c1:(i<4?c2:c3)}"/>`;});
    return g;
  };
  /* --- piquets de clôture le long du chemin --- */
  let cloture='';
  for(let i=0;i<11;i++){
    const t=i/10;
    const x=18+t*370, y=236+Math.pow(t,1.6)*44, h=9+t*13;
    cloture+=`<rect x="${x}" y="${y-h}" width="${1.6+t*2.2}" height="${h}" rx="1" fill="#7d6a4a" opacity="${0.5+t*0.4}"/>`;
    if(i<10)cloture+=`<path d="M${x} ${y-h*0.72} L${18+((i+1)/10)*370} ${236+Math.pow((i+1)/10,1.6)*44-(9+((i+1)/10)*13)*0.72}" stroke="#7d6a4a" stroke-width="${0.8+t*1.2}" opacity="${0.35+t*0.35}"/>`;
  }

  return `
<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8fb8d4"/><stop offset=".38" stop-color="#c9dce4"/>
    <stop offset=".68" stop-color="#f3e0c0"/><stop offset="1" stop-color="#f7d9a8"/></linearGradient>
  <radialGradient id="halo" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#fff6d8" stop-opacity=".95"/>
    <stop offset=".45" stop-color="#ffe6a8" stop-opacity=".45"/>
    <stop offset="1" stop-color="#ffdf9a" stop-opacity="0"/></radialGradient>
  <linearGradient id="pre1" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#a9c98a"/><stop offset="1" stop-color="#8fb672"/></linearGradient>
  <linearGradient id="pre2" x1="0" y1="0" x2="0" y2="1">

const CLE='bdl.ferme.v3';
const neuf=()=>({ferme:'Ta ferme',or:150,xp:0,niv:1,parcelles:3,
  cases:Array.from({length:9},()=>({c:null,fin:0})),
  vergers:[null,null,null],enclos:{},outils:{},stock:{},commandes:null,
  derniere:Date.now(),accueilVu:false,tuto:0,venduUneFois:false});
let e=neuf();
try{const b=localStorage.getItem(CLE);if(b)e=Object.assign(neuf(),JSON.parse(b));}catch(x){}
const sauver=()=>{try{localStorage.setItem(CLE,JSON.stringify(e));}catch(x){}};

const stock=k=>e.stock[k]||0, ajouter=(k,n)=>{e.stock[k]=stock(k)+n;};
const euros=n=>Math.round(n).toLocaleString('fr-FR')+' €';
const duree=s=>s<60?Math.round(s)+' s':(s<3600?Math.round(s/60)+' min':(Math.round(s/360)/10)+' h');

  clearTimeout(tt);tt=setTimeout(()=>z.classList.remove('on'),2100);};

/* ================= outils ================= */
const palier=id=>(e.outils&&e.outils[id])||0;
const MAX_PALIER=5;
const bonusPousse=()=>1-0.05*palier('arrosoir');
const bonusArbre=()=>1-0.06*palier('secateur');
const bonusPrix=()=>1+0.07*palier('carriole');
const bonusCapacite=()=>3*palier('seau');
const chanceDouble=()=>0.08*palier('faux');
const prixVente=k=>Math.round(PRODUITS[k].vend*bonusPrix());

/* ================= niveaux ================= */
const XP_NIV=n=>Math.round(55*Math.pow(1.28,n-1));
const PRIME=n=>Math.round(90*Math.pow(1.34,n-1));
function ouvertures(n){
  const l=[];
  CULTURES.filter(c=>c.niv===n).forEach(c=>l.push({t:'Nouvelle culture',n:c.nom}));
  ARBRES.filter(a=>a.niv===n).forEach(a=>l.push({t:'Nouvel arbre',n:a.nom}));
  ELEVAGES.filter(x=>x.niv===n).forEach(x=>l.push({t:'Nouvel élevage',n:x.nom}));
  OUTILS.filter(o=>o.niv===n).forEach(o=>l.push({t:'Nouvel outil',n:o.nom}));
  return l;
}
let filePalier=[], fenetreXp={t:0,total:0};
const PLAFOND_XP=45;
function gagnerXp(n){
  if(!(n>0))return;
  const now=Date.now();
  if(now-fenetreXp.t>10000)fenetreXp={t:now,total:0};
  n=Math.min(n,Math.max(0,PLAFOND_XP-fenetreXp.total));
  if(n<=0)return;
  fenetreXp.total+=n;e.xp+=n;
  while(e.xp>=XP_NIV(e.niv)){
    e.xp-=XP_NIV(e.niv);e.niv++;
    const prime=PRIME(e.niv);e.or+=prime;
    filePalier.push({niv:e.niv,prime,ouvre:ouvertures(e.niv)});
  }
  if(filePalier.length)setTimeout(montrerPalier,500);
}
function montrerPalier(){
  if(!filePalier.length)return;
  const p=filePalier.shift();
  const liste=p.ouvre.length?p.ouvre.map(o=>
    `<div class="ouvre"><span class="q">${o.t}</span><span class="v">${o.n}</span></div>`).join('')
    :`<div class="ouvre"><span class="q">Rien de neuf</span><span class="v">mais la prime est là</span></div>`;
  $('fen-b').innerHTML=`<div class="palier"><div class="rond">${p.niv}</div>
    <h2>Niveau ${p.niv}</h2><p>Ta ferme prend de la valeur.</p>
    <div class="prime">+${p.prime.toLocaleString('fr-FR')} €</div>${liste}</div>
    <button class="fermer" id="f-x">Continuer</button>`;
  $('fen').classList.add('on');
  $('f-x').onclick=()=>{$('fen').classList.remove('on');sauver();rendre();
    if(filePalier.length)setTimeout(montrerPalier,240);};
}

/* ================= production continue ================= */
function auto(){
  const now=Date.now(), dt=(now-e.derniere)/1000;
  if(dt<=0)return;e.derniere=now;
  ELEVAGES.forEach(el=>{
    const en=e.enclos[el.id];if(!en||!en.nb)return;
    const cap=(el.capacite+bonusCapacite())*en.nb;
    en.attente=Math.min(cap,(en.attente||0)+en.nb*dt/el.cycle);
  });
}
const coutParcelle=()=>Math.round(110*Math.pow(1.7,e.parcelles-3));
const coutEnclos=el=>Math.round(el.cout*Math.pow(1.85,(e.enclos[el.id]&&e.enclos[el.id].nb)||0));

/* ================= état des cases ================= */
function etatCase(i){
  if(i>=e.parcelles)return{type:'verrou'};
  const c=e.cases[i];
  if(!c||!c.c)return{type:'libre'};
  const cu=CULTURES.find(x=>x.id===c.c);
  if(!cu)return{type:'libre'};
  const cycle=(c.cycle||cu.duree)*1000, reste=c.fin-Date.now();
  if(reste<=0)return{type:'pret',cu,restes:c.restes};
  return{type:'pousse',cu,restes:c.restes,reste:Math.ceil(reste/1000),p:Math.max(0,1-reste/cycle)};
}
const stade=p=>p>=1?3:(p>.66?2:(p>.3?1:0));

/* ================= commandes ================= */
const CLIENTS=['Mme Ferrand','le café du coin','la cantine','Odile','le marché couvert','l’épicerie','Karim','la crèche'];
function dispoProduits(){
  return Object.keys(PRODUITS).filter(k=>{
    const c=CULTURES.find(x=>x.id===k);if(c)return c.niv<=e.niv;
    const el=ELEVAGES.find(x=>x.produit===k);if(el)return !!(e.enclos[el.id]&&e.enclos[el.id].nb);
    const a=ARBRES.find(x=>x.fruit===k);if(a)return (e.vergers||[]).some(v=>v&&v.id===a.id);
    return false;});
}
function nouvelleCommande(){
  const d=dispoProduits();if(!d.length)return null;
  const n=1+Math.min(2,Math.floor(e.niv/4)),items={};
  for(let i=0;i<n;i++){const k=d[Math.random()*d.length|0];
    items[k]=(items[k]||0)+1+Math.floor(Math.random()*3);}
  const val=Object.entries(items).reduce((s,[k,q])=>s+PRODUITS[k].vend*q,0);
  return{client:CLIENTS[Math.random()*CLIENTS.length|0],items,
    or:Math.round(val*1.5),xp:Math.max(4,Math.round(val/14))};
}
function assurerCommandes(){
  if(!e.commandes)e.commandes=[];
  while(e.commandes.length<3){const c=nouvelleCommande();if(!c)break;e.commandes.push(c);}
}
const livrable=c=>Object.entries(c.items).every(([k,q])=>stock(k)>=q);

const POS_CHAMPS=[

function vueFerme(){
  let h='<div class="scene">'+DECOR();

        <span>${euros(coutParcelle())}</span></button>`;
    }else if(s.type==='libre'){
      h+=`<button class="lot" style="${st}" data-p="${i}">${CHAMP(null,0)}<span class="txt">Semer</span></button>`;
    }else if(s.type==='pret'){
      h+=`<button class="lot" style="${st}" data-p="${i}">${CHAMP(s.cu,3)}<span class="pastille"></span>
        ${s.cu.recoltes>1?`<span class="compte">${s.restes}</span>`:''}</button>`;
    }else{
      h+=`<button class="lot" style="${st}" data-p="${i}">${CHAMP(s.cu,stade(s.p))}
        <span class="jauge"><i style="width:${Math.round(s.p*100)}%"></i></span></button>`;
    }
  }

  for(let i=0;i<3;i++){
    const v=(e.vergers||[])[i], p=POS_ARBRES[i];
    const st=`left:${p.l}%;top:${p.t}%;width:${L_ARBRE}%;height:${H_ARBRE}%`;
    if(!v){h+=`<button class="lot herbe" style="${st}" data-arbre="${i}">

        <circle cx="50" cy="46" r="16" fill="none" stroke="#6f8f52" stroke-width="2.4" stroke-dasharray="5 5"/></svg>
      <span class="txt">Planter</span></button>`;}
    else{
      const a=ARBRES.find(x=>x.id===v.id);
      const reste=(v.fin||0)-Date.now(), mur=reste<=0;
      const p2=mur?1:Math.max(0,1-reste/(Math.round(a.cycle*bonusArbre())*1000));
      h+=`<button class="lot herbe" style="${st}" data-arbre="${i}">
        <svg viewBox="0 0 100 90" preserveAspectRatio="none" class="fond">
          <g transform="translate(50 48) scale(2.2)">${ARBRE_SVG(a,mur,i)}</g></svg>
        ${mur?'<span class="pastille"></span>':`<span class="jauge"><i style="width:${Math.round(p2*100)}%"></i></span>`}
        <span class="nom">${a.nom}</span></button>`;

  const ouverts=ELEVAGES.filter(el=>e.enclos[el.id]&&e.enclos[el.id].nb);
  POS_ENCLOS.forEach((p,i)=>{
    const st=`left:${p.l}%;top:${p.t}%;width:${L_ENCLOS}%;height:${H_ENCLOS}%`;
    const el=ouverts[i];
    if(!el){
      const prochain=ELEVAGES.find(x=>!(e.enclos[x.id]&&e.enclos[x.id].nb));
      h+=`<button class="lot herbe vide" style="${st}" data-rayonferme="1">
        <span class="txt">${prochain&&prochain.niv<=e.niv?'Construire '+prochain.nom.toLowerCase():'Enclos à venir'}</span></button>`;
      return;
    }
    const en=e.enclos[el.id], pret=Math.floor(en.attente||0);
    const cap=(el.capacite+bonusCapacite())*en.nb;
    h+=`<button class="lot" style="${st}" data-elevage="${el.id}">${ENCLOS(el,en.nb,pret>0)}
      ${pret?`<span class="pastille"></span><span class="compte">${pret}</span>`
           :`<span class="jauge"><i style="width:${Math.round((en.attente||0)/cap*100)}%"></i></span>`}
      <span class="nom">${el.nom} · ${en.nb}</span></button>`;
  });
  if(ouverts.length>2){
    h+=`<div class="reste-enclos">+${ouverts.length-2} autre${ouverts.length>3?'s':''} enclos dans le carnet</div>`;
  }
  h+='</div>';

  /* ---- le carnet ---- */
  let l='';
  for(let i=0;i<e.parcelles;i++){
    const s=etatCase(i);
    if(s.type==='libre')
      l+=`<button class="ligne" data-p="${i}"><span class="ic">
        <svg width="30" height="24" viewBox="0 0 30 24"><rect width="30" height="24" rx="5" fill="#b98d55"/>
        <path d="M5 4v16M11 4v16M17 4v16M23 4v16" stroke="#9a7342" stroke-width="2.2"/></svg></span>
        <span class="t"><span class="n">Parcelle ${i+1}</span><span class="d">libre</span></span>
        <span class="agir sec">Semer</span></button>`;
    else if(s.type==='pret'){
      const suite=s.cu.recoltes>1?` · ${s.restes} récolte${s.restes>1?'s':''} restante${s.restes>1?'s':''}`:'';
      l+=`<button class="ligne pret" data-p="${i}"><span class="ic">${vignette(s.cu,3)}</span>
        <span class="t"><span class="n">${s.cu.nom}</span><span class="d">prêt${suite}</span></span>
        <span class="agir">Récolter</span></button>`;
    }else
      l+=`<div class="ligne pousse"><span class="ic">${vignette(s.cu,stade(s.p))}</span>
        <span class="t"><span class="n">${s.cu.nom}</span><span class="d">encore ${duree(s.reste)}</span>
        <span class="jauge"><i style="width:${Math.round(s.p*100)}%"></i></span></span></div>`;
  }
  ELEVAGES.forEach(el=>{
    const en=e.enclos[el.id];if(!en||!en.nb)return;
    const n=Math.floor(en.attente||0);if(!n)return;
    l+=`<button class="ligne pret" data-elevage="${el.id}"><span class="ic">${MINI_BETE(el)}</span>
      <span class="t"><span class="n">${el.nom}</span>
      <span class="d">${n} ${PRODUITS[el.produit].nom.toLowerCase()}${n>1?'s':''} à ramasser</span></span>
      <span class="agir">Ramasser</span></button>`;
  });
  (e.vergers||[]).forEach((v,i)=>{
    if(!v)return;const a=ARBRES.find(x=>x.id===v.id);if(!a)return;
    const reste=(v.fin||0)-Date.now();
    if(reste>0)l+=`<div class="ligne pousse"><span class="ic">${MINI_ARBRE(a,i)}</span>
      <span class="t"><span class="n">${a.nom}</span><span class="d">fruits dans ${duree(Math.ceil(reste/1000))}</span></span></div>`;
    else l+=`<button class="ligne pret" data-arbre="${i}"><span class="ic">${MINI_ARBRE(a,i)}</span>
      <span class="t"><span class="n">${a.nom}</span><span class="d">fruits mûrs</span></span>
      <span class="agir">Cueillir</span></button>`;
  });
  h+='<div class="titre">LE CARNET</div>'+(l||'<div class="vide">Rien à faire pour l’instant.<br>Sème quelque chose.</div>');
  return h;
}

/* ================= marché ================= */
function vueMarche(){
  const cles=Object.keys(e.stock).filter(k=>stock(k)>0&&PRODUITS[k]);
  if(!cles.length)return '<div class="titre">LE MARCHÉ</div><div class="vide">Ta grange est vide.<br>Récolte d’abord.</div>';
  const total=cles.reduce((s,k)=>s+prixVente(k)*stock(k),0);
  let h='<div class="titre">LA GRANGE</div>';
  cles.forEach(k=>{
    h+=`<div class="item"><span class="ic">${icone(k)}</span>
      <span class="t"><span class="n">${PRODUITS[k].nom}</span>
      <span class="d">${stock(k)} en réserve · ${euros(prixVente(k))} l’unité</span></span>
      <button class="prixb" data-v="${k}">${euros(prixVente(k)*stock(k))}</button></div>`;
  });
  h+=`<button class="prixb plein" data-v="tout" style="margin-top:6px">Tout vendre · ${euros(total)}</button>`;
  if(palier('carriole'))h+=`<div class="note">La carriole ajoute ${palier('carriole')*7} % à chaque vente.</div>`;
  return h;
}

/* ================= boutique ================= */
let rayon='graines';
function vueBoutique(){
  const ong=(id,t)=>`<button class="rayon${rayon===id?' on':''}" data-rayon="${id}">${t}</button>`;
  let h=`<div class="rayons">${ong('graines','Graines')}${ong('outils','Outils')}${ong('ferme','Ferme')}</div>`;

  if(rayon==='graines'){
    h+='<div class="titre">CE QUE TU PEUX SEMER</div>';
    CULTURES.forEach(c=>{
      const ok=c.niv<=e.niv;
      const d=ok?`${duree(Math.round(c.duree*bonusPousse()))} · achat ${euros(c.cout)} · vente ${euros(prixVente(c.id))}`+
        (c.recoltes>1?` · ${c.recoltes} récoltes`:'')+(c.lot>1?` · récolte par ${c.lot}`:'')
        :`s’ouvre au niveau ${c.niv}`;
      h+=item(vignette(c,ok?3:1),c.nom,d,`<span class="prixb" style="opacity:${ok?1:.45}">${ok?euros(c.cout):'—'}</span>`);
    });
    h+='<div class="note">On sème en touchant une parcelle libre, sur l’écran de la ferme.</div>';
    h+='<div class="titre">LES ARBRES</div>';
    ARBRES.forEach(a=>{
      const ok=a.niv<=e.niv;
      h+=item(MINI_ARBRE(a,0),a.nom,
        ok?`une cueillette toutes les ${duree(Math.round(a.cycle*bonusArbre()))} · ${euros(a.vend)}`:`s’ouvre au niveau ${a.niv}`,
        `<span class="prixb" style="opacity:${ok?1:.45}">${ok?euros(a.cout):'—'}</span>`);
    });
    h+='<div class="note">On plante depuis le verger.</div>';
  }
  if(rayon==='outils'){
    h+='<div class="titre">TON MATÉRIEL</div>';
    OUTILS.forEach(o=>{
      const n=palier(o.id), max=n>=MAX_PALIER, bloque=o.niv>e.niv, prix=o.cout(n);
      const d=bloque?`s’ouvre au niveau ${o.niv}`:(n?`${o.d} · ${o.effet(n)}`:o.d);
      h+=`<div class="item"><span class="ic">${o.ic}</span>
        <span class="t"><span class="n">${o.nom}</span><span class="d">${d}</span>
        ${bloque?'':`<span class="paliers">${Array.from({length:MAX_PALIER},(_,k)=>`<i class="${k<n?'on':''}"></i>`).join('')}</span>`}</span>
        <button class="prixb" data-outil="${o.id}" ${(bloque||max||e.or<prix)?'disabled':''}>${bloque?'—':(max?'au max':euros(prix))}</button></div>`;
    });
    h+='<div class="note">Cinq paliers par outil. Chacun améliore l’effet.</div>';
  }
  if(rayon==='ferme'){
    h+='<div class="titre">AGRANDIR</div>';
    const cp=coutParcelle();
    h+=item(`<svg width="30" height="24" viewBox="0 0 30 24"><rect width="30" height="24" rx="5" fill="#b98d55"/>
      <path d="M5 4v16M11 4v16M17 4v16M23 4v16" stroke="#9a7342" stroke-width="2.2"/></svg>`,
      'Nouvelle parcelle', e.parcelles>=9?'les neuf sont défrichées':`tu en as ${e.parcelles} sur 9`,
      `<button class="prixb" data-a="parcelle" ${(e.parcelles>=9||e.or<cp)?'disabled':''}>${e.parcelles>=9?'—':euros(cp)}</button>`);
    h+='<div class="titre">L’ÉLEVAGE</div>';
    ELEVAGES.forEach(el=>{
      const nb=(e.enclos[el.id]&&e.enclos[el.id].nb)||0, prix=coutEnclos(el), bloque=el.niv>e.niv;
      const d=bloque?`s’ouvre au niveau ${el.niv}`
        :(nb?`${nb} ${el.bete.toLowerCase()}${nb>1?'s':''} · un ${PRODUITS[el.produit].nom.toLowerCase()} toutes les ${duree(el.cycle)}`
            :`${PRODUITS[el.produit].nom} en continu, même hors ligne`);
      h+=item(MINI_BETE(el),el.nom+(nb?` · ${nb}`:''),d,
        `<button class="prixb" data-a="enclos:${el.id}" ${(bloque||e.or<prix)?'disabled':''}>${bloque?'—':euros(prix)}</button>`);
    });
  }
  return h;
}

/* ================= commandes ================= */
function vueCommandes(){
  assurerCommandes();

      <div class="jetons">${Object.entries(c.items).map(([k,q])=>
        `<span class="jeton${stock(k)>=q?' ok':''}">${PRODUITS[k].nom} ${Math.min(stock(k),q)}/${q}</span>`).join('')}</div>

/* ================= accueil et tutoriel ================= */
function ouvrirVoile(){document.body.classList.add('fige');$('accueil').classList.add('on');}
function fermerVoile(){$('accueil').classList.remove('on');document.body.classList.remove('fige');}
function ouvrirAccueil(){
  $('accueil-b').innerHTML=`
    <div class="vue">${ILLUSTRATION()}</div>
    <div class="mot">
      <div class="kicker">BIENVENUE À</div>
      <h2>${e.ferme}</h2>
      <div class="filet"></div>
      <p>Trois parcelles. À toi de jouer.</p>
      <button class="cta" id="a-go">Semer mon premier blé</button>
      <button class="saut" id="a-skip">passer</button>
    </div>`;
  ouvrirVoile();
  $('a-go').onclick=()=>{e.accueilVu=true;e.tuto=1;sauver();fermerVoile();rendre();

  $('a-skip').onclick=()=>{e.accueilVu=true;e.tuto=-1;sauver();fermerVoile();rendre();};

const ETAPES=[null,
 {cible:()=>document.querySelector('.case'),
  titre:'Touche la terre',
  gains:()=>[`+${prixVente('ble')} dans ${duree(Math.round(45*bonusPousse()))}`,'coûte 12 €'],
  attente:'Sème du blé', fait:()=>e.cases.some(c=>c&&c.c)},
 {cible:()=>{const i=e.cases.findIndex(c=>c&&c.c);
    return document.querySelectorAll('.case')[i>=0?i:0];},
  titre:'Ça pousse même hors ligne',
  gains:()=>['la jauge avance toute seule'],
  bouton:'Compris'},
 {cible:()=>{const i=e.cases.findIndex(c=>c&&c.c);
    return document.querySelectorAll('.case')[i>=0?i:0];},
  titre:'Encaisse ta récolte',
  gains:()=>['touche la parcelle mûre'],
  attente:'Récolte', fait:()=>Object.values(e.stock).some(v=>v>0)},
 {cible:()=>document.querySelector('#nav button[data-v="marche"]'),
  titre:'Vends au marché',
  gains:()=>['la grange devient de l’argent'],
  attente:'Vends', fait:()=>e.venduUneFois},
 {cible:()=>document.querySelector('#nav button[data-v="commandes"]'),
  titre:'Les habitants paient plus',
  gains:()=>['+50 % par rapport au marché'],
  bouton:'Terminer'}
];
function majTuto(){
  const t=$('tuto');
  if(!(e.tuto>0)||e.tuto>=ETAPES.length){t.classList.remove('on');return;}
  const et=ETAPES[e.tuto], cible=et.cible&&et.cible();
  if(!cible){t.classList.remove('on');return;}
  t.classList.add('on');
  const r=cible.getBoundingClientRect(), m=8;
  const trou=$('trou');
  trou.style.left=(r.left-m)+'px';trou.style.top=(r.top-m)+'px';
  trou.style.width=(r.width+m*2)+'px';trou.style.height=(r.height+m*2)+'px';
  const dessous=r.top<innerHeight*0.5;
  const b=$('bulle'), pret=et.fait?et.fait():true;
  b.innerHTML=`<div class="fleche"></div>
    <div class="rang"><div class="pts">${ETAPES.slice(1).map((_,i)=>
      `<i class="${i+1===e.tuto?'on':''}"></i>`).join('')}</div>
      <button class="passer" id="t-skip">passer</button></div>
    <h3>${et.titre}</h3>
    <div class="gains">${et.gains().map((g,i)=>`<span class="gain${i?' gris':''}">${g}</span>`).join('')}</div>
    ${(et.bouton||pret)?`<button class="cta" id="t-next" style="margin-top:13px;padding:13px">${et.bouton||'Continuer'}</button>`
      :`<div class="gain gris" style="margin-top:13px;text-align:center;padding:12px">${et.attente}</div>`}`;
  if(dessous){b.style.top=Math.round(r.bottom+18)+'px';b.style.bottom='auto';}
  else{b.style.bottom=Math.round(innerHeight-r.top+18)+'px';b.style.top='auto';}
  const rb=b.getBoundingClientRect(), f=b.querySelector('.fleche');
  const cx=Math.min(Math.max(r.left+r.width/2-rb.left-7,20),rb.width-34);
  f.style.left=Math.round(cx)+'px';
  if(dessous){f.style.top='-7px';f.style.bottom='auto';}else{f.style.bottom='-7px';f.style.top='auto';}
  const n=$('t-next');if(n)n.onclick=avancerTuto;
  const sk=$('t-skip');if(sk)sk.onclick=()=>{e.tuto=-1;sauver();majTuto();};
}
function avancerTuto(){
  e.tuto++;
  if(e.tuto>=ETAPES.length){
    e.tuto=-1;e.or+=100;sauver();rendre();
    $('accueil-b').innerHTML=`<div class="mot" style="padding:28px 12px 22px">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#2f6b1f" stroke-width="1.7"
        style="display:block;margin:0 auto 14px"><circle cx="12" cy="12" r="10"/>
        <path d="M8 12.5l2.6 2.6L16 9.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="kicker">TA FERME TOURNE</div>
      <h2 style="font-size:34px">+100 €</h2><div class="filet"></div>
      <p>Le reste t’appartient.</p>
      <button class="cta" id="a-fin">Continuer</button></div>`;
    ouvrirVoile();
    $('a-fin').onclick=()=>{fermerVoile();rendre();};
    return;
  }
  if(e.tuto===2){
    const i=e.cases.findIndex(c=>c&&c.c);
    if(i>=0&&e.cases[i].fin>Date.now()+9000)e.cases[i].fin=Date.now()+9000;
  }
  sauver();rendre();
}
addEventListener('resize',majTuto);

/* ================= actions ================= */
function semer(i){
  const dispo=CULTURES.filter(c=>c.niv<=e.niv).filter(c=>e.tuto===1?c.id==='ble':true);
  $('fen-b').innerHTML='<h2>Que semer ?</h2><p>Choisis la culture de cette parcelle.</p>'+
    dispo.map(c=>`<div class="item"><span class="ic">${vignette(c,3)}</span>
      <span class="t"><span class="n">${c.nom}</span>
      <span class="d">${duree(Math.round(c.duree*bonusPousse()))} · rapporte ${euros(prixVente(c.id))}${
        c.recoltes>1?` · ${c.recoltes} récoltes`:''}</span></span>
      <button class="prixb" data-g="${c.id}" ${e.or<c.cout?'disabled':''}>${euros(c.cout)}</button></div>`).join('')+
    '<button class="fermer" id="f-x">Annuler</button>';
  $('fen').classList.add('on');
  $('f-x').onclick=()=>$('fen').classList.remove('on');
  $('fen-b').querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{
    const c=CULTURES.find(x=>x.id===b.dataset.g);
    if(!c||e.or<c.cout)return;
    e.or-=c.cout;
    const d=Math.round(c.duree*bonusPousse());
    e.cases[i]={c:c.id,fin:Date.now()+d*1000,cycle:d,restes:c.recoltes};
    $('fen').classList.remove('on');sauver();rendre();});
}
function toucherCase(i){
  const s=etatCase(i);
  if(s.type==='verrou'){
    const c=coutParcelle();
    if(e.or<c)return toast('Il te manque '+euros(c-e.or));
    e.or-=c;e.parcelles++;toast('Parcelle défrichée');sauver();rendre();return;
  }
  if(s.type==='libre')return semer(i);
  if(s.type==='pousse')return toast('Prêt dans '+duree(s.reste));
  const cu=s.cu;
  let gain=(cu.lot||1)*(cu.double?2:1);
  if(Math.random()<chanceDouble()){gain*=2;setTimeout(()=>toast('La faux a doublé la récolte'),750);}
  ajouter(cu.id,gain);gagnerXp(cu.xp);
  const restes=(e.cases[i].restes||1)-1;
  if(restes>0){
    const cycle=Math.round(cu.duree*(cu.repousse||.5)*bonusPousse());
    e.cases[i]={c:cu.id,fin:Date.now()+cycle*1000,cycle,restes};
    toast('+'+gain+' '+cu.nom.toLowerCase()+' · ça repousse');
  }else{
    e.cases[i]={c:null,fin:0};
    toast('+'+gain+' '+cu.nom.toLowerCase());
  }
  sauver();rendre();
}
function toucherArbre(i){
  const v=(e.vergers||[])[i];
  if(!v){
    const ouverts=ARBRES.filter(a=>a.niv<=e.niv);
    if(!ouverts.length)return toast('Le verger ouvre au niveau '+ARBRES[0].niv);
    $('fen-b').innerHTML='<h2>Planter un arbre</h2><p>Un arbre ne s’épuise jamais : il redonne des fruits sans fin.</p>'+
      ARBRES.map(a=>{const ok=a.niv<=e.niv;
        return `<div class="item"><span class="ic">${MINI_ARBRE(a,0)}</span>
        <span class="t"><span class="n">${a.nom}</span>
        <span class="d">${ok?`une cueillette toutes les ${duree(Math.round(a.cycle*bonusArbre()))} · ${euros(a.vend)}`
          :`niveau ${a.niv} requis`}</span></span>
        <button class="prixb" data-plante="${a.id}" ${(!ok||e.or<a.cout)?'disabled':''}>${euros(a.cout)}</button></div>`;
      }).join('')+'<button class="fermer" id="f-x">Annuler</button>';
    $('fen').classList.add('on');
    $('f-x').onclick=()=>$('fen').classList.remove('on');
    $('fen-b').querySelectorAll('[data-plante]').forEach(b=>b.onclick=()=>{
      const a=ARBRES.find(x=>x.id===b.dataset.plante);
      if(!a||e.or<a.cout||a.niv>e.niv)return;
      e.or-=a.cout;
      e.vergers[i]={id:a.id,fin:Date.now()+Math.round(a.cycle*bonusArbre())*1000};
      $('fen').classList.remove('on');toast(a.nom+' planté');sauver();rendre();});
    return;
  }
  const a=ARBRES.find(x=>x.id===v.id);
  if((v.fin||0)>Date.now())return toast('Fruits dans '+duree(Math.ceil((v.fin-Date.now())/1000)));
  const lot=1+Math.floor(Math.random()*2);
  ajouter(a.fruit,lot);gagnerXp(a.xp);
  e.vergers[i]={id:a.id,fin:Date.now()+Math.round(a.cycle*bonusArbre())*1000};
  toast('+'+lot+' '+PRODUITS[a.fruit].nom.toLowerCase()+(lot>1?'s':''));
  sauver();rendre();
}
function toucherElevage(id){
  const el=ELEVAGES.find(x=>x.id===id), en=e.enclos[id];
  if(!en||!en.nb)return;
  const n=Math.floor(en.attente||0);
  if(n<1)return toast('Ça arrive');
  en.attente-=n;ajouter(el.produit,n);gagnerXp(el.xp*Math.min(n,4));
  toast('+'+n+' '+PRODUITS[el.produit].nom.toLowerCase()+(n>1?'s':''));
  sauver();rendre();
}
function vendre(k){
  if(k==='tout'){
    let t=0;Object.keys(e.stock).forEach(x=>{if(!PRODUITS[x])return;t+=prixVente(x)*stock(x);e.stock[x]=0;});
    if(t){e.or+=t;e.venduUneFois=true;toast('+'+euros(t));}
  }else{
    const n=stock(k);if(!n)return;
    const g=prixVente(k)*n;e.or+=g;e.stock[k]=0;e.venduUneFois=true;toast('+'+euros(g));
  }
  sauver();rendre();
}
function acheter(a){
  if(a==='parcelle'){
    const c=coutParcelle();
    if(e.or<c||e.parcelles>=9)return;
    e.or-=c;e.parcelles++;toast('Parcelle défrichée');
  }
  if(a.startsWith('enclos:')){
    const el=ELEVAGES.find(x=>x.id===a.slice(7));
    const c=coutEnclos(el);
    if(!el||e.or<c||el.niv>e.niv)return;
    e.or-=c;
    const en=e.enclos[el.id]||{nb:0,attente:0};
    en.nb++;e.enclos[el.id]=en;
    toast(en.nb===1?el.nom+' construit':'+1 '+el.bete.toLowerCase());
  }
  sauver();rendre();
}
function ameliorer(id){
  const o=OUTILS.find(x=>x.id===id);
  const n=palier(id), prix=o.cout(n);
  if(!o||o.niv>e.niv||n>=MAX_PALIER||e.or<prix)return;
  e.or-=prix;e.outils[id]=n+1;
  toast(o.nom+' · '+o.effet(n+1));sauver();rendre();
}
function livrer(i){
  const c=e.commandes[i];
  if(!c||!livrable(c))return;
  Object.entries(c.items).forEach(([k,q])=>{e.stock[k]=stock(k)-q;});
  e.or+=c.or;gagnerXp(c.xp);
  e.commandes.splice(i,1);assurerCommandes();
  toast('Livré · +'+euros(c.or));sauver();rendre();
}

/* ================= navigation et rendu ================= */
let vue='ferme';
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{
  vue=b.dataset.v;
  document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x===b));
  window.scrollTo(0,0);rendre();});

function brancher(){
  const z=$('corps');
  z.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>toucherCase(+b.dataset.p));
  z.querySelectorAll('[data-arbre]').forEach(b=>b.onclick=()=>toucherArbre(+b.dataset.arbre));
  z.querySelectorAll('[data-elevage]').forEach(b=>b.onclick=()=>toucherElevage(b.dataset.elevage));
  z.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>vendre(b.dataset.v));
  z.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>acheter(b.dataset.a));
  z.querySelectorAll('[data-outil]').forEach(b=>b.onclick=()=>ameliorer(b.dataset.outil));
  z.querySelectorAll('[data-rayon]').forEach(b=>b.onclick=()=>{rayon=b.dataset.rayon;rendre();});
  z.querySelectorAll('[data-rayonferme]').forEach(b=>b.onclick=()=>{
    rayon='ferme';vue='boutique';
    document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x.dataset.v==='boutique'));
    rendre();});
  z.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>livrer(+b.dataset.c));
}
function rendre(){
  auto();
  $('or').textContent=e.or.toLocaleString('fr-FR');
  $('niv').textContent=e.niv;
  $('xp-b').style.width=Math.round(e.xp/XP_NIV(e.niv)*100)+'%';
  $('xp-t').textContent=e.xp+'/'+XP_NIV(e.niv);
  $('nom-ferme').textContent=e.ferme;
  assurerCommandes();
  $('pt-cmd').style.display=(e.commandes||[]).some(livrable)?'block':'none';
  $('corps').innerHTML=vue==='ferme'?vueFerme():vue==='marche'?vueMarche():
                       vue==='boutique'?vueBoutique():vueCommandes();
  brancher();
  if(e.tuto>0&&ETAPES[e.tuto]&&ETAPES[e.tuto].fait&&ETAPES[e.tuto].fait()&&!ETAPES[e.tuto]._ok){
    ETAPES[e.tuto]._ok=true;setTimeout(avancerTuto,420);
  }
  requestAnimationFrame(majTuto);
}
rendre();
setInterval(()=>{auto();if(vue==='ferme')rendre();sauver();},1000);
if(!e.accueilVu)ouvrirAccueil();

sb.auth.getUser().then(({data})=>{
  const f=data&&data.user&&data.user.user_metadata&&data.user.user_metadata.ferme;
  if(f&&e.ferme!==f){e.ferme=f;sauver();$('nom-ferme').textContent=f;}
}).catch(()=>{});

</script>
