<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Battle Dock — MY design AIR</title>
<style>
html{touch-action:pan-x pan-y}
html,body{margin:0;height:100%;background:#0a0708;overflow:hidden;font-family:Georgia,serif}
#scene{position:fixed;image-rendering:pixelated}
#bas{position:fixed;left:0;right:0;bottom:0;padding:16px 20px calc(20px + env(safe-area-inset-bottom));text-align:center;
  background:linear-gradient(180deg,rgba(10,7,8,0),rgba(10,7,8,.92) 45%)}
#bas .sur{font:700 10px ui-monospace,monospace;letter-spacing:3px;color:#e8c06a}
#bas h1{margin:6px 0 4px;font:700 26px Georgia,serif;letter-spacing:2px;color:#fff3d0;text-shadow:0 0 14px rgba(255,120,200,.55),0 0 26px rgba(255,200,110,.35)}
#bas p{margin:0 0 12px;color:#c9bfa6;font-style:italic;font-size:14px;min-height:20px}
#sortir{border:0;border-radius:28px;padding:13px 28px;background:linear-gradient(#f4d98a,#c9a24a);color:#2a1a0a;font:700 15px Georgia,serif;letter-spacing:1px;box-shadow:0 3px 0 #7a5a1a}
</style>
<script>(function(){var non=function(e){e.preventDefault();};['gesturestart','gesturechange','gestureend'].forEach(function(t){document.addEventListener(t,non,{passive:false});});
document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault();},{passive:false});})();</script>
</head><body>
<canvas id="scene"></canvas>
<div id="bas"><div class="sur">VIEUX-PORT · QUAI D’EXTRAMAR</div><h1>MY design AIR</h1><p id="mot"></p><button id="sortir">Ressortir sur le quai</button></div>
<script>
/* =====================================================================
   MY design AIR — L'INTÉRIEUR DU SALON
   Un grand salon, un peu magique : un néon rose et or, une rangée de
   fauteuils, des coiffeurs qui s'affairent, et les dockers du port, gilet
   orange et bras tatoués, qui se font tailler la barbe et la tondeuse.
   Des mèches qui tombent, un apprenti qui balaie, le patron chauve au
   comptoir, et des paillettes d'or qui flottent dans la lumière.
   ===================================================================== */
const cv=document.getElementById('scene'), g=cv.getContext('2d');
const W=240, H=430;
function taille(){const r=Math.max(innerWidth/W,innerHeight/H);cv.width=W;cv.height=H;
  cv.style.width=Math.ceil(W*r)+'px';cv.style.height=Math.ceil(H*r)+'px';
  cv.style.left=Math.round((innerWidth-W*r)/2)+'px';cv.style.top=Math.round((innerHeight-H*r)/2-30)+'px';}
taille();addEventListener('resize',taille);
const al=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s);};
const R=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)));};

/* ---- LE DÉCOR FIXE, gravé une fois ---- */
const F=document.createElement('canvas');F.width=W;F.height=H;
(function graver(){
  const f=F.getContext('2d');
  const r=(x,y,w,h,c)=>{f.fillStyle=c;f.fillRect(Math.round(x),Math.round(y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)));};
  /* le mur du fond : lambris de noyer en bas, papier peint vert bouteille et or en haut */
  r(0,0,W,150,'#1f3a30');
  for(let x=0;x<W;x+=12)for(let y=6;y<130;y+=16){f.fillStyle='rgba(226,186,105,.18)';f.beginPath();
    f.moveTo(x+6,y);f.lineTo(x+9,y+4);f.lineTo(x+6,y+8);f.lineTo(x+3,y+4);f.closePath();f.fill();}
  r(0,118,W,4,'#c9a24a');r(0,122,W,44,'#4a2a18');
  for(let x=0;x<W;x+=30){r(x+2,126,26,36,'#5a3420');r(x+2,126,26,1,'#7a4a2c');r(x+27,126,1,36,'#2a160c');}
  r(0,162,W,4,'#c9a24a');
  /* les trois grands miroirs à ampoules, au-dessus de chaque poste */
  for(let k=0;k<3;k++){const mx=20+k*72;
    r(mx-2,34,58,70,'#c9a24a');r(mx,36,54,66,'#9ab8c4');
    const gr=f.createLinearGradient(mx,42,mx+54,108);gr.addColorStop(0,'rgba(255,255,255,.35)');gr.addColorStop(.5,'rgba(255,255,255,0)');gr.addColorStop(1,'rgba(255,255,255,.15)');
    f.fillStyle=gr;f.fillRect(mx,36,54,66);
    r(mx+4,64,46,38,'rgba(40,60,70,.35)');                                  /* le reflet du salon, dans le miroir */
    r(mx-2,104,58,6,'#2a1a10');r(mx-2,104,58,1,'#6a4a2c');                  /* la tablette */
    r(mx+4,98,4,6,'#3a7ab0');r(mx+10,96,3,8,'#e8e0c0');r(mx+15,99,5,5,'#c0392b');r(mx+44,97,6,7,'#1b1b1b');   /* flacons, tondeuse */
  }
  /* le sol : damier noir et blanc, en perspective douce */
  for(let y=166;y<H;y+=10){const k=(y-166)/(H-166), w=10+k*6;
    for(let x=-w, i=0;x<W+w;x+=w,i++){r(x,y,w,10,((i+Math.floor(y/10))%2)?'#1c1a1e':'#ece6da');}}
  f.fillStyle='rgba(0,0,0,.25)';f.fillRect(0,166,W,6);
  /* le comptoir du patron, en bas à gauche, et la caisse */

  /* le banc d'attente, en bas à droite, cuir vert capitonné */
  r(150,340,84,10,'#1f4a38');r(150,340,84,2,'#3f7a5a');for(let x=154;x<232;x+=8)r(x,343,1,1,'#0f2a1c');
  r(152,350,4,14,'#2a1a10');r(228,350,4,14,'#2a1a10');r(150,322,84,18,'#2a5a44');r(150,322,84,2,'#4a8a64');
  /* une plante dans un pot doré, et la machine à café */
  r(230,280,8,10,'#c9a24a');f.fillStyle='#3f7a44';for(let i=0;i<6;i++){f.beginPath();f.ellipse(234+Math.cos(i)*4,272-i*2,5,3,i,0,7);f.fill();}
  r(100,296,24,20,'#2a2c2e');r(102,298,20,8,'#8f959b');r(108,306,8,6,'#1b1b1b');r(110,312,4,3,'#f4f0e4');
})();

/* ---- UN PERSONNAGE, dessiné en pixels ---- */
function perso(x,y,o){
  /* o : {peau, cheveux, haut, bas, gilet, tablier, chauve, barbe, casquette, pose} */
  const p=o.peau||'#e0b48a';
  R(x-4,y-2,3,2,'#1b1b1b');R(x+1,y-2,3,2,'#1b1b1b');                      /* les chaussures */
  R(x-4,y-11,3,9,o.bas||'#2e3a52');R(x+1,y-11,3,9,o.bas||'#2e3a52');       /* les jambes */
  R(x-5,y-21,10,11,o.haut||'#f2efe4');                                     /* le buste */
  if(o.gilet){R(x-5,y-21,10,11,'#f07a20');R(x-5,y-16,10,2,'#e8e8c0');R(x-1,y-21,2,11,'#d86010');}
  if(o.tablier){R(x-4,y-19,8,11,'#1b1b1b');R(x-4,y-19,8,1,'#c9a24a');}
  R(x-2,y-24,4,3,p);                                                        /* le cou */
  R(x-4,y-31,8,8,p);                                                        /* la tête */
  if(o.chauve){R(x-3,y-31,3,1,'rgba(255,255,255,.7)');}
  else if(o.casquette){R(x-5,y-32,10,3,o.casquette);R(x+3,y-30,4,1,o.casquette);}
  else R(x-4,y-32,8,3,o.cheveux||'#3a2a1c');
  R(x-2,y-28,1,1,'#1b1b1b');R(x+1,y-28,1,1,'#1b1b1b');
  if(o.barbe)R(x-3,y-25,6,2,o.barbe);
}
/* LE CLIENT DANS LE FAUTEUIL : cape blanche, et sa tête qui change à mesure qu'on coupe */
function fauteuil(x,y,client,t,k){
  R(x-12,y+2,24,4,'#b9c1c7');R(x-2,y+6,4,14,'#8f959b');R(x-8,y+20,16,3,'#6a6f74');     /* le pied chromé */
  R(x-13,y-6,26,10,'#1a1a1a');R(x-13,y-6,26,1,'#3a3a3a');R(x-13,y-22,4,18,'#1a1a1a');R(x+9,y-22,4,18,'#1a1a1a');
  R(x-10,y-30,20,26,'#1a1a1a');R(x-10,y-30,20,1,'#3a3a3a');                            /* le dossier de cuir noir */
  R(x-9,y-20,18,18,'#f4f2ea');R(x-9,y-20,18,1,'#ffffff');                               /* la cape */
  const p=client.peau;R(x-2,y-22,4,3,p);R(x-4,y-30,8,8,p);
  R(x-2,y-27,1,1,'#1b1b1b');R(x+1,y-27,1,1,'#1b1b1b');
  /* la coupe avance : d'une tignasse à une coupe nette, puis ça recommence */
  const avance=((t/1000+k*3.3)%12)/12;
  const cheveux=Math.round(4*(1-avance));
  R(x-4,y-31-cheveux,8,cheveux+2,client.cheveux);
  if(client.barbe)R(x-3,y-24,6,Math.max(1,Math.round(3*(1-avance*0.7))),client.barbe);
  return avance;
}
/* LE COIFFEUR, debout derrière : son bras et ses ciseaux qui travaillent */
function coiffeur(x,y,c,t,k,outil){
  perso(x,y,{peau:c.peau,cheveux:c.cheveux,haut:c.haut,bas:'#1b1b1b',tablier:true,barbe:c.barbe});
  const a=Math.sin(t/(outil==='tondeuse'?90:160)+k)*2;
  R(x-7,y-20,3,7,c.haut);R(x-10,y-26+a,4,3,c.peau);                           /* le bras levé */
  if(outil==='ciseaux'){g.strokeStyle='#dfe4e8';g.lineWidth=1;const o=Math.abs(Math.sin(t/120+k))*2.5;
    g.beginPath();g.moveTo(x-11,y-27+a);g.lineTo(x-16,y-29+a-o);g.moveTo(x-11,y-27+a);g.lineTo(x-16,y-29+a+o);g.stroke();}
  else if(outil==='tondeuse'){R(x-16,y-29+a,6,3,'#2a2c2e');R(x-17,y-29+a,1,3,'#b9c1c7');}
  else{R(x-16,y-29+a,6,2,'#f4f2ea');}                                         /* le rasoir, pour la barbe */
}
const CLIENTS=[
  {peau:'#c98a5a',cheveux:'#1b1b1b',barbe:'#1b1b1b'},
  {peau:'#e0b48a',cheveux:'#8a3a22',barbe:'#8a3a22'},
  {peau:'#a8704a',cheveux:'#2a1a10',barbe:null}];
const COIFFEURS=[
  {peau:'#f0c8a0',cheveux:'#c9a24a',haut:'#f2efe4',barbe:null},
  {peau:'#c98a5a',cheveux:'#1b1b1b',haut:'#2a2a30',barbe:'#1b1b1b'},
  {peau:'#e0b48a',cheveux:'#6a3a8a',haut:'#f2efe4',barbe:null}];
const OUTILS=['ciseaux','tondeuse','rasoir'];
function grand(x,y,e2,fn){g.save();g.translate(Math.round(x),Math.round(y));g.scale(e2,e2);fn();g.restore();}
/* les mèches qui tombent, puis les paillettes */
const MECHES=[];
const MOTS=['« Dégradé à blanc, comme d’habitude ? »','« Alors, le cargo de ce matin, il était lourd ? »',
  '« Une serviette chaude pour la barbe, cadeau de la maison. »','« Regarde-moi ça : t’as rajeuni de dix ans ! »',
  '« Chez MY design AIR, même les dockers repartent beaux. »','« Le prochain, installe-toi, j’arrive. »'];
let dernierMot=-1;

function boucle(t){
  g.imageSmoothingEnabled=false;
  g.drawImage(F,0,0);
  /* LE NÉON, en haut : rose et or, qui palpite et grésille parfois */
  const gr=Math.floor(t/100)%37===0?0.35:1, pulse=0.75+0.25*Math.sin(t/400);
  g.save();g.shadowColor='rgba(255,90,190,'+(0.9*gr)+')';g.shadowBlur=10*pulse;
  g.font='italic 700 17px Georgia';g.textAlign='center';g.fillStyle='rgba(255,170,230,'+(gr*pulse).toFixed(2)+')';g.fillText('MY design AIR',W/2,28);
  g.shadowColor='rgba(255,210,120,.9)';g.shadowBlur=6;g.font='700 7px ui-monospace,monospace';g.fillStyle='rgba(255,226,150,'+gr+')';g.fillText('✂ BARBIER · COIFFEUR · DEPUIS 2026 ✂',W/2,38);g.restore();
  /* les ampoules des miroirs */
  for(let k=0;k<3;k++){const mx=20+k*72;for(let i=0;i<6;i++){const on=(Math.floor(t/300)+i+k)%9!==0;
    R(mx+3+i*9.4,32,3,3,on?'#fff4c8':'#8a7a4a');R(mx-4,40+i*10,3,3,on?'#fff4c8':'#8a7a4a');R(mx+55,40+i*10,3,3,on?'#fff4c8':'#8a7a4a');}}
  /* LES TROIS POSTES : le docker dans le fauteuil, le coiffeur derrière */
  for(let k=0;k<3;k++){
    const x=44+k*72, y=208, E=1.6;
    g.fillStyle='rgba(0,0,0,.28)';g.beginPath();g.ellipse(x+2,y+38,26,6,0,0,7);g.fill();
    let av=0;
    grand(x,y,E,()=>{av=fauteuil(0,0,CLIENTS[k],t,k);R(-9,-3,18,2,'#f07a20');R(-9,-3,18,1,'#e8e8c0');});
    grand(x+26,y+38,E,()=>coiffeur(0,0,COIFFEURS[k],t,k,OUTILS[k]));
    /* des mèches s'envolent pendant la coupe */
    if(av<0.85&&Math.random()<0.3)MECHES.push({x:x-5+Math.random()*10,y:y-50,vx:(Math.random()-.5)*14,vy:6+Math.random()*6,c:CLIENTS[k].cheveux,v:1.8});
  }
  for(let i=MECHES.length-1;i>=0;i--){const m=MECHES[i];m.x+=m.vx*0.016;m.y+=m.vy*0.016;m.vy+=0.4;m.v-=0.016;
    if(m.v<=0||m.y>250){MECHES.splice(i,1);continue;}R(m.x,m.y,2,1,m.c);}
  /* les mèches au sol, et l'apprenti qui les balaie en allant et venant */
  for(let i=0;i<50;i++)R(14+al(i)*212,250+al(i+40)*22,2,1,['#1b1b1b','#8a3a22','#2a1a10'][i%3]);
  const bx=40+((Math.sin(t/2600)+1)/2)*150, bs=Math.sin(t/260)*3;
  grand(bx,292,1.4,()=>{perso(0,0,{peau:'#f0c8a0',cheveux:'#e8c06a',haut:'#f2efe4',bas:'#1b1b1b',tablier:true});
    g.strokeStyle='#8a6238';g.lineWidth=1.2;g.beginPath();g.moveTo(4,-20);g.lineTo(8+bs,-2);g.stroke();R(5+bs,-3,8,3,'#c9a24a');});
  /* LE PATRON, chauve, au comptoir : le crâne qui brille, il salue */
  const salut=Math.sin(t/700)>0.6;
  grand(36,318,1.6,()=>{perso(0,0,{peau:'#d8a070',chauve:true,haut:'#141418',bas:'#1b1b1b',barbe:'#3a2a1c'});
    if(salut){R(4,-28,3,4,'#d8a070');R(5,-32,2,4,'#d8a070');}
    if(Math.floor(t/600)%4===0){R(-3,-31,2,1,'rgba(255,255,255,1)');}});
  /* le comptoir, devant lui, et sa caisse */
  R(4,300,66,34,'#2a1a10');R(4,300,66,4,'#c9a24a');R(6,304,62,28,'#3a2416');
  for(let x=8;x<66;x+=8)R(x,306,6,24,'#4a2e1c');
  R(50,290,16,10,'#1b1b1b');R(52,292,12,5,'#3aa0c8');
  g.font='700 5px Georgia';g.textAlign='center';g.fillStyle='#e8c06a';g.fillText('LE PATRON',37,322);
  /* LES DOCKERS QUI ATTENDENT sur le banc : l'un lit La Provence, l'autre tient son casque */
  grand(164,352,1.35,()=>{perso(0,0,{peau:'#c98a5a',cheveux:'#1b1b1b',haut:'#2e3a52',bas:'#2e3a52',gilet:true,barbe:'#1b1b1b'});
    R(-8,-24,18,12,'#ece6da');R(-8,-24,18,2,'#2a2a2a');for(let i=0;i<4;i++)R(-6,-20+i*2,14,1,'#8a8a8a');
    g.font='700 3px Georgia';g.textAlign='center';g.fillStyle='#1b1b1b';g.fillText('LA PROVENCE',1,-21);});
  grand(192,352,1.35,()=>{perso(0,0,{peau:'#e0b48a',cheveux:'#c9a24a',haut:'#2e3a52',bas:'#2e3a52',gilet:true});
    R(3,-14,8,5,'#f4d020');R(3,-14,8,1,'#fff080');});                                      /* le casque de chantier sur les genoux */
  grand(220,352,1.35,()=>perso(0,0,{peau:'#a8704a',casquette:'#2d4a6a',haut:'#2e3a52',bas:'#2e3a52',gilet:true,barbe:'#2a1a10'}));
  if(Math.sin(t/900)>0.7){g.font='8px Georgia';g.textAlign='left';g.fillText('💬',224,300);}
  /* LA MAGIE : des paillettes d'or qui flottent dans la lumière, et un grand rai de soleil */
  const rai=g.createLinearGradient(0,0,W*0.7,H*0.7);rai.addColorStop(0,'rgba(255,230,170,.16)');rai.addColorStop(1,'rgba(255,230,170,0)');
  g.fillStyle=rai;g.beginPath();g.moveTo(W,0);g.lineTo(W*0.62,0);g.lineTo(0,H*0.62);g.lineTo(0,H*0.9);g.closePath();g.fill();
  for(let i=0;i<46;i++){const x=(al(i)*W+Math.sin(t/1800+i)*10)%W, y=(al(i+46)*H*0.85-t/(60+i%7*18))%(H*0.85);
    const b=(Math.sin(t/300+i*2.3)+1)/2;R(x,(y+H*0.85)%(H*0.85),1,1,'rgba(255,236,170,'+(0.3+b*0.7).toFixed(2)+')');
    if(b>0.92){R(x-1,(y+H*0.85)%(H*0.85),3,1,'rgba(255,236,170,.5)');R(x,(y+H*0.85)%(H*0.85)-1,1,3,'rgba(255,236,170,.5)');}}
  /* les paroles, qui changent toutes les cinq secondes */
  const m=Math.floor(t/5000)%MOTS.length;if(m!==dernierMot){dernierMot=m;document.getElementById('mot').textContent=MOTS[m];}
  requestAnimationFrame(boucle);
}
requestAnimationFrame(boucle);
document.getElementById('sortir').onclick=()=>{location.href='jeu.html?carte=extramar';};
</script>
</body></html>
