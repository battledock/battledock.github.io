    .preview {

    .preview-avatar {

      border: 3px solid #ffffff;

      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;

      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
    }

    .preview-username {
      font-family: 'Bebas Neue', sans-serif;

      letter-spacing: 2px;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .preview-bio {

    .card {
      background: rgba(26, 26, 26, 0.85);
      backdrop-filter: blur(10px);

      margin-bottom: 16px;
      color: #ffffff;
    }

    .avatar-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    .avatar-option {
      aspect-ratio: 1;
      border: 2px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.05);
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
    }

    .avatar-option:active {
      transform: scale(0.95);
    }

    .avatar-option.selected {
      border-color: #ffffff;
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      margin-bottom: 8px;
      color: rgba(255, 255, 255, 0.8);
      letter-spacing: 0.5px;

    .form-input {
      width: 100%;
      padding: 12px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
      font-family: 'Special Elite', monospace;
      font-size: 13px;
      transition: all 0.3s;
    }

    .form-input:focus {
      outline: none;
      border-color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
    }

    textarea.form-input {
      resize: vertical;
      min-height: 80px;
    }

    .char-count {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      text-align: right;
      margin-top: 4px;
    }

    .btn {
      width: 100%;
      padding: 16px;
      border: 2px solid #ffffff;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s;
      background: #ffffff;
      color: #1a1a1a;
    }

    .btn:active {
      transform: scale(0.98);

<body>

    <!-- Avatar Selection -->

    <!-- Bio -->

      <div class="section-title">✍️ BIOGRAPHIE</div>
      <div class="form-group">
        <label class="form-label">Parlez de vous (150 caractères max)</label>
        <textarea class="form-input" id="bioInput" maxlength="150" placeholder="Le meilleur docker de Marseille"></textarea>
        <div class="char-count"><span id="charCount">0</span>/150</div>
      </div>
    </div>

    <button class="btn" onclick="saveProfile()">💾 ENREGISTRER</button>
  </div>

  <script>

    const { createClient } = supabase;
    const supabaseClient = createClient(supabaseUrl, supabaseKey);

        [0,1,4,1,1,4,1,0],
        [0,0,1,4,4,1,0,0]
      ],
      // 4. Docker avec lunettes
      [
        [0,0,3,3,3,3,0,0],

        [0,6,2,1,1,2,6,0],

        [0,1,1,4,4,1,1,0],

      ],

      [

      ],

      [

      [
        [0,0,3,3,3,3,0,0],

    // Palette de couleurs
    const colors = {
      0: 'transparent',
      1: '#ffd7a8',  // Peau
      2: '#000000',  // Yeux
      3: '#fbbf24',  // Casque jaune
      4: '#8b4513',  // Bouche
      5: '#654321',  // Barbe/Cheveux
      6: '#333333',  // Lunettes/Bandeau
      7: '#dc2626',  // Rouge (casque/bandana/cicatrice)
      8: '#3b82f6',  // Bleu (casque)
      9: '#f97316',  // Orange (casque)
      10: '#22c55e'  // Vert (casque)
    };

    function drawAvatar(canvas, avatarData) {
      const ctx = canvas.getContext('2d');
      const pixelSize = 8;
      ctx.clearRect(0, 0, 64, 64);
      
      for (let y = 0; y < 8; y++) {
        for (let x = 0; x < 8; x++) {
          const colorIndex = avatarData[y][x];
          ctx.fillStyle = colors[colorIndex];
          if (colorIndex !== 0) {
            ctx.fillRect(x * pixelSize, y * pixelSize, pixelSize, pixelSize);
          }
        }
      }
    }

    function initAvatarGrid() {
      const grid = document.getElementById('avatarGrid');
      dockerAvatars.forEach((avatarData, index) => {
        const option = document.createElement('div');
        option.className = 'avatar-option';
        const canvas = document.createElement('canvas');
        canvas.width = 64;
        canvas.height = 64;
        canvas.style.width = '100%';
        canvas.style.height = '100%';
        drawAvatar(canvas, avatarData);
        option.appendChild(canvas);
        option.onclick = () => selectAvatar(index);
        grid.appendChild(option);
      });
    }

    function selectAvatar(index) {
      selectedAvatar = index;
      document.querySelectorAll('.avatar-option').forEach((el, i) => {
        if (i === index) {
          el.classList.add('selected');
        } else {
          el.classList.remove('selected');
        }
      });
      updatePreview();
    }

    function updatePreview() {
      const previewCanvas = document.getElementById('previewCanvas');
      drawAvatar(previewCanvas, dockerAvatars[selectedAvatar]);
      
      const bio = document.getElementById('bioInput').value || 'Votre bio apparaîtra ici';
      document.getElementById('previewBio').textContent = bio;
    }

    document.getElementById('bioInput').addEventListener('input', (e) => {
      const count = e.target.value.length;
      document.getElementById('charCount').textContent = count;
      updatePreview();
    });

    async function loadCurrentProfile() {
      try {
        const { data } = await supabaseClient
          .from('profiles')
          .select('*')
          .eq('user_id', userId)
          .single();

        if (data) {
          selectedAvatar = data.avatar_emoji ? parseInt(data.avatar_emoji) || 0 : 0;
          
          document.getElementById('bioInput').value = data.bio || '';
          document.getElementById('charCount').textContent = (data.bio || '').length;
          document.getElementById('previewUsername').textContent = (data.username || username).toUpperCase();
          
          selectAvatar(selectedAvatar);
          updatePreview();
        }
      } catch (error) {
        console.error('Erreur:', error);
      }
    }

    async function saveProfile() {
      const bio = document.getElementById('bioInput').value;

      try {
        const { error } = await supabaseClient
          .from('profiles')
          .update({
            avatar_emoji: selectedAvatar.toString(),
            bio: bio
          })
          .eq('user_id', userId);

        if (error) throw error;

        const successMsg = document.getElementById('successMessage');
        successMsg.style.display = 'block';
        setTimeout(() => {
          successMsg.style.display = 'none';
          window.location.href = 'profile.html';
        }, 1500);

      } catch (error) {
        console.error('Erreur:', error);
        alert('Erreur : ' + error.message);
      }
    }

    // Init
    document.getElementById('previewUsername').textContent = username.toUpperCase();
    initAvatarGrid();
    loadCurrentProfile();
  </script>
</body>
</html>
