<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Syndicat — Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Bebas+Neue&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',sans-serif;background:#fff;color:#1a1a1a}
.hdr{position:fixed;top:0;left:0;right:0;z-index:100;background:#fff;padding:calc(env(safe-area-inset-top,0px)+10px) 16px 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #f3f4f6}
.hdr-back{background:#f3f4f6;border:none;border-radius:10px;width:34px;height:34px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#6b7280}
.hdr-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;color:#1a1a1a;flex:1}
.hdr-count{font-size:10px;color:#9ca3af;font-weight:700}
.content{padding:calc(env(safe-area-inset-top,0px)+65px) 14px calc(20px + env(safe-area-inset-bottom,0px))}

/* Hero */
.hero{text-align:center;padding:20px 0 16px}
.hero-emoji{font-size:48px}
.hero-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:3px;margin-top:6px}
.hero-sub{font-size:11px;color:#9ca3af;margin-top:4px}

/* Proposals */
.section{font-size:9px;font-weight:700;color:#9ca3af;letter-spacing:2px;margin:16px 0 8px;padding:0 2px}
.proposal{background:#fff;border:1px solid #f3f4f6;border-radius:14px;padding:16px;margin-bottom:10px;overflow:hidden}
.proposal.voted{border-color:#dcfce7}
.prop-header{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.prop-emoji{font-size:28px;flex-shrink:0}
.prop-title{font-size:14px;font-weight:800;color:#1a1a1a}
.prop-desc{font-size:11px;color:#6b7280;margin-top:3px;line-height:1.5}
.prop-tag{display:inline-block;font-size:8px;font-weight:700;padding:2px 8px;border-radius:6px;margin-top:4px}

/* Results bar */
.results{margin-top:10px}
.result-bar{height:8px;background:#f3f4f6;border-radius:4px;overflow:hidden;display:flex;margin-bottom:4px}
.result-pour{height:100%;background:#22c55e;border-radius:4px 0 0 4px;transition:width .5s}
.result-contre{height:100%;background:#ef4444;border-radius:0 4px 4px 0;transition:width .5s}
.result-labels{display:flex;justify-content:space-between;font-size:9px;font-weight:700}
.result-pour-lbl{color:#16a34a}
.result-contre-lbl{color:#dc2626}
.result-total{font-size:8px;color:#9ca3af;text-align:center;margin-top:2px}

/* Vote buttons */
.vote-btns{display:flex;gap:8px;margin-top:10px}
.vote-btn{flex:1;padding:12px;border-radius:12px;font-size:13px;font-weight:800;cursor:pointer;text-align:center;border:none;transition:transform .1s}
.vote-btn:active{transform:scale(.96)}
.vote-pour{background:#f0fdf4;color:#16a34a;border:1px solid #dcfce7}
.vote-contre{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
.vote-btn.selected{opacity:1}
.vote-btn.dimmed{opacity:.35;cursor:default}
.voted-tag{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;font-size:11px;font-weight:700;border-radius:10px;margin-top:10px}
.voted-pour{background:#f0fdf4;color:#16a34a}
.voted-contre{background:#fef2f2;color:#dc2626}

/* History */
.hist-row{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid #f3f4f6}
.hist-row:last-child{border-bottom:none}
.hist-emoji{font-size:20px}
.hist-title{font-size:12px;font-weight:700;color:#1a1a1a}
.hist-result{font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px}
.hist-adopte{background:#f0fdf4;color:#16a34a}
.hist-rejete{background:#fef2f2;color:#dc2626}

.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:9px 18px;border-radius:20px;font-size:11px;font-weight:700;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
</style>
</head>
<body>

<div class="hdr">
  <button class="hdr-back" onclick="location.href='game.html'">←</button>
  <div class="hdr-title">🗳️ SYNDICAT</div>
  <div class="hdr-count" id="member-count">— membres</div>
</div>

<div class="content">
  <div class="hero">
    <div class="hero-emoji">🗳️</div>
    <div class="hero-title">VOTE & DÉCIDE</div>
    <div class="hero-sub">Chaque docker a une voix. Choisis l'avenir du port.</div>
  </div>

  <div class="section">VOTES EN COURS</div>
  <div id="active-proposals"></div>

  <div class="section">VOTES TERMINÉS</div>
  <div id="history-proposals" style="background:#fff;border:1px solid #f3f4f6;border-radius:14px;overflow:hidden"></div>
</div>

<div class="toast" id="toast-el"></div>

<script>
var SB_URL='https://drtsuhnbclhmgfjiykap.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
var sb=supabase.createClient(SB_URL,SB_KEY);
var _me=null,_myVotes={};

function toast(msg){var t=document.getElementById('toast-el');t.textContent=msg;t.style.opacity='1';clearTimeout(t._t);t._t=setTimeout(function(){t.style.opacity='0';},2800);}

// ══ PROPOSITIONS ══
// Statut : 'active' = en cours, 'closed' = terminé
var PROPOSALS=[
  {id:'ecole',emoji:'🎓',title:'École des Dockers',desc:'Ajouter un système de formation avec des cours, diplômes et certifications qui débloquent de nouveaux métiers.',tag:'GAMEPLAY',tagColor:'#3b82f6',status:'active'},
  {id:'metiers',emoji:'👨‍🔧',title:'Nouveaux métiers',desc:'Grutier, plongeur, capitaine... chaque métier avec ses avantages et son gameplay unique.',tag:'CONTENU',tagColor:'#8b5cf6',status:'active'},
  {id:'saisons',emoji:'🏆',title:'Système de saisons',desc:'Saisons de 30 jours avec classement, récompenses exclusives et reset partiel.',tag:'COMPÉTITION',tagColor:'#f59e0b',status:'active'},
  {id:'immobilier',emoji:'🏠',title:'Immobilier',desc:'Acheter des appartements, entrepôts et terrains au port. Revenus passifs + décoration.',tag:'ÉCONOMIE',tagColor:'#059669',status:'active'},
  {id:'pvp_arena',emoji:'⚔️',title:'Arène PvP',desc:'Combats 1v1 en temps réel avec paris. Le perdant paie, le gagnant empoche.',tag:'PVP',tagColor:'#dc2626',status:'active'},
  {id:'peche',emoji:'🎣',title:'Système de pêche',desc:'Mini-jeu de pêche avec collection de poissons, vente au marché et records.',tag:'MINI-JEU',tagColor:'#0ea5e9',status:'active'},
  // Exemples terminés
  {id:'casino',emoji:'🎰',title:'Casino du port',desc:'Roulette, Blackjack, Slots, Crash et Higher/Lower.',tag:'MINI-JEU',tagColor:'#0ea5e9',status:'closed',result:'adopte',pour:14,contre:3},
  {id:'commerce_v2',emoji:'🏢',title:'Commerce v2',desc:'Employés, espionnage, guerre des prix, partenariats.',tag:'GAMEPLAY',tagColor:'#3b82f6',status:'closed',result:'adopte',pour:11,contre:2},
];

async function init(){
  var sess=await sb.auth.getSession();
  if(!sess.data.session){location.href='index.html';return;}
  _me=sess.data.session.user;

  // Charger mes votes
  var gs=await sb.from('game_stats').select('syndicat').eq('user_id',_me.id).maybeSingle();
  _myVotes=(gs.data&&gs.data.syndicat&&typeof gs.data.syndicat==='object')?gs.data.syndicat:{};

  // Compter les membres
  var cnt=await sb.from('profiles').select('user_id',{count:'exact',head:true});
  document.getElementById('member-count').textContent=(cnt.count||0)+' membres';

  // Charger les résultats pour les propositions actives
  await loadResults();
  render();
}

var _results={}; // {proposal_id: {pour:X, contre:Y}}

async function loadResults(){
  // Fetch all players' syndicat votes
  var res=await sb.from('game_stats').select('syndicat').not('syndicat','is',null);
  _results={};
  PROPOSALS.forEach(function(p){_results[p.id]={pour:0,contre:0};});
  (res.data||[]).forEach(function(row){
    var votes=row.syndicat;
    if(!votes||typeof votes!=='object')return;
    Object.keys(votes).forEach(function(pid){
      if(!_results[pid])_results[pid]={pour:0,contre:0};
      if(votes[pid]==='pour')_results[pid].pour++;
      if(votes[pid]==='contre')_results[pid].contre++;
    });
  });
}

function render(){
  var activeEl=document.getElementById('active-proposals');
  var histEl=document.getElementById('history-proposals');
  var activeHtml='',histHtml='';

  PROPOSALS.forEach(function(p){
    if(p.status==='active'){
      var myVote=_myVotes[p.id]||null;
      var r=_results[p.id]||{pour:0,contre:0};
      var total=r.pour+r.contre;
      var pctPour=total>0?Math.round(r.pour/total*100):50;
      var pctContre=total>0?100-pctPour:50;

      activeHtml+='<div class="proposal'+(myVote?' voted':'')+'">'
        +'<div class="prop-header"><div class="prop-emoji">'+p.emoji+'</div><div style="flex:1">'
        +'<div class="prop-title">'+p.title+'</div>'
        +'<div class="prop-desc">'+p.desc+'</div>'
        +'<div class="prop-tag" style="background:'+p.tagColor+'15;color:'+p.tagColor+'">'+p.tag+'</div>'
        +'</div></div>';

      // Results bar
      activeHtml+='<div class="results"><div class="result-bar">'
        +'<div class="result-pour" style="width:'+pctPour+'%"></div>'
        +'<div class="result-contre" style="width:'+pctContre+'%"></div></div>'
        +'<div class="result-labels"><div class="result-pour-lbl">✓ POUR '+pctPour+'%</div>'
        +'<div class="result-contre-lbl">CONTRE '+pctContre+'% ✕</div></div>'
        +'<div class="result-total">'+total+' vote'+(total>1?'s':'')+'</div></div>';

      // Vote buttons or voted tag
      if(myVote){
        activeHtml+='<div class="voted-tag '+(myVote==='pour'?'voted-pour':'voted-contre')+'">'
          +(myVote==='pour'?'✓ Tu as voté POUR':'✕ Tu as voté CONTRE')+'</div>';
      }else{
        activeHtml+='<div class="vote-btns">'
          +'<button class="vote-btn vote-pour" onclick="vote(\''+p.id+'\',\'pour\')">✓ POUR</button>'
          +'<button class="vote-btn vote-contre" onclick="vote(\''+p.id+'\',\'contre\')">✕ CONTRE</button></div>';
      }
      activeHtml+='</div>';

    }else{
      // History
      var rp=p.pour||0,rc=p.contre||0;
      histHtml+='<div class="hist-row"><div class="hist-emoji">'+p.emoji+'</div>'
        +'<div style="flex:1"><div class="hist-title">'+p.title+'</div>'
        +'<div style="font-size:9px;color:#9ca3af;margin-top:1px">'+rp+' pour · '+rc+' contre</div></div>'
        +'<div class="hist-result '+(p.result==='adopte'?'hist-adopte':'hist-rejete')+'">'
        +(p.result==='adopte'?'✓ ADOPTÉ':'✕ REJETÉ')+'</div></div>';
    }
  });

  if(!activeHtml)activeHtml='<div style="text-align:center;padding:20px;font-size:11px;color:#9ca3af">Aucun vote en cours</div>';
  if(!histHtml)histHtml='<div style="padding:14px;text-align:center;font-size:11px;color:#9ca3af">Aucun historique</div>';

  activeEl.innerHTML=activeHtml;
  histEl.innerHTML=histHtml;
}

async function vote(proposalId,choice){
  if(_myVotes[proposalId]){toast('Tu as déjà voté');return;}
  _myVotes[proposalId]=choice;

  await sb.from('game_stats').update({syndicat:_myVotes}).eq('user_id',_me.id);

  // Update local results
  if(!_results[proposalId])_results[proposalId]={pour:0,contre:0};
  _results[proposalId][choice]++;

  toast('🗳️ Vote enregistré — '+(choice==='pour'?'POUR':'CONTRE'));
  render();
}

init();
</script>
</body>
</html>
