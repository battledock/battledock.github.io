<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Syndicat — Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bangers&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
body{font-family:'Inter',sans-serif;background:#f5f0e8;min-height:100vh;padding-bottom:calc(env(safe-area-inset-bottom,20px)+20px)}
.hdr{padding:calc(env(safe-area-inset-top,44px)+10px) 14px 14px;background:linear-gradient(135deg,#dc2626,#b91c1c);border-bottom:3px solid #1a1a1a;text-align:center;position:relative}
.card{background:#fff;border:3px solid #1a1a1a;border-radius:12px;margin:8px 12px;box-shadow:3px 3px 0 #1a1a1a;overflow:hidden}
.btn{border:2px solid #1a1a1a;border-radius:8px;padding:10px 16px;font-family:'Bangers',cursive;font-size:13px;letter-spacing:1px;cursor:pointer;box-shadow:2px 2px 0 #1a1a1a;text-align:center;color:#fff;display:block;width:100%}
.btn:active{box-shadow:0 0 0;transform:translate(2px,2px)}
.sec{padding:10px 14px 4px;font-size:7px;font-weight:800;color:#999;letter-spacing:2px}
.rank-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #f3f4f6}
.rank-row:last-child{border:none}
.rank-pos{font-family:'Bebas Neue',sans-serif;font-size:14px;width:22px;text-align:center}
.rank-name{font-size:11px;font-weight:800;color:#1a1a1a;flex:1}
.rank-score{font-family:'Bebas Neue',sans-serif;font-size:13px;color:#dc2626}
.tag{font-size:7px;font-weight:700;border-radius:5px;padding:2px 7px;display:inline-block}
.countdown{font-family:'Bebas Neue',sans-serif;font-size:11px;color:rgba(255,255,255,.4);letter-spacing:2px;margin-top:4px}
.event-desc{font-size:11px;color:#374151;line-height:1.5;padding:12px 14px}
.reward-row{display:flex;align-items:center;gap:8px;padding:6px 14px}
.reward-medal{font-size:18px}
.reward-info{flex:1;font-size:10px;color:#374151}
.reward-prize{font-family:'Bebas Neue',sans-serif;font-size:13px;color:#d97706}
.past-event{padding:10px 14px;border-bottom:1px solid #f3f4f6;display:flex;align-items:center;gap:10px}
.past-event:last-child{border:none}
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,20px)+10px);left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:12px;font-size:12px;font-weight:700;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="hdr">
  <div style="font-size:28px;margin-bottom:2px">🏛️</div>
  <div style="font-family:'Bangers',cursive;font-size:24px;color:#fff;letter-spacing:2px;text-shadow:2px 2px 0 rgba(0,0,0,.2)">SYNDICAT DES DOCKERS</div>
  <div style="font-size:8px;color:rgba(255,255,255,.35);letter-spacing:2px;font-weight:700;margin-top:2px">ÉVÉNEMENTS HEBDOMADAIRES</div>
  <div style="position:absolute;left:14px;top:calc(env(safe-area-inset-top,44px)+14px);font-size:14px;color:rgba(255,255,255,.4);cursor:pointer" onclick="location.href='game.html'">←</div>
</div>

<!-- Current event -->
<div class="card" id="eventCard" style="border-color:#dc2626">
  <div style="padding:14px;background:linear-gradient(135deg,#fef2f2,#fff)" id="eventHeader"></div>
  <div class="event-desc" id="eventDesc"></div>
  <div style="padding:0 14px 4px"><div class="countdown" id="eventCountdown" style="color:#999"></div></div>
  <div style="padding:8px 14px 14px" id="eventAction"></div>
</div>

<!-- Participation -->
<div class="card" id="participationCard" style="display:none">
  <div style="padding:14px;text-align:center">
    <div style="font-family:'Bangers',cursive;font-size:16px;color:#1a1a1a;letter-spacing:1px">TA PARTICIPATION</div>
    <div style="font-family:'Bebas Neue',sans-serif;font-size:28px;color:#dc2626;margin-top:4px" id="myScore">0</div>
    <div style="font-size:8px;color:#999;font-weight:700;letter-spacing:1px" id="myScoreLabel">SCORE</div>
  </div>
</div>

<!-- Rewards -->
<div class="sec">🎁 RÉCOMPENSES</div>
<div class="card" id="rewardsCard"></div>

<!-- Leaderboard -->
<div class="sec">🏆 CLASSEMENT DE LA SEMAINE</div>
<div class="card" id="leaderboard">
  <div style="padding:20px;text-align:center;color:#999;font-size:11px">Chargement...</div>
</div>

<!-- Past events -->
<div class="sec">📜 ÉVÉNEMENTS PASSÉS</div>
<div class="card" id="pastEvents">
  <div style="padding:20px;text-align:center;color:#999;font-size:11px">Aucun</div>
</div>

<!-- Back button -->
<div style="padding:10px 12px">
  <div onclick="location.href='game.html'" style="padding:14px;text-align:center;background:#fff;border:3px solid #1a1a1a;border-radius:12px;cursor:pointer;font-family:'Bangers',cursive;font-size:14px;color:#1a1a1a;letter-spacing:1px;box-shadow:3px 3px 0 #1a1a1a">← RETOUR AU PORT</div>
</div>

<div class="toast" id="toast"></div>

<script>
var SB_URL='https://drtsuhnbclhmgfjiykap.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
var sb=supabase.createClient(SB_URL,SB_KEY);
var CU=null,myRecords={};

// ═══ EVENTS POOL ═══
var EVENTS=[
  {id:'grue_tournament',name:'Tournoi de Grue',emoji:'🏗️',color:'#f59e0b',
   desc:'Qui sera le meilleur grutier du port cette semaine ? Fais le meilleur score à la grue et grimpe au classement !',
   scoreField:'grue_best',scoreLabel:'MEILLEUR SCORE',unit:'pts',
   link:'grue.html',linkText:'JOUER À LA GRUE',
   rewards:[{pos:'🥇',text:'1er — Champion de la grue',prize:'+50 000€ +10💎'},{pos:'🥈',text:'2ème',prize:'+25 000€ +5💎'},{pos:'🥉',text:'3ème',prize:'+10 000€ +3💎'}]},

  {id:'clark_gp',name:'Grand Prix de Clarks',emoji:'🏎️',color:'#ef4444',
   desc:'La course de la semaine ! Bats le record du circuit et deviens le pilote le plus rapide du port.',
   scoreField:'clark_best',scoreLabel:'MEILLEUR TEMPS',unit:'s',invert:true,
   link:'clark.html',linkText:'COURSE DE CLARKS',
   rewards:[{pos:'🥇',text:'1er — Pilote légendaire',prize:'+50 000€ +10💎'},{pos:'🥈',text:'2ème',prize:'+25 000€ +5💎'},{pos:'🥉',text:'3ème',prize:'+10 000€ +3💎'}]},

  {id:'click_rush',name:'Rush Containers',emoji:'📦',color:'#3b82f6',
   desc:'Clique comme un fou sur les containers cette semaine ! Chaque clic compte. Le docker avec le plus de clics gagne.',
   scoreField:'total_clicks_week',scoreLabel:'CLICS CETTE SEMAINE',unit:'clics',
   link:'clicker.html',linkText:'CLICKER',
   rewards:[{pos:'🥇',text:'1er — Machine à cliquer',prize:'+40 000€ +8💎'},{pos:'🥈',text:'2ème',prize:'+20 000€ +4💎'},{pos:'🥉',text:'3ème',prize:'+10 000€ +2💎'}]},

  {id:'mogul',name:'Mogul Challenge',emoji:'💰',color:'#d97706',
   desc:'Qui investira le plus dans son entreprise cette semaine ? Montre que t\'es un vrai businessman du port.',
   scoreField:'invested_week',scoreLabel:'INVESTI CETTE SEMAINE',unit:'€',
   link:'commerce.html',linkText:'MON COMMERCE',
   rewards:[{pos:'🥇',text:'1er — Magnat du port',prize:'+60 000€ +15💎'},{pos:'🥈',text:'2ème',prize:'+30 000€ +8💎'},{pos:'🥉',text:'3ème',prize:'+15 000€ +5💎'}]},

  {id:'solidarity',name:'Solidarité du Port',emoji:'🤝',color:'#16a34a',
   desc:'Objectif collectif ! TOUS les joueurs doivent contribuer ensemble pour atteindre le but. Si on réussit, TOUT LE MONDE gagne !',
   scoreField:'solidarity_contrib',scoreLabel:'TA CONTRIBUTION',unit:'€',collective:true,
   collectiveGoal:500000,collectiveReward:'+15 000€ pour TOUS',
   link:'commerce.html',linkText:'CONTRIBUER',
   rewards:[{pos:'🎯',text:'Objectif: 500 000€ collectifs',prize:'Si atteint: +15 000€/joueur'}]},

  {id:'casino_week',name:'Semaine du Casino',emoji:'🎰',color:'#8b5cf6',
   desc:'Cette semaine, les gains au casino comptent double ! Le joueur avec les plus gros gains totaux au casino remporte le jackpot.',
   scoreField:'casino_gains_week',scoreLabel:'GAINS CASINO',unit:'€',
   link:'casino.html',linkText:'ALLER AU CASINO',
   rewards:[{pos:'🥇',text:'1er — Roi du casino',prize:'+50 000€ +10💎'},{pos:'🥈',text:'2ème',prize:'+25 000€ +5💎'},{pos:'🥉',text:'3ème',prize:'+10 000€ +3💎'}]},
];

function fm(n){return n>=1e6?(n/1e6).toFixed(1)+'M€':n>=1000?Math.floor(n/1000)+'k€':n+'€';}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2500);}

// Get current week number (ISO)
function getWeekNum(){
  var d=new Date();var onejan=new Date(d.getFullYear(),0,1);
  return Math.ceil(((d-onejan)/86400000+onejan.getDay()+1)/7);
}

function getCurrentEvent(){
  var week=getWeekNum();
  return EVENTS[week%EVENTS.length];
}

function getTimeToNextMonday(){
  var now=new Date();
  var day=now.getDay();var diff=(day===0?1:8-day);
  var next=new Date(now);next.setDate(now.getDate()+diff);next.setHours(0,0,0,0);
  var ms=next-now;
  var d=Math.floor(ms/86400000);var h=Math.floor((ms%86400000)/3600000);
  return d+'j '+h+'h';
}

function renderEvent(){
  var ev=getCurrentEvent();
  var hdr=document.getElementById('eventHeader');
  hdr.innerHTML='<div style="display:flex;align-items:center;gap:12px"><div style="font-size:36px">'+ev.emoji+'</div><div style="flex:1"><div style="font-family:Bangers,cursive;font-size:20px;color:#1a1a1a;letter-spacing:1px">'+ev.name+'</div><div class="tag" style="background:'+ev.color+'15;color:'+ev.color+';border:1px solid '+ev.color+'30;margin-top:3px">SEMAINE '+getWeekNum()+'</div></div></div>';
  
  document.getElementById('eventDesc').textContent=ev.desc;
  document.getElementById('eventCountdown').textContent='⏱ Fin dans '+getTimeToNextMonday();

  var actH='<div class="btn" style="background:'+ev.color+'" onclick="location.href=\''+ev.link+'\'">'+ev.linkText+' →</div>';
  document.getElementById('eventAction').innerHTML=actH;

  // Rewards
  var rH='';
  ev.rewards.forEach(function(r){
    rH+='<div class="reward-row"><div class="reward-medal">'+r.pos+'</div><div class="reward-info">'+r.text+'</div><div class="reward-prize">'+r.prize+'</div></div>';
  });
  document.getElementById('rewardsCard').innerHTML=rH;
}

async function loadLeaderboard(){
  var ev=getCurrentEvent();
  try{
    var {data:all}=await sb.from('game_stats').select('user_id,records').not('records','is',null);
    var {data:profiles}=await sb.from('profiles').select('user_id,username');
    var pMap={};if(profiles)profiles.forEach(function(p){pMap[p.user_id]=p.username;});

    var scores=[];
    if(all)all.forEach(function(row){
      var r=row.records||{};
      var weekKey='week_'+getWeekNum();
      var eventData=(r.syndicat&&r.syndicat[weekKey])||{};
      var score=eventData[ev.scoreField]||0;
      if(score>0)scores.push({user_id:row.user_id,name:pMap[row.user_id]||'?',score:score});
    });

    // Sort
    if(ev.invert)scores.sort(function(a,b){return a.score-b.score;});
    else scores.sort(function(a,b){return b.score-a.score;});

    // Collective event
    if(ev.collective){
      var total=scores.reduce(function(s,x){return s+x.score;},0);
      var pct=Math.min(100,Math.round(total/ev.collectiveGoal*100));
      var h='<div style="padding:14px;text-align:center"><div style="font-family:Bangers,cursive;font-size:16px;color:#1a1a1a">OBJECTIF COLLECTIF</div>';
      h+='<div style="font-family:Bebas Neue,sans-serif;font-size:28px;color:'+(pct>=100?'#16a34a':'#d97706')+'">'+fm(total)+' / '+fm(ev.collectiveGoal)+'</div>';
      h+='<div style="height:8px;background:#f3f4f6;border-radius:4px;margin:8px 0;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:'+(pct>=100?'#16a34a':'#d97706')+';border-radius:4px;transition:width .5s"></div></div>';
      h+='<div style="font-size:9px;color:#999">'+scores.length+' participants · '+pct+'%</div>';
      if(pct>=100)h+='<div style="margin-top:8px;font-size:11px;color:#16a34a;font-weight:700">🎉 OBJECTIF ATTEINT !</div>';
      h+='</div>';
      // Still show top contributors
      h+='<div style="border-top:1px solid #f3f4f6;padding:6px 14px 2px;font-size:7px;font-weight:800;color:#999;letter-spacing:2px">TOP CONTRIBUTEURS</div>';
      scores.slice(0,10).forEach(function(s,i){
        var medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':'';
        var isMe=s.user_id===CU.id;
        h+='<div class="rank-row" style="'+(isMe?'background:rgba(251,191,36,.06)':'')+'">';
        h+='<div class="rank-pos" style="color:'+(i<3?'#d97706':'#9ca3af')+'">'+(medal||(i+1))+'</div>';
        h+='<div class="rank-name">'+s.name+'</div>';
        h+='<div class="rank-score">'+fm(s.score)+'</div></div>';
      });
      document.getElementById('leaderboard').innerHTML=h;
    }else{
      if(!scores.length){document.getElementById('leaderboard').innerHTML='<div style="padding:20px;text-align:center;color:#999;font-size:11px">Aucun participant encore. Sois le premier !</div>';return;}
      var h='';
      scores.slice(0,20).forEach(function(s,i){
        var medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':'';
        var isMe=s.user_id===CU.id;
        h+='<div class="rank-row" style="'+(isMe?'background:rgba(251,191,36,.06);border-left:3px solid #fbbf24':'')+'">';
        h+='<div class="rank-pos" style="color:'+(i<3?'#d97706':'#9ca3af')+'">'+(medal||(i+1))+'</div>';
        h+='<div class="rank-name">'+(isMe?'<b>'+s.name+'</b>':s.name)+'</div>';
        h+='<div class="rank-score">'+s.score+(ev.unit==='s'?'s':ev.unit==='€'?'€':'')+'</div></div>';
      });
      document.getElementById('leaderboard').innerHTML=h;
    }

    // My participation
    var myEntry=scores.find(function(s){return s.user_id===CU.id;});
    if(myEntry){
      document.getElementById('participationCard').style.display='block';
      document.getElementById('myScore').textContent=ev.unit==='€'?fm(myEntry.score):myEntry.score;
      document.getElementById('myScoreLabel').textContent=ev.scoreLabel;
    }
  }catch(e){document.getElementById('leaderboard').innerHTML='<div style="padding:20px;text-align:center;color:#ef4444;font-size:11px">Erreur</div>';}
}

function renderPastEvents(){
  var currentWeek=getWeekNum();
  var h='';
  for(var w=currentWeek-1;w>=Math.max(1,currentWeek-4);w--){
    var ev=EVENTS[w%EVENTS.length];
    h+='<div class="past-event"><div style="font-size:22px">'+ev.emoji+'</div><div style="flex:1"><div style="font-size:11px;font-weight:800;color:#1a1a1a">'+ev.name+'</div><div style="font-size:8px;color:#999">Semaine '+w+'</div></div><div class="tag" style="background:#f3f4f6;color:#999;border:1px solid #e5e7eb">TERMINÉ</div></div>';
  }
  if(h)document.getElementById('pastEvents').innerHTML=h;
}

(async function(){
  var r=await sb.auth.getSession();var s=r.data&&r.data.session;
  if(!s){location.href='index.html';return;}CU=s.user;
  renderEvent();
  renderPastEvents();
  await loadLeaderboard();
})();
</script>
</body>
</html>
