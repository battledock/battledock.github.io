<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Syndicat — Battle Dock</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',sans-serif;background:#fff;color:#1a1a1a}
.hdr{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);padding:calc(env(safe-area-inset-top,0px)+10px) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #f3f4f6}
.hdr-back{background:#f3f4f6;border:none;border-radius:10px;width:34px;height:34px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#6b7280;flex-shrink:0}
.hdr-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px;color:#1a1a1a;flex:1}
.hdr-badge{background:#f0fdf4;border:1px solid #dcfce7;border-radius:8px;padding:3px 8px;font-size:10px;font-weight:700;color:#16a34a}
.scroll{position:fixed;top:0;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top,0px)+58px) 0 calc(20px + env(safe-area-inset-bottom,0px))}
.hero{text-align:center;padding:18px 16px 12px}
.hero-emoji{font-size:44px}
.hero-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:3px;margin-top:4px}
.hero-sub{font-size:10px;color:#9ca3af;margin-top:3px;line-height:1.4}
.sec{font-size:8px;font-weight:800;color:#9ca3af;letter-spacing:2px;padding:0 16px;margin:14px 0 6px}
.prop{margin:0 12px 8px;background:#fff;border:1px solid #f3f4f6;border-radius:14px;padding:14px;overflow:hidden}
.prop.voted{border-color:#bbf7d0}
.prop.player{border-left:3px solid #fbbf24}
.prop-top{display:flex;gap:10px;align-items:flex-start}
.prop-icon{font-size:26px;flex-shrink:0;line-height:1}
.prop-info{flex:1;min-width:0}
.prop-title{font-size:13px;font-weight:800;color:#1a1a1a;line-height:1.2}
.prop-desc{font-size:10px;color:#6b7280;margin-top:3px;line-height:1.4}
.prop-tag{display:inline-block;font-size:7px;font-weight:800;padding:2px 6px;border-radius:5px;margin-top:4px;letter-spacing:.5px}
.prop-author{font-size:8px;color:#9ca3af;margin-top:4px}
.rbar{margin-top:10px}
.rbar-track{height:6px;background:#f3f4f6;border-radius:3px;overflow:hidden;display:flex}
.rbar-pour{height:100%;background:#22c55e;transition:width .5s}
.rbar-contre{height:100%;background:#ef4444;transition:width .5s}
.rbar-labels{display:flex;justify-content:space-between;margin-top:3px}
.rbar-l{font-size:9px;font-weight:700}
.rbar-l.pour{color:#16a34a}
.rbar-l.contre{color:#dc2626}
.rbar-total{font-size:7px;color:#9ca3af;text-align:center;margin-top:1px}
.vbtns{display:flex;gap:6px;margin-top:10px}
.vbtn{flex:1;padding:11px;border-radius:10px;font-size:12px;font-weight:800;cursor:pointer;text-align:center;border:none;transition:transform .1s}
.vbtn:active{transform:scale(.96)}
.vbtn.pour{background:#f0fdf4;color:#16a34a;border:1.5px solid #dcfce7}
.vbtn.contre{background:#fef2f2;color:#dc2626;border:1.5px solid #fecaca}
.voted-tag{display:flex;align-items:center;justify-content:center;gap:4px;padding:9px;font-size:10px;font-weight:700;border-radius:10px;margin-top:10px}
.voted-tag.pour{background:#f0fdf4;color:#16a34a}
.voted-tag.contre{background:#fef2f2;color:#dc2626}
.hist{margin:0 12px;background:#fff;border:1px solid #f3f4f6;border-radius:14px;overflow:hidden}
.hist-row{display:flex;align-items:center;gap:8px;padding:10px 12px}
.hist-row+.hist-row{border-top:1px solid #f3f4f6}
.hist-icon{font-size:18px;flex-shrink:0}
.hist-title{font-size:11px;font-weight:700;color:#1a1a1a;flex:1;min-width:0}
.hist-sub{font-size:8px;color:#9ca3af}
.hist-badge{font-size:8px;font-weight:800;padding:2px 7px;border-radius:5px;flex-shrink:0}
.hist-badge.ok{background:#f0fdf4;color:#16a34a}
.hist-badge.ko{background:#fef2f2;color:#dc2626}

/* Propose form */
.propose-card{margin:0 12px 8px;background:#fefce8;border:1px solid #fde68a;border-radius:14px;padding:14px}
.propose-cost{font-size:10px;color:#92400e;font-weight:700;margin-bottom:8px}
.propose-input{width:100%;background:#fff;border:1px solid #fde68a;border-radius:8px;padding:8px 10px;font-size:12px;font-family:'Inter',sans-serif;margin-bottom:6px;color:#1a1a1a}
.propose-input::placeholder{color:#d1d5db}
.propose-textarea{width:100%;background:#fff;border:1px solid #fde68a;border-radius:8px;padding:8px 10px;font-size:11px;font-family:'Inter',sans-serif;resize:none;height:60px;margin-bottom:8px;color:#1a1a1a}
.propose-btn{width:100%;padding:11px;border:none;border-radius:10px;background:#d97706;color:#fff;font-size:12px;font-weight:800;cursor:pointer}
.propose-btn:active{transform:scale(.97)}
.propose-btn:disabled{opacity:.4;cursor:default}

.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:9px 18px;border-radius:20px;font-size:11px;font-weight:700;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.empty{text-align:center;padding:20px;font-size:10px;color:#9ca3af}

/* Page transition */
body{animation:pageIn .3s ease}
@keyframes pageIn{from{opacity:0}to{opacity:1}}
body.page-out{animation:pageOut .2s ease forwards}
@keyframes pageOut{from{opacity:1}to{opacity:0}}
</style>
</head>
<body>
<div class="hdr">
  <button class="hdr-back" onclick="location.href='game.html'">←</button>
  <div class="hdr-title">🗳️ SYNDICAT</div>
  <div class="hdr-badge" id="hdr-count">—</div>
</div>
<div class="scroll">
  <div class="hero">
    <div class="hero-emoji">🗳️</div>
    <div class="hero-title">VOTE & DÉCIDE</div>
    <div class="hero-sub">Chaque docker a une voix.<br>Choisis l'avenir du port.</div>
  </div>

  <div class="sec">PROPOSER UNE IDÉE</div>
  <div class="propose-card">
    <div class="propose-cost" id="propose-cost">Coût : 100 000€</div>
    <input class="propose-input" id="propose-title" placeholder="Titre de ta proposition" maxlength="40">
    <textarea class="propose-textarea" id="propose-desc" placeholder="Décris ton idée en quelques mots..." maxlength="120"></textarea>
    <button class="propose-btn" id="propose-btn" onclick="submitProposal()">📣 PROPOSER</button>
  </div>

  <div class="sec">VOTES EN COURS</div>
  <div id="active"></div>

  <div class="sec">HISTORIQUE</div>
  <div class="hist" id="history"></div>
</div>
<div class="toast" id="toast-el"></div>

<script>
var SB_URL='https://drtsuhnbclhmgfjiykap.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
var sb=supabase.createClient(SB_URL,SB_KEY);
var _me=null,_myData={},_myMoney=0,_results={},_allProposals=[];

function toast(m){var t=document.getElementById('toast-el');t.textContent=m;t.style.opacity='1';clearTimeout(t._t);t._t=setTimeout(function(){t.style.opacity='0';},2800);}

// Official proposals
var OFFICIAL=[
  {id:'ecole',emoji:'🎓',title:'École des Dockers',desc:'Formation, diplômes et certifications qui débloquent de nouveaux métiers.',tag:'GAMEPLAY',tc:'#3b82f6',s:'active',official:true},
  {id:'metiers',emoji:'👨‍🔧',title:'Nouveaux métiers',desc:'Grutier, plongeur, capitaine — chaque métier avec son gameplay unique.',tag:'CONTENU',tc:'#8b5cf6',s:'active',official:true},
  {id:'saisons',emoji:'🏆',title:'Saisons compétitives',desc:'Saisons de 30 jours avec classement, récompenses et reset.',tag:'COMPÉTITION',tc:'#f59e0b',s:'active',official:true},
  {id:'immobilier',emoji:'🏠',title:'Immobilier du port',desc:'Acheter terrains et entrepôts. Revenus passifs + décoration.',tag:'ÉCONOMIE',tc:'#059669',s:'active',official:true},
  {id:'pvp',emoji:'⚔️',title:'Arène PvP',desc:'Combats 1v1 avec paris. Le perdant paie, le gagnant empoche.',tag:'PVP',tc:'#dc2626',s:'active',official:true},
  {id:'peche',emoji:'🎣',title:'Pêche au port',desc:'Mini-jeu de pêche avec collection, vente et records.',tag:'MINI-JEU',tc:'#0ea5e9',s:'active',official:true},
  // Terminés
  {id:'casino',emoji:'🎰',title:'Casino du port',desc:'Roulette, Blackjack, Slots, Crash et Higher/Lower.',tag:'MINI-JEU',tc:'#0ea5e9',s:'closed',r:'ok',p:14,c:3,official:true},
  {id:'commerce2',emoji:'🏢',title:'Commerce v2',desc:'Employés, espionnage, guerre des prix, partenariats.',tag:'GAMEPLAY',tc:'#3b82f6',s:'closed',r:'ok',p:11,c:2,official:true},
];

function proposalCost(count){return 100000*(count+1);}

async function init(){
  var sess=await sb.auth.getSession();
  if(!sess.data.session){location.href='index.html';return;}
  _me=sess.data.session.user;

  var gs=await sb.from('game_stats').select('syndicat,money').eq('user_id',_me.id).maybeSingle();
  _myData=(gs.data&&gs.data.syndicat&&typeof gs.data.syndicat==='object')?gs.data.syndicat:{};
  _myMoney=gs.data?gs.data.money||0:0;
  if(!_myData.votes)_myData.votes={};
  if(!_myData.proposals)_myData.proposals=[];

  var cnt=await sb.from('profiles').select('user_id',{count:'exact',head:true});
  document.getElementById('hdr-count').textContent=(cnt.count||0)+' membres';

  // Update propose cost
  var cost=proposalCost(_myData.proposals.length);
  document.getElementById('propose-cost').textContent='Coût : '+cost.toLocaleString('fr-FR')+'€'+((_myData.proposals.length>0)?' (×'+(_myData.proposals.length+1)+')':'');

  await loadAll();
  render();
}

async function loadAll(){
  var res=await sb.from('game_stats').select('syndicat,user_id').not('syndicat','is',null);
  _results={};_allProposals=[];
  // Init results for official proposals
  OFFICIAL.forEach(function(p){_results[p.id]={pour:0,contre:0};});

  (res.data||[]).forEach(function(row){
    var s=row.syndicat;
    if(!s||typeof s!=='object')return;
    // Count votes
    var votes=s.votes||s; // backward compat: old format had votes at root
    if(typeof votes==='object'){
      Object.keys(votes).forEach(function(pid){
        if(pid==='proposals'||pid==='votes')return;
        if(!_results[pid])_results[pid]={pour:0,contre:0};
        if(votes[pid]==='pour')_results[pid].pour++;
        if(votes[pid]==='contre')_results[pid].contre++;
      });
    }
    // Collect player proposals
    if(Array.isArray(s.proposals)){
      s.proposals.forEach(function(p){
        // Avoid duplicates
        if(!_allProposals.some(function(x){return x.id===p.id;})){
          _allProposals.push(p);
          if(!_results[p.id])_results[p.id]={pour:0,contre:0};
        }
      });
    }
  });
}

function render(){
  var aEl=document.getElementById('active');
  var hEl=document.getElementById('history');
  var aH='',hH='';
  var myVotes=_myData.votes||{};

  // Render all active proposals (official + player)
  var allActive=OFFICIAL.filter(function(p){return p.s==='active';});
  _allProposals.forEach(function(p){
    allActive.push({id:p.id,emoji:'💡',title:p.title,desc:p.desc,tag:'JOUEUR',tc:'#d97706',s:'active',official:false,author:p.author||'Docker'});
  });

  allActive.forEach(function(p){
    var mv=myVotes[p.id]||null;
    var r=_results[p.id]||{pour:0,contre:0};
    var tot=r.pour+r.contre;
    var pp=tot>0?Math.round(r.pour/tot*100):50;

    aH+='<div class="prop'+(mv?' voted':'')+(p.official?'':' player')+'">'
      +'<div class="prop-top"><div class="prop-icon">'+p.emoji+'</div><div class="prop-info">'
      +'<div class="prop-title">'+p.title+'</div>'
      +'<div class="prop-desc">'+p.desc+'</div>'
      +'<div class="prop-tag" style="background:'+p.tc+'12;color:'+p.tc+'">'+p.tag+'</div>'
      +(p.author?'<div class="prop-author">Proposé par '+p.author+'</div>':'')
      +'</div></div>'
      +'<div class="rbar"><div class="rbar-track"><div class="rbar-pour" style="width:'+pp+'%"></div>'
      +'<div class="rbar-contre" style="width:'+(100-pp)+'%"></div></div>'
      +'<div class="rbar-labels"><div class="rbar-l pour">✓ '+pp+'%</div><div class="rbar-l contre">'+(100-pp)+'% ✕</div></div>'
      +'<div class="rbar-total">'+tot+' vote'+(tot>1?'s':'')+'</div></div>';

    if(mv){
      aH+='<div class="voted-tag '+(mv==='pour'?'pour':'contre')+'">'+(mv==='pour'?'✓ Voté POUR':'✕ Voté CONTRE')+'</div>';
    }else{
      aH+='<div class="vbtns"><button class="vbtn pour" onclick="vote(\''+p.id+'\',\'pour\')">✓ POUR</button>'
        +'<button class="vbtn contre" onclick="vote(\''+p.id+'\',\'contre\')">✕ CONTRE</button></div>';
    }
    aH+='</div>';
  });

  // History
  OFFICIAL.filter(function(p){return p.s==='closed';}).forEach(function(p){
    hH+='<div class="hist-row"><div class="hist-icon">'+p.emoji+'</div>'
      +'<div style="flex:1;min-width:0"><div class="hist-title">'+p.title+'</div>'
      +'<div class="hist-sub">'+(p.p||0)+' pour · '+(p.c||0)+' contre</div></div>'
      +'<div class="hist-badge '+(p.r==='ok'?'ok':'ko')+'">'+(p.r==='ok'?'ADOPTÉ':'REJETÉ')+'</div></div>';
  });

  aEl.innerHTML=aH||'<div class="empty">Aucun vote en cours</div>';
  hEl.innerHTML=hH||'<div class="empty">Aucun historique</div>';
}

async function vote(pid,choice){
  if(!_myData.votes)_myData.votes={};
  if(_myData.votes[pid]){toast('Déjà voté');return;}
  _myData.votes[pid]=choice;
  await sb.from('game_stats').update({syndicat:_myData}).eq('user_id',_me.id);
  if(!_results[pid])_results[pid]={pour:0,contre:0};
  _results[pid][choice]++;
  toast('🗳️ '+(choice==='pour'?'POUR':'CONTRE')+' enregistré');
  render();
}

async function submitProposal(){
  var title=document.getElementById('propose-title').value.trim();
  var desc=document.getElementById('propose-desc').value.trim();
  if(!title){toast('Titre requis');return;}
  if(title.length<3){toast('Titre trop court');return;}
  if(!desc){toast('Description requise');return;}

  var cost=proposalCost(_myData.proposals.length);
  if(_myMoney<cost){toast('Pas assez d\'argent ('+cost.toLocaleString('fr-FR')+'€)');return;}

  // Fetch username
  var prof=await sb.from('profiles').select('username').eq('user_id',_me.id).maybeSingle();
  var username=(prof.data&&prof.data.username)||'Docker';

  var proposal={
    id:'prop_'+Date.now()+'_'+Math.random().toString(36).substr(2,4),
    title:title,
    desc:desc,
    author:username,
    created_at:new Date().toISOString()
  };

  _myData.proposals.push(proposal);
  _myMoney-=cost;

  await sb.from('game_stats').update({syndicat:_myData,money:_myMoney}).eq('user_id',_me.id);

  // Add to local display
  _allProposals.push(proposal);
  _results[proposal.id]={pour:0,contre:0};

  document.getElementById('propose-title').value='';
  document.getElementById('propose-desc').value='';
  var newCost=proposalCost(_myData.proposals.length);
  document.getElementById('propose-cost').textContent='Coût : '+newCost.toLocaleString('fr-FR')+'€ (×'+(_myData.proposals.length+1)+')';

  toast('📣 Proposition soumise ! -'+cost.toLocaleString('fr-FR')+'€');
  render();
}

init();
</script>
<script>
// Page transitions
document.addEventListener('click',function(e){
  var a=e.target.closest('[onclick*="location.href"],[onclick*="location="]');
  if(!a)return;
  var m=a.getAttribute('onclick').match(/['"](.*?\.html.*?)['"]/);
  if(!m)return;
  e.preventDefault();e.stopPropagation();
  document.body.classList.add('page-out');
  setTimeout(function(){window.location.href=m[1];},200);
},true);
</script>
</body>
</html>
