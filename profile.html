<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Battle Dock - Profil Docker</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Special+Elite&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Special Elite', monospace;
      background: #000000;
      min-height: 100vh;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* Fond mesh gradient */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 30%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(74, 222, 128, 0.25) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(251, 191, 36, 0.2) 0%, transparent 50%),
        linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      z-index: 0;
      animation: meshMove 20s ease-in-out infinite;
    }

    @keyframes meshMove {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.8; }
    }

    .container {
      position: relative;
      z-index: 1;
      padding: 20px 16px 40px;
      max-width: 500px;
      margin: 0 auto;
    }

    /* 1. IDENTITÉ - Avatar & Statut */
    .identity-card {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(251, 191, 36, 0.3);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
      display: flex;
      gap: 16px;
      align-items: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    .avatar-circle {
      width: 90px;
      height: 90px;
      background: linear-gradient(135deg, #1a1a1a, #2d2d2d);
      border: 3px solid #fbbf24;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(251, 191, 36, 0.4);
      image-rendering: pixelated;
      position: relative;
    }

    .avatar-circle::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent, rgba(251, 191, 36, 0.6), transparent);
      animation: rotate 3s linear infinite;
      z-index: -1;
    }

    @keyframes rotate {
      to { transform: rotate(360deg); }
    }

    .avatar-circle canvas {
      width: 75px;
      height: 75px;
    }

    .identity-info {
      flex: 1;
      min-width: 0;
    }

    .username {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 26px;
      letter-spacing: 2px;
      color: #fbbf24;
      margin-bottom: 4px;
      text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .role-actuel {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 1.5px;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .dock-pass {
      display: inline-block;
      padding: 4px 12px;
      background: linear-gradient(135deg, #10b981, #059669);
      border-radius: 12px;
      font-size: 10px;
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 1px;
      font-weight: 700;
      text-transform: uppercase;
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.4);
    }

    .dock-pass.legendary {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      box-shadow: 0 2px 8px rgba(251, 191, 36, 0.4);
    }

    /* 2. NIVEAU & XP */
    .level-section {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
    }

    .level-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .level-anchor {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .level-icon {
      font-size: 32px;
      filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.6));
    }

    .level-number {
      font-family: 'Orbitron', sans-serif;
      font-size: 36px;
      font-weight: 900;
      color: #fbbf24;
      text-shadow: 0 0 15px rgba(251, 191, 36, 0.8);
    }

    .xp-next {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.6);
      text-align: right;
    }

    .xp-bar-container {
      width: 100%;
      height: 12px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 6px;
      border: 1px solid rgba(251, 191, 36, 0.2);
    }

    .xp-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #fbbf24, #f59e0b);
      border-radius: 6px;
      transition: width 0.5s;
      box-shadow: 0 0 10px rgba(251, 191, 36, 0.6);
    }

    .xp-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.5);
      text-align: center;
    }

    /* 3. PORTEFEUILLE */
    .wallet-section {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(20px);
      border: 2px solid #10b981;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.3);
    }

    .wallet-title {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .money-display {
      font-family: 'Orbitron', sans-serif;
      font-size: 40px;
      font-weight: 900;
      color: #10b981;
      text-shadow: 0 0 20px rgba(16, 185, 129, 0.8);
      margin-bottom: 8px;
      letter-spacing: 2px;
    }

    .passive-income {
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      color: #34d399;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 4. COMBAT STATS */
    .combat-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .combat-card {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(20px);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .combat-card.wins {
      border: 1px solid rgba(16, 185, 129, 0.5);
    }

    .combat-card.wins::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, #10b981, transparent);
    }

    .combat-card.losses {
      border: 1px solid rgba(239, 68, 68, 0.5);
    }

    .combat-card.losses::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, #ef4444, transparent);
    }

    .combat-icon {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .combat-value {
      font-family: 'Orbitron', sans-serif;
      font-size: 32px;
      font-weight: 900;
      margin-bottom: 4px;
    }

    .combat-card.wins .combat-value {
      color: #10b981;
    }

    .combat-card.losses .combat-value {
      color: #ef4444;
    }

    .combat-label {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.6);
      text-transform: uppercase;
    }

    /* Jauge de domination */
    .domination-bar {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .domination-title {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 10px;
      text-transform: uppercase;
      text-align: center;
    }

    .domination-container {
      display: flex;
      height: 24px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .domination-win {
      background: linear-gradient(90deg, #10b981, #059669);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 700;
      transition: width 0.5s;
    }

    .domination-loss {
      background: linear-gradient(90deg, #991b1b, #ef4444);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 700;
      transition: width 0.5s;
    }

    /* 5. CONTRÔLE DU PORT */
    .port-control {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(251, 191, 36, 0.3);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      text-align: center;
    }

    .port-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .port-percentage {
      font-family: 'Orbitron', sans-serif;
      font-size: 48px;
      font-weight: 900;
      color: #fbbf24;
      text-shadow: 0 0 20px rgba(251, 191, 36, 0.8);
      margin-bottom: 4px;
    }

    .port-label {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Actions */
    .actions {
      display: grid;
      gap: 12px;
      margin-bottom: 16px;
    }

    .action-btn {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 14px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      letter-spacing: 2px;
      cursor: pointer;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.3s;
    }

    .action-btn:active {
      transform: scale(0.98);
      border-color: rgba(251, 191, 36, 0.5);
      background: rgba(251, 191, 36, 0.1);
    }

    /* Bottom */
    .bottom-actions {
      display: flex;
      gap: 12px;
    }

    .bottom-btn {
      flex: 1;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 12px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 14px;
      letter-spacing: 1px;
      cursor: pointer;
      color: #ffffff;
      transition: all 0.3s;
    }

    .bottom-btn:active {
      transform: scale(0.95);
    }

    .bottom-btn.danger:active {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.5);
    }
  </style>
</head>
<body>

    <!-- 1. IDENTITÉ -->
    <div class="identity-card">

    const colors = {
      0: 'transparent', 1: '#ffd7a8', 2: '#000000', 3: '#fbbf24', 4: '#8b4513',
      5: '#654321', 6: '#333333', 7: '#dc2626', 8: '#3b82f6', 9: '#f97316', 10: '#22c55e'
    };

    function drawAvatar(canvas, avatarData) {
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 64, 64);
      for (let y = 0; y < 8; y++) {
        for (let x = 0; x < 8; x++) {
          const colorIndex = avatarData[y][x];
          ctx.fillStyle = colors[colorIndex];
          if (colorIndex !== 0) ctx.fillRect(x * 8, y * 8, 8, 8);
        }
      }
    }

    function formatMoney(amount) {
      return amount.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + '€';
    }

        window.location.href = 'index.html';
        return;

        const { data: profileData } = await supabaseClient.from('profiles').select('*').eq('user_id', userId).single();

        let progressData = progressArray?.[0];

        if (profileData && progressData) {
          // Avatar
          const avatarIndex = parseInt(profileData.avatar_emoji) || 0;
          if (dockerAvatars[avatarIndex]) drawAvatar(document.getElementById('avatarCanvas'), dockerAvatars[avatarIndex]);

          // Identité
          document.getElementById('username').textContent = (profileData.username || username).toUpperCase();
          document.getElementById('role').textContent = (progressData.rank || 'DOCKER OCCASIONNEL').toUpperCase();
          
          const level = progressData.level || 1;
          const passClass = level >= 50 ? 'legendary' : '';
          document.getElementById('dockPass').className = `dock-pass ${passClass}`;
          document.getElementById('dockPass').textContent = `🔒 DOCK PASS · NIV ${level}`;

          // Niveau & XP
          document.getElementById('level').textContent = level;
          const currentXP = progressData.xp || 0;
          const nextLevelXP = level * 1000;
          const xpPercent = (currentXP / nextLevelXP) * 100;
          document.getElementById('xpBar').style.width = `${xpPercent}%`;
          document.getElementById('xpText').textContent = `${currentXP.toLocaleString('fr-FR')} / ${nextLevelXP.toLocaleString('fr-FR')} XP`;
          document.getElementById('xpNext').textContent = `${nextLevelXP - currentXP} XP pour passer`;

          // Portefeuille
          document.getElementById('money').textContent = formatMoney(progressData.money || 100);
          document.getElementById('passiveIncome').textContent = `+0€ / heure`;

          // Combat
          const wins = progressData.combat_wins || 0;
          const losses = progressData.combat_losses || 0;
          const total = wins + losses;
          
          document.getElementById('wins').textContent = wins;
          document.getElementById('losses').textContent = losses;

          if (total > 0) {
            const winPercent = Math.round((wins / total) * 100);
            const lossPercent = 100 - winPercent;
            document.getElementById('dominationWin').style.width = `${winPercent}%`;
            document.getElementById('dominationWin').textContent = `${winPercent}%`;
            document.getElementById('dominationLoss').style.width = `${lossPercent}%`;
            document.getElementById('dominationLoss').textContent = `${lossPercent}%`;
          }

          // Contrôle du port (placeholder)
          document.getElementById('portControl').textContent = '0%';
        }
      } catch (error) {
        console.error('Erreur:', error);
      }
    }

    function logout() {
      if (confirm('Êtes-vous sûr de vouloir vous déconnecter ?')) {
        localStorage.clear();
        window.location.href = 'index.html';
      }
    }

    loadProfile();
  </script>
</body>
</html>
