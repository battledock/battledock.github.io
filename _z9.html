<!doctype html><html lang="fr"><head><meta charset="utf-8">
<style>html,body{margin:0;background:#9a958a;font:11px ui-monospace,monospace}
canvas{image-rendering:pixelated;display:block;margin:0 auto}</style></head>
<body><canvas id="c"></canvas>
<script>
// on extrait HGP_Z et HGA_Z de arcade.html
fetch('/arcade.html').then(r=>r.text()).then(src=>{
  const deb=src.indexOf('var HGP_Z=');
  const fin=src.indexOf('var HGP_G=');
  const bout=src.slice(deb,fin);
  (0,eval)(bout);
  const NOMS=['maigre','costaud','contremaitre','rampant','grutier','noye','brule','chien','soudeur'];
  const ORD=[0,1,2,4,5,3,6,7,8];
  const Z=8, CW=20*Z+10, CH=22*Z+26;
  const cv=document.getElementById('c');const g=cv.getContext('2d');
  cv.width=CW*9;cv.height=CH;g.imageSmoothingEnabled=false;
  ORD.forEach((ai,k)=>{
    const art=HGA_Z[ai], ox=k*CW+5, oy=CH-26-art.length*Z;
    g.fillStyle=k%2?'#a19c90':'#9a958a';g.fillRect(k*CW,0,CW,CH);
    art.forEach((l,j)=>{for(let i=0;i<l.length;i++){const c=HGP_Z[l[i]];if(!c)continue;
      g.fillStyle=c;g.fillRect(ox+i*Z,oy+j*Z,Z,Z);}});
    g.fillStyle='#2a2a26';g.font='bold 11px ui-monospace,monospace';g.textAlign='center';
    g.fillText(NOMS[ORD.indexOf(ai)>=0?ORD[k]:0].toUpperCase(),k*CW+CW/2,CH-8);
  });
});
</script></body></html>
