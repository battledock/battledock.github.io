<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PMU / Loto / Presse</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;background:#0d1622;font-family:Georgia,serif;color:#2b2419;overflow:hidden}
#ec{position:fixed;inset:0;display:flex;flex-direction:column}
/* ===== L'ENSEIGNE ===== */
#tete{flex:none;position:relative;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 0;
  background:linear-gradient(180deg,#132b42,#0d1d2e)}
#plaque{position:relative;border:2px solid #c0392b;border-radius:7px;background:#143352;
  box-shadow:0 0 0 2px #0a1828,0 6px 14px rgba(0,0,0,.5);padding:9px 8px 8px;text-align:center}
#plaque:before{content:'';position:absolute;inset:3px;border:1px solid rgba(255,255,255,.18);border-radius:4px}
#plaque b{display:block;font:900 17px Georgia;color:#f4f0e4;letter-spacing:1.2px}
#plaque i{display:block;font:italic 11px Georgia;color:#c9d8e4;margin-top:1px}
#plaque canvas{position:absolute;top:50%;transform:translateY(-50%);width:26px;height:26px;image-rendering:pixelated}
#plaque .g{left:8px}#plaque .d{right:8px}
#jauges{display:flex;gap:7px;padding:8px 2px 9px}
.jg{flex:1;display:flex;align-items:center;gap:7px;background:#0b1b2b;border:1px solid #27506e;
  border-radius:8px;padding:5px 8px}
.jg canvas{width:22px;height:22px;image-rendering:pixelated;flex:none}
.jg div{min-width:0}
.jg small{display:block;font:700 7px Arial;letter-spacing:1.6px;color:#7fa8c4}
.jg b{display:block;font:700 13px Georgia;color:#f0d78a;white-space:nowrap}
/* ===== LE CORPS : rail + contenu ===== */
#corps{flex:1;display:flex;min-height:0;background:#f4ead2;
  background-image:radial-gradient(rgba(120,96,56,.07) 1px,transparent 1px);background-size:7px 7px}
#rail{flex:none;width:92px;background:#143352;padding:8px 6px;overflow-y:auto;
  border-right:2px solid #c9a24a;scrollbar-width:none}
#rail::-webkit-scrollbar{display:none}
#rail button{width:100%;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;
  background:none;color:#a8c4d8;padding:9px 2px;border-radius:8px;font:700 8.5px Arial;letter-spacing:1px;
  margin-bottom:3px}
#rail button canvas{width:26px;height:26px;image-rendering:pixelated}
#rail button.on{background:#f4ead2;color:#143352;box-shadow:0 2px 6px rgba(0,0,0,.3)}
#page{flex:1;overflow-y:auto;padding:10px;overscroll-behavior:contain}
.sect{margin-bottom:14px}
.sh{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.sh canvas{width:18px;height:18px;image-rendering:pixelated;flex:none}
.sh b{font:900 13px Georgia;color:#143352;letter-spacing:.5px}
.sh i{flex:1;font:italic 10.5px Georgia;color:#8a7454;border-bottom:1px dotted #c3b391;
  padding-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.it{background:#fbf6e8;border:1px solid #d8c9a6;border-radius:8px;padding:8px 6px 7px;text-align:center;
  box-shadow:0 2px 0 rgba(120,96,56,.14)}
.it canvas{width:46px;height:46px;image-rendering:pixelated}
.it b{display:block;font:700 11.5px Georgia;color:#2f2820;margin-top:2px;line-height:1.15}
.it .px{display:inline-flex;align-items:center;gap:4px;margin-top:5px;background:#143352;color:#f0d78a;
  border-radius:11px;padding:3px 8px;font:700 10.5px Georgia}
.it .px u{width:8px;height:8px;border-radius:50%;background:#e2c070;text-decoration:none}
/* ===== LE PIED ===== */
#pied{flex:none;display:flex;align-items:center;gap:9px;background:#143352;border-top:2px solid #c9a24a;
  padding:9px 11px calc(env(safe-area-inset-bottom,0px) + 10px)}
#pied span{flex:1;font:italic 10.5px Georgia;color:#a8c4d8}
#pied button{border:1px solid #c9a24a;border-radius:8px;background:#0b1b2b;color:#f0d78a;
  padding:9px 13px;font:700 9.5px Arial;letter-spacing:1.5px}
</style></head><body>
<div id="ec">
  <div id="tete">
    <div id="plaque"><canvas class="g" width="52" height="52"></canvas>
      <b>PMU / LOTO / PRESSE</b><i>Ici, tout se joue !</i>
      <canvas class="d" width="52" height="52"></canvas></div>
    <div id="jauges">
      <div class="jg"><canvas width="44" height="44" data-i="piece"></canvas>
        <div><small>TON ARGENT</small><b>142,01 €</b></div></div>
      <div class="jg"><canvas width="44" height="44" data-i="sac"></canvas>
        <div><small>TON SAC</small><b>105 / 200</b></div></div></div>
  </div>
  <div id="corps"><div id="rail"></div><div id="page"></div></div>
  <div id="pied"><span>« Des paris, des rêves, et parfois des gains… »</span><button>RETOUR</button></div>
</div>
<script>
const dess=(cv,W,f)=>{const g=cv.getContext('2d');g.imageSmoothingEnabled=false;
  const S=cv.width/W;g.setTransform(S,0,0,S,0,0);
  f((x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)));},g);};
/* ===== LES DESSINS ===== */
const D={
 piece:(R)=>{for(let a=0;a<6.283;a+=0.1)R(11+Math.cos(a)*9,11+Math.sin(a)*9,3,3,'#a8822a');
   for(let a=0;a<6.283;a+=0.12)R(11+Math.cos(a)*6.4,11+Math.sin(a)*6.4,3,3,'#f0d78a');
   R(8,7,6,8,'#a8822a');R(9,8,4,2,'#f6e8b8');},
 sac:(R)=>{R(5,8,12,12,'#8a6238');R(5,8,12,3,'#a5764a');R(7,4,8,5,'#6a4a2a');
   R(9,3,4,3,'#8a6238');R(8,13,6,4,'#c9a24a');},
 clope:(R)=>{R(5,4,12,15,'#c0392b');R(5,4,12,4,'#e8604a');R(6,9,10,1,'#f2ece0');
   for(let k=0;k<4;k++)R(6+k*2.6,13,2,5,'#f6f2ea');R(6,13,2,5,'#e8dfc8');},
 rouler:(R)=>{R(3,7,16,10,'#2a5a8a');R(3,7,16,3,'#3f7aae');R(5,11,12,4,'#e8c46a');
   R(5,11,12,1,'#f6e0a8');R(7,5,8,3,'#1d3f5e');},
 briquet:(R)=>{R(7,6,8,14,'#2a6a9a');R(7,6,8,3,'#4f9ad8');R(8,3,6,4,'#8a8a92');
   R(9,1,2,3,'#e8c46a');R(8,14,6,4,'rgba(255,255,255,.28)');},
 feuilles:(R)=>{R(3,9,18,6,'#c0392b');R(3,9,18,2,'#e8604a');R(5,11,14,3,'#f6f2ea');
   R(5,11,14,1,'#fff');},
 cheval:(R)=>{R(5,9,11,6,'#f4f0e4');R(14,5,5,6,'#f4f0e4');R(18,6,3,2,'#f4f0e4');
   R(12,4,3,4,'#f4f0e4');R(5,14,2,6,'#f4f0e4');R(9,14,2,6,'#f4f0e4');R(14,14,2,5,'#f4f0e4');
   R(3,9,3,5,'#f4f0e4');R(17,7,1.4,1.4,'#143352');},
 ticket:(c1,c2)=>(R)=>{R(3,8,18,8,c1);R(3,8,18,2,c2);
   for(let k=0;k<4;k++)R(5+k*4,11,2,3,'rgba(255,255,255,.55)');
   R(3,8,2,8,c2);R(19,8,2,8,c2);},
 trefle:(R)=>{[[8,7],[14,7],[8,13],[14,13]].forEach(([x,y])=>{
     for(let a=0;a<6.283;a+=0.3)R(x+Math.cos(a)*3,y+Math.sin(a)*3,2.4,2.4,'#f4f0e4');});
   R(10,14,2,7,'#f4f0e4');},
 loto:(R)=>{const C=['#c0392b','#2a6a9a','#e8c46a','#2f7a4a'];
   for(let k=0;k<4;k++){const x=4+k*4.6;
     for(let a=0;a<6.283;a+=0.3)R(x+Math.cos(a)*2.6,12+Math.sin(a)*2.6,2.2,2.2,C[k]);
     R(x-1,11,2.4,2.4,'#f6f2ea');}},
 joker:(R)=>{R(2,8,20,8,'#c0392b');R(2,8,20,2,'#e8604a');R(4,10,16,4,'#f6f2ea');
   R(4,10,16,1,'#fff');},
 calendrier:(R)=>{R(4,5,16,16,'#f6f2ea');R(4,5,16,4,'#2a6a9a');
   R(7,3,2,4,'#5a6a74');R(15,3,2,4,'#5a6a74');
   for(let r=0;r<3;r++)for(let q=0;q<4;q++)R(6+q*3.4,11+r*3.2,2.4,2.2,(r===1&&q===2)?'#c0392b':'#c9d4dc');},
 journal:(R)=>{R(3,5,18,15,'#f2ece0');R(3,5,18,2,'#c9bda2');
   R(5,8,8,5,'#9aa0a8');for(let k=0;k<5;k++)R(14,8+k*2,6,1,'#9aa0a8');
   for(let k=0;k<4;k++)R(5,15+k*1.6,15,1,'#b4bcc4');},
 bouteille:(R)=>{R(9,3,5,4,'#2f6a4a');R(7,6,9,15,'#2f7a52');R(7,6,3,15,'#49a06a');
   R(8,12,7,6,'#f2ece0');R(9,2,5,2,'#8a6238');},
 bonbon:(R)=>{for(let a=0;a<6.283;a+=0.2)R(12+Math.cos(a)*5,12+Math.sin(a)*5,3,3,'#e0609a');
   R(3,10,5,5,'#f0a0c0');R(16,10,5,5,'#f0a0c0');R(10,10,3,3,'#f6c8dc');},
 panier:(R)=>{R(4,9,16,10,'#9a7146');R(4,9,16,2,'#b8905c');
   for(let k=0;k<5;k++)R(6+k*3,11,1.4,7,'#7d5934');
   for(let a=3.2;a<6.2;a+=0.25)R(12+Math.cos(a)*7,9+Math.sin(a)*7,2,2,'#8a6238');},
 plume:(R)=>{for(let i=0;i<15;i++){const w=6-i*0.3;
     R(16-i,4+i,w,2,i%2?'#f4f0e4':'#d8dce0');}R(3,18,4,3,'#f4f0e4');}};
/* ===== LE CATALOGUE ===== */
const RAIL=[
 {id:'pmu',nom:'PMU',ic:'cheval'},
 {id:'loto',nom:'Loto',ic:'trefle'},{id:'presse',nom:'Presse',ic:'journal'},
 {id:'boissons',nom:'Boissons',ic:'bouteille'},{id:'confiseries',nom:'Confiseries',ic:'bonbon'},
 {id:'divers',nom:'Divers',ic:'panier'}];
const SECT={
 pmu:[['PMU','Les courses, c’est ici que ça se passe !','cheval',[
   ['Simple','3,00 €','tk1'],['Couplé','5,00 €','tk2'],
   ['Trio','6,00 €','tk3'],['Multi','10,00 €','tk4']]]],
 loto:[['LOTO','Tentez votre chance, ça peut tout changer !','trefle',[
   ['Grille simple','2,20 €','loto'],['Grille multiple','4,40 €','loto'],
   ['Joker+','2,00 €','joker'],['Abonnement · 1 semaine','13,00 €','calendrier']]]],
 presse:[['PRESSE','Les nouvelles du port, et d’ailleurs.','journal',[
   ['Le quotidien','1,80 €','journal'],['L’hebdo du port','3,20 €','journal']]]],
 boissons:[['BOISSONS','De quoi se rafraîchir au comptoir.','bouteille',[
   ['Pastis','3,50 €','bouteille'],['Limonade','2,00 €','bouteille'],['Café','1,40 €','bouteille']]]],
 confiseries:[['CONFISERIES','Pour la route.','bonbon',[
   ['Berlingots','1,20 €','bonbon'],['Calisson','2,40 €','bonbon']]]],
 divers:[['DIVERS','Ce qu’on oublie toujours d’acheter.','panier',[
   ['Carnet','2,20 €','journal'],['Stylo','1,50 €','plume']]]]};
D.tk1=D.ticket('#2f7a4a','#49a06a');D.tk2=D.ticket('#2a6a9a','#4f9ad8');
D.tk3=D.ticket('#7a4a8a','#a86ab8');D.tk4=D.ticket('#c9821a','#e8a84a');
let actif='pmu';
const rail=document.getElementById('rail'),page=document.getElementById('page');
function faireRail(){
  rail.innerHTML='';
  RAIL.forEach(r=>{const b=document.createElement('button');
    b.className=r.id===actif?'on':'';
    b.innerHTML='<canvas width="52" height="52"></canvas>'+r.nom;
    b.onclick=()=>{actif=r.id;faireRail();rendre();};
    rail.appendChild(b);dess(b.querySelector('canvas'),24,D[r.ic]);});
}
function rendre(){
  page.innerHTML=SECT[actif].map(([t,s,ic,l])=>
    '<div class="sect"><div class="sh"><canvas width="36" height="36" data-h="'+ic+'"></canvas>'+
    '<b>'+t+'</b><i>'+s+'</i></div><div class="gr">'+
    l.map(([n,p,i])=>'<div class="it"><canvas width="92" height="92" data-i="'+i+'"></canvas>'+
      '<b>'+n+'</b><div class="px"><u></u>'+p+'</div></div>').join('')+'</div></div>').join('');
  page.querySelectorAll('canvas[data-i]').forEach(cv=>dess(cv,24,D[cv.dataset.i]));
  page.querySelectorAll('canvas[data-h]').forEach(cv=>dess(cv,24,D[cv.dataset.h]));
  page.scrollTop=0;
}
dess(document.querySelector('#plaque .g'),24,D.plume);
dess(document.querySelector('#plaque .d'),24,D.trefle);
document.querySelectorAll('#jauges canvas').forEach(cv=>dess(cv,24,D[cv.dataset.i]));
faireRail();rendre();
</script></body></html>
