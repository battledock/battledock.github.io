<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Défis - Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; -webkit-font-smoothing:antialiased; }
  body { font-family:'Inter',sans-serif; background:#160708; color:#f6e9e9; min-height:100dvh; padding:0 14px 30px; overflow-x:hidden; }
  .bg { position:fixed; inset:0; z-index:0; pointer-events:none; background:
      radial-gradient(120% 60% at 50% -5%, rgba(220,38,38,0.22), transparent 60%),
      linear-gradient(180deg,#2a0c0d,#160708 60%,#0c0405); }
  .wrap { position:relative; z-index:1; max-width:540px; margin:0 auto; }
  .hdr { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px; padding:14px 4px;
    background:linear-gradient(180deg,#160708,rgba(22,7,8,0.85)); backdrop-filter:blur(8px); }
  .hdr-title { flex:1; font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:2px;
    background:linear-gradient(135deg,#f87171,#fca5a5,#ef4444); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .wallet { font-family:'Bebas Neue',sans-serif; font-size:18px; color:#fbbf24; }

  .tabs { display:flex; gap:6px; margin:6px 0 16px; }
  .tab { flex:1; padding:10px; border-radius:11px; border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.04);
    font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:1px; color:rgba(255,255,255,0.6); cursor:pointer; text-align:center; }
  .tab.active { background:linear-gradient(135deg,#dc2626,#ef4444); color:#fff; border-color:transparent; }

  .card { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:16px; padding:15px; margin-bottom:12px; }
  .card-lbl { font-size:11px; letter-spacing:1px; text-transform:uppercase; color:rgba(255,255,255,0.45); margin-bottom:10px; }
  .stakes { display:flex; gap:8px; margin-bottom:14px; }
  .stake { flex:1; padding:12px 4px; border-radius:11px; border:1px solid rgba(255,255,255,0.12); background:rgba(255,255,255,0.04);
    font-family:'Bebas Neue',sans-serif; font-size:15px; color:#fff; cursor:pointer; text-align:center; }
  .stake.sel { background:linear-gradient(135deg,#b91c1c,#ef4444); border-color:transparent; }
  .btn { width:100%; border:none; border-radius:13px; padding:15px; font-family:'Bebas Neue',sans-serif; font-size:17px; letter-spacing:1px; cursor:pointer;
    background:linear-gradient(135deg,#dc2626,#f87171); color:#fff; }
  .btn:active{ transform:scale(0.98); } .btn:disabled{ opacity:0.4; }

  .duel { display:flex; align-items:center; gap:12px; }
  .duel-mid { flex:1; min-width:0; }
  .duel-name { font-family:'Bebas Neue',sans-serif; font-size:16px; color:#fff; letter-spacing:0.5px; }
  .duel-info { font-size:11px; color:rgba(255,255,255,0.5); margin-top:2px; }
  .duel-stake { font-family:'Bebas Neue',sans-serif; font-size:14px; color:#fbbf24; }
  .mini-btn { border:none; border-radius:10px; padding:10px 14px; font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:0.5px; cursor:pointer;
    background:linear-gradient(135deg,#b91c1c,#ef4444); color:#fff; flex-shrink:0; }
  .res { font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:0.5px; padding:7px 11px; border-radius:10px; flex-shrink:0; }
  .res.win { background:rgba(34,197,94,0.15); color:#86efac; } .res.lose { background:rgba(248,113,113,0.15); color:#fca5a5; }
  .res.tie { background:rgba(255,255,255,0.08); color:rgba(255,255,255,0.6); } .res.wait { background:rgba(251,191,36,0.12); color:#fcd34d; }

  .empty { text-align:center; padding:34px 14px; color:rgba(255,255,255,0.35); font-size:13px; }
  .loader { text-align:center; padding:50px; color:rgba(255,255,255,0.3); font-family:'Bebas Neue',sans-serif; letter-spacing:2px; }
  .back-bottom { width:100%; margin-top:18px; padding:15px; border-radius:14px; cursor:pointer;
    background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12); color:rgba(255,255,255,0.7);
    font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:2px; }
  .toast { position:fixed; top:18px; left:50%; transform:translateX(-50%) translateY(-20px); z-index:200;
    background:rgba(40,10,10,0.97); border:1px solid rgba(248,113,113,0.5); border-radius:12px; padding:11px 18px; font-size:13px; font-weight:700;
    opacity:0; transition:all .35s; max-width:90%; text-align:center; color:#fca5a5; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.good { border-color:rgba(34,197,94,0.5); color:#86efac; }

  /* MINI-JEU LE GRAPPIN */
  .play-ov { position:fixed; inset:0; z-index:100; background:rgba(12,4,5,0.97); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; }
  .play-title { font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:2px; color:#fff; margin-bottom:6px; }
  .play-sub { font-size:13px; color:rgba(255,255,255,0.55); margin-bottom:24px; text-align:center; }
  .play-round { font-family:'Bebas Neue',sans-serif; font-size:15px; letter-spacing:1px; color:#fca5a5; margin-bottom:14px; }
  .bar-wrap { width:100%; max-width:420px; height:54px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); border-radius:14px; position:relative; overflow:hidden; }
  .bar-zone { position:absolute; top:0; bottom:0; background:linear-gradient(180deg,rgba(34,197,94,0.45),rgba(34,197,94,0.25)); border-left:2px solid #4ade80; border-right:2px solid #4ade80; }
  .bar-zone-core { position:absolute; top:0; bottom:0; background:rgba(250,204,21,0.5); }
  .bar-marker { position:absolute; top:-4px; bottom:-4px; width:5px; background:#fff; box-shadow:0 0 10px #fff; border-radius:3px; }
  .play-score { font-family:'Bebas Neue',sans-serif; font-size:40px; color:#fbbf24; margin:16px 0 4px; min-height:46px; }
  .play-btn { width:100%; max-width:420px; border:none; border-radius:14px; padding:18px; font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:2px; cursor:pointer; background:linear-gradient(135deg,#dc2626,#f87171); color:#fff; margin-top:18px; }
  .play-btn:active{ transform:scale(0.98); }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="wrap">
    <div class="hdr">
      <div class="hdr-title">⚔️ Défis</div>
      <div class="wallet" id="wallet">—</div>
    </div>
    <div class="tabs">
      <div class="tab active" id="tab-create" onclick="setTab('create')">Lancer</div>
      <div class="tab" id="tab-open" onclick="setTab('open')">Ouverts</div>
      <div class="tab" id="tab-mine" onclick="setTab('mine')">Mes défis</div>
    </div>
    <div id="content"><div class="loader">…</div></div>
    <button class="back-bottom" onclick="window.location.href='game.html'">← Retour au jeu</button>
  </div>
  <div class="toast" id="toast"></div>

<script>
  const SB_URL = 'https://drtsuhnbclhmgfjiykap.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
  const sb = supabase.createClient(SB_URL, SB_KEY);

  const STAKES = [1000, 5000, 10000];
  let currentUser=null, username='Docker', money=0, tab='create', selStake=1000, openList=[], mine=[];
  const fmt=n=>Math.round(n).toLocaleString('fr-FR');

  async function init(){
    const { data:{ session } } = await sb.auth.getSession();
    if(!session){ window.location.href='index.html'; return; }
    currentUser=session.user;
    const [{ data:prof }, { data:gs }] = await Promise.all([
      sb.from('profiles').select('username').eq('user_id',currentUser.id).maybeSingle(),
      sb.from('game_stats').select('money').eq('user_id',currentUser.id).maybeSingle()
    ]);
    username = prof?.username || currentUser.email.split('@')[0];
    money = gs?.money || 0;
    await loadChallenges();
    await autoClaim();
    render();
  }

  async function loadChallenges(){
    try {
      const { data:op } = await sb.from('defis').select('*').eq('status','open').neq('challenger_id',currentUser.id).order('created_at',{ascending:false}).limit(30);
      openList = op || [];
      const { data:mi } = await sb.from('defis').select('*').or(`challenger_id.eq.${currentUser.id},opponent_id.eq.${currentUser.id}`).order('created_at',{ascending:false}).limit(30);
      mine = mi || [];
    } catch(e){ console.log('load:',e); openList=[]; mine=[]; }
  }

  async function autoClaim(){
    let claimed=0;
    for(const c of mine){
      if(c.challenger_id===currentUser.id && c.status==='done' && (c.challenger_payout||0)>0 && !c.challenger_claimed){
        money += c.challenger_payout; claimed += c.challenger_payout;
        try {
          await sb.from('game_stats').update({ money:Math.round(money) }).eq('user_id',currentUser.id);
          await sb.from('defis').update({ challenger_claimed:true }).eq('id',c.id);
          c.challenger_claimed=true;
        } catch(e){ console.log('claim:',e); }
      }
    }
    if(claimed>0) showToast(`🎁 Gains de défis récupérés : +${fmt(claimed)}€`, true);
  }

  function setTab(t){ tab=t; ['create','open','mine'].forEach(x=>document.getElementById('tab-'+x).classList.toggle('active',x===t)); render(); }

  function render(){
    document.getElementById('wallet').textContent = fmt(money)+'€';
    const c=document.getElementById('content');
    if(tab==='create'){
      c.innerHTML = `
        <div class="card">
          <div class="card-lbl">Choisis ta mise</div>
          <div class="stakes">${STAKES.map(s=>`<div class="stake ${s===selStake?'sel':''}" onclick="pickStake(${s})">${fmt(s)}€</div>`).join('')}</div>
          <button class="btn" ${money<selStake?'disabled':''} onclick="startCreate()">⚔️ Jouer mon défi (${fmt(selStake)}€)</button>
          <div style="font-size:11px;color:rgba(255,255,255,0.4);margin-top:10px;line-height:1.5;text-align:center">Tu joues 3 manches au Grappin. Ton score est posté en défi. Le premier qui te bat rafle la mise des deux — sinon tu doubles la tienne.</div>
        </div>`;
    } else if(tab==='open'){
      if(!openList.length){ c.innerHTML = `<div class="empty">Aucun défi ouvert pour l'instant.<br>Lance le tien dans l'onglet « Lancer » !</div>`; return; }
      c.innerHTML = openList.map(ch=>`
        <div class="card duel">
          <div style="font-size:28px">⚔️</div>
          <div class="duel-mid">
            <div class="duel-name">${esc(ch.challenger_name||'Docker')}</div>
            <div class="duel-info">Score à battre : <b>${ch.challenger_score}</b></div>
            <div class="duel-stake">Mise : ${fmt(ch.stake)}€ · gain ${fmt(ch.stake*2)}€</div>
          </div>
          <button class="mini-btn" ${money<ch.stake?'disabled style="opacity:.4"':''} onclick="startJoin('${ch.id}')">Relever</button>
        </div>`).join('');
    } else {
      if(!mine.length){ c.innerHTML = `<div class="empty">Tu n'as pas encore de défi.<br>Lance-en un !</div>`; return; }
      c.innerHTML = mine.map(ch=>{
        const iAmCh = ch.challenger_id===currentUser.id;
        const myScore = iAmCh ? ch.challenger_score : ch.opponent_score;
        const advName = iAmCh ? (ch.opponent_name||'—') : ch.challenger_name;
        const advScore = iAmCh ? (ch.opponent_score!=null?ch.opponent_score:'—') : ch.challenger_score;
        let res;
        if(ch.status==='open') res = `<div class="res wait">En attente</div>`;
        else if(ch.winner_id===null) res = `<div class="res tie">Égalité</div>`;
        else if(ch.winner_id===currentUser.id) res = `<div class="res win">Gagné +${fmt(ch.stake)}€</div>`;
        else res = `<div class="res lose">Perdu</div>`;
        return `<div class="card duel">
          <div style="font-size:28px">${ch.status==='open'?'⏳':'🏁'}</div>
          <div class="duel-mid">
            <div class="duel-name">vs ${esc(advName)}</div>
            <div class="duel-info">Toi : <b>${myScore}</b> · Lui : <b>${advScore}</b> · mise ${fmt(ch.stake)}€</div>
          </div>
          ${res}
        </div>`;
      }).join('');
    }
  }

  function pickStake(s){ selStake=s; render(); }
  function esc(t){ return (t||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }

  // ---- création ----
  function startCreate(){
    if(money<selStake){ showToast('Pas assez d\'argent.'); return; }
    playGrappin(async (score)=>{
      money -= selStake;
      try {
        await sb.from('game_stats').update({ money:Math.round(money) }).eq('user_id',currentUser.id);
        await sb.from('defis').insert({ challenger_id:currentUser.id, challenger_name:username, challenger_score:score, stake:selStake, status:'open' });
      } catch(e){ console.log('create:',e); showToast('Erreur, réessaie.'); }
      showToast(`Défi lancé ! Score ${score}, mise ${fmt(selStake)}€`, true);
      await loadChallenges(); setTab('mine');
    });
  }

  // ---- relever ----
  function startJoin(id){
    const ch = openList.find(x=>x.id===id); if(!ch) return;
    if(money<ch.stake){ showToast('Pas assez d\'argent.'); return; }
    playGrappin(async (score)=>{
      money -= ch.stake; // ma mise
      let winnerId, payoutChallenger=0, myGain=0;
      if(score > ch.challenger_score){ winnerId=currentUser.id; myGain=ch.stake*2; }
      else if(score < ch.challenger_score){ winnerId=ch.challenger_id; payoutChallenger=ch.stake*2; }
      else { winnerId=null; myGain=ch.stake; payoutChallenger=ch.stake; } // égalité : remboursés
      money += myGain;
      try {
        await sb.from('defis').update({
          opponent_id:currentUser.id, opponent_name:username, opponent_score:score,
          status:'done', winner_id:winnerId, challenger_payout:payoutChallenger
        }).eq('id',ch.id);
        await sb.from('game_stats').update({ money:Math.round(money) }).eq('user_id',currentUser.id);
      } catch(e){ console.log('join:',e); showToast('Erreur, réessaie.'); }
      if(winnerId===currentUser.id) showToast(`🏆 Gagné ! ${score} vs ${ch.challenger_score} · +${fmt(ch.stake)}€`, true);
      else if(winnerId===null) showToast(`Égalité ${score}-${ch.challenger_score}, mise rendue.`, true);
      else showToast(`Perdu ${score} vs ${ch.challenger_score}. La prochaine !`);
      await loadChallenges(); setTab('mine');
    });
  }

  // ---- MINI-JEU LE GRAPPIN (3 manches) ----
  function playGrappin(onDone){
    let round=0, total=0, pos=0, dir=1, timer=null, center=50, half=10, speed=1.4, stopped=false;
    const ov=document.createElement('div'); ov.className='play-ov';
    ov.innerHTML = `
      <div class="play-title">🪝 Le Grappin</div>
      <div class="play-sub">Lâche le grappin dans la zone. Plus c'est centré, plus tu marques.</div>
      <div class="play-round" id="pgRound">Manche 1 / 3</div>
      <div class="bar-wrap" id="pgBar">
        <div class="bar-zone" id="pgZone"></div>
        <div class="bar-zone-core" id="pgCore"></div>
        <div class="bar-marker" id="pgMark"></div>
      </div>
      <div class="play-score" id="pgScore"></div>
      <button class="play-btn" id="pgBtn">LÂCHER</button>`;
    document.body.appendChild(ov);
    const elMark=ov.querySelector('#pgMark'), elZone=ov.querySelector('#pgZone'), elCore=ov.querySelector('#pgCore'),
          elScore=ov.querySelector('#pgScore'), elBtn=ov.querySelector('#pgBtn'), elRound=ov.querySelector('#pgRound');

    function setupRound(){
      stopped=false; pos=0; dir=1;
      center = 18 + Math.random()*64;
      half = 11 - round*1.5;           // zone rétrécit
      speed = 1.4 + round*0.6;         // marqueur accélère
      elZone.style.left=(center-half)+'%'; elZone.style.width=(half*2)+'%';
      elCore.style.left=(center-3)+'%'; elCore.style.width='6%';
      elScore.textContent=''; elRound.textContent=`Manche ${round+1} / 3`;
      elBtn.textContent='LÂCHER'; elBtn.disabled=false;
      timer=setInterval(()=>{ pos+=dir*speed; if(pos>=100){pos=100;dir=-1;} if(pos<=0){pos=0;dir=1;} elMark.style.left=pos+'%'; },16);
    }
    function drop(){
      if(stopped) return; stopped=true; clearInterval(timer); elBtn.disabled=true;
      const dist=Math.abs(pos-center);
      const sc=Math.max(0, Math.round(100 - dist*1.8));
      total+=sc; elScore.textContent='+'+sc;
      setTimeout(()=>{
        round++;
        if(round>=3){
          elRound.textContent='Terminé !'; elScore.textContent=total+' pts'; elBtn.textContent='VALIDER'; elBtn.disabled=false;
          elBtn.onclick=()=>{ document.body.removeChild(ov); onDone(total); };
        } else { setupRound(); }
      }, 650);
    }
    elBtn.onclick=drop;
    setupRound();
  }

  let toastT=null;
  function showToast(msg,good){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show'+(good?' good':''); clearTimeout(toastT); toastT=setTimeout(()=>t.className='toast'+(good?' good':''),2600); }

  init();
</script>
</body>
</html>
