<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Journal du Port — Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;overflow:hidden}
body{font-family:'Inter',sans-serif;background:#faf8f2;color:#1a1a1a;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.hdr{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(250,248,242,.95);backdrop-filter:blur(8px);padding:calc(env(safe-area-inset-top,0px)+8px) 16px 8px;display:flex;align-items:center;gap:10px;border-bottom:2px solid #1a1a1a}
.hdr-back{background:none;border:1px solid #1a1a1a;border-radius:8px;width:32px;height:32px;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#1a1a1a;flex-shrink:0}
.hdr-title{font-family:'Playfair Display',serif;font-size:16px;font-weight:900;color:#1a1a1a;flex:1}
.hdr-date{font-size:9px;color:#9ca3af;font-weight:700;letter-spacing:1px}
.content{padding:calc(env(safe-area-inset-top,0px)+56px) 14px calc(20px + env(safe-area-inset-bottom,0px))}

/* Masthead */
.masthead{text-align:center;padding:16px 0 12px;border-bottom:3px double #1a1a1a;margin-bottom:14px}
.masthead-title{font-family:'Playfair Display',serif;font-size:clamp(28px,9vw,36px);font-weight:900;color:#1a1a1a;letter-spacing:2px;line-height:1}
.masthead-sub{font-size:8px;font-weight:700;color:#9ca3af;letter-spacing:4px;margin-top:4px}
.masthead-line{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:7px;color:#6b7280;font-weight:700;letter-spacing:1px}
.masthead-line::before,.masthead-line::after{content:'';flex:1;height:1px;background:#d1d5db}

/* Breaking */
.breaking{background:#dc2626;color:#fff;font-size:11px;font-weight:800;padding:8px 12px;border-radius:10px;margin-bottom:12px;display:flex;align-items:flex-start;gap:8px;line-height:1.4;word-break:break-word}
.breaking-badge{background:#fff;color:#dc2626;font-size:7px;font-weight:900;padding:2px 6px;border-radius:4px;letter-spacing:1px;flex-shrink:0;margin-top:1px}

/* Article */
.article{padding:12px 0;border-bottom:1px solid #e5e7eb}
.article:last-child{border-bottom:none}
.article-cat{font-size:7px;font-weight:800;letter-spacing:2px;margin-bottom:3px}
.article-title{font-family:'Playfair Display',serif;font-size:clamp(14px,4.5vw,16px);font-weight:900;color:#1a1a1a;line-height:1.3;word-break:break-word}
.article-body{font-size:11px;color:#6b7280;line-height:1.6;margin-top:4px}
.article-meta{font-size:8px;color:#9ca3af;margin-top:4px}
.article-img{font-size:28px;float:left;margin-right:8px;margin-bottom:4px;line-height:1}

/* Duo layout */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 0;border-bottom:1px solid #e5e7eb}
@media(max-width:360px){.duo{grid-template-columns:1fr;gap:8px}}
.duo-item{}
.duo-title{font-family:'Playfair Display',serif;font-size:clamp(11px,3.5vw,13px);font-weight:900;color:#1a1a1a;line-height:1.2}
.duo-body{font-size:9px;color:#6b7280;line-height:1.5;margin-top:3px}

/* NPC section */
.npc-sec{padding:10px 0;border-bottom:1px solid #e5e7eb}
.npc-title{font-family:'Playfair Display',serif;font-size:13px;font-weight:900;color:#1a1a1a;margin-bottom:6px}
.npc-item{padding:4px 0;font-size:10px;color:#6b7280;line-height:1.5;word-break:break-word}
.npc-item span{color:#1a1a1a;font-weight:700}

/* Footer */
.journal-footer{text-align:center;padding:16px 0;font-size:8px;color:#9ca3af;letter-spacing:2px;font-weight:700}
.loading{text-align:center;padding:40px;font-size:11px;color:#9ca3af}
</style>
</head>
<body>

<div class="hdr">
  <button class="hdr-back" onclick="location.href='game.html'">←</button>
  <div class="hdr-title">📰 LE JOURNAL DU PORT</div>
  <div class="hdr-date" id="hdr-date"></div>
</div>

<div class="content">
  <div class="masthead">
    <div class="masthead-title">LE JOURNAL DU PORT</div>
    <div class="masthead-sub">ÉDITION DE MARSEILLE</div>
    <div class="masthead-line" id="masthead-date">—</div>
  </div>
  <div id="news-content"><div class="loading">Chargement des nouvelles...</div></div>
  <div class="journal-footer">© 2026 — LE JOURNAL DU PORT — BATAILLE DOCK ÉDITIONS</div>
</div>

<script>
var SB_URL='https://drtsuhnbclhmgfjiykap.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
var sb=supabase.createClient(SB_URL,SB_KEY);

var NPC_NEWS=[
  {cat:'FAITS DIVERS',emoji:'👴',title:'Gégé se coince le dos en soulevant un cure-dent',body:'Le docker vétéran a été transporté à l\'hôpital pour la 47ème fois cette année. Le médecin a déclaré : "À ce stade, on lui réserve une chambre."'},
  {cat:'NATURE',emoji:'🐦',title:'Le goéland du quai 7 dépose un CV au syndicat',body:'L\'oiseau exige un salaire de 5 sardines de l\'heure et un bureau avec vue mer. Le syndicat étudie la demande "avec le plus grand sérieux".'},
  {cat:'RECORD',emoji:'😴',title:'Titouan bat son record : 14h de sieste consécutive',body:'Le docker a été retrouvé endormi sur un container de sardines. Il aurait murmuré "encore 5 minutes" avant de se rendormir.'},
  {cat:'TECHNOLOGIE',emoji:'🏗️',title:'Jeff affirme que la grue lui a dit bonjour',body:'Ses collègues sont "inquiets mais pas surpris". Jeff entretient une relation avec la grue du quai 3 depuis 2024.'},
  {cat:'CRISE',emoji:'☕',title:'La machine à café du port rend l\'âme',body:'État d\'urgence déclaré. La productivité a chuté de 90%. Gégé propose de la remplacer par un distributeur de pastis.'},
  {cat:'CUISINE',emoji:'🍲',title:'La bouillabaisse de la cantine provoque une émeute',body:'Doudou a mis trop de safran. Trois dockers ont été hospitalisés pour "excès de bonheur culinaire".'},
  {cat:'POLITIQUE',emoji:'👔',title:'Patrick Lavagne surpris en train de sourire',body:'Le patron du port a été aperçu avec un sourire ce matin. Les témoins sont "choqués et déstabilisés". L\'événement n\'a duré que 0.3 secondes.'},
  {cat:'SPORT',emoji:'⚽',title:'Match de foot docker vs goélands : 2-2',body:'Les goélands ont égalisé à la 89ème minute grâce à une tête de leur capitaine, Kevin le Goéland.'},
  {cat:'MÉTÉO',emoji:'🌬️',title:'Le mistral emporte la perruque de Lavagne',body:'La perruque a été retrouvée au large de la Corse. Lavagne nie avoir une perruque. La perruque nie connaître Lavagne.'},
  {cat:'ÉCONOMIE',emoji:'🐟',title:'Le cours de la sardine atteint un record historique',body:'Les experts attribuent cette hausse à "la demande croissante de Gégé en bouillabaisse".'},
  {cat:'IMMOBILIER',emoji:'🏠',title:'Un container aménagé en studio vendu 800 000€',body:'"C\'est le marché", explique l\'agent immobilier. Le container dispose d\'une vue sur le quai 4 et d\'un voisin bruyant (Jeff).'},
  {cat:'JUSTICE',emoji:'⚖️',title:'Procès du siècle : Docker contre Sardine',body:'Le docker accuse la sardine de l\'avoir mordu. La sardine plaide la légitime défense. L\'audience reprendra lundi.'},
];

async function init(){
  var today=new Date();
  var options={weekday:'long',year:'numeric',month:'long',day:'numeric'};
  var dateStr=today.toLocaleDateString('fr-FR',options);
  document.getElementById('hdr-date').textContent=dateStr;
  document.getElementById('masthead-date').textContent=dateStr.toUpperCase()+' — N°'+Math.floor((Date.now()-1717200000000)/86400000);

  var news=[];

  // Fetch all data
  var [companies,stats,casino,profiles]=await Promise.all([
    sb.from('companies').select('user_id,nom,name,emoji,valeur,reputation,sabotaged_until,employees,niveau').order('valeur',{ascending:false}).limit(20),
    sb.from('game_stats').select('user_id,level,money,streak_days,last_login,diamonds').order('level',{ascending:false}).limit(20),
    sb.from('casino_wins').select('username,game,amount,created_at').order('created_at',{ascending:false}).limit(10),
    sb.from('profiles').select('user_id,username,last_seen').limit(20)
  ]);

  var usernameMap={};
  (profiles.data||[]).forEach(function(p){usernameMap[p.user_id]=p.username;});
  function getName(uid,co){return co?(co.emoji||'')+(co.nom||co.name||usernameMap[uid]||'Docker'):usernameMap[uid]||'Docker';}

  var cos=companies.data||[];
  var sts=stats.data||[];
  var cas=casino.data||[];
  var pros=profiles.data||[];

  // === GENERATE NEWS FROM DATA ===

  // Richest player
  if(sts.length>0){
    var richest=sts[0];
    news.push({cat:'ÉCONOMIE',emoji:'💰',title:getName(richest.user_id)+' est le plus riche du port',body:'Avec un patrimoine de '+(richest.money||0).toLocaleString('fr-FR')+'€, le docker domine le classement. Les autres joueurs "préfèrent ne pas commenter".',priority:2});
  }

  // Highest level
  if(sts.length>0){
    var top=sts[0];
    if((top.level||1)>5){
      news.push({cat:'CARRIÈRE',emoji:'⭐',title:getName(top.user_id)+' atteint le niveau '+(top.level||1),body:'Le docker vétéran continue sa progression implacable. "Je m\'arrêterai quand je serai directeur", a-t-il déclaré.',priority:1});
    }
  }

  // Best streak
  var bestStreak=sts.reduce(function(a,b){return(a.streak_days||0)>(b.streak_days||0)?a:b;},{});
  if((bestStreak.streak_days||0)>3){
    news.push({cat:'RECORD',emoji:'🔥',title:getName(bestStreak.user_id)+' : '+(bestStreak.streak_days)+' jours de connexion consécutifs',body:'Le docker ne décroche plus du port. Son entourage est "préoccupé mais impressionné".',priority:2});
  }

  // Sabotaged companies
  cos.forEach(function(co){
    if(co.sabotaged_until&&new Date(co.sabotaged_until).getTime()>Date.now()){
      news.push({cat:'FAITS DIVERS',emoji:'💣',title:getName(co.user_id,co)+' victime d\'un sabotage !',body:'L\'entreprise a été sabotée durant la nuit. Les revenus sont réduits de moitié. Le coupable court toujours.',priority:3});
    }
  });

  // Low reputation
  cos.forEach(function(co){
    if((co.reputation||50)<20){
      news.push({cat:'SCANDALE',emoji:'📉',title:getName(co.user_id,co)+' : réputation au plus bas',body:'Avec seulement '+(co.reputation||0)+'/100 de réputation, l\'entreprise est au bord du gouffre. "Même les sardines refusent d\'y travailler."',priority:2});
    }
  });

  // Top company by value
  if(cos.length>0){
    var topCo=cos[0];
    news.push({cat:'BOURSE',emoji:'📈',title:getName(topCo.user_id,topCo)+' domine le marché',body:'Avec une valorisation de '+(topCo.valeur||0).toLocaleString('fr-FR')+'€, l\'entreprise reste numéro 1. Les concurrents "prennent des notes".',priority:1});
  }

  // Big casino wins
  cas.forEach(function(w){
    if((w.amount||0)>10000){
      news.push({cat:'CASINO',emoji:'🎰',title:(w.username||'Docker')+' empoche '+(w.amount||0).toLocaleString('fr-FR')+'€ au '+(w.game||'casino'),body:'Le joueur chanceux a remporté le gros lot. "Je vais tout réinvestir", dit-il. Spoiler : il a tout reperdu.',priority:3});
    }
  });

  // Inactive players
  var sevenDaysAgo=Date.now()-604800000;
  pros.forEach(function(p){
    if(p.last_seen&&new Date(p.last_seen).getTime()<sevenDaysAgo){
      var days=Math.floor((Date.now()-new Date(p.last_seen).getTime())/86400000);
      news.push({cat:'DISPARITION',emoji:'👻',title:(p.username||'Docker')+' introuvable depuis '+days+' jours',body:'Le docker n\'a plus donné signe de vie. Gégé a déposé une gerbe de sardines devant son casier. "Il reviendra", espère-t-il.',priority:1});
    }
  });

  // Many employees
  cos.forEach(function(co){
    var emps=Array.isArray(co.employees)?co.employees.length:0;
    if(emps>=5){
      news.push({cat:'EMPLOI',emoji:'👷',title:getName(co.user_id,co)+' : '+emps+' employés au compteur',body:'L\'entreprise recrute massivement. "On cherche encore un comptable", annonce le patron. Gégé a postulé mais a été refusé.',priority:1});
    }
  });

  // Sort by priority (higher = more important = first)
  news.sort(function(a,b){return(b.priority||0)-(a.priority||0);});

  // Add NPC filler news
  var seed=Math.floor(Date.now()/86400000);
  var npcToday=[];
  for(var i=0;i<3;i++){
    npcToday.push(NPC_NEWS[(seed+i*7)%NPC_NEWS.length]);
  }

  render(news,npcToday);
}

function render(news,npcNews){
  var el=document.getElementById('news-content');
  var html='';

  // Breaking news (first article)
  if(news.length>0){
    var br=news[0];
    html+='<div class="breaking"><div class="breaking-badge">URGENT</div>'+br.emoji+' '+br.title+'</div>';
  }

  // Main articles
  var mainNews=news.slice(0,6);
  mainNews.forEach(function(n,i){
    if(i===0&&mainNews.length>2){
      // First article = big
      html+='<div class="article"><div class="article-cat" style="color:#dc2626">'+n.cat+'</div><div class="article-img">'+n.emoji+'</div><div class="article-title">'+n.title+'</div><div class="article-body">'+n.body+'</div><div class="article-meta">Aujourd\'hui — Le Journal du Port</div></div>';
    }else if(i===1&&mainNews.length>3){
      // Second + third = duo
      var n2=mainNews[2];
      html+='<div class="duo"><div class="duo-item"><div class="article-cat" style="color:#d97706">'+n.cat+'</div><div class="duo-title">'+n.emoji+' '+n.title+'</div><div class="duo-body">'+n.body+'</div></div>';
      if(n2)html+='<div class="duo-item"><div class="article-cat" style="color:#059669">'+n2.cat+'</div><div class="duo-title">'+n2.emoji+' '+n2.title+'</div><div class="duo-body">'+n2.body+'</div></div>';
      html+='</div>';
    }else if(i===2&&mainNews.length>3){
      // Skip, already in duo
    }else{
      html+='<div class="article"><div class="article-cat" style="color:#6b7280">'+n.cat+'</div><div class="article-title">'+n.emoji+' '+n.title+'</div><div class="article-body">'+n.body+'</div></div>';
    }
  });

  // NPC section
  html+='<div class="npc-sec"><div class="npc-title">🗞️ En bref</div>';
  npcNews.forEach(function(n){
    html+='<div class="npc-item">'+n.emoji+' <span>'+n.title+'</span> — '+n.body.substring(0,80)+'...</div>';
  });
  html+='</div>';

  // Remaining articles
  news.slice(6).forEach(function(n){
    html+='<div class="article"><div class="article-cat" style="color:#6b7280">'+n.cat+'</div><div class="article-title">'+n.emoji+' '+n.title+'</div><div class="article-body">'+n.body+'</div></div>';
  });

  if(news.length===0){
    html='<div class="article"><div class="article-title">📰 Journée calme au port</div><div class="article-body">Rien de notable à signaler. Même le goéland du quai 7 s\'est tenu tranquille. Gégé dit que "c\'est suspect".</div></div>';
  }

  el.innerHTML=html;
}

init();
</script>
</body>
</html>
