<head>
<!-- ===== la mise à jour : le jeu ne reste jamais bloqué sur une vieille version ===== -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<script>
/* Ajouté au signet, un navigateur garde la page en mémoire et ne va plus
   jamais la rechercher. On lui demande donc, à chaque ouverture, quelle est
   la version publiée : si elle a changé, on recharge une seule fois avec une
   adresse neuve — c'est la seule façon de percer le cache d'un raccourci. */
(function(){
  var MA_VERSION='2026-09-18-1406';
  var cle='bdl.version.vue';
  function verifier(){
    fetch('version.json?t='+Date.now(),{cache:'no-store'})
      .then(function(r){return r.json();})
      .then(function(d){
        if(!d||!d.v||d.v===MA_VERSION)return;
        /* on ne recharge qu'une fois par version, sinon on bouclerait */
        var deja=null;
        try{deja=sessionStorage.getItem(cle);}catch(e){}
        if(deja===d.v)return;
        try{sessionStorage.setItem(cle,d.v);}catch(e){}
        var u=location.pathname.split('?')[0]+'?v='+encodeURIComponent(d.v);
        location.replace(u);
      })
      .catch(function(){});
  }
  verifier();
  /* et quand on revient sur l'onglet après un moment */
  var vu=Date.now();
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState!=='visible')return;
    if(Date.now()-vu<60000)return;
    vu=Date.now();verifier();
  });
})();
</script>

];

/* ================= ton personnage, celui du jeu ================= */
let GESTE={t:0,cible:null,type:'pioche'};
const BOUCHES=['neutre','sourire','severe','entrouverte','lèvres','pincée'];

let SOL=null;

const alea=s=>{const v=Math.sin(s*127.1)*43758.5453;return v-Math.floor(v);};
const teint=(c,k)=>{
  const n=parseInt(c.slice(1),16);
  const f=v=>Math.max(0,Math.min(255,v+k));
  return '#'+((1<<24)+(f((n>>16)&255)<<16)+(f((n>>8)&255)<<8)+f(n&255)).toString(16).slice(1);
};
const PALETTES={
 peau:['#f6ddc0','#f0d0ae','#e8c49a','#d8a878','#c08a58','#a2683c','#7d4e2a','#5a3720'],
 cheveux:['#1c140d','#2b1d12','#4a3220','#6b4726','#8a5f30','#b58a4a','#d9c48a','#f2e6c8',
          '#8a8f96','#c9c9c9','#a8402c','#c2604a','#6b3f8f','#2f6b8f','#3f7d4a','#b53f6b'],
 yeux:['#26241f','#3f5f6b','#4a6b3f','#6b4a3f','#5a4a6b','#7d6a3f','#2f6b8f','#8f4a3f'],
 veste:['#4f7d5c','#5a6b8f','#8a5a4a','#6b5f8f','#7d6a3f','#3f5f6b','#8f6a3f','#54606b',
        '#a8524a','#3f7d4a','#c2a04a','#2f3a4a','#7a4f6b','#4a7d7d','#9c5f2f','#5f5f5f'],
 pantalon:['#3a4358','#4a4038','#2f3a2f','#5a4a3a','#3a3a44','#6b5f4a','#2b3340','#7d6a4a'],
 chaussures:['#4a3524','#2f2a24','#5a4a3a','#6b4a28','#3f4a53','#7d5934'],
 sac:['aucun','#7d5934','#4a5c6b','#6b4a4a','#4f6b4a','#8a6a44','#54606b']
};
const CHAPEAUX=['aucun','casquette','bandana','bonnet','capuche','chapeau','beret','cagoule'];
const HAUTS=['veste','t-shirt','chemise','pull','débardeur','manteau','gilet','tunique'];
const BAS=['pantalon','short','jupe','treillis','longue jupe','bermuda'];
const COIFFES=['courts','très courts','dégradé','bol','carré','mi-longs','longs','très longs',
               'queue','couettes','chignon','chignon haut','tresse','tresses','ondulés','bouclés',
               'afro','dreads','banane','crête','crâne','hirsute'];
const BARBES=['aucune','naissante','fine','courte','pleine','longue','bouc','moustache',
              'collier','favoris','impériale','fourchue'];
const DEF_AP={peau:2,cheveux:2,coiffe:0,barbe:0,yeux:0,formeYeux:0,veste:0,pantalon:0,
              chaussures:0,chapeau:0,sac:1,
              sourcils:0,nez:1,bouche:0,marque:0,boucle:0,
              corps:0,haut:0,bas:0,souliers:0};
const doux    =t=>t*t*(3-2*t);
const sortRap =t=>1-Math.pow(1-t,3);
const entreRap=t=>t*t*t;
function dessinerHache(g,x,y,ech){
  const k=ech||1;
  const R=(a,b,w,h,c)=>{g.fillStyle=c;g.fillRect(x+a*k,y+b*k,w*k,h*k);};
  R(-1,-13,2,13,'#8a6238');                   /* manche */
  R(-1,-13,1,13,'#a5764a');
  R(0,-14,5,6,'#7b8288');                     /* fer */
  R(0,-14,5,1,'#a2a9b0');
  R(4,-13,2,4,'#c0c7cd');                     /* tranchant */
  R(-2,-14,2,6,'#5f666c');                    /* talon */
}
function dessinerPioche(g,x,y,ech){
  const k=ech||1;
  const R=(a,b,w,h,c)=>{g.fillStyle=c;g.fillRect(x+a*k,y+b*k,w*k,h*k);};
  R(-1,-12,2,12,'#8a6238');                   /* manche */
  R(-1,-12,1,12,'#a5764a');
  R(-6,-14,12,2,'#7b8288');                   /* fer */
  R(-6,-14,12,1,'#a2a9b0');
  R(-7,-13,2,2,'#5f666c');R(5,-13,2,2,'#5f666c');
}
function sprite(g,x,y,ap0,dir,pas,bouge){
  const p=Object.assign({},DEF_AP,ap0||{});
  const P=PALETTES;
  const peau=P.peau[p.peau]||P.peau[2], peauO=teint(peau,-24), peauC=teint(peau,14), peauT=teint(peau,-52);
  const chev=P.cheveux[p.cheveux]||P.cheveux[2], chevC=teint(chev,22), chevO=teint(chev,-22);
  const veste=P.veste[p.veste]||P.veste[0], vesteC=teint(veste,20), vesteO=teint(veste,-26), vesteT=teint(veste,-48);
  const pant=P.pantalon[p.pantalon]||P.pantalon[0], pantO=teint(pant,-18), pantC=teint(pant,12);
  const chau=P.chaussures[p.chaussures]||P.chaussures[0], chauC=teint(chau,20);
  const oeil=P.yeux[p.yeux]||P.yeux[0];
  const coiffe=COIFFES[p.coiffe]||'courts', barbe=BARBES[p.barbe]||'aucune';
  const chapeau=CHAPEAUX[p.chapeau]||'aucun', sacC=P.sac[p.sac]||'aucun';
  const fy=YEUX_F[p.formeYeux]||'normaux';
  const sourcil=SOURCILS[p.sourcils]||'fins';
  const nez=NEZ[p.nez]||'droit';
  const bouche=BOUCHES[p.bouche]||'neutre';
  const marque=MARQUES[p.marque]||'aucune';
  const boucle=BOUCLES[p.boucle]||'aucune';
  const silhouette=SILHOUETTES[p.corps]||'masculine';
  const hautT=HAUTS[p.haut]||'veste';
  const basT=BAS[p.bas]||'pantalon';
  const soulier=SOULIERS[p.souliers]||'bottes';
  /* la silhouette : largeur d'épaules, taille, hanches */
  const SIL={'fine'      :{ep:6,ta:5,ha:6,tete:5,menton:1},
             'svelte'    :{ep:7,ta:5,ha:7,tete:5,menton:1},
             'moyenne'   :{ep:8,ta:7,ha:7,tete:6,menton:2},
             'athlétique':{ep:9,ta:7,ha:7,tete:6,menton:2},
             'forte'     :{ep:9,ta:9,ha:9,tete:6,menton:3}}[silhouette]||{ep:8,ta:7,ha:7,tete:6,menton:2};
  const EP=SIL.ep, TA=SIL.ta, HA=SIL.ha;   /* demi-largeurs */
  const N='#1b1712';
  const R=(a,b,w,h,c)=>{g.fillStyle=c;g.fillRect(x+a,y+b,w,h);};

  /* marche souple, huit temps */
  const F=bouge?(Math.floor(pas)%8):-1;
  const AN={corps:[0,0,-1,0,0,0,-1,0],
            jg:[2,1,-1,-2,-2,-1,1,2], jd:[-2,-1,1,2,2,1,-1,-2],
            pg:[0,0,1,0,0,0,0,0],     pd:[0,0,0,0,0,0,1,0],
            bg:[-2,-1,1,2,2,1,-1,-2], bd:[2,1,-1,-2,-2,-1,1,2],
            reb:[0,0,1,0,0,0,1,0]};
  const souffle=bouge?0:((Date.now()/1400|0)%3===0?1:0);
  const Y=bouge?AN.corps[F]:souffle;
  const jgP=bouge?AN.jg[F]:0, jdP=bouge?AN.jd[F]:0;
  const jgL=bouge?AN.pg[F]:0, jdL=bouge?AN.pd[F]:0;
  const bgP=bouge?AN.bg[F]:0, bdP=bouge?AN.bd[F]:0;
  const reb=bouge?AN.reb[F]:0;
  const prof=dir==='haut', cote=dir==='gauche'||dir==='droite';
  const MANCHE_AR={'veste':11,'chemise':11,'pull':11,'manteau':11,'tunique':9,
                   'gilet':0,'t-shirt':4,'débardeur':0}[HAUTS[p.haut]||'veste'];
  const s=dir==='droite'?1:-1;

  /* ---- mesures du corps (quatre têtes) ----
     pieds 0 · jambes 13 · torse 15 · tête 11, sommet à -40 */
  const JH=13, TH=15, HT=11;
  const yT=-JH-TH;                 /* haut du torse  = -28 */
  const yTete=yT-HT-2;             /* la tête est décollée du torse : le cou apparaît */

  /* ---- le geste de frappe, en trois temps ----
     1 → 0,58 : l'élan, la pioche part en arrière
     0,58 → 0,42 : l'abattage, très rapide
     0,42 → 0   : la reprise, le corps se redresse                */
  const fr=(typeof GESTE!=='undefined'&&GESTE.t>0)?GESTE.t:0;
  const typeGeste=(typeof GESTE!=='undefined'&&GESTE.type)||'pioche';
  let phase=0, arc=0, penche=0, tasse=0;
  if(fr>0&&typeGeste==='cueille'){
    /* la cueillette : on se penche, le bras part vers le buisson, on se relève */
    if(fr>0.55){const t=(1-fr)/0.45;penche=doux(t)*2.6;tasse=doux(t)*1.6;arc=1.1*doux(t);phase=1;}
    else if(fr>0.3){const t=(0.55-fr)/0.25;penche=2.6;tasse=1.6;arc=1.1+t*0.5;phase=2;}
    else{const t=1-fr/0.3;penche=2.6*(1-sortRap(t));tasse=1.6*(1-sortRap(t));arc=1.6*(1-sortRap(t));phase=3;}
  }else if(fr>0&&typeGeste==='hache'){
    /* la hache : élan haut, balayage large, reprise lente */
    if(fr>0.62){const t=(1-fr)/0.38;arc=-1.9*doux(t);penche=-doux(t)*2;tasse=doux(t)*1.4;phase=1;}
    else if(fr>0.42){const t=(0.62-fr)/0.2;arc=-1.9+entreRap(t)*3.3;penche=-2+t*5.2;tasse=1.4-t*2.8;phase=2;}
    else{const t=1-fr/0.42;arc=1.4*(1-sortRap(t));penche=3.2*(1-sortRap(t));tasse=-1.4*(1-sortRap(t));phase=3;}
  }else if(fr>0){
    if(fr>0.58){const t=(1-fr)/0.42;arc=-1.45*doux(t);penche=-doux(t)*1.6;tasse=doux(t)*1.2;phase=1;}
    else if(fr>0.42){const t=(0.58-fr)/0.16;arc=-1.45+entreRap(t)*2.75;penche=-1.6+t*4.4;tasse=1.2-t*2.4;phase=2;}
    else{const t=1-fr/0.42;arc=1.3*(1-sortRap(t));penche=2.8*(1-sortRap(t));tasse=-1.2*(1-sortRap(t));phase=3;}
  }

  R(-6,1,12,2,'rgba(40,60,28,.42)');

  /* sac */
  if(sacC!=='aucun'&&prof){                     /* de dos : le sac, bien posé entre les épaules */
    const w2=Math.min(10,EP*2-4);
    R(-(w2>>1),yT+2-reb,w2,13,teint(sacC,-8));
    R(-(w2>>1),yT+2-reb,w2,2,teint(sacC,16));
    R(-(w2>>1),yT+12-reb,w2,2,teint(sacC,-26));
    R(-2,yT+6-reb,4,4,teint(sacC,10));          /* la poche */
    R(-2,yT+6-reb,4,1,teint(sacC,-30));
  }else if(sacC!=='aucun'&&cote){               /* de profil : il dépasse dans le dos */
    const sx=s>0?-(EP+1):EP-2;
    R(sx,yT+2-reb,4,12,teint(sacC,-16));
    R(sx,yT+2-reb,4,2,teint(sacC,10));
    R(sx,yT+12-reb,4,1,teint(sacC,-30));
  }

  /* ---- jambes ---- */
  /* la chaussure, dessinée selon son type */
  const pied=(px2,py,col)=>{
    if(soulier==='bottes'){
      R(px2,py-2,5,2,teint(col,-16));              /* la tige monte sur la cheville */
      R(px2,py,5,3,col);
      R(px2,py,5,1,teint(col,20));
      R(px2,py+2,5,1,teint(col,-26));             /* la semelle */
    }else if(soulier==='bottillons'){
      R(px2,py-1,5,1,teint(col,-16));
      R(px2,py,5,3,col);
      R(px2,py,5,1,teint(col,18));
      R(px2,py+2,5,1,teint(col,-30));
    }else if(soulier==='baskets'){
      R(px2,py,5,2,col);
      R(px2,py,5,1,teint(col,22));
      R(px2+1,py,2,1,'#f2efe4');                   /* le lacet */
      R(px2,py+2,5,1,'#e8e4d8');                   /* la semelle claire */
    }else{                                          /* sandales : le pied reste visible */
      R(px2+1,py,3,2,peauO);
      R(px2,py+1,5,1,col);
      R(px2+1,py,3,1,col);
      R(px2,py+2,5,1,teint(col,-22));
    }
  };

  /* jusqu'où le tissu descend, selon le bas porté */
  const TISSU={'pantalon':JH,'short':6,'jupe':5,'treillis':JH,'longue jupe':10,'bermuda':8}[basT];
  const jambeProfil=(dec,plie,col,botte)=>{
    const h=JH-plie;
    R(-2+dec,-JH,4,h,peau);                    /* la jambe nue */
    if(TISSU>0)R(-2+dec,-JH,4,Math.min(h,TISSU),col);
    if(TISSU>=h)R(-2+dec,-4,4,4,teint(col,-12));
    if(basT==='treillis'){R(-2+dec,-JH+5,4,1,teint(col,-22));R(-1+dec,-JH+6,2,2,teint(col,14));}
    pied(-3+dec,-JH+h,botte);
  };
  const jambeFace=(cx,phase,col,botte)=>{
    const avance=phase>0;
    const h=avance?JH:JH-2;
    const ec=Math.abs(phase)>1?(avance?-1:1):0;
    R(cx+ec,-JH,4,h,avance?teint(peau,4):teint(peau,-14));   /* la jambe */
    if(TISSU>0){
      R(cx+ec,-JH,4,Math.min(h,TISSU),avance?teint(col,8):teint(col,-10));
      R(cx+ec,-JH,4,1,pantC);
    }
    if(basT==='treillis'){R(cx+ec,-JH+5,4,1,teint(col,-22));R(cx+1+ec,-JH+6,2,2,teint(col,14));}
    pied(cx-1+ec,-JH+h,avance?botte:teint(botte,-14));
  };
  if(cote){
    jambeProfil(jdP*0.9-1,jdL,pantO,teint(chau,-14));
    jambeProfil(jgP*0.9-1,jgL,pant,chau);
  }else{
    if(jgP>=jdP){jambeFace(1,jdP,pantO,teint(chau,-14));jambeFace(-5,jgP,pant,chau);}
    else{jambeFace(-5,jgP,pant,chau);jambeFace(1,jdP,pantO,teint(chau,-14));}
  }

  /* jupe : un trapèze par-dessus le haut des jambes */
  if(basT==='jupe'||basT==='longue jupe'){
    const hj=basT==='jupe'?6:9;
    for(let i=0;i<hj;i++){
      const w2=HA-1+Math.round(i*(basT==='jupe'?0.7:0.55));
      R(-w2,-JH+i,w2*2,1,i<2?pantC:pant);
    }
    R(-(HA+3),-JH+hj-1,(HA+3)*2,1,pantO);
  }

  /* hanches : elles ferment la jonction entre le torse et les jambes */
  R(-(HA+1),-JH-2,(HA+1)*2,3,N);
  R(-HA,-JH-1,HA*2,2,pantO);
  R(-HA,-JH-1,HA*2,1,pant);

  /* ---- bras arrière (profil) ---- */
  if(cote){
    const ar=bgP;
    const bx=(s>0?-6:3)-ar*s;
    R(bx,yT+2,3,11,peauT);
    if(MANCHE_AR>0)R(bx,yT+2,3,MANCHE_AR,vesteT);
    R(bx,yT+13,3,3,peauT);
  }

  /* ---- torse : la coupe du vêtement suit la silhouette ---- */
  const colH=veste, colHC=vesteC, colHO=vesteO, colHT=vesteT;
  const pen=fr>0?Math.round(penche*(dir==='gauche'?-1:1)):0;   /* il se penche dans l'effort */
  const tas=fr>0?Math.max(0,Math.round(tasse)):0;              /* et se tasse */
  R(-EP+pen,yT-1+tas,EP*2,TH+1-tas,N);           /* contour aux épaules */
  R(-EP+1,yT,EP*2-2,3,colH);                     /* les épaules */
  R(-EP+1,yT,EP*2-2,2,colHC);
  for(let i=3;i<TH-1;i++){                       /* le buste, resserré à la taille */
    const w2=Math.round(EP-1-(EP-TA)*Math.min(1,(i-2)/(TH-5)));
    R(-w2,yT+i,w2*2,1,colH);
    R(-w2,yT+i,2,1,colHT);
    R(w2-2,yT+i,2,1,colHO);
  }
  R(-TA,yT+TH-4,TA*2,2,colHO);                   /* ceinture */
  R(-1,yT+TH-4,2,2,'#c9a24a');
  /* les détails propres à chaque haut */
  if(hautT==='veste'&&!prof){R(-1,yT,2,TH-5,colHO);R(-4,yT,3,2,colHC);R(1,yT,3,2,colHC);}
  if(hautT==='chemise'&&!prof){
    R(-1,yT,2,TH-5,colHT);
    R(-4,yT,4,3,colHC);R(0,yT,4,3,colHC);        /* col ouvert */
    for(let i=0;i<3;i++)R(0,yT+4+i*3,1,1,'#f2efe4');
  }
  if(hautT==='pull'&&!prof){
    R(-3,yT-2,6,3,colHC);R(-3,yT-2,6,1,colH);    /* col montant */
    for(let i=4;i<TH-4;i+=3)R(-EP+2,yT+i,EP*2-4,1,teint(colH,-12));
  }
  if(hautT==='t-shirt'&&!prof){R(-3,yT,6,2,peau);R(-3,yT,6,1,peauC);}
  if(hautT==='débardeur'){
    R(-4,yT,8,3,peau);R(-4,yT,8,1,peauC);        /* décolleté */
    R(-EP+1,yT,2,4,colH);R(EP-3,yT,2,4,colHO);   /* bretelles */
  }
  if(hautT==='gilet'&&!prof){
    R(-2,yT,4,TH-5,peau);R(-2,yT,4,1,peauC);
    R(-2,yT+TH-6,4,2,colHO);
  }
  if(hautT==='manteau'){
    R(-TA,yT+TH-2,TA*2,6,colH);                  /* les pans descendent */
    R(-TA,yT+TH-2,TA*2,1,colHC);
    R(-TA,yT+TH+3,TA*2,1,colHT);
    if(!prof)R(-1,yT+TH-2,2,6,colHT);
  }
  if(hautT==='tunique'){
    R(-TA,yT+TH-2,TA*2,4,colH);
    R(-TA,yT+TH-2,TA*2,1,colHC);
    R(-TA,yT+TH+1,TA*2,1,colHT);
    if(!prof){R(-4,yT,8,2,colHC);R(-1,yT,2,4,colHO);}
  }
  R(-EP+1,yT+TH-2,EP*2-2,1,colHT);

  /* de face : on ne voit du sac que les deux sangles sur la poitrine */
  if(sacC!=='aucun'&&dir==='bas'){
    R(-EP+2,yT+2,2,8,teint(sacC,-6));
    R(EP-4,yT+2,2,8,teint(sacC,-18));
    R(-EP+2,yT+6,EP*2-6,1,teint(sacC,-24));
  }

  /* ---- bras : la manche s'arrête selon le vêtement ---- */
  const MANCHE={'veste':11,'chemise':11,'pull':11,'manteau':11,'tunique':9,
                'gilet':0,'t-shirt':4,'débardeur':0}[hautT];
  const brasCol=(dev)=>dev?veste:vesteT;
  const bras=(bx,by,dev)=>{
    R(bx,by,3,11,dev?teint(peau,2):peauO);       /* le bras nu */
    if(MANCHE>0){
      R(bx,by,3,MANCHE,brasCol(dev));
      R(bx,by,3,2,dev?vesteC:vesteO);
      if(MANCHE<11)R(bx,by+MANCHE-1,3,1,teint(brasCol(dev),-20));
    }
    R(bx,by+11,3,3,dev?peau:peauO);              /* la main */
  };
  if(cote){
    bras((s>0?1:-4)+bdP*s,yT+1,true);
  }else{
    bras(-(EP+2),yT+1,bgP>0);
    bras(EP-1,yT+1,bdP>0);
  }
  /* ---- l'outil et les bras, selon l'angle sous lequel on regarde ----
     De profil : grand arc de côté, un seul bras visible.
     De face   : l'outil s'abat vers nous, les deux mains le tiennent, il se raccourcit.
     De dos    : il part en arrière au-dessus des épaules, on voit le dos des mains. */
  if(fr>0){
    const outil=(gg,ech)=>{
      if(typeGeste==='hache')dessinerHache(gg,0,0,ech||1);
      else dessinerPioche(gg,0,0,ech||1);
    };
    if(cote){
      const sens=dir==='gauche'?-1:1;
      const epx=sens>0?EP-1:-(EP+2);
      const ey=yT+1-Math.round(tasse*3);
      R(epx,ey,3,9,veste);R(epx,ey,3,2,vesteC);R(epx,ey+9,3,3,peau);
      if(typeGeste!=='cueille'){
        g.save();
        g.translate(x+epx+1.5,y+ey+2);
        g.rotate(sens*arc);
        outil(g,1);
        if(phase===2){g.globalAlpha=.3;g.fillStyle='#f2f5f8';g.fillRect(-1,-15,2,13);g.globalAlpha=1;}
        g.restore();
      }else{
        const av=Math.round(arc*3);
        R(epx+(sens>0?av:-av),ey+7,3,3,peau);
      }
    }else if(dir==='bas'){
      /* de face : l'outil passe au-dessus de la tête puis descend vers nous.
         On l'écrase verticalement pour simuler le raccourci. */
      const t=(arc+1.9)/3.6;                       /* 0 en arrière, 1 en avant */
      const haut=yT-14+Math.round((1-t)*-8);
      const ey=yT+1-Math.round(tasse*3);
      if(typeGeste!=='cueille'){
        g.save();
        g.translate(x,y+haut+t*24);
        g.scale(1.15,0.45+t*0.75);                 /* il grandit en venant vers nous */
        g.rotate(Math.PI*(1-t)*0.12);
        outil(g,1.2);
        if(phase===2){g.globalAlpha=.26;g.fillStyle='#f2f5f8';
          g.fillRect(-8,-4,16,4);g.globalAlpha=1;}
        g.restore();
      }
      /* les deux bras tiennent l'outil, ils se rapprochent devant le corps */
      const ecart=Math.round(3+ (1-t)*3);
      R(-EP-2+ecart,ey,3,9,vesteT);R(-EP-2+ecart,ey+9,3,3,peauO);
      R(EP-1-ecart,ey,3,9,veste);  R(EP-1-ecart,ey+9,3,3,peau);
      if(typeGeste==='cueille'){                   /* la main s'avance vers le bas */
        R(-2,ey+10+Math.round(arc*3),4,3,peau);
      }
    }else{
      /* de dos : l'outil part derrière les épaules, on ne voit que sa tête dépasser */
      const t=(arc+1.9)/3.6;
      const ey=yT+1-Math.round(tasse*3);
      if(typeGeste!=='cueille'){
        g.save();
        g.translate(x,y+yT-10-(1-t)*10);
        g.scale(1.1,0.5+(1-t)*0.6);
        outil(g,1.1);
        g.restore();
      }
      const ecart=Math.round(3+(1-t)*3);
      R(-EP-2+ecart,ey,3,9,vesteT);R(-EP-2+ecart,ey+9,3,3,peauO);
      R(EP-1-ecart,ey,3,9,veste);  R(EP-1-ecart,ey+9,3,3,peau);
    }
  }

  /* ---- tête ---- */
  const YT=yTete+(fr>0?Math.round(tasse*1.2):0);  /* la tête plonge avec le buste */
  R(-3,yT-3+Y,6,4-Y,N);                        /* le cou s'étire quand le corps descend */
  R(-2,yT-2+Y,4,3-Y,peau);
  R(-2,yT-2+Y,4,1,peauT);                      /* ombre du menton */
  R(-2,yT-2+Y,2,3-Y,peauO);

  const LT=SIL.tete;                            /* demi-largeur de la tête */
  for(let i=0;i<HT;i++){
    let w2=LT;
    if(i>=HT-SIL.menton)w2=LT-1;                /* le menton se resserre */
    if(i===0)w2=LT-1;                           /* le sommet du crâne s'arrondit */
    R(-w2-1,YT+i,(w2+1)*2,1,N);
    R(-w2,YT+i,w2*2,1,peau);
    R(-w2,YT+i,Math.min(3,w2),1,peauO);
  }
  R(-LT,YT,LT*2,1,peauC);                       /* front éclairé */
  if(!prof){R(-LT-2,YT+5,2,3,peauO);R(LT,YT+5,2,3,peau);}   /* oreilles */
  if(prof){R(-LT,YT+1,LT*2,HT-1,teint(peau,-12));           /* nuque */
           R(-LT,YT+HT-3,LT*2,2,teint(peau,-30));}
  /* ---- la barbe ----
     Elle épouse la mâchoire : plus large en haut des joues, resserrée sous le menton.
     Trois valeurs, comme les cheveux, et une version propre au profil. */
  if(barbe!=='aucune'&&!prof){
    const LB=SIL.tete;                          /* demi-largeur du visage */
    const bas=YT+HT-1;                          /* le bas du menton */
    const B=chev, BC=chevC, BO=chevO, BT=teint(chev,-40);
    const joue=(y0,h2,ep)=>{                    /* les côtés, le long de la mâchoire */
      for(let i=0;i<h2;i++){
        const w2=LB-(i>=h2-2?1:0);
        R(-w2,y0+i,ep,1,B);
        R(w2-ep,y0+i,ep,1,BO);
      }
    };
    const menton=(y0,h2,larg)=>{                /* la masse sous la bouche */
      for(let i=0;i<h2;i++){
        const w2=Math.max(1,larg-(i>=h2-2?1:0)-(i>=h2-1?1:0));
        R(-w2,y0+i,w2*2,1,i<1?BC:(i>h2-2?BT:B));
      }
    };
    if(cote){
      /* de profil : la barbe suit le bord avant du visage */
      const av=s>0?1:-4;
      if(barbe==='naissante'){g.globalAlpha=.5;R(av-1,YT+7,5,4,BO);g.globalAlpha=1;}
      else if(barbe==='fine'){R(av-1,YT+7,5,3,BO);R(av,YT+10,3,1,BT);}
      else if(barbe==='courte'){R(av-2,YT+6,6,5,B);R(av-1,YT+10,4,1,BO);}
      else if(barbe==='pleine'){R(av-3,YT+5,7,7,B);R(av-3,YT+5,2,7,BO);R(av-2,YT+11,5,2,BT);}
      else if(barbe==='longue'){R(av-3,YT+5,7,7,B);R(av-2,YT+11,5,6,B);R(av-2,YT+15,5,2,BT);}
      else if(barbe==='bouc'){R(av-1,YT+8,4,5,B);R(av-1,YT+11,4,2,BO);}
      else if(barbe==='moustache'){R(av-1,YT+7,4,1,B);R(av+2,YT+7,1,1,BO);}
      else if(barbe==='collier'){R(av-4,YT+4,2,8,B);R(av-3,YT+10,6,2,B);}
      else if(barbe==='favoris'){R(av-4,YT+3,2,6,B);}
      else if(barbe==='impériale'){R(av-1,YT+7,4,1,B);R(av,YT+9,3,3,B);}
      else if(barbe==='fourchue'){R(av-3,YT+5,7,7,B);R(av-2,YT+11,2,5,B);R(av+1,YT+11,2,4,BO);}
    }else{
      if(barbe==='naissante'){                  /* juste une ombre sur la mâchoire */
        g.globalAlpha=.42;
        joue(YT+6,5,2);menton(YT+9,3,3);
        g.globalAlpha=1;
      }
      else if(barbe==='fine'){
        joue(YT+7,4,1);
        R(-3,YT+10,6,1,BO);R(-2,YT+11,4,1,BT);
      }
      else if(barbe==='courte'){
        joue(YT+6,5,2);
        menton(YT+9,3,4);
        R(-3,YT+8,6,1,BC);                      /* le sillon sous la lèvre */
      }
      else if(barbe==='pleine'){
        joue(YT+4,7,2);
        menton(YT+8,5,LB-1);
        R(-LB+1,YT+4,LB*2-2,1,BC);              /* le haut des joues, éclairé */
        R(-2,YT+8,4,1,teint(peau,-30));         /* la bouche reste lisible */
      }
      else if(barbe==='longue'){
        joue(YT+4,7,2);
        menton(YT+8,5,LB-1);
        for(let i=0;i<6;i++){                   /* elle descend sur la poitrine */
          const w2=Math.max(1,4-Math.floor(i/2));
          R(-w2,YT+HT+i-1,w2*2,1,i<4?B:BT);
        }
        R(-LB+1,YT+4,LB*2-2,1,BC);
        R(-2,YT+8,4,1,teint(peau,-30));
      }
      else if(barbe==='bouc'){
        R(-2,YT+10,4,3,B);R(-2,YT+10,2,3,BC);R(-1,YT+12,2,1,BT);
        R(-3,YT+7,6,1,B);                       /* avec sa moustache */
      }
      else if(barbe==='moustache'){
        R(-3,YT+7,6,1,B);R(-4,YT+7,1,1,BO);R(3,YT+7,1,1,BO);
        R(-3,YT+8,2,1,BO);R(1,YT+8,2,1,BO);
      }
      else if(barbe==='collier'){               /* le tour du visage, joues rasées */
        R(-LB,YT+4,1,7,B);R(LB-1,YT+4,1,7,BO);
        menton(YT+10,2,4);
        R(-3,YT+7,6,1,B);
      }
      else if(barbe==='favoris'){               /* seulement devant les oreilles */
        R(-LB,YT+3,2,5,B);R(LB-2,YT+3,2,5,BO);
        R(-LB,YT+7,2,1,BT);R(LB-2,YT+7,2,1,BT);
      }
      else if(barbe==='impériale'){             /* moustache et touffe sous la lèvre */
        R(-4,YT+7,8,1,B);R(-5,YT+6,1,1,BO);R(4,YT+6,1,1,BO);
        R(-1,YT+10,3,3,B);R(-1,YT+10,1,3,BC);
      }
      else if(barbe==='fourchue'){
        joue(YT+4,7,2);
        menton(YT+8,4,LB-1);
        R(-4,YT+HT-1,3,5,B);R(1,YT+HT-1,3,4,BO);   /* les deux pointes */
        R(-4,YT+HT+3,3,1,BT);R(1,YT+HT+2,3,1,BT);
        R(-LB+1,YT+4,LB*2-2,1,BC);
      }
    }
  }

  /* ---- les cheveux ----
     Une même coupe se décline en trois vues :
       de face  : calotte + frange + pans qui pendent de chaque côté du visage
       de dos   : la masse couvre tout le crâne, les longueurs tombent dans le dos
       de profil: calotte + un seul pan, derrière la tête                        */
  const C=chev, CC=chevC, CO=chevO, CT=teint(chev,-42);
  const tr=bouge?(cote?-s:0):0;

  /* description de chaque coupe :
     vol  volume au-dessus du crâne · fr  frange · pan longueur des pans latéraux
     dos  longueur dans le dos      · ras côtés rasés                            */
  const D={
   'courts'      :{vol:2,fr:'courte',pan:3, dos:12},
   'très courts' :{vol:1,fr:'rase',  pan:2, dos:12},
   'dégradé'     :{vol:3,fr:'cote',  pan:1, dos:12,ras:1},
   'bol'         :{vol:2,fr:'droite',pan:5, dos:14},
   'carré'       :{vol:2,fr:'droite',pan:9, dos:17},
   'mi-longs'    :{vol:2,fr:'cote',  pan:8, dos:18},
   'longs'       :{vol:2,fr:'cote',  pan:14,dos:24,large:14},
   'très longs'  :{vol:2,fr:'cote',  pan:20,dos:30,large:14},
   'queue'       :{vol:2,fr:'courte',pan:2, dos:12,queue:14},
   'couettes'    :{vol:2,fr:'droite',pan:2, dos:12,couettes:9},
   'chignon'     :{vol:2,fr:'courte',pan:2, dos:12,chignon:1},
   'chignon haut':{vol:1,fr:'courte',pan:1, dos:12,chignon:2},
   'tresse'      :{vol:2,fr:'cote',  pan:3, dos:12,tresse:1},
   'tresses'     :{vol:2,fr:'droite',pan:2, dos:12,tresses:1},
   'ondulés'     :{vol:2,fr:'cote',  pan:12,dos:21,onde:1,large:14},
   'bouclés'     :{vol:4,fr:'boucle',pan:5, dos:16,boucle:1,large:16},
   'afro'        :{vol:6,fr:'rase',  pan:5, dos:16,afro:1,large:18},
   'dreads'      :{vol:2,fr:'rase',  pan:9, dos:20,dreads:1,large:14},
   'banane'      :{vol:5,fr:'arriere',pan:2,dos:12},
   'crête'       :{vol:0,fr:'rase',  pan:0, dos:0, crete:1},
   'crâne'       :{vol:0,fr:'rase',  pan:0, dos:0, rase:1},
   'hirsute'     :{vol:3,fr:'meche', pan:4, dos:14,hirsute:1}
  }[coiffe]||{vol:2,fr:'courte',pan:3,dos:3};

  if(D.rase){
    R(-6,YT-1,12,2,CO);
    if(prof)R(-6,YT-1,12,6,CO);
  }else{
    /* le dessus du crâne, commun aux trois vues */
    if(!D.crete){
      R(-6,YT-1-D.vol,12,2+D.vol,C);
      R(-6,YT-D.vol,4,1,CC);                    /* la lumière tombe à gauche */
      R(4,YT-1-D.vol,2,2+D.vol,CO);
    }
    if(prof){
      /* ---- de dos ---- */
      const y0=YT-1-D.vol;                      /* le sommet du crâne */
      const hd=Math.max(HT+2+D.vol,D.dos);      /* jamais moins que le crâne entier */
      const lg=D.large||12;                     /* largeur de la masse */
      const g0=-(lg>>1);
      /* une masse aux angles adoucis, pas un bloc */
      R(g0+1,y0,lg-2,hd,C);                     /* corps */
      R(g0,y0+1,lg,hd-2,C);                     /* flancs, un pixel plus bas */
      R(g0+1,y0+1,4,3,CC);                      /* la lumière en haut à gauche */
      R(g0+lg-4,y0+1,3,hd-2,CO);                /* le côté à l'ombre */
      R(g0+2,y0+hd-2,lg-4,2,CT);                /* les pointes */
      if(D.queue){R(-3,YT+2,6,3,C);                 /* l'attache */
        R(-2,YT+4,4,D.queue,C);R(-2,YT+4,2,D.queue,CC);R(-2,YT+D.queue+1,4,3,CT);}
      if(D.couettes){R(-9,YT+1,3,D.couettes,C);R(6,YT+1,3,D.couettes,CO);
        R(-9,YT+D.couettes-1,3,2,CT);R(6,YT+D.couettes-1,3,2,CT);}
      if(D.tresse)for(let i=0;i<6;i++)R(-2,YT+2+i*3,4,3,i%2?CO:C);
      if(D.tresses)for(let i=0;i<5;i++){R(-8,YT+1+i*3,3,3,i%2?CO:C);R(5,YT+1+i*3,3,3,i%2?C:CO);}
      if(D.chignon===1)R(-3,YT-5-D.vol-reb,6,5,C);
      if(D.chignon===2){R(-2,YT-8-reb,5,6,C);R(-2,YT-8-reb,2,2,CC);}
      if(D.crete){R(-6,YT-1,12,5,CO);R(-2,YT-9-reb,4,9,C);R(-2,YT-9-reb,2,9,CC);}
    }else if(cote){
      /* ---- de profil : un seul pan, derrière la tête ---- */
      const der=s>0?-8:6;                        /* le côté opposé au regard */
      if(D.pan>1){
        R(der+tr,YT+1,3,D.pan,C);
        if(D.pan>6)R(der+tr,YT+D.pan-2,3,3,CT);
      }
      if(D.fr==='droite')R(s>0?-6:0,YT+1,6,2,CO);
      if(D.fr==='cote')R(s>0?-2:-4,YT+1,6,2,CO);
      if(D.fr==='courte')R(s>0?-1:-5,YT+1,6,1,CO);
      if(D.fr==='arriere')R(s>0?-5:0,YT-2-D.vol,6,2,CC);
      if(!D.ras&&D.pan>=2)R(s>0?-6:2,YT+1,4,3,C);   /* la tempe visible */
      if(D.queue){R(der+tr,YT+1,3,D.queue,C);R(der+tr,YT+D.queue-2,3,3,CT);}
      if(D.couettes)R(der+tr,YT+2,3,D.couettes,C);
      if(D.tresse)for(let i=0;i<5;i++)R(der+tr,YT+2+i*3,3,3,i%2?CO:C);
      if(D.tresses)for(let i=0;i<4;i++)R(der+tr,YT+2+i*3,3,3,i%2?CO:C);
      if(D.chignon===1)R(der+2,YT-4-reb,5,5,C);
      if(D.chignon===2)R(-1,YT-8-reb,5,6,C);
      if(D.crete){R(-6,YT-1,12,4,CO);R(-2,YT-9-reb,4,9,C);}
      if(D.afro){R(der-1,YT-6,5,10,C);R(-6,YT-7,12,7,C);R(-6,YT-6,4,3,CC);}
      if(D.dreads)for(let i=0;i<4;i++)R(der+tr,YT+1+i*3,3,7,i%2?CO:C);
      if(D.boucle){R(der,YT-4,4,7,C);R(-6,YT-5,12,5,C);R(-6,YT-4,4,2,CC);}
    }else{
      /* ---- de face ---- */
      if(D.fr==='droite')R(-6,YT+1,12,2,CO);     /* frange qui barre le front */
      if(D.fr==='cote'){R(-6,YT+1,7,2,CO);R(1,YT+1,5,1,CO);}
      if(D.fr==='courte')R(-6,YT+1,12,1,CO);
      if(D.fr==='meche'){R(-6,YT+1,5,2,CO);R(2,YT+1,4,1,CO);}
      if(D.fr==='boucle'){R(-6,YT+1,4,2,C);R(-1,YT+1,3,2,CO);R(3,YT+1,3,2,C);}
      if(!D.ras&&D.pan>=2){                       /* les tempes, seulement si la coupe les a */
        const ht=Math.max(3,Math.min(5,D.pan));
        R(-6,YT+1,2,ht,C);
        R(4,YT+1,2,ht,CO);
      }
      if(D.pan>4){                                /* les pans qui pendent */
        R(-7+tr,YT+1,2,D.pan,C);
        R(5+tr,YT+1,2,D.pan,CO);
        R(-7+tr,YT+D.pan-2,2,3,CT);
        R(5+tr,YT+D.pan-2,2,3,CT);
      }
      if(D.onde){R(-8+tr,YT+4,2,5,C);R(6+tr,YT+4,2,5,CO);}
      if(D.queue){R(5+tr,YT+1,2,3,C);R(6+tr,YT+2,1,3,CO);}  /* elle dépasse à peine */
      if(D.couettes){
        R(-8+tr,YT,3,D.couettes,C);      R(5+tr,YT,3,D.couettes,CO);
        R(-8+tr,YT,3,1,CC);
        R(-8+tr,YT+D.couettes,2,2,CT);   R(6+tr,YT+D.couettes,2,2,CT);}
      if(D.tresse){R(5+tr,YT+1,3,4,CO);}
      if(D.tresses)for(let i=0;i<4;i++){R(-8+tr,YT+1+i*3,3,3,i%2?CO:C);R(5+tr,YT+1+i*3,3,3,i%2?C:CO);}
      if(D.chignon===1){R(-3,YT-3-D.vol-reb,5,3,C);R(-3,YT-3-D.vol-reb,2,1,CC);R(1,YT-3-D.vol-reb,1,3,CO);}
      if(D.chignon===2){R(-2,YT-8-reb,5,6,C);R(-2,YT-8-reb,2,2,CC);R(-3,YT-3,7,2,C);}
      if(D.afro){R(-9,YT-6,18,8,C);R(-9,YT-5,6,3,CC);R(5,YT-6,4,8,CO);
        R(-9,YT+1,3,5,C);R(6,YT+1,3,5,CO);}
      if(D.boucle){R(-7,YT-4,14,5,C);R(-7,YT-3,4,2,CC);R(4,YT-4,3,5,CO);
        R(-8,YT+1,3,4,C);R(5,YT+1,3,4,CO);R(-5,YT-6,4,2,CC);R(1,YT-6,4,2,C);}
      if(D.dreads){                              /* elles encadrent le visage, sans le couvrir */
        for(let i=0;i<3;i++){
          R(-8+tr,YT+1+i*4,3,5,i%2?CO:C);
          R(5+tr,YT+1+i*4,3,5,i%2?C:CO);
        }
        R(-6,YT+1,12,2,CO);                       /* la racine sur le front */
        R(-8+tr,YT+11,3,2,CT);R(5+tr,YT+11,3,2,CT);
      }
      if(D.crete){R(-6,YT-1,12,2,CO);R(-2,YT-9-reb,4,9,C);R(-2,YT-9-reb,2,9,CC);}
      if(D.hirsute){R(-8,YT-3,3,3,C);R(5,YT-4,3,3,CO);R(-3,YT-4-reb,3,3,C);R(2,YT-5-reb,2,3,CC);}
      if(D.fr==='arriere'){
        R(-5,YT-2-D.vol,10,2,C);
        R(-4,YT-4-D.vol,8,2,C);
        R(-2,YT-5-D.vol,6,1,CC);
        R(3,YT-4-D.vol,2,4,CO);}
    }
  }

  /* ---- ce qu'on porte sur la tête : ajusté à la largeur du crâne ---- */
  const LTc=SIL.tete;                              /* demi-largeur de la tête */
  if(chapeau==='casquette'){
    R(-LTc-1,YT-4,(LTc+1)*2,4,'#3f5f6b');          /* la calotte épouse le crâne */
    R(-LTc-1,YT-4,(LTc+1)*2,1,'#547a88');
    R(-LTc,YT-1,LTc*2,1,'#33505a');
    const vx=cote?(s>0?1:-LTc*2-1):-LTc-1;         /* la visière part vers l'avant */
    R(vx,YT,LTc*2+1,2,'#33505a');
    R(vx,YT,LTc*2+1,1,'#456a76');
  }
  else if(chapeau==='bandana'){
    R(-LTc-1,YT-2,(LTc+1)*2,3,'#a8524a');
    R(-LTc-1,YT-2,(LTc+1)*2,1,'#c46a5e');
    R(-LTc+1,YT-1,3,1,'#8f4038');                  /* le nœud */
    R(LTc-1+tr,YT,3,5,'#8f4038');                  /* les pans qui pendent */
    R(LTc-1+tr,YT+4,3,1,'#71322c');
  }
  else if(chapeau==='bonnet'){
    R(-LTc-1,YT-6,(LTc+1)*2,6,'#8a4a3a');
    R(-LTc-1,YT-6,(LTc+1)*2,1,'#a85c48');
    R(-LTc-1,YT-1,(LTc+1)*2,2,'#a85c48');          /* le revers */
    R(-LTc-1,YT+1,(LTc+1)*2,1,'#71392c');
    R(-2,YT-9-reb,4,3,'#c07260');                  /* le pompon */
    R(-2,YT-9-reb,2,1,'#d9897a');
  }
  else if(chapeau==='capuche'){
    R(-LTc-2,YT-5,(LTc+2)*2,HT+3,'#54606b');       /* le tissu enveloppe la tête */
    R(-LTc-2,YT-5,(LTc+2)*2,2,'#68757f');
    R(-LTc-2,YT+3,2,HT-5,'#465059');
    R(LTc,YT+3,2,HT-5,'#465059');
    R(-LTc,YT+1,LTc*2,HT-2,peau);                  /* le visage reste dégagé */
    R(-LTc,YT+1,3,HT-2,peauO);
    R(-LTc,YT+1,LTc*2,1,teint(peau,-30));          /* l'ombre de la capuche */
  }
  else if(chapeau==='chapeau'){
    R(-LTc-4,YT-1,(LTc+4)*2,2,'#5a4a2c');          /* le bord large */
    R(-LTc-4,YT-1,(LTc+4)*2,1,'#7a663c');
    R(-LTc,YT-6,LTc*2,5,'#8f7a49');                /* la calotte */
    R(-LTc,YT-6,LTc*2,1,'#a08a56');
    R(-LTc,YT-3,LTc*2,2,'#5a4a2c');                /* le ruban */
  }
  else if(chapeau==='beret'){
    R(-LTc-1,YT-4,(LTc+1)*2-1,4,'#2f4a5c');
    R(-LTc-1,YT-4,LTc,2,'#3f6076');
    R(LTc-2,YT-6-reb,2,2,'#2f4a5c');               /* la queue sur le dessus */
  }
  else if(chapeau==='cagoule'){
    R(-LTc-1,YT-2,(LTc+1)*2,HT+2,'#3a3a44');
    R(-LTc-1,YT-2,(LTc+1)*2,2,'#4a4a56');
    if(!prof){R(-4,YT+4,3,3,peau);R(1,YT+4,3,3,peau);}   /* les deux fentes */
    R(-LTc-1,YT+HT-2,(LTc+1)*2,1,'#2b2b33');
  }

  /* ---- le visage ----
     Il tient dans dix pixels de large : chaque pixel compte. */
  const blanc='#f6f3ec', ombreOeil=teint(peau,-38);
  if(dir==='bas'&&chapeau==='cagoule'){
    R(-4,YT+5,3,2,oeil);R(2,YT+5,3,2,oeil);      /* on ne voit que les yeux */
  }else if(dir==='bas'){
    const clin=(Date.now()+x*53)%4600<130;
    /* sourcils */
    if(sourcil==='fins'){R(-4,YT+3,3,1,chevO);R(2,YT+3,3,1,chevO);}
    if(sourcil==='epais'){R(-4,YT+2,3,2,chevO);R(2,YT+2,3,2,chevO);}
    if(sourcil==='arques'){R(-4,YT+3,2,1,chevO);R(-2,YT+2,1,1,chevO);
                           R(3,YT+3,2,1,chevO);R(2,YT+2,1,1,chevO);}
    if(sourcil==='fronces'){R(-4,YT+3,3,1,chevO);R(2,YT+3,3,1,chevO);
                            R(-1,YT+3,2,1,chevO);}
    /* creux des orbites */
    R(-4,YT+4,3,1,ombreOeil);R(2,YT+4,3,1,ombreOeil);
    /* yeux */
    if(clin){R(-4,YT+6,3,1,chevO);R(2,YT+6,3,1,chevO);}
    else{
      const dessine=(gx,h,ty)=>{
        R(gx,YT+ty,3,h,blanc);
        R(gx+1,YT+ty,1,h,oeil);                 /* iris */
        R(gx+1,YT+ty,1,1,teint(oeil,40));       /* reflet */
      };
      if(fy==='ronds'){dessine(-4,3,4);dessine(2,3,4);}
      else if(fy==='plisses'){R(-4,YT+5,3,1,oeil);R(2,YT+5,3,1,oeil);}
      else if(fy==='fatigues'){dessine(-4,2,5);dessine(2,2,5);
        R(-4,YT+7,3,1,peauT);R(2,YT+7,3,1,peauT);}
      else if(fy==='doux'){dessine(-4,2,5);dessine(2,2,5);
        R(-4,YT+4,3,1,peau);R(2,YT+4,3,1,peau);}
      else if(fy==='severes'){dessine(-4,2,5);dessine(2,2,5);
        R(-4,YT+4,3,1,chevO);R(2,YT+4,3,1,chevO);}
      else{dessine(-4,2,5);dessine(2,2,5);}
    }
    /* nez */
    if(nez==='petit'){R(0,YT+7,1,1,peauT);}
    if(nez==='droit'){R(0,YT+6,1,2,ombreOeil);R(0,YT+8,1,1,peauT);}
    if(nez==='large'){R(-1,YT+7,3,1,ombreOeil);R(-1,YT+8,3,1,peauT);}
    if(nez==='retrousse'){R(0,YT+6,1,2,ombreOeil);R(-1,YT+8,2,1,peauT);}
    /* cils : c'est le regard qui les porte, pas la carrure */
    if((fy==='doux'||fy==='ronds')&&!clin){R(-5,YT+4,1,1,chevO);R(4,YT+4,1,1,chevO);}
    /* bouche */
    const lev=(bouche==='lèvres');
    if(bouche==='neutre')R(-2,YT+9,4,1,teint(peau,-64));
    if(lev){R(-2,YT+9,4,1,'#b06a68');R(-2,YT+10,4,1,teint(peau,-24));R(-1,YT+8,2,1,'#c47f7c');}
    if(bouche==='sourire'){R(-2,YT+9,4,1,SIL.levres?'#b06a68':teint(peau,-64));
      R(-3,YT+8,1,1,peauO);R(2,YT+8,1,1,peauO);R(-1,YT+10,2,1,teint(peau,-30));}
    if(bouche==='severe'){R(-3,YT+9,6,1,teint(peau,-70));}
    if(bouche==='entrouverte'){R(-2,YT+9,4,1,teint(peau,-70));R(-1,YT+10,2,1,'#8a4a4a');}
    if(bouche==='pincée'){R(-1,YT+9,3,1,teint(peau,-70));R(-2,YT+9,1,1,peauT);R(2,YT+9,1,1,peauT);}
    /* marques */
    if(marque==='taches'){R(-4,YT+7,1,1,peauT);R(-2,YT+8,1,1,peauT);R(3,YT+7,1,1,peauT);R(2,YT+6,1,1,peauT);}
    if(marque==='cicatrice'){R(3,YT+2,1,5,teint(peau,-46));R(2,YT+3,1,1,teint(peau,-46));}
    if(marque==='grain'){R(-3,YT+8,1,1,teint(peau,-70));}
    if(marque==='fard'){R(-4,YT+8,3,1,'#c9707a');R(2,YT+8,3,1,'#c9707a');}
    if(marque==='peinture'){R(-4,YT+4,3,3,'#a8524a');R(2,YT+4,3,3,'#a8524a');
      R(-4,YT+4,3,1,'#c46a5e');R(2,YT+4,3,1,'#c46a5e');}
    /* boucles d'oreille */
    const oy=YT+7, ox=SIL.tete+1;
    if(boucle==='anneau'){R(-ox,oy,1,2,'#c9a24a');R(ox-1,oy,1,2,'#c9a24a');}
    if(boucle==='perle'){R(-ox,oy,1,1,'#f2efe4');R(ox-1,oy,1,1,'#f2efe4');}
    if(boucle==='plume'){R(ox-1,oy,1,4,'#4a7d7d');R(ox-1,oy+3,1,1,'#7fbdbd');}
  }else if(cote){
    const dx=s>0?2:-4;
    if(sourcil==='epais')R(dx,YT+2,2,2,chevO);else R(dx,YT+3,2,1,chevO);
    R(dx,YT+4,2,1,ombreOeil);
    R(dx,YT+5,2,2,blanc);
    R(dx+(s>0?1:0),YT+5,1,2,oeil);
    R(s>0?5:-6,YT+6,1,2,peauT);                 /* le nez dépasse du profil */
    R(s>0?4:-5,YT+9,2,1,teint(peau,-64));       /* bouche */
    if(boucle!=='aucune')R(s>0?-4:3,YT+7,1,2,boucle==='perle'?'#f2efe4':'#c9a24a');
    if(marque==='fard')R(dx-1,YT+8,3,1,'#c9707a');
  }
}


const monAp=()=>Object.assign({},DEF_AP,{peau:3,cheveux:2,coiffe:4,barbe:1,veste:0,pantalon:0});

/* ================= LA SALLE =================
   Dix-huit cases sur douze. Sol de planches, murs de pierre, et trois postes
   de travail : le four à gauche, l'enclume au centre, l'établi à droite. */
const CASE=16, L=18, H=13;
/* la carte, écrite à la main : # mur · . plancher · , dalle de pierre
   f four · e enclume · t établi · c coffre · p porte */
const PLAN=[
  '##################',
  '#,,,,,,,,,,,,,,,,#',
  '#,,,,,,,,,,,,,,,,#',
  '#,,,,,,,,,,,,,,,,#',
  '#,,,,,,,,,,,,,,,,#',
  '#....,,,,,,,,.....#'.slice(0,18),
  '#.................#'.slice(0,18),
  '#.................#'.slice(0,18),
  '#.................#'.slice(0,18),
  '#.................#'.slice(0,18),
  '#.................#'.slice(0,18),
  '#.................#'.slice(0,18),
  '########..########'
];
const POSTES=[
  {id:'four',   a:3, b:2,  nom:'Le four',    verbe:'Enfourner', sous:'FONDRE LE MINERAI'},
  {id:'enclume',a:9, b:6,  nom:'L’enclume',  verbe:'Forger',    sous:'BATTRE LA LAME'},
  {id:'etabli', a:14,b:2,  nom:'L’établi',   verbe:'Fabriquer', sous:'TAILLER SES OUTILS'}
];
const DECORS=[
  {t:'enclume',a:9,b:6},{t:'four',a:3,b:2},{t:'etabli',a:14,b:2},{t:'coffre',a:16,b:9},
  {t:'baquet',a:11,b:6},{t:'charbon',a:5,b:3},{t:'tonneau',a:1,b:9},{t:'tonneau',a:2,b:11},
  {t:'buches',a:16,b:6},{t:'buches',a:16,b:5},{t:'soufflet',a:1,b:3},
  {t:'ratelier',a:7,b:1},{t:'ratelier',a:12,b:1},{t:'lanterne',a:6,b:1},{t:'lanterne',a:13,b:1},
  {t:'fenetre',a:9,b:1},{t:'sacs',a:4,b:10},{t:'seau',a:12,b:10},{t:'etau',a:15,b:3}
];
const mur=(a,b)=>{
  if(a<0||b<0||a>=L||b>=H)return true;
  return PLAN[b][a]==='#';
};
const DUR=['four','enclume','etabli','coffre','baquet','tonneau','soufflet','etau','charbon'];
const bloque=(x,y)=>{
  if(mur((x/CASE)|0,(y/CASE)|0))return true;
  return DECORS.some(o=>DUR.includes(o.t)&&
    Math.abs(o.a*CASE+CASE/2-x)<12&&Math.abs(o.b*CASE+CASE/2-y)<11);
};

/* ================= les tuiles, gravées au pixel ================= */
let TUILES=null;
const alea2=(n)=>{const x=Math.sin(n*127.1)*43758.5453;return x-Math.floor(x);};
function toile(w,h,f){
  const c=document.createElement('canvas');
  c.width=w*DPR*2;c.height=h*DPR*2;
  const g=c.getContext('2d');
  g.setTransform(DPR*2,0,0,DPR*2,0,0);g.imageSmoothingEnabled=false;
  const P=(x,y,col)=>{g.fillStyle=col;g.fillRect(x|0,y|0,1,1);};
  f({g,P,R:(x,y,w2,h2,col)=>{g.fillStyle=col;g.fillRect(x|0,y|0,w2|0,h2|0);}});
  return c;
}
function graver(){
  /* le plancher : des lames de bois, décalées d'une rangée à l'autre */
  const planche=(v)=>toile(CASE,CASE,({P,R})=>{
    const tons=['#7d5934','#8a6238','#6b4a28','#96703f'];
    for(let j=0;j<CASE;j++)for(let i=0;i<CASE;i++){
      const lame=((j+v*3)/5|0);
      let col=tons[(lame+v)%3];
      if(j%5===0)col='#4f3520';                       /* le joint entre deux lames */
      if(j%5===1)col=tons[3];                         /* la lumière sur l'arête */
      if((i*7+j*3)%23===0)col='#5b3f21';              /* le fil du bois */
      P(i,j,col);
    }
    /* les clous */
    R(2,3,1,1,'#4a4038');R(CASE-4,8,1,1,'#4a4038');
  });
  /* la dalle de pierre, devant le four */
  const dalle=(v)=>toile(CASE,CASE,({P})=>{
    for(let j=0;j<CASE;j++)for(let i=0;i<CASE;i++){
      let col=(i+j+v)%3?'#6b6359':'#7a7268';
      if(i===0||j===0)col='#4f4a42';
      if(j===1||i===1)col='#8a8175';
      if((i*5+j*7)%17===0)col='#5e564d';
      P(i,j,col);
    }
  });
  /* le mur de pierre, vu de dessus + sa face */
  const murT=(v)=>toile(CASE,CASE,({P})=>{
    for(let j=0;j<CASE;j++)for(let i=0;i<CASE;i++){
      const bloc=(((i+v*5)/8|0)+((j/6|0)))%2;
      let col=bloc?'#6b6359':'#5e564d';
      if(j%6===0)col='#4a443c';
      if(j%6===1)col='#8a8175';
      if((i+v*4)%8===0)col='#4a443c';
      P(i,j,col);
    }
  });
  const face=toile(CASE,14,({P}) =>{
    for(let i=0;i<CASE;i++){P(i,0,'#9e9488');P(i,1,'#8a8175');}
    for(let j=2;j<8;j++)for(let i=0;i<CASE;i++){
      const bloc=((i/8|0))%2;
      let col=bloc?'#6b6359':'#5e564d';
      if((i%8)===0)col='#453f38';
      if(j===2)col='#7a7268';
      P(i,j,col);
    }
    for(let j=8;j<12;j++)for(let i=0;i<CASE;i++)P(i,j,((i+j)%2)?'#453f38':'#3a352f');
    for(let i=0;i<CASE;i++){P(i,12,'#2a2622');P(i,13,'#1c1916');}
  });
  TUILES={planches:[planche(0),planche(1),planche(2)],
          dalles:[dalle(0),dalle(1)],
          murs:[murT(0),murT(1),murT(2)],face};
}

function ombre(g,x,y,r){g.fillStyle='rgba(0,0,0,.34)';
  g.beginPath();g.ellipse(x,y+1,r,r*0.4,0,0,7);g.fill();}

function four(g,x,y){
  const t=Date.now()/1000;
  ombre(g,x,y,15);
  /* la cheminée qui monte dans le mur */
  R(g,x-8,y-46,16,20,'#5e564d');
  R(g,x-8,y-46,16,2,'#7a7268');
  R(g,x-10,y-48,20,3,'#6b6359');
  /* le corps, en briques */
  for(let j=0;j<24;j+=5)for(let i=0;i<28;i+=9){
    const dx=(j/5)%2?4:0;
    R(g,x-14+i+dx,y-26+j,8,4,(i+j)%3?'#8a4a3a':'#9e5745');
    R(g,x-14+i+dx,y-26+j,8,1,'#b06a52');
  }
  R(g,x-15,y-28,30,3,'#6b372b');
  R(g,x-15,y-28,30,1,'#a25b47');
  /* la gueule, et le feu dedans */
  R(g,x-8,y-16,16,13,'#1c1410');
  const h=1+Math.sin(t*8)*0.1;
  g.fillStyle='#c9531c';
  g.beginPath();g.ellipse(x,y-6,7,6*h,0,0,7);g.fill();
  g.fillStyle='#e8802c';
  g.beginPath();g.ellipse(x,y-7,5,5*h,0,0,7);g.fill();
  g.fillStyle=((t*7)%1)<.5?'#ffc65a':'#ffe9a8';
  g.beginPath();g.ellipse(x,y-8,2.6,3.4*h,0,0,7);g.fill();
  /* les braises au sol, et le halo */
  R(g,x-7,y-4,14,2,'#c9531c');
  g.save();g.globalAlpha=.20+Math.sin(t*5)*0.05;
  g.fillStyle='#ffb03a';
  g.beginPath();g.arc(x,y-8,46,0,7);g.fill();g.restore();
}
function enclume(g,x,y){
  const t=Date.now()/1000;
  ombre(g,x,y,13);
  R(g,x-7,y-7,14,7,'#5e564d');                    /* le billot */
  R(g,x-7,y-7,14,1.4,'#7a7268');
  R(g,x-9,y-13,18,6,'#4a4650');                   /* le corps */
  R(g,x-9,y-13,18,1.6,'#6b6675');
  R(g,x-5,y-17,10,4,'#4a4650');
  R(g,x-5,y-17,10,1.4,'#6b6675');
  g.fillStyle='#4a4650';                          /* la corne */
  g.beginPath();g.moveTo(x+9,y-12);g.lineTo(x+17,y-10);g.lineTo(x+9,y-8);g.closePath();g.fill();
  /* la lame en cours, rougie */
  const rouge=0.5+Math.sin(t*1.4)*0.4;
  R(g,x-4,y-18.4,10,2,'rgba('+Math.round(160+90*rouge)+','+Math.round(70+40*rouge)+',40,.95)');
  R(g,x+6,y-18.4,5,2,'#6b4a28');
}

/* ================= le joystick du jeu ================= */
/* ================= le joystick, flottant =================
   Il n'a pas de place fixe : il apparaît là où le pouce se pose,
   dans toute la moitié gauche de l'écran, et s'efface quand on lâche. */
const jc=$('joy'), jg=jc.getContext('2d');
let JDPR=1;
function tailleJoy(){
  JDPR=Math.max(1,Math.min(3,window.devicePixelRatio||1));
  jc.width=Math.round(window.innerWidth*JDPR);
  jc.height=Math.round(window.innerHeight*JDPR);
  jg.setTransform(JDPR,0,0,JDPR,0,0);
}
addEventListener('resize',tailleJoy);
tailleJoy();

const RAYON=52, POUCE=22;
let J={actif:false,id:null,ox:0,oy:0,x:0,y:0,vie:0};

const pointDe=t=>[t.clientX,t.clientY];
function prendre(x,y){
  const limite=window.innerHeight-96;          /* la barre du bas */
  if(y>limite)y=limite;
  J.actif=true;J.ox=x;J.oy=y;J.x=x;J.y=y;J.vie=1;
  joyX=joyY=0;
  try{navigator.vibrate&&navigator.vibrate(8);}catch(x2){}   /* un petit clic sous le doigt */
}
function tirer(x,y){
  const dx=x-J.ox, dy=y-J.oy, d=Math.hypot(dx,dy);
  const a=Math.atan2(dy,dx);
  const m=Math.min(d,RAYON);
  J.x=J.ox+Math.cos(a)*m;J.y=J.oy+Math.sin(a)*m;
  /* si le pouce s'éloigne trop, le manche se déplace avec lui */
  if(d>RAYON){J.ox=x-Math.cos(a)*RAYON;J.oy=y-Math.sin(a)*RAYON;}
  const n=Math.min(1,d/RAYON);
  joyX=d<1?0:Math.cos(a)*n;joyY=d<1?0:Math.sin(a)*n;
  if(Math.hypot(joyX,joyY)<.16)joyX=joyY=0;
}
function lacher(){J.actif=false;J.id=null;joyX=joyY=0;}

/* on n'accepte le doigt que dans la moitié gauche : la droite reste libre */
const pageOuverte=()=>$('page').classList.contains('on');
/* le joystick se prend n'importe où sur la carte, des deux côtés.
   On ne l'ignore que si le doigt touche un bouton de l'interface. */
const surUnBouton=(cible)=>!!(cible&&cible.closest&&cible.closest('button,#action,#page,#titre,#sortirB'));
const zoneMarche=(x,y,cible)=>!pageOuverte()&&!surUnBouton(cible);

/* on écoute la page entière, mais on ne prend le doigt que dans la zone de marche :
   ailleurs, le toucher passe normalement aux boutons */
document.addEventListener('touchstart',ev=>{
  for(const t of ev.changedTouches){
    if(J.actif)continue;
    const [x,y]=pointDe(t);
    if(!zoneMarche(x,y,ev.target))continue;
    ev.preventDefault();
    J.id=t.identifier;prendre(x,y);
  }
},{passive:false});
document.addEventListener('touchmove',ev=>{
  for(const t of ev.changedTouches)if(t.identifier===J.id){
    ev.preventDefault();
    const [x,y]=pointDe(t);tirer(x,y);
  }
},{passive:false});
['touchend','touchcancel'].forEach(k=>document.addEventListener(k,ev=>{
  for(const t of ev.changedTouches)if(t.identifier===J.id){ev.preventDefault();lacher();}
},{passive:false}));

document.addEventListener('mousedown',ev=>{
  if(zoneMarche(ev.clientX,ev.clientY,ev.target))prendre(ev.clientX,ev.clientY);});
addEventListener('mousemove',ev=>{if(J.actif)tirer(ev.clientX,ev.clientY);});
addEventListener('mouseup',()=>{if(J.actif)lacher();});

addEventListener('keydown',ev=>{const k={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],
  z:[0,-1],s:[0,1],q:[-1,0],d:[1,0]}[ev.key];if(k){joyX=k[0];joyY=k[1];}});
addEventListener('keyup',()=>{joyX=joyY=0;});

function dessinerJoy(dt){
  /* il s'efface doucement quand on lâche */
  if(!J.actif&&J.vie>0)J.vie=Math.max(0,J.vie-dt*5);
  jg.clearRect(0,0,window.innerWidth,window.innerHeight);
  if(J.vie<=0)return;
  jg.save();
  jg.globalAlpha=J.vie;
  /* la couronne */
  jg.beginPath();jg.arc(J.ox,J.oy,RAYON,0,7);
  const f=jg.createRadialGradient(J.ox,J.oy-14,6,J.ox,J.oy,RAYON);
  f.addColorStop(0,'rgba(240,246,238,.26)');f.addColorStop(1,'rgba(200,212,198,.12)');
  jg.fillStyle=f;jg.fill();
  jg.lineWidth=2.5;jg.strokeStyle='rgba(240,246,238,.38)';jg.stroke();
  /* le sens, en léger */
  const d=Math.hypot(J.x-J.ox,J.y-J.oy);
  if(d>6){
    const a=Math.atan2(J.y-J.oy,J.x-J.ox);
    jg.beginPath();
    jg.arc(J.ox,J.oy,RAYON-2,a-0.5,a+0.5);
    jg.lineWidth=4;jg.strokeStyle='rgba(169,232,138,.5)';jg.stroke();
  }
  /* le manche */
  jg.beginPath();jg.arc(J.x,J.y+3,POUCE,0,7);jg.fillStyle='rgba(10,18,12,.22)';jg.fill();
  const k=jg.createRadialGradient(J.x-5,J.y-8,3,J.x,J.y,POUCE+1);
  if(d>6){k.addColorStop(0,'#a9e88a');k.addColorStop(1,'#3f7d4a');}
  else{k.addColorStop(0,'#f4f7f0');k.addColorStop(1,'#c9d2c2');}
  jg.beginPath();jg.arc(J.x,J.y,POUCE,0,7);jg.fillStyle=k;jg.fill();
  jg.lineWidth=2.5;jg.strokeStyle=d>6?'#2c6b32':'rgba(40,50,40,.4)';jg.stroke();
  jg.restore();
}

/* on garde le sac et l'état du four dans le compte, comme le jeu le fait */
function sauverTout(){try{localStorage.setItem(CLE_LOCALE,JSON.stringify(e));}catch(x){}}
async function chargerSac(){
  if(!e.id){SAC={fer:4,charbon:3,bois:4,resine:3,fibre:9,roseaux:7,argile:4};
    enLigne=false;return;}
  const d=await appel('lire_sac',{p_joueur:e.id});
  SAC=(d&&d.sac)||e.sac||{};
  e.sac=SAC;sauverTout();
}
function ligne(ico,titre,sous,cout,bouton,cle,pret){
  return '<div class="recette'+(pret?' pret':'')+'">'+
    '<span class="ic"><svg viewBox="0 0 16 16" width="26">'+ico+'</svg></span>'+
    '<span class="tx"><b>'+titre+'</b><span>'+sous+'</span>'+(cout?coutHTML(cout):'')+'</span>'+
    (bouton?'<button data-faire="'+cle+'"'+(pret?'':' disabled')+'>'+bouton+'</button>'
           :'<span style="font:600 9px system-ui;color:#6f9153">déjà fait</span>')+'</div>';
}
/* ---- le four : une fournée à la fois, qui cuit même hors du jeu ---- */
function corpsFour(){
  if(e.four){
    const f=FONTES.find(x=>x.id===e.four.recette);
    const reste=e.four.fin-Date.now();
    if(reste>0){
      const total=f.duree*1000, fait=Math.max(0,total-reste);
      return '<div class="mot">Il continue de chauffer même si tu fermes le jeu.</div>'+
        '<div class="chauffe"><div class="barre"><i style="width:'+
          Math.round(fait/total*100)+'%"></i></div>'+
        '<div class="reste">'+f.nom+' — '+(reste>60000?Math.ceil(reste/60000)+' min restantes'
          :Math.ceil(reste/1000)+' s restantes')+'</div></div>';
    }
    return '<div class="mot">La fournée est prête.</div>'+
      ligne(ICONES[Object.keys(f.rend)[0]]||ICONES.fer,f.nom,'sorti du four',null,'Récupérer','_sortir',true);
  }
  return '<div class="mot">Tu enfournes, tu repars, tu récupères en revenant.</div>'+
    FONTES.map(f=>ligne(ICONES[Object.keys(f.rend)[0]]||ICONES.fer,f.nom,
      (f.duree>=60?Math.round(f.duree/60*10)/10+' min':f.duree+' s')+' de chauffe',
      f.cout,'Enfourner','four:'+f.id,assez(f.cout))).join('');
}
/* ---- l'établi : les outils ---- */
function corpsEtabli(){
  return '<div class="mot">L’établi est sous la fenêtre, là où le jour tombe.</div>'+
    FORGES.map(f=>{
      const deja=f.fait();
      return ligne(ICONES[f.id]||ICONES.pioche,f.nom,f.d,f.cout,
        deja?null:'Fabriquer','etabli:'+f.id,!deja&&assez(f.cout));
    }).join('');
}
/* ---- l'enclume : les lames, dans l'ordre ---- */
function corpsEnclume(){
  const rang=e.epee||0;
  return '<div class="mot">Les lames se battent dans l’ordre : chacune demande la '+
    'précédente au poing. Ce que tu remontes de la mine finit ici.</div>'+
    EPEES.map((E,i)=>{
      if(i===0)return '';
      const deja=rang>=i, tour=(i===rang+1);
      return ligne(icoEpee(E.coul[0]),E.nom,E.deg+' dégâts par coup',E.cout,
        deja?null:(tour?'Forger':'Plus tard'),'lame:'+i,!deja&&tour&&assez(E.cout));
    }).join('');
}

function ouvrirPoste(p){
  const corps=p.id==='four'?corpsFour():p.id==='etabli'?corpsEtabli():corpsEnclume();
  $('fond').innerHTML='<div class="rabat"><button class="x" id="p-x">✕</button>'+
    '<span class="t"><b>'+p.nom+'</b><i>'+p.sous+'</i></span></div>'+
    '<div class="corps">'+corps+'</div>';
  $('p-x').onclick=()=>$('page').classList.remove('on');
  $('fond').querySelectorAll('[data-faire]').forEach(b=>b.onclick=()=>faire(b.dataset.faire,p));
  $('page').classList.add('on');
}
/* ---- ce qui se passe quand on appuie ---- */
async function faire(cle,poste){
  const [quoi,id]=cle.split(':');
  if(cle==='_sortir'){
    const f=FONTES.find(x=>x.id===e.four.recette);
    for(const [k,n] of Object.entries(f.rend)){
      if(enLigne&&e.id){const d=await appel('livrer',{p_joueur:e.id,p_type:k,p_nb:n});
        if(d&&d.sac)SAC=d.sac;}
      else SAC[k]=(SAC[k]||0)+n;
    }
    e.four=null;e.sac=SAC;sauverTout();
    dire(Object.entries(f.rend).map(([k,n])=>'+'+n+' '+nomDe(k).toLowerCase()).join(', '));
    BRAISES=1;
    return ouvrirPoste(poste);
  }
  if(quoi==='four'){
    const f=FONTES.find(x=>x.id===id);
    if(!assez(f.cout))return dire('il te manque de quoi');
    if(enLigne&&e.id){
      const d=await appel('retirer_du_sac',{p_joueur:e.id,p_cout:f.cout});
      if(d&&d.erreur)return dire(d.erreur);
      if(d&&d.sac)SAC=d.sac;
    }else Object.entries(f.cout).forEach(([k,n])=>{SAC[k]=combien(k)-n;});
    e.four={recette:f.id,fin:Date.now()+f.duree*1000};
    e.sac=SAC;sauverTout();
    dire(f.nom+' au four');
    return ouvrirPoste(poste);
  }
  if(quoi==='etabli'){
    const f=FORGES.find(x=>x.id===id);
    if(!f||f.fait()||!assez(f.cout))return;
    if(enLigne&&e.id){
      const d=await appel('retirer_du_sac',{p_joueur:e.id,p_cout:f.cout});
      if(d&&d.erreur)return dire(d.erreur);
      if(d&&d.sac)SAC=d.sac;
    }else Object.entries(f.cout).forEach(([k,n])=>{SAC[k]=combien(k)-n;});
    if(f.id==='torche'){SAC.torche=(SAC.torche||0)+3;
      if(enLigne&&e.id){const d=await appel('livrer',{p_joueur:e.id,p_type:'torche',p_nb:3});
        if(d&&d.sac)SAC=d.sac;}}
    else if(f.id==='grandSac'){e.sacMax=110;
      if(enLigne&&e.id)appel('agrandir_sac',{p_joueur:e.id,p_max:110});}
    else{e.outils=e.outils||{};e.outils[f.id]=true;}
    e.sac=SAC;sauverTout();
    dire(f.nom+' — c’est fait');
    ETINCELLES=1;
    return ouvrirPoste(poste);
  }
  if(quoi==='lame'){
    const i=+id, E=EPEES[i];
    if((e.epee||0)+1!==i||!assez(E.cout))return;
    if(enLigne&&e.id){
      const d=await appel('forger_epee',{p_joueur:e.id,p_rang:i});
      if(d&&d.erreur)return dire(d.erreur);
      e.epee=(typeof d.epee==='number')?d.epee:i;
      if(d&&d.sac)SAC=d.sac;
    }else{
      Object.entries(E.cout).forEach(([k,n])=>{SAC[k]=combien(k)-n;});
      e.epee=i;
    }
    e.sac=SAC;sauverTout();
    dire(E.nom+' forgée');
    ETINCELLES=1;
    try{navigator.vibrate&&navigator.vibrate([10,30,18]);}catch(x){}
    return ouvrirPoste(poste);
  }
}
function posteVise(){
  let d0=26,res=null;
  POSTES.forEach(p=>{
    const d=Math.hypot(p.a*CASE+CASE/2-joueur.x,p.b*CASE+CASE/2+6-joueur.y);
    if(d<d0){d0=d;res=p;}
  });
  return res;
}
function majAction(){
  const b=$('action'), p=posteVise();
  if(!p||$('page').classList.contains('on')){b.classList.remove('on');b.innerHTML='';return;}
  b.innerHTML=p.verbe+'<small>'+p.sous+'</small>';
  b.classList.add('on');
}
$('action').onclick=()=>{const p=posteVise();if(p)ouvrirPoste(p);};

/* ================= la boucle ================= */
function taille(){
  DPR=Math.max(1,Math.min(3,Math.floor(window.devicePixelRatio||1)));
  cv.width=innerWidth*DPR;cv.height=innerHeight*DPR;
  /* La même vue pour tous : l'échelle s'adapte à l'écran pour cadrer
     toujours la même portion de décor, au huitième de point près.
     On borne les deux côtés, donc un écran allongé ne voit pas plus loin. */
  const VUE_L=196, VUE_H=400;
  let e=Math.max(innerWidth/VUE_L,innerHeight/VUE_H);
  ZOOM=Math.max(1.2,Math.round(e*8)/8);
  ECH=ZOOM*DPR;VW=cv.width/ECH;VH=cv.height/ECH;
  ctx.setTransform(ECH,0,0,ECH,0,0);
  ctx.imageSmoothingEnabled=false;
  TUILES=null;
}
addEventListener('resize',taille);
let t0=performance.now();
function boucle(t){
  const dt=Math.min(.05,(t-t0)/1000);t0=t;
  const d=Math.hypot(joyX,joyY);
  if(d>0.08&&!$('page').classList.contains('on')){
    const v=70*dt*Math.min(1,d);
    const nx=joueur.x+joyX/d*v, ny=joueur.y+joyY/d*v;
    if(!bloque(nx,joueur.y))joueur.x=nx;
    if(!bloque(joueur.x,ny))joueur.y=ny;
    joueur.marche=true;joueur.pas+=v*7;
    joueur.dir=Math.abs(joyX)>Math.abs(joyY)?(joyX>0?'droite':'gauche'):(joyY>0?'bas':'haut');
  }else{joueur.marche=false;joueur.pas=0;}
  /* on sort par la porte du bas */
  /* le seuil : dès qu'on pose le pied dessus, on ressort au camp */
  if(joueur.y>(H-1.4)*CASE&&joueur.x>7.6*CASE&&joueur.x<10.4*CASE)$('sortirB').onclick();
  dessiner();majAction();dessinerJoy(dt);
  requestAnimationFrame(boucle);
}
function dessiner(){
  const g=ctx;
  if(!TUILES)graver();
  const camX=Math.max(-8,Math.min(L*CASE-VW+8,joueur.x-VW/2));
  const camY=Math.max(-20,Math.min(H*CASE-VH+30,joueur.y-VH*0.55));
  g.fillStyle='#14100c';g.fillRect(0,0,VW,VH);
  /* le sol */
  for(let b=0;b<H;b++)for(let a=0;a<L;a++){
    const c=PLAN[b][a];
    if(c==='#')continue;
    const x=Math.round(a*CASE-camX), y=Math.round(b*CASE-camY);
    if(x<-CASE||y<-CASE||x>VW||y>VH)continue;
    g.drawImage(c===','?TUILES.dalles[(a+b)&1]:TUILES.planches[(a*3+b)%3],x,y,CASE,CASE);
    /* l'ombre au pied des murs */
    if(mur(a,b-1)){
      const d2=g.createLinearGradient(0,y,0,y+7);
      d2.addColorStop(0,'rgba(0,0,0,.5)');d2.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=d2;g.fillRect(x,y,CASE,7);
    }
    if(mur(a-1,b)){
      const d3=g.createLinearGradient(x,0,x+5,0);
      d3.addColorStop(0,'rgba(0,0,0,.34)');d3.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=d3;g.fillRect(x,y,5,CASE);
    }
  }
  /* les murs */
  for(let b=0;b<H;b++)for(let a=0;a<L;a++){
    if(PLAN[b][a]!=='#')continue;
    const x=Math.round(a*CASE-camX), y=Math.round(b*CASE-camY);
    if(x<-CASE||y<-30||x>VW||y>VH)continue;
    g.drawImage(TUILES.murs[(a*7+b*13)%3],x,y,CASE,CASE);
    if(!mur(a,b+1))g.drawImage(TUILES.face,x,y+CASE-2,CASE,14);
  }
  /* le seuil, en bas */
  const sx=8*CASE-camX, sy=(H-1)*CASE-camY;
  R(g,sx,sy,2*CASE,CASE,'#4f3520');
  R(g,sx,sy,2*CASE,2,'#6b4a28');
  const jour=g.createLinearGradient(0,sy+CASE,0,sy-30);
  jour.addColorStop(0,'rgba(220,238,250,.34)');
  jour.addColorStop(1,'rgba(220,238,250,0)');
  g.fillStyle=jour;g.fillRect(sx-8,sy-30,2*CASE+16,CASE+30);
  /* tout ce qui est posé, trié du nord au sud */
  const liste=[];
  DECORS.forEach(o=>{
    const x=o.a*CASE+CASE/2-camX, y=o.b*CASE+CASE/2-camY+6;
    if(x<-40||y<-60||x>VW+40||y>VH+40)return;
    const f={four,enclume,etabli,coffre,baquet,charbon:charbonTas,tonneau,buches,soufflet,
      ratelier,lanterne,fenetre,sacs,seau,etau}[o.t];
    if(f)liste.push({y:o.b*CASE,f:()=>f(g,x,y)});
  });
  liste.push({y:joueur.y,f:()=>sprite(g,Math.round(joueur.x-camX),Math.round(joueur.y-camY),
    monAp(),joueur.dir,joueur.pas,joueur.marche)});
  liste.sort((p,q)=>p.y-q.y);
  liste.forEach(o=>o.f());
  /* l'ambiance : chaud près du four, plus sombre dans les coins */
  const v=g.createRadialGradient(VW/2,VH*0.5,VH*0.42,VW/2,VH*0.5,VH*0.95);
  v.addColorStop(0,'rgba(0,0,0,0)');
  v.addColorStop(1,'rgba(20,12,6,.5)');
  g.fillStyle=v;g.fillRect(0,0,VW,VH);
}
taille();
chargerSac().then(()=>{if(e.epee===undefined)e.epee=0;});
setTimeout(()=>{$('aide').style.opacity='0';},9000);
requestAnimationFrame(boucle);
</script>
