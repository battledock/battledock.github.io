<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Marché & Chat — Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bangers&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
body{font-family:'Inter',sans-serif;background:#f5f0e8;min-height:100vh;padding-bottom:calc(env(safe-area-inset-bottom,20px)+70px)}
.hdr{padding:calc(env(safe-area-inset-top,44px)+10px) 14px 14px;background:linear-gradient(135deg,#7c3aed,#6d28d9);border-bottom:3px solid #1a1a1a;text-align:center}
.tabs{display:flex;margin:8px 12px;border:2px solid #1a1a1a;border-radius:10px;overflow:hidden;box-shadow:2px 2px 0 #1a1a1a}
.tab{flex:1;text-align:center;padding:9px;font-family:'Bangers',cursive;font-size:13px;letter-spacing:1px;cursor:pointer}
.tab.on{background:#1a1a1a;color:#fff}.tab.off{background:#fff;color:#1a1a1a}
.card{background:#fff;border:3px solid #1a1a1a;border-radius:12px;margin:8px 12px;box-shadow:3px 3px 0 #1a1a1a;overflow:hidden}
.card:active{transform:scale(.98);box-shadow:1px 1px 0 #1a1a1a}
.btn{border:2px solid #1a1a1a;border-radius:8px;padding:8px 14px;font-family:'Bangers',cursive;font-size:12px;letter-spacing:1px;cursor:pointer;box-shadow:2px 2px 0 #1a1a1a;text-align:center;color:#fff}
.btn:active{box-shadow:0 0 0;transform:translate(2px,2px)}
.msg{padding:10px 14px;border-bottom:1px solid #f3f4f6;display:flex;gap:10px;align-items:flex-start}
.msg:last-child{border:none}
.msg-avatar{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.msg-name{font-size:11px;font-weight:800;color:#1a1a1a}
.msg-time{font-size:8px;color:#9ca3af}
.msg-text{font-size:11px;color:#374151;margin-top:2px;line-height:1.4}
.msg-me .msg-text{color:#6d28d9}
.offer{padding:12px 14px;border-bottom:1px solid #f3f4f6}
.offer:last-child{border:none}
.offer-row{display:flex;align-items:center;gap:10px}
.tag{font-size:7px;font-weight:700;border-radius:5px;padding:2px 7px;letter-spacing:.3px;display:inline-block}
.tag.green{background:#dcfce7;color:#16a34a;border:1px solid #bbf7d0}
.tag.purple{background:#f5f3ff;color:#7c3aed;border:1px solid #ddd6fe}
.tag.amber{background:#fffbeb;color:#d97706;border:1px solid #fde68a}
.input-row{position:fixed;bottom:0;left:0;right:0;padding:8px 12px calc(env(safe-area-inset-bottom,20px)+8px);background:#fff;border-top:2px solid #1a1a1a;display:flex;gap:8px;z-index:20}
.input-row input{flex:1;border:2px solid #e5e7eb;border-radius:8px;padding:8px 12px;font-size:12px;font-family:Inter,sans-serif;outline:none;-webkit-user-select:text;user-select:text}
.input-row input:focus{border-color:#7c3aed}
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,20px)+60px);left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:12px;font-size:12px;font-weight:700;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:none;align-items:flex-end}
.sheet{background:#fff;border-top:3px solid #1a1a1a;border-radius:18px 18px 0 0;width:100%;padding:16px 16px calc(env(safe-area-inset-bottom,20px)+12px);max-height:75vh;overflow-y:auto}
</style>
</head>
<body>

<div class="hdr">
  <div style="font-size:28px;margin-bottom:2px">🤝</div>
  <div style="font-family:'Bangers',cursive;font-size:24px;color:#fff;letter-spacing:2px;text-shadow:2px 2px 0 rgba(0,0,0,.2)">MARCHÉ & MESSAGERIE</div>
  <div style="font-size:8px;color:rgba(255,255,255,.35);letter-spacing:2px;font-weight:700;margin-top:2px">COMMERCE ENTRE ENTREPRISES</div>
</div>

<div class="tabs">
  <div class="tab on" id="tabChat" onclick="switchTab('chat')">💬 CHAT</div>
  <div class="tab off" id="tabMarket" onclick="switchTab('market')">📦 MARCHÉ</div>
  <div class="tab off" id="tabMy" onclick="switchTab('my')">📋 MES OFFRES</div>
</div>

<div id="chatTab">
  <div class="card" id="chatMessages" style="max-height:50vh;overflow-y:auto">
    <div style="padding:20px;text-align:center;color:#9ca3af;font-size:11px">Chargement...</div>
  </div>
</div>

<div id="marketTab" style="display:none">
  <div style="padding:6px 14px 2px;font-size:7px;font-weight:800;color:#999;letter-spacing:2px">OFFRES DE RESSOURCES</div>
  <div class="card" id="marketList">
    <div style="padding:20px;text-align:center;color:#9ca3af;font-size:11px">Chargement...</div>
  </div>
  <div style="padding:8px 12px">
    <div class="btn" style="background:#7c3aed" onclick="openSellSheet()">+ VENDRE UNE RESSOURCE</div>
  </div>
</div>

<div id="myTab" style="display:none">
  <div style="padding:6px 14px 2px;font-size:7px;font-weight:800;color:#999;letter-spacing:2px">MES OFFRES EN COURS</div>
  <div class="card" id="myOffers">
    <div style="padding:20px;text-align:center;color:#9ca3af;font-size:11px">Chargement...</div>
  </div>
</div>

<!-- Input bar (chat) -->
<div class="input-row" id="chatInput">
  <input type="text" id="msgInput" placeholder="Message aux entreprises..." maxlength="200">
  <div class="btn" style="background:#7c3aed;padding:8px 16px" onclick="sendMsg()">ENVOYER</div>
</div>

<!-- Sell sheet -->
<div class="overlay" id="sellOv" onclick="if(event.target===this)this.style.display='none'">
  <div class="sheet">
    <div style="width:36px;height:4px;border-radius:2px;background:#e5e7eb;margin:0 auto 12px"></div>
    <div style="font-family:Bangers,cursive;font-size:18px;text-align:center;margin-bottom:10px">VENDRE UNE RESSOURCE</div>
    <div id="sellContent"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var SB_URL='https://drtsuhnbclhmgfjiykap.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
var sb=supabase.createClient(SB_URL,SB_KEY);
var CU=null,myName='',myEmoji='🏪',myColor='#cc1a1a',money=0,myZones={};
var RES_NAMES={containers:'📦 Containers',materiaux:'🪵 Matériaux',poisson:'🐟 Poisson',passagers:'🎫 Passagers',pieces:'🔧 Pièces',clients:'⭐ Clients VIP'};
var RES_ZONES={containers:'quai_nord',materiaux:'hangar_sud',poisson:'zone_frigo',passagers:'terminal',pieces:'docks',clients:'zone_com'};

function fm(n){return n>=1e6?(n/1e6).toFixed(1)+'M€':n>=1000?Math.floor(n/1000)+'k€':n+'€';}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2500);}
function ago(d){var s=Math.floor((Date.now()-new Date(d).getTime())/1000);if(s<60)return 'À l\'instant';if(s<3600)return Math.floor(s/60)+'min';if(s<86400)return Math.floor(s/3600)+'h';return Math.floor(s/86400)+'j';}

function switchTab(t){
  ['chat','market','my'].forEach(function(x){
    document.getElementById(x+'Tab').style.display=x===t?'block':'none';
    document.getElementById('tab'+(x==='chat'?'Chat':x==='market'?'Market':'My')).className='tab '+(x===t?'on':'off');
  });
  document.getElementById('chatInput').style.display=t==='chat'?'flex':'none';
}

// ═══ CHAT ═══
async function loadChat(){
  // Messages stored in game_stats.commerce.chat_msgs (array of last 50)
  // We'll aggregate from all players
  try{
    var {data:all}=await sb.from('game_stats').select('user_id,commerce').not('commerce','is',null);
    var {data:profiles}=await sb.from('profiles').select('user_id,username');
    var {data:companies}=await sb.from('companies').select('user_id,emoji,color,nom');
    var pMap={},cMap={};
    if(profiles)profiles.forEach(function(p){pMap[p.user_id]=p.username;});
    if(companies)companies.forEach(function(c){cMap[c.user_id]=c;});

    var msgs=[];
    if(all)all.forEach(function(row){
      var cm=(row.commerce&&row.commerce.chat_msgs)||[];
      cm.forEach(function(m){m.user_id=row.user_id;msgs.push(m);});
    });
    msgs.sort(function(a,b){return new Date(a.ts)-new Date(b.ts);});
    msgs=msgs.slice(-50);

    if(!msgs.length){
      document.getElementById('chatMessages').innerHTML='<div style="padding:30px;text-align:center;color:#9ca3af;font-size:11px">Aucun message. Sois le premier à écrire !</div>';
      return;
    }

    var h='';
    msgs.forEach(function(m){
      var co=cMap[m.user_id]||{};var isMe=m.user_id===CU.id;
      h+='<div class="msg'+(isMe?' msg-me':'')+'">';
      h+='<div class="msg-avatar" style="background:'+(co.color||'#999')+'">'+( co.emoji||'🏪')+'</div>';
      h+='<div style="flex:1"><div style="display:flex;align-items:baseline;gap:6px"><div class="msg-name">'+(co.nom||pMap[m.user_id]||'?')+'</div><div class="msg-time">'+ago(m.ts)+'</div></div>';
      h+='<div class="msg-text">'+m.text.replace(/</g,'&lt;')+'</div></div></div>';
    });
    document.getElementById('chatMessages').innerHTML=h;
    document.getElementById('chatMessages').scrollTop=99999;
  }catch(e){document.getElementById('chatMessages').innerHTML='<div style="padding:20px;text-align:center;color:#ef4444;font-size:11px">Erreur</div>';}
}

async function sendMsg(){
  var input=document.getElementById('msgInput');
  var text=input.value.trim();
  if(!text)return;if(text.length>200)return toast('Message trop long');
  input.value='';

  var {data:gs}=await sb.from('game_stats').select('commerce').eq('user_id',CU.id).maybeSingle();
  var com=(gs&&gs.commerce)||{};
  var msgs=com.chat_msgs||[];
  msgs.push({text:text,ts:new Date().toISOString()});
  if(msgs.length>20)msgs=msgs.slice(-20); // keep last 20 per user
  com.chat_msgs=msgs;
  await sb.from('game_stats').update({commerce:com}).eq('user_id',CU.id);
  loadChat();
}

// ═══ MARKET ═══
async function loadMarket(){
  try{
    var {data:all}=await sb.from('game_stats').select('user_id,commerce').not('commerce','is',null);
    var {data:companies}=await sb.from('companies').select('user_id,emoji,color,nom');
    var cMap={};if(companies)companies.forEach(function(c){cMap[c.user_id]=c;});

    var offers=[];
    if(all)all.forEach(function(row){
      var mk=(row.commerce&&row.commerce.market)||[];
      mk.forEach(function(o){o.seller_id=row.user_id;offers.push(o);});
    });
    offers=offers.filter(function(o){return!o.sold;});
    offers.sort(function(a,b){return new Date(b.ts)-new Date(a.ts);});

    if(!offers.length){
      document.getElementById('marketList').innerHTML='<div style="padding:30px;text-align:center;color:#9ca3af;font-size:11px">Aucune offre. Mets une ressource en vente !</div>';
      return;
    }

    var h='';
    offers.forEach(function(o){
      var co=cMap[o.seller_id]||{};var isMe=o.seller_id===CU.id;
      h+='<div class="offer"><div class="offer-row">';
      h+='<div style="width:32px;height:32px;border-radius:8px;background:'+(co.color||'#999')+';display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0">'+(co.emoji||'🏪')+'</div>';
      h+='<div style="flex:1"><div style="font-size:11px;font-weight:800;color:#1a1a1a">'+(RES_NAMES[o.resource]||o.resource)+' x'+o.qty+'</div>';
      h+='<div style="font-size:8px;color:#9ca3af">'+(co.nom||'?')+' · '+ago(o.ts)+'</div></div>';
      h+='<div style="text-align:right"><div style="font-family:Bebas Neue;font-size:14px;color:#d97706">'+fm(o.price)+'</div>';
      if(!isMe)h+='<div class="btn" style="background:#16a34a;font-size:9px;padding:4px 10px;margin-top:4px;box-shadow:1px 1px 0 #1a1a1a" onclick="buyOffer(\''+o.seller_id+'\',\''+o.id+'\')">ACHETER</div>';
      h+='</div></div></div>';
    });
    document.getElementById('marketList').innerHTML=h;

    // My offers
    var mine=offers.filter(function(o){return o.seller_id===CU.id;});
    if(mine.length){
      var mh='';
      mine.forEach(function(o){
        mh+='<div class="offer"><div class="offer-row"><div style="flex:1"><div style="font-size:11px;font-weight:800">'+(RES_NAMES[o.resource]||o.resource)+' x'+o.qty+'</div><div style="font-size:8px;color:#9ca3af">Prix: '+fm(o.price)+'</div></div>';
        mh+='<div class="btn" style="background:#ef4444;font-size:9px;padding:4px 10px;box-shadow:1px 1px 0 #1a1a1a" onclick="cancelOffer(\''+o.id+'\')">ANNULER</div></div></div>';
      });
      document.getElementById('myOffers').innerHTML=mh;
    }else{
      document.getElementById('myOffers').innerHTML='<div style="padding:20px;text-align:center;color:#9ca3af;font-size:11px">Aucune offre en cours</div>';
    }
  }catch(e){document.getElementById('marketList').innerHTML='<div style="padding:20px;text-align:center;color:#ef4444;font-size:11px">Erreur</div>';}
}

function openSellSheet(){
  var h='';
  Object.keys(RES_NAMES).forEach(function(rn){
    var zid=RES_ZONES[rn];
    var d=myZones[zid];
    var qty=d?d.resources||0:0;
    if(qty<=0)return;
    h+='<div style="display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid #f3f4f6">';
    h+='<div style="font-size:20px;flex-shrink:0">'+(RES_NAMES[rn].split(' ')[0])+'</div>';
    h+='<div style="flex:1"><div style="font-size:11px;font-weight:800">'+RES_NAMES[rn]+'</div><div style="font-size:8px;color:#9ca3af">Dispo: '+qty+'</div></div>';
    h+='<div class="btn" style="background:#7c3aed;font-size:10px;padding:6px 12px" onclick="createOffer(\''+rn+'\','+qty+')">VENDRE</div>';
    h+='</div>';
  });
  if(!h)h='<div style="padding:20px;text-align:center;color:#9ca3af;font-size:11px">Aucune ressource à vendre. Achète des zones et paie les taxes pour générer des ressources !</div>';
  document.getElementById('sellContent').innerHTML=h;
  document.getElementById('sellOv').style.display='flex';
}

async function createOffer(resource,maxQty){
  var qty=parseInt(prompt('Quantité à vendre ? (max: '+maxQty+')'));
  if(!qty||qty<=0||qty>maxQty)return toast('Quantité invalide');
  var price=parseInt(prompt('Prix total demandé ? (en €)'));
  if(!price||price<=0)return toast('Prix invalide');

  // Remove resources
  var zid=RES_ZONES[resource];
  myZones[zid].resources-=qty;

  // Add offer
  var {data:gs}=await sb.from('game_stats').select('commerce').eq('user_id',CU.id).maybeSingle();
  var com=(gs&&gs.commerce)||{};
  com.zones=myZones;
  var mk=com.market||[];
  mk.push({id:Date.now().toString(36),resource:resource,qty:qty,price:price,ts:new Date().toISOString(),sold:false});
  com.market=mk;
  await sb.from('game_stats').update({commerce:com}).eq('user_id',CU.id);

  document.getElementById('sellOv').style.display='none';
  toast('📦 Offre créée !');
  loadMarket();
}

async function buyOffer(sellerId,offerId){
  // Find the offer
  var {data:sellerGs}=await sb.from('game_stats').select('money,commerce').eq('user_id',sellerId).maybeSingle();
  if(!sellerGs)return toast('Vendeur introuvable');
  var sellerCom=sellerGs.commerce||{};
  var mk=sellerCom.market||[];
  var offer=mk.find(function(o){return o.id===offerId&&!o.sold;});
  if(!offer)return toast('Offre plus disponible');
  if(money<offer.price)return toast('Pas assez d\'argent !');

  // Transfer money
  money-=offer.price;
  var sellerMoney=(sellerGs.money||0)+offer.price;

  // Give resources to buyer
  var {data:myGs}=await sb.from('game_stats').select('commerce').eq('user_id',CU.id).maybeSingle();
  var myCom=(myGs&&myGs.commerce)||{};
  var mz=myCom.zones||{};
  var zid=RES_ZONES[offer.resource];
  if(!mz[zid])mz[zid]={level:0,resources:0};
  mz[zid].resources=(mz[zid].resources||0)+offer.qty;
  myCom.zones=mz;
  myZones=mz;

  // Mark offer as sold
  offer.sold=true;
  sellerCom.market=mk;

  // Save both
  await sb.from('game_stats').update({money:money,commerce:myCom}).eq('user_id',CU.id);
  await sb.from('game_stats').update({money:sellerMoney,commerce:sellerCom}).eq('user_id',sellerId);

  toast('✅ Acheté ! +'+offer.qty+' '+(RES_NAMES[offer.resource]||offer.resource));
  loadMarket();
}

async function cancelOffer(offerId){
  var {data:gs}=await sb.from('game_stats').select('commerce').eq('user_id',CU.id).maybeSingle();
  var com=(gs&&gs.commerce)||{};
  var mk=com.market||[];
  var offer=mk.find(function(o){return o.id===offerId;});
  if(!offer)return;
  // Return resources
  var zid=RES_ZONES[offer.resource];
  if(myZones[zid])myZones[zid].resources=(myZones[zid].resources||0)+offer.qty;
  com.zones=myZones;
  mk=mk.filter(function(o){return o.id!==offerId;});
  com.market=mk;
  await sb.from('game_stats').update({commerce:com}).eq('user_id',CU.id);
  toast('Offre annulée');
  loadMarket();
}

(async function(){
  var r=await sb.auth.getSession();var s=r.data&&r.data.session;
  if(!s){location.href='index.html';return;}CU=s.user;
  var {data:gs}=await sb.from('game_stats').select('money,commerce').eq('user_id',CU.id).maybeSingle();
  if(gs){money=gs.money||0;myZones=(gs.commerce&&gs.commerce.zones)||{};}
  var {data:co}=await sb.from('companies').select('emoji,color,nom').eq('user_id',CU.id).maybeSingle();
  if(co){myEmoji=co.emoji;myColor=co.color;myName=co.nom;}
  loadChat();loadMarket();
})();
</script>
</body>
</html>
