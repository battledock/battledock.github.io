<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Higher/Lower - Battle Dock Casino</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      -moz-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(180deg, #450a0a, #7f1d1d, #991b1b);
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 6px;
      padding-bottom: 120px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .game-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 10px;
      overflow: hidden;
      min-height: 0;
    }

    .cards-display {
      display: flex;
      gap: 12px;
      flex-shrink: 0;
    }

    .card-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .card-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 12px;
      color: #fbbf24;
      letter-spacing: 1px;
    }

    .card {
      width: clamp(100px, 28vw, 140px);
      height: clamp(140px, 38vw, 200px);
      background: white;
      border: 4px solid #fbbf24;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(56px, 16vw, 80px);
      color: #0f172a;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .card-back {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #0f172a;
      font-size: clamp(40px, 12vw, 56px);
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      max-width: 340px;
      flex-shrink: 0;
    }

    .bet-control {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 10px;
      border-radius: 8px;
      border: 2px solid rgba(251, 191, 36, 0.3);
    }

    .bet-control label {
      font-weight: 700;
      font-size: 11px;
      color: #fbbf24;
      white-space: nowrap;
    }

    .bet-control input {
      flex: 1;
      padding: 6px;
      border: 2px solid #fbbf24;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      max-width: 100px;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    .btn {
      padding: 10px;
      border: none;
      border-radius: 10px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      letter-spacing: 1.5px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-start {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #0f172a;
      grid-column: span 2;
    }

    .btn-higher {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
    }

    .btn-lower {
      background: linear-gradient(135deg, #dc2626, #991b1b);
      color: white;
    }

    .result {
      display: none;
      padding: 8px 14px;
      border-radius: 10px;
      text-align: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 14px;
      letter-spacing: 1px;
      margin-top: 6px;
    }

    .result.win {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
    }

    .result.lose {
      background: linear-gradient(135deg, #dc2626, #991b1b);
      color: white;
    }

    .bottom-bar {
      background: linear-gradient(135deg, #7f1d1d, #991b1b);
      border: 2px solid rgba(251, 191, 36, 0.5);
      border-radius: 10px;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      min-height: 44px;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 480px;
      width: calc(100% - 20px);
      z-index: 100;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.5);
    }

    .back-btn {
      background: rgba(251, 191, 36, 0.2);
      border: 2px solid rgba(251, 191, 36, 0.5);
      color: #fbbf24;
      border-radius: 6px;
      padding: 4px 10px;
      font-weight: 700;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .back-btn:active {
      transform: scale(0.95);
    }

    .game-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      color: #fbbf24;
      letter-spacing: 1.5px;
      white-space: nowrap;
    }

    .balance {
      background: white;
      color: #0f172a;
      padding: 4px 10px;
      border-radius: 6px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    @media (max-width: 400px) {
      .bottom-bar {
        padding: 5px 8px;
        bottom: 15px;
      }

      .back-btn {
        padding: 3px 8px;
        font-size: 10px;
      }

      .game-title {
        font-size: 14px;
      }

      .balance {
        padding: 3px 8px;
        font-size: 12px;
      }

      .cards-display {
        gap: 8px;
      }
    }

    @media (max-width: 320px) {
      .bottom-bar {
        bottom: 10px;
      }

      .back-btn {
        padding: 2px 6px;
        font-size: 9px;
      }

      .game-title {
        font-size: 12px;
        letter-spacing: 1px;
      }

      .balance {
        font-size: 11px;
        padding: 2px 6px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="game-area">
      <div class="cards-display">
        <div class="card-container">
          <div class="card-label">ACTUELLE</div>
          <div class="card" id="currentCard">?</div>
        </div>
        <div class="card-container">
          <div class="card-label">PROCHAINE</div>
          <div class="card card-back" id="nextCard">🎴</div>
        </div>
      </div>

      <div class="controls">
        <div class="bet-control">
          <label>MISE:</label>
          <input type="number" id="betAmount" value="50" min="10" step="10">
        </div>
        <div class="actions" id="actions">
          <button class="btn btn-start" onclick="startGame()">COMMENCER 🎴</button>
        </div>
        <div class="result" id="result"></div>
      </div>
    </div>

    <div class="bottom-bar">
      <button class="back-btn" onclick="window.location.href='casino.html'">← Casino</button>
      <div class="game-title">🎯 HIGHER/LOWER</div>
      <div class="balance" id="balance">0€</div>
    </div>
  </div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const sb = createClient(supabaseUrl, supabaseKey);

    let currentUser = null;
    let currentMoney = 0;
    let currentCardValue = 0;
    let nextCardValue = 0;
    let currentBet = 0;

    // ========== JACKPOT PROGRESSIF ==========
    async function incrementJackpot(bet, gameMultiplier = 0.01) {
      const contribution = Math.floor(bet * gameMultiplier);
      try {
        const { data, error } = await sb.rpc('increment_jackpot', {
          increment_amount: contribution
        });
        if (!error) {
          console.log('Jackpot +' + contribution + '€ → Total: ' + data + '€');
        }
      } catch (e) {
        console.log('Erreur jackpot:', e);
      }
    }

    async function checkJackpotWin(probability = 0.00001) {
      if (Math.random() > probability) return false;
      try {
        const { data: { user } } = await sb.auth.getUser();
        const userName = user.email.split('@')[0];
        const { data: jackpotAmount, error } = await sb.rpc('claim_jackpot', {
          user_id: user.id,
          user_name: userName
        });
        if (!error && jackpotAmount) {
          alert(`🎯 JACKPOT PROGRESSIF GAGNÉ ! 🎯\n\n${jackpotAmount.toLocaleString('fr-FR')}€`);
          await loadMoney();
          return true;
        }
      } catch (e) {
        console.log('Erreur claim jackpot:', e);
      }
      return false;
    }
    // ========== FIN JACKPOT ==========

    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        window.location.href = 'index.html';
        return;
      }
      currentUser = session.user;
      await loadMoney();
    }

    async function loadMoney() {
      const { data: stats } = await sb
        .from('game_stats')
        .select('money')
        .eq('user_id', currentUser.id)
        .single();

      currentMoney = stats?.money || 0;
      document.getElementById('balance').textContent = currentMoney.toLocaleString('fr-FR') + '€';
    }

    async function updateMoney(newAmount) {
      await sb
        .from('game_stats')
        .update({ money: newAmount })
        .eq('user_id', currentUser.id);
      
      currentMoney = newAmount;
      document.getElementById('balance').textContent = newAmount.toLocaleString('fr-FR') + '€';
    }

    async function startGame() {
      const betInput = document.getElementById('betAmount');
      const bet = parseInt(betInput.value);

      if (bet < 10) {
        alert('Mise minimum : 10€');
        return;
      }

      if (bet > currentMoney) {
        alert('Solde insuffisant !');
        return;
      }

      currentBet = bet;

      await updateMoney(currentMoney - bet);

      currentCardValue = Math.floor(Math.random() * 13) + 1;
      nextCardValue = Math.floor(Math.random() * 13) + 1;

      document.getElementById('currentCard').textContent = currentCardValue;
      document.getElementById('nextCard').textContent = '🎴';
      document.getElementById('nextCard').className = 'card card-back';
      document.getElementById('result').style.display = 'none';

      document.getElementById('actions').innerHTML = `
        <button class="btn btn-higher" onclick="guess('higher')">PLUS HAUT ⬆️</button>
        <button class="btn btn-lower" onclick="guess('lower')">PLUS BAS ⬇️</button>
      `;
    }

    async function guess(choice) {
      document.getElementById('nextCard').textContent = nextCardValue;
      document.getElementById('nextCard').className = 'card';

      const res = document.getElementById('result');
      let won = false;

      if (choice === 'higher' && nextCardValue > currentCardValue) won = true;
      if (choice === 'lower' && nextCardValue < currentCardValue) won = true;

      if (nextCardValue === currentCardValue) {
        res.className = 'result win';
        res.innerHTML = `🤝 ÉGALITÉ ! Mise remboursée`;
        await updateMoney(currentMoney + currentBet);
        await incrementJackpot(currentBet, 0.01);
      } else if (won) {
        const win = currentBet * 2;
        res.className = 'result win';
        res.innerHTML = `🎉 GAGNÉ ! +${win.toLocaleString('fr-FR')}€`;
        await updateMoney(currentMoney + win);
        await incrementJackpot(currentBet, 0.01);
        await checkJackpotWin(0.00001);
      } else {
        res.className = 'result lose';
        res.innerHTML = `💔 PERDU ! -${currentBet.toLocaleString('fr-FR')}€`;
        await incrementJackpot(currentBet, 0.01);
      }

      res.style.display = 'block';

      document.getElementById('actions').innerHTML = `
        <button class="btn btn-start" onclick="startGame()">REJOUER 🎴</button>
      `;
    }

    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('gesturechange', e => e.preventDefault());

    init();
  </script>
</body>
</html>
