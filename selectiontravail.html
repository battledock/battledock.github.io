<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Sélection — Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
html, body{height:100%; overflow:hidden;}
body{
  font-family:'Inter', sans-serif;
  background:#0a0e1a;
}

#app{
  position:fixed; inset:0;
  display:flex; flex-direction:column;
  max-width:600px; margin:0 auto;
  background:#1a1f2e;
}

/* TOPBAR MINIMALISTE */
.topbar{
  background:linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
  padding:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 4px 12px rgba(0,0,0,.3);
  position:relative;
  overflow:hidden;
}
.topbar::before{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(90deg, transparent 0%, rgba(255,255,255,.05) 50%, transparent 100%);
  animation:shine 3s ease-in-out infinite;
}
@keyframes shine{
  0%, 100%{ transform:translateX(-100%); }
  50%{ transform:translateX(100%); }
}
.topbar-money{
  font-family:'Bebas Neue', sans-serif;
  font-size:28px;
  letter-spacing:2px;
  color:#fbbf24;
  text-shadow:0 0 12px rgba(251,191,36,.6), 2px 2px 4px rgba(0,0,0,.5);
  position:relative;
  z-index:1;
  background:rgba(0,0,0,.3);
  padding:8px 20px;
  border-radius:12px;
  border:2px solid rgba(251,191,36,.4);
}

/* ZONES CONTAINER */
.zones-container{
  flex:1;
  overflow-y:auto;
  padding:20px 16px 100px;
  background:
    radial-gradient(ellipse at top, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
    radial-gradient(ellipse at bottom, rgba(16, 185, 129, 0.1) 0%, transparent 50%),
    linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
  position:relative;
}

/* NOUVEAU DESIGN CARDS STYLE JEU */
.zone-card{
  background:linear-gradient(135deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.9) 100%);
  backdrop-filter:blur(10px);
  border-radius:20px;
  padding:0;
  margin-bottom:16px;
  border:2px solid rgba(59, 130, 246, 0.3);
  cursor:pointer;
  transition:all .3s cubic-bezier(0.4, 0, 0.2, 1);
  position:relative;
  z-index:1;
  overflow:hidden;
  box-shadow:0 8px 24px rgba(0,0,0,.3);
}
.zone-card::before{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, transparent 50%);
  opacity:0;
  transition:opacity .3s;
}
.zone-card:active{
  transform:scale(.97);
}
.zone-card:active::before{
  opacity:1;
}
.zone-card.unlocked{
  border-color:rgba(16, 185, 129, 0.6);
  box-shadow:0 8px 24px rgba(16, 185, 129, 0.2), 0 0 40px rgba(16, 185, 129, 0.1);
}
.zone-card.unlocked::after{
  content:'';
  position:absolute;
  top:0; left:0; right:0;
  height:3px;
  background:linear-gradient(90deg, transparent, #10b981, transparent);
  animation:glow 2s ease-in-out infinite;
}
@keyframes glow{
  0%, 100%{ opacity:0.3; }
  50%{ opacity:1; }
}
.zone-card.locked{
  opacity:.5;
  cursor:not-allowed;
  border-color:rgba(107, 114, 128, 0.3);
}
.zone-card.locked::after{
  content:'🔒';
  position:absolute;
  top:20px; right:20px;
  font-size:32px;
  filter:drop-shadow(0 2px 8px rgba(0,0,0,.5));
}

.zone-content{
  padding:24px;
}

.zone-header{
  display:flex;
  align-items:center;
  gap:16px;
  margin-bottom:16px;
}
.zone-icon{
  width:64px;
  height:64px;
  background:linear-gradient(135deg, #3b82f6, #2563eb);
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:36px;
  flex-shrink:0;
  box-shadow:0 4px 16px rgba(59, 130, 246, 0.4);
  position:relative;
}
.zone-icon::before{
  content:'';
  position:absolute;
  inset:-2px;
  background:linear-gradient(135deg, rgba(59, 130, 246, 0.4), transparent);
  border-radius:18px;
  z-index:-1;
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{
  0%, 100%{ transform:scale(1); opacity:0.5; }
  50%{ transform:scale(1.1); opacity:1; }
}
.zone-card.locked .zone-icon{
  background:linear-gradient(135deg, #6b7280, #4b5563);
  box-shadow:0 4px 16px rgba(0, 0, 0, 0.3);
}
.zone-card.unlocked .zone-icon{
  background:linear-gradient(135deg, #10b981, #059669);
  box-shadow:0 4px 16px rgba(16, 185, 129, 0.5);
}

.zone-info{
  flex:1;
}
.zone-name{
  font-family:'Bebas Neue', sans-serif;
  font-size:22px;
  letter-spacing:1.5px;
  color:white;
  margin-bottom:4px;
  text-shadow:2px 2px 4px rgba(0,0,0,.5);
  display:flex;
  align-items:center;
  gap:8px;
}
.zone-rank{
  font-size:11px;
  color:rgba(255,255,255,.6);
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:1px;
}
.zone-description{
  font-size:13px;
  color:rgba(255,255,255,.7);
  line-height:1.6;
  margin-bottom:12px;
}
.zone-unlock{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:8px 16px;
  border-radius:10px;
  font-size:12px;
  font-weight:700;
  letter-spacing:0.5px;
}
.zone-card.locked .zone-unlock{
  background:rgba(251, 191, 36, 0.2);
  color:#fbbf24;
  border:1px solid rgba(251, 191, 36, 0.3);
}
.zone-card.unlocked .zone-unlock{
  background:rgba(16, 185, 129, 0.2);
  color:#10b981;
  border:1px solid rgba(16, 185, 129, 0.3);
}

.coming-soon{
  display:inline-flex;
  align-items:center;
  padding:4px 10px;
  background:rgba(239, 68, 68, 0.2);
  color:#ef4444;
  border-radius:8px;
  font-size:10px;
  font-weight:700;
  border:1px solid rgba(239, 68, 68, 0.3);
  margin-left:8px;
}

/* BOUTON RETOUR EN BAS */
.back-bottom{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:linear-gradient(135deg, #3b82f6, #2563eb);
  color:white;
  border:none;
  padding:14px 32px;
  border-radius:14px;
  font-family:'Bebas Neue', sans-serif;
  font-size:18px;
  letter-spacing:2px;
  cursor:pointer;
  box-shadow:0 8px 24px rgba(59, 130, 246, 0.4);
  transition:all .2s;
  z-index:100;
  display:flex;
  align-items:center;
  gap:8px;
}
.back-bottom:active{
  transform:translateX(-50%) scale(0.95);
  box-shadow:0 4px 12px rgba(59, 130, 246, 0.4);
}
</style>
</head>
<body>
  <div id="app">
    <!-- TOPBAR MINIMALISTE -->
    <div class="topbar">
      <div class="topbar-money">💰 <span id="moneyDisplay">100</span>€</div>
    </div>

    <!-- ZONES SELECTOR -->
    <div class="zones-container" id="zonesContainer">
      <!-- Généré dynamiquement -->
    </div>

    <!-- BOUTON RETOUR EN BAS -->
    <button class="back-bottom" onclick="window.location.href='game.html'">
      ← Retour à l'Accueil
    </button>
  </div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const supabaseClient = createClient(supabaseUrl, supabaseKey);

    const userId = localStorage.getItem('userId');
    if (!userId) {
      window.location.href = 'index.html';
    }

    const zones = [
      { 
        id: 'clicker',
        name: 'Déchargement de Conteneurs',
        icon: '📦',
        rank: 'Docker Occasionnel',
        minLevel: 1,
        description: 'Clique sur les conteneurs pour les décharger. Plus tu cliques vite, plus tu gagnes.',
        page: 'clicker.html',
        available: true
      },
      {
        id: 'docker',
        name: 'Gestion de Cargaisons',
        icon: '🚢',
        rank: 'Docker',
        minLevel: 15,
        description: 'Organise les cargaisons entrantes pour optimiser les profits.',
        page: null,
        available: false
      },
      {
        id: 'mensuel',
        name: 'Coordination Logistique',
        icon: '📋',
        rank: 'Docker Mensuel',
        minLevel: 30,
        description: 'Coordonne les équipes et planifie les opérations portuaires.',
        page: null,
        available: false
      },
      {
        id: 'contrema',
        name: 'Supervision d\'Équipe',
        icon: '👷',
        rank: 'Contre-Maître',
        minLevel: 50,
        description: 'Supervise les dockers et assure la productivité du quai.',
        page: null,
        available: false
      },
      {
        id: 'chef',
        name: 'Direction de Quai',
        icon: '🎯',
        rank: 'Chef de Quai',
        minLevel: 80,
        description: 'Dirige l\'ensemble des opérations et gère les contrats majeurs.',
        page: null,
        available: false
      },
      {
        id: 'directeur',
        name: 'Bureau du Directeur',
        icon: '👔',
        rank: 'Directeur de Compagnie',
        minLevel: 100,
        description: 'Pilote l\'empire maritime depuis ton bureau. Revenus passifs maximaux.',
        page: null,
        available: false
      }
    ];

    let money = 100;
    let level = 1;
    let rank = 'Docker Occasionnel';

    loadPlayerData();

    async function loadPlayerData() {
      const { data: progressArray } = await supabaseClient
        .from('game_progress')
        .select('*')
        .eq('user_id', userId);

      if (progressArray && progressArray[0]) {
        const progress = progressArray[0];
        money = progress.money || 100;
        level = progress.level || 1;
        rank = getRank(level);
        
        updateDisplay();
        renderZones();
      }
    }

    function getRank(level) {
      if (level < 15) return 'Docker Occasionnel';
      if (level < 30) return 'Docker';
      if (level < 50) return 'Docker Mensuel';
      if (level < 80) return 'Contre-Maître';
      if (level < 100) return 'Chef de Quai';
      return 'Directeur de Compagnie';
    }

    function updateDisplay() {
      document.getElementById('moneyDisplay').textContent = money.toLocaleString('fr-FR');
    }

    function renderZones() {
      const container = document.getElementById('zonesContainer');
      container.innerHTML = '';

      zones.forEach(zone => {
        const unlocked = level >= zone.minLevel;
        
        const card = document.createElement('div');
        card.className = `zone-card ${unlocked ? 'unlocked' : 'locked'}`;
        
        const comingSoon = !zone.available ? '<span class="coming-soon">Bientôt</span>' : '';
        
        card.innerHTML = `
          <div class="zone-content">
            <div class="zone-header">
              <div class="zone-icon">${zone.icon}</div>
              <div class="zone-info">
                <div class="zone-name">
                  ${zone.name}
                  ${comingSoon}
                </div>
                <div class="zone-rank">${zone.rank}</div>
              </div>
            </div>
            <div class="zone-description">${zone.description}</div>
            <div class="zone-unlock">
              ${unlocked ? '✓ Débloqué' : '🔒 Niveau ' + zone.minLevel + ' requis'}
            </div>
          </div>
        `;

        if (unlocked && zone.available && zone.page) {
          card.addEventListener('click', () => {
            window.location.href = zone.page;
          });
        }

        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
