<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Classement - Battle Dock</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * { margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none; }

    body {
      font-family:'Inter',sans-serif;
      background:#0f172a;
      min-height:100dvh;
      display:flex;flex-direction:column;
    }

    /* ── HERO NAVY ── */
    .hero {
      background:#0f172a;
      padding:calc(18px + env(safe-area-inset-top)) 14px 0;
      flex-shrink:0;
    }

    .stats3 {
      display:grid;
      grid-template-columns:1fr 1px 1fr 1px 1fr;
      border-top:1px solid rgba(255,255,255,0.08);
      margin-top:4px;
    }
    .sv { background:rgba(255,255,255,0.1); }
    .st { text-align:center;padding:14px 6px; }
    .st-v { font-family:'Bebas Neue',sans-serif;font-size:36px;color:white;line-height:1; }
    .st-v.gold { color:#fbbf24; }
    .st-sub { font-size:10px;font-weight:700;color:rgba(255,255,255,0.4);margin-top:2px; }
    .st-lbl { font-size:7px;color:rgba(255,255,255,0.18);font-weight:700;letter-spacing:1px;margin-top:1px; }

    /* ── BODY JAUNE BD ── */
    .sheet {
      background:#fbbf24;
      flex:1;
      padding:12px 12px calc(24px + env(safe-area-inset-bottom));
      overflow-y:auto;
    }

    /* ── SAISON BANNER ── */
    .season-banner {
      background:#0f172a;
      border-radius:12px;
      padding:11px 13px;
      margin-bottom:10px;
      border:2px solid rgba(251,191,36,0.25);
    }
    .sb-head { margin-bottom:10px; }
    .sb-title-row { display:flex;align-items:center;justify-content:space-between;margin-bottom:3px; }
    .sb-title { font-family:'Bebas Neue',sans-serif;font-size:15px;color:#fbbf24;letter-spacing:2px; }
    .sb-timer-wrap { text-align:right; }
    .sb-timer { font-family:'Bebas Neue',sans-serif;font-size:22px;color:white;line-height:1; }
    .sb-timer-lbl { font-size:7px;color:rgba(255,255,255,0.2);letter-spacing:1px;margin-top:1px; }
    .sb-sub { font-size:8px;color:rgba(255,255,255,0.3);letter-spacing:1px; }
    .sb-rewards { display:grid;grid-template-columns:repeat(3,1fr);gap:6px; }
    .sb-rew { background:rgba(255,255,255,0.06);border-radius:8px;padding:8px 4px;text-align:center;border:1px solid rgba(255,255,255,0.08); }
    .sb-medal { font-size:16px;margin-bottom:3px; }
    .sb-rank { font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:1px;margin-bottom:2px; }
    .sb-rew.r1 .sb-rank { color:#fbbf24; }
    .sb-rew.r2 .sb-rank { color:#9e9e9e; }
    .sb-rew.r3 .sb-rank { color:#cd7f32; }
    .sb-items { font-size:8px;color:rgba(255,255,255,0.35);line-height:1.5; }
    /* URGENCE < 24H */
    .season-banner.urgent {
      background:linear-gradient(135deg,#cc1a1a,#7f0000);
      border-color:rgba(255,100,100,0.3);
      position:relative;overflow:hidden;
    }
    .season-banner.urgent::before {
      content:'';position:absolute;inset:0;
      background:repeating-linear-gradient(45deg,transparent,transparent 10px,rgba(255,255,255,0.03) 10px,rgba(255,255,255,0.03) 20px);
      pointer-events:none;
    }
    .season-banner.urgent .sb-title { color:white; }
    .season-banner.urgent .sb-timer { color:white; }
    .season-banner.urgent .sb-sub { color:rgba(255,255,255,0.6); }
    .season-banner.urgent .sb-rew { background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.15); }
    .season-banner.urgent .sb-items { color:rgba(255,255,255,0.6); }
    .season-banner.urgent .sb-head::before { content:'🚨 FIN DE SAISON IMMINENTE — ';font-size:9px;font-weight:800;color:white;letter-spacing:1px; }

    /* ── TABS ── */
    .tabs { display:flex;gap:5px;margin-bottom:10px; }
    .tab {
      flex:1;padding:8px 4px;border-radius:8px;
      font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:1px;
      background:rgba(0,0,0,0.1);color:rgba(0,0,0,0.4);
      border:2px solid transparent;text-align:center;cursor:pointer;
      transition:all .15s;
    }
    .tab.active { background:white;color:#0f172a;border-color:#0f172a;box-shadow:2px 2px 0 #0f172a; }

    /* ── MON RANG + ÉCART ── */
    .my-band {
      background:white;border:2.5px solid #cc1a1a;border-radius:12px;
      padding:10px 12px;margin-bottom:10px;
      box-shadow:2px 2px 0 #cc1a1a;
      display:none;
    }
    .my-band-row { display:flex;align-items:center;gap:10px;margin-bottom:6px; }
    .my-rank { font-family:'Bebas Neue',sans-serif;font-size:28px;color:#cc1a1a;line-height:1; }
    .my-info { flex:1; }
    .my-name { font-weight:800;font-size:13px;color:#0f172a; }
    .my-grade { font-size:9px;color:rgba(0,0,0,0.35);margin-top:1px; }
    .my-score { font-family:'Bebas Neue',sans-serif;font-size:18px;color:#cc1a1a; }
    .my-gap {
      font-size:10px;font-weight:700;color:rgba(0,0,0,0.45);
      background:rgba(0,0,0,0.05);border-radius:6px;
      padding:5px 8px;
    }
    .my-gap span { color:#0f172a; }

    /* ── ROWS ── */
    .rank-rows { display:flex;flex-direction:column;gap:5px; }

    .rank-row {
      display:flex;align-items:center;gap:8px;
      padding:10px 11px;border-radius:10px;
      background:white;border:2.5px solid #0f172a;
      cursor:pointer;transition:transform .12s;
      position:relative;overflow:hidden;
    }
    .rank-row:active { transform:scale(0.98); }
    .rank-row.top-1 { box-shadow:3px 3px 0 #0f172a; }
    .rank-row.top-2 { box-shadow:2px 2px 0 #0f172a; }
    .rank-row.top-3 { box-shadow:2px 2px 0 rgba(0,0,0,0.5); }
    .rank-row.me { background:#fef3c7;border-color:#cc1a1a;box-shadow:2px 2px 0 #cc1a1a; }

    .row-num {
      font-family:'Bebas Neue',sans-serif;font-size:18px;
      min-width:26px;text-align:center;color:rgba(0,0,0,0.15);
      flex-shrink:0;
    }
    .rank-row.top-1 .row-num { color:#fbbf24;-webkit-text-stroke:1px #0f172a;font-size:20px; }
    .rank-row.top-2 .row-num { color:#9e9e9e;font-size:19px; }
    .rank-row.top-3 .row-num { color:#cd7f32;font-size:18px; }
    .rank-row.me .row-num { color:#cc1a1a; }

    .row-avatar {
      width:36px;height:36px;border-radius:50%;overflow:hidden;
      flex-shrink:0;border:2px solid #e5e7eb;background:#f3f4f6;
    }
    .row-avatar img { width:100%;height:100%;object-fit:cover; }

    .row-info { flex:1;min-width:0; }
    .row-name {
      font-weight:800;font-size:12px;color:#0f172a;
      display:flex;align-items:center;gap:5px;flex-wrap:wrap;
    }
    .rank-row.top-1 .row-name { font-size:13px; }
    .row-grade { font-size:9px;color:rgba(0,0,0,0.35);margin-top:1px; }

    /* Score + tendance + défier */
    .row-right { display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0; }
    .row-score {
      font-family:'Bebas Neue',sans-serif;font-size:16px;color:rgba(0,0,0,0.2);
    }
    .rank-row.top-1 .row-score { color:#0f172a;font-size:19px; }
    .rank-row.top-2 .row-score { color:#9e9e9e;font-size:17px; }
    .rank-row.top-3 .row-score { color:#cd7f32; }
    .rank-row.me .row-score { color:#cc1a1a; }

    .row-trend { font-size:9px;font-weight:800; }
    .row-trend.up { color:#15803d; }
    .row-trend.dn { color:#cc1a1a; }
    .row-trend.eq { color:rgba(0,0,0,0.2); }

    .btn-defi {
      font-size:8px;font-weight:800;letter-spacing:1px;
      padding:2px 7px;border-radius:5px;
      background:#fbbf24;border:1.5px solid #0f172a;
      color:#0f172a;cursor:pointer;
      flex-shrink:0;
    }
    .btn-defi:active { transform:scale(0.95); }

    /* ── LOADER ── */
    .loader {
      text-align:center;padding:60px 16px;
      font-family:'Bebas Neue',sans-serif;font-size:16px;
      color:rgba(0,0,0,0.25);letter-spacing:2px;
    }

    /* ── POPUP PROFIL ── */
    .popup-overlay {
      position:fixed;inset:0;z-index:1000;
      background:rgba(0,0,0,0.5);
      display:flex;align-items:flex-end;
      animation:ovIn .2s ease;
    }
    @keyframes ovIn { from{opacity:0} to{opacity:1} }
    .popup-sheet {
      background:white;border-radius:22px 22px 0 0;
      width:100%;max-width:500px;margin:0 auto;
      padding:20px 20px calc(28px + env(safe-area-inset-bottom));
      animation:shIn .25s ease;
    }
    @keyframes shIn { from{transform:translateY(100%)} to{transform:translateY(0)} }
    .popup-handle { width:36px;height:4px;border-radius:2px;background:#e5e7eb;margin:0 auto 18px; }
    .popup-avatar { width:72px;height:72px;border-radius:50%;border:3px solid #e5e7eb;margin:0 auto 10px;display:block;object-fit:cover; }
    .popup-name { font-weight:900;font-size:18px;color:#1a1a1a;text-align:center; }
    .popup-grade { font-size:11px;color:#9ca3af;text-align:center;margin-top:3px; }
    .popup-rank { font-family:'Bebas Neue',sans-serif;font-size:14px;color:#d4af37;text-align:center;margin-top:4px;letter-spacing:1px; }
    .popup-stats { display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0; }
    .pp-stat { background:#f8f8f8;border-radius:10px;padding:10px;text-align:center; }
    .pp-stat-v { font-family:'Bebas Neue',sans-serif;font-size:20px;color:#1a1a1a; }
    .pp-stat-l { font-size:8px;color:#9ca3af;font-weight:700;letter-spacing:1px;margin-top:2px; }
    .popup-company { display:none;align-items:center;gap:6px;margin:0 auto;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;color:#fff; }
    .btn-close-popup { width:100%;padding:13px;border:none;border-radius:12px;background:#f3f4f6;color:rgba(0,0,0,0.5);font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:2px;cursor:pointer;margin-top:14px; }

    /* ── ONLINE DOT ── */
    @keyframes onlinePulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.8)} }
  </style>
</head>
<body>



<!-- BODY JAUNE -->
<div class="sheet">

  <!-- SAISON -->
  <div class="season-banner" id="seasonBanner">
    <div class="sb-head">
      <div class="sb-title-row">
        <div class="sb-title">🏆 SAISON 1</div>
        <div class="sb-timer-wrap">
          <div class="sb-timer" id="seasonTimer">—</div>
          <div class="sb-timer-lbl">RESTANTS</div>
        </div>
      </div>
      <div class="sb-sub">Récompenses de fin de saison</div>
    </div>
    <div class="sb-rewards">
      <div class="sb-rew r1"><div class="sb-medal">🥇</div><div class="sb-rank">1ER</div><div class="sb-items">300 💎<br>Badge légendaire</div></div>
      <div class="sb-rew r2"><div class="sb-medal">🥈</div><div class="sb-rank">2ÈME</div><div class="sb-items">200 💎<br>Badge or</div></div>
      <div class="sb-rew r3"><div class="sb-medal">🥉</div><div class="sb-rank">3ÈME</div><div class="sb-items">100 💎<br>Badge argent</div></div>
    </div>
  </div>





  <!-- LOADER -->
  <div class="loader" id="loader">CHARGEMENT…</div>

  <!-- LISTE -->
  <div style="display:none" id="listWrap">
    <div class="rank-rows" id="rankRows"></div>
  </div>

</div>

<!-- POPUP PROFIL -->
<div id="popup" class="popup-overlay" style="display:none" onclick="closePopup(event)">
  <div class="popup-sheet">
    <div class="popup-handle"></div>
    <img class="popup-avatar" id="ppAvatar" src="avatar-default.png">
    <div class="popup-name" id="ppName">—</div>
    <div class="popup-grade" id="ppGrade">—</div>
    <div class="popup-rank" id="ppRank">—</div>
    <div class="popup-stats">
      <div class="pp-stat"><div class="pp-stat-v" id="ppLevel">—</div><div class="pp-stat-l">NIVEAU</div></div>
      <div class="pp-stat"><div class="pp-stat-v" id="ppMoney">—</div><div class="pp-stat-l">ARGENT</div></div>
      <div class="pp-stat"><div class="pp-stat-v" id="ppTrophies">—</div><div class="pp-stat-l">TROPHÉES</div></div>
    </div>
    <div class="popup-company" id="ppCompany"></div>
    <button class="btn-close-popup" onclick="document.getElementById('popup').style.display='none'">FERMER</button>
  </div>
</div>

<script>
  const sb = supabase.createClient(
    'https://drtsuhnbclhmgfjiykap.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg'
  );

  let currentUser = null, allPlayers = [], currentTab = 'level';
  const SEASON_END = new Date('2026-06-15T00:00:00');

  // ── Saison timer ──
  function updateTimer() {
    const diff = SEASON_END - Date.now();
    const banner = document.getElementById('seasonBanner');
    if (diff <= 0) {
      document.getElementById('seasonTimer').textContent = 'TERMINÉE';
      return;
    }
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    if (diff < 86400000) {
      // Moins de 24h → urgence
      document.getElementById('seasonTimer').textContent = h + 'H ' + m + 'M';
      if (banner) banner.classList.add('urgent');
    } else {
      document.getElementById('seasonTimer').textContent = d + 'J ' + h + 'H';
      if (banner) banner.classList.remove('urgent');
    }
  }
  updateTimer();
  setInterval(updateTimer, 60000);

  // ── Tendance (localStorage) ──
  function getTrend(userId, currentRank) {
    const key = 'rank_' + currentTab + '_' + userId;
    const prev = parseInt(localStorage.getItem(key) || '0');
    localStorage.setItem(key, currentRank);
    if (!prev || prev === currentRank) return { cls:'eq', txt:'= stable' };
    if (currentRank < prev) return { cls:'up', txt:'▲ +' + (prev - currentRank) };
    return { cls:'dn', txt:'▼ -' + (currentRank - prev) };
  }

  function getGrade(l) {
    if (l <= 4)  return 'Docker Occasionnel';
    if (l <= 14) return 'Docker';
    if (l <= 29) return 'Docker Mensuel';
    if (l <= 49) return 'Contre-Maître';
    if (l <= 79) return 'Chef de Quai';
    return 'Magnat du Port';
  }

  function score(p) {
    if (currentTab === 'entreprises') return bizValuation(p.commerce).toLocaleString('fr-FR') + '€';
    if (currentTab === 'level') return 'Niv. ' + (p.level || 1);
    return (p.money || 0).toLocaleString('fr-FR') + '€';
  }

  function scoreVal(p) {
    if (currentTab === 'entreprises') return bizValuation(p.commerce);
    if (currentTab === 'level') return p.level || 1;
    return p.money || 0;
  }

  function bizValuation(com) {
    if (!com || !com.company || !com.company.name) return 0;
    const l = com.company.level || 1;
    return l * 2000 * (com.ipo ? 1.5 : 1) * 150;
  }

  function avatarOf(p) { return p.profile.avatar_url || 'avatar-default.png'; }
  function escapeHtml(t) { return (t||'').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }

  function getOnlineStatus(lastSeen) {
    if (!lastSeen) return { online:false, text:'' };
    const diff = Math.floor((Date.now() - new Date(lastSeen)) / 1000);
    if (diff < 300)   return { online:true,  text:'En ligne' };
    if (diff < 3600)  return { online:false, text:'il y a ' + Math.floor(diff/60) + 'min' };
    if (diff < 86400) return { online:false, text:'il y a ' + Math.floor(diff/3600) + 'h' };
    return { online:false, text:'il y a ' + Math.floor(diff/86400) + 'j' };
  }

  function getCompanyDesc(co, username) {
    const level = co.level || 1;
    const descs = [
      ['Fondée dans un garage du Panier par '+username+'. Le garage est toujours là.',
       username+' a lancé ça entre deux pauses clope. Ça marche mieux qu\'attendu.',
       'L\'idée est venue à '+username+' après un pastis. Plusieurs pastis, en fait.'],
      ['L\'entreprise grandit. '+username+' dort moins bien.',
       'Niveau '+level+', soit dit en passant. Les concurrents tremblent légèrement.',
       username+' a failli tout lâcher au niveau 8. Contenu(e) de ne pas l\'avoir fait.'],
    ];
    const seed = (co.name||'').split('').reduce((a,c)=>a+c.charCodeAt(0),0);
    const tier = level <= 5 ? 0 : 1;
    return descs[tier][seed % descs[tier].length];
  }

  async function loadRanking() {
    document.getElementById('loader').style.display = 'block';
    document.getElementById('listWrap').style.display = 'none';
    document.getElementById('myBand').style.display = 'none';

    const { data: stats } = await sb
      .from('game_stats')
      .select('user_id, money, level, xp, commerce')
      .order(currentTab === 'level' ? 'level' : 'money', { ascending: false });

    if (!stats?.length) { document.getElementById('loader').style.display = 'none'; return; }

    const { data: profiles } = await sb
      .from('profiles')
      .select('user_id, username, avatar_url, trophies, last_seen')
      .in('user_id', stats.map(s => s.user_id));

    allPlayers = stats.map(s => ({
      ...s,
      profile: profiles?.find(p => p.user_id === s.user_id) || { username:'Docker', avatar_url:'avatar-default.png', trophies:0 }
    }));

    if (currentTab === 'entreprises') {
      allPlayers = allPlayers
        .filter(p => p.commerce?.company?.name)
        .sort((a, b) => bizValuation(b.commerce) - bizValuation(a.commerce));
    }

    document.getElementById('loader').style.display = 'none';

    const myIdx = allPlayers.findIndex(p => p.user_id === currentUser.id);
    if (myIdx >= 0) {
      const me = allPlayers[myIdx];
      const myRank = myIdx + 1;

      // Hero stats
      document.getElementById('heroMyRank').textContent = '#' + myRank;
      document.getElementById('heroTotal').textContent   = allPlayers.length;
      const heroLeaderEl = document.getElementById('heroLeader');
      const heroLeaderValEl = document.getElementById('heroLeaderVal');
      if (allPlayers[0]) {
        heroLeaderEl.textContent    = allPlayers[0].profile.username;
        heroLeaderValEl.textContent = '1er';
      }
      document.getElementById('heroStats').style.display = '';

      // Mon rang band
      document.getElementById('myRankNum').textContent = '#' + myRank;
      document.getElementById('myName').textContent    = me.profile.username;
      document.getElementById('myGrade').textContent   = getGrade(me.level || 1);
      document.getElementById('myScore').textContent   = score(me);

      // Écart avec joueur du dessus
      const gapEl = document.getElementById('myGap');
      if (myIdx > 0) {
        const above = allPlayers[myIdx - 1];
        const myVal  = scoreVal(me);
        const abVal  = scoreVal(above);
        const diff   = abVal - myVal;
        const unit   = currentTab === 'level' ? ' niveaux' : currentTab === 'money' ? '€' : '€';
        const label  = currentTab === 'level' ? diff + ' niveaux' : diff.toLocaleString('fr-FR') + unit;
        gapEl.innerHTML = 'À <span>' + label + '</span> du rang #' + myIdx + ' — ' + escapeHtml(above.profile.username);
        gapEl.style.display = 'block';
      } else {
        gapEl.style.display = 'none';
      }
      document.getElementById('myBand').style.display = 'block';
    }

    renderRows(allPlayers);
    document.getElementById('listWrap').style.display = 'block';
  }

  function renderRows(players) {
    const el = document.getElementById('rankRows');
    if (!players.length) {
      el.innerHTML = '<div style="text-align:center;padding:40px;color:rgba(0,0,0,0.35);font-weight:700">Aucune entreprise pour l\'instant</div>';
      return;
    }
    const medals = { 1:'🥇', 2:'🥈', 3:'🥉' };

    el.innerHTML = players.map((p, i) => {
      const rank  = i + 1;
      const isMe  = p.user_id === currentUser.id;
      const topCls = rank <= 3 ? ' top-' + rank : '';
      const numDisplay = medals[rank] || rank;
      const trend = getTrend(p.user_id, rank);
      const online = getOnlineStatus(p.profile.last_seen);
      const defiBtn = isMe ? '' : '<div class="btn-defi" data-idx="' + i + '" data-name="' + (p.profile.username||'').replace(/"/g,'') + '" onclick="event.stopPropagation();defier(parseInt(this.dataset.idx),this.dataset.name)">⚔️ DÉFIER</div>';

      if (currentTab === 'entreprises') {
        const co = p.commerce.company;
        const ipoTag = co.ipo ? ' <span style="font-size:9px;background:#15803d;color:#fff;padding:1px 5px;border-radius:4px;font-weight:700">📈</span>' : '';
        const sloganHtml = co.slogan
          ? '<div style="font-size:10px;font-style:italic;color:rgba(0,0,0,0.5);margin-top:2px">&laquo;&nbsp;' + escapeHtml(co.slogan) + '&nbsp;&raquo;</div>' : '';
        return '<div class="rank-row' + (isMe?' me':'') + topCls + '" onclick="showProfile(' + i + ')" style="flex-direction:column;align-items:stretch;gap:6px">'
          + '<div style="display:flex;align-items:center;gap:8px">'
          + '<div class="row-num">' + numDisplay + '</div>'
          + '<div class="row-avatar" style="background:' + (co.color||'#d97706') + ';display:flex;align-items:center;justify-content:center;font-size:20px;border:2px solid #0f172a;flex-shrink:0">' + (co.logo||'🏢') + '</div>'
          + '<div style="flex:1;min-width:0"><div class="row-name">' + escapeHtml(co.name) + ipoTag + (isMe?' 👈':'') + '</div>'
          + '<div class="row-grade">' + escapeHtml(co.type||'Entreprise') + ' · nv.' + (co.level||1) + ' · ' + escapeHtml(p.profile.username) + '</div></div>'
          + '<div class="row-right"><div class="row-score">' + score(p) + '</div><div class="row-trend ' + trend.cls + '">' + trend.txt + '</div>' + defiBtn + '</div>'
          + '</div>'
          + (sloganHtml ? '<div style="margin-left:34px;padding:6px 10px;background:rgba(0,0,0,0.04);border-left:3px solid ' + (co.color||'#d97706') + ';border-radius:0 6px 6px 0">' + sloganHtml + '<div style="font-size:9px;color:rgba(0,0,0,0.35)">' + escapeHtml(getCompanyDesc(co, p.profile.username)) + '</div></div>' : '')
          + '</div>';
      }

      const _co = (p.commerce?.company?.name) ? p.commerce.company : null;
      const onlineDot = online.online
        ? '<span style="width:7px;height:7px;border-radius:50%;background:#22c55e;display:inline-block;box-shadow:0 0 5px rgba(34,197,94,0.7);animation:onlinePulse 2s ease-in-out infinite;flex-shrink:0"></span>' : '';
      const companyTag = _co
        ? '<span style="display:inline-flex;align-items:center;gap:2px;font-size:9px;font-weight:700;color:#fff;background:' + (_co.color||'#d97706') + ';padding:1px 6px;border-radius:8px">' + (_co.logo||'🏢') + ' ' + escapeHtml(_co.name) + '</span>' : '';

      return '<div class="rank-row' + (isMe?' me':'') + topCls + '" onclick="showProfile(' + i + ')">'
        + '<div class="row-num">' + numDisplay + '</div>'
        + '<div class="row-avatar"><img src="' + avatarOf(p) + '"></div>'
        + '<div class="row-info">'
        + '<div class="row-name">' + escapeHtml(p.profile.username) + (isMe?' 👈':'') + onlineDot + '</div>'
        + '<div class="row-grade" style="display:flex;align-items:center;gap:4px;flex-wrap:wrap">' + getGrade(p.level||1) + (!online.online && online.text ? '<span style="color:rgba(0,0,0,0.25)">' + online.text + '</span>' : '') + companyTag + '</div>'
        + '</div>'
        + '<div class="row-right">'
        + '<div class="row-score">' + score(p) + '</div>'
        + '<div class="row-trend ' + trend.cls + '">' + trend.txt + '</div>'
        + defiBtn
        + '</div>'
        + '</div>';
    }).join('');
  }

  function showProfile(idx) {
    const p = allPlayers[idx];
    if (!p) return;
    document.getElementById('ppAvatar').src         = avatarOf(p);
    document.getElementById('ppName').textContent   = p.profile.username;
    document.getElementById('ppGrade').textContent  = getGrade(p.level||1);
    document.getElementById('ppRank').textContent   = '#' + (idx+1) + ' au classement';
    document.getElementById('ppLevel').textContent  = p.level || 1;
    document.getElementById('ppMoney').textContent  = (p.money||0) >= 1000 ? Math.floor((p.money||0)/1000) + 'k€' : (p.money||0) + '€';
    document.getElementById('ppTrophies').textContent = p.profile.trophies || 0;
    const _co = p.commerce?.company?.name ? p.commerce.company : null;
    const coEl = document.getElementById('ppCompany');
    if (_co) {
      coEl.style.cssText = 'display:inline-flex;align-items:center;gap:5px;margin:8px auto 0;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;color:#fff;background:' + (_co.color||'#d97706');
      coEl.innerHTML = (_co.logo||'🏢') + ' ' + escapeHtml(_co.name) + (_co.ipo?' 📈':'');
    } else { coEl.style.display = 'none'; }
    document.getElementById('popup').style.display = 'flex';
  }

  function closePopup(e) {
    if (e.target.id === 'popup') document.getElementById('popup').style.display = 'none';
  }

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    const a = document.getElementById('tab-' + tab);
    if (a) a.classList.add('active');
    loadRanking();
  }


  // ── TRASH TALK ──
  const TRASH = [
    "Peuchère {name}, t'as vu ton rang ? C'est moi qui t'écrase !",
    "{name} ! Rentre chez toi, le port c'est mon territoire !",
    "Alors {name}, on fait quoi avec son niveau minable ?",
    "Coucou {name} ! Je passe te dire que tu vas rester derrière moi longtemps 😘",
    "{name}, même Gégé fait mieux que toi et il a 70 ans !",
    "Bien essayé {name}, mais le classement c'est moi qui le tiens !",
    "{name} ! Ta place dans le top, c'est pour quand exactement ?",
    "Oh {name}... Courage hein. Il paraît que le bas du classement c'est très bien aussi.",
    "{name}, j'ai vu ta valorisation. Mon bar rapporte plus que ton empire ! 😂",
    "Allez {name}, fais un effort. On s'ennuie là-haut sans compétition.",
  ];

  function defier(idx, name) {
    const msg = TRASH[Math.floor(Math.random() * TRASH.length)].replace(/{name}/g, name);
    // Afficher popup trash talk
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;padding:24px;animation:ovIn .2s ease';
    overlay.innerHTML = `
      <div style="background:#0f172a;border-radius:20px;padding:24px;max-width:320px;width:100%;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,0.8)">
        <div style="font-size:40px;margin-bottom:12px">⚔️</div>
        <div style="font-family:'Bebas Neue',sans-serif;font-size:16px;color:#fbbf24;letter-spacing:2px;margin-bottom:14px">DÉFI ENVOYÉ !</div>
        <div style="background:#1e293b;border-radius:12px;padding:14px;margin-bottom:16px">
          <div style="font-size:13px;color:white;line-height:1.5;font-style:italic">&laquo; \${msg} &raquo;</div>
        </div>
        <div style="font-size:10px;color:rgba(255,255,255,0.3);margin-bottom:16px">Message envoyé à \${name}</div>
        <button onclick="this.closest('div[style]').remove()" style="width:100%;padding:12px;border:none;border-radius:10px;background:#fbbf24;color:#0f172a;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px;cursor:pointer">OK BIEN JOUÉ</button>
      </div>
    `;
    overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };
    document.body.appendChild(overlay);
  }

  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = 'index.html'; return; }
    currentUser = session.user;
    sb.from('profiles').update({ last_seen: new Date().toISOString() }).eq('user_id', currentUser.id);
    loadRanking();
  }

  init();
</script>
</body>
</html>
