<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Classement - Battle Dock</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * { margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none; }
    body { font-family:'Inter',sans-serif;background:#0f172a;min-height:100dvh;display:flex;flex-direction:column; }

    /* ── HEADER ── */
    .page-header { background:linear-gradient(135deg,#cc1a1a,#0f172a);padding:calc(18px + env(safe-area-inset-top)) 16px 16px;text-align:center;flex-shrink:0; }
    .page-title { font-family:'Bebas Neue',sans-serif;font-size:28px;color:white;letter-spacing:3px;line-height:1; }
    .page-sub { font-size:9px;font-weight:700;color:rgba(255,255,255,0.2);letter-spacing:3px;margin-top:4px; }
    .page-sub span { color:#fbbf24; }

    /* ── TOGGLE SORT ── */
    .sort-toggle { display:flex;gap:4px;margin-bottom:10px; }
    .sort-btn { flex:1;padding:7px 4px;border-radius:20px;font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:1px;background:rgba(0,0,0,0.06);color:rgba(0,0,0,0.4);border:1.5px solid transparent;text-align:center;cursor:pointer;transition:all .15s; }
    .sort-btn.active { background:#0f172a;color:#fbbf24;border-color:rgba(251,191,36,0.4); }

    /* ── FILTRE EN LIGNE ── */
    .filter-bar { display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px; }
    .filter-count { font-size:10px;font-weight:700;color:rgba(0,0,0,0.45);flex-shrink:0; }
    .filter-count span { color:#0f172a; }
    .toggle-online { display:flex;align-items:center;gap:7px;cursor:pointer;background:rgba(0,0,0,0.06);border-radius:20px;padding:8px 12px;border:1.5px solid rgba(0,0,0,0.1);transition:all .2s;min-height:44px; }
    .toggle-online.on { background:rgba(74,222,128,0.15);border-color:rgba(74,222,128,0.4); }
    .toggle-label { font-size:10px;font-weight:800;color:rgba(0,0,0,0.4);letter-spacing:0.5px;transition:color .2s; }
    .toggle-online.on .toggle-label { color:#4ade80; }
    .toggle-active { font-size:9px;font-weight:800;color:#4ade80;letter-spacing:1px;display:none; }
    .toggle-online.on .toggle-active { display:inline; }
    .toggle-dot { width:30px;height:17px;border-radius:9px;background:rgba(0,0,0,0.1);position:relative;transition:background .2s;border:1px solid rgba(0,0,0,0.15);flex-shrink:0; }
    .toggle-dot::after { content:'';position:absolute;width:11px;height:11px;border-radius:50%;background:rgba(0,0,0,0.3);top:2px;left:2px;transition:all .2s; }
    .toggle-dot.on { background:#4ade80;border-color:#22c55e; }
    .toggle-dot.on::after { transform:translateX(13px);background:white; }

    /* ── SHEET ROUGE ── */
    .sheet { background:#f8f8f8;flex:1;padding:12px 12px 12px;overflow-y:auto; }

    /* ── COMPTE À REBOURS PERSO ── */
    .rivalry-block { display:none;margin-bottom:10px; }
    .rivalry-block.show { display:block; }
    .rivalry-title { font-size:8px;font-weight:800;color:rgba(0,0,0,0.35);letter-spacing:2px;margin-bottom:5px; }
    .rivalry-row { display:flex;align-items:center;gap:8px;padding:12px 10px;border-radius:9px;background:rgba(255,140,0,0.07);border:1.5px solid rgba(255,140,0,0.25);margin-bottom:4px;cursor:pointer;min-height:44px; }
    .rivalry-av { width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,140,0,0.4);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:12px;color:white; }
    .rivalry-av img { width:100%;height:100%;object-fit:cover;border-radius:50%; }
    .rivalry-info { flex:1; }
    .rivalry-name { font-family:'Bebas Neue',sans-serif;font-size:15px;color:#0f172a; }
    .rivalry-gap { font-size:9px;color:rgba(255,140,0,0.8);margin-top:1px; }
    .rivalry-rank { font-family:'Bebas Neue',sans-serif;font-size:16px;color:rgba(255,140,0,0.6); }
    .personal-gap { background:white;border-radius:10px;padding:9px 12px;margin-bottom:10px;display:none;border:1px solid #e5e7eb; }
    .personal-gap.show { display:block; }
    .personal-gap-txt { font-size:11px;font-weight:700;color:rgba(0,0,0,0.5); }
    .personal-gap-txt span { color:#0f172a; }

    /* ── SKELETON ── */
    @keyframes shimmer { 0%{background-position:-300px 0} 100%{background-position:300px 0} }
    .skeleton { border-radius:10px;margin-bottom:5px;height:66px;background:linear-gradient(90deg,#e5e7eb 25%,#f3f4f6 50%,#e5e7eb 75%);background-size:600px 100%;animation:shimmer 1.4s infinite linear; }

    /* ── ROWS ── */
    .rank-rows { display:flex;flex-direction:column;gap:5px; }
    .rank-sep { display:flex;align-items:center;gap:8px;margin:6px 0 2px;font-size:8px;font-weight:800;color:rgba(0,0,0,0.2);letter-spacing:2px; }
    .rank-sep::before,.rank-sep::after { content:'';flex:1;height:1px;background:rgba(0,0,0,0.08); }
    @keyframes rowIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    .rank-row { display:flex;align-items:center;gap:8px;padding:10px 11px;border-radius:10px;background:rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.08);cursor:pointer;transition:transform .12s; }
    .rank-rows.animate .rank-row { animation:rowIn .3s ease both; }
    .rank-row:active { transform:scale(0.98); }
    .rank-row.top-1 { background:white;border-color:#e5e7eb; }
    .rank-row.top-2 { background:white; }
    .rank-row.top-3 { background:white; }
    .rank-row.top-10 { border-left:2px solid rgba(0,0,0,0.07); }
    .row-rank { font-family:'Bebas Neue',sans-serif;font-size:14px;color:rgba(0,0,0,0.22);min-width:22px;text-align:center;flex-shrink:0; }
    .rank-row.me .row-rank { color:#fbbf24; }

    /* ── TOP 3 CARDS ── */
    .top3-section { display:none;flex-direction:column;gap:6px;margin-bottom:8px; }
    .top3-section.show { display:flex; }
    .top3-card {
      display:flex;align-items:center;gap:10px;
      border-radius:12px;cursor:pointer;
      transition:transform .12s;position:relative;overflow:hidden;
    }
    .top3-card:active { transform:scale(0.98); }
    .top3-card.c1 { background:#fbbf24;border:2.5px solid #0f172a;box-shadow:2px 2px 0 rgba(0,0,0,0.15);padding:14px 14px; }
    .top3-card.c2 { background:white;border:1.5px solid #e5e7eb;padding:12px 13px; }
    .top3-card.c3 { background:white;border:1px solid #f3f4f6;padding:10px 12px; }
    /* Barre gauche */
    .top3-card::before { content:'';position:absolute;left:0;top:0;bottom:0; }
    .top3-card.c1::before { width:3px;background:#fbbf24; }
    .top3-card.c2::before { width:2.5px;background:#9e9e9e; }
    .top3-card.c3::before { width:2px;background:#cd7f32; }
    /* Avatar */
    .top3-av { border-radius:50%;overflow:hidden;flex-shrink:0;border:2px solid rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;color:white; }
    .top3-card.c1 .top3-av { width:52px;height:52px;font-size:18px;border-color:rgba(0,0,0,0.12); }
    .top3-card.c2 .top3-av { width:48px;height:48px;font-size:16px;border-color:rgba(158,158,158,0.4); }
    .top3-card.c3 .top3-av { width:44px;height:44px;font-size:15px;border-color:rgba(205,127,50,0.35); }
    .top3-av img { width:100%;height:100%;object-fit:cover;border-radius:50%; }
    /* Infos */
    .top3-info { flex:1;min-width:0; }
    .top3-name { font-family:'Bebas Neue',sans-serif;color:#0f172a;letter-spacing:0.5px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px; }
    .top3-card.c1 .top3-name { font-size:22px; }
    .top3-card.c2 .top3-name { font-size:20px; }
    .top3-card.c3 .top3-name { font-size:18px; }
    .top3-badge { display:inline-block;font-size:8px;font-weight:800;letter-spacing:1px;margin-top:4px;padding:2px 7px;border-radius:4px; }
    .top3-card.c1 .top3-badge { background:#0f172a;color:#fbbf24; }
    .top3-card.c2 .top3-badge { background:#f3f4f6;color:#9e9e9e; }
    .top3-card.c3 .top3-badge { background:rgba(205,127,50,0.2);color:rgba(205,127,50,0.9); }
    .top3-since { display:block;font-size:9px;color:rgba(0,0,0,0.3);margin-top:3px; }
    /* Score */
    .top3-right { text-align:right;flex-shrink:0; }
    .top3-score { font-family:'Bebas Neue',sans-serif;display:block; }
    .top3-card.c1 .top3-score { font-size:22px;color:#0f172a; }
    .top3-card.c2 .top3-score { font-size:18px;color:#9e9e9e; }
    .top3-card.c3 .top3-score { font-size:16px;color:rgba(205,127,50,0.8); }
    .rank-row.me { background:linear-gradient(90deg,rgba(251,191,36,0.18),rgba(0,0,0,0.35));border-color:#fbbf24;border-width:2px; }
    .rank-row.me .row-name { color:#0f172a; }
    .rank-row.me .row-score { color:#fbbf24; }
    .me-badge { display:inline-block;font-size:8px;font-weight:800;background:#cc1a1a;color:white;padding:1px 5px;border-radius:4px;letter-spacing:1px;flex-shrink:0; }

    .row-avatar { width:44px;height:44px;border-radius:50%;flex-shrink:0;border:2.5px solid #e5e7eb;background:#f3f4f6;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:14px;font-weight:700;color:#0f172a;overflow:hidden; }
    .row-avatar img { width:100%;height:100%;object-fit:cover;border-radius:50%; }
    .row-info { flex:1;min-width:0; }
    .row-name { font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:0.5px;color:#0f172a;display:flex;align-items:center;gap:5px;flex-wrap:nowrap;overflow:hidden;line-height:1.1; }
    .rank-row.top-1 .row-name { color:#0f172a; }
    .row-grade { font-size:9px;color:rgba(0,0,0,0.35);margin-top:3px;display:flex;align-items:center;gap:5px; }
    .row-online { font-size:9px;font-weight:700;color:#15803d; }
    .row-lastseen { font-size:9px;color:rgba(0,0,0,0.25); }
    .row-right { display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0; }
    .row-score { font-family:'Bebas Neue',sans-serif;font-size:16px;color:rgba(0,0,0,0.25); }
    .rank-row.top-1 .row-score { color:#0f172a;font-size:19px; }
    .rank-row.top-2 .row-score { color:#9e9e9e;font-size:17px; }
    .rank-row.top-3 .row-score { color:#cd7f32; }
    .rank-row.me .row-score { color:#cc1a1a; }
    .row-trend { font-size:9px;font-weight:800; }
    .row-trend.up { color:#15803d; }
    .row-trend.dn { color:#cc1a1a; }
    .row-trend.eq { color:rgba(0,0,0,0.2); }
    .btn-defi { font-size:8px;font-weight:800;letter-spacing:1px;padding:3px 8px;border-radius:5px;background:transparent;border:none;color:rgba(255,255,255,0.35);cursor:pointer;flex-shrink:0; }
    .btn-defi:active { transform:scale(0.95); }

    /* ── BOUTON ME RETROUVER ── */
    .btn-locate { position:fixed;bottom:calc(24px + env(safe-area-inset-bottom, 20px));right:16px;z-index:200;background:#0f172a;border:2.5px solid #fbbf24;border-radius:16px;min-width:46px;padding:6px 10px;display:none;align-items:center;justify-content:center;gap:4px;cursor:pointer;box-shadow:3px 3px 0 #fbbf24;flex-direction:column; }
    .locate-rank { font-family:'Bebas Neue',sans-serif;font-size:11px;color:#fbbf24;letter-spacing:1px;line-height:1; }
    .btn-locate.show { display:flex; }

    /* ── TOAST ── */
    .toast { position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:500;background:#0f172a;border:2px solid #fbbf24;border-radius:12px;padding:10px 16px;font-family:'Bebas Neue',sans-serif;font-size:13px;color:#fbbf24;letter-spacing:1px;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,0.6);animation:toastIn .3s ease;display:none; }
    .toast.show { display:block; }
    @keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(-10px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }

    /* ── PULL TO REFRESH ── */
    /* ── POPUP PROFIL BD ROUGE ── */
    .popup-overlay { position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,0.6);display:flex;align-items:flex-end;animation:ovIn .2s ease; }
    @keyframes ovIn { from{opacity:0} to{opacity:1} }
    .popup-sheet { background:white;border-radius:22px 22px 0 0;border:none;overflow:hidden;width:100%;max-width:500px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom, 20px));animation:shIn .25s ease; }
    @keyframes shIn { from{transform:translateY(100%)} to{transform:translateY(0)} }
    @keyframes shOut { from{transform:translateY(0)} to{transform:translateY(100%)} }
    @keyframes ovOut { from{opacity:1} to{opacity:0} }
    .popup-handle { width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,0.4);position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:1; }
    .pp-top { display:flex;align-items:center;gap:14px;margin-bottom:14px; }
    .pp-av-wrap { position:absolute;bottom:-30px;left:14px; }
    .pp-cover { height:80px;background:#030712;position:relative;flex-shrink:0;overflow:hidden;display:flex;align-items:center;gap:12px;padding:0 14px; }
    .pp-cover-badge { position:absolute;top:10px;right:12px;background:#fbbf24;border-radius:6px;font-family:'Bebas Neue',sans-serif;font-size:12px;color:#0f172a;padding:2px 10px;letter-spacing:1px; }
    .pp-av { width:60px;height:60px;border-radius:50%;border:3px solid white;object-fit:cover;display:block; }
    .pp-rank-badge { display:none; }
    .pp-infos { flex:1;min-width:0; }
    .pp-body { padding:38px 14px 0; }
    .pp-name { font-weight:900;font-size:18px;color:#0f172a;line-height:1.2; }
    .pp-grade { font-size:11px;color:#6b7280;margin-top:3px; }
    .pp-last-seen { font-size:11px;color:#6b7280; }
    .pp-xp-wrap { margin-top:8px; }
    .pp-xp-wrap { margin:8px 0; }
    .pp-xp-label { display:flex;justify-content:space-between;font-size:10px;font-weight:600;color:#9ca3af;margin-bottom:4px; }
    .pp-xp-bar { background:#f3f4f6;border-radius:10px;height:6px;overflow:hidden; }
    .pp-xp-fill { height:100%;border-radius:10px;background:linear-gradient(90deg,#cc1a1a,#fbbf24);transition:width .4s ease; }
    .pp-stats { display:flex;border-top:1px solid #f3f4f6;border-bottom:1px solid #f3f4f6;margin:10px 0; }
    .pp-stat { flex:1;padding:10px 4px;text-align:center;border-right:1px solid #f3f4f6; }
    .pp-stat:last-child { border-right:none; }
    .pp-stat-sep { display:none; }
    .pp-stat-v { font-weight:900;font-size:17px;color:#0f172a;line-height:1; }
    .pp-stat-l { font-size:9px;color:#9ca3af;margin-top:2px; }
    .pp-best-rank { font-size:9px;color:#9ca3af;font-weight:600;margin:8px 0;text-align:center; }
    .pp-best-rank span { color:#d97706;font-weight:700; }
    .pp-btns { display:flex;gap:8px;padding-bottom:calc(14px + env(safe-area-inset-bottom, 20px)); }
    .pp-btn-defi { flex:2;padding:12px;border:none;border-radius:10px;background:#cc1a1a;color:white;font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:1px;cursor:pointer; }
    .pp-btn-close { flex:1;padding:12px;border:1.5px solid #e5e7eb;border-radius:10px;background:white;color:#374151;font-weight:700;font-size:13px;cursor:pointer; }
    .pp-btn-profil { width:100%;margin-bottom:8px;padding:11px;border:1.5px solid #e5e7eb;border-radius:10px;background:white;color:#374151;font-weight:700;font-size:13px;cursor:pointer;text-align:center; }
    .pp-btn-profil:active { background:#f9fafb; }
    .chat-msg { padding:7px 10px;border-radius:8px;font-size:11px;line-height:1.4;max-width:90%; }
    .chat-msg.sent { background:rgba(251,191,36,0.15);border:1px solid rgba(251,191,36,0.25);align-self:flex-end;color:rgba(255,255,255,0.8); }
    .chat-msg.received { background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);align-self:flex-start;color:rgba(255,255,255,0.7); }
    .chat-msg .chat-meta { font-size:8px;color:rgba(255,255,255,0.3);margin-top:3px;font-weight:700;letter-spacing:1px; }

    @keyframes onlinePulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.8)} }
    .btn-back { position:fixed;bottom:calc(20px + env(safe-area-inset-bottom, 20px));left:50%;transform:translateX(-50%);z-index:200;background:white;border:2px solid #e5e7eb;border-radius:20px;padding:10px 24px;display:flex;align-items:center;gap:8px;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:2px;color:#0f172a;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,0.1);white-space:nowrap; }
    .btn-back:active { transform:translateX(-50%) scale(0.97); }
  </style>
</head>
<body>

<!-- HEADER -->
<div class="page-header">
  <div class="page-title">LE CLASSEMENT DES DOCKERS</div>
  <div class="page-sub">PORT DE MARSEILLE · <span id="headerCount"></span></div>
</div>

<!-- BODY ROUGE -->
<div class="sheet" id="sheet">

  <!-- COMPTE À REBOURS PERSO -->
  <div class="rivalry-block" id="rivalryBlock">
    <div class="rivalry-title">👀 À SURVEILLER</div>
    <div id="rivalryRows"></div>
  </div>

  <div class="personal-gap" id="personalGap">
    <div class="personal-gap-txt" id="personalGapTxt"></div>
  </div>

  <!-- FILTRE -->
  <div class="sort-toggle">
    <div class="sort-btn active" id="sortPower" onclick="setSort('power')">⚡ PUISSANCE</div>
    <div class="sort-btn" id="sortLevel" onclick="setSort('level')">🎖 NIVEAU</div>
  </div>

  <div class="filter-bar">
    <div class="filter-count" id="filterCount"><span id="playerCount">—</span> joueurs</div>
    <div class="toggle-online" id="toggleOnline" onclick="toggleOnlineFilter()">
      <div class="toggle-label">🟢 En ligne</div>
      <div class="toggle-active">FILTRE ACTIF</div>
      <div class="toggle-dot" id="toggleDot"></div>
    </div>
  </div>

  <!-- SKELETON -->
  <div id="skeletonWrap">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </div>

  <!-- TOP 3 CARDS -->
  <div class="top3-section" id="top3Section"></div>

  <!-- LISTE (à partir du #4) -->
  <div style="display:none" id="listWrap">
    <div class="rank-rows" id="rankRows"></div>
  </div>

</div>

<!-- LISTE COMMERCE -->
<div id="coWrap" style="display:none;padding:8px 0"></div>

<!-- BOUTON ME RETROUVER -->
<div class="btn-locate" id="btnLocate" onclick="locateMe()" title="Me retrouver">📍</div>


<!-- OVERLAY MESSAGE PRIVÉ -->
<div id="msgOverlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:2000;display:none;align-items:flex-end;justify-content:center" onclick="if(event.target===this)this.style.display='none'">
  <div style="background:white;border-radius:20px 20px 0 0;width:100%;max-width:500px;padding:20px 16px calc(24px + env(safe-area-inset-bottom, 20px))">
    <div style="width:36px;height:4px;background:#e5e7eb;border-radius:2px;margin:0 auto 16px"></div>
    <div style="font-family:'Bebas Neue',sans-serif;font-size:18px;color:#0f172a;letter-spacing:2px;margin-bottom:4px">MESSAGE PRIVÉ</div>

  function getXpRequired(level) {
    return level * 500;
  }

  function getGrade(l) {
    if (l <= 4) return 'Docker Occasionnel';
    if (l <= 14) return 'Docker';
    if (l <= 29) return 'Docker Mensuel';
    if (l <= 49) return 'Contre-Maître';
    if (l <= 79) return 'Chef de Quai';
    return 'Magnat du Port';
  }
  let sortMode = 'power'; // power | level | money

  function powerScore(p) {
    return (p.level||1) * 100 + Math.floor((p.money||0) / 10000);
  }
  function score(p) {
    if (sortMode === 'level') return 'Niv. ' + (p.level||1);
    if (sortMode === 'money') return ((p.money||0) >= 1000000 ? (((p.money||0)/1000000).toFixed(1)) + 'M€' : (p.money||0) >= 1000 ? Math.floor((p.money||0)/1000) + 'k€' : (p.money||0) + '€');
    return powerScore(p) + ' ⚡';
  }
  function sortPlayers(arr) {
    return [...arr].sort((a,b) => {
      if (sortMode === 'level') return (b.level||1) - (a.level||1);
      if (sortMode === 'money') return (b.money||0) - (a.money||0);
      return powerScore(b) - powerScore(a);
    });
  }
  function bizValuation(com) {
    if (!(com && com.company && com.company.name)) return 0;
    return (com.company.level||1) * 2000 * (com.ipo ? 1.5 : 1) * 150;
  }
  function avatarForLevel(lvl) {
    if (lvl>=50) return 'avatar-level-50.png'; if (lvl>=30) return 'avatar-level-30.png';
    if (lvl>=20) return 'avatar-level-20.png'; if (lvl>=17) return 'avatar-level-17.png';
    if (lvl>=15) return 'avatar-level-15.png'; if (lvl>=13) return 'avatar-level-13.png';
    if (lvl>=10) return 'avatar-level-10.png'; if (lvl>=5)  return 'avatar-level-5.png';
    if (lvl>=4)  return 'avatar-level-4.png';  if (lvl>=3)  return 'avatar-level-3.png';
    if (lvl>=2)  return 'avatar-level-2.png';  return 'avatar-default.png';
  }
  function escapeHtml(t) { return (t||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }
  function getOnlineStatus(lastSeen) {
    if (!lastSeen) return { online:false, text:'' };
    const diff = Math.floor((Date.now() - new Date(lastSeen)) / 1000);
    if (diff < 600) return { online:true, text:'En ligne' };
    if (diff < 3600) return { online:false, text:'il y a ' + Math.floor(diff/60) + 'min' };
    if (diff < 86400) return { online:false, text:'il y a ' + Math.floor(diff/3600) + 'h' };
    return { online:false, text:'il y a ' + Math.floor(diff/86400) + 'j' };
  }

  // ── Toast ──
  function showToast(msg, duration) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), duration || 3000);
  }

  // ── Filtre en ligne ──
  function setSort(mode) {
    sortMode = mode;
    ['power','level'].forEach(m => {
      var el = document.getElementById('sort'+m.charAt(0).toUpperCase()+m.slice(1));
      if(el) el.classList.toggle('active', m === mode);
    });
    if(mode === 'co') {
      document.getElementById('skeletonWrap').style.display = 'none';
      document.getElementById('top3Section').style.display = 'none';
      document.getElementById('listWrap').style.display = 'none';
      document.getElementById('rivalryBlock').style.display = 'none';
      document.getElementById('personalGap').style.display = 'none';
      loadCompanies();
    } else {
      document.getElementById('coWrap').style.display = 'none';
      document.getElementById('top3Section').style.display = '';
      document.getElementById('rivalryBlock').style.display = '';
      document.getElementById('personalGap').style.display = '';
      applyFilter();
    }
  }

  function toggleOnlineFilter() {
    onlineOnly = !onlineOnly;
    document.getElementById('toggleDot').classList.toggle('on', onlineOnly);
    document.getElementById('toggleOnline').classList.toggle('on', onlineOnly);
    applyFilter();
  }
  function applyFilter() {
    const onlinePlayers = allPlayers.filter(p => getOnlineStatus(p.profile.last_seen).online);
    const base = onlineOnly ? onlinePlayers : allPlayers;
    filteredPlayers = sortPlayers(base);
    const countEl = document.getElementById('playerCount');
    const hdrCount = document.getElementById('headerCount');
    if (hdrCount) hdrCount.textContent = allPlayers.length + ' DOCKERS';
    if (onlineOnly) {
      countEl.innerHTML = filteredPlayers.length + ' <span style="color:#4ade80;font-size:9px">EN LIGNE</span>';
    } else {
      countEl.textContent = filteredPlayers.length + ' joueurs · ' + onlinePlayers.length + ' 🟢';
    }
    renderRows(filteredPlayers);
  }

  // ── Me retrouver ──
  function locateMe() {
    if (!myRowEl && onlineOnly) { toggleOnlineFilter(); return; }
    if (!myRowEl) return;
    myRowEl.scrollIntoView({ behavior:'smooth', block:'center' });
    myRowEl.style.outline = '3px solid #fbbf24';
    setTimeout(() => { myRowEl.style.outline = ''; }, 1500);
  }

  // ── Chargement ──
  async function loadRanking() {
    firstRender = true;
    document.getElementById('skeletonWrap').style.display = 'block';
    document.getElementById('listWrap').style.display = 'none';

    // Requêtes parallèles pour réduire le temps de chargement
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 8000);
    let stats, profiles;
    try {
      const [statsRes] = await Promise.all([
        sb.from('game_stats').select('user_id, money, level, xp, commerce, diamonds, trophies, records').order('level', { ascending: false }).limit(200),
      ]);
      clearTimeout(timeout);
      stats = statsRes.data;
      if (!(stats && stats.length)) { document.getElementById('skeletonWrap').style.display = 'none'; return; }
      // Profiles + prevRanks en parallèle
      const [profilesRes] = await Promise.all([
        sb.from('profiles').select('user_id, username, avatar_url, last_seen, background_color').in('user_id', stats.map(s => s.user_id)),
      ]);
      profiles = profilesRes.data;
      loadPrevRanks();
    } catch(e) {
      clearTimeout(timeout);
      document.getElementById('skeletonWrap').style.display = 'none';
      document.getElementById('rankRows').innerHTML = '<div style="text-align:center;padding:40px 20px"><div style="font-size:32px;margin-bottom:10px">📡</div><div style="font-family:\'Bebas Neue\',sans-serif;font-size:16px;color:rgba(255,255,255,0.4);letter-spacing:2px">IMPOSSIBLE DE CHARGER</div><div style="font-size:11px;color:rgba(255,255,255,0.25);margin-top:6px">Vérifiez votre connexion</div></div>';
      document.getElementById('listWrap').style.display = 'block';
      return;
    }
    allPlayers = stats.map(s => ({
      ...s,
      profile: (profiles ? profiles.find(function(p){ return p.user_id === s.user_id; }) : null) || { username:'Anonyme', trophies:0 }
    }));

    document.getElementById('skeletonWrap').style.display = 'none';
    document.getElementById('playerCount').textContent = allPlayers.length;

    const myIdx = allPlayers.findIndex(p => p.user_id === currentUser.id);
    if (myIdx >= 0) {
      const me = allPlayers[myIdx];
      const myRank = myIdx + 1;

      // Compte à rebours perso
      const gapEl = document.getElementById('personalGap');
      const gapTxt = document.getElementById('personalGapTxt');
      if (myIdx > 0) {
        const above = allPlayers[myIdx - 1];
        const diff = (above.level||1) - (me.level||1);
        if (diff > 0) {
          gapTxt.innerHTML = 'Encore <span>' + diff + ' niveau' + (diff>1?'x':'') + '</span> pour dépasser <span>' + escapeHtml(above.profile.username) + '</span> et passer #' + myIdx;
          gapEl.classList.add('show');
        }
      }

      // Rivalité — 2 joueurs au-dessus (trié selon sortMode)
      if (myIdx > 0) {
        const sortedRiv = sortPlayers(allPlayers);
        const myIdxRiv = sortedRiv.findIndex(p => p.user_id === currentUser.id);
        const rivals = myIdxRiv > 0 ? sortedRiv.slice(Math.max(0, myIdxRiv-2), myIdxRiv) : [];
        const rBlock = document.getElementById('rivalryBlock');
        if (rBlock && rivals.length > 0) {
          rBlock.classList.add('show');
          document.getElementById('rivalryRows').innerHTML = rivals.map((r, ri) => {
            const realRivIdx = allPlayers.indexOf(r);
            const rIdx = myIdxRiv - rivals.length + ri;
            const diffStr = sortMode === 'money'
              ? Math.abs(Math.floor(((r.money||0)-(me.money||0))/1000)) + 'k€'
              : sortMode === 'level'
              ? Math.abs((r.level||1)-(me.level||1)) + ' niveaux'
              : Math.abs(powerScore(r)-powerScore(me)) + ' pts';
            return '<div class="rivalry-row" onclick="showProfile(' + realRivIdx + ')">'
              + '<div class="rivalry-av"><img src="' + avatarForLevel(r.level||1) + '" onerror="this.style.display=\'none\'"></div>'
              + '<div class="rivalry-info"><div class="rivalry-name">' + escapeHtml(r.profile.username) + '</div><div class="rivalry-gap">+' + diffStr + ' devant toi</div></div>'
              + '<div class="rivalry-rank">#' + (rIdx+1) + '</div>'
              + '</div>';
          }).join('');
        }
      }

      // Bouton locate
      if (myRank > 8) {
        const locateEl = document.getElementById('btnLocate');
        const locateRankEl = document.getElementById('locateRank');
        if (locateEl) locateEl.classList.add('show');
        if (locateRankEl) locateRankEl.textContent = '#' + myRank;
        const locateAvEl = document.getElementById('locateAvatar');
        if (locateAvEl) locateAvEl.innerHTML = '<img src="' + avatarForLevel(me.level||1) + '" style="width:100%;height:100%;object-fit:cover;border-radius:50%">';
      }

      // Confettis si top 3
    }

    await loadRankSince(allPlayers);
    applyFilter();
    savePrevRanks(allPlayers);
  }

  // -- Duree au rang (Supabase top3_since + localStorage fallback)
  const rankSinceCache = {};
  async function loadRankSince(players) {
    const top3 = players.slice(0, 3);
    try {
      const { data, error } = await sb.from('game_stats')
        .select('user_id,top3_since').in('user_id', top3.map(p => p.user_id));
      if (!error && data) {
        const now = new Date().toISOString();
        data.forEach(row => {
          if (!row.top3_since) {
            sb.from('game_stats').update({ top3_since: now }).eq('user_id', row.user_id).then(() => {});
            rankSinceCache[row.user_id] = now;
          } else { rankSinceCache[row.user_id] = row.top3_since; }
        });
        return;
      }
    } catch(e) {}
    top3.forEach(p => {
      const k = 'ranksince_' + p.user_id;
      if (!localStorage.getItem(k)) localStorage.setItem(k, Date.now());
      rankSinceCache[p.user_id] = new Date(parseInt(localStorage.getItem(k))).toISOString();
    });
  }
  function getRankSince(userId) {
    const iso = rankSinceCache[userId];
    if (!iso) return '';
    const days = Math.floor((Date.now() - new Date(iso)) / 86400000);
    if (days === 0) return "depuis aujourd'hui";
    if (days === 1) return 'depuis hier';
    return 'depuis ' + days + 'j';
  }

  const BADGES = { 1:'🏆 LEADER', 2:'2ÈME', 3:'3ÈME' };
  const CARD_CLS = { 1:'c1', 2:'c2', 3:'c3' };

  function renderTop3(players) {
    const el = document.getElementById('top3Section');
    const top3 = players.slice(0, Math.min(3, players.length));
    if (!top3.length) { el.classList.remove('show'); return; }
    el.classList.add('show');
    el.innerHTML = top3.map((p, i) => {
      const rank = i + 1;
      const cls = CARD_CLS[rank];
      const badge = BADGES[rank];
      const since = sortMode === 'level' ? getRankSince(p.user_id) : '';
      const initials = (p.profile.username||'?').substring(0,2).toUpperCase();
      const isMe = p.user_id === currentUser.id;
        const t3RealIdx = allPlayers.indexOf(p);
      return '<div class="top3-card ' + cls + '" onclick="showProfile(' + t3RealIdx + ')">'
        + '<div class="top3-av" style="background:' + avatarColor(p.profile.username) + '">'
        + '<img src="' + ((p.profile && p.profile.avatar_url) || avatarForLevel(p.level||1)) + '" onerror="this.src=\'avatar-default.png\'">'
        + '</div>'
        + '<div class="top3-info">'
        + '<div class="top3-name">' + escapeHtml(p.profile.username) + (isMe ? ' 👈' : '') + '</div>'
        + '<span class="top3-badge">' + badge + '</span>'
        + '<span class="top3-since">' + (since || '') + '</span>'
        + (function(){ const os=getOnlineStatus(p.profile.last_seen); return os.online ? '<span style="font-size:9px;font-weight:700;color:#15803d">🟢 En ligne</span>' : (os.text ? '<span style="font-size:9px;color:rgba(0,0,0,0.3)">· ' + os.text + '</span>' : ''); })()
        + '</div>'
        + '<div class="top3-right">'
        + '<span class="top3-score">' + score(p) + '</span>'
        + '</div>'
        + '</div>';
    }).join('');
  }

  function renderRows(players) {
    renderTop3(players);
    const el = document.getElementById('rankRows');
    myRowEl = null;
    // La liste commence au rang 4
    const listPlayers = players.slice(3);

    if (!players.length) {
      const emptyMsg = onlineOnly ? 'Aucun joueur en ligne' : 'Aucun joueur trouvé';
      el.innerHTML = '<div style="text-align:center;padding:40px 20px"><div style="font-family:\'Bebas Neue\',sans-serif;font-size:16px;color:rgba(0,0,0,0.35);letter-spacing:2px">' + emptyMsg + '</div></div>';
      document.getElementById('listWrap').style.display = 'block';
      return;
    }

    if (!listPlayers.length) {
      el.innerHTML = '';
      document.getElementById('listWrap').style.display = 'block';
      if (firstRender) { el.classList.add('animate'); firstRender = false; } else { el.classList.remove('animate'); }
      return;
    }
    const result = listPlayers.map((p, i) => {
      const rank = i + 4; // On part du rang 4
      const isMe = p.user_id === currentUser.id;
      const topCls = rank <= 10 ? ' top-10' : '';
      const trend = getTrend(p.user_id, rank);
      const online = getOnlineStatus(p.profile.last_seen);
      const initials = (p.profile.username||'?').substring(0,2).toUpperCase();
      const onlineDot = online.online ? '<span style="width:7px;height:7px;border-radius:50%;background:#22c55e;display:inline-block;box-shadow:0 0 5px rgba(34,197,94,0.7);animation:onlinePulse 2s ease-in-out infinite;flex-shrink:0"></span>' : '';
      const delay = Math.min(i * 0.04, 0.6);

      const rankAlpha = rank > 3 ? Math.min(0.03, rank * 0.0005) : 0;
      const rankBg = rank > 3 && !isMe ? ';background:rgb(' + Math.round(248 - rankAlpha*100) + ',' + Math.round(248 - rankAlpha*100) + ',' + Math.round(248 - rankAlpha*100) + ')' : '';
      const realIdx = allPlayers.indexOf(p);
      return '<div class="rank-row' + (isMe?' me':'') + topCls + '" id="' + (isMe?'myRow':'') + '" onclick="showProfile(' + realIdx + ')" style="animation-delay:' + delay + 's' + rankBg + '">'
        + '<div class="row-rank">' + rank + '</div>'
        + '<div class="row-avatar" style="background:' + avatarColor(p.profile.username) + '"><img src="' + avatarForLevel(p.level||1) + '" onerror="this.style.display=\'none\'" style="width:100%;height:100%;object-fit:cover;border-radius:50%"></div>'
        + '<div class="row-info">'
        + '<div class="row-name">' + escapeHtml(p.profile.username) + (isMe?' <span class="me-badge">TOI</span>':'') + onlineDot + '</div>'
        + '<div class="row-grade">' + getGrade(p.level||1) + (online.online ? ' <span class="row-online">🟢 En ligne</span>' : (online.text ? ' <span class="row-lastseen">· ' + online.text + '</span>' : '')) + '</div>'
        + '</div>'
        + '<div class="row-right"><div class="row-score">' + score(p) + '</div><div class="row-trend ' + trend.cls + '">' + trend.txt + '</div></div>'
        + '</div>';
    });

    // Séparateur après rang 10 — dans l'array avant join
    if (result.length > 7) result.splice(7, 0, '<div class="rank-sep">AUTRES DOCKERS</div>'); // après rang 10 (index 6 dans list)
    el.innerHTML = result.join('');

    myRowEl = document.getElementById('myRow');
    document.getElementById('listWrap').style.display = 'block';
    if (firstRender) { el.classList.add('animate'); firstRender = false; } else { el.classList.remove('animate'); }
  }

  // ── Popup profil ──
  function showProfile(idx) {
    const p = allPlayers[idx];
    if (!p) return;
    const isMe = p.user_id === currentUser.id;
    document.getElementById('ppAvatar').src = avatarForLevel(p.level||1);
    document.getElementById('ppName').textContent = p.profile.username;
    document.getElementById('ppGrade').textContent = getGrade(p.level||1).toUpperCase();
    // Dernière activité
    const lsEl = document.getElementById('ppLastSeen');
    const ls = getOnlineStatus(p.profile.last_seen);
    lsEl.textContent = ls.online ? '🟢 En ligne' : (ls.text ? '⏱ ' + ls.text : '');
    // Barre XP
    const lvl = p.level || 1;
    const xp = p.xp || 0;
    const xpNeeded = getXpRequired(lvl);
    const pct = Math.min(Math.round((xp / xpNeeded) * 100), 100);
    document.getElementById('ppXpVal').textContent = xp.toLocaleString('fr-FR') + ' XP';
    document.getElementById('ppXpNext').textContent = '→ Niv. ' + (lvl + 1);
    document.getElementById('ppXpFill').style.width = pct + '%';
    const rankLabels = {1:'#1 LEADER',2:'#2',3:'#3'};
    document.getElementById('ppRankBadge').textContent = rankLabels[idx+1] || '#'+(idx+1);
    const bestRankEl = document.getElementById('ppBestRank');
    if (p.user_id === currentUser.id) {
      const savedBest = parseInt(localStorage.getItem('bestRank_' + currentUser.id) || '9999');
      const best = Math.min(savedBest, idx + 1);
      localStorage.setItem('bestRank_' + currentUser.id, best);
      bestRankEl.innerHTML = 'Meilleur rang : <span>#' + best + '</span>';
    } else {
      bestRankEl.textContent = '';
    }
    document.getElementById('ppLevel').textContent = p.level || 1;
    const m = p.money||0;
    document.getElementById('ppMoney').textContent = m >= 1000000 ? (m/1000000).toFixed(1) + 'M€' : m >= 1000 ? Math.floor(m/1000) + 'k€' : m + '€';
     // Cover du joueur
     var ppCovEl=document.getElementById('ppCoverEl');
     if(ppCovEl){
       var covId=(p.records&&p.records.active_cover)||'port_nuit';
       if(covId!=='port_nuit'){
         var tmp=document.createElement('div');
         tmp.innerHTML=getCoverSVG(covId);
         var ns=tmp.querySelector('svg');
         if(ns)ppCovEl.innerHTML=ns.innerHTML;
       }
     }
    // Trophies et diamonds depuis game_stats (source de vérité)
    document.getElementById('ppPower').textContent = powerScore(p);
    document.getElementById('ppDiamonds').textContent = p.diamonds ?? '—';

    const btn = document.getElementById('ppDefiBtn');
    if (isMe) { btn.style.display = 'none'; }
    else {
      btn.style.display = 'block';
      btn.onclick = function() {
        document.getElementById('popup').style.display = 'none';
        setTimeout(() => defier(idx, p.profile.username), 200);
      };
    }
    // Bouton profil
    const ppMsgBtn = document.getElementById('ppMsgBtn');
    if (ppMsgBtn) {
      if (currentUser && p.user_id === currentUser.id) ppMsgBtn.style.display = 'none';
      else { ppMsgBtn.style.display = 'block'; ppMsgBtn.onclick = () => openMsgOverlay(p); }
    }
    document.getElementById('ppProfilBtn').onclick = function() {
      document.getElementById('popup').style.display = 'none';
      window.location.href = (p.user_id === (currentUser && currentUser.id) ? 'profil.html' : 'profilpublic.html?id=' + p.user_id);
    };
    // Charger le fil de défis
    document.getElementById('popup').style.display = 'flex';
  }

  // ── Fil de défis ──

  function openMsgOverlay(p) {
    _msgTarget = p;
    document.getElementById('msgTo').textContent = 'À : ' + ((p.profile && p.profile.username) || 'Docker');
    document.getElementById('msgInput').value = '';
    document.getElementById('msgCount').textContent = '0/200';
    document.getElementById('msgOverlay').style.display = 'flex';
  }

  async function sendPrivateMsg() {
    if (!_msgTarget || !currentUser) return;
    const msg = (document.getElementById('msgInput').value || '').trim();
    if (!msg) { showToast('✏️ Écris un message'); return; }
    await sb.from('challenges').insert({ from_user_id: currentUser.id, to_user_id: _msgTarget.user_id, message: msg, type: 'message' }).then(()=>{}).catch(()=>{});
    document.getElementById('msgOverlay').style.display = 'none';
    showToast('✉️ Message envoyé !');
  }

  function closePopup(e) {
    if (e.target.id !== 'popup') return;
    const overlay = document.getElementById('popup');
    const sheet = overlay.querySelector('.popup-sheet');
    sheet.style.animation = 'shOut .2s ease forwards';
    overlay.style.animation = 'ovOut .2s ease forwards';
    setTimeout(() => {
      overlay.style.display = 'none';
      sheet.style.animation = '';
      overlay.style.animation = '';
    }, 200);
  }

  // ── Swipe to dismiss popup ──
  (function() {
    let swipeStartY = 0;
    document.addEventListener('touchstart', e => {
      const sheet = e.target.closest('.popup-sheet');
      if (sheet) swipeStartY = e.touches[0].clientY;
    }, { passive: true });
    document.addEventListener('touchmove', e => {
      const sheet = e.target.closest('.popup-sheet');
      if (!sheet || swipeStartY === 0) return;
      const dy = e.touches[0].clientY - swipeStartY;
      if (dy > 0) sheet.style.transform = 'translateY(' + dy + 'px)';
    }, { passive: true });
    document.addEventListener('touchend', e => {
      const sheet = e.target.closest('.popup-sheet');
      if (!sheet || swipeStartY === 0) return;
      const dy = e.changedTouches[0].clientY - swipeStartY;
      swipeStartY = 0;
      if (dy > 80) {
        sheet.style.transform = '';
        closePopup({ target: document.getElementById('popup') });
      } else { sheet.style.transform = ''; }
    }, { passive: true });
  })();



  // ── Trash talk ──
  const TRASH = [
    "Peuchère {name}, t'as vu ton rang ? C'est moi qui t'écrase !",
    "{name} ! Rentre chez toi, le port c'est mon territoire !",
    "Alors {name}, on fait quoi avec son niveau minable ?",
    "Coucou {name} ! Je passe te dire que tu vas rester derrière moi longtemps 😘",
    "{name}, même Gégé fait mieux que toi et il a 70 ans !",
    "Bien essayé {name}, mais le classement c'est moi qui le tiens !",
    "{name} ! Ta place dans le top, c'est pour quand exactement ?",
    "Oh {name}... Courage hein. Il paraît que le bas du classement c'est très bien aussi.",
    "{name}, j'ai vu ta valorisation. Mon bar rapporte plus que ton empire ! 😂",
    "Allez {name}, fais un effort. On s'ennuie là-haut sans compétition.",
  ];
  function defier(idx, name) {
    const msg = TRASH[Math.floor(Math.random() * TRASH.length)].replace(/{name}/g, name);
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;padding:24px;animation:ovIn .2s ease';
    overlay.innerHTML = '<div style="background:#0f172a;border-radius:20px;padding:24px;max-width:320px;width:100%;text-align:center;border:3px solid #cc1a1a;box-shadow:4px 4px 0 #cc1a1a">'
      + '<div style="font-size:40px;margin-bottom:12px">⚔️</div>'
      + '<div style="font-family:\'Bebas Neue\',sans-serif;font-size:16px;color:#fbbf24;letter-spacing:2px;margin-bottom:14px">DÉFI ENVOYÉ !</div>'
      + '<div style="background:#1e293b;border-radius:12px;padding:14px;margin-bottom:16px">'
      + '<div style="font-size:13px;color:white;line-height:1.5;font-style:italic">&laquo; ' + escapeHtml(msg) + ' &raquo;</div>'
      + '</div>'
      + '<div style="font-size:10px;color:rgba(255,255,255,0.3);margin-bottom:16px">Message envoyé à ' + escapeHtml(name) + '</div>'
      + '<button onclick="this.closest(\'div[style]\').remove()" style="width:100%;padding:12px;border:2.5px solid #0f172a;border-radius:10px;background:#fbbf24;color:#0f172a;font-family:\'Bebas Neue\',sans-serif;font-size:16px;letter-spacing:2px;cursor:pointer;box-shadow:2px 2px 0 #0f172a">OK BIEN JOUÉ</button>'
      + '</div>';
    overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };
    document.body.appendChild(overlay);
    // Sauvegarder le défi en base (silencieux si table inexistante)
    const targetPlayer = allPlayers[idx];
    if (targetPlayer && currentUser) {
      sb.from('challenges').insert({
        from_user_id: currentUser.id,
        to_user_id:   targetPlayer.user_id,
        message:      msg,
        created_at:   new Date().toISOString()
      }).then(({ error }) => { /* ignoré si table absente */ });
    }
  }

  async function loadCompanies() {
    const coWrap = document.getElementById('coWrap');
    coWrap.innerHTML = '<div style="text-align:center;padding:20px;font-family:Bebas Neue,sans-serif;font-size:14px;color:#9ca3af;letter-spacing:2px">CHARGEMENT...</div>';
    coWrap.style.display = 'block';

    const { data: cos, error } = await sb.from('companies')
      .select('user_id,nom,name,emoji,color,valeur,niveau')
      .order('valeur', { ascending: false })
      .limit(100);

    if(error || !cos || !cos.length) {
      coWrap.innerHTML = '<div style="text-align:center;padding:40px 16px"><div style="font-size:36px;margin-bottom:8px">🏪</div><div style="font-family:Bebas Neue,sans-serif;font-size:16px;color:#9ca3af;letter-spacing:2px">AUCUNE ENTREPRISE</div></div>';
      return;
    }

    const { data: profs } = await sb.from('profiles').select('user_id,username');
    const pm = {};
    (profs||[]).forEach(p => pm[p.user_id] = p.username || 'Docker');

    const fmtV = v => v>=1000000?(v/1000000).toFixed(1)+'M€':v>=1000?Math.floor(v/1000)+'k€':v+'€';
    const myId = currentUser ? currentUser.id : null;
    const medals = ['🥇','🥈','🥉'];

    let html = '';
    cos.forEach(function(co, i) {
      const isMe = co.user_id === myId;
      const nom = co.nom || co.name || 'Entreprise';
      const owner = pm[co.user_id] || 'Docker';
      const medal = i < 3 ? medals[i] : '';
      html += '<div style="display:flex;align-items:center;gap:12px;background:white;border-radius:14px;padding:13px 16px;margin:6px 12px;'
        + (isMe ? 'border:2px solid #cc1a1a;' : 'border:1px solid #f0f0f0;')
        + (i < 3 ? 'box-shadow:0 2px 8px rgba(0,0,0,0.06);' : '') + '">'
        + '<div style="font-family:Bebas Neue,sans-serif;font-size:16px;color:#d1d5db;min-width:28px;text-align:center">' + (medal || (i+1)) + '</div>'
        + '<div style="font-size:28px">' + (co.emoji || '🏪') + '</div>'
        + '<div style="flex:1;min-width:0">'
        + '<div style="font-family:Bebas Neue,sans-serif;font-size:15px;letter-spacing:1px;color:' + (isMe?'#cc1a1a':'#1a1a1a') + ';white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + nom + (isMe?' 👈':'') + '</div>'
        + '<div style="font-size:10px;color:#9ca3af;margin-top:2px">' + owner + ' · Niv.' + (co.niveau||1) + '</div>'
        + '</div>'
        + '<div style="text-align:right;flex-shrink:0">'
        + '<div style="font-family:Bebas Neue,sans-serif;font-size:17px;color:#1a1a1a">' + fmtV(co.valeur||0) + '</div>'
        + '<div style="font-size:8px;font-weight:700;color:#9ca3af;letter-spacing:1px">VALEUR</div>'
        + '</div>'
        + '</div>';
    });

    coWrap.innerHTML = html;
  }

  async function init() {
    // Écouter les erreurs de token expiré
    sb.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_OUT' || event === 'TOKEN_REFRESHED' && !session) {
        window.location.href = 'index.html';
      }
    });

    const { data, error } = await sb.auth.getSession();
    if (error || !data.session) {
      // Token invalide ou absent → nettoyer et rediriger
      await sb.auth.signOut().catch(() => {});
      window.location.href = 'index.html';
      return;
    }
    currentUser = data.session.user;
    const updateLastSeen = () => sb.from('profiles').update({ last_seen: new Date().toISOString() }).eq('user_id', currentUser.id);
    updateLastSeen();
    setInterval(updateLastSeen, 60000); // Rafraîchir toutes les 60s
    loadRanking();
    setupRealtime();
  }
  function setupRealtime() {
    // Écoute les changements sur game_stats (niveau, xp, argent)
    sb.channel('classement-stats')
      .on('postgres_changes', {
        event: 'UPDATE',
        schema: 'public',
        table: 'game_stats'
      }, payload => {
        // Mettre à jour le joueur dans allPlayers sans tout recharger
        const idx = allPlayers.findIndex(p => p.user_id === payload.new.user_id);
        if (idx >= 0) {
          allPlayers[idx] = { ...allPlayers[idx], ...payload.new };
          applyFilter();
        } else {
          // Nouveau joueur — recharger tout
          loadRanking();
        }
      })
      .subscribe();

    // Écoute les changements sur profiles (last_seen, username, avatar)
    sb.channel('classement-profiles')
      .on('postgres_changes', {
        event: 'UPDATE',
        schema: 'public',
        table: 'profiles'
      }, payload => {
        const idx = allPlayers.findIndex(p => p.user_id === payload.new.user_id);
        if (idx >= 0) {
          allPlayers[idx].profile = { ...allPlayers[idx].profile, ...payload.new };
          applyFilter();
        }
      })
      .subscribe();
  }

  init();
</script>
