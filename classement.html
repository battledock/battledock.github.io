<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Classement - Battle Dock</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(180deg,#03080f 0%,#060e1c 55%,#030508 100%);
      min-height: 100dvh;
      display: flex; flex-direction: column;
    }

    /* ── Hero nuit port ── */
    .page-header {
      padding: calc(16px + env(safe-area-inset-top)) 16px 20px;
      text-align: center;
      position: relative; z-index: 2;
    }
    .back-btn { display: none; }
    .page-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 26px; letter-spacing: 4px; color: #fff;
    }
    .hero-sub {
      font-size: 9px; color: rgba(255,255,255,0.2); letter-spacing: 2px; margin-top: 3px;
    }
    /* Stats 3 colonnes dans le hero */
    .hero-stats {
      display: flex; justify-content: center; gap: 0;
      margin-top: 14px; border-top: 1px solid rgba(255,255,255,0.07); padding-top: 14px;
    }
    .hero-stat { flex: 1; text-align: center; }
    .hero-stat-val { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: #fff; line-height: 1; }
    .hero-stat-val.gold { color: #fbbf24; }
    .hero-stat-lbl { font-size: 8px; color: rgba(255,255,255,0.2); font-weight: 700; letter-spacing: 1px; margin-top: 2px; }

    /* ── Feuille blanche ── */
    .sheet {
      flex: 1;
      background: #fff;
      border-radius: 22px 22px 0 0;
      padding: 0 0 32px;
      margin-top: 8px;
      position: relative; z-index: 2;
    }

    /* ── Tabs dans la feuille ── */
    .tabs {
      display: flex;
      padding: 0 16px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    .tab {
      flex: 1; padding: 13px 8px;
      background: none; border: none;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 13px; letter-spacing: 1px;
      color: rgba(0,0,0,0.3); cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s; text-align: center;
    }
    .tab.active { color: #1a1a1a; border-bottom-color: #1a1a1a; }

    /* ── Mon rang ── */
    .my-rank-banner {
      margin: 12px 14px 8px;
      background: #f8f8f8;
      border: 1px solid rgba(0,0,0,0.07);
      border-radius: 12px;
      padding: 11px 14px;
      display: flex; align-items: center; gap: 12px;
    }
    .my-rank-num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 26px; color: #d4af37; letter-spacing: 1px; min-width: 48px;
    }
    .my-rank-info { flex: 1; }
    .my-rank-label { font-size: 8px; color: rgba(0,0,0,0.25); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
    .my-rank-val { font-family: 'Bebas Neue', sans-serif; font-size: 16px; color: #1a1a1a; letter-spacing: 0.5px; }

    /* ── Liste ── */
    .list-wrap { padding: 0 14px; }

    /* ── Bouton retour bas ── */
    .back-bottom {
      display: block; width: calc(100% - 28px); margin: 16px 14px 0;
      padding: 13px; border-radius: 12px; cursor: pointer;
      background: #f8f8f8; border: 1px solid rgba(0,0,0,0.07);
      color: rgba(0,0,0,0.35); font-family: 'Bebas Neue', sans-serif;
      font-size: 15px; letter-spacing: 2px;
    }

    /* TOP 3 */
    .podium {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .podium-item {
      background: #f8f8f8;
      border: 1px solid rgba(0,0,0,0.06);
      border-radius: 14px;
      padding: 14px 8px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.15s;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
      position: relative;
      overflow: hidden;
    }
    .podium-item:active { transform: scale(0.96); }

    .podium-item.rank-1 { border-color: rgba(212,175,55,0.4); box-shadow: 0 2px 12px rgba(212,175,55,0.15); }
    .podium-item.rank-2 { border-color: rgba(160,160,175,0.4); }
    .podium-item.rank-3 { border-color: rgba(180,120,60,0.3); }

    .podium-stripe {
      position: absolute; top:0; left:0; right:0; height:3px;
    }
    .rank-1 .podium-stripe { background: linear-gradient(90deg, #d4af37, #f5d060, #d4af37); }
    .rank-2 .podium-stripe { background: linear-gradient(90deg, #9e9e9e, #c8c8c8, #9e9e9e); }
    .rank-3 .podium-stripe { background: linear-gradient(90deg, #cd7f32, #e8a96a, #cd7f32); }

    .podium-medal { font-size: 18px; margin-bottom: 8px; }

    .podium-avatar {
      width: 46px; height: 46px; border-radius: 50%;
      overflow: hidden; margin: 0 auto 8px;
      border: 2px solid #e5e7eb;
      background: #f3f4f6;
    }
    .rank-1 .podium-avatar { border-color: rgba(212,175,55,0.5); }
    .podium-avatar img { width:100%; height:100%; object-fit:cover; }

    .podium-name {
      font-weight: 700; font-size: 11px; color: #1a1a1a;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 2px;
    }
    .podium-score {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 13px; letter-spacing: 0.5px;
    }
    .rank-1 .podium-score { color: #d4af37; }
    .rank-2 .podium-score { color: #9e9e9e; }
    .rank-3 .podium-score { color: #cd7f32; }

    /* LIGNES */
    .rank-rows { display: flex; flex-direction: column; gap: 6px; }

    .rank-row {
      background: #f8f8f8;
      border: 1px solid rgba(0,0,0,0.06);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .rank-row:active { transform: scale(0.99); background: #f9fafb; }
    .rank-row.me { border-color: rgba(212,175,55,0.35); background: rgba(212,175,55,0.04); }

    .row-num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px; color: #d1d5db;
      min-width: 28px; text-align: center;
    }
    .rank-row.me .row-num { color: #d4af37; }

    .row-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      overflow: hidden; flex-shrink: 0;
      border: 1.5px solid #e5e7eb;
      background: #f3f4f6;
    }
    .row-avatar img { width:100%; height:100%; object-fit:cover; }

    .row-info { flex: 1; min-width: 0; }
    .row-name { font-weight: 700; font-size: 13px; color: #1a1a1a; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .row-grade { font-size: 10px; color: #9ca3af; margin-top: 1px; }

    .row-score {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px; color: #6b7280; letter-spacing: 0.5px;
      text-align: right; flex-shrink: 0;
    }
    .rank-row.me .row-score { color: #d4af37; }

    /* TOP 3 en ligne */
    .rank-row.top-1 { border-color: rgba(212,175,55,0.45); background: linear-gradient(90deg, rgba(212,175,55,0.08), #ffffff 60%); box-shadow: 0 2px 12px rgba(212,175,55,0.15); }
    .rank-row.top-2 { border-color: rgba(160,160,175,0.45); background: linear-gradient(90deg, rgba(160,160,175,0.10), #ffffff 60%); }
    .rank-row.top-3 { border-color: rgba(205,127,50,0.4);  background: linear-gradient(90deg, rgba(205,127,50,0.10), #ffffff 60%); }
    .rank-row.top-1 .row-num, .rank-row.top-2 .row-num, .rank-row.top-3 .row-num { font-size: 20px; }
    .rank-row.top-1 .row-score { color: #d4af37; }
    .rank-row.top-2 .row-score { color: #9e9e9e; }
    .rank-row.top-3 .row-score { color: #cd7f32; }
    .rank-row.top-1 .row-avatar { border-color: rgba(212,175,55,0.6); }
    .rank-row.top-2 .row-avatar { border-color: rgba(160,160,175,0.6); }
    .rank-row.top-3 .row-avatar { border-color: rgba(205,127,50,0.5); }

    /* ===================== LOADER ===================== */
    .loader { text-align:center; padding:60px 20px; }
    .loader-icon { font-size:32px; opacity:0.3; animation:lPulse 1.5s ease-in-out infinite; }
    @keyframes lPulse { 0%,100%{opacity:0.2;transform:scale(0.95)} 50%{opacity:0.5;transform:scale(1.05)} }
    .loader-txt { font-size:11px; color:#9ca3af; margin-top:10px; letter-spacing:1px; }

    /* ===================== POPUP PROFIL ===================== */
    .popup-overlay {
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(0,0,0,0.5);
      display: flex; align-items: flex-end;
      animation: overlayIn 0.2s ease;
    }
    @keyframes overlayIn { from{opacity:0} to{opacity:1} }

    .popup-card {
      width: 100%;
      background: white;
      border-radius: 20px 20px 0 0;
      padding: 24px 20px 40px;
      animation: cardUp 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes cardUp { from{transform:translateY(100%)} to{transform:translateY(0)} }

    .popup-handle {
      width: 40px; height: 4px;
      background: #e5e7eb; border-radius: 2px;
      margin: 0 auto 20px;
    }

    .popup-header {
      display: flex; align-items: center; gap: 16px;
      margin-bottom: 20px;
    }

    .popup-avatar {
      width: 64px; height: 64px; border-radius: 50%;
      overflow: hidden; flex-shrink: 0;
      border: 3px solid #e5e7eb;
      background: #f3f4f6;
    }
    .popup-avatar img { width:100%; height:100%; object-fit:cover; }

    .popup-info { flex: 1; }
    .popup-name { font-family:'Bebas Neue',sans-serif; font-size:24px; letter-spacing:2px; color:#1a1a1a; }
    .popup-grade { font-size:12px; color:#b8962e; font-weight:700; margin-top:2px; }
    .popup-rank { font-size:11px; color:#9ca3af; margin-top:2px; }
    .popup-bio { font-size:12px; color:#6b7280; margin-top:6px; font-style:italic; }

    .popup-stats {
      display: grid; grid-template-columns: repeat(3,1fr);
      gap: 10px; margin-bottom: 20px;
    }

    .popup-stat {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 12px 8px;
      text-align: center;
    }
    .ps-icon { font-size: 20px; margin-bottom: 4px; }
    .ps-val { font-family:'Bebas Neue',sans-serif; font-size:18px; color:#1a1a1a; letter-spacing:0.5px; }
    .ps-lbl { font-size:9px; color:#9ca3af; text-transform:uppercase; letter-spacing:0.5px; font-weight:700; margin-top:1px; }

    .popup-close {
      width: 100%;
      background: #1a1a1a; color: white;
      border: none; border-radius: 12px;
      padding: 14px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px; letter-spacing: 1px;
      cursor: pointer;
    }
  
    /* FLUIDITÉ GLOBALE */
    * { -webkit-font-smoothing:antialiased; }
    button, .nav-card, .row, .rank-row, .obj-card, .item-card, .stat-card, .card, .feature-card {
      transition: transform 0.15s ease, opacity 0.15s ease, box-shadow 0.15s ease !important;
    }
    button:active, .nav-card:active, .row:active {
      transform: scale(0.97) !important;
      opacity: 0.9 !important;
    }
    img { transition: opacity 0.3s ease; }
    input, textarea { transition: border-color 0.2s ease, background 0.2s ease; }

  </style>
</head>
<body>

  <!-- HERO NUIT PORT -->
  <canvas id="starsCanvas" style="position:fixed;top:0;left:0;width:100%;height:200px;z-index:1;pointer-events:none"></canvas>
  <div class="page-header" style="position:relative;z-index:2">
    <div class="page-title">CLASSEMENT</div>
    <div class="hero-sub">PORT DE MARSEILLE</div>
    <div class="hero-stats" id="heroStats" style="display:none">
      <div class="hero-stat"><div class="hero-stat-val gold" id="heroMyRank">#—</div><div class="hero-stat-lbl">TON RANG</div></div>
      <div class="hero-stat"><div class="hero-stat-val" id="heroLeader">—</div><div class="hero-stat-lbl">LEADER</div></div>
      <div class="hero-stat"><div class="hero-stat-val" id="heroTotal">—</div><div class="hero-stat-lbl">JOUEURS</div></div>
    </div>
  </div>

  <!-- FEUILLE BLANCHE -->
  <div class="sheet">
    <!-- TABS -->
    <div class="tabs" id="tabs">
      <div class="tab active" id="tab-level" onclick="switchTab('level')">Niveau</div>
      <div class="tab" id="tab-money" onclick="switchTab('money')">Fortune</div>
      <div class="tab" id="tab-entreprises" onclick="switchTab('entreprises')">Entreprises</div>
    </div>

    <!-- MON RANG -->
    <div class="my-rank-banner" id="myRankBanner" style="display:none">
      <div class="my-rank-num" id="myRankNum">#-</div>
      <div class="my-rank-info">
        <div class="my-rank-label">Ton classement</div>
        <div class="my-rank-val" id="myRankVal">--</div>
      </div>
    </div>

    <!-- LOADER -->
    <div class="loader" id="loader">
      <div class="loader-icon">🏆</div>
      <div class="loader-txt">Chargement...</div>
    </div>

    <!-- LISTE -->
    <div class="list-wrap" id="listWrap" style="display:none">
      <div class="podium" id="podium"></div>
      <div class="rank-rows" id="rankRows"></div>
    </div>

    <!-- RETOUR -->
    <button class="back-bottom" onclick="window.location.href='game.html'">← RETOUR AU JEU</button>
  </div>

  <!-- POPUP -->
  <div class="popup-overlay" id="popup" style="display:none" onclick="closePopup(event)">
    <div class="popup-card">
      <div class="popup-handle"></div>
      <div class="popup-header">
        <div class="popup-avatar"><img id="ppAvatar" src="avatar-default.png"></div>
        <div class="popup-info">
          <div class="popup-name" id="ppName">--</div>
          <div class="popup-grade" id="ppGrade">--</div>
          <div class="popup-rank" id="ppRank">--</div>
          <div id="ppCompany" style="display:none;margin:8px auto 0"></div>
        <div class="popup-bio" id="ppBio" style="display:none"></div>
        </div>
      </div>
      <div class="popup-stats">
        <div class="popup-stat">
          <div class="ps-icon">⭐</div>
          <div class="ps-val" id="ppLevel">-</div>
          <div class="ps-lbl">Niveau</div>
        </div>
        <div class="popup-stat">
          <div class="ps-icon">💰</div>
          <div class="ps-val" id="ppMoney">-</div>
          <div class="ps-lbl">Argent</div>
        </div>
        <div class="popup-stat">
          <div class="ps-icon">🏆</div>
          <div class="ps-val" id="ppTrophies">-</div>
          <div class="ps-lbl">Trophées</div>
        </div>
      </div>
      <button class="popup-close" onclick="document.getElementById('popup').style.display='none'">Fermer</button>
    </div>
  </div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const sb = createClient(supabaseUrl, supabaseKey);

    let currentUser = null;
    let currentTab = 'level';
    let allPlayers = [];

    const SPECIAL_AV = ['avatar-millionaire.png','avatar-completionist.png'];
    function avatarForLevel(lvl){
      if(lvl>=50)return 'avatar-level-50.png'; if(lvl>=30)return 'avatar-level-30.png';
      if(lvl>=20)return 'avatar-level-20.png'; if(lvl>=17)return 'avatar-level-17.png';
      if(lvl>=15)return 'avatar-level-15.png'; if(lvl>=13)return 'avatar-level-13.png';
      if(lvl>=10)return 'avatar-level-10.png'; if(lvl>=5)return 'avatar-level-5.png';
      if(lvl>=4)return 'avatar-level-4.png';  if(lvl>=3)return 'avatar-level-3.png';
      if(lvl>=2)return 'avatar-level-2.png';  return 'avatar-default.png';
    }
    function avatarOf(p){ const a=p.profile&&p.profile.avatar_url; if(SPECIAL_AV.includes(a)) return a; return avatarForLevel(p.level||1); }

    function getGrade(l) {
      if (!l||l<=4)  return 'Docker Occasionnel';
      if (l<=14) return 'Docker';
      if (l<=29) return 'Docker Mensuel';
      if (l<=49) return 'Contre-Maître';
      if (l<=79) return 'Chef de Quai';
      return 'Magnat du Port';
    }

    // Étoiles canvas
  (function(){
    const cv = document.getElementById('starsCanvas');
    if (!cv) return;
    cv.width = window.innerWidth; cv.height = 200;
    const ctx = cv.getContext('2d');
    for(let i=0;i<50;i++){
      ctx.beginPath();
      ctx.arc(Math.random()*cv.width, Math.random()*200, Math.random()*0.8+0.2, 0, Math.PI*2);
      ctx.fillStyle = `rgba(255,255,255,${Math.random()*0.6+0.1})`;
      ctx.fill();
    }
  })();

  async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { window.location.href = 'index.html'; return; }
      currentUser = session.user;
      sb.from('profiles').update({ last_seen: new Date().toISOString() }).eq('user_id', currentUser.id);
      loadRanking();
    }

    async function loadRanking() {
      document.getElementById('loader').style.display = 'block';
      document.getElementById('listWrap').style.display = 'none';
      document.getElementById('myRankBanner').style.display = 'none';

      const { data: stats } = await sb
        .from('game_stats')
        .select('user_id, money, level, xp, commerce')
        .order(currentTab === 'level' ? 'level' : 'money', { ascending: false });

      if (!stats?.length) { document.getElementById('loader').style.display = 'none'; return; }

      const { data: profiles } = await sb
        .from('profiles')
        .select('user_id, username, avatar_url, trophies, last_seen')
        .in('user_id', stats.map(s => s.user_id));

      allPlayers = stats.map(s => ({
        ...s,
        profile: profiles?.find(p => p.user_id === s.user_id) || { username: 'Docker', avatar_url: 'avatar-default.png', trophies: 0 }
      }));

      if (currentTab === 'entreprises') {
        allPlayers = allPlayers
          .filter(p => p.commerce && p.commerce.company && p.commerce.company.name)
          .sort((a, b) => bizValuation(b.commerce) - bizValuation(a.commerce));
      }

      document.getElementById('loader').style.display = 'none';

      // Mon rang + hero stats
      const myIdx = allPlayers.findIndex(p => p.user_id === currentUser.id);
      if (myIdx >= 0) {
        const me = allPlayers[myIdx];
        document.getElementById('myRankNum').textContent = '#' + (myIdx+1);
        document.getElementById('myRankVal').textContent =
          currentTab === 'level' ? `Niveau ${me.level||1} — ${getGrade(me.level||1)}`
          : currentTab === 'entreprises' ? `${bizValuation(me.commerce).toLocaleString('fr-FR')} € de valorisation`
          : `${(me.money||0).toLocaleString('fr-FR')}€`;
        document.getElementById('myRankBanner').style.display = 'flex';
        // Hero stats
        const heroMyRank = document.getElementById('heroMyRank');
        const heroLeader = document.getElementById('heroLeader');
        const heroTotal  = document.getElementById('heroTotal');
        const heroStats  = document.getElementById('heroStats');
        if (heroMyRank) heroMyRank.textContent = '#' + (myIdx+1);
        if (heroLeader && allPlayers[0]) {
          const { data: lp } = await sb.from('profiles').select('username').eq('user_id', allPlayers[0].user_id).maybeSingle().catch(()=>({data:null}));
          heroLeader.textContent = lp?.username || 'Docker';
        }
        if (heroTotal) heroTotal.textContent = allPlayers.length;
        if (heroStats) heroStats.style.display = 'flex';
      }

      document.getElementById('podium').style.display = 'none';
      renderRows(allPlayers, 1);
      document.getElementById('listWrap').style.display = 'block';
    }

    function score(p) {
      if (currentTab === 'entreprises') return `${bizValuation(p.commerce).toLocaleString('fr-FR')}€`;
      return currentTab === 'level'
        ? `Niv. ${p.level||1}`
        : `${(p.money||0).toLocaleString('fr-FR')}€`;
    }
    function bizValuation(com){ if(!com||!com.company||!com.company.name) return 0; const l=com.company.level||1; const iph=l*2000*(com.ipo?1.5:1); return iph*150; }
    function escapeHtml(t){ return (t||'').replace(/[<>&"]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }

    function renderPodium(top) {
      const el = document.getElementById('podium');
      const medals = ['🥇','🥈','🥉'];
      const classes = ['rank-1','rank-2','rank-3'];
      el.innerHTML = top.map((p,i) => `
        <div class="podium-item ${classes[i]}" onclick="showProfile(${i})">
          <div class="podium-stripe"></div>
          <div class="podium-medal">${medals[i]}</div>
          <div class="podium-avatar"><img src="${avatarOf(p)}"></div>
          <div class="podium-name">${p.profile.username}</div>
          <div class="podium-score">${score(p)}</div>
        </div>`).join('');
    }

    function getOnlineStatus(lastSeen) {
      if (!lastSeen) return { online: false, text: '' };
      const diff = Math.floor((Date.now() - new Date(lastSeen)) / 1000);
      if (diff < 300)   return { online: true,  text: 'En ligne' };
      if (diff < 3600)  return { online: false, text: `il y a ${Math.floor(diff/60)}min` };
      if (diff < 86400) return { online: false, text: `il y a ${Math.floor(diff/3600)}h` };
      return { online: false, text: `il y a ${Math.floor(diff/86400)}j` };
    }

    function renderRows(players, startRank) {
      const el = document.getElementById('rankRows');
      if (!players.length) { el.innerHTML = '<div style="text-align:center;padding:40px 16px;color:#9ca3af">Aucune entreprise pour l\'instant.<br>Crée la tienne dans « Mon Entreprise » !</div>'; return; }
      const medals = { 1:'🥇', 2:'🥈', 3:'🥉' };
      el.innerHTML = players.map((p, i) => {
        const rank = startRank + i;
        const isMe = p.user_id === currentUser.id;
        const idx = rank - 1;
        const topCls = rank <= 3 ? ' top-' + rank : '';
        const numDisplay = medals[rank] || rank;
        if (currentTab === 'entreprises') {
          const co = p.commerce.company;
          return `
          <div class="rank-row ${isMe?'me':''}${topCls}" onclick="showProfile(${idx})">
            <div class="row-num">${numDisplay}</div>
            <div class="row-avatar" style="background:${co.color||'#d97706'};display:flex;align-items:center;justify-content:center;font-size:22px">${co.logo||'🏢'}</div>
            <div class="row-info">
              <div class="row-name" style="display:flex;align-items:center;gap:6px">${escapeHtml(co.name)}${co.ipo?' 📈':''}${isMe?' 👈':''}</div>
              <div class="row-grade">${escapeHtml(co.type||'Entreprise')} · par ${escapeHtml(p.profile.username)}</div>
            </div>
            <div class="row-score">${score(p)}</div>
          </div>`;
        }
        const _co = (p.commerce && p.commerce.company && p.commerce.company.name) ? p.commerce.company : null;
        return `
          <div class="rank-row ${isMe?'me':''}${topCls}" onclick="showProfile(${idx})">
            <div class="row-num">${numDisplay}</div>
            <div class="row-avatar"><img src="${avatarOf(p)}"></div>
            <div class="row-info">
              <div class="row-name" style="display:flex;align-items:center;gap:6px">
                ${p.profile.username}${isMe?' 👈':''}
                ${getOnlineStatus(p.profile.last_seen).online ? '<span style="width:7px;height:7px;border-radius:50%;background:#22c55e;display:inline-block;box-shadow:0 0 5px rgba(34,197,94,0.7);animation:onlinePulse 2s ease-in-out infinite"></span>' : ''}
              </div>
              <div class="row-grade" style="display:flex;align-items:center;gap:5px;flex-wrap:wrap">
                ${getGrade(p.level||1)}
                ${!getOnlineStatus(p.profile.last_seen).online && getOnlineStatus(p.profile.last_seen).text ? `<span style="font-size:10px;color:#9ca3af">${getOnlineStatus(p.profile.last_seen).text}</span>` : ''}
                ${_co ? `<span style="display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;color:#fff;background:${_co.color||'#d97706'};padding:1px 7px;border-radius:10px">${_co.logo||'🏢'} ${escapeHtml(_co.name)}</span>` : ''}
              </div>
            </div>
            <div class="row-score">${score(p)}</div>
          </div>`;
      }).join('');
    }

    function showProfile(idx) {
      const p = allPlayers[idx];
      if (!p) return;
      document.getElementById('ppAvatar').src   = avatarOf(p);
      document.getElementById('ppName').textContent  = p.profile.username;
      document.getElementById('ppGrade').textContent = getGrade(p.level||1);
      document.getElementById('ppRank').textContent  = `#${idx+1} au classement`;
      document.getElementById('ppLevel').textContent = p.level || 1;
      document.getElementById('ppMoney').textContent = ((p.money||0) >= 1000)
        ? Math.floor((p.money||0)/1000) + 'k€'
        : (p.money||0) + '€';
      document.getElementById('ppTrophies').textContent = p.profile.trophies || 0;
      const _co = (p.commerce && p.commerce.company && p.commerce.company.name) ? p.commerce.company : null;
      const _coEl = document.getElementById('ppCompany');
      if (_coEl) {
        if (_co) {
          _coEl.style.cssText = 'display:inline-flex;align-items:center;gap:5px;margin:8px auto 0;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:700;color:#fff;background:'+(_co.color||'#d97706');
          _coEl.innerHTML = '';
          const s1=document.createElement('span'); s1.textContent=_co.logo||'🏢';
          const s2=document.createElement('span'); s2.textContent=_co.name+(_co.ipo?' 📈':'');
          _coEl.appendChild(s1); _coEl.appendChild(s2);
        } else { _coEl.style.display='none'; }
      }
      document.getElementById('popup').style.display = 'flex';
    }

    function closePopup(e) {
      if (e.target.id === 'popup') document.getElementById('popup').style.display = 'none';
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      const a = document.getElementById('tab-' + tab); if (a) a.classList.add('active');
      loadRanking();
    }

    init();
  </script>
</body>
</html>
