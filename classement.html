<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Classement - Battle Dock</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    body { font-family:'Inter',sans-serif; background:#0f0f1a; min-height:100vh; color:white; }

    /* TOPBAR */
    .topbar {
      background:rgba(255,255,255,0.05);
      backdrop-filter:blur(10px);
      padding:16px;
      display:flex;
      align-items:center;
      gap:12px;
      border-bottom:1px solid rgba(255,255,255,0.1);
      position:sticky;
      top:0;
      z-index:100;
    }

    .back-btn {
      width:40px; height:40px;
      background:rgba(255,255,255,0.1);
      border:1px solid rgba(255,255,255,0.15);
      border-radius:10px;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer;
      transition:all 0.2s;
      color:white; font-size:18px;
    }
    .back-btn:hover { background:rgba(255,255,255,0.2); transform:translateX(-2px); }

    .topbar-title { flex:1; font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:1px; text-align:center; }

    /* TABS */
    .tabs {
      display:flex;
      gap:8px;
      padding:16px 16px 0;
      max-width:600px;
      margin:0 auto;
    }

    .tab {
      flex:1; padding:10px 8px;
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:10px;
      font-family:'Bebas Neue',sans-serif;
      font-size:14px; letter-spacing:1px;
      color:rgba(255,255,255,0.5);
      cursor:pointer; transition:all 0.2s;
      text-align:center;
    }

    .tab.active {
      background:linear-gradient(135deg,#7c3aed,#4f46e5);
      border-color:#7c3aed;
      color:white;
      box-shadow:0 4px 12px rgba(124,58,237,0.4);
    }

    /* CONTAINER */
    .container { max-width:600px; margin:0 auto; padding:16px; }

    /* PODIUM */
    .podium {
      display:flex;
      align-items:flex-end;
      justify-content:center;
      gap:8px;
      margin-bottom:24px;
      padding:20px 0 0;
    }

    .podium-item { flex:1; max-width:120px; text-align:center; }
    .podium-item.second { order:1; }
    .podium-item.first { order:2; }
    .podium-item.third { order:3; }

    .podium-pedestal {
      border-radius:8px 8px 0 0;
      padding:12px 8px;
      margin-top:12px;
    }

    .podium-item.first .podium-pedestal { background:linear-gradient(135deg,#f59e0b,#d97706); height:80px; }
    .podium-item.second .podium-pedestal { background:linear-gradient(135deg,#6b7280,#4b5563); height:60px; }
    .podium-item.third .podium-pedestal { background:linear-gradient(135deg,#92400e,#78350f); height:44px; }

    .podium-avatar {
      width:56px; height:56px;
      border-radius:50%;
      margin:0 auto 6px;
      background:linear-gradient(135deg,#7c3aed,#4f46e5);
      border:3px solid rgba(255,255,255,0.3);
      overflow:hidden;
      position:relative;
    }

    .podium-item.first .podium-avatar { width:72px; height:72px; border-color:#fbbf24; box-shadow:0 0 20px rgba(251,191,36,0.4); }

    .podium-avatar img { width:100%; height:100%; object-fit:cover; }

    .podium-medal { font-size:20px; margin-bottom:4px; }
    .podium-name { font-weight:700; font-size:12px; color:white; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .podium-score { font-family:'Bebas Neue',sans-serif; font-size:16px; color:rgba(255,255,255,0.9); }
    .podium-grade { font-size:10px; color:rgba(255,255,255,0.6); margin-top:2px; }

    /* RANKING LIST */
    .ranking-list { display:flex; flex-direction:column; gap:8px; }

    .ranking-item {
      display:flex;
      align-items:center;
      gap:12px;
      padding:12px 16px;
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:12px;
      transition:all 0.2s;
    }

    .ranking-item.me {
      background:rgba(124,58,237,0.2);
      border-color:rgba(124,58,237,0.4);
    }

    .ranking-item:hover { background:rgba(255,255,255,0.08); }

    .rank-number {
      width:32px;
      font-family:'Bebas Neue',sans-serif;
      font-size:20px;
      color:rgba(255,255,255,0.4);
      text-align:center;
      flex-shrink:0;
    }

    .rank-number.top3 { color:#fbbf24; }
    .ranking-item.me .rank-number { color:#a78bfa; }

    .ranking-avatar {
      width:44px; height:44px;
      border-radius:50%;
      background:linear-gradient(135deg,#7c3aed,#4f46e5);
      border:2px solid rgba(255,255,255,0.1);
      overflow:hidden;
      flex-shrink:0;
    }
    .ranking-avatar img { width:100%; height:100%; object-fit:cover; }

    .ranking-info { flex:1; min-width:0; }
    .ranking-name { font-weight:600; font-size:14px; color:white; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .ranking-grade { font-size:11px; color:rgba(255,255,255,0.5); margin-top:2px; }

    .ranking-right { text-align:right; flex-shrink:0; }
    .ranking-score { font-family:'Bebas Neue',sans-serif; font-size:18px; color:#a78bfa; letter-spacing:1px; }
    .ranking-item.me .ranking-score { color:#10b981; }
    .ranking-level { font-size:11px; color:rgba(255,255,255,0.4); margin-top:2px; }

    /* MY RANK BANNER */
    .my-rank-banner {
      background:linear-gradient(135deg,rgba(124,58,237,0.3),rgba(79,70,229,0.3));
      border:1px solid rgba(124,58,237,0.4);
      border-radius:12px;
      padding:12px 16px;
      margin-bottom:16px;
      display:flex;
      align-items:center;
      gap:12px;
    }

    .my-rank-label { font-size:12px; color:rgba(255,255,255,0.6); text-transform:uppercase; letter-spacing:1px; }
    .my-rank-value { font-family:'Bebas Neue',sans-serif; font-size:28px; color:#a78bfa; letter-spacing:2px; }
    .my-rank-score { font-size:13px; color:rgba(255,255,255,0.7); }

    /* LOADER */
    .loader { text-align:center; padding:60px 20px; }
    .spinner { width:40px; height:40px; border:3px solid rgba(255,255,255,0.1); border-top-color:#7c3aed; border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 16px; }
    @keyframes spin { to{transform:rotate(360deg)} }
    .loader-text { font-size:14px; color:rgba(255,255,255,0.4); }

    /* EMPTY */
    .empty-state { text-align:center; padding:60px 20px; }
    .empty-icon { font-size:64px; margin-bottom:16px; opacity:0.4; }
    .empty-text { font-size:14px; color:rgba(255,255,255,0.4); }

    /* SECTION TITLE */
    .section-title {
      font-family:'Bebas Neue',sans-serif;
      font-size:14px;
      letter-spacing:2px;
      color:rgba(255,255,255,0.4);
      text-transform:uppercase;
      margin-bottom:12px;
      margin-top:4px;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <button class="back-btn" onclick="window.location.href='game.html'">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <div class="topbar-title">🏆 Classement</div>
    <div style="width:40px"></div>
  </div>

  <div class="container">

    <!-- TABS -->
    <div class="tabs">
      <div class="tab active" id="tab-level" onclick="switchTab('level')">Par Niveau</div>
      <div class="tab" id="tab-money" onclick="switchTab('money')">Par Argent</div>
    </div>

    <!-- LOADER -->
    <div class="loader" id="loader">
      <div class="spinner"></div>
      <div class="loader-text">Chargement du classement...</div>
    </div>

    <!-- MY RANK -->
    <div class="my-rank-banner" id="myRank" style="display:none;">
      <div style="font-size:32px;">👤</div>
      <div style="flex:1;">
        <div class="my-rank-label">Ton classement</div>
        <div class="my-rank-value" id="myRankValue">#--</div>
        <div class="my-rank-score" id="myRankScore">--</div>
      </div>
    </div>

    <!-- PODIUM -->
    <div class="podium" id="podium" style="display:none;"></div>

    <!-- RESTE DU CLASSEMENT -->
    <div class="section-title" id="restTitle" style="display:none;">Suite du classement</div>
    <div class="ranking-list" id="rankingList" style="display:none;"></div>

    <div class="empty-state" id="emptyState" style="display:none;">
      <div class="empty-icon">🏆</div>
      <div class="empty-text">Aucun joueur pour le moment</div>
    </div>

  </div>

  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const sb = createClient(supabaseUrl, supabaseKey);

    let currentUser = null;
    let currentTab = 'level';

    function getGrade(level) {
      if (level <= 4) return 'Docker Occasionnel';
      if (level <= 14) return 'Docker';
      if (level <= 29) return 'Docker Mensuel';
      if (level <= 49) return 'Contre-Maître';
      if (level <= 79) return 'Chef de Quai';
      return 'Magnat du Port';
    }

    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { window.location.href = 'index.html'; return; }
      currentUser = session.user;
      loadRanking();
    }

    async function loadRanking() {
      // Reset UI
      document.getElementById('loader').style.display = 'block';
      document.getElementById('podium').style.display = 'none';
      document.getElementById('rankingList').style.display = 'none';
      document.getElementById('myRank').style.display = 'none';
      document.getElementById('restTitle').style.display = 'none';
      document.getElementById('emptyState').style.display = 'none';

      const orderBy = currentTab === 'level' ? 'level' : 'money';

      const { data: stats } = await sb.from('game_stats').select('*').order(orderBy, { ascending: false }).limit(50);
      if (!stats || stats.length === 0) {
        document.getElementById('loader').style.display = 'none';
        document.getElementById('emptyState').style.display = 'block';
        return;
      }

      // Récupérer profils
      const userIds = stats.map(s => s.user_id);
      const { data: profiles } = await sb.from('profiles').select('*').in('user_id', userIds);

      const rankings = stats.map(stat => ({
        ...stat,
        profile: profiles?.find(p => p.user_id === stat.user_id) || { username: 'Docker #' + stat.user_id.slice(0, 4), avatar_url: 'avatar-default.png' }
      }));

      document.getElementById('loader').style.display = 'none';

      // Mon rang
      const myIndex = rankings.findIndex(r => r.user_id === currentUser.id);
      if (myIndex >= 0) {
        const me = rankings[myIndex];
        const score = currentTab === 'level' ? `Niv. ${me.level} • ${getGrade(me.level)}` : `${(me.money||0).toLocaleString('fr-FR')}€`;
        document.getElementById('myRankValue').textContent = '#' + (myIndex + 1);
        document.getElementById('myRankScore').textContent = score;
        document.getElementById('myRank').style.display = 'flex';
      }

      // Podium top 3
      if (rankings.length >= 1) displayPodium(rankings.slice(0, Math.min(3, rankings.length)));

      // Reste liste (à partir du 4ème)
      if (rankings.length > 3) {
        displayRankingList(rankings.slice(3));
        document.getElementById('restTitle').style.display = 'block';
      }
    }

    function displayPodium(top) {
      const medals = ['🥇','🥈','🥉'];
      const classes = ['first','second','third'];
      const order = top.length >= 3 ? [1, 0, 2] : [0];
      const podium = document.getElementById('podium');
      podium.innerHTML = '';

      const items = order.map(i => top[i]).filter(Boolean);
      const classOrder = order.length >= 3 ? ['second','first','third'] : ['first'];

      items.forEach((player, idx) => {
        const realIdx = order[idx];
        const score = currentTab === 'level' ? `Niv. ${player.level || 1}` : `${(player.money||0).toLocaleString('fr-FR')}€`;
        const div = document.createElement('div');
        div.className = `podium-item ${classOrder[idx]}`;
        div.innerHTML = `
          <div class="podium-medal">${medals[realIdx]}</div>
          <div class="podium-avatar">
            <img src="${player.profile.avatar_url || 'avatar-default.png'}" alt="${player.profile.username}">
          </div>
          <div class="podium-name">${player.profile.username}</div>
          <div class="podium-score">${score}</div>
          <div class="podium-grade">${getGrade(player.level || 1)}</div>
          <div class="podium-pedestal"></div>
        `;
        podium.appendChild(div);
      });

      podium.style.display = 'flex';
    }

    function displayRankingList(rankings) {
      const list = document.getElementById('rankingList');
      list.innerHTML = '';

      rankings.forEach((player, idx) => {
        const rank = idx + 4;
        const isMe = player.user_id === currentUser.id;
        const score = currentTab === 'level' ? `Niv. ${player.level || 1}` : `${(player.money||0).toLocaleString('fr-FR')}€`;
        const secondaryScore = currentTab === 'level' ? `${(player.money||0).toLocaleString('fr-FR')}€` : `Niv. ${player.level || 1}`;

        const div = document.createElement('div');
        div.className = `ranking-item ${isMe ? 'me' : ''}`;
        div.innerHTML = `
          <div class="rank-number ${rank <= 3 ? 'top3' : ''}">#${rank}</div>
          <div class="ranking-avatar">
            <img src="${player.profile.avatar_url || 'avatar-default.png'}" alt="${player.profile.username}">
          </div>
          <div class="ranking-info">
            <div class="ranking-name">${player.profile.username}${isMe ? ' 👈' : ''}</div>
            <div class="ranking-grade">${getGrade(player.level || 1)}</div>
          </div>
          <div class="ranking-right">
            <div class="ranking-score">${score}</div>
            <div class="ranking-level">${secondaryScore}</div>
          </div>
        `;
        list.appendChild(div);
      });

      list.style.display = 'flex';
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      loadRanking();
    }

    init();
  </script>
</body>
</html>
