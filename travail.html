<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Battle Dock - Zone de Travail</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(180deg, #0f172a 0%, #1e293b 50%, #334155 100%);
      min-height: 100vh;
      color: white;
      overflow: hidden;
      position: relative;
    }

    /* Header Stats */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.95));
      backdrop-filter: blur(10px);
      border-bottom: 2px solid rgba(255, 255, 255, 0.1);
      padding: 16px 20px;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .back-btn {
      font-size: 24px;
      cursor: pointer;
      text-decoration: none;
      color: white;
    }

    .stats {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.6);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .stat-value {
      font-family: 'Fredoka', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: #fbbf24;
    }

    /* Container Clicker */
    .clicker-zone {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      max-width: 400px;
      text-align: center;
      padding: 20px;
    }

    .container-svg {
      width: 280px;
      height: 200px;
      cursor: pointer;
      transition: transform 0.1s ease;
      filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.5));
      margin: 0 auto;
      display: block;
    }

    .container-svg:active {
      transform: scale(0.95);
    }

    .click-text {
      font-family: 'Fredoka', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: white;
      margin-top: 20px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .click-value {
      font-size: 16px;
      color: #94a3b8;
      margin-top: 8px;
    }

    /* Floating Numbers Animation */
    .floating-number {
      position: absolute;
      font-family: 'Fredoka', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: #fbbf24;
      pointer-events: none;
      animation: floatUp 1s ease-out forwards;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translateY(0);
      }
      100% {
        opacity: 0;
        transform: translateY(-100px);
      }
    }

    /* Upgrades Panel */
    .upgrades-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.95));
      backdrop-filter: blur(10px);
      border-top: 2px solid rgba(255, 255, 255, 0.1);
      padding: 16px;
      max-height: 200px;
      overflow-y: auto;
      z-index: 100;
    }

    .upgrade-title {
      font-family: 'Fredoka', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: #94a3b8;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .upgrade-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }

    .upgrade-card {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(29, 78, 216, 0.1));
      border: 2px solid rgba(59, 130, 246, 0.3);
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .upgrade-card:hover {
      border-color: rgba(59, 130, 246, 0.6);
      transform: translateY(-2px);
    }

    .upgrade-card.locked {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .upgrade-name {
      font-family: 'Fredoka', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: white;
      margin-bottom: 4px;
    }

    .upgrade-effect {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    .upgrade-cost {
      font-family: 'Fredoka', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: #fbbf24;
    }

    .upgrade-level {
      font-size: 10px;
      color: #10b981;
      margin-top: 4px;
    }

    /* Progress Bar */
    .progress-container {
      position: fixed;
      top: 70px;
      left: 20px;
      right: 20px;
      background: rgba(15, 23, 42, 0.8);
      border-radius: 12px;
      padding: 12px;
      border: 2px solid rgba(255, 255, 255, 0.1);
    }

    .progress-label {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #1d4ed8);
      transition: width 0.3s ease;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <a href="game.html" class="back-btn">←</a>
    <div class="stats">
      <div class="stat-item">
        <div class="stat-label">Argent</div>
        <div class="stat-value" id="money">0€</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Par clic</div>
        <div class="stat-value" id="perClick">1€</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Par sec</div>
        <div class="stat-value" id="perSecond">0€</div>
      </div>
    </div>
  </div>

  <!-- XP Progress -->
  <div class="progress-container">
    <div class="progress-label">
      <span>Niveau <span id="level">1</span></span>
      <span><span id="xp">0</span> / <span id="xpRequired">100</span> XP</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width: 0%"></div>
    </div>
  </div>

  <!-- Clicker Zone -->
  <div class="clicker-zone">
    <svg class="container-svg" id="containerSvg" viewBox="0 0 280 200" xmlns="http://www.w3.org/2000/svg">
      <!-- Container 3D -->
      <defs>
        <linearGradient id="containerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="sideGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" style="stop-color:#b91c1c;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#991b1b;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="topGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:#f87171;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
        </linearGradient>
      </defs>
      
      <!-- Face avant -->
      <rect x="40" y="60" width="200" height="120" fill="url(#containerGrad)" stroke="#991b1b" stroke-width="3"/>
      
      <!-- Côté droit (perspective) -->
      <polygon points="240,60 270,40 270,160 240,180" fill="url(#sideGrad)" stroke="#7f1d1d" stroke-width="2"/>
      
      <!-- Dessus (perspective) -->
      <polygon points="40,60 70,40 270,40 240,60" fill="url(#topGrad)" stroke="#991b1b" stroke-width="2"/>
      
      <!-- Détails container -->
      <rect x="50" y="70" width="180" height="100" fill="none" stroke="#fca5a5" stroke-width="2" stroke-dasharray="10,5"/>
      
      <!-- Texte CMA CGM -->
      <text x="140" y="125" font-family="Arial" font-size="32" font-weight="bold" fill="white" text-anchor="middle">CMA</text>
      <text x="140" y="155" font-family="Arial" font-size="32" font-weight="bold" fill="white" text-anchor="middle">CGM</text>
      
      <!-- Poignées -->
      <rect x="35" y="110" width="10" height="30" fill="#475569" stroke="#1e293b" stroke-width="2" rx="2"/>
      <rect x="235" y="110" width="10" height="30" fill="#475569" stroke="#1e293b" stroke-width="2" rx="2"/>
    </svg>
    
    <div class="click-text">Clique sur le conteneur !</div>
    <div class="click-value">+<span id="clickValue">1</span>€ par clic</div>
  </div>

  <!-- Upgrades Panel -->
  <div class="upgrades-panel">
    <div class="upgrade-title">⬆️ Améliorations</div>
    <div class="upgrade-grid" id="upgradesGrid">
      <!-- Upgrades loaded here -->
    </div>
  </div>

  <script src="xp-manager.js"></script>
  <script>
    const supabaseUrl = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const supabaseClient = createClient(supabaseUrl, supabaseKey);

    const userId = localStorage.getItem('userId');
    if (!userId) window.location.href = 'index.html';

    let xpManager;
    let gameState = {
      money: 0,
      clickPower: 1,
      autoClickPower: 0,
      xp: 0,
      level: 1,
      upgrades: {
        clickPower1: 0,
        clickPower2: 0,
        autoClicker1: 0,
        autoClicker2: 0,
        multiplier: 0
      }
    };

    const upgradesData = [
      {
        id: 'clickPower1',
        name: '💪 Main Forte',
        effect: '+1€ par clic',
        baseCost: 10,
        maxLevel: 999
      },
      {
        id: 'clickPower2',
        name: '⚡ Super Main',
        effect: '+5€ par clic',
        baseCost: 100,
        maxLevel: 999
      },
      {
        id: 'autoClicker1',
        name: '🤖 Docker Auto',
        effect: '+1€/sec',
        baseCost: 50,
        maxLevel: 999
      },
      {
        id: 'autoClicker2',
        name: '🏭 Grue Auto',
        effect: '+10€/sec',
        baseCost: 500,
        maxLevel: 999
      },
      {
        id: 'multiplier',
        name: '🚀 Multiplicateur',
        effect: '×2 tous gains',
        baseCost: 1000,
        maxLevel: 10
      }
    ];

    async function init() {
      xpManager = new XPManager(supabaseClient, userId);
      await loadGameState();
      renderUpgrades();
      startAutoClicker();
      updateUI();
    }

    async function loadGameState() {
      const { data, error } = await supabaseClient
        .from('game_progress')
        .select('money, level, xp')
        .eq('user_id', userId)
        .single();

      if (data) {
        gameState.money = data.money || 0;
        gameState.level = data.level || 1;
        gameState.xp = data.xp || 0;
      }
    }

    async function saveGameState() {
      await supabaseClient
        .from('game_progress')
        .update({
          money: Math.floor(gameState.money),
          level: gameState.level,
          xp: gameState.xp
        })
        .eq('user_id', userId);

      // Mettre à jour le leaderboard
      await supabaseClient
        .from('leaderboard')
        .update({ score: Math.floor(gameState.money) })
        .eq('user_id', userId);
    }

    function handleClick(event) {
      const gain = gameState.clickPower;
      gameState.money += gain;
      
      // Ajouter XP
      xpManager.addXP('container_processed');
      gameState.xp += 5;
      checkLevelUp();
      
      // Animation nombre flottant
      createFloatingNumber(gain, event.clientX, event.clientY);
      
      // Animation conteneur
      animateContainer();
      
      updateUI();
      saveGameState();
    }

    function createFloatingNumber(value, x, y) {
      const num = document.createElement('div');
      num.className = 'floating-number';
      num.textContent = `+${value}€`;
      num.style.left = x + 'px';
      num.style.top = y + 'px';
      document.body.appendChild(num);
      
      setTimeout(() => num.remove(), 1000);
    }

    function animateContainer() {
      const svg = document.getElementById('containerSvg');
      svg.style.transform = 'scale(0.95)';
      setTimeout(() => {
        svg.style.transform = 'scale(1)';
      }, 100);
    }

    function startAutoClicker() {
      setInterval(() => {
        if (gameState.autoClickPower > 0) {
          gameState.money += gameState.autoClickPower / 10;
          updateUI();
        }
      }, 100);

      // Sauvegarder toutes les 5 secondes
      setInterval(() => {
        if (gameState.autoClickPower > 0) {
          saveGameState();
        }
      }, 5000);
    }

    function buyUpgrade(upgradeId) {
      const upgrade = upgradesData.find(u => u.id === upgradeId);
      const currentLevel = gameState.upgrades[upgradeId];
      
      if (currentLevel >= upgrade.maxLevel) {
        alert('⚠️ Niveau maximum atteint !');
        return;
      }
      
      const cost = calculateUpgradeCost(upgrade.baseCost, currentLevel);
      
      if (gameState.money < cost) {
        alert('💰 Pas assez d\'argent !');
        return;
      }
      
      gameState.money -= cost;
      gameState.upgrades[upgradeId]++;
      
      // Appliquer l'effet
      applyUpgradeEffect(upgradeId);
      
      renderUpgrades();
      updateUI();
      saveGameState();
    }

    function calculateUpgradeCost(baseCost, level) {
      return Math.floor(baseCost * Math.pow(1.15, level));
    }

    function applyUpgradeEffect(upgradeId) {
      const level = gameState.upgrades[upgradeId];
      
      switch(upgradeId) {
        case 'clickPower1':
          gameState.clickPower = 1 + level;
          break;
        case 'clickPower2':
          gameState.clickPower = 1 + gameState.upgrades.clickPower1 + (level * 5);
          break;
        case 'autoClicker1':
          gameState.autoClickPower = level + (gameState.upgrades.autoClicker2 * 10);
          break;
        case 'autoClicker2':
          gameState.autoClickPower = gameState.upgrades.autoClicker1 + (level * 10);
          break;
        case 'multiplier':
          const multiplier = Math.pow(2, level);
          gameState.clickPower *= multiplier;
          gameState.autoClickPower *= multiplier;
          break;
      }
    }

    function renderUpgrades() {
      const html = upgradesData.map(upgrade => {
        const level = gameState.upgrades[upgrade.id];
        const cost = calculateUpgradeCost(upgrade.baseCost, level);
        const canAfford = gameState.money >= cost;
        const maxed = level >= upgrade.maxLevel;
        
        return `
          <div class="upgrade-card ${!canAfford || maxed ? 'locked' : ''}" onclick="buyUpgrade('${upgrade.id}')">
            <div class="upgrade-name">${upgrade.name}</div>
            <div class="upgrade-effect">${upgrade.effect}</div>
            <div class="upgrade-cost">${maxed ? 'MAX' : cost.toLocaleString() + '€'}</div>
            <div class="upgrade-level">Niveau ${level}</div>
          </div>
        `;
      }).join('');
      
      document.getElementById('upgradesGrid').innerHTML = html;
    }

    function checkLevelUp() {
      const xpRequired = gameState.level * 100;
      if (gameState.xp >= xpRequired) {
        gameState.level++;
        gameState.xp = 0;
        alert(`🎉 NIVEAU ${gameState.level} !\n\nContinue comme ça !`);
      }
    }

    function updateUI() {
      document.getElementById('money').textContent = Math.floor(gameState.money).toLocaleString() + '€';
      document.getElementById('perClick').textContent = gameState.clickPower.toLocaleString() + '€';
      document.getElementById('perSecond').textContent = gameState.autoClickPower.toLocaleString() + '€';
      document.getElementById('clickValue').textContent = gameState.clickPower;
      document.getElementById('level').textContent = gameState.level;
      document.getElementById('xp').textContent = Math.floor(gameState.xp);
      
      const xpRequired = gameState.level * 100;
      document.getElementById('xpRequired').textContent = xpRequired;
      
      const progress = (gameState.xp / xpRequired) * 100;
      document.getElementById('progressFill').style.width = Math.min(progress, 100) + '%';
    }

    // Event Listeners
    document.getElementById('containerSvg').addEventListener('click', handleClick);

    // Recalculer les effets au chargement
    Object.keys(gameState.upgrades).forEach(upgradeId => {
      for (let i = 0; i < gameState.upgrades[upgradeId]; i++) {
        applyUpgradeEffect(upgradeId);
      }
    });

    init();
  </script>
</body>
</html>
