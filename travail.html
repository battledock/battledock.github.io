<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
:root{--st:env(safe-area-inset-top,44px);--sb:env(safe-area-inset-bottom,20px)}
html,body{min-height:100%;background:#f5f5f7;font-family:'Inter',sans-serif;overflow-x:hidden}

/* ══ HEADER ══ */
.hdr{
  position:sticky;top:0;z-index:20;
  background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(0,0,0,.06);
  padding:calc(var(--st)+12px) 16px 12px;
  display:flex;align-items:center;gap:12px;
}
.hdr-back{width:32px;height:32px;border-radius:50%;background:#f5f5f7;display:flex;align-items:center;justify-content:center;font-size:16px;color:#1a1a1a;flex-shrink:0;cursor:pointer;border:none}
.hdr-title{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#1a1a1a;letter-spacing:3px;flex:1}
.hdr-pill{background:#f0fdf4;border:1px solid #86efac;border-radius:20px;padding:4px 10px;font-size:8px;font-weight:800;color:#16a34a}

/* ══ CARDS ══ */
.cards{padding:14px;display:flex;flex-direction:column;gap:12px;padding-bottom:calc(20px + var(--sb))}

.job-card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.07);cursor:pointer;transition:transform .12s}
.job-card:active{transform:scale(.98)}

.job-illus{width:100%;display:block;flex-shrink:0}

.job-info{padding:12px 14px}
.job-info-row{display:flex;align-items:center;gap:10px}
.job-ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.job-texts{flex:1;min-width:0}
.job-name{font-family:'Bebas Neue',sans-serif;font-size:17px;color:#1a1a1a;letter-spacing:1px;line-height:1}
.job-desc{font-size:10px;color:#8e8e93;margin-top:2px;font-weight:600}
.job-btn{background:#1a1a1a;color:#fff;border-radius:10px;padding:9px 14px;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;flex-shrink:0;border:none;cursor:pointer}
.job-btn:active{opacity:.85}

.job-xp{margin-top:10px}
.job-xp-top{display:flex;justify-content:space-between;font-size:8px;font-weight:700;color:#9ca3af;margin-bottom:4px}
.job-xp-bar{height:5px;background:#f3f4f6;border-radius:3px;overflow:hidden}
.job-xp-fill{height:100%;border-radius:3px;transition:width .4s}

/* Badge record -->
.job-record{display:inline-flex;align-items:center;gap:4px;background:#fffbeb;border:1px solid #fde68a;border-radius:6px;padding:2px 7px;font-size:9px;font-weight:800;color:#92400e;margin-left:6px}

/* Retour -->
.btn-back-port{background:#fff;border-radius:16px;padding:14px 16px;display:flex;align-items:center;justify-content:center;gap:8px;color:rgba(0,0,0,.4);font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:2px;box-shadow:0 1px 4px rgba(0,0,0,.06);cursor:pointer;border:none;width:100%}

/* IDs pour XP dynamiques */
#clickerLvl,#clickerXpPct,#clickerXp2,#grueLvl,#clarkLvl{color:inherit}
#clickerXpBlock,#grueXpBlock,#clarkXpBlock{display:block}
</style>
</head>

  if(el)el.style.width=pct+'%';
  if(pt)pt.textContent=pct+'%';
}

async function init(){
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(!session){location.href='index.html';return}
    const uid=session.user.id;

    const gs=await sb.from('game_stats').select('records,xp,level').eq('user_id',uid).maybeSingle();
    if(gs.data){
      const f=(gs.data.records&&gs.data.records.formations)||{};
      const lvl=gs.data.level||1;
      const xp=gs.data.xp||0;

      // XP Port clicker - simple %
      const needed=lvl<=10?lvl*500:lvl<=25?lvl*1000:lvl*2000;
      setXpBar('clickerXp','clickerXpPct',Math.round(xp/needed*100));

      if(true){
        _grueOk=true;
        var _gl=document.getElementById('grueLock');if(_gl)_gl.style.display='none';
        var _gab=document.getElementById('grueActiveBadge');if(_gab)_gab.style.display='block';
        var _gxb=document.getElementById('grueXpBlock');if(_gxb)_gxb.style.display='block';
        setXpBar('grueXp','grueXpPct',f.grutier_pct||0);
      }

      if(true){
        _clarkOk=true;
        var _cl=document.getElementById('clarkLock');if(_cl)_cl.style.display='none';
        var _cab=document.getElementById('clarkActiveBadge');if(_cab)_cab.style.display='block';
        var _cxb=document.getElementById('clarkXpBlock');if(_cxb)_cxb.style.display='block';
        setXpBar('clarkXp','clarkXpPct',f.clark_pct||0);
      }
    }

    // last_seen
    sb.from('profiles').update({last_seen:new Date().toISOString()}).eq('user_id',uid).then(()=>{});

  } catch(e){console.error('Erreur connexion',e);}
}
init();


// Injecter infos supplementaires apres chargement
(function patchInit(){
  var _origInit=typeof init==='function'?init:null;
  if(!_origInit)return;
  init=async function(){
    await _origInit();
    // Recuperer donnees fraiches
    try{
      var session=await sb.auth.getSession();
      var uid=session.data.session.user.id;
      var gs=await sb.from('game_stats').select('level,xp,records').eq('user_id',uid).maybeSingle();
      if(!gs.data)return;
      var lvl=gs.data.level||1;
      var xp=gs.data.xp||0;
      var rec=gs.data.records||{};
      var f=rec.formations||{};

      // Niveau docker
      if(document.getElementById('clickerLvl'))document.getElementById('clickerLvl').textContent=lvl;
      var needed=lvl<=10?lvl*500:lvl<=25?lvl*1000:lvl*2000;
      var pct=Math.round(xp/needed*100);
      var xpBar=document.getElementById('clickerXp');
      var xpPct=document.getElementById('clickerXpPct');
      var xp2=document.getElementById('clickerXp2');
      var xpLbl=document.getElementById('clickerXpLbl');
      if(xpBar)xpBar.style.width=pct+'%';
      if(xpPct)xpPct.textContent=pct+'%';
      if(xpLbl)xpLbl.textContent='NV.'+lvl+' → NV.'+(lvl+1);
      if(xp2){var fx=function(n){return n>=1000?Math.floor(n/1000)+'k':n;};xp2.textContent=fx(xp)+'/'+fx(needed)+' XP';}

      // Records grue/clark
      if(rec.grue_best&&document.getElementById('grueLvl')){
        document.getElementById('grueLvl').textContent=rec.grue_best;
        if(f.grutier)document.getElementById('grueLvlBadge').style.display='inline-flex';
      }
      if(rec.clark_best&&document.getElementById('clarkLvl')){
        document.getElementById('clarkLvl').textContent=Math.floor(rec.clark_best);
        if(f.clark)document.getElementById('clarkLvlBadge').style.display='inline-flex';
      }



      // Pill actif
      var actifs=1+(f.grutier?1:0)+(f.clark?1:0);
      var pill=document.getElementById('pillActif');
      if(pill)pill.textContent='● '+actifs+' actif'+(actifs>1?'s':'');

    }catch(e){console.warn('patch init err',e);}
  };
})();
