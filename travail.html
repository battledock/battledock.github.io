<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Travail - Battle Dock</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }

    body {
      font-family:'Inter',sans-serif;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    /* FOND JOUR/NUIT */
    .bg {
      position:fixed; inset:0; z-index:0;
      transition:background 1s ease;
    }
    body.theme-day .bg   { background:linear-gradient(180deg,#87ceeb 0%,#b8e4f7 55%,#d4a574 55%,#8b7355 100%); }
    body.theme-night .bg { background:linear-gradient(180deg,#0f2027 0%,#203a43 50%,#2c5364 100%); }

    /* SOLEIL/LUNE */
    .sun {
      position:fixed; top:24px; right:50px; z-index:1;
      width:56px; height:56px; border-radius:50%;
      animation:floatSun 6s ease-in-out infinite;
    }
    body.theme-day .sun   { background:radial-gradient(circle,#fde68a,#fbbf24); box-shadow:0 0 40px rgba(251,191,36,0.6); }
    body.theme-night .sun { background:radial-gradient(circle at 35% 35%,#fef9c3,#fde68a); box-shadow:0 0 30px rgba(254,249,195,0.25); width:48px; height:48px; }
    @keyframes floatSun { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }

    /* NUAGES */
    .cloud { position:fixed; z-index:1; animation:drift linear infinite; }
    .cloud1 { font-size:50px; animation-duration:28s; top:8px; left:-80px; }
    .cloud2 { font-size:32px; animation-duration:38s; animation-delay:-14s; top:28px; left:-60px; }
    body.theme-day .cloud   { opacity:0.75; }
    body.theme-night .cloud { color:rgba(255,255,255,0.12); opacity:1; }
    @keyframes drift { 0%{transform:translateX(0)} 100%{transform:translateX(110vw)} }

    /* ÉTOILES */
    .star-dot { position:fixed; border-radius:50%; background:white; animation:starTwinkle ease-in-out infinite; }
    @keyframes starTwinkle { 0%,100%{opacity:0.9} 50%{opacity:0.2} }
    body.theme-day .star-dot { display:none; }

    /* HORIZON & EAU */
    .horizon { position:fixed; bottom:80px; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,rgba(255,255,255,0.08),transparent); z-index:1; }
    .water { position:fixed; bottom:0; left:0; right:0; height:80px; background:linear-gradient(180deg,rgba(44,83,100,0.4),rgba(15,32,39,0.8)); z-index:1; }
    body.theme-day .water { background:linear-gradient(180deg,rgba(139,115,85,0.4),rgba(101,84,60,0.8)); }

    /* HEADER */
    .header {
      position:relative; z-index:10;
      padding:14px 16px; display:flex; align-items:center; gap:12px;
      backdrop-filter:blur(10px);
      border-bottom:1px solid rgba(255,255,255,0.1);
    }
    body.theme-day .header   { background:rgba(255,255,255,0.85); }
    body.theme-night .header { background:rgba(15,32,39,0.95); }
    .back-btn {
      background:rgba(59,130,246,0.9); border:none; color:white;
      padding:8px 14px; border-radius:6px; cursor:pointer;
      font-family:'Bebas Neue',sans-serif; font-size:14px; letter-spacing:1px;
    }
    .header-title { font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:2px; flex:1; text-align:center; }
    body.theme-day .header-title   { color:#1a1a1a; }
    body.theme-night .header-title { color:white; }

    /* CONTENU */
    .content {
      position:relative; z-index:5;
      flex:1; display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      padding:24px 20px 100px; gap:20px;
    }

    /* CARTE JEU */
    .game-card {
      width:100%; max-width:380px;
      border-radius:20px; overflow:hidden;
      cursor:pointer; transition:transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow:0 8px 32px rgba(0,0,0,0.3);
    }
    .game-card:active { transform:scale(0.97); }

    /* SCÈNE MINI CLICKER */
    .card-scene {
      height:160px; position:relative; overflow:hidden;
    }
    .card-scene-clicker {
      background:linear-gradient(180deg,#87ceeb 0%,#b8e4f7 55%,#d4a574 55%,#8b7355 100%);
    }
    body.theme-night .card-scene-clicker {
      background:linear-gradient(180deg,#0f2027 0%,#203a43 55%,#1a3a2a 55%,#0d2010 100%);
    }
    .card-scene-tower {
      background:linear-gradient(180deg,#0a0a2e 0%,#1a1a4a 50%,#2c2c1a 50%,#1a1a0a 100%);
    }

    /* MINI SOLEIL DANS CARTE */
    .mini-sun {
      position:absolute; top:12px; right:20px;
      width:36px; height:36px; border-radius:50%;
      background:radial-gradient(circle,#fde68a,#fbbf24);
      box-shadow:0 0 20px rgba(251,191,36,0.5);
      animation:floatSun 4s ease-in-out infinite;
    }
    body.theme-night .card-scene-clicker .mini-sun {
      background:radial-gradient(circle at 35% 35%,#fef9c3,#fde68a);
      box-shadow:0 0 16px rgba(254,249,195,0.3);
      width:30px; height:30px;
    }

    /* MINI CONTENEUR DANS CARTE */
    .mini-container {
      position:absolute; bottom:30px; left:50%; transform:translateX(-50%);
      width:100px; height:68px;
      background:linear-gradient(135deg,#cc2200,#991100);
      border-radius:6px; border:2px solid rgba(255,255,255,0.15);
      box-shadow:0 6px 20px rgba(0,0,0,0.5), 0 0 20px rgba(204,34,0,0.3);
      display:flex; align-items:center; justify-content:center;
      animation:containerBob 2s ease-in-out infinite;
    }
    @keyframes containerBob { 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(-6px)} }
    .mini-container-stripe { position:absolute; top:0; bottom:0; width:2px; background:rgba(0,0,0,0.25); }
    .mini-container-text { font-family:'Bebas Neue',sans-serif; font-size:13px; color:white; letter-spacing:2px; }

    /* MINI TOWER */
    .mini-tower {
      position:absolute; bottom:20px; left:50%; transform:translateX(-50%);
      display:flex; flex-direction:column-reverse; align-items:center; gap:2px;
    }
    .mini-block {
      height:16px; border-radius:3px;
      border:1px solid rgba(255,255,255,0.2);
      display:flex; align-items:center; justify-content:center;
      font-size:8px;
    }

    /* INFO CARTE */
    .card-info {
      background:white; padding:16px 20px;
      display:flex; align-items:center; gap:14px;
    }
    .card-icon { font-size:32px; flex-shrink:0; }
    .card-text { flex:1; }
    .card-title { font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:1.5px; color:#1a1a1a; }
    .card-desc  { font-size:12px; color:#6b7280; margin-top:2px; }
    .card-badge {
      font-size:10px; font-weight:700; padding:3px 10px; border-radius:20px; flex-shrink:0;
    }
    .card-badge.green  { background:rgba(22,163,74,0.1);  color:#16a34a; }
    .card-badge.purple { background:rgba(124,58,237,0.1); color:#7c3aed; }
  </style>
</head>
<body>

  <div class="bg"></div>
  <div class="sun"></div>
  <div class="cloud cloud1">☁️</div>
  <div class="cloud cloud2">☁️</div>
  <div class="horizon"></div>
  <div class="water"></div>

  <div class="header">
    <button class="back-btn" onclick="window.location.href='game.html'">← RETOUR</button>
    <div class="header-title">⚓ Travail</div>
    <div style="width:80px"></div>
  </div>

  <div class="content">

    <!-- CLICKER -->
    <div class="game-card" onclick="window.location.href='clicker.html'">
      <div class="card-scene card-scene-clicker">
        <div class="mini-sun"></div>
        <div class="mini-container">
          <div class="mini-container-stripe" style="left:22px"></div>
          <div class="mini-container-stripe" style="left:44px"></div>
          <div class="mini-container-stripe" style="left:66px"></div>
          <div class="mini-container-text">PORT</div>
        </div>
      </div>
      <div class="card-info">
        <div class="card-icon">📦</div>
        <div class="card-text">
          <div class="card-title">Port Maritime</div>
          <div class="card-desc">Clique sur le conteneur pour travailler et gagner de l'argent et XP</div>
        </div>
        <div class="card-badge green">Actif</div>
      </div>
    </div>

    <!-- TOWER -->
    <div class="game-card" onclick="window.location.href='tower.html'">
      <div class="card-scene card-scene-tower">
        <div class="mini-tower" id="miniTower"></div>
      </div>
      <div class="card-info">
        <div class="card-icon">🏗️</div>
        <div class="card-text">
          <div class="card-title">Tower of Containers</div>
          <div class="card-desc">Empile les conteneurs le plus haut possible pour gagner de l'argent</div>
        </div>
        <div class="card-badge purple">Nouveau</div>
      </div>
    </div>

  </div>

  <script>
    // Thème jour/nuit
    function applyTheme() {
      const h = new Date().getHours();
      const isNight = h >= 18 || h < 7;
      document.body.classList.toggle('theme-night', isNight);
      document.body.classList.toggle('theme-day', !isNight);
    }
    applyTheme();
    setInterval(applyTheme, 60000);

    // Étoiles
    for(let i=0;i<20;i++){
      const s=document.createElement('div'); s.className='star-dot';
      const sz=0.5+Math.random()*1.5;
      s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*50}%;animation-duration:${2+Math.random()*4}s;animation-delay:${Math.random()*4}s`;
      document.body.appendChild(s);
    }

    // Mini tower animée
    const colors=['#ef4444','#f97316','#eab308','#22c55e','#3b82f6','#8b5cf6'];
    const tower = document.getElementById('miniTower');
    const widths = [80,72,65,58,52,46,40];
    widths.forEach((w,i)=>{
      const b=document.createElement('div');
      b.className='mini-block';
      b.style.cssText=`width:${w}px;background:${colors[i%colors.length]};animation:containerBob ${2+i*0.3}s ease-in-out infinite;animation-delay:${i*0.1}s`;
      b.textContent='📦';
      tower.appendChild(b);
    });
  </script>
</body>
</html>
