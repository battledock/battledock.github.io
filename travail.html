  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }

    body {
      font-family:'Inter',sans-serif;
      background:#eef1f7;
      min-height:100dvh;
      display:flex; flex-direction:column;
      overflow-y:auto;
    }

    /* FOND — BLEU CLASSE */
    body::before {
      content:'';
      position:fixed; inset:0; z-index:0; pointer-events:none;
      background:
        radial-gradient(120% 80% at 50% 0%, rgba(59,130,246,0.10), transparent 60%),
        linear-gradient(160deg, #f7f9fc 0%, #eef1f7 100%);
    }

    /* VAGUES */
    .waves-wrap { display:none; }
    .waves-wrap svg { width:200%; height:100%; animation:waveMove 5s linear infinite; }

    /* HEADER — style shop */
    .header {
      position:fixed; bottom:0; left:0; right:0; z-index:10;
      background:rgba(2,100,180,0.75);
      backdrop-filter:blur(12px);
      border-top:1px solid rgba(255,255,255,0.15);
      padding:14px 16px;
      display:flex; align-items:center; gap:12px;
    }
    .back-btn {
      background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2);
      border-radius:8px; padding:8px 12px;
      font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:1px;

    .back-btn:active { background:rgba(255,255,255,0.2); }
    .header-title { font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:3px; color:white; flex:1; text-shadow:0 1px 4px rgba(0,0,0,0.2); }
    .header-anchor { font-size:22px; filter:drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }

    /* HERO */
    .hero {
      position:relative; z-index:2;
      padding:28px 20px 14px; text-align:center;
    }
    .hero-title { font-family:'Bebas Neue',sans-serif; font-size:30px; letter-spacing:3px; color:#0f172a; }
    .hero-sub { font-size:11px; color:#94a3b8; letter-spacing:2px; margin-top:5px; text-transform:uppercase; }

    /* CONTENU */
    .content {
      position:relative; z-index:2;
      flex:1; display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      padding:16px 0 calc(96px + env(safe-area-inset-bottom)); gap:0; align-items:stretch;
    }

    /* CARTE */
    .game-card {
      width:100%; max-width:400px;
      border-radius:18px; overflow:hidden;
      cursor:pointer;
      box-shadow:0 12px 40px rgba(0,0,0,0.35);
      transition:transform 0.15s ease, box-shadow 0.15s ease;
    }
    .game-card:active { transform:scale(0.97); box-shadow:0 4px 16px rgba(0,0,0,0.3); }

    /* PREVIEW CLICKER */
    .preview-clicker {
      height:150px; position:relative; overflow:hidden;
      background:linear-gradient(180deg,#87ceeb 0%,#b8e4f7 55%,#c8a882 55%,#8b7355 100%);
    }
    .pc-sun { position:absolute; top:12px; right:18px; width:38px; height:38px; border-radius:50%; background:radial-gradient(circle,#fde68a,#fbbf24); box-shadow:0 0 20px rgba(251,191,36,0.6); animation:pcFloat 4s ease-in-out infinite; }
    .pc-cloud { position:absolute; top:16px; left:14px; font-size:24px; opacity:0.8; animation:pcFloat 5s ease-in-out infinite; animation-delay:-2s; }
    .pc-grue { position:absolute; right:20px; top:18px; font-size:30px; opacity:0.6; }

    .pt-bg {

    .card-icon-blue { background:linear-gradient(135deg,#0ea5e9,#1d4ed8); box-shadow:0 4px 12px rgba(14,165,233,0.3); }
    .card-icon-amber { background:linear-gradient(135deg,#f59e0b,#d97706); box-shadow:0 4px 12px rgba(245,158,11,0.3); }
    .card-title { font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:1.5px; color:#1a1a1a; }
    .card-desc  { font-size:11px; color:#9ca3af; margin-top:1px; }
    .card-badge { font-size:9px; font-weight:700; padding:3px 10px; border-radius:20px; flex-shrink:0; }
    .badge-green  { background:rgba(22,163,74,0.1);  color:#16a34a; }
    .badge-purple { background:rgba(124,58,237,0.1); color:#7c3aed; }
    .badge-lock   { background:rgba(107,114,128,0.1); color:#6b7280; }

    /* POLISH CARTES */
    .game-card {
      border:1px solid rgba(255,255,255,0.14);
      box-shadow:0 14px 44px rgba(0,0,0,0.42), inset 0 1px 0 rgba(255,255,255,0.18);
    }
    @media (hover:hover) {
      .game-card:hover { transform:translateY(-3px); box-shadow:0 22px 56px rgba(0,0,0,0.5); }
    }
    /* dégradé d'ombre en bas de l'illustration pour la profondeur */
    .game-card > div:first-child::after {
      content:''; position:absolute; left:0; right:0; bottom:0; height:54px;
      background:linear-gradient(180deg, transparent, rgba(0,0,0,0.28)); pointer-events:none;
    }
    /* barre info : fine séparation + léger dégradé */
    .game-card > div:last-child {
      border-top:1px solid rgba(0,0,0,0.05);
      background:linear-gradient(180deg,#ffffff,#f7f8fa) !important;
    }
    .game-card button { transition:transform 0.12s ease, box-shadow 0.12s ease; }
    .game-card button:active { transform:scale(0.93); }
    /* accent sous le hero */
    .hero-sub { position:relative; padding-bottom:10px; }
    .hero-sub::after {
      content:''; position:absolute; bottom:0; left:50%; transform:translateX(-50%);
      width:46px; height:2px; border-radius:2px;
      background:linear-gradient(90deg,transparent,rgba(37,99,235,0.5),transparent);
    }
    /* CARTES STATS */
    .scard { position:relative; width:100%; background:#fff; border-radius:0; padding:18px 18px 16px 22px;
      border:none; border-bottom:1px solid rgba(15,23,42,0.07); box-shadow:none;
      cursor:pointer; overflow:hidden; transition:transform .12s ease;
      animation:scardIn .5s cubic-bezier(.22,1,.36,1) both; }
    .scard:last-child{ border-bottom:none; }
    .scard::before { content:''; position:absolute; left:0; top:0; bottom:0; width:6px; background:var(--accent,#1d4ed8); }
    .scard.b1 { --accent:linear-gradient(180deg,#38bdf8,#1d4ed8); --glow:rgba(29,78,216,0.3);  animation-delay:.04s; }
    .scard.b2 { --accent:linear-gradient(180deg,#fbbf24,#d97706); --glow:rgba(217,119,6,0.3);  animation-delay:.10s; }
    .scard.b3 { --accent:linear-gradient(180deg,#818cf8,#4338ca); --glow:rgba(67,56,202,0.3);  animation-delay:.16s; }
    .scard:active { transform:scale(0.98); }
    @media (hover:hover){ .scard:hover { opacity:.92; } }
    @keyframes scardIn { from{ opacity:0; transform:translateY(14px);} to{ opacity:1; transform:translateY(0);} }
    .scard-head { display:flex; align-items:center; gap:13px; }
    .scard-icon { width:50px; height:50px; border-radius:14px; display:flex; align-items:center; justify-content:center;
      font-size:24px; flex-shrink:0; box-shadow:0 6px 16px rgba(0,0,0,0.2); }
    .scard-id { flex:1; min-width:0; }
    .scard-title { font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:1.2px; color:#0f172a; line-height:1.05; }
    .scard-sub { font-size:11px; color:#94a3b8; margin-top:3px; }
    .scard-play { border:none; border-radius:12px; color:#fff; font-family:'Bebas Neue',sans-serif;
      font-size:14px; letter-spacing:1px; padding:11px 16px; cursor:pointer; flex-shrink:0; transition:transform .12s; }
    .scard-play:active { transform:scale(0.92); }
    .scard-play.blue  { background:linear-gradient(135deg,#0ea5e9,#1d4ed8); box-shadow:0 5px 14px rgba(14,165,233,0.4); }
    .scard-play.amber { background:linear-gradient(135deg,#f59e0b,#d97706); box-shadow:0 5px 14px rgba(245,158,11,0.4); }
    .scard-stats { display:flex; gap:8px; margin-top:14px; }
    .stat { flex:1; background:#f6f8fb; border:1px solid #eef1f5; border-radius:12px; padding:10px 6px; text-align:center; }
    .stat-val { font-family:'Bebas Neue',sans-serif; font-size:19px; letter-spacing:0.5px; color:#0f172a; }
    .stat-lbl { font-size:9px; color:#94a3b8; text-transform:uppercase; letter-spacing:1px; margin-top:3px; }
  </style>

    // Vérifier déblocage via histoire CH.2
    async function init() {
      const { data:{ session } } = await sb.auth.getSession();
      if (!session) { window.location.href = 'index.html'; return; }
      const { data } = await sb.from('game_stats')
        .select('story_progress, money_per_click, xp_per_click, records')
        .eq('user_id', session.user.id).maybeSingle();
      const progress = data?.story_progress || {};
      const rec = (data?.records && typeof data.records==='object') ? data.records : {};
      const fmt = n => (n||0).toLocaleString('fr-FR');

      // Stats clicker
      setStat('clkMoney', fmt(Math.min(data?.money_per_click||1, 30)) + '€');
      setStat('clkXp',    fmt(Math.min(data?.xp_per_click||1, 11)));
      // Stats tower
      setStat('twFloor', rec.tower_floor ? rec.tower_floor : '—');
      setStat('twGain',  rec.tower_gain  ? fmt(rec.tower_gain)+'€' : '—');
      // Stats pointeau
      setStat('ptScore', rec.pointeau_score ? rec.pointeau_score : '—');
      setStat('ptCombo', rec.pointeau_combo ? '×'+rec.pointeau_combo : '—');
      setStat('ptGain',  rec.pointeau_gain  ? fmt(rec.pointeau_gain)+'€' : '—');

      if (!progress.scene2_done) {
        lockGameCard('towerCard', 'towerBtn');
        lockGameCard('pointeauCard', 'pointeauBtn');
      }
    }

    function setStat(id, val) { const el = document.getElementById(id); if (el) el.textContent = val; }

    function lockGameCard(cardId, btnId) {
      const card = document.getElementById(cardId);
      if (card) {
        card.style.opacity = '0.5';
        card.style.filter = 'grayscale(0.7)';
        card.onclick = showCh2Lock;
      }
      const btn = document.getElementById(btnId);
      if (btn) {
        btn.textContent = '🔒 CH.2';
        btn.style.background = '#6b7280';
        btn.style.boxShadow = 'none';
        btn.onclick = (e) => { e.stopPropagation(); showCh2Lock(); };
      }
    }

    function showCh2Lock() {
      const o = document.createElement('div');
      o.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.8);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:20px';
      o.onclick = (e) => { if (e.target === o) o.remove(); };
      o.innerHTML = '<div style="max-width:300px;width:100%;background:#0e1f33;border:1px solid rgba(255,255,255,0.12);border-radius:18px;padding:28px 22px;text-align:center"><div style="font-size:46px;margin-bottom:12px">🔒</div><div style="font-family:\'Bebas Neue\',sans-serif;font-size:20px;letter-spacing:2px;color:#fff;margin-bottom:8px">CHAPITRE 2 REQUIS</div><div style="font-size:13px;color:rgba(255,255,255,0.6);line-height:1.6;margin-bottom:20px">Joue le Chapitre 2 « Au Boulot » du Mode Histoire pour débloquer Tower et Pointeau.</div><button onclick="window.location.href=\'histoire.html\'" style="width:100%;height:46px;border:none;border-radius:12px;background:linear-gradient(135deg,#0ea5e9,#1d4ed8);color:#fff;font-family:\'Bebas Neue\',sans-serif;font-size:15px;letter-spacing:2px;cursor:pointer">▶ MODE HISTOIRE</button></div>';
      document.body.appendChild(o);
    }

    function showToast(msg) {
      let t = document.getElementById('toast');
      if (!t) { t = document.createElement('div'); t.id='toast'; t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:white;padding:10px 18px;border-radius:20px;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:opacity .3s;white-space:nowrap'; document.body.appendChild(t); }
      t.textContent = msg; t.style.opacity = '1';
      setTimeout(() => t.style.opacity = '0', 2800);
    }

    init();
  </script>

</body>
</html>
