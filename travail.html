<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Travail - Battle Dock</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }

    body {
      font-family:'Inter',sans-serif;
      min-height:100dvh;
      display:flex; flex-direction:column;
      overflow:hidden;
    }
    body.theme-day   { background:linear-gradient(135deg,#0ea5e9 0%,#0284c7 40%,#1d4ed8 100%); }
    body.theme-night { background:linear-gradient(135deg,#0c1a3a 0%,#0a1628 50%,#061020 100%); }

    /* DÉCO */
    .sun { position:fixed; top:24px; right:50px; z-index:1; width:56px; height:56px; border-radius:50%; pointer-events:none; animation:floatSun 6s ease-in-out infinite; }
    @keyframes floatSun { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }

    .cloud { position:fixed; z-index:1; animation:drift linear infinite; pointer-events:none; }
    .cloud { display:none; }
    @keyframes drift { 0%{transform:translateX(0)} 100%{transform:translateX(110vw)} }

    .star-dot { position:fixed; border-radius:50%; background:white; animation:starTwinkle ease-in-out infinite; pointer-events:none; }
    @keyframes starTwinkle { 0%,100%{opacity:0.9} 50%{opacity:0.2} }



    /* VAGUES */
    .waves-container {
      position:fixed; bottom:0; left:0; right:0; height:120px; z-index:1; pointer-events:none; overflow:hidden;
    }
    .waves-container svg { width:200%; height:100%; animation:wavesMove 4s linear infinite; }
    @keyframes wavesMove { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }

    /* BATEAU */
    .ship {
      position:fixed; right:20px; bottom:90px; font-size:56px; z-index:2;
      filter:drop-shadow(0 4px 12px rgba(0,0,0,0.4));
      animation:shipFloat 3s ease-in-out infinite;
      pointer-events:none;
    }
    @keyframes shipFloat { 0%,100%{transform:translateY(0) rotate(-1deg)} 50%{transform:translateY(-10px) rotate(1deg)} }

    /* MOUETTES */
    .seagull {
      position:fixed; font-size:20px; z-index:2; pointer-events:none;
      animation:seagullFly linear infinite;
      opacity:0.7;
    }
    @keyframes seagullFly { 0%{transform:translateX(-60px)} 100%{transform:translateX(110vw)} }

    /* DÉCO FOND */
    .bg-lines {
      position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
    }
    .bg-line {
      position:absolute; background:rgba(255,255,255,0.03);
    }
    .bg-line.h { left:0; right:0; height:1px; }
    .bg-line.v { top:0; bottom:0; width:1px; }
    .bg-glow-1 {
      position:fixed; top:-100px; left:-100px; width:400px; height:400px;
      background:radial-gradient(circle, rgba(59,130,246,0.08), transparent 70%);
      pointer-events:none; z-index:0;
    }
    .bg-glow-2 {
      position:fixed; bottom:-100px; right:-100px; width:500px; height:500px;
      background:radial-gradient(circle, rgba(204,34,0,0.06), transparent 70%);
      pointer-events:none; z-index:0;
    }
    .bg-glow-3 {
      position:fixed; top:40%; left:50%; transform:translate(-50%,-50%);
      width:600px; height:300px;
      background:radial-gradient(ellipse, rgba(255,255,255,0.02), transparent 70%);
      pointer-events:none; z-index:0;
    }

    /* HEADER */
    .header {
      position:relative; z-index:10; flex-shrink:0;
      padding:14px 16px; display:flex; align-items:center; gap:12px;
      backdrop-filter:blur(12px);
    }
    body.theme-day   .header { background:rgba(2,132,199,0.5); border-bottom:1px solid rgba(255,255,255,0.15); backdrop-filter:blur(12px); }
    body.theme-night .header { background:rgba(15,32,39,0.9); border-bottom:1px solid rgba(255,255,255,0.08); }
    .back-btn { background:#3b82f6; border:none; color:white; padding:8px 14px; border-radius:8px; cursor:pointer; font-family:'Bebas Neue',sans-serif; font-size:14px; letter-spacing:1px; }
    .header-title { font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:3px; flex:1; text-align:center; }
    body.theme-day   .header-title { color:white; }
    body.theme-night .header-title { color:white; }

    /* CONTENU */
    .content {
      position:relative; z-index:5;
      flex:1; display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      padding:20px 16px; gap:16px;
    }

    /* TITRE SECTION */
    .section-title {
      font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:3px;
      text-align:center; opacity:0.5;
    }
    body.theme-day   .section-title { color:rgba(255,255,255,0.6); }
    body.theme-night .section-title { color:white; }

    /* CARTE JEU */
    .game-card {
      width:100%; max-width:400px;
      border-radius:20px; overflow:hidden;
      cursor:pointer;
      box-shadow:0 12px 40px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.1);
      transition:transform 0.15s ease, box-shadow 0.15s ease;
      text-decoration:none;
    }
    .game-card:active { transform:scale(0.97); box-shadow:0 4px 16px rgba(0,0,0,0.2); }

    /* PREVIEW PORT */
    .preview-port {
      height:140px; position:relative; overflow:hidden;
    }
    body.theme-day   .preview-port { background:linear-gradient(180deg,#0f2027 0%,#1a3a4a 55%,#1a2a1a 55%,#0d1a0d 100%); }
    body.theme-night .preview-port { background:linear-gradient(180deg,#0f2027 0%,#203a43 55%,#1a2a1a 55%,#0d1a0d 100%); }

    .preview-sun {
      position:absolute; top:10px; right:16px;
      width:32px; height:32px; border-radius:50%;
      animation:floatSun 4s ease-in-out infinite;
    }
    body.theme-day   .preview-port .preview-sun { background:radial-gradient(circle at 35% 35%,#fef9c3,#fde68a); box-shadow:0 0 12px rgba(254,249,195,0.2); width:26px; height:26px; }
    body.theme-night .preview-port .preview-sun { background:radial-gradient(circle at 35% 35%,#fef9c3,#fde68a); box-shadow:0 0 12px rgba(254,249,195,0.2); width:26px; height:26px; }

    .preview-container {
      position:absolute; bottom:22px; left:50%; transform:translateX(-50%);
      width:90px; height:60px;
      background:linear-gradient(135deg,#cc2200,#991100);
      border-radius:6px; border:2px solid rgba(255,255,255,0.15);
      box-shadow:0 6px 20px rgba(0,0,0,0.5), 0 0 20px rgba(204,34,0,0.25);
      animation:containerBob 2s ease-in-out infinite;
      display:flex; align-items:center; justify-content:center; overflow:hidden;
    }
    @keyframes containerBob { 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(-8px)} }
    .preview-container-stripe { position:absolute; top:0; bottom:0; width:2px; background:rgba(0,0,0,0.25); }
    .preview-container-text { font-family:'Bebas Neue',sans-serif; font-size:11px; color:rgba(255,255,255,0.8); letter-spacing:2px; position:relative; z-index:1; }

    /* PREVIEW TOWER */
    .preview-tower {
      height:140px; position:relative; overflow:hidden;
      background:#1a1a1a;
    }
    .preview-tower-bg {
      position:absolute; inset:0;
      background:
        linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px),
        linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px);
      background-size:30px 30px;
    }
    .preview-lamp { position:absolute; top:0; }
    .preview-lamp-body { width:20px; height:10px; background:#2a2a2a; border-radius:2px; margin:0 auto; }
    .preview-lamp-glow { width:0; height:0; border-left:28px solid transparent; border-right:28px solid transparent; border-top:40px solid rgba(255,220,80,0.06); margin:0 auto; }
    .preview-stack { position:absolute; bottom:15px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column-reverse; align-items:center; gap:2px; }
    .preview-block { height:14px; border-radius:2px; border:1px solid rgba(255,255,255,0.15); display:flex; align-items:center; justify-content:center; font-size:7px; }

    /* INFO CARTE */
    .card-info {
      padding:14px 18px; display:flex; align-items:center; gap:14px;
      background:rgba(255,255,255,0.95);
    }
    .card-icon { font-size:30px; flex-shrink:0; }
    .card-text { flex:1; }
    .card-title { font-family:'Bebas Neue',sans-serif; font-size:19px; letter-spacing:1.5px; color:#1a1a1a; }
    .card-desc  { font-size:11px; color:#9ca3af; margin-top:2px; line-height:1.4; }
    .card-badge { font-size:9px; font-weight:700; padding:3px 10px; border-radius:20px; flex-shrink:0; }
    .badge-green  { background:rgba(22,163,74,0.1);  color:#16a34a; }
    .badge-purple { background:rgba(124,58,237,0.1); color:#7c3aed; }
    .badge-lock   { background:rgba(107,114,128,0.1); color:#6b7280; }
  </style>
</head>
<body class="theme-day">

  <div class="bg-lines">
    <div class="bg-line h" style="top:20%"></div>
    <div class="bg-line h" style="top:40%"></div>
    <div class="bg-line h" style="top:60%"></div>
    <div class="bg-line h" style="top:80%"></div>
    <div class="bg-line v" style="left:25%"></div>
    <div class="bg-line v" style="left:50%"></div>
    <div class="bg-line v" style="left:75%"></div>
  </div>
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>
  <div class="bg-glow-3"></div>
  <div class="waves-container">
    <svg viewBox="0 0 1440 120" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,60 C240,100 480,20 720,60 C960,100 1200,20 1440,60 L1440,120 L0,120 Z" fill="rgba(0,0,0,0.2)"/>
      <path d="M0,80 C360,40 720,110 1080,70 C1260,50 1350,90 1440,80 L1440,120 L0,120 Z" fill="rgba(0,0,0,0.15)"/>
    </svg>
  </div>

  <div class="header">
    <button class="back-btn" onclick="window.location.href='game.html'">← RETOUR</button>
    <div class="header-title">⚓ Travail</div>
    <div style="width:80px"></div>
  </div>

  <div class="content">
    <div class="section-title">CHOISIR UNE ACTIVITÉ</div>

    <!-- PORT -->
    <div class="game-card" onclick="window.location.href='clicker.html'">
      <div class="preview-port" style="position:relative;height:160px;overflow:hidden;background:linear-gradient(180deg,#0ea5e9 0%,#0284c7 45%,#d4a574 45%,#8b7355 100%);">
        <!-- Ciel -->
        <div style="position:absolute;top:8px;right:16px;width:36px;height:36px;border-radius:50%;background:radial-gradient(circle,#fde68a,#fbbf24);box-shadow:0 0 20px rgba(251,191,36,0.6);animation:containerBob 4s ease-in-out infinite"></div>
        <!-- Nuages -->
        <div style="position:absolute;top:14px;left:12px;font-size:22px;opacity:0.8;animation:containerBob 5s ease-in-out infinite;animation-delay:-2s">☁️</div>
        <!-- Grue -->
        <div style="position:absolute;right:28px;top:20px;font-size:28px;opacity:0.7">🏗️</div>
        <!-- Eau -->
        <div style="position:absolute;bottom:28px;left:0;right:0;height:14px;background:rgba(2,132,199,0.4);border-radius:50% 50% 0 0"></div>
        <!-- Conteneur principal animé -->
        <div style="position:absolute;bottom:28px;left:50%;transform:translateX(-50%);width:110px;height:72px;background:linear-gradient(135deg,#cc2200,#991100);border-radius:7px;border:2px solid rgba(255,255,255,0.2);box-shadow:0 6px 24px rgba(0,0,0,0.5),0 0 20px rgba(204,34,0,0.3);animation:containerBob 2s ease-in-out infinite;display:flex;align-items:center;justify-content:center;overflow:hidden;">
          <div style="position:absolute;top:0;bottom:0;width:2px;background:rgba(0,0,0,0.25);left:25px"></div>
          <div style="position:absolute;top:0;bottom:0;width:2px;background:rgba(0,0,0,0.25);left:52px"></div>
          <div style="position:absolute;top:0;bottom:0;width:2px;background:rgba(0,0,0,0.25);left:79px"></div>
          <div style="position:absolute;top:0;left:0;right:0;height:5px;background:rgba(255,255,255,0.15)"></div>
          <span style="font-family:'Bebas Neue',sans-serif;font-size:13px;color:rgba(255,255,255,0.9);letter-spacing:2px;position:relative;z-index:1">CLIQUER</span>
        </div>
      </div>
      <div class="card-info" style="background:white;padding:16px 18px;display:flex;align-items:center;gap:14px">
        <div style="width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#0ea5e9,#1d4ed8);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;box-shadow:0 4px 12px rgba(14,165,233,0.3)">📦</div>
        <div style="flex:1">
          <div style="font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:1.5px;color:#1a1a1a">Port Maritime</div>
          <div style="font-size:11px;color:#9ca3af;margin-top:2px">Clique · Gagne de l'argent · Monte en niveau</div>
        </div>
        <div style="background:rgba(22,163,74,0.1);color:#16a34a;font-size:9px;font-weight:700;padding:4px 10px;border-radius:20px;flex-shrink:0">ACTIF</div>
      </div>
    </div>

    <!-- TOWER -->
    <div class="game-card" id="towerCard" onclick="window.location.href='tower.html'">
      <div class="preview-tower">
        <div class="preview-tower-bg"></div>
        <!-- Mur briques -->
        <div style="position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 14px,rgba(255,255,255,0.02) 14px,rgba(255,255,255,0.02) 15px),repeating-linear-gradient(90deg,transparent,transparent 29px,rgba(255,255,255,0.015) 29px,rgba(255,255,255,0.015) 30px)"></div>
        <!-- Poutres -->
        <div style="position:absolute;top:0;left:0;right:0;height:6px;background:#222;border-bottom:1px solid #333"></div>
        <div style="position:absolute;top:0;bottom:0;left:24%;width:4px;background:linear-gradient(90deg,#1e1e1e,#2a2a2a,#1e1e1e)"></div>
        <div style="position:absolute;top:0;bottom:0;right:24%;width:4px;background:linear-gradient(90deg,#1e1e1e,#2a2a2a,#1e1e1e)"></div>
        <!-- Lampes -->
        <div class="preview-lamp" style="left:22%"><div class="preview-lamp-body"></div><div class="preview-lamp-glow"></div></div>
        <div class="preview-lamp" style="left:68%"><div class="preview-lamp-body"></div><div class="preview-lamp-glow"></div></div>
        <!-- Sol danger -->
        <div style="position:absolute;bottom:0;left:0;right:0;height:8px;background:repeating-linear-gradient(90deg,#f59e0b,#f59e0b 10px,#1a1a1a 10px,#1a1a1a 20px);opacity:0.5"></div>
        <div class="preview-stack" id="previewStack"></div>
      </div>
      <div style="background:white;padding:16px 18px;display:flex;align-items:center;gap:14px" id="towerCardInfo">
        <div style="width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#f59e0b,#d97706);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;box-shadow:0 4px 12px rgba(245,158,11,0.3)">🏗️</div>
        <div style="flex:1">
          <div style="font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:1.5px;color:#1a1a1a">Tower of Containers</div>
          <div style="font-size:11px;color:#9ca3af;margin-top:2px" id="towerDesc">Empile les conteneurs · Entrepôt du port</div>
        </div>
        <div style="background:rgba(124,58,237,0.1);color:#7c3aed;font-size:9px;font-weight:700;padding:4px 10px;border-radius:20px;flex-shrink:0" id="towerBadge">NOUVEAU</div>
      </div>
    </div>

  </div>

  <script>
    const SB_URL = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const sb = createClient(SB_URL, SB_KEY);



    // Mini tower preview
    const colors=['#cc2200','#1d4ed8','#15803d','#b45309','#7c3aed'];
    const widths=[80,68,58,50,44,38,32];
    const stack=document.getElementById('previewStack');
    widths.forEach((w,i)=>{
      const b=document.createElement('div');
      b.className='preview-block';
      b.style.cssText=`width:${w}px;background:${colors[i%colors.length]};animation:containerBob ${2+i*0.4}s ease-in-out infinite;animation-delay:${i*0.15}s`;
      stack.appendChild(b);
    });

    // Vérifier niveau pour Tower
    async function init(){
      const {data:{session}} = await sb.auth.getSession();
      if(!session) return;
      const {data} = await sb.from('game_stats').select('level').eq('user_id',session.user.id).maybeSingle();
      const level=data?.level||1;
      if(level<10){
        document.getElementById('towerCard').onclick=null;
        document.getElementById('towerCard').style.opacity='0.6';
        document.getElementById('towerDesc').textContent=`Débloqué au niveau 10 (tu es niveau ${level})`;
        document.getElementById('towerBadge').textContent='🔒 Niv. 10';
        document.getElementById('towerBadge').className='card-badge badge-lock';
      }
    }
    init();
  </script>
</body>
</html>
