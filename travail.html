<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Travail - Battle Dock</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }

    body {
      font-family:'Inter',sans-serif;
      background:#0a1628;
      min-height:100dvh;
      display:flex; flex-direction:column;
      overflow:hidden;
    }

    /* FOND */
    body::before {
      content:'';
      position:fixed; inset:0; z-index:0;
      background:
        linear-gradient(180deg,#0ea5e9 0%,#0284c7 40%,#1d4ed8 100%);
      pointer-events:none;
    }

    /* VAGUES */
    .waves-wrap { position:fixed; bottom:0; left:0; right:0; height:120px; z-index:1; pointer-events:none; overflow:hidden; }
    .waves-wrap svg { width:200%; height:100%; animation:waveMove 5s linear infinite; }
    @keyframes sunFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }

    /* HEADER — style shop */
    .header {
      position:relative; z-index:10;
      background:rgba(2,100,180,0.6);
      backdrop-filter:blur(12px);
      border-bottom:1px solid rgba(255,255,255,0.15);
      padding:14px 16px;
      display:flex; align-items:center; gap:12px;
    }
    .back-btn {
      background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2);
      border-radius:8px; padding:8px 12px;
      font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:1px;
      color:rgba(255,255,255,0.85); cursor:pointer; transition:background 0.2s;
    }
    .back-btn:active { background:rgba(255,255,255,0.2); }
    .header-title { font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:3px; color:white; flex:1; text-shadow:0 1px 4px rgba(0,0,0,0.2); }
    .header-anchor { font-size:22px; filter:drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }

    /* HERO */
    .hero {
      position:relative; z-index:2;
      padding:20px 20px 16px; text-align:center;
      border-bottom:1px solid rgba(255,255,255,0.1);
    }
    .hero-title { font-family:'Bebas Neue',sans-serif; font-size:28px; letter-spacing:4px; color:white; text-shadow:0 0 20px rgba(255,255,255,0.2); }
    .hero-sub { font-size:11px; color:rgba(255,255,255,0.55); letter-spacing:2px; margin-top:4px; text-transform:uppercase; }

    /* CONTENU */
    .content {
      position:relative; z-index:2;
      flex:1; display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      padding:20px 16px 100px; gap:16px;
    }

    /* CARTE */
    .game-card {
      width:100%; max-width:400px;
      border-radius:18px; overflow:hidden;
      cursor:pointer;
      box-shadow:0 12px 40px rgba(0,0,0,0.35);
      transition:transform 0.15s ease, box-shadow 0.15s ease;
    }
    .game-card:active { transform:scale(0.97); box-shadow:0 4px 16px rgba(0,0,0,0.3); }

    /* PREVIEW CLICKER */
    .preview-clicker {
      height:150px; position:relative; overflow:hidden;
      background:linear-gradient(180deg,#87ceeb 0%,#b8e4f7 55%,#c8a882 55%,#8b7355 100%);
    }
    .pc-sun { position:absolute; top:12px; right:18px; width:38px; height:38px; border-radius:50%; background:radial-gradient(circle,#fde68a,#fbbf24); box-shadow:0 0 20px rgba(251,191,36,0.6); animation:pcFloat 4s ease-in-out infinite; }
    .pc-cloud { position:absolute; top:16px; left:14px; font-size:24px; opacity:0.8; animation:pcFloat 5s ease-in-out infinite; animation-delay:-2s; }
    .pc-grue { position:absolute; right:20px; top:18px; font-size:30px; opacity:0.6; }
    .pc-container {
      position:absolute; bottom:24px; left:50%; transform:translateX(-50%);
      width:100px; height:66px;
      background:linear-gradient(135deg,#cc2200,#991100);
      border-radius:6px; border:2px solid rgba(255,255,255,0.2);
      box-shadow:0 6px 20px rgba(0,0,0,0.5), 0 0 16px rgba(204,34,0,0.3);
      overflow:hidden; display:flex; align-items:center; justify-content:center;
      animation:pcFloat 2.5s ease-in-out infinite;
    }
    .pc-stripe { position:absolute; top:0; bottom:0; width:2px; background:rgba(0,0,0,0.25); }
    .pc-label { font-family:'Bebas Neue',sans-serif; font-size:12px; color:rgba(255,255,255,0.85); letter-spacing:2px; position:relative; z-index:1; }
    @keyframes pcFloat { 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(-7px)} }

    /* PREVIEW TOWER */
    .preview-tower {
      height:150px; position:relative; overflow:hidden;
      background:#111;
    }
    .pt-bg {
      position:absolute; inset:0;
      background:
        repeating-linear-gradient(0deg,transparent,transparent 14px,rgba(255,255,255,0.02) 14px,rgba(255,255,255,0.02) 15px),
        repeating-linear-gradient(90deg,transparent,transparent 29px,rgba(255,255,255,0.015) 29px,rgba(255,255,255,0.015) 30px);
    }
    .pt-beam-h { position:absolute; top:0; left:0; right:0; height:8px; background:linear-gradient(180deg,#1e1e1e,#2a2a2a); border-bottom:1px solid #333; }
    .pt-beam-v { position:absolute; top:0; bottom:0; width:6px; background:linear-gradient(90deg,#1a1a1a,#2a2a2a,#1a1a1a); }
    .pt-lamp { position:absolute; top:0; display:flex; flex-direction:column; align-items:center; }
    .pt-lamp-body { width:18px; height:10px; background:#222; border-radius:2px; border:1px solid #333; }
    .pt-lamp-cone { width:0; height:0; border-left:30px solid transparent; border-right:30px solid transparent; border-top:45px solid rgba(255,215,60,0.07); }
    .pt-floor { position:absolute; bottom:0; left:0; right:0; height:12px; background:#222; border-top:2px solid #2d2d2d; }
    .pt-danger { position:absolute; bottom:0; left:0; right:0; height:8px; background:repeating-linear-gradient(90deg,#f59e0b,#f59e0b 14px,#111 14px,#111 28px); opacity:0.45; }
    .pt-stack { position:absolute; bottom:12px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column-reverse; align-items:center; gap:2px; }
    .pt-block { height:14px; border-radius:2px; border:1px solid rgba(255,255,255,0.15); }

    /* INFO BAS DE CARTE */
    .card-info { background:white; padding:14px 16px; display:flex; align-items:center; gap:12px; }
    .card-icon-wrap { width:42px; height:42px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
    .card-icon-blue { background:linear-gradient(135deg,#0ea5e9,#1d4ed8); box-shadow:0 4px 12px rgba(14,165,233,0.3); }
    .card-icon-amber { background:linear-gradient(135deg,#f59e0b,#d97706); box-shadow:0 4px 12px rgba(245,158,11,0.3); }
    .card-title { font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:1.5px; color:#1a1a1a; }
    .card-desc  { font-size:11px; color:#9ca3af; margin-top:1px; }
    .card-badge { font-size:9px; font-weight:700; padding:3px 10px; border-radius:20px; flex-shrink:0; }
    .badge-green  { background:rgba(22,163,74,0.1);  color:#16a34a; }
    .badge-purple { background:rgba(124,58,237,0.1); color:#7c3aed; }
    .badge-lock   { background:rgba(107,114,128,0.1); color:#6b7280; }
  </style>
</head>
<body>

  <!-- VAGUES -->
  <div class="waves-wrap">
    <svg viewBox="0 0 1440 120" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,60 C240,100 480,20 720,60 C960,100 1200,20 1440,60 L1440,120 L0,120 Z" fill="rgba(0,0,0,0.15)"/>
      <path d="M0,80 C360,40 720,110 1080,70 C1260,50 1350,90 1440,80 L1440,120 L0,120 Z" fill="rgba(0,0,0,0.1)"/>
    </svg>
  </div>

  <!-- HEADER -->
  <div class="header">
    <button class="back-btn" onclick="window.location.href='game.html'">← RETOUR</button>
    <div class="header-title">⚓ Travail</div>
    <div class="header-anchor">🚢</div>
  </div>

  <!-- HERO -->
  <div class="hero">
    <div class="hero-title">Choisir une activité</div>
    <div class="hero-sub">Port de Marseille · Battle Dock</div>
  </div>

  <div class="content">

    <!-- PORT -->
    <div class="game-card" onclick="window.location.href='clicker.html'">
      <!-- ILLUSTRATION PORT -->
      <div style="height:200px;position:relative;overflow:hidden;background:linear-gradient(180deg,#0ea5e9 0%,#38bdf8 40%,#7dd3fc 55%,#2563eb 55%,#1d4ed8 100%)">
        <!-- CIEL dégradé -->
        <!-- Soleil -->
        <div style="position:absolute;top:16px;right:24px;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle,#fef08a,#fbbf24);box-shadow:0 0 30px rgba(251,191,36,0.7);animation:sunFloat 4s ease-in-out infinite"></div>
        <!-- Nuage 1 -->
        <div style="position:absolute;top:18px;left:16px">
          <div style="background:white;opacity:0.9;border-radius:50px;width:60px;height:20px;position:relative">
            <div style="background:white;opacity:0.9;border-radius:50%;width:28px;height:28px;position:absolute;top:-14px;left:8px"></div>
            <div style="background:white;opacity:0.9;border-radius:50%;width:20px;height:20px;position:absolute;top:-10px;left:28px"></div>
          </div>
        </div>
        <!-- Nuage 2 -->
        <div style="position:absolute;top:28px;left:50%">
          <div style="background:white;opacity:0.7;border-radius:50px;width:44px;height:14px;position:relative">
            <div style="background:white;opacity:0.7;border-radius:50%;width:20px;height:20px;position:absolute;top:-10px;left:6px"></div>
          </div>
        </div>
        <!-- MER -->
        <!-- Vague -->
        <div style="position:absolute;top:calc(55% - 6px);left:0;right:0;height:12px;background:rgba(255,255,255,0.15);border-radius:50%"></div>
        <!-- QUAI -->
        <div style="position:absolute;bottom:0;left:0;right:0;height:55%;background:linear-gradient(180deg,#1e3a8a,#1d4ed8)">
          <!-- Sol quai béton -->
          <div style="position:absolute;bottom:0;left:0;right:0;height:22px;background:#374151;border-top:3px solid #4b5563"></div>
          <!-- Grue à gauche -->
          <div style="position:absolute;left:14px;bottom:22px">
            <div style="width:6px;height:60px;background:#6b7280;margin:0 auto"></div>
            <div style="width:50px;height:5px;background:#6b7280;position:absolute;top:0;left:0"></div>
            <div style="width:2px;height:28px;background:#9ca3af;position:absolute;top:5px;left:48px"></div>
          </div>
          <!-- CONTENEUR PRINCIPAL -->
          <div style="position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:110px;height:70px;background:linear-gradient(135deg,#cc2200,#991100);border-radius:6px;border:2px solid rgba(255,255,255,0.2);box-shadow:0 -4px 20px rgba(0,0,0,0.5),0 0 20px rgba(204,34,0,0.4)">
            <div style="position:absolute;top:0;bottom:0;width:2px;background:rgba(0,0,0,0.3);left:25px"></div>
            <div style="position:absolute;top:0;bottom:0;width:2px;background:rgba(0,0,0,0.3);left:52px"></div>
            <div style="position:absolute;top:0;bottom:0;width:2px;background:rgba(0,0,0,0.3);left:79px"></div>
            <div style="position:absolute;top:0;left:0;right:0;height:5px;background:rgba(255,255,255,0.2);border-radius:4px 4px 0 0"></div>
            <div style="position:absolute;bottom:0;left:0;right:0;height:5px;background:rgba(0,0,0,0.2)"></div>
            
          </div>
          <!-- Conteneur petit à droite -->
          <div style="position:absolute;bottom:22px;right:16px;width:52px;height:36px;background:linear-gradient(135deg,#1d4ed8,#1e3a8a);border-radius:3px;border:1px solid rgba(255,255,255,0.15)">
            <div style="position:absolute;top:0;bottom:0;width:1px;background:rgba(0,0,0,0.3);left:18px"></div>
            <div style="position:absolute;top:0;bottom:0;width:1px;background:rgba(0,0,0,0.3);left:34px"></div>
          </div>
        </div>
        <!-- Reflet eau -->
        
      </div>
      <!-- INFO -->
      <div style="background:white;padding:16px 18px;display:flex;align-items:center;gap:14px">
        <div style="flex:1">
          <div style="font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;color:#1a1a1a">Port Maritime</div>
          <div style="font-size:11px;color:#9ca3af;margin-top:2px">Clique · Gagne de l'argent · XP</div>
        </div>
        <button style="background:linear-gradient(135deg,#0ea5e9,#1d4ed8);border:none;color:white;font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:1.5px;padding:10px 20px;border-radius:10px;cursor:pointer;box-shadow:0 4px 12px rgba(14,165,233,0.4)">JOUER →</button>
      </div>
    </div>

    <!-- TOWER -->
    <div class="game-card" id="towerCard" onclick="window.location.href='tower.html'">
      <!-- ILLUSTRATION ENTREPÔT -->
      <div style="height:200px;position:relative;overflow:hidden;background:#0d0d0d">
        <!-- Mur briques -->
        <div style="position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 18px,rgba(255,255,255,0.025) 18px,rgba(255,255,255,0.025) 19px),repeating-linear-gradient(90deg,transparent,transparent 38px,rgba(255,255,255,0.02) 38px,rgba(255,255,255,0.02) 40px)"></div>
        <!-- Plafond + poutres -->
        <div style="position:absolute;top:0;left:0;right:0;height:10px;background:#1a1a1a;border-bottom:2px solid #2d2d2d"></div>
        <div style="position:absolute;top:10px;left:0;right:0;height:8px;background:linear-gradient(180deg,#222,#1a1a1a);border-bottom:1px solid #333"></div>
        <!-- Poutres verticales -->
        <div style="position:absolute;top:0;bottom:0;left:0;width:8px;background:linear-gradient(90deg,#111,#222,#111)"></div>
        <div style="position:absolute;top:0;bottom:0;right:0;width:8px;background:linear-gradient(90deg,#111,#222,#111)"></div>
        <div style="position:absolute;top:0;bottom:0;left:25%;width:6px;background:linear-gradient(90deg,#1a1a1a,#252525,#1a1a1a)"></div>
        <div style="position:absolute;top:0;bottom:0;right:25%;width:6px;background:linear-gradient(90deg,#1a1a1a,#252525,#1a1a1a)"></div>
        <!-- Lampes -->
        <div style="position:absolute;top:8px;left:calc(12% - 10px);display:flex;flex-direction:column;align-items:center">
          <div style="width:20px;height:12px;background:#2a2a2a;border-radius:2px;border:1px solid #3a3a3a"></div>
          <div style="width:0;height:0;border-left:36px solid transparent;border-right:36px solid transparent;border-top:56px solid rgba(255,215,60,0.07)"></div>
        </div>
        <div style="position:absolute;top:8px;left:calc(50% - 10px);display:flex;flex-direction:column;align-items:center">
          <div style="width:20px;height:12px;background:#2a2a2a;border-radius:2px;border:1px solid #3a3a3a"></div>
          <div style="width:0;height:0;border-left:36px solid transparent;border-right:36px solid transparent;border-top:56px solid rgba(255,215,60,0.08)"></div>
        </div>
        <div style="position:absolute;top:8px;left:calc(88% - 10px);display:flex;flex-direction:column;align-items:center">
          <div style="width:20px;height:12px;background:#2a2a2a;border-radius:2px;border:1px solid #3a3a3a"></div>
          <div style="width:0;height:0;border-left:36px solid transparent;border-right:36px solid transparent;border-top:56px solid rgba(255,215,60,0.07)"></div>
        </div>
        <!-- TOUR DE CONTENEURS centrée -->
        <div style="position:absolute;bottom:24px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column-reverse;align-items:center;gap:2px">
          <div style="width:120px;height:20px;background:#cc2200;border-radius:3px;border:1px solid rgba(255,255,255,0.15);box-shadow:0 0 12px rgba(204,34,0,0.3);display:flex;align-items:center;justify-content:center;font-size:8px;color:rgba(255,255,255,0.5);font-family:'Bebas Neue',sans-serif;letter-spacing:1px">MAERSK</div>
          <div style="width:108px;height:20px;background:#1d4ed8;border-radius:3px;border:1px solid rgba(255,255,255,0.15);box-shadow:0 0 12px rgba(29,78,216,0.2);display:flex;align-items:center;justify-content:center;font-size:8px;color:rgba(255,255,255,0.5);font-family:'Bebas Neue',sans-serif;letter-spacing:1px">MSC</div>
          <div style="width:94px;height:20px;background:#15803d;border-radius:3px;border:1px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;font-size:8px;color:rgba(255,255,255,0.5);font-family:'Bebas Neue',sans-serif;letter-spacing:1px">CMA CGM</div>
          <div style="width:80px;height:20px;background:#b45309;border-radius:3px;border:1px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;font-size:8px;color:rgba(255,255,255,0.5);font-family:'Bebas Neue',sans-serif;letter-spacing:1px">HAPAG</div>
          <div style="width:64px;height:20px;background:#7c3aed;border-radius:3px;border:1px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;font-size:8px;color:rgba(255,255,255,0.5);font-family:'Bebas Neue',sans-serif;letter-spacing:1px">COSCO</div>
        </div>
        <!-- Sol danger -->
        <div style="position:absolute;bottom:0;left:0;right:0;height:24px;background:#1a1a1a;border-top:2px solid #2d2d2d"></div>
        <div style="position:absolute;bottom:0;left:0;right:0;height:10px;background:repeating-linear-gradient(90deg,#f59e0b,#f59e0b 16px,#1a1a1a 16px,#1a1a1a 32px);opacity:0.5"></div>
      </div>
      <!-- INFO -->
      <div style="background:white;padding:16px 18px;display:flex;align-items:center;gap:14px" id="towerInfo">
        <div style="flex:1">
          <div style="font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;color:#1a1a1a">Tower of Containers</div>
          <div style="font-size:11px;color:#9ca3af;margin-top:2px" id="towerDesc">Empile · Entrepôt du port · Niv.10</div>
        </div>
        <button id="towerBtn" style="background:linear-gradient(135deg,#f59e0b,#d97706);border:none;color:white;font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:1.5px;padding:10px 20px;border-radius:10px;cursor:pointer;box-shadow:0 4px 12px rgba(245,158,11,0.4)">JOUER →</button>
      </div>
    </div>
  </div>

  <script>  <script>
    const SB_URL = 'https://drtsuhnbclhmgfjiykap.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydHN1aG5iY2xobWdmaml5a2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDIzODksImV4cCI6MjA5NDQxODM4OX0.68cvRa8xhrSDt2nnEEp7pagL7NT5ugRtOhKLGX2CQJg';
    const { createClient } = supabase;
    const sb = createClient(SB_URL, SB_KEY);

    // Mini tour animée
    const colors = ['#cc2200','#1d4ed8','#15803d','#b45309','#7c3aed'];
    const widths = [80,68,58,50,42,36];
    const stack = document.getElementById('ptStack');
    widths.forEach((w,i) => {
      const b = document.createElement('div');
      b.className = 'pt-block';
      b.style.cssText = `width:${w}px;background:${colors[i%colors.length]};animation:pcFloat ${2+i*0.35}s ease-in-out infinite;animation-delay:${i*0.12}s`;
      stack.appendChild(b);
    });

    // Vérifier niveau pour Tower
    async function init() {
      const { data:{ session } } = await sb.auth.getSession();
      if (!session) { window.location.href = 'index.html'; return; }
      const { data } = await sb.from('game_stats').select('level').eq('user_id', session.user.id).maybeSingle();
      const level = data?.level || 1;
      if (level < 10) {
        document.getElementById('towerCard').onclick = null;
        document.getElementById('towerCard').style.opacity = '0.55';
        document.getElementById('towerDesc').textContent = `Débloqué au niveau 10 (tu es niveau ${level})`;
        const btn = document.getElementById('towerBtn');
        if (btn) { btn.textContent = '🔒 NIV.10'; btn.style.background = '#9ca3af'; btn.style.boxShadow = 'none'; }
      }
    }
    init();
  </script>
</body>
</html>
